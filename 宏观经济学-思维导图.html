（含后来的诺奖得主托宾与索洛）把凯恩斯思想付诸实践，减税方案含投资税收抵免，兼顾短期总需求与长期总供给，1964年实施后促成高速增长时期；2009年奥巴马面对衰退，第一个政策建议也是包括大幅增加政府支出的经济刺激提案。","label":"案例研究「白宫的凯恩斯主义者」"}],"k":"b","i":1,"h":"34.3.1 支持积极稳定政策论","label":"34.3.1 支持积极稳定政策论"},{"t":"34.3.2 反对积极稳定政策论","c":[{"t":"主要论点是政策对经济的影响有相当长的时滞：货币政策通过利率影响投资，而企业提前做投资计划，对产量就业产生大影响至少需6个月，且影响持续数年；财政政策的时滞主要来自政治程序（国会立法与总统签字可能需数月甚至数年）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">主要论点是政策对经济的影响有相当长的时滞</strong>：货币政策通过利率影响投资，而企业提前做投资计划，对产量就业产生大影响至少需6个月，且影响持续数年；财政政策的时滞主要来自政治程序（国会立法与总统签字可能需数月甚至数年）。","label":"主要论点是政策对经济的影响有相当长的时滞"},{"t":"时滞之所以成问题，还因为经济预测极不准确，衰退和萧条往往在没有预兆的情况下来临；批评者认为美联储通常反应太迟，结果引起而非抑制了波动，主张消极的货币政策（如缓慢且稳定的货币供给增长）。","c":[],"k":"b","i":2,"h":"时滞之所以成问题，还因为经济预测极不准确，衰退和萧条往往在没有预兆的情况下来临；批评者认为美联储通常反应太迟，结果引起而非抑制了波动，主张消极的货币政策（如缓慢且稳定的货币供给增长）。","label":"时滞之所以成问题，还因为经济预测极不…"}],"k":"b","i":1,"h":"34.3.2 反对积极稳定政策论","label":"34.3.2 反对积极稳定政策论"},{"t":"34.3.3 自动稳定器","c":[{"t":"自动稳定器（automatic stabilizers）：当经济进入衰退时，决策者不必采取任何有意的行动就可以刺激总需求的财政政策变动；所有经济学家都认同政策时滞使有意政策作为短期稳定工具作用不大，自动稳定器正是避免时滞的方法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自动稳定器</strong>（automatic stabilizers）：当经济进入衰退时，决策者不必采取任何有意的行动就可以刺激总需求的财政政策变动；所有经济学家都认同政策时滞使有意政策作为短期稳定工具作用不大，自动稳定器正是避免时滞的方法。","label":"自动稳定器"},{"t":"最重要的自动稳定器是税制：几乎所有税收都与经济活动密切相关（个人所得税取决于收入、工薪税取决于工资、公司所得税取决于利润），衰退中税收自动减少，这种自动减税刺激总需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最重要的自动稳定器是税制</strong>：几乎所有税收都与经济活动密切相关（个人所得税取决于收入、工薪税取决于工资、公司所得税取决于利润），衰退中税收自动减少，这种自动减税刺激总需求。","label":"最重要的自动稳定器是税制"},{"t":"政府支出也作为自动稳定器：衰退中工人被解雇，更多人申请失业保险、福利等收入补助，政府支出自动增加，正好在总需求不足时予以刺激（20世纪30年代建立失业保险制度的部分原因即在于此）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政府支出也作为自动稳定器</strong>：衰退中工人被解雇，更多人申请失业保险、福利等收入补助，政府支出自动增加，正好在总需求不足时予以刺激（20世纪30年代建立失业保险制度的部分原因即在于此）。","label":"政府支出也作为自动稳定器"},{"t":"自动稳定器不足以完全防止衰退，但没有它们产量和就业的波动会更大；因此许多经济学家反对要求联邦政府总是平衡预算的宪法修正案——严格的平衡预算规则会迫使政府在衰退中增税或减支，消除自动稳定器的作用。","c":[],"k":"b","i":2,"h":"自动稳定器不足以完全防止衰退，但没有它们产量和就业的波动会更大；因此许多经济学家反对要求联邦政府总是平衡预算的宪法修正案——严格的平衡预算规则会迫使政府在衰退中增税或减支，消除自动稳定器的作用。","label":"自动稳定器不足以完全防止衰退，但没有…"}],"k":"b","i":1,"h":"34.3.3 自动稳定器","label":"34.3.3 自动稳定器"}],"k":"sec","i":0,"h":"34.3 运用政策来稳定经济","label":"34.3 运用政策来稳定经济"},{"t":"34.4 结论","c":[{"t":"决策者做任何政策变动前都需考虑决策的所有影响：国会在削减支出平衡预算时要同时考虑对储蓄与增长的长期效应和对总需求与就业的短期效应；美联储在降低货币供给增长率时要同时考虑对通货膨胀的长期效应和对生产的短期效应——各部门决策者都要记住长期目标和短期目标。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">决策者做任何政策变动前都需考虑决策的所有影响</strong>：国会在削减支出平衡预算时要同时考虑对储蓄与增长的长期效应和对总需求与就业的短期效应；美联储在降低货币供给增长率时要同时考虑对通货膨胀的长期效应和对生产的短期效应——各部门决策者都要记住长期目标和短期目标。","label":"决策者做任何政策变动前都需考虑决策的所有影响"}],"k":"sec","i":0,"h":"34.4 结论","label":"34.4 结论"}],"k":"chap","h":"第34章 货币政策和财政政策对总需求的影响","label":"第34章 货币政策和财政政策对总需求…"},{"t":"第35章 通货膨胀与失业之间的短期权衡取舍","c":[{"t":"本章内容提要","c":[{"t":"菲利普斯曲线描述通货膨胀与失业之间的负相关关系：通过扩大总需求，决策者可以在曲线上选择较高通胀率和较低失业率的一点；通过紧缩总需求，可以选择较低通胀率和较高失业率的一点。","c":[],"k":"b","i":1,"h":"菲利普斯曲线描述通货膨胀与失业之间的负相关关系：通过扩大总需求，决策者可以在曲线上选择较高通胀率和较低失业率的一点；通过紧缩总需求，可以选择较低通胀率和较高失业率的一点。","label":"菲利普斯曲线描述通货膨胀与失业之间的负相关关系"},{"t":"这种权衡取舍只在短期中成立：长期中预期通货膨胀根据实际通货膨胀调整，短期菲利普斯曲线随之移动，因此长期菲利普斯曲线是通过自然失业率的一条垂线。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">这种权衡取舍只在短期中成立</strong>：长期中预期通货膨胀根据实际通货膨胀调整，短期菲利普斯曲线随之移动，因此长期菲利普斯曲线是通过自然失业率的一条垂线。","label":"这种权衡取舍只在短期中成立"},{"t":"短期菲利普斯曲线也会由于总供给冲击而移动：不利的供给冲击（如世界石油价格上升）使决策者面临较为不利的通胀-失业权衡取舍。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">短期菲利普斯曲线也会由于总供给冲击而移动</strong>：不利的供给冲击（如世界石油价格上升）使决策者面临较为不利的通胀-失业权衡取舍。","label":"短期菲利普斯曲线也会由于总供给冲击而移动"},{"t":"当美联储紧缩货币供给增长以降低通胀率时，经济沿短期菲利普斯曲线移动，引起暂时的高失业；反通货膨胀的代价取决于通胀预期下降的速度，可信的低通货膨胀承诺可以通过引起预期的迅速调整而降低代价。","c":[],"k":"b","i":1,"h":"当美联储紧缩货币供给增长以降低通胀率时，经济沿短期菲利普斯曲线移动，引起暂时的高失业；反通货膨胀的代价取决于通胀预期下降的速度，可信的低通货膨胀承诺可以通过引起预期的迅速调整而降低代价。","label":"当美联储紧缩货币供给增长以降低通胀率…"},{"t":"背景结论：长期中通货膨胀和失业基本是互不相关的问题——失业由劳动市场特点决定，通胀主要由中央银行控制的货币供给增长决定。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">背景结论</strong>：长期中通货膨胀和失业基本是互不相关的问题——失业由劳动市场特点决定，通胀主要由中央银行控制的货币供给增长决定。","label":"背景结论"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"35.1 菲利普斯曲线","c":[{"t":"背景：通胀率与失业率是受密切关注的两大经济状况指标，两者相加即痛苦指数，用于衡量经济状况是否正常。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">背景</strong>：通胀率与失业率是受密切关注的两大经济状况指标，两者相加即痛苦指数，用于衡量经济状况是否正常。","label":"背景：通胀率与失业率是受密切关注的两…"},{"t":"35.1.1 菲利普斯曲线的由来","c":[{"t":"菲利普斯曲线（Phillips curve）：一条表示通货膨胀与失业之间短期权衡取舍的曲线。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">菲利普斯曲线</strong>（Phillips curve）：一条表示通货膨胀与失业之间短期权衡取舍的曲线。","label":"菲利普斯曲线"},{"t":"1958年威廉·菲利普斯用英国1861—1957年数据发现失业率与通胀率的负相关关系（低失业年份往往高通胀，高失业年份往往低通胀）；随后萨缪尔森和索洛用美国数据证实了类似关系，并将失业与通货膨胀之间的负相关关系命名为菲利普斯曲线。","c":[],"k":"b","i":2,"h":"1958年威廉·菲利普斯用英国1861—1957年数据发现失业率与通胀率的负相关关系（低失业年份往往高通胀，高失业年份往往低通胀）；随后萨缪尔森和索洛用美国数据证实了类似关系，并将失业与通货膨胀之间的负相关关系命名为菲利普斯曲线。","label":"1958年威廉·菲利普斯用英国186…"},{"t":"推理：低失业与高总需求相关，很高的总需求会给整个经济带来工资与物价上升的压力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推理</strong>：低失业与高总需求相关，很高的总需求会给整个经济带来工资与物价上升的压力。","label":"推理：低失业与高总需求相关，很高的总…"},{"t":"政策含义：菲利普斯曲线向决策者提供了一个有各种可能经济结果的菜单——通过货币政策和财政政策影响总需求，可以在曲线上任选一点（A点高失业低通胀，B点低失业高通胀），但低通胀与低失业的组合不可能。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政策含义</strong>：菲利普斯曲线向决策者提供了一个有各种可能经济结果的菜单——通过货币政策和财政政策影响总需求，可以在曲线上任选一点（A点高失业低通胀，B点低失业高通胀），但低通胀与低失业的组合不可能。","label":"政策含义"}],"k":"b","i":1,"h":"35.1.1 菲利普斯曲线的由来","label":"35.1.1 菲利普斯曲线的由来"},{"t":"35.1.2 总需求、总供给和菲利普斯曲线","c":[{"t":"总需求与总供给模型为菲利普斯曲线提供了简单解释：短期中的通胀-失业组合来自总需求曲线的移动使经济沿着短期总供给曲线变动——总需求增加引起产量增加（就业多、失业低）和物价水平上升（通胀高）。","c":[],"k":"b","i":2,"h":"总需求与总供给模型为菲利普斯曲线提供了简单解释：短期中的通胀-失业组合来自总需求曲线的移动使经济沿着短期总供给曲线变动——总需求增加引起产量增加（就业多、失业低）和物价水平上升（通胀高）。","label":"总需求与总供给模型为菲利普斯曲线提供了简单解释"},{"t":"数例：设2020年物价水平为100，2021年总需求低时经济处于A点（产量15000、物价102、失业率7%、通胀2%），总需求高时处于B点（产量16000、物价106、失业率4%、通胀6%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数例</strong>：设2020年物价水平为100，2021年总需求低时经济处于A点（产量15000、物价102、失业率7%、通胀2%），总需求高时处于B点（产量16000、物价106、失业率4%、通胀6%）。","label":"数例：设2020年物价水平为100，…"},{"t":"由于货币政策和财政政策可以使总需求曲线移动，它们可以使经济沿着菲利普斯曲线移动：货币供给增加、政府支出增加或减税→低失业高通胀的点；紧缩→低通胀高失业的点。","c":[],"k":"b","i":2,"h":"由于货币政策和财政政策可以使总需求曲线移动，它们可以使经济沿着菲利普斯曲线移动：货币供给增加、政府支出增加或减税→低失业高通胀的点；紧缩→低通胀高失业的点。","label":"由于货币政策和财政政策可以使总需求曲…"},{"t":"即问即答要点：要使经济从曲线上高通胀的一点移到低通胀的一点，靠的是紧缩总需求（经济沿曲线移动）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：要使经济从曲线上高通胀的一点移到低通胀的一点，靠的是紧缩总需求（经济沿曲线移动）。","label":"即问即答要点"}],"k":"b","i":1,"h":"35.1.2 总需求、总供给和菲利普斯曲线","label":"35.1.2 总需求、总供给和菲利普…"}],"k":"sec","i":0,"h":"35.1 菲利普斯曲线","label":"35.1 菲利普斯曲线"},{"t":"35.2 菲利普斯曲线的移动：预期的作用","c":[{"t":"核心问题：通货膨胀-失业的菜单是否长期稳定？答案是预期通货膨胀的变动会使短期菲利普斯曲线移动。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">核心问题</strong>：通货膨胀-失业的菜单是否长期稳定？答案是预期通货膨胀的变动会使短期菲利普斯曲线移动。","label":"核心问题"},{"t":"35.2.1 长期菲利普斯曲线","c":[{"t":"1968年弗里德曼发表《货币政策的作用》，与费尔普斯几乎同时否定通胀与失业之间存在长期权衡取舍；弗里德曼强调：货币当局控制名义变量，但不能用对名义变量的控制去钉住真实变量（真实利率、失业率、真实国民收入等）。","c":[],"k":"b","i":2,"h":"1968年弗里德曼发表《货币政策的作用》，与费尔普斯几乎同时否定通胀与失业之间存在长期权衡取舍；弗里德曼强调：货币当局控制名义变量，但不能用对名义变量的控制去钉住真实变量（真实利率、失业率、真实国民收入等）。","label":"1968年弗里德曼发表《货币政策的作…"},{"t":"依据古典宏观经济学（货币中性）：货币增长只同比例改变物价与名义收入，不影响产量、就业等真实变量，也不影响决定失业率的因素（工会市场势力、效率工资、找工作过程）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">依据古典宏观经济学</strong>（货币中性）：货币增长只同比例改变物价与名义收入，不影响产量、就业等真实变量，也不影响决定失业率的因素（工会市场势力、效率工资、找工作过程）。","label":"依据古典宏观经济学"},{"t":"结论：长期菲利普斯曲线垂直——无论美联储缓慢还是迅速增加货币供给，失业率都趋向其正常水平即自然失业率；长期中失业不取决于货币量增长和通货膨胀。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：长期菲利普斯曲线垂直——无论美联储缓慢还是迅速增加货币供给，失业率都趋向其正常水平即自然失业率；长期中失业不取决于货币量增长和通货膨胀。","label":"结论：长期菲利普斯曲线垂直——无论美…"},{"t":"垂直的长期菲利普斯曲线与垂直的长期总供给曲线是同一枚硬币的两面：扩张性货币政策使长期均衡从低通胀点移到高通胀点，产量与失业都不变——货币政策只影响名义变量，不影响真实变量。","c":[],"k":"b","i":2,"h":"垂直的长期菲利普斯曲线与垂直的长期总供给曲线是同一枚硬币的两面：扩张性货币政策使长期均衡从低通胀点移到高通胀点，产量与失业都不变——货币政策只影响名义变量，不影响真实变量。","label":"垂直的长期菲利普斯曲线与垂直的长期总…"}],"k":"b","i":1,"h":"35.2.1 长期菲利普斯曲线","label":"35.2.1 长期菲利普斯曲线"},{"t":"35.2.2 \"自然\"的含义","c":[{"t":"自然失业率是经济在长期中趋近的失业率；它未必是社会合意的失业率，也不是一成不变的。","c":[],"k":"b","i":2,"h":"自然失业率是经济在长期中趋近的失业率；它未必是社会合意的失业率，也不是一成不变的。","label":"自然失业率是经济在长期中趋近的失业率…"},{"t":"\"自然\"指它不受货币政策的影响：新工会把真实工资抬高到均衡水平之上会造成较高自然失业率，更快的货币增长并不能削弱工会的市场势力，只会带来更高通胀。","c":[],"k":"b","i":2,"h":"&quot;自然&quot;指它不受货币政策的影响：新工会把真实工资抬高到均衡水平之上会造成较高自然失业率，更快的货币增长并不能削弱工会的市场势力，只会带来更高通胀。","label":"\"自然\"指它不受货币政策的影响"},{"t":"但劳动市场政策可以改变自然失业率（最低工资法、集体谈判法、失业保险、在职培训计划等）；降低自然失业率的政策使长期菲利普斯曲线左移、长期总供给曲线右移。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">但劳动市场政策可以改变自然失业率</strong>（最低工资法、集体谈判法、失业保险、在职培训计划等）；降低自然失业率的政策使长期菲利普斯曲线左移、长期总供给曲线右移。","label":"但劳动市场政策可以改变自然失业率"}],"k":"b","i":1,"h":"35.2.2 &quot;自然&quot;的含义","label":"35.2.2 \"自然\"的含义"},{"t":"35.2.3 使理论与证据相一致","c":[{"t":"弗里德曼和费尔普斯的调和：通胀与失业的负相关在短期中存在，但决策者不能把它作为长期政策选择——扩张性货币政策可在短期实现较低失业，但失业率最终回到自然率，长期只留下较高通胀。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">弗里德曼和费尔普斯的调和</strong>：通胀与失业的负相关在短期中存在，但决策者不能把它作为长期政策选择——扩张性货币政策可在短期实现较低失业，但失业率最终回到自然率，长期只留下较高通胀。","label":"弗里德曼和费尔普斯的调和"},{"t":"与总供给理论的对应：短期总供给曲线向右上方倾斜（如黏性工资理论：名义工资按预期物价提前确定，物价高于预期时企业扩大生产就业），长期中预期物价与名义工资调整，长期总供给曲线垂直；同理，权衡取舍只在短期成立，长期菲利普斯曲线垂直——预期是理解短期与长期如何相关的关键。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与总供给理论的对应</strong>：短期总供给曲线向右上方倾斜（如黏性工资理论：名义工资按预期物价提前确定，物价高于预期时企业扩大生产就业），长期中预期物价与名义工资调整，长期总供给曲线垂直；同理，权衡取舍只在短期成立，长期菲利普斯曲线垂直——预期是理解短期与长期如何相关的关键。","label":"与总供给理论的对应"},{"t":"新变量：预期的通货膨胀（expected inflation）——人们预期的物价总水平的变动幅度；它影响名义工资，是决定短期总供给曲线位置的因素。短期中预期通胀既定，货币量变动引起产量、物价、失业和通胀的未预期波动；长期中人们预期到美联储的通胀选择，名义工资同步调整，失业回到自然率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新变量</strong>：预期的通货膨胀（expected inflation）——人们预期的物价总水平的变动幅度；它影响名义工资，是决定短期总供给曲线位置的因素。短期中预期通胀既定，货币量变动引起产量、物价、失业和通胀的未预期波动；长期中人们预期到美联储的通胀选择，名义工资同步调整，失业回到自然率。","label":"新变量：预期的通货膨胀（expect…"}],"k":"b","i":1,"h":"35.2.3 使理论与证据相一致","label":"35.2.3 使理论与证据相一致"},{"t":"35.2.4 短期菲利普斯曲线","c":[{"t":"概括方程式：失业率＝自然失业率−a（实际通货膨胀率−预期通货膨胀率），a衡量失业对未预期到的通货膨胀的反应程度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">概括方程式</strong>：失业率＝自然失业率−a（实际通货膨胀率−预期通货膨胀率），a衡量失业对未预期到的通货膨胀的反应程度。","label":"概括方程式"},{"t":"短期中预期通胀既定，较高的实际通胀与较低失业相关；长期中实际通胀等于预期通胀，失业率处于自然失业率水平。","c":[],"k":"b","i":2,"h":"短期中预期通胀既定，较高的实际通胀与较低失业相关；长期中实际通胀等于预期通胀，失业率处于自然失业率水平。","label":"短期中预期通胀既定，较高的实际通胀与…"},{"t":"不存在稳定的短期菲利普斯曲线：每条短期曲线都反映某个特定的预期通货膨胀率，与垂直的长期曲线相交于预期通胀那一点；预期通胀变动时，短期菲利普斯曲线移动（预期越高，曲线越高）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不存在稳定的短期菲利普斯曲线</strong>：每条短期曲线都反映某个特定的预期通货膨胀率，与垂直的长期曲线相交于预期通胀那一点；预期通胀变动时，短期菲利普斯曲线移动（预期越高，曲线越高）。","label":"不存在稳定的短期菲利普斯曲线"},{"t":"利用权衡取舍的危险：经济始于低通胀、低预期通胀、自然失业率的A点；扩张性政策使其短期移到B点（实际通胀高于预期、失业低于自然率）；随时间推移人们习惯高通胀、上调预期，短期曲线上移，经济最终到C点——通胀高于A点而失业相同。决策者只面临通胀-失业的短期权衡取舍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利用权衡取舍的危险</strong>：经济始于低通胀、低预期通胀、自然失业率的A点；扩张性政策使其短期移到B点（实际通胀高于预期、失业低于自然率）；随时间推移人们习惯高通胀、上调预期，短期曲线上移，经济最终到C点——通胀高于A点而失业相同。决策者只面临通胀-失业的短期权衡取舍。","label":"利用权衡取舍的危险"}],"k":"b","i":1,"h":"35.2.4 短期菲利普斯曲线","label":"35.2.4 短期菲利普斯曲线"},{"t":"35.2.5 自然率假说的自然实验","c":[{"t":"自然率假说（natural-rate hypothesis）：认为无论通货膨胀率如何，失业率最终都要回到正常失业率或自然失业率水平的观点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自然率假说</strong>（natural-rate hypothesis）：认为无论通货膨胀率如何，失业率最终都要回到正常失业率或自然失业率水平的观点。","label":"自然率假说"},{"t":"实验前数据：1961—1968年美国通胀率与失业率几乎描绘出一条完美的菲利普斯曲线，随通胀上升失业下降，令该假说的预言显得大胆。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实验前数据</strong>：1961—1968年美国通胀率与失业率几乎描绘出一条完美的菲利普斯曲线，随通胀上升失业下降，令该假说的预言显得大胆。","label":"实验前数据"},{"t":"实验过程：60年代末起政府扩大总需求——财政上越南战争升级增加政府支出，货币上美联储压低利率使M2增速从60年代初每年约7%升至1970—1972年每年约13%，通胀率升至每年5%~6%（60年代初为1%~2%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实验过程</strong>：60年代末起政府扩大总需求——财政上越南战争升级增加政府支出，货币上美联储压低利率使M2增速从60年代初每年约7%升至1970—1972年每年约13%，通胀率升至每年5%~6%（60年代初为1%~2%）。","label":"实验过程"},{"t":"实验结果：1970年左右简单负相关关系被打破——通胀预期赶上现实，失业率回到60年代初的5%~6%，正如移动的短期菲利普斯曲线理论所预言；到1973年决策者认识到：长期中通胀与失业之间不存在权衡取舍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实验结果</strong>：1970年左右简单负相关关系被打破——通胀预期赶上现实，失业率回到60年代初的5%~6%，正如移动的短期菲利普斯曲线理论所预言；到1973年决策者认识到：长期中通胀与失业之间不存在权衡取舍。","label":"实验结果"}],"k":"b","i":1,"h":"35.2.5 自然率假说的自然实验","label":"35.2.5 自然率假说的自然实验"}],"k":"sec","i":0,"h":"<strong class=\"lead\">35.2 菲利普斯曲线的移动</strong>：预期的作用","label":"35.2 菲利普斯曲线的移动"},{"t":"35.3 菲利普斯曲线的移动：供给冲击的作用","c":[{"t":"供给冲击（supply shock）：直接改变企业的成本和价格，使经济中的总供给曲线移动，进而使菲利普斯曲线移动的事件。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">供给冲击</strong>（supply shock）：直接改变企业的成本和价格，使经济中的总供给曲线移动，进而使菲利普斯曲线移动的事件。","label":"供给冲击"},{"t":"1974年OPEC（沙特、科威特、伊拉克等）作为世界石油市场卡特尔限制原油产量，几年内石油价格几乎翻了一番。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">1974年OPEC</strong>（沙特、科威特、伊拉克等）作为世界石油市场卡特尔限制原油产量，几年内石油价格几乎翻了一番。","label":"1974年OPEC"},{"t":"不利冲击的机制：油价上升抬高汽油、取暖油、轮胎等的生产成本，减少物价既定时的供给量——总供给曲线左移：产量下降（停滞）与物价上升（通胀）并存，这种组合被称为滞胀（stagflation）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">不利冲击的机制</strong>：油价上升抬高汽油、取暖油、轮胎等的生产成本，减少物价既定时的供给量——总供给曲线左移：产量下降（停滞）与物价上升（通胀）并存，这种组合被称为滞胀（stagflation）。","label":"不利冲击的机制"},{"t":"对应的菲利普斯曲线移动：产量减少→就业减少、失业增加；物价较高→通胀率较高；短期菲利普斯曲线向右移动，通胀-失业的权衡取舍恶化。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对应的菲利普斯曲线移动</strong>：产量减少→就业减少、失业增加；物价较高→通胀率较高；短期菲利普斯曲线向右移动，通胀-失业的权衡取舍恶化。","label":"对应的菲利普斯曲线移动"},{"t":"决策者两难：紧缩总需求对付通胀会进一步增加失业；扩大总需求对付失业会进一步加剧通胀——在失业率既定时须忍受更高通胀，在通胀率既定时须忍受更高失业，或两者兼有。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">决策者两难</strong>：紧缩总需求对付通胀会进一步增加失业；扩大总需求对付失业会进一步加剧通胀——在失业率既定时须忍受更高通胀，在通胀率既定时须忍受更高失业，或两者兼有。","label":"决策者两难"},{"t":"冲击是暂时还是持久取决于预期调整：若人们认为冲击引起的通胀只是暂时背离，预期通胀不变，曲线很快复位；若人们认为高通胀新时代来临，预期通胀上升，曲线停在不太合意的新位置。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">冲击是暂时还是持久取决于预期调整</strong>：若人们认为冲击引起的通胀只是暂时背离，预期通胀不变，曲线很快复位；若人们认为高通胀新时代来临，预期通胀上升，曲线停在不太合意的新位置。","label":"冲击是暂时还是持久取决于预期调整"},{"t":"70年代的经验：预期通胀大幅上升，部分因美联储用更高货币增长抵消供给冲击（衰退比不抵消时小，但多年面临不利权衡）；1979年OPEC再次运用市场势力，1980年美国通胀超9%、失业约7%（按60年代曲线，7%失业对应约1%通胀），痛苦指数接近历史最高，公众不满使卡特在连任竞选中败于里根。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">70年代的经验</strong>：预期通胀大幅上升，部分因美联储用更高货币增长抵消供给冲击（衰退比不抵消时小，但多年面临不利权衡）；1979年OPEC再次运用市场势力，1980年美国通胀超9%、失业约7%（按60年代曲线，7%失业对应约1%通胀），痛苦指数接近历史最高，公众不满使卡特在连任竞选中败于里根。","label":"70年代的经验"},{"t":"即问即答要点：有利的供给冲击（如世界石油价格暴跌）使总供给曲线右移、产量上升物价下降，短期菲利普斯曲线向左移动，权衡改善。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：有利的供给冲击（如世界石油价格暴跌）使总供给曲线右移、产量上升物价下降，短期菲利普斯曲线向左移动，权衡改善。","label":"即问即答要点"}],"k":"sec","i":0,"h":"<strong class=\"lead\">35.3 菲利普斯曲线的移动</strong>：供给冲击的作用","label":"35.3 菲利普斯曲线的移动"},{"t":"35.4 降低通货膨胀的代价","c":[{"t":"反通货膨胀指降低通货膨胀率，不应与通货紧缩（物价水平下降）混同——类比行车：反通货膨胀是让汽车慢下来，通货紧缩是向相反方向行驶。","c":[],"k":"b","i":1,"h":"反通货膨胀指降低通货膨胀率，不应与通货紧缩（物价水平下降）混同——类比行车：反通货膨胀是让汽车慢下来，通货紧缩是向相反方向行驶。","label":"反通货膨胀指降低通货膨胀率，不应与通货紧缩"},{"t":"35.4.1 牺牲率","c":[{"t":"牺牲率（sacrifice ratio）：在通货膨胀率下降1个百分点的过程中每年产量损失的百分点数；一般估算为5。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">牺牲率</strong>（sacrifice ratio）：在通货膨胀率下降1个百分点的过程中每年产量损失的百分点数；一般估算为5。","label":"牺牲率（sacrifice rati…"},{"t":"机制：美联储降低货币供给增长率→紧缩总需求→产量减少、失业增加，经济沿短期菲利普斯曲线从A点移到B点；随人们得知物价上升放缓、预期通胀下降，短期曲线左移，经济最终到C点——通胀低于起点而失业回到自然率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机制</strong>：美联储降低货币供给增长率→紧缩总需求→产量减少、失业增加，经济沿短期菲利普斯曲线从A点移到B点；随人们得知物价上升放缓、预期通胀下降，短期曲线左移，经济最终到C点——通胀低于起点而失业回到自然率。","label":"机制：美联储降低货币供给增长率→紧缩…"},{"t":"代价的大小取决于菲利普斯曲线的斜率以及通胀预期对新货币政策调整的速度。","c":[],"k":"b","i":2,"h":"代价的大小取决于菲利普斯曲线的斜率以及通胀预期对新货币政策调整的速度。","label":"代价的大小取决于菲利普斯曲线的斜率以…"},{"t":"沃尔克面对的算术：通胀近10%，降到温和的4%需降6个百分点，按牺牲率5即要求牺牲30%的年产量；可一次到位（一年减产30%过于残酷）、5年内进行（年均低于趋势6%）或10年渐进（年均低于趋势3%）——无论哪种方式都不轻而易举。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">沃尔克面对的算术</strong>：通胀近10%，降到温和的4%需降6个百分点，按牺牲率5即要求牺牲30%的年产量；可一次到位（一年减产30%过于残酷）、5年内进行（年均低于趋势6%）或10年渐进（年均低于趋势3%）——无论哪种方式都不轻而易举。","label":"沃尔克面对的算术"}],"k":"b","i":1,"h":"35.4.1 牺牲率","label":"35.4.1 牺牲率"},{"t":"35.4.2 理性预期与无代价的反通货膨胀的可能性","c":[{"t":"理性预期（rational expectations）：当人们预测未来时，可以充分运用他们所拥有的全部信息，包括有关政府政策的信息的理论；代表人物卢卡斯、萨金特、巴罗。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理性预期</strong>（rational expectations）：当人们预测未来时，可以充分运用他们所拥有的全部信息，包括有关政府政策的信息的理论；代表人物卢卡斯、萨金特、巴罗。","label":"理性预期"},{"t":"含义：人们对未来高通胀的预期正是因为政府现在与未来的货币政策财政政策为这些预期提供了担保；政策制度改变时人们会相应调整通胀预期，因此依据历史数据估算的牺牲率没有考虑政策对预期的直接影响，是不可靠的政策指导。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">含义</strong>：人们对未来高通胀的预期正是因为政府现在与未来的货币政策财政政策为这些预期提供了担保；政策制度改变时人们会相应调整通胀预期，因此依据历史数据估算的牺牲率没有考虑政策对预期的直接影响，是不可靠的政策指导。","label":"含义：人们对未来高通胀的预期正是因为…"},{"t":"极端情形：如果政府做出低通胀政策的可信承诺，人们的理性足以使他们立即降低通胀预期，短期菲利普斯曲线迅速下移，经济几乎无须付出暂时高失业低产量的代价——牺牲率可以是零（萨金特《四次重大通货膨胀的结束》，1981）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">极端情形</strong>：如果政府做出低通胀政策的可信承诺，人们的理性足以使他们立即降低通胀预期，短期菲利普斯曲线迅速下移，经济几乎无须付出暂时高失业低产量的代价——牺牲率可以是零（萨金特《四次重大通货膨胀的结束》，1981）。","label":"极端情形"}],"k":"b","i":1,"h":"35.4.2 理性预期与无代价的反通货膨胀的可能性","label":"35.4.2 理性预期与无代价的反通…"},{"t":"35.4.3 沃尔克的反通货膨胀","c":[{"t":"1979年10月（OPEC第二次冲击之际），上任两个月的美联储主席沃尔克实行坚决的反通货膨胀政策。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">1979年10月</strong>（OPEC第二次冲击之际），上任两个月的美联储主席沃尔克实行坚决的反通货膨胀政策。","label":"1979年10月"},{"t":"结果：通胀率从1981—1982年的近10%降到1983—1984年的4%左右，完全归功于货币政策（同期里根政府预算赤字扩大总需求，反向作用）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：通胀率从1981—1982年的近10%降到1983—1984年的4%左右，完全归功于货币政策（同期里根政府预算赤字扩大总需求，反向作用）。","label":"结果：通胀率从1981—1982年的…"},{"t":"代价：1982—1983年失业率约10%，比沃尔克上任时高4个百分点，真实GDP大大低于趋势——引起美国自30年代大萧条以来最严重的衰退，路径酷似理论预测的A→B→C。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">代价</strong>：1982—1983年失业率约10%，比沃尔克上任时高4个百分点，真实GDP大大低于趋势——引起美国自30年代大萧条以来最严重的衰退，路径酷似理论预测的A→B→C。","label":"代价：1982—1983年失业率约1…"},{"t":"不能据此否定理性预期的两个理由：其一，沃尔克反通胀的牺牲率估算小于根据以前数据所做的估算，其坚定立场可能对预期产生了某种直接影响；其二，许多公众不相信他会尽快降通胀（商业预测企业对80年代通胀下降的预期慢于实际），预期通胀未立即下降、曲线未很快下移——它表明决策者宣布反通胀政策时不能指望人们马上相信。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不能据此否定理性预期的两个理由</strong>：其一，沃尔克反通胀的牺牲率估算小于根据以前数据所做的估算，其坚定立场可能对预期产生了某种直接影响；其二，许多公众不相信他会尽快降通胀（商业预测企业对80年代通胀下降的预期慢于实际），预期通胀未立即下降、曲线未很快下移——它表明决策者宣布反通胀政策时不能指望人们马上相信。","label":"不能据此否定理性预期的两个理由"}],"k":"b","i":1,"h":"35.4.3 沃尔克的反通货膨胀","label":"35.4.3 沃尔克的反通货膨胀"},{"t":"35.4.4 格林斯潘时代","c":[{"t":"1984—2005年（格林斯潘1987年继任美联储主席）美国通胀与失业波动相对温和；开局于有利供给冲击：1986年OPEC内部争执使限产协议破裂，石油价格下跌一半，1984—1986年通胀与失业同降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">1984—2005年</strong>（格林斯潘1987年继任美联储主席）美国通胀与失业波动相对温和；开局于有利供给冲击：1986年OPEC内部争执使限产协议破裂，石油价格下跌一半，1984—1986年通胀与失业同降。","label":"1984—2005年"},{"t":"美联储谨慎避免重犯60年代错误：1989—1990年失业下降、通胀上升时加息紧缩总需求，引发1991—1992年的微小衰退，失业升到自然率之上而通胀再降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">美联储谨慎避免重犯60年代错误</strong>：1989—1990年失业下降、通胀上升时加息紧缩总需求，引发1991—1992年的微小衰退，失业升到自然率之上而通胀再降。","label":"美联储谨慎避免重犯60年代错误"},{"t":"90年代其余年份繁荣：通胀逐渐降至接近零、失业率也下降（许多人认为自然失业率下降了）——部分归功于格林斯潘及其同事的谨慎货币政策，部分归因于有利供给冲击的好运气。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">90年代其余年份繁荣</strong>：通胀逐渐降至接近零、失业率也下降（许多人认为自然失业率下降了）——部分归功于格林斯潘及其同事的谨慎货币政策，部分归因于有利供给冲击的好运气。","label":" ，支持把所得税改为消费税；反方认为，这类政策变动主要使富人受益、对私人储蓄只有微小影响，通过降低预算赤字来增加公共储蓄是更直接、更平等的增加国民储蓄的方法。","c":[],"k":"b","i":1,"h":"鼓励储蓄税收激励的正方指出，社会用许多方法抑制储蓄（对资本收益征收重税、减少积累了财富的人享有的补助等），支持把所得税改为消费税；反方认为，这类政策变动主要使富人受益、对私人储蓄只有微小影响，通过降低预算赤字来增加公共储蓄是更直接、更平等的增加国民储蓄的方法。","label":"鼓励储蓄税收激励的正方指出，社会用许…"},{"t":"本章（宏观部分最后一章）的结论提醒：经济学学习并不总能让人轻而易举地做出政策选择，弄清楚决策者面临的权衡取舍反而会使选择更困难；当政治家或评论家的主张好得令人难以置信、仿佛提供\"免费午餐\"时，一定要找一找隐藏着的价格标签——很少有政策只有好处而没有代价。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章</strong>（宏观部分最后一章）的结论提醒：经济学学习并不总能让人轻而易举地做出政策选择，弄清楚决策者面临的权衡取舍反而会使选择更困难；当政治家或评论家的主张好得令人难以置信、仿佛提供&quot;免费午餐&quot;时，一定要找一找隐藏着的价格标签——很少有政策只有好处而没有代价。","label":"本章（宏观部分最后一章）的结论提醒：…"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"36.1 货币政策与财政政策制定者应该试图稳定经济吗","c":[{"t":"问题：总需求与总供给的变动会引起生产和就业的短期波动，货币政策与财政政策可以使总需求变动从而影响波动——但决策者是否应该用所控制的工具试图平缓经济周期的上升与下降。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">问题</strong>：总需求与总供给的变动会引起生产和就业的短期波动，货币政策与财政政策可以使总需求变动从而影响波动——但决策者是否应该用所控制的工具试图平缓经济周期的上升与下降。","label":"问题：总需求与总供给的变动会引起生产…"},{"t":"正方：决策者应该试图稳定经济","c":[{"t":"放任不管时经济倾向于发生波动：家庭与企业变得悲观时削减支出，物品与服务的总需求减少，生产减少、企业解雇工人、失业率上升、真实GDP与收入下降；失业上升和收入下降又进一步加强最初引起经济下降的悲观主义。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">放任不管时经济倾向于发生波动</strong>：家庭与企业变得悲观时削减支出，物品与服务的总需求减少，生产减少、企业解雇工人、失业率上升、真实GDP与收入下降；失业上升和收入下降又进一步加强最初引起经济下降的悲观主义。","label":"放任不管时经济倾向于发生波动"},{"t":"衰退对社会无益，代表资源的绝对浪费：工人因总需求减少而失去工作，工厂设备闲置就不能生产有价值的物品与服务并获得利润。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">衰退对社会无益，代表资源的绝对浪费</strong>：工人因总需求减少而失去工作，工厂设备闲置就不能生产有价值的物品与服务并获得利润。","label":"衰退对社会无益，代表资源的绝对浪费"},{"t":"社会没有理由承受经济周期涨落之苦，宏观经济理论的发展表明决策者可以减轻经济波动的严重程度。","c":[],"k":"b","i":2,"h":"社会没有理由承受经济周期涨落之苦，宏观经济理论的发展表明决策者可以减轻经济波动的严重程度。","label":"社会没有理由承受经济周期涨落之苦，宏…"},{"t":"通过\"逆经济变动的风向行事\"稳定总需求，从而稳定生产和就业：总需求不足以确保充分就业时，增加政府支出、减税并扩大货币供给；总需求过大、有引起更高通货膨胀的风险时，削减政府支出、增税并减少货币供给。","c":[],"k":"b","i":2,"h":"通过&quot;逆经济变动的风向行事&quot;稳定总需求，从而稳定生产和就业：总需求不足以确保充分就业时，增加政府支出、减税并扩大货币供给；总需求过大、有引起更高通货膨胀的风险时，削减政府支出、增税并减少货币供给。","label":"通过\"逆经济变动的风向行事\"稳定总需…"},{"t":"这些政策措施通过维持更稳定的经济并使每个人从中受益，是宏观经济理论最好的运用。","c":[],"k":"b","i":2,"h":"这些政策措施通过维持更稳定的经济并使每个人从中受益，是宏观经济理论最好的运用。","label":"这些政策措施通过维持更稳定的经济并使…"}],"k":"b","i":1,"h":"<strong class=\"lead\">正方</strong>：决策者应该试图稳定经济","label":"正方：决策者应该试图稳定经济"},{"t":"反方：决策者不应该试图稳定经济","c":[{"t":"货币政策与财政政策虽然在理论上可以稳定经济，但在实践中运用这些政策面临重大障碍。","c":[],"k":"b","i":2,"h":"货币政策与财政政策虽然在理论上可以稳定经济，但在实践中运用这些政策面临重大障碍。","label":"货币政策与财政政策虽然在理论上可以稳…"},{"t":"时滞之一（货币）：政策主要通过改变利率进而影响支出（特别是住房投资支出和企业投资支出），而许多家庭和企业会提前确定支出计划，因此利率变动改变总需求需要时间——研究表明，在做出货币政策变动决策的6个月之内，这种变动对总需求的影响很小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">时滞之一</strong>（货币）：政策主要通过改变利率进而影响支出（特别是住房投资支出和企业投资支出），而许多家庭和企业会提前确定支出计划，因此利率变动改变总需求需要时间——研究表明，在做出货币政策变动决策的6个月之内，这种变动对总需求的影响很小。","label":"时滞之一"},{"t":"时滞之二（财政）：源于政府改变支出与税收的漫长政治程序——提案必须经国会各委员会审议、由众议院与参议院通过并由总统签署，一项重要的财政政策变动从提出、通过到实施也许需要好几年的时间。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">时滞之二</strong>（财政）：源于政府改变支出与税收的漫长政治程序——提案必须经国会各委员会审议、由众议院与参议院通过并由总统签署，一项重要的财政政策变动从提出、通过到实施也许需要好几年的时间。","label":"时滞之二"},{"t":"由于时滞，想稳定经济的决策者必须提前预测措施发生作用时的经济状况；但经济预测极不准确（宏观经济学是极为原始的科学、引起波动的冲击本质上无法预测），决策者只能依靠\"学理式的猜测\"。","c":[],"k":"b","i":2,"h":"由于时滞，想稳定经济的决策者必须提前预测措施发生作用时的经济状况；但经济预测极不准确（宏观经济学是极为原始的科学、引起波动的冲击本质上无法预测），决策者只能依靠&quot;学理式的猜测&quot;。","label":"由于时滞，想稳定经济的决策者必须提前…"},{"t":"结果往往适得其反：政策从开始实施到发生作用的这段时间内经济状况很容易变动，决策者可能无形中加剧而不是减轻经济波动；一些经济学家声称，历史上许多重大经济波动（包括20世纪30年代的大萧条）都可归因于不稳定的政策措施。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果往往适得其反</strong>：政策从开始实施到发生作用的这段时间内经济状况很容易变动，决策者可能无形中加剧而不是减轻经济波动；一些经济学家声称，历史上许多重大经济波动（包括20世纪30年代的大萧条）都可归因于不稳定的政策措施。","label":"结果往往适得其反"},{"t":"医生的第一条规则\"不要伤害病人\"：人体有自我恢复能力，病因不确定时医生通常应什么也不做；治疗\"患病\"的经济同理——消除所有经济波动是不现实的目标，决策者只要不伤害经济就足够了。","c":[],"k":"b","i":2,"h":"医生的第一条规则&quot;不要伤害病人&quot;：人体有自我恢复能力，病因不确定时医生通常应什么也不做；治疗&quot;患病&quot;的经济同理——消除所有经济波动是不现实的目标，决策者只要不伤害经济就足够了。","label":"医生的第一条规则\"不要伤害病人\""}],"k":"b","i":1,"h":"<strong class=\"lead\">反方</strong>：决策者不应该试图稳定经济","label":"反方：决策者不应该试图稳定经济"},{"t":"即问即答要点：货币政策时滞源于利率传导需要时间，财政政策时滞源于政治程序漫长；正因如此，积极政策可能\"顺周期\"起反作用，这是消极（不干预）政策主张的核心论据。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：货币政策时滞源于利率传导需要时间，财政政策时滞源于政治程序漫长；正因如此，积极政策可能&quot;顺周期&quot;起反作用，这是消极（不干预）政策主张的核心论据。","label":"即问即答要点"}],"k":"sec","i":0,"h":"36.1 货币政策与财政政策制定者应该试图稳定经济吗","label":"36.1 货币政策与财政政策制定者应…"},{"t":"36.2 政府反衰退应该增加支出还是减税","c":[{"t":"问题背景：2001年布什面对衰退的反应是降低税率；2009年奥巴马面对几十年来最严重的衰退推出一揽子刺激计划（部分减税＋政府支出大幅增加）——在减轻衰退方面，哪一种财政政策工具更好：政府支出还是税收？","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">问题背景</strong>：2001年布什面对衰退的反应是降低税率；2009年奥巴马面对几十年来最严重的衰退推出一揽子刺激计划（部分减税＋政府支出大幅增加）——在减轻衰退方面，哪一种财政政策工具更好：政府支出还是税收？","label":"问题背景"},{"t":"正方：政府应该增加支出来反衰退","c":[{"t":"思想渊源：凯恩斯在20世纪30年代大萧条时期写出《就业、利息和货币通论》并改变了经济学——衰退期间的基本问题是总需求不足，企业卖不出足够的物品与服务就会减少生产与就业，终结衰退的关键是把总需求恢复到与劳动力充分就业一致的水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">思想渊源</strong>：凯恩斯在20世纪30年代大萧条时期写出《就业、利息和货币通论》并改变了经济学——衰退期间的基本问题是总需求不足，企业卖不出足够的物品与服务就会减少生产与就业，终结衰退的关键是把总需求恢复到与劳动力充分就业一致的水平。","label":"思想渊源"},{"t":"货币政策是应对衰退的第一道防线：增加货币供给使利率下降，降低为新工厂和新住房融资的借款成本，较多的投资支出增加总需求，帮助生产和就业恢复正常。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币政策是应对衰退的第一道防线</strong>：增加货币供给使利率下降，降低为新工厂和新住房融资的借款成本，较多的投资支出增加总需求，帮助生产和就业恢复正常。","label":"货币政策是应对衰退的第一道防线"},{"t":"财政政策提供另一种工具：减税增加家庭可支配收入、鼓励消费支出；政府购买物品与服务直接增加总需求；且财政行为具有乘数效应——更高的总需求引起更高的收入，又引起额外的消费支出，进一步增加总需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">财政政策提供另一种工具</strong>：减税增加家庭可支配收入、鼓励消费支出；政府购买物品与服务直接增加总需求；且财政行为具有乘数效应——更高的总需求引起更高的收入，又引起额外的消费支出，进一步增加总需求。","label":"财政政策提供另一种工具"},{"t":"货币政策工具失去效用时财政政策特别有用：2008—2009年衰退期间美联储把目标利率降至几乎为零，而利率不能降到零以下（负利率时人们宁愿持有现金也不愿贷出），美联储由此失去最有力的刺激工具，此时转向税收和政府支出的财政政策就自然而然。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币政策工具失去效用时财政政策特别有用</strong>：2008—2009年衰退期间美联储把目标利率降至几乎为零，而利率不能降到零以下（负利率时人们宁愿持有现金也不愿贷出），美联储由此失去最有力的刺激工具，此时转向税收和政府支出的财政政策就自然而然。","label":"货币政策工具失去效用时财政政策特别有用"},{"t":"传统凯恩斯主义分析：增加政府购买比减税更有效——政府为家庭减税1美元，其中一部分可能被储蓄而不是支出（若家庭认为减税是暂时的则更是如此），储蓄部分对总需求没有贡献；政府支出1美元购买物品或服务则直接且完全地增加总需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传统凯恩斯主义分析</strong>：增加政府购买比减税更有效——政府为家庭减税1美元，其中一部分可能被储蓄而不是支出（若家庭认为减税是暂时的则更是如此），储蓄部分对总需求没有贡献；政府支出1美元购买物品或服务则直接且完全地增加总需求。","label":"传统凯恩斯主义分析"},{"t":"数据支撑：奥巴马政府经济学家用传统宏观经济模型模拟——每减税1美元GDP增加0.99美元，政府购买每增加1美元GDP增加1.59美元，政府支出增加提供更大的\"作用力\"，故2009年政策反应的特点是联邦减税较少、增支较多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数据支撑</strong>：奥巴马政府经济学家用传统宏观经济模型模拟——每减税1美元GDP增加0.99美元，政府购买每增加1美元GDP增加1.59美元，政府支出增加提供更大的&quot;作用力&quot;，故2009年政策反应的特点是联邦减税较少、增支较多。","label":"数据支撑"},{"t":"决策者聚焦的三类支出：其一，\"现建现用\"项目（维修高速公路和桥梁等可马上开工的公共工程，让失业者回来工作）；其二，联邦政府对州和地方政府的援助（这些政府被要求平衡预算，衰退期税收收入减少不得不解雇教师、警察等公务人员，联邦援助阻止或至少降低该结果的严重性）；其三，通过失业保障增加对失业者的补助（失业者往往把额外收入用于支出而非储蓄，对总需求从而对生产和就业的贡献大于减税）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">决策者聚焦的三类支出</strong>：其一，&quot;现建现用&quot;项目（维修高速公路和桥梁等可马上开工的公共工程，让失业者回来工作）；其二，联邦政府对州和地方政府的援助（这些政府被要求平衡预算，衰退期税收收入减少不得不解雇教师、警察等公务人员，联邦援助阻止或至少降低该结果的严重性）；其三，通过失业保障增加对失业者的补助（失业者往往把额外收入用于支出而非储蓄，对总需求从而对生产和就业的贡献大于减税）。","label":"决策者聚焦的三类支出"},{"t":"效果评估：根据奥巴马政府所用的模型，8000亿美元的一揽子刺激计划到总统任职第二年年末会创造或挽回300多万个工作岗位；但刺激措施的效用到底有多大不可能精确知道——历史不能重演，无法观察\"没有刺激计划\"的反事实。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效果评估</strong>：根据奥巴马政府所用的模型，8000亿美元的一揽子刺激计划到总统任职第二年年末会创造或挽回300多万个工作岗位；但刺激措施的效用到底有多大不可能精确知道——历史不能重演，无法观察&quot;没有刺激计划&quot;的反事实。","label":"效果评估"},{"t":"一个显而易见的事实：2008—2009年衰退真实GDP仅下降4%、失业率仅达10%，远未达到大萧条的规模（真实GDP下降27%、失业率25%）——衰退是严重的，但本可能更糟。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一个显而易见的事实</strong>：2008—2009年衰退真实GDP仅下降4%、失业率仅达10%，远未达到大萧条的规模（真实GDP下降27%、失业率25%）——衰退是严重的，但本可能更糟。","label":"一个显而易见的事实"}],"k":"b","i":1,"h":"<strong class=\"lead\">正方</strong>：政府应该增加支出来反衰退","label":"正方：政府应该增加支出来反衰退"},{"t":"反方：政府应该减税来反衰退","c":[{"t":"传统：用税收政策刺激衰退经济由来已久——肯尼迪的减税方案1964年约翰逊执政时通过；里根1981年签署大幅减税法律；两次减税后很快都出现了强劲的经济增长。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传统</strong>：用税收政策刺激衰退经济由来已久——肯尼迪的减税方案1964年约翰逊执政时通过；里根1981年签署大幅减税法律；两次减税后很快都出现了强劲的经济增长。","label":"传统：用税收政策刺激衰退经济由来已久…"},{"t":"减税对总需求和总供给都有重要影响：一方面通过增加可支配收入增加总需求（传统凯恩斯主义分析）；另一方面通过改变激励增加总需求——如采取扩大投资税收抵免的形式引起投资品支出增加，而投资支出是经济周期期间GDP中最易变化的组成部分，刺激投资是结束衰退的关键。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">减税对总需求和总供给都有重要影响</strong>：一方面通过增加可支配收入增加总需求（传统凯恩斯主义分析）；另一方面通过改变激励增加总需求——如采取扩大投资税收抵免的形式引起投资品支出增加，而投资支出是经济周期期间GDP中最易变化的组成部分，刺激投资是结束衰退的关键。","label":"减税对总需求和总供给都有重要影响"},{"t":"减税还能增加总供给：降低边际税率使工人把赚到的收入中更大部分留下来，失业者有更大激励去找工作、就业者有更大激励工作更长时间；总需求与总供给同时增加意味着生产扩大且不产生通货膨胀率上升的压力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">减税还能增加总供给</strong>：降低边际税率使工人把赚到的收入中更大部分留下来，失业者有更大激励去找工作、就业者有更大激励工作更长时间；总需求与总供给同时增加意味着生产扩大且不产生通货膨胀率上升的压力。","label":"减税还能增加总供给"},{"t":"增支的问题之一（预期与乘数被高估）：消费者明白高政府支出必然伴随政府借债、很可能引起未来高税收，这种预期使消费者削减今天的支出；未来税收也会引起各种无谓损失；企业家预见未来经济更大扭曲会降低未来利润预期、减少今天的投资——由于多种效应，政府支出乘数很可能小于传统上认为的数字。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">增支的问题之一</strong>（预期与乘数被高估）：消费者明白高政府支出必然伴随政府借债、很可能引起未来高税收，这种预期使消费者削减今天的支出；未来税收也会引起各种无谓损失；企业家预见未来经济更大扭曲会降低未来利润预期、减少今天的投资——由于多种效应，政府支出乘数很可能小于传统上认为的数字。","label":"增支的问题之一"},{"t":"增支的问题之二（花钱的两难）：大量政府支出项目需要数年计划（决策者和投票者要评估各种方案的成本收益），而衰退期失业急剧上升时增加总需求的要求是迫切的——迅速花钱可能购买没什么公共价值的东西，谨慎细致地计划又不能适时增加总需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">增支的问题之二</strong>（花钱的两难）：大量政府支出项目需要数年计划（决策者和投票者要评估各种方案的成本收益），而衰退期失业急剧上升时增加总需求的要求是迫切的——迅速花钱可能购买没什么公共价值的东西，谨慎细致地计划又不能适时增加总需求。","label":"增支的问题之二"},{"t":"减税的优点是分散支出决策：家庭把可支配收入用于自认为有价值的东西，企业把钱投向预期有利可图的项目；政府要迅速花掉大量钱时受制于政治压力，可能建造\"无地可去的桥梁\"——无用项目虽可雇用一些工人，却创造不出可持续的价值，还把大量额外债务留给子孙后代；增支带来的总需求短期收益不足以补偿其长期成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">减税的优点是分散支出决策</strong>：家庭把可支配收入用于自认为有价值的东西，企业把钱投向预期有利可图的项目；政府要迅速花掉大量钱时受制于政治压力，可能建造&quot;无地可去的桥梁&quot;——无用项目虽可雇用一些工人，却创造不出可持续的价值，还把大量额外债务留给子孙后代；增支带来的总需求短期收益不足以补偿其长期成本。","label":"减税的优点是分散支出决策"}],"k":"b","i":1,"h":"<strong class=\"lead\">反方</strong>：政府应该减税来反衰退","label":"反方：政府应该减税来反衰退"},{"t":"即问即答要点：按传统凯恩斯主义分析，增加政府支出1美元对GDP的影响更大——政府购买直接且完全地增加总需求，而减税的一部分被储蓄、不进入总需求。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：按传统凯恩斯主义分析，增加政府支出1美元对GDP的影响更大——政府购买直接且完全地增加总需求，而减税的一部分被储蓄、不进入总需求。","label":"即问即答要点"}],"k":"sec","i":0,"h":"36.2 政府反衰退应该增加支出还是减税","label":"36.2 政府反衰退应该增加支出还是减税"},{"t":"36.3 货币政策应该按规则制定还是相机抉择","c":[{"t":"问题背景：美国货币政策由联邦公开市场委员会制定（约每六周开会评估经济状况并确定短期利率目标，再调整货币供给实现目标，通常保持到下次会议）；美联储实施货币政策采用几乎完全相机抉择的方式——《1913年联邦储备法案》1977年修正案只给美联储含糊的多重目标（货币总量和信贷总量的长期增长与经济长期生产潜力保持一致，促进最大就业、物价稳定和适度长期利率），既没规定各目标比重，也没告诉美联储如何实现。争论：是否应该减少美联储相机抉择的权力，使其遵循某种政策规则。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">问题背景</strong>：美国货币政策由联邦公开市场委员会制定（约每六周开会评估经济状况并确定短期利率目标，再调整货币供给实现目标，通常保持到下次会议）；美联储实施货币政策采用几乎完全相机抉择的方式——《1913年联邦储备法案》1977年修正案只给美联储含糊的多重目标（货币总量和信贷总量的长期增长与经济长期生产潜力保持一致，促进最大就业、物价稳定和适度长期利率），既没规定各目标比重，也没告诉美联储如何实现。争论：是否应该减少美联储相机抉择的权力，使其遵循某种政策规则。","label":"问题背景"},{"t":"正方：货币政策应该按规则制定","c":[{"t":"相机抉择问题之一：对能力不足及权力滥用没有限制——政府派警察维护社区秩序会给予严格指示（警察权力大，随心所欲行使是危险的），而赋予中央银行领导人维护经济秩序的权力时却不给任何指导、允许其不受约束地相机抉择。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">相机抉择问题之一</strong>：对能力不足及权力滥用没有限制——政府派警察维护社区秩序会给予严格指示（警察权力大，随心所欲行使是危险的），而赋予中央银行领导人维护经济秩序的权力时却不给任何指导、允许其不受约束地相机抉择。","label":"相机抉择问题之一"},{"t":"权力滥用的典型例子是用货币政策影响总统竞选：现任总统的选票取决于再次竞选时的经济状况，对现任总统有好感的央行领导人会在大选前实行扩张性政策刺激生产和就业（所引起的通货膨胀大选之后才表现出来）——央行领导人与政治家结盟时，相机抉择引起反映大选日程的经济波动，即政治性经济周期。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">权力滥用的典型例子是用货币政策影响总统竞选</strong>：现任总统的选票取决于再次竞选时的经济状况，对现任总统有好感的央行领导人会在大选前实行扩张性政策刺激生产和就业（所引起的通货膨胀大选之后才表现出来）——央行领导人与政治家结盟时，相机抉择引起反映大选日程的经济波动，即政治性经济周期。","label":"权力滥用的典型例子是用货币政策影响总统竞选"},{"t":"问题之二（更微妙）：政策的前后不一致性——决策者的声明（说要做什么）与行动（后来实际上做了什么）之间的不一致。知道通胀与失业不存在长期权衡取舍的央行领导人通常宣布目标是零通货膨胀，却很少实现物价稳定：一旦公众形成通胀预期，决策者面临通胀与失业的短期权衡取舍，于是放弃物价稳定的声明以实现较低失业。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题之二</strong>（更微妙）：政策的前后不一致性——决策者的声明（说要做什么）与行动（后来实际上做了什么）之间的不一致。知道通胀与失业不存在长期权衡取舍的央行领导人通常宣布目标是零通货膨胀，却很少实现物价稳定：一旦公众形成通胀预期，决策者面临通胀与失业的短期权衡取舍，于是放弃物价稳定的声明以实现较低失业。","label":"问题之二"},{"t":"后果：由于决策者经常前后不一致，公众对其降低通胀的声明表示怀疑，人们预期的通胀率总高于货币政策决策者宣布要实现的水平；更高的通胀预期使短期菲利普斯曲线向上移动，通胀与失业的短期权衡取舍比原来更为不利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">后果</strong>：由于决策者经常前后不一致，公众对其降低通胀的声明表示怀疑，人们预期的通胀率总高于货币政策决策者宣布要实现的水平；更高的通胀预期使短期菲利普斯曲线向上移动，通胀与失业的短期权衡取舍比原来更为不利。","label":"后果：由于决策者经常前后不一致，公众…"},{"t":"解决之道是让央行遵循某种政策规则：例如国会立法要求美联储每年正好增加3%的货币供给（3%≈真实GDP年均增速，大体是长期物价稳定所需比率）——消除能力不足与权力滥用、杜绝政治性经济周期、不再有前后不一致；人们信任美联储的低通胀声明，经济面临较为有利的短期权衡取舍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解决之道是让央行遵循某种政策规则</strong>：例如国会立法要求美联储每年正好增加3%的货币供给（3%≈真实GDP年均增速，大体是长期物价稳定所需比率）——消除能力不足与权力滥用、杜绝政治性经济周期、不再有前后不一致；人们信任美联储的低通胀声明，经济面临较为有利的短期权衡取舍。","label":"解决之道是让央行遵循某种政策规则"},{"t":"规则也可以较为积极：如规定失业率每高于自然失业率1个百分点，美联储可将货币增长率提高1个百分点；无论规则形式如何，遵循规则都能通过限制能力不足、权力滥用和前后不一致性带来好处。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规则也可以较为积极</strong>：如规定失业率每高于自然失业率1个百分点，美联储可将货币增长率提高1个百分点；无论规则形式如何，遵循规则都能通过限制能力不足、权力滥用和前后不一致性带来好处。","label":"规则也可以较为积极"}],"k":"b","i":1,"h":"<strong class=\"lead\">正方</strong>：货币政策应该按规则制定","label":"正方：货币政策应该按规则制定"},{"t":"反方：货币政策不应该按规则制定","c":[{"t":"相机抉择的重要优点是灵活性：美联储要面对许多并非都可以预见的情况——20世纪30年代创纪录的银行破产、70年代史无前例的世界石油价格上涨、1987年10月股市一天之内下跌22%、2007—2009年住房价格下跌与金融体系重大问题；规则的设计者不可能考虑到所有意外并提前详细说明正确的政策反应，更好的做法是任命优秀人才并给他们自由使其尽可能做得最好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">相机抉择的重要优点是灵活性</strong>：美联储要面对许多并非都可以预见的情况——20世纪30年代创纪录的银行破产、70年代史无前例的世界石油价格上涨、1987年10月股市一天之内下跌22%、2007—2009年住房价格下跌与金融体系重大问题；规则的设计者不可能考虑到所有意外并提前详细说明正确的政策反应，更好的做法是任命优秀人才并给他们自由使其尽可能做得最好。","label":"相机抉择的重要优点是灵活性"},{"t":"所谓相机抉择问题很大程度上是假想的：政治性经济周期在实践中并不明显，有时甚至相反——1979年卡特任命沃尔克为美联储主席，同年10月沃尔克转向紧缩性货币政策应对接手的高通胀，其可预期的衰退结果使卡特支持率下降并在1980年大选中败于里根；沃尔克出于国家利益行动而非帮助任命他的总统。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">所谓相机抉择问题很大程度上是假想的</strong>：政治性经济周期在实践中并不明显，有时甚至相反——1979年卡特任命沃尔克为美联储主席，同年10月沃尔克转向紧缩性货币政策应对接手的高通胀，其可预期的衰退结果使卡特支持率下降并在1980年大选中败于里根；沃尔克出于国家利益行动而非帮助任命他的总统。","label":"所谓相机抉择问题很大程度上是假想的"},{"t":"前后不一致性的重要性在实践中也不明显：中央银行领导人可以通过实现自己的诺言在长期中赢得信任——20世纪90年代和21世纪初期，尽管有利用通胀与失业短期权衡取舍的诱惑，美联储仍实现并维持了低通货膨胀率，说明实现低通胀不一定要求遵循政策规则。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">前后不一致性的重要性在实践中也不明显</strong>：中央银行领导人可以通过实现自己的诺言在长期中赢得信任——20世纪90年代和21世纪初期，尽管有利用通胀与失业短期权衡取舍的诱惑，美联储仍实现并维持了低通货膨胀率，说明实现低通胀不一定要求遵循政策规则。","label":"前后不一致性的重要性在实践中也不明显"},{"t":"以规则替代相机抉择还面临详细说明准确规则的艰难任务：尽管有许多研究考察各种可选规则的成本收益，经济学家对什么是好规则并没有共识；在达成共识之前，社会除了让央行领导人相机抉择别无选择。","c":[],"k":"b","i":2,"h":"以规则替代相机抉择还面临详细说明准确规则的艰难任务：尽管有许多研究考察各种可选规则的成本收益，经济学家对什么是好规则并没有共识；在达成共识之前，社会除了让央行领导人相机抉择别无选择。","label":"以规则替代相机抉择还面临详细说明准确…"}],"k":"b","i":1,"h":"<strong class=\"lead\">反方</strong>：货币政策不应该按规则制定","label":"反方：货币政策不应该按规则制定"},{"t":"参考资料要点（通货膨胀目标化）","c":[{"t":"过去几十年世界许多中央银行采取通货膨胀目标化：或由央行宣布未来几年的通胀调控目标，或由国家立法规定目标。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">过去几十年世界许多中央银行采取通货膨胀目标化</strong>：或由央行宣布未来几年的通胀调控目标，或由国家立法规定目标。","label":"过去几十年世界许多中央银行采取通货膨胀目标化"},{"t":"它并不是承诺一个不变的规则：央行仍有一定的相机抉择权——目标通常是一个范围（如1%~3%）而非特定数值，央行可在范围内选择；某些事件（如世界石油价格冲击）推动通胀超过目标范围时，有时还允许央行暂时调整目标。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">它并不是承诺一个不变的规则</strong>：央行仍有一定的相机抉择权——目标通常是一个范围（如1%~3%）而非特定数值，央行可在范围内选择；某些事件（如世界石油价格冲击）推动通胀超过目标范围时，有时还允许央行暂时调整目标。","label":"它并不是承诺一个不变的规则"},{"t":"但它限制了相机抉择的使用范围：被简单告知\"做正确的事\"时央行难以厘清责任（人们会永远争论什么是正确的）；有了通胀目标，公众很容易判断央行是否实现了目标——通胀目标化没有束缚央行手脚，却提高了货币政策的透明度和责任性，是规则与相机抉择之争的一种妥协。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">但它限制了相机抉择的使用范围</strong>：被简单告知&quot;做正确的事&quot;时央行难以厘清责任（人们会永远争论什么是正确的）；有了通胀目标，公众很容易判断央行是否实现了目标——通胀目标化没有束缚央行手脚，却提高了货币政策的透明度和责任性，是规则与相机抉择之争的一种妥协。","label":"但它限制了相机抉择的使用范围"},{"t":"美联储在采用通胀目标化上行动迟缓（评论者早已提出其隐含目标约2%）；2012年1月联邦公开市场委员会明确宣布：按个人消费支出物价指数的年变动量衡量，把通货膨胀率确定为2%左右与其长期身份和使命最一致，把目标明确告诉公众有助于稳定长期通胀预期、稳定物价并提高其促进最大就业的能力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">美联储在采用通胀目标化上行动迟缓</strong>（评论者早已提出其隐含目标约2%）；2012年1月联邦公开市场委员会明确宣布：按个人消费支出物价指数的年变动量衡量，把通货膨胀率确定为2%左右与其长期身份和使命最一致，把目标明确告诉公众有助于稳定长期通胀预期、稳定物价并提高其促进最大就业的能力。","label":"美联储在采用通胀目标化上行动迟缓"}],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料要点</strong>（通货膨胀目标化）","label":"参考资料要点"},{"t":"即问即答要点：规则例子如\"每年货币供给正好增加3%\"——可能比相机抉择更好（杜绝政治性经济周期与前后不一致、赢得公众信任）；也可能更糟（面对无法预见的冲击缺乏灵活性，且经济学家对什么是好规则并无共识）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：规则例子如&quot;每年货币供给正好增加3%&quot;——可能比相机抉择更好（杜绝政治性经济周期与前后不一致、赢得公众信任）；也可能更糟（面对无法预见的冲击缺乏灵活性，且经济学家对什么是好规则并无共识）。","label":"即问即答要点"}],"k":"sec","i":0,"h":"36.3 货币政策应该按规则制定还是相机抉择","label":"36.3 货币政策应该按规则制定还是…"},{"t":"36.4 中央银行应该把零通货膨胀作为目标吗","c":[{"t":"问题背景：经济学十大原理中的两条——政府发行过多货币时物价上升；社会面临通货膨胀与失业之间的短期权衡取舍。二者结合向决策者提出：中央银行愿意忍受的通货膨胀率应该是多少？通胀率的适当目标是否应该为零？","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">问题背景</strong>：经济学十大原理中的两条——政府发行过多货币时物价上升；社会面临通货膨胀与失业之间的短期权衡取舍。二者结合向决策者提出：中央银行愿意忍受的通货膨胀率应该是多少？通胀率的适当目标是否应该为零？","label":"问题背景"},{"t":"正方：中央银行应该把零通货膨胀作为目标","c":[{"t":"通货膨胀并没有给社会带来什么好处，却产生真实成本——六种通货膨胀成本：与减少货币持有量相关的皮鞋成本；与频繁调整价格相关的菜单成本；相对价格变动的加剧；税法非指数化引起的意想不到的税收负担变动；计价单位变动引起的混乱和不方便；债务人与债权人之间任意的财富再分配。","c":[],"k":"b","i":2,"h":"通货膨胀并没有给社会带来什么好处，却产生真实成本——六种通货膨胀成本：与减少货币持有量相关的皮鞋成本；与频繁调整价格相关的菜单成本；相对价格变动的加剧；税法非指数化引起的意想不到的税收负担变动；计价单位变动引起的混乱和不方便；债务人与债权人之间任意的财富再分配。","label":"通货膨胀并没有给社会带来什么好处，却…"},{"t":"一些经济学家认为温和通胀（如20世纪90年代和21世纪初美国经历的3%）下这些成本并不大，但另一些认为即使是温和通胀成本也相当大；且毫无疑问公众不喜欢通货膨胀——通胀加速时民调显示通胀是国家主要问题之一。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一些经济学家认为温和通胀</strong>（如20世纪90年代和21世纪初美国经历的3%）下这些成本并不大，但另一些认为即使是温和通胀成本也相当大；且毫无疑问公众不喜欢通货膨胀——通胀加速时民调显示通胀是国家主要问题之一。","label":"一些经济学家认为温和通胀"},{"t":"必须根据达到零通胀的成本来评价其好处：短期菲利普斯曲线表明降低通胀通常要经历高失业和低产量的时期，但反通胀引起的衰退仅仅是暂时的——一旦人们明白决策者的目标是零通胀，通胀预期下降，菲利普斯曲线的短期权衡取舍改善；长期中通胀与失业之间不存在权衡取舍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">必须根据达到零通胀的成本来评价其好处</strong>：短期菲利普斯曲线表明降低通胀通常要经历高失业和低产量的时期，但反通胀引起的衰退仅仅是暂时的——一旦人们明白决策者的目标是零通胀，通胀预期下降，菲利普斯曲线的短期权衡取舍改善；长期中通胀与失业之间不存在权衡取舍。","label":"必须根据达到零通胀的成本来评价其好处"},{"t":"因此降低通胀是暂时有成本、长期有好处的政策：反通胀衰退结束后，零通胀的好处持续到未来，有远见卓识的决策者应为持久利益付出暂时成本——正是沃尔克20世纪80年代初的考量：紧缩货币政策使通胀率从1980年的约10%降到1983年的约4%，尽管1982年失业率达大萧条以来最高，经济最终走出衰退并使低通胀持续至今，沃尔克被认为是央行领导人的杰出代表。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">因此降低通胀是暂时有成本、长期有好处的政策</strong>：反通胀衰退结束后，零通胀的好处持续到未来，有远见卓识的决策者应为持久利益付出暂时成本——正是沃尔克20世纪80年代初的考量：紧缩货币政策使通胀率从1980年的约10%降到1983年的约4%，尽管1982年失业率达大萧条以来最高，经济最终走出衰退并使低通胀持续至今，沃尔克被认为是央行领导人的杰出代表。","label":"因此降低通胀是暂时有成本、长期有好处的政策"},{"t":"降低通胀的成本也未必像一些经济学家认为的那样大：如果美联储宣布对零通胀的可信承诺，可以直接影响通胀预期，改善通胀与失业的短期权衡取舍，以较低成本实现较低通胀；关键在于信任，国会可通过使物价稳定成为美联储主要目标的立法帮助建立信任——使实现零通胀的成本更低且不减少任何好处。","c":[],"k":"b","i":2,"h":"降低通胀的成本也未必像一些经济学家认为的那样大：如果美联储宣布对零通胀的可信承诺，可以直接影响通胀预期，改善通胀与失业的短期权衡取舍，以较低成本实现较低通胀；关键在于信任，国会可通过使物价稳定成为美联储主要目标的立法帮助建立信任——使实现零通胀的成本更低且不减少任何好处。","label":"降低通胀的成本也未必像一些经济学家认为的那样大"},{"t":"\"零\"给决策者提供比其他任何数字都更自然的聚焦点：若目标是3%，当事件使通胀升到4%或5%时为什么不能提高目标（\"3\"没有特殊含义）；\"零\"是美联储唯一可以宣布已实现物价稳定并完全消除了通胀成本的数值。","c":[],"k":"b","i":2,"h":"&quot;零&quot;给决策者提供比其他任何数字都更自然的聚焦点：若目标是3%，当事件使通胀升到4%或5%时为什么不能提高目标（&quot;3&quot;没有特殊含义）；&quot;零&quot;是美联储唯一可以宣布已实现物价稳定并完全消除了通胀成本的数值。","label":"\"零\"给决策者提供比其他任何数字都更自然的聚焦点"}],"k":"b","i":1,"h":"<strong class=\"lead\">正方</strong>：中央银行应该把零通货膨胀作为目标","label":"正方：中央银行应该把零通货膨胀作为目标"},{"t":"反方：中央银行不应该把零通货膨胀作为目标","c":[{"t":"物价稳定固然合意，但与温和通胀相比，零通胀的好处并不大而实现成本很高：对牺牲率的估算表明通胀率每降低1%要求放弃一年产量的5%左右——把通胀从4%降到零要求当年产量减少20%；人们不喜欢4%的通胀，但是否（应该）愿意为摆脱它付出一年收入的20%不得而知。","c":[],"k":"b","i":2,"h":"物价稳定固然合意，但与温和通胀相比，零通胀的好处并不大而实现成本很高：对牺牲率的估算表明通胀率每降低1%要求放弃一年产量的5%左右——把通胀从4%降到零要求当年产量减少20%；人们不喜欢4%的通胀，但是否（应该）愿意为摆脱它付出一年收入的20%不得而知。","label":"物价稳定固然合意，但与温和通胀相比，…"},{"t":"社会成本比总量数字所示还要大：衰退中收入的下降并非平均分摊，而是集中在失去工作的人身上，最易受伤害的往往是技术和经验最少的工人——降低通胀的大部分成本由承受能力最差的人承担。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社会成本比总量数字所示还要大</strong>：衰退中收入的下降并非平均分摊，而是集中在失去工作的人身上，最易受伤害的往往是技术和经验最少的工人——降低通胀的大部分成本由承受能力最差的人承担。","label":"社会成本比总量数字所示还要大"},{"t":"经济学家对通胀成本是否很高并无一致看法：皮鞋成本、菜单成本等看来并不高（至少对温和通胀如此）；公众确实不喜欢通胀，但会被误导相信\"通货膨胀错觉\"（认为通胀降低生活水平）——生活水平取决于生产率而非货币政策，名义收入上升与物价上升总同时发生，降低通胀并不会使真实收入增加更快。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学家对通胀成本是否很高并无一致看法</strong>：皮鞋成本、菜单成本等看来并不高（至少对温和通胀如此）；公众确实不喜欢通胀，但会被误导相信&quot;通货膨胀错觉&quot;（认为通胀降低生活水平）——生活水平取决于生产率而非货币政策，名义收入上升与物价上升总同时发生，降低通胀并不会使真实收入增加更快。","label":"经济学家对通胀成本是否很高并无一致看法"},{"t":"不降低通胀也能消除其许多成本：重新制定税法以考虑通胀（消除非指数化税制相关的问题）；像克林顿政府1997年那样发行指数化政府债券，减少未预期通胀引起的债权人与债务人之间财富任意再分配，并通过树立范例鼓励私人债务人和债权人签订按通胀指数化的合同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不降低通胀也能消除其许多成本</strong>：重新制定税法以考虑通胀（消除非指数化税制相关的问题）；像克林顿政府1997年那样发行指数化政府债券，减少未预期通胀引起的债权人与债务人之间财富任意再分配，并通过树立范例鼓励私人债务人和债权人签订按通胀指数化的合同。","label":"不降低通胀也能消除其许多成本"},{"t":"相信央行能很快获得信任从而无成本反通胀的想法是危险的：各经济体降低通胀时几乎总要经历高失业和低产量的时期。","c":[],"k":"b","i":2,"h":"相信央行能很快获得信任从而无成本反通胀的想法是危险的：各经济体降低通胀时几乎总要经历高失业和低产量的时期。","label":"相信央行能很快获得信任从而无成本反通…"},{"t":"反通胀衰退还会在经济中潜在留下持久性印记：衰退期间所有行业的企业都大幅减少对新工厂和新设备的支出（投资是GDP中最易变动的部分），衰退过后资本存量的减少使生产率、收入和生活水平降到原本能达到的水平之下；失业工人失去工作技能，永久降低其作为工人的价值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反通胀衰退还会在经济中潜在留下持久性印记</strong>：衰退期间所有行业的企业都大幅减少对新工厂和新设备的支出（投资是GDP中最易变动的部分），衰退过后资本存量的减少使生产率、收入和生活水平降到原本能达到的水平之下；失业工人失去工作技能，永久降低其作为工人的价值。","label":"反通胀衰退还会在经济中潜在留下持久性印记"},{"t":"轻微通胀甚至可能是好事：通胀是能\"润滑\"劳动市场\"车轮\"的润滑剂——工人抵制名义工资下降，通过物价水平上升降低真实工资更容易实现，通胀使根据劳动市场变动调整真实工资更为容易。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">轻微通胀甚至可能是好事</strong>：通胀是能&quot;润滑&quot;劳动市场&quot;车轮&quot;的润滑剂——工人抵制名义工资下降，通过物价水平上升降低真实工资更容易实现，通胀使根据劳动市场变动调整真实工资更为容易。","label":"轻微通胀甚至可能是好事"},{"t":"通胀还使负真实利率成为可能：名义利率绝不会低于零（债权人可一直持有货币而不会以负利率贷出）；通胀为零时真实利率永远不可能是负的；通胀为正时，名义利率低于通胀率即产生负真实利率——有时经济需要负真实利率来提供对总需求的足够刺激，零通胀排除了这种选择。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">通胀还使负真实利率成为可能</strong>：名义利率绝不会低于零（债权人可一直持有货币而不会以负利率贷出）；通胀为零时真实利率永远不可能是负的；通胀为正时，名义利率低于通胀率即产生负真实利率——有时经济需要负真实利率来提供对总需求的足够刺激，零通胀排除了这种选择。","label":"通胀还使负真实利率成为可能"},{"t":"前美联储副主席布林德在《冷静的头脑，仁慈的心》中的结论：达到低且温和通胀的代价非常适当——像社会得了重感冒而不是患了癌症；理性个体不会为治愈感冒而自愿做大手术，社会却用经济上的大手术（高失业）治疗类似感冒的通货膨胀——学会在温和通货膨胀之下生活会更好。","c":[],"k":"b","i":2,"h":"前美联储副主席布林德在《冷静的头脑，仁慈的心》中的结论：达到低且温和通胀的代价非常适当——像社会得了重感冒而不是患了癌症；理性个体不会为治愈感冒而自愿做大手术，社会却用经济上的大手术（高失业）治疗类似感冒的通货膨胀——学会在温和通货膨胀之下生活会更好。","label":"前美联储副主席布林德在《冷静的头脑，…"}],"k":"b","i":1,"h":"<strong class=\"lead\">反方</strong>：中央银行不应该把零通货膨胀作为目标","label":"反方：中央银行不应该把零通货膨胀作为目标"},{"t":"新闻摘录要点（新西兰人与通货膨胀：中央银行应如何选择通货膨胀的目标）","c":[{"t":"新西兰1989年《储备银行法》使其成为第一个为每年价格上升设定正式目标的国家（最初0~2%）：财政部长与央行行长共同设定通胀目标并赋予央行政治独立性，未达标的行长可能被解职；法案通过时通胀率为7.6%，到1991年底降到2%。","c":[],"k":"b","i":2,"h":"新西兰1989年《储备银行法》使其成为第一个为每年价格上升设定正式目标的国家（最初0~2%）：财政部长与央行行长共同设定通胀目标并赋予央行政治独立性，未达标的行长可能被解职；法案通过时通胀率为7.6%，到1991年底降到2%。","label":"新西兰1989年《储备银行法》使其成…"},{"t":"目标通过影响预期成为\"自我实现的目标\"：新西兰企业界和工会在工资谈判和定价时都从假定通胀率确为2%左右出发，随着工资和价格上涨放缓，目标自我实现；加拿大（1991年）、瑞典、英国等纷纷效仿，2%通胀目标成为世界上许多国家的标准，\"简直成了一种经济信仰\"。","c":[],"k":"b","i":2,"h":"目标通过影响预期成为&quot;自我实现的目标&quot;：新西兰企业界和工会在工资谈判和定价时都从假定通胀率确为2%左右出发，随着工资和价格上涨放缓，目标自我实现；加拿大（1991年）、瑞典、英国等纷纷效仿，2%通胀目标成为世界上许多国家的标准，&quot;简直成了一种经济信仰&quot;。","label":"目标通过影响预期成为\"自我实现的目标\""},{"t":"关于目标数字的两种立场：沃尔克、格林斯潘等主张更低乃至零通胀（通胀率需降到企业决策无须考虑的程度）；耶伦则担心零通胀使经济陷入瘫痪——\"润滑剂\"论：经济下滑时雇主保持名义工资不变、经通胀调整的真实工资下降，工厂无须靠裁员应对；且通胀水平越高，央行在深度低迷时降息空间越大——轻微通胀允许真实利率偶尔为负，这一点在日本通缩、2001年衰退和2007—2009年金融危机中显得颇有先见之明。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关于目标数字的两种立场</strong>：沃尔克、格林斯潘等主张更低乃至零通胀（通胀率需降到企业决策无须考虑的程度）；耶伦则担心零通胀使经济陷入瘫痪——&quot;润滑剂&quot;论：经济下滑时雇主保持名义工资不变、经通胀调整的真实工资下降，工厂无须靠裁员应对；且通胀水平越高，央行在深度低迷时降息空间越大——轻微通胀允许真实利率偶尔为负，这一点在日本通缩、2001年衰退和2007—2009年金融危机中显得颇有先见之明。","label":"关于目标数字的两种立场"},{"t":"近年的再思考：新西兰当初的0~2%带有相当的随意性（为影响公众预期而\"凭空创造\"）；IMF首席经济学家布兰查德等2010年发问——为增大应对重大冲击的货币政策空间，是否应把通胀目标定得更高（如4%）；反对理由：2%通胀下美元35年才贬值一半、4%下只要18年，且改变目标会引起金融市场混乱、长期利率突然快速上升从而拖累增长；目前央行家们认为提高目标代价太高（美联储副主席费希尔重申支持2%，耶伦也未表示希望重新考虑）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">近年的再思考</strong>：新西兰当初的0~2%带有相当的随意性（为影响公众预期而&quot;凭空创造&quot;）；IMF首席经济学家布兰查德等2010年发问——为增大应对重大冲击的货币政策空间，是否应把通胀目标定得更高（如4%）；反对理由：2%通胀下美元35年才贬值一半、4%下只要18年，且改变目标会引起金融市场混乱、长期利率突然快速上升从而拖累增长；目前央行家们认为提高目标代价太高（美联储副主席费希尔重申支持2%，耶伦也未表示希望重新考虑）。","label":"近年的再思考"}],"k":"b","i":1,"h":"<strong class=\"lead\">新闻摘录要点</strong>（新西兰人与通货膨胀：中央银行应如何选择通货膨胀的目标）","label":"新闻摘录要点"},{"t":"即问即答要点：把通胀降为零的成本是反通胀衰退的产量与就业损失（暂时的，但集中于弱势工人且可能留下持久印记），收益是消除六种通胀成本（持久的）；判断的关键在于分清\"暂时\"与\"持久\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：把通胀降为零的成本是反通胀衰退的产量与就业损失（暂时的，但集中于弱势工人且可能留下持久印记），收益是消除六种通胀成本（持久的）；判断的关键在于分清&quot;暂时&quot;与&quot;持久&quot;。","label":"即问即答要点"}],"k":"sec","i":0,"h":"36.4 中央银行应该把零通货膨胀作为目标吗","label":"36.4 中央银行应该把零通货膨胀作…"},{"t":"36.5 政府应该平衡其预算吗","c":[{"t":"问题背景：只要政府支出大于税收收入，就要发行政府债券弥补赤字；对金融市场的研究已说明预算赤字如何影响储蓄、投资和利率——但预算赤字是多大的问题？财政决策者是否应该高度重视平衡政府预算。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">问题背景</strong>：只要政府支出大于税收收入，就要发行政府债券弥补赤字；对金融市场的研究已说明预算赤字如何影响储蓄、投资和利率——但预算赤字是多大的问题？财政决策者是否应该高度重视平衡政府预算。","label":"问题背景"},{"t":"正方：政府应该平衡其预算","c":[{"t":"债务规模事实：美国联邦政府债务从1980年的7120亿美元增至2015年的约13.1万亿美元（书中131000亿美元），用债务总额除以人口总数，每人分摊的政府债务约为41000美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">债务规模事实</strong>：美国联邦政府债务从1980年的7120亿美元增至2015年的约13.1万亿美元（书中131000亿美元），用债务总额除以人口总数，每人分摊的政府债务约为41000美元。","label":"债务规模事实"},{"t":"最直接的影响是把负担加在子孙后代身上：债务和累积利息到期时，未来纳税人面临困难选择——以较高税收和较少政府支出的组合偿还，或借新债还旧债使政府陷入更深的债务；预算赤字实际上允许当代纳税人把某些政府支出的账单转移给下一代纳税人，继承这样的巨额债务将降低子孙后代的生活水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最直接的影响是把负担加在子孙后代身上</strong>：债务和累积利息到期时，未来纳税人面临困难选择——以较高税收和较少政府支出的组合偿还，或借新债还旧债使政府陷入更深的债务；预算赤字实际上允许当代纳税人把某些政府支出的账单转移给下一代纳税人，继承这样的巨额债务将降低子孙后代的生活水平。","label":"最直接的影响是把负担加在子孙后代身上"},{"t":"宏观经济影响链条：预算赤字代表负的公共储蓄，降低国民储蓄（私人储蓄与公共储蓄之和）；国民储蓄减少引起真实利率上升和投资减少；投资减少使一定时期内资本存量减少；资本存量减少降低劳动生产率、真实工资和经济中物品与服务的产量——政府债务增加时，子孙后代就出生在一个低收入和高税收的经济中。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">宏观经济影响链条</strong>：预算赤字代表负的公共储蓄，降低国民储蓄（私人储蓄与公共储蓄之和）；国民储蓄减少引起真实利率上升和投资减少；投资减少使一定时期内资本存量减少；资本存量减少降低劳动生产率、真实工资和经济中物品与服务的产量——政府债务增加时，子孙后代就出生在一个低收入和高税收的经济中。","label":"宏观经济影响链条"},{"t":"有些情况下有预算赤字是合理的：其一，战争——军事冲突暂时增加政府支出时借债筹资合理，否则战时税收不得不迅速增加，高税率极大扭曲纳税人激励导致严重无谓损失，且对已为战争做出牺牲的当代纳税人不公正；其二，经济活动暂时下降期——衰退时所得税和工薪税收入自动减少，若政府在衰退期竭力平衡预算，就不得不在高失业时增税或减支，在正需要刺激总需求的时候抑制总需求，倾向于加剧经济波动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有些情况下有预算赤字是合理的</strong>：其一，战争——军事冲突暂时增加政府支出时借债筹资合理，否则战时税收不得不迅速增加，高税率极大扭曲纳税人激励导致严重无谓损失，且对已为战争做出牺牲的当代纳税人不公正；其二，经济活动暂时下降期——衰退时所得税和工薪税收入自动减少，若政府在衰退期竭力平衡预算，就不得不在高失业时增税或减支，在正需要刺激总需求的时候抑制总需求，倾向于加剧经济波动。","label":"有些情况下有预算赤字是合理的"},{"t":"但并非所有赤字都可用战争或衰退解释：政府债务占GDP的百分比从1980年的26%上升到1995年的50%，该时期美国没有经历重大军事冲突和严重衰退，巨额赤字主要是因为总统和国会发现增加政府支出比增加税收更容易。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">但并非所有赤字都可用战争或衰退解释</strong>：政府债务占GDP的百分比从1980年的26%上升到1995年的50%，该时期美国没有经历重大军事冲突和严重衰退，巨额赤字主要是因为总统和国会发现增加政府支出比增加税收更容易。","label":"但并非所有赤字都可用战争或衰退解释"},{"t":"近年赤字或许可用伊拉克战争、阿富汗战争及2001年、2008—2009年衰退解释，但不应成为回到之前不可持续财政政策的信号：随着经济复苏、失业回到自然水平，政府应使支出与税收收入相平衡——与持续赤字相比，平衡预算意味着更多的国民储蓄、投资和更快的经济增长，未来的大学毕业生将进入一个更为繁荣的经济。","c":[],"k":"b","i":2,"h":"近年赤字或许可用伊拉克战争、阿富汗战争及2001年、2008—2009年衰退解释，但不应成为回到之前不可持续财政政策的信号：随着经济复苏、失业回到自然水平，政府应使支出与税收收入相平衡——与持续赤字相比，平衡预算意味着更多的国民储蓄、投资和更快的经济增长，未来的大学毕业生将进入一个更为繁荣的经济。","label":"近年赤字或许可用伊拉克战争、阿富汗战…"}],"k":"b","i":1,"h":"<strong class=\"lead\">正方</strong>：政府应该平衡其预算","label":"正方：政府应该平衡其预算"},{"t":"反方：政府不应该平衡其预算","c":[{"t":"政府债务问题往往被夸大：债务确实代表对年轻一代的税收负担，但与平均每人一生的收入相比并不算多——人均债务约41000美元，而工作40年、每年收入5万美元的人一生赚取200万美元，所承担的政府债务只占其一生收入的2%左右。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政府债务问题往往被夸大</strong>：债务确实代表对年轻一代的税收负担，但与平均每人一生的收入相比并不算多——人均债务约41000美元，而工作40年、每年收入5万美元的人一生赚取200万美元，所承担的政府债务只占其一生收入的2%左右。","label":"政府债务问题往往被夸大"},{"t":"孤立地看待预算赤字的影响容易导致误解：赤字只是政府如何筹集并支出资金整体情况的一部分，决策者以许多方式影响各代纳税人，应把预算赤字或盈余与其他政策放在一起考虑。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">孤立地看待预算赤字的影响容易导致误解</strong>：赤字只是政府如何筹集并支出资金整体情况的一部分，决策者以许多方式影响各代纳税人，应把预算赤字或盈余与其他政策放在一起考虑。","label":"孤立地看待预算赤字的影响容易导致误解"},{"t":"削减教育减赤可能适得其反：假设政府通过削减教育等公共投资减少赤字——年轻一代的债务变少、税收负担变轻，但若受的教育比原本能受的少，其生产率和收入将降低；对教育收益（多受一年教育引起的工人工资增加）的估算发现收益巨大——从整体考虑，减少赤字而不进行更多教育支出会使子孙后代状况变坏。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">削减教育减赤可能适得其反</strong>：假设政府通过削减教育等公共投资减少赤字——年轻一代的债务变少、税收负担变轻，但若受的教育比原本能受的少，其生产率和收入将降低；对教育收益（多受一年教育引起的工人工资增加）的估算发现收益巨大——从整体考虑，减少赤字而不进行更多教育支出会使子孙后代状况变坏。","label":"削减教育减赤可能适得其反"},{"t":"只关注赤字还转移了人们对其他代际收入再分配政策的注意：如20世纪60、70年代联邦政府增加对老年人的社会保障补助、以提高工作年龄人口的工薪税筹资——这种政策不影响政府债务，同样把年轻一代的收入再分配给年老一代；预算赤字只是政府政策如何影响各代人福利这个大问题的一小部分。","c":[],"k":"b","i":2,"h":"只关注赤字还转移了人们对其他代际收入再分配政策的注意：如20世纪60、70年代联邦政府增加对老年人的社会保障补助、以提高工作年龄人口的工薪税筹资——这种政策不影响政府债务，同样把年轻一代的收入再分配给年老一代；预算赤字只是政府政策如何影响各代人福利这个大问题的一小部分。","label":"只关注赤字还转移了人们对其他代际收入…"},{"t":"有远见的父母可以扭转政府债务的不利影响：通过储蓄并为子女留下较多遗产提高其承受未来税收负担的能力；一些经济学家认为人们实际上正是这样做的——若如此，父母较高的私人储蓄可抵消预算赤字的公共负储蓄，赤字不影响经济。多数经济学家不相信父母如此有远见，但有些人确实会这样做且任何人都可这样做——赤字使一些人有机会以子女的损失为代价消费，但并没有要求他们这样做。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有远见的父母可以扭转政府债务的不利影响</strong>：通过储蓄并为子女留下较多遗产提高其承受未来税收负担的能力；一些经济学家认为人们实际上正是这样做的——若如此，父母较高的私人储蓄可抵消预算赤字的公共负储蓄，赤字不影响经济。多数经济学家不相信父母如此有远见，但有些人确实会这样做且任何人都可这样做——赤字使一些人有机会以子女的损失为代价消费，但并没有要求他们这样做。","label":"有远见的父母可以扭转政府债务的不利影响"},{"t":"政府债务可以永远持续下去：正如银行评价贷款人时比较债务与收入，应相对国民收入规模评价债务负担；人口增长和技术进步使美国经济总收入一直增长，支付债务利息的能力也一直增长——只要政府债务的增长慢于国民收入的增长，就没有什么能阻止政府债务持续增长。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政府债务可以永远持续下去</strong>：正如银行评价贷款人时比较债务与收入，应相对国民收入规模评价债务负担；人口增长和技术进步使美国经济总收入一直增长，支付债务利息的能力也一直增长——只要政府债务的增长慢于国民收入的增长，就没有什么能阻止政府债务持续增长。","label":"政府债务可以永远持续下去"},{"t":"可持续性算术：美国真实产量年均增长约3%、通胀每年2%，名义收入每年增长约5%，因此政府债务每年增长5%也不会提高债务与收入之比；2015年债务131000亿美元的5%是6550亿美元——只要联邦预算赤字小于6550亿美元，这种政策就是可持续的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">可持续性算术</strong>：美国真实产量年均增长约3%、通胀每年2%，名义收入每年增长约5%，因此政府债务每年增长5%也不会提高债务与收入之比；2015年债务131000亿美元的5%是6550亿美元——只要联邦预算赤字小于6550亿美元，这种政策就是可持续的。","label":"可持续性算术"},{"t":"诚然巨大赤字不可能永远持续：2009—2012年每年赤字大于1万亿美元，由严重金融危机、巨大衰退及政府反应等不寻常情况所致，没人认为应持续；但对财政决策者而言，零预算赤字也是一个错误的目标——只要赤字是适度的，永远不会有政府借款结束或经济崩溃的那一天。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">诚然巨大赤字不可能永远持续</strong>：2009—2012年每年赤字大于1万亿美元，由严重金融危机、巨大衰退及政府反应等不寻常情况所致，没人认为应持续；但对财政决策者而言，零预算赤字也是一个错误的目标——只要赤字是适度的，永远不会有政府借款结束或经济崩溃的那一天。","label":"诚然巨大赤字不可能永远持续"}],"k":"b","i":1,"h":"<strong class=\"lead\">反方</strong>：政府不应该平衡其预算","label":"反方：政府不应该平衡其预算"},{"t":"即问即答要点：减少赤字使子孙后代状况变好，是通过减轻其未来税收负担、提高国民储蓄与投资进而提高未来收入；但存在比减少赤字更好地改善子孙后代生活的财政政策——如保持或增加教育等公共投资（削减教育减赤反而降低下一代的生产率与收入）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：减少赤字使子孙后代状况变好，是通过减轻其未来税收负担、提高国民储蓄与投资进而提高未来收入；但存在比减少赤字更好地改善子孙后代生活的财政政策——如保持或增加教育等公共投资（削减教育减赤反而降低下一代的生产率与收入）。","label":"即问即答要点"}],"k":"sec","i":0,"h":"36.5 政府应该平衡其预算吗","label":"36.5 政府应该平衡其预算吗"},{"t":"36.6 应该为了鼓励储蓄而修改税法吗","c":[{"t":"问题背景：一国生活水平取决于它生产物品与服务的能力（十大原理之一），生产能力又主要取决于为未来储蓄和投资了多少——决策者是否应该修改税法，以便鼓励更多的储蓄和投资。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">问题背景</strong>：一国生活水平取决于它生产物品与服务的能力（十大原理之一），生产能力又主要取决于为未来储蓄和投资了多少——决策者是否应该修改税法，以便鼓励更多的储蓄和投资。","label":"问题背景"},{"t":"正方：应该为了鼓励储蓄而修改税法","c":[{"t":"储蓄率是长期经济繁荣的关键决定因素：储蓄率较高时更多资源用于新工厂和设备投资，较大的资本存量提高劳动生产率、工资和收入；国际数据表明国民储蓄率和经济福利衡量指标之间有密切的相关性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">储蓄率是长期经济繁荣的关键决定因素</strong>：储蓄率较高时更多资源用于新工厂和设备投资，较大的资本存量提高劳动生产率、工资和收入；国际数据表明国民储蓄率和经济福利衡量指标之间有密切的相关性。","label":"储蓄率是长期经济繁荣的关键决定因素"},{"t":"人们会对激励做出反应（十大原理之一）：如果一国法律使储蓄有吸引力，人们就会把收入中更多的部分用于储蓄，高储蓄将使未来经济更加繁荣。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人们会对激励做出反应</strong>（十大原理之一）：如果一国法律使储蓄有吸引力，人们就会把收入中更多的部分用于储蓄，高储蓄将使未来经济更加繁荣。","label":"人们会对激励做出反应"},{"t":"美国税制通过对储蓄的收益征收重税而抑制储蓄：25岁工人为退休把1000美元存入支付10%利率的债券，不对利息征税时第45年年末将累积达72900美元；若面对40%的边际税率（联邦所得税加州所得税，许多工人的正常情况），税后利率仅6%，第45年年末仅累积13800美元——长期累积中，40%的利息税使1000美元储蓄的收益减少约80%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">美国税制通过对储蓄的收益征收重税而抑制储蓄</strong>：25岁工人为退休把1000美元存入支付10%利率的债券，不对利息征税时第45年年末将累积达72900美元；若面对40%的边际税率（联邦所得税加州所得税，许多工人的正常情况），税后利率仅6%，第45年年末仅累积13800美元——长期累积中，40%的利息税使1000美元储蓄的收益减少约80%。","label":"美国税制通过对储蓄的收益征收重税而抑制储蓄"},{"t":"税法还通过对某些形式的资本收入双重征税进一步抑制储蓄：用储蓄购买公司股票时，公司先就利润缴纳公司所得税，剩余利润以红利分配后股东再以个人所得税第二次纳税——双重征税大大减少股东收益、减少储蓄激励。","c":[],"k":"b","i":2,"h":"税法还通过对某些形式的资本收入双重征税进一步抑制储蓄：用储蓄购买公司股票时，公司先就利润缴纳公司所得税，剩余利润以红利分配后股东再以个人所得税第二次纳税——双重征税大大减少股东收益、减少储蓄激励。","label":"税法还通过对某些形式的资本收入双重征…"},{"t":"遗产税抑制代际财富转移：想把积累的财富留给子女时，大额遗产的税率可高达40%；人们对国民储蓄的担忧很大程度上出于保证子孙后代的经济繁荣，税法不鼓励一代人采用帮助下一代人的最直接方法是很奇怪的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">遗产税抑制代际财富转移</strong>：想把积累的财富留给子女时，大额遗产的税率可高达40%；人们对国民储蓄的担忧很大程度上出于保证子孙后代的经济繁荣，税法不鼓励一代人采用帮助下一代人的最直接方法是很奇怪的。","label":"遗产税抑制代际财富转移"},{"t":"税法之外的其他政策和制度也减少储蓄激励：福利和医疗补助等政府补助按家庭经济状况调查发放——过去节俭储蓄的人得到的补助减少；学院与大学的助学金也根据学生及其父母拥有的财富而定——如同对财富征税，抑制学生及其父母的储蓄。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">税法之外的其他政策和制度也减少储蓄激励</strong>：福利和医疗补助等政府补助按家庭经济状况调查发放——过去节俭储蓄的人得到的补助减少；学院与大学的助学金也根据学生及其父母拥有的财富而定——如同对财富征税，抑制学生及其父母的储蓄。","label":"税法之外的其他政策和制度也减少储蓄激励"},{"t":"改革方向之一：提高家庭利用税收优惠储蓄账户的能力——个人退休金账户（存入收入及其利息在退休提取前不征税）以及401(k)、403(b)和利润分成方案等已有优惠，但对资格有限制、可存入金额有限制、退休前提取要付罚金，对购房或学费等其他储蓄没有激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">改革方向之一</strong>：提高家庭利用税收优惠储蓄账户的能力——个人退休金账户（存入收入及其利息在退休提取前不征税）以及401(k)、403(b)和利润分成方案等已有优惠，但对资格有限制、可存入金额有限制、退休前提取要付罚金，对购房或学费等其他储蓄没有激励。","label":"改革方向之一"},{"t":"改革方向之二（更全面）：重新考虑政府征税的整个税基——美国税制以所得税为中心（赚到的每1美元无论用于支出还是储蓄都同样纳税），许多经济学家提出的另一种可选择的方案是消费税（家庭只对支出的部分纳税，用于储蓄的收入在提取并用于消费前免税）——相当于使所有储蓄自动成为个人退休金账户式的税收优惠账户，从所得税转向消费税会极大提高对储蓄的激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">改革方向之二</strong>（更全面）：重新考虑政府征税的整个税基——美国税制以所得税为中心（赚到的每1美元无论用于支出还是储蓄都同样纳税），许多经济学家提出的另一种可选择的方案是消费税（家庭只对支出的部分纳税，用于储蓄的收入在提取并用于消费前免税）——相当于使所有储蓄自动成为个人退休金账户式的税收优惠账户，从所得税转向消费税会极大提高对储蓄的激励。","label":"改革方向之二"}],"k":"b","i":1,"h":"<strong class=\"lead\">正方</strong>：应该为了鼓励储蓄而修改税法","label":"正方：应该为了鼓励储蓄而修改税法"},{"t":"反方：不应该为了鼓励储蓄而修改税法","c":[{"t":"增加储蓄可能是合意的，但不是税收政策的唯一目标：决策者还必须保证公平地分配税收负担，而提高储蓄激励的建议增加了那些承受能力最弱的人的税收负担。","c":[],"k":"b","i":2,"h":"增加储蓄可能是合意的，但不是税收政策的唯一目标：决策者还必须保证公平地分配税收负担，而提高储蓄激励的建议增加了那些承受能力最弱的人的税收负担。","label":"增加储蓄可能是合意的，但不是税收政策的唯一目标"},{"t":"不公平：高收入家庭的储蓄占收入的比例高于低收入家庭，任何有利于储蓄者的税收变动往往也有利于高收入者——退休金账户税收优惠等政策通过减少富人的税收负担，迫使政府增加穷人的税收负担，使社会更不平等。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不公平</strong>：高收入家庭的储蓄占收入的比例高于低收入家庭，任何有利于储蓄者的税收变动往往也有利于高收入者——退休金账户税收优惠等政策通过减少富人的税收负担，迫使政府增加穷人的税收负担，使社会更不平等。","label":"不公平：高收入家庭的储蓄占收入的比例…"},{"t":"未必有效：经济理论对高收益率能否增加储蓄没有明确预测，结果取决于替代效应与收入效应的相对大小——较高的收益率提高储蓄的利益（现在储蓄的每1美元带来未来更多消费，替代效应倾向于增加储蓄），同时降低储蓄的必要（少储蓄也能达到未来任一目标消费水平，收入效应倾向于减少储蓄）；如果如一些研究表明的两者接近相互抵消，降低资本收益税提高收益率时储蓄不会改变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">未必有效</strong>：经济理论对高收益率能否增加储蓄没有明确预测，结果取决于替代效应与收入效应的相对大小——较高的收益率提高储蓄的利益（现在储蓄的每1美元带来未来更多消费，替代效应倾向于增加储蓄），同时降低储蓄的必要（少储蓄也能达到未来任一目标消费水平，收入效应倾向于减少储蓄）；如果如一些研究表明的两者接近相互抵消，降低资本收益税提高收益率时储蓄不会改变。","label":"未必有效"},{"t":"增加国民储蓄有其他方法：国民储蓄是私人储蓄与公共储蓄之和——不通过改变税法鼓励私人储蓄，决策者也可以通过减少预算赤字或提高对富人的税收来增加公共储蓄，这是增加国民储蓄并增进子孙后代福利的直接方法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">增加国民储蓄有其他方法</strong>：国民储蓄是私人储蓄与公共储蓄之和——不通过改变税法鼓励私人储蓄，决策者也可以通过减少预算赤字或提高对富人的税收来增加公共储蓄，这是增加国民储蓄并增进子孙后代福利的直接方法。","label":"增加国民储蓄有其他方法"},{"t":"考虑公共储蓄后激励条款可能适得其反：减少资本收益税的税收变动减少政府收入、引起较大的预算赤字——所刺激的私人储蓄增加必须大于公共储蓄的减少才能增加国民储蓄；若非如此，所谓的储蓄激励政策反而使问题恶化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">考虑公共储蓄后激励条款可能适得其反</strong>：减少资本收益税的税收变动减少政府收入、引起较大的预算赤字——所刺激的私人储蓄增加必须大于公共储蓄的减少才能增加国民储蓄；若非如此，所谓的储蓄激励政策反而使问题恶化。","label":"考虑公共储蓄后激励条款可能适得其反"}],"k":"b","i":1,"h":"<strong class=\"lead\">反方</strong>：不应该为了鼓励储蓄而修改税法","label":"反方：不应该为了鼓励储蓄而修改税法"},{"t":"即问即答要点：美国社会不鼓励储蓄的例子——对利息收入征收重税、对公司利润与红利的双重征税、高达40%的遗产税、按经济状况调查的福利补助与大学助学金对有财富者的惩罚；取消这些抑制措施的弊端主要在公平——储蓄者多为富人，取消抑制会以增加穷人税负为代价使富人受益，加剧不平等。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：美国社会不鼓励储蓄的例子——对利息收入征收重税、对公司利润与红利的双重征税、高达40%的遗产税、按经济状况调查的福利补助与大学助学金对有财富者的惩罚；取消这些抑制措施的弊端主要在公平——储蓄者多为富人，取消抑制会以增加穷人税负为代价使富人受益，加剧不平等。","label":"即问即答要点"}],"k":"sec","i":0,"h":"36.6 应该为了鼓励储蓄而修改税法吗","label":"36.6 应该为了鼓励储蓄而修改税法吗"}],"k":"chap","h":"第36章 宏观经济政策的六个争论问题","label":"第36章 宏观经济政策的六个争论问题"}],"k":"part","h":"第13篇 最后的思考","label":"第13篇 最后的思考","col":"#2563eb","pc":"p6"}],"k":"root","h":"<strong class=\"lead\">宏观经济学</strong>（曼昆","label":"ROOT"};

// 分词：英文/数字串保持完整（可断在连字符后），其余逐字符；避免英文单词被硬切断
function tokenize(t){
  const out = []; const re = /[A-Za-z0-9][A-Za-z0-9'&+./·-]*(?:-[A-Za-z0-9][A-Za-z0-9'&+./·-]*)*-?|\s+|[\s\S]/g;
  let m; while ((m = re.exec(t))) out.push(m[0]);
  return out;
}
function wrapTokens(t, cf){
  const maxW = cf.maxW - 26;
  const W = s => ctx.measureText(s).width;
  const lines = []; let cur = "";
  const pushCur = () => { if (cur){ lines.push(cur.replace(/\s+$/, "")); cur = ""; } };
  for (const tk of tokenize(t)){
    if (/^\s+$/.test(tk)){ if (cur) cur += " "; continue; }
    if (cur && W(cur + tk) > maxW) pushCur();
    if (W(tk) > maxW){                       // 单 token 超宽（超长英文/URL）按字符硬断
      let s = tk;
      while (W(s) > maxW){
        let lo = 1, hi = s.length;
        while (lo < hi){ const mid = (lo + hi + 1) >> 1; if (W(s.slice(0, mid)) <= maxW) lo = mid; else hi = mid - 1; }
        lines.push(s.slice(0, lo)); s = s.slice(lo);
      }
      cur = s; continue;
    }
    cur += tk;
  }
  pushCur();
  if (lines.length <= cf.maxLines) return lines;
  const rest = lines.slice(cf.maxLines - 1).join(" ");
  let last = "";
  for (const tk of tokenize(rest)){
    if (/^\s+$/.test(tk)){ if (last) last += " "; continue; }
    if (W(last + tk + "…") > maxW) break;
    last += tk;
  }
  if (!last){ let s = rest; while (W(s + "…") > maxW && s.length > 1) s = s.slice(0, -1); last = s; }
  return lines.slice(0, cf.maxLines - 1).concat([last + "…"]);
}
walkAll(DATA, n => {
  const cf = CFG[n.k] || CFG.b;
  ctx.font = (cf.bold ? "600 " : "") + cf.fs + 'px -apple-system,"PingFang SC",sans-serif';
  n._lines = wrapTokens(n.label || n.t, cf);
  n._lw = Math.max.apply(null, n._lines.map(l => ctx.measureText(l).width));
  n._w = Math.min(cf.maxW, n._lw + 24);
  n._h = n._lines.length * (cf.fs * 1.32) + 10;
  n.open = OPENKINDS.indexOf(n.k) >= 0;
});

// 列 x 坐标（每层取该层最宽节点保证不重叠）
const colX = [0];
(function(){
  let x = 0;
  for (const k of ["root", "part", "chap", "sec"]){
    let mw = 120;
    walkAll(DATA, n => { if (n.k === k) mw = Math.max(mw, n._w); });
    x += mw + 48; colX.push(x);
  }
  for (let d = 4; d <= 9; d++){ colX.push(x); x += 120; }
})();
const colXOf = d => colX[Math.min(d, colX.length - 1)] + (d > 9 ? (d - 9) * 0 : 0);

// ---------- 布局 + 渲染 ----------
const svg = document.getElementById("svg"), vp = document.getElementById("vp");
let cursorY = 0, lastMaxX = 300, vis = [];
function layout(n, depth){
  n._d = depth; n._x = colXOf(depth);
  const kids = (n.c && n.open) ? n.c : [];
  if (!kids.length){ n._y = cursorY + n._h / 2 + 6; cursorY += n._h + 12; return n._y; }
  const ys = kids.map(k => layout(k, depth + 1));
  n._y = (ys[0] + ys[ys.length - 1]) / 2;
  return n._y;
}
function esc(s){ return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function renderMap(){
  cursorY = 0; vis = [];
  layout(DATA, 0);
  let links = "", nodes = "";
  (function link(n){
    const kids = (n.c && n.open) ? n.c : [];
    for (const k of kids){
      const x1 = n._x + n._w, y1 = n._y, x2 = k._x, y2 = k._y;
      const dx = Math.max(24, (x2 - x1) * 0.5);
      const col = partColor(k);
      const op = ((k.k === "part" || k.k === "chap") ? 0.8 : (k.k === "sec" ? 0.5 : 0.4)) * (_searchOn && !k._hit && !k._path ? 0.15 : 1);
      const sw = k.k === "part" ? 2.6 : (k.k === "chap" ? 1.8 : 1.5);
      links += '<path d="M' + x1 + ',' + y1.toFixed(1) + ' C' + (x1 + dx) + ',' + y1.toFixed(1) + ' ' +
               (x2 - dx) + ',' + y2.toFixed(1) + ' ' + x2 + ',' + y2.toFixed(1) +
               '" fill="none" stroke="' + col + '" stroke-opacity="' + op + '" stroke-width="' + sw + '"/>';
      link(k);
    }
  })(DATA);
  (function draw(n){
    vis.push(n);
    lastMaxX = Math.max(lastMaxX, n._x + n._w);
    const cf = CFG[n.k] || CFG.b, col = partColor(n);
    const dark = n.k === "root" || n.k === "part";
    const fill = dark ? (n.k === "root" ? "#2f3440" : col) : (n.k === "chap" ? "#ffffff" : (n.k === "sec" ? "#eef2ff" : "#fcfcfc"));
    const hit = !!n._hit;
    const dim = _searchOn && !hit && !n._path;
    const stroke = hit ? "#e25563" : (dark ? "none" : (n.k === "chap" ? col : (n.k === "sec" ? "#c7d2fe" : "#e7e5de")));
    const sw = hit ? 2.2 : (dark ? 0 : (n.k === "chap" ? 1.7 : (n.k === "sec" ? 1.3 : 1)));
    const txt = dark ? "#fff" : (n.k === "chap" ? "#1f1f1f" : (n.k === "sec" ? "#1e3a8a" : "#5a5a55"));
    let tspans = "";
    n._lines.forEach((l, i) => {
      tspans += '<tspan x="' + (n._x + 12) + '" y="' + (n._y - n._h / 2 + cf.fs * 1.32 * (i + 0.82)).toFixed(1) + '">' + esc(l) + '</tspan>';
    });
    const dashAttr = hit ? ' stroke-dasharray="5 3"' : "";
    nodes += '<g class="pill" style="cursor:' + ((n.c && n.c.length) ? "pointer" : "default") + '"' + (dim ? ' opacity="0.18"' : "") + '>' +
      '<rect x="' + n._x + '" y="' + (n._y - n._h / 2).toFixed(1) + '" width="' + n._w.toFixed(1) +
      '" height="' + n._h.toFixed(1) + '" rx="7" fill="' + fill + '" stroke="' + stroke +
      '" stroke-width="' + sw + '"' + dashAttr + '/>' +
      '<text font-size="' + cf.fs + '" font-weight="' + (cf.bold ? 600 : 400) + '" fill="' + txt + '">' + tspans + '</text>' +
      '<title>' + esc(n.t) + '</title></g>';
    ((n.c && n.open) ? n.c : []).forEach(draw);
  })(DATA);
  vp.innerHTML = links + nodes;
  const gs = vp.querySelectorAll("g.pill");
  gs.forEach((g, i) => {
    g.addEventListener("click", e => {
      const n = vis[i];
      if (!n || !n.c || !n.c.length) return;
      e.stopPropagation();
      n.open = !n.open;
      renderMap();
      const bb = svg.getBoundingClientRect();
      tf.y = bb.height / 2 - n._y * tf.s;
      const sx = n._x * tf.s + tf.x;
      if (sx < 60) tf.x += 60 - sx;
      applyTf();
    });
  });
}

// ---------- 缩放平移 ----------
let tf = { x: 0, y: 0, s: 1 };
function applyTf(){ vp.setAttribute("transform", "translate(" + tf.x + "," + tf.y + ") scale(" + tf.s + ")"); }
function fitView(){
  const bb = svg.getBoundingClientRect();
  const h = Math.max(cursorY, 120), w = Math.max(lastMaxX + 60, 400);
  const s = Math.max(0.15, Math.min((bb.width - 70) / w, (bb.height - 70) / h, 0.85));
  tf = { s: s, x: (bb.width - w * s) / 2, y: (bb.height - h * s) / 2 };
  applyTf();
}
const viewMap = document.getElementById("viewMap");
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const bb = svg.getBoundingClientRect(), mx = e.clientX - bb.left, my = e.clientY - bb.top;
  tf.x = mx - (mx - tf.x) * k; tf.y = my - (my - tf.y) * k;
  tf.s = Math.min(3, Math.max(0.08, tf.s * k));
  applyTf();
}, { passive: false });
let drag = null;
svg.addEventListener("mousedown", e => { drag = { x: e.clientX, y: e.clientY, tx: tf.x, ty: tf.y }; viewMap.classList.add("dragging"); });
window.addEventListener("mousemove", e => { if (!drag) return; tf.x = drag.tx + e.clientX - drag.x; tf.y = drag.ty + e.clientY - drag.y; applyTf(); });
window.addEventListener("mouseup", () => { drag = null; viewMap.classList.remove("dragging"); });
svg.addEventListener("dblclick", e => { if (e.target === svg) fitView(); });
// 触摸：单指拖动、双指捏合缩放
let tstart = null, tdist = 0;
viewMap.addEventListener("touchstart", e => {
  if (e.touches.length === 1){ const t = e.touches[0]; tstart = { x: t.clientX, y: t.clientY, tx: tf.x, ty: tf.y }; }
  else if (e.touches.length === 2){ tdist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); tstart = null; }
}, { passive: true });
viewMap.addEventListener("touchmove", e => {
  if (e.touches.length === 1 && tstart){
    e.preventDefault();
    const t = e.touches[0];
    tf.x = tstart.tx + t.clientX - tstart.x; tf.y = tstart.ty + t.clientY - tstart.y;
    applyTf();
  } else if (e.touches.length === 2 && tdist){
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const bb = svg.getBoundingClientRect();
    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - bb.left, my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - bb.top;
    const k = Math.min(3, Math.max(0.08, tf.s * d / tdist));
    tf.x = mx - (mx - tf.x) * (k / tf.s); tf.y = my - (my - tf.y) * (k / tf.s);
    tf.s = k; tdist = d;
    applyTf();
  }
}, { passive: false });
viewMap.addEventListener("touchend", () => { tstart = null; tdist = 0; });  // 双击空白复位

// ---------- 大纲视图 ----------
const otree = document.getElementById("otree");
function buildOutline(n){
  if (n.c && n.c.length){
    const d = document.createElement("details");
    d.className = n.k === "part" ? ("part " + n.pc) : n.k;
    d.open = n.k === "root" || n.k === "part" || n.k === "chap";
    const s = document.createElement("summary"); s.innerHTML = n.h || ""; d.appendChild(s);
    const kids = document.createElement("div"); kids.className = "kids";
    n.c.forEach(c => kids.appendChild(buildOutline(c)));
    d.appendChild(kids);
    return d;
  }
  const dv = document.createElement("div"); dv.className = "leaf " + n.k; dv.innerHTML = n.h || "";
  return dv;
}
otree.appendChild(buildOutline(DATA));

// ---------- 视图切换 ----------
let view = "map";
function showView(v){
  view = v;
  document.getElementById("tabMap").classList.toggle("on", v === "map");
  document.getElementById("tabOutline").classList.toggle("on", v === "outline");
  viewMap.style.display = v === "map" ? "block" : "none";
  document.getElementById("viewOutline").style.display = v === "outline" ? "block" : "none";
  if (v === "map"){ renderMap(); applyTf(); }
}
document.getElementById("tabMap").onclick = () => showView("map");
document.getElementById("tabOutline").onclick = () => showView("outline");
document.getElementById("fit").onclick = () => { if (view === "map") fitView(); };

function setOpenAll(deep){
  walkAll(DATA, n => { if (n.c) n.open = deep ? true : TOPKINDS.indexOf(n.k) >= 0; });
  if (view === "map"){ renderMap(); fitView(); }
  else otree.querySelectorAll("details").forEach(d => d.open = d.classList.contains("root") || d.classList.contains("part") || d.classList.contains("chap"));
}
document.getElementById("expand").onclick = () => setOpenAll(true);
document.getElementById("collapse").onclick = () => setOpenAll(false);

// ---------- 搜索 ----------
const q = document.getElementById("q"), hitsEl = document.getElementById("hits");
let timer = null, _searchOn = false;
q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(doSearch, 150); });
q.addEventListener("keydown", e => { if (e.key === "Escape"){ q.value = ""; doSearch(); } });
function clearMarks(){ document.querySelectorAll("mark").forEach(m => m.replaceWith(document.createTextNode(m.textContent))); }
function setHits(t){ hitsEl.textContent = t; hitsEl.style.display = t ? "inline" : "none"; }
function doSearch(){
  const kw = q.value.trim().toLowerCase();
  clearMarks();
  walkAll(DATA, n => { n._hit = false; n._path = false; });
  _searchOn = kw !== "";
  if (!kw){
    setHits("");
    otree.querySelectorAll(".hide").forEach(el => el.classList.remove("hide"));
    otree.querySelectorAll("details").forEach(d => d.open = d.classList.contains("root") || d.classList.contains("part") || d.classList.contains("chap"));
    setOpenDefault(); renderMap(); fitView();
    return;
  }
  const matches = [];
  walkAll(DATA, n => { if (n.t.toLowerCase().indexOf(kw) >= 0){ n._hit = true; matches.push(n); } });
  matches.forEach(m => { let p = m._p; while (p){ p._path = true; p = p._p; } });
  if (view === "map"){
    matches.forEach(m => { let p = m._p; while (p){ p.open = true; p = p._p; } });
    renderMap();
    setHits(matches.length ? matches.length + " 处命中" : "无命中");
    if (matches.length){
      if (tf.s < 0.3) tf.s = 0.5;   // 防御：过小缩放下命中不可读
      const n = matches[0], bb = svg.getBoundingClientRect();
      tf.x = bb.width / 2 - (n._x + n._w / 2) * tf.s;
      tf.y = bb.height / 2 - n._y * tf.s;
      applyTf();
    }
  } else {
    const details = Array.from(otree.querySelectorAll("details"));
    const leaves = Array.from(otree.querySelectorAll(".leaf"));
    const els = details.map(d => ({ el: d, tx: d.querySelector("summary").textContent, isD: true }))
      .concat(leaves.map(l => ({ el: l, tx: l.textContent, isD: false })));
    const anc = new Set();
    for (const n of els) if (n.tx.toLowerCase().indexOf(kw) >= 0){
      let p = n.el.parentElement;
      while (p && p !== otree){ const dd = p.closest ? p.closest("details") : null; if (dd) anc.add(dd); p = p.parentElement; }
    }
    for (const n of els){
      const hit = n.tx.toLowerCase().indexOf(kw) >= 0;
      n.el.classList.toggle("hide", !(hit || anc.has(n.el)));
      if (n.isD && (hit || anc.has(n.el))) n.el.open = true;
    }
    let nHit = 0;
    for (const n of els) if (n.tx.toLowerCase().indexOf(kw) >= 0) nHit++;
    setHits(nHit + " 处命中");
    otree.querySelectorAll("summary, .leaf").forEach(el => {
      const t = el.childNodes[0];
      if (t && t.nodeType === 3){
        const idx = t.textContent.toLowerCase().indexOf(kw);
        if (idx >= 0){
          const range = document.createRange();
          range.setStart(t, idx); range.setEnd(t, idx + kw.length);
          try { const mk = document.createElement("mark"); range.surroundContents(mk); } catch (e) {}
        }
      }
    });
  }
}
function setOpenDefault(){ walkAll(DATA, n => { if (n.c) n.open = OPENKINDS.indexOf(n.k) >= 0; }); }

// ---------- 初始化 ----------
showView("map");
fitView();
if (window.innerWidth < 760) showView("outline");  // 手机默认大纲视图  // 同步执行：rAF 在标签页不可见时会被推迟，若拖到搜索之后会覆盖定位
</script>
</body>
</html>
