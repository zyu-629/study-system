价单位的真实价值。","label":"机制：货币是计价单位，是用来表示价格…"},{"t":"后果：通胀使不同时期的美元具有不同真实价值——税法错误衡量真实收入，会计师也难以计算企业利润（收益与成本的差额），使投资者难以区分成功与不成功的企业，从而抑制金融市场把经济中的储蓄配置到不同类型投资中的作用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">后果</strong>：通胀使不同时期的美元具有不同真实价值——税法错误衡量真实收入，会计师也难以计算企业利润（收益与成本的差额），使投资者难以区分成功与不成功的企业，从而抑制金融市场把经济中的储蓄配置到不同类型投资中的作用。","label":"后果：通胀使不同时期的美元具有不同真…"}],"k":"b","i":1,"h":"30.2.6 混乱与不方便","label":"30.2.6 混乱与不方便"},{"t":"30.2.7 未预期到的通货膨胀的特殊成本：任意的财富再分配","c":[{"t":"适用前提：前面各项成本在通胀稳定、可预期时也会发生；当通胀出乎意料时还会产生额外成本——以一种既与价值无关又与需求无关的方式在人们之间重新分配财富，因为经济中许多贷款按计价单位（货币）规定条件。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">适用前提</strong>：前面各项成本在通胀稳定、可预期时也会发生；当通胀出乎意料时还会产生额外成本——以一种既与价值无关又与需求无关的方式在人们之间重新分配财富，因为经济中许多贷款按计价单位（货币）规定条件。","label":"适用前提"},{"t":"书中示例：学生Sam以7%利率从大银行贷款2万美元、10年后到期，按复利将欠4万美元——若这10年发生超速通胀，工资物价高涨，Sam用一点儿零钱即可还清（通胀降低债务真实价值，债务人受益、债权人受损）；若发生严重通货紧缩，工资物价下降，4万美元债务的真实负担比预期大得多（债权人受益、债务人受损）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中示例</strong>：学生Sam以7%利率从大银行贷款2万美元、10年后到期，按复利将欠4万美元——若这10年发生超速通胀，工资物价高涨，Sam用一点儿零钱即可还清（通胀降低债务真实价值，债务人受益、债权人受损）；若发生严重通货紧缩，工资物价下降，4万美元债务的真实负担比预期大得多（债权人受益、债务人受损）。","label":"书中示例"},{"t":"预期的作用：若通胀可预期，名义利率可将其纳入（费雪效应）；若难以预期，通胀就把风险加在都想规避它的债务人和债权人身上。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">预期的作用</strong>：若通胀可预期，名义利率可将其纳入（费雪效应）；若难以预期，通胀就把风险加在都想规避它的债务人和债权人身上。","label":"预期的作用"},{"t":"通胀水平与波动性的关系：平均通胀率高的国家通胀往往特别多变且不确定（平均通胀低的国家往往通胀稳定），尚未发现高而稳定的通胀经济——实行高通胀货币政策的国家既要承受预期中的高通胀成本，又要承受与未预期到的通胀相关的任意财富再分配的成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">通胀水平与波动性的关系</strong>：平均通胀率高的国家通胀往往特别多变且不确定（平均通胀低的国家往往通胀稳定），尚未发现高而稳定的通胀经济——实行高通胀货币政策的国家既要承受预期中的高通胀成本，又要承受与未预期到的通胀相关的任意财富再分配的成本。","label":"通胀水平与波动性的关系"}],"k":"b","i":1,"h":"<strong class=\"lead\">30.2.7 未预期到的通货膨胀的特殊成本</strong>：任意的财富再分配","label":"30.2.7 未预期到的通货膨胀的特殊成本"},{"t":"30.2.8 通货膨胀是糟糕的，但通货紧缩可能更糟","c":[{"t":"通货紧缩的潜在好处：米尔顿·弗里德曼认为小幅且可预期的通货紧缩可能合意——通货紧缩降低名义利率（费雪效应），持有货币的皮鞋成本在名义利率接近零时最低，这要求通货紧缩等于真实利率，称为弗里德曼规则。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">通货紧缩的潜在好处</strong>：米尔顿·弗里德曼认为小幅且可预期的通货紧缩可能合意——通货紧缩降低名义利率（费雪效应），持有货币的皮鞋成本在名义利率接近零时最低，这要求通货紧缩等于真实利率，称为弗里德曼规则。","label":"通货紧缩的潜在好处"},{"t":"通货紧缩的成本：有些成本与通胀相对应（物价下降同样引起菜单成本与相对价格变动）；且通货紧缩很少稳定、可预期，更常突然而至，引起财富从债务人向债权人的再分配——债务人通常更穷，这种再分配痛苦更大（日本1998—2012年物价总水平约下跌4%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">通货紧缩的成本</strong>：有些成本与通胀相对应（物价下降同样引起菜单成本与相对价格变动）；且通货紧缩很少稳定、可预期，更常突然而至，引起财富从债务人向债权人的再分配——债务人通常更穷，这种再分配痛苦更大（日本1998—2012年物价总水平约下跌4%）。","label":"通货紧缩的成本"},{"t":"更重要的一点：通货紧缩通常源自更广泛的宏观经济困境——货币紧缩→物价下降→经济中物品与服务的总需求减少→收入减少、失业增加；通货紧缩往往是更深层经济问题的症状。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">更重要的一点</strong>：通货紧缩通常源自更广泛的宏观经济困境——货币紧缩→物价下降→经济中物品与服务的总需求减少→收入减少、失业增加；通货紧缩往往是更深层经济问题的症状。","label":"更重要的一点"},{"t":"案例研究「《奥兹国历险记》与银币自由铸造的争论」要点：1880—1896年美国物价水平下降23%，未预期到的通货紧缩使债务真实价值上升、财富从作为债务人的西部农民再分配给东部银行；人民党主张银币自由铸造（当时美国实行金本位，黄金数量决定货币供给与物价；加入白银将增加货币供给、推高物价、减轻农民债务负担），1896年民主党总统候选人Bryan因此败于坚持金本位的McKinley；该书作者以黄砖路喻金本位、银拖鞋喻白银主张；人民党虽输掉争论，但1898年克朗代克与南非黄金发现使货币供给和物价回升，15年内物价回到19世纪80年代水平，农民最终得到了想要的通胀。","c":[],"k":"b","i":2,"h":"案例研究「《奥兹国历险记》与银币自由铸造的争论」要点：1880—1896年美国物价水平下降23%，未预期到的通货紧缩使债务真实价值上升、财富从作为债务人的西部农民再分配给东部银行；人民党主张银币自由铸造（当时美国实行金本位，黄金数量决定货币供给与物价；加入白银将增加货币供给、推高物价、减轻农民债务负担），1896年民主党总统候选人Bryan因此败于坚持金本位的McKinley；该书作者以黄砖路喻金本位、银拖鞋喻白银主张；人民党虽输掉争论，但1898年克朗代克与南非黄金发现使货币供给和物价回升，15年内物价回到19世纪80年代水平，农民最终得到了想要的通胀。","label":"案例研究「《奥兹国历险记》与银币自由…"}],"k":"b","i":1,"h":"30.2.8 通货膨胀是糟糕的，但通货紧缩可能更糟","label":"30.2.8 通货膨胀是糟糕的，但通…"}],"k":"sec","i":0,"h":"30.2 通货膨胀的成本","label":"30.2 通货膨胀的成本"},{"t":"30.3 结论","c":[{"t":"成因：通货膨胀的主要原因是货币量增加——当中央银行创造大量货币时，货币价值迅速下降；为维持物价稳定，中央银行必须保持对货币供给的严格控制。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">成因</strong>：通货膨胀的主要原因是货币量增加——当中央银行创造大量货币时，货币价值迅速下降；为维持物价稳定，中央银行必须保持对货币供给的严格控制。","label":"成因：通货膨胀的主要原因是货币量增加…"},{"t":"成本：较为隐蔽，包括皮鞋成本、菜单成本、相对价格变动的加剧、意想不到的税收负担变动、混乱与不方便、任意的财富再分配；超速通胀时期巨大，温和通胀时期（每年物价上升小于10%）大小尚无定论。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">成本</strong>：较为隐蔽，包括皮鞋成本、菜单成本、相对价格变动的加剧、意想不到的税收负担变动、混乱与不方便、任意的财富再分配；超速通胀时期巨大，温和通胀时期（每年物价上升小于10%）大小尚无定论。","label":"成本：较为隐蔽，包括皮鞋成本、菜单成…"},{"t":"通货膨胀的矛盾结论：长期中货币政策是中性的，但当经济转向低通胀时，货币政策的变动也会对生产和就业产生不利影响——短期中货币政策对真实变量具有重要影响，短期货币非中性的原因将在后面章节讨论。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">通货膨胀的矛盾结论</strong>：长期中货币政策是中性的，但当经济转向低通胀时，货币政策的变动也会对生产和就业产生不利影响——短期中货币政策对真实变量具有重要影响，短期货币非中性的原因将在后面章节讨论。","label":"通货膨胀的矛盾结论"}],"k":"sec","i":0,"h":"30.3 结论","label":"30.3 结论"}],"k":"chap","h":"第30章 货币增长与通货膨胀","label":"第30章 货币增长与通货膨胀"}],"k":"part","h":"第10篇 长期中的货币与物价","label":"第10篇 长期中的货币与物价","col":"#e08a1e","pc":"p3"},{"t":"第11篇 开放经济的宏观经济学","c":[{"t":"第31章 开放经济的宏观经济学：基本概念","c":[{"t":"本章内容提要","c":[{"t":"封闭经济不与世界上其他经济相互交易，开放经济与世界上其他经济自由交易；本章介绍描述开放经济的基本宏观经济变量——出口、进口、贸易余额和汇率，下一章再解释这些变量如何被决定。","c":[],"k":"b","i":1,"h":"封闭经济不与世界上其他经济相互交易，开放经济与世界上其他经济自由交易；本章介绍描述开放经济的基本宏观经济变量——出口、进口、贸易余额和汇率，下一章再解释这些变量如何被决定。","label":"封闭经济不与世界上其他经济相互交易，…"},{"t":"净出口（出口减进口，又称贸易余额）衡量物品与服务的国际流动，资本净流出（本国居民购买的外国资产减外国人购买的本国资产）衡量资本的国际流动；对整个经济而言，资本净流出必然总是等于净出口（NCO=NX）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">净出口</strong>（出口减进口，又称贸易余额）衡量物品与服务的国际流动，资本净流出（本国居民购买的外国资产减外国人购买的本国资产）衡量资本的国际流动；对整个经济而言，资本净流出必然总是等于净出口（NCO=NX）。","label":"净出口（出口减进口，又称贸易余额）衡…"},{"t":"开放经济中储蓄有两种用途：国民储蓄＝国内投资＋资本净流出（S=I+NCO）；贸易盈余国储蓄大于投资、资本流出，贸易赤字国储蓄小于投资、资本流入。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">开放经济中储蓄有两种用途</strong>：国民储蓄＝国内投资＋资本净流出（S=I+NCO）；贸易盈余国储蓄大于投资、资本流出，贸易赤字国储蓄小于投资、资本流入。","label":"开放经济中储蓄有两种用途"},{"t":"名义汇率是一国通货交换另一国通货的比率，真实汇率是一国物品与服务交换另一国物品与服务的比率（真实汇率＝名义汇率×国内价格÷国外价格）；真实汇率是净出口的关键决定因素。","c":[],"k":"b","i":1,"h":"名义汇率是一国通货交换另一国通货的比率，真实汇率是一国物品与服务交换另一国物品与服务的比率（真实汇率＝名义汇率×国内价格÷国外价格）；真实汇率是净出口的关键决定因素。","label":"名义汇率是一国通货交换另一国通货的比…"},{"t":"购买力平价理论认为任何一单位通货都应该能在所有国家买到等量物品，其逻辑基础是一价定律与套利；它意味着名义汇率反映两国物价水平（e=P*/P），通胀高的国家通货趋于贬值；其局限在于许多物品不易贸易、可贸易物品也不总能完全替代。","c":[],"k":"b","i":1,"h":"购买力平价理论认为任何一单位通货都应该能在所有国家买到等量物品，其逻辑基础是一价定律与套利；它意味着名义汇率反映两国物价水平（e=P*/P），通胀高的国家通货趋于贬值；其局限在于许多物品不易贸易、可贸易物品也不总能完全替代。","label":"购买力平价理论认为任何一单位通货都应…"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"31.1 物品与资本的国际流动","c":[{"t":"引论","c":[{"t":"开放经济以两种方式与其他经济相互交易：在世界产品市场上购买并出售物品与服务；在世界金融市场上购买并出售股票和债券这类资本性资产。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">开放经济以两种方式与其他经济相互交易</strong>：在世界产品市场上购买并出售物品与服务；在世界金融市场上购买并出售股票和债券这类资本性资产。","label":"开放经济以两种方式与其他经济相互交易"}],"k":"b","i":1,"h":"引论","label":"引论"},{"t":"31.1.1 物品的流动：出口、进口以及净出口","c":[{"t":"出口（exports）：在国内生产而在国外销售的物品与服务。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">出口</strong>（exports）：在国内生产而在国外销售的物品与服务。","label":"出口（exports）：在国内生产而…"},{"t":"进口（imports）：在国外生产而在国内销售的物品与服务。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">进口</strong>（imports）：在国外生产而在国内销售的物品与服务。","label":"进口（imports）：在国外生产而…"},{"t":"净出口（net exports）：一国的出口值减进口值，又称贸易余额；净出口＝一国的出口值－一国的进口值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">净出口</strong>（net exports）：一国的出口值减进口值，又称贸易余额；净出口＝一国的出口值－一国的进口值。","label":"净出口（net exports）：一…"},{"t":"贸易余额（trade balance）：一国的出口值减进口值，又称净出口。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贸易余额</strong>（trade balance）：一国的出口值减进口值，又称净出口。","label":"贸易余额"},{"t":"贸易盈余（trade surplus）：出口大于进口的部分（净出口为正，该国是世界物品与服务市场的净卖者）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贸易盈余</strong>（trade surplus）：出口大于进口的部分（净出口为正，该国是世界物品与服务市场的净卖者）。","label":"贸易盈余"},{"t":"贸易赤字（trade deficit）：进口大于出口的部分（净出口为负，该国是世界物品与服务市场的净买者）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贸易赤字</strong>（trade deficit）：进口大于出口的部分（净出口为负，该国是世界物品与服务市场的净买者）。","label":"贸易赤字"},{"t":"贸易平衡（balanced trade）：出口等于进口的状况（净出口为零）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贸易平衡</strong>（balanced trade）：出口等于进口的状况（净出口为零）。","label":"贸易平衡"},{"t":"例子：波音向法国航空公司卖飞机对美国是出口、对法国是进口；沃尔沃向美国居民卖汽车对美国是进口、对瑞典是出口。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>：波音向法国航空公司卖飞机对美国是出口、对法国是进口；沃尔沃向美国居民卖汽车对美国是进口、对瑞典是出口。","label":"例子：波音向法国航空公司卖飞机对美国…"},{"t":"影响出口、进口和净出口的因素：消费者对国内与国外物品的偏好；国内与国外物品的价格；人们可以用国内通货购买国外通货的汇率；国内与国外消费者的收入；从一国向另一国运送物品的成本；政府对国际贸易的政策。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">影响出口、进口和净出口的因素</strong>：消费者对国内与国外物品的偏好；国内与国外物品的价格；人们可以用国内通货购买国外通货的汇率；国内与国外消费者的收入；从一国向另一国运送物品的成本；政府对国际贸易的政策。","label":"影响出口、进口和净出口的因素"},{"t":"案例研究「美国经济日益提高的开放程度」要点：过去60年间国际贸易与国际金融重要性持续提高——20世纪50年代美国进出口一般占GDP的4%~5%，近年已是该水平的3倍；2015年美国最大贸易伙伴是中国（按进出口之和衡量），其后是加拿大、墨西哥、日本、德国、韩国和英国；增长原因包括运输改善（商船运载量从不足1万吨到超过10万吨、远程与宽体喷气机）、通信进步（海底电缆、电子邮件）、技术进步使产品更轻更易运输（家用电器、电影近乎零成本复制）、贸易政策自由化（NAFTA、GATT等协定逐渐降低关税与贸易壁垒）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「美国经济日益提高的开放程度」要点</strong>：过去60年间国际贸易与国际金融重要性持续提高——20世纪50年代美国进出口一般占GDP的4%~5%，近年已是该水平的3倍；2015年美国最大贸易伙伴是中国（按进出口之和衡量），其后是加拿大、墨西哥、日本、德国、韩国和英国；增长原因包括运输改善（商船运载量从不足1万吨到超过10万吨、远程与宽体喷气机）、通信进步（海底电缆、电子邮件）、技术进步使产品更轻更易运输（家用电器、电影近乎零成本复制）、贸易政策自由化（NAFTA、GATT等协定逐渐降低关税与贸易壁垒）。","label":"案例研究「美国经济日益提高的开放程度」要点"},{"t":"新闻摘录「关于贸易协定的复杂政治」要点：TPP（跨太平洋伙伴关系协定）文本长达2700多页且在两党内部都造成分歧（奥巴马支持，Sanders、Clinton反对，共和党内部也分裂）；制造业工人及工会视新自由贸易协定为损害其利益，大公司多数支持；谈判代表Massey的三点看法——TPP影响可能被夸大（温和而非革命性）、对美国工作岗位的最大威胁是美国国内政策而非自贸协定、TPP也是提高发展中国家劳动与环境标准的地缘经济协定；任何贸易协定都创造出赢家与输家。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新闻摘录「关于贸易协定的复杂政治」要点</strong>：TPP（跨太平洋伙伴关系协定）文本长达2700多页且在两党内部都造成分歧（奥巴马支持，Sanders、Clinton反对，共和党内部也分裂）；制造业工人及工会视新自由贸易协定为损害其利益，大公司多数支持；谈判代表Massey的三点看法——TPP影响可能被夸大（温和而非革命性）、对美国工作岗位的最大威胁是美国国内政策而非自贸协定、TPP也是提高发展中国家劳动与环境标准的地缘经济协定；任何贸易协定都创造出赢家与输家。","label":"新闻摘录「关于贸易协定的复杂政治」要点"}],"k":"b","i":1,"h":"<strong class=\"lead\">31.1.1 物品的流动</strong>：出口、进口以及净出口","label":"31.1.1 物品的流动"},{"t":"31.1.2 金融资源的流动：资本净流出","c":[{"t":"资本净流出（net capital outflow）：本国居民购买的外国资产减外国人购买的本国资产；资本净流出＝本国居民购买的外国资产－外国人购买的本国资产（又称外国净投资）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">资本净流出</strong>（net capital outflow）：本国居民购买的外国资产减外国人购买的本国资产；资本净流出＝本国居民购买的外国资产－外国人购买的本国资产（又称外国净投资）。","label":"资本净流出"},{"t":"例子：美国人购买巴西能源公司Petrobras股票增加美国资本净流出；日本居民购买美国政府债券减少美国资本净流出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>：美国人购买巴西能源公司Petrobras股票增加美国资本净流出；日本居民购买美国政府债券减少美国资本净流出。","label":"例子：美国人购买巴西能源公司Petr…"},{"t":"两种形式：外国直接投资（如麦当劳在俄罗斯开快餐店，所有者积极管理）与外国有价证券投资（如美国人购买俄罗斯公司股票，所有者消极管理）；两者都增加美国的资本净流出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两种形式</strong>：外国直接投资（如麦当劳在俄罗斯开快餐店，所有者积极管理）与外国有价证券投资（如美国人购买俄罗斯公司股票，所有者消极管理）；两者都增加美国的资本净流出。","label":"两种形式"},{"t":"正负含义：资本净流出为正（本国居民购买的外国资产多于外国人购买的本国资产）时资本流出一国；为负时资本流入一国。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">正负含义</strong>：资本净流出为正（本国居民购买的外国资产多于外国人购买的本国资产）时资本流出一国；为负时资本流入一国。","label":"正负含义"},{"t":"影响资本净流出的因素：国外资产得到的真实利率；国内资产得到的真实利率；可以感知到的持有国外资产的经济与政治风险；影响国外对国内资产所有权的政府政策（如购买墨西哥债券须比较真实利率并考虑违约风险与政府限制）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">影响资本净流出的因素</strong>：国外资产得到的真实利率；国内资产得到的真实利率；可以感知到的持有国外资产的经济与政治风险；影响国外对国内资产所有权的政府政策（如购买墨西哥债券须比较真实利率并考虑违约风险与政府限制）。","label":"影响资本净流出的因素"}],"k":"b","i":1,"h":"<strong class=\"lead\">31.1.2 金融资源的流动</strong>：资本净流出","label":"31.1.2 金融资源的流动"},{"t":"31.1.3 净出口与资本净流出相等","c":[{"t":"核算恒等式：对整个经济而言，资本净流出（NCO）必然总是等于净出口（NX）：NCO=NX；因为它是一个恒等式——影响等式一侧的每一次交易也必然完全等量地影响另一侧。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核算恒等式</strong>：对整个经济而言，资本净流出（NCO）必然总是等于净出口（NX）：NCO=NX；因为它是一个恒等式——影响等式一侧的每一次交易也必然完全等量地影响另一侧。","label":"核算恒等式"},{"t":"软件出口例子：美国程序员把软件以1万日元卖给日本消费者（美国出口增加、净出口增加）——若把日元放床垫下（持有日本通货）、购买日本股票或债券，都是本国居民获得外国资产，资本净流出等量增加；若用日元买索尼电视机（美国进口等量增加），净出口不变、也无美国人获得外国资产；若把日元到银行换成美元，银行再用日元购买日本资产（资本净流出）或日本物品（进口）或转卖，结果不变——美国净出口必定等于资本净流出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">软件出口例子</strong>：美国程序员把软件以1万日元卖给日本消费者（美国出口增加、净出口增加）——若把日元放床垫下（持有日本通货）、购买日本股票或债券，都是本国居民获得外国资产，资本净流出等量增加；若用日元买索尼电视机（美国进口等量增加），净出口不变、也无美国人获得外国资产；若把日元到银行换成美元，银行再用日元购买日本资产（资本净流出）或日本物品（进口）或转卖，结果不变——美国净出口必定等于资本净流出。","label":"软件出口例子"},{"t":"沃尔玛进口例子：从中国购买5000万美元衣服——中国可把美元投资于美国资产如国债（美国净出口与资本净流出都减少），或购买波音飞机（进口与出口平衡，净出口与资本净流出都不变）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">沃尔玛进口例子</strong>：从中国购买5000万美元衣服——中国可把美元投资于美国资产如国债（美国净出口与资本净流出都减少），或购买波音飞机（进口与出口平衡，净出口与资本净流出都不变）。","label":"沃尔玛进口例子"},{"t":"概括：贸易盈余国（NX>0）出售给外国的多于购买的，所得外国通货必用来购买外国资产，资本流出（NCO>0）；贸易赤字国（NX<0）购买的多于出售的，必在国外出售资产为净购买筹资，资本流入（NCO<0）——国际物品与服务的流动和国际资本流动是同一个问题的两面。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">概括</strong>：贸易盈余国（NX&gt;0）出售给外国的多于购买的，所得外国通货必用来购买外国资产，资本流出（NCO&gt;0）；贸易赤字国（NX&lt;0）购买的多于出售的，必在国外出售资产为净购买筹资，资本流入（NCO&lt;0）——国际物品与服务的流动和国际资本流动是同一个问题的两面。","label":"概括：贸易盈余国（NX>0）出售给外…"}],"k":"b","i":1,"h":"31.1.3 净出口与资本净流出相等","label":"31.1.3 净出口与资本净流出相等"},{"t":"31.1.4 储蓄、投资及其与国际流动的关系","c":[{"t":"出发点：GDP的构成恒等式Y=C+I+G+NX（消费、投资、政府购买、净出口）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">出发点</strong>：GDP的构成恒等式Y=C+I+G+NX（消费、投资、政府购买、净出口）。","label":"出发点：GDP的构成恒等式Y=C+I…"},{"t":"推导：国民储蓄S=Y−C−G，故S=I+NX；又因NX=NCO，得S=I+NCO，即储蓄＝国内投资＋资本净流出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推导</strong>：国民储蓄S=Y−C−G，故S=I+NX；又因NX=NCO，得S=I+NCO，即储蓄＝国内投资＋资本净流出。","label":"推导：国民储蓄S=Y−C−G，故S=…"},{"t":"含义：公民储蓄的每1美元既可用于为国内资本积累筹资，也可用于为国外资本购买筹资；封闭经济中NCO=0退化为S=I，开放经济中储蓄有两种用途。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">含义</strong>：公民储蓄的每1美元既可用于为国内资本积累筹资，也可用于为国外资本购买筹资；封闭经济中NCO=0退化为S=I，开放经济中储蓄有两种用途。","label":"含义：公民储蓄的每1美元既可用于为国…"},{"t":"例子：Garcia一家的储蓄存入共同基金，可用于购买通用汽车股票建俄亥俄工厂（国内投资），也可购买丰田股票建大阪工厂（美国的资本净流出）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>：Garcia一家的储蓄存入共同基金，可用于购买通用汽车股票建俄亥俄工厂（国内投资），也可购买丰田股票建大阪工厂（美国的资本净流出）。","label":"例子：Garcia一家的储蓄存入共同…"},{"t":"推论：储蓄大于国内投资时资本净流出为正（用一些储蓄购买外国资产）；国内投资大于储蓄时资本净流出为负（外国人通过购买国内资产为一部分国内投资筹资）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推论</strong>：储蓄大于国内投资时资本净流出为正（用一些储蓄购买外国资产）；国内投资大于储蓄时资本净流出为负（外国人通过购买国内资产为一部分国内投资筹资）。","label":"推论：储蓄大于国内投资时资本净流出为…"}],"k":"b","i":1,"h":"31.1.4 储蓄、投资及其与国际流动的关系","label":"31.1.4 储蓄、投资及其与国际流…"},{"t":"31.1.5 总结","c":[{"t":"表31-1（开放经济的三种可能结果）：","c":[{"t":"贸易赤字：出口＜进口，净出口＜0，Y＜C+I+G，储蓄＜投资，资本净流出＜0。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">贸易赤字</strong>：出口＜进口，净出口＜0，Y＜C+I+G，储蓄＜投资，资本净流出＜0。","label":"贸易赤字"},{"t":"贸易平衡：出口＝进口，净出口＝0，Y=C+I+G，储蓄＝投资，资本净流出＝0。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">贸易平衡</strong>：出口＝进口，净出口＝0，Y=C+I+G，储蓄＝投资，资本净流出＝0。","label":"贸易平衡"},{"t":"贸易盈余：出口＞进口，净出口＞0，Y＞C+I+G，储蓄＞投资，资本净流出＞0。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">贸易盈余</strong>：出口＞进口，净出口＞0，Y＞C+I+G，储蓄＞投资，资本净流出＞0。","label":"贸易盈余"}],"k":"b","i":2,"h":"<strong class=\"lead\">表31-1</strong>（开放经济的三种可能结果）：","label":"表31-1"},{"t":"推理链条：贸易盈余→NX>0→收入大于国内支出→储蓄大于投资→资本输出；贸易赤字→NX<0→收入小于国内支出→储蓄小于投资→须在国外出售资产筹资（如近年来的美国经济）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推理链条</strong>：贸易盈余→NX&gt;0→收入大于国内支出→储蓄大于投资→资本输出；贸易赤字→NX&lt;0→收入小于国内支出→储蓄小于投资→须在国外出售资产筹资（如近年来的美国经济）。","label":"推理链条"},{"t":"案例研究「美国的贸易赤字是一个全国性问题吗」要点：过去30年美国通过在世界金融市场大量借款为巨额贸易赤字筹资，被称为\"世界上最大的债务国\"；1980年以前国民储蓄与国内投资接近、资本净流出约占GDP的−1%到1%，1980年以来储蓄降到大大低于投资、资本净流出通常为相当大的负数；三个显著历史时期——(1)不平衡的财政政策（1980—1987年，资本流入从占GDP的0.5%升至3.0%，主要因里根减税与国防支出增加使公共储蓄减少2.7%）；(2)投资高涨（1991—2000年，资本流入从0.5%升至3.7%，预算转为盈余、储蓄增加，但信息技术繁荣使投资占GDP从15.3%升至19.8%）；(3)经济衰退（2000—2015年，2000—2009年储蓄与投资都下降6%——投资因2008年开始的经济艰难时期获利减少，储蓄因应对衰退的巨额预算赤字而减少，2009—2015年随复苏各增长约3%）；评价——储蓄减少引起的赤字：储蓄减少已是事实，有外国投资于美国总比什么也没有强；投资高涨引起的赤字：若资本带来好收益则债务可处理，若收益不及预期则债务不合意；贸易赤字本身并不是个问题，但它有时会成为问题的征兆。","c":[],"k":"b","i":2,"h":"案例研究「美国的贸易赤字是一个全国性问题吗」要点：过去30年美国通过在世界金融市场大量借款为巨额贸易赤字筹资，被称为&quot;世界上最大的债务国&quot;；1980年以前国民储蓄与国内投资接近、资本净流出约占GDP的−1%到1%，1980年以来储蓄降到大大低于投资、资本净流出通常为相当大的负数；三个显著历史时期——(1)不平衡的财政政策（1980—1987年，资本流入从占GDP的0.5%升至3.0%，主要因里根减税与国防支出增加使公共储蓄减少2.7%）；(2)投资高涨（1991—2000年，资本流入从0.5%升至3.7%，预算转为盈余、储蓄增加，但信息技术繁荣使投资占GDP从15.3%升至19.8%）；(3)经济衰退（2000—2015年，2000—2009年储蓄与投资都下降6%——投资因2008年开始的经济艰难时期获利减少，储蓄因应对衰退的巨额预算赤字而减少，2009—2015年随复苏各增长约3%）；评价——储蓄减少引起的赤字：储蓄减少已是事实，有外国投资于美国总比什么也没有强；投资高涨引起的赤字：若资本带来好收益则债务可处理，若收益不及预期则债务不合意；贸易赤字本身并不是个问题，但它有时会成为问题的征兆。","label":"案例研究「美国的贸易赤字是一个全国性问题吗」要点"}],"k":"b","i":1,"h":"31.1.5 总结","label":"31.1.5 总结"},{"t":"即问即答要点：净出口与资本净流出的定义如上；二者必然相等，因为每一次国际交易都是物品或服务与资产的交换。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：净出口与资本净流出的定义如上；二者必然相等，因为每一次国际交易都是物品或服务与资产的交换。","label":"即问即答要点"}],"k":"sec","i":0,"h":"31.1 物品与资本的国际流动","label":"31.1 物品与资本的国际流动"},{"t":"31.2 国际交易的价格：真实汇率与名义汇率","c":[{"t":"引论","c":[{"t":"国际价格有助于协调消费者与生产者在国际市场上交易时的决策；两种最重要的国际价格是名义汇率与真实汇率。","c":[],"k":"b","i":2,"h":"国际价格有助于协调消费者与生产者在国际市场上交易时的决策；两种最重要的国际价格是名义汇率与真实汇率。","label":"国际价格有助于协调消费者与生产者在国…"}],"k":"b","i":1,"h":"引论","label":"引论"},{"t":"31.2.1 名义汇率","c":[{"t":"名义汇率（nominal exchange rate）：一个人可以用一国通货交换另一国通货的比率（如1美元兑80日元；银行买卖价差是银行利润，可忽略）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">名义汇率</strong>（nominal exchange rate）：一个人可以用一国通货交换另一国通货的比率（如1美元兑80日元；银行买卖价差是银行利润，可忽略）。","label":"名义汇率"},{"t":"表示法：一种汇率总可用两种方法表示（1美元兑80日元即1日元兑1/80即0.0125美元），本书用1美元兑外国通货的单位表示。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表示法</strong>：一种汇率总可用两种方法表示（1美元兑80日元即1日元兑1/80即0.0125美元），本书用1美元兑外国通货的单位表示。","label":"表示法：一种汇率总可用两种方法表示（…"},{"t":"升值（appreciation）：按所能购买到的外国通货量衡量的一国通货的价值上升（汇率变动使1美元能买到更多外国通货，如从1美元兑80日元升到90日元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">升值</strong>（appreciation）：按所能购买到的外国通货量衡量的一国通货的价值上升（汇率变动使1美元能买到更多外国通货，如从1美元兑80日元升到90日元）。","label":"升值（appreciation）：按…"},{"t":"贬值（depreciation）：按所能购买到的外国通货量衡量的一国通货的价值下降（如从1美元兑80日元降到70日元；美元升值时即日元贬值）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贬值</strong>（depreciation）：按所能购买到的外国通货量衡量的一国通货的价值下降（如从1美元兑80日元降到70日元；美元升值时即日元贬值）。","label":"贬值（depreciation）：按…"},{"t":"媒体语言：通货升值称\"坚挺\"（能购买更多外国通货），贬值称\"疲软\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">媒体语言</strong>：通货升值称&quot;坚挺&quot;（能购买更多外国通货），贬值称&quot;疲软&quot;。","label":"媒体语言"},{"t":"汇率指数：任何一国都存在许多名义汇率，经济学家通常使用将许多汇率加以平均的指数（类似CPI把许多价格变为物价水平的单一衡量指标）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">汇率指数</strong>：任何一国都存在许多名义汇率，经济学家通常使用将许多汇率加以平均的指数（类似CPI把许多价格变为物价水平的单一衡量指标）。","label":"汇率指数"},{"t":"参考资料「欧元」要点：20世纪90年代许多欧洲国家决定放弃本国通货（法郎、马克、里拉等），2002年1月1日欧元开始流通时12国将其作为官方货币，2016年达19国（英国、瑞典、丹麦拒用）；欧元区货币政策由欧洲中央银行（ECB）制定；好处是使贸易更容易（避免各州各自发币那种兑换不便）、也有削弱民族主义的政治考量；代价是只能有一种货币政策，各国对最优货币政策有分歧时须达成一致；2010—2015年希腊债务危机中，无法用独立货币政策作为工具使问题凸显，甚至讨论过希腊退出欧元区的可能。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「欧元」要点</strong>：20世纪90年代许多欧洲国家决定放弃本国通货（法郎、马克、里拉等），2002年1月1日欧元开始流通时12国将其作为官方货币，2016年达19国（英国、瑞典、丹麦拒用）；欧元区货币政策由欧洲中央银行（ECB）制定；好处是使贸易更容易（避免各州各自发币那种兑换不便）、也有削弱民族主义的政治考量；代价是只能有一种货币政策，各国对最优货币政策有分歧时须达成一致；2010—2015年希腊债务危机中，无法用独立货币政策作为工具使问题凸显，甚至讨论过希腊退出欧元区的可能。","label":"参考资料「欧元」要点"}],"k":"b","i":1,"h":"31.2.1 名义汇率","label":"31.2.1 名义汇率"},{"t":"31.2.2 真实汇率","c":[{"t":"真实汇率（real exchange rate）：一个人可以用一国的物品与服务交换另一国的物品与服务的比率（如1磅美国奶酪兑1/2磅瑞士奶酪；用一单位国内东西的外国东西单位量表示，\"东西\"是物品而非通货）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">真实汇率</strong>（real exchange rate）：一个人可以用一国的物品与服务交换另一国的物品与服务的比率（如1磅美国奶酪兑1/2磅瑞士奶酪；用一单位国内东西的外国东西单位量表示，&quot;东西&quot;是物品而非通货）。","label":"真实汇率"},{"t":"计算公式：真实汇率＝（名义汇率×国内价格）÷国外价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">计算公式</strong>：真实汇率＝（名义汇率×国内价格）÷国外价格。","label":"计算公式"},{"t":"大米例子：美国大米每蒲式耳100美元、日本大米每蒲式耳16000日元、名义汇率1美元兑80日元→美国大米价格折合8000日元/蒲式耳，真实汇率为每蒲式耳美国大米兑1/2蒲式耳日本大米。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">大米例子</strong>：美国大米每蒲式耳100美元、日本大米每蒲式耳16000日元、名义汇率1美元兑80日元→美国大米价格折合8000日元/蒲式耳，真实汇率为每蒲式耳美国大米兑1/2蒲式耳日本大米。","label":"大米例子"},{"t":"总体真实汇率：用物价指数衡量，真实汇率=(e×P)/P*（e为名义汇率，P为国内CPI，P*为国外CPI），衡量国内一篮子物品与服务相对于国外一篮子物品与服务的价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总体真实汇率</strong>：用物价指数衡量，真实汇率=(e×P)/P*（e为名义汇率，P为国内CPI，P*为国外CPI），衡量国内一篮子物品与服务相对于国外一篮子物品与服务的价格。","label":"总体真实汇率"},{"t":"重要性：真实汇率是一国出口与进口多少的关键决定因素（买美国大米还是日本大米、去迈阿密还是坎昆度假，都基于真实汇率决策）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">重要性</strong>：真实汇率是一国出口与进口多少的关键决定因素（买美国大米还是日本大米、去迈阿密还是坎昆度假，都基于真实汇率决策）。","label":"重要性：真实汇率是一国出口与进口多少…"},{"t":"与净出口的关系：真实汇率下降（美国物品相对便宜）→国内外消费者更多买美国物品→出口增加、进口减少→净出口增加；真实汇率上升（美国物品相对昂贵）→净出口减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与净出口的关系</strong>：真实汇率下降（美国物品相对便宜）→国内外消费者更多买美国物品→出口增加、进口减少→净出口增加；真实汇率上升（美国物品相对昂贵）→净出口减少。","label":"与净出口的关系"},{"t":"即问即答要点：名义汇率是通货的相对价格、真实汇率是物品与服务的相对价格，前者进入后者的计算；名义汇率从1美元兑100日元升到120日元，是美元升值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：名义汇率是通货的相对价格、真实汇率是物品与服务的相对价格，前者进入后者的计算；名义汇率从1美元兑100日元升到120日元，是美元升值。","label":"即问即答要点"}],"k":"b","i":1,"h":"31.2.2 真实汇率","label":"31.2.2 真实汇率"}],"k":"sec","i":0,"h":"<strong class=\"lead\">31.2 国际交易的价格</strong>：真实汇率与名义汇率","label":"31.2 国际交易的价格"},{"t":"31.3 第一种汇率决定理论：购买力平价理论","c":[{"t":"引论","c":[{"t":"汇率变动幅度大且方向相反（1970年1美元兑3.65德国马克或627意大利里拉，1998年兑1.76马克或1737里拉），需要理论解释。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">汇率变动幅度大且方向相反</strong>（1970年1美元兑3.65德国马克或627意大利里拉，1998年兑1.76马克或1737里拉），需要理论解释。","label":"汇率变动幅度大且方向相反"},{"t":"购买力平价理论（purchasing-power parity）：一种认为任何一单位通货都应该能在所有国家买到等量物品的汇率理论；许多经济学家认为它描述了长期中决定汇率的因素。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">购买力平价理论</strong>（purchasing-power parity）：一种认为任何一单位通货都应该能在所有国家买到等量物品的汇率理论；许多经济学家认为它描述了长期中决定汇率的因素。","label":"购买力平价理论"}],"k":"b","i":1,"h":"引论","label":"引论"},{"t":"31.3.1 购买力平价理论的基本逻辑","c":[{"t":"理论根据一价定律得出：一种物品在所有地方都应该按同样的价格出售，否则就有未被利用的可以获取利润的机会。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理论根据一价定律得出</strong>：一种物品在所有地方都应该按同样的价格出售，否则就有未被利用的可以获取利润的机会。","label":"理论根据一价定律得出"},{"t":"套利：利用不同市场上同一种东西的价格差的过程（西雅图咖啡每磅4美元、达拉斯5美元→低买高卖每磅赚1美元→西雅图需求增加价格上升、达拉斯供给增加价格下降→两市场价格趋同）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">套利</strong>：利用不同市场上同一种东西的价格差的过程（西雅图咖啡每磅4美元、达拉斯5美元→低买高卖每磅赚1美元→西雅图需求增加价格上升、达拉斯供给增加价格下降→两市场价格趋同）。","label":"套利：利用不同市场上同一种东西的价格…"},{"t":"应用于国际：若1美元在美国能买到的咖啡比日本多，贸易者在美国购买、在日本出售获利→美国咖啡价格上升、日本下降；反之亦然——最终在所有国家1美元都必定能买到等量咖啡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用于国际</strong>：若1美元在美国能买到的咖啡比日本多，贸易者在美国购买、在日本出售获利→美国咖啡价格上升、日本下降；反之亦然——最终在所有国家1美元都必定能买到等量咖啡。","label":"应用于国际"},{"t":"结论：一种通货必然在所有国家都具有相同的购买力；平价意味着平等，购买力指用它能购买到的物品量衡量的货币价值——一单位通货在每个国家都应该有相同的真实价值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：一种通货必然在所有国家都具有相同的购买力；平价意味着平等，购买力指用它能购买到的物品量衡量的货币价值——一单位通货在每个国家都应该有相同的真实价值。","label":"结论：一种通货必然在所有国家都具有相…"}],"k":"b","i":1,"h":"31.3.1 购买力平价理论的基本逻辑","label":"31.3.1 购买力平价理论的基本逻辑"},{"t":"31.3.2 购买力平价理论的含义","c":[{"t":"含义一：两国通货之间的名义汇率取决于这两个国家的物价水平——若1磅咖啡在日本值500日元、在美国值5美元，则名义汇率必为1美元兑100日元（500÷5），否则1美元的购买力在两国不同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">含义一</strong>：两国通货之间的名义汇率取决于这两个国家的物价水平——若1磅咖啡在日本值500日元、在美国值5美元，则名义汇率必为1美元兑100日元（500÷5），否则1美元的购买力在两国不同。","label":"含义一：两国通货之间的名义汇率取决于…"},{"t":"公式推导：国内1美元的购买力为1/P，国外为e/P*，购买力相同则1/P=e/P*，整理得1=eP/P*——若1美元购买力国内外总相同，则真实汇率（国内物品与国外物品的相对价格）不变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公式推导</strong>：国内1美元的购买力为1/P，国外为e/P*，购买力相同则1/P=e/P*，整理得1=eP/P*——若1美元购买力国内外总相同，则真实汇率（国内物品与国外物品的相对价格）不变。","label":"公式推导"},{"t":"解出名义汇率：e=P*/P——名义汇率等于外国物价水平与国内物价水平之比；名义汇率必然反映两国的物价水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解出名义汇率</strong>：e=P*/P——名义汇率等于外国物价水平与国内物价水平之比；名义汇率必然反映两国的物价水平。","label":"解出名义汇率"},{"t":"关键含义：物价水平变动时名义汇率随之变动；物价水平由货币供给与货币需求的平衡决定（上一章），故名义汇率也取决于每个国家的货币供求——中央银行增加货币供给引起物价水平上升时，就引起该国通货相对于世界其他通货贬值；印发大量货币时，无论按能买到的物品与服务还是能买到的其他通货衡量，货币价值都下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键含义</strong>：物价水平变动时名义汇率随之变动；物价水平由货币供给与货币需求的平衡决定（上一章），故名义汇率也取决于每个国家的货币供求——中央银行增加货币供给引起物价水平上升时，就引起该国通货相对于世界其他通货贬值；印发大量货币时，无论按能买到的物品与服务还是能买到的其他通货衡量，货币价值都下降。","label":"关键含义"},{"t":"应用（开篇问题）：1970—1998年美国年均通胀5.3%，德国3.5%，意大利9.6%——美国物价相对德国上升，美元对马克贬值；相对意大利下降，美元对里拉升值；德、意如今共用欧元，但教训适用于欧元：未来美元对欧元的高低取决于欧洲央行与美联储引起的通胀比较。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用</strong>（开篇问题）：1970—1998年美国年均通胀5.3%，德国3.5%，意大利9.6%——美国物价相对德国上升，美元对马克贬值；相对意大利下降，美元对里拉升值；德、意如今共用欧元，但教训适用于欧元：未来美元对欧元的高低取决于欧洲央行与美联储引起的通胀比较。","label":"应用（开篇问题）：1970—1998…"},{"t":"案例研究「超速通货膨胀期间的名义汇率」要点：德国20世纪20年代初超速通胀期间，货币供给、物价水平与名义汇率（每马克兑美分）几乎同时变动——货币供给迅速增长时物价随之上升、马克相对美元贬值，货币供给稳定时物价与汇率也稳定；货币数量论解释货币供给如何影响物价水平，购买力平价理论解释物价水平如何影响名义汇率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「超速通货膨胀期间的名义汇率」要点</strong>：德国20世纪20年代初超速通胀期间，货币供给、物价水平与名义汇率（每马克兑美分）几乎同时变动——货币供给迅速增长时物价随之上升、马克相对美元贬值，货币供给稳定时物价与汇率也稳定；货币数量论解释货币供给如何影响物价水平，购买力平价理论解释物价水平如何影响名义汇率。","label":"案例研究「超速通货膨胀期间的名义汇率」要点"}],"k":"b","i":1,"h":"31.3.2 购买力平价理论的含义","label":"31.3.2 购买力平价理论的含义"},{"t":"31.3.3 购买力平价理论的局限性","c":[{"t":"总评：它不是完全正确的——汇率的变动并不总能保证美元在所有国家始终具有同样的真实价值；但它是理解汇率的有用的第一步，可以解释许多长期趋势（美元对马克贬值、对里拉升值）和超速通胀期间汇率的重大变动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总评</strong>：它不是完全正确的——汇率的变动并不总能保证美元在所有国家始终具有同样的真实价值；但它是理解汇率的有用的第一步，可以解释许多长期趋势（美元对马克贬值、对里拉升值）和超速通胀期间汇率的重大变动。","label":"总评：它不是完全正确的——汇率的变动…"},{"t":"局限一：许多物品是不容易进行贸易的（如巴黎理发比纽约贵，旅游者与理发师的套利如此有限，无法消除价格差，背离持续存在）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">局限一</strong>：许多物品是不容易进行贸易的（如巴黎理发比纽约贵，旅游者与理发师的套利如此有限，无法消除价格差，背离持续存在）。","label":"局限一：许多物品是不容易进行贸易的（…"},{"t":"局限二：即使是可贸易物品，当它们在不同国家生产时也并不总能完全相互替代（一些消费者偏爱德国汽车、另一些偏爱美国汽车；德国汽车更受欢迎时其价格相对上升，但因消费者不认为两种汽车相同，不存在有利可图的套利）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">局限二</strong>：即使是可贸易物品，当它们在不同国家生产时也并不总能完全相互替代（一些消费者偏爱德国汽车、另一些偏爱美国汽车；德国汽车更受欢迎时其价格相对上升，但因消费者不认为两种汽车相同，不存在有利可图的套利）。","label":"局限二：即使是可贸易物品，当它们在不…"},{"t":"由此：真实汇率事实上一直在波动；但基本逻辑可信——真实汇率背离平价水平时人们就有跨国买卖物品的激励，故真实汇率的变动通常小而暂时，大幅度且持久的名义汇率变动主要反映国内外物价水平的变动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">由此</strong>：真实汇率事实上一直在波动；但基本逻辑可信——真实汇率背离平价水平时人们就有跨国买卖物品的激励，故真实汇率的变动通常小而暂时，大幅度且持久的名义汇率变动主要反映国内外物价水平的变动。","label":"由此：真实汇率事实上一直在波动；但基…"},{"t":"案例研究「汉堡包标准」要点：《经济学家》杂志用\"两块煎牛肉饼、特殊调味品、莴苣叶、奶酪、泡菜、洋葱和芝麻面包\"的一篮子物品——巨无霸——检验购买力平价；2016年1月美国巨无霸4.93美元，例如日本370日元→预期汇率75日元/美元、实际119；韩国4300韩元→预期872、实际1198；墨西哥49比索→预期9.9、实际17.4；瑞典45克朗→预期9.1、实际8.6；欧元区3.72欧元→预期0.75、实际0.93；英国2.89英镑→预期0.59、实际0.68；预期汇率与实际汇率并不完全相同（巨无霸的国际套利不容易进行），但通常十分相近——购买力平价不是精确的汇率理论，却经常能提供一个最合理的近似值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「汉堡包标准」要点</strong>：《经济学家》杂志用&quot;两块煎牛肉饼、特殊调味品、莴苣叶、奶酪、泡菜、洋葱和芝麻面包&quot;的一篮子物品——巨无霸——检验购买力平价；2016年1月美国巨无霸4.93美元，例如日本370日元→预期汇率75日元/美元、实际119；韩国4300韩元→预期872、实际1198；墨西哥49比索→预期9.9、实际17.4；瑞典45克朗→预期9.1、实际8.6；欧元区3.72欧元→预期0.75、实际0.93；英国2.89英镑→预期0.59、实际0.68；预期汇率与实际汇率并不完全相同（巨无霸的国际套利不容易进行），但通常十分相近——购买力平价不是精确的汇率理论，却经常能提供一个最合理的近似值。","label":"案例研究「汉堡包标准」要点"},{"t":"即问即答要点：墨西哥通胀长期高于日本→墨西哥物价相对上升更快→按购买力平价，墨西哥比索相对日元（及1日元能买到的比索数量）应趋于减少，即比索贬值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：墨西哥通胀长期高于日本→墨西哥物价相对上升更快→按购买力平价，墨西哥比索相对日元（及1日元能买到的比索数量）应趋于减少，即比索贬值。","label":"即问即答要点"}],"k":"b","i":1,"h":"31.3.3 购买力平价理论的局限性","label":"31.3.3 购买力平价理论的局限性"}],"k":"sec","i":0,"h":"<strong class=\"lead\">31.3 第一种汇率决定理论</strong>：购买力平价理论","label":"31.3 第一种汇率决定理论"},{"t":"31.4 结论","c":[{"t":"本章定义了研究开放经济的基本概念：一国的贸易余额如何与资本的国际流动相关；开放经济中储蓄与国内投资如何不相等（贸易盈余国必输出资本、贸易赤字国必有资本流入）；名义汇率与真实汇率的含义；购买力平价理论的含义与局限性。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章定义了研究开放经济的基本概念</strong>：一国的贸易余额如何与资本的国际流动相关；开放经济中储蓄与国内投资如何不相等（贸易盈余国必输出资本、贸易赤字国必有资本流入）；名义汇率与真实汇率的含义；购买力平价理论的含义与局限性。","label":"本章定义了研究开放经济的基本概念"},{"t":"这些变量为分析开放经济与世界其他经济的相互交易提供出发点；下一章介绍说明什么因素决定这些变量的模型，并讨论各种事件与政策如何影响一国的贸易余额以及各国在世界市场上按什么比率进行交换。","c":[],"k":"b","i":1,"h":"这些变量为分析开放经济与世界其他经济的相互交易提供出发点；下一章介绍说明什么因素决定这些变量的模型，并讨论各种事件与政策如何影响一国的贸易余额以及各国在世界市场上按什么比率进行交换。","label":"这些变量为分析开放经济与世界其他经济…"}],"k":"sec","i":0,"h":"31.4 结论","label":"31.4 结论"}],"k":"chap","h":"<strong class=\"lead\">第31章 开放经济的宏观经济学</strong>：基本概念","label":"第31章 开放经济的宏观经济学"},{"t":"第32章 开放经济的宏观经济理论","c":[{"t":"本章内容提要","c":[{"t":"开放经济的宏观经济学关注两个市场：在可贷资金市场上，真实利率的调整使可贷资金的供给（来自国民储蓄）与其需求（来自国内投资和资本净流出）相平衡；在外汇市场上，真实汇率的调整使美元的供给（来自资本净流出）与美元的需求（用于净出口）相平衡。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">开放经济的宏观经济学关注两个市场</strong>：在可贷资金市场上，真实利率的调整使可贷资金的供给（来自国民储蓄）与其需求（来自国内投资和资本净流出）相平衡；在外汇市场上，真实汇率的调整使美元的供给（来自资本净流出）与美元的需求（用于净出口）相平衡。","label":"开放经济的宏观经济学关注两个市场"},{"t":"资本净流出既是可贷资金需求的一部分，又为外汇市场提供美元，是联系这两个市场的变量。","c":[],"k":"b","i":1,"h":"资本净流出既是可贷资金需求的一部分，又为外汇市场提供美元，是联系这两个市场的变量。","label":"资本净流出既是可贷资金需求的一部分，…"},{"t":"减少国民储蓄的政策（如政府预算赤字）使利率上升、减少资本净流出、导致美元升值并使净出口减少，贸易余额向赤字方向变动。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">减少国民储蓄的政策</strong>（如政府预算赤字）使利率上升、减少资本净流出、导致美元升值并使净出口减少，贸易余额向赤字方向变动。","label":"减少国民储蓄的政策"},{"t":"限制性贸易政策（进口关税或进口配额）并不能改变贸易余额：贸易限制提高了汇率既定时的净出口，从而提高外汇市场上的美元需求，美元升值抵消了贸易限制对净出口的最初影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">限制性贸易政策</strong>（进口关税或进口配额）并不能改变贸易余额：贸易限制提高了汇率既定时的净出口，从而提高外汇市场上的美元需求，美元升值抵消了贸易限制对净出口的最初影响。","label":"限制性贸易政策"},{"t":"政治不稳定会引起资本外逃：资本外逃往往引起利率上升和通货贬值，并使贸易余额向盈余方向变动。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">政治不稳定会引起资本外逃</strong>：资本外逃往往引起利率上升和通货贬值，并使贸易余额向盈余方向变动。","label":"政治不稳定会引起资本外逃"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"32.1 可贷资金市场与外汇市场的供给与需求","c":[{"t":"模型前提：把经济的真实GDP（由生产要素供给与生产技术决定）和物价水平（由货币供求平衡决定）作为既定，以前几章关于产量与物价的结论为出发点；模型目的是阐明决定贸易余额与汇率的力量——把供求工具同时运用于可贷资金市场和外汇市场这两个相关的市场。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">模型前提</strong>：把经济的真实GDP（由生产要素供给与生产技术决定）和物价水平（由货币供求平衡决定）作为既定，以前几章关于产量与物价的结论为出发点；模型目的是阐明决定贸易余额与汇率的力量——把供求工具同时运用于可贷资金市场和外汇市场这两个相关的市场。","label":"模型前提"},{"t":"32.1.1 可贷资金市场","c":[{"t":"术语：可贷资金市场（market for loanable funds）——假设金融体系只有一个市场，所有储蓄者都到该市场存入储蓄、所有借款者都从该市场得到贷款的市场，市场上存在一种利率，它既是储蓄的收益，又是借款的成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：可贷资金市场（market for loanable funds）——假设金融体系只有一个市场，所有储蓄者都到该市场存入储蓄、所有借款者都从该市场得到贷款的市场，市场上存在一种利率，它既是储蓄的收益，又是借款的成本。","label":"术语：可贷资金市场（market f…"},{"t":"恒等式 S = I + NCO（储蓄＝国内投资＋资本净流出）：一国每储蓄1美元，既可用于购买国内资产，也可用于购买国外资产。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">恒等式 S = I + NCO</strong>（储蓄＝国内投资＋资本净流出）：一国每储蓄1美元，既可用于购买国内资产，也可用于购买国外资产。","label":"恒等式 S = I + NCO"},{"t":"可贷资金应解释为国内产生的可用于资本积累的资源流量：供给来自国民储蓄（S）；需求来自国内投资（I）与资本净流出（NCO）——无论购买国内资本资产还是国外资本资产都增加需求；NCO＞0（资本净流出）增加需求，NCO＜0（资本净流入）减少需求。","c":[],"k":"b","i":2,"h":"可贷资金应解释为国内产生的可用于资本积累的资源流量：供给来自国民储蓄（S）；需求来自国内投资（I）与资本净流出（NCO）——无论购买国内资本资产还是国外资本资产都增加需求；NCO＞0（资本净流出）增加需求，NCO＜0（资本净流入）减少需求。","label":"可贷资金应解释为国内产生的可用于资本…"},{"t":"真实利率的调节：较高利率鼓励储蓄（供给量增加）、提高借款成本从而抑制投资（需求量减少）；开放经济中的利率与封闭经济一样由可贷资金供求决定，只是需求方新增了资本净流出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">真实利率的调节</strong>：较高利率鼓励储蓄（供给量增加）、提高借款成本从而抑制投资（需求量减少）；开放经济中的利率与封闭经济一样由可贷资金供求决定，只是需求方新增了资本净流出。","label":"真实利率的调节"},{"t":"利率与资本净流出：较高的国内真实利率使国内资产更有吸引力，既抑制本国人购买外国资产、又鼓励外国人购买本国资产，因此降低资本净流出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利率与资本净流出</strong>：较高的国内真实利率使国内资产更有吸引力，既抑制本国人购买外国资产、又鼓励外国人购买本国资产，因此降低资本净流出。","label":"利率与资本净流出"},{"t":"图形结论（图32-1）：供给曲线向右上方倾斜、需求曲线向右下方倾斜；均衡真实利率使人们想储蓄的量正好等于合意的国内投资与资本净流出量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>（图32-1）：供给曲线向右上方倾斜、需求曲线向右下方倾斜；均衡真实利率使人们想储蓄的量正好等于合意的国内投资与资本净流出量。","label":"图形结论"},{"t":"即问即答要点：可贷资金市场的供给来自国民储蓄、需求来自国内投资与资本净流出；外汇市场的美元供给来自资本净流出、需求来自净出口。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：可贷资金市场的供给来自国民储蓄、需求来自国内投资与资本净流出；外汇市场的美元供给来自资本净流出、需求来自净出口。","label":"即问即答要点"}],"k":"b","i":1,"h":"32.1.1 可贷资金市场","label":"32.1.1 可贷资金市场"},{"t":"32.1.2 外汇市场","c":[{"t":"术语：外汇市场（market for foreign-currency exchange）——协调那些想用国内通货交换其他国家通货的人的市场。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：外汇市场（market for foreign-currency exchange）——协调那些想用国内通货交换其他国家通货的人的市场。","label":"术语：外汇市场（market for…"},{"t":"恒等式 NCO = NX（资本净流出＝净出口）：国外资本资产买卖之间的不平衡等于物品与服务进出口之间的不平衡——贸易盈余（NX＞0）对应资本流出（NCO＞0），贸易赤字（NX＜0）对应资本流入（NCO＜0）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">恒等式 NCO = NX</strong>（资本净流出＝净出口）：国外资本资产买卖之间的不平衡等于物品与服务进出口之间的不平衡——贸易盈余（NX＞0）对应资本流出（NCO＞0），贸易赤字（NX＜0）对应资本流入（NCO＜0）。","label":"恒等式 NCO = NX"},{"t":"供给来自资本净流出（想购买国外资产者须供给美元兑换外币，如美国共同基金买日本国债）；需求来自净出口（外国人需要美元购买美国的净出口，如日本航空公司买波音飞机）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给来自资本净流出</strong>（想购买国外资产者须供给美元兑换外币，如美国共同基金买日本国债）；需求来自净出口（外国人需要美元购买美国的净出口，如日本航空公司买波音飞机）。","label":"供给来自资本净流出"},{"t":"使外汇市场供求平衡的价格是真实汇率：真实汇率是国内物品与国外物品的相对价格；真实汇率上升使国内物品相对变贵，出口减少、进口增加，净出口减少，故美元需求曲线向右下方倾斜。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">使外汇市场供求平衡的价格是真实汇率</strong>：真实汇率是国内物品与国外物品的相对价格；真实汇率上升使国内物品相对变贵，出口减少、进口增加，净出口减少，故美元需求曲线向右下方倾斜。","label":"使外汇市场供求平衡的价格是真实汇率"},{"t":"供给曲线垂直的原因：资本净流出不取决于真实汇率——美元价值上升既使外国资产购买成本更低，也使资产收益换回的美元更少，两种影响相互抵消；讨论外汇市场时真实利率与资本净流出视为既定（资本净流出取决于真实利率）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给曲线垂直的原因</strong>：资本净流出不取决于真实汇率——美元价值上升既使外国资产购买成本更低，也使资产收益换回的美元更少，两种影响相互抵消；讨论外汇市场时真实利率与资本净流出视为既定（资本净流出取决于真实利率）。","label":"供给曲线垂直的原因"},{"t":"图形结论（图32-2）：真实汇率自发调整使美元供求平衡——低于均衡时美元短缺使美元升值，高于均衡时美元过剩使美元贬值；均衡时为购买外国资产而供给的美元量正好等于为购买净出口而需要的美元量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>（图32-2）：真实汇率自发调整使美元供求平衡——低于均衡时美元短缺使美元升值，高于均衡时美元过剩使美元贬值；均衡时为购买外国资产而供给的美元量正好等于为购买净出口而需要的美元量。","label":"图形结论"}],"k":"b","i":1,"h":"32.1.2 外汇市场","label":"32.1.2 外汇市场"},{"t":"参考资料：购买力平价是一种特例","c":[{"t":"购买力平价理论假定净出口对真实汇率的微小变动反应极快，对应的外汇需求曲线不是向右下方倾斜，而是位于确保国内外购买力相等的真实汇率处的一条水平线。","c":[],"k":"b","i":2,"h":"购买力平价理论假定净出口对真实汇率的微小变动反应极快，对应的外汇需求曲线不是向右下方倾斜，而是位于确保国内外购买力相等的真实汇率处的一条水平线。","label":"购买力平价理论假定净出口对真实汇率的…"},{"t":"本章集中于更现实的向右下方倾斜的需求曲线，使真实汇率可以像现实世界那样一直变动；购买力平价是本模型的特例与良好出发点，但远远不是结束。","c":[],"k":"b","i":2,"h":"本章集中于更现实的向右下方倾斜的需求曲线，使真实汇率可以像现实世界那样一直变动；购买力平价是本模型的特例与良好出发点，但远远不是结束。","label":"本章集中于更现实的向右下方倾斜的需求…"}],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料</strong>：购买力平价是一种特例","label":"参考资料"}],"k":"sec","i":0,"h":"32.1 可贷资金市场与外汇市场的供给与需求","label":"32.1 可贷资金市场与外汇市场的供…"},{"t":"32.2 开放经济中的均衡","c":[{"t":"32.2.1 资本净流出：两个市场之间的联系","c":[{"t":"术语：资本净流出（net capital outflow，NCO）——本国居民购买的外国资产与外国人购买的本国资产之间的差额；它在可贷资金市场上是需求的一部分（购买国外资产须经该市场筹资），在外汇市场上是供给的来源（购买外国资产须供给美元换外币），因而是联系两个市场的变量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：资本净流出（net capital outflow，NCO）——本国居民购买的外国资产与外国人购买的本国资产之间的差额；它在可贷资金市场上是需求的一部分（购买国外资产须经该市场筹资），在外汇市场上是供给的来源（购买外国资产须供给美元换外币），因而是联系两个市场的变量。","label":"术语：资本净流出（net capit…"},{"t":"资本净流出的关键决定因素是真实利率：国内真实利率越高，国内资产越有吸引力，资本净流出越低（图32-3中NCO曲线向右下方倾斜；横轴零点两侧区分资本净流出为正与资本净流入）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">资本净流出的关键决定因素是真实利率</strong>：国内真实利率越高，国内资产越有吸引力，资本净流出越低（图32-3中NCO曲线向右下方倾斜；横轴零点两侧区分资本净流出为正与资本净流入）。","label":"资本净流出的关键决定因素是真实利率"}],"k":"b","i":1,"h":"<strong class=\"lead\">32.2.1 资本净流出</strong>：两个市场之间的联系","label":"32.2.1 资本净流出"},{"t":"32.2.2 两个市场的同时均衡","c":[{"t":"图形结论（图32-4三幅联动）：(a)可贷资金市场的供求决定真实利率r1→(b)真实利率决定资本净流出（NCO曲线）→(c)资本净流出决定外汇市场的美元供给，与来自净出口的美元需求共同决定真实汇率E1——可贷资金市场与外汇市场同时均衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>（图32-4三幅联动）：(a)可贷资金市场的供求决定真实利率r1→(b)真实利率决定资本净流出（NCO曲线）→(c)资本净流出决定外汇市场的美元供给，与来自净出口的美元需求共同决定真实汇率E1——可贷资金市场与外汇市场同时均衡。","label":"图形结论"},{"t":"两个市场决定两个相对价格：真实利率（相对于未来物品与服务的现期物品与服务的价格）与真实汇率（相对于国外物品与服务的国内物品与服务的价格）；两个相对价格同时调整使两市场供求平衡，并进而决定国民储蓄、国内投资、资本净流出和净出口。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个市场决定两个相对价格</strong>：真实利率（相对于未来物品与服务的现期物品与服务的价格）与真实汇率（相对于国外物品与服务的国内物品与服务的价格）；两个相对价格同时调整使两市场供求平衡，并进而决定国民储蓄、国内投资、资本净流出和净出口。","label":"两个市场决定两个相对价格"},{"t":"即问即答要点：两个市场是可贷资金市场与外汇市场，两个相对价格是真实利率与真实汇率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：两个市场是可贷资金市场与外汇市场，两个相对价格是真实利率与真实汇率。","label":"即问即答要点"}],"k":"b","i":1,"h":"32.2.2 两个市场的同时均衡","label":"32.2.2 两个市场的同时均衡"},{"t":"参考资料：区分供给与需求","c":[{"t":"供给与需求的划分有一定随意性：S = I + NCO 也可改写为 S − NCO = I（此时资本流出看起来像供给的减少），差别更多是语义上的；把进口记为美元需求减少、外国人购买美国债券记为美元供给减少的约定，在分析政策影响时是有用的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给与需求的划分有一定随意性</strong>：S = I + NCO 也可改写为 S − NCO = I（此时资本流出看起来像供给的减少），差别更多是语义上的；把进口记为美元需求减少、外国人购买美国债券记为美元供给减少的约定，在分析政策影响时是有用的。","label":"供给与需求的划分有一定随意性"}],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料</strong>：区分供给与需求","label":"参考资料"}],"k":"sec","i":0,"h":"32.2 开放经济中的均衡","label":"32.2 开放经济中的均衡"},{"t":"32.3 政策和事件如何影响开放经济","c":[{"t":"分析三步骤（源自第4章）：确定事件影响哪一条供求曲线→确定曲线移动方向→用供求图比较新旧均衡。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">分析三步骤</strong>（源自第4章）：确定事件影响哪一条供求曲线→确定曲线移动方向→用供求图比较新旧均衡。","label":"分析三步骤"},{"t":"32.3.1 政府预算赤字","c":[{"t":"术语：挤出（crowding out）——政府预算赤字使利率上升从而减少私人部门投资的现象。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：挤出（crowding out）——政府预算赤字使利率上升从而减少私人部门投资的现象。","label":"术语：挤出（crowding out…"},{"t":"第一步与第二步：预算赤字（政府支出大于收入）代表负的公共储蓄，减少国民储蓄，使可贷资金供给曲线左移（S1→S2）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第一步与第二步</strong>：预算赤字（政府支出大于收入）代表负的公共储蓄，减少国民储蓄，使可贷资金供给曲线左移（S1→S2）。","label":"第一步与第二步"},{"t":"对可贷资金市场：利率从r1上升到r2，借款者少借贷，均衡点沿需求曲线从A点移到B点；如同封闭经济，家庭和企业减少资本品购买——预算赤字挤出了国内投资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对可贷资金市场</strong>：利率从r1上升到r2，借款者少借贷，均衡点沿需求曲线从A点移到B点；如同封闭经济，家庭和企业减少资本品购买——预算赤字挤出了国内投资。","label":"对可贷资金市场"},{"t":"对资本净流出：较高利率既使国外投资对本国居民吸引力变小，又吸引外国投资者，国内与国外的行为都使资本净流出减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对资本净流出</strong>：较高利率既使国外投资对本国居民吸引力变小，又吸引外国投资者，国内与国外的行为都使资本净流出减少。","label":"对资本净流出"},{"t":"对外汇市场与贸易余额：资本净流出减少→外汇市场美元供给左移（S1→S2）→真实汇率从E1升至E2（美元升值）→美国物品相对变贵→出口减少、进口增加→净出口减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对外汇市场与贸易余额</strong>：资本净流出减少→外汇市场美元供给左移（S1→S2）→真实汇率从E1升至E2（美元升值）→美国物品相对变贵→出口减少、进口增加→净出口减少。","label":"对外汇市场与贸易余额"},{"t":"总结论：开放经济中，政府预算赤字提高真实利率、挤出国内投资、引起美元升值，并使贸易余额向赤字方向变动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总结论</strong>：开放经济中，政府预算赤字提高真实利率、挤出国内投资、引起美元升值，并使贸易余额向赤字方向变动。","label":"总结论：开放经济中，政府预算赤字提高…"},{"t":"案例要点（20世纪80年代美国）：1980年里根当选后大幅减税而未近乎等量削减支出，出现巨额预算赤字，模型预言的贸易赤字果然出现；两种赤字在理论与实践上密切相关，被称为\"孪生赤字\"，但不应把二者等同，因为许多财政政策之外的因素也影响贸易赤字。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例要点</strong>（20世纪80年代美国）：1980年里根当选后大幅减税而未近乎等量削减支出，出现巨额预算赤字，模型预言的贸易赤字果然出现；两种赤字在理论与实践上密切相关，被称为&quot;孪生赤字&quot;，但不应把二者等同，因为许多财政政策之外的因素也影响贸易赤字。","label":"案例要点"}],"k":"b","i":1,"h":"32.3.1 政府预算赤字","label":"32.3.1 政府预算赤字"},{"t":"32.3.2 贸易政策","c":[{"t":"术语：贸易政策（trade policy）——直接影响一国进口或出口的物品与服务数量的政府政策；常见形式：关税（tariff，对进口物品征收的税）与进口配额（import quota，对在国外生产而在国内销售的物品数量的限制）；通常旨在支持国内某个特定行业。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：贸易政策（trade policy）——直接影响一国进口或出口的物品与服务数量的政府政策；常见形式：关税（tariff，对进口物品征收的税）与进口配额（import quota，对在国外生产而在国内销售的物品数量的限制）；通常旨在支持国内某个特定行业。","label":"术语：贸易政策（trade poli…"},{"t":"以美国政府对日本汽车实行进口配额为例（三步骤）：第一步，配额最初影响进口，进而影响净出口与外汇市场上的美元需求曲线；第二步，汇率既定时进口减少使净出口增加，美元需求曲线右移（D1→D2）；第三步，美元需求增加使真实汇率从E1升至E2。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">以美国政府对日本汽车实行进口配额为例</strong>（三步骤）：第一步，配额最初影响进口，进而影响净出口与外汇市场上的美元需求曲线；第二步，汇率既定时进口减少使净出口增加，美元需求曲线右移（D1→D2）；第三步，美元需求增加使真实汇率从E1升至E2。","label":"以美国政府对日本汽车实行进口配额为例"},{"t":"解谜：可贷资金市场没有变动→真实利率不变→资本净流出不变→尽管进口减少，净出口并没有变动；关键是美元升值使国内物品相对更贵，鼓励进口、抑制出口，恰好抵消配额直接增加的净出口——进口配额既减少了进口也减少了出口，净出口不变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解谜</strong>：可贷资金市场没有变动→真实利率不变→资本净流出不变→尽管进口减少，净出口并没有变动；关键是美元升值使国内物品相对更贵，鼓励进口、抑制出口，恰好抵消配额直接增加的净出口——进口配额既减少了进口也减少了出口，净出口不变。","label":"解谜：可贷资金市场没有变动→真实利率…"},{"t":"核心结论：贸易政策并不影响贸易余额，因为 NX = NCO = S − I，而贸易政策并不改变国民储蓄与国内投资；储蓄与投资既定时，无论实行什么贸易政策，真实汇率的调整都使贸易余额保持不变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心结论</strong>：贸易政策并不影响贸易余额，因为 NX = NCO = S − I，而贸易政策并不改变国民储蓄与国内投资；储蓄与投资既定时，无论实行什么贸易政策，真实汇率的调整都使贸易余额保持不变。","label":"核心结论"},{"t":"微观影响：汽车配额使通用汽车面临的国外竞争减少（汽车净出口增加），而美元升值使波音面对空客竞争更困难（飞机净出口减少）；对日本的净出口增加、对欧洲的净出口减少，总体贸易余额不变——贸易政策的微观经济影响大于宏观经济影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">微观影响</strong>：汽车配额使通用汽车面临的国外竞争减少（汽车净出口增加），而美元升值使波音面对空客竞争更困难（飞机净出口减少）；对日本的净出口增加、对欧洲的净出口减少，总体贸易余额不变——贸易政策的微观经济影响大于宏观经济影响。","label":"微观影响"},{"t":"经济学家的态度：通常反对这种贸易政策，因为自由贸易使各经济专门从事自己最擅长的事，贸易限制妨碍从贸易中获得好处、减少整体经济福利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学家的态度</strong>：通常反对这种贸易政策，因为自由贸易使各经济专门从事自己最擅长的事，贸易限制妨碍从贸易中获得好处、减少整体经济福利。","label":"经济学家的态度"}],"k":"b","i":1,"h":"32.3.2 贸易政策","label":"32.3.2 贸易政策"},{"t":"32.3.3 政治不稳定与资本外逃","c":[{"t":"术语：资本外逃（capital flight）——对一个国家国内资产需求大量且突然的减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：资本外逃（capital flight）——对一个国家国内资产需求大量且突然的减少。","label":"术语：资本外逃（capital fl…"},{"t":"背景：1994年墨西哥政治不稳定（包括主要政治领导人遭暗杀）引发世界金融市场动荡，人们从墨西哥撤出资产转移到美国等\"安全的地方\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：1994年墨西哥政治不稳定（包括主要政治领导人遭暗杀）引发世界金融市场动荡，人们从墨西哥撤出资产转移到美国等&quot;安全的地方&quot;。","label":"背景：1994年墨西哥政治不稳定（包…"},{"t":"曲线移动：资本外逃使墨西哥的资本净流出增加——可贷资金需求曲线右移（D1→D2），同时资本净流出曲线右移（NCO1→NCO2），外汇市场上比索的供给增加（S1→S2）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">曲线移动</strong>：资本外逃使墨西哥的资本净流出增加——可贷资金需求曲线右移（D1→D2），同时资本净流出曲线右移（NCO1→NCO2），外汇市场上比索的供给增加（S1→S2）。","label":"曲线移动"},{"t":"新旧均衡：可贷资金需求增加使真实利率从r1上升到r2（利率上升只部分抵消资本外逃的影响）；比索供给增加使比索从E1贬值为E2——从1994年11月到1995年3月，墨西哥政府短期债券利率从14%上升到70%，比索价值从1比索兑29美分下降到1比索兑15美分。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新旧均衡</strong>：可贷资金需求增加使真实利率从r1上升到r2（利率上升只部分抵消资本外逃的影响）；比索供给增加使比索从E1贬值为E2——从1994年11月到1995年3月，墨西哥政府短期债券利率从14%上升到70%，比索价值从1比索兑29美分下降到1比索兑15美分。","label":"新旧均衡"},{"t":"数量影响：通货贬值使出口更廉价、进口更昂贵，贸易余额向盈余方向变动；利率上升减少了国内投资，放慢资本积累和经济增长的速度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数量影响</strong>：通货贬值使出口更廉价、进口更昂贵，贸易余额向盈余方向变动；利率上升减少了国内投资，放慢资本积累和经济增长的速度。","label":"数量影响"},{"t":"对其他国家的影响：资本外逃对资本流出国影响最大；对资本流入国（如美国）影响相反——美元升值、美国利率下降，但因美国经济规模大得多，影响不大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对其他国家的影响</strong>：资本外逃对资本流出国影响最大；对资本流入国（如美国）影响相反——美元升值、美国利率下降，但因美国经济规模大得多，影响不大。","label":"对其他国家的影响"},{"t":"类似事件：1997年泰国、韩国、印度尼西亚等亚洲经济体银行体系危机，1998年俄罗斯政府债务违约，2002年阿根廷——每次资本外逃的结果都与模型预期差不多：利率上升，通货贬值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">类似事件</strong>：1997年泰国、韩国、印度尼西亚等亚洲经济体银行体系危机，1998年俄罗斯政府债务违约，2002年阿根廷——每次资本外逃的结果都与模型预期差不多：利率上升，通货贬值。","label":"类似事件"},{"t":"案例研究要点（中国的资本流动）：鼓励资本流出的国家出现通货疲软和贸易盈余，接受资本流入的国家出现通货坚挺和贸易赤字；中国政府通过积累包括大量美国国债在内的外国资产压低人民币价值以支持出口行业，2000—2014年外汇储备从1.6万亿美元增加到约4万亿美元；美国因此贸易赤字扩大、与中国进口品竞争的生产者受损，但美国消费者从低价获益、来自中国的资本流入压低美国利率并增加投资，通盘考虑对美国经济的净影响可能很小；政策动机可能是国家层面的\"未雨绸缪\"（2015年中国增长放缓时动用储备约5000亿美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究要点</strong>（中国的资本流动）：鼓励资本流出的国家出现通货疲软和贸易盈余，接受资本流入的国家出现通货坚挺和贸易赤字；中国政府通过积累包括大量美国国债在内的外国资产压低人民币价值以支持出口行业，2000—2014年外汇储备从1.6万亿美元增加到约4万亿美元；美国因此贸易赤字扩大、与中国进口品竞争的生产者受损，但美国消费者从低价获益、来自中国的资本流入压低美国利率并增加投资，通盘考虑对美国经济的净影响可能很小；政策动机可能是国家层面的&quot;未雨绸缪&quot;（2015年中国增长放缓时动用储备约5000亿美元）。","label":"案例研究要点"},{"t":"即问即答要点：若美国人减少收入中支出的份额（增加储蓄），则可贷资金供给增加→利率下降→资本净流出增加→外汇市场美元供给增加→真实汇率下降（美元贬值）→净出口增加，贸易余额向盈余方向变动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：若美国人减少收入中支出的份额（增加储蓄），则可贷资金供给增加→利率下降→资本净流出增加→外汇市场美元供给增加→真实汇率下降（美元贬值）→净出口增加，贸易余额向盈余方向变动。","label":"即问即答要点"}],"k":"b","i":1,"h":"32.3.3 政治不稳定与资本外逃","label":"32.3.3 政治不稳定与资本外逃"}],"k":"sec","i":0,"h":"32.3 政策和事件如何影响开放经济","label":"32.3 政策和事件如何影响开放经济"},{"t":"32.4 结论","c":[{"t":"国际经济学日益重要：美国人在国外生产的物品与世界金融市场上的借贷越来越多，全面的经济分析要求了解一国经济如何与世界其他经济相互交易；本章提供了思考开放经济宏观经济学的基本模型。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">国际经济学日益重要</strong>：美国人在国外生产的物品与世界金融市场上的借贷越来越多，全面的经济分析要求了解一国经济如何与世界其他经济相互交易；本章提供了思考开放经济宏观经济学的基本模型。","label":"国际经济学日益重要"},{"t":"区分现实与神话：决策者和评论家往往把美国经济的问题归咎于外国人，经济学家通常认为这些问题是内生的——例如政治家把外国竞争视为生活水平的威胁，经济学家更可能将生活水平提高缓慢归因于国民储蓄的低水平；无论经济开放与否，低储蓄都抑制资本、生产率和生活水平的提高。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">区分现实与神话</strong>：决策者和评论家往往把美国经济的问题归咎于外国人，经济学家通常认为这些问题是内生的——例如政治家把外国竞争视为生活水平的威胁，经济学家更可能将生活水平提高缓慢归因于国民储蓄的低水平；无论经济开放与否，低储蓄都抑制资本、生产率和生活水平的提高。","label":"区分现实与神话"}],"k":"sec","i":0,"h":"32.4 结论","label":"32.4 结论"}],"k":"chap","h":"第32章 开放经济的宏观经济理论","label":"第32章 开放经济的宏观经济理论"}],"k":"part","h":"第11篇 开放经济的宏观经济学","label":"第11篇 开放经济的宏观经济学","col":"#8b5cf6","pc":"p4"},{"t":"第12篇 短期经济波动","c":[{"t":"第33章 总需求与总供给","c":[{"t":"本章内容提要","c":[{"t":"所有社会都经历过围绕长期趋势的短期经济波动；这些波动是无规律的且大体上不可预测的；衰退发生时，真实GDP以及有关收入、支出与生产的其他衡量指标都会下降，而失业会增加。","c":[],"k":"b","i":1,"h":"所有社会都经历过围绕长期趋势的短期经济波动；这些波动是无规律的且大体上不可预测的；衰退发生时，真实GDP以及有关收入、支出与生产的其他衡量指标都会下降，而失业会增加。","label":"所有社会都经历过围绕长期趋势的短期经…"},{"t":"古典经济理论建立在货币供给和物价水平这类名义变量并不影响产量和就业这类真实变量的假设之上；这个假设在长期中正确，在短期中并不正确；经济学家用总需求与总供给模型分析短期经济波动。","c":[],"k":"b","i":1,"h":"古典经济理论建立在货币供给和物价水平这类名义变量并不影响产量和就业这类真实变量的假设之上；这个假设在长期中正确，在短期中并不正确；经济学家用总需求与总供给模型分析短期经济波动。","label":"古典经济理论建立在货币供给和物价水平…"},{"t":"总需求曲线因财富效应、利率效应、汇率效应三个原因向右下方倾斜；物价水平既定时，任何一种增加消费、投资、政府购买或净出口的事件或政策都会增加总需求，反之则减少总需求。","c":[],"k":"b","i":1,"h":"总需求曲线因财富效应、利率效应、汇率效应三个原因向右下方倾斜；物价水平既定时，任何一种增加消费、投资、政府购买或净出口的事件或政策都会增加总需求，反之则减少总需求。","label":"总需求曲线因财富效应、利率效应、汇率…"},{"t":"长期总供给曲线是垂直的——长期中供给量取决于经济中的劳动、资本、自然资源和技术，但不取决于物价总水平；短期总供给曲线因黏性工资、黏性价格、错觉三种理论向右上方倾斜，且其位置还取决于预期的物价水平。","c":[],"k":"b","i":1,"h":"长期总供给曲线是垂直的——长期中供给量取决于经济中的劳动、资本、自然资源和技术，但不取决于物价总水平；短期总供给曲线因黏性工资、黏性价格、错觉三种理论向右上方倾斜，且其位置还取决于预期的物价水平。","label":"长期总供给曲线是垂直的——长期中供给…"},{"t":"总需求曲线移动的短期效应是产量与物价水平波动，长期效应只体现在物价水平上；影响总需求的决策者可以潜在地降低经济波动的严重性。","c":[],"k":"b","i":1,"h":"总需求曲线移动的短期效应是产量与物价水平波动，长期效应只体现在物价水平上；影响总需求的决策者可以潜在地降低经济波动的严重性。","label":"总需求曲线移动的短期效应是产量与物价…"},{"t":"总供给曲线移动引起滞胀；能影响总需求的决策者可以潜在地减缓其对产量的不利影响，但只能以加剧通货膨胀为代价。","c":[],"k":"b","i":1,"h":"总供给曲线移动引起滞胀；能影响总需求的决策者可以潜在地减缓其对产量的不利影响，但只能以加剧通货膨胀为代价。","label":"总供给曲线移动引起滞胀；能影响总需求…"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"33.1 关于经济波动的三个关键事实","c":[{"t":"背景与术语：经济平均每年增长约3%，但一些年份紧缩而非扩张；收入减少和失业增加较缓和的时期称为衰退（recession）——真实收入下降和失业增加的时期；较为严重的称为萧条（depression）——严重的衰退。2008—2009年衰退中，美国真实GDP从2007年第四季度到2009年第二季度下降4.2%，失业率从2007年5月的4.4%升至2009年10月的10.0%（近三十年最高）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">背景与术语</strong>：经济平均每年增长约3%，但一些年份紧缩而非扩张；收入减少和失业增加较缓和的时期称为衰退（recession）——真实收入下降和失业增加的时期；较为严重的称为萧条（depression）——严重的衰退。2008—2009年衰退中，美国真实GDP从2007年第四季度到2009年第二季度下降4.2%，失业率从2007年5月的4.4%升至2009年10月的10.0%（近三十年最高）。","label":"背景与术语"},{"t":"33.1.1 事实1：经济波动是无规律的且不可预测的","c":[{"t":"经济波动常被称为经济周期，但\"周期\"易引起误解——它暗示有规律、可预测的形式，实际上经济波动根本没有规律且几乎不可能准确预测。","c":[],"k":"b","i":2,"h":"经济波动常被称为经济周期，但&quot;周期&quot;易引起误解——它暗示有规律、可预测的形式，实际上经济波动根本没有规律且几乎不可能准确预测。","label":"经济波动常被称为经济周期，但\"周期\"…"},{"t":"衰退并非有规律地间隔发生：1980年与1982年的衰退相隔非常近；美国历史上最长的无衰退扩张期是1991年到2001年。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">衰退并非有规律地间隔发生</strong>：1980年与1982年的衰退相隔非常近；美国历史上最长的无衰退扩张期是1991年到2001年。","label":"衰退并非有规律地间隔发生"}],"k":"b","i":1,"h":"<strong class=\"lead\">33.1.1 事实1</strong>：经济波动是无规律的且不可预测的","label":"33.1.1 事实1"},{"t":"33.1.2 事实2：大多数宏观经济变量同时波动","c":[{"t":"真实GDP是监测短期变动最全面的指标（既衡量全部最终物品与服务产量，也衡量总收入）；但观察哪个指标实际上无关紧要——衰退时个人收入、公司利润、消费者支出、投资支出、工业生产、零售额、住房与汽车销售额等几乎同时变动，因为衰退是经济的总体现象。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">真实GDP是监测短期变动最全面的指标</strong>（既衡量全部最终物品与服务产量，也衡量总收入）；但观察哪个指标实际上无关紧要——衰退时个人收入、公司利润、消费者支出、投资支出、工业生产、零售额、住房与汽车销售额等几乎同时变动，因为衰退是经济的总体现象。","label":"真实GDP是监测短期变动最全面的指标"},{"t":"波动幅度并不相同：投资支出在经济周期中变动最大——平均只占GDP的七分之一左右，但衰退期间GDP减少的三分之二左右由投资减少导致。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">波动幅度并不相同</strong>：投资支出在经济周期中变动最大——平均只占GDP的七分之一左右，但衰退期间GDP减少的三分之二左右由投资减少导致。","label":"波动幅度并不相同"}],"k":"b","i":1,"h":"<strong class=\"lead\">33.1.2 事实2</strong>：大多数宏观经济变量同时波动","label":"33.1.2 事实2"},{"t":"33.1.3 事实3：随着产量的减少，失业增加","c":[{"t":"企业缩减产量时解雇工人：真实GDP减少时失业率上升；每次衰退中失业率都大幅上升，衰退结束、真实GDP回升后失业率才逐渐下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">企业缩减产量时解雇工人</strong>：真实GDP减少时失业率上升；每次衰退中失业率都大幅上升，衰退结束、真实GDP回升后失业率才逐渐下降。","label":"企业缩减产量时解雇工人"},{"t":"因为总有些工人的工作岗位在变动，失业率从未达到零，而是围绕5%或6%左右的自然失业率波动。","c":[],"k":"b","i":2,"h":"因为总有些工人的工作岗位在变动，失业率从未达到零，而是围绕5%或6%左右的自然失业率波动。","label":"因为总有些工人的工作岗位在变动，失业…"}],"k":"b","i":1,"h":"<strong class=\"lead\">33.1.3 事实3</strong>：随着产量的减少，失业增加","label":"33.1.3 事实3"},{"t":"即问即答要点：三个事实即上述\"无规律不可预测、多数宏观变量同时波动（投资波动最大）、产量减少时失业增加\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：三个事实即上述&quot;无规律不可预测、多数宏观变量同时波动（投资波动最大）、产量减少时失业增加&quot;。","label":"即问即答要点"}],"k":"sec","i":0,"h":"33.1 关于经济波动的三个关键事实","label":"33.1 关于经济波动的三个关键事实"},{"t":"33.2 解释短期经济波动","c":[{"t":"33.2.1 古典经济学的假设","c":[{"t":"前几章的长期理论建立在两种相关思想之上：古典二分法（把变量分为真实变量与名义变量）与货币中性（货币供给变动只影响名义变量，不影响真实变量）——货币量翻倍则每种东西的成本与每个人的收入都翻倍，而人们真正关心的事情（工作、购买力）完全不变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">前几章的长期理论建立在两种相关思想之上</strong>：古典二分法（把变量分为真实变量与名义变量）与货币中性（货币供给变动只影响名义变量，不影响真实变量）——货币量翻倍则每种东西的成本与每个人的收入都翻倍，而人们真正关心的事情（工作、购买力）完全不变。","label":"前几章的长期理论建立在两种相关思想之上"},{"t":"\"货币是一层面纱\"：经济变量通常用货币单位表示，但更重要的是其背后的真实变量与决定它们的经济力量；按古典理论须透过面纱观察。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">&quot;货币是一层面纱&quot;</strong>：经济变量通常用货币单位表示，但更重要的是其背后的真实变量与决定它们的经济力量；按古典理论须透过面纱观察。","label":"\"货币是一层面纱\""}],"k":"b","i":1,"h":"33.2.1 古典经济学的假设","label":"33.2.1 古典经济学的假设"},{"t":"33.2.2 短期波动的现实性","c":[{"t":"大多数经济学家认为古典理论描述长期中的世界，并未描述短期中的世界：在超过几年的时期中，货币供给变动影响物价和其他名义变量而不影响真实GDP、失业等真实变量；但研究逐年变动时，货币中性假设不再适用——短期中真实变量与名义变量高度相关，货币供给变动可以暂时使真实GDP背离其长期趋势。","c":[],"k":"b","i":2,"h":"大多数经济学家认为古典理论描述长期中的世界，并未描述短期中的世界：在超过几年的时期中，货币供给变动影响物价和其他名义变量而不影响真实GDP、失业等真实变量；但研究逐年变动时，货币中性假设不再适用——短期中真实变量与名义变量高度相关，货币供给变动可以暂时使真实GDP背离其长期趋势。","label":"大多数经济学家认为古典理论描述长期中…"},{"t":"甚至古典经济学家也认识到这一点：18世纪大卫·休谟观察到，黄金被发现使货币供给增加后，价格上升需要一段时间，其间经济中存在更高的就业率和更高的产量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">甚至古典经济学家也认识到这一点</strong>：18世纪大卫·休谟观察到，黄金被发现使货币供给增加后，价格上升需要一段时间，其间经济中存在更高的就业率和更高的产量。","label":"甚至古典经济学家也认识到这一点"},{"t":"短期分析必须放弃古典二分法与货币中性，不再把真实变量与名义变量分开研究，而把注意力集中在两类变量如何相互影响上。","c":[],"k":"b","i":2,"h":"短期分析必须放弃古典二分法与货币中性，不再把真实变量与名义变量分开研究，而把注意力集中在两类变量如何相互影响上。","label":"短期分析必须放弃古典二分法与货币中性…"}],"k":"b","i":1,"h":"33.2.2 短期波动的现实性","label":"33.2.2 短期波动的现实性"},{"t":"33.2.3 总需求与总供给模型","c":[{"t":"术语：总需求与总供给模型（model of aggregate demand and aggregate supply）——大多数经济学家用来解释经济活动围绕其长期趋势的短期波动的模型。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：总需求与总供给模型（model of aggregate demand and aggregate supply）——大多数经济学家用来解释经济活动围绕其长期趋势的短期波动的模型。","label":"术语：总需求与总供给模型（model…"},{"t":"术语：总需求曲线（aggregate-demand curve）——表示在每一种物价水平下，家庭、企业、政府和外国客户想要购买的物品与服务数量的曲线；总供给曲线（aggregate-supply curve）——表示在每一种物价水平下，企业生产并销售的物品与服务数量的曲线。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：总需求曲线（aggregate-demand curve）——表示在每一种物价水平下，家庭、企业、政府和外国客户想要购买的物品与服务数量的曲线；总供给曲线（aggregate-supply curve）——表示在每一种物价水平下，企业生产并销售的物品与服务数量的曲线。","label":"术语：总需求曲线（aggregate…"},{"t":"模型结构：纵轴是物价总水平（用CPI或GDP平减指数衡量，名义变量），横轴是物品与服务的总产量（用真实GDP衡量，真实变量）；产量和物价水平会调整到使总需求曲线与总供给曲线相交的那一点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">模型结构</strong>：纵轴是物价总水平（用CPI或GDP平减指数衡量，名义变量），横轴是物品与服务的总产量（用真实GDP衡量，真实变量）；产量和物价水平会调整到使总需求曲线与总供给曲线相交的那一点。","label":"模型结构"},{"t":"与微观供求模型的区别：单个市场（如冰淇淋市场）的买者卖者可在市场间转移资源，而这种微观经济替代对整个经济不可能——真实GDP衡量的是所有市场上所有企业产量的总量；因此总需求曲线与总供给曲线的斜率需要宏观经济学解释，不能视为单个市场需求供给曲线的放大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与微观供求模型的区别</strong>：单个市场（如冰淇淋市场）的买者卖者可在市场间转移资源，而这种微观经济替代对整个经济不可能——真实GDP衡量的是所有市场上所有企业产量的总量；因此总需求曲线与总供给曲线的斜率需要宏观经济学解释，不能视为单个市场需求供给曲线的放大。","label":"与微观供求模型的区别"},{"t":"即问即答要点：短期中真实变量与名义变量高度相关、货币非中性，这是与长期分析的区别；模型两轴分别是物价总水平与总产量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：短期中真实变量与名义变量高度相关、货币非中性，这是与长期分析的区别；模型两轴分别是物价总水平与总产量。","label":"即问即答要点"}],"k":"b","i":1,"h":"33.2.3 总需求与总供给模型","label":"33.2.3 总需求与总供给模型"}],"k":"sec","i":0,"h":"33.2 解释短期经济波动","label":"33.2 解释短期经济波动"},{"t":"33.3 总需求曲线","c":[{"t":"33.3.1 为什么总需求曲线向右下方倾斜","c":[{"t":"从 Y = C + I + G + NX 出发：假设政府支出由政策固定，考察物价水平如何影响消费、投资、净出口这三个取决于经济状况的组成部分。","c":[],"k":"b","i":2,"h":"从 Y = C + I + G + NX 出发：假设政府支出由政策固定，考察物价水平如何影响消费、投资、净出口这三个取决于经济状况的组成部分。","label":"从 Y = C + I + G + NX 出发"},{"t":"财富效应（wealth effect，物价水平与消费）：钱包和银行账户中货币的名义价值固定，物价水平下降提高美元的真实价值、增加真实财富与购买力，鼓励消费者更多支出；物价水平上升则降低真实财富、减少消费支出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">财富效应</strong>（wealth effect，物价水平与消费）：钱包和银行账户中货币的名义价值固定，物价水平下降提高美元的真实价值、增加真实财富与购买力，鼓励消费者更多支出；物价水平上升则降低真实财富、减少消费支出。","label":"财富效应"},{"t":"利率效应（interest-rate effect，物价水平与投资）：物价水平越低，家庭为购买想要的物品与服务需要持有的货币越少，会把超额货币换成有利息的债券或存款，利率随之下降；利率下降使借款更便宜，鼓励企业投资于新工厂和设备、家庭投资于新住房（也刺激汽车等信贷耐用品消费），投资支出增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利率效应</strong>（interest-rate effect，物价水平与投资）：物价水平越低，家庭为购买想要的物品与服务需要持有的货币越少，会把超额货币换成有利息的债券或存款，利率随之下降；利率下降使借款更便宜，鼓励企业投资于新工厂和设备、家庭投资于新住房（也刺激汽车等信贷耐用品消费），投资支出增加。","label":"利率效应"},{"t":"汇率效应（exchange-rate effect，物价水平与净出口）：美国物价下降→美国利率下降→美国投资者到国外寻求更高收益（如卖美国国债买德国国债）→外汇市场美元供给增加→美元真实贬值→外国物品相对变贵、美国物品相对便宜→进口减少、出口增加→净出口增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">汇率效应</strong>（exchange-rate effect，物价水平与净出口）：美国物价下降→美国利率下降→美国投资者到国外寻求更高收益（如卖美国国债买德国国债）→外汇市场美元供给增加→美元真实贬值→外国物品相对变贵、美国物品相对便宜→进口减少、出口增加→净出口增加。","label":"汇率效应"},{"t":"总结（表33-1）：物价水平下降通过三条途径增加需求量——消费者更富有（刺激消费）、利率下降（刺激投资）、通货贬值（刺激净出口）；物价上升时三种效应反向作用。总需求曲线是在\"其他条件相同\"（特别是货币供给固定）的假设下画出的，货币量变动会使曲线移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总结</strong>（表33-1）：物价水平下降通过三条途径增加需求量——消费者更富有（刺激消费）、利率下降（刺激投资）、通货贬值（刺激净出口）；物价上升时三种效应反向作用。总需求曲线是在&quot;其他条件相同&quot;（特别是货币供给固定）的假设下画出的，货币量变动会使曲线移动。","label":"总结（表33-1）：物价水平下降通过…"}],"k":"b","i":1,"h":"33.3.1 为什么总需求曲线向右下方倾斜","label":"33.3.1 为什么总需求曲线向右下…"},{"t":"33.3.2 为什么总需求曲线会移动","c":[{"t":"消费变动引起的移动：人们更关注退休生活而减少现期消费→AD左移；股市高涨使人更富、减少储蓄→AD右移；税收是政策变量——减税鼓励支出使AD右移，增税使AD左移。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">消费变动引起的移动</strong>：人们更关注退休生活而减少现期消费→AD左移；股市高涨使人更富、减少储蓄→AD右移；税收是政策变量——减税鼓励支出使AD右移，增税使AD左移。","label":"消费变动引起的移动"},{"t":"投资变动引起的移动：更快的电脑促使企业投资新系统→AD右移；企业对未来悲观削减投资→AD左移；投资税收抵免增加投资使AD右移、取消则左移；货币供给增加降低利率刺激投资使AD右移、货币供给减少则左移——历史上货币政策的变动是总需求移动的一个重要原因。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">投资变动引起的移动</strong>：更快的电脑促使企业投资新系统→AD右移；企业对未来悲观削减投资→AD左移；投资税收抵免增加投资使AD右移、取消则左移；货币供给增加降低利率刺激投资使AD右移、货币供给减少则左移——历史上货币政策的变动是总需求移动的一个重要原因。","label":"投资变动引起的移动"},{"t":"政府购买变动引起的移动：决策者移动总需求曲线最直接的方式；国会削减新武器系统购买→AD左移；州政府增建高速公路→AD右移。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政府购买变动引起的移动</strong>：决策者移动总需求曲线最直接的方式；国会削减新武器系统购买→AD左移；州政府增建高速公路→AD右移。","label":"政府购买变动引起的移动"},{"t":"净出口变动引起的移动：欧洲衰退使美国净出口减少→AD左移，欧洲复苏购买美国物品→AD右移；国际投机引起美元升值抑制净出口→AD左移，引起美元贬值则刺激净出口→AD右移。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">净出口变动引起的移动</strong>：欧洲衰退使美国净出口减少→AD左移，欧洲复苏购买美国物品→AD右移；国际投机引起美元升值抑制净出口→AD左移，引起美元贬值则刺激净出口→AD右移。","label":"净出口变动引起的移动"}],"k":"b","i":1,"h":"33.3.2 为什么总需求曲线会移动","label":"33.3.2 为什么总需求曲线会移动"}],"k":"sec","i":0,"h":"33.3 总需求曲线","label":"33.3 总需求曲线"},{"t":"33.4 总供给曲线","c":[{"t":"总供给曲线的走势取决于时间长短：在长期中总供给曲线是垂直的，而在短期中总供给曲线向右上方倾斜；要理解短期波动及其与长期走势的不一致，两条曲线都要考察。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总供给曲线的走势取决于时间长短</strong>：在长期中总供给曲线是垂直的，而在短期中总供给曲线向右上方倾斜；要理解短期波动及其与长期走势的不一致，两条曲线都要考察。","label":"总供给曲线的走势取决于时间长短"},{"t":"33.4.1 为什么长期中总供给曲线是垂直的","c":[{"t":"长期中，经济的物品与服务产量（真实GDP）取决于劳动、资本与自然资源的供给，以及把这些投入变为产出的技术知识；分析长期增长时根本不需要提到物价总水平（物价水平由货币量决定）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长期中，经济的物品与服务产量</strong>（真实GDP）取决于劳动、资本与自然资源的供给，以及把这些投入变为产出的技术知识；分析长期增长时根本不需要提到物价总水平（物价水平由货币量决定）。","label":"长期中，经济的物品与服务产量"},{"t":"货币量翻倍只使物价水平翻倍，不影响技术与要素供给，产量相同——物价水平并不影响真实GDP的长期决定因素，故长期总供给曲线是在自然产出水平上的一条垂线。","c":[],"k":"b","i":2,"h":"货币量翻倍只使物价水平翻倍，不影响技术与要素供给，产量相同——物价水平并不影响真实GDP的长期决定因素，故长期总供给曲线是在自然产出水平上的一条垂线。","label":"货币量翻倍只使物价水平翻倍，不影响技…"},{"t":"垂直的长期总供给曲线是古典二分法与货币中性的图形表示：产量（真实变量）不取决于物价水平（名义变量）；该原理适用于长期，不适用于逐年变动。","c":[],"k":"b","i":2,"h":"垂直的长期总供给曲线是古典二分法与货币中性的图形表示：产量（真实变量）不取决于物价水平（名义变量）；该原理适用于长期，不适用于逐年变动。","label":"垂直的长期总供给曲线是古典二分法与货…"}],"k":"b","i":1,"h":"33.4.1 为什么长期中总供给曲线是垂直的","label":"33.4.1 为什么长期中总供给曲线…"},{"t":"33.4.2 为什么长期总供给曲线会移动","c":[{"t":"术语：自然产出水平（natural level of output）——一个经济在长期中当失业率处于其自然水平或正常水平时达到的物品与服务的生产水平，又称潜在产量或充分就业产量，是经济在长期中所趋向的生产水平；任何改变自然产出水平的变动都使长期总供给曲线移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：自然产出水平（natural level of output）——一个经济在长期中当失业率处于其自然水平或正常水平时达到的物品与服务的生产水平，又称潜在产量或充分就业产量，是经济在长期中所趋向的生产水平；任何改变自然产出水平的变动都使长期总供给曲线移动。","label":"术语：自然产出水平（natural …"},{"t":"劳动变动引起的移动：移民增加工人数量→LRAS右移；自然失业率变动也起作用——国会大幅提高最低工资使自然失业率上升→LRAS左移，失业保险制度改革鼓励失业者更努力找工作→LRAS右移。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">劳动变动引起的移动</strong>：移民增加工人数量→LRAS右移；自然失业率变动也起作用——国会大幅提高最低工资使自然失业率上升→LRAS左移，失业保险制度改革鼓励失业者更努力找工作→LRAS右移。","label":"劳动变动引起的移动"},{"t":"资本变动引起的移动：资本存量增加（无论机器工厂等物质资本还是大学生等人力资本）提高生产率→LRAS右移；资本存量减少→LRAS左移。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">资本变动引起的移动</strong>：资本存量增加（无论机器工厂等物质资本还是大学生等人力资本）提高生产率→LRAS右移；资本存量减少→LRAS左移。","label":"资本变动引起的移动"},{"t":"自然资源变动引起的移动：新矿藏的发现→LRAS右移；造成农业减产的天气变化→LRAS左移；进口资源（如石油）可获得性的变动也是重要原因（历史上世界石油市场的事件曾多次移动美国的总供给曲线）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自然资源变动引起的移动</strong>：新矿藏的发现→LRAS右移；造成农业减产的天气变化→LRAS左移；进口资源（如石油）可获得性的变动也是重要原因（历史上世界石油市场的事件曾多次移动美国的总供给曲线）。","label":"自然资源变动引起的移动"},{"t":"技术知识变动引起的移动：技术进步（如电脑的发明与普及）是最重要的原因→LRAS右移；开放国际贸易像新技术一样使一国专事高生产率行业→LRAS右移；出于工人安全与环境考虑的新管制→LRAS左移。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">技术知识变动引起的移动</strong>：技术进步（如电脑的发明与普及）是最重要的原因→LRAS右移；开放国际贸易像新技术一样使一国专事高生产率行业→LRAS右移；出于工人安全与环境考虑的新管制→LRAS左移。","label":"技术知识变动引起的移动"},{"t":"规律：前几章中任何一种增加真实GDP的政策或事件都会使总供给曲线向右移动，任何一种减少真实GDP的政策或事件都使其向左移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规律</strong>：前几章中任何一种增加真实GDP的政策或事件都会使总供给曲线向右移动，任何一种减少真实GDP的政策或事件都使其向左移动。","label":"规律：前几章中任何一种增加真实GDP…"}],"k":"b","i":1,"h":"33.4.2 为什么长期总供给曲线会移动","label":"33.4.2 为什么长期总供给曲线会移动"},{"t":"33.4.3 用总需求和总供给来描述长期增长与通货膨胀","c":[{"t":"长期中现实世界最重要的两个移动因素是技术和货币政策：技术进步提高经济生产能力，使LRAS持续右移；美联储不断增加货币供给，使AD持续右移。","c":[],"k":"b","i":2,"h":"长期中现实世界最重要的两个移动因素是技术和货币政策：技术进步提高经济生产能力，使LRAS持续右移；美联储不断增加货币供给，使AD持续右移。","label":"长期中现实世界最重要的两个移动因素是…"},{"t":"图形结论（图33-5）：结果是产量持续增长（Y增加）与持续通货膨胀（P上升）并存——这只是增长与通货膨胀古典分析的另一种表述；提出本模型的目的不是给长期结论穿新外衣，而是为短期分析提供框架，应把短期波动视为对持续增长与通胀长期趋势的背离。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>（图33-5）：结果是产量持续增长（Y增加）与持续通货膨胀（P上升）并存——这只是增长与通货膨胀古典分析的另一种表述；提出本模型的目的不是给长期结论穿新外衣，而是为短期分析提供框架，应把短期波动视为对持续增长与通胀长期趋势的背离。","label":"图形结论"}],"k":"b","i":1,"h":"33.4.3 用总需求和总供给来描述长期增长与通货膨胀","label":"33.4.3 用总需求和总供给来描述…"},{"t":"33.4.4 为什么短期中总供给曲线会向右上方倾斜","c":[{"t":"短期与长期的关键差别是总供给的状况不同：短期中物价水平确实影响经济的产量——物价总水平上升往往增加供给量，下降往往减少供给量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短期与长期的关键差别是总供给的状况不同</strong>：短期中物价水平确实影响经济的产量——物价总水平上升往往增加供给量，下降往往减少供给量。","label":"短期与长期的关键差别是总供给的状况不同"},{"t":"三种理论的共性：每一种理论中，市场的不完全性都使供给一方的短期行为不同于长期；当实际物价水平背离人们预期的物价水平时，供给量就背离其长期水平或自然水平——物价高于预期则产量高于自然水平，低于预期则低于自然水平。可表述为：产量的供给量＝自然产出水平＋a×（实际物价水平−预期的物价水平）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三种理论的共性</strong>：每一种理论中，市场的不完全性都使供给一方的短期行为不同于长期；当实际物价水平背离人们预期的物价水平时，供给量就背离其长期水平或自然水平——物价高于预期则产量高于自然水平，低于预期则低于自然水平。可表述为：产量的供给量＝自然产出水平＋a×（实际物价水平−预期的物价水平）。","label":"三种理论的共性"},{"t":"黏性工资理论（sticky-wage theory）：名义工资对经济状况变动的调整缓慢（\"黏性\"），原因是固定名义工资的长期合同（可长达三年）与影响工资确定的社会规范和公正观念变动缓慢；名义工资基于预期物价确定——若实际物价低于预期（预期100实际95），每单位产品收入减少5%而劳动成本仍为每小时20美元，利润下降，企业少雇工人、减少供给量；若实际物价高于预期（105），利润增加，企业增雇增产。这是三种方法中最简单的，也是本书重点强调的理论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">黏性工资理论</strong>（sticky-wage theory）：名义工资对经济状况变动的调整缓慢（&quot;黏性&quot;），原因是固定名义工资的长期合同（可长达三年）与影响工资确定的社会规范和公正观念变动缓慢；名义工资基于预期物价确定——若实际物价低于预期（预期100实际95），每单位产品收入减少5%而劳动成本仍为每小时20美元，利润下降，企业少雇工人、减少供给量；若实际物价高于预期（105），利润增加，企业增雇增产。这是三种方法中最简单的，也是本书重点强调的理论。","label":"黏性工资理论"},{"t":"黏性价格理论（sticky-price theory）：一些物品与服务的价格调整缓慢，部分因为调整价格有成本——菜单成本（menu cost，印刷和分发目录的成本、改价签所需的时间）；未预料到的货币紧缩使物价总水平下降后，反应滞后企业的价格高于合意水平，销售量减少，于是削减生产和就业；物价水平高于预期时，低价企业的便宜价格吸引顾客，就业和生产增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">黏性价格理论</strong>（sticky-price theory）：一些物品与服务的价格调整缓慢，部分因为调整价格有成本——菜单成本（menu cost，印刷和分发目录的成本、改价签所需的时间）；未预料到的货币紧缩使物价总水平下降后，反应滞后企业的价格高于合意水平，销售量减少，于是削减生产和就业；物价水平高于预期时，低价企业的便宜价格吸引顾客，就业和生产增加。","label":"黏性价格理论"},{"t":"错觉理论（misperceptions theory）：物价总水平的变动会暂时误导供给者对自己产品的个别市场的看法——物价降到预期之下时，农民先注意到小麦价格下降、工人先注意到名义工资下降，误以为相对报酬暂时降低，从而减少小麦供给或劳动供给；错觉得到纠正前，高物价水平则诱使供给者增产。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">错觉理论</strong>（misperceptions theory）：物价总水平的变动会暂时误导供给者对自己产品的个别市场的看法——物价降到预期之下时，农民先注意到小麦价格下降、工人先注意到名义工资下降，误以为相对报酬暂时降低，从而减少小麦供给或劳动供给；错觉得到纠正前，高物价水平则诱使供给者增产。","label":"错觉理论"},{"t":"三种解释强调的都是暂时存在的问题：随时间推移，名义工资与价格变得不再黏性、错觉得到纠正；长期中工资价格具有弹性的假设与垂直的长期总供给曲线完全一致。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三种解释强调的都是暂时存在的问题</strong>：随时间推移，名义工资与价格变得不再黏性、错觉得到纠正；长期中工资价格具有弹性的假设与垂直的长期总供给曲线完全一致。","label":"三种解释强调的都是暂时存在的问题"}],"k":"b","i":1,"h":"33.4.4 为什么短期中总供给曲线会向右上方倾斜","label":"33.4.4 为什么短期中总供给曲线…"},{"t":"33.4.5 为什么短期总供给曲线会移动","c":[{"t":"使长期总供给曲线移动的变量（劳动、资本、自然资源、技术知识）同样使短期总供给曲线移动：资本存量增加提高生产率→两条曲线都右移；最低工资提高使自然失业率上升→两条曲线都左移。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">使长期总供给曲线移动的变量</strong>（劳动、资本、自然资源、技术知识）同样使短期总供给曲线移动：资本存量增加提高生产率→两条曲线都右移；最低工资提高使自然失业率上升→两条曲线都左移。","label":"使长期总供给曲线移动的变量"},{"t":"新增变量——预期的物价水平：工资、价格和错觉都根据预期的物价水平确定；预期物价水平上升→（按黏性工资理论）合同确定更高的名义工资、成本增加→每一实际物价水平下产量减少→SRAS左移；预期物价水平下降→名义工资与成本下降→SRAS右移。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新增变量——预期的物价水平</strong>：工资、价格和错觉都根据预期的物价水平确定；预期物价水平上升→（按黏性工资理论）合同确定更高的名义工资、成本增加→每一实际物价水平下产量减少→SRAS左移；预期物价水平下降→名义工资与成本下降→SRAS右移。","label":"新增变量——预期的物价水平"},{"t":"预期的作用是从短期转向长期的关键：短期中预期固定，经济处于总需求曲线与短期总供给曲线的交点；长期中人们观察到物价不同于预期并调整预期，短期总供给曲线移动，保证经济最终处于总需求曲线与长期总供给曲线的交点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">预期的作用是从短期转向长期的关键</strong>：短期中预期固定，经济处于总需求曲线与短期总供给曲线的交点；长期中人们观察到物价不同于预期并调整预期，短期总供给曲线移动，保证经济最终处于总需求曲线与长期总供给曲线的交点。","label":"预期的作用是从短期转向长期的关键"},{"t":"即问即答要点：既使长期又使短期总供给曲线移动的变量是劳动、资本、自然资源与技术；只使短期总供给曲线移动的变量是预期的物价水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：既使长期又使短期总供给曲线移动的变量是劳动、资本、自然资源与技术；只使短期总供给曲线移动的变量是预期的物价水平。","label":"即问即答要点"}],"k":"b","i":1,"h":"33.4.5 为什么短期总供给曲线会移动","label":"33.4.5 为什么短期总供给曲线会移动"}],"k":"sec","i":0,"h":"33.4 总供给曲线","label":"33.4 总供给曲线"},{"t":"33.5 经济波动的两个原因","c":[{"t":"出发点（长期均衡）：均衡产量和物价水平在长期中由总需求曲线与长期总供给曲线的交点决定（A点），产量为其自然水平；长期均衡时预期物价水平已调整到等于实际物价水平，因此短期总供给曲线也通过这一点——三条曲线交于一点。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">出发点</strong>（长期均衡）：均衡产量和物价水平在长期中由总需求曲线与长期总供给曲线的交点决定（A点），产量为其自然水平；长期均衡时预期物价水平已调整到等于实际物价水平，因此短期总供给曲线也通过这一点——三条曲线交于一点。","label":"出发点（长期均衡）：均衡产量和物价水…"},{"t":"分析宏观经济波动的四个步骤（表33-3）：①确定某个事件使总需求曲线移动、总供给曲线移动还是两者都移动；②确定曲线移动的方向；③用总需求和总供给图说明移动如何影响短期的产量和物价水平；④分析经济如何从新的短期均衡变动到新的长期均衡。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">分析宏观经济波动的四个步骤</strong>（表33-3）：①确定某个事件使总需求曲线移动、总供给曲线移动还是两者都移动；②确定曲线移动的方向；③用总需求和总供给图说明移动如何影响短期的产量和物价水平；④分析经济如何从新的短期均衡变动到新的长期均衡。","label":"分析宏观经济波动的四个步骤"},{"t":"33.5.1 总需求曲线移动的影响","c":[{"t":"情形：悲观情绪突然笼罩经济（白宫丑闻、股票市场崩溃或海外战争爆发），家庭削减支出并延迟重大购买，企业放弃购买新设备→总需求曲线从AD1向左移动到AD2。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情形</strong>：悲观情绪突然笼罩经济（白宫丑闻、股票市场崩溃或海外战争爆发），家庭削减支出并延迟重大购买，企业放弃购买新设备→总需求曲线从AD1向左移动到AD2。","label":"情形：悲观情绪突然笼罩经济（白宫丑闻…"},{"t":"短期（第三步）：经济沿最初的短期总供给曲线AS1从A点变动到B点，产量从Y1降到Y2、物价水平从P1降到P2——产量下降表明经济处于衰退，企业减少就业；引起移动的悲观主义在某种程度上是自我实现的（悲观引起收入下降和失业增加）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短期</strong>（第三步）：经济沿最初的短期总供给曲线AS1从A点变动到B点，产量从Y1降到Y2、物价水平从P1降到P2——产量下降表明经济处于衰退，企业减少就业；引起移动的悲观主义在某种程度上是自我实现的（悲观引起收入下降和失业增加）。","label":"短期（第三步）：经济沿最初的短期总供…"},{"t":"长期（第四步，自我校正）：物价降到低于人们的预期→随时间推移预期物价水平下降→工资、价格和感知调整（黏性工资理论下工人和企业重新谈判接受较低名义工资，劳动成本减少鼓励企业雇工扩产）→短期总供给曲线从AS1右移到AS2→经济到达C点（新总需求曲线AD2与LRAS的交点），产量回到自然水平，物价下降到P3；总需求移动的长期效应完全反映在物价水平上（名义变动），不反映在产量上（真实变动）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长期</strong>（第四步，自我校正）：物价降到低于人们的预期→随时间推移预期物价水平下降→工资、价格和感知调整（黏性工资理论下工人和企业重新谈判接受较低名义工资，劳动成本减少鼓励企业雇工扩产）→短期总供给曲线从AS1右移到AS2→经济到达C点（新总需求曲线AD2与LRAS的交点），产量回到自然水平，物价下降到P3；总需求移动的长期效应完全反映在物价水平上（名义变动），不反映在产量上（真实变动）。","label":"长期（第四步，自我校正）：物价降到低…"},{"t":"政策选择：决策者可通过增加政府支出或货币供给使总需求右移回到AD1；若足够快且准确，可抵消最初的移动，缩短低产量低就业的痛苦期——影响总需求的决策者可以潜在地降低经济波动的严重性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政策选择</strong>：决策者可通过增加政府支出或货币供给使总需求右移回到AD1；若足够快且准确，可抵消最初的移动，缩短低产量低就业的痛苦期——影响总需求的决策者可以潜在地降低经济波动的严重性。","label":"政策选择"},{"t":"三个重要结论：短期中总需求移动引起产量波动；长期中总需求移动只影响物价水平；影响总需求的决策者可潜在降低波动的严重性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三个重要结论</strong>：短期中总需求移动引起产量波动；长期中总需求移动只影响物价水平；影响总需求的决策者可潜在降低波动的严重性。","label":"三个重要结论"},{"t":"参考资料：再度审视货币中性——美联储减少货币量使AD左移，短期产量与物价都下降（经济经历衰退）；随预期物价下降、名义工资下调，SRAS右移，经济回到长期总供给曲线；货币在长期中是中性的，在短期中有真实影响——\"货币是一层面纱，但是当面纱被掀开时，真相就暴露出来了\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料</strong>：再度审视货币中性——美联储减少货币量使AD左移，短期产量与物价都下降（经济经历衰退）；随预期物价下降、名义工资下调，SRAS右移，经济回到长期总供给曲线；货币在长期中是中性的，在短期中有真实影响——&quot;货币是一层面纱，但是当面纱被掀开时，真相就暴露出来了&quot;。","label":"参考资料"},{"t":"案例研究要点（总需求曲线的两次重大移动：大萧条与第二次世界大战）：1929—1933年真实GDP减少27%、失业率从3%升至25%、物价水平下降22%——多数解释集中于总需求的大幅减少（货币供给减少28%，因银行倒闭与货币乘数反作用而美联储未用扩张性公开市场操作抵消；股价跌约90%减少家庭财富与消费；银行问题抑制投资融资）；1939—1944年政府购买几乎增加5倍，总需求巨大扩张使产量几乎翻番、物价上升20%（受物价管制限制）、失业率从17%降至1%——二战繁荣显而易见的原因是战争。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究要点</strong>（总需求曲线的两次重大移动：大萧条与第二次世界大战）：1929—1933年真实GDP减少27%、失业率从3%升至25%、物价水平下降22%——多数解释集中于总需求的大幅减少（货币供给减少28%，因银行倒闭与货币乘数反作用而美联储未用扩张性公开市场操作抵消；股价跌约90%减少家庭财富与消费；银行问题抑制投资融资）；1939—1944年政府购买几乎增加5倍，总需求巨大扩张使产量几乎翻番、物价上升20%（受物价管制限制）、失业率从17%降至1%——二战繁荣显而易见的原因是战争。","label":"案例研究要点"},{"t":"案例研究要点（2008—2009年的衰退）：起于住房市场繁荣——低利率与抵押贷款证券化（贷款捆绑为住房抵押贷款支持证券出售）使次级借款者更易获得贷款，1995—2006年美国房价翻了一番；2006—2009年房价下降约30%，后果有二：①没顶贷款（抵押贷款高于住房价值）违约与止赎激增，待售住房增加使房价螺旋下跌、住房建设支出大幅下降；②持有抵押贷款支持证券的金融机构巨亏、濒临破产，丧失放贷能力，金融体系配置资源的能力受损，连信誉好的客户也无法借款投资。总需求大幅收缩：2007年第四季度到2009年第二季度真实GDP下降4.7%，失业率从4.4%升至10.0%。政策反应：①美联储把联邦基金利率目标从2007年9月的5.25%降到2008年12月的接近于0，并购买住房抵押贷款支持证券和私人贷款；②2008年10月国会拨7000亿美元救助金融体系（以股本注入银行）；③2009年2月17日奥巴马签署总额7870亿美元的经济刺激法案。复苏始于2009年6月但较微弱（2009—2015年真实GDP年均增长2.1%，低于长期平均3%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究要点</strong>（2008—2009年的衰退）：起于住房市场繁荣——低利率与抵押贷款证券化（贷款捆绑为住房抵押贷款支持证券出售）使次级借款者更易获得贷款，1995—2006年美国房价翻了一番；2006—2009年房价下降约30%，后果有二：①没顶贷款（抵押贷款高于住房价值）违约与止赎激增，待售住房增加使房价螺旋下跌、住房建设支出大幅下降；②持有抵押贷款支持证券的金融机构巨亏、濒临破产，丧失放贷能力，金融体系配置资源的能力受损，连信誉好的客户也无法借款投资。总需求大幅收缩：2007年第四季度到2009年第二季度真实GDP下降4.7%，失业率从4.4%升至10.0%。政策反应：①美联储把联邦基金利率目标从2007年9月的5.25%降到2008年12月的接近于0，并购买住房抵押贷款支持证券和私人贷款；②2008年10月国会拨7000亿美元救助金融体系（以股本注入银行）；③2009年2月17日奥巴马签署总额7870亿美元的经济刺激法案。复苏始于2009年6月但较微弱（2009—2015年真实GDP年均增长2.1%，低于长期平均3%）。","label":"案例研究要点"}],"k":"b","i":1,"h":"33.5.1 总需求曲线移动的影响","label":"33.5.1 总需求曲线移动的影响"},{"t":"33.5.2 总供给曲线移动的影响","c":[{"t":"情形：一些企业的生产成本突然增加（农业州坏天气摧毁农作物、中东战争中断原油运输）→销售变得不太有利可图→短期总供给曲线从AS1向左移动到AS2（为简化假设长期总供给曲线不变）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情形</strong>：一些企业的生产成本突然增加（农业州坏天气摧毁农作物、中东战争中断原油运输）→销售变得不太有利可图→短期总供给曲线从AS1向左移动到AS2（为简化假设长期总供给曲线不变）。","label":"情形：一些企业的生产成本突然增加（农…"},{"t":"短期：经济沿总需求曲线从A点移动到B点，产量从Y1下降到Y2，物价水平从P1上升到P2——经济既经历停滞（产量下降）又经历通货膨胀（物价上升）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短期</strong>：经济沿总需求曲线从A点移动到B点，产量从Y1下降到Y2，物价水平从P1上升到P2——经济既经历停滞（产量下降）又经历通货膨胀（物价上升）。","label":"短期：经济沿总需求曲线从A点移动到B…"},{"t":"术语：滞胀（stagflation）——产量减少而物价上升的时期。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：滞胀（stagflation）——产量减少而物价上升的时期。","label":"术语：滞胀（stagflation）…"},{"t":"长期调整：最初企业和工人对高物价的反应是提高预期并确定更高的名义工资，成本进一步上升、SRAS继续左移，使滞胀加剧——物价上升引起工资上升、更高工资又引起更高物价，即工资—物价螺旋式上升；随后低产量与低就业压低工人的议价能力，名义工资下降，生产重新有利可图，SRAS右移回到AS1，物价下降、产量回到自然水平（假设总需求不变）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长期调整</strong>：最初企业和工人对高物价的反应是提高预期并确定更高的名义工资，成本进一步上升、SRAS继续左移，使滞胀加剧——物价上升引起工资上升、更高工资又引起更高物价，即工资—物价螺旋式上升；随后低产量与低就业压低工人的议价能力，名义工资下降，生产重新有利可图，SRAS右移回到AS1，物价下降、产量回到自然水平（假设总需求不变）。","label":"长期调整"},{"t":"抵消性政策：决策者可移动总需求曲线（AD1→AD2）恰好抵消SRAS移动对产量的影响，经济直接从A点移动到C点，产量仍为自然水平，但物价水平永久地从P1上升到P3——为维持较高的产量和就业水平而接受持久的高物价水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">抵消性政策</strong>：决策者可移动总需求曲线（AD1→AD2）恰好抵消SRAS移动对产量的影响，经济直接从A点移动到C点，产量仍为自然水平，但物价水平永久地从P1上升到P3——为维持较高的产量和就业水平而接受持久的高物价水平。","label":"抵消性政策"},{"t":"两个重要结论：总供给曲线移动会引起滞胀（衰退与通货膨胀的结合）；能影响总需求的决策者可以潜在地减缓总供给移动对产量的不利影响，但只能以加剧通货膨胀问题为代价。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个重要结论</strong>：总供给曲线移动会引起滞胀（衰退与通货膨胀的结合）；能影响总需求的决策者可以潜在地减缓总供给移动对产量的不利影响，但只能以加剧通货膨胀问题为代价。","label":"两个重要结论"},{"t":"案例研究要点（石油与经济）：原油是生产许多物品与服务的关键要素；OPEC卡特尔（企图阻止竞争并减产提价的卖者集团）20世纪70年代中期首次提价，1973—1975年石油价格几乎翻一番——美国CPI通胀率几十年来第一次超过10%，失业率从1973年的4.9%升至1975年的8.5%；70年代末再度限产，1978—1981年油价翻一番还多，通胀再次超过10%、失业率升至10%左右；1986年OPEC成员违背限产协议，世界油价几乎下降一半——SRAS右移，美国经历滞胀的反面：产量迅速增加、失业减少、通货膨胀率达多年最低。近年来节能努力、技术变革和替代能源使单位真实GDP所需石油量较70年代下降约40%，石油市场不再是经济波动的重要来源。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究要点</strong>（石油与经济）：原油是生产许多物品与服务的关键要素；OPEC卡特尔（企图阻止竞争并减产提价的卖者集团）20世纪70年代中期首次提价，1973—1975年石油价格几乎翻一番——美国CPI通胀率几十年来第一次超过10%，失业率从1973年的4.9%升至1975年的8.5%；70年代末再度限产，1978—1981年油价翻一番还多，通胀再次超过10%、失业率升至10%左右；1986年OPEC成员违背限产协议，世界油价几乎下降一半——SRAS右移，美国经历滞胀的反面：产量迅速增加、失业减少、通货膨胀率达多年最低。近年来节能努力、技术变革和替代能源使单位真实GDP所需石油量较70年代下降约40%，石油市场不再是经济波动的重要来源。","label":"案例研究要点"}],"k":"b","i":1,"h":"33.5.2 总供给曲线移动的影响","label":"33.5.2 总供给曲线移动的影响"},{"t":"参考资料：总需求与总供给模型的起源——该模型在很大程度上是20世纪30年代大萧条的副产品；1936年凯恩斯出版《就业、利息和货币通论》，其核心观点是衰退和萧条的发生是因为对物品与服务的总需求不足，并主张增加总需求的政策（如增加政府公共支出）；针对只解释长期效应的古典理论，他写道：\"长期是对当前事情的一个误导。在长期中，我们都死了。……\"本章与下一章的分析多有凯恩斯的思想遗产。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料</strong>：总需求与总供给模型的起源——该模型在很大程度上是20世纪30年代大萧条的副产品；1936年凯恩斯出版《就业、利息和货币通论》，其核心观点是衰退和萧条的发生是因为对物品与服务的总需求不足，并主张增加总需求的政策（如增加政府公共支出）；针对只解释长期效应的古典理论，他写道：&quot;长期是对当前事情的一个误导。在长期中，我们都死了。……&quot;本章与下一章的分析多有凯恩斯的思想遗产。","label":"参考资料"},{"t":"即问即答要点：受欢迎的总统候选人当选突然增强人们对未来的信心→在每一物价水平下消费与投资增加→总需求曲线右移→短期产量与物价水平都上升。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：受欢迎的总统候选人当选突然增强人们对未来的信心→在每一物价水平下消费与投资增加→总需求曲线右移→短期产量与物价水平都上升。","label":"即问即答要点"}],"k":"sec","i":0,"h":"33.5 经济波动的两个原因","label":"33.5 经济波动的两个原因"},{"t":"33.6 结论","c":[{"t":"本章实现两个目标：讨论了经济活动短期波动的重要事实；介绍了解释这些波动的基本模型——总需求与总供给模型。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章实现两个目标</strong>：讨论了经济活动短期波动的重要事实；介绍了解释这些波动的基本模型——总需求与总供给模型。","label":"本章实现两个目标"},{"t":"下一章继续研究该模型，更深入理解是什么引起经济波动以及决策者如何用货币政策与财政政策对波动做出反应。","c":[],"k":"b","i":1,"h":"下一章继续研究该模型，更深入理解是什么引起经济波动以及决策者如何用货币政策与财政政策对波动做出反应。","label":"下一章继续研究该模型，更深入理解是什…"}],"k":"sec","i":0,"h":"33.6 结论","label":"33.6 结论"}],"k":"chap","h":"第33章 总需求与总供给","label":"第33章 总需求与总供给"},{"t":"第34章 货币政策和财政政策对总需求的影响","c":[{"t":"本章内容提要","c":[{"t":"在建立短期经济波动理论时，凯恩斯提出了流动性偏好理论来解释利率的决定因素；根据这种理论，利率的调整会使货币的供求达到平衡。","c":[],"k":"b","i":1,"h":"在建立短期经济波动理论时，凯恩斯提出了流动性偏好理论来解释利率的决定因素；根据这种理论，利率的调整会使货币的供求达到平衡。","label":"在建立短期经济波动理论时，凯恩斯提出…"},{"t":"物价水平上升增加了货币需求，提高了使货币市场均衡的利率；由于利率代表借款的成本，较高的利率减少了投资，从而减少了物品与服务的需求量——这解释了总需求曲线为什么向右下方倾斜。","c":[],"k":"b","i":1,"h":"物价水平上升增加了货币需求，提高了使货币市场均衡的利率；由于利率代表借款的成本，较高的利率减少了投资，从而减少了物品与服务的需求量——这解释了总需求曲线为什么向右下方倾斜。","label":"物价水平上升增加了货币需求，提高了使…"},{"t":"决策者可以用货币政策影响总需求：货币供给增加降低物价水平既定时的均衡利率，较低利率刺激投资，总需求曲线向右移动；货币供给减少则提高利率，总需求曲线向左移动。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">决策者可以用货币政策影响总需求</strong>：货币供给增加降低物价水平既定时的均衡利率，较低利率刺激投资，总需求曲线向右移动；货币供给减少则提高利率，总需求曲线向左移动。","label":"决策者可以用货币政策影响总需求"},{"t":"决策者还可以用财政政策影响总需求：政府购买增加或减税使总需求曲线向右移动；政府购买减少或增税使总需求曲线向左移动。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">决策者还可以用财政政策影响总需求</strong>：政府购买增加或减税使总需求曲线向右移动；政府购买减少或增税使总需求曲线向左移动。","label":"决策者还可以用财政政策影响总需求"},{"t":"政府改变支出或税收时，引起的总需求变动幅度可能大于也可能小于财政变动幅度：乘数效应倾向于扩大影响，挤出效应倾向于缩小影响。","c":[],"k":"b","i":1,"h":"政府改变支出或税收时，引起的总需求变动幅度可能大于也可能小于财政变动幅度：乘数效应倾向于扩大影响，挤出效应倾向于缩小影响。","label":"政府改变支出或税收时，引起的总需求变…"},{"t":"由于货币政策和财政政策可以影响总需求，政府有时用这些政策工具试图稳定经济；积极稳定政策的支持者强调应抵消家庭与企业态度变动引起的总需求波动，批评者则强调政策存在相当长的时滞，稳定努力往往以不稳定告终。","c":[],"k":"b","i":1,"h":"由于货币政策和财政政策可以影响总需求，政府有时用这些政策工具试图稳定经济；积极稳定政策的支持者强调应抵消家庭与企业态度变动引起的总需求波动，批评者则强调政策存在相当长的时滞，稳定努力往往以不稳定告终。","label":"由于货币政策和财政政策可以影响总需求…"},{"t":"自动稳定器是无需决策者有意识行动即可在衰退中刺激总需求的财政政策变动，能减小经济波动幅度。","c":[],"k":"b","i":1,"h":"自动稳定器是无需决策者有意识行动即可在衰退中刺激总需求的财政政策变动，能减小经济波动幅度。","label":"自动稳定器是无需决策者有意识行动即可…"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"34.1 货币政策如何影响总需求","c":[{"t":"总需求曲线向右下方倾斜的三个原因：财富效应（货币持有量只是财富一小部分，最不重要）、利率效应（对美国经济最重要）、汇率效应（进出口占GDP比重小故对美国不重要，对小国更重要）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总需求曲线向右下方倾斜的三个原因</strong>：财富效应（货币持有量只是财富一小部分，最不重要）、利率效应（对美国经济最重要）、汇率效应（进出口占GDP比重小故对美国不重要，对小国更重要）。","label":"总需求曲线向右下方倾斜的三个原因"},{"t":"34.1.1 流动性偏好理论","c":[{"t":"流动性偏好理论（theory of liquidity preference）：凯恩斯提出的理论，认为利率的调整会使货币供给与货币需求达到平衡；它本质上只是供给与需求的应用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">流动性偏好理论</strong>（theory of liquidity preference）：凯恩斯提出的理论，认为利率的调整会使货币供给与货币需求达到平衡；它本质上只是供给与需求的应用。","label":"流动性偏好理论"},{"t":"分析中假设预期通货膨胀率不变（短期中一般稳定），因此名义利率与真实利率同方向变动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">分析中假设预期通货膨胀率不变</strong>（短期中一般稳定），因此名义利率与真实利率同方向变动。","label":"分析中假设预期通货膨胀率不变"},{"t":"货币供给：由美联储控制，主要通过公开市场操作买卖政府债券改变银行准备金，也可用贴现率、法定准备金等工具；为分析简便，假设货币供给量固定在美联储设定的水平，不取决于利率——供给曲线垂直。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币供给</strong>：由美联储控制，主要通过公开市场操作买卖政府债券改变银行准备金，也可用贴现率、法定准备金等工具；为分析简便，假设货币供给量固定在美联储设定的水平，不取决于利率——供给曲线垂直。","label":"货币供给"},{"t":"流动性（liquidity）：一种资产转换为经济中交换媒介的难易程度；货币是定义上最具流动性的资产。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">流动性</strong>（liquidity）：一种资产转换为经济中交换媒介的难易程度；货币是定义上最具流动性的资产。","label":"流动性（liquidity）：一种资…"},{"t":"货币需求（money demand）：人们选择持有货币而不持有收益率较高的资产，是因为货币可用于购买物品与服务；利率是持有货币的机会成本——利率上升增加持有货币的成本、减少货币需求量，货币需求曲线向右下方倾斜。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币需求</strong>（money demand）：人们选择持有货币而不持有收益率较高的资产，是因为货币可用于购买物品与服务；利率是持有货币的机会成本——利率上升增加持有货币的成本、减少货币需求量，货币需求曲线向右下方倾斜。","label":"货币需求"},{"t":"货币市场均衡：存在使货币需求量正好等于供给量的均衡利率；利率高于均衡时存在超额货币供给，人们抛出货币买债券，利率受压下降；利率低于均衡时存在超额货币需求，人们卖出债券，利率受压上升。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币市场均衡</strong>：存在使货币需求量正好等于供给量的均衡利率；利率高于均衡时存在超额货币供给，人们抛出货币买债券，利率受压下降；利率低于均衡时存在超额货币需求，人们卖出债券，利率受压上升。","label":"货币市场均衡"},{"t":"参考资料「长期利率与短期利率」：长期用可贷资金理论（产量由要素与技术决定→利率平衡可贷资金供求→物价调整平衡货币供求）；短期把顺序颠倒（物价水平黏性固定→利率调整平衡货币供求→利率影响总需求与产量）。两个利率理论各用于不同目的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「长期利率与短期利率」</strong>：长期用可贷资金理论（产量由要素与技术决定→利率平衡可贷资金供求→物价调整平衡货币供求）；短期把顺序颠倒（物价水平黏性固定→利率调整平衡货币供求→利率影响总需求与产量）。两个利率理论各用于不同目的。","label":"参考资料「长期利率与短期利率」"}],"k":"b","i":1,"h":"34.1.1 流动性偏好理论","label":"34.1.1 流动性偏好理论"},{"t":"34.1.2 总需求曲线向右下方倾斜（利率效应）","c":[{"t":"三步逻辑：较高的物价水平增加货币需求→较高的货币需求引起较高的利率→较高的利率减少物品与服务的需求量（住房投资与企业投资减少）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三步逻辑</strong>：较高的物价水平增加货币需求→较高的货币需求引起较高的利率→较高的利率减少物品与服务的需求量（住房投资与企业投资减少）。","label":"三步逻辑"},{"t":"反方向同样成立：较低的物价水平→较少的货币需求→较低的利率→较多的需求量；物价水平与需求量负相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反方向同样成立</strong>：较低的物价水平→较少的货币需求→较低的利率→较多的需求量；物价水平与需求量负相关。","label":"反方向同样成立"}],"k":"b","i":1,"h":"<strong class=\"lead\">34.1.2 总需求曲线向右下方倾斜</strong>（利率效应）","label":"34.1.2 总需求曲线向右下方倾斜"},{"t":"34.1.3 货币供给的变动","c":[{"t":"美联储在公开市场购买政府债券注入货币：货币供给曲线右移→均衡利率下降→借款成本下降刺激住房投资与企业投资→每一物价水平下需求量增加→总需求曲线向右移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">美联储在公开市场购买政府债券注入货币</strong>：货币供给曲线右移→均衡利率下降→借款成本下降刺激住房投资与企业投资→每一物价水平下需求量增加→总需求曲线向右移动。","label":"美联储在公开市场购买政府债券注入货币"},{"t":"紧缩货币供给则提高利率、减少既定物价水平下的需求量，使总需求曲线向左移动。","c":[],"k":"b","i":2,"h":"紧缩货币供给则提高利率、减少既定物价水平下的需求量，使总需求曲线向左移动。","label":"紧缩货币供给则提高利率、减少既定物价…"}],"k":"b","i":1,"h":"34.1.3 货币供给的变动","label":"34.1.3 货币供给的变动"},{"t":"34.1.4 美联储政策中利率目标的作用","c":[{"t":"美联储近年通过为联邦基金利率（银行相互之间对短期贷款收取的利率）设定目标来运用货币政策，每六周在联邦公开市场委员会会议上重新评估；理由是货币供给难以准确衡量且货币需求一直在波动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">美联储近年通过为联邦基金利率</strong>（银行相互之间对短期贷款收取的利率）设定目标来运用货币政策，每六周在联邦公开市场委员会会议上重新评估；理由是货币供给难以准确衡量且货币需求一直在波动。","label":"美联储近年通过为联邦基金利率"},{"t":"关键原理：货币政策既可以用货币供给来描述，也可以用利率来描述——设定利率目标就是承诺调整货币供给使货币市场在该利率下均衡；降利率目标＝买债券＝货币供给增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键原理</strong>：货币政策既可以用货币供给来描述，也可以用利率来描述——设定利率目标就是承诺调整货币供给使货币市场在该利率下均衡；降利率目标＝买债券＝货币供给增加。","label":"关键原理"},{"t":"案例研究「为什么美联储关注股市（股市也关注美联储）」：股市高涨通过财富效应刺激消费支出、通过便利企业发新股刺激投资支出，从而扩大总需求，美联储的反应是使货币供给低于、利率高于股市不高涨时的水平（如20世纪90年代末）；股市下跌时相反，1987年10月19日股市暴跌22.6%，美联储增加货币供给、降低联邦基金利率（从月初7.7%降到月底6.6%），帮助经济避免衰退；2008—2009年衰退期间降息也未能扭转严重衰退。反向看，美联储加息使债券更有吸引力并压低利润，股价通常下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「为什么美联储关注股市</strong>（股市也关注美联储）」：股市高涨通过财富效应刺激消费支出、通过便利企业发新股刺激投资支出，从而扩大总需求，美联储的反应是使货币供给低于、利率高于股市不高涨时的水平（如20世纪90年代末）；股市下跌时相反，1987年10月19日股市暴跌22.6%，美联储增加货币供给、降低联邦基金利率（从月初7.7%降到月底6.6%），帮助经济避免衰退；2008—2009年衰退期间降息也未能扭转严重衰退。反向看，美联储加息使债券更有吸引力并压低利润，股价通常下降。","label":"案例研究「为什么美联储关注股市"}],"k":"b","i":1,"h":"34.1.4 美联储政策中利率目标的作用","label":"34.1.4 美联储政策中利率目标的作用"},{"t":"34.1.5 利率降至零","c":[{"t":"流动性陷阱（liquidity trap）：利率已降至接近零时，扩张性货币政策因利率不能再下降而可能失效——名义利率不会降到零以下，人们宁可持有现金也不以负利率放贷，额外流动性不再有效果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">流动性陷阱</strong>（liquidity trap）：利率已降至接近零时，扩张性货币政策因利率不能再下降而可能失效——名义利率不会降到零以下，人们宁可持有现金也不以负利率放贷，额外流动性不再有效果。","label":"流动性陷阱"},{"t":"应对之道：一是承诺未来的货币扩张以提高通货膨胀预期，即使名义利率触零，较高的预期通胀也可使真实利率为负、刺激投资；二是非常规的扩张性公开市场操作（购买抵押贷款、公司债券），即量化宽松（quantitative easing），2008—2009年衰退期间美联储积极推进。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应对之道</strong>：一是承诺未来的货币扩张以提高通货膨胀预期，即使名义利率触零，较高的预期通胀也可使真实利率为负、刺激投资；二是非常规的扩张性公开市场操作（购买抵押贷款、公司债券），即量化宽松（quantitative easing），2008—2009年衰退期间美联储积极推进。","label":"应对之道"},{"t":"一些经济学家据此主张目标通货膨胀率高于零（如4%）：适度的通货膨胀给货币决策者留出把真实利率降为负数的空间，降低陷入流动性陷阱的风险。","c":[],"k":"b","i":2,"h":"一些经济学家据此主张目标通货膨胀率高于零（如4%）：适度的通货膨胀给货币决策者留出把真实利率降为负数的空间，降低陷入流动性陷阱的风险。","label":"一些经济学家据此主张目标通货膨胀率高于零"}],"k":"b","i":1,"h":"34.1.5 利率降至零","label":"34.1.5 利率降至零"}],"k":"sec","i":0,"h":"34.1 货币政策如何影响总需求","label":"34.1 货币政策如何影响总需求"},{"t":"34.2 财政政策如何影响总需求","c":[{"t":"财政政策（fiscal policy）：政府决策者对政府支出和税收水平的确定；短期中主要影响物品与服务的总需求。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">财政政策</strong>（fiscal policy）：政府决策者对政府支出和税收水平的确定；短期中主要影响物品与服务的总需求。","label":"财政政策"},{"t":"34.2.1 政府购买的变动","c":[{"t":"货币政策与税收通过影响家庭和企业的支出决策间接移动总需求曲线；政府改变物品与服务的购买（如国防部向波音公司订购200亿美元战斗机）则直接使总需求曲线右移。","c":[],"k":"b","i":2,"h":"货币政策与税收通过影响家庭和企业的支出决策间接移动总需求曲线；政府改变物品与服务的购买（如国防部向波音公司订购200亿美元战斗机）则直接使总需求曲线右移。","label":"货币政策与税收通过影响家庭和企业的支…"},{"t":"两种宏观经济效应使移动幅度不同于购买额本身：乘数效应（使移动幅度大于200亿美元）与挤出效应（使移动幅度小于200亿美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两种宏观经济效应使移动幅度不同于购买额本身</strong>：乘数效应（使移动幅度大于200亿美元）与挤出效应（使移动幅度小于200亿美元）。","label":"两种宏观经济效应使移动幅度不同于购买额本身"}],"k":"b","i":1,"h":"34.2.1 政府购买的变动","label":"34.2.1 政府购买的变动"},{"t":"34.2.2 乘数效应","c":[{"t":"乘数效应（multiplier effect）：当扩张性财政政策增加了收入，从而增加了消费支出时引起的总需求的额外变动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">乘数效应</strong>（multiplier effect）：当扩张性财政政策增加了收入，从而增加了消费支出时引起的总需求的额外变动。","label":"乘数效应"},{"t":"机制：政府购买增加→工人收入与企业利润增加→消费支出增加→带动其他企业收入与利润→再刺激消费，正反馈循环往复；政府支出每1美元可增加的总需求大于1美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机制</strong>：政府购买增加→工人收入与企业利润增加→消费支出增加→带动其他企业收入与利润→再刺激消费，正反馈循环往复；政府支出每1美元可增加的总需求大于1美元。","label":"机制：政府购买增加→工人收入与企业利…"},{"t":"较高需求还可能刺激投资品需求（波音购买设备、建厂），这种来自投资需求的正反馈被称为投资加速数。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">较高需求还可能刺激投资品需求</strong>（波音购买设备、建厂），这种来自投资需求的正反馈被称为投资加速数。","label":"较高需求还可能刺激投资品需求"}],"k":"b","i":1,"h":"34.2.2 乘数效应","label":"34.2.2 乘数效应"},{"t":"34.2.3 支出乘数的公式","c":[{"t":"边际消费倾向（MPC）：家庭额外收入中用于消费而不是用于储蓄的比例。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边际消费倾向</strong>（MPC）：家庭额外收入中用于消费而不是用于储蓄的比例。","label":"边际消费倾向"},{"t":"推导：政府购买变动＋第一轮消费（MPC×购买额）＋第二轮（MPC²×购买额）＋……，故乘数＝1＋MPC＋MPC²＋MPC³＋…＝1/(1−MPC)。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推导</strong>：政府购买变动＋第一轮消费（MPC×购买额）＋第二轮（MPC²×购买额）＋……，故乘数＝1＋MPC＋MPC²＋MPC³＋…＝1/(1−MPC)。","label":"推导：政府购买变动＋第一轮消费（MP…"},{"t":"MPC为3/4时乘数为4：政府支出200亿美元产生800亿美元需求；MPC为1/2时乘数为2。MPC越大，消费对收入变动的反应越大，乘数越大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">MPC为3/4时乘数为4</strong>：政府支出200亿美元产生800亿美元需求；MPC为1/2时乘数为2。MPC越大，消费对收入变动的反应越大，乘数越大。","label":"MPC为3/4时乘数为4"}],"k":"b","i":1,"h":"34.2.3 支出乘数的公式","label":"34.2.3 支出乘数的公式"},{"t":"34.2.4 乘数效应的其他应用","c":[{"t":"乘数逻辑不限于政府购买，适用于改变GDP任何一个组成部分（消费、投资、政府购买、净出口）支出的任何事件。","c":[],"k":"b","i":2,"h":"乘数逻辑不限于政府购买，适用于改变GDP任何一个组成部分（消费、投资、政府购买、净出口）支出的任何事件。","label":"乘数逻辑不限于政府购买，适用于改变G…"},{"t":"例：国外衰退使美国净出口需求减少100亿美元，若乘数为4，总需求减少400亿美元；股市高涨刺激消费200亿美元，总需求增加800亿美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例</strong>：国外衰退使美国净出口需求减少100亿美元，若乘数为4，总需求减少400亿美元；股市高涨刺激消费200亿美元，总需求增加800亿美元。","label":"例：国外衰退使美国净出口需求减少10…"}],"k":"b","i":1,"h":"34.2.4 乘数效应的其他应用","label":"34.2.4 乘数效应的其他应用"},{"t":"34.2.5 挤出效应","c":[{"t":"挤出效应（crowding-out effect）：当扩张性财政政策引起利率上升，从而减少投资支出时所引起的总需求减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">挤出效应</strong>（crowding-out effect）：当扩张性财政政策引起利率上升，从而减少投资支出时所引起的总需求减少。","label":"挤出效应"},{"t":"机制：财政扩张→收入增加→家庭想以流动性形式持有更多财富，货币需求右移（货币供给不变）→利率上升→借款成本上升，住房与企业投资品需求减少，部分抵消财政扩张对总需求的影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机制</strong>：财政扩张→收入增加→家庭想以流动性形式持有更多财富，货币需求右移（货币供给不变）→利率上升→借款成本上升，住房与企业投资品需求减少，部分抵消财政扩张对总需求的影响。","label":"机制：财政扩张→收入增加→家庭想以流…"},{"t":"结论：政府增加200亿美元购买时，总需求的增加可能大于也可能小于200亿美元，取决于乘数效应与挤出效应的大小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：政府增加200亿美元购买时，总需求的增加可能大于也可能小于200亿美元，取决于乘数效应与挤出效应的大小。","label":"结论：政府增加200亿美元购买时，总…"}],"k":"b","i":1,"h":"34.2.5 挤出效应","label":"34.2.5 挤出效应"},{"t":"34.2.6 税收变动","c":[{"t":"减税增加家庭可拿回家的收入，一部分储蓄、一部分消费，消费支出增加使总需求曲线右移；增税抑制消费支出，使总需求曲线左移。","c":[],"k":"b","i":2,"h":"减税增加家庭可拿回家的收入，一部分储蓄、一部分消费，消费支出增加使总需求曲线右移；增税抑制消费支出，使总需求曲线左移。","label":"减税增加家庭可拿回家的收入，一部分储…"},{"t":"税收变动的效果同样受乘数效应（收入与利润增加再刺激消费）与挤出效应（收入提高货币需求、推高利率、挤出投资）影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">税收变动的效果同样受乘数效应</strong>（收入与利润增加再刺激消费）与挤出效应（收入提高货币需求、推高利率、挤出投资）影响。","label":"税收变动的效果同样受乘数效应"},{"t":"第三个决定因素是家庭对税收变动是持久还是暂时的感知：预期持久减税会大幅增加支出、对总需求影响重大；预期暂时减税只少量增加支出、影响很小。","c":[],"k":"b","i":2,"h":"第三个决定因素是家庭对税收变动是持久还是暂时的感知：预期持久减税会大幅增加支出、对总需求影响重大；预期暂时减税只少量增加支出、影响很小。","label":"第三个决定因素是家庭对税收变动是持久…"},{"t":"例：1992年布什总统宣布减少工资支票的所得税预扣，但法定税率未变，次年4月15日前须补缴，实质只是政府的短期贷款，对消费支出和总需求的影响较小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例</strong>：1992年布什总统宣布减少工资支票的所得税预扣，但法定税率未变，次年4月15日前须补缴，实质只是政府的短期贷款，对消费支出和总需求的影响较小。","label":"例：1992年布什总统宣布减少工资支…"},{"t":"参考资料「财政政策如何影响总供给」：减税可增强工作与生产的激励，政府修公路等资本支出可提高企业生产率，都使总供给曲线右移；供给学派认为减税的影响大到能增加税收收入，多数经济学家不认为这是正常情况；对总供给的影响长期中比短期中更重要。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「财政政策如何影响总供给」</strong>：减税可增强工作与生产的激励，政府修公路等资本支出可提高企业生产率，都使总供给曲线右移；供给学派认为减税的影响大到能增加税收收入，多数经济学家不认为这是正常情况；对总供给的影响长期中比短期中更重要。","label":"参考资料「财政政策如何影响总供给」"}],"k":"b","i":1,"h":"34.2.6 税收变动","label":"34.2.6 税收变动"}],"k":"sec","i":0,"h":"34.2 财政政策如何影响总需求","label":"34.2 财政政策如何影响总需求"},{"t":"34.3 运用政策来稳定经济","c":[{"t":"稳定政策（stabilization policy）：运用货币政策与财政政策工具试图抵消总需求变动，从而稳定产量与就业的政策尝试；围绕\"是否应该用、何时用\"存在争论。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">稳定政策</strong>（stabilization policy）：运用货币政策与财政政策工具试图抵消总需求变动，从而稳定产量与就业的政策尝试；围绕&quot;是否应该用、何时用&quot;存在争论。","label":"稳定政策"},{"t":"34.3.1 支持积极稳定政策论","c":[{"t":"货币政策可抵消财政政策的不利影响：政府增税抑制总需求时，美联储可增加货币供给、降低利率、刺激投资，使总需求不受影响——联邦公开市场委员会正是这样关注财政政策争论的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币政策可抵消财政政策的不利影响</strong>：政府增税抑制总需求时，美联储可增加货币供给、降低利率、刺激投资，使总需求不受影响——联邦公开市场委员会正是这样关注财政政策争论的。","label":"货币政策可抵消财政政策的不利影响"},{"t":"1946年《就业法案》确立\"促进充分就业和生产\"是联邦政府一贯的政策和责任；第一种含义是政府应避免本身引起波动（反对货币财政政策大而突然的变动），第二种更有雄心的含义是对私人经济中的变动作出反应以稳定总需求。","c":[],"k":"b","i":2,"h":"1946年《就业法案》确立&quot;促进充分就业和生产&quot;是联邦政府一贯的政策和责任；第一种含义是政府应避免本身引起波动（反对货币财政政策大而突然的变动），第二种更有雄心的含义是对私人经济中的变动作出反应以稳定总需求。","label":"1946年《就业法案》确立\"促进充分…"},{"t":"凯恩斯（《就业、利息和货币通论》）：总需求不足以维持充分就业的生产时，政府应积极刺激总需求；总需求波动主要源于非理性的悲观主义与乐观主义，即动物本能（animal spirits）——态度的任意变动，且在某种程度上自我实现；美联储可在人们过分悲观时扩货币降息、过分乐观时紧缩提息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">凯恩斯</strong>（《就业、利息和货币通论》）：总需求不足以维持充分就业的生产时，政府应积极刺激总需求；总需求波动主要源于非理性的悲观主义与乐观主义，即动物本能（animal spirits）——态度的任意变动，且在某种程度上自我实现；美联储可在人们过分悲观时扩货币降息、过分乐观时紧缩提息。","label":"凯恩斯（《就业、利息和货币通论》）：…"},{"t":"美联储前主席马丁的名言：\"美联储的工作就是在宴会刚刚开始时把酒杯拿走。\"","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">美联储前主席马丁的名言</strong>：&quot;美联储的工作就是在宴会刚刚开始时把酒杯拿走。&quot;","label":"美联储前主席马丁的名言"},{"t":"案例研究「白宫的凯恩斯主义者」：1961年肯尼迪主张减税以刺激经济，其顾问（含后来的诺奖得主托宾与索洛）把凯恩斯思想付诸实践，减税方案含投资税收抵免，兼顾短期总需求与长期总供给，1964年实施后促成高速增长时期；2009年奥巴马面对衰退，第一个政策建议也是包括大幅增加政府支出的经济刺激提案。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「白宫的凯恩斯主义者」</strong>：1961年肯尼迪主张减税以刺激经济，其顾问
