会共同致力于减少赤字，加上90年代末经济繁荣，联邦预算由赤字转为盈余、比率大幅下降；布什任期前几年盈余转赤字（减税立法、2001年衰退自动减少税收并增加支出、&quot;9·11&quot;后国家安全支出与伊拉克、阿富汗战争）；真正急剧上升始于2008年金融危机和严重衰退——2009至2012年联邦预算赤字平均占GDP约9%，为二战以来最高水平，2012年后随经济复苏赤字缩减、比率上升趋缓。","label":"案例研究「美国政府债务史」要点"},{"t":"参考资料「金融危机」要点（2008-2009年美国及世界主要国家）：六个表现为——一是资产价格大幅下跌（房价在短短几年间下跌约30%，为20世纪30年代以来所未见）；二是金融机构广泛资不抵债（债务超过资产价值，许多银行持有以不动产为抵押的贷款，房价下跌、房东违约使主要金融机构走向破产）；三是对金融机构信心的下降（未被担保存款的挤提，银行被迫低价抛售资产、削减新贷款）；四是信贷不足（借款者即使有有利可图的项目也难获贷款，金融体系难以履行把储蓄者资源转移到有最好投资机会的借款者手中的正常职能）；五是经济下滑（无法为新项目筹资使物品与服务整体需求减少、国民收入减少、失业增加）；六是恶性循环（经济下滑减少公司利润、降低资产价值，金融体系问题与经济下滑相互强化）；危机最终结束，金融机构恢复中介职能（可能有政府政策的帮助）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「金融危机」要点</strong>（2008-2009年美国及世界主要国家）：六个表现为——一是资产价格大幅下跌（房价在短短几年间下跌约30%，为20世纪30年代以来所未见）；二是金融机构广泛资不抵债（债务超过资产价值，许多银行持有以不动产为抵押的贷款，房价下跌、房东违约使主要金融机构走向破产）；三是对金融机构信心的下降（未被担保存款的挤提，银行被迫低价抛售资产、削减新贷款）；四是信贷不足（借款者即使有有利可图的项目也难获贷款，金融体系难以履行把储蓄者资源转移到有最好投资机会的借款者手中的正常职能）；五是经济下滑（无法为新项目筹资使物品与服务整体需求减少、国民收入减少、失业增加）；六是恶性循环（经济下滑减少公司利润、降低资产价值，金融体系问题与经济下滑相互强化）；危机最终结束，金融机构恢复中介职能（可能有政府政策的帮助）。","label":"参考资料「金融危机」要点"},{"t":"即问即答要点：更多美国人采取\"今朝有酒今朝醉\"的生活方式→消费增加、储蓄减少→可贷资金供给左移→均衡利率上升、投资减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：更多美国人采取&quot;今朝有酒今朝醉&quot;的生活方式→消费增加、储蓄减少→可贷资金供给左移→均衡利率上升、投资减少。","label":"即问即答要点"}],"k":"b","i":1,"h":"<strong class=\"lead\">26.3.4 政策3</strong>：政府预算赤字与盈余","label":"26.3.4 政策3"}],"k":"sec","i":0,"h":"26.3 可贷资金市场","label":"26.3 可贷资金市场"},{"t":"26.4 结论","c":[{"t":"金融市场和经济中其他市场一样：可贷资金的价格（利率）由供求力量决定，供给或需求变动的分析与其它市场相同；市场通常是组织经济活动的好方法，金融市场使供求平衡时有助于使经济中的稀缺资源得到最有效的配置。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">金融市场和经济中其他市场一样</strong>：可贷资金的价格（利率）由供求力量决定，供给或需求变动的分析与其它市场相同；市场通常是组织经济活动的好方法，金融市场使供求平衡时有助于使经济中的稀缺资源得到最有效的配置。","label":"金融市场和经济中其他市场一样"},{"t":"金融市场的特殊性：与大多数其他市场不同，它起着联系现在与未来的重要作用——储蓄者把一些现期收入变为未来的购买力，借款者现在投资以便未来拥有生产物品与服务的额外资本；运行良好的金融市场不仅对现在这一代人重要，对将继承相应利益的子孙后代也重要。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">金融市场的特殊性</strong>：与大多数其他市场不同，它起着联系现在与未来的重要作用——储蓄者把一些现期收入变为未来的购买力，借款者现在投资以便未来拥有生产物品与服务的额外资本；运行良好的金融市场不仅对现在这一代人重要，对将继承相应利益的子孙后代也重要。","label":"金融市场的特殊性"}],"k":"sec","i":0,"h":"26.4 结论","label":"26.4 结论"}],"k":"chap","h":"第26章 储蓄、投资和金融体系","label":"第26章 储蓄、投资和金融体系"},{"t":"第27章 金融学的基本工具","c":[{"t":"本章内容提要","c":[{"t":"由于储蓄可以赚到利息，今天的货币量比未来相同的货币量更有价值；人们可以用现值的概念比较不同时点的货币量——任何一笔未来货币量的现值，是在现行利率下产生这一未来货币量所需要的现在货币量。","c":[],"k":"b","i":1,"h":"由于储蓄可以赚到利息，今天的货币量比未来相同的货币量更有价值；人们可以用现值的概念比较不同时点的货币量——任何一笔未来货币量的现值，是在现行利率下产生这一未来货币量所需要的现在货币量。","label":"由于储蓄可以赚到利息，今天的货币量比…"},{"t":"由于财富的边际效用递减，大多数人是风险厌恶者；风险厌恶者可以通过购买保险、使其持有的财产多元化，以及接受较低收益而选择低风险的有价证券组合来降低风险。","c":[],"k":"b","i":1,"h":"由于财富的边际效用递减，大多数人是风险厌恶者；风险厌恶者可以通过购买保险、使其持有的财产多元化，以及接受较低收益而选择低风险的有价证券组合来降低风险。","label":"由于财富的边际效用递减，大多数人是风…"},{"t":"一种资产的价值等于其所有者将得到的现金流的现值；对一股股票而言，这些现金流包括红利流量以及最终出售价格；根据有效市场假说，股票价格反映所有可获得的信息，但一些经济学家质疑该假说，认为非理性心理因素也影响资产价格。","c":[],"k":"b","i":1,"h":"一种资产的价值等于其所有者将得到的现金流的现值；对一股股票而言，这些现金流包括红利流量以及最终出售价格；根据有效市场假说，股票价格反映所有可获得的信息，但一些经济学家质疑该假说，认为非理性心理因素也影响资产价格。","label":"一种资产的价值等于其所有者将得到的现…"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"27.1 现值：衡量货币的时间价值","c":[{"t":"金融学（finance）：研究人们如何在其一生内做出关于配置资源和应对风险的决策的学科；金融体系的决策涉及两个相关要素——时间与风险（未来不可知，决策依据的是对可能结果的猜测）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">金融学</strong>（finance）：研究人们如何在其一生内做出关于配置资源和应对风险的决策的学科；金融体系的决策涉及两个相关要素——时间与风险（未来不可知，决策依据的是对可能结果的猜测）。","label":"金融学（finance）：研究人们如…"},{"t":"今天100美元 vs 10年后100美元：选今天——可存入银行，10年后仍拥有这笔钱外加利息；结论是今天的钱比未来同样数量的钱更值钱。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">今天100美元 vs 10年后100美元</strong>：选今天——可存入银行，10年后仍拥有这笔钱外加利息；结论是今天的钱比未来同样数量的钱更值钱。","label":"今天100美元 vs 10年后100美元"},{"t":"现值（present value）：用现行利率产生一定未来货币量所需要的现在货币量；终值（future value）：在现行利率既定时，现在货币量将带来的未来货币量。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">现值</strong>（present value）：用现行利率产生一定未来货币量所需要的现在货币量；终值（future value）：在现行利率既定时，现在货币量将带来的未来货币量。","label":"现值（present value）：…"},{"t":"复利（compounding）：货币量的累积过程——赚得的利息仍留在账户上以赚取未来更多的利息（如银行账户上货币量的累积）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">复利</strong>（compounding）：货币量的累积过程——赚得的利息仍留在账户上以赚取未来更多的利息（如银行账户上货币量的累积）。","label":"复利（compounding）：货币…"},{"t":"终值计算：今天把100美元存入银行，按利率r（小数形式）每年复利，N年后为 (1+r)^N × 100 美元；书例：按5%利率投资10年，100美元的终值为 (1.05)^10 × 100 ≈ 163 美元。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">终值计算</strong>：今天把100美元存入银行，按利率r（小数形式）每年复利，N年后为 (1+r)^N × 100 美元；书例：按5%利率投资10年，100美元的终值为 (1.05)^10 × 100 ≈ 163 美元。","label":"终值计算"},{"t":"现值计算：N年后将得到的X货币量的现值为 X/(1+r)^N——由终值除以 (1+r)^N 得到；由于赚到利息的可能性使现值降到X之下，寻找一定未来货币量现值的过程称为贴现；书例：利率5%时10年后的200美元现值为 200/(1.05)^10 ≈ 123 美元（今天存123美元、10年后即得200美元）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">现值计算</strong>：N年后将得到的X货币量的现值为 X/(1+r)^N——由终值除以 (1+r)^N 得到；由于赚到利息的可能性使现值降到X之下，寻找一定未来货币量现值的过程称为贴现；书例：利率5%时10年后的200美元现值为 200/(1.05)^10 ≈ 123 美元（今天存123美元、10年后即得200美元）。","label":"现值计算"},{"t":"\"今天100美元还是10年后200美元\"的答案取决于利率：利率5%时，200美元的现值123美元大于100美元，应选10年后的200美元；利率8%时现值仅 200/(1.08)^10 ≈ 93 美元，应选今天的100美元——利率越高，把钱存银行能赚到的越多，得到今天的钱越有吸引力。","c":[],"k":"b","i":1,"h":"&quot;今天100美元还是10年后200美元&quot;的答案取决于利率：利率5%时，200美元的现值123美元大于100美元，应选10年后的200美元；利率8%时现值仅 200/(1.08)^10 ≈ 93 美元，应选今天的100美元——利率越高，把钱存银行能赚到的越多，得到今天的钱越有吸引力。","label":"\"今天100美元还是10年后200美…"},{"t":"现值应用之一（企业投资决策）：通用汽车公司建厂现在耗资1亿美元、10年后带来2亿美元收益；利率5%时2亿美元收益的现值为1.23亿美元，大于成本，应实施；利率8%时现值仅0.93亿美元，小于成本，应放弃——现值概念解释了为什么利率上升时投资（即可贷资金的需求量）减少。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">现值应用之一</strong>（企业投资决策）：通用汽车公司建厂现在耗资1亿美元、10年后带来2亿美元收益；利率5%时2亿美元收益的现值为1.23亿美元，大于成本，应实施；利率8%时现值仅0.93亿美元，小于成本，应放弃——现值概念解释了为什么利率上升时投资（即可贷资金的需求量）减少。","label":"现值应用之一"},{"t":"现值应用之二（支付流比较）：彩票100万美元可选择未来50年每年支付2万美元（总计100万）或立即支付40万美元；利率7%时，逐笔贴现加总后这笔支付流的现值仅为27.6万美元——立即得到40万美元更好；100万美元一经贴现，未来的现金流就远不那么值钱了。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">现值应用之二</strong>（支付流比较）：彩票100万美元可选择未来50年每年支付2万美元（总计100万）或立即支付40万美元；利率7%时，逐笔贴现加总后这笔支付流的现值仅为27.6万美元——立即得到40万美元更好；100万美元一经贴现，未来的现金流就远不那么值钱了。","label":"现值应用之二"},{"t":"即问即答要点：利率7%时10年后得到的150美元的现值为 150/(1.07)^10 ≈ 76 美元。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：利率7%时10年后得到的150美元的现值为 150/(1.07)^10 ≈ 76 美元。","label":"即问即答要点"},{"t":"参考资料「复利计算的魔力与70规则」要点：写成百分比时很小的增长率在许多年的复利计算之后会变得很大——书例Elliot与Darlene同为22岁、第一份年收入3万美元，前者生活在收入年增1%的经济、后者年增3%，40年后（62岁）年收入分别为4.5万与9.8万美元，2个百分点的增长率差使老年时收入相差两倍多。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料「复利计算的魔力与70规则」要点</strong>：写成百分比时很小的增长率在许多年的复利计算之后会变得很大——书例Elliot与Darlene同为22岁、第一份年收入3万美元，前者生活在收入年增1%的经济、后者年增3%，40年后（62岁）年收入分别为4.5万与9.8万美元，2个百分点的增长率差使老年时收入相差两倍多。","label":"参考资料「复利计算的魔力与70规则」要点"},{"t":"70规则（Rule of 70）：如果某个变量每年按x%增长，那么大约在70/x年以后该变量翻一番（72法则是同类翻倍速算的常见变体，本书采用70规则口径）——收入年增1%约需70年翻一番，年增3%约需70/3≈23年；它既适用于增长的经济也适用于增长的储蓄账户——书例：1791年本·富兰克林去世时留下为期200年的5000美元投资，若每年赚取7%收益（每10年翻一番），200年复利后价值 2^20 × 5000 美元，约为50亿美元（实际200年中只增加到200万美元，因为一部分钱期间被花掉）；爱因斯坦称复利计算为\"有史以来最伟大的数学发现\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">70规则</strong>（Rule of 70）：如果某个变量每年按x%增长，那么大约在70/x年以后该变量翻一番（72法则是同类翻倍速算的常见变体，本书采用70规则口径）——收入年增1%约需70年翻一番，年增3%约需70/3≈23年；它既适用于增长的经济也适用于增长的储蓄账户——书例：1791年本·富兰克林去世时留下为期200年的5000美元投资，若每年赚取7%收益（每10年翻一番），200年复利后价值 2^20 × 5000 美元，约为50亿美元（实际200年中只增加到200万美元，因为一部分钱期间被花掉）；爱因斯坦称复利计算为&quot;有史以来最伟大的数学发现&quot;。","label":"70规则"}],"k":"sec","i":0,"h":"<strong class=\"lead\">27.1 现值</strong>：衡量货币的时间价值","label":"27.1 现值"},{"t":"27.2 风险管理","c":[{"t":"生活处处有风险（滑雪摔腿、车祸、股价下跌）；对风险的理性反应不是不计成本地回避它，而是在做决策时考虑到风险。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">生活处处有风险</strong>（滑雪摔腿、车祸、股价下跌）；对风险的理性反应不是不计成本地回避它，而是在做决策时考虑到风险。","label":"生活处处有风险"},{"t":"27.2.1 风险厌恶","c":[{"t":"风险厌恶（risk aversion）：不喜欢不确定性——更不喜欢坏事情发生在自己身上，对坏事的厌恶甚于对可比的好事的喜欢；大多数人是风险厌恶者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">风险厌恶</strong>（risk aversion）：不喜欢不确定性——更不喜欢坏事情发生在自己身上，对坏事的厌恶甚于对可比的好事的喜欢；大多数人是风险厌恶者。","label":"风险厌恶"},{"t":"掷硬币例子：朋友掷硬币，正面朝上她付你1000美元、背面朝上你付她1000美元——风险厌恶者不会接受这个交易，因为对风险厌恶者来说，失去1000美元的痛苦大于赢得1000美元的快乐。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">掷硬币例子</strong>：朋友掷硬币，正面朝上她付你1000美元、背面朝上你付她1000美元——风险厌恶者不会接受这个交易，因为对风险厌恶者来说，失去1000美元的痛苦大于赢得1000美元的快乐。","label":"掷硬币例子"},{"t":"经济学家用效用的概念建立风险厌恶模型：效用是一个人对福利或满足程度的主观衡量，效用函数给出每种财富水平带来的效用量；该函数表现出边际效用递减——一个人拥有的财富越多，他从增加的1美元中得到的效用越少，故随着财富增加效用函数越来越平坦。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学家用效用的概念建立风险厌恶模型</strong>：效用是一个人对福利或满足程度的主观衡量，效用函数给出每种财富水平带来的效用量；该函数表现出边际效用递减——一个人拥有的财富越多，他从增加的1美元中得到的效用越少，故随着财富增加效用函数越来越平坦。","label":"经济学家用效用的概念建立风险厌恶模型"},{"t":"由于边际效用递减，失去1000美元损失的效用大于得到1000美元获得的效用——这就是人们是风险厌恶者的原因（图形结论：效用曲线随财富增加而变平坦）。","c":[],"k":"b","i":2,"h":"由于边际效用递减，失去1000美元损失的效用大于得到1000美元获得的效用——这就是人们是风险厌恶者的原因（图形结论：效用曲线随财富增加而变平坦）。","label":"由于边际效用递减，失去1000美元损…"},{"t":"风险厌恶为解释经济中的三件事提供出发点：保险、多元化与风险-收益权衡取舍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">风险厌恶为解释经济中的三件事提供出发点</strong>：保险、多元化与风险-收益权衡取舍。","label":"风险厌恶为解释经济中的三件事提供出发点"}],"k":"b","i":1,"h":"27.2.1 风险厌恶","label":"27.2.1 风险厌恶"},{"t":"27.2.2 保险市场","c":[{"t":"应对风险的一种方法是购买保险；保险合同的一般特点是：面临风险的人向保险公司支付一笔保险费，作为回报，保险公司同意接受所有或部分风险；险种包括汽车保险（车祸）、火灾保险（房屋火灾）、医疗保险（昂贵医疗）、人寿保险（被保险人去世后给家人留下收入），以及应对长寿风险的年金——今天交保费、保险公司每年支付一笔定期收入直到去世。","c":[],"k":"b","i":2,"h":"应对风险的一种方法是购买保险；保险合同的一般特点是：面临风险的人向保险公司支付一笔保险费，作为回报，保险公司同意接受所有或部分风险；险种包括汽车保险（车祸）、火灾保险（房屋火灾）、医疗保险（昂贵医疗）、人寿保险（被保险人去世后给家人留下收入），以及应对长寿风险的年金——今天交保费、保险公司每年支付一笔定期收入直到去世。","label":"应对风险的一种方法是购买保险；保险合…"},{"t":"从某种意义上说，每一份保险合同都是一场赌博：大多数年份投保人只交保费而除心境平和外什么也没得到；保险公司正是依赖多数人并不索赔这一事实，才能向少数不幸者支付大额索赔并持续经营。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">从某种意义上说，每一份保险合同都是一场赌博</strong>：大多数年份投保人只交保费而除心境平和外什么也没得到；保险公司正是依赖多数人并不索赔这一事实，才能向少数不幸者支付大额索赔并持续经营。","label":"从某种意义上说，每一份保险合同都是一场赌博"},{"t":"从整个经济的角度看，保险的作用并不是消除生活中固有的风险，而是更有效地分摊风险：火灾保险并不降低房子着火的概率，但一旦失火保险公司赔偿——风险不由一人承担，而由成千上万投保人共同承担；由于人们是风险厌恶者，一万个人承担万分之一的风险比一个人承担全部风险容易得多。","c":[],"k":"b","i":2,"h":"从整个经济的角度看，保险的作用并不是消除生活中固有的风险，而是更有效地分摊风险：火灾保险并不降低房子着火的概率，但一旦失火保险公司赔偿——风险不由一人承担，而由成千上万投保人共同承担；由于人们是风险厌恶者，一万个人承担万分之一的风险比一个人承担全部风险容易得多。","label":"从整个经济的角度看，保险的作用并不是…"},{"t":"逆向选择（adverse selection）：保险市场受其困扰的第一类问题——高风险的人比低风险的人更可能申请保险，因为高风险的人从保险的保护中获益更大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">逆向选择</strong>（adverse selection）：保险市场受其困扰的第一类问题——高风险的人比低风险的人更可能申请保险，因为高风险的人从保险的保护中获益更大。","label":"逆向选择"},{"t":"道德风险（moral hazard）：第二类问题——人们购买保险之后，谨慎从事以规避风险的激励就变小了，因为保险公司将补偿大部分损失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">道德风险</strong>（moral hazard）：第二类问题——人们购买保险之后，谨慎从事以规避风险的激励就变小了，因为保险公司将补偿大部分损失。","label":"道德风险"},{"t":"保险公司意识到却无法充分避免这两个问题：既无法很好地区分高风险与低风险客户，也无法监测客户的所有风险行为；保单的价格反映了售出保险后的实际风险——高额保费使一些人（特别是知道自己风险低的人）决定不购买保险，而是自己承受生活中的某些不确定性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">保险公司意识到却无法充分避免这两个问题</strong>：既无法很好地区分高风险与低风险客户，也无法监测客户的所有风险行为；保单的价格反映了售出保险后的实际风险——高额保费使一些人（特别是知道自己风险低的人）决定不购买保险，而是自己承受生活中的某些不确定性。","label":"保险公司意识到却无法充分避免这两个问题"}],"k":"b","i":1,"h":"27.2.2 保险市场","label":"27.2.2 保险市场"},{"t":"27.2.3 企业特有风险的多元化","c":[{"t":"背景（安然事件）：2002年曾经规模庞大且备受尊敬的安然公司在被控诈骗和会计违规的过程中破产，高层管理人员被起诉入狱，而最悲惨的是受牵连的数千名底层雇员——他们不仅失去工作，许多人还失去了一生的储蓄，因为他们将大约三分之二的退休基金投资于如今一文不值的安然股票。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>（安然事件）：2002年曾经规模庞大且备受尊敬的安然公司在被控诈骗和会计违规的过程中破产，高层管理人员被起诉入狱，而最悲惨的是受牵连的数千名底层雇员——他们不仅失去工作，许多人还失去了一生的储蓄，因为他们将大约三分之二的退休基金投资于如今一文不值的安然股票。","label":"背景（安然事件）：2002年曾经规模…"},{"t":"金融学给风险厌恶者的实用建议就是\"不要把所有的鸡蛋放在一个篮子里\"；金融学把这个传统智慧变成科学，称之为多元化。","c":[],"k":"b","i":2,"h":"金融学给风险厌恶者的实用建议就是&quot;不要把所有的鸡蛋放在一个篮子里&quot;；金融学把这个传统智慧变成科学，称之为多元化。","label":"金融学给风险厌恶者的实用建议就是\"不…"},{"t":"多元化（diversification）：通过用大量不相关的小风险代替单一风险来降低风险。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">多元化</strong>（diversification）：通过用大量不相关的小风险代替单一风险来降低风险。","label":"多元化（diversificatio…"},{"t":"保险是多元化的一个例子：设想一城镇一万名房主既是一家保险公司的股东又是其保险客户，则每人面对的不再是自家一次火灾的全部风险，而是一万次火灾的万分之一的风险——除非全镇同时着火，每个人面临的风险大大降低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">保险是多元化的一个例子</strong>：设想一城镇一万名房主既是一家保险公司的股东又是其保险客户，则每人面对的不再是自家一次火灾的全部风险，而是一万次火灾的万分之一的风险——除非全镇同时着火，每个人面临的风险大大降低。","label":"保险是多元化的一个例子"},{"t":"购买金融资产也可多元化：购买一家公司股票是把赌注押在该公司未来利润率上，孤注一掷风险很大——公司未来难以预料（微软从十几岁\"毛孩子\"创建到成为世界上最有价值的公司只用几年，安然从最受尊敬到几乎一文不值只用几个月）；人们可以通过打大量的小赌而不是少量的大赌来降低风险。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">购买金融资产也可多元化</strong>：购买一家公司股票是把赌注押在该公司未来利润率上，孤注一掷风险很大——公司未来难以预料（微软从十几岁&quot;毛孩子&quot;创建到成为世界上最有价值的公司只用几年，安然从最受尊敬到几乎一文不值只用几个月）；人们可以通过打大量的小赌而不是少量的大赌来降低风险。","label":"购买金融资产也可多元化"},{"t":"图形结论（图27-2，风险用统计学中的标准差衡量——标准差衡量变量的变动，组合收益的标准差越大，持有者得不到预期收益的风险越高）：只有1种股票时标准差为49%；从1种增加到10种股票，风险降低约50%；从10种增加到20种，又降低13%；股票数量继续增加风险继续下降，但组合包含20或30种股票以后降幅就很小了。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>（图27-2，风险用统计学中的标准差衡量——标准差衡量变量的变动，组合收益的标准差越大，持有者得不到预期收益的风险越高）：只有1种股票时标准差为49%；从1种增加到10种股票，风险降低约50%；从10种增加到20种，又降低13%；股票数量继续增加风险继续下降，但组合包含20或30种股票以后降幅就很小了。","label":"图形结论"},{"t":"企业特有风险（firm-specific risk）：只影响一家企业的风险（与某家公司相关的不确定性）——多元化可以消除它。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">企业特有风险</strong>（firm-specific risk）：只影响一家企业的风险（与某家公司相关的不确定性）——多元化可以消除它。","label":"企业特有风险"},{"t":"市场风险（market risk）：与整个经济相关的影响所有在股市上交易的企业的不确定性（如经济衰退期中大多数企业销售减少、利润下降、股票收益降低）——多元化不能消除它；多元化降低了持有股票的风险，但并没有消除它。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">市场风险</strong>（market risk）：与整个经济相关的影响所有在股市上交易的企业的不确定性（如经济衰退期中大多数企业销售减少、利润下降、股票收益降低）——多元化不能消除它；多元化降低了持有股票的风险，但并没有消除它。","label":"市场风险"}],"k":"b","i":1,"h":"27.2.3 企业特有风险的多元化","label":"27.2.3 企业特有风险的多元化"},{"t":"27.2.4 风险与收益之间的权衡取舍","c":[{"t":"与理解金融决策最相关的权衡取舍是风险与收益之间的权衡取舍；风险厌恶者愿意接受股票的不确定性，是因为他们这样做会得到补偿。","c":[],"k":"b","i":2,"h":"与理解金融决策最相关的权衡取舍是风险与收益之间的权衡取舍；风险厌恶者愿意接受股票的不确定性，是因为他们这样做会得到补偿。","label":"与理解金融决策最相关的权衡取舍是风险…"},{"t":"历史数据：股票提供的收益率远远高于其他可选金融资产——过去两个世纪中，股票的平均真实收益率约为每年8%，而短期政府债券支付的真实收益率每年只有约3%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">历史数据</strong>：股票提供的收益率远远高于其他可选金融资产——过去两个世纪中，股票的平均真实收益率约为每年8%，而短期政府债券支付的真实收益率每年只有约3%。","label":"历史数据"},{"t":"书例（两种资产类型的配置选择）：第一种是风险股票的多元化组合，平均收益率8%、标准差20%（正常随机变量约95%的时间出现在均值两个标准差之内，故真实收益通常在收益48%到亏损32%之间变动）；第二种是安全的替代品（银行储蓄账户或政府债券），收益率3%、标准差为零。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书例</strong>（两种资产类型的配置选择）：第一种是风险股票的多元化组合，平均收益率8%、标准差20%（正常随机变量约95%的时间出现在均值两个标准差之内，故真实收益通常在收益48%到亏损32%之间变动）；第二种是安全的替代品（银行储蓄账户或政府债券），收益率3%、标准差为零。","label":"书例（两种资产类型的配置选择）：第一…"},{"t":"图形结论（图27-3）：每一点代表风险股票与安全资产之间的某一种组合配置；投资于股票的比例越高，风险（标准差）越大，预期可赚到的平均收益也越高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>（图27-3）：每一点代表风险股票与安全资产之间的某一种组合配置；投资于股票的比例越高，风险（标准差）越大，预期可赚到的平均收益也越高。","label":"图形结论"},{"t":"了解风险-收益权衡本身并不告诉一个人应该做什么：对风险与收益某种组合的选择取决于一个人的风险厌恶程度（反映其偏好）；但对股票持有者来说，认识到高平均收益要以高风险为代价很重要。","c":[],"k":"b","i":2,"h":"了解风险-收益权衡本身并不告诉一个人应该做什么：对风险与收益某种组合的选择取决于一个人的风险厌恶程度（反映其偏好）；但对股票持有者来说，认识到高平均收益要以高风险为代价很重要。","label":"了解风险-收益权衡本身并不告诉一个人应该做什么"},{"t":"即问即答要点：风险厌恶者降低风险的三种方法——购买保险、使持有的财产多元化、选择低风险低收益的有价证券组合。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：风险厌恶者降低风险的三种方法——购买保险、使持有的财产多元化、选择低风险低收益的有价证券组合。","label":"即问即答要点"}],"k":"b","i":1,"h":"27.2.4 风险与收益之间的权衡取舍","label":"27.2.4 风险与收益之间的权衡取舍"}],"k":"sec","i":0,"h":"27.2 风险管理","label":"27.2 风险管理"},{"t":"27.3 资产评估","c":[{"t":"问题：什么决定股票的价格？正如大多数价格一样，答案是供给与需求；但还需深入考虑是什么决定了投资者对每股股票的支付意愿。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">问题</strong>：什么决定股票的价格？正如大多数价格一样，答案是供给与需求；但还需深入考虑是什么决定了投资者对每股股票的支付意愿。","label":"问题：什么决定股票的价格？正如大多数…"},{"t":"27.3.1 基本面分析","c":[{"t":"挑选股票时的考虑：所购买企业股份的价值和股份出售时的价格——价格低于价值则股票被低估，价格高于价值则被高估，价格与价值相等则被公平地估价；应偏爱被低估的股票（支付低于企业价值的价格而达成交易）；了解价格容易（看报纸），困难的是确定企业的价值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">挑选股票时的考虑</strong>：所购买企业股份的价值和股份出售时的价格——价格低于价值则股票被低估，价格高于价值则被高估，价格与价值相等则被公平地估价；应偏爱被低估的股票（支付低于企业价值的价格而达成交易）；了解价格容易（看报纸），困难的是确定企业的价值。","label":"挑选股票时的考虑"},{"t":"基本面分析（fundamental analysis）：为确定一家公司的价值而对其会计报表和未来前景进行的研究；许多华尔街企业雇用股票分析师进行基本面分析。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">基本面分析</strong>（fundamental analysis）：为确定一家公司的价值而对其会计报表和未来前景进行的研究；许多华尔街企业雇用股票分析师进行基本面分析。","label":"基本面分析"},{"t":"股票对股东的价值是他能从拥有的股票中得到的东西：股息支付流和股票最后出售价格的现值（股息是公司对股东进行的现金支付）；支付股息的能力和出售时的股票价值取决于公司的盈利能力，后者又取决于许多因素——产品需求、面临的竞争程度、可用资本、工人是否受工会控制、顾客忠诚度、政府管制和税收等；基本面分析的目的就是考虑所有这些因素以确定每股股票的价值。","c":[],"k":"b","i":2,"h":"股票对股东的价值是他能从拥有的股票中得到的东西：股息支付流和股票最后出售价格的现值（股息是公司对股东进行的现金支付）；支付股息的能力和出售时的股票价值取决于公司的盈利能力，后者又取决于许多因素——产品需求、面临的竞争程度、可用资本、工人是否受工会控制、顾客忠诚度、政府管制和税收等；基本面分析的目的就是考虑所有这些因素以确定每股股票的价值。","label":"股票对股东的价值是他能从拥有的股票中得到的东西"},{"t":"依靠基本面分析挑选组合的三种方法：自己阅读公司年度报表做所有必要的研究；听从华尔街分析师的建议；购买由基金经理进行基本面分析并代做决策的共同基金。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">依靠基本面分析挑选组合的三种方法</strong>：自己阅读公司年度报表做所有必要的研究；听从华尔街分析师的建议；购买由基金经理进行基本面分析并代做决策的共同基金。","label":"依靠基本面分析挑选组合的三种方法"}],"k":"b","i":1,"h":"27.3.1 基本面分析","label":"27.3.1 基本面分析"},{"t":"27.3.2 有效市场假说","c":[{"t":"另一种选股方法是随机挑选（如向股票版扔飞镖），其依据是有效市场假说（efficient markets hypothesis）：认为资产价格反映了关于一种资产价值的所有公开的、可获得的信息的理论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">另一种选股方法是随机挑选</strong>（如向股票版扔飞镖），其依据是有效市场假说（efficient markets hypothesis）：认为资产价格反映了关于一种资产价值的所有公开的、可获得的信息的理论。","label":"另一种选股方法是随机挑选"},{"t":"逻辑起点一：在主要证券交易所上市的每家公司都处于许多资金管理者的追踪之下（如管理共同基金的人），他们每天关注新闻事件并进行基本面分析，在价格低于价值时买进、高于价值时抛出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">逻辑起点一</strong>：在主要证券交易所上市的每家公司都处于许多资金管理者的追踪之下（如管理共同基金的人），他们每天关注新闻事件并进行基本面分析，在价格低于价值时买进、高于价值时抛出。","label":"逻辑起点一"},{"t":"逻辑起点二：供求均衡决定市场价格——市价上为销售提供的股份数正好等于想购买的数量，认为股票被高估的人数与认为被低估的人数正好平衡；根据市场上普通人的判断，所有股票总是被公正地估价。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">逻辑起点二</strong>：供求均衡决定市场价格——市价上为销售提供的股份数正好等于想购买的数量，认为股票被高估的人数与认为被低估的人数正好平衡；根据市场上普通人的判断，所有股票总是被公正地估价。","label":"逻辑起点二"},{"t":"信息有效（informational efficiency）：股票市场以理性方式反映了有关资产价值的所有可获得的信息的描述——信息改变时股价变动（利好新闻则价值和价格上升，前景恶化则下跌），任一时点的市场价格都是以可获得信息为依据对公司价值的最好估算。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信息有效</strong>（informational efficiency）：股票市场以理性方式反映了有关资产价值的所有可获得的信息的描述——信息改变时股价变动（利好新闻则价值和价格上升，前景恶化则下跌），任一时点的市场价格都是以可获得信息为依据对公司价值的最好估算。","label":"信息有效"},{"t":"随机游走（random walk）：一种不可预期的变量变动的路径；有效市场假说的含义是股票价格应该是随机游走的——价格变动不可能根据可获得的信息来预期（若能据公开信息预期明天涨10%，今天的市价就必定还没包括这条信息）；只有能改变市场对公司价值评估的新闻才能改变股价，而新闻本应不可预期，故价格变动不可预期。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">随机游走</strong>（random walk）：一种不可预期的变量变动的路径；有效市场假说的含义是股票价格应该是随机游走的——价格变动不可能根据可获得的信息来预期（若能据公开信息预期明天涨10%，今天的市价就必定还没包括这条信息）；只有能改变市场对公司价值评估的新闻才能改变股价，而新闻本应不可预期，故价格变动不可预期。","label":"随机游走"},{"t":"对个人投资的含义：若假说正确，为选股花许多时间研究企业资料没有意义——若股价反映所有可获得的信息，就没有一种股票是比其他股票更好的购买选择，你最好的选择是购买多元化的有价证券组合。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对个人投资的含义</strong>：若假说正确，为选股花许多时间研究企业资料没有意义——若股价反映所有可获得的信息，就没有一种股票是比其他股票更好的购买选择，你最好的选择是购买多元化的有价证券组合。","label":"对个人投资的含义"},{"t":"案例研究「随机游走与指数基金」要点：有效市场假说作为对世界的描述比一般认为的要好得多——即使股价不完全是随机游走也非常接近（一只股票一年中的状况与下一年的相关性几乎为零，追随或对抗近期涨跌趋势都不能跑赢市场）；最有力的证据来自指数基金（按既定股票指数购买所有股票的共同基金）的业绩——截至2016年2月为止的15年中，81%的股票共同基金没有跑赢持有在美国证券交易所交易的所有股票的指数基金，股票基金平均年收益比指数基金低0.89个百分点；积极管理的基金没跑赢市场，既因频繁交易导致更多交易费用，也因收取更高费用（专家报酬）；跑赢市场的19%或因更聪明或因更幸运（如让5000人掷10次硬币，平均5人全掷出正面，但难以重复业绩）——研究表明有优异业绩史的管理者通常没有在后来保持业绩；即使假说不完全准确，也包含了大量真理成分。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「随机游走与指数基金」要点</strong>：有效市场假说作为对世界的描述比一般认为的要好得多——即使股价不完全是随机游走也非常接近（一只股票一年中的状况与下一年的相关性几乎为零，追随或对抗近期涨跌趋势都不能跑赢市场）；最有力的证据来自指数基金（按既定股票指数购买所有股票的共同基金）的业绩——截至2016年2月为止的15年中，81%的股票共同基金没有跑赢持有在美国证券交易所交易的所有股票的指数基金，股票基金平均年收益比指数基金低0.89个百分点；积极管理的基金没跑赢市场，既因频繁交易导致更多交易费用，也因收取更高费用（专家报酬）；跑赢市场的19%或因更聪明或因更幸运（如让5000人掷10次硬币，平均5人全掷出正面，但难以重复业绩）——研究表明有优异业绩史的管理者通常没有在后来保持业绩；即使假说不完全准确，也包含了大量真理成分。","label":"案例研究「随机游走与指数基金」要点"}],"k":"b","i":1,"h":"27.3.2 有效市场假说","label":"27.3.2 有效市场假说"},{"t":"27.3.3 市场非理性","c":[{"t":"传统观点认为股票价格波动部分是由心理原因造成的：20世纪30年代凯恩斯提出资产市场由投资者的\"本能冲动\"（乐观主义与悲观主义的非理性波动）驱动；20世纪90年代股市攀至新高时，美联储主席格林斯潘怀疑是否是\"非理性的繁荣\"（其后股价真的下跌了，但在信息既定时90年代的繁荣是否非理性仍有争论）。","c":[],"k":"b","i":2,"h":"传统观点认为股票价格波动部分是由心理原因造成的：20世纪30年代凯恩斯提出资产市场由投资者的&quot;本能冲动&quot;（乐观主义与悲观主义的非理性波动）驱动；20世纪90年代股市攀至新高时，美联储主席格林斯潘怀疑是否是&quot;非理性的繁荣&quot;（其后股价真的下跌了，但在信息既定时90年代的繁荣是否非理性仍有争论）。","label":"传统观点认为股票价格波动部分是由心理原因造成的"},{"t":"投机泡沫：只要一种资产的价格上升到高于其基本价值，就可以说市场正经历投机泡沫；其可能性部分因为股票对股东的价值不仅取决于红利支付流量，还取决于股票最终的出售价格——如果预期另一个人明天会支付更高的价格，一个人今天愿意支付的价格就会比股票当前价值高；评价一只股票不仅要估算企业的价值，还要估算其他人认为企业未来值多少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">投机泡沫</strong>：只要一种资产的价格上升到高于其基本价值，就可以说市场正经历投机泡沫；其可能性部分因为股票对股东的价值不仅取决于红利支付流量，还取决于股票最终的出售价格——如果预期另一个人明天会支付更高的价格，一个人今天愿意支付的价格就会比股票当前价值高；评价一只股票不仅要估算企业的价值，还要估算其他人认为企业未来值多少。","label":"投机泡沫"},{"t":"争论：相信市场非理性的人（正确地）指出，股市经常随可能改变理性估值的新闻消息而变动，很难对这种变动方式做出解释；相信有效市场假说的人（正确地）指出，要知道对一家公司正确的理性估值是不可能的，不应很快得出某种具体估值非理性的结论；而且如果市场是非理性的，理性人就应该能利用这个事实——但正如案例研究所示，跑赢市场几乎是不可能的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">争论</strong>：相信市场非理性的人（正确地）指出，股市经常随可能改变理性估值的新闻消息而变动，很难对这种变动方式做出解释；相信有效市场假说的人（正确地）指出，要知道对一家公司正确的理性估值是不可能的，不应很快得出某种具体估值非理性的结论；而且如果市场是非理性的，理性人就应该能利用这个事实——但正如案例研究所示，跑赢市场几乎是不可能的。","label":"争论：相信市场非理性的人（正确地）指…"},{"t":"即问即答要点：根据有效市场假说，把组合限于《财富》\"最受尊敬的公司\"不会赚得比平均更多的收益——这些公司的价值（及其已然较高的股价）已经反映了其受尊敬的事实，价格仍是价值的最好估算。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：根据有效市场假说，把组合限于《财富》&quot;最受尊敬的公司&quot;不会赚得比平均更多的收益——这些公司的价值（及其已然较高的股价）已经反映了其受尊敬的事实，价格仍是价值的最好估算。","label":"即问即答要点"}],"k":"b","i":1,"h":"27.3.3 市场非理性","label":"27.3.3 市场非理性"}],"k":"sec","i":0,"h":"27.3 资产评估","label":"27.3 资产评估"},{"t":"27.4 结论","c":[{"t":"本章金融决策工具的总结：现值的概念提醒我们未来的1美元不如现在的1美元值钱，并提供了比较不同时点货币量的方法；风险管理理论提醒我们未来是不确定的，风险厌恶者能够谨慎地规避这种不确定性；资产评估研究告诉我们，任何一家公司的股票价格都应该反映该公司的预期未来盈利状况。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章金融决策工具的总结</strong>：现值的概念提醒我们未来的1美元不如现在的1美元值钱，并提供了比较不同时点货币量的方法；风险管理理论提醒我们未来是不确定的，风险厌恶者能够谨慎地规避这种不确定性；资产评估研究告诉我们，任何一家公司的股票价格都应该反映该公司的预期未来盈利状况。","label":"本章金融决策工具的总结"},{"t":"关于有效市场假说的正确性以及实践中股票价格是不是公司真正价值的理性估算，仍然存在争论；无论理性与否，观察到的股票价格大幅波动都有重要的宏观经济意义——股票市场的波动往往与更广泛的经济波动相伴而来（经济波动部分将再谈及股市）。","c":[],"k":"b","i":1,"h":"关于有效市场假说的正确性以及实践中股票价格是不是公司真正价值的理性估算，仍然存在争论；无论理性与否，观察到的股票价格大幅波动都有重要的宏观经济意义——股票市场的波动往往与更广泛的经济波动相伴而来（经济波动部分将再谈及股市）。","label":"关于有效市场假说的正确性以及实践中股…"}],"k":"sec","i":0,"h":"27.4 结论","label":"27.4 结论"}],"k":"chap","h":"第27章 金融学的基本工具","label":"第27章 金融学的基本工具"},{"t":"第28章 失业","c":[{"t":"本章内容提要","c":[{"t":"失业率是想要工作但没有工作的人占劳动力的百分比，由劳工统计局每月根据对约6万个家庭的当前人口调查计算。","c":[],"k":"b","i":1,"h":"失业率是想要工作但没有工作的人占劳动力的百分比，由劳工统计局每月根据对约6万个家庭的当前人口调查计算。","label":"失业率是想要工作但没有工作的人占劳动…"},{"t":"官方失业率是有用但不完善的指标：一些自称失业者实际上并不想工作（高估），一些想工作的人在求职失败后退出劳动力队伍而不被计入（低估，如丧失信心的工人）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">官方失业率是有用但不完善的指标</strong>：一些自称失业者实际上并不想工作（高估），一些想工作的人在求职失败后退出劳动力队伍而不被计入（低估，如丧失信心的工人）。","label":"官方失业率是有用但不完善的指标"},{"t":"大多数失业是短期的，但任一既定时点观察到的大多数失业是长期的——经济中的大部分失业问题由少数长期失业者造成。","c":[],"k":"b","i":1,"h":"大多数失业是短期的，但任一既定时点观察到的大多数失业是长期的——经济中的大部分失业问题由少数长期失业者造成。","label":"大多数失业是短期的，但任一既定时点观…"},{"t":"失业的第一个解释是寻找工作需要时间（摩擦性失业）；失业保险在减轻失业痛苦的同时增加了摩擦性失业量。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">失业的第一个解释是寻找工作需要时间</strong>（摩擦性失业）；失业保险在减轻失业痛苦的同时增加了摩擦性失业量。","label":"失业的第一个解释是寻找工作需要时间"},{"t":"第二个解释是最低工资法：它把不熟练、无经验工人（如青少年）的工资推到均衡水平之上，造成过剩的劳动供给，即结构性失业。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第二个解释是最低工资法</strong>：它把不熟练、无经验工人（如青少年）的工资推到均衡水平之上，造成过剩的劳动供给，即结构性失业。","label":"第二个解释是最低工资法"},{"t":"第三个解释是工会的市场势力：集体谈判把有工会部门的工资推高到均衡水平之上，创造过剩劳动供给，局内人受益、局外人承担损失。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第三个解释是工会的市场势力</strong>：集体谈判把有工会部门的工资推高到均衡水平之上，创造过剩劳动供给，局内人受益、局外人承担损失。","label":"第三个解释是工会的市场势力"},{"t":"第四个解释是效率工资理论：企业主动支付高于均衡水平的工资以提高效率（改善健康、降低流动率、提高素质、激励努力）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第四个解释是效率工资理论</strong>：企业主动支付高于均衡水平的工资以提高效率（改善健康、降低流动率、提高素质、激励努力）。","label":"第四个解释是效率工资理论"},{"t":"失业问题分长期与短期：自然失业率是经济正常情况下存在的失业率，失业率对它的背离是周期性失业；本章研究自然失业率的决定因素。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">失业问题分长期与短期</strong>：自然失业率是经济正常情况下存在的失业率，失业率对它的背离是周期性失业；本章研究自然失业率的决定因素。","label":"失业问题分长期与短期"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"28.1 失业的确认","c":[{"t":"28.1.1 如何衡量失业","c":[{"t":"衡量机构与数据来源：美国劳工部劳工统计局（BLS）每月对约6万个家庭进行\"当前人口调查\"，公布失业类型、平均工作周长度、失业持续时间等数据。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">衡量机构与数据来源</strong>：美国劳工部劳工统计局（BLS）每月对约6万个家庭进行&quot;当前人口调查&quot;，公布失业类型、平均工作周长度、失业持续时间等数据。","label":"衡量机构与数据来源"},{"t":"成年人（16岁以上）三分类：","c":[{"t":"就业者：作为得到报酬的员工工作、在自己企业里工作获报酬、在家族企业工作不领报酬者；包括全职与兼职，以及有岗位但因度假、生病、天气恶劣等暂时离岗者。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">就业者</strong>：作为得到报酬的员工工作、在自己企业里工作获报酬、在家族企业工作不领报酬者；包括全职与兼职，以及有岗位但因度假、生病、天气恶劣等暂时离岗者。","label":"就业者：作为得到报酬的员工工作、在自…"},{"t":"失业者：能够工作且之前四周内努力找工作但没有找到的人，以及被解雇正在等待被召回原岗位的人。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">失业者</strong>：能够工作且之前四周内努力找工作但没有找到的人，以及被解雇正在等待被召回原岗位的人。","label":"失业者：能够工作且之前四周内努力找工…"},{"t":"非劳动力：不属于前两类者，如全日制学生、家务劳动者、退休人员。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">非劳动力</strong>：不属于前两类者，如全日制学生、家务劳动者、退休人员。","label":"非劳动力"}],"k":"b","i":2,"h":"<strong class=\"lead\">成年人</strong>（16岁以上）三分类：","label":"成年人（16岁以上）三分类："},{"t":"三个核心指标与公式：","c":[{"t":"劳动力（labor force）：既包括就业者又包括失业者的工人总数；劳动力＝就业者人数＋失业者人数。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">劳动力</strong>（labor force）：既包括就业者又包括失业者的工人总数；劳动力＝就业者人数＋失业者人数。","label":"劳动力（labor force）：既…"},{"t":"失业率（unemployment rate）：劳动力中失业者所占的百分比；失业率＝失业者人数÷劳动力×100%。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">失业率</strong>（unemployment rate）：劳动力中失业者所占的百分比；失业率＝失业者人数÷劳动力×100%。","label":"失业率（unemployment r…"},{"t":"劳动力参工率（labor-force participation rate）：劳动力占成年人口的百分比；劳动力参工率＝劳动力÷成年人口×100%。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">劳动力参工率</strong>（labor-force participation rate）：劳动力占成年人口的百分比；劳动力参工率＝劳动力÷成年人口×100%。","label":"劳动力参工率"}],"k":"b","i":2,"h":"<strong class=\"lead\">三个核心指标与公式</strong>：","label":"三个核心指标与公式"},{"t":"书中算例（2016年1月）：就业1.505亿人、失业0.078亿人，劳动力＝1.583亿人，失业率＝0.078÷1.583≈4.9%；成年人口2.524亿人，劳动力参工率≈62.7%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中算例</strong>（2016年1月）：就业1.505亿人、失业0.078亿人，劳动力＝1.583亿人，失业率＝0.078÷1.583≈4.9%；成年人口2.524亿人，劳动力参工率≈62.7%。","label":"书中算例"},{"t":"群体差异（表28-1，2014年）：最佳工作年龄女性参工率低于男性但失业率与男性类似；黑人参工率与白人类似但失业率高得多；青少年参工率低得多且失业率高得多——不同群体的劳动市场经历极为不同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">群体差异</strong>（表28-1，2014年）：最佳工作年龄女性参工率低于男性但失业率与男性类似；黑人参工率与白人类似但失业率高得多；青少年参工率低得多且失业率高得多——不同群体的劳动市场经历极为不同。","label":"群体差异"},{"t":"自然失业率（natural rate of unemployment）：正常的失业率，失业率围绕它上下波动（2015年国会预算办公室估算为4.9%）；周期性失业（cyclical unemployment）：失业率对自然失业率的背离，与短期经济波动相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自然失业率</strong>（natural rate of unemployment）：正常的失业率，失业率围绕它上下波动（2015年国会预算办公室估算为4.9%）；周期性失业（cyclical unemployment）：失业率对自然失业率的背离，与短期经济波动相关。","label":"自然失业率"}],"k":"b","i":1,"h":"28.1.1 如何衡量失业","label":"28.1.1 如何衡量失业"},{"t":"案例研究要点（美国男性与女性的劳动力参工率）：","c":[{"t":"二战后不久仅33%的女性参加工作或找工作，男性为87%；2015年女性为57%、男性为69%，差距显著缩小。","c":[],"k":"b","i":2,"h":"二战后不久仅33%的女性参加工作或找工作，男性为87%；2015年女性为57%、男性为69%，差距显著缩小。","label":"二战后不久仅33%的女性参加工作或找…"},{"t":"女性参工率上升的原因：家务新技术（洗衣机、冰箱等）、有效的生育控制、政治与社会态度的变化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">女性参工率上升的原因</strong>：家务新技术（洗衣机、冰箱等）、有效的生育控制、政治与社会态度的变化。","label":"女性参工率上升的原因"},{"t":"男性参工率下降的原因：年轻男性上学时间更长、老年男性退休更早且活得更长、 任一时刻见到的4个失业者中3个是全年失业者（占观察到的75%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中数字例子</strong>：一年中每周调查一次共会见55个失业工人，其中52人失业1周、3人失业全年——95%的失业在1周内结束，但任一时刻见到的4个失业者中3个是全年失业者（占观察到的75%）。","label":"书中数字例子"},{"t":"政策含义：成为失业者的大多数人很快找到工作，而经济中大部分失业问题由少数长期没有工作的工人造成，解释数据与设计政策都必须谨慎。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政策含义</strong>：成为失业者的大多数人很快找到工作，而经济中大部分失业问题由少数长期没有工作的工人造成，解释数据与设计政策都必须谨慎。","label":"政策含义"}],"k":"b","i":1,"h":"28.1.3 失业者没有工作的时间有多长","label":"28.1.3 失业者没有工作的时间有多长"},{"t":"28.1.4 为什么总有些人是失业者","c":[{"t":"在理想的劳动市场上，工资调整会使劳动供求平衡、所有工人充分就业；但现实中失业率从未降至零，总是围绕自然失业率波动。","c":[],"k":"b","i":2,"h":"在理想的劳动市场上，工资调整会使劳动供求平衡、所有工人充分就业；但现实中失业率从未降至零，总是围绕自然失业率波动。","label":"在理想的劳动市场上，工资调整会使劳动…"},{"t":"长期失业的四种解释：工人寻找最适合自己的工作需要时间（摩擦性失业）＋工资高于均衡水平的三个原因——最低工资法、工会、效率工资（结构性失业）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长期失业的四种解释</strong>：工人寻找最适合自己的工作需要时间（摩擦性失业）＋工资高于均衡水平的三个原因——最低工资法、工会、效率工资（结构性失业）。","label":"长期失业的四种解释"},{"t":"摩擦性失业（frictional unemployment）：因工人寻找最适合自己爱好和技能的工作需要时间而引起的失业，通常解释较短的失业持续时间。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">摩擦性失业</strong>（frictional unemployment）：因工人寻找最适合自己爱好和技能的工作需要时间而引起的失业，通常解释较短的失业持续时间。","label":"摩擦性失业"},{"t":"结构性失业（structural unemployment）：因某些劳动市场上可提供的工作岗位数量不足以为每个想工作的人提供岗位而引起的失业，通常解释较长的失业持续时间，产生于工资高于均衡水平时。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结构性失业</strong>（structural unemployment）：因某些劳动市场上可提供的工作岗位数量不足以为每个想工作的人提供岗位而引起的失业，通常解释较长的失业持续时间，产生于工资高于均衡水平时。","label":"结构性失业"}],"k":"b","i":1,"h":"28.1.4 为什么总有些人是失业者","label":"28.1.4 为什么总有些人是失业者"},{"t":"参考资料要点（就业岗位数）：失业率与整体就业来自6万户家庭调查；最受关注的就业岗位数来自对16万家工商户（约4000万就业人口）的调查；两调查口径不同（一人做两份兼职在工商户调查中算两个职位、自营者不被计入），失业数据只能来自家庭户调查。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料要点</strong>（就业岗位数）：失业率与整体就业来自6万户家庭调查；最受关注的就业岗位数来自对16万家工商户（约4000万就业人口）的调查；两调查口径不同（一人做两份兼职在工商户调查中算两个职位、自营者不被计入），失业数据只能来自家庭户调查。","label":"参考资料要点"}],"k":"sec","i":0,"h":"28.1 失业的确认","label":"28.1 失业的确认"},{"t":"28.2 寻找工作","c":[{"t":"寻找工作（job search）：在工人的爱好与技能既定时使工人与适当工作岗位相匹配的过程。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">寻找工作</strong>（job search）：在工人的爱好与技能既定时使工人与适当工作岗位相匹配的过程。","label":"寻找工作"},{"t":"28.2.1 为什么一些摩擦性失业是不可避免的","c":[{"t":"工人的爱好与技能不同、工作的性质不同、求职与空缺信息扩散缓慢，匹配需要时间。","c":[],"k":"b","i":2,"h":"工人的爱好与技能不同、工作的性质不同、求职与空缺信息扩散缓慢，匹配需要时间。","label":"工人的爱好与技能不同、工作的性质不同…"},{"t":"部门转移（sectoral shift）：各行业或各地区之间劳动需求的构成变动——如消费者在福特与通用汽车之间的偏好转换、油价下跌使产油州减员而汽车州增员——由于工人到新部门找到工作需要时间而暂时引起失业。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">部门转移</strong>（sectoral shift）：各行业或各地区之间劳动需求的构成变动——如消费者在福特与通用汽车之间的偏好转换、油价下跌使产油州减员而汽车州增员——由于工人到新部门找到工作需要时间而暂时引起失业。","label":"部门转移"},{"t":"国际贸易模式变动改变比较优势格局，也促使工人在行业间流动并经历一段失业。","c":[],"k":"b","i":2,"h":"国际贸易模式变动改变比较优势格局，也促使工人在行业间流动并经历一段失业。","label":"国际贸易模式变动改变比较优势格局，也…"},{"t":"摩擦性失业不可避免是因为经济总处于变动之中（书中2004-2014年：美国建筑业减83.8万人、制造业减210万人，采矿业增32.1万人、电脑系统设计增62.9万人、餐饮服务增190万人、保健服务增260万人）。","c":[],"k":"b","i":2,"h":"摩擦性失业不可避免是因为经济总处于变动之中（书中2004-2014年：美国建筑业减83.8万人、制造业减210万人，采矿业增32.1万人、电脑系统设计增62.9万人、餐饮服务增190万人、保健服务增260万人）。","label":"摩擦性失业不可避免是因为经济总处于变动之中"},{"t":"这种劳动力流动的长期结果是更高的生产率和更高的生活水平，代价是一定数量的摩擦性失业。","c":[],"k":"b","i":2,"h":"这种劳动力流动的长期结果是更高的生产率和更高的生活水平，代价是一定数量的摩擦性失业。","label":"这种劳动力流动的长期结果是更高的生产…"}],"k":"b","i":1,"h":"28.2.1 为什么一些摩擦性失业是不可避免的","label":"28.2.1 为什么一些摩擦性失业是…"},{"t":"28.2.2 公共政策和寻找工作","c":[{"t":"摩擦性失业不可避免但没有确定的数量：关于工作机会与工人可获得性的信息传播越快，匹配越快（如互联网的作用）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">摩擦性失业不可避免但没有确定的数量</strong>：关于工作机会与工人可获得性的信息传播越快，匹配越快（如互联网的作用）。","label":"摩擦性失业不可避免但没有确定的数量"},{"t":"政府可用的办法：政府管理的就业机构发布职位空缺信息；公共培训计划帮助衰落行业工人转向增长行业、帮助弱势群体。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政府可用的办法</strong>：政府管理的就业机构发布职位空缺信息；公共培训计划帮助衰落行业工人转向增长行业、帮助弱势群体。","label":"政府可用的办法"},{"t":"支持者认为这些计划使经济更有效运行并减少不平等；批评者认为私人市场（报纸广告、就业网站、大学就业辅导处、猎头公司、口口相传）匹配更好，政府传播信息与判断培训价值并不更优，决策最好由工人和雇主独立做出。","c":[],"k":"b","i":2,"h":"支持者认为这些计划使经济更有效运行并减少不平等；批评者认为私人市场（报纸广告、就业网站、大学就业辅导处、猎头公司、口口相传）匹配更好，政府传播信息与判断培训价值并不更优，决策最好由工人和雇主独立做出。","label":"支持者认为这些计划使经济更有效运行并…"}],"k":"b","i":1,"h":"28.2.2 公共政策和寻找工作","label":"28.2.2 公共政策和寻找工作"},{"t":"28.2.3 失业保险","c":[{"t":"失业保险（unemployment insurance）：当工人失业时为他们提供部分收入保障的政府计划；只向因雇主不再需要其技能而被解雇者提供（辞职、因过失被开除、刚进入劳动力队伍者不具资格）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">失业保险</strong>（unemployment insurance）：当工人失业时为他们提供部分收入保障的政府计划；只向因雇主不再需要其技能而被解雇者提供（辞职、因过失被开除、刚进入劳动力队伍者不具资格）。","label":"失业保险"},{"t":"美国普通失业工人可在26周内得到相当于以前工资50%的补助。","c":[],"k":"b","i":2,"h":"美国普通失业工人可在26周内得到相当于以前工资50%的补助。","label":"美国普通失业工人可在26周内得到相当…"},{"t":"激励效应（人们会对激励做出反应）：补助到找到新工作才停止，失业者不会努力找工作、更可能拒绝缺乏吸引力的工作；失业不再难以应付，工人谈判时较少要求工作保障。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">激励效应</strong>（人们会对激励做出反应）：补助到找到新工作才停止，失业者不会努力找工作、更可能拒绝缺乏吸引力的工作；失业不再难以应付，工人谈判时较少要求工作保障。","label":"激励效应"},{"t":"证据：1985年伊利诺伊州实验——被随机告知11周内找到新工作可获500美元额外补助的群体，平均失业时间比受控群体缩短7%；补助到期时失业者找到新工作的概率显著提高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证据</strong>：1985年伊利诺伊州实验——被随机告知11周内找到新工作可获500美元额外补助的群体，平均失业时间比受控群体缩短7%；补助到期时失业者找到新工作的概率显著提高。","label":"证据：1985年伊利诺伊州实验——被…"},{"t":"评价：失业保险实现了降低收入不确定性的目标，还可能使人拒绝不合适的工作从而改善人岗匹配；取消失业保险会减少失业量，但对经济福利是提高还是降低经济学家看法不一——失业率是衡量经济福利的不完善指标。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">评价</strong>：失业保险实现了降低收入不确定性的目标，还可能使人拒绝不合适的工作从而改善人岗匹配；取消失业保险会减少失业量，但对经济福利是提高还是降低经济学家看法不一——失业率是衡量经济福利的不完善指标。","label":"评价：失业保险实现了降低收入不确定性…"}],"k":"b","i":1,"h":"28.2.3 失业保险","label":"28.2.3 失业保险"}],"k":"sec","i":0,"h":"28.2 寻找工作","label":"28.2 寻找工作"},{"t":"28.3 最低工资法","c":[{"t":"图形结论（图28-4）：当最低工资法迫使工资高于供求平衡水平时，与均衡相比劳动供给量增加、劳动需求量减少，出现过剩的劳动（Ls−LD），即失业。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">图形结论</strong>（图28-4）：当最低工资法迫使工资高于供求平衡水平时，与均衡相比劳动供给量增加、劳动需求量减少，出现过剩的劳动（Ls−LD），即失业。","label":"图形结论"},{"t":"最低工资不是美国失业的主要原因：大多数工人工资远高于法定最低工资，最低工资法不限制他们向均衡水平的调节。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">最低工资不是美国失业的主要原因</strong>：大多数工人工资远高于法定最低工资，最低工资法不限制他们向均衡水平的调节。","label":"最低工资不是美国失业的主要原因"},{"t":"主要影响对象：最不熟练、经验最少的工人（如青少年）——其均衡工资往往相当低、更可能低于法定最低工资，最低工资法只能解释这些工人的失业。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">主要影响对象</strong>：最不熟练、经验最少的工人（如青少年）——其均衡工资往往相当低、更可能低于法定最低工资，最低工资法只能解释这些工人的失业。","label":"主要影响对象"},{"t":"一般性结论：工资出于任何一种原因高于均衡水平都会导致失业；最低工资只是工资\"太高\"的原因之一，工会与效率工资的分析图形与之相同。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">一般性结论</strong>：工资出于任何一种原因高于均衡水平都会导致失业；最低工资只是工资&quot;太高&quot;的原因之一，工会与效率工资的分析图形与之相同。","label":"一般性结论"},{"t":"结构性与摩擦性失业的区别：寻找工作不是因为工资不能平衡供求，工人是在挑选最适合的岗位；工资高于均衡时工人失业是因为在等待工作岗位。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">结构性与摩擦性失业的区别</strong>：寻找工作不是因为工资不能平衡供求，工人是在挑选最适合的岗位；工资高于均衡时工人失业是因为在等待工作岗位。","label":"结构性与摩擦性失业的区别"},{"t":"参考资料要点（谁在领取最低工资）：2014年约4%的小时工资工人工资处于或低于联邦最低工资（约占全体工人2%），更多是女性、年轻人（青少年中约15%）、受教育少者、兼职者，休闲餐饮业最集中。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料要点</strong>（谁在领取最低工资）：2014年约4%的小时工资工人工资处于或低于联邦最低工资（约占全体工人2%），更多是女性、年轻人（青少年中约15%）、受教育少者、兼职者，休闲餐饮业最集中。","label":"参考资料要点"},{"t":"新闻摘录要点（最低工资应该提高到每小时15美元吗，Neumark）：最低工资针对低工资而非低收入家庭（不少最低工资工人是青少年、部分贫困家庭无就业者），提高最低工资对帮助贫困家庭无效率；综述研究表明约2/3的研究发现提高最低工资对就业有负面影响；还会引起\"劳动—劳动替代\"（雇主用熟练工替代不熟练工）；作者主张用劳动收入税收减免（EITC）等税收再分配工具更好。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">新闻摘录要点</strong>（最低工资应该提高到每小时15美元吗，Neumark）：最低工资针对低工资而非低收入家庭（不少最低工资工人是青少年、部分贫困家庭无就业者），提高最低工资对帮助贫困家庭无效率；综述研究表明约2/3的研究发现提高最低工资对就业有负面影响；还会引起&quot;劳动—劳动替代&quot;（雇主用熟练工替代不熟练工）；作者主张用劳动收入税收减免（EITC）等税收再分配工具更好。","label":"新闻摘录要点"}],"k":"sec","i":0,"h":"28.3 最低工资法","label":"28.3 最低工资法"},{"t":"28.4 工会和集体谈判","c":[{"t":"工会（union）：与雇主就工资、津贴和工作条件进行谈判的工人协会；美国现约11%工人入会（20世纪40-50年代鼎盛期约三分之一），比利时、挪威、瑞典等欧洲国家仍有一半以上工人入会，法德大部分工人工资由集体谈判经法律确定。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">工会</strong>（union）：与雇主就工资、津贴和工作条件进行谈判的工人协会；美国现约11%工人入会（20世纪40-50年代鼎盛期约三分之一），比利时、挪威、瑞典等欧洲国家仍有一半以上工人入会，法德大部分工人工资由集体谈判经法律确定。","label":"工会（union）：与雇主就工资、津…"},{"t":"28.4.1 工会经济学","c":[{"t":"工会是一种卡特尔：共同行动以发挥市场势力的卖者群体；大部分工人单独与雇主谈判，工会工人则作为一个群体行动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工会是一种卡特尔</strong>：共同行动以发挥市场势力的卖者群体；大部分工人单独与雇主谈判，工会工人则作为一个群体行动。","label":"工会是一种卡特尔"},{"t":"集体谈判（collective bargaining）：工会与企业就就业条件达成一致的过程。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">集体谈判</strong>（collective bargaining）：工会与企业就就业条件达成一致的过程。","label":"集体谈判"},{"t":"罢工（strike）：工会有组织地从企业撤出劳动力；罢工减少企业生产、销售和利润，罢工威胁使企业同意支付更高工资——入会工人收入比未入会同类工人高10%~20%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">罢工</strong>（strike）：工会有组织地从企业撤出劳动力；罢工减少企业生产、销售和利润，罢工威胁使企业同意支付更高工资——入会工人收入比未入会同类工人高10%~20%。","label":"罢工（strike）：工会有组织地从…"},{"t":"工会把工资提高到均衡水平之上→劳动供给量增加、需求量减少→引起失业：仍在岗的局内人状况变好，以前有工作现在失业的局外人状况变坏。","c":[],"k":"b","i":2,"h":"工会把工资提高到均衡水平之上→劳动供给量增加、需求量减少→引起失业：仍在岗的局内人状况变好，以前有工作现在失业的局外人状况变坏。","label":"工会把工资提高到均衡水平之上→劳动供…"},{"t":"局外人的两种反应：失业等待时机成为局内人；或到没有工会的企业工作，从而增加无工会部门的劳动供给并压低其工资——未入会工人承担了部分损失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">局外人的两种反应</strong>：失业等待时机成为局内人；或到没有工会的企业工作，从而增加无工会部门的劳动供给并压低其工资——未入会工人承担了部分损失。","label":"局外人的两种反应"},{"t":"法律环境：企业间价格协议属\"限制交易的共谋\"受反托拉斯法追究，但工会不受限制；《瓦格纳法案》（1935）禁止雇主干预组会并要求其诚信谈判，全国劳工关系委员会（NLRB）保障组会权利；\"工作权利法\"等立法争议影响工会的未来市场势力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">法律环境</strong>：企业间价格协议属&quot;限制交易的共谋&quot;受反托拉斯法追究，但工会不受限制；《瓦格纳法案》（1935）禁止雇主干预组会并要求其诚信谈判，全国劳工关系委员会（NLRB）保障组会权利；&quot;工作权利法&quot;等立法争议影响工会的未来市场势力。","label":"法律环境"}],"k":"b","i":1,"h":"28.4.1 工会经济学","label":"28.4.1 工会经济学"},{"t":"28.4.2 工会对经济是好还是坏","c":[{"t":"批评者：工会仅是卡特尔，把工资提到竞争水平之上引起失业、降低其他部门工资；劳动配置无效率（有工会企业就业低于有效竞争水平）且不公平（一些工人的获益以另一些工人的损失为代价）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">批评者</strong>：工会仅是卡特尔，把工资提到竞争水平之上引起失业、降低其他部门工资；劳动配置无效率（有工会企业就业低于有效竞争水平）且不公平（一些工人的获益以另一些工人的损失为代价）。","label":"批评者：工会仅是卡特尔，把工资提到竞…"},{"t":"支持者：工会是与企业市场势力（极端如\"公司城\"）抗衡所必需，可平衡企业势力、保护工人免受摆布；还代表工人就工时、加班、休假、病假、医疗津贴、晋升、安全性等发声，帮助企业保有乐观而富有生产率的劳动力队伍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">支持者</strong>：工会是与企业市场势力（极端如&quot;公司城&quot;）抗衡所必需，可平衡企业势力、保护工人免受摆布；还代表工人就工时、加班、休假、病假、医疗津贴、晋升、安全性等发声，帮助企业保有乐观而富有生产率的劳动力队伍。","label":"支持者：工会是与企业市场势力（极端如…"},{"t":"结论：经济学家对工会好坏并无共识，其影响可能在一些情况下有利、在另一些情况下不利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：经济学家对工会好坏并无共识，其影响可能在一些情况下有利、在另一些情况下不利。","label":"结论：经济学家对工会好坏并无共识，其…"}],"k":"b","i":1,"h":"28.4.2 工会对经济是好还是坏","label":"28.4.2 工会对经济是好还是坏"}],"k":"sec","i":0,"h":"28.4 工会和集体谈判","label":"28.4 工会和集体谈判"},{"t":"28.5 效率工资理论","c":[{"t":"效率工资（efficiency wages）：企业为了提高工人的生产率而支付的高于均衡水平的工资。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">效率工资</strong>（efficiency wages）：企业为了提高工人的生产率而支付的高于均衡水平的工资。","label":"效率工资"},{"t":"与最低工资法、工会的异同：三种情况下失业都源于工资高于均衡水平；但最低工资法与工会是从外部阻止企业降工资，效率工资则是企业自愿维持高工资——即使存在超额劳动供给，保持高工资对企业也有利。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">与最低工资法、工会的异同</strong>：三种情况下失业都源于工资高于均衡水平；但最低工资法与工会是从外部阻止企业降工资，效率工资则是企业自愿维持高工资——即使存在超额劳动供给，保持高工资对企业也有利。","label":"与最低工资法、工会的异同"},{"t":"四种效率工资理论：","c":[{"t":"工人健康状况：工资高的工人饮食营养更丰富、更健康、生产率更高；适用于解释欠发达国家的失业，不适用于美国等富裕国家。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工人健康状况</strong>：工资高的工人饮食营养更丰富、更健康、生产率更高；适用于解释欠发达国家的失业，不适用于美国等富裕国家。","label":"工人健康状况"},{"t":"工人流动率：工资越高选择离职的工人越少；雇用并培训新工人有成本且新工人生产率较低，支付高工资降低流动率从而降低成本是有利的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工人流动率</strong>：工资越高选择离职的工人越少；雇用并培训新工人有成本且新工人生产率较低，支付高工资降低流动率从而降低成本是有利的。","label":"工人流动率"},{"t":"工人素质：企业无法准确测定申请者素质，高工资吸引更能干的申请者；若降工资，最有能力的申请者（有更好的选择机会）会放弃申请。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工人素质</strong>：企业无法准确测定申请者素质，高工资吸引更能干的申请者；若降工资，最有能力的申请者（有更好的选择机会）会放弃申请。","label":"工人素质"},{"t":"工人努力程度：工人对努力程度有相机抉择权且监测成本高；高于均衡水平的工资使工人更渴望保住工作、付出最大努力，均衡工资下被解雇的代价小、缺乏努力激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工人努力程度</strong>：工人对努力程度有相机抉择权且监测成本高；高于均衡水平的工资使工人更渴望保住工作、付出最大努力，均衡工资下被解雇的代价小、缺乏努力激励。","label":"工人努力程度"}],"k":"b","i":1,"h":"<strong class=\"lead\">四种效率工资理论</strong>：","label":"四种效率工资理论"},{"t":"案例研究要点（亨利·福特及其极为慷慨的每天5美元工资）：","c":[{"t":"1914年福特主动实行每天5美元工资，约为当时一般工资的2倍，宣布后工厂外求职者排起长队——愿意在此工资下工作的工人远超所需。","c":[],"k":"b","i":2,"h":"1914年福特主动实行每天5美元工资，约为当时一般工资的2倍，宣布后工厂外求职者排起长队——愿意在此工资下工作的工人远超所需。","label":"1914年福特主动实行每天5美元工资…"},{"t":"结果符合效率工资理论的预期：流动率下降、缺勤率下降、生产率提高，尽管工资较高，生产成本反而减少；福特称之为\"我们所做出的最成功的降低成本的努力之一\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果符合效率工资理论的预期</strong>：流动率下降、缺勤率下降、生产率提高，尽管工资较高，生产成本反而减少；福特称之为&quot;我们所做出的最成功的降低成本的努力之一&quot;。","label":"结果符合效率工资理论的预期"},{"t":"装配线使工人高度相互依赖（一人旷工或缓慢则他人无法完成任务），低流动率、高努力与高素质对福特格外重要，故效率工资对福特是比其他公司更好的战略。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">装配线使工人高度相互依赖</strong>（一人旷工或缓慢则他人无法完成任务），低流动率、高努力与高素质对福特格外重要，故效率工资对福特是比其他公司更好的战略。","label":"装配线使工人高度相互依赖"}],"k":"b","i":1,"h":"<strong class=\"lead\">案例研究要点</strong>（亨利·福特及其极为慷慨的每天5美元工资）：","label":"案例研究要点"}],"k":"sec","i":0,"h":"28.5 效率工资理论","label":"28.5 效率工资理论"},{"t":"28.6 结论","c":[{"t":"寻找工作、最低工资法、工会和效率工资共同解释经济中总存在失业的现象，但哪一种解释对美国经济和世界经济最重要，经济学家意见不一。","c":[],"k":"b","i":1,"h":"寻找工作、最低工资法、工会和效率工资共同解释经济中总存在失业的现象，但哪一种解释对美国经济和世界经济最重要，经济学家意见不一。","label":"寻找工作、最低工资法、工会和效率工资…"},{"t":"自然失业率并非一直不变：信息革命改变找工作过程、国会调整最低工资、工会组成或解散、企业改变对效率工资的依赖，都会改变正常运行时的失业量。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">自然失业率并非一直不变</strong>：信息革命改变找工作过程、国会调整最低工资、工会组成或解散、企业改变对效率工资的依赖，都会改变正常运行时的失业量。","label":"自然失业率并非一直不变"},{"t":"失业不是一个能用简单方法解决的问题，但所选择的社会组织方式会对失业的普遍性产生深远影响。","c":[],"k":"b","i":1,"h":"失业不是一个能用简单方法解决的问题，但所选择的社会组织方式会对失业的普遍性产生深远影响。","label":"失业不是一个能用简单方法解决的问题，…"}],"k":"sec","i":0,"h":"28.6 结论","label":"28.6 结论"}],"k":"chap","h":"第28章 失业","label":"第28章 失业"}],"k":"part","h":"第9篇 长期中的真实经济","label":"第9篇 长期中的真实经济","col":"#0e9f8a","pc":"p2"},{"t":"第10篇 长期中的货币与物价","c":[{"t":"第29章 货币制度","c":[{"t":"本章内容提要","c":[{"t":"货币是经济中人们经常用于购买物品与服务的资产，只有卖者通常接受的少数几种财富才算货币。","c":[],"k":"b","i":1,"h":"货币是经济中人们经常用于购买物品与服务的资产，只有卖者通常接受的少数几种财富才算货币。","label":"货币是经济中人们经常用于购买物品与服…"},{"t":"货币有三种职能：交换媒介、计价单位、价值储藏手段；货币是流动性最强的资产。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">货币有三种职能</strong>：交换媒介、计价单位、价值储藏手段；货币是流动性最强的资产。","label":"货币有三种职能"},{"t":"商品货币（如黄金）有内在价值，法定货币（如纸币）没有内在价值、由政府法令确定，其成功还依赖预期与社会习惯。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">商品货币</strong>（如黄金）有内在价值，法定货币（如纸币）没有内在价值、由政府法令确定，其成功还依赖预期与社会习惯。","label":"商品货币"},{"t":"美国货币存量以M1、M2衡量，不仅包括通货，也包括可随时用于购买的银行存款（如活期存款）。","c":[],"k":"b","i":1,"h":"美国货币存量以M1、M2衡量，不仅包括通货，也包括可随时用于购买的银行存款（如活期存款）。","label":"美国货币存量以M1、M2衡量，不仅包…"},{"t":"美联储（联邦储备局）是美国的中央银行，负责管制银行体系并控制货币供给；货币政策由联邦公开市场委员会（FOMC）制定。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">美联储</strong>（联邦储备局）是美国的中央银行，负责管制银行体系并控制货币供给；货币政策由联邦公开市场委员会（FOMC）制定。","label":"美联储（联邦储备局）是美国的中央银行…"},{"t":"部分准备金银行制下银行创造货币但不创造财富；货币乘数等于准备金率的倒数（1/R）。","c":[],"k":"b","i":1,"h":"部分准备金银行制下银行创造货币但不创造财富；货币乘数等于准备金率的倒数（1/R）。","label":"部分准备金银行制下银行创造货币但不创…"},{"t":"银行资本与杠杆：杠杆率（总资产÷资本）放大银行资产变动对资本的影响，监管者因此规定资本需要量。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">银行资本与杠杆</strong>：杠杆率（总资产÷资本）放大银行资产变动对资本的影响，监管者因此规定资本需要量。","label":"银行资本与杠杆"},{"t":"美联储的工具分两类：影响准备金量（公开市场操作、向银行放款/贴现率）与影响准备金率（法定准备金、准备金利率）；公开市场操作最常用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">美联储的工具分两类</strong>：影响准备金量（公开市场操作、向银行放款/贴现率）与影响准备金率（法定准备金、准备金利率）；公开市场操作最常用。","label":"美联储的工具分两类"},{"t":"美联储不能完全控制货币供给：家庭选择持有的存款/通货量与银行选择的贷款量都不由它决定。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">美联储不能完全控制货币供给</strong>：家庭选择持有的存款/通货量与银行选择的贷款量都不由它决定。","label":"美联储不能完全控制货币供给"},{"t":"联邦基金利率是银行间隔夜拆借准备金的利率；美联储近年为其设定目标，实现目标的同时也就调整了货币供给——两者是同一枚硬币的两面。","c":[],"k":"b","i":1,"h":"联邦基金利率是银行间隔夜拆借准备金的利率；美联储近年为其设定目标，实现目标的同时也就调整了货币供给——两者是同一枚硬币的两面。","label":"联邦基金利率是银行间隔夜拆借准备金的…"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"29.1 货币的含义","c":[{"t":"29.1.1 货币的职能","c":[{"t":"货币（money）：经济中人们经常用于向其他人购买物品与服务的一组资产；与日常语境的\"财富\"不同（盖茨的微软股权是财富但不是货币）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币</strong>（money）：经济中人们经常用于向其他人购买物品与服务的一组资产；与日常语境的&quot;财富&quot;不同（盖茨的微软股权是财富但不是货币）。","label":"货币（money）：经济中人们经常用…"},{"t":"交换媒介（medium of exchange）：买者在购买物品与服务时给予卖者的东西，被普遍接受。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">交换媒介</strong>（medium of exchange）：买者在购买物品与服务时给予卖者的东西，被普遍接受。","label":"交换媒介"},{"t":"计价单位（unit of account）：人们用来表示价格和记录债务的标准。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">计价单位</strong>（unit of account）：人们用来表示价格和记录债务的标准。","label":"计价单位"},{"t":"价值储藏手段（store of value）：人们用来把现在的购买力转变为未来的购买力的东西；财富指所有价值储藏手段的总量（货币加非货币资产）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">价值储藏手段</strong>（store of value）：人们用来把现在的购买力转变为未来的购买力的东西；财富指所有价值储藏手段的总量（货币加非货币资产）。","label":"价值储藏手段"},{"t":"流动性（liquidity）：一种资产转换为经济中交换媒介的容易程度；货币是最具流动性的资产，股票债券次之，房子、油画、棒球运动员卡流动性弱。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">流动性</strong>（liquidity）：一种资产转换为经济中交换媒介的容易程度；货币是最具流动性的资产，股票债券次之，房子、油画、棒球运动员卡流动性弱。","label":"流动性（liquidity）：一种资…"},{"t":"货币作为价值储藏手段并不完美：物价上升时货币购买力降低——物价水平与货币价值之间的联系是理解货币影响经济的关键（下一章论及）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币作为价值储藏手段并不完美</strong>：物价上升时货币购买力降低——物价水平与货币价值之间的联系是理解货币影响经济的关键（下一章论及）。","label":"货币作为价值储藏手段并不完美"},{"t":"背景：物物交换经济要求\"需求的双向一致性\"，难以有效配置稀缺资源；货币使交易循环进行、便利专业化分工，从而提高生活水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：物物交换经济要求&quot;需求的双向一致性&quot;，难以有效配置稀缺资源；货币使交易循环进行、便利专业化分工，从而提高生活水平。","label":"背景：物物交换经济要求\"需求的双向一…"}],"k":"b","i":1,"h":"29.1.1 货币的职能","label":"29.1.1 货币的职能"},{"t":"29.1.2 货币的种类","c":[{"t":"商品货币（commodity money）：以有内在价值的商品为形式的货币——内在价值指即使不作为货币、物品本身也有价值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">商品货币</strong>（commodity money）：以有内在价值的商品为形式的货币——内在价值指即使不作为货币、物品本身也有价值。","label":"商品货币"},{"t":"商品货币的例子：黄金（可用于工业与首饰，历史上最常见的货币形式，金本位制）；二战战俘营与苏联解体后莫斯科的香烟（不吸烟者也乐于接受）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">商品货币的例子</strong>：黄金（可用于工业与首饰，历史上最常见的货币形式，金本位制）；二战战俘营与苏联解体后莫斯科的香烟（不吸烟者也乐于接受）。","label":"商品货币的例子"},{"t":"法定货币（fiat money）：没有内在价值、由政府法令确定作为通货使用的货币（美元纸币 vs 《地产大亨》游戏币——差别在于美国政府的法令）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">法定货币</strong>（fiat money）：没有内在价值、由政府法令确定作为通货使用的货币（美元纸币 vs 《地产大亨》游戏币——差别在于美国政府的法令）。","label":"法定货币"},{"t":"法定货币制度的成功不仅靠政府法令（惩罚伪钞），还在很大程度上依赖对预期和社会习惯的依赖（苏联解体后莫斯科人更愿接受香烟甚至美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">法定货币制度的成功不仅靠政府法令</strong>（惩罚伪钞），还在很大程度上依赖对预期和社会习惯的依赖（苏联解体后莫斯科人更愿接受香烟甚至美元）。","label":"法定货币制度的成功不仅靠政府法令"}],"k":"b","i":1,"h":"29.1.2 货币的种类","label":"29.1.2 货币的种类"},{"t":"29.1.3 美国经济中的货币","c":[{"t":"货币存量：经济中流通的货币量，对许多经济变量有重要影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币存量</strong>：经济中流通的货币量，对许多经济变量有重要影响。","label":"货币存量"},{"t":"通货（currency）：公众手中持有的纸币钞票和铸币，是最广泛接受的交换媒介。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">通货</strong>（currency）：公众手中持有的纸币钞票和铸币，是最广泛接受的交换媒介。","label":"通货（currency）：公众手中持…"},{"t":"活期存款（demand deposits）：储户可以通过签发支票或在商店刷借记卡随时支取的银行账户余额，几乎与通货同样方便地用于购买。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">活期存款</strong>（demand deposits）：储户可以通过签发支票或在商店刷借记卡随时支取的银行账户余额，几乎与通货同样方便地用于购买。","label":"活期存款"},{"t":"界线难题：铸币显然是货币、帝国大厦显然不是，但两个极端之间的许多资产难以区分，不同的分析者意见不一，因此存在多种货币存量衡量标准。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">界线难题</strong>：铸币显然是货币、帝国大厦显然不是，但两个极端之间的许多资产难以区分，不同的分析者意见不一，因此存在多种货币存量衡量标准。","label":"界线难题"},{"t":"M1与M2：两个最常用的衡量指标（图29-1，2016年1月M1约3.2万亿美元、M2约12.5万亿美元），M2包括的资产比M1多；本书讨论不受两者区别影响，要点是货币存量包括通货和可随时获得的存款。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">M1与M2</strong>：两个最常用的衡量指标（图29-1，2016年1月M1约3.2万亿美元、M2约12.5万亿美元），M2包括的资产比M1多；本书讨论不受两者区别影响，要点是货币存量包括通货和可随时获得的存款。","label":"M1与M2"}],"k":"b","i":1,"h":"29.1.3 美国经济中的货币","label":"29.1.3 美国经济中的货币"},{"t":"案例研究要点（所有通货都去了哪里）：","c":[{"t":"2016年1月美国流通中通货约1.4万亿美元，除以成年人口约2.52亿，人均持有约5500美元，远超一般人钱包中的现金。","c":[],"k":"b","i":2,"h":"2016年1月美国流通中通货约1.4万亿美元，除以成年人口约2.52亿，人均持有约5500美元，远超一般人钱包中的现金。","label":"2016年1月美国流通中通货约1.4…"},{"t":"解释一：许多通货由外国人持有——在货币制度不稳定的国家，美元被用作交换媒介、计价单位和价值储藏手段。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解释一</strong>：许多通货由外国人持有——在货币制度不稳定的国家，美元被用作交换媒介、计价单位和价值储藏手段。","label":"解释一：许多通货由外国人持有——在货…"},{"t":"解释二：许多通货由毒品商、逃税者等犯罪分子持有——通货不留痕迹、不生息，对犯罪分子是最好的价值储藏手段。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解释二</strong>：许多通货由毒品商、逃税者等犯罪分子持有——通货不留痕迹、不生息，对犯罪分子是最好的价值储藏手段。","label":"解释二：许多通货由毒品商、逃税者等犯…"}],"k":"b","i":1,"h":"<strong class=\"lead\">案例研究要点</strong>（所有通货都去了哪里）：","label":"案例研究要点"},{"t":"参考资料要点（为什么信用卡不是货币）：","c":[{"t":"信用卡不是支付方式而是延期支付方式：银行先替持卡人付款，持卡人事后用支票账户偿还，真正的货币是该支票账户余额。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信用卡不是支付方式而是延期支付方式</strong>：银行先替持卡人付款，持卡人事后用支票账户偿还，真正的货币是该支票账户余额。","label":"信用卡不是支付方式而是延期支付方式"},{"t":"借记卡不同：它立即从银行账户提款支付，更类似支票，其账户余额计入货币存量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">借记卡不同</strong>：它立即从银行账户提款支付，更类似支票，其账户余额计入货币存量。","label":"借记卡不同"},{"t":"信用卡虽不是货币，但持卡人平时可少持货币，其普及会减少人们选择持有的货币量。","c":[],"k":"b","i":2,"h":"信用卡虽不是货币，但持卡人平时可少持货币，其普及会减少人们选择持有的货币量。","label":"信用卡虽不是货币，但持卡人平时可少持…"}],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料要点</strong>（为什么信用卡不是货币）：","label":"参考资料要点"}],"k":"sec","i":0,"h":"29.1 货币的含义","label":"29.1 货币的含义"},{"t":"29.2 联邦储备体系","c":[{"t":"29.2.1 美联储的结构","c":[{"t":"联邦储备局（Federal Reserve，简称美联储）：美国的中央银行；使用法定货币制度的经济必须有机构管理货币制度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">联邦储备局</strong>（Federal Reserve，简称美联储）：美国的中央银行；使用法定货币制度的经济必须有机构管理货币制度。","label":"联邦储备局"},{"t":"中央银行（central bank）：为了监管银行体系和调节经济中的货币量而设计的机构；其他主要央行有英格兰银行、日本银行、欧洲中央银行。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">中央银行</strong>（central bank）：为了监管银行体系和调节经济中的货币量而设计的机构；其他主要央行有英格兰银行、日本银行、欧洲中央银行。","label":"中央银行"},{"t":"设立：1907年一系列银行倒闭事件后，国会于1913年创建美联储。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">设立</strong>：1907年一系列银行倒闭事件后，国会于1913年创建美联储。","label":"设立：1907年一系列银行倒闭事件后…"},{"t":"组成：华盛顿特区的联邦储备理事会（7名理事由总统任命、参议院确认，任期14年——长期任职使货币政策独立于短期政治压力）＋位于主要城市的12个地区联邦储备银行；理事会主席任期4年由总统任命，任命官员、主持例会、出席国会听证。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组成</strong>：华盛顿特区的联邦储备理事会（7名理事由总统任命、参议院确认，任期14年——长期任职使货币政策独立于短期政治压力）＋位于主要城市的12个地区联邦储备银行；理事会主席任期4年由总统任命，任命官员、主持例会、出席国会听证。","label":"组成：华盛顿特区的联邦储备理事会（7…"},{"t":"两项相互关联的工作：一是管制银行并确保银行体系正常运行（由地区联储负责：监管银行财务状况、推进支票结算、充当\"银行的银行\"与最后贷款者——贷款给在任何地方都借不到款的银行）；二是控制货币供给（更重要）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两项相互关联的工作</strong>：一是管制银行并确保银行体系正常运行（由地区联储负责：监管银行财务状况、推进支票结算、充当&quot;银行的银行&quot;与最后贷款者——贷款给在任何地方都借不到款的银行）；二是控制货币供给（更重要）。","label":"两项相互关联的工作"},{"t":"货币供给（money supply）：经济中可得到的货币量；货币政策（monetary policy）：中央银行的决策者对货币供给的安排。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币供给</strong>（money supply）：经济中可得到的货币量；货币政策（monetary policy）：中央银行的决策者对货币供给的安排。","label":"货币供给"}],"k":"b","i":1,"h":"29.2.1 美联储的结构","label":"29.2.1 美联储的结构"},{"t":"29.2.2 联邦公开市场委员会","c":[{"t":"FOMC由美联储7位理事和12位地区银行总裁中的5位组成：12位总裁都参加会议但仅5位轮流投票，纽约联储总裁总是拥有投票权（政府债券买卖在其交易柜台进行）。","c":[],"k":"b","i":2,"h":"FOMC由美联储7位理事和12位地区银行总裁中的5位组成：12位总裁都参加会议但仅5位轮流投票，纽约联储总裁总是拥有投票权（政府债券买卖在其交易柜台进行）。","label":"FOMC由美联储7位理事和12位地区…"},{"t":"每6周在华盛顿开会一次，讨论经济状况并考虑货币政策变动。","c":[],"k":"b","i":2,"h":"每6周在华盛顿开会一次，讨论经济状况并考虑货币政策变动。","label":"每6周在华盛顿开会一次，讨论经济状况…"},{"t":"主要工具是公开市场操作——买卖美国政府债券：买进债券时美联储创造美元支付给公众、增加货币供给；卖出债券时从公众手中收回美元、减少货币供给。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">主要工具是公开市场操作——买卖美国政府债券</strong>：买进债券时美联储创造美元支付给公众、增加货币供给；卖出债券时从公众手中收回美元、减少货币供给。","label":"主要工具是公开市场操作——买卖美国政府债券"},{"t":"货币政策之所以重要，依据两条经济学十大原理：政府发行了过多货币时物价上升；社会面临通货膨胀与失业之间的短期权衡取舍——美联储主席被称为美国第二有影响力的人物。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币政策之所以重要，依据两条经济学十大原理</strong>：政府发行了过多货币时物价上升；社会面临通货膨胀与失业之间的短期权衡取舍——美联储主席被称为美国第二有影响力的人物。","label":"货币政策之所以重要，依据两条经济学十大原理"}],"k":"b","i":1,"h":"29.2.2 联邦公开市场委员会","label":"29.2.2 联邦公开市场委员会"}],"k":"sec","i":0,"h":"29.2 联邦储备体系","label":"29.2 联邦储备体系"},{"t":"29.3 银行与货币供给","c":[{"t":"银行影响货币供给是因为活期存款（支票账户余额）本身就是货币；银行的行为影响活期存款量，从而使美联储控制货币供给的工作复杂化。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">银行影响货币供给是因为活期存款</strong>（支票账户余额）本身就是货币；银行的行为影响活期存款量，从而使美联储控制货币供给的工作复杂化。","label":"银行影响货币供给是因为活期存款"},{"t":"29.3.1 百分之百准备金银行制的简单情形","c":[{"t":"准备金（reserves）：银行得到但没有贷出去的存款。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">准备金</strong>（reserves）：银行得到但没有贷出去的存款。","label":"准备金（reserves）：银行得到…"},{"t":"T型账户：表明银行资产与负债变动的简化会计报表；资产与负债完全相等的报表也称资产负债表。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">T型账户</strong>：表明银行资产与负债变动的简化会计报表；资产与负债完全相等的报表也称资产负债表。","label":"T型账户"},{"t":"书中示例：无银行经济中通货100美元即货币供给；第一国民银行只存不贷（百分之百准备金银行制），吸收全部100美元后——资产为100美元准备金，负债为100美元存款。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中示例</strong>：无银行经济中通货100美元即货币供给；第一国民银行只存不贷（百分之百准备金银行制），吸收全部100美元后——资产为100美元准备金，负债为100美元存款。","label":"书中示例"},{"t":"结论：存款等量替代通货，货币供给不变——若银行以准备金形式持有所有存款，银行不影响货币供给。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：存款等量替代通货，货币供给不变——若银行以准备金形式持有所有存款，银行不影响货币供给。","label":"结论：存款等量替代通货，货币供给不变…"}],"k":"b","i":1,"h":"29.3.1 百分之百准备金银行制的简单情形","label":"29.3.1 百分之百准备金银行制的…"},{"t":"29.3.2 部分准备金银行制下的货币创造","c":[{"t":"部分准备金银行制（fractional-reserve banking）：银行只把部分存款作为准备金的制度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">部分准备金银行制</strong>（fractional-reserve banking）：银行只把部分存款作为准备金的制度。","label":"部分准备金银行制"},{"t":"准备金率（reserve ratio）：银行作为准备金持有的存款比率；由政府管制和银行政策共同决定——美联储规定法定准备金（最低水平），超出部分为超额准备金。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">准备金率</strong>（reserve ratio）：银行作为准备金持有的存款比率；由政府管制和银行政策共同决定——美联储规定法定准备金（最低水平），超出部分为超额准备金。","label":"准备金率"},{"t":"书中示例（准备金率10%）：第一国民银行吸收100美元存款，留10美元准备金、发放90美元贷款；储户存款仍是100美元，借款人另持有90美元通货，货币供给（通货＋活期存款）＝190美元——当银行只把部分存款作为准备金时，银行创造了货币。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中示例</strong>（准备金率10%）：第一国民银行吸收100美元存款，留10美元准备金、发放90美元贷款；储户存款仍是100美元，借款人另持有90美元通货，货币供给（通货＋活期存款）＝190美元——当银行只把部分存款作为准备金时，银行创造了货币。","label":"书中示例"},{"t":"关键辨析：货币创造不等于财富创造——银行创造货币资产的同时也创造了借款人的相应负债；经济从交换媒介增多的意义上更具流动性，但并没有比以前更富裕。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键辨析</strong>：货币创造不等于财富创造——银行创造货币资产的同时也创造了借款人的相应负债；经济从交换媒介增多的意义上更具流动性，但并没有比以前更富裕。","label":"关键辨析"}],"k":"b","i":1,"h":"29.3.2 部分准备金银行制下的货币创造","label":"29.3.2 部分准备金银行制下的货…"},{"t":"29.3.3 货币乘数","c":[{"t":"过程：借款人花掉90美元后存入第二国民银行（准备金率10%：留9美元、贷81美元），再存入第三国民银行（留8.10美元、贷72.90美元）……货币每存入一次，银行就进行一次贷款，更多货币被创造。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">过程</strong>：借款人花掉90美元后存入第二国民银行（准备金率10%：留9美元、贷81美元），再存入第三国民银行（留8.10美元、贷72.90美元）……货币每存入一次，银行就进行一次贷款，更多货币被创造。","label":"过程：借款人花掉90美元后存入第二国…"},{"t":"加总：初始存款100＋贷款90＋81＋72.90＋……＝1000美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">加总</strong>：初始存款100＋贷款90＋81＋72.90＋……＝1000美元。","label":"加总：初始存款100＋贷款90＋81…"},{"t":"货币乘数（money multiplier）：银行体系用1美元准备金所产生的货币量；等于准备金率的倒数（1/R），R=1/10时乘数为10。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币乘数</strong>（money multiplier）：银行体系用1美元准备金所产生的货币量；等于准备金率的倒数（1/R），R=1/10时乘数为10。","label":"货币乘数"},{"t":"倒数公式的逻辑：准备金率1/10意味着1000美元存款须持有100美元准备金；反过来，100美元准备金最多支撑1000美元存款——存款与准备金之比即乘数。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">倒数公式的逻辑</strong>：准备金率1/10意味着1000美元存款须持有100美元准备金；反过来，100美元准备金最多支撑1000美元存款——存款与准备金之比即乘数。","label":"倒数公式的逻辑"},{"t":"比较静态：准备金率越高，每个银行贷出的越少，货币乘数越小（准备金率1/20时乘数20；1/4时乘数4）；百分之百准备金的特殊情形下乘数为1，银行不贷款也不创造货币。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">比较静态</strong>：准备金率越高，每个银行贷出的越少，货币乘数越小（准备金率1/20时乘数20；1/4时乘数4）；百分之百准备金的特殊情形下乘数为1，银行不贷款也不创造货币。","label":"比较静态"}],"k":"b","i":1,"h":"29.3.3 货币乘数","label":"29.3.3 货币乘数"},{"t":"29.3.4 银行资本、杠杆以及2008—2009年的金融危机","c":[{"t":"银行资本（bank capital）：银行的所有者投入机构的资源（向所有者发行股票所得）；更现实的银行还发行债务、购买有价证券。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">银行资本</strong>（bank capital）：银行的所有者投入机构的资源（向所有者发行股票所得）；更现实的银行还发行债务、购买有价证券。","label":"银行资本"},{"t":"书中更现实的资产负债表：资产＝准备金200＋贷款700＋有价证券100＝1000美元；负债和所有者权益＝存款800＋债务150＋资本（所有者权益）50；左右两边总量恒等，因为按定义所有者权益＝资产−负债。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中更现实的资产负债表</strong>：资产＝准备金200＋贷款700＋有价证券100＝1000美元；负债和所有者权益＝存款800＋债务150＋资本（所有者权益）50；左右两边总量恒等，因为按定义所有者权益＝资产−负债。","label":"书中更现实的资产负债表"},{"t":"杠杆（leverage）：将借到的货币追加到用于投资的现有资金上；借贷是银行业务的中心，杠杆对银行尤其重要。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">杠杆</strong>（leverage）：将借到的货币追加到用于投资的现有资金上；借贷是银行业务的中心，杠杆对银行尤其重要。","label":"杠杆（leverage）：将借到的货…"},{"t":"杠杆率（leverage ratio）：银行总资产与银行资本的比率；示例中为1000÷50＝20——所有者每拿1美元资本支撑20美元资产，其中19美元靠借入（吸收存款或发行债务）筹资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">杠杆率</strong>（leverage ratio）：银行总资产与银行资本的比率；示例中为1000÷50＝20——所有者每拿1美元资本支撑20美元资产，其中19美元靠借入（吸收存款或发行债务）筹资。","label":"杠杆率（leverage ratio…"},{"t":"杠杆的放大效应（示例，杠杆率20）：资产价值上升5%至1050美元→资本从50升至100（+100%）；资产价值下降5%至950美元→资本降为零（−100%）；下降超过5%则资不抵债，无法完全偿还债权人和储户。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">杠杆的放大效应</strong>（示例，杠杆率20）：资产价值上升5%至1050美元→资本从50升至100（+100%）；资产价值下降5%至950美元→资本降为零（−100%）；下降超过5%则资不抵债，无法完全偿还债权人和储户。","label":"杠杆的放大效应"},{"t":"资本需要量（capital requirement）：政府管制确定的银行最低资本量，目的是确保银行无需依靠政府存款保险基金也能偿还储户存款；所需资本取决于资产类型（政府债券等安全资产要求低、贷款等风险资产要求高）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">资本需要量</strong>（capital requirement）：政府管制确定的银行最低资本量，目的是确保银行无需依靠政府存款保险基金也能偿还储户存款；所需资本取决于资产类型（政府债券等安全资产要求低、贷款等风险资产要求高）。","label":"资本需要量"},{"t":"2008—2009年金融危机的应用：抵押贷款及相关证券亏损使许多银行资本短缺→银行减少贷款（信用危机）→经济活动大幅减少；美国财政部与美联储注入几百亿美元公共资金对银行体系再资本化，使纳税人暂时成为许多银行的部分所有者，2009年底贷款恢复较正常水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">2008—2009年金融危机的应用</strong>：抵押贷款及相关证券亏损使许多银行资本短缺→银行减少贷款（信用危机）→经济活动大幅减少；美国财政部与美联储注入几百亿美元公共资金对银行体系再资本化，使纳税人暂时成为许多银行的部分所有者，2009年底贷款恢复较正常水平。","label":"2008—2009年金融危机的应用"}],"k":"b","i":1,"h":"29.3.4 银行资本、杠杆以及2008—2009年的金融危机","label":"29.3.4 银行资本、杠杆以及20…"}],"k":"sec","i":0,"h":"29.3 银行与货币供给","label":"29.3 银行与货币供给"},{"t":"29.4 美联储控制货币的工具","c":[{"t":"总览：由于银行在部分准备金制下创造货币，美联储对货币供给的控制是间接的；工具分两类——影响准备金量的工具与影响准备金率（从而货币乘数）的工具。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总览</strong>：由于银行在部分准备金制下创造货币，美联储对货币供给的控制是间接的；工具分两类——影响准备金量的工具与影响准备金率（从而货币乘数）的工具。","label":"总览：由于银行在部分准备金制下创造货…"},{"t":"29.4.1 美联储如何影响准备金量","c":[{"t":"公开市场操作（open-market operations）：美联储买卖美国政府债券。","c":[{"t":"买进债券增加货币供给：支付的新美元一部分被作为通货持有（每1美元正好增加1美元货币供给），一部分存入银行（增加准备金，使银行体系创造出多于1美元的货币）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">买进债券增加货币供给</strong>：支付的新美元一部分被作为通货持有（每1美元正好增加1美元货币供给），一部分存入银行（增加准备金，使银行体系创造出多于1美元的货币）。","label":"买进债券增加货币供给"},{"t":"卖出债券减少货币供给：公众用通货和银行存款购买债券，直接减少流通中货币量；银行准备金随之减少、贷款收缩，货币创造反向进行。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">卖出债券减少货币供给</strong>：公众用通货和银行存款购买债券，直接减少流通中货币量；银行准备金随之减少、贷款收缩，货币创造反向进行。","label":"卖出债券减少货币供给"},{"t":"公开市场操作容易进行、可随时调节，是美联储最常用的货币政策工具。","c":[],"k":"b","i":3,"h":"公开市场操作容易进行、可随时调节，是美联储最常用的货币政策工具。","label":"公开市场操作容易进行、可随时调节，是…"}],"k":"b","i":2,"h":"<strong class=\"lead\">公开市场操作</strong>（open-market operations）：美联储买卖美国政府债券。","label":"公开市场操作"},{"t":"美联储向银行发放贷款：","c":[{"t":"贴现窗口与贴现率（discount rate）：银行传统上从美联储的贴现窗口借款并支付贴现率；美联储放贷增加银行体系准备金从而创造更多货币。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">贴现窗口与贴现率</strong>（discount rate）：银行传统上从美联储的贴现窗口借款并支付贴现率；美联储放贷增加银行体系准备金从而创造更多货币。","label":"贴现窗口与贴现率"},{"t":"贴现率的高低改变货币供给：高贴现率抑制借款、减少准备金与货币供给；低贴现率相反。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">贴现率的高低改变货币供给</strong>：高贴现率抑制借款、减少准备金与货币供给；低贴现率相反。","label":"贴现率的高低改变货币供给"},{"t":"其他机制：如2007—2010年的短期拍卖工具（美联储确定借款数量、合乎资格银行竞争性拍卖出价）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">其他机制</strong>：如2007—2010年的短期拍卖工具（美联储确定借款数量、合乎资格银行竞争性拍卖出价）。","label":"其他机制"},{"t":"最后贷款人角色：1987年股灾次日格林斯潘宣布美联储\"随时可以成为支持经济与金融体系的流动性资金来源\"；2008—2009年美联储向困境中的金融机构提供数十亿美元贷款以防风险扩散。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">最后贷款人角色</strong>：1987年股灾次日格林斯潘宣布美联储&quot;随时可以成为支持经济与金融体系的流动性资金来源&quot;；2008—2009年美联储向困境中的金融机构提供数十亿美元贷款以防风险扩散。","label":"最后贷款人角色"}],"k":"b","i":2,"h":"<strong class=\"lead\">美联储向银行发放贷款</strong>：","label":"美联储向银行发放贷款"}],"k":"b","i":1,"h":"29.4.1 美联储如何影响准备金量","label":"29.4.1 美联储如何影响准备金量"},{"t":"29.4.2 美联储如何影响准备金率","c":[{"t":"法定准备金（reserve requirements）：关于银行必须根据其存款持有的最低准备金量的规定。","c":[{"t":"提高法定准备金→准备金率上升→货币乘数下降→货币供给减少；降低则相反。","c":[],"k":"b","i":3,"h":"提高法定准备金→准备金率上升→货币乘数下降→货币供给减少；降低则相反。","label":"提高法定准备金→准备金率上升→货币乘…"},{"t":"很少使用，因为会干扰银行经营（存款未变而准备金不足，被迫收缩贷款）；且在银行普遍持有超额准备金时效果变弱。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">很少使用，因为会干扰银行经营</strong>（存款未变而准备金不足，被迫收缩贷款）；且在银行普遍持有超额准备金时效果变弱。","label":"很少使用，因为会干扰银行经营"}],"k":"b","i":2,"h":"<strong class=\"lead\">法定准备金</strong>（reserve requirements）：关于银行必须根据其存款持有的最低准备金量的规定。","label":"法定准备金"},{"t":"支付准备金利息：2008年10月起美联储为银行存在美联储的准备金支付利息。","c":[{"t":"准备金利率越高，银行选择持有的准备金越多→准备金率上升、货币乘数下降、货币供给减少。","c":[],"k":"b","i":3,"h":"准备金利率越高，银行选择持有的准备金越多→准备金率上升、货币乘数下降、货币供给减少。","label":"准备金利率越高，银行选择持有的准备金…"},{"t":"因实施时间不长，这一新工具在货币政策中的重要程度尚不明显。","c":[],"k":"b","i":3,"h":"因实施时间不长，这一新工具在货币政策中的重要程度尚不明显。","label":"因实施时间不长，这一新工具在货币政策…"}],"k":"b","i":2,"h":"<strong class=\"lead\">支付准备金利息</strong>：2008年10月起美联储为银行存在美联储的准备金支付利息。","label":"支付准备金利息"}],"k":"b","i":1,"h":"29.4.2 美联储如何影响准备金率","label":"29.4.2 美联储如何影响准备金率"},{"t":"29.4.3 控制货币供给中的问题","c":[{"t":"美联储对货币供给的控制并不精确，两个问题都源于部分准备金银行制度。","c":[],"k":"b","i":2,"h":"美联储对货币供给的控制并不精确，两个问题都源于部分准备金银行制度。","label":"美联储对货币供给的控制并不精确，两个…"},{"t":"问题一：美联储不能控制家庭选择以银行存款方式持有的货币量——存款越多银行准备金越多、货币创造越多；若人们失去信心提款持现，即使美联储不采取任何行动货币供给也减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题一</strong>：美联储不能控制家庭选择以银行存款方式持有的货币量——存款越多银行准备金越多、货币创造越多；若人们失去信心提款持现，即使美联储不采取任何行动货币供给也减少。","label":"问题一：美联储不能控制家庭选择以银行…"},{"t":"问题二：美联储不能控制银行选择的贷款量——银行可以选择持有超额准备金而少放贷，货币创造随之减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题二</strong>：美联储不能控制银行选择的贷款量——银行可以选择持有超额准备金而少放贷，货币创造随之减少。","label":"问题二：美联储不能控制银行选择的贷款…"},{"t":"缓解：美联储每周收集银行存款与准备金数据，能较快掌握储户和银行家行为的变动并做出反应，使货币供给接近所选水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">缓解</strong>：美联储每周收集银行存款与准备金数据，能较快掌握储户和银行家行为的变动并做出反应，使货币供给接近所选水平。","label":"缓解：美联储每周收集银行存款与准备金…"}],"k":"b","i":1,"h":"29.4.3 控制货币供给中的问题","label":"29.4.3 控制货币供给中的问题"},{"t":"案例研究要点（银行挤兑和货币供给）：","c":[{"t":"银行挤兑：储户怀疑银行要破产而\"挤\"到柜台提款；部分准备金制下银行现金不足以满足所有提款，即使有偿付能力也被迫关门，直到贷款收回或最后贷款人提供通货（英国北岩银行2007年遭挤兑后被政府接管）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">银行挤兑</strong>：储户怀疑银行要破产而&quot;挤&quot;到柜台提款；部分准备金制下银行现金不足以满足所有提款，即使有偿付能力也被迫关门，直到贷款收回或最后贷款人提供通货（英国北岩银行2007年遭挤兑后被政府接管）。","label":"银行挤兑"},{"t":"大萧条的教训：挤兑与银行关闭后，家庭改持通货、银行家提高准备金率，货币创造反向进行且乘数下降；1929—1933年美联储未有意紧缩，货币供给仍减少28%——许多经济学家以此解释当时的高失业与物价下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">大萧条的教训</strong>：挤兑与银行关闭后，家庭改持通货、银行家提高准备金率，货币创造反向进行且乘数下降；1929—1933年美联储未有意紧缩，货币供给仍减少28%——许多经济学家以此解释当时的高失业与物价下降。","label":"大萧条的教训"},{"t":"现在：联邦存款保险公司（FDIC）保证大多数银行存款安全，储户无须挤兑，银行挤兑已不是美国的主要问题；代价是受保存款的银行家放贷时失去规避坏账风险的激励，但换来了更稳定的银行体系。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现在</strong>：联邦存款保险公司（FDIC）保证大多数银行存款安全，储户无须挤兑，银行挤兑已不是美国的主要问题；代价是受保存款的银行家放贷时失去规避坏账风险的激励，但换来了更稳定的银行体系。","label":"现在：联邦存款保险公司（FDIC）保…"}],"k":"b","i":1,"h":"<strong class=\"lead\">案例研究要点</strong>（银行挤兑和货币供给）：","label":"案例研究要点"},{"t":"新闻摘录要点（哲基尔岛之行）：从汉密尔顿的美国第一银行（被杰斐逊终结、引发恶性通胀）、第二银行（被杰克逊取缔）、19世纪无最后贷款人的频繁恐慌，到1907年恐慌后1910年Aldrich与银行家们在哲基尔岛秘密起草草案、1913年威尔逊签署《联邦储备法》——美联储诞生于美国人对中央银行的长期不信任与金融危机的反复教训。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">新闻摘录要点</strong>（哲基尔岛之行）：从汉密尔顿的美国第一银行（被杰斐逊终结、引发恶性通胀）、第二银行（被杰克逊取缔）、19世纪无最后贷款人的频繁恐慌，到1907年恐慌后1910年Aldrich与银行家们在哲基尔岛秘密起草草案、1913年威尔逊签署《联邦储备法》——美联储诞生于美国人对中央银行的长期不信任与金融危机的反复教训。","label":"新闻摘录要点"},{"t":"29.4.4 联邦基金利率","c":[{"t":"联邦基金利率（federal funds rate）：银行向另一家银行进行隔夜贷款时的利率（准备金不足的银行向有超额准备金的银行借入，通常只有一夜）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">联邦基金利率</strong>（federal funds rate）：银行向另一家银行进行隔夜贷款时的利率（准备金不足的银行向有超额准备金的银行借入，通常只有一夜）。","label":"联邦基金利率"},{"t":"与贴现率的区别：贴现率是银行从美联储的贴现窗口直接借款的利率；从其他银行借准备金是从美联储借的替代方法，哪种便宜用哪种，两种利率变动密切相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与贴现率的区别</strong>：贴现率是银行从美联储的贴现窗口直接借款的利率；从其他银行借准备金是从美联储借的替代方法，哪种便宜用哪种，两种利率变动密切相关。","label":"与贴现率的区别"},{"t":"影响广泛：只有银行能直接参与联邦基金市场，但金融体系各部分高度相关，联邦基金利率变动时其他利率往往同方向变动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">影响广泛</strong>：只有银行能直接参与联邦基金市场，但金融体系各部分高度相关，联邦基金利率变动时其他利率往往同方向变动。","label":"影响广泛"},{"t":"目标与操作：FOMC每6周决定联邦基金利率目标的升降；美联储用公开市场操作影响它——买债券注入准备金，借准备金的需求减少、联邦基金利率下降；卖债券则上升。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">目标与操作</strong>：FOMC每6周决定联邦基金利率目标的升降；美联储用公开市场操作影响它——买债券注入准备金，借准备金的需求减少、联邦基金利率下降；卖债券则上升。","label":"目标与操作"},{"t":"与货币供给的关系：利率目标与货币供给是同一枚硬币的两面——联邦基金利率目标下降意味着货币供给扩张，目标上升意味着紧缩。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与货币供给的关系</strong>：利率目标与货币供给是同一枚硬币的两面——联邦基金利率目标下降意味着货币供给扩张，目标上升意味着紧缩。","label":"与货币供给的关系"}],"k":"b","i":1,"h":"29.4.4 联邦基金利率","label":"29.4.4 联邦基金利率"}],"k":"sec","i":0,"h":"29.4 美联储控制货币的工具","label":"29.4 美联储控制货币的工具"},{"t":"29.5 结论","c":[{"t":"货币制度是我们买任何东西、卖任何东西都依赖的极为有用的社会习惯。","c":[],"k":"b","i":1,"h":"货币制度是我们买任何东西、卖任何东西都依赖的极为有用的社会习惯。","label":"货币制度是我们买任何东西、卖任何东西…"},{"t":"现在已经知道什么是货币以及什么因素决定货币供给，下一章开始讨论货币量变动如何影响经济。","c":[],"k":"b","i":1,"h":"现在已经知道什么是货币以及什么因素决定货币供给，下一章开始讨论货币量变动如何影响经济。","label":"现在已经知道什么是货币以及什么因素决…"}],"k":"sec","i":0,"h":"29.5 结论","label":"29.5 结论"}],"k":"chap","h":"第29章 货币制度","label":"第29章 货币制度"},{"t":"第30章 货币增长与通货膨胀","c":[{"t":"本章内容提要","c":[{"t":"通货膨胀是物价总水平的上升，通货紧缩是物价总水平的下降；过去80年间美国物价平均每年上升约3.6%、累计上升17倍，而19世纪较长时期美国大多数物价在下降（1896年物价水平比1880年低23%）。","c":[],"k":"b","i":1,"h":"通货膨胀是物价总水平的上升，通货紧缩是物价总水平的下降；过去80年间美国物价平均每年上升约3.6%、累计上升17倍，而19世纪较长时期美国大多数物价在下降（1896年物价水平比1880年低23%）。","label":"通货膨胀是物价总水平的上升，通货紧缩…"},{"t":"通货膨胀更多地与货币价值有关，而不是与物品价值有关：物价水平P上升就是货币价值1/P下降；货币价值由货币供给与货币需求决定，长期中物价水平调整到使货币需求等于货币供给。","c":[],"k":"b","i":1,"h":"通货膨胀更多地与货币价值有关，而不是与物品价值有关：物价水平P上升就是货币价值1/P下降；货币价值由货币供给与货币需求决定，长期中物价水平调整到使货币需求等于货币供给。","label":"通货膨胀更多地与货币价值有关，而不是…"},{"t":"货币数量论认为，经济中可得到的货币量决定物价水平，货币量的增长率决定通货膨胀率——\"通货膨胀永远而且处处是一种货币现象\"（弗里德曼）。","c":[],"k":"b","i":1,"h":"货币数量论认为，经济中可得到的货币量决定物价水平，货币量的增长率决定通货膨胀率——&quot;通货膨胀永远而且处处是一种货币现象&quot;（弗里德曼）。","label":"货币数量论认为，经济中可得到的货币量…"},{"t":"数量方程式M×V=P×Y：由于货币流通速度较为稳定、产量由要素供给与技术决定，中央银行迅速增加货币供给的结果就是高通货膨胀率。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">数量方程式M×V=P×Y</strong>：由于货币流通速度较为稳定、产量由要素供给与技术决定，中央银行迅速增加货币供给的结果就是高通货膨胀率。","label":"数量方程式M×V=P×Y"},{"t":"古典二分法把变量分为名义变量与真实变量；货币中性认为货币供给变动只影响名义变量而不影响真实变量——该原理近似描述长期，短期不成立。","c":[],"k":"b","i":1,"h":"古典二分法把变量分为名义变量与真实变量；货币中性认为货币供给变动只影响名义变量而不影响真实变量——该原理近似描述长期，短期不成立。","label":"古典二分法把变量分为名义变量与真实变…"},{"t":"政府通过印发货币筹资相当于征收通货膨胀税，这是几乎所有超速通货膨胀的共同根源；费雪效应指名义利率对通货膨胀率进行一对一的调整。","c":[],"k":"b","i":1,"h":"政府通过印发货币筹资相当于征收通货膨胀税，这是几乎所有超速通货膨胀的共同根源；费雪效应指名义利率对通货膨胀率进行一对一的调整。","label":"政府通过印发货币筹资相当于征收通货膨…"},{"t":"\"通胀降低购买力\"是通货膨胀谬误——名义收入与物价同步上涨，通胀本身并不降低实际购买力；通胀真正的成本有六项：皮鞋成本、菜单成本、相对价格变动与资源配置不当、税收扭曲、混乱与不方便、任意的财富再分配。","c":[],"k":"b","i":1,"h":"&quot;通胀降低购买力&quot;是通货膨胀谬误——名义收入与物价同步上涨，通胀本身并不降低实际购买力；通胀真正的成本有六项：皮鞋成本、菜单成本、相对价格变动与资源配置不当、税收扭曲、混乱与不方便、任意的财富再分配。","label":"\"通胀降低购买力\"是通货膨胀谬误——…"},{"t":"通货膨胀是糟糕的，但通货紧缩可能更糟：通货紧缩使财富从债务人再分配给债权人，且往往是更深层宏观经济困境的症状。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">通货膨胀是糟糕的，但通货紧缩可能更糟</strong>：通货紧缩使财富从债务人再分配给债权人，且往往是更深层宏观经济困境的症状。","label":"通货膨胀是糟糕的，但通货紧缩可能更糟"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"30.1 古典通货膨胀理论","c":[{"t":"引论","c":[{"t":"该理论由最早的经济思想家（18世纪大卫·休谟）提出、近代由米尔顿·弗里德曼倡导，用于说明物价水平和通货膨胀率的长期决定因素，既可解释温和通胀也可解释超速通胀。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">该理论由最早的经济思想家</strong>（18世纪大卫·休谟）提出、近代由米尔顿·弗里德曼倡导，用于说明物价水平和通货膨胀率的长期决定因素，既可解释温和通胀也可解释超速通胀。","label":"该理论由最早的经济思想家"}],"k":"b","i":1,"h":"引论","label":"引论"},{"t":"30.1.1 物价水平与货币价值","c":[{"t":"冰淇淋蛋卷从5美分涨到1美元，更可能不是人们更爱吃冰淇淋，而是货币价值下降了——通胀首先并最重要的是关于经济中交换媒介的价值。","c":[],"k":"b","i":2,"h":"冰淇淋蛋卷从5美分涨到1美元，更可能不是人们更爱吃冰淇淋，而是货币价值下降了——通胀首先并最重要的是关于经济中交换媒介的价值。","label":"冰淇淋蛋卷从5美分涨到1美元，更可能…"},{"t":"物价水平可从两方面看：一方面是一篮子物品与服务的价格；另一方面是货币价值的衡量指标——物价水平上升意味着货币价值下降，每1美元能购买的物品与服务变少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">物价水平可从两方面看</strong>：一方面是一篮子物品与服务的价格；另一方面是货币价值的衡量指标——物价水平上升意味着货币价值下降，每1美元能购买的物品与服务变少。","label":"物价水平可从两方面看"},{"t":"数学表述：若P是物价水平（CPI或GDP平减指数），则1/P就是用物品与服务衡量的货币价值；冰淇淋价格P从2美元涨到3美元时，1美元的价值从1/2个冰淇淋降到1/3个。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数学表述</strong>：若P是物价水平（CPI或GDP平减指数），则1/P就是用物品与服务衡量的货币价值；冰淇淋价格P从2美元涨到3美元时，1美元的价值从1/2个冰淇淋降到1/3个。","label":"数学表述"}],"k":"b","i":1,"h":"30.1.1 物价水平与货币价值","label":"30.1.1 物价水平与货币价值"},{"t":"30.1.2 货币供给、货币需求与货币均衡","c":[{"t":"货币价值与香蕉价格一样由供给与需求决定：货币的供给与需求决定了货币的价值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币价值与香蕉价格一样由供给与需求决定</strong>：货币的供给与需求决定了货币的价值。","label":"货币价值与香蕉价格一样由供给与需求决定"},{"t":"货币供给：由美联储与银行体系决定（公开市场操作、货币乘数），本章简单地把货币供给量当作由美联储控制的政策变量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币供给</strong>：由美联储与银行体系决定（公开市场操作、货币乘数），本章简单地把货币供给量当作由美联储控制的政策变量。","label":"货币供给"},{"t":"货币需求：反映人们想以流动性形式持有的财富量；虽受信用卡依赖程度、ATM可及性、债券利率等影响，但最重要的变量是平均物价水平——物价越高，正常交易所需货币越多，物价水平上升（货币价值下降）增加货币需求量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币需求</strong>：反映人们想以流动性形式持有的财富量；虽受信用卡依赖程度、ATM可及性、债券利率等影响，但最重要的变量是平均物价水平——物价越高，正常交易所需货币越多，物价水平上升（货币价值下降）增加货币需求量。","label":"货币需求"},{"t":"长期均衡：物价总水平调整到使货币需求等于货币供给；物价水平高于均衡则人们想持有的货币多于美联储创造的货币、物价必降；低于均衡则物价必升。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长期均衡</strong>：物价总水平调整到使货币需求等于货币供给；物价水平高于均衡则人们想持有的货币多于美联储创造的货币、物价必降；低于均衡则物价必升。","label":"长期均衡"},{"t":"图30-1结论：货币供给曲线垂直（美联储固定货币量），货币需求曲线向右下方倾斜（每1美元买的东西少时人们想持有更多货币）；均衡点上货币价值1/P与物价水平P同时被决定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图30-1结论</strong>：货币供给曲线垂直（美联储固定货币量），货币需求曲线向右下方倾斜（每1美元买的东西少时人们想持有更多货币）；均衡点上货币价值1/P与物价水平P同时被决定。","label":"图30-1结论"}],"k":"b","i":1,"h":"30.1.2 货币供给、货币需求与货币均衡","label":"30.1.2 货币供给、货币需求与货…"},{"t":"30.1.3 货币注入的影响","c":[{"t":"美联储使货币供给翻一番（书中设想直升机撒钱，现实中为公开市场买进债券）→货币供给曲线右移→均衡货币价值下降、物价水平上升（书中示例：货币价值由1/2降到1/4，物价水平由2升到4）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">美联储使货币供给翻一番</strong>（书中设想直升机撒钱，现实中为公开市场买进债券）→货币供给曲线右移→均衡货币价值下降、物价水平上升（书中示例：货币价值由1/2降到1/4，物价水平由2升到4）。","label":"美联储使货币供给翻一番"},{"t":"货币数量论（quantity theory of money）：一种认为可得到的货币量决定物价水平、可得到的货币量的增长率决定通货膨胀率的理论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币数量论</strong>（quantity theory of money）：一种认为可得到的货币量决定物价水平、可得到的货币量的增长率决定通货膨胀率的理论。","label":"货币数量论"},{"t":"弗里德曼名言：\"通货膨胀永远而且处处是一种货币现象。\"","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">弗里德曼名言</strong>：&quot;通货膨胀永远而且处处是一种货币现象。&quot;","label":"弗里德曼名言"}],"k":"b","i":1,"h":"30.1.3 货币注入的影响","label":"30.1.3 货币注入的影响"},{"t":"30.1.4 调整过程简述","c":[{"t":"调整链条：货币注入→现行物价下出现超额货币供给→人们以购买物品与服务或放贷（买债券、存款）的方式花掉超额货币→物品与服务需求增加→经济的生产能力未变（产量由劳动、物质资本、人力资本、自然资源和技术知识决定，货币注入不改变其中任何一项）→价格上升→物价上升又增加货币需求量→最终在货币需求量重新等于货币供给量处达到新均衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">调整链条</strong>：货币注入→现行物价下出现超额货币供给→人们以购买物品与服务或放贷（买债券、存款）的方式花掉超额货币→物品与服务需求增加→经济的生产能力未变（产量由劳动、物质资本、人力资本、自然资源和技术知识决定，货币注入不改变其中任何一项）→价格上升→物价上升又增加货币需求量→最终在货币需求量重新等于货币供给量处达到新均衡。","label":"调整链条"}],"k":"b","i":1,"h":"30.1.4 调整过程简述","label":"30.1.4 调整过程简述"},{"t":"30.1.5 古典二分法和货币中性","c":[{"t":"名义变量（nominal variables）：按货币单位衡量的变量，如种玉米农民的美元收入、名义GDP。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">名义变量</strong>（nominal variables）：按货币单位衡量的变量，如种玉米农民的美元收入、名义GDP。","label":"名义变量"},{"t":"真实变量（real variables）：按实物单位衡量的变量，如玉米产量（蒲式耳）、真实GDP。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">真实变量</strong>（real variables）：按实物单位衡量的变量，如玉米产量（蒲式耳）、真实GDP。","label":"真实变量"},{"t":"古典二分法（classical dichotomy）：对名义变量和真实变量的理论区分（\"二分法\"指分为两类，\"古典\"指早期经济思想家）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">古典二分法</strong>（classical dichotomy）：对名义变量和真实变量的理论区分（&quot;二分法&quot;指分为两类，&quot;古典&quot;指早期经济思想家）。","label":"古典二分法"},{"t":"价格上的应用：美元价格（玉米每蒲式耳2美元）是名义变量；相对价格（1蒲式耳玉米兑2蒲式耳小麦）不再用货币衡量，是真实变量；真实工资与真实利率也是真实变量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">价格上的应用</strong>：美元价格（玉米每蒲式耳2美元）是名义变量；相对价格（1蒲式耳玉米兑2蒲式耳小麦）不再用货币衡量，是真实变量；真实工资与真实利率也是真实变量。","label":"价格上的应用"},{"t":"区分的意义：根据古典分析，名义变量受经济中货币制度发展的影响，而真实变量与货币基本上无关——前几章关于真实GDP、储蓄、投资、真实利率、失业的结论均与货币供给量无关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">区分的意义</strong>：根据古典分析，名义变量受经济中货币制度发展的影响，而真实变量与货币基本上无关——前几章关于真实GDP、储蓄、投资、真实利率、失业的结论均与货币供给量无关。","label":"区分的意义"},{"t":"货币中性（monetary neutrality）：认为货币供给变动并不影响真实变量的观点；货币供给翻一番→物价水平、美元工资及一切美元价值翻一番，而生产、就业、真实工资、真实利率都不变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币中性</strong>（monetary neutrality）：认为货币供给变动并不影响真实变量的观点；货币供给翻一番→物价水平、美元工资及一切美元价值翻一番，而生产、就业、真实工资、真实利率都不变。","label":"货币中性"},{"t":"计价单位类比：政府把1码从36英寸改为18英寸，所有可衡量的距离（名义变量）翻番而实际距离（真实变量）不变——美元也仅是衡量单位，其价值变动没有实际影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">计价单位类比</strong>：政府把1码从36英寸改为18英寸，所有可衡量的距离（名义变量）翻番而实际距离（真实变量）不变——美元也仅是衡量单位，其价值变动没有实际影响。","label":"计价单位类比"},{"t":"适用范围：货币中性不完全符合现实；短期（一两年内）货币变动对真实变量有影响（休谟本人也怀疑其短期适用性），长期（如十年）货币变动对名义变量有重要影响、对真实变量（如真实GDP）的影响微不足道——研究长期变动时货币中性是很好的描述。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">适用范围</strong>：货币中性不完全符合现实；短期（一两年内）货币变动对真实变量有影响（休谟本人也怀疑其短期适用性），长期（如十年）货币变动对名义变量有重要影响、对真实变量（如真实GDP）的影响微不足道——研究长期变动时货币中性是很好的描述。","label":"适用范围"}],"k":"b","i":1,"h":"30.1.5 古典二分法和货币中性","label":"30.1.5 古典二分法和货币中性"},{"t":"30.1.6 货币流通速度与货币数量方程式","c":[{"t":"货币流通速度（velocity of money）：在经济中普通的1美元在不同人手中流动的速度，即货币易手的速度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币流通速度</strong>（velocity of money）：在经济中普通的1美元在不同人手中流动的速度，即货币易手的速度。","label":"货币流通速度"},{"t":"计算：V=(P×Y)/M（名义GDP除以货币量；P为GDP平减指数，Y为真实GDP，M为货币量）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">计算</strong>：V=(P×Y)/M（名义GDP除以货币量；P为GDP平减指数，Y为真实GDP，M为货币量）。","label":"计算：V=(P×Y)/M（名义GDP…"},{"t":"比萨饼经济示例：一年生产100个比萨饼、每个10美元、货币量50美元→V=(10×100)/50=20，每1美元每年平均易手20次。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">比萨饼经济示例</strong>：一年生产100个比萨饼、每个10美元、货币量50美元→V=(10×100)/50=20，每1美元每年平均易手20次。","label":"比萨饼经济示例"},{"t":"数量方程式（quantity equation）：M×V=P×Y，把货币量、货币流通速度和经济中物品与服务产出的美元价值联系在一起；货币量M的增加必然反映在其他三个变量之一上——物价水平上升、产量上升或货币流通速度下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数量方程式</strong>（quantity equation）：M×V=P×Y，把货币量、货币流通速度和经济中物品与服务产出的美元价值联系在一起；货币量M的增加必然反映在其他三个变量之一上——物价水平上升、产量上升或货币流通速度下降。","label":"数量方程式"},{"t":"经验事实：1960年以来美国名义GDP与货币量（M2）都增长约30倍，货币流通速度相对稳定（并非完全不变），故\"流通速度不变\"的假设相当接近现实。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经验事实</strong>：1960年以来美国名义GDP与货币量（M2）都增长约30倍，货币流通速度相对稳定（并非完全不变），故&quot;流通速度不变&quot;的假设相当接近现实。","label":"经验事实"},{"t":"货币数量论的本质五步骤：(1)货币流通速度一直较为稳定；(2)流通速度稳定时，中央银行改变货币量M就引起名义产出价值P×Y同比例变动；(3)产量Y主要由要素供给（劳动、物质资本、人力资本、自然资源）及生产技术决定，货币是中性的、不影响产量；(4)产量Y既定时，货币供给变动引起的名义产出价值变动将反映在物价水平P的变动上；(5)因此中央银行迅速增加货币供给的结果就是高通货膨胀率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币数量论的本质五步骤</strong>：(1)货币流通速度一直较为稳定；(2)流通速度稳定时，中央银行改变货币量M就引起名义产出价值P×Y同比例变动；(3)产量Y主要由要素供给（劳动、物质资本、人力资本、自然资源）及生产技术决定，货币是中性的、不影响产量；(4)产量Y既定时，货币供给变动引起的名义产出价值变动将反映在物价水平P的变动上；(5)因此中央银行迅速增加货币供给的结果就是高通货膨胀率。","label":"货币数量论的本质五步骤"},{"t":"案例研究「四次超速通货膨胀期间的货币与物价」要点：超速通货膨胀一般定义为每月通货膨胀率在50%以上（一年内物价上升100倍以上）；20世纪20年代奥地利、匈牙利、德国、波兰四次经典超速通胀中，货币量与物价水平几乎同步变动——货币量增长起初温和时通胀温和，货币量增长加快时通胀几乎同时加剧，货币量稳定时物价水平也稳定；地震之于地震学犹如超速通胀之于货币经济学，是检验理论的自然实验，数据与\"政府发行过多货币时物价上升\"一致。","c":[],"k":"b","i":2,"h":"案例研究「四次超速通货膨胀期间的货币与物价」要点：超速通货膨胀一般定义为每月通货膨胀率在50%以上（一年内物价上升100倍以上）；20世纪20年代奥地利、匈牙利、德国、波兰四次经典超速通胀中，货币量与物价水平几乎同步变动——货币量增长起初温和时通胀温和，货币量增长加快时通胀几乎同时加剧，货币量稳定时物价水平也稳定；地震之于地震学犹如超速通胀之于货币经济学，是检验理论的自然实验，数据与&quot;政府发行过多货币时物价上升&quot;一致。","label":"案例研究「四次超速通货膨胀期间的货币与物价」要点"}],"k":"b","i":1,"h":"30.1.6 货币流通速度与货币数量方程式","label":"30.1.6 货币流通速度与货币数量…"},{"t":"30.1.7 通货膨胀税","c":[{"t":"通货膨胀税（inflation tax）：政府通过创造货币而筹集的收入；没有人收到税单，它是隐蔽的——政府印发货币→物价水平上升→钱包里的货币不值钱，就像向每个持有货币的人征收的税。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">通货膨胀税</strong>（inflation tax）：政府通过创造货币而筹集的收入；没有人收到税单，它是隐蔽的——政府印发货币→物价水平上升→钱包里的货币不值钱，就像向每个持有货币的人征收的税。","label":"通货膨胀税"},{"t":"背景：政府修公路、发军饷、做转移支付须先筹资，通常靠税收或发债借款，但也可以简单地印发货币。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：政府修公路、发军饷、做转移支付须先筹资，通常靠税收或发债借款，但也可以简单地印发货币。","label":"背景：政府修公路、发军饷、做转移支付…"},{"t":"规模：近年来通胀税占美国收入不到3%；18世纪70年代新生的美国国会主要靠印发大陆美元为军事支出筹资，几年间按大陆美元衡量的物价上涨一百多倍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规模</strong>：近年来通胀税占美国收入不到3%；18世纪70年代新生的美国国会主要靠印发大陆美元为军事支出筹资，几年间按大陆美元衡量的物价上涨一百多倍。","label":"规模：近年来通胀税占美国收入不到3%…"},{"t":"超速通胀的共同模式：政府高额支出+税收不足+借款能力有限→印发钞票→货币大量增加→高通货膨胀；当政府实行消除通胀税所需的财政改革（如削减政府支出）时，通货膨胀就结束了。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">超速通胀的共同模式</strong>：政府高额支出+税收不足+借款能力有限→印发钞票→货币大量增加→高通货膨胀；当政府实行消除通胀税所需的财政改革（如削减政府支出）时，通货膨胀就结束了。","label":"超速通胀的共同模式"},{"t":"参考资料「津巴布韦的超速通货膨胀」要点：21世纪第一个十年津巴布韦经历历史上最严重的超速通胀（2008年2月央行宣布通胀率达24000%，独立估算更高）；2008年1月发行面值1000万津巴布韦元纸币（约4美元），一年后宣布发行100亿面值纸币（约只值3美元）；2009年4月停止印制津巴布韦元、改用美元和南非兰特等外国通货后，超速通胀才结束。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「津巴布韦的超速通货膨胀」要点</strong>：21世纪第一个十年津巴布韦经历历史上最严重的超速通胀（2008年2月央行宣布通胀率达24000%，独立估算更高）；2008年1月发行面值1000万津巴布韦元纸币（约4美元），一年后宣布发行100亿面值纸币（约只值3美元）；2009年4月停止印制津巴布韦元、改用美元和南非兰特等外国通货后，超速通胀才结束。","label":"参考资料「津巴布韦的超速通货膨胀」要点"}],"k":"b","i":1,"h":"30.1.7 通货膨胀税","label":"30.1.7 通货膨胀税"},{"t":"30.1.8 费雪效应","c":[{"t":"利率关系式：真实利率＝名义利率－通货膨胀率；等价地，名义利率＝真实利率＋通货膨胀率（示例：名义利率7%、通胀率3%→存款真实价值每年提升4%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利率关系式</strong>：真实利率＝名义利率－通货膨胀率；等价地，名义利率＝真实利率＋通货膨胀率（示例：名义利率7%、通胀率3%→存款真实价值每年提升4%）。","label":"利率关系式"},{"t":"决定力量各不相同：可贷资金的供求决定真实利率；货币供给的增长决定通货膨胀率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">决定力量各不相同</strong>：可贷资金的供求决定真实利率；货币供给的增长决定通货膨胀率。","label":"决定力量各不相同"},{"t":"推导：货币长期中性→货币增长变动不影响真实利率（真实变量）→名义利率必然根据通货膨胀的变动进行一对一的调整→美联储提高货币增长率的长期结果是更高的通货膨胀率和更高的名义利率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推导</strong>：货币长期中性→货币增长变动不影响真实利率（真实变量）→名义利率必然根据通货膨胀的变动进行一对一的调整→美联储提高货币增长率的长期结果是更高的通货膨胀率和更高的名义利率。","label":"推导：货币长期中性→货币增长变动不影…"},{"t":"费雪效应（Fisher effect）：名义利率对通货膨胀率所进行的一对一的调整，以最早研究该问题的经济学家欧文·费雪（Irving Fisher，1867—1947）命名。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">费雪效应</strong>（Fisher effect）：名义利率对通货膨胀率所进行的一对一的调整，以最早研究该问题的经济学家欧文·费雪（Irving Fisher，1867—1947）命名。","label":"费雪效应"},{"t":"适用范围：费雪效应在长期中正确、短期不成立（通胀不可预期，名义利率在放贷时已确定）；确切地说，名义利率是根据预期的通货膨胀进行调整的，长期中预期通胀随实际通胀变动，短期则不一定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">适用范围</strong>：费雪效应在长期中正确、短期不成立（通胀不可预期，名义利率在放贷时已确定）；确切地说，名义利率是根据预期的通货膨胀进行调整的，长期中预期通胀随实际通胀变动，短期则不一定。","label":"适用范围"},{"t":"经验事实：1960年以来美国3个月期国库券名义利率与CPI通胀率密切相关——60至70年代通胀上升时名义利率上升，80年代初至90年代美联储控制住通胀后名义利率下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经验事实</strong>：1960年以来美国3个月期国库券名义利率与CPI通胀率密切相关——60至70年代通胀上升时名义利率上升，80年代初至90年代美联储控制住通胀后名义利率下降。","label":"经验事实"},{"t":"即问即答要点：政府把货币增长率从每年5%提高到每年50%→物价水平上升（更高通胀）、名义利率上升（费雪效应）；政府这样做往往是把货币创造作为支出筹资手段（通胀税）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：政府把货币增长率从每年5%提高到每年50%→物价水平上升（更高通胀）、名义利率上升（费雪效应）；政府这样做往往是把货币创造作为支出筹资手段（通胀税）。","label":"即问即答要点"}],"k":"b","i":1,"h":"30.1.8 费雪效应","label":"30.1.8 费雪效应"}],"k":"sec","i":0,"h":"30.1 古典通货膨胀理论","label":"30.1 古典通货膨胀理论"},{"t":"30.2 通货膨胀的成本","c":[{"t":"30.2.1 购买力下降了？通货膨胀谬误","c":[{"t":"直观答案\"通胀剥夺了辛苦赚来的美元的购买力、降低生活水平\"存在谬误：物价上升时，买者支付得多了，同时卖者得到的也多了；大多数人靠出卖服务赚取收入，收入上涨与物价上涨同步，通货膨胀本身并没有降低人们的实际购买力。","c":[],"k":"b","i":2,"h":"直观答案&quot;通胀剥夺了辛苦赚来的美元的购买力、降低生活水平&quot;存在谬误：物价上升时，买者支付得多了，同时卖者得到的也多了；大多数人靠出卖服务赚取收入，收入上涨与物价上涨同步，通货膨胀本身并没有降低人们的实际购买力。","label":"直观答案\"通胀剥夺了辛苦赚来的美元的…"},{"t":"谬误根源：人们没有认识到货币中性——真实收入由物质资本、人力资本、自然资源和生产技术等真实变量决定，名义收入由这些因素加物价总水平决定；若美联储把通胀率从6%降到0，工人收入增长也会从10%降到4%，收入并没有更快增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">谬误根源</strong>：人们没有认识到货币中性——真实收入由物质资本、人力资本、自然资源和生产技术等真实变量决定，名义收入由这些因素加物价总水平决定；若美联储把通胀率从6%降到0，工人收入增长也会从10%降到4%，收入并没有更快增加。","label":"谬误根源"},{"t":"既然如此通胀为何仍是问题：没有单一答案，经济学家确定了通货膨胀的几种成本，每一种都说明持续的货币供给增长实际上以某种方式对真实变量产生了影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">既然如此通胀为何仍是问题</strong>：没有单一答案，经济学家确定了通货膨胀的几种成本，每一种都说明持续的货币供给增长实际上以某种方式对真实变量产生了影响。","label":"既然如此通胀为何仍是问题"}],"k":"b","i":1,"h":"30.2.1 购买力下降了？通货膨胀谬误","label":"30.2.1 购买力下降了？通货膨胀谬误"},{"t":"30.2.2 皮鞋成本","c":[{"t":"逻辑：通胀像对货币持有者征收的税，税收本身只是转移、但避税行为造成无谓损失——人们把稀缺资源浪费在试图避免通货膨胀上（少持货币避税）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">逻辑</strong>：通胀像对货币持有者征收的税，税收本身只是转移、但避税行为造成无谓损失——人们把稀缺资源浪费在试图避免通货膨胀上（少持货币避税）。","label":"逻辑：通胀像对货币持有者征收的税，税…"},{"t":"皮鞋成本（shoeleather cost）：当通货膨胀鼓励人们减少货币持有量时所浪费的资源（字面指更常去银行使鞋磨损更快，实际指为手头留钱更少而牺牲的时间与便利，如每周取50美元而非每四周取200美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">皮鞋成本</strong>（shoeleather cost）：当通货膨胀鼓励人们减少货币持有量时所浪费的资源（字面指更常去银行使鞋磨损更快，实际指为手头留钱更少而牺牲的时间与便利，如每周取50美元而非每四周取200美元）。","label":"皮鞋成本"},{"t":"规模：温和通胀下美国的皮鞋成本很低，超速通胀国家很高——玻利维亚案例：教师Edgar Miranda领到2500万比索月薪后一刻不敢耽误，妻子冲向市场买米面、他把剩余比索立刻换成黑市美元；6个月里价格以每年38000%的速度上涨，发薪日1美元兑50万比索、几天后需90万比索；不这样做工资几天内就从相当于50美元缩水到27美元。通胀率下降后（采取更具限制性的货币政策），皮鞋成本随之消失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规模</strong>：温和通胀下美国的皮鞋成本很低，超速通胀国家很高——玻利维亚案例：教师Edgar Miranda领到2500万比索月薪后一刻不敢耽误，妻子冲向市场买米面、他把剩余比索立刻换成黑市美元；6个月里价格以每年38000%的速度上涨，发薪日1美元兑50万比索、几天后需90万比索；不这样做工资几天内就从相当于50美元缩水到27美元。通胀率下降后（采取更具限制性的货币政策），皮鞋成本随之消失。","label":"规模：温和通胀下美国的皮鞋成本很低，…"}],"k":"b","i":1,"h":"30.2.2 皮鞋成本","label":"30.2.2 皮鞋成本"},{"t":"30.2.3 菜单成本","c":[{"t":"菜单成本（menu costs）：改变价格的成本，源自餐馆印刷新菜单；包括确定新价格、印刷新价格表和目录、送达中间商和顾客、为新价格做广告，乃至应对顾客对价格变动不满的成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">菜单成本</strong>（menu costs）：改变价格的成本，源自餐馆印刷新菜单；包括确定新价格、印刷新价格表和目录、送达中间商和顾客、为新价格做广告，乃至应对顾客对价格变动不满的成本。","label":"菜单成本"},{"t":"企业不常改价：普通美国企业大约一年改变一次价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">企业不常改价</strong>：普通美国企业大约一年改变一次价格。","label":"企业不常改价"},{"t":"通胀的影响：低通胀下一年调一次价是合适的经营策略；高通胀使企业成本迅速提高，一年调一次价不现实——超速通胀期间企业必须每天甚至更频繁地变动价格，以便与其他价格保持一致。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">通胀的影响</strong>：低通胀下一年调一次价是合适的经营策略；高通胀使企业成本迅速提高，一年调一次价不现实——超速通胀期间企业必须每天甚至更频繁地变动价格，以便与其他价格保持一致。","label":"通胀的影响"}],"k":"b","i":1,"h":"30.2.3 菜单成本","label":"30.2.3 菜单成本"},{"t":"30.2.4 相对价格变动与资源配置不当","c":[{"t":"机制：小吃店每年1月印新菜单并全年保持价格不变——无通胀时其相对价格全年固定；年通胀12%时其相对价格每月自动下降1%，年初偏高、年末偏低，且通胀率越高这种变动越大；由于价格一段时期只变动一次，通胀引起的相对价格变动比没有通胀时更大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机制</strong>：小吃店每年1月印新菜单并全年保持价格不变——无通胀时其相对价格全年固定；年通胀12%时其相对价格每月自动下降1%，年初偏高、年末偏低，且通胀率越高这种变动越大；由于价格一段时期只变动一次，通胀引起的相对价格变动比没有通胀时更大。","label":"机制：小吃店每年1月印新菜单并全年保…"},{"t":"重要性：市场经济依靠相对价格配置稀缺资源——消费者比较质量与价格决定购买什么，从而决定稀缺生产要素如何配置；通货膨胀扭曲相对价格→消费者决策被扭曲→市场无法把资源配置到其最好的用途之中。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">重要性</strong>：市场经济依靠相对价格配置稀缺资源——消费者比较质量与价格决定购买什么，从而决定稀缺生产要素如何配置；通货膨胀扭曲相对价格→消费者决策被扭曲→市场无法把资源配置到其最好的用途之中。","label":"重要性：市场经济依靠相对价格配置稀缺…"}],"k":"b","i":1,"h":"30.2.4 相对价格变动与资源配置不当","label":"30.2.4 相对价格变动与资源配置不当"},{"t":"30.2.5 通货膨胀引起的税收扭曲","c":[{"t":"一般原理：几乎所有税收都扭曲激励，而法律制定者制定税法时往往没有考虑通货膨胀，故通货膨胀往往增加了储蓄的税收负担。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般原理</strong>：几乎所有税收都扭曲激励，而法律制定者制定税法时往往没有考虑通货膨胀，故通货膨胀往往增加了储蓄的税收负担。","label":"一般原理"},{"t":"资本收益按名义值征税：1988年以30美元买进IBM股票、2016年以130美元卖出，税法对100美元名义收益征税；但期间物价翻了一番，30美元本金按购买力相当于60美元，真实收益仅70美元——通胀扩大了资本收益、无形中加重了这种收入的税负。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">资本收益按名义值征税</strong>：1988年以30美元买进IBM股票、2016年以130美元卖出，税法对100美元名义收益征税；但期间物价翻了一番，30美元本金按购买力相当于60美元，真实收益仅70美元——通胀扩大了资本收益、无形中加重了这种收入的税负。","label":"资本收益按名义值征税"},{"t":"利息按名义利率征税（表30-1，两个经济都对利息收入征25%的税）：物价稳定的经济A中真实利率4%、通胀0、名义利率4%，征税使真实利率降为3%；通胀8%的经济B中由费雪效应名义利率为12%，对整个12%征税后税后名义利率9%、税后真实利率仅1%——同样是25%的税，使真实利率从4%降为1%，储蓄吸引力大减。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利息按名义利率征税</strong>（表30-1，两个经济都对利息收入征25%的税）：物价稳定的经济A中真实利率4%、通胀0、名义利率4%，征税使真实利率降为3%；通胀8%的经济B中由费雪效应名义利率为12%，对整个12%征税后税后名义利率9%、税后真实利率仅1%——同样是25%的税，使真实利率从4%降为1%，储蓄吸引力大减。","label":"利息按名义利率征税"},{"t":"后果：税后真实利率提供储蓄激励，通胀经济中储蓄吸引力小得多；储蓄为投资提供资源、投资是长期增长的关键，故通胀加重储蓄税负倾向于抑制经济长期增长率（影响大小经济学家看法不一）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">后果</strong>：税后真实利率提供储蓄激励，通胀经济中储蓄吸引力小得多；储蓄为投资提供资源、投资是长期增长的关键，故通胀加重储蓄税负倾向于抑制经济长期增长率（影响大小经济学家看法不一）。","label":"后果：税后真实利率提供储蓄激励，通胀…"},{"t":"对策：除消除通胀外，可实行税制指数化——如用物价指数调整资本收益的购买价格、只对真实收益征税，扣除补偿通胀的利息、只对真实利息征税；现实中所得税税率所依据的收入水平已按CPI自动调整，但资本收益和利息收入的税收处理尚未指数化，而更完善的指数化会使本已复杂的税法更复杂。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对策</strong>：除消除通胀外，可实行税制指数化——如用物价指数调整资本收益的购买价格、只对真实收益征税，扣除补偿通胀的利息、只对真实利息征税；现实中所得税税率所依据的收入水平已按CPI自动调整，但资本收益和利息收入的税收处理尚未指数化，而更完善的指数化会使本已复杂的税法更复杂。","label":"对策：除消除通胀外，可实行税制指数化…"}],"k":"b","i":1,"h":"30.2.5 通货膨胀引起的税收扭曲","label":"30.2.5 通货膨胀引起的税收扭曲"},{"t":"30.2.6 混乱与不方便","c":[{"t":"类比：民意调查问\"明年1码应该多长\"，人们会答仍是36英寸——任何使生活复杂化的事情都是不必要的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">类比</strong>：民意调查问&quot;明年1码应该多长&quot;，人们会答仍是36英寸——任何使生活复杂化的事情都是不必要的。","label":"类比：民意调查问\"明年1码应该多长\"…"},{"t":"机制：货币是计价单位，是用来表示价格和记录债务、衡量经济交易的尺度；美联储的工作有点像标准局——确保常用衡量单位的可靠性；通胀侵蚀了计价单位的真实价值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机制</strong>：货币是计价单位，是用来表示价格和记录债务、衡量经济交易的尺度；美联储的工作有点像标准局——确保常用衡量单位的可靠性；通胀侵蚀了计
