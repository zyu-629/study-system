的数据","c":[{"t":"第23章 一国收入的衡量","c":[{"t":"本章内容提要","c":[{"t":"由于每一次交易都有买者与卖者，所以经济中的总支出必定等于经济中的总收入。","c":[],"k":"b","i":1,"h":"由于每一次交易都有买者与卖者，所以经济中的总支出必定等于经济中的总收入。","label":"由于每一次交易都有买者与卖者，所以经…"},{"t":"国内生产总值（GDP）衡量经济用于新生产的物品与服务的总支出，以及生产这些物品与服务所赚到的总收入；更确切地说，GDP是在某一既定时期一个国家内生产的所有最终物品与服务的市场价值。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">国内生产总值</strong>（GDP）衡量经济用于新生产的物品与服务的总支出，以及生产这些物品与服务所赚到的总收入；更确切地说，GDP是在某一既定时期一个国家内生产的所有最终物品与服务的市场价值。","label":"国内生产总值"},{"t":"GDP分为四个组成部分：消费、投资、政府购买和净出口。消费包括家庭用于物品与服务的支出，但不包括购买新住房的支出；投资包括用于新设备和建筑物的支出，也包括家庭购买新住房的支出；政府购买包括地方、州和联邦政府用于物品与服务的支出；净出口等于国内生产并销售到国外的物品与服务的价值（出口）减国外生产并在国内销售的物品与服务的价值（进口）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">GDP分为四个组成部分</strong>：消费、投资、政府购买和净出口。消费包括家庭用于物品与服务的支出，但不包括购买新住房的支出；投资包括用于新设备和建筑物的支出，也包括家庭购买新住房的支出；政府购买包括地方、州和联邦政府用于物品与服务的支出；净出口等于国内生产并销售到国外的物品与服务的价值（出口）减国外生产并在国内销售的物品与服务的价值（进口）。","label":"GDP分为四个组成部分"},{"t":"名义GDP用现期价格来评价经济中物品与服务的生产；真实GDP用不变的基年价格来评价经济中物品与服务的生产。","c":[],"k":"b","i":1,"h":"名义GDP用现期价格来评价经济中物品与服务的生产；真实GDP用不变的基年价格来评价经济中物品与服务的生产。","label":"名义GDP用现期价格来评价经济中物品…"},{"t":"GDP平减指数——用名义GDP与真实GDP的比率计算——衡量经济中的物价水平。","c":[],"k":"b","i":1,"h":"GDP平减指数——用名义GDP与真实GDP的比率计算——衡量经济中的物价水平。","label":"GDP平减指数——用名义GDP与真实…"},{"t":"GDP是经济福利状况的一个良好的衡量指标，因为人们对高收入的偏好大于低收入；但GDP并不是衡量福利状况的一个完美指标，例如，GDP不包括闲暇的价值和清洁环境的价值。","c":[],"k":"b","i":1,"h":"GDP是经济福利状况的一个良好的衡量指标，因为人们对高收入的偏好大于低收入；但GDP并不是衡量福利状况的一个完美指标，例如，GDP不包括闲暇的价值和清洁环境的价值。","label":"GDP是经济福利状况的一个良好的衡量…"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"23.1 经济的收入与支出","c":[{"t":"（开篇定位）微观经济学（microeconomics）研究家庭和企业如何做出决策，以及它们如何在市场上相互影响；宏观经济学（macroeconomics）研究整体经济现象，包括通货膨胀、失业和经济增长。GDP是最受瞩目的经济统计数据，因为它被认为是衡量社会经济福利状况最好的指标。","c":[],"k":"b","i":1,"h":"（开篇定位）微观经济学（microeconomics）研究家庭和企业如何做出决策，以及它们如何在市场上相互影响；宏观经济学（macroeconomics）研究整体经济现象，包括通货膨胀、失业和经济增长。GDP是最受瞩目的经济统计数据，因为它被认为是衡量社会经济福利状况最好的指标。","label":"（开篇定位）微观经济学（microe…"},{"t":"判断一个人经济上是否成功先看收入；同样的逻辑适用于一国整体经济——考察经济中所有人赚到的总收入，这正是GDP的作用。","c":[],"k":"b","i":1,"h":"判断一个人经济上是否成功先看收入；同样的逻辑适用于一国整体经济——考察经济中所有人赚到的总收入，这正是GDP的作用。","label":"判断一个人经济上是否成功先看收入；同…"},{"t":"GDP同时衡量两件事：经济中所有人的总收入，和用于经济中物品与服务产出的总支出；对一个整体经济而言，收入必定等于支出。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">GDP同时衡量两件事</strong>：经济中所有人的总收入，和用于经济中物品与服务产出的总支出；对一个整体经济而言，收入必定等于支出。","label":"GDP同时衡量两件事"},{"t":"原因：每一次交易都有两方——买者和卖者，某个买者的1美元支出正是某个卖者的1美元收入（例：Karen为Doug修剪草坪支付100美元，无论作为总收入还是总支出来衡量，GDP都增加了100美元）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">原因</strong>：每一次交易都有两方——买者和卖者，某个买者的1美元支出正是某个卖者的1美元收入（例：Karen为Doug修剪草坪支付100美元，无论作为总收入还是总支出来衡量，GDP都增加了100美元）。","label":"原因：每一次交易都有两方——买者和卖…"},{"t":"循环流量图（图23-1）：家庭在物品与服务市场上的支出由家庭流向企业，企业用销售收入支付的工资、租金和利润在生产要素市场上流回家庭；GDP衡量这个货币流量，可用\"加总家庭的总支出\"或\"加总企业支付的总收入（工资、租金和利润）\"两种方法计算，结果相同。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">循环流量图</strong>（图23-1）：家庭在物品与服务市场上的支出由家庭流向企业，企业用销售收入支付的工资、租金和利润在生产要素市场上流回家庭；GDP衡量这个货币流量，可用&quot;加总家庭的总支出&quot;或&quot;加总企业支付的总收入（工资、租金和利润）&quot;两种方法计算，结果相同。","label":"循环流量图"},{"t":"现实经济更复杂（家庭要纳税和储蓄，政府与企业也购买物品与服务），但基本道理相同：无论谁购买，交易总有买者与卖者，因此对整个经济而言，支出和收入总是相同的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">现实经济更复杂</strong>（家庭要纳税和储蓄，政府与企业也购买物品与服务），但基本道理相同：无论谁购买，交易总有买者与卖者，因此对整个经济而言，支出和收入总是相同的。","label":"现实经济更复杂"},{"t":"即问即答：GDP衡量哪两件事情？它为什么可以同时衡量这两件事情？","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答</strong>：GDP衡量哪两件事情？它为什么可以同时衡量这两件事情？","label":"即问即答"}],"k":"sec","i":0,"h":"23.1 经济的收入与支出","label":"23.1 经济的收入与支出"},{"t":"23.2 GDP的衡量","c":[{"t":"国内生产总值（gross domestic product, GDP）：在某一既定时期一个国家内生产的所有最终物品与服务的市场价值（定义的中心是把GDP作为对总支出的衡量）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">国内生产总值</strong>（gross domestic product, GDP）：在某一既定时期一个国家内生产的所有最终物品与服务的市场价值（定义的中心是把GDP作为对总支出的衡量）。","label":"国内生产总值"},{"t":"23.2.1 \"GDP是……的市场价值\"：GDP要把许多种不同物品加总为一个经济活动价值的衡量指标，故使用市场价格——市场价格衡量人们愿意为各种物品支付的量，反映物品的价值；若一个苹果的价格是一个橘子的2倍，则一个苹果对GDP的贡献是一个橘子的2倍。","c":[],"k":"b","i":1,"h":"23.2.1 &quot;GDP是……的市场价值&quot;：GDP要把许多种不同物品加总为一个经济活动价值的衡量指标，故使用市场价格——市场价格衡量人们愿意为各种物品支付的量，反映物品的价值；若一个苹果的价格是一个橘子的2倍，则一个苹果对GDP的贡献是一个橘子的2倍。","label":"23.2.1 \"GDP是……的市场价值\""},{"t":"23.2.2 \"所有\"：GDP是全面的衡量指标，包括经济中生产并在市场上合法出售的所有东西。","c":[{"t":"包括住房存量提供的住房服务的市场价值：租赁住房按租金计算；自有住房由政府估算租金价值计入（假设所有者将房屋出租给自己，隐含租金既计入支出也计入收入）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">包括住房存量提供的住房服务的市场价值</strong>：租赁住房按租金计算；自有住房由政府估算租金价值计入（假设所有者将房屋出租给自己，隐含租金既计入支出也计入收入）。","label":"包括住房存量提供的住房服务的市场价值"},{"t":"不包括非法生产与销售的东西（如毒品），也不包括在家庭内生产和消费、没有进入市场的东西（自己花园里种的蔬菜）；由此产生似是而非的结果——Karen付钱让Doug修剪草坪计入GDP，两人结婚后Doug仍在修剪草坪，但服务不再在市场上出售，GDP反而减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不包括非法生产与销售的东西</strong>（如毒品），也不包括在家庭内生产和消费、没有进入市场的东西（自己花园里种的蔬菜）；由此产生似是而非的结果——Karen付钱让Doug修剪草坪计入GDP，两人结婚后Doug仍在修剪草坪，但服务不再在市场上出售，GDP反而减少。","label":"不包括非法生产与销售的东西"}],"k":"b","i":1,"h":"<strong class=\"lead\">23.2.2 &quot;所有&quot;</strong>：GDP是全面的衡量指标，包括经济中生产并在市场上合法出售的所有东西。","label":"23.2.2 \"所有\""},{"t":"23.2.3 \"最终\"：GDP只包括最终物品的价值，因为中间物品的价值已经包括在最终物品的价格中，把两者相加会重复计算。","c":[{"t":"中间物品（如国际纸业生产的纸）与最终物品（Hallmark用纸生产的贺卡）之分。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">中间物品</strong>（如国际纸业生产的纸）与最终物品（Hallmark用纸生产的贺卡）之分。","label":"中间物品"},{"t":"例外：生产出来的中间物品未被使用而增加了存货时，被暂时作为\"最终\"物品，其价值作为存货投资计入GDP；以后使用或出售时再把减少的存货价值从GDP中扣除。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例外</strong>：生产出来的中间物品未被使用而增加了存货时，被暂时作为&quot;最终&quot;物品，其价值作为存货投资计入GDP；以后使用或出售时再把减少的存货价值从GDP中扣除。","label":"例外：生产出来的中间物品未被使用而增…"}],"k":"b","i":1,"h":"<strong class=\"lead\">23.2.3 &quot;最终&quot;</strong>：GDP只包括最终物品的价值，因为中间物品的价值已经包括在最终物品的价格中，把两者相加会重复计算。","label":"23.2.3 \"最终\""},{"t":"23.2.4 \"物品与服务\"：既包括有形的物品（食物、衣服、汽车），又包括无形的服务（理发、打扫房屋、看病）。","c":[],"k":"b","i":1,"h":"23.2.4 &quot;物品与服务&quot;：既包括有形的物品（食物、衣服、汽车），又包括无形的服务（理发、打扫房屋、看病）。","label":"23.2.4 \"物品与服务\""},{"t":"23.2.5 \"生产的\"：只包括当期生产的物品与服务，不包括涉及过去生产的东西的交易（福特生产并销售的新汽车计入GDP；二手车转售不计入）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">23.2.5 &quot;生产的&quot;</strong>：只包括当期生产的物品与服务，不包括涉及过去生产的东西的交易（福特生产并销售的新汽车计入GDP；二手车转售不计入）。","label":"23.2.5 \"生产的\""},{"t":"23.2.6 \"一个国家内\"：GDP衡量的生产价值局限于一个国家的地理范围之内，与生产者国籍无关——加拿大公民暂时在美国工作，其产出是美国GDP的一部分；美国公民在海地的工厂，其产出不是美国GDP的一部分（而是海地GDP的一部分）。","c":[],"k":"b","i":1,"h":"23.2.6 &quot;一个国家内&quot;：GDP衡量的生产价值局限于一个国家的地理范围之内，与生产者国籍无关——加拿大公民暂时在美国工作，其产出是美国GDP的一部分；美国公民在海地的工厂，其产出不是美国GDP的一部分（而是海地GDP的一部分）。","label":"23.2.6 \"一个国家内\""},{"t":"23.2.7 \"在某一既定时期\"：GDP衡量某一既定时期（通常一年或一个季度）内经济收入与支出的流量；季度GDP按\"年增长率\"公布（该季度收入与支出量乘以4，便于与年度数字比较），并经过\"季度调整\"以消除有规律的季节性变动（如12月圣诞节购物旺季高点）。","c":[],"k":"b","i":1,"h":"23.2.7 &quot;在某一既定时期&quot;：GDP衡量某一既定时期（通常一年或一个季度）内经济收入与支出的流量；季度GDP按&quot;年增长率&quot;公布（该季度收入与支出量乘以4，便于与年度数字比较），并经过&quot;季度调整&quot;以消除有规律的季节性变动（如12月圣诞节购物旺季高点）。","label":"23.2.7 \"在某一既定时期\""},{"t":"两种计算方法：支出法（加总总支出）与收入法（加总总收入）结果\"几乎\"完全相同，其差额称为统计误差（数据来源不完全）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">两种计算方法</strong>：支出法（加总总支出）与收入法（加总总收入）结果&quot;几乎&quot;完全相同，其差额称为统计误差（数据来源不完全）。","label":"两种计算方法"},{"t":"即问即答：生产一磅汉堡包和生产一磅鱼子酱，哪一个对GDP的贡献更大？为什么？","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答</strong>：生产一磅汉堡包和生产一磅鱼子酱，哪一个对GDP的贡献更大？为什么？","label":"即问即答"},{"t":"参考资料「其他收入衡量指标」（按从大到小）：","c":[{"t":"国民生产总值（GNP）：一国永久居民（国民）所赚到的总收入；与GDP的差别在于它包括本国公民在国外赚到的收入，而不包括外国人在本国赚到的收入；对包括美国在内的大部分国家，GDP与GNP非常接近。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">国民生产总值</strong>（GNP）：一国永久居民（国民）所赚到的总收入；与GDP的差别在于它包括本国公民在国外赚到的收入，而不包括外国人在本国赚到的收入；对包括美国在内的大部分国家，GDP与GNP非常接近。","label":"国民生产总值"},{"t":"国民生产净值（NNP）：一国居民的总收入减折旧（GNP减折旧）；折旧是经济中设备和建筑物存量的磨损（官方账户称为\"固定资本的消费\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">国民生产净值</strong>（NNP）：一国居民的总收入减折旧（GNP减折旧）；折旧是经济中设备和建筑物存量的磨损（官方账户称为&quot;固定资本的消费&quot;）。","label":"国民生产净值"},{"t":"国民收入：一国居民在物品与服务生产中赚到的总收入；与国民生产净值几乎相同（差异源自数据收集问题的统计误差）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">国民收入</strong>：一国居民在物品与服务生产中赚到的总收入；与国民生产净值几乎相同（差异源自数据收集问题的统计误差）。","label":"国民收入"},{"t":"个人收入：家庭和非公司制企业获得的收入；不包括留存收益，减去间接税、公司所得税和社会保障支付，并加上政府债券利息与政府转移支付收入（如福利和社会保障金）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个人收入</strong>：家庭和非公司制企业获得的收入；不包括留存收益，减去间接税、公司所得税和社会保障支付，并加上政府债券利息与政府转移支付收入（如福利和社会保障金）。","label":"个人收入"},{"t":"个人可支配收入：家庭和非公司制企业在履行对政府义务之后剩下的收入（个人收入减个人税收和某些非税收支付）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个人可支配收入</strong>：家庭和非公司制企业在履行对政府义务之后剩下的收入（个人收入减个人税收和某些非税收支付）。","label":"个人可支配收入"},{"t":"各种指标几乎总是说明相同的经济状况，就监测整体经济波动而言用哪一种无关紧要。","c":[],"k":"b","i":2,"h":"各种指标几乎总是说明相同的经济状况，就监测整体经济波动而言用哪一种无关紧要。","label":"各种指标几乎总是说明相同的经济状况，…"}],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料「其他收入衡量指标」</strong>（按从大到小）：","label":"参考资料「其他收入衡量指标」"}],"k":"sec","i":0,"h":"23.2 GDP的衡量","label":"23.2 GDP的衡量"},{"t":"23.3 GDP的组成部分","c":[{"t":"支出分类：GDP（用Y表示）被分为四个组成部分——消费（C）、投资（I）、政府购买（G）和净出口（NX），即 Y = C + I + G + NX。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">支出分类</strong>：GDP（用Y表示）被分为四个组成部分——消费（C）、投资（I）、政府购买（G）和净出口（NX），即 Y = C + I + G + NX。","label":"支出分类"},{"t":"该等式是恒等式：按各变量定义必然成立——GDP中每一美元的支出都必然属于四个组成部分中的一个，故四个组成部分的总和必然等于GDP。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">该等式是恒等式</strong>：按各变量定义必然成立——GDP中每一美元的支出都必然属于四个组成部分中的一个，故四个组成部分的总和必然等于GDP。","label":"该等式是恒等式"},{"t":"23.3.1 消费（consumption）：家庭用于物品与服务（购买新住房除外）的支出。","c":[{"t":"\"物品\"包括耐用品（汽车、家电）与非耐用品（食品、衣服）；\"服务\"包括理发、医疗等无形的东西；家庭用于教育的支出也包括在服务消费中。","c":[],"k":"b","i":2,"h":"&quot;物品&quot;包括耐用品（汽车、家电）与非耐用品（食品、衣服）；&quot;服务&quot;包括理发、医疗等无形的东西；家庭用于教育的支出也包括在服务消费中。","label":"\"物品\"包括耐用品"}],"k":"b","i":1,"h":"<strong class=\"lead\">23.3.1 消费</strong>（consumption）：家庭用于物品与服务（购买新住房除外）的支出。","label":"23.3.1 消费"},{"t":"23.3.2 投资（investment）：用于资本设备、存货和建筑物的支出，包括家庭用于购买新住房的支出；即对用于未来生产更多物品与服务的物品（资本品）的购买。","c":[{"t":"按习惯，新住房购买划入投资而不划入消费。","c":[],"k":"b","i":2,"h":"按习惯，新住房购买划入投资而不划入消费。","label":"按习惯，新住房购买划入投资而不划入消费。"},{"t":"存货的处理：企业生产而未出售的产品（如苹果公司入库的电脑）视为企业自己\"购买了\"，计入其投资支出；以后出售时存货投资为负，抵消买者的正支出——因为GDP衡量当期生产的物品与服务的价值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">存货的处理</strong>：企业生产而未出售的产品（如苹果公司入库的电脑）视为企业自己&quot;购买了&quot;，计入其投资支出；以后出售时存货投资为负，抵消买者的正支出——因为GDP衡量当期生产的物品与服务的价值。","label":"存货的处理"},{"t":"注意：GDP核算中的\"投资\"指购买资本设备、建筑物和存货，不同于日常谈话中的金融投资（股票、债券、共同基金）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">注意</strong>：GDP核算中的&quot;投资&quot;指购买资本设备、建筑物和存货，不同于日常谈话中的金融投资（股票、债券、共同基金）。","label":"注意：GDP核算中的\"投资\"指购买资…"}],"k":"b","i":1,"h":"<strong class=\"lead\">23.3.2 投资</strong>（investment）：用于资本设备、存货和建筑物的支出，包括家庭用于购买新住房的支出；即对用于未来生产更多物品与服务的物品（资本品）的购买。","label":"23.3.2 投资"},{"t":"23.3.3 政府购买（government purchases）：地方、州和联邦政府用于物品与服务的支出，包括政府员工的薪水和用于公务的支出（官方账户现称\"政府消费支出和总投资\"，本书沿用传统术语）。","c":[{"t":"转移支付不计入政府购买：如社会保障补助、失业保险补助；它们并不用于交换现期生产的物品与服务，不反映经济的生产（宏观经济视角下类似负的税收）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">转移支付不计入政府购买</strong>：如社会保障补助、失业保险补助；它们并不用于交换现期生产的物品与服务，不反映经济的生产（宏观经济视角下类似负的税收）。","label":"转移支付不计入政府购买"}],"k":"b","i":1,"h":"<strong class=\"lead\">23.3.3 政府购买</strong>（government purchases）：地方、州和联邦政府用于物品与服务的支出，包括政府员工的薪水和用于公务的支出（官方账户现称&quot;政府消费支出和总投资&quot;，本书沿用传统术语）。","label":"23.3.3 政府购买"},{"t":"23.3.4 净出口（net exports）：外国对国内生产的物品的支出（出口）减国内对外国物品的支出（进口）。","c":[{"t":"为什么要减进口：GDP的其他组成部分（消费、投资、政府购买）中包括进口的物品与服务——如家庭购买4万美元的进口沃尔沃，消费增加4万美元、净出口减少4万美元，GDP不变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">为什么要减进口</strong>：GDP的其他组成部分（消费、投资、政府购买）中包括进口的物品与服务——如家庭购买4万美元的进口沃尔沃，消费增加4万美元、净出口减少4万美元，GDP不变。","label":"为什么要减进口"},{"t":"国内企业向外国买者出售产品（波音向英国航空公司售机）增加净出口。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">国内企业向外国买者出售产品</strong>（波音向英国航空公司售机）增加净出口。","label":"国内企业向外国买者出售产品"}],"k":"b","i":1,"h":"<strong class=\"lead\">23.3.4 净出口</strong>（net exports）：外国对国内生产的物品的支出（出口）减国内对外国物品的支出（进口）。","label":"23.3.4 净出口"},{"t":"案例研究「美国GDP的组成部分」（表23-1，2015年）：GDP约18万亿美元（17,938十亿美元），除以人口3.21亿得人均GDP 55,882美元；消费占68%（人均38,218美元）、政府购买18%（9,919美元）、投资17%（9,402美元）、净出口-3%（人均-1,657美元，为负是因为美国人购买外国物品的支出大于出售给外国人物品所赚到的收入）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">案例研究「美国GDP的组成部分」</strong>（表23-1，2015年）：GDP约18万亿美元（17,938十亿美元），除以人口3.21亿得人均GDP 55,882美元；消费占68%（人均38,218美元）、政府购买18%（9,919美元）、投资17%（9,402美元）、净出口-3%（人均-1,657美元，为负是因为美国人购买外国物品的支出大于出售给外国人物品所赚到的收入）。","label":"案例研究「美国GDP的组成部分」"},{"t":"即问即答：列出支出的四个组成部分。哪一部分最大？（消费）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答</strong>：列出支出的四个组成部分。哪一部分最大？（消费）","label":"即问即答"},{"t":"新闻摘录「性、毒品和GDP」：欧盟统计局推动把卖淫、非法毒品等纳入GDP核算，西班牙、意大利、比利时、英国已纳入（英国GDP因此增加100亿英镑），法国以\"非自愿交易\"的道德理由拒绝；作者指出义务劳动和家务劳动本已被漏掉，再叠加道德维度只会使统计更混乱——不去衡量毒品和性交易并不会使它们消失（美国已把内华达州合法卖淫及部分州大麻销售计入GDP）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">新闻摘录「性、毒品和GDP」</strong>：欧盟统计局推动把卖淫、非法毒品等纳入GDP核算，西班牙、意大利、比利时、英国已纳入（英国GDP因此增加100亿英镑），法国以&quot;非自愿交易&quot;的道德理由拒绝；作者指出义务劳动和家务劳动本已被漏掉，再叠加道德维度只会使统计更混乱——不去衡量毒品和性交易并不会使它们消失（美国已把内华达州合法卖淫及部分州大麻销售计入GDP）。","label":"新闻摘录「性、毒品和GDP」"}],"k":"sec","i":0,"h":"23.3 GDP的组成部分","label":"23.3 GDP的组成部分"},{"t":"23.4 真实GDP与名义GDP","c":[{"t":"为什么要区分：总支出增加时，至少有一种情况成立——（1）生产了更多的物品与服务；（2）以更高的价格销售物品与服务；经济学家想衡量不受价格变动影响的物品与服务的总产量。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">为什么要区分</strong>：总支出增加时，至少有一种情况成立——（1）生产了更多的物品与服务；（2）以更高的价格销售物品与服务；经济学家想衡量不受价格变动影响的物品与服务的总产量。","label":"为什么要区分"},{"t":"名义GDP（nominal GDP）：按现期价格评价的物品与服务的生产。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">名义GDP</strong>（nominal GDP）：按现期价格评价的物品与服务的生产。","label":"名义GDP"},{"t":"真实GDP（real GDP）：按不变价格评价的物品与服务的生产；它回答\"若以过去某一年的价格来评价今年生产的物品与服务的价值是多少\"，通过把价格固定在基年水平上，真实GDP的变动只反映产量的变动。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">真实GDP</strong>（real GDP）：按不变价格评价的物品与服务的生产；它回答&quot;若以过去某一年的价格来评价今年生产的物品与服务的价值是多少&quot;，通过把价格固定在基年水平上，真实GDP的变动只反映产量的变动。","label":"真实GDP"},{"t":"23.4.1 一个数字例子（表23-2，只生产热狗与汉堡包的经济，2016-2018年）：","c":[{"t":"名义GDP＝现期价格×现期产量：2016年（1美元×100热狗+2美元×50汉堡）＝200美元；2017年＝600美元；2018年＝1,200美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">名义GDP＝现期价格×现期产量</strong>：2016年（1美元×100热狗+2美元×50汉堡）＝200美元；2017年＝600美元；2018年＝1,200美元。","label":"名义GDP＝现期价格×现期产量"},{"t":"真实GDP＝基年（2016年）价格×当年产量：2016年＝200美元；2017年＝350美元；2018年＝500美元；基年的真实GDP总是等于名义GDP。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">真实GDP＝基年</strong>（2016年）价格×当年产量：2016年＝200美元；2017年＝350美元；2018年＝500美元；基年的真实GDP总是等于名义GDP。","label":"真实GDP＝基年"},{"t":"真实GDP从200到350再到500美元的增加全部来自产量增加，因为价格被固定在基年水平上。","c":[],"k":"b","i":2,"h":"真实GDP从200到350再到500美元的增加全部来自产量增加，因为价格被固定在基年水平上。","label":"真实GDP从200到350再到500…"},{"t":"由于真实GDP不受价格变动影响、反映经济满足人们需要与欲望的能力，它作为衡量经济福利的指标优于名义GDP；经济学家谈到经济的GDP时通常指真实GDP，衡量经济增长用真实GDP变动的百分比。","c":[],"k":"b","i":2,"h":"由于真实GDP不受价格变动影响、反映经济满足人们需要与欲望的能力，它作为衡量经济福利的指标优于名义GDP；经济学家谈到经济的GDP时通常指真实GDP，衡量经济增长用真实GDP变动的百分比。","label":"由于真实GDP不受价格变动影响、反映…"}],"k":"b","i":1,"h":"<strong class=\"lead\">23.4.1 一个数字例子</strong>（表23-2，只生产热狗与汉堡包的经济，2016-2018年）：","label":"23.4.1 一个数字例子"},{"t":"23.4.2 GDP平减指数（GDP deflator）：用名义GDP与真实GDP的比率乘以100计算的物价水平衡量指标。","c":[{"t":"公式：GDP平减指数＝（名义GDP ÷ 真实GDP）× 100；基年的GDP平减指数总是等于100。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公式</strong>：GDP平减指数＝（名义GDP ÷ 真实GDP）× 100；基年的GDP平减指数总是等于100。","label":"公式：GDP平减指数＝（名义GDP …"},{"t":"数字例子：2016年＝（200/200）×100＝100；2017年＝（600/350）×100＝171；2018年＝（1200/500）×100＝240。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数字例子</strong>：2016年＝（200/200）×100＝100；2017年＝（600/350）×100＝171；2018年＝（1200/500）×100＝240。","label":"数字例子"},{"t":"平减指数只反映价格的变动而非产量的变动：产量增加而价格不变→名义与真实GDP同增、平减指数不变；物价上升而产量不变→名义GDP增加、真实GDP不变、平减指数上升。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">平减指数只反映价格的变动而非产量的变动</strong>：产量增加而价格不变→名义与真实GDP同增、平减指数不变；物价上升而产量不变→名义GDP增加、真实GDP不变、平减指数上升。","label":"平减指数只反映价格的变动而非产量的变动"},{"t":"通货膨胀（inflation）：经济中整体物价水平的上升；通货膨胀率是从一个时期到下一个时期某个物价水平衡量指标变动的百分比。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">通货膨胀</strong>（inflation）：经济中整体物价水平的上升；通货膨胀率是从一个时期到下一个时期某个物价水平衡量指标变动的百分比。","label":"通货膨胀"},{"t":"用平减指数计算的通货膨胀率＝（第二年平减指数－第一年平减指数）÷第一年平减指数×100%；例：2017年为71%、2018年为40%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">用平减指数计算的通货膨胀率＝</strong>（第二年平减指数－第一年平减指数）÷第一年平减指数×100%；例：2017年为71%、2018年为40%。","label":"用平减指数计算的通货膨胀率＝"},{"t":"\"平减\"得名：可用来从名义GDP中剔除由于物价上升而引起的上升，即剔除通货膨胀因素；下一章将介绍另一个物价水平衡量指标CPI并比较二者差别。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">&quot;平减&quot;得名</strong>：可用来从名义GDP中剔除由于物价上升而引起的上升，即剔除通货膨胀因素；下一章将介绍另一个物价水平衡量指标CPI并比较二者差别。","label":"\"平减\"得名"}],"k":"b","i":1,"h":"<strong class=\"lead\">23.4.2 GDP平减指数</strong>（GDP deflator）：用名义GDP与真实GDP的比率乘以100计算的物价水平衡量指标。","label":"23.4.2 GDP平减指数"},{"t":"案例研究「半个世纪的真实GDP」（图23-2，1965年以来美国真实GDP季度数据）：","c":[{"t":"数据两大特点：其一，真实GDP一直在增长——2015年几乎是1965年的4倍，物品与服务产量平均每年增长3%左右；其二，增长并不稳定，常被衰退（真实GDP下降的时期，用垂直阴影条表示；古老的经验规则是真实GDP连续两个季度下降）打断。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数据两大特点</strong>：其一，真实GDP一直在增长——2015年几乎是1965年的4倍，物品与服务产量平均每年增长3%左右；其二，增长并不稳定，常被衰退（真实GDP下降的时期，用垂直阴影条表示；古老的经验规则是真实GDP连续两个季度下降）打断。","label":"数据两大特点"},{"t":"衰退不仅与收入下降相关，还伴随失业增加、利润减少、破产增加等；宏观经济学的大部分内容是解释真实GDP的长期增长与短期波动，二者需要不同的模型。","c":[],"k":"b","i":2,"h":"衰退不仅与收入下降相关，还伴随失业增加、利润减少、破产增加等；宏观经济学的大部分内容是解释真实GDP的长期增长与短期波动，二者需要不同的模型。","label":"衰退不仅与收入下降相关，还伴随失业增…"}],"k":"b","i":1,"h":"<strong class=\"lead\">案例研究「半个世纪的真实GDP」</strong>（图23-2，1965年以来美国真实GDP季度数据）：","label":"案例研究「半个世纪的真实GDP」"},{"t":"即问即答：定义真实GDP与名义GDP。哪一个是更好的经济福利衡量指标？为什么？","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答</strong>：定义真实GDP与名义GDP。哪一个是更好的经济福利衡量指标？为什么？","label":"即问即答"},{"t":"新闻摘录「衡量高科技经济」：硅谷认为官方生产率数字低估了免费数字产品（定位应用、即时翻译等）的价值——GDP概念形成于20世纪30年代，擅长衡量钢铁、粮食等有形产出，难以衡量质量改善与节约时间的技术；历史上自来水与家电大幅提高家务效率，但因家务不计入GDP而未反映在数字上；省下的时间投入市场活动后才反映在GDP中。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">新闻摘录「衡量高科技经济」</strong>：硅谷认为官方生产率数字低估了免费数字产品（定位应用、即时翻译等）的价值——GDP概念形成于20世纪30年代，擅长衡量钢铁、粮食等有形产出，难以衡量质量改善与节约时间的技术；历史上自来水与家电大幅提高家务效率，但因家务不计入GDP而未反映在数字上；省下的时间投入市场活动后才反映在GDP中。","label":"新闻摘录「衡量高科技经济」"}],"k":"sec","i":0,"h":"23.4 真实GDP与名义GDP","label":"23.4 真实GDP与名义GDP"},{"t":"23.5 GDP是衡量经济福利的好指标吗","c":[{"t":"人均GDP告诉我们经济中每个人的平均收入与支出，由于大多数人喜欢更高的收入与支出，人均GDP自然成为平均经济福利的衡量指标。","c":[],"k":"b","i":1,"h":"人均GDP告诉我们经济中每个人的平均收入与支出，由于大多数人喜欢更高的收入与支出，人均GDP自然成为平均经济福利的衡量指标。","label":"人均GDP告诉我们经济中每个人的平均…"},{"t":"罗伯特·肯尼迪1968年竞选总统时的批评：GDP没有考虑孩子的健康、教育质量、游戏的快乐、诗歌之美、婚姻稳定、勇气、智慧和对国家的热爱——曼昆评价这些话大部分是正确的，但GDP更高的国家能够提供更好的医疗、教育体系等；GDP没有直接衡量使生活有意义的东西，但确实衡量了我们获得构成这份有意义生活的许多要素的能力。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">罗伯特·肯尼迪1968年竞选总统时的批评</strong>：GDP没有考虑孩子的健康、教育质量、游戏的快乐、诗歌之美、婚姻稳定、勇气、智慧和对国家的热爱——曼昆评价这些话大部分是正确的，但GDP更高的国家能够提供更好的医疗、教育体系等；GDP没有直接衡量使生活有意义的东西，但确实衡量了我们获得构成这份有意义生活的许多要素的能力。","label":"罗伯特·肯尼迪1968年竞选总统时的批评"},{"t":"GDP不是衡量福利的完美指标，书内列举的遗漏：","c":[{"t":"闲暇：若每个人每天都工作而不享受闲暇，GDP会增加，但减少闲暇引起的福利损失抵消了生产并消费更多物品与服务的福利利益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">闲暇</strong>：若每个人每天都工作而不享受闲暇，GDP会增加，但减少闲暇引起的福利损失抵消了生产并消费更多物品与服务的福利利益。","label":"闲暇：若每个人每天都工作而不享受闲暇…"},{"t":"市场之外的活动：GDP用市场价格评价物品与服务，几乎未包括市场之外活动的价值——厨师在餐馆做饭计入GDP、为家人做饭不计入；幼儿园的照顾计入GDP、父母在家照料孩子不计入；义工的贡献也不反映。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">市场之外的活动</strong>：GDP用市场价格评价物品与服务，几乎未包括市场之外活动的价值——厨师在餐馆做饭计入GDP、为家人做饭不计入；幼儿园的照顾计入GDP、父母在家照料孩子不计入；义工的贡献也不反映。","label":"市场之外的活动"},{"t":"环境质量：取消所有环境管制会使GDP增加，但空气和水质量恶化引起的福利损失可能大于产量增加的福利利益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">环境质量</strong>：取消所有环境管制会使GDP增加，但空气和水质量恶化引起的福利损失可能大于产量增加的福利利益。","label":"环境质量"},{"t":"收入分配：100人各年收入5万美元的社会与10人各赚50万美元、90人一无所有的社会人均GDP相同，但很少人认为二者相同——平均量背后是个人状况的巨大差异。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">收入分配</strong>：100人各年收入5万美元的社会与10人各赚50万美元、90人一无所有的社会人均GDP相同，但很少人认为二者相同——平均量背后是个人状况的巨大差异。","label":"收入分配"}],"k":"b","i":1,"h":"<strong class=\"lead\">GDP不是衡量福利的完美指标，书内列举的遗漏</strong>：","label":"GDP不是衡量福利的完美指标，书内列举的遗漏"},{"t":"总结论：就大多数情况——但不是所有情况——而言，GDP是衡量经济福利的一个好指标；重要的是记住GDP包括了什么、遗漏了什么。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总结论</strong>：就大多数情况——但不是所有情况——而言，GDP是衡量经济福利的一个好指标；重要的是记住GDP包括了什么、遗漏了什么。","label":"总结论：就大多数情况——但不是所有情…"},{"t":"新闻摘录「衡量宏观经济福祉」：英、法等国探索纳入生活满意度的国民福利指标；研究显示人均GDP与幸福感大体同比例增加（Sacks、Stevenson、Wolfers），但计入闲暇、预期寿命、不平等后各国排名大变（Klenow & Jones：计入后法德生活水平与美国相当，新加坡、韩国等明显下降）；目前决策者只能选最适合手头问题的衡量方法。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">新闻摘录「衡量宏观经济福祉」</strong>：英、法等国探索纳入生活满意度的国民福利指标；研究显示人均GDP与幸福感大体同比例增加（Sacks、Stevenson、Wolfers），但计入闲暇、预期寿命、不平等后各国排名大变（Klenow &amp; Jones：计入后法德生活水平与美国相当，新加坡、韩国等明显下降）；目前决策者只能选最适合手头问题的衡量方法。","label":"新闻摘录「衡量宏观经济福祉」"},{"t":"案例研究「GDP与生活质量的国际差异」（表23-4，12个人口最多的国家）：在美国、德国等富国，预期可以活到80岁左右、平均上学13年、生活满意程度7左右；孟加拉国、巴基斯坦等穷国的人一般少活10-20年、平均上学不到6年、满意程度比富国低约2个百分点——人均GDP低的国家还伴随婴儿死亡率高、产妇死亡率高、儿童营养不良多、文盲普遍、电视电话和互联网少；国际数据表明一国人均GDP与其公民的生活水平密切相关。","c":[],"k":"b","i":1,"h":"案例研究「GDP与生活质量的国际差异」（表23-4，12个人口最多的国家）：在美国、德国等富国，预期可以活到80岁左右、平均上学13年、生活满意程度7左右；孟加拉国、巴基斯坦等穷国的人一般少活10-20年、平均上学不到6年、满意程度比富国低约2个百分点——人均GDP低的国家还伴随婴儿死亡率高、产妇死亡率高、儿童营养不良多、文盲普遍、电视电话和互联网少；国际数据表明一国人均GDP与其公民的生活水平密切相关。","label":"案例研究「GDP与生活质量的国际差异」"},{"t":"即问即答：为什么政策制定者应该关注GDP？","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答</strong>：为什么政策制定者应该关注GDP？","label":"即问即答"}],"k":"sec","i":0,"h":"23.5 GDP是衡量经济福利的好指标吗","label":"23.5 GDP是衡量经济福利的好指标吗"},{"t":"23.6 结论","c":[{"t":"衡量只是起点：宏观经济学的大部分内容是说明一国GDP的长期与短期决定因素——为什么美国和日本的GDP高于印度和尼日利亚、最穷国家的政府可以用什么方法加快增长、为什么GDP在某些年份增长迅速而在另一些年份下降、决策者如何降低波动的剧烈性。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">衡量只是起点</strong>：宏观经济学的大部分内容是说明一国GDP的长期与短期决定因素——为什么美国和日本的GDP高于印度和尼日利亚、最穷国家的政府可以用什么方法加快增长、为什么GDP在某些年份增长迅速而在另一些年份下降、决策者如何降低波动的剧烈性。","label":"衡量只是起点"},{"t":"用GDP这样的统计数字把经济状况量化，是发展宏观经济学这门科学的第一步。","c":[],"k":"b","i":1,"h":"用GDP这样的统计数字把经济状况量化，是发展宏观经济学这门科学的第一步。","label":"用GDP这样的统计数字把经济状况量化…"},{"t":"本章关键概念：微观经济学、宏观经济学、国内生产总值（GDP）、消费、投资、政府购买、净出口、名义GDP、真实GDP、GDP平减指数。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章关键概念</strong>：微观经济学、宏观经济学、国内生产总值（GDP）、消费、投资、政府购买、净出口、名义GDP、真实GDP、GDP平减指数。","label":"本章关键概念"}],"k":"sec","i":0,"h":"23.6 结论","label":"23.6 结论"}],"k":"chap","h":"第23章 一国收入的衡量","label":"第23章 一国收入的衡量"},{"t":"第24章 生活费用的衡量","c":[{"t":"本章内容提要","c":[{"t":"消费物价指数（CPI）表示相对于基年一篮子物品与服务的费用，这一篮子物品与服务的现期费用是多少，用于衡量经济的物价总水平；CPI 变动的百分比用于衡量通货膨胀率。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">消费物价指数</strong>（CPI）表示相对于基年一篮子物品与服务的费用，这一篮子物品与服务的现期费用是多少，用于衡量经济的物价总水平；CPI 变动的百分比用于衡量通货膨胀率。","label":"消费物价指数"},{"t":"由于替代偏向、新产品的引进与无法衡量的质量变动三个原因，CPI 并不是生活费用的完美衡量指标，它高估了真实的通货膨胀（20 世纪 90 年代研究估计每年高估约 1%，劳工统计局改进后许多经济学家相信偏差只剩以前的一半）。","c":[],"k":"b","i":1,"h":"由于替代偏向、新产品的引进与无法衡量的质量变动三个原因，CPI 并不是生活费用的完美衡量指标，它高估了真实的通货膨胀（20 世纪 90 年代研究估计每年高估约 1%，劳工统计局改进后许多经济学家相信偏差只剩以前的一半）。","label":"由于替代偏向、新产品的引进与无法衡量…"},{"t":"GDP 平减指数与 CPI 都衡量物价总水平、通常同时变动，但有两大差别：GDP 平减指数涵盖国内生产的所有物品与服务、其物品组合随 GDP 构成自动变动；CPI 涵盖消费者购买的所有物品与服务（含进口消费品）、使用固定篮子。","c":[],"k":"b","i":1,"h":"GDP 平减指数与 CPI 都衡量物价总水平、通常同时变动，但有两大差别：GDP 平减指数涵盖国内生产的所有物品与服务、其物品组合随 GDP 构成自动变动；CPI 涵盖消费者购买的所有物品与服务（含进口消费品）、使用固定篮子。","label":"GDP 平减指数与 CPI 都衡量物…"},{"t":"不同时期的美元数字并不代表购买力的真实差别，比较时应用物价指数调整：今天的美元数字＝T 年的美元数字×（今天的物价水平÷T 年的物价水平）。","c":[],"k":"b","i":1,"h":"不同时期的美元数字并不代表购买力的真实差别，比较时应用物价指数调整：今天的美元数字＝T 年的美元数字×（今天的物价水平÷T 年的物价水平）。","label":"不同时期的美元数字并不代表购买力的真…"},{"t":"各种法律和私人合同用物价指数校正通货膨胀的影响（指数化），但税法中只在部分方面进行了指数化。","c":[],"k":"b","i":1,"h":"各种法律和私人合同用物价指数校正通货膨胀的影响（指数化），但税法中只在部分方面进行了指数化。","label":"各种法律和私人合同用物价指数校正通货膨胀的影响"},{"t":"名义利率是通常公布的、未对通货膨胀的影响进行校正的利率；真实利率＝名义利率－通货膨胀率，它告诉我们美元购买力提高的速度。","c":[],"k":"b","i":1,"h":"名义利率是通常公布的、未对通货膨胀的影响进行校正的利率；真实利率＝名义利率－通货膨胀率，它告诉我们美元购买力提高的速度。","label":"名义利率是通常公布的、未对通货膨胀的…"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"24.1 消费物价指数","c":[{"t":"术语：消费物价指数（consumer price index, CPI）——普通消费者所购买的物品与服务的总费用的衡量指标，由美国劳工部劳工统计局（BLS）每月计算并公布，是比 GDP 平减指数更常用的通货膨胀衡量指标（因它更好地反映消费者购买的物品与服务）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：消费物价指数（consumer price index, CPI）——普通消费者所购买的物品与服务的总费用的衡量指标，由美国劳工部劳工统计局（BLS）每月计算并公布，是比 GDP 平减指数更常用的通货膨胀衡量指标（因它更好地反映消费者购买的物品与服务）。","label":"术语：消费物价指数（consumer…"},{"t":"术语：通货膨胀率（inflation rate）——自前一个时期以来物价指数变动的百分比。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：通货膨胀率（inflation rate）——自前一个时期以来物价指数变动的百分比。","label":"术语：通货膨胀率（inflation…"},{"t":"24.1.1 如何计算CPI","c":[{"t":"劳工统计局使用成千上万种物品与服务的价格数据，遵循五个步骤（书中以只有热狗和汉堡包两种物品的简单经济为例）：","c":[{"t":"1．固定篮子：调查消费者并找出普通消费者购买的一篮子物品与服务（书中例：4 个热狗和 2 个汉堡包），购买量越多的物品在衡量生活费用时权重越大。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">1．固定篮子</strong>：调查消费者并找出普通消费者购买的一篮子物品与服务（书中例：4 个热狗和 2 个汉堡包），购买量越多的物品在衡量生活费用时权重越大。","label":"1．固定篮子"},{"t":"2．找出价格：找出每个时点篮子中每种物品与服务的价格。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">2．找出价格</strong>：找出每个时点篮子中每种物品与服务的价格。","label":"2．找出价格"},{"t":"3．计算这一篮子物品与服务的费用：用价格数据计算不同时期购买同一篮子的费用；篮子保持不变，从而把价格变动的影响与数量变动的影响区分开来。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">3．计算这一篮子物品与服务的费用</strong>：用价格数据计算不同时期购买同一篮子的费用；篮子保持不变，从而把价格变动的影响与数量变动的影响区分开来。","label":"3．计算这一篮子物品与服务的费用"},{"t":"4．选择基年并计算指数：基年的选择是任意的；CPI＝（当年一篮子物品与服务的价格÷基年一篮子物品与服务的价格）×100，基年的 CPI 总是 100。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">4．选择基年并计算指数</strong>：基年的选择是任意的；CPI＝（当年一篮子物品与服务的价格÷基年一篮子物品与服务的价格）×100，基年的 CPI 总是 100。","label":"4．选择基年并计算指数"},{"t":"5．计算通货膨胀率：第二年的通货膨胀率＝（第二年的 CPI－第一年的 CPI）÷第一年的 CPI×100%。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">5．计算通货膨胀率</strong>：第二年的通货膨胀率＝（第二年的 CPI－第一年的 CPI）÷第一年的 CPI×100%。","label":"5．计算通货膨胀率"}],"k":"b","i":2,"h":"劳工统计局使用成千上万种物品与服务的价格数据，遵循五个步骤（书中以只有热狗和汉堡包两种物品的简单经济为例）：","label":"劳工统计局使用成千上万种物品与服务的…"},{"t":"书中示例（表 24-1，2016 年为基年、篮子费用 8 美元）：2016 年 CPI＝100，2017 年 CPI＝175（通货膨胀率 75%），2018 年 CPI＝250（通货膨胀率 43%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中示例</strong>（表 24-1，2016 年为基年、篮子费用 8 美元）：2016 年 CPI＝100，2017 年 CPI＝175（通货膨胀率 75%），2018 年 CPI＝250（通货膨胀率 43%）。","label":"书中示例"},{"t":"参考资料「CPI 的篮子中有些什么」（要点并入）：普通消费者预算中住房占 42% 为最大项目（住所费用 33%、燃料和其他公共服务 5%、家具维修 4%），其后依次为交通 16%、食物和饮料 15%（在家消费食物 8%、在外消费 6%、含酒精饮料 1%）、医疗 8%、教育和通信 7%、休闲娱乐 6%、服装 3%、其他物品与服务 3%（香烟、理发、丧葬等杂项）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「CPI 的篮子中有些什么」</strong>（要点并入）：普通消费者预算中住房占 42% 为最大项目（住所费用 33%、燃料和其他公共服务 5%、家具维修 4%），其后依次为交通 16%、食物和饮料 15%（在家消费食物 8%、在外消费 6%、含酒精饮料 1%）、医疗 8%、教育和通信 7%、休闲娱乐 6%、服装 3%、其他物品与服务 3%（香烟、理发、丧葬等杂项）。","label":"参考资料「CPI 的篮子中有些什么」"},{"t":"术语：核心CPI——食物和能源之外的消费者物品与服务的总体费用的衡量指标；因食品和能源价格短期剧烈变动，核心 CPI 能更好地反映持续的通货膨胀趋势。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：核心CPI——食物和能源之外的消费者物品与服务的总体费用的衡量指标；因食品和能源价格短期剧烈变动，核心 CPI 能更好地反映持续的通货膨胀趋势。","label":"术语：核心CPI——食物和能源之外的…"},{"t":"术语：生产物价指数（producer price index, PPI）——企业（而不是消费者）所购买的一篮子物品与服务的费用的衡量指标；企业最终会把费用以更高消费价格的形式转移给消费者，故通常认为 PPI 的变动对预测 CPI 的变动有用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：生产物价指数（producer price index, PPI）——企业（而不是消费者）所购买的一篮子物品与服务的费用的衡量指标；企业最终会把费用以更高消费价格的形式转移给消费者，故通常认为 PPI 的变动对预测 CPI 的变动有用。","label":"术语：生产物价指数（producer…"}],"k":"b","i":1,"h":"24.1.1 如何计算CPI","label":"24.1.1 如何计算CPI"},{"t":"24.1.2 衡量生活费用中的问题","c":[{"t":"CPI 的目的是确定要保持生活水平不变收入应该增加多少，但它存在三个得到广泛承认而又难以解决的问题：","c":[{"t":"1．替代偏向：各物品价格并非同比例变动，消费者会少买价格上升相对较快的物品、多买上升较慢甚至下降的物品；固定篮子的计算忽略了这种替代，从而高估从某一年到下一年生活费用的增加（书中例：基年苹果比梨便宜、篮子中苹果多；次年梨变得比苹果便宜，统计部门仍按原篮子假设消费者购买同样数量而已变贵的苹果）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">1．替代偏向</strong>：各物品价格并非同比例变动，消费者会少买价格上升相对较快的物品、多买上升较慢甚至下降的物品；固定篮子的计算忽略了这种替代，从而高估从某一年到下一年生活费用的增加（书中例：基年苹果比梨便宜、篮子中苹果多；次年梨变得比苹果便宜，统计部门仍按原篮子假设消费者购买同样数量而已变贵的苹果）。","label":"1．替代偏向"},{"t":"2．新产品的引进：新物品扩大了消费者的选择、减少了维持相同经济福利水平的费用，使每 1 美元更值钱（如同在大商店与小商店的等额礼品券之间人们偏好选择多的）；CPI 基于固定篮子，没有反映这种美元价值的增加（书中例：2001 年 iPod 引进降低了生活费用，但 CPI 并未因此下降，劳工统计局把 iPod 纳入篮子后也只反映其后的价格变动）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">2．新产品的引进</strong>：新物品扩大了消费者的选择、减少了维持相同经济福利水平的费用，使每 1 美元更值钱（如同在大商店与小商店的等额礼品券之间人们偏好选择多的）；CPI 基于固定篮子，没有反映这种美元价值的增加（书中例：2001 年 iPod 引进降低了生活费用，但 CPI 并未因此下降，劳工统计局把 iPod 纳入篮子后也只反映其后的价格变动）。","label":"2．新产品的引进"},{"t":"3．无法衡量的质量变动：物品质量逐年变差则 1 美元的价值下降，质量上升则 1 美元的价值上升；劳工统计局尽力根据质量变动调整价格（如车型马力更大、更省油），力图计算质量不变的一篮子物品的价格，但质量难以衡量，问题依然存在。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">3．无法衡量的质量变动</strong>：物品质量逐年变差则 1 美元的价值下降，质量上升则 1 美元的价值上升；劳工统计局尽力根据质量变动调整价格（如车型马力更大、更省油），力图计算质量不变的一篮子物品的价格，但质量难以衡量，问题依然存在。","label":"3．无法衡量的质量变动"}],"k":"b","i":2,"h":"CPI 的目的是确定要保持生活水平不变收入应该增加多少，但它存在三个得到广泛承认而又难以解决的问题：","label":"CPI 的目的是确定要保持生活水平不…"},{"t":"偏差的大小与意义：20 世纪 90 年代几项研究结论是 CPI 每年高估约 1% 的通货膨胀；劳工统计局采取技术性变动加以完善后，许多经济学家相信现在偏差只有以前的一半。此事重要是因为许多政府计划（如社会保障领取者补助的年度增加）用 CPI 来调整物价总水平的变动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">偏差的大小与意义</strong>：20 世纪 90 年代几项研究结论是 CPI 每年高估约 1% 的通货膨胀；劳工统计局采取技术性变动加以完善后，许多经济学家相信现在偏差只有以前的一半。此事重要是因为许多政府计划（如社会保障领取者补助的年度增加）用 CPI 来调整物价总水平的变动。","label":"偏差的大小与意义"},{"t":"新闻摘录「在网络时代监控通货膨胀？」（要点并入）：MIT 经济学的\"亿万价格项目\"（BPP）用 70 国约 300 家线上零售商约 500 万种货物的价格（美国约 50 万种）逐日衡量通货膨胀，谷歌首席经济学家 Hal Varian 也创建了随时更新的\"谷歌价格指数\"；网络方法更灵活、便宜、快捷且为日数据，但迄今都紧密追踪 CPI——这反而印证了 CPI 的准确性；CPI 计算方法变化不大、稳定且一致性强，是其巨大优点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新闻摘录「在网络时代监控通货膨胀？」</strong>（要点并入）：MIT 经济学的&quot;亿万价格项目&quot;（BPP）用 70 国约 300 家线上零售商约 500 万种货物的价格（美国约 50 万种）逐日衡量通货膨胀，谷歌首席经济学家 Hal Varian 也创建了随时更新的&quot;谷歌价格指数&quot;；网络方法更灵活、便宜、快捷且为日数据，但迄今都紧密追踪 CPI——这反而印证了 CPI 的准确性；CPI 计算方法变化不大、稳定且一致性强，是其巨大优点。","label":"新闻摘录「在网络时代监控通货膨胀？」"}],"k":"b","i":1,"h":"24.1.2 衡量生活费用中的问题","label":"24.1.2 衡量生活费用中的问题"},{"t":"24.1.3 GDP 平减指数与CPI","c":[{"t":"GDP 平减指数是名义 GDP 与真实 GDP 的比率：名义 GDP 按现期价格评价现期产出，真实 GDP 按基年价格评价现期产出，故该比率反映相对于基年物价水平的现期物价水平。","c":[],"k":"b","i":2,"h":"GDP 平减指数是名义 GDP 与真实 GDP 的比率：名义 GDP 按现期价格评价现期产出，真实 GDP 按基年价格评价现期产出，故该比率反映相对于基年物价水平的现期物价水平。","label":"GDP 平减指数是名义 GDP 与真…"},{"t":"第一个差别（涵盖范围）：GDP 平减指数反映国内生产的所有物品与服务的价格，CPI 反映消费者购买的所有物品与服务的价格——卖给空军的波音飞机涨价计入 GDP 平减指数而不计入 CPI；瑞典产沃尔沃汽车（进口消费品）涨价计入 CPI 而不计入 GDP 平减指数。美国用的大部分石油是进口的，故石油价格上升时，CPI 上升的速度比 GDP 平减指数快得多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第一个差别</strong>（涵盖范围）：GDP 平减指数反映国内生产的所有物品与服务的价格，CPI 反映消费者购买的所有物品与服务的价格——卖给空军的波音飞机涨价计入 GDP 平减指数而不计入 CPI；瑞典产沃尔沃汽车（进口消费品）涨价计入 CPI 而不计入 GDP 平减指数。美国用的大部分石油是进口的，故石油价格上升时，CPI 上升的速度比 GDP 平减指数快得多。","label":"第一个差别"},{"t":"第二个差别（加权方式）：CPI 比较固定的一篮子物品与基年同一篮子的价格，劳工统计局只是偶尔改变篮子构成；GDP 平减指数比较现期生产的物品与服务和基年同样物品的价格，其组合随 GDP 构成的变动自动变动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第二个差别</strong>（加权方式）：CPI 比较固定的一篮子物品与基年同一篮子的价格，劳工统计局只是偶尔改变篮子构成；GDP 平减指数比较现期生产的物品与服务和基年同样物品的价格，其组合随 GDP 构成的变动自动变动。","label":"第二个差别"},{"t":"图形结论（图 24-2）：1965 年以来按两个指标衡量的通货膨胀率一般同时变动；不一致是例外而非常态——1979 年和 1980 年石油价格上升两倍以上时，CPI 衡量的通货膨胀率大大高于 GDP 平减指数衡量的通货膨胀率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>（图 24-2）：1965 年以来按两个指标衡量的通货膨胀率一般同时变动；不一致是例外而非常态——1979 年和 1980 年石油价格上升两倍以上时，CPI 衡量的通货膨胀率大大高于 GDP 平减指数衡量的通货膨胀率。","label":"图形结论"},{"t":"即问即答（要点并入）：CPI 衡量普通消费者购买的一篮子物品与服务的总费用，按固定篮子、找价格、算费用、选基年、算通胀率五步编制；它因替代偏向、新产品引进与质量变动无法衡量三个原因而不是生活费用的完美衡量指标。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答</strong>（要点并入）：CPI 衡量普通消费者购买的一篮子物品与服务的总费用，按固定篮子、找价格、算费用、选基年、算通胀率五步编制；它因替代偏向、新产品引进与质量变动无法衡量三个原因而不是生活费用的完美衡量指标。","label":"即问即答"}],"k":"b","i":1,"h":"24.1.3 GDP 平减指数与CPI","label":"24.1.3 GDP 平减指数与CPI"}],"k":"sec","i":0,"h":"24.1 消费物价指数","label":"24.1 消费物价指数"},{"t":"24.2 根据通货膨胀的影响校正经济变量","c":[{"t":"衡量经济中物价总水平的目的，是使我们能比较不同时期的美元数字。","c":[],"k":"b","i":1,"h":"衡量经济中物价总水平的目的，是使我们能比较不同时期的美元数字。","label":"衡量经济中物价总水平的目的，是使我们…"},{"t":"24.2.1 不同时期的美元数字","c":[{"t":"换算公式：今天的美元数字＝T 年的美元数字×（今天的物价水平÷T 年的物价水平）；CPI 之类的物价指数可以衡量物价水平，从而决定通货膨胀校正的大小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">换算公式</strong>：今天的美元数字＝T 年的美元数字×（今天的物价水平÷T 年的物价水平）；CPI 之类的物价指数可以衡量物价水平，从而决定通货膨胀校正的大小。","label":"换算公式"},{"t":"书中例（Babe Ruth 的薪水）：1931 年物价指数为 15.2、2015 年为 237，物价总水平上升约 15.6 倍（237÷15.2）；Ruth 的 8 万美元薪水按 2015 年美元计为 80000×(237÷15.2)≈124.7 万美元——不错，但仅相当于今天运动员平均薪水的 1/3、道奇队 Kershaw 薪水的 4%；胡佛总统的 7.5 万美元折合约 116.9 万美元，大大高于奥巴马的 40 万美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中例</strong>（Babe Ruth 的薪水）：1931 年物价指数为 15.2、2015 年为 237，物价总水平上升约 15.6 倍（237÷15.2）；Ruth 的 8 万美元薪水按 2015 年美元计为 80000×(237÷15.2)≈124.7 万美元——不错，但仅相当于今天运动员平均薪水的 1/3、道奇队 Kershaw 薪水的 4%；胡佛总统的 7.5 万美元折合约 116.9 万美元，大大高于奥巴马的 40 万美元。","label":"书中例（Babe Ruth 的薪水）…"},{"t":"参考资料「指数先生进入好莱坞」（要点并入）：按名义票房收入《星球大战：原力觉醒》（9.23 亿美元）居首；根据通货膨胀的影响校正后，《乱世佳人》（17.58 亿美元）第一，《星球大战：新希望》（15.5 亿美元）、《音乐之声》（12.39 亿美元）随后，《原力觉醒》降到第 11 位——1939 年票价只有 25 美分，通货膨胀使名义排名偏向近年的电影。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「指数先生进入好莱坞」</strong>（要点并入）：按名义票房收入《星球大战：原力觉醒》（9.23 亿美元）居首；根据通货膨胀的影响校正后，《乱世佳人》（17.58 亿美元）第一，《星球大战：新希望》（15.5 亿美元）、《音乐之声》（12.39 亿美元）随后，《原力觉醒》降到第 11 位——1939 年票价只有 25 美分，通货膨胀使名义排名偏向近年的电影。","label":"参考资料「指数先生进入好莱坞」"},{"t":"案例研究「生活费用的地区差别」（要点并入）：经济分析局用 CPI 数据编制\"地区价格等价\"，衡量州际生活费用差别（如同 CPI 衡量跨年差别）——2013 年纽约州生活费用是美国一般水平的 115.3%，密西西比州为 86.8%；食品衣服等可交易物品只解释小部分地区差别（地区贸易使价格趋同），难以运送的服务（尤其住房——建筑和土地不能移动）解释大部分差别（纽约房租几乎是密西西比州的两倍）；启示：比较不同地区的工作既要看薪水，也要看当地物品与服务特别是住房的价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「生活费用的地区差别」</strong>（要点并入）：经济分析局用 CPI 数据编制&quot;地区价格等价&quot;，衡量州际生活费用差别（如同 CPI 衡量跨年差别）——2013 年纽约州生活费用是美国一般水平的 115.3%，密西西比州为 86.8%；食品衣服等可交易物品只解释小部分地区差别（地区贸易使价格趋同），难以运送的服务（尤其住房——建筑和土地不能移动）解释大部分差别（纽约房租几乎是密西西比州的两倍）；启示：比较不同地区的工作既要看薪水，也要看当地物品与服务特别是住房的价格。","label":"案例研究「生活费用的地区差别」"}],"k":"b","i":1,"h":"24.2.1 不同时期的美元数字","label":"24.2.1 不同时期的美元数字"},{"t":"24.2.2 指数化","c":[{"t":"术语：指数化（indexation）——根据法律或合同按照通货膨胀的影响对货币数量的自动调整。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：指数化（indexation）——根据法律或合同按照通货膨胀的影响对货币数量的自动调整。","label":"术语：指数化（indexation）…"},{"t":"应用：企业与工会许多长期合同中工资根据 CPI 部分或全部指数化的条款称为生活费用津贴（cost-of-living allowance, COLA），CPI 上升时自动增加工资；社会保障补助每年根据物价上升调整；联邦所得税的税级（税率变动依据的收入水平）也按通货膨胀指数化；但税制中许多应按通胀指数化的内容并没有指数化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用</strong>：企业与工会许多长期合同中工资根据 CPI 部分或全部指数化的条款称为生活费用津贴（cost-of-living allowance, COLA），CPI 上升时自动增加工资；社会保障补助每年根据物价上升调整；联邦所得税的税级（税率变动依据的收入水平）也按通货膨胀指数化；但税制中许多应按通胀指数化的内容并没有指数化。","label":"应用：企业与工会许多长期合同中工资根…"}],"k":"b","i":1,"h":"24.2.2 指数化","label":"24.2.2 指数化"},{"t":"24.2.3 真实利率与名义利率","c":[{"t":"术语：名义利率（nominal interest rate）——通常公布的、未对通货膨胀的影响进行校正的利率，衡量随时间推移银行账户中美元数量增加得有多快。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：名义利率（nominal interest rate）——通常公布的、未对通货膨胀的影响进行校正的利率，衡量随时间推移银行账户中美元数量增加得有多快。","label":"术语：名义利率（nominal in…"},{"t":"术语：真实利率（real interest rate）——已对通货膨胀的影响进行校正的利率，衡量随时间推移美元购买力提高得有多快。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：真实利率（real interest rate）——已对通货膨胀的影响进行校正的利率，衡量随时间推移美元购买力提高得有多快。","label":"术语：真实利率（real inter…"},{"t":"关系式（接近成立）：真实利率＝名义利率－通货膨胀率，即真实利率是名义利率与通货膨胀率之间的差额。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关系式</strong>（接近成立）：真实利率＝名义利率－通货膨胀率，即真实利率是名义利率与通货膨胀率之间的差额。","label":"关系式（接近成立）：真实利率＝名义利…"},{"t":"书中例（Sally 存 1000 美元、年利率 10%，只买 10 美元一张的 DVD，存款相当于 100 张 DVD）：零通货膨胀时购买力上升 10%（可买 110 张）；通胀 6% 时约升 4%（约 104 张）；通胀 10% 时购买力不变（仍 100 张）；通胀 12% 时约降 2%（约 98 张）；通货紧缩 2% 时约升 12%（约 112 张）。结论：通货膨胀率越高购买力增加越少；通胀率大于利率时购买力实际下降；存在通货紧缩（负通胀率）时购买力上升幅度大于利率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中例</strong>（Sally 存 1000 美元、年利率 10%，只买 10 美元一张的 DVD，存款相当于 100 张 DVD）：零通货膨胀时购买力上升 10%（可买 110 张）；通胀 6% 时约升 4%（约 104 张）；通胀 10% 时购买力不变（仍 100 张）；通胀 12% 时约降 2%（约 98 张）；通货紧缩 2% 时约升 12%（约 112 张）。结论：通货膨胀率越高购买力增加越少；通胀率大于利率时购买力实际下降；存在通货紧缩（负通胀率）时购买力上升幅度大于利率。","label":"书中例（Sally 存 1000 美…"},{"t":"案例研究「美国经济中的利率」（要点并入）：1965 年以来名义利率（3 个月期国库券利率）几乎总是大于真实利率，反映美国经济每年都经历消费物价上升；在通货紧缩时期（19 世纪后期的美国、近年的日本），真实利率大于名义利率；由于通货膨胀是变动的，二者并不总同时变动——20 世纪 70 年代后期名义利率很高但通胀率极高，真实利率低甚至为负；90 年代后期名义利率较低但通胀更低，真实利率反而更高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「美国经济中的利率」</strong>（要点并入）：1965 年以来名义利率（3 个月期国库券利率）几乎总是大于真实利率，反映美国经济每年都经历消费物价上升；在通货紧缩时期（19 世纪后期的美国、近年的日本），真实利率大于名义利率；由于通货膨胀是变动的，二者并不总同时变动——20 世纪 70 年代后期名义利率很高但通胀率极高，真实利率低甚至为负；90 年代后期名义利率较低但通胀更低，真实利率反而更高。","label":"案例研究「美国经济中的利率」"},{"t":"即问即答（要点并入）：1914 年福特日工资 5 美元、当年 CPI 为 10，2012 年 CPI 为 230，按 2012 年美元计为 5×(230÷10)＝115 美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答</strong>（要点并入）：1914 年福特日工资 5 美元、当年 CPI 为 10，2012 年 CPI 为 230，按 2012 年美元计为 5×(230÷10)＝115 美元。","label":"即问即答"}],"k":"b","i":1,"h":"24.2.3 真实利率与名义利率","label":"24.2.3 真实利率与名义利率"}],"k":"sec","i":0,"h":"24.2 根据通货膨胀的影响校正经济变量","label":"24.2 根据通货膨胀的影响校正经济变量"},{"t":"24.3 结论","c":[{"t":"物价总水平的持续上升已成惯例，这种通货膨胀一直在降低每单位货币的购买力；比较不同时期的美元数字时，要牢记今天的 1 美元不同于 20 年前（也很可能不同于 20 年后）的 1 美元。","c":[],"k":"b","i":1,"h":"物价总水平的持续上升已成惯例，这种通货膨胀一直在降低每单位货币的购买力；比较不同时期的美元数字时，要牢记今天的 1 美元不同于 20 年前（也很可能不同于 20 年后）的 1 美元。","label":"物价总水平的持续上升已成惯例，这种通…"},{"t":"物价指数使我们能比较不同时点的美元，为后续分析奠定基础：接下来先研究长期中真实 GDP 及储蓄、投资、真实利率、失业等变量的决定因素，再考察长期中物价水平与货币供给、通货膨胀、名义利率等变量的决定因素，最后研究真实 GDP 与物价水平的短期波动。","c":[],"k":"b","i":1,"h":"物价指数使我们能比较不同时点的美元，为后续分析奠定基础：接下来先研究长期中真实 GDP 及储蓄、投资、真实利率、失业等变量的决定因素，再考察长期中物价水平与货币供给、通货膨胀、名义利率等变量的决定因素，最后研究真实 GDP 与物价水平的短期波动。","label":"物价指数使我们能比较不同时点的美元，…"}],"k":"sec","i":0,"h":"24.3 结论","label":"24.3 结论"}],"k":"chap","h":"第24章 生活费用的衡量","label":"第24章 生活费用的衡量"}],"k":"part","h":"第8篇 宏观经济学的数据","label":"第8篇 宏观经济学的数据","col":"#4f6df5","pc":"p1"},{"t":"第9篇 长期中的真实经济","c":[{"t":"第25章 生产与增长","c":[{"t":"本章内容提要","c":[{"t":"按人均 GDP 衡量的经济繁荣在世界各国差别很大：世界上最富裕国家的平均收入是最贫穷国家的十倍以上；真实 GDP 增长率的差别也很大，各国的相对地位一直在急剧变动。","c":[],"k":"b","i":1,"h":"按人均 GDP 衡量的经济繁荣在世界各国差别很大：世界上最富裕国家的平均收入是最贫穷国家的十倍以上；真实 GDP 增长率的差别也很大，各国的相对地位一直在急剧变动。","label":"按人均 GDP 衡量的经济繁荣在世界各国差别很大"},{"t":"一个经济的生活水平取决于其生产物品与服务的能力；几乎所有生活水平的差别都可归因于生产率——每单位劳动投入所生产的物品与服务的数量。","c":[],"k":"b","i":1,"h":"一个经济的生活水平取决于其生产物品与服务的能力；几乎所有生活水平的差别都可归因于生产率——每单位劳动投入所生产的物品与服务的数量。","label":"一个经济的生活水平取决于其生产物品与…"},{"t":"生产率取决于四个因素：物质资本（人均）、人力资本（人均）、自然资源（人均）与技术知识；规模收益不变的生产函数 Y＝AF(L,K,H,N) 可改写为 Y/L＝AF(1,K/L,H/L,N/L)，是四大决定因素的数学概括。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">生产率取决于四个因素</strong>：物质资本（人均）、人力资本（人均）、自然资源（人均）与技术知识；规模收益不变的生产函数 Y＝AF(L,K,H,N) 可改写为 Y/L＝AF(1,K/L,H/L,N/L)，是四大决定因素的数学概括。","label":"生产率取决于四个因素"},{"t":"政府政策能以许多方式影响经济增长率：鼓励储蓄和投资、鼓励来自国外的投资、促进教育、促进健康、维护产权和政治稳定、允许自由贸易、促进新技术的研究与开发。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">政府政策能以许多方式影响经济增长率</strong>：鼓励储蓄和投资、鼓励来自国外的投资、促进教育、促进健康、维护产权和政治稳定、允许自由贸易、促进新技术的研究与开发。","label":"政府政策能以许多方式影响经济增长率"},{"t":"资本积累服从收益递减规律：高储蓄只会引起一段时间的高增长，长期中提高的是生产率与收入水平而非增长率；由于追赶效应，开始时较穷的国家（其他条件相同）增长更快。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">资本积累服从收益递减规律</strong>：高储蓄只会引起一段时间的高增长，长期中提高的是生产率与收入水平而非增长率；由于追赶效应，开始时较穷的国家（其他条件相同）增长更快。","label":"资本积累服从收益递减规律"},{"t":"人口增长的影响是多方面的：使自然资源供给紧张、稀释人均资本存量，但也因产生更多科学家和发明家而促进技术进步。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">人口增长的影响是多方面的</strong>：使自然资源供给紧张、稀释人均资本存量，但也因产生更多科学家和发明家而促进技术进步。","label":"人口增长的影响是多方面的"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"25.1 世界各国的经济增长","c":[{"t":"富国（美国、日本、德国）人均收入约为穷国（印度、尼日利亚、尼加拉瓜）的十倍左右，反映在营养、住房、医疗、预期寿命和汽车、电视机、电脑拥有量的差别上。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">富国</strong>（美国、日本、德国）人均收入约为穷国（印度、尼日利亚、尼加拉瓜）的十倍左右，反映在营养、住房、医疗、预期寿命和汽车、电视机、电脑拥有量的差别上。","label":"富国（美国、日本、德国）人均收入约为…"},{"t":"一国内生活水平也随时间巨变：过去一个世纪美国按人均真实 GDP 衡量的人均收入每年增长约 2%，意味着人均收入每 35 年翻一番，普通美国人比其父辈、祖辈富裕得多。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">一国内生活水平也随时间巨变</strong>：过去一个世纪美国按人均真实 GDP 衡量的人均收入每年增长约 2%，意味着人均收入每 35 年翻一番，普通美国人比其父辈、祖辈富裕得多。","label":"一国内生活水平也随时间巨变"},{"t":"国与国增长率差别很大：2000—2014 年中国人均 GDP 每年以约 11% 的速度增长（累计增长 357%），一代人时间即可从最穷国家之列跻身较富国家之列；同期津巴布韦人均 GDP 累计下降 13%。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">国与国增长率差别很大</strong>：2000—2014 年中国人均 GDP 每年以约 11% 的速度增长（累计增长 357%），一代人时间即可从最穷国家之列跻身较富国家之列；同期津巴布韦人均 GDP 累计下降 13%。","label":"国与国增长率差别很大"},{"t":"表 25-1（13 国、一个多世纪的人均真实 GDP 数据）要点：2014 年美国人均真实 GDP（55860 美元）约为中国（13170 美元）的 4 倍、印度（5630 美元）的 10 倍；2014 年普通巴基斯坦人的水平与 1870 年普通英国人大致相同；按年增长率从高到低排序，巴西（2.61%）、日本（2.59%）、中国（2.53%）居前（分别从穷国或中等收入国家迈向更富），美国 1870—2014 年年增 1.80%，巴基斯坦、孟加拉国、英国居末（1870 年曾为世界最富的英国，如今人均真实 GDP 比美国低 30%）——最富的国家不一定永远最富，最穷的国家也不一定永远贫穷。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">表 25-1</strong>（13 国、一个多世纪的人均真实 GDP 数据）要点：2014 年美国人均真实 GDP（55860 美元）约为中国（13170 美元）的 4 倍、印度（5630 美元）的 10 倍；2014 年普通巴基斯坦人的水平与 1870 年普通英国人大致相同；按年增长率从高到低排序，巴西（2.61%）、日本（2.59%）、中国（2.53%）居前（分别从穷国或中等收入国家迈向更富），美国 1870—2014 年年增 1.80%，巴基斯坦、孟加拉国、英国居末（1870 年曾为世界最富的英国，如今人均真实 GDP 比美国低 30%）——最富的国家不一定永远最富，最穷的国家也不一定永远贫穷。","label":"表 25-1"},{"t":"即问即答（要点并入）：美国人均真实 GDP 长期年均增长率约为 2%；增长更快的国家如中国、巴西、日本，更慢的如孟加拉国、英国、巴基斯坦。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答</strong>（要点并入）：美国人均真实 GDP 长期年均增长率约为 2%；增长更快的国家如中国、巴西、日本，更慢的如孟加拉国、英国、巴基斯坦。","label":"即问即答"},{"t":"参考资料「你比最富的美国人还富吗」（要点并入）：史上最富的美国人洛克菲勒财富折合约 2000 亿美元（约为比尔·盖茨的三倍），却享受不到电视、电子游戏、互联网、空调、汽车、飞机、电话和抗生素等现代便利；这呼应上一章的衡量问题——物价指数无法充分反映新物品的发明，因此通货膨胀率被高估、真实经济增长率被低估；由于巨大的技术进步，今天普通美国人大概比一个世纪以前最富的美国人还富。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料「你比最富的美国人还富吗」</strong>（要点并入）：史上最富的美国人洛克菲勒财富折合约 2000 亿美元（约为比尔·盖茨的三倍），却享受不到电视、电子游戏、互联网、空调、汽车、飞机、电话和抗生素等现代便利；这呼应上一章的衡量问题——物价指数无法充分反映新物品的发明，因此通货膨胀率被高估、真实经济增长率被低估；由于巨大的技术进步，今天普通美国人大概比一个世纪以前最富的美国人还富。","label":"参考资料「你比最富的美国人还富吗」"}],"k":"sec","i":0,"h":"25.1 世界各国的经济增长","label":"25.1 世界各国的经济增长"},{"t":"25.2 生产率：作用及决定因素","c":[{"t":"术语：生产率（productivity）——每单位劳动投入所生产的物品与服务的数量。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：生产率（productivity）——每单位劳动投入所生产的物品与服务的数量。","label":"术语：生产率（productivit…"},{"t":"25.2.1 为什么生产率如此重要","c":[{"t":"鲁滨孙·克鲁索经济（简单模型）：克鲁索独自捕鱼、种菜、缝衣，只能消费自己生产的东西，故其生活水平与生产率密切相关；找到更好的捕鱼地（生产率提高）使他的状况变好——可以吃更多鱼，或缩减捕鱼时间而把更多时间用于制造其他享用的物品。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">鲁滨孙·克鲁索经济</strong>（简单模型）：克鲁索独自捕鱼、种菜、缝衣，只能消费自己生产的东西，故其生活水平与生产率密切相关；找到更好的捕鱼地（生产率提高）使他的状况变好——可以吃更多鱼，或缩减捕鱼时间而把更多时间用于制造其他享用的物品。","label":"鲁滨孙·克鲁索经济"},{"t":"对一国同样成立：一个经济的 GDP 同时衡量经济中所有人赚到的总收入和用于物品与服务产出的总支出（对整体经济二者必然相等，一个经济的收入就是该经济的产出）；一国只有生产出大量物品与服务，人们才能享有更高的生活水平——美国人比尼日利亚人生活好，因为美国工人生产率更高；日本人生活水平提高快于阿根廷人，因为日本工人生产率提高更迅速。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对一国同样成立</strong>：一个经济的 GDP 同时衡量经济中所有人赚到的总收入和用于物品与服务产出的总支出（对整体经济二者必然相等，一个经济的收入就是该经济的产出）；一国只有生产出大量物品与服务，人们才能享有更高的生活水平——美国人比尼日利亚人生活好，因为美国工人生产率更高；日本人生活水平提高快于阿根廷人，因为日本工人生产率提高更迅速。","label":"对一国同样成立"},{"t":"这正是经济学十大原理之一：一国的生活水平取决于它生产物品与服务的能力；说明生活水平与生产率的联系只是第一步，还要回答为什么一些经济在生产物品与服务方面强得多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">这正是经济学十大原理之一</strong>：一国的生活水平取决于它生产物品与服务的能力；说明生活水平与生产率的联系只是第一步，还要回答为什么一些经济在生产物品与服务方面强得多。","label":"这正是经济学十大原理之一"},{"t":"参考资料「一张图片顶一千个统计数字」（要点并入）：三个普通家庭与全部物质财产的合影显示生活水平差别——英国人均收入 39040 美元（1000 个儿童中 4 个 5 岁前死亡，几乎人人拥有现代卫生设施，60% 适龄人口接受高等教育）；墨西哥 16640 美元（13 个死亡，85% 有卫生设施，30% 高等教育）；马里 1510 美元（115 个死亡，25% 有卫生设施，7% 高等教育）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「一张图片顶一千个统计数字」</strong>（要点并入）：三个普通家庭与全部物质财产的合影显示生活水平差别——英国人均收入 39040 美元（1000 个儿童中 4 个 5 岁前死亡，几乎人人拥有现代卫生设施，60% 适龄人口接受高等教育）；墨西哥 16640 美元（13 个死亡，85% 有卫生设施，30% 高等教育）；马里 1510 美元（115 个死亡，25% 有卫生设施，7% 高等教育）。","label":"参考资料「一张图片顶一千个统计数字」"}],"k":"b","i":1,"h":"25.2.1 为什么生产率如此重要","label":"25.2.1 为什么生产率如此重要"},{"t":"25.2.2 生产率是如何决定的","c":[{"t":"决定因素一：人均物质资本（用工具工作的工人生产率更高）","c":[{"t":"术语：物质资本（physical capital）——用于生产物品与服务的设备和建筑物存量，或简称为资本（木工用的锯、车床、电钻；设备越精密越专业化，产出越多越快）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">术语</strong>：物质资本（physical capital）——用于生产物品与服务的设备和建筑物存量，或简称为资本（木工用的锯、车床、电钻；设备越精密越专业化，产出越多越快）。","label":"术语：物质资本（physical c…"},{"t":"资本的重要特征是它是一种生产出来的生产要素：既是生产过程的投入，又是过去生产过程的产出（车床本身是车床制造企业的产出，后者又用其他设备生产）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">资本的重要特征是它是一种生产出来的生产要素</strong>：既是生产过程的投入，又是过去生产过程的产出（车床本身是车床制造企业的产出，后者又用其他设备生产）。","label":"资本的重要特征是它是一种生产出来的生产要素"}],"k":"b","i":2,"h":"<strong class=\"lead\">决定因素一</strong>：人均物质资本（用工具工作的工人生产率更高）","label":"决定因素一"},{"t":"决定因素二：人均人力资本","c":[{"t":"术语：人力资本（human capital）——工人通过教育、培训和经验而获得的知识与技能，涵盖早期儿童教育、小学、中学、大学和在职培训中积累的技能。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">术语</strong>：人力资本（human capital）——工人通过教育、培训和经验而获得的知识与技能，涵盖早期儿童教育、小学、中学、大学和在职培训中积累的技能。","label":"术语：人力资本（human capi…"},{"t":"人力资本与物质资本类似：提高一国生产物品与服务的能力，也是一种生产出来的生产要素，其生产需要教师、图书馆和学生时间等投入品（可以把学生看作生产未来人力资本的\"工人\"）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">人力资本与物质资本类似</strong>：提高一国生产物品与服务的能力，也是一种生产出来的生产要素，其生产需要教师、图书馆和学生时间等投入品（可以把学生看作生产未来人力资本的&quot;工人&quot;）。","label":"人力资本与物质资本类似"}],"k":"b","i":2,"h":"<strong class=\"lead\">决定因素二</strong>：人均人力资本","label":"决定因素二"},{"t":"决定因素三：人均自然资源","c":[{"t":"术语：自然资源（natural resources）——由自然界提供的用于生产物品与服务的投入品，如土地、河流和矿藏；有两种形式——可再生资源（森林，伐倒后可再种）与不可再生资源（石油，自然界数百万年形成、供给有限，枯竭后不可再创造）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">术语</strong>：自然资源（natural resources）——由自然界提供的用于生产物品与服务的投入品，如土地、河流和矿藏；有两种形式——可再生资源（森林，伐倒后可再种）与不可再生资源（石油，自然界数百万年形成、供给有限，枯竭后不可再创造）。","label":"术语：自然资源（natural re…"},{"t":"自然资源的差别引起各国生活水平的一些差别（美国历史上成功部分得益于大量适于农耕的土地；科威特、沙特阿拉伯富有是因为位于世界最大储油区），但它并不是一个经济具有高生产率的必要条件：日本自然资源不多却是最富裕国家之一，靠国际贸易进口石油等所需资源、向资源丰富经济出口制成品。","c":[],"k":"b","i":3,"h":"自然资源的差别引起各国生活水平的一些差别（美国历史上成功部分得益于大量适于农耕的土地；科威特、沙特阿拉伯富有是因为位于世界最大储油区），但它并不是一个经济具有高生产率的必要条件：日本自然资源不多却是最富裕国家之一，靠国际贸易进口石油等所需资源、向资源丰富经济出口制成品。","label":"自然资源的差别引起各国生活水平的一些差别"}],"k":"b","i":2,"h":"<strong class=\"lead\">决定因素三</strong>：人均自然资源","label":"决定因素三"},{"t":"决定因素四：技术知识","c":[{"t":"术语：技术知识（technological knowledge）——关于生产物品与服务的最好方法的知识（农业技术进步使少数人即可生产足以养活全国的食物，更多劳动力转而生产其他物品与服务）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">术语</strong>：技术知识（technological knowledge）——关于生产物品与服务的最好方法的知识（农业技术进步使少数人即可生产足以养活全国的食物，更多劳动力转而生产其他物品与服务）。","label":"术语：技术知识（technologi…"},{"t":"技术知识的形式：公共知识（亨利·福特引进装配线后其他汽车厂商很快模仿）；私人拥有的知识（只有可口可乐公司知道其秘方）；短期由私人拥有（专利制度赋予制药公司暂时排他生产权，期满后其他公司可生产）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">技术知识的形式</strong>：公共知识（亨利·福特引进装配线后其他汽车厂商很快模仿）；私人拥有的知识（只有可口可乐公司知道其秘方）；短期由私人拥有（专利制度赋予制药公司暂时排他生产权，期满后其他公司可生产）。","label":"技术知识的形式"},{"t":"技术知识与人力资本的区别：技术知识是社会关于世界如何运行的知识，人力资本是把这种知识传递给劳动力的资源消耗——知识是社会教科书的质量，人力资本是人们用于阅读这本教科书的时间量；工人生产率既取决于教科书的质量，又取决于阅读它的时间。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">技术知识与人力资本的区别</strong>：技术知识是社会关于世界如何运行的知识，人力资本是把这种知识传递给劳动力的资源消耗——知识是社会教科书的质量，人力资本是人们用于阅读这本教科书的时间量；工人生产率既取决于教科书的质量，又取决于阅读它的时间。","label":"技术知识与人力资本的区别"}],"k":"b","i":2,"h":"<strong class=\"lead\">决定因素四</strong>：技术知识","label":"决定因素四"},{"t":"参考资料「生产函数」（模型展开）：","c":[{"t":"生产函数描述生产中所用的投入量与产出量的关系：Y＝AF(L,K,H,N)，其中 Y 为产量、L 为劳动量、K 为物质资本量、H 为人力资本量、N 为自然资源量，F() 表示这些投入如何结合以生产产出；A 是表示可得到的生产技术的变量，A 随技术进步而上升，使经济用既定投入组合获得更多产量。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">生产函数描述生产中所用的投入量与产出量的关系</strong>：Y＝AF(L,K,H,N)，其中 Y 为产量、L 为劳动量、K 为物质资本量、H 为人力资本量、N 为自然资源量，F() 表示这些投入如何结合以生产产出；A 是表示可得到的生产技术的变量，A 随技术进步而上升，使经济用既定投入组合获得更多产量。","label":"生产函数描述生产中所用的投入量与产出量的关系"},{"t":"规模收益不变：如果所有投入翻一番，产出也翻一番；数学上对任意正数 x，xY＝AF(xL,xK,xH,xN)。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">规模收益不变</strong>：如果所有投入翻一番，产出也翻一番；数学上对任意正数 x，xY＝AF(xL,xK,xH,xN)。","label":"规模收益不变"},{"t":"令 x＝1/L，得 Y/L＝AF(1,K/L,H/L,N/L)：Y/L 是每个工人的产量，即生产率的衡量指标；该式说明生产率取决于人均物质资本（K/L）、人均人力资本（H/L）、人均自然资源（N/L）以及用 A 代表的技术状况——生产率四大决定因素的数学概括。","c":[],"k":"b","i":3,"h":"令 x＝1/L，得 Y/L＝AF(1,K/L,H/L,N/L)：Y/L 是每个工人的产量，即生产率的衡量指标；该式说明生产率取决于人均物质资本（K/L）、人均人力资本（H/L）、人均自然资源（N/L）以及用 A 代表的技术状况——生产率四大决定因素的数学概括。","label":"令 x＝1/L，得 Y/L＝AF"}],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「生产函数」</strong>（模型展开）：","label":"参考资料「生产函数」"},{"t":"案例研究「自然资源是增长的限制因素吗」（要点并入）：许多评论家认为固定的不可再生资源供给最终会限制增长（石油、矿藏耗尽时增长停止甚至生活水平下降），但大多数经济学家并不那样关注这种限制——技术进步提供避免限制的方法：现代汽车耗油更少、新住房隔热更好、采油浪费更少、资源回收使不可再生资源重复利用、乙醇等替代燃料用可再生资源代替不可再生资源；历史上塑料取代锡制造食物容器、以沙子为原料的光导纤维取代铜电话线。检验方法看市场价格（市场经济中稀缺性反映在价格上）：自然资源价格有大的短期波动，但长期中大多数（按总体通货膨胀调整后的）价格是稳定的或下降的，说明保存资源能力的提高快于供给的减少——没有理由相信自然资源是经济增长的限制。","c":[],"k":"b","i":2,"h":"案例研究「自然资源是增长的限制因素吗」（要点并入）：许多评论家认为固定的不可再生资源供给最终会限制增长（石油、矿藏耗尽时增长停止甚至生活水平下降），但大多数经济学家并不那样关注这种限制——技术进步提供避免限制的方法：现代汽车耗油更少、新住房隔热更好、采油浪费更少、资源回收使不可再生资源重复利用、乙醇等替代燃料用可再生资源代替不可再生资源；历史上塑料取代锡制造食物容器、以沙子为原料的光导纤维取代铜电话线。检验方法看市场价格（市场经济中稀缺性反映在价格上）：自然资源价格有大的短期波动，但长期中大多数（按总体通货膨胀调整后的）价格是稳定的或下降的，说明保存资源能力的提高快于供给的减少——没有理由相信自然资源是经济增长的限制。","label":"案例研究「自然资源是增长的限制因素吗」"},{"t":"即问即答（要点并入）：生产率的四个决定因素——物质资本（工具、设备、建筑物）、人力资本（知识与技能）、自然资源（土地、河流、矿藏）、技术知识（生产物品与服务的最好方法）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答</strong>（要点并入）：生产率的四个决定因素——物质资本（工具、设备、建筑物）、人力资本（知识与技能）、自然资源（土地、河流、矿藏）、技术知识（生产物品与服务的最好方法）。","label":"即问即答"}],"k":"b","i":1,"h":"25.2.2 生产率是如何决定的","label":"25.2.2 生产率是如何决定的"}],"k":"sec","i":0,"h":"<strong class=\"lead\">25.2 生产率</strong>：作用及决定因素","label":"25.2 生产率"},{"t":"25.3 经济增长和公共政策","c":[{"t":"25.3.1 储蓄和投资","c":[{"t":"资本是生产出来的生产要素，社会可以改变它拥有的资本量：今天生产大量新资本品，明天就拥有大量资本存量并生产更多物品与服务——提高未来生产率的一种方法是把更多现期资源投资于资本的生产。","c":[],"k":"b","i":2,"h":"资本是生产出来的生产要素，社会可以改变它拥有的资本量：今天生产大量新资本品，明天就拥有大量资本存量并生产更多物品与服务——提高未来生产率的一种方法是把更多现期资源投资于资本的生产。","label":"资本是生产出来的生产要素，社会可以改…"},{"t":"权衡取舍（经济学十大原理之一）：资源稀缺，更多资源用于生产资本就要求较少资源用于生产现期消费品；社会更多投资于资本，就必然少消费并把更多现期收入储蓄起来——由资本积累引起的增长不是免费的午餐，它要求牺牲现期消费以换取未来更多消费。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">权衡取舍</strong>（经济学十大原理之一）：资源稀缺，更多资源用于生产资本就要求较少资源用于生产现期消费品；社会更多投资于资本，就必然少消费并把更多现期收入储蓄起来——由资本积累引起的增长不是免费的午餐，它要求牺牲现期消费以换取未来更多消费。","label":"权衡取舍"},{"t":"鼓励储蓄和投资是政府促进增长、长期中提高生活水平的一种方法（金融市场如何协调储蓄与投资及政策影响留待下一章）。","c":[],"k":"b","i":2,"h":"鼓励储蓄和投资是政府促进增长、长期中提高生活水平的一种方法（金融市场如何协调储蓄与投资及政策影响留待下一章）。","label":"鼓励储蓄和投资是政府促进增长、长期中…"}],"k":"b","i":1,"h":"25.3.1 储蓄和投资","label":"25.3.1 储蓄和投资"},{"t":"25.3.2 收益递减和追赶效应","c":[{"t":"术语：收益递减（diminishing returns）——随着投入量的增加，每一单位额外投入得到的收益减小的特性；当工人已经用大量资本存量生产时，再增加一单位资本所提高的生产率是微小的（图形结论：在人力资本、自然资源和技术知识不变时，人均产量随人均资本增加而增加，但曲线越来越平坦）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：收益递减（diminishing returns）——随着投入量的增加，每一单位额外投入得到的收益减小的特性；当工人已经用大量资本存量生产时，再增加一单位资本所提高的生产率是微小的（图形结论：在人力资本、自然资源和技术知识不变时，人均产量随人均资本增加而增加，但曲线越来越平坦）。","label":"术语：收益递减（diminishin…"},{"t":"含义一：由于收益递减，储蓄率上升所引起的高增长只是暂时的——更高储蓄带来更多资本积累，但从增加的资本中得到的收益随时间减少，增长因此放缓；长期中，储蓄率的上升引起生产率和收入水平的上升，但不会引起这些变量增长率的提高；不过达到长期可能需数十年，其间提高储蓄率可引起相当高的增长。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">含义一</strong>：由于收益递减，储蓄率上升所引起的高增长只是暂时的——更高储蓄带来更多资本积累，但从增加的资本中得到的收益随时间减少，增长因此放缓；长期中，储蓄率的上升引起生产率和收入水平的上升，但不会引起这些变量增长率的提高；不过达到长期可能需数十年，其间提高储蓄率可引起相当高的增长。","label":"含义一：由于收益递减，储蓄率上升所引…"},{"t":"术语：追赶效应（catch-up effect）——开始时贫穷的国家倾向于比开始时富裕的国家增长更快的特征；穷国工人缺乏最原始的工具，少量资本投资即可大大提高其生产率，富国人均资本已很高，增量资本影响较小（控制投资占 GDP 百分比等变量后，穷国往往增长得比富国快）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：追赶效应（catch-up effect）——开始时贫穷的国家倾向于比开始时富裕的国家增长更快的特征；穷国工人缺乏最原始的工具，少量资本投资即可大大提高其生产率，富国人均资本已很高，增量资本影响较小（控制投资占 GDP 百分比等变量后，穷国往往增长得比富国快）。","label":"术语：追赶效应（catch-up e…"},{"t":"书中例：1960—1990 年美国和韩国用于投资的 GDP 份额相似，但美国只有约 2% 的适度增长，韩国以超过 6% 的速度增长；1960 年韩国人均 GDP 不到美国的 1/10（初始资本存量极少），资本积累的收益大得多。类比：学校\"进步最大\"奖往往颁给年初成绩较差的学生——起点既定时\"进步最大\"是好的，但成为\"最好的学生\"更好；韩国增长快于美国，但人均 GDP 仍低于美国。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中例</strong>：1960—1990 年美国和韩国用于投资的 GDP 份额相似，但美国只有约 2% 的适度增长，韩国以超过 6% 的速度增长；1960 年韩国人均 GDP 不到美国的 1/10（初始资本存量极少），资本积累的收益大得多。类比：学校&quot;进步最大&quot;奖往往颁给年初成绩较差的学生——起点既定时&quot;进步最大&quot;是好的，但成为&quot;最好的学生&quot;更好；韩国增长快于美国，但人均 GDP 仍低于美国。","label":"书中例：1960—1990 年美国和…"}],"k":"b","i":1,"h":"25.3.2 收益递减和追赶效应","label":"25.3.2 收益递减和追赶效应"},{"t":"25.3.3 来自国外的投资","c":[{"t":"外国直接投资：由外国实体拥有并经营的资本投资（福特汽车公司在墨西哥建汽车厂）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">外国直接投资</strong>：由外国实体拥有并经营的资本投资（福特汽车公司在墨西哥建汽车厂）。","label":"外国直接投资"},{"t":"外国有价证券投资：用外国货币筹资、但由国内居民经营的投资（美国人购买墨西哥公司股票，公司用卖股票收入建新工厂）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">外国有价证券投资</strong>：用外国货币筹资、但由国内居民经营的投资（美国人购买墨西哥公司股票，公司用卖股票收入建新工厂）。","label":"外国有价证券投资"},{"t":"两种方式都相当于用外国人的储蓄为东道国的投资筹资：外资增加一国资本存量、提高生产率和工资水平（即使部分收益以利润形式流回外国所有者），也是穷国学习富国开发并运用先进技术的方式；故许多经济学家提倡鼓励来自国外投资的政策，往往意味着取消政府对外国人拥有国内资本的限制。","c":[],"k":"b","i":2,"h":"两种方式都相当于用外国人的储蓄为东道国的投资筹资：外资增加一国资本存量、提高生产率和工资水平（即使部分收益以利润形式流回外国所有者），也是穷国学习富国开发并运用先进技术的方式；故许多经济学家提倡鼓励来自国外投资的政策，往往意味着取消政府对外国人拥有国内资本的限制。","label":"两种方式都相当于用外国人的储蓄为东道国的投资筹资"},{"t":"对 GDP 与 GNP 的影响不同：GDP 衡量本国公民和非本国公民在国内赚到的收入，GNP 衡量一国公民在国内外赚到的收入；福特在墨西哥的工厂使墨西哥 GDP 的增加大于墨西哥人收入（GNP）的增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对 GDP 与 GNP 的影响不同</strong>：GDP 衡量本国公民和非本国公民在国内赚到的收入，GNP 衡量一国公民在国内外赚到的收入；福特在墨西哥的工厂使墨西哥 GDP 的增加大于墨西哥人收入（GNP）的增加。","label":"对 GDP 与 GNP 的影响不同"},{"t":"世界银行：从美国等发达国家获得资金，向欠发达国家发放贷款投资于道路、排水系统、学校等资本并提供咨询；它与国际货币基金组织同为二战后建立——战争教训是经济不景气往往引起政治动乱、国际局势紧张和军事冲突，每个国家都应关心和促进世界各国的经济繁荣。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">世界银行</strong>：从美国等发达国家获得资金，向欠发达国家发放贷款投资于道路、排水系统、学校等资本并提供咨询；它与国际货币基金组织同为二战后建立——战争教训是经济不景气往往引起政治动乱、国际局势紧张和军事冲突，每个国家都应关心和促进世界各国的经济繁荣。","label":"世界银行"}],"k":"b","i":1,"h":"25.3.3 来自国外的投资","label":"25.3.3 来自国外的投资"},{"t":"25.3.4 教育","c":[{"t":"教育（人力资本投资）对一国长期经济繁荣至少和物质资本投资同样重要：美国历史上每年学校教育平均使人的工资增加约 10%；在人力资本特别稀缺的欠发达国家，受过教育与未受过教育工人的工资差距更大——提供好学校并鼓励人们利用，是政府提高生活水平的一种方法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">教育</strong>（人力资本投资）对一国长期经济繁荣至少和物质资本投资同样重要：美国历史上每年学校教育平均使人的工资增加约 10%；在人力资本特别稀缺的欠发达国家，受过教育与未受过教育工人的工资差距更大——提供好学校并鼓励人们利用，是政府提高生活水平的一种方法。","label":"教育（人力资本投资）对一国长期经济繁…"},{"t":"人力资本投资与物质资本投资一样有机会成本：学生上学放弃了本可以作为劳动力赚到的收入；穷国教育收益虽高，儿童却常因需劳动帮助养家而早早退学。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人力资本投资与物质资本投资一样有机会成本</strong>：学生上学放弃了本可以作为劳动力赚到的收入；穷国教育收益虽高，儿童却常因需劳动帮助养家而早早退学。","label":"人力资本投资与物质资本投资一样有机会成本"},{"t":"人力资本带来正外部性（一个人的行为对旁观者福利的影响）：受过教育的人会产生关于如何最好生产物品与服务的新思想，这些思想进入社会知识宝库供每个人利用，学校教育的社会收益远大于个人收益——这是以公共教育形式大量补贴人力资本投资的理由。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人力资本带来正外部性</strong>（一个人的行为对旁观者福利的影响）：受过教育的人会产生关于如何最好生产物品与服务的新思想，这些思想进入社会知识宝库供每个人利用，学校教育的社会收益远大于个人收益——这是以公共教育形式大量补贴人力资本投资的理由。","label":"人力资本带来正外部性"},{"t":"穷国面临人才外流问题：许多受过高等教育的工人移民富国以享更高生活水平；若人力资本有正外部性，人才外流使留下的人更穷，决策者进退两难。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">穷国面临人才外流问题</strong>：许多受过高等教育的工人移民富国以享更高生活水平；若人力资本有正外部性，人才外流使留下的人更穷，决策者进退两难。","label":"穷国面临人才外流问题"}],"k":"b","i":1,"h":"25.3.4 教育","label":"25.3.4 教育"},{"t":"25.3.5 健康与营养","c":[{"t":"人力资本也包括对人口健康的投资：其他条件相同时，更健康的工人生产率更高——对人口健康的适当投资是一国提高生产率和生活水平的一种方法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人力资本也包括对人口健康的投资</strong>：其他条件相同时，更健康的工人生产率更高——对人口健康的适当投资是一国提高生产率和生活水平的一种方法。","label":"人力资本也包括对人口健康的投资"},{"t":"福格尔（Robert Fogel，1993 年诺贝尔经济学奖）的研究：更好的营养改善人口健康是长期经济增长的重要因素——1780 年英国约有 1/5 的人营养不良到不能从事体力劳动；1775—1975 年英国人均热量摄入增加 26%、男性平均身高增加约 9 厘米，1962—1995 年韩国经济快速增长期间人均热量摄入增加 44%、身高增约 5 厘米；其结论是\"总体营养状况的改善对英国 1790—1980 年间人均收入增长的贡献率约为 30%\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">福格尔</strong>（Robert Fogel，1993 年诺贝尔经济学奖）的研究：更好的营养改善人口健康是长期经济增长的重要因素——1780 年英国约有 1/5 的人营养不良到不能从事体力劳动；1775—1975 年英国人均热量摄入增加 26%、男性平均身高增加约 9 厘米，1962—1995 年韩国经济快速增长期间人均热量摄入增加 44%、身高增约 5 厘米；其结论是&quot;总体营养状况的改善对英国 1790—1980 年间人均收入增长的贡献率约为 30%&quot;。","label":"福格尔（Robert Fogel，1…"},{"t":"身高可作为营养与生产率的衡量指标：基因结构变化很慢，平均身高增加更可能反映营养改善；同一时点的大量工人数据显示高个子工人往往赚钱更多（工资反映生产率），该效应在营养不良风险更大的穷国特别显著。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">身高可作为营养与生产率的衡量指标</strong>：基因结构变化很慢，平均身高增加更可能反映营养改善；同一时点的大量工人数据显示高个子工人往往赚钱更多（工资反映生产率），该效应在营养不良风险更大的穷国特别显著。","label":"身高可作为营养与生产率的衡量指标"},{"t":"健康与财富的因果关系是双向的：穷→健康状况差→更穷（恶性循环）；反之，促进经济更快增长的政策改善健康、又进一步促进增长（良性循环）。今天撒哈拉以南非洲近三分之一人口营养不良，健康差和营养不良仍是发展中国家提高生产率与生活水平的障碍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">健康与财富的因果关系是双向的</strong>：穷→健康状况差→更穷（恶性循环）；反之，促进经济更快增长的政策改善健康、又进一步促进增长（良性循环）。今天撒哈拉以南非洲近三分之一人口营养不良，健康差和营养不良仍是发展中国家提高生产率与生活水平的障碍。","label":"健康与财富的因果关系是双向的"}],"k":"b","i":1,"h":"25.3.5 健康与营养","label":"25.3.5 健康与营养"},{"t":"25.3.6 产权和政治稳定","c":[{"t":"市场经济的生产来自千百万个个人与企业的相互交易，市场价格（看不见的手）使成千上万个市场实现供求平衡；价格制度发生作用的一个重要前提是经济中广泛尊重产权。","c":[],"k":"b","i":2,"h":"市场经济的生产来自千百万个个人与企业的相互交易，市场价格（看不见的手）使成千上万个市场实现供求平衡；价格制度发生作用的一个重要前提是经济中广泛尊重产权。","label":"市场经济的生产来自千百万个个人与企业…"},{"t":"产权：人们对自我拥有的资源行使权利的能力——只有相信能从铁矿随后的销售中获得收益，铁矿公司才会努力开采；法院在市场经济中的重要作用是强制保护产权（刑事审判制度禁止偷窃，民事审判制度保证买者与卖者履行合同）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">产权</strong>：人们对自我拥有的资源行使权利的能力——只有相信能从铁矿随后的销售中获得收益，铁矿公司才会努力开采；法院在市场经济中的重要作用是强制保护产权（刑事审判制度禁止偷窃，民事审判制度保证买者与卖者履行合同）。","label":"产权：人们对自我拥有的资源行使权利的…"},{"t":"欠发达国家的问题：司法制度不能很好运行、合同难以履行、欺诈未受惩罚；更极端时政府侵犯产权、企业须贿赂有权力的官员——腐败阻碍市场协调能力，抑制国内储蓄和来自国外的投资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">欠发达国家的问题</strong>：司法制度不能很好运行、合同难以履行、欺诈未受惩罚；更极端时政府侵犯产权、企业须贿赂有权力的官员——腐败阻碍市场协调能力，抑制国内储蓄和来自国外的投资。","label":"欠发达国家的问题"},{"t":"政治不稳定对产权构成威胁：革命和政变普遍时，产权在未来能否得到尊重很可疑；若革命性巨变的政府可能没收企业资本，国内居民就很少有储蓄、投资和开办新企业的激励，外国人也很少有投资的激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政治不稳定对产权构成威胁</strong>：革命和政变普遍时，产权在未来能否得到尊重很可疑；若革命性巨变的政府可能没收企业资本，国内居民就很少有储蓄、投资和开办新企业的激励，外国人也很少有投资的激励。","label":"政治不稳定对产权构成威胁"},{"t":"结论：经济繁荣部分地取决于政治繁荣——法院系统高效、政府官员廉洁、政治局势稳定的国家，生活水平高于法院系统薄弱、官员腐败、革命政变频发的国家。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：经济繁荣部分地取决于政治繁荣——法院系统高效、政府官员廉洁、政治局势稳定的国家，生活水平高于法院系统薄弱、官员腐败、革命政变频发的国家。","label":"结论：经济繁荣部分地取决于政治繁荣—…"}],"k":"b","i":1,"h":"25.3.6 产权和政治稳定","label":"25.3.6 产权和政治稳定"},{"t":"25.3.7 自由贸易","c":[{"t":"内向型政策试图通过避免与世界其他国家相互交易来提高国内生产率和生活水平；国内企业常以幼稚产业论支持保护（需避开国外竞争以求生存发展壮大），加上对外国人的普遍不信任，导致关税等贸易限制。","c":[],"k":"b","i":2,"h":"内向型政策试图通过避免与世界其他国家相互交易来提高国内生产率和生活水平；国内企业常以幼稚产业论支持保护（需避开国外竞争以求生存发展壮大），加上对外国人的普遍不信任，导致关税等贸易限制。","label":"内向型政策试图通过避免与世界其他国家…"},{"t":"大多数经济学家相信，穷国实行与世界经济融为一体的外向型政策会变好：物品与服务的国际贸易能提高一国公民的经济福利；贸易在某种意义上是一种\"技术\"——出口小麦并进口纺织品的国家，如同发明了把小麦变为纺织品的技术而获益，取消贸易限制的国家将经历类似重大技术进步所带来的增长。","c":[],"k":"b","i":2,"h":"大多数经济学家相信，穷国实行与世界经济融为一体的外向型政策会变好：物品与服务的国际贸易能提高一国公民的经济福利；贸易在某种意义上是一种&quot;技术&quot;——出口小麦并进口纺织品的国家，如同发明了把小麦变为纺织品的技术而获益，取消贸易限制的国家将经历类似重大技术进步所带来的增长。","label":"大多数经济学家相信，穷国实行与世界经…"},{"t":"内向型的不利影响对小国尤甚：阿根廷 GDP 总量与美国休斯敦市相近——若休斯敦禁止市外贸易，生活水平马上下降且持续恶化，这正是阿根廷 20 世纪大部分时间内向型政策的结果；相反，实行外向型政策的韩国、新加坡实现了很高的经济增长率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">内向型的不利影响对小国尤甚</strong>：阿根廷 GDP 总量与美国休斯敦市相近——若休斯敦禁止市外贸易，生活水平马上下降且持续恶化，这正是阿根廷 20 世纪大部分时间内向型政策的结果；相反，实行外向型政策的韩国、新加坡实现了很高的经济增长率。","label":"内向型的不利影响对小国尤甚"},{"t":"贸易量还取决于地理环境：有天然海港的国家贸易更容易（纽约、旧金山、香港都位于海边）；超过 80% 居民住在海岸线 100 公里以内的国家，人均 GDP 是不到 20% 居民住在海岸线附近国家的 4 倍；内陆国家进行国际贸易更困难、收入水平往往更低——这有助于解释由许多内陆国家构成的非洲大陆为何贫穷。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贸易量还取决于地理环境</strong>：有天然海港的国家贸易更容易（纽约、旧金山、香港都位于海边）；超过 80% 居民住在海岸线 100 公里以内的国家，人均 GDP 是不到 20% 居民住在海岸线附近国家的 4 倍；内陆国家进行国际贸易更困难、收入水平往往更低——这有助于解释由许多内陆国家构成的非洲大陆为何贫穷。","label":"贸易量还取决于地理环境"}],"k":"b","i":1,"h":"25.3.7 自由贸易","label":"25.3.7 自由贸易"},{"t":"25.3.8 研究与开发","c":[{"t":"今天的生活水平高于一个世纪前的主要原因是技术进步：电话、晶体管、电脑和内燃机是提高生产物品与服务能力的成千上万个创新中的一些。","c":[],"k":"b","i":2,"h":"今天的生活水平高于一个世纪前的主要原因是技术进步：电话、晶体管、电脑和内燃机是提高生产物品与服务能力的成千上万个创新中的一些。","label":"今天的生活水平高于一个世纪前的主要原因是技术进步"},{"t":"大多数技术进步来自企业和个人发明家的私人研究，但推动这些研究也符合公共利益：在很大程度上知识是公共物品——一个思想被发现后进入社会的知识宝库，其他人可以免费使用；正如政府提供国防这类公共物品一样，它在鼓励新技术的研究和开发中也应起作用。","c":[],"k":"b","i":2,"h":"大多数技术进步来自企业和个人发明家的私人研究，但推动这些研究也符合公共利益：在很大程度上知识是公共物品——一个思想被发现后进入社会的知识宝库，其他人可以免费使用；正如政府提供国防这类公共物品一样，它在鼓励新技术的研究和开发中也应起作用。","label":"大多数技术进步来自企业和个人发明家的…"},{"t":"美国政府的方式：直接支持（一个世纪前资助耕作方法研究并指导农民；通过空军和 NASA 支持空间研究使美国成为火箭和航天飞机的领先制造者；国家科学基金会和国家医疗研究所的研究资金）与对从事研究与开发的企业减税。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">美国政府的方式</strong>：直接支持（一个世纪前资助耕作方法研究并指导农民；通过空军和 NASA 支持空间研究使美国成为火箭和航天飞机的领先制造者；国家科学基金会和国家医疗研究所的研究资金）与对从事研究与开发的企业减税。","label":"美国政府的方式"},{"t":"专利制度：发明者可就新产品申请专利，被认定为原创后政府授予其在规定年限内排他性生产该产品的权利；专利本质上赋予发明者对其发明的产权，把新思想从公共物品变成私人物品——通过允许发明者（尽管只是暂时地）从发明中获得利润，增加了个人和企业从事研究的激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专利制度</strong>：发明者可就新产品申请专利，被认定为原创后政府授予其在规定年限内排他性生产该产品的权利；专利本质上赋予发明者对其发明的产权，把新思想从公共物品变成私人物品——通过允许发明者（尽管只是暂时地）从发明中获得利润，增加了个人和企业从事研究的激励。","label":"专利制度"},{"t":"新闻摘录「悲观主义者和乐观主义者」（要点并入）：西北大学两位经济学家代表关于 21 世纪增长的两种极端观点——悲观派 Robert Gordon 认为一个世纪的重大创新之后人类进步正在放缓，重大突破（电力、抗生素）都已成为过去，预测未来经济增长率将不到 1870—2007 年平均 2% 的一半、人均收入翻番需 78 年；乐观派 Joel Mokyr 认为高速计算机等新工具将带来包括基因疗法在内的发明新时代，历史上的悲观预言总被证伪（大萧条时期悲观论盛行而 20 世纪 30 年代实为技术快速进步期）。两派分歧凸显技术进步作为增长引擎的核心地位及预测之难。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新闻摘录「悲观主义者和乐观主义者」</strong>（要点并入）：西北大学两位经济学家代表关于 21 世纪增长的两种极端观点——悲观派 Robert Gordon 认为一个世纪的重大创新之后人类进步正在放缓，重大突破（电力、抗生素）都已成为过去，预测未来经济增长率将不到 1870—2007 年平均 2% 的一半、人均收入翻番需 78 年；乐观派 Joel Mokyr 认为高速计算机等新工具将带来包括基因疗法在内的发明新时代，历史上的悲观预言总被证伪（大萧条时期悲观论盛行而 20 世纪 30 年代实为技术快速进步期）。两派分歧凸显技术进步作为增长引擎的核心地位及预测之难。","label":"新闻摘录「悲观主义者和乐观主义者」"}],"k":"b","i":1,"h":"25.3.8 研究与开发","label":"25.3.8 研究与开发"},{"t":"25.3.9 人口增长","c":[{"t":"最直接的影响是劳动力规模：人口多意味着生产物品与服务的工人多（中国在世界经济中作用重要的原因之一），但也意味着消费者多——总产出更多不一定意味着普通公民生活水平更高；各种发展水平上都存在人口大国与小国。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最直接的影响是劳动力规模</strong>：人口多意味着生产物品与服务的工人多（中国在世界经济中作用重要的原因之一），但也意味着消费者多——总产出更多不一定意味着普通公民生活水平更高；各种发展水平上都存在人口大国与小国。","label":"最直接的影响是劳动力规模"},{"t":"影响一：导致自然资源紧张。马尔萨斯（Thomas Robert Malthus, 1766—1834）在《人口论》中提出历史上最耸人听闻的预言：人口的力量永远大于地球上生产维持人类生存必需品的力量，对人口增长的唯一限制是\"灾难和罪恶\"，人类注定要永远生活在贫困之中。预言未实现：过去 200 年世界人口增长约 6 倍而全世界平均生活水平大大提升——农药、化肥、机械化农业设备、新作物品种等马尔萨斯从未想过的技术进步使每个农民养活越来越多的人、需要的农民反而更少；饥荒虽不时出现，但通常是收入分配不平等或政治不稳定的结果，而非食物生产不足。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">影响一</strong>：导致自然资源紧张。马尔萨斯（Thomas Robert Malthus, 1766—1834）在《人口论》中提出历史上最耸人听闻的预言：人口的力量永远大于地球上生产维持人类生存必需品的力量，对人口增长的唯一限制是&quot;灾难和罪恶&quot;，人类注定要永远生活在贫困之中。预言未实现：过去 200 年世界人口增长约 6 倍而全世界平均生活水平大大提升——农药、化肥、机械化农业设备、新作物品种等马尔萨斯从未想过的技术进步使每个农民养活越来越多的人、需要的农民反而更少；饥荒虽不时出现，但通常是收入分配不平等或政治不稳定的结果，而非食物生产不足。","label":"影响一：导致自然资源紧张。马尔萨斯（…"},{"t":"影响二：稀释了资本存量。现代增长理论强调人口对资本积累的影响：人口快速增长使工人数迅速增加、资本存量被分摊得更稀薄，每个工人配备的资本减少引起生产率和人均 GDP 降低；人力资本方面最明显——学龄儿童大量增加使教育体系负担更重，人口快速增长的国家教育成就往往较低。发达国家近几十年人口年增约 1%，许多非洲穷国年增约 3%（每 23 年翻一番）。降低人口增长的方法：控制家庭生育数量的法律、提高生育控制技术的普及性；运用\"人们会对激励做出反应\"——抚养孩子的机会成本增加时人们选择较小的家庭，有机会获得良好教育和满意工作的妇女生育更少，故促进平等对待妇女是欠发达国家降低人口增长率、提高生活水平的一种方法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">影响二</strong>：稀释了资本存量。现代增长理论强调人口对资本积累的影响：人口快速增长使工人数迅速增加、资本存量被分摊得更稀薄，每个工人配备的资本减少引起生产率和人均 GDP 降低；人力资本方面最明显——学龄儿童大量增加使教育体系负担更重，人口快速增长的国家教育成就往往较低。发达国家近几十年人口年增约 1%，许多非洲穷国年增约 3%（每 23 年翻一番）。降低人口增长的方法：控制家庭生育数量的法律、提高生育控制技术的普及性；运用&quot;人们会对激励做出反应&quot;——抚养孩子的机会成本增加时人们选择较小的家庭，有机会获得良好教育和满意工作的妇女生育更少，故促进平等对待妇女是欠发达国家降低人口增长率、提高生活水平的一种方法。","label":"影响二：稀释了资本存量。现代增长理论…"},{"t":"影响三：促进了技术进步。更多人口意味着更多对技术进步做出贡献的科学家、发明家和工程师，每个人都因此受益。克瑞默（Michael Kremer）的证据：其一，漫长历史中世界经济增长率随世界人口增长而增长（人口 10 亿的 1800 年左右的增长率高于人口 1 亿的公元前 500 年左右）；其二，公元前 1 万年冰川纪结束的洪水把世界分割为数千年无法联系的地区后，人口规模更大的地区技术更先进（按序为亚非欧\"古老世界\"文明、美洲阿兹特克与玛雅文明、澳大利亚狩猎采集者、不知用火的塔斯马尼亚原住民），人口最少的弗林德斯岛实际在退步、公元前 3000 年左右人口完全消失——结论：人口多是技术进步的前提。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">影响三</strong>：促进了技术进步。更多人口意味着更多对技术进步做出贡献的科学家、发明家和工程师，每个人都因此受益。克瑞默（Michael Kremer）的证据：其一，漫长历史中世界经济增长率随世界人口增长而增长（人口 10 亿的 1800 年左右的增长率高于人口 1 亿的公元前 500 年左右）；其二，公元前 1 万年冰川纪结束的洪水把世界分割为数千年无法联系的地区后，人口规模更大的地区技术更先进（按序为亚非欧&quot;古老世界&quot;文明、美洲阿兹特克与玛雅文明、澳大利亚狩猎采集者、不知用火的塔斯马尼亚原住民），人口最少的弗林德斯岛实际在退步、公元前 3000 年左右人口完全消失——结论：人口多是技术进步的前提。","label":"影响三：促进了技术进步。更多人口意味…"},{"t":"即问即答（要点并入）：政府决策者提高生活水平的方法如鼓励储蓄和投资、促进教育、维护产权与政治稳定等；缺点：鼓励储蓄要求牺牲现期消费（机会成本），教育投资也有放弃劳动收入的机会成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答</strong>（要点并入）：政府决策者提高生活水平的方法如鼓励储蓄和投资、促进教育、维护产权与政治稳定等；缺点：鼓励储蓄要求牺牲现期消费（机会成本），教育投资也有放弃劳动收入的机会成本。","label":"即问即答"}],"k":"b","i":1,"h":"25.3.9 人口增长","label":"25.3.9 人口增长"}],"k":"sec","i":0,"h":"25.3 经济增长和公共政策","label":"25.3 经济增长和公共政策"},{"t":"25.4 结论：长期增长的重要性","c":[{"t":"本章大部分内容可概括为经济学十大原理之一：一国的生活水平取决于它生产物品与服务的能力；想促进生活水平提高的决策者应把目标定为，通过鼓励生产要素的迅速积累和保证这些要素尽可能得到有效利用来提高国家的生产能力。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章大部分内容可概括为经济学十大原理之一</strong>：一国的生活水平取决于它生产物品与服务的能力；想促进生活水平提高的决策者应把目标定为，通过鼓励生产要素的迅速积累和保证这些要素尽可能得到有效利用来提高国家的生产能力。","label":"本章大部分内容可概括为经济学十大原理之一"},{"t":"经济学家关于政府在促进增长中作用的观点并不一致：至少政府可以通过保护产权和维持政治稳定来支持\"看不见的手\"；争论较多的是政府是否应甄别出对技术进步特别重要的特定行业并给予补贴。","c":[],"k":"b","i":1,"h":"经济学家关于政府在促进增长中作用的观点并不一致：至少政府可以通过保护产权和维持政治稳定来支持&quot;看不见的手&quot;；争论较多的是政府是否应甄别出对技术进步特别重要的特定行业并给予补贴。","label":"经济学家关于政府在促进增长中作用的观点并不一致"},{"t":"这些属于经济学中最重要的问题：一代决策者在学习经济增长基本结论方面是否成功，将决定下一代会继承一个什么样的世界。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">这些属于经济学中最重要的问题</strong>：一代决策者在学习经济增长基本结论方面是否成功，将决定下一代会继承一个什么样的世界。","label":"这些属于经济学中最重要的问题"}],"k":"sec","i":0,"h":"<strong class=\"lead\">25.4 结论</strong>：长期增长的重要性","label":"25.4 结论"}],"k":"chap","h":"第25章 生产与增长","label":"第25章 生产与增长"},{"t":"第26章 储蓄、投资和金融体系","c":[{"t":"本章内容提要","c":[{"t":"美国金融体系由债券市场、股票市场、银行、共同基金等金融机构组成，所有这些机构的共同作用都是使想把一部分收入储蓄起来的家庭的资源流入想借款的家庭和企业手中。","c":[],"k":"b","i":1,"h":"美国金融体系由债券市场、股票市场、银行、共同基金等金融机构组成，所有这些机构的共同作用都是使想把一部分收入储蓄起来的家庭的资源流入想借款的家庭和企业手中。","label":"美国金融体系由债券市场、股票市场、银…"},{"t":"国民收入账户恒等式说明宏观经济变量之间的重要关系：对封闭经济而言，国民储蓄一定等于投资（S=I）；金融机构是使一个人的储蓄与另一个人的投资相匹配的机制。","c":[],"k":"b","i":1,"h":"国民收入账户恒等式说明宏观经济变量之间的重要关系：对封闭经济而言，国民储蓄一定等于投资（S=I）；金融机构是使一个人的储蓄与另一个人的投资相匹配的机制。","label":"国民收入账户恒等式说明宏观经济变量之间的重要关系"},{"t":"利率由可贷资金的供求决定：供给来自想储蓄并贷出的家庭，需求来自想借款投资的家庭和企业；分析任何政策或事件对利率的影响，就是看它如何影响可贷资金的供给与需求。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">利率由可贷资金的供求决定</strong>：供给来自想储蓄并贷出的家庭，需求来自想借款投资的家庭和企业；分析任何政策或事件对利率的影响，就是看它如何影响可贷资金的供给与需求。","label":"利率由可贷资金的供求决定"},{"t":"国民储蓄等于私人储蓄加公共储蓄；政府预算赤字代表负的公共储蓄，从而减少国民储蓄和可用于为投资筹资的可贷资金供给；预算赤字挤出投资时，就降低了生产率和GDP的增长率。","c":[],"k":"b","i":1,"h":"国民储蓄等于私人储蓄加公共储蓄；政府预算赤字代表负的公共储蓄，从而减少国民储蓄和可用于为投资筹资的可贷资金供给；预算赤字挤出投资时，就降低了生产率和GDP的增长率。","label":"国民储蓄等于私人储蓄加公共储蓄；政府…"}],"k":"sec","i":0,"h":"本章内容提要","label":"本章内容提要"},{"t":"26.1 美国经济中的金融机构","c":[{"t":"金融体系（financial system）：经济中帮助将一个人的储蓄与另一个人的投资相匹配的一组机构；在最广义层次上，它使稀缺资源从储蓄者（支出小于收入的人）流动到借款者（支出大于收入的人）手中，金融机构分为金融市场和金融中介机构两种类型。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">金融体系</strong>（financial system）：经济中帮助将一个人的储蓄与另一个人的投资相匹配的一组机构；在最广义层次上，它使稀缺资源从储蓄者（支出小于收入的人）流动到借款者（支出大于收入的人）手中，金融机构分为金融市场和金融中介机构两种类型。","label":"金融体系"},{"t":"26.1.1 金融市场","c":[{"t":"金融市场（financial markets）：储蓄者可以借以直接向借款者提供资金的金融机构；经济中两种最重要的金融市场是债券市场和股票市场。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">金融市场</strong>（financial markets）：储蓄者可以借以直接向借款者提供资金的金融机构；经济中两种最重要的金融市场是债券市场和股票市场。","label":"金融市场"},{"t":"债券市场","c":[{"t":"债券（bond）：规定借款人对债券持有人负有债务责任的证明，简单说就是一种借据（债务证明书）；它规定了贷款偿还时间（到期日）、到期前定期支付的利息比率以及最后偿还的借款量（本金），购买者可持有至到期或在到期前转卖。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">债券</strong>（bond）：规定借款人对债券持有人负有债务责任的证明，简单说就是一种借据（债务证明书）；它规定了贷款偿还时间（到期日）、到期前定期支付的利息比率以及最后偿还的借款量（本金），购买者可持有至到期或在到期前转卖。","label":"债券（bond）：规定借款人对债券持…"},{"t":"债券三特点之一——期限：债券到期之前的时间长度，从几个月到长达30年（英国政府甚至发行永远支付利息、从不偿还本金的永久债券）；长期债券持有人收回本金要等更久、提前变现可能被迫低价出售，风险更大，为了补偿风险，长期债券支付的利率通常高于短期债券。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">债券三特点之一——期限</strong>：债券到期之前的时间长度，从几个月到长达30年（英国政府甚至发行永远支付利息、从不偿还本金的永久债券）；长期债券持有人收回本金要等更久、提前变现可能被迫低价出售，风险更大，为了补偿风险，长期债券支付的利率通常高于短期债券。","label":"债券三特点之一——期限"},{"t":"债券三特点之二——信用风险：借款人不能支付某些利息或本金的可能性（不能支付称为违约，借款人可通过宣布破产违约）；觉察到的违约可能性越大，购买者要求的利率越高——一般认为美国政府信用风险低、政府债券支付低利率，财务状况不稳定的公司发行的垃圾债券支付极高利率；标准普尔公司的债券评级从AAA（最安全）到D（违约级别）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">债券三特点之二——信用风险</strong>：借款人不能支付某些利息或本金的可能性（不能支付称为违约，借款人可通过宣布破产违约）；觉察到的违约可能性越大，购买者要求的利率越高——一般认为美国政府信用风险低、政府债券支付低利率，财务状况不稳定的公司发行的垃圾债券支付极高利率；标准普尔公司的债券评级从AAA（最安全）到D（违约级别）。","label":"债券三特点之二——信用风险"},{"t":"债券三特点之三——税收待遇：税法对待债券利息的方式；大多数债券利息是应纳税收入，而州和地方政府发行的市政债券利息免缴联邦所得税——由于这种税收利益，市政债券支付的利率通常低于公司或联邦政府债券。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">债券三特点之三——税收待遇</strong>：税法对待债券利息的方式；大多数债券利息是应纳税收入，而州和地方政府发行的市政债券利息免缴联邦所得税——由于这种税收利益，市政债券支付的利率通常低于公司或联邦政府债券。","label":"债券三特点之三——税收待遇"}],"k":"b","i":2,"h":"债券市场","label":"债券市场"},{"t":"股票市场","c":[{"t":"股票（stock）：代表企业所有权、也代表对企业所获得利润的索取权的有价证券；出售股票筹集资金称为权益融资，出售债券筹集资金称为债务融资。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">股票</strong>（stock）：代表企业所有权、也代表对企业所获得利润的索取权的有价证券；出售股票筹集资金称为权益融资，出售债券筹集资金称为债务融资。","label":"股票（stock）：代表企业所有权、…"},{"t":"股票与债券的差别：股票所有者是公司的部分所有者，债券所有者只是公司的债权人；利润极丰厚时股票持有者享有收益、债券持有者只得到债券利息；公司陷入财务困境时先支付债券持有者、之后才轮到股票持有者——与债券相比，股票既使持有者承受高风险，又提供潜在的高收益。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">股票与债券的差别</strong>：股票所有者是公司的部分所有者，债券所有者只是公司的债权人；利润极丰厚时股票持有者享有收益、债券持有者只得到债券利息；公司陷入财务困境时先支付债券持有者、之后才轮到股票持有者——与债券相比，股票既使持有者承受高风险，又提供潜在的高收益。","label":"股票与债券的差别"},{"t":"股票在证券交易所交易（美国最重要的是纽约证券交易所和纳斯达克），股票易手时公司本身得不到钱；股票交易价格由供求决定，股票需求及其价格反映人们对公司未来盈利状况的预期——乐观则需求增加价格上升，预期盈利下降甚至亏损则价格下跌。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">股票在证券交易所交易</strong>（美国最重要的是纽约证券交易所和纳斯达克），股票易手时公司本身得不到钱；股票交易价格由供求决定，股票需求及其价格反映人们对公司未来盈利状况的预期——乐观则需求增加价格上升，预期盈利下降甚至亏损则价格下跌。","label":"股票在证券交易所交易"},{"t":"股票指数是计算出来的一组股票价格的平均数：最著名的道·琼斯工业平均指数从1896年开始定期计算，现根据美国最主要30家公司股价计算；标准普尔500指数根据500家主要公司股价计算；股票指数作为未来经济状况的晴雨表备受关注。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">股票指数是计算出来的一组股票价格的平均数</strong>：最著名的道·琼斯工业平均指数从1896年开始定期计算，现根据美国最主要30家公司股价计算；标准普尔500指数根据500家主要公司股价计算；股票指数作为未来经济状况的晴雨表备受关注。","label":"股票指数是计算出来的一组股票价格的平均数"},{"t":"对股市观察者的三个关键数据：价格（最后价、收盘价、当日与年度最高最低价）；股息与股息收益率（公司支付给股东的利润称股息，未支付的利润称留存收益，用于增加投资）；价格-收益比（P/E=股价÷过去一年每股收益，历史上通常在15左右——P/E高可能表明预期未来收益增加也可能表明股票被高估，P/E低可能表明预期收益减少也可能表明被低估）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">对股市观察者的三个关键数据</strong>：价格（最后价、收盘价、当日与年度最高最低价）；股息与股息收益率（公司支付给股东的利润称股息，未支付的利润称留存收益，用于增加投资）；价格-收益比（P/E=股价÷过去一年每股收益，历史上通常在15左右——P/E高可能表明预期未来收益增加也可能表明股票被高估，P/E低可能表明预期收益减少也可能表明被低估）。","label":"对股市观察者的三个关键数据"}],"k":"b","i":2,"h":"股票市场","label":"股票市场"}],"k":"b","i":1,"h":"26.1.1 金融市场","label":"26.1.1 金融市场"},{"t":"26.1.2 金融中介机构","c":[{"t":"金融中介机构（financial intermediaries）：储蓄者可以借以间接地向借款者提供资金的金融机构；\"中介\"反映了它们在储蓄者与借款者之间的作用，两种最重要的中介是银行和共同基金。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">金融中介机构</strong>（financial intermediaries）：储蓄者可以借以间接地向借款者提供资金的金融机构；&quot;中介&quot;反映了它们在储蓄者与借款者之间的作用，两种最重要的中介是银行和共同基金。","label":"金融中介机构"},{"t":"银行","c":[{"t":"银行的主要工作是从想储蓄的人那里吸收存款，并用这些存款向想借款的人发放贷款；对存款支付利息、对贷款收取略高一点的利息，两种利率的差额弥补成本并带来利润；难以在债券股票市场筹资的小企业（如小杂货商）主要靠本地银行贷款。","c":[],"k":"b","i":3,"h":"银行的主要工作是从想储蓄的人那里吸收存款，并用这些存款向想借款的人发放贷款；对存款支付利息、对贷款收取略高一点的利息，两种利率的差额弥补成本并带来利润；难以在债券股票市场筹资的小企业（如小杂货商）主要靠本地银行贷款。","label":"银行的主要工作是从想储蓄的人那里吸收…"},{"t":"银行的另一重要作用：允许人们根据存款签发支票、使用借记卡，使购买便利——银行帮助创造出一种可作为交换媒介（人们能方便地用来进行交易的东西）的特殊资产，这是银行不同于许多其他金融机构之处（货币制度章节将回到这一点）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">银行的另一重要作用</strong>：允许人们根据存款签发支票、使用借记卡，使购买便利——银行帮助创造出一种可作为交换媒介（人们能方便地用来进行交易的东西）的特殊资产，这是银行不同于许多其他金融机构之处（货币制度章节将回到这一点）。","label":"银行的另一重要作用"}],"k":"b","i":2,"h":"银行","label":"银行"},{"t":"共同基金","c":[{"t":"共同基金（mutual fund）：向公众出售股份、并用收入来购买股票与债券资产组合的机构；持股人接受与这种资产组合相关的所有风险和收益——组合价值上升则获益、下降则受损。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">共同基金</strong>（mutual fund）：向公众出售股份、并用收入来购买股票与债券资产组合的机构；持股人接受与这种资产组合相关的所有风险和收益——组合价值上升则获益、下降则受损。","label":"共同基金"},{"t":"首要优点：使钱并不多的人进行多元化投资——持有单一股票或债券的风险极大（\"不要把所有的鸡蛋放在一个篮子里\"），持有多元化资产组合的风险小一些；一个只有几百美元的人买共同基金即可间接成为几百家主要公司的部分所有者或债权人；经营共同基金的公司收取年费，通常为资产价值的0.25%~2.0%。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">首要优点</strong>：使钱并不多的人进行多元化投资——持有单一股票或债券的风险极大（&quot;不要把所有的鸡蛋放在一个篮子里&quot;），持有多元化资产组合的风险小一些；一个只有几百美元的人买共同基金即可间接成为几百家主要公司的部分所有者或债权人；经营共同基金的公司收取年费，通常为资产价值的0.25%~2.0%。","label":"首要优点"},{"t":"宣称的第二个优点：使普通人获得专业资金管理者的服务（管理者买进有盈利前途的股票、卖出前景不看好的股票）；但金融经济学家往往怀疑这一优点——当成千上万资金管理者密切关注每家公司前景时，股价通常已很好地反映公司真实价值，\"跑赢市场\"很困难。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">宣称的第二个优点</strong>：使普通人获得专业资金管理者的服务（管理者买进有盈利前途的股票、卖出前景不看好的股票）；但金融经济学家往往怀疑这一优点——当成千上万资金管理者密切关注每家公司前景时，股价通常已很好地反映公司真实价值，&quot;跑赢市场&quot;很困难。","label":"宣称的第二个优点"},{"t":"指数基金按既定股票指数购买所有股票，其业绩平均而言比积极交易的共同基金还要好一些，原因是它们极少买卖、不给专业资金管理者支付薪水而压低了成本。","c":[],"k":"b","i":3,"h":"指数基金按既定股票指数购买所有股票，其业绩平均而言比积极交易的共同基金还要好一些，原因是它们极少买卖、不给专业资金管理者支付薪水而压低了成本。","label":"指数基金按既定股票指数购买所有股票，…"}],"k":"b","i":2,"h":"共同基金","label":"共同基金"}],"k":"b","i":1,"h":"26.1.2 金融中介机构","label":"26.1.2 金融中介机构"},{"t":"26.1.3 总结","c":[{"t":"除债券市场、股票市场、银行和共同基金外，还有养老基金、信用社、保险公司甚至地方高利贷者；这些机构在许多方面不同，但分析金融体系的宏观经济作用时，重要的是记住相似性——所有金融机构都服务于同一个目标：把储蓄者的资源送到借款者手中。","c":[],"k":"b","i":2,"h":"除债券市场、股票市场、银行和共同基金外，还有养老基金、信用社、保险公司甚至地方高利贷者；这些机构在许多方面不同，但分析金融体系的宏观经济作用时，重要的是记住相似性——所有金融机构都服务于同一个目标：把储蓄者的资源送到借款者手中。","label":"除债券市场、股票市场、银行和共同基金…"},{"t":"即问即答要点：股票是代表企业所有权和利润索取权的证券，债券是债务证明（借据）；相似之处在于两者都是可交易的储蓄载体、都把储蓄者的资金输送给借款者并带来收益（股息/利息），不同之处在于股票高风险高潜在收益、债券收益固定且清偿顺序在前。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：股票是代表企业所有权和利润索取权的证券，债券是债务证明（借据）；相似之处在于两者都是可交易的储蓄载体、都把储蓄者的资金输送给借款者并带来收益（股息/利息），不同之处在于股票高风险高潜在收益、债券收益固定且清偿顺序在前。","label":"即问即答要点"}],"k":"b","i":1,"h":"26.1.3 总结","label":"26.1.3 总结"}],"k":"sec","i":0,"h":"26.1 美国经济中的金融机构","label":"26.1 美国经济中的金融机构"},{"t":"26.2 国民收入账户中的储蓄与投资","c":[{"t":"本节关注核算而非行为：国民收入账户的规则包括几个重要的恒等式；恒等式是因公式中定义变量的方式而必然正确的公式，它们能清楚说明不同变量之间的关系。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本节关注核算而非行为</strong>：国民收入账户的规则包括几个重要的恒等式；恒等式是因公式中定义变量的方式而必然正确的公式，它们能清楚说明不同变量之间的关系。","label":"本节关注核算而非行为"},{"t":"26.2.1 一些重要的恒等式","c":[{"t":"GDP（Y）既是一个经济的总收入，又是用于经济中物品与服务产出的总支出，分为四部分支出：Y = C + I + G + NX（消费、投资、政府购买、净出口）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">GDP</strong>（Y）既是一个经济的总收入，又是用于经济中物品与服务产出的总支出，分为四部分支出：Y = C + I + G + NX（消费、投资、政府购买、净出口）。","label":"GDP（Y）既是一个经济的总收入，又…"},{"t":"封闭经济（不进行物品与服务的国际贸易、也不进行国际借贷的经济；现实经济是开放经济，封闭假设是有用简化）：净出口NX为零，故 Y = C + I + G——出售的每一单位产出都被消费、投资或由政府购买。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">封闭经济</strong>（不进行物品与服务的国际贸易、也不进行国际借贷的经济；现实经济是开放经济，封闭假设是有用简化）：净出口NX为零，故 Y = C + I + G——出售的每一单位产出都被消费、投资或由政府购买。","label":"封闭经济"},{"t":"两边减去C和G：Y − C − G = I；左边（用于消费和政府购买之后剩下的总收入）定义为国民储蓄，得 S = I，即储蓄等于投资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两边减去C和G</strong>：Y − C − G = I；左边（用于消费和政府购买之后剩下的总收入）定义为国民储蓄，得 S = I，即储蓄等于投资。","label":"两边减去C和G"},{"t":"国民储蓄（national saving，简称储蓄，saving）：在用于消费和政府购买后剩下的一个经济中的总收入，S = Y − C − G。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">国民储蓄</strong>（national saving，简称储蓄，saving）：在用于消费和政府购买后剩下的一个经济中的总收入，S = Y − C − G。","label":"国民储蓄"},{"t":"令T表示政府税收收入减去转移支付（如社会保障和福利），国民储蓄可写成两种等价形式：S = Y − C − G，或 S = (Y − T − C) + (T − G)——第二个式子把国民储蓄拆分为私人储蓄与公共储蓄两部分。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">令T表示政府税收收入减去转移支付</strong>（如社会保障和福利），国民储蓄可写成两种等价形式：S = Y − C − G，或 S = (Y − T − C) + (T − G)——第二个式子把国民储蓄拆分为私人储蓄与公共储蓄两部分。","label":"令T表示政府税收收入减去转移支付"},{"t":"私人储蓄（private saving）：家庭在支付了税收和消费之后剩下来的收入量，即 Y − T − C。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">私人储蓄</strong>（private saving）：家庭在支付了税收和消费之后剩下来的收入量，即 Y − T − C。","label":"私人储蓄"},{"t":"公共储蓄（public saving）：政府在支付其支出后剩下来的税收收入量，即 T − G。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公共储蓄</strong>（public saving）：政府在支付其支出后剩下来的税收收入量，即 T − G。","label":"公共储蓄"},{"t":"预算盈余（budget surplus）：税收收入大于政府支出（T>G）时的余额，这种盈余代表正的公共储蓄；预算赤字（budget deficit）：政府支出大于税收收入（G>T）时出现的税收收入短缺，此时公共储蓄（T−G）为负数。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">预算盈余</strong>（budget surplus）：税收收入大于政府支出（T&gt;G）时的余额，这种盈余代表正的公共储蓄；预算赤字（budget deficit）：政府支出大于税收收入（G&gt;T）时出现的税收收入短缺，此时公共储蓄（T−G）为负数。","label":"预算盈余"},{"t":"S=I背后的机制是金融体系：在储蓄和投资这两边之间的是债券市场、股票市场、银行、共同基金以及其他金融市场和金融中介机构——它们吸收国民储蓄，并将之用于一国的投资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">S=I背后的机制是金融体系</strong>：在储蓄和投资这两边之间的是债券市场、股票市场、银行、共同基金以及其他金融市场和金融中介机构——它们吸收国民储蓄，并将之用于一国的投资。","label":"S=I背后的机制是金融体系"}],"k":"b","i":1,"h":"26.2.1 一些重要的恒等式","label":"26.2.1 一些重要的恒等式"},{"t":"26.2.2 储蓄与投资的含义","c":[{"t":"宏观经济学家谨慎区分这两个术语：投资指设备或建筑物这类新资本的购买；购买新住房属于家庭投资支出而非消费支出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">宏观经济学家谨慎区分这两个术语</strong>：投资指设备或建筑物这类新资本的购买；购买新住房属于家庭投资支出而非消费支出。","label":"宏观经济学家谨慎区分这两个术语"},{"t":"书例：Larry收入大于支出，把余钱存入银行或购买股票债券——他增加了国民储蓄，但宏观经济学称其行为是储蓄而不是投资；Moe从银行借钱建造自己的新房子、Curly公司卖出股票并用收入建造新工厂——这些才增加一国的投资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书例</strong>：Larry收入大于支出，把余钱存入银行或购买股票债券——他增加了国民储蓄，但宏观经济学称其行为是储蓄而不是投资；Moe从银行借钱建造自己的新房子、Curly公司卖出股票并用收入建造新工厂——这些才增加一国的投资。","label":"书例：Larry收入大于支出，把余钱…"},{"t":"会计恒等式S=I表示对整个经济而言储蓄与投资相等，但对每个单个家庭和企业不一定成立：Larry的储蓄可能大于其投资（把超出部分存入银行），Moe的储蓄可能小于其投资（从银行借到不足部分）；银行等金融机构使一个人的储蓄为另一个人的投资筹资成为可能。","c":[],"k":"b","i":2,"h":"会计恒等式S=I表示对整个经济而言储蓄与投资相等，但对每个单个家庭和企业不一定成立：Larry的储蓄可能大于其投资（把超出部分存入银行），Moe的储蓄可能小于其投资（从银行借到不足部分）；银行等金融机构使一个人的储蓄为另一个人的投资筹资成为可能。","label":"会计恒等式S=I表示对整个经济而言储…"},{"t":"即问即答要点：私人储蓄=Y−T−C，公共储蓄=T−G，国民储蓄=私人储蓄+公共储蓄=Y−C−G；封闭经济中国民储蓄恒等于投资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：私人储蓄=Y−T−C，公共储蓄=T−G，国民储蓄=私人储蓄+公共储蓄=Y−C−G；封闭经济中国民储蓄恒等于投资。","label":"即问即答要点"}],"k":"b","i":1,"h":"26.2.2 储蓄与投资的含义","label":"26.2.2 储蓄与投资的含义"}],"k":"sec","i":0,"h":"26.2 国民收入账户中的储蓄与投资","label":"26.2 国民收入账户中的储蓄与投资"},{"t":"26.3 可贷资金市场","c":[{"t":"可贷资金市场（market for loanable funds）：想储蓄的人借以提供资金、想借钱投资的人借以借贷资金的市场；可贷资金指人们选择储蓄并贷出而不是用于自己消费的所有收入，以及投资者为新投资项目筹资要借的数量；模型假设经济中只有单一金融市场（建模简化），市场上只有一种利率——既是储蓄的收益又是借款的成本。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">可贷资金市场</strong>（market for loanable funds）：想储蓄的人借以提供资金、想借钱投资的人借以借贷资金的市场；可贷资金指人们选择储蓄并贷出而不是用于自己消费的所有收入，以及投资者为新投资项目筹资要借的数量；模型假设经济中只有单一金融市场（建模简化），市场上只有一种利率——既是储蓄的收益又是借款的成本。","label":"可贷资金市场"},{"t":"26.3.1 可贷资金的供给与需求","c":[{"t":"供给来源：有额外收入并想储蓄和贷出的人——可直接进行（家庭购买企业债券）或间接进行（家庭银行存款、银行再放贷）；储蓄是可贷资金供给的来源（含私人储蓄与公共储蓄）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给来源</strong>：有额外收入并想储蓄和贷出的人——可直接进行（家庭购买企业债券）或间接进行（家庭银行存款、银行再放贷）；储蓄是可贷资金供给的来源（含私人储蓄与公共储蓄）。","label":"供给来源"},{"t":"需求来源：希望借款进行投资的家庭与企业——家庭用抵押贷款购置住房、企业借款购买新设备或建立新工厂；投资是可贷资金需求的来源。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求来源</strong>：希望借款进行投资的家庭与企业——家庭用抵押贷款购置住房、企业借款购买新设备或建立新工厂；投资是可贷资金需求的来源。","label":"需求来源"},{"t":"利率是贷款的价格：高利率使借款更昂贵、使储蓄更有吸引力，因此可贷资金需求量随利率上升而减少（需求曲线向右下方倾斜）、供给量随利率上升而增加（供给曲线向右上方倾斜）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利率是贷款的价格</strong>：高利率使借款更昂贵、使储蓄更有吸引力，因此可贷资金需求量随利率上升而减少（需求曲线向右下方倾斜）、供给量随利率上升而增加（供给曲线向右上方倾斜）。","label":"利率是贷款的价格"},{"t":"利率调整使供求平衡：利率低于均衡时供给量小于需求量，可贷资金短缺促使贷款者提高利率（鼓励储蓄、抑制借款）；利率高于均衡时供给量大于需求量，贷款者争夺稀缺借款者使利率下降（书图示例：均衡利率5%，供求量1.2万亿美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利率调整使供求平衡</strong>：利率低于均衡时供给量小于需求量，可贷资金短缺促使贷款者提高利率（鼓励储蓄、抑制借款）；利率高于均衡时供给量大于需求量，贷款者争夺稀缺借款者使利率下降（书图示例：均衡利率5%，供求量1.2万亿美元）。","label":"利率调整使供求平衡"},{"t":"可贷资金的供求取决于真实利率（根据通货膨胀调整后的名义利率，=名义利率−通货膨胀率），因为通货膨胀侵蚀货币价值，真实利率更准确地反映储蓄的真实收益和借款的真实成本；本章以下\"利率\"均指真实利率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">可贷资金的供求取决于真实利率</strong>（根据通货膨胀调整后的名义利率，=名义利率−通货膨胀率），因为通货膨胀侵蚀货币价值，真实利率更准确地反映储蓄的真实收益和借款的真实成本；本章以下&quot;利率&quot;均指真实利率。","label":"可贷资金的供求取决于真实利率"},{"t":"与其他市场一样，看不见的手通过利率协调想储蓄的人（供给者）与想投资的人（需求者）；用此模型分析政策遵循三步骤（第4章）：第一，确定政策使供给还是需求曲线移动；第二，确定移动方向；第三，用供求图说明均衡如何变动。","c":[],"k":"b","i":2,"h":"与其他市场一样，看不见的手通过利率协调想储蓄的人（供给者）与想投资的人（需求者）；用此模型分析政策遵循三步骤（第4章）：第一，确定政策使供给还是需求曲线移动；第二，确定移动方向；第三，用供求图说明均衡如何变动。","label":"与其他市场一样，看不见的手通过利率协调想储蓄的人"}],"k":"b","i":1,"h":"26.3.1 可贷资金的供给与需求","label":"26.3.1 可贷资金的供给与需求"},{"t":"26.3.2 政策1：储蓄激励","c":[{"t":"背景：储蓄是生产率的重要长期决定因素，但联邦和州政府对利息和红利征税抑制储蓄（书例：25岁的人储蓄1000美元购买利率9%的30年期债券，无税收时55岁增至13268美元；若利息按33%税率征税、税后利率仅6%，30年后只增至5743美元——对利息征税大大减少现期储蓄的未来回报）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：储蓄是生产率的重要长期决定因素，但联邦和州政府对利息和红利征税抑制储蓄（书例：25岁的人储蓄1000美元购买利率9%的30年期债券，无税收时55岁增至13268美元；若利息按33%税率征税、税后利率仅6%，30年后只增至5743美元——对利息征税大大减少现期储蓄的未来回报）。","label":"背景：储蓄是生产率的重要长期决定因素…"},{"t":"应对建议：改变税法以鼓励储蓄，如扩大个人养老金账户等允许部分储蓄免税的特殊账户。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应对建议</strong>：改变税法以鼓励储蓄，如扩大个人养老金账户等允许部分储蓄免税的特殊账户。","label":"应对建议"},{"t":"三步骤分析：税收变动改变家庭在既定利率下的储蓄激励→影响可贷资金供给曲线（不直接影响需求）；储蓄税负减少→家庭减少消费份额、增加储蓄和存款或购债券→供给曲线从S1向右移动到S2。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三步骤分析</strong>：税收变动改变家庭在既定利率下的储蓄激励→影响可贷资金供给曲线（不直接影响需求）；储蓄税负减少→家庭减少消费份额、增加储蓄和存款或购债券→供给曲线从S1向右移动到S2。","label":"三步骤分析"},{"t":"结论：均衡利率下降、投资增加（书图26-2：利率从5%降到4%，储蓄和投资的均衡数量从1.2万亿增加到1.6万亿美元，均衡沿需求曲线变动）；经济学家对改革的影响大小与公平性（利益可能主要归对税收减免需求最小的富人）看法不一。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：均衡利率下降、投资增加（书图26-2：利率从5%降到4%，储蓄和投资的均衡数量从1.2万亿增加到1.6万亿美元，均衡沿需求曲线变动）；经济学家对改革的影响大小与公平性（利益可能主要归对税收减免需求最小的富人）看法不一。","label":"结论：均衡利率下降、投资增加（书图2…"}],"k":"b","i":1,"h":"<strong class=\"lead\">26.3.2 政策1</strong>：储蓄激励","label":"26.3.2 政策1"},{"t":"26.3.3 政策2：投资激励","c":[{"t":"政策内容：国会以投资税收减免鼓励投资——对建造新工厂或购买新设备的企业给予税收优惠。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政策内容</strong>：国会以投资税收减免鼓励投资——对建造新工厂或购买新设备的企业给予税收优惠。","label":"政策内容"},{"t":"三步骤分析：税收减免使借款并投资于新资本的企业受益→改变既定利率下的投资，即可贷资金需求（不影响家庭储蓄即供给）；企业受激励在任何利率下增加投资→需求曲线从D1向右移动到D2。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三步骤分析</strong>：税收减免使借款并投资于新资本的企业受益→改变既定利率下的投资，即可贷资金需求（不影响家庭储蓄即供给）；企业受激励在任何利率下增加投资→需求曲线从D1向右移动到D2。","label":"三步骤分析"},{"t":"结论：均衡利率上升、储蓄增加（书图26-3：利率从5%升到6%，均衡数量从1.2万亿增加到1.4万亿美元，家庭反应是增加储蓄量，即沿供给曲线的变动）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：均衡利率上升、储蓄增加（书图26-3：利率从5%升到6%，均衡数量从1.2万亿增加到1.4万亿美元，家庭反应是增加储蓄量，即沿供给曲线的变动）。","label":"结论：均衡利率上升、储蓄增加（书图2…"}],"k":"b","i":1,"h":"<strong class=\"lead\">26.3.3 政策2</strong>：投资激励","label":"26.3.3 政策2"},{"t":"26.3.4 政策3：政府预算赤字与盈余","c":[{"t":"概念：预算赤字是政府支出超过税收收入的部分，政府通过在债券市场上借款为赤字筹资；过去政府借款的积累称为政府债务；预算盈余（税收收入超过政府支出）可用于偿还部分政府债务；支出正好等于税收收入时预算平衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">概念</strong>：预算赤字是政府支出超过税收收入的部分，政府通过在债券市场上借款为赤字筹资；过去政府借款的积累称为政府债务；预算盈余（税收收入超过政府支出）可用于偿还部分政府债务；支出正好等于税收收入时预算平衡。","label":"概念：预算赤字是政府支出超过税收收入…"},{"t":"三步骤分析（从平衡预算转向赤字）：预算余额的变动代表公共储蓄的变动，从而代表可贷资金供给的变动（国民储蓄是可贷资金供给的来源），不改变既定利率下想为投资筹资的需求；赤字使公共储蓄为负、国民储蓄减少→供给曲线从S1向左移动到S2。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三步骤分析</strong>（从平衡预算转向赤字）：预算余额的变动代表公共储蓄的变动，从而代表可贷资金供给的变动（国民储蓄是可贷资金供给的来源），不改变既定利率下想为投资筹资的需求；赤字使公共储蓄为负、国民储蓄减少→供给曲线从S1向左移动到S2。","label":"三步骤分析"},{"t":"结论：利率上升、投资减少（书图26-4：利率从5%升到6%，均衡数量从1.2万亿降至0.8万亿美元）；购买新房子的家庭少了、开设新工厂的企业少了。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：利率上升、投资减少（书图26-4：利率从5%升到6%，均衡数量从1.2万亿降至0.8万亿美元）；购买新房子的家庭少了、开设新工厂的企业少了。","label":"结论：利率上升、投资减少（书图26-…"},{"t":"挤出（crowding out）：政府借款所引起的投资减少；当政府借款为预算赤字筹资时，它挤出了那些想为投资筹资的私人借款者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">挤出</strong>（crowding out）：政府借款所引起的投资减少；当政府借款为预算赤字筹资时，它挤出了那些想为投资筹资的私人借款者。","label":"挤出（crowding out）：政…"},{"t":"基本结论：政府通过预算赤字减少国民储蓄时，利率上升且投资减少；由于投资对长期经济增长很重要，政府预算赤字降低了经济的增长率；预算盈余的作用相反——增加国民储蓄和可贷资金供给，降低利率、刺激投资，带来更多资本积累和更快的经济增长。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">基本结论</strong>：政府通过预算赤字减少国民储蓄时，利率上升且投资减少；由于投资对长期经济增长很重要，政府预算赤字降低了经济的增长率；预算盈余的作用相反——增加国民储蓄和可贷资金供给，降低利率、刺激投资，带来更多资本积累和更快的经济增长。","label":"基本结论"},{"t":"为何赤字影响供给而非需求：模型中\"可贷资金\"指为私人投资筹资可得到的资源流量，故赤字减少供给；若把\"可贷资金\"定义为从私人储蓄中得到的资源流量，赤字则会增加需求而非减少供给——两种解释语义不同但结果相同：赤字都提高利率、挤出为私人投资项目筹资的私人借款者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">为何赤字影响供给而非需求</strong>：模型中&quot;可贷资金&quot;指为私人投资筹资可得到的资源流量，故赤字减少供给；若把&quot;可贷资金&quot;定义为从私人储蓄中得到的资源流量，赤字则会增加需求而非减少供给——两种解释语义不同但结果相同：赤字都提高利率、挤出为私人投资项目筹资的私人借款者。","label":"为何赤字影响供给而非需求"},{"t":"减税引起的赤字同理：减税减少公共储蓄（T−G）；私人储蓄（Y−T−C）可能因税收T更低而增加，但只要家庭对减税的反应是增加消费C，私人储蓄的增加额就小于公共储蓄的减少额，国民储蓄（S=Y−C−G）下降——供给减少、利率上升、挤出资本投资借款者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">减税引起的赤字同理</strong>：减税减少公共储蓄（T−G）；私人储蓄（Y−T−C）可能因税收T更低而增加，但只要家庭对减税的反应是增加消费C，私人储蓄的增加额就小于公共储蓄的减少额，国民储蓄（S=Y−C−G）下降——供给减少、利率上升、挤出资本投资借款者。","label":"减税引起的赤字同理"},{"t":"案例研究「美国政府债务史」要点：债务-GDP比率（联邦债务占GDP百分比，历史上在1836年的0与1945年的107%之间波动）是政府财政状况的标志——比率下降表明相对其筹税能力债务减少、政府在其财力之内运转，上升则被解释为财政政策难以在现有水平持续；历史上债务波动的主要原因是战争（战时支出激增、赤字与债务同增，战后比率回落）——为战争进行债务筹资被认为合适，一是可保持税率平稳（避免战时税率急剧上升引起效率损失），二是把部分战争费用转移给将从保卫国家中受益的后代（有争议的公平负担分摊）；不能用战争解释的大幅增加始于1980年左右——里根减税但削减支出困难，债务/GDP从1980年的26%升至1993年的48%；克林顿政府与1995年后的共和党国会共同致力于减少赤字，加上90年代末经济繁荣，联邦预算由赤字转为盈余、比率大幅下降；布什任期前几年盈余转赤字（减税立法、2001年衰退自动减少税收并增加支出、\"9·11\"后国家安全支出与伊拉克、阿富汗战争）；真正急剧上升始于2008年金融危机和严重衰退——2009至2012年联邦预算赤字平均占GDP约9%，为二战以来最高水平，2012年后随经济复苏赤字缩减、比率上升趋缓。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「美国政府债务史」要点</strong>：债务-GDP比率（联邦债务占GDP百分比，历史上在1836年的0与1945年的107%之间波动）是政府财政状况的标志——比率下降表明相对其筹税能力债务减少、政府在其财力之内运转，上升则被解释为财政政策难以在现有水平持续；历史上债务波动的主要原因是战争（战时支出激增、赤字与债务同增，战后比率回落）——为战争进行债务筹资被认为合适，一是可保持税率平稳（避免战时税率急剧上升引起效率损失），二是把部分战争费用转移给将从保卫国家中受益的后代（有争议的公平负担分摊）；不能用战争解释的大幅增加始于1980年左右——里根减税但削减支出困难，债务/GDP从1980年的26%升至1993年的48%；克林顿政府与1995年后的共和党国
