ividend premium）的时间变化可预测分红公司比例，证据更支持\"迎合投资者情绪\"而非\"适应理性客户需求\"；股利具有粘性（林特纳），蒙蒂尔指出林特纳1956年的经典股利研究本身即带有行为分析特征。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">股利溢价</strong>（dividend premium）的时间变化可预测分红公司比例，证据更支持&quot;迎合投资者情绪&quot;而非&quot;适应理性客户需求&quot;；股利具有粘性（林特纳），蒙蒂尔指出林特纳1956年的经典股利研究本身即带有行为分析特征。","label":"股利溢价"},{"t":"股价高估时发行新股、低估时回购是经理层利用定价错误维护长期股东利益的手段；IPO、SEO、可转债等发行事件长期表现不佳、回购公告后存在长期超额收益，市场对发行事件反应不足（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"股价高估时发行新股、低估时回购是经理层利用定价错误维护长期股东利益的手段；IPO、SEO、可转债等发行事件长期表现不佳、回购公告后存在长期超额收益，市场对发行事件反应不足（蒙蒂尔）。","label":"股价高估时发行新股、低估时回购是经理…"},{"t":"不依赖真实协同效应的市场驱动并购理论（施雷弗-维什尼）能解释谁兼并谁、现金还是股票支付、并购后市场表现与并购浪潮。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">不依赖真实协同效应的市场驱动并购理论</strong>（施雷弗-维什尼）能解释谁兼并谁、现金还是股票支付、并购后市场表现与并购浪潮。","label":"不依赖真实协同效应的市场驱动并购理论"},{"t":"政策含义：投资者非理性而经理层理性时，应保护经理层免受市场短期压力；经理层自身有偏差时，董事会与监管层须仔细检查其决策过程。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">政策含义</strong>：投资者非理性而经理层理性时，应保护经理层免受市场短期压力；经理层自身有偏差时，董事会与监管层须仔细检查其决策过程。","label":"政策含义"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"引言：行为金融进入公司金融的两条路径","c":[{"t":"行为金融对公司金融产生影响的两种可能原因：经理层与投资者、金融市场参与者一样受有限认知、过度自信及情绪影响而并非完全理性；理性的经理层有时会利用非理性投资者创造的估值错误。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">行为金融对公司金融产生影响的两种可能原因</strong>：经理层与投资者、金融市场参与者一样受有限认知、过度自信及情绪影响而并非完全理性；理性的经理层有时会利用非理性投资者创造的估值错误。","label":"行为金融对公司金融产生影响的两种可能原因"},{"t":"分析法的两点基础：由于套利受限，非理性投资者会对价格造成冲击；经理层有判断估值是否错误的能力并进行相应市场操作。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">分析法的两点基础</strong>：由于套利受限，非理性投资者会对价格造成冲击；经理层有判断估值是否错误的能力并进行相应市场操作。","label":"分析法的两点基础"},{"t":"经理层的独特优势：与投资者之间存在信息不对称（内部人）；受约束更少——投资者即使判断公司高估，也受不持股与卖空限制的约束而无法有效利用，而经理层可在高估时增发股票。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经理层的独特优势</strong>：与投资者之间存在信息不对称（内部人）；受约束更少——投资者即使判断公司高估，也受不持股与卖空限制的约束而无法有效利用，而经理层可在高估时增发股票。","label":"经理层的独特优势"},{"t":"（蒙蒂尔）公司财务可能是最少使用行为金融分析方法的领域；莫迪利亚尼-米勒的资本结构理论与股息无关理论基于有效市场前提，现实世界需要行为重构；行为分析公司财务分两类框架——理性的市场+非理性的经理人，与理性的经理人+非理性的市场。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）公司财务可能是最少使用行为金融分析方法的领域；莫迪利亚尼-米勒的资本结构理论与股息无关理论基于有效市场前提，现实世界需要行为重构；行为分析公司财务分两类框架——理性的市场+非理性的经理人，与理性的经理人+非理性的市场。","label":"（蒙蒂尔）公司财务可能是最少使用行为…"},{"t":"章节脉络：15.1 引入经理层三目标权衡模型；15.2 迎合与择时的例子（更名、股利政策、发行与回购、并购）；15.3 比较投资者非理性与经理层非理性的政策含义。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">章节脉络</strong>：15.1 引入经理层三目标权衡模型；15.2 迎合与择时的例子（更名、股利政策、发行与回购、并购）；15.3 比较投资者非理性与经理层非理性的政策含义。","label":"章节脉络"}],"k":"sec","i":0,"h":"<strong class=\"lead\">引言</strong>：行为金融进入公司金融的两条路径","label":"引言：行为金融进入公司金融的两条路径"},{"t":"15.1 经理层目标和定价错误","c":[{"t":"15.1.1 一个简单的说明模型","c":[{"t":"模型来源：贝克（Malcolm Baker）、鲁巴克（Richard Ruback）、沃格勒（Jeffery Wurgler）构建的\"存在潜在定价错误时经理层如何在三个冲突目标间权衡\"的模型（简化版）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">模型来源</strong>：贝克（Malcolm Baker）、鲁巴克（Richard Ruback）、沃格勒（Jeffery Wurgler）构建的&quot;存在潜在定价错误时经理层如何在三个冲突目标间权衡&quot;的模型（简化版）。","label":"模型来源"},{"t":"目标一（理性价值）：与传统一致，最大化未来现金流的贴现值，基本价值为 f(K,d)−K；K 为投资、d 为股利、f 为凹的增函数（标准产出函数），资本成本标准化为1；股利进入产出函数源于税收体制下的非中性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">目标一</strong>（理性价值）：与传统一致，最大化未来现金流的贴现值，基本价值为 f(K,d)−K；K 为投资、d 为股利、f 为凹的增函数（标准产出函数），资本成本标准化为1；股利进入产出函数源于税收体制下的非中性。","label":"目标一（理性价值）：与传统一致，最大…"},{"t":"目标二（迎合）：最大化当前股票价格与价值之差，即暂时性定价错误（mispricing，股票价格偏离基本价值的部分）δ，由 S(K,d,ε,x) 决定；投资形态影响 δ（投资者可能认为特定形式的投资如20世纪90年代信息技术能产生高于实际的价值）；股利影响 δ（若某些投资者群体偏好特定股利模式而市场上公司不足以满足全部偏好，经理层会改变股利政策迎合）；ε 为增发股票的潜在比例（高估时高价发行形成的卖出压力能减轻定价错误）；x 为吸引投资者的措施的指示变量（会计口径变化、盈余管理、公司更名等，成本很小）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">目标二</strong>（迎合）：最大化当前股票价格与价值之差，即暂时性定价错误（mispricing，股票价格偏离基本价值的部分）δ，由 S(K,d,ε,x) 决定；投资形态影响 δ（投资者可能认为特定形式的投资如20世纪90年代信息技术能产生高于实际的价值）；股利影响 δ（若某些投资者群体偏好特定股利模式而市场上公司不足以满足全部偏好，经理层会改变股利政策迎合）；ε 为增发股票的潜在比例（高估时高价发行形成的卖出压力能减轻定价错误）；x 为吸引投资者的措施的指示变量（会计口径变化、盈余管理、公司更名等，成本很小）。","label":"目标二（迎合）：最大化当前股票价格与…"},{"t":"目标三（长期择时）：利用当前股价错误为原始股东的长期利益服务——股价高估时发行股票、低估时赎回股票；通过增发 ε 比例股票获利，代价由新股东承担。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">目标三</strong>（长期择时）：利用当前股价错误为原始股东的长期利益服务——股价高估时发行股票、低估时赎回股票；通过增发 ε 比例股票获利，代价由新股东承担。","label":"目标三（长期择时）：利用当前股价错误…"},{"t":"最优化问题（式15-4）：max λ[f(K,d)−K+εδ]+(1−λ)δ，0<λ<1 代表经理层的远见（视野）参数。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最优化问题</strong>（式15-4）：max λ[f(K,d)−K+εδ]+(1−λ)δ，0&lt;λ&lt;1 代表经理层的远见（视野）参数。","label":"最优化问题"},{"t":"短视极限 λ→0：最优化问题退化为 max δ，经理层\"拿了钱就跑\"、只考虑短期迎合；但基于声誉考虑和合理设计的合约约束，通常不会出现这种情形。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短视极限 λ→0</strong>：最优化问题退化为 max δ，经理层&quot;拿了钱就跑&quot;、只考虑短期迎合；但基于声誉考虑和合理设计的合约约束，通常不会出现这种情形。","label":"短视极限 λ→0"},{"t":"远视极限 λ→1：最优化问题退化为 max f(K,d)−K+εδ，经理层只出于股东长期利益进行迎合——仅保留增发与赎回，其他迎合不进入考虑。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">远视极限 λ→1</strong>：最优化问题退化为 max f(K,d)−K+εδ，经理层只出于股东长期利益进行迎合——仅保留增发与赎回，其他迎合不进入考虑。","label":"远视极限 λ→1"}],"k":"b","i":1,"h":"15.1.1 一个简单的说明模型","label":"15.1.1 一个简单的说明模型"},{"t":"15.1.2 一阶条件","c":[{"t":"投资的一阶条件（式15-7）：最优处投资的边际产出等于成本减去迎合带来的收益，后者包括融资的市场择时与短期利益两方面。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">投资的一阶条件</strong>（式15-7）：最优处投资的边际产出等于成本减去迎合带来的收益，后者包括融资的市场择时与短期利益两方面。","label":"投资的一阶条件"},{"t":"增发的一阶条件（式15-8）：把经理层的择时能力与融资联系起来；两个目标相互冲突——高估时融资利于股东长期利益，但由此消除定价错误不利于短期迎合目标，最优是两者的平衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">增发的一阶条件</strong>（式15-8）：把经理层的择时能力与融资联系起来；两个目标相互冲突——高估时融资利于股东长期利益，但由此消除定价错误不利于短期迎合目标，最优是两者的平衡。","label":"增发的一阶条件"},{"t":"股利的一阶条件（式15-9）：由于个人所得税这一税制问题，股利对真实价值的影响未知；经理层须权衡真实价值影响与迎合收益（市场融资择时+个人股利偏好两方面）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">股利的一阶条件</strong>（式15-9）：由于个人所得税这一税制问题，股利对真实价值的影响未知；经理层须权衡真实价值影响与迎合收益（市场融资择时+个人股利偏好两方面）。","label":"股利的一阶条件"},{"t":"短视（λ→0）的含义：投资继续与否与项目实际 NPV 无关，仅取决于能否推高股价（相对股票价值）；股利政策完全基于投资者的短期偏好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短视</strong>（λ→0）的含义：投资继续与否与项目实际 NPV 无关，仅取决于能否推高股价（相对股票价值）；股利政策完全基于投资者的短期偏好。","label":"短视（λ→0）的含义：投资继续与否与…"},{"t":"指示变量 x 的采用规则（式15-10）：若 δ(K,e,d,x=1)>δ(K,e,d,x=0)，措施将被采用——无论从短期迎合还是长期增发股票的立场看，采用都有利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">指示变量 x 的采用规则</strong>（式15-10）：若 δ(K,e,d,x=1)&gt;δ(K,e,d,x=0)，措施将被采用——无论从短期迎合还是长期增发股票的立场看，采用都有利。","label":"指示变量 x 的采用规则"}],"k":"b","i":1,"h":"15.1.2 一阶条件","label":"15.1.2 一阶条件"}],"k":"sec","i":0,"h":"15.1 经理层目标和定价错误","label":"15.1 经理层目标和定价错误"},{"t":"15.2 经理层利用定价错误的例子","c":[{"t":"15.2.1 变更公司名称","c":[{"t":"迎合逻辑：更名是成本很低的迎合手段；市场知道产品名称不影响公司真实价值，但投资者虽然投入真金白银、操作比普通消费者更谨慎，仍会受这一措施迷惑（正面情感使某些行业吸引更多投资，而更名远比转换行业容易）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">迎合逻辑</strong>：更名是成本很低的迎合手段；市场知道产品名称不影响公司真实价值，但投资者虽然投入真金白银、操作比普通消费者更谨慎，仍会受这一措施迷惑（正面情感使某些行业吸引更多投资，而更名远比转换行业容易）。","label":"迎合逻辑"},{"t":"库珀-迪米特洛夫-劳研究：20世纪90年代互联网泡沫期更名为\".com\"的潮流——1998年6~7月更名的147家公司股价都出现上涨（常为大幅上涨），即使公司实际运营与互联网只有很小关联或没有关联。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">库珀-迪米特洛夫-劳研究</strong>：20世纪90年代互联网泡沫期更名为&quot;.com&quot;的潮流——1998年6~7月更名的147家公司股价都出现上涨（常为大幅上涨），即使公司实际运营与互联网只有很小关联或没有关联。","label":"库珀-迪米特洛夫-劳研究"},{"t":"惊人案例：Computer Literacy, Inc. 以方便顾客记住公司网址为由更名 Fatbrain.com；公告前一天消息泄露至互联网聊天室后股价大涨33%；10天公告窗口期内\".com\"效应带来74%的平均累计超额收益率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">惊人案例</strong>：Computer Literacy, Inc. 以方便顾客记住公司网址为由更名 Fatbrain.com；公告前一天消息泄露至互联网聊天室后股价大涨33%；10天公告窗口期内&quot;.com&quot;效应带来74%的平均累计超额收益率。","label":"惊人案例"},{"t":"反向迎合：互联网泡沫崩溃后（2000年8月至2001年9月），剥离\".com\"名称的公司能实现约70%的超额收益；部分公司\"双重受益\"（上涨时改成.com、下跌时再改掉）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反向迎合</strong>：互联网泡沫崩溃后（2000年8月至2001年9月），剥离&quot;.com&quot;名称的公司能实现约70%的超额收益；部分公司&quot;双重受益&quot;（上涨时改成.com、下跌时再改掉）。","label":"反向迎合"}],"k":"b","i":1,"h":"15.2.1 变更公司名称","label":"15.2.1 变更公司名称"},{"t":"15.2.2 解释股利支付政策","c":[{"t":"基准：莫迪利亚尼-米勒（Modigliani-Miller）股利无关定理——不存在税收、无交易成本和信息不对称，且公司融资、投资政策不变时，股利支付政策与公司价值无关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">基准</strong>：莫迪利亚尼-米勒（Modigliani-Miller）股利无关定理——不存在税收、无交易成本和信息不对称，且公司融资、投资政策不变时，股利支付政策与公司价值无关。","label":"基准：莫迪利亚尼-米勒（Modigl…"},{"t":"自制股利（home-made dividends）：想要现金股利而公司不分红的投资者可卖出部分股票、以现金收益自行等量\"分红\"；持有分红股票但不想拿现金的投资者可将股利再投资——无摩擦市场中投资者能随意\"设定\"股利支付率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自制股利</strong>（home-made dividends）：想要现金股利而公司不分红的投资者可卖出部分股票、以现金收益自行等量&quot;分红&quot;；持有分红股票但不想拿现金的投资者可将股利再投资——无摩擦市场中投资者能随意&quot;设定&quot;股利支付率。","label":"自制股利"},{"t":"现实摩擦：税收和交易成本等市场摩擦使经理层尽力维持投资者想要的股利政策稳定，只在不得已时才削减股利；林特纳（Lintner, 1956）经典研究的结论之一是经理层不因新投资的资金需求而改变股利支付（蒙蒂尔：这篇经典实证文献即具有显著的行为分析特征，是公司财务行为分析的先声）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现实摩擦</strong>：税收和交易成本等市场摩擦使经理层尽力维持投资者想要的股利政策稳定，只在不得已时才削减股利；林特纳（Lintner, 1956）经典研究的结论之一是经理层不因新投资的资金需求而改变股利支付（蒙蒂尔：这篇经典实证文献即具有显著的行为分析特征，是公司财务行为分析的先声）。","label":"现实摩擦"},{"t":"法玛-弗伦奇证据（1972-1999，纽交所/AMEX/纳斯达克）：1973年上市的非金融、非公用事业企业中52.8%分红，1978年升至66.5%的高点，之后降至1999年的20.8%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">法玛-弗伦奇证据</strong>（1972-1999，纽交所/AMEX/纳斯达克）：1973年上市的非金融、非公用事业企业中52.8%分红，1978年升至66.5%的高点，之后降至1999年的20.8%。","label":"法玛-弗伦奇证据"},{"t":"公司特征只解释一半：大、盈利强、投资机会少的公司倾向分红，而期间新上市公司小、盈利弱、成长机会多（70年代新上市群体平均盈利为账面价值的17.8%，全体上市公司为13.7%；1993-1998年新上市仅2.1%，全体11.3%）；未被解释的另一半反映控制公司特征后分红倾向本身在降低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公司特征只解释一半</strong>：大、盈利强、投资机会少的公司倾向分红，而期间新上市公司小、盈利弱、成长机会多（70年代新上市群体平均盈利为账面价值的17.8%，全体上市公司为13.7%；1993-1998年新上市仅2.1%，全体11.3%）；未被解释的另一半反映控制公司特征后分红倾向本身在降低。","label":"公司特征只解释一半"},{"t":"迎合解释（贝克-沃格勒）：股利溢价（dividend premium）——市场上分红公司和非分红公司的平均市值账面比之差——的时间变化可预测上市公司分红比例；溢价上升表明投资者对分红公司偏好上升、分红比例随之上升，下降则对应分红消失（disappearing dividends）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">迎合解释</strong>（贝克-沃格勒）：股利溢价（dividend premium）——市场上分红公司和非分红公司的平均市值账面比之差——的时间变化可预测上市公司分红比例；溢价上升表明投资者对分红公司偏好上升、分红比例随之上升，下降则对应分红消失（disappearing dividends）。","label":"迎合解释"},{"t":"四段股利支付趋势均伴随股利溢价波动：20世纪60年代中期倾向支付股利；趋势下降并于1969年进入负区域；随后从1970年上升进入正区域直至1977年；最后是持续至今的分红消失时期。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">四段股利支付趋势均伴随股利溢价波动</strong>：20世纪60年代中期倾向支付股利；趋势下降并于1969年进入负区域；随后从1970年上升进入正区域直至1977年；最后是持续至今的分红消失时期。","label":"四段股利支付趋势均伴随股利溢价波动"},{"t":"客户需求理论（clientele theory，布莱克-斯科尔斯）：股利政策与税收、交易成本、制度环境等市场不完善有关，公司迅速调整以满足客户需求后不再有更改动机——基于一般均衡视角；贝克-沃格勒从非均衡状态考察，认为证据更支持对非理性投资者情绪变化的迎合。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">客户需求理论</strong>（clientele theory，布莱克-斯科尔斯）：股利政策与税收、交易成本、制度环境等市场不完善有关，公司迅速调整以满足客户需求后不再有更改动机——基于一般均衡视角；贝克-沃格勒从非均衡状态考察，认为证据更支持对非理性投资者情绪变化的迎合。","label":"客户需求理论"},{"t":"四条区分证据：理性需求应相关于股利总支付量而非分红公司比例，但股利溢价对总量无解释力；影响股利相对回报率的税收政策变化对股利溢价无实际影响；70年代中期以来的交易成本下降与分红下降一致，但股利溢价仍是主要推动因素；1974年《雇员退休收入保障法案》（ERISA）及其1979年修订只是补充解释。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">四条区分证据</strong>：理性需求应相关于股利总支付量而非分红公司比例，但股利溢价对总量无解释力；影响股利相对回报率的税收政策变化对股利溢价无实际影响；70年代中期以来的交易成本下降与分红下降一致，但股利溢价仍是主要推动因素；1974年《雇员退休收入保障法案》（ERISA）及其1979年修订只是补充解释。","label":"四条区分证据"},{"t":"情绪证据的补充：封闭式基金折价（closed-end fund discount，投资者情绪的另一代表变量）与股利溢价相关；分红公司比例的增加能预测分红公司相对于不分红公司收益率的下降——市场对分红公司的高估先于分红公司增多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情绪证据的补充</strong>：封闭式基金折价（closed-end fund discount，投资者情绪的另一代表变量）与股利溢价相关；分红公司比例的增加能预测分红公司相对于不分红公司收益率的下降——市场对分红公司的高估先于分红公司增多。","label":"情绪证据的补充"},{"t":"（蒙蒂尔）股息之谜的互补视角：股息常被解释为公司未来盈利的信心的信号，但贝纳茨-米开里-塞勒表明公司增加股息与未来经营业绩无关、反映的是过去；在\"非理性经理人\"框架下，股息还可理解为外部人的现金提取机制（见第16章）。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）股息之谜的互补视角：股息常被解释为公司未来盈利的信心的信号，但贝纳茨-米开里-塞勒表明公司增加股息与未来经营业绩无关、反映的是过去；在&quot;非理性经理人&quot;框架下，股息还可理解为外部人的现金提取机制（见第16章）。","label":"（蒙蒂尔）股息之谜的互补视角：股息常…"}],"k":"b","i":1,"h":"15.2.2 解释股利支付政策","label":"15.2.2 解释股利支付政策"},{"t":"15.2.3 股票发行和赎回","c":[{"t":"择时逻辑：股价高估时发行股票（非上市公司 IPO、上市公司 SEO）使长期投资的老股东获益；低估时赎回（回购）能维护股东利益；问卷调查表明职业经理人至少相信他们在发行时利用了定价错误。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">择时逻辑</strong>：股价高估时发行股票（非上市公司 IPO、上市公司 SEO）使长期投资的老股东获益；低估时赎回（回购）能维护股东利益；问卷调查表明职业经理人至少相信他们在发行时利用了定价错误。","label":"择时逻辑"},{"t":"意大利证据（1982-1992）：影响IPO的主要因素是行业平均市值账面比——比值每增加1个标准差，IPO发行概率增加25%；发行后公司投资和盈利能力下降的事实表明发行择时是重要考虑因素。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">意大利证据</strong>（1982-1992）：影响IPO的主要因素是行业平均市值账面比——比值每增加1个标准差，IPO发行概率增加25%；发行后公司投资和盈利能力下降的事实表明发行择时是重要考虑因素。","label":"意大利证据"},{"t":"美国长期证据：1935~1972年数据表明IPO后5年期收益率低于市场收益率21%~35%；股票发行占总融资量（债务+权益）的比例能预测市场收益率——高股票发行的年份随后是低收益的股票市场。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">美国长期证据</strong>：1935~1972年数据表明IPO后5年期收益率低于市场收益率21%~35%；股票发行占总融资量（债务+权益）的比例能预测市场收益率——高股票发行的年份随后是低收益的股票市场。","label":"美国长期证据"},{"t":"国际证据：13个主要市场中有12个出现高股票发行导致未来市场低收益率的现象。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">国际证据</strong>：13个主要市场中有12个出现高股票发行导致未来市场低收益率的现象。","label":"国际证据"},{"t":"回购择时：香港市场5111次回购的实证表明市场择时功效强大；回购后市场反应不足并带来长期超额回报，表明市场并非完全有效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">回购择时</strong>：香港市场5111次回购的实证表明市场择时功效强大；回购后市场反应不足并带来长期超额回报，表明市场并非完全有效。","label":"回购择时"},{"t":"分红与回购的灵活性对比：问卷调查和实证均表明经理层认为赎回是更灵活的选择——公司尽量避免股利支付不稳定，但赎回政策的变化可接受；费尔柴尔德-张刚刚的模型表明，与股利一样，为迎合而制定的回购政策效率低下并浪费投资机会。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">分红与回购的灵活性对比</strong>：问卷调查和实证均表明经理层认为赎回是更灵活的选择——公司尽量避免股利支付不稳定，但赎回政策的变化可接受；费尔柴尔德-张刚刚的模型表明，与股利一样，为迎合而制定的回购政策效率低下并浪费投资机会。","label":"分红与回购的灵活性对比"},{"t":"（蒙蒂尔）发行行为=利用定价错误的套利：兼并、收购、IPO、SEO与股票回购基本上都可视为企业为已上市股票创造（近似）替代品、利用市场错误定价进行套利。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）发行行为=利用定价错误的套利：兼并、收购、IPO、SEO与股票回购基本上都可视为企业为已上市股票创造（近似）替代品、利用市场错误定价进行套利。","label":"（蒙蒂尔）发行行为=利用定价错误的套…"},{"t":"（蒙蒂尔）IPO三特征：初始抑价（initial underpricing，发行价与首日收盘价的巨大差距——美国1960-1996年平均16%、1996-2000年升至37%；英国1991-2000年平均28%）；IPO热门市场（初始回报与发行数量呈周期性、集中于市场高峰附近）；IPO长期表现不佳（发行后5年每年落后规模可比公司约3.4%）。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）IPO三特征：初始抑价（initial underpricing，发行价与首日收盘价的巨大差距——美国1960-1996年平均16%、1996-2000年升至37%；英国1991-2000年平均28%）；IPO热门市场（初始回报与发行数量呈周期性、集中于市场高峰附近）；IPO长期表现不佳（发行后5年每年落后规模可比公司约3.4%）。","label":"（蒙蒂尔）IPO三特征：初始抑价（i…"},{"t":"（蒙蒂尔）留在桌面上的钱（money left on the table）：初始回报×发行股数；美国IPO平均900万美元，1990-1998年合计约270亿美元，是同期承销费用（130亿美元）的两倍多。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）留在桌面上的钱（money left on the table）：初始回报×发行股数；美国IPO平均900万美元，1990-1998年合计约270亿美元，是同期承销费用（130亿美元）的两倍多。","label":"（蒙蒂尔）留在桌面上的钱（money…"},{"t":"（蒙蒂尔）抑价的四种解释：赢者的诅咒（投资者信息劣势与逆向选择要求折价补偿）、市场反馈假说（簿记建档中先低价诱使投资者披露真实估值，价格上修的IPO首日回报更高）、潮流假说（避免\"无人认购\"的从众风险）、信号假说（投资银行重视声誉与交易成功率而非费用最大化）。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）抑价的四种解释：赢者的诅咒（投资者信息劣势与逆向选择要求折价补偿）、市场反馈假说（簿记建档中先低价诱使投资者披露真实估值，价格上修的IPO首日回报更高）、潮流假说（避免&quot;无人认购&quot;的从众风险）、信号假说（投资银行重视声誉与交易成功率而非费用最大化）。","label":"（蒙蒂尔）抑价的四种解释：赢者的诅咒…"},{"t":"（蒙蒂尔）机会窗口假说（windows of opportunity hypothesis）：公司选择投资者热情高涨（刚经历大范围高收益、市场被高估）的窗口发行股票；卖空限制（IPO股票难以借入、SEC禁止承销团成员30天内出借分配股票）使初始价格由过度乐观者决定；发行量最高时期的IPO估值更高、长期回报更低；IPO五年后平均仅61.4%的股票仍活跃、近22%消失；洛瑞发现IPO数量波动部分源于真实资本需求、部分源于投资者需求（情绪）。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）机会窗口假说（windows of opportunity hypothesis）：公司选择投资者热情高涨（刚经历大范围高收益、市场被高估）的窗口发行股票；卖空限制（IPO股票难以借入、SEC禁止承销团成员30天内出借分配股票）使初始价格由过度乐观者决定；发行量最高时期的IPO估值更高、长期回报更低；IPO五年后平均仅61.4%的股票仍活跃、近22%消失；洛瑞发现IPO数量波动部分源于真实资本需求、部分源于投资者需求（情绪）。","label":"（蒙蒂尔）机会窗口假说（window…"},{"t":"（蒙蒂尔）意见分歧与IPO统一模型：在卖空受限、信念异质的市场中价格由乐观投资者决定，随着信息增加、意见分歧缩小，边际投资者不再过度乐观、股价回落；永奎斯特-南达-辛格的统一模型给出多条预测——意见分歧越大抑价越高且长期表现越差；市场升温时低质量公司上市增多（美国全年盈利公司比例由1997年68%骤降至1999年25%）；承销商偏好机构投资者、惩罚抛售者；锁定期结束股价大幅下跌。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）意见分歧与IPO统一模型：在卖空受限、信念异质的市场中价格由乐观投资者决定，随着信息增加、意见分歧缩小，边际投资者不再过度乐观、股价回落；永奎斯特-南达-辛格的统一模型给出多条预测——意见分歧越大抑价越高且长期表现越差；市场升温时低质量公司上市增多（美国全年盈利公司比例由1997年68%骤降至1999年25%）；承销商偏好机构投资者、惩罚抛售者；锁定期结束股价大幅下跌。","label":"（蒙蒂尔）意见分歧与IPO统一模型：…"},{"t":"（蒙蒂尔）SEO与可转债：SEO平均公告效应约-3%（市场解读为经理层认为股价被高估的信号），且市场反应不足——SEO公司发行前一年平均回报72%、发行后5年每年落后市值可比公司4.5%（风格基准下落后3.6%）；可转债相当于给普通债券附加可能被高估的看涨期权，发行人股票5年异常回报中位数-25%（普通债券-14%）、经营业绩随后急剧恶化。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）SEO与可转债：SEO平均公告效应约-3%（市场解读为经理层认为股价被高估的信号），且市场反应不足——SEO公司发行前一年平均回报72%、发行后5年每年落后市值可比公司4.5%（风格基准下落后3.6%）；可转债相当于给普通债券附加可能被高估的看涨期权，发行人股票5年异常回报中位数-25%（普通债券-14%）、经营业绩随后急剧恶化。","label":"（蒙蒂尔）SEO与可转债：SEO平均…"},{"t":"（蒙蒂尔）回购与分拆：回购公告效应约2%、长期年化异常收益3%（三年合计9%），市场反应不足；回购的价值型股票多由低估驱动（回购前月回报-0.91%），成长型回购更多与期权稀释有关；分拆上市公告效应2%~4%、分拆出的子公司长期不跑输大盘（欧洲案例：子公司3年超市场17%、母公司落后6%，价值创造集中于分拆后第二年）；追踪股（tracking stock，赋予持有人对多部门公司某一业务现金流所有权的股票，AT&T、迪士尼、通用汽车等均曾发行）公告效应约3%、但3年跑输市场40.5%——经理层善用市场对特定业务的过度乐观。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）回购与分拆：回购公告效应约2%、长期年化异常收益3%（三年合计9%），市场反应不足；回购的价值型股票多由低估驱动（回购前月回报-0.91%），成长型回购更多与期权稀释有关；分拆上市公告效应2%~4%、分拆出的子公司长期不跑输大盘（欧洲案例：子公司3年超市场17%、母公司落后6%，价值创造集中于分拆后第二年）；追踪股（tracking stock，赋予持有人对多部门公司某一业务现金流所有权的股票，AT&amp;T、迪士尼、通用汽车等均曾发行）公告效应约3%、但3年跑输市场40.5%——经理层善用市场对特定业务的过度乐观。","label":"（蒙蒂尔）回购与分拆：回购公告效应约…"},{"t":"（蒙蒂尔）择时的更广含义：债券发行也存在收益率曲线择时（贝克-格林伍德-沃格勒）；若经理层确实在择时，\"最优资本结构\"失去意义——资本结构反映的是过去择时尝试的结果，暂时的错误定价也会导致资本结构永久转变；投资者应对任何寻求在市场上筹集资金的公司保持谨慎。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）择时的更广含义：债券发行也存在收益率曲线择时（贝克-格林伍德-沃格勒）；若经理层确实在择时，&quot;最优资本结构&quot;失去意义——资本结构反映的是过去择时尝试的结果，暂时的错误定价也会导致资本结构永久转变；投资者应对任何寻求在市场上筹集资金的公司保持谨慎。","label":"（蒙蒂尔）择时的更广含义：债券发行也…"}],"k":"b","i":1,"h":"15.2.3 股票发行和赎回","label":"15.2.3 股票发行和赎回"},{"t":"15.2.4 兼并和收购","c":[{"t":"标准理论：存在（真实）协同效应时，即使正确定价的公司合并也是合理的，各自独立运营则破坏价值创造。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">标准理论</strong>：存在（真实）协同效应时，即使正确定价的公司合并也是合理的，各自独立运营则破坏价值创造。","label":"标准理论"},{"t":"市场驱动并购（stock market driven acquisitions，施雷弗-维什尼）：公司兼并源于错误定价（特别是被高估）；协同效应只是市场认为存在、实际并不存在；设两家公司定价 Q 与 Q1（Q<Q1，公司1被高估），市场对新合并公司单位资本的定价 S 一般介于两者之间（Q<S<Q1）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">市场驱动并购</strong>（stock market driven acquisitions，施雷弗-维什尼）：公司兼并源于错误定价（特别是被高估）；协同效应只是市场认为存在、实际并不存在；设两家公司定价 Q 与 Q1（Q&lt;Q1，公司1被高估），市场对新合并公司单位资本的定价 S 一般介于两者之间（Q&lt;S&lt;Q1）。","label":"市场驱动并购"},{"t":"短期收益（式15-11）：S(K+K1)−KQ−K1Q1；S 足够高时为正，即市场\"认为\"协同效应存在。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短期收益</strong>（式15-11）：S(K+K1)−KQ−K1Q1；S 足够高时为正，即市场&quot;认为&quot;协同效应存在。","label":"短期收益"},{"t":"长期与报价：长期而言市场最终\"认识到\"协同并不真实、合并不带来长期收益；收购报价 P 满足 Q<P<S；被兼并方（公司0）短期收益为 (P−Q)K>0；兼并方短期收益为 (S−P)K+(S−Q1)K1，其中稀释效应项为负，P 过于接近 S 时兼并方短期价值可能为负——但兼并仍可能发生。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长期与报价</strong>：长期而言市场最终&quot;认识到&quot;协同并不真实、合并不带来长期收益；收购报价 P 满足 Q&lt;P&lt;S；被兼并方（公司0）短期收益为 (P−Q)K&gt;0；兼并方短期收益为 (S−P)K+(S−Q1)K1，其中稀释效应项为负，P 过于接近 S 时兼并方短期价值可能为负——但兼并仍可能发生。","label":"长期与报价"},{"t":"现金收购与股票收购的长期结果：现金收购的起因是对被低估公司的兼并（收购方长期收益 K(q−P)>0），被收购方经理层可宣称交易损害股东长期利益而强烈抵制——这是被收购方抵制现金并购的原因；股票收购中若 P<S 收购方股东仍获长期收益、被收购方获得市场高涨期的短期收益——被收购方经理层即使知道长期受损仍会同意，或因短视（临近退休时变现被高估的股票），或为换取加速股票行权、高额离职金、保留高管职位等奖励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现金收购与股票收购的长期结果</strong>：现金收购的起因是对被低估公司的兼并（收购方长期收益 K(q−P)&gt;0），被收购方经理层可宣称交易损害股东长期利益而强烈抵制——这是被收购方抵制现金并购的原因；股票收购中若 P&lt;S 收购方股东仍获长期收益、被收购方获得市场高涨期的短期收益——被收购方经理层即使知道长期受损仍会同意，或因短视（临近退休时变现被高估的股票），或为换取加速股票行权、高额离职金、保留高管职位等奖励。","label":"现金收购与股票收购的长期结果"},{"t":"\"缓冲\"逻辑：即使短期与长期收益均为负，股票收购对收购方仍可能有益——用被高估的股票相对廉价地购得真实资本，缓冲公司价值的最终下跌。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">&quot;缓冲&quot;逻辑</strong>：即使短期与长期收益均为负，股票收购对收购方仍可能有益——用被高估的股票相对廉价地购得真实资本，缓冲公司价值的最终下跌。","label":"\"缓冲\"逻辑"},{"t":"经验证据：兼并方在现金收购后的长期收益为正、股票收购后的长期收益为负；股票被高估的公司更多采用股票收购；并购浪潮集中在股票市场高涨期——20世纪60年代大型企业与90年代科技企业并购均声称协同效应但大部分未实现，股票收购普遍且收购方股票被大大高估；80年代购并主要涉及被低估公司、多用现金收购完成。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经验证据</strong>：兼并方在现金收购后的长期收益为正、股票收购后的长期收益为负；股票被高估的公司更多采用股票收购；并购浪潮集中在股票市场高涨期——20世纪60年代大型企业与90年代科技企业并购均声称协同效应但大部分未实现，股票收购普遍且收购方股票被大大高估；80年代购并主要涉及被低估公司、多用现金收购完成。","label":"经验证据"},{"t":"（蒙蒂尔）观察等价（observational equivalence）：非理性经理人/理性市场与理性经理人/非理性市场两种理论对并购典型事实的预测基本相同；2000年全球并购25207宗、总额30620亿美元；等权重样本下合并通常破坏价值、股票融资尤甚（价值加权下业绩不佳集中于小企业）。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）观察等价（observational equivalence）：非理性经理人/理性市场与理性经理人/非理性市场两种理论对并购典型事实的预测基本相同；2000年全球并购25207宗、总额30620亿美元；等权重样本下合并通常破坏价值、股票融资尤甚（价值加权下业绩不佳集中于小企业）。","label":"（蒙蒂尔）观察等价（observat…"},{"t":"（蒙蒂尔）施雷弗-维什尼模型的三条预测：市场估值较高时股权收购比例更高、估值较低时现金收购比例更高；现金收购中被收购方在收购前获得低回报、股权收购中收购方获得高回报；股权收购的收购方长期回报可能为负、现金收购可能为正——均与实证相符；争议性推论：即使回报为负，用高估股权收购\"高估较轻\"的公司（如美国在线并购时代华纳）也可能符合股东利益。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）施雷弗-维什尼模型的三条预测：市场估值较高时股权收购比例更高、估值较低时现金收购比例更高；现金收购中被收购方在收购前获得低回报、股权收购中收购方获得高回报；股权收购的收购方长期回报可能为负、现金收购可能为正——均与实证相符；争议性推论：即使回报为负，用高估股权收购&quot;高估较轻&quot;的公司（如美国在线并购时代华纳）也可能符合股东利益。","label":"（蒙蒂尔）施雷弗-维什尼模型的三条预…"}],"k":"b","i":1,"h":"15.2.4 兼并和收购","label":"15.2.4 兼并和收购"}],"k":"sec","i":0,"h":"15.2 经理层利用定价错误的例子","label":"15.2 经理层利用定价错误的例子"},{"t":"15.3 非理性经理层还是非理性投资者","c":[{"t":"本章定位：集中研究投资者非理性时理性经理层的决策；第16章考察经理层因受行为因素影响所犯的错误。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章定位</strong>：集中研究投资者非理性时理性经理层的决策；第16章考察经理层因受行为因素影响所犯的错误。","label":"本章定位"},{"t":"政策含义的分野：若投资者非理性而经理层理性，需要保护经理层免受市场和投资者的短期、不切实际压力的影响；若是经理层行为有偏差并对股东价值造成负面影响，董事会和监管层需要仔细检查经理层的决策过程。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">政策含义的分野</strong>：若投资者非理性而经理层理性，需要保护经理层免受市场和投资者的短期、不切实际压力的影响；若是经理层行为有偏差并对股东价值造成负面影响，董事会和监管层需要仔细检查经理层的决策过程。","label":"政策含义的分野"},{"t":"与第16章的关系：两种框架各有不同的政策指向，共同构成公司金融行为分析的两条主线（蒙蒂尔：未来研究还需考察非理性经理人与非理性市场的相互作用）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">与第16章的关系</strong>：两种框架各有不同的政策指向，共同构成公司金融行为分析的两条主线（蒙蒂尔：未来研究还需考察非理性经理人与非理性市场的相互作用）。","label":"与第16章的关系"}],"k":"sec","i":0,"h":"15.3 非理性经理层还是非理性投资者","label":"15.3 非理性经理层还是非理性投资者"}],"k":"chap","h":"第15章 理性经理层和非理性投资者","label":"第15章 理性经理层和非理性投资者"},{"t":"第16章 行为公司金融和经理层决策","c":[{"t":"本章要点","c":[{"t":"行为缺陷从三方面扭曲资本预算：简便性（偏好回收期法则等次优标准）、损失厌恶（出现沉没成本后继续投钱）、情感（项目选择受无关信息影响）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">行为缺陷从三方面扭曲资本预算</strong>：简便性（偏好回收期法则等次优标准）、损失厌恶（出现沉没成本后继续投钱）、情感（项目选择受无关信息影响）。","label":"行为缺陷从三方面扭曲资本预算"},{"t":"经理层和普通人一样存在过度自信：高估自身运营表现、项目成本预测过度乐观、CFO 预测置信区间过窄；CEO 选拔与治理机制（\"联赛\"式选拔、慷慨报酬、董事会顺从）反而加剧过度自信。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经理层和普通人一样存在过度自信</strong>：高估自身运营表现、项目成本预测过度乐观、CFO 预测置信区间过窄；CEO 选拔与治理机制（&quot;联赛&quot;式选拔、慷慨报酬、董事会顺从）反而加剧过度自信。","label":"经理层和普通人一样存在过度自信"},{"t":"过度自信导致投资扭曲：投资对现金流敏感性更高（马门迭-泰特）、并购更活跃且市场反应更差（非过度自信−12基点对过度自信−90基点）、创设公司过多（坎默-洛瓦洛过度进入实验）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度自信导致投资扭曲</strong>：投资对现金流敏感性更高（马门迭-泰特）、并购更活跃且市场反应更差（非过度自信−12基点对过度自信−90基点）、创设公司过多（坎默-洛瓦洛过度进入实验）。","label":"过度自信导致投资扭曲"},{"t":"过度自信需要代理变量度量：过久持有实值期权、持有至到期、持续增持公司股票等倾向。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度自信需要代理变量度量</strong>：过久持有实值期权、持有至到期、持续增持公司股票等倾向。","label":"过度自信需要代理变量度量"},{"t":"过度自信也有正面影响：使经理人更努力、缓解道德风险、纠正过度风险厌恶、与更高债务发行相关（哈克巴斯）、企业家过度自信为社会提供信息价值。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度自信也有正面影响</strong>：使经理人更努力、缓解道德风险、纠正过度风险厌恶、与更高债务发行相关（哈克巴斯）、企业家过度自信为社会提供信息价值。","label":"过度自信也有正面影响"},{"t":"（蒙蒂尔）\"非理性经理人/理性市场\"框架：过度乐观与过度自信是经理人最常见偏差；优序融资解释融资次序与投资-现金流正相关；自由现金流与多元化并购损害价值；公司治理作为引入外部观点的校正机制、股息作为现金提取机制。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）&quot;非理性经理人/理性市场&quot;框架：过度乐观与过度自信是经理人最常见偏差；优序融资解释融资次序与投资-现金流正相关；自由现金流与多元化并购损害价值；公司治理作为引入外部观点的校正机制、股息作为现金提取机制。","label":"（蒙蒂尔）\"非理性经理人/理性市场\"…"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"引言：从投资者行为到经理层行为","c":[{"t":"金融决策行为解释的演进：一开始侧重投资者方面，之后更多注意力转向公司经理层和企业家的非最优决策，重点是这些决策主体在多大程度上受过度自信的影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">金融决策行为解释的演进</strong>：一开始侧重投资者方面，之后更多注意力转向公司经理层和企业家的非最优决策，重点是这些决策主体在多大程度上受过度自信的影响。","label":"金融决策行为解释的演进"},{"t":"与第15章的框架对照：第15章假设经理层理性、投资者非理性；本章假设经理层自身有偏差，两种方法各自的政策建议不同。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">与第15章的框架对照</strong>：第15章假设经理层理性、投资者非理性；本章假设经理层自身有偏差，两种方法各自的政策建议不同。","label":"与第15章的框架对照"},{"t":"前提假设：公司治理在约束经理层行为方面能力有限。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">前提假设</strong>：公司治理在约束经理层行为方面能力有限。","label":"前提假设"},{"t":"章节脉络：16.1 资本预算中的行为错误；16.2 经理层过度自信的证据；16.3 过度自信与投资决策（过度投资、投资-现金流敏感性、并购、公司创设）；16.4 过度自信的正面影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">章节脉络</strong>：16.1 资本预算中的行为错误；16.2 经理层过度自信的证据；16.3 过度自信与投资决策（过度投资、投资-现金流敏感性、并购、公司创设）；16.4 过度自信的正面影响。","label":"章节脉络"},{"t":"（蒙蒂尔）未来研究需要结合\"理性市场+非理性经理人\"与\"理性经理人+非理性市场\"两种范式，考察非理性经理人与非理性市场之间的相互作用。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）未来研究需要结合&quot;理性市场+非理性经理人&quot;与&quot;理性经理人+非理性市场&quot;两种范式，考察非理性经理人与非理性市场之间的相互作用。","label":"（蒙蒂尔）未来研究需要结合\"理性市场…"}],"k":"sec","i":0,"h":"<strong class=\"lead\">引言</strong>：从投资者行为到经理层行为","label":"引言：从投资者行为到经理层行为"},{"t":"16.1 资本预算：简便性、损失厌恶以及情感","c":[{"t":"16.1.1 回收期法则与简便性","c":[{"t":"净现值法（net present value, NPV）：将项目未来现金流按资本成本贴现并扣除成本的价值比较标准——传统融资理论下最优的资本预算选择。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">净现值法</strong>（net present value, NPV）：将项目未来现金流按资本成本贴现并扣除成本的价值比较标准——传统融资理论下最优的资本预算选择。","label":"净现值法"},{"t":"内部收益率（internal rate of return, IRR）：使项目 NPV 为零的贴现率，用于与资本成本比较；不那么直观。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">内部收益率</strong>（internal rate of return, IRR）：使项目 NPV 为零的贴现率，用于与资本成本比较；不那么直观。","label":"内部收益率"},{"t":"回收期法则（payback period rule）：以收回初始投资所需时间筛选项目；尽快收回投资的意愿直观可见，但回收期基准的选择具有极大随意性——更糟的次优标准。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">回收期法则</strong>（payback period rule）：以收回初始投资所需时间筛选项目；尽快收回投资的意愿直观可见，但回收期基准的选择具有极大随意性——更糟的次优标准。","label":"回收期法则"},{"t":"简便性解释：问卷表明经理层经常使用非最优标准（IRR 乃至回收期法）；一个解释是这些标准易于操作和实现，而纯价值比较的 NPV 是更难掌握的概念——心理方面的因素导致不正确的资本预算标准选择。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">简便性解释</strong>：问卷表明经理层经常使用非最优标准（IRR 乃至回收期法）；一个解释是这些标准易于操作和实现，而纯价值比较的 NPV 是更难掌握的概念——心理方面的因素导致不正确的资本预算标准选择。","label":"简便性解释"}],"k":"b","i":1,"h":"16.1.1 回收期法则与简便性","label":"16.1.1 回收期法则与简便性"},{"t":"16.1.2 沉没成本对放弃投资与否决策的影响","c":[{"t":"沉没成本（sunk cost）：已经发生、无法收回的支出；理性决策不应受其影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">沉没成本</strong>（sunk cost）：已经发生、无法收回的支出；理性决策不应受其影响。","label":"沉没成本"},{"t":"损失厌恶（loss aversion）：人们对损失比对等额收益更敏感，倾向于避免把损失\"记录\"下来——现实中很少见到轻微的负盈余公告，原因可能是公告已被\"操纵\"（或无法操纵时\"洗大澡\"一次性出清）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">损失厌恶</strong>（loss aversion）：人们对损失比对等额收益更敏感，倾向于避免把损失&quot;记录&quot;下来——现实中很少见到轻微的负盈余公告，原因可能是公告已被&quot;操纵&quot;（或无法操纵时&quot;洗大澡&quot;一次性出清）。","label":"损失厌恶"},{"t":"心理账户（mental accounting）：人们按账户管理决策，抱着\"事情会好转\"的期望而不关闭亏损账户。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">心理账户</strong>（mental accounting）：人们按账户管理决策，抱着&quot;事情会好转&quot;的期望而不关闭亏损账户。","label":"心理账户"},{"t":"资本预算含义：正确做法是定期对当前投资做项目可行性分析、及时放弃不合理项目；但放弃项目意味着对事后错误的承认，出于损失厌恶，经理层可能对失败项目继续投资（升级承诺）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">资本预算含义</strong>：正确做法是定期对当前投资做项目可行性分析、及时放弃不合理项目；但放弃项目意味着对事后错误的承认，出于损失厌恶，经理层可能对失败项目继续投资（升级承诺）。","label":"资本预算含义"},{"t":"市场能察觉：有研究表明投资项目终止的声明通常是利好；著名例子是洛克希德公司的 L-1011 飞机项目——政府最终放弃救助、公司终于声明放弃该计划时股价上涨18%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">市场能察觉</strong>：有研究表明投资项目终止的声明通常是利好；著名例子是洛克希德公司的 L-1011 飞机项目——政府最终放弃救助、公司终于声明放弃该计划时股价上涨18%。","label":"市场能察觉"},{"t":"责任与更换管理层：个人在初始投资决定中责任越大，项目放弃的难度越高（\"承认失败\"带来更大烦恼）；新管理层不受这一因素影响，外部力量的接管往往能带来新的思维方式。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">责任与更换管理层</strong>：个人在初始投资决定中责任越大，项目放弃的难度越高（&quot;承认失败&quot;带来更大烦恼）；新管理层不受这一因素影响，外部力量的接管往往能带来新的思维方式。","label":"责任与更换管理层"}],"k":"b","i":1,"h":"16.1.2 沉没成本对放弃投资与否决策的影响","label":"16.1.2 沉没成本对放弃投资与否…"},{"t":"16.1.3 情感对决策过程的影响","c":[{"t":"情感（affect）：与认知相对的情绪性反应，会影响对项目的评价与选择。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情感</strong>（affect）：与认知相对的情绪性反应，会影响对项目的评价与选择。","label":"情感（affect）：与认知相对的情…"},{"t":"直接证据的局限：经理层的情感状态无法度量，直接证据可能最多是奇闻轶事；实验手段能克服这一障碍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">直接证据的局限</strong>：经理层的情感状态无法度量，直接证据可能最多是奇闻轶事；实验手段能克服这一障碍。","label":"直接证据的局限"},{"t":"基达-莫诺-史密斯实验：114位经理人（或类似职务者）被置于5个情境；其中4个情境让被试在\"高 NPV 但以引致负面情感的方式表述\"的投资与\"低 NPV 但中性表述\"的投资之间选择（如合作部门经理被描述为自大和高高在上），最后一个情境为中性对照。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">基达-莫诺-史密斯实验</strong>：114位经理人（或类似职务者）被置于5个情境；其中4个情境让被试在&quot;高 NPV 但以引致负面情感的方式表述&quot;的投资与&quot;低 NPV 但中性表述&quot;的投资之间选择（如合作部门经理被描述为自大和高高在上），最后一个情境为中性对照。","label":"基达-莫诺-史密斯实验"},{"t":"结果（表16-1）：4个实验组中选择高 NPV 项目的比例仅11.8%~22.2%，而控制组中76.2%选择了收益更高的项目——负面情感使公司放弃更优投资、对公司价值造成损害。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>（表16-1）：4个实验组中选择高 NPV 项目的比例仅11.8%~22.2%，而控制组中76.2%选择了收益更高的项目——负面情感使公司放弃更优投资、对公司价值造成损害。","label":"结果（表16-1）：4个实验组中选择…"}],"k":"b","i":1,"h":"16.1.3 情感对决策过程的影响","label":"16.1.3 情感对决策过程的影响"}],"k":"sec","i":0,"h":"<strong class=\"lead\">16.1 资本预算</strong>：简便性、损失厌恶以及情感","label":"16.1 资本预算"},{"t":"16.2 经理层过度自信","c":[{"t":"过度自信（overconfidence）：高估自身知识、信息精确性或能力的偏差。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度自信</strong>（overconfidence）：高估自身知识、信息精确性或能力的偏差。","label":"过度自信"},{"t":"过度乐观（overoptimism）：对未来结果抱有过高期望、低估不利情形的倾向。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度乐观</strong>（overoptimism）：对未来结果抱有过高期望、低估不利情形的倾向。","label":"过度乐观"},{"t":"自我归因偏差（self-attribution bias）：把成功归于自身能力、失败归于外部因素，从而不断强化自信。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">自我归因偏差</strong>（self-attribution bias）：把成功归于自身能力、失败归于外部因素，从而不断强化自信。","label":"自我归因偏差"},{"t":"证据：经理人倾向于高估自己的运营表现；项目成本的过度乐观预测屡见不鲜；CFO 对市场进行预测时只有40%的预测落于市场80%的置信区间。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">证据</strong>：经理人倾向于高估自己的运营表现；项目成本的过度乐观预测屡见不鲜；CFO 对市场进行预测时只有40%的预测落于市场80%的置信区间。","label":"证据：经理人倾向于高估自己的运营表现…"},{"t":"CEO 选拔与监管鼓励过度自信：CEO 是\"联赛\"冠军——登顶需要冒险；正常公司治理机制反而加剧这一倾向，原因有二：慷慨的 CEO 报酬是成功的信号，自我归因偏差的存在导致更大的自信程度；董事会的顺从和投资者\"华尔街法则\"（不满意时直接解雇经理层）的偏好。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">CEO 选拔与监管鼓励过度自信</strong>：CEO 是&quot;联赛&quot;冠军——登顶需要冒险；正常公司治理机制反而加剧这一倾向，原因有二：慷慨的 CEO 报酬是成功的信号，自我归因偏差的存在导致更大的自信程度；董事会的顺从和投资者&quot;华尔街法则&quot;（不满意时直接解雇经理层）的偏好。","label":"CEO 选拔与监管鼓励过度自信"},{"t":"后果举例：过度自信经理层在赢利预测中更可能犯错误，因此更有可能进行赢利操纵。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">后果举例</strong>：过度自信经理层在赢利预测中更可能犯错误，因此更有可能进行赢利操纵。","label":"后果举例"},{"t":"（蒙蒂尔）经理人过度乐观的证据：温斯坦——当人们认为能够控制局面时乐观情绪极为高涨，项目临近完成（感到前景良好）时更加乐观；崔-齐巴特——1993-1998年美国经理人在年底前变得十分悲观（可能为降低市场预期），对8个月以后的预测却坚定乐观；伊拉尼对267位美国经理人收入预测的调查发现明显的过度自信；希顿证明仅用\"经理人过度乐观\"即可解决数个传统分析不能解决的难题。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）经理人过度乐观的证据：温斯坦——当人们认为能够控制局面时乐观情绪极为高涨，项目临近完成（感到前景良好）时更加乐观；崔-齐巴特——1993-1998年美国经理人在年底前变得十分悲观（可能为降低市场预期），对8个月以后的预测却坚定乐观；伊拉尼对267位美国经理人收入预测的调查发现明显的过度自信；希顿证明仅用&quot;经理人过度乐观&quot;即可解决数个传统分析不能解决的难题。","label":"（蒙蒂尔）经理人过度乐观的证据：温斯…"},{"t":"（蒙蒂尔）乐观与融资选择：杜克大学2000年二季度 FEI 调查中，不少于82%的财务主管认为股票市场低估了他们的股权——为优序融资理论的行为解释埋下伏笔。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）乐观与融资选择：杜克大学2000年二季度 FEI 调查中，不少于82%的财务主管认为股票市场低估了他们的股权——为优序融资理论的行为解释埋下伏笔。","label":"（蒙蒂尔）乐观与融资选择：杜克大学2…"}],"k":"sec","i":0,"h":"16.2 经理层过度自信","label":"16.2 经理层过度自信"},{"t":"16.3 投资决策和过度自信","c":[{"t":"本-戴维-格雷厄姆-哈维的 CFO 调查：对 CFO 长达6年的季度问卷，询问1年后和10年后市场表现的90%置信区间及对经济和公司前景的乐观估计；优点是构建了两个不同的过度自信测度——基于估算错误的\"过度自信\"与基于过度乐观的\"过度乐观\"；结合公司层面数据发现：过度自信的经理人投资更多。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本-戴维-格雷厄姆-哈维的 CFO 调查</strong>：对 CFO 长达6年的季度问卷，询问1年后和10年后市场表现的90%置信区间及对经济和公司前景的乐观估计；优点是构建了两个不同的过度自信测度——基于估算错误的&quot;过度自信&quot;与基于过度乐观的&quot;过度乐观&quot;；结合公司层面数据发现：过度自信的经理人投资更多。","label":"本-戴维-格雷厄姆-哈维的 CFO 调查"},{"t":"16.3.1 对现金流的投资敏感性","c":[{"t":"投资对现金流的敏感性（investment-cash flow sensitivity）：公司投资随内部现金流（自由现金流）变动的程度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">投资对现金流的敏感性</strong>（investment-cash flow sensitivity）：公司投资随内部现金流（自由现金流）变动的程度。","label":"投资对现金流的敏感性"},{"t":"经验事实：公司投资和自由现金流正相关；在完美市场和市场有效的情况下不应出现——只要确定 NPV 为正就应投资，与公司资金是否充足无关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经验事实</strong>：公司投资和自由现金流正相关；在完美市场和市场有效的情况下不应出现——只要确定 NPV 为正就应投资，与公司资金是否充足无关。","label":"经验事实"},{"t":"传统解释一（代理问题）：经理层和股东潜在利益不一致导致现金流充裕时过度投资——经理人为自身利益构建商业帝国（詹森-麦克林）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传统解释一</strong>（代理问题）：经理层和股东潜在利益不一致导致现金流充裕时过度投资——经理人为自身利益构建商业帝国（詹森-麦克林）。","label":"传统解释一"},{"t":"传统解释二（信息不对称）：公司股票被低估时，代表股东利益的经理人不通过增发股票融资，投资受内部资金约束。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传统解释二</strong>（信息不对称）：公司股票被低估时，代表股东利益的经理人不通过增发股票融资，投资受内部资金约束。","label":"传统解释二"},{"t":"过度自信解释（马门迭-泰特）：过度自信经理人高估投资项目回报率——内源资金充裕时过度投资；内源资金缺乏、需外部融资时，股价下跌传递市场的不赞同，他们将取消投资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">过度自信解释</strong>（马门迭-泰特）：过度自信经理人高估投资项目回报率——内源资金充裕时过度投资；内源资金缺乏、需外部融资时，股价下跌传递市场的不赞同，他们将取消投资。","label":"过度自信解释"},{"t":"过度自信的代理变量：从收益分散角度看应立即执行却主动持有大量实值期权的倾向（过度自信经理人愿意将自身暴露于公司相关风险）；相关代理还有持有期权至到期、持续增持公司股票；早期研究（巴伯-奥迪安）曾用交易活跃程度代表过度自信。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">过度自信的代理变量</strong>：从收益分散角度看应立即执行却主动持有大量实值期权的倾向（过度自信经理人愿意将自身暴露于公司相关风险）；相关代理还有持有期权至到期、持续增持公司股票；早期研究（巴伯-奥迪安）曾用交易活跃程度代表过度自信。","label":"过度自信的代理变量"},{"t":"回归证据（表16-2）：公司投资对现金流、托宾 Q（公司资产市值与账面价值比，标准运营指标）、过度自信及其与现金流的交叉项回归；交叉项系数显著为正（0.1648，t=3.39），说明过度自信经理人的投资-现金流敏感性更高——现金流系数与交叉项系数之和给出其相对敏感性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">回归证据</strong>（表16-2）：公司投资对现金流、托宾 Q（公司资产市值与账面价值比，标准运营指标）、过度自信及其与现金流的交叉项回归；交叉项系数显著为正（0.1648，t=3.39），说明过度自信经理人的投资-现金流敏感性更高——现金流系数与交叉项系数之和给出其相对敏感性。","label":"回归证据"},{"t":"（蒙蒂尔）优序融资理论（pecking order theory）：经理人与股东的信息不对称导致公司股票被低估、外源融资价值被低估（梅叶斯-梅吉拉夫），因此公司优先内源融资，被迫外源时先债权融资、其次可转债、最后股权融资；格雷厄姆-哈维对 CFO 的调查验证了这一偏好——长期乐观的经理人更坚信自己的股票被低估（82%的财务主管如此认为），故更偏好内源资金。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）优序融资理论（pecking order theory）：经理人与股东的信息不对称导致公司股票被低估、外源融资价值被低估（梅叶斯-梅吉拉夫），因此公司优先内源融资，被迫外源时先债权融资、其次可转债、最后股权融资；格雷厄姆-哈维对 CFO 的调查验证了这一偏好——长期乐观的经理人更坚信自己的股票被低估（82%的财务主管如此认为），故更偏好内源资金。","label":"（蒙蒂尔）优序融资理论（peckin…"},{"t":"（蒙蒂尔）自由现金流的潜在危险：哈福德发现现金充裕的公司每多持有1美元现金储备，企业价值降低7美分；\"多元化\"是破坏股东价值的罪魁——美国大型企业集团相对专业公司折价近15%、日本10%、英国15%（林斯-瑟维斯）；宝洁公司因大型机构投资者指责其多元化计划而放弃收购华纳-兰伯特；瑟维斯发现20世纪60年代多元化折价约15%与今日相同、70年代早中期几乎消失——市场口味随风格轮动。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）自由现金流的潜在危险：哈福德发现现金充裕的公司每多持有1美元现金储备，企业价值降低7美分；&quot;多元化&quot;是破坏股东价值的罪魁——美国大型企业集团相对专业公司折价近15%、日本10%、英国15%（林斯-瑟维斯）；宝洁公司因大型机构投资者指责其多元化计划而放弃收购华纳-兰伯特；瑟维斯发现20世纪60年代多元化折价约15%与今日相同、70年代早中期几乎消失——市场口味随风格轮动。","label":"（蒙蒂尔）自由现金流的潜在危险：哈福…"},{"t":"（蒙蒂尔）学习机会稀少：卡尼曼-罗瓦洛指出学习发生在类似情况频繁重复且反馈清晰之时，而公司结构、收购、股息政策等决策并不常见、反馈延迟且包含噪声——经理人难以借此纠正过度乐观。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）学习机会稀少：卡尼曼-罗瓦洛指出学习发生在类似情况频繁重复且反馈清晰之时，而公司结构、收购、股息政策等决策并不常见、反馈延迟且包含噪声——经理人难以借此纠正过度乐观。","label":"（蒙蒂尔）学习机会稀少：卡尼曼-罗瓦…"},{"t":"（蒙蒂尔）股息作为提取机制：股息可视为外部人在盈余现金被用于无谓目的之前将其提取出来的机制——贝纳茨-米开里-塞勒表明股息增长反映过去而非未来业绩；与传统代理模型假设经理人受\"建设商业帝国\"的邪恶动机驱动不同，蒙蒂尔的模型只假设经理人过于乐观和过度自信。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）股息作为提取机制：股息可视为外部人在盈余现金被用于无谓目的之前将其提取出来的机制——贝纳茨-米开里-塞勒表明股息增长反映过去而非未来业绩；与传统代理模型假设经理人受&quot;建设商业帝国&quot;的邪恶动机驱动不同，蒙蒂尔的模型只假设经理人过于乐观和过度自信。","label":"（蒙蒂尔）股息作为提取机制：股息可视…"},{"t":"（蒙蒂尔）公司治理：控制经理人过度乐观的最好办法是引入外部观点——这为治理提供了行为学基础；治理本质是帮助外部人防止内部人征收（从窃取现金到转移定价和稀释投资者）的机制；麦肯锡调查（覆盖约3.25万亿美元资产的200家机构）显示四分之三的受访者认为公司治理至少与财务表现同等重要，愿为\"良好\"治理支付溢价（委内瑞拉28%、美国18%），溢价与会计透明度和法律体系强度相关；联合利华通过两家控股公司交叉持股并掌握董事会提名权的复杂结构说明治理难题；最大投票群体票数占比奥地利52%、英国10%、美国低于5%——集中度越高治理越重要；冈珀斯-石井-米垂克构建约1500家公司的年度公司治理指数，买入股东权利最强十分位并卖出最弱十分位的组合每年获得8.5%的异常回报，较弱股东权利与较低利润、较低销售增长、较高资本支出和较高收购金额正相关。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）公司治理：控制经理人过度乐观的最好办法是引入外部观点——这为治理提供了行为学基础；治理本质是帮助外部人防止内部人征收（从窃取现金到转移定价和稀释投资者）的机制；麦肯锡调查（覆盖约3.25万亿美元资产的200家机构）显示四分之三的受访者认为公司治理至少与财务表现同等重要，愿为&quot;良好&quot;治理支付溢价（委内瑞拉28%、美国18%），溢价与会计透明度和法律体系强度相关；联合利华通过两家控股公司交叉持股并掌握董事会提名权的复杂结构说明治理难题；最大投票群体票数占比奥地利52%、英国10%、美国低于5%——集中度越高治理越重要；冈珀斯-石井-米垂克构建约1500家公司的年度公司治理指数，买入股东权利最强十分位并卖出最弱十分位的组合每年获得8.5%的异常回报，较弱股东权利与较低利润、较低销售增长、较高资本支出和较高收购金额正相关。","label":"（蒙蒂尔）公司治理：控制经理人过度乐…"}],"k":"b","i":1,"h":"16.3.1 对现金流的投资敏感性","label":"16.3.1 对现金流的投资敏感性"},{"t":"16.3.2 兼并收购","c":[{"t":"问卷证据：过度自信的经理人在兼并收购（M&A）活动中更活跃。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问卷证据</strong>：过度自信的经理人在兼并收购（M&amp;A）活动中更活跃。","label":"问卷证据"},{"t":"背景：总体来看兼并活动并未为收购方股东创造价值——1980~2001年收购声明发表之后市场总计损失达2200亿美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：总体来看兼并活动并未为收购方股东创造价值——1980~2001年收购声明发表之后市场总计损失达2200亿美元。","label":"背景：总体来看兼并活动并未为收购方股…"},{"t":"两个方向相反的因素：其一，过度自信经理人高估协同效应和自身解决兼并整合问题的能力，更多发起并购尝试；其二，他们通常认为自身公司被低估，不愿意参与需要借助外部融资的并购。哪个因素影响更大没有定论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个方向相反的因素</strong>：其一，过度自信经理人高估协同效应和自身解决兼并整合问题的能力，更多发起并购尝试；其二，他们通常认为自身公司被低估，不愿意参与需要借助外部融资的并购。哪个因素影响更大没有定论。","label":"两个方向相反的因素"},{"t":"马门迭-泰特（2008）：第一个因素作用更大——过度自信经理人更多参与兼并收购活动，内源资金充裕的公司受过度自信影响更大；用媒体报道中\"自信\"\"乐观\"等描述作代理变量结果稳健。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">马门迭-泰特</strong>（2008）：第一个因素作用更大——过度自信经理人更多参与兼并收购活动，内源资金充裕的公司受过度自信影响更大；用媒体报道中&quot;自信&quot;&quot;乐观&quot;等描述作代理变量结果稳健。","label":"马门迭-泰特"},{"t":"市场能识别：非过度自信经理人发起的并购建议公告的典型市场反应是股价下跌12个基点，过度自信经理人发起的则下跌90个基点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">市场能识别</strong>：非过度自信经理人发起的并购建议公告的典型市场反应是股价下跌12个基点，过度自信经理人发起的则下跌90个基点。","label":"市场能识别"},{"t":"排除替代解释：更大的风险偏好与观察到的现金收购偏好不一致；委托代理（经理人构造商业帝国）很难与经理人个人的过度投资相符。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">排除替代解释</strong>：更大的风险偏好与观察到的现金收购偏好不一致；委托代理（经理人构造商业帝国）很难与经理人个人的过度投资相符。","label":"排除替代解释"},{"t":"道卡斯-派特梅扎斯的稳健性检验：考察1980~2004年英国针对私有公司的并购（欧洲65%的并购发生在英国，英国私有并购约占其并购总量90%）；以\"3年内参与至少5场并购\"界定过度自信经理人；结论一致——过度自信的兼并发起方公告期收益率更低、长期运营表现也更差。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">道卡斯-派特梅扎斯的稳健性检验</strong>：考察1980~2004年英国针对私有公司的并购（欧洲65%的并购发生在英国，英国私有并购约占其并购总量90%）；以&quot;3年内参与至少5场并购&quot;界定过度自信经理人；结论一致——过度自信的兼并发起方公告期收益率更低、长期运营表现也更差。","label":"道卡斯-派特梅扎斯的稳健性检验"},{"t":"（蒙蒂尔）乐观经理人与多元化并购：乐观的经理人更倾向多元化并购并高估其未来现金流——卡普兰-鲁拜克发现1983-1989年51宗高杠杆交易实现的一年/两年 EBITDA 中位数分别比管理层预测低3.7%和14.4%；依赖外源融资可阻止此类行为，内源资金充足时却无约束（与16.3.1呼应）。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）乐观经理人与多元化并购：乐观的经理人更倾向多元化并购并高估其未来现金流——卡普兰-鲁拜克发现1983-1989年51宗高杠杆交易实现的一年/两年 EBITDA 中位数分别比管理层预测低3.7%和14.4%；依赖外源融资可阻止此类行为，内源资金充足时却无约束（与16.3.1呼应）。","label":"（蒙蒂尔）乐观经理人与多元化并购：乐…"}],"k":"b","i":1,"h":"16.3.2 兼并收购","label":"16.3.2 兼并收购"},{"t":"16.3.3 公司创设","c":[{"t":"过度进入的证据：81%的创业者认为自己公司成功概率为70%或更高，33%认为必然成功（显然不可能），而新公司中75%会在5年内倒闭；偏差的可能原因是过度自信——过度乐观使创业者认为市场急需其产品和服务，高于平均的自我认识使其认为即使行业机会有限自己公司也必然成功；专长于挑选公司的风险资本管理人士同样受过度自信影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">过度进入的证据</strong>：81%的创业者认为自己公司成功概率为70%或更高，33%认为必然成功（显然不可能），而新公司中75%会在5年内倒闭；偏差的可能原因是过度自信——过度乐观使创业者认为市场急需其产品和服务，高于平均的自我认识使其认为即使行业机会有限自己公司也必然成功；专长于挑选公司的风险资本管理人士同样受过度自信影响。","label":"过度进入的证据"},{"t":"直接数据研究的困难：过度自信需要代理指标，但许多企业家缺乏可跟踪的透明记录；因此采用实验设计（坎默-洛瓦洛）控制相关环境。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">直接数据研究的困难</strong>：过度自信需要代理指标，但许多企业家缺乏可跟踪的透明记录；因此采用实验设计（坎默-洛瓦洛）控制相关环境。","label":"直接数据研究的困难"},{"t":"实验设定：被试在多期实验中决定是否进入市场，利润依赖进入人数——利润=[10/(N−c)]×(c−E)，N 为参与者总数、c 为市场容量、E 为实际进入人数；E=c 时行业利润为零、进入过多时为负，模拟现实中\"企业少利润高\"的市场。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实验设定</strong>：被试在多期实验中决定是否进入市场，利润依赖进入人数——利润=[10/(N−c)]×(c−E)，N 为参与者总数、c 为市场容量、E 为实际进入人数；E=c 时行业利润为零、进入过多时为负，模拟现实中&quot;企业少利润高&quot;的市场。","label":"实验设定"},{"t":"引入过度自信的关键修正：利润按等级 r 支付——最高 c 个等级的进入者获得正利润（利润=50×[(c+1−r)/(1+2+…+c)]），其余等级获得−10美元；等级或随机产生、或依技能水平（脑筋急转弯、时事体育问答）测定；部分被试被提前告知结果依赖技能（相当于\"自我选择\"进入实验）；被试每期预测进入人数；12期中每两期做一次进入决定（一期按技能、一期随机）；市场容量 c=2、4、6、8。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">引入过度自信的关键修正</strong>：利润按等级 r 支付——最高 c 个等级的进入者获得正利润（利润=50×[(c+1−r)/(1+2+…+c)]），其余等级获得−10美元；等级或随机产生、或依技能水平（脑筋急转弯、时事体育问答）测定；部分被试被提前告知结果依赖技能（相当于&quot;自我选择&quot;进入实验）；被试每期预测进入人数；12期中每两期做一次进入决定（一期按技能、一期随机）；市场容量 c=2、4、6、8。","label":"引入过度自信的关键修正"},{"t":"均衡基准：风险中性且对技能水平无先验认识时，混合策略均衡是随机进入市场（以[(c+5)/N]%的概率进入），期望总收益为零。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">均衡基准</strong>：风险中性且对技能水平无先验认识时，混合策略均衡是随机进入市场（以[(c+5)/N]%的概率进入），期望总收益为零。","label":"均衡基准"},{"t":"结果（表16-3）：当利润依赖技能水平时进入者显著更多——普通实验中随机类与技能类的行业平均利润差为8.96（19.79 对 10.83）；自我选择实验中差异更大，达27.92（13.96 对 −13.96）；总利润差18.43，高度显著，与主要假设一致。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>（表16-3）：当利润依赖技能水平时进入者显著更多——普通实验中随机类与技能类的行业平均利润差为8.96（19.79 对 10.83）；自我选择实验中差异更大，达27.92（13.96 对 −13.96）；总利润差18.43，高度显著，与主要假设一致。","label":"结果（表16-3）：当利润依赖技能水…"},{"t":"解释与排除：结果与参考群体忽视（reference group neglect）一致——自我选择组平均技能水平更高，但成员忘记了组内其他参与者也都是高技能个体，因而竞相\"进入市场\"；排除了\"竞争盲点\"的非行为解释（若只是未预期竞争，技能类实验应出现正利润，实际为负利润；且随机类实验的被试持续获得更高利润）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解释与排除</strong>：结果与参考群体忽视（reference group neglect）一致——自我选择组平均技能水平更高，但成员忘记了组内其他参与者也都是高技能个体，因而竞相&quot;进入市场&quot;；排除了&quot;竞争盲点&quot;的非行为解释（若只是未预期竞争，技能类实验应出现正利润，实际为负利润；且随机类实验的被试持续获得更高利润）。","label":"解释与排除"}],"k":"b","i":1,"h":"16.3.3 公司创设","label":"16.3.3 公司创设"}],"k":"sec","i":0,"h":"16.3 投资决策和过度自信","label":"16.3 投资决策和过度自信"},{"t":"16.4 经理人过度自信能否产生正面影响","c":[{"t":"努力与道德风险：经理人适度的自信能使其更努力投入工作；在委托代理背景下，这能缓解代理人努力程度不可观测导致的道德风险难题。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">努力与道德风险</strong>：经理人适度的自信能使其更努力投入工作；在委托代理背景下，这能缓解代理人努力程度不可观测导致的道德风险难题。","label":"努力与道德风险"},{"t":"风险承担：经理人相比于股东可能更为厌恶风险，过度自信能克服这一倾向，让公司朝着有利方面变动。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">风险承担</strong>：经理人相比于股东可能更为厌恶风险，过度自信能克服这一倾向，让公司朝着有利方面变动。","label":"风险承担"},{"t":"资本结构含义（哈克巴斯模型）：管理层过度乐观与公司债务发行正相关——对未来现金流的乐观导致顺利支付利息的信念；讽刺的是，经理人出于职业考虑对债务的规避（债务好处未被充分利用、有害公司价值）因过度自信而得以缓解。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">资本结构含义</strong>（哈克巴斯模型）：管理层过度乐观与公司债务发行正相关——对未来现金流的乐观导致顺利支付利息的信念；讽刺的是，经理人出于职业考虑对债务的规避（债务好处未被充分利用、有害公司价值）因过度自信而得以缓解。","label":"资本结构含义"},{"t":"社会层面：企业家的过度自信即使对自身有害，对社会可能有益——企业家活动能为社会提供有价值的信息（不像普通的跟风者不提供任何信息），实现了有意义的演化目标。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">社会层面</strong>：企业家的过度自信即使对自身有害，对社会可能有益——企业家活动能为社会提供有价值的信息（不像普通的跟风者不提供任何信息），实现了有意义的演化目标。","label":"社会层面"},{"t":"（蒙蒂尔）治理作为校正的另一面：当乐观表现为自由现金流的挥霍与多元化并购时，需要外部观点与治理机制（麦肯锡调查、治理指数）以及股息等现金提取机制加以约束——与\"正面影响\"并不矛盾，关键在于偏差的方向与约束的强弱。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）治理作为校正的另一面：当乐观表现为自由现金流的挥霍与多元化并购时，需要外部观点与治理机制（麦肯锡调查、治理指数）以及股息等现金提取机制加以约束——与&quot;正面影响&quot;并不矛盾，关键在于偏差的方向与约束的强弱。","label":"（蒙蒂尔）治理作为校正的另一面：当乐…"}],"k":"sec","i":0,"h":"16.4 经理人过度自信能否产生正面影响","label":"16.4 经理人过度自信能否产生正面影响"}],"k":"chap","h":"第16章 行为公司金融和经理层决策","label":"第16章 行为公司金融和经理层决策"}],"k":"part","h":"第六篇 公司金融","label":"第六篇 公司金融","col":"#2563eb","pc":"p6"},{"t":"第七篇 退休、养老金、教育、除去偏差及客户管理","c":[{"t":"第17章 退休储蓄行为和改进DC养老金","c":[{"t":"本章要点","c":[{"t":"世界性趋势：从雇主投资的定额收益养老金（DB）向雇员投资的定额缴款养老金（DC）转变，401(k)计划是典型代表，普通雇员被迫成为亲自管理账户的市场投资者。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">世界性趋势</strong>：从雇主投资的定额收益养老金（DB）向雇员投资的定额缴款养老金（DC）转变，401(k)计划是典型代表，普通雇员被迫成为亲自管理账户的市场投资者。","label":"世界性趋势"},{"t":"DB为员工消除市场风险与长寿风险（由企业承担），DC赋予灵活性与操控权，但员工面临储蓄不足、投资收益偏低与资产配置困难。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">DB为员工消除市场风险与长寿风险</strong>（由企业承担），DC赋予灵活性与操控权，但员工面临储蓄不足、投资收益偏低与资产配置困难。","label":"DB为员工消除市场风险与长寿风险"},{"t":"储蓄不足的两大人性根源是有限自控能力与拖延习惯，双曲线贴现函数刻画了\"推迟储蓄总想从明天开始\"的偏好动态不一致。","c":[],"k":"b","i":1,"h":"储蓄不足的两大人性根源是有限自控能力与拖延习惯，双曲线贴现函数刻画了&quot;推迟储蓄总想从明天开始&quot;的偏好动态不一致。","label":"储蓄不足的两大人性根源是有限自控能力…"},{"t":"资产配置困惑：雇员类投资者受基金菜单影响，使用分散化启发法与1/n启发法，难以找到与风险承受能力相称的组合。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">资产配置困惑</strong>：雇员类投资者受基金菜单影响，使用分散化启发法与1/n启发法，难以找到与风险承受能力相称的组合。","label":"资产配置困惑"},{"t":"投资者教育作用有限：证据的因果关系可疑，且最需要教育的人最不来接受教育、缺乏鞭策的截止期限。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">投资者教育作用有限</strong>：证据的因果关系可疑，且最需要教育的人最不来接受教育、缺乏鞭策的截止期限。","label":"投资者教育作用有限"},{"t":"养老金机制改进顺势利用偏差：自动参与解决\"开始储蓄\"，递延率提升安排计划（SMarT）解决\"足额储蓄\"，生活方式与生命周期（目标日期）基金解决资产配置难题。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">养老金机制改进顺势利用偏差</strong>：自动参与解决&quot;开始储蓄&quot;，递延率提升安排计划（SMarT）解决&quot;足额储蓄&quot;，生活方式与生命周期（目标日期）基金解决资产配置难题。","label":"养老金机制改进顺势利用偏差"},{"t":"理想的401(k)计划＝合适的默认值（自动参与＋递延率渐升＋恰当组合基金）＋为主动投资者保留充分的选择权。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">理想的401(k)计划＝合适的默认值</strong>（自动参与＋递延率渐升＋恰当组合基金）＋为主动投资者保留充分的选择权。","label":"理想的401"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"17.1 向DC养老金转变的世界性趋势及其后果","c":[{"t":"17.1.1 定额缴款养老金和定额收益养老金","c":[{"t":"DB养老金（defined benefit pensions，定额收益养老金）：雇主按公式承诺雇员退休后定期获得既定养老金，公司受托设立专门养老基金并缴费投资以兑现承诺。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">DB养老金</strong>（defined benefit pensions，定额收益养老金）：雇主按公式承诺雇员退休后定期获得既定养老金，公司受托设立专门养老基金并缴费投资以兑现承诺。","label":"DB养老金"},{"t":"DC养老金（defined contribution pensions，定额缴款养老金）：雇主与雇员共同缴费（常含匹配缴费），累计及投资积累归退休账户所有，不保证给付数额；退休时可取出购买年金。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">DC养老金</strong>（defined contribution pensions，定额缴款养老金）：雇主与雇员共同缴费（常含匹配缴费），累计及投资积累归退休账户所有，不保证给付数额；退休时可取出购买年金。","label":"DC养老金"},{"t":"转变背景：美国1974年《雇员退休收入保障方案》（ERISA）通过、1980年国内税收法案修订后401(k)计划大行其道；英国、澳大利亚、加拿大、荷兰、瑞典、智利亦在转向DC。美国1975~2003年私有DB养老金数目从约10万家降至不足3.1万家，现存DB计划还面临冻结威胁。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">转变背景</strong>：美国1974年《雇员退休收入保障方案》（ERISA）通过、1980年国内税收法案修订后401(k)计划大行其道；英国、澳大利亚、加拿大、荷兰、瑞典、智利亦在转向DC。美国1975~2003年私有DB养老金数目从约10万家降至不足3.1万家，现存DB计划还面临冻结威胁。","label":"转变背景"},{"t":"风险归属：DB使员工免除市场风险与长寿风险，但企业因此承担之——持续熊市（如2000~2002、2008~2009年）会使DB陷入不足额境地；长寿风险可经精算分散，市场风险则难化解。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">风险归属</strong>：DB使员工免除市场风险与长寿风险，但企业因此承担之——持续熊市（如2000~2002、2008~2009年）会使DB陷入不足额境地；长寿风险可经精算分散，市场风险则难化解。","label":"风险归属"},{"t":"DC的吸引力：灵活性（对流动性强的员工重要）、对风险和投资的更大操控权；牛市中因投资者认为好光景后更可能是好光景而更具吸引力（20世纪90年代），公司层面则因缴费可估计、不受市场状况影响而偏好DC。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">DC的吸引力</strong>：灵活性（对流动性强的员工重要）、对风险和投资的更大操控权；牛市中因投资者认为好光景后更可能是好光景而更具吸引力（20世纪90年代），公司层面则因缴费可估计、不受市场状况影响而偏好DC。","label":"DC的吸引力"},{"t":"DC的代价：美国研究显示扣费后DB年收益率高于DC约2%——DC过度交易未获相应超额利润、共同基金佣金结构推高手续费；部分DC风险头寸不合理、分散不足。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">DC的代价</strong>：美国研究显示扣费后DB年收益率高于DC约2%——DC过度交易未获相应超额利润、共同基金佣金结构推高手续费；部分DC风险头寸不合理、分散不足。","label":"DC的代价"}],"k":"b","i":1,"h":"17.1.1 定额缴款养老金和定额收益养老金","label":"17.1.1 定额缴款养老金和定额收…"},{"t":"17.1.2 雇员类投资者所面临的问题","c":[{"t":"与自愿入市的散户不同，退休账户投资者多因工作所需被动参与，投资知识更缺乏：连\"单一证券风险低于分散组合\"这类基本概念都常被误解；投资者自己也往往知道决定非最优。","c":[],"k":"b","i":2,"h":"与自愿入市的散户不同，退休账户投资者多因工作所需被动参与，投资知识更缺乏：连&quot;单一证券风险低于分散组合&quot;这类基本概念都常被误解；投资者自己也往往知道决定非最优。","label":"与自愿入市的散户不同，退休账户投资者…"},{"t":"行为表现：面对有限的投资选择不知所措而干脆不作为（与第9章自愿散户的过度频繁交易相反）；即便开始投资，也很少甚至从不调整组合（调整人数中位数为0）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行为表现</strong>：面对有限的投资选择不知所措而干脆不作为（与第9章自愿散户的过度频繁交易相反）；即便开始投资，也很少甚至从不调整组合（调整人数中位数为0）。","label":"行为表现"},{"t":"两个最严重的问题：其一，有些投资者储蓄不足，小部分甚至完全不储蓄；其二，在最基本的投资决策与资产配置方面存在困难。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个最严重的问题</strong>：其一，有些投资者储蓄不足，小部分甚至完全不储蓄；其二，在最基本的投资决策与资产配置方面存在困难。","label":"两个最严重的问题"}],"k":"b","i":1,"h":"17.1.2 雇员类投资者所面临的问题","label":"17.1.2 雇员类投资者所面临的问题"}],"k":"sec","i":0,"h":"17.1 向DC养老金转变的世界性趋势及其后果","label":"17.1 向DC养老金转变的世界性趋…"},{"t":"17.2 有限自控能力和拖延习惯背景下的储蓄行为","c":[{"t":"17.2.1 需要储蓄多少","c":[{"t":"收入替代率（income replacement ratio）：退休后收入占工作（雇用）期间收入的比例；经验证据表明70%可使生活标准大致不变——退休后无需再储蓄、子女已成年、工作旅行宴请着装等支出消失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">收入替代率</strong>（income replacement ratio）：退休后收入占工作（雇用）期间收入的比例；经验证据表明70%可使生活标准大致不变——退休后无需再储蓄、子女已成年、工作旅行宴请着装等支出消失。","label":"收入替代率"},{"t":"递延率/推延率（deferral rate）：工资收入中被储蓄的比例，由所需收入替代率、工作年限、年金期限、工资增长率、投资回报率与年金利率等变量推算。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">递延率/推延率</strong>（deferral rate）：工资收入中被储蓄的比例，由所需收入替代率、工作年限、年金期限、工资增长率、投资回报率与年金利率等变量推算。","label":"递延率/推延率"},{"t":"温迪·尚算例：30岁、工作至60岁、年收入5万美元、已积存4万美元、外部来源每年8000美元（带来16%替代率）；按70%替代率、工作与年金期限均30年、实际工资增长0%、回报与年金利率均为经通胀调整的实际值等假设，所需递延率约为13%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">温迪·尚算例</strong>：30岁、工作至60岁、年收入5万美元、已积存4万美元、外部来源每年8000美元（带来16%替代率）；按70%替代率、工作与年金期限均30年、实际工资增长0%、回报与年金利率均为经通胀调整的实际值等假设，所需递延率约为13%。","label":"温迪·尚算例"},{"t":"表17-1显示：即使30岁就开始储蓄，若只存收入的5%~6%，退休收入将削减过半；\"储蓄收入的10%~15%差不多足够\"是常见的经验说法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表17-1显示</strong>：即使30岁就开始储蓄，若只存收入的5%~6%，退休收入将削减过半；&quot;储蓄收入的10%~15%差不多足够&quot;是常见的经验说法。","label":"表17-1显示"}],"k":"b","i":1,"h":"17.2.1 需要储蓄多少","label":"17.2.1 需要储蓄多少"},{"t":"17.2.2 有限自控能力","c":[{"t":"有限自控能力（limited self-control）：知道正确决定却无法贯彻执行，在\"当前满足 vs 延后满足\"之间选择前者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有限自控能力</strong>（limited self-control）：知道正确决定却无法贯彻执行，在&quot;当前满足 vs 延后满足&quot;之间选择前者。","label":"有限自控能力"},{"t":"应对思路：自我强加纪律与规则（如规定每日热量、不吃甜点）＋环境控制（如不去甜点餐厅）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应对思路</strong>：自我强加纪律与规则（如规定每日热量、不吃甜点）＋环境控制（如不去甜点餐厅）。","label":"应对思路"},{"t":"承诺机制的储蓄应用：\"付钱给自己\"——工资发放时自动将一部分资金转入储蓄账户，先于消费诱惑占用资金；401(k)计划普遍使用自动转账机制正源于此。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">承诺机制的储蓄应用</strong>：&quot;付钱给自己&quot;——工资发放时自动将一部分资金转入储蓄账户，先于消费诱惑占用资金；401(k)计划普遍使用自动转账机制正源于此。","label":"承诺机制的储蓄应用"}],"k":"b","i":1,"h":"17.2.2 有限自控能力","label":"17.2.2 有限自控能力"},{"t":"17.2.3 指数和双曲线贴现函数","c":[{"t":"时间偏好率（rate of time preference）：主观且个人特定的偏好参数；1年后1美元的主观贴现值与市场利率决定的客观现值不同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">时间偏好率</strong>（rate of time preference）：主观且个人特定的偏好参数；1年后1美元的主观贴现值与市场利率决定的客观现值不同。","label":"时间偏好率"},{"t":"指数贴现函数（exponential discount function）：任意相邻两期的主观值之比恒定，偏好动态一致——今天肯储蓄1美元，一年后同样肯。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">指数贴现函数</strong>（exponential discount function）：任意相邻两期的主观值之比恒定，偏好动态一致——今天肯储蓄1美元，一年后同样肯。","label":"指数贴现函数"},{"t":"双曲线贴现函数（hyperbolic discount function）：第一期贴现剧烈、其后走势近似指数（准双曲线β-δ形式）；t=0与之后期间的主观值之比不再是常数。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">双曲线贴现函数</strong>（hyperbolic discount function）：第一期贴现剧烈、其后走势近似指数（准双曲线β-δ形式）；t=0与之后期间的主观值之比不再是常数。","label":"双曲线贴现函数"},{"t":"动态不一致性：在\"两年后的115美元 vs 一年后的100美元\"中选前者，在\"一年后的115美元 vs 今天的100美元\"中选后者——愿意从一年后开始储蓄计划，却不愿今天开始；若β小于远期贴现因子且利率居中，就会推迟储蓄。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">动态不一致性</strong>：在&quot;两年后的115美元 vs 一年后的100美元&quot;中选前者，在&quot;一年后的115美元 vs 今天的100美元&quot;中选后者——愿意从一年后开始储蓄计划，却不愿今天开始；若β小于远期贴现因子且利率居中，就会推迟储蓄。","label":"动态不一致性"},{"t":"关键概括：\"节食很容易，只要是从明天开始就行。\"","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键概括</strong>：&quot;节食很容易，只要是从明天开始就行。&quot;","label":"关键概括"}],"k":"b","i":1,"h":"17.2.3 指数和双曲线贴现函数","label":"17.2.3 指数和双曲线贴现函数"},{"t":"17.2.4 拖延习惯","c":[{"t":"拖延习惯（procrastination）：与自我控制密切相关；金融决策需要付出大量时间与精力做分析，决定越大越重要，拖延越严重。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">拖延习惯</strong>（procrastination）：与自我控制密切相关；金融决策需要付出大量时间与精力做分析，决定越大越重要，拖延越严重。","label":"拖延习惯"},{"t":"401(k)参与者即使知道推迟决策成本高昂，仍可能因决策复杂而拖延参与或调整。","c":[],"k":"b","i":2,"h":"401(k)参与者即使知道推迟决策成本高昂，仍可能因决策复杂而拖延参与或调整。","label":"401(k)参与者即使知道推迟决策成…"}],"k":"b","i":1,"h":"17.2.4 拖延习惯","label":"17.2.4 拖延习惯"},{"t":"17.2.5 退休准备方面的证据","c":[{"t":"储蓄不足且有自知之明：调查中76%的受访者认为自己应为退休储蓄更多；退休时收入与消费往往大幅减少，且这一下降是未被预期的（无法用消费平滑理论合理化）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">储蓄不足且有自知之明</strong>：调查中76%的受访者认为自己应为退休储蓄更多；退休时收入与消费往往大幅减少，且这一下降是未被预期的（无法用消费平滑理论合理化）。","label":"储蓄不足且有自知之明"},{"t":"幸福感悖论：控制健康影响后，消费大幅减少的人报告的幸福感变化不大——可能因高估了退休所需、低估了对环境变化的适应力、高估了消费与幸福的关系；但收入大幅减少（相比适当减少）对许多人仍非好事。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">幸福感悖论</strong>：控制健康影响后，消费大幅减少的人报告的幸福感变化不大——可能因高估了退休所需、低估了对环境变化的适应力、高估了消费与幸福的关系；但收入大幅减少（相比适当减少）对许多人仍非好事。","label":"幸福感悖论"}],"k":"b","i":1,"h":"17.2.5 退休准备方面的证据","label":"17.2.5 退休准备方面的证据"}],"k":"sec","i":0,"h":"17.2 有限自控能力和拖延习惯背景下的储蓄行为","label":"17.2 有限自控能力和拖延习惯背景…"},{"t":"17.3 资产配置困惑","c":[{"t":"17.3.1 问题的记录","c":[{"t":"资产配置（asset allocation）：挑选与自身风险承受能力相适应的资产组合；它是决定长期收益的最重要因素，处理不好后果严重。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">资产配置</strong>（asset allocation）：挑选与自身风险承受能力相适应的资产组合；它是决定长期收益的最重要因素，处理不好后果严重。","label":"资产配置"},{"t":"分散化启发法（diversification heuristic）：不确定时\"自动对每样都尝试一部分\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">分散化启发法</strong>（diversification heuristic）：不确定时&quot;自动对每样都尝试一部分&quot;。","label":"分散化启发法"},{"t":"1/n启发法（1/n heuristic）：在n只基金中各自平均配置1/n资金的倾向。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">1/n启发法</strong>（1/n heuristic）：在n只基金中各自平均配置1/n资金的倾向。","label":"1/n启发法"},{"t":"问卷证据：本纳齐与泰勒的加州大学实验——5只基金中4只固定收益＋1只权益时43%资金配权益，4只权益＋1只固定收益时升至68%，菜单本身左右了决定；加拿大的类似调查（Deaves）中3只基金1只权益时平均配43%，2只权益时为69%——在美国与加拿大，未来的退休人员配置资产时不知所措并受菜单影响（知识水平低时问题的提法影响回答）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问卷证据</strong>：本纳齐与泰勒的加州大学实验——5只基金中4只固定收益＋1只权益时43%资金配权益，4只权益＋1只固定收益时升至68%，菜单本身左右了决定；加拿大的类似调查（Deaves）中3只基金1只权益时平均配43%，2只权益时为69%——在美国与加拿大，未来的退休人员配置资产时不知所措并受菜单影响（知识水平低时问题的提法影响回答）。","label":"问卷证据"},{"t":"实际投资证据：本纳齐与泰勒对170个计划约150万投资者——提供的股票型基金越多，股票配置越高；休伯曼与江伟——1/n启发法在个人\"所选择的基金\"内部成立（据此可间接实现目标配置，较理性），计划层面与个人层面的权益暴露仅弱相关（菜单效应微弱），可选基金不足10只时菜单效应明显更强。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实际投资证据</strong>：本纳齐与泰勒对170个计划约150万投资者——提供的股票型基金越多，股票配置越高；休伯曼与江伟——1/n启发法在个人&quot;所选择的基金&quot;内部成立（据此可间接实现目标配置，较理性），计划层面与个人层面的权益暴露仅弱相关（菜单效应微弱），可选基金不足10只时菜单效应明显更强。","label":"实际投资证据"}],"k":"b","i":1,"h":"17.3.1 问题的记录","label":"17.3.1 问题的记录"},{"t":"17.3.2 存在\"正确的\"资产配置吗","c":[{"t":"没有人知道对某个人的理论最优配置是什么，实操中争议很大；DB养老金历来采用60/40股债混合。","c":[],"k":"b","i":2,"h":"没有人知道对某个人的理论最优配置是什么，实操中争议很大；DB养老金历来采用60/40股债混合。","label":"没有人知道对某个人的理论最优配置是什…"},{"t":"两大规范因素：风险态度——高风险厌恶者多配固定收益（性别是其代理变量，女性风险厌恶程度通常更高）；年龄——临近退休时安全的人力资本存量减少，应降低权益比例以维持总体风险承担不变，经验法则\"权益比例＝100减年龄\"（每年约减1%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两大规范因素</strong>：风险态度——高风险厌恶者多配固定收益（性别是其代理变量，女性风险厌恶程度通常更高）；年龄——临近退休时安全的人力资本存量减少，应降低权益比例以维持总体风险承担不变，经验法则&quot;权益比例＝100减年龄&quot;（每年约减1%）。","label":"两大规范因素"},{"t":"与理论一致的实证：风险承受力更强的年轻男性、高收入群体（人力资本高）、已婚夫妇（双方工作分散了劳动力市场风险）、富裕群体、职位有保障的公司中高层持有更多股票；风险承担随年龄呈驼峰状变化——近期理论（人力资本与股票收益的对冲需求、难以分散的创业与房产杠杆风险等）与此非单调性吻合。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与理论一致的实证</strong>：风险承受力更强的年轻男性、高收入群体（人力资本高）、已婚夫妇（双方工作分散了劳动力市场风险）、富裕群体、职位有保障的公司中高层持有更多股票；风险承担随年龄呈驼峰状变化——近期理论（人力资本与股票收益的对冲需求、难以分散的创业与房产杠杆风险等）与此非单调性吻合。","label":"与理论一致的实证"},{"t":"结论：部分投资者合乎规范理论，但大量投资者行为与之不一致——有时股票投得过多，有时又在低回报资产上投得过多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：部分投资者合乎规范理论，但大量投资者行为与之不一致——有时股票投得过多，有时又在低回报资产上投得过多。","label":"结论：部分投资者合乎规范理论，但大量…"}],"k":"b","i":1,"h":"17.3.2 存在&quot;正确的&quot;资产配置吗","label":"17.3.2 存在\"正确的\"资产配置吗"},{"t":"17.3.3 提出解决方法","c":[{"t":"仅靠信息披露是否足够的争论：有人认为信息公开即可，有人（带家长式色彩，参见自由意志家长主义libertarian paternalism）主张进一步监管参与。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">仅靠信息披露是否足够的争论</strong>：有人认为信息公开即可，有人（带家长式色彩，参见自由意志家长主义libertarian paternalism）主张进一步监管参与。","label":"仅靠信息披露是否足够的争论"},{"t":"两条改善途径：其一，加强投资者教育与建议，使其自身能做出更准确的决定；其二，改进DC养老金机制，让储蓄方在外部参与最小时也能做出正确选择。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两条改善途径</strong>：其一，加强投资者教育与建议，使其自身能做出更准确的决定；其二，改进DC养老金机制，让储蓄方在外部参与最小时也能做出正确选择。","label":"两条改善途径"}],"k":"b","i":1,"h":"17.3.3 提出解决方法","label":"17.3.3 提出解决方法"},{"t":"17.3.4 投资者教育是答案吗","c":[{"t":"证据评估：有研究发现DC参与者接受金融知识教育能带来收益回报但证据微弱；工作场所金融教育与储蓄增加相关的证据存在因果疑点——可能是储蓄者更爱参加培训，且声称会改变行为（如增加储蓄）不等于拖延被克服、行为真的改变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证据评估</strong>：有研究发现DC参与者接受金融知识教育能带来收益回报但证据微弱；工作场所金融教育与储蓄增加相关的证据存在因果疑点——可能是储蓄者更爱参加培训，且声称会改变行为（如增加储蓄）不等于拖延被克服、行为真的改变。","label":"证据评估"},{"t":"教育难卖：商科学生主动争取教育且有考试压力鞭策；DC参与者对个人理财常缺乏兴趣，与之相关的期限（退休）对多数人很遥远——临近退休才开始认真规划就如考试前夜才翻课本，为时已晚。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">教育难卖</strong>：商科学生主动争取教育且有考试压力鞭策；DC参与者对个人理财常缺乏兴趣，与之相关的期限（退休）对多数人很遥远——临近退休才开始认真规划就如考试前夜才翻课本，为时已晚。","label":"教育难卖"}],"k":"b","i":1,"h":"17.3.4 投资者教育是答案吗","label":"17.3.4 投资者教育是答案吗"}],"k":"sec","i":0,"h":"17.3 资产配置困惑","label":"17.3 资产配置困惑"},{"t":"17.4 DC养老金设计改善","c":[{"t":"设计总思路：促使投资者趋向规范理论所揭示的行为——自动参与迫使人们储蓄，递延率提升安排增加储蓄，资产配置型基金（尤其随临近退休动态调整者）引导合适的风险暴露。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">设计总思路</strong>：促使投资者趋向规范理论所揭示的行为——自动参与迫使人们储蓄，递延率提升安排增加储蓄，资产配置型基金（尤其随临近退休动态调整者）引导合适的风险暴露。","label":"设计总思路"},{"t":"17.4.1 自动参与","c":[{"t":"自动参与（automatic enrollment）：除非明确选择退出，默认员工加入养老金计划（与传统的员工主动申请参与相对）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自动参与</strong>（automatic enrollment）：除非明确选择退出，默认员工加入养老金计划（与传统的员工主动申请参与相对）。","label":"自动参与"},{"t":"马德琳与谢伊的案例：1998年4月1日一家《财富》500强公司改为自动参与，默认递延率3%、默认投资货币市场基金（公司提供含货币、债券、平衡与股票型在内的多种选择）；新员工组参与率86%，窗口组（入职未满一年、可立即参加但暂无匹配）49%（控制任期后约37%）——自动参与在事业早期最有效，复利效应使这一优势对资产积累非常重要；无自动参与时工龄20年以上者参与率也达83%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">马德琳与谢伊的案例</strong>：1998年4月1日一家《财富》500强公司改为自动参与，默认递延率3%、默认投资货币市场基金（公司提供含货币、债券、平衡与股票型在内的多种选择）；新员工组参与率86%，窗口组（入职未满一年、可立即参加但暂无匹配）49%（控制任期后约37%）——自动参与在事业早期最有效，复利效应使这一优势对资产积累非常重要；无自动参与时工龄20年以上者参与率也达83%。","label":"马德琳与谢伊的案例"},{"t":"默认的隐患：惰性使许多参与者\"默认\"了投资行为——3%递延率只是最低限、无法为退休充分准备；全货币市场组合未能利用风险的时间分散效应；6%才能用足公司匹配而默认者只享一半。禀赋效应让人把初始默认组合视为最优，背书效应（endorsement effect）让人把默认选择理解为公司推荐；还观察到羊群效应——计划变更前已入职的新参与者更可能选货币市场基金。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">默认的隐患</strong>：惰性使许多参与者&quot;默认&quot;了投资行为——3%递延率只是最低限、无法为退休充分准备；全货币市场组合未能利用风险的时间分散效应；6%才能用足公司匹配而默认者只享一半。禀赋效应让人把初始默认组合视为最优，背书效应（endorsement effect）让人把默认选择理解为公司推荐；还观察到羊群效应——计划变更前已入职的新参与者更可能选货币市场基金。","label":"默认的隐患"},{"t":"结论：自动参与不是最终解决办法，公司必须推动员工提高缴费率并采用更进取的投资方式，实现\"从争输赢到双赢\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：自动参与不是最终解决办法，公司必须推动员工提高缴费率并采用更进取的投资方式，实现&quot;从争输赢到双赢&quot;。","label":"结论：自动参与不是最终解决办法，公司…"}],"k":"b","i":1,"h":"17.4.1 自动参与","label":"17.4.1 自动参与"},{"t":"17.4.2 递延率提升安排计划","c":[{"t":"递延率提升安排计划（scheduled deferral increase programs，SDIP）：泰勒与本纳齐提出的方案，冠名SMarT（\"save more tomorrow\"，明天储蓄更多）；金融顾问建议员工加入递延率随未来加薪逐步上调、直至预设上限的计划。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">递延率提升安排计划</strong>（scheduled deferral increase programs，SDIP）：泰勒与本纳齐提出的方案，冠名SMarT（&quot;save more tomorrow&quot;，明天储蓄更多）；金融顾问建议员工加入递延率随未来加薪逐步上调、直至预设上限的计划。","label":"递延率提升安排计划"},{"t":"四个设计特点：其一，承诺机制在签约一段时间后起效，顺应\"愿意做正确的事只要不是马上\"的拖延倾向；其二，提升与工资上涨同步起效，利用损失厌恶与货币幻觉（money illusion，混淆名义与实际刻度）避免到手工资下降的痛感；其三，递延率随加薪持续提升至预设上限，让惯性（如同乘客不会主动下车）发挥正面作用；其四，保留随时退出的权利，便于第一时间说服参加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">四个设计特点</strong>：其一，承诺机制在签约一段时间后起效，顺应&quot;愿意做正确的事只要不是马上&quot;的拖延倾向；其二，提升与工资上涨同步起效，利用损失厌恶与货币幻觉（money illusion，混淆名义与实际刻度）避免到手工资下降的痛感；其三，递延率随加薪持续提升至预设上限，让惯性（如同乘客不会主动下车）发挥正面作用；其四，保留随时退出的权利，便于第一时间说服参加。","label":"四个设计特点"},{"t":"试点结果：中型制造业企业315名员工，286人见顾问，28%直接接受顾问建议（每次递延率提升不超过5%），78%选择加入SDIP；SDIP参与者储蓄率从3.5%升至6.5%、9.4%、11.6%、13.6%（四次加薪后）；每次提升不超过3%是因为部分已达上限或中途退出（但退出者未降回原水平）；四次加薪后80%仍在计划中。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">试点结果</strong>：中型制造业企业315名员工，286人见顾问，28%直接接受顾问建议（每次递延率提升不超过5%），78%选择加入SDIP；SDIP参与者储蓄率从3.5%升至6.5%、9.4%、11.6%、13.6%（四次加薪后）；每次提升不超过3%是因为部分已达上限或中途退出（但退出者未降回原水平）；四次加薪后80%仍在计划中。","label":"试点结果"},{"t":"对照启示：直接接受建议者起初储蓄更多，但惰性使其此后不再调整；SDIP参与者的惰性反而是正面的——不行动即被动接受递延率的未来增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对照启示</strong>：直接接受建议者起初储蓄更多，但惰性使其此后不再调整；SDIP参与者的惰性反而是正面的——不行动即被动接受递延率的未来增加。","label":"对照启示"}],"k":"b","i":1,"h":"17.4.2 递延率提升安排计划","label":"17.4.2 递延率提升安排计划"},{"t":"17.4.3 资产配置基金","c":[{"t":"生活方式基金（lifestyle funds）：计划提供一系列固定股债比例的阶梯式混合基金（如100/0、90/10……0/100）供投资者挑选与自身风险承担需求相称的一档。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">生活方式基金</strong>（lifestyle funds）：计划提供一系列固定股债比例的阶梯式混合基金（如100/0、90/10……0/100）供投资者挑选与自身风险承担需求相称的一档。","label":"生活方式基金"},{"t":"固定比例的问题：随时间推移配置渐失最优——年龄增长要求权益比例下降；股票增长快于债券又使权益占比被动上升，五年后权益头寸可能高于最优约5个百分点；而参与者调整资产配置的人数中位数为0（惰性）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">固定比例的问题</strong>：随时间推移配置渐失最优——年龄增长要求权益比例下降；股票增长快于债券又使权益占比被动上升，五年后权益头寸可能高于最优约5个百分点；而参与者调整资产配置的人数中位数为0（惰性）。","label":"固定比例的问题"},{"t":"生命周期（目标日期）基金（life-cycle / target date funds）：投资者只选一支基金，其初始风险头寸与要求相称，并随退休日临近自动下调内部权益暴露——如\"2025基金\"初始约60%权益，此后逐级下降至退休时约40%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">生命周期</strong>（目标日期）基金（life-cycle / target date funds）：投资者只选一支基金，其初始风险头寸与要求相称，并随退休日临近自动下调内部权益暴露——如&quot;2025基金&quot;初始约60%权益，此后逐级下降至退休时约40%。","label":"生命周期"}],"k":"b","i":1,"h":"17.4.3 资产配置基金","label":"17.4.3 资产配置基金"},{"t":"17.4.4 向理想的401(k)进发","c":[{"t":"合适的默认值应引导足够的储蓄与相称的风险：自动参与（让人开始储蓄）＋递延率起始足够低以留住参与者、随时间升至足以实现合适收入替代率的水平＋以资产恰当组合的基金作为投资载体——连不愿动一下指头的人也能有不错的储蓄结局。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">合适的默认值应引导足够的储蓄与相称的风险</strong>：自动参与（让人开始储蓄）＋递延率起始足够低以留住参与者、随时间升至足以实现合适收入替代率的水平＋以资产恰当组合的基金作为投资载体——连不愿动一下指头的人也能有不错的储蓄结局。","label":"合适的默认值应引导足够的储蓄与相称的风险"},{"t":"保留选择权是401(k)最大的优点之一：为想主动操控的投资者提供覆盖所有资产类别的基金菜单（含主动管理基金与指数基金），这对默认投资并非最优的人尤其重要。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">保留选择权是401(k)最大的优点之一</strong>：为想主动操控的投资者提供覆盖所有资产类别的基金菜单（含主动管理基金与指数基金），这对默认投资并非最优的人尤其重要。","label":"保留选择权是401"}],"k":"b","i":1,"h":"17.4.4 向理想的401(k)进发","label":"17.4.4 向理想的401"}],"k":"sec","i":0,"h":"17.4 DC养老金设计改善","label":"17.4 DC养老金设计改善"}],"k":"chap","h":"第17章 退休储蓄行为和改进DC养老金","label":"第17章 退休储蓄行为和改进DC养老金"},{"t":"第18章 除去偏差、教育和客户管理","c":[{"t":"本章要点","c":[{"t":"偏差（认知过程受有限理性\"污染\"）可以尝试消除，但必须走完四个步骤：意识到偏差存在、有消除动机、知道偏差的方向和大小、有调整的能力——缺一不可。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">偏差</strong>（认知过程受有限理性&quot;污染&quot;）可以尝试消除，但必须走完四个步骤：意识到偏差存在、有消除动机、知道偏差的方向和大小、有调整的能力——缺一不可。","label":"偏差（认知过程受有限理性\"污染\"）可…"},{"t":"由于去偏是难处理的过程，环境控制（管理周围环境使偏差难以起效）往往比直接\"除污\"更可靠。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">由于去偏是难处理的过程，环境控制</strong>（管理周围环境使偏差难以起效）往往比直接&quot;除污&quot;更可靠。","label":"由于去偏是难处理的过程，环境控制"},{"t":"菲施霍夫区分\"可改善的决策人\"与\"屡教不改的决策人\"：前者按提醒→描述问题→个人反馈→全面训练递进干预，后者只能更换、重新校准反应或在计划中预留误差。","c":[],"k":"b","i":1,"h":"菲施霍夫区分&quot;可改善的决策人&quot;与&quot;屡教不改的决策人&quot;：前者按提醒→描述问题→个人反馈→全面训练递进干预，后者只能更换、重新校准反应或在计划中预留误差。","label":"菲施霍夫区分\"可改善的决策人\"与\"屡…"},{"t":"教育要客制化：借助心理统计特征分析（梅尔斯-布里格斯性格类型、基尔西气质、货币态度）识别易受哪种偏差影响的人群，把教育力量疏导到最需要的规避者身上。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">教育要客制化</strong>：借助心理统计特征分析（梅尔斯-布里格斯性格类型、基尔西气质、货币态度）识别易受哪种偏差影响的人群，把教育力量疏导到最需要的规避者身上。","label":"教育要客制化"},{"t":"传统客户管理以风险问卷测度风险容忍度（风险容量＋风险态度的函数），由此得到主观风险；主观风险与客观风险（实际组合的风险暴露）各有缺陷，都不是理想的资产配置依据。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">传统客户管理以风险问卷测度风险容忍度</strong>（风险容量＋风险态度的函数），由此得到主观风险；主观风险与客观风险（实际组合的风险暴露）各有缺陷，都不是理想的资产配置依据。","label":"传统客户管理以风险问卷测度风险容忍度"},{"t":"行为金融进入客户管理：卡尼曼与里皮的行为测试梳理客户最易出现的偏差，庞皮亚纳的\"缓和/适应\"两原则帮助顾问把客户引向\"最好的实际配置\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">行为金融进入客户管理</strong>：卡尼曼与里皮的行为测试梳理客户最易出现的偏差，庞皮亚纳的&quot;缓和/适应&quot;两原则帮助顾问把客户引向&quot;最好的实际配置&quot;。","label":"行为金融进入客户管理"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"18.1 偏差能否被消除","c":[{"t":"18.1.1 消除偏差所需步骤","c":[{"t":"除去偏差（debiasing）：在认知过程受到有限理性因素\"污染\"后，通过干预恢复判断的步骤与策略（有时也称\"去污染\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">除去偏差</strong>（debiasing）：在认知过程受到有限理性因素&quot;污染&quot;后，通过干预恢复判断的步骤与策略（有时也称&quot;去污染&quot;）。","label":"除去偏差"},{"t":"四个必要步骤：其一，意识到偏差存在——靠自我反思或可信的\"俗民理论\"，偏差越隐晦越难检测；其二，有消除偏差的动机——出于想把事情做好的自驱，或担心不当行为被揭露的后果；其三，知道偏差的方向和大小——方向通常明显，大小难估，纠正不足无效而过度纠正更糟（该得5分的候选者被拉低到4.5分后若\"修正\"到8分，反而更远离真值）；其四，有消除偏差的能力——必须具备调整自己反应的心理调控能力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">四个必要步骤</strong>：其一，意识到偏差存在——靠自我反思或可信的&quot;俗民理论&quot;，偏差越隐晦越难检测；其二，有消除偏差的动机——出于想把事情做好的自驱，或担心不当行为被揭露的后果；其三，知道偏差的方向和大小——方向通常明显，大小难估，纠正不足无效而过度纠正更糟（该得5分的候选者被拉低到4.5分后若&quot;修正&quot;到8分，反而更远离真值）；其四，有消除偏差的能力——必须具备调整自己反应的心理调控能力。","label":"四个必要步骤"},{"t":"威尔逊、森特巴和布里克的面试官范例：面试官对少数族裔求职者的负面印象部分源于早年暴露的偏见环境——四步逐一演示，且即便想纠正，已形成的负面印象也常挥之不去。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">威尔逊、森特巴和布里克的面试官范例</strong>：面试官对少数族裔求职者的负面印象部分源于早年暴露的偏见环境——四步逐一演示，且即便想纠正，已形成的负面印象也常挥之不去。","label":"威尔逊、森特巴和布里克的面试官范例"},{"t":"金融应用（以盲目追逐历史业绩者的近因偏差为例）：意识是主要障碍（多数人不知近因偏差的力量）；动机问题不大（财富面临风险）；方向明显但大小难定——历史表现是未来表现的不充分预测指标，动量投资还需使用正确的历史收益间隔；能力相对简单（做适当的组合调整即可，除非账户由同样有偏的外部当事人如经纪人管理）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">金融应用</strong>（以盲目追逐历史业绩者的近因偏差为例）：意识是主要障碍（多数人不知近因偏差的力量）；动机问题不大（财富面临风险）；方向明显但大小难定——历史表现是未来表现的不充分预测指标，动量投资还需使用正确的历史收益间隔；能力相对简单（做适当的组合调整即可，除非账户由同样有偏的外部当事人如经纪人管理）。","label":"金融应用"},{"t":"结论：偏差消除是难处理的过程，风险控制/环境控制（如近因偏差者减少查看账户与交易的频率）可能是最好的解决办法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：偏差消除是难处理的过程，风险控制/环境控制（如近因偏差者减少查看账户与交易的频率）可能是最好的解决办法。","label":"结论：偏差消除是难处理的过程，风险控…"}],"k":"b","i":1,"h":"18.1.1 消除偏差所需步骤","label":"18.1.1 消除偏差所需步骤"},{"t":"18.1.2 帮助受偏差影响的人的策略","c":[{"t":"菲施霍夫的分类：可改善的决策人——能学会克服偏差，需要补救与教育措施；屡教不改的决策人——难以自行纠正。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">菲施霍夫的分类</strong>：可改善的决策人——能学会克服偏差，需要补救与教育措施；屡教不改的决策人——难以自行纠正。","label":"菲施霍夫的分类"},{"t":"针对可改善者的递进干预（干预强度依次增加）：提醒问题的存在（警示）→描述问题状况（说明多数人的典型错误）→提供个人反馈（经检验被证明错误测定）→全面的训练（如让人列出首选答案为何错误的原因——反证策略）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">针对可改善者的递进干预</strong>（干预强度依次增加）：提醒问题的存在（警示）→描述问题状况（说明多数人的典型错误）→提供个人反馈（经检验被证明错误测定）→全面的训练（如让人列出首选答案为何错误的原因——反证策略）。","label":"针对可改善者的递进干预"},{"t":"以过度自信的错误测定为例：先警示人们难以给出合适宽度的置信区间，再指出多数人给出过窄区间（有人会认为只是别人受扰），然后以个人反馈证明其偏差，最后训练使其朝正确测定前进——研究表明此类训练有效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">以过度自信的错误测定为例</strong>：先警示人们难以给出合适宽度的置信区间，再指出多数人给出过窄区间（有人会认为只是别人受扰），然后以个人反馈证明其偏差，最后训练使其朝正确测定前进——研究表明此类训练有效。","label":"以过度自信的错误测定为例"},{"t":"针对屡教不改者的三种方法：将其更换；重新校准其反应；将误差项添加到计划中。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">针对屡教不改者的三种方法</strong>：将其更换；重新校准其反应；将误差项添加到计划中。","label":"针对屡教不改者的三种方法"},{"t":"重新校准的技术：设点估计为X，历史显示真实值与点估计相差因子β，则去偏估计X*=βX（如GDP均值2%而预测者惯报2.5%，则β=0.8，预测1%调整为0.8%）；置信区间上下半区按历史倍数α(U)、α(L)扩大（如各扩大50%：U=2%、L=0%修正为U*≈2.3%、L*≈-0.7%），得到除去偏差的置信区间（debiased confidence interval）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">重新校准的技术</strong>：设点估计为X，历史显示真实值与点估计相差因子β，则去偏估计X*=βX（如GDP均值2%而预测者惯报2.5%，则β=0.8，预测1%调整为0.8%）；置信区间上下半区按历史倍数α(U)、α(L)扩大（如各扩大50%：U=2%、L=0%修正为U*≈2.3%、L*≈-0.7%），得到除去偏差的置信区间（debiased confidence interval）。","label":"重新校准的技术"},{"t":"缺少校准所需信息且显著错误很可能发生时：必须为错误做出安排，如征求可供选择的观点或预测值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">缺少校准所需信息且显著错误很可能发生时</strong>：必须为错误做出安排，如征求可供选择的观点或预测值。","label":"缺少校准所需信息且显著错误很可能发生时"}],"k":"b","i":1,"h":"18.1.2 帮助受偏差影响的人的策略","label":"18.1.2 帮助受偏差影响的人的策略"}],"k":"sec","i":0,"h":"18.1 偏差能否被消除","label":"18.1 偏差能否被消除"},{"t":"18.2 通过教育除去偏差","c":[{"t":"18.2.1 心理统计特征分析，性格类型以及货币态度","c":[{"t":"心理统计特征分析（psychographic profiling）：按性格、态度、价值观及信念将个体分组的营销手段；在金融教育中用于判断\"哪类人易受哪类问题影响\"，从而疏导教育力量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">心理统计特征分析</strong>（psychographic profiling）：按性格、态度、价值观及信念将个体分组的营销手段；在金融教育中用于判断&quot;哪类人易受哪类问题影响&quot;，从而疏导教育力量。","label":"心理统计特征分析"},{"t":"梅尔斯-布里格斯指标（Myers-Briggs indicator）：问卷把人置入16种性格类型（personality types），按四维度划分——E/I（外向对内向）、S/N（感觉对直觉）、T/F（理性对情感）、J/P（判断对理解）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">梅尔斯-布里格斯指标</strong>（Myers-Briggs indicator）：问卷把人置入16种性格类型（personality types），按四维度划分——E/I（外向对内向）、S/N（感觉对直觉）、T/F（理性对情感）、J/P（判断对理解）。","label":"梅尔斯-布里格斯指标"},{"t":"性格与风险：ESTP（外向-感觉-理性-理解）风险厌恶最低、过度自信最严重（其后依次为ENTP、ESTJ、ISTP、ESFP）；INFJ风险厌恶最大、过度自信最轻（其后为ENFJ、INFP、INTJ、ISFJ）；性格类型可有效预测过度自信与乐观等行为缺陷，可能比标准风险容忍度问卷更好地揭示真实风险容忍度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">性格与风险</strong>：ESTP（外向-感觉-理性-理解）风险厌恶最低、过度自信最严重（其后依次为ENTP、ESTJ、ISTP、ESFP）；INFJ风险厌恶最大、过度自信最轻（其后为ENFJ、INFP、INTJ、ISFJ）；性格类型可有效预测过度自信与乐观等行为缺陷，可能比标准风险容忍度问卷更好地揭示真实风险容忍度。","label":"性格与风险"},{"t":"基尔西气质分类：护卫者（谨慎教条的经理人）、技艺者（易冲动好竞争）、理性者（科学解决问题的人）、理想主义者（关心增长与个人发展）；已证明可有效预测风险容忍度与对国内外证券的偏好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">基尔西气质分类</strong>：护卫者（谨慎教条的经理人）、技艺者（易冲动好竞争）、理性者（科学解决问题的人）、理想主义者（关心增长与个人发展）；已证明可有效预测风险容忍度与对国内外证券的偏好。","label":"基尔西气质分类"},{"t":"货币态度（money attitude）：依据可度量的态度属性对投资者细分；先锋公司用聚类分析按货币性格划分DC计划成员，重点考察对退休的关注与财务规划、储蓄行为、乐观程度与风险承担。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">货币态度</strong>（money attitude）：依据可度量的态度属性对投资者细分；先锋公司用聚类分析按货币性格划分DC计划成员，重点考察对退休的关注与财务规划、储蓄行为、乐观程度与风险承担。","label":"货币态度"},{"t":"五种货币性格群体：成功的规划者（21%，较年长较富裕、目标清晰、享受处理资金、有条理储蓄、愿担重大风险）；积极进取的规划者（26%，\"培训中的成功规划者\"，更年轻、愿担一定风险）；稳重的实干者（20%，较年长较富裕但目标导向不明确、不喜欢规划、自愿储蓄、不愿多担风险）；有压力的规避者（19%，易后悔、信息依赖计划提供者与雇主、悲观、储蓄行为困惑担忧、缺乏信心）；只关注当前的规避者（14%，最年轻、不考虑退休、储蓄无内在满足、风险态度中性）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">五种货币性格群体</strong>：成功的规划者（21%，较年长较富裕、目标清晰、享受处理资金、有条理储蓄、愿担重大风险）；积极进取的规划者（26%，&quot;培训中的成功规划者&quot;，更年轻、愿担一定风险）；稳重的实干者（20%，较年长较富裕但目标导向不明确、不喜欢规划、自愿储蓄、不愿多担风险）；有压力的规避者（19%，易后悔、信息依赖计划提供者与雇主、悲观、储蓄行为困惑担忧、缺乏信心）；只关注当前的规避者（14%，最年轻、不考虑退休、储蓄无内在满足、风险态度中性）。","label":"五种货币性格群体"},{"t":"规划者-规避者连续统一体（planner-avoider continuum）：以成功的规划者与只关注当前的规避者为两极排列五类群体；规划者（较年长、较富裕的男性，尤其有家庭者）在财富积累上表现更好、承担风险时更舒适——支撑态度细分有效性的证据。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规划者-规避者连续统一体</strong>（planner-avoider continuum）：以成功的规划者与只关注当前的规避者为两极排列五类群体；规划者（较年长、较富裕的男性，尤其有家庭者）在财富积累上表现更好、承担风险时更舒适——支撑态度细分有效性的证据。","label":"规划者-规避者连续统一体"}],"k":"b","i":1,"h":"18.2.1 心理统计特征分析，性格类型以及货币态度","label":"18.2.1 心理统计特征分析，性格…"},{"t":"18.2.2 充分利用教育","c":[{"t":"预警式教育：告知人们可能形成哪类偏差及其后果，期待其提前调整；诺夫辛格《疯狂投资》\"与偏差斗争\"一章给出主要偏差清单及影响，并提供定量筛选、控制投资环境等策略（如查看交易每月不超过一次、考察组合每年不超过一次，以缓解短期波动引发的损失厌恶与后悔）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">预警式教育</strong>：告知人们可能形成哪类偏差及其后果，期待其提前调整；诺夫辛格《疯狂投资》&quot;与偏差斗争&quot;一章给出主要偏差清单及影响，并提供定量筛选、控制投资环境等策略（如查看交易每月不超过一次、考察组合每年不超过一次，以缓解短期波动引发的损失厌恶与后悔）。","label":"预警式教育"},{"t":"客制化（customization）：让教育针对特定读者更有效；DC计划教育应满足规避者的需要——规划者立场坚定、准备工作水平不受教育与否影响，规避者才是需要被关注的群体。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">客制化</strong>（customization）：让教育针对特定读者更有效；DC计划教育应满足规避者的需要——规划者立场坚定、准备工作水平不受教育与否影响，规避者才是需要被关注的群体。","label":"客制化（customization）…"},{"t":"基于成人的学习方法：以学习者而非信息为中心，目标是使成员成为有明确目标、自我调整的学习者而非事实摘录者，把基本原理与个人理解及经验联系起来——规避者虽缺金融头脑但有丰富经历。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">基于成人的学习方法</strong>：以学习者而非信息为中心，目标是使成员成为有明确目标、自我调整的学习者而非事实摘录者，把基本原理与个人理解及经验联系起来——规避者虽缺金融头脑但有丰富经历。","label":"基于成人的学习方法"},{"t":"信诺退休投资服务中心的测试：热线代理人经培训后以经验为据（而非演讲）吸引呼叫者讨论储蓄利益与目前递延比率，成为\"伪装的教育者\"，递延比率显著增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信诺退休投资服务中心的测试</strong>：热线代理人经培训后以经验为据（而非演讲）吸引呼叫者讨论储蓄利益与目前递延比率，成为&quot;伪装的教育者&quot;，递延比率显著增加。","label":"信诺退休投资服务中心的测试"},{"t":"退休规划网站的客制化：最小化访问障碍（邮件附有效链接优于普通通知）以促成规避者访问；网站前端保持简单、动人、直接以留住规避者，吸引规划者的复杂设计放在下级目录。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">退休规划网站的客制化</strong>：最小化访问障碍（邮件附有效链接优于普通通知）以促成规避者访问；网站前端保持简单、动人、直接以留住规避者，吸引规划者的复杂设计放在下级目录。","label":"退休规划网站的客制化"},{"t":"规避者能否转变为规划者：倾向很大程度上固有、由性格决定，但教育可部分起效——提高决策技能的研讨班显著增加规划品质，中学金融教育（如编制预算）能培养储蓄习惯。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规避者能否转变为规划者</strong>：倾向很大程度上固有、由性格决定，但教育可部分起效——提高决策技能的研讨班显著增加规划品质，中学金融教育（如编制预算）能培养储蓄习惯。","label":"规避者能否转变为规划者"}],"k":"b","i":1,"h":"18.2.2 充分利用教育","label":"18.2.2 充分利用教育"}],"k":"sec","i":0,"h":"18.2 通过教育除去偏差","label":"18.2 通过教育除去偏差"},{"t":"18.3 利用行为金融进行客户管理","c":[{"t":"18.3.1 传统的资产配置决定过程","c":[{"t":"风险容忍度（risk tolerance）：风险容量与风险态度的函数。风险容量（risk capacity）指与回答者年龄、退休计划、收入、流动性需求等相同的普通个体合理的风险数量；风险态度（risk attitude）是反映个人偏好与心理因素、使其偏离风险容量的调整因子；风险得分经映射得到资产配置建议（高分对应较高股权风险）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">风险容忍度</strong>（risk tolerance）：风险容量与风险态度的函数。风险容量（risk capacity）指与回答者年龄、退休计划、收入、流动性需求等相同的普通个体合理的风险数量；风险态度（risk attitude）是反映个人偏好与心理因素、使其偏离风险容量的调整因子；风险得分经映射得到资产配置建议（高分对应较高股权风险）。","label":"风险容忍度"},{"t":"主观风险（subjective risk）：来自风险问卷的配置方案，依据个体对风险的态度与信念；客观风险（objective risk）：真实投资决策中风险资产占组合的百分比。\"事实胜于雄辩\"倾向让人偏爱客观风险，但它受无知（选择与偏好不一致）与惰性（再平衡不足、组合随市场漂移）损害；主观风险也不可靠。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">主观风险</strong>（subjective risk）：来自风险问卷的配置方案，依据个体对风险的态度与信念；客观风险（objective risk）：真实投资决策中风险资产占组合的百分比。&quot;事实胜于雄辩&quot;倾向让人偏爱客观风险，但它受无知（选择与偏好不一致）与惰性（再平衡不足、组合随市场漂移）损害；主观风险也不可靠。","label":"主观风险"},{"t":"主观风险的回答者缺陷：人们难以理解风险，尤其难以理解风险具有很强的期限特性。本纳齐与泰勒的实验：员工在两只基金（分别对应活跃的美国股票指数与5年期国债）间分配资金，看到30年期收益分布的群体流向股票基金的配置显著高于看到1年期分布的群体（损失厌恶被长期视角稀释）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">主观风险的回答者缺陷</strong>：人们难以理解风险，尤其难以理解风险具有很强的期限特性。本纳齐与泰勒的实验：员工在两只基金（分别对应活跃的美国股票指数与5年期国债）间分配资金，看到30年期收益分布的群体流向股票基金的配置显著高于看到1年期分布的群体（损失厌恶被长期视角稀释）。","label":"主观风险的回答者缺陷"},{"t":"对问卷设计的警示：许多风险问卷问\"过去一年股票组合损失x%你会怎么办\"，这使投资者认为关注短期波动合理，而其真正关心的是特定期限的风险与收益；不过此类问题也有合理性——避免过度紧张者因市场下跌而彻底永久地放弃股权风险。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对问卷设计的警示</strong>：许多风险问卷问&quot;过去一年股票组合损失x%你会怎么办&quot;，这使投资者认为关注短期波动合理，而其真正关心的是特定期限的风险与收益；不过此类问题也有合理性——避免过度紧张者因市场下跌而彻底永久地放弃股权风险。","label":"对问卷设计的警示"},{"t":"问卷质量两指标：有效性（validity）——问卷对其宣称要测的指标的实际度量程度（探测风险容量时年龄、退休时间等问题应占主导，可辅以收入与其他投资品）；可信性（reliability）——调查结果的一致性，需足够数量的合理问题，使单个被曲解问题的影响被稀释。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问卷质量两指标</strong>：有效性（validity）——问卷对其宣称要测的指标的实际度量程度（探测风险容量时年龄、退休时间等问题应占主导，可辅以收入与其他投资品）；可信性（reliability）——调查结果的一致性，需足够数量的合理问题，使单个被曲解问题的影响被稀释。","label":"问卷质量两指标"}],"k":"b","i":1,"h":"18.3.1 传统的资产配置决定过程","label":"18.3.1 传统的资产配置决定过程"},{"t":"18.3.2 使用行为金融改善决策方法","c":[{"t":"卡尼曼与里皮的行为测试：一系列问题组合起来可梳理被考察客户（也可先测顾问自己）最易出现的偏差；例：掷硬币出现HHHTTT还是HTHTTH更可能？答案为同等可能——对随机事件（如当前表现）过度反应者会误以为前者不可能。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">卡尼曼与里皮的行为测试</strong>：一系列问题组合起来可梳理被考察客户（也可先测顾问自己）最易出现的偏差；例：掷硬币出现HHHTTT还是HTHTTH更可能？答案为同等可能——对随机事件（如当前表现）过度反应者会误以为前者不可能。","label":"卡尼曼与里皮的行为测试"},{"t":"对随机性过度反应者的建议：问问自己是否有真实理由相信你比市场知道得多；在主动决策前考虑交易基于随机因素的概率，并列出它为何不以随机因素为依据的原因（运用反证的消除偏差策略）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对随机性过度反应者的建议</strong>：问问自己是否有真实理由相信你比市场知道得多；在主动决策前考虑交易基于随机因素的概率，并列出它为何不以随机因素为依据的原因（运用反证的消除偏差策略）。","label":"对随机性过度反应者的建议"},{"t":"庞皮亚纳的两点原则：原则1——缓和（削弱）较贫穷客户形成的偏差，同时适应（接纳）较富有客户的偏差；原则2——缓和认知偏差，同时适应情绪偏差。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">庞皮亚纳的两点原则</strong>：原则1——缓和（削弱）较贫穷客户形成的偏差，同时适应（接纳）较富有客户的偏差；原则2——缓和认知偏差，同时适应情绪偏差。","label":"庞皮亚纳的两点原则"},{"t":"原则1的依据：对较贫穷客户，退休投资的大风险是忍受资产波动性——损失厌恶使其过分回避股权，而较富有客户即便如此退休资源仍充足；告知\"许多人受损失厌恶影响、长期看差行情会被好行情抵消\"是正确方向。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原则1的依据</strong>：对较贫穷客户，退休投资的大风险是忍受资产波动性——损失厌恶使其过分回避股权，而较富有客户即便如此退休资源仍充足；告知&quot;许多人受损失厌恶影响、长期看差行情会被好行情抵消&quot;是正确方向。","label":"原则1的依据"},{"t":"原则2的依据：认知与判断偏差经合理教育更易削弱；情绪偏差根植于大脑边缘系统、难以应付——若客户的风险观源于情绪，强行施加高风险投资，市场变糟时他很可能改变决策甚至解雇顾问。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原则2的依据</strong>：认知与判断偏差经合理教育更易削弱；情绪偏差根植于大脑边缘系统、难以应付——若客户的风险观源于情绪，强行施加高风险投资，市场变糟时他很可能改变决策甚至解雇顾问。","label":"原则2的依据"},{"t":"目标与局限：由此把客户引向\"最好的实际配置\"——可能次优，但在不被客户中途解雇的风险下最接近最优；该方法的显著缺陷是隐含假设\"最好配置\"来自风险问卷（前述问卷缺陷依然存在），改进思路是取主观评判方法与规范方法的加权平均，权重为对各自方法的信心。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">目标与局限</strong>：由此把客户引向&quot;最好的实际配置&quot;——可能次优，但在不被客户中途解雇的风险下最接近最优；该方法的显著缺陷是隐含假设&quot;最好配置&quot;来自风险问卷（前述问卷缺陷依然存在），改进思路是取主观评判方法与规范方法的加权平均，权重为对各自方法的信心。","label":"目标与局限"},{"t":"行业共识：了解客户（及顾问自己）的偏差与情绪，能改善理财顾问与投资者的关系，并形成更符合客户目标与心理的托管资产组合。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行业共识</strong>：了解客户（及顾问自己）的偏差与情绪，能改善理财顾问与投资者的关系，并形成更符合客户目标与心理的托管资产组合。","label":"行业共识"}],"k":"b","i":1,"h":"18.3.2 使用行为金融改善决策方法","label":"18.3.2 使用行为金融改善决策方法"}],"k":"sec","i":0,"h":"18.3 利用行为金融进行客户管理","label":"18.3 利用行为金融进行客户管理"}],"k":"chap","h":"第18章 除去偏差、教育和客户管理","label":"第18章 除去偏差、教育和客户管理"}],"k":"part","h":"第七篇 退休、养老金、教育、除去偏差及客户管理","label":"第七篇 退休、养老金、教育、除去偏差…","col":"#0ea5a5","pc":"p7"},{"t":"第八篇 理财","c":[{"t":"第19章 行为投资","c":[{"t":"本章要点","c":[{"t":"行为投资（behavioral investing）：试图应用从行为金融中汲取的经验教训来提高投资组合的表现。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">行为投资</strong>（behavioral investing）：试图应用从行为金融中汲取的经验教训来提高投资组合的表现。","label":"行为投资"},{"t":"动量、价值与反转效应在不同样本和市场上展现了稳健性，但异象一旦在学术文献中被报告，往往因套利与信息传播而衰减（attenuated）甚至消失；被视为风险补偿的异象（价值、规模）则不应消失。","c":[],"k":"b","i":1,"h":"动量、价值与反转效应在不同样本和市场上展现了稳健性，但异象一旦在学术文献中被报告，往往因套利与信息传播而衰减（attenuated）甚至消失；被视为风险补偿的异象（价值、规模）则不应消失。","label":"动量、价值与反转效应在不同样本和市场…"},{"t":"经理人按风格同等群体（style peer group）接受比较评估，要在同类中脱颖而出必须寻找额外优势：财务报表信息（F-得分）、交易量、收益期限结构与一致性等筛选因素。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经理人按风格同等群体</strong>（style peer group）接受比较评估，要在同类中脱颖而出必须寻找额外优势：财务报表信息（F-得分）、交易量、收益期限结构与一致性等筛选因素。","label":"经理人按风格同等群体"},{"t":"多元方法（multivariate approach）试图同时利用所有相关因素，但纳入交易成本后，除动量与价值之外是否有增值并不清楚。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">多元方法</strong>（multivariate approach）试图同时利用所有相关因素，但纳入交易成本后，除动量与价值之外是否有增值并不清楚。","label":"多元方法"},{"t":"风格循环（style rotation）试图测定风格转变的时点；国内与国际市场的初步研究都表明其可行。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">风格循环</strong>（style rotation）试图测定风格转变的时点；国内与国际市场的初步研究都表明其可行。","label":"风格循环"},{"t":"现有证据尚不能证明行为投资带来收益增加；考虑到有行为倾向的基金样本缺乏、行为投资定义不清，这仍是结果有待确认的重要问题。","c":[],"k":"b","i":1,"h":"现有证据尚不能证明行为投资带来收益增加；考虑到有行为倾向的 尔塞斯基与拉孔尼修克发现大盘成长股的主导地位与其基本面表现无关，而是竞争风格的经营业绩相对不佳；斯金纳与斯隆发现盈余公告的不对称反应——收益率低于预期5%时，价值型股票下一季度超额回报约-6%，成长型约-15%；控制该效应后再无风格间回报差异，即价值溢价实际由成长股逊于预期驱动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行为证据</strong>：陈、卡尔塞斯基与拉孔尼修克发现大盘成长股的主导地位与其基本面表现无关，而是竞争风格的经营业绩相对不佳；斯金纳与斯隆发现盈余公告的不对称反应——收益率低于预期5%时，价值型股票下一季度超额回报约-6%，成长型约-15%；控制该效应后再无风格间回报差异，即价值溢价实际由成长股逊于预期驱动。","label":"行为证据"},{"t":"拉波尔塔：按分析师长期增长预期排名，预期最高的股票实际回报远低于预期最低者；增长业绩极少能持续（销售收入、折旧前营业收入与未付特殊项目前收入的增长率接近随机），高销售持续性可能以牺牲盈利为代价——市销率是高度可疑的估值指标。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">拉波尔塔</strong>：按分析师长期增长预期排名，预期最高的股票实际回报远低于预期最低者；增长业绩极少能持续（销售收入、折旧前营业收入与未付特殊项目前收入的增长率接近随机），高销售持续性可能以牺牲盈利为代价——市销率是高度可疑的估值指标。","label":"拉波尔塔"}],"k":"b","i":1,"h":"（蒙蒂尔）价值型对成长型：风险还是行为？","label":"（蒙蒂尔）价值型对成长型：风险还是行为？"}],"k":"sec","i":0,"h":"19.1 异象衰减、风格同等群体以及风格投资","label":"19.1 异象衰减、风格同等群体以及…"},{"t":"19.2 完善异象捕获","c":[{"t":"19.2.1 使用会计数据完善价值投资（彼得罗斯基F-得分）","c":[{"t":"背景：除波动性与投资者经验外，财务报表信息也被证明有用；简单账面市值比价值投资只对一小部分公司有效——不到44%的高账面市值比公司在组合形成后两年内获得正的市场调整收益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：除波动性与投资者经验外，财务报表信息也被证明有用；简单账面市值比价值投资只对一小部分公司有效——不到44%的高账面市值比公司在组合形成后两年内获得正的市场调整收益。","label":"背景：除波动性与投资者经验外，财务报…"},{"t":"构造：9个基本信号衡量公司财务状况三方面——盈利能力、财务杠杆/流动性、经营效率；加总得到F-得分（财务稳健性），取0（最不稳健）到9（最稳健）的整数；经营业绩有望好转的公司更可能获得较高F值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">构造</strong>：9个基本信号衡量公司财务状况三方面——盈利能力、财务杠杆/流动性、经营效率；加总得到F-得分（财务稳健性），取0（最不稳健）到9（最稳健）的整数；经营业绩有望好转的公司更可能获得较高F值。","label":"构造：9个基本信号衡量公司财务状况三…"},{"t":"（蒙蒂尔）9个信号清单：盈利能力（ROA>0、经营现金流CFO>0、ΔROA>0、应计项目CFO>ROA）；杠杆与流动性（长期杠杆下降、流动性改善、过去12个月未发行股票）；营运效率（毛利率上升、资产周转率上升）。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）9个信号清单：盈利能力（ROA&gt;0、经营现金流CFO&gt;0、ΔROA&gt;0、应计项目CFO&gt;ROA）；杠杆与流动性（长期杠杆下降、流动性改善、过去12个月未发行股票）；营运效率（毛利率上升、资产周转率上升）。","label":"（蒙蒂尔）9个信号清单：盈利能力（R…"},{"t":"效果：买入高F-得分（8—9）并卖空低分（0—1）的公司，1976—1996年创造23%超额收益；更保守的划分（高≥5、低≤4）产生9.7%的年超额收益；21年中仅3年多空策略获得负的风险调整收益（其中2年接近零），且收益对每年的基本环境依赖度高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效果</strong>：买入高F-得分（8—9）并卖空低分（0—1）的公司，1976—1996年创造23%超额收益；更保守的划分（高≥5、低≤4
