</strong>：效用函数描述了偏好，它对各种可能的结果赋值，选项越受偏好，所对应的赋值就越大。","label":"要点3：效用函数描述了偏好，它对各种…"},{"t":"要点4：期望效用理论定义了不确定性条件下的理性行为。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点4</strong>：期望效用理论定义了不确定性条件下的理性行为。","label":"要点4：期望效用理论定义了不确定性条…"},{"t":"要点5：期望效用理论对于定义风险偏好很有用处。规避风险者喜爱前景的期望甚于前景本身；寻求风险者更喜欢前景，而不是确定性的前景期望；风险中性者从赌局和赌局的期望中所获得的效用相同。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点5</strong>：期望效用理论对于定义风险偏好很有用处。规避风险者喜爱前景的期望甚于前景本身；寻求风险者更喜欢前景，而不是确定性的前景期望；风险中性者从赌局和赌局的期望中所获得的效用相同。","label":"要点5：期望效用理论对于定义风险偏好…"},{"t":"要点6：阿莱悖论是一个违反期望效用理论的常见例子。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点6</strong>：阿莱悖论是一个违反期望效用理论的常见例子。","label":"要点6：阿莱悖论是一个违反期望效用理…"},{"t":"要点7：前景问题的框架（即表现形式），有时会影响到人的选择。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点7</strong>：前景问题的框架（即表现形式），有时会影响到人的选择。","label":"要点7：前景问题的框架（即表现形式）…"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"1.1 新古典主义经济学","c":[{"t":"并入要点：要点1、要点2、要点3。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">并入要点</strong>：要点1、要点2、要点3。","label":"并入要点"},{"t":"定位：传统金融学模型以经济学为基础，新古典主义经济学（neoclassical economics）是经济学的主要典范；本章介绍个人决策，第2章介绍市场行为；一项资产的价值（或价格）由市场决定、受供给与需求影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">定位</strong>：传统金融学模型以经济学为基础，新古典主义经济学（neoclassical economics）是经济学的主要典范；本章介绍个人决策，第2章介绍市场行为；一项资产的价值（或价格）由市场决定、受供给与需求影响。","label":"定位：传统金融学模型以经济学为基础，…"},{"t":"关于\"人\"的三大假设：(1) 人们对各种可能的结果或状态拥有理性偏好；(2) 人们希望获得最大效用，公司希望获得最大利润；(3) 人们会基于全部相关信息独立地做出决策。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">关于&quot;人&quot;的三大假设</strong>：(1) 人们对各种可能的结果或状态拥有理性偏好；(2) 人们希望获得最大效用，公司希望获得最大利润；(3) 人们会基于全部相关信息独立地做出决策。","label":"关于\"人\"的三大假设"},{"t":"1.1.1 理性偏好","c":[{"t":"理性偏好（rational preferences）：对所有可能选项都能两两比较，且排序前后一致。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理性偏好</strong>（rational preferences）：对所有可能选项都能两两比较，且排序前后一致。","label":"理性偏好"},{"t":"符号：x≻y 表示严格偏好；x∼y 表示无差异；x⪰y 表示弱偏好（偏好 x 或认为无差异）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">符号</strong>：x≻y 表示严格偏好；x∼y 表示无差异；x⪰y 表示弱偏好（偏好 x 或认为无差异）。","label":"符号：x≻y 表示严格偏好；x∼y …"},{"t":"完备性（complete）：对任意两个选项 x 与 y，必有 x⪰y 或 y⪰x，或两者同时成立（x∼y）——即人能对一切选项比出高下或判为无差异。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">完备性</strong>（complete）：对任意两个选项 x 与 y，必有 x⪰y 或 y⪰x，或两者同时成立（x∼y）——即人能对一切选项比出高下或判为无差异。","label":"完备性（complete）：对任意两…"},{"t":"传递性（transitive）：若 x≻y 且 y≻z，则 x≻z（书中例：香草≻巧克力≻草莓 ⇒ 香草≻草莓）；一旦传递性不成立，就无法找到最佳选择，故理性选择必具传递性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传递性</strong>（transitive）：若 x≻y 且 y≻z，则 x≻z（书中例：香草≻巧克力≻草莓 ⇒ 香草≻草莓）；一旦传递性不成立，就无法找到最佳选择，故理性选择必具传递性。","label":"传递性（transitive）：若 …"}],"k":"b","i":1,"h":"1.1.1 理性偏好","label":"1.1.1 理性偏好"},{"t":"1.1.2 效用最大化","c":[{"t":"效用函数（utility function）u(·)：对种种可能的结果赋值，越受偏好的结果赋值越高；效用可视为某一特定结果带来的满足感（要点3）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效用函数</strong>（utility function）u(·)：对种种可能的结果赋值，越受偏好的结果赋值越高；效用可视为某一特定结果带来的满足感（要点3）。","label":"效用函数"},{"t":"序数而非基数：u(·) 是序数函数（ordinal function）——只有结果之间的排序重要，实际得到的函数值并不重要；区别于基数函数（cardinal function，人们仅关注效用值本身）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">序数而非基数</strong>：u(·) 是序数函数（ordinal function）——只有结果之间的排序重要，实际得到的函数值并不重要；区别于基数函数（cardinal function，人们仅关注效用值本身）。","label":"序数而非基数"},{"t":"最优选择：在预算约束（由财富或收入决定）下的所有商品组合中，选出使效用最大化的组合。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最优选择</strong>：在预算约束（由财富或收入决定）下的所有商品组合中，选出使效用最大化的组合。","label":"最优选择"},{"t":"非饱和性（nonsatiation）：数量越多越好；只有一种商品时，效用函数常以财富水平 w 为自变量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">非饱和性</strong>（nonsatiation）：数量越多越好；只有一种商品时，效用函数常以财富水平 w 为自变量。","label":"非饱和性"},{"t":"对数效用示例：u(w)=ln(w)，财富以 10 000 美元为单位；如 u(5)=1.6094、u(10)=2.3026、u(62)=4.1271、u(100)=4.6052；随财富增加函数斜率不断减小——低收入水平上添加财富带来的效用增长大于高收入水平（表1-1、图1-1）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对数效用示例</strong>：u(w)=ln(w)，财富以 10 000 美元为单位；如 u(5)=1.6094、u(10)=2.3026、u(62)=4.1271、u(100)=4.6052；随财富增加函数斜率不断减小——低收入水平上添加财富带来的效用增长大于高收入水平（表1-1、图1-1）。","label":"对数效用示例"}],"k":"b","i":1,"h":"1.1.2 效用最大化","label":"1.1.2 效用最大化"},{"t":"1.1.3 相关信息","c":[{"t":"假设个人会利用所有与选项集合相关的信息来获得最大效用；但世上鲜有免费的信息——获取信息有费用，彻底理解既得信息也有费用；金融决策中如何界定\"相关\"信息见第2章。","c":[],"k":"b","i":2,"h":"假设个人会利用所有与选项集合相关的信息来获得最大效用；但世上鲜有免费的信息——获取信息有费用，彻底理解既得信息也有费用；金融决策中如何界定&quot;相关&quot;信息见第2章。","label":"假设个人会利用所有与选项集合相关的信…"}],"k":"b","i":1,"h":"1.1.3 相关信息","label":"1.1.3 相关信息"}],"k":"sec","i":0,"h":"1.1 新古典主义经济学","label":"1.1 新古典主义经济学"},{"t":"1.2 期望效用理论","c":[{"t":"并入要点：要点4。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">并入要点</strong>：要点4。","label":"并入要点"},{"t":"提出者与性质：期望效用理论（expected utility theory）由冯·诺依曼（von Neumann）与摩根斯坦（Morgenstern）提出，用于定义不确定性条件下的理性行为；它是规范性（normative）理论——描述人们应有的理性行为，与描述真实行为的实证性（positive）理论相对。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">提出者与性质</strong>：期望效用理论（expected utility theory）由冯·诺依曼（von Neumann）与摩根斯坦（Morgenstern）提出，用于定义不确定性条件下的理性行为；它是规范性（normative）理论——描述人们应有的理性行为，与描述真实行为的实证性（positive）理论相对。","label":"提出者与性质"},{"t":"风险与不确定性之别（奈特，Knight, 1921）：风险（risk）指知道会有哪些结果、并知道各结果的发生概率，是可度量的数量；不确定性（uncertainty）指连各结果的概率、甚至可能有哪些结果都不可知，不可度量。期望效用理论真正适用于风险性情况而非不确定性情况；日常所谓\"不确定性决策\"几乎都只是风险决策。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">风险与不确定性之别</strong>（奈特，Knight, 1921）：风险（risk）指知道会有哪些结果、并知道各结果的发生概率，是可度量的数量；不确定性（uncertainty）指连各结果的概率、甚至可能有哪些结果都不可知，不可度量。期望效用理论真正适用于风险性情况而非不确定性情况；日常所谓&quot;不确定性决策&quot;几乎都只是风险决策。","label":"风险与不确定性之别"},{"t":"前景（prospect）：一组以财富水平表示的结果及每个结果对应的概率，记作 P(p1, w1, w2)，如 P1(0.40, 50 000 美元, 1 000 000 美元)；若只给一个金额，如 P(0.3, 100 美元)，则隐含第二种结果为 0。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">前景</strong>（prospect）：一组以财富水平表示的结果及每个结果对应的概率，记作 P(p1, w1, w2)，如 P1(0.40, 50 000 美元, 1 000 000 美元)；若只给一个金额，如 P(0.3, 100 美元)，则隐含第二种结果为 0。","label":"前景（prospect）：一组以财富…"},{"t":"决策步骤：先求得不同财富水平对应的效用 → 对每个备选前景按概率加权算出期望效用 → 选取期望效用最大的前景。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">决策步骤</strong>：先求得不同财富水平对应的效用 → 对每个备选前景按概率加权算出期望效用 → 选取期望效用最大的前景。","label":"决策步骤"},{"t":"期望效用计算：U(P1)=0.40u(50 000)+0.60u(1 000 000)；取 u(w)=ln(w)（万美元）时 U(P1)=0.40×1.6094+0.60×4.6052=3.4069。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">期望效用计算</strong>：U(P1)=0.40u(50 000)+0.60u(1 000 000)；取 u(w)=ln(w)（万美元）时 U(P1)=0.40×1.6094+0.60×4.6052=3.4069。","label":"期望效用计算"},{"t":"前景排序示例：P2(0.50, 100 000 美元, 1 000 000 美元)——低财富结果优于 P1（10 万>5 万），但高财富结果的概率更低（0.50<0.60），直观难判；U(P2)=0.50×2.3026+0.50×4.6052=3.4539>U(P1)=3.4069，故对数效用下更偏好 P2（换一个效用函数，结论可以反转）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">前景排序示例</strong>：P2(0.50, 100 000 美元, 1 000 000 美元)——低财富结果优于 P1（10 万&gt;5 万），但高财富结果的概率更低（0.50&lt;0.60），直观难判；U(P2)=0.50×2.3026+0.50×4.6052=3.4539&gt;U(P1)=3.4069，故对数效用下更偏好 P2（换一个效用函数，结论可以反转）。","label":"前景排序示例"},{"t":"期望效用的度量性质：可按期望效用对风险选项排序（序数）；且可证明对个人而言期望效用是基数——它有独一无二的正线性变换（第3章论证；附录1A 给出公理与证明）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">期望效用的度量性质</strong>：可按期望效用对风险选项排序（序数）；且可证明对个人而言期望效用是基数——它有独一无二的正线性变换（第3章论证；附录1A 给出公理与证明）。","label":"期望效用的度量性质"}],"k":"sec","i":0,"h":"1.2 期望效用理论","label":"1.2 期望效用理论"},{"t":"1.3 风险态度","c":[{"t":"并入要点：要点5。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">并入要点</strong>：要点5。","label":"并入要点"},{"t":"背景命题：有足够多证据表明大多数人在大多数情况下规避风险；若能得到相应补偿则愿意承担风险（两只期望收益相同的股票，多数人选风险小的那只）——风险与收益的权衡在第2章展开。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">背景命题</strong>：有足够多证据表明大多数人在大多数情况下规避风险；若能得到相应补偿则愿意承担风险（两只期望收益相同的股票，多数人选风险小的那只）——风险与收益的权衡在第2章展开。","label":"背景命题"},{"t":"判据：比较\"前景期望财富的效用\"u(E(P)) 与\"前景的期望效用\"U(P)。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">判据</strong>：比较&quot;前景期望财富的效用&quot;u(E(P)) 与&quot;前景的期望效用&quot;U(P)。","label":"判据：比较\"前景期望财富的效用\"u(…"},{"t":"规避风险（risk averse）：u(E(P))>U(P)，效用函数为凹函数（斜率随财富递减）；宁可得到确定性的前景期望，而不参与结果不确定的赌局。","c":[{"t":"数值示例（沿用 P1）：E(w)=0.40×50 000+0.60×1 000 000=620 000 美元，u(62)=4.1271>U(P1)=3.4069——宁愿拥有确定的 62 万美元而非该前景（图1-2）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数值示例</strong>（沿用 P1）：E(w)=0.40×50 000+0.60×1 000 000=620 000 美元，u(62)=4.1271&gt;U(P1)=3.4069——宁愿拥有确定的 62 万美元而非该前景（图1-2）。","label":"数值示例"}],"k":"b","i":1,"h":"<strong class=\"lead\">规避风险</strong>（risk averse）：u(E(P))&gt;U(P)，效用函数为凹函数（斜率随财富递减）；宁可得到确定性的前景期望，而不参与结果不确定的赌局。","label":"规避风险"},{"t":"确定性等价物（certainty equivalent, CE）：一种财富水平，在该水平上决策者认为某一前景与这个确定性的财富水平并无差异，即 u(CE)=U(P)。","c":[{"t":"P1 的确定性等价物为 301 700 美元：u(30.17)=3.4069=U(P1)；把前景 P1 替换为确定性财富需付出期望值 318 300 美元（620 000−301 700）的代价——即规避风险者为得到确定性愿意做出的牺牲。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">P1 的确定性等价物为 301 700 美元</strong>：u(30.17)=3.4069=U(P1)；把前景 P1 替换为确定性财富需付出期望值 318 300 美元（620 000−301 700）的代价——即规避风险者为得到确定性愿意做出的牺牲。","label":"P1 的确定性等价物为 301 700 美元"}],"k":"b","i":1,"h":"<strong class=\"lead\">确定性等价物</strong>（certainty equivalent, CE）：一种财富水平，在该水平上决策者认为某一前景与这个确定性的财富水平并无差异，即 u(CE)=U(P)。","label":"确定性等价物"},{"t":"寻求风险（risk seeker）：u(E(P))<U(P)，效用函数为凸函数；财富的确定性等价水平大于前景的期望——宁可参加结果不确定的赌局而非拿到确定的期望（图1-3）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">寻求风险</strong>（risk seeker）：u(E(P))&lt;U(P)，效用函数为凸函数；财富的确定性等价水平大于前景的期望——宁可参加结果不确定的赌局而非拿到确定的期望（图1-3）。","label":"寻求风险"},{"t":"风险中性（risk neutral）：u(E(P))=U(P)；只关心期望值、不在意风险，确定性等价水平等于前景的期望（图1-4）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">风险中性</strong>（risk neutral）：u(E(P))=U(P)；只关心期望值、不在意风险，确定性等价水平等于前景的期望（图1-4）。","label":"风险中性"}],"k":"sec","i":0,"h":"1.3 风险态度","label":"1.3 风险态度"},{"t":"1.4 阿莱悖论","c":[{"t":"并入要点：要点6。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">并入要点</strong>：要点6。","label":"并入要点"},{"t":"地位：阿莱悖论（Allais paradox）是被反复记录的、违背期望效用理论的现象（Allais, 1953；本书呈现遵循 Conlisk, 1989）；正是它与类似发现促成了不确定性条件下的其他决策方法——最知名的是卡内曼与特沃斯基的前景理论（第3章核心）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">地位</strong>：阿莱悖论（Allais paradox）是被反复记录的、违背期望效用理论的现象（Allais, 1953；本书呈现遵循 Conlisk, 1989）；正是它与类似发现促成了不确定性条件下的其他决策方法——最知名的是卡内曼与特沃斯基的前景理论（第3章核心）。","label":"地位：阿莱悖论（Allais par…"},{"t":"实验设置（表1-2）：问题 1 在前景 A（100% 得 100 万美元）与 A*（89% 得 100 万、1% 得 0、10% 得 500 万）间选；问题 2 在前景 B（89% 得 0、11% 得 100 万）与 B*（10% 得 500 万、其余一无所获）间选。许多人的选择是 A 与 B*。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">实验设置</strong>（表1-2）：问题 1 在前景 A（100% 得 100 万美元）与 A*（89% 得 100 万、1% 得 0、10% 得 500 万）间选；问题 2 在前景 B（89% 得 0、11% 得 100 万）与 B*（10% 得 500 万、其余一无所获）间选。许多人的选择是 A 与 B*。","label":"实验设置"},{"t":"矛盾推导（取 u(0)=0）：选 A 而非 A*：u(100 万)>0.89u(100 万)+0.10u(500 万)，化简得 0.11u(100 万)>0.10u(500 万)；选 B* 而非 B：0.10u(500 万)>0.11u(100 万)。两式显然不可能同时成立——\"A 与 B*\"这组选择自相矛盾。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">矛盾推导</strong>（取 u(0)=0）：选 A 而非 A*：u(100 万)&gt;0.89u(100 万)+0.10u(500 万)，化简得 0.11u(100 万)&gt;0.10u(500 万)；选 B* 而非 B：0.10u(500 万)&gt;0.11u(100 万)。两式显然不可能同时成立——&quot;A 与 B*&quot;这组选择自相矛盾。","label":"矛盾推导"},{"t":"康利斯克的变体（表1-3）：把问题改写为\"问题 1 的两个前景都有 89% 的概率得 100 万、问题 2 的两个前景都有 89% 的概率一文不名\"——剔除共同项后，问题 1 与问题 2 是完全相同的两个选择，受访者只能选\"A 和 B\"或\"A* 和 B*\"；写明共同结构后，与期望效用理论的偏离大幅减小——许多人的矛盾选择源于没看透决策架构，而非偏好本身非理性。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">康利斯克的变体</strong>（表1-3）：把问题改写为&quot;问题 1 的两个前景都有 89% 的概率得 100 万、问题 2 的两个前景都有 89% 的概率一文不名&quot;——剔除共同项后，问题 1 与问题 2 是完全相同的两个选择，受访者只能选&quot;A 和 B&quot;或&quot;A* 和 B*&quot;；写明共同结构后，与期望效用理论的偏离大幅减小——许多人的矛盾选择源于没看透决策架构，而非偏好本身非理性。","label":"康利斯克的变体"},{"t":"违反的公理：阿莱悖论可证明违反\"背景独立性\"公理（附录1A 公理 5）；文献中还记录了无法对结果一致性排序、偏好不满足传递性等违反期望效用理论前提公理的情况。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">违反的公理</strong>：阿莱悖论可证明违反&quot;背景独立性&quot;公理（附录1A 公理 5）；文献中还记录了无法对结果一致性排序、偏好不满足传递性等违反期望效用理论前提公理的情况。","label":"违反的公理"},{"t":"独立性的直观（丰田/宝马/电视机彩票）：若你认为\"奖品为丰田的彩票\"与\"奖品为宝马的彩票\"无差异，那么两种车彩票各加上一张\"奖品为电视机的彩票\"后的两种组合也应无差异——共同部分不应改变偏好。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">独立性的直观</strong>（丰田/宝马/电视机彩票）：若你认为&quot;奖品为丰田的彩票&quot;与&quot;奖品为宝马的彩票&quot;无差异，那么两种车彩票各加上一张&quot;奖品为电视机的彩票&quot;后的两种组合也应无差异——共同部分不应改变偏好。","label":"独立性的直观"}],"k":"sec","i":0,"h":"1.4 阿莱悖论","label":"1.4 阿莱悖论"},{"t":"1.5 框架","c":[{"t":"并入要点：要点7。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">并入要点</strong>：要点7。","label":"并入要点"},{"t":"定义：框架（frame）指决策者对于问题和可能结果的看法；问题提出的形式、决策者对问题的看法以及决策者的个性都会影响框架。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">定义</strong>：框架（frame）指决策者对于问题和可能结果的看法；问题提出的形式、决策者对问题的看法以及决策者的个性都会影响框架。","label":"定义：框架（frame）指决策者对于…"},{"t":"直观例：半空的杯子还是半满的杯子——这类框架区别人人可见；但更多框架隐晦、较难看透。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">直观例</strong>：半空的杯子还是半满的杯子——这类框架区别人人可见；但更多框架隐晦、较难看透。","label":"直观例：半空的杯子还是半满的杯子——…"},{"t":"与理论的冲突：向某人提出决策问题时，框架的变化会引起决策的变化（如表1-2 到表1-3 的选择变化），而期望效用理论假设不论问题形式如何变化，人的选择都应一致——故框架效应违反期望效用理论。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">与理论的冲突</strong>：向某人提出决策问题时，框架的变化会引起决策的变化（如表1-2 到表1-3 的选择变化），而期望效用理论假设不论问题形式如何变化，人的选择都应一致——故框架效应违反期望效用理论。","label":"与理论的冲突"},{"t":"意义：心理学家与经济学家已证明框架对决策（包括金融类决策）有巨大影响；框架是行为金融学很多领域的重要概念，第3章及本书其他章节继续探讨。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">意义</strong>：心理学家与经济学家已证明框架对决策（包括金融类决策）有巨大影响；框架是行为金融学很多领域的重要概念，第3章及本书其他章节继续探讨。","label":"意义：心理学家与经济学家已证明框架对…"}],"k":"sec","i":0,"h":"1.5 框架","label":"1.5 框架"},{"t":"1.6 展望","c":[{"t":"前景理论（prospect theory）：期望效用最大化理论的主要替代理论，由卡内曼与特沃斯基提出、尤其受行为学家拥护，是第3章核心内容；但很多金融学理论仍以期望效用理论为基础——尽管有行为与之相悖，该理论对个人决策的建模仍然十分有用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">前景理论</strong>（prospect theory）：期望效用最大化理论的主要替代理论，由卡内曼与特沃斯基提出、尤其受行为学家拥护，是第3章核心内容；但很多金融学理论仍以期望效用理论为基础——尽管有行为与之相悖，该理论对个人决策的建模仍然十分有用。","label":"前景理论"},{"t":"引出第2章：资产的价值观（价格）由市场决定；若用期望效用理论分析金融资产，需枚举每个状态下所有资产的回报，过于困难——第2章介绍以均值和方差作为选择变量的传统金融学框架。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">引出第2章</strong>：资产的价值观（价格）由市场决定；若用期望效用理论分析金融资产，需枚举每个状态下所有资产的回报，过于困难——第2章介绍以均值和方差作为选择变量的传统金融学框架。","label":"引出第2章"}],"k":"sec","i":0,"h":"1.6 展望","label":"1.6 展望"},{"t":"附录1A 期望效用理论详述","c":[{"t":"关键定义：最低/最高财富水平（WL/WH，对世上所有财富状态排序的最差/最佳状态）；标准前景（standard prospect）P*(u, WH, WL) 仅含 WH 与 WL 两个结果（u 替代惯用的 p1，后文视作\"效用\"）；等价标准前景（equivalent standard prospect）：与某一 WL<w*<WH 无差异的标准前景；复合前景（compound prospect）：至少有 1 个结果以前景形式表示（如 Pc(p1, P1, P2)）；理性等价前景（rational equivalent prospect, PRE）：复合前景的另一种表述，所有结果均以财富而非前景表示；标准复合前景（standard compound prospect）：结果均以标准前景形式表示的复合前景；标准理性等价前景：与标准复合前景有关的理性等价前景（财富水平只含 WH 与 WL，故本身是标准前景）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">关键定义</strong>：最低/最高财富水平（WL/WH，对世上所有财富状态排序的最差/最佳状态）；标准前景（standard prospect）P*(u, WH, WL) 仅含 WH 与 WL 两个结果（u 替代惯用的 p1，后文视作&quot;效用&quot;）；等价标准前景（equivalent standard prospect）：与某一 WL&lt;w*&lt;WH 无差异的标准前景；复合前景（compound prospect）：至少有 1 个结果以前景形式表示（如 Pc(p1, P1, P2)）；理性等价前景（rational equivalent prospect, PRE）：复合前景的另一种表述，所有结果均以财富而非前景表示；标准复合前景（standard compound prospect）：结果均以标准前景形式表示的复合前景；标准理性等价前景：与标准复合前景有关的理性等价前景（财富水平只含 WH 与 WL，故本身是标准前景）。","label":"关键定义"},{"t":"核心量：U=p1×u1+(1−p1)×u2（1A-1）——可证 U 为标准理性等价前景中 WH 的概率；期望效用（expected utility）就是 U 的另一名称（把 u1、u2 称作\"效用\"后，U 即这些效用水平的期望值）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">核心量</strong>：U=p1×u1+(1−p1)×u2（1A-1）——可证 U 为标准理性等价前景中 WH 的概率；期望效用（expected utility）就是 U 的另一名称（把 u1、u2 称作&quot;效用&quot;后，U 即这些效用水平的期望值）。","label":"核心量：U=p1×u1+(1−p1)…"},{"t":"五条公理：公理 1 前景排序（ordering of prospects）——任取两前景，决策者总偏爱其一或认为无差异，且偏好满足完备性与一致性（传递性）；公理 2 偏好程度随概率递增（preference increasing with probability）——P1*≻P2* ⇔ u1>u2，P1*∼P2* ⇔ u1=u2；公理 3 等价标准期望（equivalent standard prospects）——在 WL 与 WH 之间任取收入水平 w，有且仅有一个 u* 满足 w*∼P*(u*, WH, WL)，由此定义效用函数 u(w)：下界 0、上界 1，u(WL)=0、u(WH)=1；公理 4 理性等价物（rational equivalence）——标准复合前景 Psc 与其标准理性等价物 P* 无差异；公理 5 背景独立性（context independence）——前景 P 总能由标准复合前景 Psc 表示，且 P 中的财富水平可由其等价标准前景替代。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">五条公理</strong>：公理 1 前景排序（ordering of prospects）——任取两前景，决策者总偏爱其一或认为无差异，且偏好满足完备性与一致性（传递性）；公理 2 偏好程度随概率递增（preference increasing with probability）——P1*≻P2* ⇔ u1&gt;u2，P1*∼P2* ⇔ u1=u2；公理 3 等价标准期望（equivalent standard prospects）——在 WL 与 WH 之间任取收入水平 w，有且仅有一个 u* 满足 w*∼P*(u*, WH, WL)，由此定义效用函数 u(w)：下界 0、上界 1，u(WL)=0、u(WH)=1；公理 4 理性等价物（rational equivalence）——标准复合前景 Psc 与其标准理性等价物 P* 无差异；公理 5 背景独立性（context independence）——前景 P 总能由标准复合前景 Psc 表示，且 P 中的财富水平可由其等价标准前景替代。","label":"五条公理"},{"t":"证明思路：任一前景 P∼Psc（公理 5）∼P*（公理 4）——所有前景都能由标准前景表示，并由公理 2 按 U（期望效用）大小排序；u(w) 是递增函数（财富越高，标准前景中 WH 的概率越高，效用越大）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">证明思路</strong>：任一前景 P∼Psc（公理 5）∼P*（公理 4）——所有前景都能由标准前景表示，并由公理 2 按 U（期望效用）大小排序；u(w) 是递增函数（财富越高，标准前景中 WH 的概率越高，效用越大）。","label":"证明思路"},{"t":"效用函数的常用设定：u 二次可微（连续）且 u″<0（凹）——因为观察到大多数人在大多数时候规避风险（前景的确定性等价物少于前景的期望财富）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">效用函数的常用设定</strong>：u 二次可微（连续）且 u″&lt;0（凹）——因为观察到大多数人在大多数时候规避风险（前景的确定性等价物少于前景的期望财富）。","label":"效用函数的常用设定"},{"t":"基数性与唯一性：确定性条件下的效用函数是纯序数的（如无差异曲线族，只关心越上方效用越大，函数值不重要）；风险条件下期望效用是基数，且给定 WH 与 WL 时唯一；改变 WH 与 WL 会得到不同的（基数）效用函数，但对同一个人而言，所有效用函数都有唯一的正线性变换。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">基数性与唯一性</strong>：确定性条件下的效用函数是纯序数的（如无差异曲线族，只关心越上方效用越大，函数值不重要）；风险条件下期望效用是基数，且给定 WH 与 WL 时唯一；改变 WH 与 WL 会得到不同的（基数）效用函数，但对同一个人而言，所有效用函数都有唯一的正线性变换。","label":"基数性与唯一性"}],"k":"sec","i":0,"h":"附录1A 期望效用理论详述","label":"附录1A 期望效用理论详述"}],"k":"chap","h":"<strong class=\"lead\">第1章 金融学基础Ⅰ</strong>：期望效用理论","label":"第1章 金融学基础Ⅰ"},{"t":"第2章 金融学基础Ⅱ：资产定价、市场有效性和机构关系","c":[{"t":"本章要点","c":[{"t":"本章主线：风险定价（2.1：均值—方差→多元化→有效前沿→CML→CAPM）→ 市场有效性（2.2：EMH 定义、三形态、含义、联合假设问题）→ 机构关系（2.3：代理理论）→ 从理性到心理（2.4：引出行为金融学）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章主线</strong>：风险定价（2.1：均值—方差→多元化→有效前沿→CML→CAPM）→ 市场有效性（2.2：EMH 定义、三形态、含义、联合假设问题）→ 机构关系（2.3：代理理论）→ 从理性到心理（2.4：引出行为金融学）。","label":"本章主线"},{"t":"要点1：投资者认识到，他们需要在收益和风险间作出权衡。期望收益率和风险通常表示为历史平均收益率和收益率方差（或标准差）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点1</strong>：投资者认识到，他们需要在收益和风险间作出权衡。期望收益率和风险通常表示为历史平均收益率和收益率方差（或标准差）。","label":"要点1：投资者认识到，他们需要在收益…"},{"t":"要点2：协方差和相关系数在统计学中表示随机变量的相关程度。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点2</strong>：协方差和相关系数在统计学中表示随机变量的相关程度。","label":"要点2：协方差和相关系数在统计学中表…"},{"t":"要点3：有效前沿代表在给定风险水平下，使期望收益率达到最大的那些资产组合。理性的投资者不会选择该曲线以下的投资组合，因为还存在风险相同但收益率更高的投资组合。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点3</strong>：有效前沿代表在给定风险水平下，使期望收益率达到最大的那些资产组合。理性的投资者不会选择该曲线以下的投资组合，因为还存在风险相同但收益率更高的投资组合。","label":"要点3：有效前沿代表在给定风险水平下…"},{"t":"要点4：投资组合中的公司特有风险可以通过多元化消除。然而，系统的、市场的风险是不能被消除的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点4</strong>：投资组合中的公司特有风险可以通过多元化消除。然而，系统的、市场的风险是不能被消除的。","label":"要点4：投资组合中的公司特有风险可以…"},{"t":"要点5：资本市场线代表了无风险资产和市场投资组合的各种结合方式。理性投资者若想以最低风险获得最高回报，应当选择该线上的投资组合。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点5</strong>：资本市场线代表了无风险资产和市场投资组合的各种结合方式。理性投资者若想以最低风险获得最高回报，应当选择该线上的投资组合。","label":"要点5：资本市场线代表了无风险资产和…"},{"t":"要点6：根据资本资产定价模型，投资者若承担可分散风险，是不会得到补偿的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点6</strong>：根据资本资产定价模型，投资者若承担可分散风险，是不会得到补偿的。","label":"要点6：根据资本资产定价模型，投资者…"},{"t":"要点7：贝塔系数度量了市场变动带来的风险。一项资产的贝塔系数可用其期望收益率进行估计。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点7</strong>：贝塔系数度量了市场变动带来的风险。一项资产的贝塔系数可用其期望收益率进行估计。","label":"要点7：贝塔系数度量了市场变动带来的…"},{"t":"要点8：市场的有效性之所以重要，是因为它决定了资本在公司之间的分配。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点8</strong>：市场的有效性之所以重要，是因为它决定了资本在公司之间的分配。","label":"要点8：市场的有效性之所以重要，是因…"},{"t":"要点9：在有效市场中，投资者不可能持续获得超额收益。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点9</strong>：在有效市场中，投资者不可能持续获得超额收益。","label":"要点9：在有效市场中，投资者不可能持…"},{"t":"要点10：一旦代理人和委托人的利益不一致，就可能出现代理问题。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点10</strong>：一旦代理人和委托人的利益不一致，就可能出现代理问题。","label":"要点10"},{"t":"要点11：大公司所有者和管理层之间的利益冲突有可能（对公司）造成损失。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点11</strong>：大公司所有者和管理层之间的利益冲突有可能（对公司）造成损失。","label":"要点11"},{"t":"要点12：最优补偿合同使股东和管理层的利益一致。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要点12</strong>：最优补偿合同使股东和管理层的利益一致。","label":"要点12"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"2.1 风险定价","c":[{"t":"并入要点：要点1～要点7。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">并入要点</strong>：要点1～要点7。","label":"并入要点"},{"t":"背景：期望效用理论要求枚举每个状态下所有资产的回报，在资产未来收益的可能结果数不胜数时难以操作；资产定价理论提供了量化风险与报酬之间权衡关系的方法。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">背景</strong>：期望效用理论要求枚举每个状态下所有资产的回报，在资产未来收益的可能结果数不胜数时难以操作；资产定价理论提供了量化风险与报酬之间权衡关系的方法。","label":"背景：期望效用理论要求枚举每个状态下…"},{"t":"2.1.1 单项资产的风险和收益","c":[{"t":"现代资产组合理论（modern portfolio theory）：提供实用框架，假设投资者厌恶风险，其偏好以收益率的均值和方差形式表示；基础是统计学，基于实证研究、变量可度量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现代资产组合理论</strong>（modern portfolio theory）：提供实用框架，假设投资者厌恶风险，其偏好以收益率的均值和方差形式表示；基础是统计学，基于实证研究、变量可度量。","label":"现代资产组合理论"},{"t":"收益率是随机变量：下一期收益率不能被精确预测，但服从一定的概率分布；期望值（expected value）E(Ri) 是该分布的参数（分布均值，多次抽样所得观测值的平均趋向期望值）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">收益率是随机变量</strong>：下一期收益率不能被精确预测，但服从一定的概率分布；期望值（expected value）E(Ri) 是该分布的参数（分布均值，多次抽样所得观测值的平均趋向期望值）。","label":"收益率是随机变量"},{"t":"风险度量：方差（variance）σ²——收益率相对均值的偏离的平方（均值左右两侧偏差结果相同）；标准差（standard deviation）σ——方差的正平方根；两者对证券风险排序的结果相同（要点1）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">风险度量</strong>：方差（variance）σ²——收益率相对均值的偏离的平方（均值左右两侧偏差结果相同）；标准差（standard deviation）σ——方差的正平方根；两者对证券风险排序的结果相同（要点1）。","label":"风险度量"},{"t":"样本估计（n 个观测）：平均收益率 R̄=(1/n)Σ Ri,t（2-1），是收益率真实分布期望值的最优估计；样本方差 s²=[1/(n−1)]Σ(Ri,t−R̄)²（2-2）；样本标准差 s=√(s²)（2-3）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">样本估计</strong>（n 个观测）：平均收益率 R̄=(1/n)Σ Ri,t（2-1），是收益率真实分布期望值的最优估计；样本方差 s²=[1/(n−1)]Σ(Ri,t−R̄)²（2-2）；样本标准差 s=√(s²)（2-3）。","label":"样本估计"}],"k":"b","i":1,"h":"2.1.1 单项资产的风险和收益","label":"2.1.1 单项资产的风险和收益"},{"t":"2.1.2 资产组合的风险和收益","c":[{"t":"多元化原则（diversification）：\"别把所有的鸡蛋放在一个篮子里\"；通过组合可消除一部分（而非全部）变数——投资组合的风险不是组合中所有资产风险的平均值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">多元化原则</strong>（diversification）：&quot;别把所有的鸡蛋放在一个篮子里&quot;；通过组合可消除一部分（而非全部）变数——投资组合的风险不是组合中所有资产风险的平均值。","label":"多元化原则"},{"t":"联动度量：协方差（covariance）σ(Ri,Rj) 与相关系数（correlation）ρij——一个变量超过（低于）自身均值而另一个也是如此，则为正；变动方向相反则为负；相关系数取值总在 −1.0～+1.0，协方差可取任何正值或负值（要点2）。样本协方差=[1/(n−1)]Σ(Ri,t−R̄i)(Rj,t−R̄j)（2-4）；样本相关系数=样本协方差/(si·sj)（2-5）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">联动度量</strong>：协方差（covariance）σ(Ri,Rj) 与相关系数（correlation）ρij——一个变量超过（低于）自身均值而另一个也是如此，则为正；变动方向相反则为负；相关系数取值总在 −1.0～+1.0，协方差可取任何正值或负值（要点2）。样本协方差=[1/(n−1)]Σ(Ri,t−R̄i)(Rj,t−R̄j)（2-4）；样本相关系数=样本协方差/(si·sj)（2-5）。","label":"联动度量"},{"t":"两资产组合：平均收益率 Rp=wiRi+wjRj（2-6），权重 wi、wj 之和必须为 1.0（钱总要投在某项资产上）；组合样本方差 s²_p=w²_i·s²_i+w²_j·s²_j+2wiwj·ρij·si·sj（2-7）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两资产组合</strong>：平均收益率 Rp=wiRi+wjRj（2-6），权重 wi、wj 之和必须为 1.0（钱总要投在某项资产上）；组合样本方差 s²_p=w²_i·s²_i+w²_j·s²_j+2wiwj·ρij·si·sj（2-7）。","label":"两资产组合"},{"t":"关键结论：若相关系数低于 1.0，则投资组合收益率的标准差低于每项资产收益率标准差的加权平均；组合内资产增多，公式相应变长（2-8、2-9），新增变数在多样化中被消除。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键结论</strong>：若相关系数低于 1.0，则投资组合收益率的标准差低于每项资产收益率标准差的加权平均；组合内资产增多，公式相应变长（2-8、2-9），新增变数在多样化中被消除。","label":"关键结论"}],"k":"b","i":1,"h":"2.1.2 资产组合的风险和收益","label":"2.1.2 资产组合的风险和收益"},{"t":"2.1.3 最优资产组合","c":[{"t":"口径切换：挑选最优组合需用未来收益率的真实分布参数 E(Rp)、σp，历史样本估计量只是真实分布参数的估计值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">口径切换</strong>：挑选最优组合需用未来收益率的真实分布参数 E(Rp)、σp，历史样本估计量只是真实分布参数的估计值。","label":"口径切换"},{"t":"示例设定（表2-1）：高科技股 HT（E=15%，σ=30%）、低科技股 LT（E=8%，σ=10%）、无风险资产 RF（收益率 4%，σ=0）；ρ(HT,LT)=−0.10；无风险资产的收益率确定、与其他资产相关系数为 0（常数与随机变量按定义协方差、相关系数为零）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">示例设定</strong>（表2-1）：高科技股 HT（E=15%，σ=30%）、低科技股 LT（E=8%，σ=10%）、无风险资产 RF（收益率 4%，σ=0）；ρ(HT,LT)=−0.10；无风险资产的收益率确定、与其他资产相关系数为 0（常数与随机变量按定义协方差、相关系数为零）。","label":"示例设定"},{"t":"组合计算（40% HT＋60% LT）：E(Rp)=0.40×0.15+0.60×0.08=0.108（2-10）；σ²_p=0.40²×0.30²+0.60²×0.10²+2×0.40×0.60×(−0.10)×0.30×0.10=0.0166（2-11），σp=12.88%——小于每只股票标准差的加权平均值（0.40×0.30+0.60×0.10=18%），说明多元化已取得成效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组合计算</strong>（40% HT＋60% LT）：E(Rp)=0.40×0.15+0.60×0.08=0.108（2-10）；σ²_p=0.40²×0.30²+0.60²×0.10²+2×0.40×0.60×(−0.10)×0.30×0.10=0.0166（2-11），σp=12.88%——小于每只股票标准差的加权平均值（0.40×0.30+0.60×0.10=18%），说明多元化已取得成效。","label":"组合计算"},{"t":"有效前沿（efficient frontier，亦称有效集）：把所有单项投资两两及多元组合，得到\"子弹\"形有效集；最低风险点右上方部分即有效前沿——给定风险水平下期望收益率最大的投资组合集合（要点3）；曲线曲率由两只股票收益率间的相关系数决定：相关系数越低，曲率越大；理性投资者不会选取有效前沿下方的组合（存在风险相同但收益率更高的组合），所有理性投资者都选择有效前沿之上的组合。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有效前沿</strong>（efficient frontier，亦称有效集）：把所有单项投资两两及多元组合，得到&quot;子弹&quot;形有效集；最低风险点右上方部分即有效前沿——给定风险水平下期望收益率最大的投资组合集合（要点3）；曲线曲率由两只股票收益率间的相关系数决定：相关系数越低，曲率越大；理性投资者不会选取有效前沿下方的组合（存在风险相同但收益率更高的组合），所有理性投资者都选择有效前沿之上的组合。","label":"有效前沿"},{"t":"风险二分：可分散风险（diversifiable risk）/非系统风险（nonsystematic risk）——某项资产特有的风险（普通股票为公司特有事件造成），可通过多元化消除；系统风险（systematic risk）——存在于系统内所有风险资产中，不论在组合里添加多少股票都不能消除（要点4）。假设所有投资者具有相同期望，则他们具有相同的有效前沿。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">风险二分</strong>：可分散风险（diversifiable risk）/非系统风险（nonsystematic risk）——某项资产特有的风险（普通股票为公司特有事件造成），可通过多元化消除；系统风险（systematic risk）——存在于系统内所有风险资产中，不论在组合里添加多少股票都不能消除（要点4）。假设所有投资者具有相同期望，则他们具有相同的有效前沿。","label":"风险二分"},{"t":"加入无风险资产与两基金分离（two-fund separation）：无风险资产好比引入一个按无风险利率借入/借出资金的交易机制；具备借入借出能力后，投资者通过合并风险资产与无风险资产即可达到效用最大化——此类组合的收益率和风险都是单个资产收益率和风险的线性函数。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">加入无风险资产与两基金分离</strong>（two-fund separation）：无风险资产好比引入一个按无风险利率借入/借出资金的交易机制；具备借入借出能力后，投资者通过合并风险资产与无风险资产即可达到效用最大化——此类组合的收益率和风险都是单个资产收益率和风险的线性函数。","label":"加入无风险资产与两基金分离"},{"t":"切线组合与资本市场线：从 Rf 向有效前沿作切线，切点 M 是唯一的切线投资组合；M 最为多元化，即市场投资组合（market portfolio）——包含所有风险资产，资产的价值决定其在组合中的权重；连接 Rf 与 M 的直线即资本市场线（capital market line, CML），代表无风险资产和市场投资组合的所有结合方式，反映投资者每多承担一分风险能增加多少收益（要点5）；切点右方的点意味着借入资金、风险资产投资占比超过 100%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">切线组合与资本市场线</strong>：从 Rf 向有效前沿作切线，切点 M 是唯一的切线投资组合；M 最为多元化，即市场投资组合（market portfolio）——包含所有风险资产，资产的价值决定其在组合中的权重；连接 Rf 与 M 的直线即资本市场线（capital market line, CML），代表无风险资产和市场投资组合的所有结合方式，反映投资者每多承担一分风险能增加多少收益（要点5）；切点右方的点意味着借入资金、风险资产投资占比超过 100%。","label":"切线组合与资本市场线"},{"t":"（脚注补充：两风险资产最小方差组合可由组合方差对权重求导得到——本例为 HT 12.26%、LT 87.74%，期望收益 8.86%、标准差 9.17%。）","c":[],"k":"b","i":2,"h":"（脚注补充：两风险资产最小方差组合可由组合方差对权重求导得到——本例为 HT 12.26%、LT 87.74%，期望收益 8.86%、标准差 9.17%。）","label":"（脚注补充：两风险资产最小方差组合可…"}],"k":"b","i":1,"h":"2.1.3 最优资产组合","label":"2.1.3 最优资产组合"},{"t":"2.1.4 资本资产定价模型","c":[{"t":"CAPM（capital asset pricing model，又称 Sharpe-Lintner-Black 模型）：在前述设定下（投资者观念一致→有效前沿相同→持有相同的风险组合，只能是市场组合），理性投资者同时持有市场投资组合和无风险资产；承担与市场变动无关的可分散风险，并不能得到补偿（要点6）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">CAPM</strong>（capital asset pricing model，又称 Sharpe-Lintner-Black 模型）：在前述设定下（投资者观念一致→有效前沿相同→持有相同的风险组合，只能是市场组合），理性投资者同时持有市场投资组合和无风险资产；承担与市场变动无关的可分散风险，并不能得到补偿（要点6）。","label":"CAPM"},{"t":"为什么不用方差/标准差定价：它们度量整体风险，混入了可分散的公司特有风险；CAPM 只给与市场变动相关的风险定价。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">为什么不用方差/标准差定价</strong>：它们度量整体风险，混入了可分散的公司特有风险；CAPM 只给与市场变动相关的风险定价。","label":"为什么不用方差/标准差定价"},{"t":"贝塔系数（beta, β）：βi=σ(Ri,Rm)/σ²_m（2-13）——第 i 只股票收益率与市场收益率的协方差除以市场收益率的方差；只反映系统性、不可分散的风险；市场的贝塔为 1（市场的变化就是其本身的变化）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贝塔系数</strong>（beta, β）：βi=σ(Ri,Rm)/σ²_m（2-13）——第 i 只股票收益率与市场收益率的协方差除以市场收益率的方差；只反映系统性、不可分散的风险；市场的贝塔为 1（市场的变化就是其本身的变化）。","label":"贝塔系数"},{"t":"定价公式：E(Ri)=Rf+βi(E(Rm)−Rf)（2-12）；市场风险溢价（market risk premium）/股权溢价（equity premium）=E(Rm)−Rf；贝塔系数为正，则该资产收益率与风险溢价同向变化（图2-4 证券市场线）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定价公式</strong>：E(Ri)=Rf+βi(E(Rm)−Rf)（2-12）；市场风险溢价（market risk premium）/股权溢价（equity premium）=E(Rm)−Rf；贝塔系数为正，则该资产收益率与风险溢价同向变化（图2-4 证券市场线）。","label":"定价公式"}],"k":"b","i":1,"h":"2.1.4 资本资产定价模型","label":"2.1.4 资本资产定价模型"},{"t":"2.1.5 CAPM 的运用","c":[{"t":"数据设定（美国示例）：市场收益率用综合性股票指数衡量（如纽约证券交易所 NYSE 综合指数），无风险收益率用短期美国国库券利率；表2-2 为 2002 年 1 月—2006 年 12 月五年数据，样本股票贝塔系数取自《财富线投资调查》。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数据设定</strong>（美国示例）：市场收益率用综合性股票指数衡量（如纽约证券交易所 NYSE 综合指数），无风险收益率用短期美国国库券利率；表2-2 为 2002 年 1 月—2006 年 12 月五年数据，样本股票贝塔系数取自《财富线投资调查》。","label":"数据设定"},{"t":"例外案例：CytRx 公司（制药）贝塔仅 0.55、平均收益率却最高（35.58%）；捷迪讯光电（电子）贝塔高达 1.45、平均收益率却为 −24.71%——与 CAPM 预测相悖，但考虑随机性（CAPM 仅仅是预测）与小样本规模，并不特别出人意料，也不足以证明模型有问题。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例外案例</strong>：CytRx 公司（制药）贝塔仅 0.55、平均收益率却最高（35.58%）；捷迪讯光电（电子）贝塔高达 1.45、平均收益率却为 −24.71%——与 CAPM 预测相悖，但考虑随机性（CAPM 仅仅是预测）与小样本规模，并不特别出人意料，也不足以证明模型有问题。","label":"例外案例"},{"t":"总体评价：初步测试说明模型是成功的——期望收益率与贝塔系数正相关，贝塔能较好解释公司间收益率差异；但研究者已发现单用贝塔并不能令人满意地解释收益率，市场超额收益率之外的其他因素也能帮助解释不同股票期望收益率的差异（法玛—弗伦奇等，后续章节关联行为定价）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总体评价</strong>：初步测试说明模型是成功的——期望收益率与贝塔系数正相关，贝塔能较好解释公司间收益率差异；但研究者已发现单用贝塔并不能令人满意地解释收益率，市场超额收益率之外的其他因素也能帮助解释不同股票期望收益率的差异（法玛—弗伦奇等，后续章节关联行为定价）。","label":"总体评价"},{"t":"假设质疑：主要质疑之一是\"投资者对资产回报的期望相同\"（同质预期）——引出 2.2 的有效市场假说及其对投资行为的预测。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">假设质疑</strong>：主要质疑之一是&quot;投资者对资产回报的期望相同&quot;（同质预期）——引出 2.2 的有效市场假说及其对投资行为的预测。","label":"假设质疑"}],"k":"b","i":1,"h":"2.1.5 CAPM 的运用","label":"2.1.5 CAPM 的运用"}],"k":"sec","i":0,"h":"2.1 风险定价","label":"2.1 风险定价"},{"t":"2.2 市场有效性","c":[{"t":"并入要点：要点8、要点9。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">并入要点</strong>：要点8、要点9。","label":"并入要点"},{"t":"背景命题：有效且正常运作的资本市场使资源最优分配——经由市场把资金从存款人转移到有高报酬且与风险挂钩投资机会的借款人手中，双方获益；\"错误\"也会发生并被记录（20 世纪 90 年代后期的互联网泡沫、次贷金融危机）（要点8）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">背景命题</strong>：有效且正常运作的资本市场使资源最优分配——经由市场把资金从存款人转移到有高报酬且与风险挂钩投资机会的借款人手中，双方获益；&quot;错误&quot;也会发生并被记录（20 世纪 90 年代后期的互联网泡沫、次贷金融危机）（要点8）。","label":"背景命题"},{"t":"2.2.1 有效性和信息","c":[{"t":"法玛（Fama, 1970）定义：若证券价格总是\"充分反映\"一切可获得的信息，则这个市场就是\"有效\"的；价格为资源分配提供准确信号——公司据此做生产—投资决策，投资者据此选择证券，推动资本最优分配。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">法玛</strong>（Fama, 1970）定义：若证券价格总是&quot;充分反映&quot;一切可获得的信息，则这个市场就是&quot;有效&quot;的；价格为资源分配提供准确信号——公司据此做生产—投资决策，投资者据此选择证券，推动资本最优分配。","label":"法玛（Fama, 1970）定义：若…"},{"t":"三种形态：弱式（weak form）——价格反映历史收益中的所有信息；半强式（semi-strong form）——价格反映所有公开、有效的信息（过去收益与对未来收益的预测、财务报表全部内容、商业报道相关内容及其他任何相关信息）；强式（strong form）——价格甚至反映非公开信息（如内部消息）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三种形态</strong>：弱式（weak form）——价格反映历史收益中的所有信息；半强式（semi-strong form）——价格反映所有公开、有效的信息（过去收益与对未来收益的预测、财务报表全部内容、商业报道相关内容及其他任何相关信息）；强式（strong form）——价格甚至反映非公开信息（如内部消息）。","label":"三种形态"},{"t":"更准确的定义：信息的获取和生成不可能不花费成本，故 EMH 应理解为——价格反映所有信息，且从这些信息中得到的边际收益不超过获取信息的边际成本；即没有投资者能够永远获得超额收益（excess return，亦称 abnormal return）（要点9）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">更准确的定义</strong>：信息的获取和生成不可能不花费成本，故 EMH 应理解为——价格反映所有信息，且从这些信息中得到的边际收益不超过获取信息的边际成本；即没有投资者能够永远获得超额收益（excess return，亦称 abnormal return）（要点9）。","label":"更准确的定义"},{"t":"\"超额\"的完整含义：已考虑全部成本（交易成本＋获取信息的费用＋分析或雇人分析的费用），并需做风险调整。示例：某共同基金总体利润高于市场 1.5%，但管理费率（MER）为 1.5% → 投资者收益率与市场收益率相同，这与 EMH 并不矛盾。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">&quot;超额&quot;的完整含义</strong>：已考虑全部成本（交易成本＋获取信息的费用＋分析或雇人分析的费用），并需做风险调整。示例：某共同基金总体利润高于市场 1.5%，但管理费率（MER）为 1.5% → 投资者收益率与市场收益率相同，这与 EMH 并不矛盾。","label":"\"超额\"的完整含义"}],"k":"b","i":1,"h":"2.2.1 有效性和信息","label":"2.2.1 有效性和信息"},{"t":"2.2.2 市场有效性意味着什么","c":[{"t":"价格=预期基本价值：有效市场中资产价格等于其预期基本价值；股价现值模型（present value model of stock prices）pt=Σ(i=1→∞) Et(d(t+i))/(1+δ)^i（2-14）——pt 为 t 时刻股价，Et(d(t+i)) 为基于当前信息对 t+i 期红利的预期，δ 为反映股票风险的折现率；本书后面反对 EMH 的证据多属违背该关系的情形。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">价格=预期基本价值</strong>：有效市场中资产价格等于其预期基本价值；股价现值模型（present value model of stock prices）pt=Σ(i=1→∞) Et(d(t+i))/(1+δ)^i（2-14）——pt 为 t 时刻股价，Et(d(t+i)) 为基于当前信息对 t+i 期红利的预期，δ 为反映股票风险的折现率；本书后面反对 EMH 的证据多属违背该关系的情形。","label":"价格=预期基本价值"},{"t":"信息与随机游走：金融学的\"信息\"=完全没有预料到的消息（如失业率升到 6% 但已被大多数人预料到，就不算信息）；信息按定义不可预测 ⇒ 仅受信息影响的股价变化也一定不可预测——\"股价服从随机游走（random walk）\"的由来（严格说是\"带漂移\"的随机游走：因时间价值与风险，长期预期收益为正）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信息与随机游走</strong>：金融学的&quot;信息&quot;=完全没有预料到的消息（如失业率升到 6% 但已被大多数人预料到，就不算信息）；信息按定义不可预测 ⇒ 仅受信息影响的股价变化也一定不可预测——&quot;股价服从随机游走（random walk）&quot;的由来（严格说是&quot;带漂移&quot;的随机游走：因时间价值与风险，长期预期收益为正）。","label":"信息与随机游走"},{"t":"投资含义：EMH 拥护者认为，用历史数据做技术分析、用公开财务信息做基础分析都不能成功获取超额收益 → 提倡被动投资策略（目标是追踪而非跑赢市场）：避免持有单只股票，投资指数共同基金或交易所交易指数基金（ETF），如标准普尔存托凭证（SPDR，\"蜘蛛\"）、欧澳远东指数基金（EAFE，最大的国际股票标杆）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">投资含义</strong>：EMH 拥护者认为，用历史数据做技术分析、用公开财务信息做基础分析都不能成功获取超额收益 → 提倡被动投资策略（目标是追踪而非跑赢市场）：避免持有单只股票，投资指数共同基金或交易所交易指数基金（ETF），如标准普尔存托凭证（SPDR，&quot;蜘蛛&quot;）、欧澳远东指数基金（EAFE，最大的国际股票标杆）。","label":"投资含义"}],"k":"b","i":1,"h":"2.2.2 市场有效性意味着什么","label":"2.2.2 市场有效性意味着什么"},{"t":"2.2.3 对市场有效性的一些误解","c":[{"t":"误解一：EMH 并没有指出投资于股票不明智，也没有说所有股票（或组合）的预期收益率应当相同——股票在有效市场中的价格仍是公平的，投资者风险态度不同可以有不同组合；经理不可能有计划地获得高于预期风险调整后收益率的回报。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">误解一</strong>：EMH 并没有指出投资于股票不明智，也没有说所有股票（或组合）的预期收益率应当相同——股票在有效市场中的价格仍是公平的，投资者风险态度不同可以有不同组合；经理不可能有计划地获得高于预期风险调整后收益率的回报。","label":"误解一：EMH 并没有指出投资于股票…"},{"t":"误解二：EMH 表明获得超额收益的机会无法预测，但不是说价格水平就是随机的——股价基于可获取的市场信息（含管理层行动、公司投融资决策）对公司做出合理估值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">误解二</strong>：EMH 表明获得超额收益的机会无法预测，但不是说价格水平就是随机的——股价基于可获取的市场信息（含管理层行动、公司投融资决策）对公司做出合理估值。","label":"误解二：EMH 表明获得超额收益的机…"}],"k":"b","i":1,"h":"2.2.3 对市场有效性的一些误解","label":"2.2.3 对市场有效性的一些误解"},{"t":"2.2.4 联合假设问题","c":[{"t":"超额收益判定式：以 CAPM 为收益率模型，第 i 只股票产生超额收益的条件为 Ri−(Rf+βi(Rm−Rf))>0（2-15）——实际收益率高于其风险（由 βi 表示）所要求的收益率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">超额收益判定式</strong>：以 CAPM 为收益率模型，第 i 只股票产生超额收益的条件为 Ri−(Rf+βi(Rm−Rf))&gt;0（2-15）——实际收益率高于其风险（由 βi 表示）所要求的收益率。","label":"超额收益判定式"},{"t":"联合假设问题（joint-hypothesis problem）：计算超额收益必须先选定一个风险调整模型，而我们并不知道哪个模型正确；若检验拒绝了 EMH，无法区分是 EMH 本身不成立，还是测算超额收益率时用错了方法（模型）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">联合假设问题</strong>（joint-hypothesis problem）：计算超额收益必须先选定一个风险调整模型，而我们并不知道哪个模型正确；若检验拒绝了 EMH，无法区分是 EMH 本身不成立，还是测算超额收益率时用错了方法（模型）。","label":"联合假设问题"},{"t":"证据走向：早期实证检验基本支持 EMH——机械化交易不能持续得到超额收益、价格随新信息迅速而合理地变化、资金经理人扣除全部费用（含交易与管理费）后不太可能获得正的超额收益；较近期的研究则反映了一系列持续出现、与 EMH 相悖的异常现象（anomalies）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证据走向</strong>：早期实证检验基本支持 EMH——机械化交易不能持续得到超额收益、价格随新信息迅速而合理地变化、资金经理人扣除全部费用（含交易与管理费）后不太可能获得正的超额收益；较近期的研究则反映了一系列持续出现、与 EMH 相悖的异常现象（anomalies）。","label":"证据走向"},{"t":"价值溢价（value premium）之辨：历史上投资于价值股（相对账面价值和利润而言价格被低估的股票）一直是必胜策略，似构成 EMH 反例；但若价值股风险更大、或其风险未被 CAPM 充分反映，则可能根本不存在异象、只是资产定价模型不准确——著名的法玛—弗伦奇三因素模型已包括价值风险因素（第 4、14 章再探）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">价值溢价</strong>（value premium）之辨：历史上投资于价值股（相对账面价值和利润而言价格被低估的股票）一直是必胜策略，似构成 EMH 反例；但若价值股风险更大、或其风险未被 CAPM 充分反映，则可能根本不存在异象、只是资产定价模型不准确——著名的法玛—弗伦奇三因素模型已包括价值风险因素（第 4、14 章再探）。","label":"价值溢价"}],"k":"b","i":1,"h":"2.2.4 联合假设问题","label":"2.2.4 联合假设问题"}],"k":"sec","i":0,"h":"2.2 市场有效性","label":"2.2 市场有效性"},{"t":"2.3 代理理论","c":[{"t":"并入要点：要点10、要点11、要点12。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">并入要点</strong>：要点10、要点11、要点12。","label":"并入要点"},{"t":"基本概念：一方（委托人，principal）与另一方（代理人，agent）订立契约即形成代理关系（agency relationship）——代理人可代委托人行事并代表其利益，委托人授权代理人做决定；两者利益不一致时出现代理问题（agency problem）（要点10）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">基本概念</strong>：一方（委托人，principal）与另一方（代理人，agent）订立契约即形成代理关系（agency relationship）——代理人可代委托人行事并代表其利益，委托人授权代理人做决定；两者利益不一致时出现代理问题（agency problem）（要点10）。","label":"基本概念"},{"t":"卖房示例：卖方（委托人）与房产中介（代理人）签按售价 5% 提成的合同以激励其尽快以最高价售出；有人出 30 万美元，若坚信房屋值 32 万并最终以 32 万售出，卖方收入增加 1.9 万美元（2 万减去多付的佣金），而中介佣金只增加 1 000 美元——新增佣金未必补偿额外努力，中介可能劝你 30 万就脱手：\"把花的每分力气都得到最高报酬\"的中介目标与卖方\"卖出最高价\"的目标错位——典型利益冲突。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">卖房示例</strong>：卖方（委托人）与房产中介（代理人）签按售价 5% 提成的合同以激励其尽快以最高价售出；有人出 30 万美元，若坚信房屋值 32 万并最终以 32 万售出，卖方收入增加 1.9 万美元（2 万减去多付的佣金），而中介佣金只增加 1 000 美元——新增佣金未必补偿额外努力，中介可能劝你 30 万就脱手：&quot;把花的每分力气都得到最高报酬&quot;的中介目标与卖方&quot;卖出最高价&quot;的目标错位——典型利益冲突。","label":"卖房示例"},{"t":"公司中的委托—代理：大公司所有权与管理权分离——股东（公司所有者）选出董事会，董事会任命管理层；委托人—代理人问题主要出现在公司管理层与股东之间（要点11）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">公司中的委托—代理</strong>：大公司所有权与管理权分离——股东（公司所有者）选出董事会，董事会任命管理层；委托人—代理人问题主要出现在公司管理层与股东之间（要点11）。","label":"公司中的委托—代理"},{"t":"代理成本（agency costs）：直接成本——对管理层有益却对公司无益的开销（如购买用于旅行的豪华喷气式飞机），以及监督管理层的成本（如从外部雇人审计）；间接成本——因失去机遇产生、较难计算（如管理层担心失业而坚决反对有利于股东的收购）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">代理成本</strong>（agency costs）：直接成本——对管理层有益却对公司无益的开销（如购买用于旅行的豪华喷气式飞机），以及监督管理层的成本（如从外部雇人审计）；间接成本——因失去机遇产生、较难计算（如管理层担心失业而坚决反对有利于股东的收购）。","label":"代理成本"},{"t":"规模难题（可口可乐例）：2008 年可口可乐市值超过 1 000 亿美元、股东超过 30 万名，机构投资者持有近一半股票而机构数目超过 1 000——管理层不可能经常与所有股东（或机构）沟通；所有权与管理权分离可促进公司蓬勃发展，前提是管理层把股东利益最大化作为目标。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">规模难题</strong>（可口可乐例）：2008 年可口可乐市值超过 1 000 亿美元、股东超过 30 万名，机构投资者持有近一半股票而机构数目超过 1 000——管理层不可能经常与所有股东（或机构）沟通；所有权与管理权分离可促进公司蓬勃发展，前提是管理层把股东利益最大化作为目标。","label":"规模难题"},{"t":"最优补偿合同（optimal compensation contract）：把股东和管理层的利益联系在一起（要点12）；设计取决于管理层行为是否可被观察、双方信息不对称程度、绩效评估是否充分、双方差异程度等；合同中的奖惩机制即\"胡萝卜加大棒\"。有效的公司管理（含最优补偿合同设计）决定公司价值能否最大、经济体中的资本能否得到最优分配。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">最优补偿合同</strong>（optimal compensation contract）：把股东和管理层的利益联系在一起（要点12）；设计取决于管理层行为是否可被观察、双方信息不对称程度、绩效评估是否充分、双方差异程度等；合同中的奖惩机制即&quot;胡萝卜加大棒&quot;。有效的公司管理（含最优补偿合同设计）决定公司价值能否最大、经济体中的资本能否得到最优分配。","label":"最优补偿合同"},{"t":"延伸：委托—代理问题不限于股东与管理层——如资金经理人（代理人）代投资者（委托人）投资；股东与债券人之间也存在利益冲突（股东偏好更高风险投资，债券人偏好更低风险，因为低风险下债务价值更高）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">延伸</strong>：委托—代理问题不限于股东与管理层——如资金经理人（代理人）代投资者（委托人）投资；股东与债券人之间也存在利益冲突（股东偏好更高风险投资，债券人偏好更低风险，因为低风险下债务价值更高）。","label":"延伸：委托—代理问题不限于股东与管理…"}],"k":"sec","i":0,"h":"2.3 代理理论","label":"2.3 代理理论"},{"t":"2.4 从理性到心理","c":[{"t":"三大理论小结：CAPM（风险定价）、EMH（价格反映信息）、机构理论/代理理论（利益冲突对公司金融理论有重大影响）构成现代金融学的三个核心理论。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">三大理论小结</strong>：CAPM（风险定价）、EMH（价格反映信息）、机构理论/代理理论（利益冲突对公司金融理论有重大影响）构成现代金融学的三个核心理论。","label":"三大理论小结"},{"t":"转折预告：第 4 章将回顾表明市场并非如前人所想那样有效的证据；已有人详细记录多种明显不符合 EMH 的异象和实证结果，更有以\"套利极限\"（limits to arbitrage）为题的理论撼动 EMH；正因如此，近几十年学者开始回头思考人类心理活动如何影响金融决策。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">转折预告</strong>：第 4 章将回顾表明市场并非如前人所想那样有效的证据；已有人详细记录多种明显不符合 EMH 的异象和实证结果，更有以&quot;套利极限&quot;（limits to arbitrage）为题的理论撼动 EMH；正因如此，近几十年学者开始回头思考人类心理活动如何影响金融决策。","label":"转折预告"},{"t":"行为金融学的处境：仍是较新的研究领域，因缺少统一框架而常受批判；但批判不能抹杀其价值——心理学对理解个人投资者、金融从业人员、市场和管理层的决策都非常重要。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">行为金融学的处境</strong>：仍是较新的研究领域，因缺少统一框架而常受批判；但批判不能抹杀其价值——心理学对理解个人投资者、金融从业人员、市场和管理层的决策都非常重要。","label":"行为金融学的处境"},{"t":"凯恩斯的先声（《就业、利息和货币通论》，1936）：以\"投机\"（预测市场心理的活动）与\"冒险经营\"（预测资产未来终身收益率的活动）相对照——投机未必总在冒险经营中占主导地位，但投资市场配置不断改进时，投机占主导的风险会增大；纽约这个最大的投资市场上投机比重非常大——承认心理对金融的重要影响并非今日始。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">凯恩斯的先声</strong>（《就业、利息和货币通论》，1936）：以&quot;投机&quot;（预测市场心理的活动）与&quot;冒险经营&quot;（预测资产未来终身收益率的活动）相对照——投机未必总在冒险经营中占主导地位，但投资市场配置不断改进时，投机占主导的风险会增大；纽约这个最大的投资市场上投机比重非常大——承认心理对金融的重要影响并非今日始。","label":"凯恩斯的先声"}],"k":"sec","i":0,"h":"2.4 从理性到心理","label":"2.4 从理性到心理"}],"k":"chap","h":"<strong class=\"lead\">第2章 金融学基础Ⅱ</strong>：资产定价、市场有效性和机构关系","label":"第2章 金融学基础Ⅱ"},{"t":"第3章 前景理论、框架和心理账户","c":[{"t":"本章要点","c":[{"t":"心理学家通过研究决策问题，发现有悖于期望效用理论的现象。","c":[],"k":"b","i":1,"h":"心理学家通过研究决策问题，发现有悖于期望效用理论的现象。","label":"心理学家通过研究决策问题，发现有悖于…"},{"t":"前景理论（prospect theory）由丹尼尔·卡内曼和阿莫斯·特沃斯基提出，是最广为接受、检验最多的研究个体风险决策的行为学模型。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">前景理论</strong>（prospect theory）由丹尼尔·卡内曼和阿莫斯·特沃斯基提出，是最广为接受、检验最多的研究个体风险决策的行为学模型。","label":"前景理论"},{"t":"实际观察到的行为有三要素：在收益域内规避风险、在损失域内寻求风险；收益和损失是根据参照点定义的；损失造成的心理影响要大于收益（损失规避）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">实际观察到的行为有三要素</strong>：在收益域内规避风险、在损失域内寻求风险；收益和损失是根据参照点定义的；损失造成的心理影响要大于收益（损失规避）。","label":"实际观察到的行为有三要素"},{"t":"前景理论中，价值函数（value function）代替了效用的概念。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">前景理论中，价值函数</strong>（value function）代替了效用的概念。","label":"前景理论中，价值函数"},{"t":"前景理论赋予小概率结果更高的权重，解释了人为何同时购买彩票和保险。","c":[],"k":"b","i":1,"h":"前景理论赋予小概率结果更高的权重，解释了人为何同时购买彩票和保险。","label":"前景理论赋予小概率结果更高的权重，解…"},{"t":"累积前景理论（cumulative prospect theory）延伸了原有模型，决策权重更为灵活可变：既能赋予小概率事件更高的权重值，也能赋予同等规模的收益和损失不同的权重。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">累积前景理论</strong>（cumulative prospect theory）延伸了原有模型，决策权重更为灵活可变：既能赋予小概率事件更高的权重值，也能赋予同等规模的收益和损失不同的权重。","label":"累积前景理论"},{"t":"确定性效应（certainty effect）表明，人会给予确定性结果更高的权重。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">确定性效应</strong>（certainty effect）表明，人会给予确定性结果更高的权重。","label":"确定性效应"},{"t":"卡内曼和特沃斯基根据实验结果，提出了价值函数和加权函数的函数形式。","c":[],"k":"b","i":1,"h":"卡内曼和特沃斯基根据实验结果，提出了价值函数和加权函数的函数形式。","label":"卡内曼和特沃斯基根据实验结果，提出了…"},{"t":"问题的框架和表现形式会影响人的选择。","c":[],"k":"b","i":1,"h":"问题的框架和表现形式会影响人的选择。","label":"问题的框架和表现形式会影响人的选择。"},{"t":"人们通过心理账户来管理、评估、控制金融活动。","c":[],"k":"b","i":1,"h":"人们通过心理账户来管理、评估、控制金融活动。","label":"人们通过心理账户来管理、评估、控制金…"},{"t":"心理账户有三个要素：决策框架、账户分配、账户评估的频率。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">心理账户有三个要素</strong>：决策框架、账户分配、账户评估的频率。","label":"心理账户有三个要素"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"3.1 前景理论","c":[{"t":"3.1.1 实际观察到的行为的要素","c":[{"t":"规范性理论（normative theory）认为理性人应按某种特定方式行事，期望效用理论即属此类；实证性/描述性理论（positive/descriptive theory）基于实际观察建模——前景理论是期望效用理论替代理论中最受认可、检验最多的理论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规范性理论</strong>（normative theory）认为理性人应按某种特定方式行事，期望效用理论即属此类；实证性/描述性理论（positive/descriptive theory）基于实际观察建模——前景理论是期望效用理论替代理论中最受认可、检验最多的理论。","label":"规范性理论"},{"t":"要素1——风险态度随前景性质改变（问题1）：84%的受访者确定得240美元而放弃25%概率得1000美元（收益域规避风险），87%的受访者选75%概率损失1000美元而非确定损失750美元（损失域寻求风险）；期望效用理论假设风险态度始终如一，无法解释这种转变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">要素1——风险态度随前景性质改变</strong>（问题1）：84%的受访者确定得240美元而放弃25%概率得1000美元（收益域规避风险），87%的受访者选75%概率损失1000美元而非确定损失750美元（损失域寻求风险）；期望效用理论假设风险态度始终如一，无法解释这种转变。","label":"要素1——风险态度随前景性质改变"},{"t":"要素2——以参照点评判得失（问题2）：初始财富相差200美元、实质相同的两个决策，72%选确定得100美元（收益域避风险）、64%选50%概率损失200美元（损失域求风险）——人们对照参照点（reference point，通常取当前财富），以财富变化而非财富水平评价前景优劣；期望效用理论则以最终财富水平为效用函数自变量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">要素2——以参照点评判得失</strong>（问题2）：初始财富相差200美元、实质相同的两个决策，72%选确定得100美元（收益域避风险）、64%选50%概率损失200美元（损失域求风险）——人们对照参照点（reference point，通常取当前财富），以财富变化而非财富水平评价前景优劣；期望效用理论则以最终财富水平为效用函数自变量。","label":"要素2——以参照点评判得失"},{"t":"要素3——损失规避（loss aversion）：损失的心理影响大于同规模收益；问题3中对50%概率损失25美元的公平赌局，实验中要求的补偿收益均值约61美元，超过损失绝对值的2倍。注意损失规避不同于风险规避：期望值相同的确定性收益与纯收益赌局之间人们仍偏好确定性，但对可能致亏赌局的厌恶程度轻得多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">要素3——损失规避</strong>（loss aversion）：损失的心理影响大于同规模收益；问题3中对50%概率损失25美元的公平赌局，实验中要求的补偿收益均值约61美元，超过损失绝对值的2倍。注意损失规避不同于风险规避：期望值相同的确定性收益与纯收益赌局之间人们仍偏好确定性，但对可能致亏赌局的厌恶程度轻得多。","label":"要素3——损失规避"}],"k":"b","i":1,"h":"3.1.1 实际观察到的行为的要素","label":"3.1.1 实际观察到的行为的要素"},{"t":"3.1.2 价值函数","c":[{"t":"价值函数（value function）v(z)：以财富相对参照点的变化z（而非财富水平w）为自变量，对应期望效用理论中的效用函数。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">价值函数</strong>（value function）v(z)：以财富相对参照点的变化z（而非财富水平w）为自变量，对应期望效用理论中的效用函数。","label":"价值函数"},{"t":"前景价值：V(P)=V(p,z1,z2)=π(p)×v(z1)+π(1-p)×v(z2)，其中π(·)为决策权重（decision weights），是概率的非线性函数，且不要求π(p)+π(1-p)=1。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">前景价值</strong>：V(P)=V(p,z1,z2)=π(p)×v(z1)+π(1-p)×v(z2)，其中π(·)为决策权重（decision weights），是概率的非线性函数，且不要求π(p)+π(1-p)=1。","label":"前景价值"},{"t":"价值函数四大特征：①自变量是财富变化（相对参照点的得失）而非财富水平；②收益域内为凹函数（决策者规避风险）；③损失域内为凸函数（决策者寻求风险）；④损失域斜率大于收益域（同等规模损失感受更强，即损失规避）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">价值函数四大特征</strong>：①自变量是财富变化（相对参照点的得失）而非财富水平；②收益域内为凹函数（决策者规避风险）；③损失域内为凸函数（决策者寻求风险）；④损失域斜率大于收益域（同等规模损失感受更强，即损失规避）。","label":"价值函数四大特征"}],"k":"b","i":1,"h":"3.1.2 价值函数","label":"3.1.2 价值函数"},{"t":"3.1.3 彩票与保险","c":[{"t":"困扰研究者的问题：为何购买彩票（寻求风险）的人也购买保险（规避风险）？期望效用理论框架下难以解释。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">困扰研究者的问题</strong>：为何购买彩票（寻求风险）的人也购买保险（规避风险）？期望效用理论框架下难以解释。","label":"困扰研究者的问题"},{"t":"问题4（彩票）：0.001概率得5000美元对确定得5美元（期望价值同为5美元），多数人偏好前者——收益域小概率时转向寻求风险；问题5（保险）：0.001概率损失5000美元对确定付5美元，多数人选后者——损失域小概率时转向规避风险。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题4</strong>（彩票）：0.001概率得5000美元对确定得5美元（期望价值同为5美元），多数人偏好前者——收益域小概率时转向寻求风险；问题5（保险）：0.001概率损失5000美元对确定付5美元，多数人选后者——损失域小概率时转向规避风险。","label":"问题4（彩票）：0.001概率得50…"},{"t":"风险态度的四重性（fourfold pattern of risk attitude）：大概率收益→规避风险；大概率损失→寻求风险；小概率收益→寻求风险；小概率损失→规避风险；卡内曼和特沃斯基发现92%的实验对象完全表现出上述四种情形。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">风险态度的四重性</strong>（fourfold pattern of risk attitude）：大概率收益→规避风险；大概率损失→寻求风险；小概率收益→寻求风险；小概率损失→规避风险；卡内曼和特沃斯基发现92%的实验对象完全表现出上述四种情形。","label":"风险态度的四重性"},{"t":"解释机制：用决策权重π(p)替代概率p，从而高估小概率事件的权重。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解释机制</strong>：用决策权重π(p)替代概率p，从而高估小概率事件的权重。","label":"解释机制"}],"k":"b","i":1,"h":"3.1.3 彩票与保险","label":"3.1.3 彩票与保险"},{"t":"3.1.4 加权函数","c":[{"t":"确定性效应（certainty effect）：与仅大概率发生的结果相比，人们对确定性结果赋予更大权重——问题6中80%选确定3000美元（弃80%概率4000美元），概率同比例缩至1/4后65%选择反转（同比率效应，common ratio effect）；加权函数在确定性（p=1）邻域内斜率大于1。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">确定性效应</strong>（certainty effect）：与仅大概率发生的结果相比，人们对确定性结果赋予更大权重——问题6中80%选确定3000美元（弃80%概率4000美元），概率同比例缩至1/4后65%选择反转（同比率效应，common ratio effect）；加权函数在确定性（p=1）邻域内斜率大于1。","label":"确定性效应"},{"t":"问题7：86%选90%概率的3000美元（弃45%概率的6000美元），73%选0.001概率的6000美元（弃0.002概率的3000美元）——结果发生概率越小其权重被高估程度越大，加权函数在p=0邻域内斜率大于1。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题7</strong>：86%选90%概率的3000美元（弃45%概率的6000美元），73%选0.001概率的6000美元（弃0.002概率的3000美元）——结果发生概率越小其权重被高估程度越大，加权函数在p=0邻域内斜率大于1。","label":"问题7：86%选90%概率的3000…"},{"t":"由此设π(0)=0、π(1)=1，中间概率范围内斜率较小，整体呈\"倒S曲线\"（inverted S-shape）。","c":[],"k":"b","i":2,"h":"由此设π(0)=0、π(1)=1，中间概率范围内斜率较小，整体呈&quot;倒S曲线&quot;（inverted S-shape）。","label":"由此设π"},{"t":"附录3A给出合理加权函数的四个条件：高估小概率（π(p)>p，p很小时）；次可加性（subadditivity，π(rp)>r×π(p)，0<r<1，源于问题7）；次确定性（subcertainty，π(p)+π(1-p)<1，源于阿莱悖论）；次比例性（subproportionality，π(pq)/π(p)<π(pqr)/π(pr)，r≤1）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">附录3A给出合理加权函数的四个条件</strong>：高估小概率（π(p)&gt;p，p很小时）；次可加性（subadditivity，π(rp)&gt;r×π(p)，0&lt;r&lt;1，源于问题7）；次确定性（subcertainty，π(p)+π(1-p)&lt;1，源于阿莱悖论）；次比例性（subproportionality，π(pq)/π(p)&lt;π(pqr)/π(pr)，r≤1）。","label":"附录3A给出合理加权函数的四个条件"}],"k":"b","i":1,"h":"3.1.4 加权函数","label":"3.1.4 加权函数"},{"t":"3.1.5 假设的价值函数和加权函数","c":[{"t":"价值函数采用分段指数函数（piecewise exponential）：v(z)=z^α（z≥0，0<α<1）；v(z)=-λ(-z)^β（z<0，λ>1，0<β<1）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">价值函数采用分段指数函数</strong>（piecewise exponential）：v(z)=z^α（z≥0，0&lt;α&lt;1）；v(z)=-λ(-z)^β（z&lt;0，λ&gt;1，0&lt;β&lt;1）。","label":"价值函数采用分段指数函数"},{"t":"估计值：α≈β≈0.88，λ≈2.25——损失的心理影响约为同规模收益的2.25倍；这只是\"一般决策者\"的均值，个体参数可更大或更小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">估计值</strong>：α≈β≈0.88，λ≈2.25——损失的心理影响约为同规模收益的2.25倍；这只是&quot;一般决策者&quot;的均值，个体参数可更大或更小。","label":"估计值：α≈β≈0.88，λ≈2.2…"},{"t":"加权函数：收益域π(p)=p^γ/[p^γ+(1-p)^γ]^(1/γ)，γ=0.61；损失域同形（参数δ=0.69）；为简便常取两者均值0.65。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">加权函数</strong>：收益域π(p)=p^γ/[p^γ+(1-p)^γ]^(1/γ)，γ=0.61；损失域同形（参数δ=0.69）；为简便常取两者均值0.65。","label":"加权函数"},{"t":"数值示例：π(0.10)=0.1152（小概率被高估）；π(0.90)=0.7455；π(0.90)+π(0.10)=0.8607<1，体现次确定性——高估小概率且存在次确定性，意味着在某个概率点之后所有权重都小于概率本身。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数值示例</strong>：π(0.10)=0.1152（小概率被高估）；π(0.90)=0.7455；π(0.90)+π(0.10)=0.8607&lt;1，体现次确定性——高估小概率且存在次确定性，意味着在某个概率点之后所有权重都小于概率本身。","label":"数值示例"},{"t":"卡内曼因\"将心理学研究发现运用于经济学，尤其不确定性下的判断与决策\"获2002年诺贝尔经济学奖。","c":[],"k":"b","i":2,"h":"卡内曼因&quot;将心理学研究发现运用于经济学，尤其不确定性下的判断与决策&quot;获2002年诺贝尔经济学奖。","label":"卡内曼因\"将心理学研究发现运用于经济…"}],"k":"b","i":1,"h":"3.1.5 假设的价值函数和加权函数","label":"3.1.5 假设的价值函数和加权函数"},{"t":"3.1.6 一些例子","c":[{"t":"彩票估价：V(P11)=π(0.001)×v(5000)=0.011×1799.26≈19.86，大于V(P12)=π(1)×v(5)=4.12——0.001概率的决策权重约为概率本身的11倍，故一般决策者更愿购买彩票。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">彩票估价</strong>：V(P11)=π(0.001)×v(5000)=0.011×1799.26≈19.86，大于V(P12)=π(1)×v(5)=4.12——0.001概率的决策权重约为概率本身的11倍，故一般决策者更愿购买彩票。","label":"彩票估价"},{"t":"问题6估价：V(P15)=π(0.80)×v(4000)=0.64×1478.47≈946.24，小于V(P16)=1×1147.80（选确定性）；V(P17)=π(0.20)×v(4000)=0.256×1478.47≈384.29，大于V(P18)=π(0.25)×v(3000)=0.293×1147.80≈336.66（选赌局）——确定性结果权重远大于仅大概率结果，而中间概率（0.20→0.25）权重几乎随概率同步增长。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题6估价</strong>：V(P15)=π(0.80)×v(4000)=0.64×1478.47≈946.24，小于V(P16)=1×1147.80（选确定性）；V(P17)=π(0.20)×v(4000)=0.256×1478.47≈384.29，大于V(P18)=π(0.25)×v(3000)=0.293×1147.80≈336.66（选赌局）——确定性结果权重远大于仅大概率结果，而中间概率（0.20→0.25）权重几乎随概率同步增长。","label":"问题6估价"}],"k":"b","i":1,"h":"3.1.6 一些例子","label":"3.1.6 一些例子"},{"t":"3.1.7 其他","c":[{"t":"无风险条件下的损失规避——禀赋效应（endowment effect）/现状偏见（status quo bias）：商品一旦为人所有，其价值似乎就上升；马克杯实验中买方仅愿付1.34美元、卖方至少要8.83美元才肯出售同款杯子；对应价值函数上v(-x)的绝对值超过v(+x)绝对值的2倍（第5章继续讨论现状偏见）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">无风险条件下的损失规避——禀赋效应</strong>（endowment effect）/现状偏见（status quo bias）：商品一旦为人所有，其价值似乎就上升；马克杯实验中买方仅愿付1.34美元、卖方至少要8.83美元才肯出售同款杯子；对应价值函数上v(-x)的绝对值超过v(+x)绝对值的2倍（第5章继续讨论现状偏见）。","label":"无风险条件下的损失规避——禀赋效应"},{"t":"前景理论的起源：黑猩猩实验显示强禀赋效应（58%初选花生酱，得到后79%不愿用其换果汁），僧帽猴会依据参照点决策并规避损失——损失规避与禀赋效应可能有进化（适应）基础：对勉强温饱的原始人，多得50%食物是好事、损失50%则可能是灭顶之灾。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">前景理论的起源</strong>：黑猩猩实验显示强禀赋效应（58%初选花生酱，得到后79%不愿用其换果汁），僧帽猴会依据参照点决策并规避损失——损失规避与禀赋效应可能有进化（适应）基础：对勉强温饱的原始人，多得50%食物是好事、损失50%则可能是灭顶之灾。","label":"前景理论的起源"},{"t":"前景理论与心理学：前景理论可视为一组关于风险选择的探索法（heuristics），在进化中形成、用于复杂金融环境可能次优（第5章探索法、第6章过度自信与控制幻觉、第7章情绪）；选择的背景情绪色彩越强，加权函数越偏离线性——与第10章赌场赢利效应、处置效应的情绪解释相互呼应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">前景理论与心理学</strong>：前景理论可视为一组关于风险选择的探索法（heuristics），在进化中形成、用于复杂金融环境可能次优（第5章探索法、第6章过度自信与控制幻觉、第7章情绪）；选择的背景情绪色彩越强，加权函数越偏离线性——与第10章赌场赢利效应、处置效应的情绪解释相互呼应。","label":"前景理论与心理学"},{"t":"与前景理论竞争的理论：非期望效用模型数目已达两位数，有的偏规范（如Machina、Chew等），有的偏实证（如遗憾理论、失望规避）——前景理论并非唯一权威。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与前景理论竞争的理论</strong>：非期望效用模型数目已达两位数，有的偏规范（如Machina、Chew等），有的偏实证（如遗憾理论、失望规避）——前景理论并非唯一权威。","label":"与前景理论竞争的理论"},{"t":"（蒙蒂尔）行为偏差总览：过度乐观（overoptimism）——约80%的人自认驾驶水平高于平均，源于控制幻觉（illusion of control，以为掌控随机局面）与自我归因偏差（self-attribution bias，好结果归能力、坏结果归运气）；过度自信（overconfidence）——自认正确的人中仅约80%确实正确，预测股票涨跌实际准确率47%却自估65%，擅长自我校准的是能获得常规反馈的天气预报员等；认知失调（cognitive dissonance）——证据与信念冲突时改变或放弃原有认知以恢复一致，表现为确认偏差（confirmation bias，重视支持性信息、忽视不利信息）与保守偏差（conservatism，观点更新缓慢导致反应不足）；锚定效应（anchoring）——无关转盘数字影响\"非洲联合国成员占比\"估计（指向10与65时答案均值分别为25与45），挂牌价使房价估值偏移11%~14%，历史价格成为估值的锚（道琼斯指数若含股息1998年末应约65万点而基金经理仅猜2~3倍），对盈余公告漂移与远期贴水之谜（利率差无法解释汇率变动、回归系数b<0甚至均值为-0.9、套息交易有利可图）的反应不足可由锚定解释；代表性启发（representativeness）——琳达问题（选\"银行职员兼女权积极分子\"犯合取谬误、忽略基准概率）、小数定律（\"正反正反反正\"与\"正正正反反反\"出现概率相同）、误认好公司等于好股票；易得性偏差（availability bias）——直觉认为鲨鱼致死多于飞机部件坠落（实际后者为30倍）、字母K更常出现在词首（实际第三位约2倍），媒体报道频率高的股票随后两年表现不佳；模糊规避（ambiguity aversion）——厌恶未知概率，401(k)计划第二重仓是本公司股票（可口可乐员工将76%可自由支配退休金投本公司股票）、美英日投资者70%~90%的股票仓位在本国（本土偏好，home bias）、基金经理每10只股票就有1只因与自己在同一城市而选中。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）行为偏差总览：过度乐观（overoptimism）——约80%的人自认驾驶水平高于平均，源于控制幻觉（illusion of control，以为掌控随机局面）与自我归因偏差（self-attribution bias，好结果归能力、坏结果归运气）；过度自信（overconfidence）——自认正确的人中仅约80%确实正确，预测股票涨跌实际准确率47%却自估65%，擅长自我校准的是能获得常规反馈的天气预报员等；认知失调（cognitive dissonance）——证据与信念冲突时改变或放弃原有认知以恢复一致，表现为确认偏差（confirmation bias，重视支持性信息、忽视不利信息）与保守偏差（conservatism，观点更新缓慢导致反应不足）；锚定效应（anchoring）——无关转盘数字影响&quot;非洲联合国成员占比&quot;估计（指向10与65时答案均值分别为25与45），挂牌价使房价估值偏移11%~14%，历史价格成为估值的锚（道琼斯指数若含股息1998年末应约65万点而基金经理仅猜2~3倍），对盈余公告漂移与远期贴水之谜（利率差无法解释汇率变动、回归系数b&lt;0甚至均值为-0.9、套息交易有利可图）的反应不足可由锚定解释；代表性启发（representativeness）——琳达问题（选&quot;银行职员兼女权积极分子&quot;犯合取谬误、忽略基准概率）、小数定律（&quot;正反正反反正&quot;与&quot;正正正反反反&quot;出现概率相同）、误认好公司等于好股票；易得性偏差（availability bias）——直觉认为鲨鱼致死多于飞机部件坠落（实际后者为30倍）、字母K更常出现在词首（实际第三位约2倍），媒体报道频率高的股票随后两年表现不佳；模糊规避（ambiguity aversion）——厌恶未知概率，401(k)计划第二重仓是本公司股票（可口可乐员工将76%可自由支配退休金投本公司股票）、美英日投资者70%~90%的股票仓位在本国（本土偏好，home bias）、基金经理每10只股票就有1只因与自己在同一城市而选中。","label":"（蒙蒂尔）行为偏差总览：过度乐观（o…"},{"t":"（蒙蒂尔）非线性权重的市场证据——隐含波动率微笑（implied volatility smile）：深度价内/价外期权价格高于布莱克-斯科尔斯模型预测，因为人们高估股价大幅偏离行权价的小概率、低估股价贴近行权价的高概率。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）非线性权重的市场证据——隐含波动率微笑（implied volatility smile）：深度价内/价外期权价格高于布莱克-斯科尔斯模型预测，因为人们高估股价大幅偏离行权价的小概率、低估股价贴近行权价的高概率。","label":"（蒙蒂尔）非线性权重的市场证据——隐…"},{"t":" "h":"3.2.1 前景理论是否适用于非货币形式结果","label":"3.2.1 前景理论是否适用于非货币…"},{"t":"3.2.2 一体化与分离化","c":[{"t":"一体化（integration）：所有情形被整体一同看待——每赢/输一次沿价值函数向上/下移动；分离化（segregation）：各情形被逐一分开看待——每次都回到参照点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一体化</strong>（integration）：所有情形被整体一同看待——每赢/输一次沿价值函数向上/下移动；分离化（segregation）：各情形被逐一分开看待——每次都回到参照点。","label":"一体化（integration）：所…"},{"t":"赛马例：当日已输150美元，最后一局押10美元于赔率15:1的赛马——一体化者把当日损失计入参照点、处于损失域，为盈亏平衡甘冒平时不会接受的风险（赛马日临近结束时冷门马获更多赌注即为证据）；分离化者把最后一局视为\"赢150或输10\"，因损失规避和收益域凹性而不愿下注。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">赛马例</strong>：当日已输150美元，最后一局押10美元于赔率15:1的赛马——一体化者把当日损失计入参照点、处于损失域，为盈亏平衡甘冒平时不会接受的风险（赛马日临近结束时冷门马获更多赌注即为证据）；分离化者把最后一局视为&quot;赢150或输10&quot;，因损失规避和收益域凹性而不愿下注。","label":"赛马例：当日已输150美元，最后一局…"},{"t":"盈亏平衡效应（break-even effect）：遭受损失后愿意承担更高风险以求盈亏平衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">盈亏平衡效应</strong>（break-even effect）：遭受损失后愿意承担更高风险以求盈亏平衡。","label":"盈亏平衡效应"},{"t":"赌场赢利效应（house money effect）：获得收益后反而愿意承担更高风险——先前收益使决策者沿价值函数上移、远离损失域边界，即用\"彩头\"下注；盈亏平衡效应与赌场赢利效应都影响资产组合增减后的决策（第10章详述）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">赌场赢利效应</strong>（house money effect）：获得收益后反而愿意承担更高风险——先前收益使决策者沿价值函数上移、远离损失域边界，即用&quot;彩头&quot;下注；盈亏平衡效应与赌场赢利效应都影响资产组合增减后的决策（第10章详述）。","label":"赌场赢利效应"},{"t":"（蒙蒂尔）狭窄框架（narrow framing）：人们难以透过问法洞察问题本质；对\"A确定得2400英镑或B以25%概率得10000英镑\"\"C确定损失7500英镑或D以75%概率损失10000英镑\"分别选择时多数人选A和D，但合并计算后B+C的期望结果（-5000英镑）优于A+D（-5100英镑）——分框架决策自相矛盾。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）狭窄框架（narrow framing）：人们难以透过问法洞察问题本质；对&quot;A确定得2400英镑或B以25%概率得10000英镑&quot;&quot;C确定损失7500英镑或D以75%概率损失10000英镑&quot;分别选择时多数人选A和D，但合并计算后B+C的期望结果（-5000英镑）优于A+D（-5100英镑）——分框架决策自相矛盾。","label":"（蒙蒂尔）狭窄框架（narrow f…"},{"t":"（蒙蒂尔）\"现金流量还是盈利\"：盈利=现金流+应计项目，估值本应以现金流为准（DCF口径）；做多低应计公司、做空高应计公司的零投资组合年超额收益超10%（斯隆，1996，31年中28年为正），基于收益质量的组合年化超额收益约16%——关注\"盈利\"框架使投资者漏看现金流信息，且该差异经风格与规模因素调整后基本不变。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）&quot;现金流量还是盈利&quot;：盈利=现金流+应计项目，估值本应以现金流为准（DCF口径）；做多低应计公司、做空高应计公司的零投资组合年超额收益超10%（斯隆，1996，31年中28年为正），基于收益质量的组合年化超额收益约16%——关注&quot;盈利&quot;框架使投资者漏看现金流信息，且该差异经风格与规模因素调整后基本不变。","label":"（蒙蒂尔）\"现金流量还是盈利\"：盈利…"},{"t":"（蒙蒂尔）预计财务报表与公认会计准则（GAAP）报表：标普500每1美元\"预计盈利\"仅相当于GAAP盈利的47美分；预计口径下仅8%公司亏损、GAAP口径达19%；利用两类披露差异（剔除项目金额大于盈余惊喜的公司）构建组合，三年内可获利高达约32%——披露框架影响定价。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）预计财务报表与公认会计准则（GAAP）报表：标普500每1美元&quot;预计盈利&quot;仅相当于GAAP盈利的47美分；预计口径下仅8%公司亏损、GAAP口径达19%；利用两类披露差异（剔除项目金额大于盈余惊喜的公司）构建组合，三年内可获利高达约32%——披露框架影响定价。","label":"（蒙蒂尔）预计财务报表与公认会计准则…"}],"k":"b","i":1,"h":"3.2.2 一体化与分离化","label":"3.2.2 一体化与分离化"}],"k":"sec","i":0,"h":"3.2 框架","label":"3.2 框架"},{"t":"3.3 心理账户","c":[{"t":"3.3.1 心理账户的开户与销户","c":[{"t":"心理账户（mental accounting）：泰勒（Richard Thaler）定义为\"个人或家庭用来管理、评估、跟踪金融活动的一组认知活动\"；主要组成：账户分配、销户和评估（书中要点归纳为决策框架、账户分配、账户评估频率）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">心理账户</strong>（mental accounting）：泰勒（Richard Thaler）定义为&quot;个人或家庭用来管理、评估、跟踪金融活动的一组认知活动&quot;；主要组成：账户分配、销户和评估（书中要点归纳为决策框架、账户分配、账户评估频率）。","label":"心理账户"},{"t":"金钱按名目分类（生活用度、财富、收入等），账户是心理层面而非实际存在；心理账户违反资金可替代性（fungibility）假设，但优点在于帮助自控（如\"别动用退休储蓄\"\"以存款支付奢侈享受\"），使人更节俭。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">金钱按名目分类</strong>（生活用度、财富、收入等），账户是心理层面而非实际存在；心理账户违反资金可替代性（fungibility）假设，但优点在于帮助自控（如&quot;别动用退休储蓄&quot;&quot;以存款支付奢侈享受&quot;），使人更节俭。","label":"金钱按名目分类"},{"t":"戏票问题：丢失10美元现金时88%仍会买票；丢失已购戏票时54%不再买票——购票即开设\"购票账户\"，丢现金与该账户无关；丢票后二度购票被记入同一账户，一张票心理价格变成20美元，许多人觉得过贵而放弃。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">戏票问题</strong>：丢失10美元现金时88%仍会买票；丢失已购戏票时54%不再买票——购票即开设&quot;购票账户&quot;，丢现金与该账户无关；丢票后二度购票被记入同一账户，一张票心理价格变成20美元，许多人觉得过贵而放弃。","label":"戏票问题"},{"t":"（蒙蒂尔）生活证据：一边持有约6%利息的银行存款、一边背负28%~29%年息的信用卡循环债务并不理性却很常见——\"储蓄账户\"与\"还债账户\"的分割压倒了资金可替代性。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）生活证据：一边持有约6%利息的银行存款、一边背负28%~29%年息的信用卡循环债务并不理性却很常见——&quot;储蓄账户&quot;与&quot;还债账户&quot;的分割压倒了资金可替代性。","label":"（蒙蒂尔）生活证据：一边持有约6%利…"}],"k":"b","i":1,"h":"3.3.1 心理账户的开户与销户","label":"3.3.1 心理账户的开户与销户"},{"t":"3.3.2 如何评估心理账户和选择销户时机","c":[{"t":"预付消费在消费完毕（看完戏）时自然销户；储蓄与投资账户的检查频率与销户条件取决于账户类型（退休储蓄账户的行为不同于\"午餐费\"账户）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">预付消费在消费完毕</strong> bel":"3.3 心理账户"},{"t":"3.4 从理论到实际操作","c":[{"t":"对前景理论的质疑与回应：早期挑战期望效用理论的实验多用假设情景与学生被试、未涉真实金钱盈亏；但后续研究在真实激励与电视有奖竞猜参赛者等各类人群中复现了这些现象；也有实验得出相悖结果（混合赌局、中等概率下）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对前景理论的质疑与回应</strong>：早期挑战期望效用理论的实验多用假设情景与学生被试、未涉真实金钱盈亏；但后续研究在真实激励与电视有奖竞猜参赛者等各类人群中复现了这些现象；也有实验得出相悖结果（混合赌局、中等概率下）。","label":"对前景理论的质疑与回应"},{"t":"适用边界：前景理论是个体行为模型；个体行为如何加总为群体决策（市场结果）尚未完全清楚——这是行为金融学仍需回答的问题。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">适用边界</strong>：前景理论是个体行为模型；个体行为如何加总为群体决策（市场结果）尚未完全清楚——这是行为金融学仍需回答的问题。","label":"适用边界"},{"t":"方法论启示（弗农·史密斯）：绝大多数学科在理论完备形成之前，都是先出现大量观察结果——长期存在的背离传统理论的现象正是行为研究的起点；本书后续将据此探讨影响金融决策的因素，以及如何做出更明智的金融决策。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">方法论启示</strong>（弗农·史密斯）：绝大多数学科在理论完备形成之前，都是先出现大量观察结果——长期存在的背离传统理论的现象正是行为研究的起点；本书后续将据此探讨影响金融决策的因素，以及如何做出更明智的金融决策。","label":"方法论启示"}],"k":"sec","i":0,"h":"3.4 从理论到实际操作","label":"3.4 从理论到实际操作"}],"k":"chap","h":"第3章 前景理论、框架和心理账户","label":"第3章 前景理论、框架和心理账户"},{"t":"第4章 对市场有效性的挑战","c":[{"t":"本章要点","c":[{"t":"市场异象（anomalies）是指\"看似\"与市场有效性相违背、未能被合理解释的实证结果。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">市场异象</strong>（anomalies）是指&quot;看似&quot;与市场有效性相违背、未能被合理解释的实证结果。","label":"市场异象"},{"t":"主要的市场异象：对盈余公告的滞后反应、小公司效应、价值股效应、动量效应和反转效应。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">主要的市场异象</strong>：对盈余公告的滞后反应、小公司效应、价值股效应、动量效应和反转效应。","label":"主要的市场异象"},{"t":"市场有效性建立在三个支柱之上：如果投资者是理性的，市场是有效的；如果这一点不成立，而投资者的错误是随机的（不相关），则市场是有效的；如果这一点也不成立，而套利没有限制，则市场仍是有效的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">市场有效性建立在三个支柱之上</strong>：如果投资者是理性的，市场是有效的；如果这一点不成立，而投资者的错误是随机的（不相关），则市场是有效的；如果这一点也不成立，而套利没有限制，则市场仍是有效的。","label":"市场有效性建立在三个支柱之上"},{"t":"如果一些投资者基于错误信息对股票进行估价，则存在噪声；如果许多投资者同时犯同一种错误，则存在情绪。","c":[],"k":"b","i":1,"h":"如果一些投资者基于错误信息对股票进行估价，则存在噪声；如果许多投资者同时犯同一种错误，则存在情绪。","label":"如果一些投资者基于错误信息对股票进行…"},{"t":"噪声交易者风险是指错误定价短期内可能错得更加严重的风险。","c":[],"k":"b","i":1,"h":"噪声交易者风险是指错误定价短期内可能错得更加严重的风险。","label":"噪声交易者风险是指错误定价短期内可能…"},{"t":"基本面风险、噪声交易者风险和操作成本的存在使得套利存在限制。","c":[],"k":"b","i":1,"h":"基本面风险、噪声交易者风险和操作成本的存在使得套利存在限制。","label":"基本面风险、噪声交易者风险和操作成本…"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"4.1 一些重要的市场异象","c":[{"t":"4.1.1 对盈余公告的滞后反应","c":[{"t":"事件研究（event study）：在大量相似事件（盈余公告、股票分拆、分红变化、增发新股等）上，以事件为轴确定时间窗口，计算事件前/事件窗口/事件后的超额收益，平均后得到累计超额收益（cumulative average residuals，CAR）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">事件研究</strong>（event study）：在大量相似事件（盈余公告、股票分拆、分红变化、增发新股等）上，以事件为轴确定时间窗口，计算事件前/事件窗口/事件后的超额收益，平均后得到累计超额收益（cumulative average residuals，CAR）。","label":"事件研究"},{"t":"有效市场的预期：事件窗口内对好/坏消息有正面/负面反应（上升/下降的CAR路径），事件公布日后不再有进一步反应——信息应被立即完全消化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有效市场的预期</strong>：事件窗口内对好/坏消息有正面/负面反应（上升/下降的CAR路径），事件公布日后不再有进一步反应——信息应被立即完全消化。","label":"有效市场的预期"},{"t":"标准化未预期收益：SUE=(EPS-E(EPS))/SEE，其中EPS为实际每股收益、E(EPS)为时间序列回归的预测值、SEE为回归标准误差（反映盈余波动性）；按SUE从大到小分为十组。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">标准化未预期收益</strong>：SUE=(EPS-E(EPS))/SEE，其中EPS为实际每股收益、E(EPS)为时间序列回归的预测值、SEE为回归标准误差（反映盈余波动性）；按SUE从大到小分为十组。","label":"标准化未预期收益"},{"t":"证据（Rendleman-Jones-Latane，1972-1980年1000家公司季度公告）：公告日市场反应方向符合预期，但之后价格持续漂移，极端好/坏未预期收益后尤其显著；扣除可能的交易成本后漂移仍足以带来投机收益——违背有效性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证据</strong>（Rendleman-Jones-Latane，1972-1980年1000家公司季度公告）：公告日市场反应方向符合预期，但之后价格持续漂移，极端好/坏未预期收益后尤其显著；扣除可能的交易成本后漂移仍足以带来投机收益——违背有效性。","label":"证据（Rendleman-Jones…"},{"t":"（蒙蒂尔）漂移的量级：盈余超预期最高的股票在公告前60天已跑赢市场4%~5%，公告后60天仍再跑赢约2%（伯纳德，1993）——锚定与保守使市场对基本面信息反应不足。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）漂移的量级：盈余超预期最高的股票在公告前60天已跑赢市场4%~5%，公告后60天仍再跑赢约2%（伯纳德，1993）——锚定与保守使市场对基本面信息反应不足。","label":"（蒙蒂尔）漂移的量级：盈余超预期最高…"}],"k":"b","i":1,"h":"4.1.1 对盈余公告的滞后反应","label":"4.1.1 对盈余公告的滞后反应"},{"t":"4.1.2 小公司效应","c":[{"t":"小公司效应（small-firm effect）：控制市场风险后，投资小市值公司能获得超额收益——做多市值最小组、同时做空市值最大组的组合在1931-1975年每月获利1.52%（Banz，1981）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">小公司效应</strong>（small-firm effect）：控制市场风险后，投资小市值公司能获得超额收益——做多市值最小组、同时做空市值最大组的组合在1931-1975年每月获利1.52%（Banz，1981）。","label":"小公司效应"},{"t":"季节性：主要出现在1月，在一定程度上可视为\"1月效应\"；税务效应假说——投资者年末卖出亏损股票实现短期资本亏损以减税，抛压压低价格、次年1月反弹，且反弹幅度与上年表现直接相关；即便如此，套利者未能消除年底的价格下降，有效性仍不成立。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">季节性</strong>：主要出现在1月，在一定程度上可视为&quot;1月效应&quot;；税务效应假说——投资者年末卖出亏损股票实现短期资本亏损以减税，抛压压低价格、次年1月反弹，且反弹幅度与上年表现直接相关；即便如此，套利者未能消除年底的价格下降，有效性仍不成立。","label":"季节性：主要出现在1月，在一定程度上…"},{"t":"数据探测（data snooping）：在一组数据上持续挖掘直到找到\"异象\"——因随机性存在，总能发现一些虚假模式；股票价格是被研究最多的金融序列、最易中招；应对之道是一致性检验：异象须在不同时段、不同市场都成立。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数据探测</strong>（data snooping）：在一组数据上持续挖掘直到找到&quot;异象&quot;——因随机性存在，总能发现一些虚假模式；股票价格是被研究最多的金融序列、最易中招；应对之道是一致性检验：异象须在不同时段、不同市场都成立。","label":"数据探测"},{"t":"稳定性警示：过去20年小公司效应急剧下降，可能因投资者系统性地利用了公开发表研究所发现的套利机会（文献发表后投资专家随即采用小公司策略）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">稳定性警示</strong>：过去20年小公司效应急剧下降，可能因投资者系统性地利用了公开发表研究所发现的套利机会（文献发表后投资专家随即采用小公司策略）。","label":"稳定性警示"}],"k":"b","i":1,"h":"4.1.2 小公司效应","label":"4.1.2 小公司效应"},{"t":"4.1.3 价值股效应","c":[{"t":"术语：价值股（value stocks）——相对盈余、现金流、账面价值等会计指标价格较低的股票；成长股/明星股（growth stocks/glamour stocks）——相对这些指标价格较高、市场预期未来高增长的股票；价值投资（value investing）——在组合中加大价值股权重（相对成长股）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：价值股（value stocks）——相对盈余、现金流、账面价值等会计指标价格较低的股票；成长股/明星股（growth stocks/glamour stocks）——相对这些指标价格较高、市场预期未来高增长的股票；价值投资（value investing）——在组合中加大价值股权重（相对成长股）。","label":"术语：价值股（value stock…"},{"t":"P/E证据（Basu，1956-1969年约500只、五分组、年初形成并持有12个月）：最高P/E两组收益（9.34%对9.28%）无差异，但高P/E组明显低于低P/E组（16.30%）；且低P/E组合贝塔（0.99）不高于高P/E组合（1.11）——按CAPM与贝塔调整风险后差异仍在。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">P/E证据</strong>（Basu，1956-1969年约500只、五分组、年初形成并持有12个月）：最高P/E两组收益（9.34%对9.28%）无差异，但高P/E组明显低于低P/E组（16.30%）；且低P/E组合贝塔（0.99）不高于高P/E组合（1.11）——按CAPM与贝塔调整风险后差异仍在。","label":"P/E证据"},{"t":"B/P证据（Lakonishok-Shleifer-Vishny，1994）：最高十分位年回报17.3%对最低十分位11.0%；5年期回报19.8%对9.3%；CF/P（现金流价格比）的证据同向——高CF/P未来收益更高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">B/P证据</strong>（Lakonishok-Shleifer-Vishny，1994）：最高十分位年回报17.3%对最低十分位11.0%；5年期回报19.8%对9.3%；CF/P（现金流价格比）的证据同向——高CF/P未来收益更高。","label":"B/P证据"},{"t":"共性：三个异象都基于会计指标（盈余、账面值、现金流）与股价之比——控制指标不变，定价越低未来收益越高，价值异象可能彼此相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">共性</strong>：三个异象都基于会计指标（盈余、账面值、现金流）与股价之比——控制指标不变，定价越低未来收益越高，价值异象可能彼此相关。","label":"共性：三个异象都基于会计指标（盈余、…"},{"t":"国际证据（Fama-French，1975-1995，美国、日本、英国、法国、德国）：按B/P、E/P、CF/P各取最高30%为价值组合、最低30%为成长组合，15种情形下价值股全部跑赢成长股——跨市场一致性削弱数据探测质疑。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">国际证据</strong>（Fama-French，1975-1995，美国、日本、英国、法国、德国）：按B/P、E/P、CF/P各取最高30%为价值组合、最低30%为成长组合，15种情形下价值股全部跑赢成长股——跨市场一致性削弱数据探测质疑。","label":"国际证据"}],"k":"b","i":1,"h":"4.1.3 价值股效应","label":"4.1.3 价值股效应"},{"t":"4.1.4 动量效应和反转效应","c":[{"t":"术语：动量效应（momentum）——收益与过去收益正相关；反转效应（reversal）——负相关。时间结构：较短期间（约1个月）存在可靠反转（可能主要是流动性引致价格压力等技术问题）；居中期间（2~12个月）存在动量；较长时间（3~5年）存在典型反转。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：动量效应（momentum）——收益与过去收益正相关；反转效应（reversal）——负相关。时间结构：较短期间（约1个月）存在可靠反转（可能主要是流动性引致价格压力等技术问题）；居中期间（2~12个月）存在动量；较长时间（3~5年）存在典型反转。","label":"术语：动量效应（momentum）—…"},{"t":"长期反转（De Bondt-Thaler，1985）：以过去3年相对基准表现最好/最差的约35只股票构造赢者/输者组合并跟踪——未来5年输者组合收益显著高于赢者组合；两点注意：差别主要来自输者组合的强劲表现而非赢者表现不佳；大部分收益跳跃出现在1月；统计显著但P值并不令人满意。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长期反转</strong>（De Bondt-Thaler，1985）：以过去3年相对基准表现最好/最差的约35只股票构造赢者/输者组合并跟踪——未来5年输者组合收益显著高于赢者组合；两点注意：差别主要来自输者组合的强劲表现而非赢者表现不佳；大部分收益跳跃出现在1月；统计显著但P值并不令人满意。","label":"长期反转"},{"t":"中期动量（Jegadeesh-Titman，1993）：基于过去6个月收益的零成本股票组合在接下来6个月月均获0.95%超额收益；动量也存在于行业之间且不包含个股动量（Moskowitz-Grinblatt）；交易成本会侵蚀部分动量收益，但机构投资者仍可利用；动量与盈余公告漂移相关（控制后动量是否消失仍有争论）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">中期动量</strong>（Jegadeesh-Titman，1993）：基于过去6个月收益的零成本股票组合在接下来6个月月均获0.95%超额收益；动量也存在于行业之间且不包含个股动量（Moskowitz-Grinblatt）；交易成本会侵蚀部分动量收益，但机构投资者仍可利用；动量与盈余公告漂移相关（控制后动量是否消失仍有争论）。","label":"中期动量"},{"t":"国际证据：欧洲12国动量策略月收益约1%；除日本外多数国家存在动量；长期反转在美国以外（德国、加拿大等）也得到印证。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">国际证据</strong>：欧洲12国动量策略月收益约1%；除日本外多数国家存在动量；长期反转在美国以外（德国、加拿大等）也得到印证。","label":"国际证据"}],"k":"b","i":1,"h":"4.1.4 动量效应和反转效应","label":"4.1.4 动量效应和反转效应"}],"k":"sec","i":0,"h":"4.1 一些重要的市场异象","label":"4.1 一些重要的市场异象"},{"t":"4.2 噪声交易和套利限制","c":[{"t":"4.2.1 市场有效性的理论基础","c":[{"t":"三支柱：①所有投资者总是理性的；②即使投资者非理性，其错误互不相关（随机错误相互抵消，不影响市场效率）；③即使错误相关，套利没有限制（高估与低估证券间的价差被充分利用）。三支柱至少一个成立，市场即有效；实证显示理性定价的力量比许多人想象的弱。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三支柱</strong>：①所有投资者总是理性的；②即使投资者非理性，其错误互不相关（随机错误相互抵消，不影响市场效率）；③即使错误相关，套利没有限制（高估与低估证券间的价差被充分利用）。三支柱至少一个成立，市场即有效；实证显示理性定价的力量比许多人想象的弱。","label":"三支柱：①所有投资者总是理性的；②即…"},{"t":"噪声（noise，布莱克Fischer Black，1986年美国金融学会主席演讲）：投资者有时把噪声误认为信息而交易，期望获利而落空；噪声交易不一定有害——它向市场提供流动性，否则依合理信息交易的现金需求型交易将寥寥无几。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">噪声</strong>（noise，布莱克Fischer Black，1986年美国金融学会主席演讲）：投资者有时把噪声误认为信息而交易，期望获利而落空；噪声交易不一定有害——它向市场提供流动性，否则依合理信息交易的现金需求型交易将寥寥无几。","label":"噪声（noise，布莱克Fische…"},{"t":"情绪（sentiment）：大量投资者同时错误地对部分或全部证券估价时，价格被情绪驱动——可视为大量相关的投资者噪声；这类交易者称噪声交易者（noise-traders），大部分散户及部分无突出能力的机构投资者属之；社会力量是重要驱动（席勒：对投机资产的投资是一种社会行为，人们谈论投资、观察他人成败，看法如对食品、政治的看法一样无逻辑地变化）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情绪</strong>（sentiment）：大量投资者同时错误地对部分或全部证券估价时，价格被情绪驱动——可视为大量相关的投资者噪声；这类交易者称噪声交易者（noise-traders），大部分散户及部分无突出能力的机构投资者属之；社会力量是重要驱动（席勒：对投机资产的投资是一种社会行为，人们谈论投资、观察他人成败，看法如对食品、政治的看法一样无逻辑地变化）。","label":"情绪（sentiment）：大量投资…"},{"t":"席勒（1984）启发式均衡模型：市场含聪明投资者（smart-money traders）与噪声交易者两类、单一风险资产（近似整个股市）；聪明投资者需求 q_t=(E_tR_{t+1}-ρ)/φ（ρ为聪明投资者需求为零时的预期回报，φ为风险溢价水平，预期回报恰为φ时持有全部股票），市场出清条件 q_t+n_t=1（n_t为噪声交易者持股比例）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">席勒</strong>（1984）启发式均衡模型：市场含聪明投资者（smart-money traders）与噪声交易者两类、单一风险资产（近似整个股市）；聪明投资者需求 q_t=(E_tR_{t+1}-ρ)/φ（ρ为聪明投资者需求为零时的预期回报，φ为风险溢价水平，预期回报恰为φ时持有全部股票），市场出清条件 q_t+n_t=1（n_t为噪声交易者持股比例）。","label":"席勒（1984）启发式均衡模型：市场…"},{"t":"价格决定（式4-6）：p_t=Σk[E_t(d_{t+k})+φE_t(y_{t-1+k})]/(1+ρ+φ)^k——价格等于预期红利现值加上现在与未来情绪的折现；理性条件下的价格仅为未来红利按折现率δ贴现之和（式4-3）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">价格决定</strong>（式4-6）：p_t=Σk[E_t(d_{t+k})+φE_t(y_{t-1+k})]/(1+ρ+φ)^k——价格等于预期红利现值加上现在与未来情绪的折现；理性条件下的价格仅为未来红利按折现率δ贴现之和（式4-3）。","label":"价格决定"},{"t":"数值例：预期股利恒为1美元、折现率δ=10%，稳态价格10美元；取ρ=0、φ=20%，稳态时聪明投资者与噪声交易者各持一半（q=n=0.5），噪声交易者需求总值稳态y=5美元；若情绪突然翻倍（y由5升至10，此后自t=5年起每年降1美元、t=10年回到稳态），价格立即跳升至约14美元，其后约10年逐渐回落——模型中聪明投资者只减仓让位，并未进行消除错误定价的套利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数值例</strong>：预期股利恒为1美元、折现率δ=10%，稳态价格10美元；取ρ=0、φ=20%，稳态时聪明投资者与噪声交易者各持一半（q=n=0.5），噪声交易者需求总值稳态y=5美元；若情绪突然翻倍（y由5升至10，此后自t=5年起每年降1美元、t=10年回到稳态），价格立即跳升至约14美元，其后约10年逐渐回落——模型中聪明投资者只减仓让位，并未进行消除错误定价的套利。","label":"数值例：预期股利恒为1美元、折现率δ…"},{"t":"教科书式套利（textbook arbitrage）：零成本、无风险、证券完全替代；现实最接近的是外汇三角套利——2008年5月¥/€=159.3403、€/$=0.6455，隐含¥/$=159.3403×0.6455=102.8453；若¥/$仅为100，借1美元兑换0.6455欧元、再换102.8453日元、兑回1.028453美元即锁定无风险利润；但这类机会即使出现也只存续几秒。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">教科书式套利</strong>（textbook arbitrage）：零成本、无风险、证券完全替代；现实最接近的是外汇三角套利——2008年5月¥/€=159.3403、€/$=0.6455，隐含¥/$=159.3403×0.6455=102.8453；若¥/$仅为100，借1美元兑换0.6455欧元、再换102.8453日元、兑回1.028453美元即锁定无风险利润；但这类机会即使出现也只存续几秒。","label":"教科书式套利"},{"t":"（蒙蒂尔）一价定律（law of one price）：同样的物品应有同样的价格，是\"无套利\"的核心；检验一价定律不需要资产定价模型，绕开了检验有效性时的联合假设问题；\"番茄酱经济学\"（萨默斯）——342克番茄酱59便士对570克69便士（单位价差约43%）之所以能存在，只因无人能对番茄酱套利；而金融市场中\"同样的东西不同价\"的重大违背比比皆是（下见4.2.3）。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）一价定律（law of one price）：同样的物品应有同样的价格，是&quot;无套利&quot;的核心；检验一价定律不需要资产定价模型，绕开了检验有效性时的联合假设问题；&quot;番茄酱经济学&quot;（萨默斯）——342克番茄酱59便士对570克69便士（单位价差约43%）之所以能存在，只因无人能对番茄酱套利；而金融市场中&quot;同样的东西不同价&quot;的重大违背比比皆是（下见4.2.3）。","label":"（蒙蒂尔）一价定律（law of o…"}],"k":"b","i":1,"h":"4.2.1 市场有效性的理论基础","label":"4.2.1 市场有效性的理论基础"},{"t":"4.2.2 什么因素限制了套利","c":[{"t":"概览：套利很少像三角套利那样简单，三类潜在问题——基本面风险、噪声交易者风险、操作成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">概览</strong>：套利很少像三角套利那样简单，三类潜在问题——基本面风险、噪声交易者风险、操作成本。","label":"概览：套利很少像三角套利那样简单，三…"},{"t":"基本面风险（fundamental risk）：新信息出现时理性重估的可能性。卖空高估股票者即使判断正确也承担风险——无人能预见的新信息（利好）可能推高价格；若分红超预期，卖空者还须向出借人支付红利；用替代品或价差交易可部分消除：卖空个股同时买入股指期货对冲市场层面风险、买入同行业一篮子股票（不含目标）对冲行业风险，但企业层面几乎不存在完全替代品（如默克突然宣布新药成功只影响自身）——套利因此有风险，错误定价难以被消除。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">基本面风险</strong>（fundamental risk）：新信息出现时理性重估的可能性。卖空高估股票者即使判断正确也承担风险——无人能预见的新信息（利好）可能推高价格；若分红超预期，卖空者还须向出借人支付红利；用替代品或价差交易可部分消除：卖空个股同时买入股指期货对冲市场层面风险、买入同行业一篮子股票（不含目标）对冲行业风险，但企业层面几乎不存在完全替代品（如默克突然宣布新药成功只影响自身）——套利因此有风险，错误定价难以被消除。","label":"基本面风险"},{"t":"噪声交易者风险（noise-trader risk，又称转售价格风险）：错误定价短期内可能错得更离谱。史雷弗-维什尼例：伦敦与法兰克福两份条款完全相同的德国债券期货存在价差，卖高买低貌似锁定利润，但价格不利变动须双向追加保证金；自有资金充足者无碍，资金有限者即使确信套利终将盈利也可能被迫亏本清仓；代人理财者额外面临资金提供方按短期业绩考核、可随时解雇撤资的约束——这使资金管理者不愿第一时间积极套利，形成套利限制（limits to arbitrage）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">噪声交易者风险</strong>（noise-trader risk，又称转售价格风险）：错误定价短期内可能错得更离谱。史雷弗-维什尼例：伦敦与法兰克福两份条款完全相同的德国债券期货存在价差，卖高买低貌似锁定利润，但价格不利变动须双向追加保证金；自有资金充足者无碍，资金有限者即使确信套利终将盈利也可能被迫亏本清仓；代人理财者额外面临资金提供方按短期业绩考核、可随时解雇撤资的约束——这使资金管理者不愿第一时间积极套利，形成套利限制（limits to arbitrage）。","label":"噪声交易者风险"},{"t":"DSSW框架（德隆-史雷弗-萨莫斯-瓦尔德曼，1990）：聪明投资者知道卖出后错误定价仍可能扩大，因而对自己承担的噪声交易者风险要求补偿；有证据表明噪声交易者风险事实上是系统性的（如封闭式基金折价）；\"噪声交易者因不断损失财富而离场、市场趋于有效\"并不必然成立——模型中过度乐观且承担相应风险的噪声交易者可以表现良好并在市场中幸存。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">DSSW框架</strong>（德隆-史雷弗-萨莫斯-瓦尔德曼，1990）：聪明投资者知道卖出后错误定价仍可能扩大，因而对自己承担的噪声交易者风险要求补偿；有证据表明噪声交易者风险事实上是系统性的（如封闭式基金折价）；&quot;噪声交易者因不断损失财富而离场、市场趋于有效&quot;并不必然成立——模型中过度乐观且承担相应风险的噪声交易者可以表现良好并在市场中幸存。","label":"DSSW框架"},{"t":"操作成本（implementation costs）：交易佣金、买卖价差与市场冲击成本（对机构大额而言可忽略）；卖空引入两个问题——可能得不到卖空收益（利息），或根本借不到要卖空的股票；机构与流动性好的股票一般无碍，但存在卖空挤压（short squeeze，空头未达目的即被迫退出）；流动性差的股票可能完全无法建立空头。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">操作成本</strong>（implementation costs）：交易佣金、买卖价差与市场冲击成本（对机构大额而言可忽略）；卖空引入两个问题——可能得不到卖空收益（利息），或根本借不到要卖空的股票；机构与流动性好的股票一般无碍，但存在卖空挤压（short squeeze，空头未达目的即被迫退出）；流动性差的股票可能完全无法建立空头。","label":"操作成本"},{"t":"极端案例1——eToys对Toys \"R\" Us（1999）：eToys收入3000万美元、亏损2800万美元，市值80亿美元；Toys \"R\" Us收入112亿美元、盈利3.76亿美元，市值仅60亿美元——网络股\"非理性繁荣\"（席勒书名源自格林斯潘1996年演讲）下的应卖空错价。","c":[],"k":"b","i":2,"h":"极端案例1——eToys对Toys &quot;R&quot; Us（1999）：eToys收入3000万美元、亏损2800万美元，市值80亿美元；Toys &quot;R&quot; Us收入112亿美元、盈利3.76亿美元，市值仅60亿美元——网络股&quot;非理性繁荣&quot;（席勒书名源自格林斯潘1996年演讲）下的应卖空错价。","label":"极端案例1——eToys对Toys \"R\" Us"},{"t":"极端案例2——3Com分拆Palm（2000年3月2日）：3Com发行Palm 5%股份并宣告将剩余95%配发给现有股东（每股3Com约得1.5股Palm），故应有p(3Com)≥1.5×p(PALM)；Palm首日收95.06美元而3Com仅81.81美元，加总意味着3Com的残余（自有）价值约-220亿美元；错价持续数月——基本面风险可忽略、套利期限明确，唯一障碍是借不到Palm股票卖空；拉蒙特-泰勒：\"这么明显的错误定价，即使最愚蠢的投资者也应该能抓住机会。\"","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">极端案例2——3Com分拆Palm</strong>（2000年3月2日）：3Com发行Palm 5%股份并宣告将剩余95%配发给现有股东（每股3Com约得1.5股Palm），故应有p(3Com)≥1.5×p(PALM)；Palm首日收95.06美元而3Com仅81.81美元，加总意味着3Com的残余（自有）价值约-220亿美元；错价持续数月——基本面风险可忽略、套利期限明确，唯一障碍是借不到Palm股票卖空；拉蒙特-泰勒：&quot;这么明显的错误定价，即使最愚蠢的投资者也应该能抓住机会。&quot;","label":"极端案例2——3Com分拆Palm"},{"t":"（蒙蒂尔）套利者风险的完整分解：①基本面风险——对头寸判断错误、国税局不批准分拆等终止事件（负自有价值交易中约25%未趋同即被终止）；②融资风险/噪声交易者风险，可再分——期限风险（趋同无时间表：米切尔等样本中位92天、最长2796天；同样15%总收益，92天年化47%、46天年化238%、138天仅14%）、保证金风险（不利变动须追加保证金，最优策略是保留加仓余地的较小头寸，朗斯塔夫-刘2001）、抛空回补风险（股票被借出方召回，被迫提前清盘）；③股票借贷市场证据：普通押品（general collateral）费率仅10~25bp，特殊（special）股票平均3.2%、最高82%，最昂贵的20只中17只曾被召回——IPO、低动量股与魅力股最难借、做空成本最高。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）套利者风险的完整分解：①基本面风险——对头寸判断错误、国税局不批准分拆等终止事件（负自有价值交易中约25%未趋同即被终止）；②融资风险/噪声交易者风险，可再分——期限风险（趋同无时间表：米切尔等样本中位92天、最长2796天；同样15%总收益，92天年化47%、46天年化238%、138天仅14%）、保证金风险（不利变动须追加保证金，最优策略是保留加仓余地的较小头寸，朗斯塔夫-刘2001）、抛空回补风险（股票被借出方召回，被迫提前清盘）；③股票借贷市场证据：普通押品（general collateral）费率仅10~25bp，特殊（special）股票平均3.2%、最高82%，最昂贵的20只中17只曾被召回——IPO、低动量股与魅力股最难借、做空成本最高。","label":"（蒙蒂尔）套利者风险的完整分解：①基…"},{"t":"（蒙蒂尔）委托-代理问题与套利（史雷弗-维什尼，1997）：专业套利者管理他人资金造成信息与资金供给分离——资金提供方难以分辨优劣套利者、按过去业绩分配资金、套利者市场细分（只在自己专长的市场操作）；结果：价格偏离基本面最大（套利最被需要、潜在回报最高）时，套利者反而最受限；负回报引发质疑与撤资，可能非自愿清盘并造成资产抛售（fire sale）——LTCM是原型：不到一年前刚退还投资者约27亿美元，危机中再融资仍极困难。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）委托-代理问题与套利（史雷弗-维什尼，1997）：专业套利者管理他人资金造成信息与资金供给分离——资金提供方难以分辨优劣套利者、按过去业绩分配资金、套利者市场细分（只在自己专长的市场操作）；结果：价格偏离基本面最大（套利最被需要、潜在回报最高）时，套利者反而最受限；负回报引发质疑与撤资，可能非自愿清盘并造成资产抛售（fire sale）——LTCM是原型：不到一年前刚退还投资者约27亿美元，危机中再融资仍极困难。","label":"（蒙蒂尔）委托-代理问题与套利（史雷…"},{"t":"（蒙蒂尔）正反馈交易：若噪声交易者行为可预测（追涨杀跌的正反馈交易者），套利者的理性策略是顺势买入、期待更多跟风盘，从而自身成为不稳定力量并加剧错误定价（德隆等，1990）；索罗斯论20世纪60年代企业集团股：最佳策略不是立即做空而是先买入；实验证据：安德烈亚森-克劳斯（价格呈趋势后被试由均值回复转向追势）、布卢姆菲尔德-黑尔斯（对延续序列反应过度、对反转序列反应不足）。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）正反馈交易：若噪声交易者行为可预测（追涨杀跌的正反馈交易者），套利者的理性策略是顺势买入、期待更多跟风盘，从而自身成为不稳定力量并加剧错误定价（德隆等，1990）；索罗斯论20世纪60年代企业集团股：最佳策略不是立即做空而是先买入；实验证据：安德烈亚森-克劳斯（价格呈趋势后被试由均值回复转向追势）、布卢姆菲尔德-黑尔斯（对延续序列反应过度、对反转序列反应不足）。","label":"（蒙蒂尔）正反馈交易：若噪声交易者行…"},{"t":"（蒙蒂尔）噪声交易者的长期生存：进化视角——\"适度\"过度自信或做多的投资者可以在市场中生存甚至主导（王，2001，进化博弈论；基本面风险足够大时尤其如此）；TMT泡沫中悲观的基金经理失去客户、做空者损失惨重；传统金融\"非理性者终将被市场淘汰\"不成立——何况\"从长期来看，我们都已经死了\"（凯恩斯）。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）噪声交易者的长期生存：进化视角——&quot;适度&quot;过度自信或做多的投资者可以在市场中生存甚至主导（王，2001，进化博弈论；基本面风险足够大时尤其如此）；TMT泡沫中悲观的基金经理失去客户、做空者损失惨重；传统金融&quot;非理性者终将被市场淘汰&quot;不成立——何况&quot;从长期来看，我们都已经死了&quot;（凯恩斯）。","label":"（蒙蒂尔）噪声交易者的长期生存：进化…"}],"k":"b","i":1,"h":"4.2.2 什么因素限制了套利","label":"4.2.2 什么因素限制了套利"},{"t":"4.2.3 一价定律的更多违背与股票需求曲线（蒙蒂尔）","c":[{"t":"孪生证券（twin securities）：荷兰皇家/壳牌——1907年按60:40合并税后现金流与控制权，理论平价下荷兰皇家市值应为壳牌的1.5倍，实际偏离在-30%~+20%间摆动；联合利华——1930年对等协议（1英镑=12荷兰盾），偏离-50%~0%；两例均在8~9家交易所上市、流动性极强，任何发达市场的交易成本都无法解释；不收敛的原因是噪声交易者风险（-10%的偏差可能扩大到-25%并触发追加保证金）与缺乏明确的套利闭环；高价股仍有需求——荷兰皇家属标普500而壳牌不属，指数基金必须买入纳入指数的股票。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">孪生证券</strong>（twin securities）：荷兰皇家/壳牌——1907年按60:40合并税后现金流与控制权，理论平价下荷兰皇家市值应为壳牌的1.5倍，实际偏离在-30%~+20%间摆动；联合利华——1930年对等协议（1英镑=12荷兰盾），偏离-50%~0%；两例均在8~9家交易所上市、流动性极强，任何发达市场的交易成本都无法解释；不收敛的原因是噪声交易者风险（-10%的偏差可能扩大到-25%并触发追加保证金）与缺乏明确的套利闭环；高价股仍有需求——荷兰皇家属标普500而壳牌不属，指数基金必须买入纳入指数的股票。","label":"孪生证券"},{"t":"股权分拆与负自有价值：1995-2000年18例高科技分拆中6例出现负自有价值，且在互联网泡沫期集群出现——情绪对股价的作用至少不亚于基本面；供求法则依然成立：卖空受限时，愿意持有高估股票的多头把价格推高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">股权分拆与负自有价值</strong>：1995-2000年18例高科技分拆中6例出现负自有价值，且在互联网泡沫期集群出现——情绪对股价的作用至少不亚于基本面；供求法则依然成立：卖空受限时，愿意持有高估股票的多头把价格推高。","label":"股权分拆与负自有价值"},{"t":"母公司之谜（parent company puzzle）：母公司市值低于其各公开交易部分之和——费里伍德市值低于其持股51%的Computerlinks市值；通用汽车持有休斯电子追踪股与商业一号20%股权，1999年9月至2000年1月两子公司分别上涨97%与413%，2000年3月通用汽车每股75美元中约60美元来自子公司、核心汽车业务仅约1.5倍市盈率；康奈尔-刘（2000）检验7例，唯一解释是股票需求曲线向下倾斜（母公司持股庞大、公众流通盘小，进一步放大了斜率）；对冲组合R方极低，套利成本过高；米切尔-普维诺-斯塔福德（1985-2000年70余例）：至少26%的错价未收敛，多发生在第三方溢价收购子公司（套利者须做空\"昂贵\"一方）时。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">母公司之谜</strong>（parent company puzzle）：母公司市值低于其各公开交易部分之和——费里伍德市值低于其持股51%的Computerlinks市值；通用汽车持有休斯电子追踪股与商业一号20%股权，1999年9月至2000年1月两子公司分别上涨97%与413%，2000年3月通用汽车每股75美元中约60美元来自子公司、核心汽车业务仅约1.5倍市盈率；康奈尔-刘（2000）检验7例，唯一解释是股票需求曲线向下倾斜（母公司持股庞大、公众流通盘小，进一步放大了斜率）；对冲组合R方极低，套利成本过高；米切尔-普维诺-斯塔福德（1985-2000年70余例）：至少26%的错价未收敛，多发生在第三方溢价收购子公司（套利者须做空&quot;昂贵&quot;一方）时。","label":"母公司之谜"},{"t":"封闭式基金折价：基金市价长期偏离资产净值（NAV）且折价持续波动——代理成本、税收负债与流动性不足都不足以解释（施莱弗，2000）；持续性折价是违背一价定律的另一例。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">封闭式基金折价</strong>：基金市价长期偏离资产净值（NAV）且折价持续波动——代理成本、税收负债与流动性不足都不足以解释（施莱弗，2000）；持续性折价是违背一价定律的另一例。","label":"封闭式基金折价"},{"t":"固定收益市场的违背：可赎回债券价格竟高于条款相同的不可赎回组合（朗斯塔夫，1992，错价1.26%）；美国国债相对由财政部担保本息的Refcorp机构债存在高达15%的流动性溢价——受欢迎程度直接影响价格；本息分离债券（STRIPS）本金券与利息券平均价差1.2%、最高2.7%（重组时本金券必须取自原始债券、扮演特殊角色）；新旧发行债券趋同交易（做空on-the-run、买入off-the-run，利差约12bp收敛至3bp）平均利润近零（克里斯纳姆塞，2001）——LTCM因此成名亦因此覆灭。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">固定收益市场的违背</strong>：可赎回债券价格竟高于条款相同的不可赎回组合（朗斯塔夫，1992，错价1.26%）；美国国债相对由财政部担保本息的Refcorp机构债存在高达15%的流动性溢价——受欢迎程度直接影响价格；本息分离债券（STRIPS）本金券与利息券平均价差1.2%、最高2.7%（重组时本金券必须取自原始债券、扮演特殊角色）；新旧发行债券趋同交易（做空on-the-run、买入off-the-run，利差约12bp收敛至3bp）平均利润近零（克里斯纳姆塞，2001）——LTCM因此成名亦因此覆灭。","label":"固定收益市场的违背"},{"t":"股票需求曲线与指数构成：纳入/剔除指数不含任何新信息，但纳入带来显著正向价格效应且随时间增强（施莱弗，1986开创）；替代性差的股票纳入效应高出1.5个百分点（沃格勒-祖拉瓦卡亚，1999）；多伦多交易所自由流通量规则调整（不含信息的供给变动）使31只受影响股票获2.3%异常回报且交易量恢复后不逆转（考尔等，2000）——需求曲线向下倾斜、供给移动影响价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">股票需求曲线与指数构成</strong>：纳入/剔除指数不含任何新信息，但纳入带来显著正向价格效应且随时间增强（施莱弗，1986开创）；替代性差的股票纳入效应高出1.5个百分点（沃格勒-祖拉瓦卡亚，1999）；多伦多交易所自由流通量规则调整（不含信息的供给变动）使31只受影响股票获2.3%异常回报且交易量恢复后不逆转（考尔等，2000）——需求曲线向下倾斜、供给移动影响价格。","label":"股票需求曲线与指数构成"},{"t":"信息不完全：英创远达（EntreMed）——抗癌新药消息5个月前已由《自然》等报道，1998年5月3日《纽约时报》头版复述后股价从约12美元升至85美元、3周后仍高于30美元——公众关注（而非新信息）导致永久性上涨；MCI与MCIC——封闭式基金代码与通信公司相似，MCIC并购公告日前后MCI异常放量（10000股以上换手的24天中有18天）——投资者系统性混淆；公司更名加入\".com\"后5日内异常回报53%（与互联网无关的公司亦达23%，60日内140%）——代表性启发的直接市场后果，市场能有效处理的信息很有限。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信息不完全</strong>：英创远达（EntreMed）——抗癌新药消息5个月前已由《自然》等报道，1998年5月3日《纽约时报》头版复述后股价从约12美元升至85美元、3周后仍高于30美元——公众关注（而非新信息）导致永久性上涨；MCI与MCIC——封闭式基金代码与通信公司相似，MCIC并购公告日前后MCI异常放量（10000股以上换手的24天中有18天）——投资者系统性混淆；公司更名加入&quot;.com&quot;后5日内异常回报53%（与互联网无关的公司亦达23%，60日内140%）——代表性启发的直接市场后果，市场能有效处理的信息很有限。","label":"信息不完全"}],"k":"b","i":1,"h":"4.2.3 一价定律的更多违背与股票需求曲线（蒙蒂尔）","label":"4.2.3 一价定律的更多违背与股票需求曲线"}],"k":"sec","i":0,"h":"4.2 噪声交易和套利限制","label":"4.2 噪声交易和套利限制"},{"t":"4.3 展望","c":[{"t":"现代金融学不能完全解释不确定性下的行为与市场效率检验，需要引入行为视角：经验法则（启发式）在其原领域之外应用会带来系统性错误；投资者还倾向于夸大自身知识与能力、戴有色眼镜看问题、受情绪波动影响——第5章启发式预测和偏差、第6章过度自信、第7章情绪基础将逐一展开。","c":[],"k":"b","i":1,"h":"现代金融学不能完全解释不确定性下的行为与市场效率检验，需要引入行为视角：经验法则（启发式）在其原领域之外应用会带来系统性错误；投资者还倾向于夸大自身知识与能力、戴有色眼镜看问题、受情绪波动影响——第5章启发式预测和偏差、第6章过度自信、第7章情绪基础将逐一展开。","label":"现代金融学不能完全解释不确定性下的行…"}],"k":"sec","i":0,"h":"4.3 展望","label":"4.3 展望"}],"k":"chap","h":"第4章 对市场有效性的挑战","label":"第4章 对市场有效性的挑战"}],"k":"part","h":"第一篇 传统金融、前景理论和市场效率","label":"第一篇 传统金融、前景理论和市场效率","col":"#4f6df5","pc":"p1"},{"t":"第二篇 行为科学的基础","c":[{"t":"第5章 启发式预测和偏差","c":[{"t":"本章要点","c":[{"t":"传统经济金融模型（如CAPM）假设代表性决策者认知能力无限，而真实的人感知会歪曲、记忆会重建、注意力与信息处理能力有限，因而在不确定条件下必须依靠决策捷径。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">传统经济金融模型</strong>（如CAPM）假设代表性决策者认知能力无限，而真实的人感知会歪曲、记忆会重建、注意力与信息处理能力有限，因而在不确定条件下必须依靠决策捷径。","label":"传统经济金融模型"},{"t":"启发式（heuristics）：基于信息集某个子集进行决策的规则；第一类启发式灵活、自发、无意识、省力，适合快速或低风险决策，第二类启发式有意识、费力，适合高风险决策。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">启发式</strong>（heuristics）：基于信息集某个子集进行决策的规则；第一类启发式灵活、自发、无意识、省力，适合快速或低风险决策，第二类启发式有意识、费力，适合高风险决策。","label":"启发式（heuristics）：基于…"},{"t":"一族启发式源于人们对安逸的追求并影响偏好：熟悉度、模糊厌恶、多元启发式、安于现状偏差与禀赋效应。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">一族启发式源于人们对安逸的追求并影响偏好</strong>：熟悉度、模糊厌恶、多元启发式、安于现状偏差与禀赋效应。","label":"一族启发式源于人们对安逸的追求并影响偏好"},{"t":"代表性启发式（representativeness heuristic）依据A与B的相似程度估计概率，是最重要、研究最多的启发式，衍生出联合谬误、基率忽视、赌徒谬误与热手幻觉、高估可预测性等偏差。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">代表性启发式</strong>（representativeness heuristic）依据A与B的相似程度估计概率，是最重要、研究最多的启发式，衍生出联合谬误、基率忽视、赌徒谬误与热手幻觉、高估可预测性等偏差。","label":"代表性启发式"},{"t":"贝叶斯法则（Bayes' rule）提供了基于新信息最优更新概率的规范方法，而现实中人们往往忽视基础概率、过度倚重样本数据。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">贝叶斯法则</strong>（Bayes&#x27; rule）提供了基于新信息最优更新概率的规范方法，而现实中人们往往忽视基础概率、过度倚重样本数据。","label":"贝叶斯法则"},{"t":"可得性启发式（availability heuristic）使人们认为容易想起的事件更可能发生；近因偏差与显著性偏差会强化这一错觉。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">可得性启发式</strong>（availability heuristic）使人们认为容易想起的事件更可能发生；近因偏差与显著性偏差会强化这一错觉。","label":"可得性启发式"},{"t":"锚定（anchoring）：人们从初始值出发调整估计且调整常常不充分，锚甚至可以是与问题完全无关的数字。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">锚定</strong>（anchoring）：人们从初始值出发调整估计且调整常常不充分，锚甚至可以是与问题完全无关的数字。","label":"锚定（anchoring）：人们从初…"},{"t":"人们是\"粗糙校准\"的：观念非黑即白、没有灰色地带，这解释了基率忽视（对样本反应过度）与锚定（对样本关注不足）表面上矛盾的现象。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">人们是&quot;粗糙校准&quot;的</strong>：观念非黑即白、没有灰色地带，这解释了基率忽视（对样本反应过度）与锚定（对样本关注不足）表面上矛盾的现象。","label":"人们是\"粗糙校准\"的"},{"t":"吉格伦泽等提出快速节俭启发式（fast and frugal heuristics），以有限理性与生态理性批判\"启发式和偏差\"研究纲领；对方回应：启发式应用于原有领域之外时会产生系统性偏差，进化也不保证最优。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">吉格伦泽等提出快速节俭启发式</strong>（fast and frugal heuristics），以有限理性与生态理性批判&quot;启发式和偏差&quot;研究纲领；对方回应：启发式应用于原有领域之外时会产生系统性偏差，进化也不保证最优。","label":"吉格伦泽等提出快速节俭启发式"},{"t":"金融启示：熟悉度导致本土证券过度投资、\"好公司就是好投资\"源于高估可预测性、锚定使人固守旧观点、可得性使投资者追逐媒体焦点股、多元启发式与安于现状扭曲养老金配置、信息过载压低参与率。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">金融启示</strong>：熟悉度导致本土证券过度投资、&quot;好公司就是好投资&quot;源于高估可预测性、锚定使人固守旧观点、可得性使投资者追逐媒体焦点股、多元启发式与安于现状扭曲养老金配置、信息过载压低参与率。","label":"金融启示"},{"t":"模糊厌恶的另一面是对熟悉事物的偏好：401(K)计划中配置占比第二高的资产是本公司股票，可口可乐员工将76%的退休金可自由支配份额投入自家股票、理由是过去表现不错，但实证显示是否配置自家股票与随后回报无关（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">模糊厌恶的另一面是对熟悉事物的偏好</strong>：401(K)计划中配置占比第二高的资产是本公司股票，可口可乐员工将76%的退休金可自由支配份额投入自家股票、理由是过去表现不错，但实证显示是否配置自家股票与随后回报无关（蒙蒂尔）。","label":"模糊厌恶的另一面是对熟悉事物的偏好"},{"t":"本土偏好与本地偏好普遍存在：美国、英国、日本70%至90%的股票投资集中在国内；基金经理每10只股票中有1只因与公司同城而选中，本地电话公司\"小贝尔\"的股东几乎在所有州都集中于本地（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本土偏好与本地偏好普遍存在</strong>：美国、英国、日本70%至90%的股票投资集中在国内；基金经理每10只股票中有1只因与公司同城而选中，本地电话公司&quot;小贝尔&quot;的股东几乎在所有州都集中于本地（蒙蒂尔）。","label":"本土偏好与本地偏好普遍存在"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"5.1 感知、记忆和启发","c":[{"t":"5.1.1 感知","c":[{"t":"感知（perception）：把信息\"下载\"并储存到\"人类计算机\"的过程，经常出错，具有选择性，个人期望与感知密切相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">感知</strong>（perception）：把信息&quot;下载&quot;并储存到&quot;人类计算机&quot;的过程，经常出错，具有选择性，个人期望与感知密切相关。","label":"感知（perception）：把信息…"},{"t":"黑色心形扑克牌实验：多数人把黑色心形看成正常的红心或黑桃——人们\"看到\"自己希望看到的事物。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">黑色心形扑克牌实验</strong>：多数人把黑色心形看成正常的红心或黑桃——人们&quot;看到&quot;自己希望看到的事物。","label":"黑色心形扑克牌实验"},{"t":"达特茅斯学院与普林斯顿大学的粗暴橄榄球赛后，仅36%的达特茅斯学生认为过错在本校，而86%的普林斯顿学生认为是达特茅斯队挑起事端——同一事件、相反的\"事实\"。","c":[],"k":"b","i":2,"h":"达特茅斯学院与普林斯顿大学的粗暴橄榄球赛后，仅36%的达特茅斯学生认为过错在本校，而86%的普林斯顿学生认为是达特茅斯队挑起事端——同一事件、相反的&quot;事实&quot;。","label":"达特茅斯学院与普林斯顿大学的粗暴橄榄…"},{"t":"认知失调（cognitive dissonance）：人们有动机降低或避免心理上的不一致，通常为了提升积极的自我形象；加拿大选举投票实验显示，投票后受访者更相信所支持的候选人最佳且将获胜——行为与观点无意识地合并。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">认知失调</strong>（cognitive dissonance）：人们有动机降低或避免心理上的不一致，通常为了提升积极的自我形象；加拿大选举投票实验显示，投票后受访者更相信所支持的候选人最佳且将获胜——行为与观点无意识地合并。","label":"认知失调"}],"k":"b","i":1,"h":"5.1.1 感知","label":"5.1.1 感知"},{"t":"5.1.2 记忆","c":[{"t":"记忆（memory）具有重建性，并非像硬盘一样存取：目击事件后接收的误导性信息通常会包含进记忆之中。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">记忆</strong>（memory）具有重建性，并非像硬盘一样存取：目击事件后接收的误导性信息通常会包含进记忆之中。","label":"记忆（memory）具有重建性，并非…"},{"t":"记忆强度可变：引起情绪急剧波动的正面或负面事件会留下深刻记忆。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">记忆强度可变</strong>：引起情绪急剧波动的正面或负面事件会留下深刻记忆。","label":"记忆强度可变"},{"t":"因为愉悦情绪令人更快乐，人们会\"重写历史\"，倾向于高估自己对事态的控制力与过去的判断力——由此引出事后聪明偏差（hindsight bias，\"我们自始至终都知道是这样的\"，第6章深入讨论）。","c":[],"k":"b","i":2,"h":"因为愉悦情绪令人更快乐，人们会&quot;重写历史&quot;，倾向于高估自己对事态的控制力与过去的判断力——由此引出事后聪明偏差（hindsight bias，&quot;我们自始至终都知道是这样的&quot;，第6章深入讨论）。","label":"因为愉悦情绪令人更快乐，人们会\"重写…"}],"k":"b","i":1,"h":"5.1.2 记忆","label":"5.1.2 记忆"},{"t":"5.1.3 框定效应","c":[{"t":"框定效应（framing effect）：感知与记忆受信息的呈现方式（框定）影响，是金融决策存在框定依赖的重要原因。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">框定效应</strong>（fr
