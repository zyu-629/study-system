大多数交易没有带来利润，交易可能基于错误判断而非准确的信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：牛市中各五分位组的毛收益与净收益都不错；但额外交易仅带来毛收益的小幅改善，净收益却下降——绝大多数交易没有带来利润，交易可能基于错误判断而非准确的信息。","label":"结果：牛市中各五分位组的毛收益与净收…"},{"t":"风险调整：考虑交易成本、买卖价差与不同风险后，全体投资者净年收益低于市场3.00%，交易量最高的20%投资者低于市场约10%——排除了\"高收益只是风险补偿\"的解释。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">风险调整</strong>：考虑交易成本、买卖价差与不同风险后，全体投资者净年收益低于市场3.00%，交易量最高的20%投资者低于市场约10%——排除了&quot;高收益只是风险补偿&quot;的解释。","label":"风险调整"}],"k":"b","i":1,"h":"<strong class=\"lead\">9.1.2 现实的证据</strong>：巴伯-奥迪安（Barber &amp; Odean, 2000）","label":"9.1.2 现实的证据"},{"t":"9.1.3 问卷调查和实验室的证据","c":[{"t":"动机：市场数据一般缺乏心理测度，难以清晰检验过度自信与交易行为的潜在关联，故需问卷与实验补足。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">动机</strong>：市场数据一般缺乏心理测度，难以清晰检验过度自信与交易行为的潜在关联，故需问卷与实验补足。","label":"动机：市场数据一般缺乏心理测度，难以…"},{"t":"格拉泽-韦伯（Glaser & Weber）：在线佣金账户数据＋心理测量问卷；自我感觉良好效应最强的投资者交易更频繁，但基于校准的过度自信与过度交易没有类似联系（两类测度相关性弱，可能是不同构念）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">格拉泽-韦伯</strong>（Glaser &amp; Weber）：在线佣金账户数据＋心理测量问卷；自我感觉良好效应最强的投资者交易更频繁，但基于校准的过度自信与过度交易没有类似联系（两类测度相关性弱，可能是不同构念）。","label":"格拉泽-韦伯"},{"t":"格林布拉特-基洛哈朱（Grinblatt & Keloharju）：芬兰股票交易数据；以超速驾驶罚单数作为感觉诉求的代理变量，以兵役入伍心理测验作为过度自信测度（更接近自我感觉良好效应）；交易频率与两者均正相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">格林布拉特-基洛哈朱</strong>（Grinblatt &amp; Keloharju）：芬兰股票交易数据；以超速驾驶罚单数作为感觉诉求的代理变量，以兵役入伍心理测验作为过度自信测度（更接近自我感觉良好效应）；交易频率与两者均正相关。","label":"格林布拉特-基洛哈朱"},{"t":"比埃斯等（Biais, Hilton, Mazurier & Pouget, 2005）：交易前测度校准型过度自信与自我监控；过度自信没有显著提升交易强度，却显著减少了利润；自我控制能力强者赚得更多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">比埃斯等</strong>（Biais, Hilton, Mazurier &amp; Pouget, 2005）：交易前测度校准型过度自信与自我监控；过度自信没有显著提升交易强度，却显著减少了利润；自我控制能力强者赚得更多。","label":"比埃斯等"},{"t":"迪弗斯等（Deaves, Lüders & Luo, 2008）：实验设计引致被试认为自己的信息比别人更有价值；错误校准与自我感觉良好效应导致更多交易，控制幻觉无显著效应；年长者（p=0.016）与受过金融教育者（p=0.003）交易较少，有实际交易经验且觉得交易轻松愉快者成交量更高（p=0.023）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">迪弗斯等</strong>（Deaves, Lüders &amp; Luo, 2008）：实验设计引致被试认为自己的信息比别人更有价值；错误校准与自我感觉良好效应导致更多交易，控制幻觉无显著效应；年长者（p=0.016）与受过金融教育者（p=0.003）交易较少，有实际交易经验且觉得交易轻松愉快者成交量更高（p=0.023）。","label":"迪弗斯等"}],"k":"b","i":1,"h":"9.1.3 问卷调查和实验室的证据","label":"9.1.3 问卷调查和实验室的证据"}],"k":"sec","i":0,"h":"9.1 过度自信和过度交易","label":"9.1 过度自信和过度交易"},{"t":"9.2 人口统计和动态","c":[{"t":"9.2.1 金融领域中的性别和过度自信","c":[{"t":"巴伯-奥迪安（Barber & Odean, 2001）：男性平均比女性多交易45%，净回报因此多下降0.94%；单身男性比单身女性多交易67%，净回报多下降1.44%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">巴伯-奥迪安</strong>（Barber &amp; Odean, 2001）：男性平均比女性多交易45%，净回报因此多下降0.94%；单身男性比单身女性多交易67%，净回报多下降1.44%。","label":"巴伯-奥迪安"},{"t":"对男女投资经理和男女商科学生的对比仅发现性别、交易行为与过度自信之间的微小差别，可能因为金融和经商领域吸引了相对更自信的女性（自我选择）。","c":[],"k":"b","i":2,"h":"对男女投资经理和男女商科学生的对比仅发现性别、交易行为与过度自信之间的微小差别，可能因为金融和经商领域吸引了相对更自信的女性（自我选择）。","label":"对男女投资经理和男女商科学生的对比仅…"}],"k":"b","i":1,"h":"9.2.1 金融领域中的性别和过度自信","label":"9.2.1 金融领域中的性别和过度自信"},{"t":"9.2.2 市场参与者过度自信的动态过程","c":[{"t":"问题：专业人士经常做公开预测（盈利、GDP、市场水平），他们会从错误中学习并对自身知识水平形成准确认知吗？认知失调促使人们忘记不愉快或偏离本意的事物；自我归因偏差润色并保留成功记忆；事后聪明偏差理想化过去的信念；证实偏差寻找迎合先验的证据——这些力量削弱了消除过度自信的反馈。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题</strong>：专业人士经常做公开预测（盈利、GDP、市场水平），他们会从错误中学习并对自身知识水平形成准确认知吗？认知失调促使人们忘记不愉快或偏离本意的事物；自我归因偏差润色并保留成功记忆；事后聪明偏差理想化过去的信念；证实偏差寻找迎合先验的证据——这些力量削弱了消除过度自信的反馈。","label":"问题：专业人士经常做公开预测（盈利、…"},{"t":"格维斯-奥迪安（Gervais & Odean, 2001）多期模型：过去的成功通过自我归因偏差强化过度自信，过去的失败则降低过度自信；推论——本领域成功者比新入市者更自信。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">格维斯-奥迪安</strong>（Gervais &amp; Odean, 2001）多期模型：过去的成功通过自我归因偏差强化过度自信，过去的失败则降低过度自信；推论——本领域成功者比新入市者更自信。","label":"格维斯-奥迪安"},{"t":"期货市场研究：未发现与交易行为相联系的成本（推断这些交易者并不过度自信）；但纪律松散的交易者较少成功，或许因过度自信而忽视了新的公开信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">期货市场研究</strong>：未发现与交易行为相联系的成本（推断这些交易者并不过度自信）；但纪律松散的交易者较少成功，或许因过度自信而忽视了新的公开信息。","label":"期货市场研究"},{"t":"德国DAX预测者研究：要求预测DAX未来值并给出90%置信区间，被试存在惊人的过度自信；但动态调整更像理性而非自我归因（预测成功后收窄置信区间、失败后放宽）；市场经验使过度自信更加严重——经验是一把双刃剑，连续成功（好运）的幸存者经由自我归因偏差提高了过度自信。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">德国DAX预测者研究</strong>：要求预测DAX未来值并给出90%置信区间，被试存在惊人的过度自信；但动态调整更像理性而非自我归因（预测成功后收窄置信区间、失败后放宽）；市场经验使过度自信更加严重——经验是一把双刃剑，连续成功（好运）的幸存者经由自我归因偏差提高了过度自信。","label":"德国DAX预测者研究"},{"t":"与行情的联系：过度自信随整体股票市场的上涨而增加；滞后市场回报率与交易量（过度自信的代理变量）正相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与行情的联系</strong>：过度自信随整体股票市场的上涨而增加；滞后市场回报率与交易量（过度自信的代理变量）正相关。","label":"与行情的联系"}],"k":"b","i":1,"h":"9.2.2 市场参与者过度自信的动态过程","label":"9.2.2 市场参与者过度自信的动态过程"}],"k":"sec","i":0,"h":"9.2 人口统计和动态","label":"9.2 人口统计和动态"},{"t":"9.3 分散化不足和承担过多风险","c":[{"t":"术语：分散化不足（underdiversification）：持股过少、组合远未达到合理分散水平的投资行为。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：分散化不足（underdiversification）：持股过少、组合远未达到合理分散水平的投资行为。","label":"术语：分散化不足（underdive…"},{"t":"术语：本土偏差（home bias）：偏重投资本土或熟悉范围资产、忽视更广泛分散机会的倾向。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：本土偏差（home bias）：偏重投资本土或熟悉范围资产、忽视更广泛分散机会的倾向。","label":"术语：本土偏差（home bias）…"},{"t":"模型逻辑：分散不足的人面对好坏消息会过快地高估或低估证券，导致多样化不充分；绝大多数散户缺乏时间分析大量证券，只研究几只股票，一旦确信选中胜者便不愿\"稀释\"于未研究过的组合。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">模型逻辑</strong>：分散不足的人面对好坏消息会过快地高估或低估证券，导致多样化不充分；绝大多数散户缺乏时间分析大量证券，只研究几只股票，一旦确信选中胜者便不愿&quot;稀释&quot;于未研究过的组合。","label":"模型逻辑"},{"t":"经验证据（Kelly, 1995）：对超过3000户美国家庭资产组合的研究发现大部分个人并不持有股票；持股的600多人中组合股票数中位数仅为1；仅约5%的家庭持有10只或更多；实现合理分散最好持有超过10只（最好分布于经济的不同部门）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经验证据</strong>（Kelly, 1995）：对超过3000户美国家庭资产组合的研究发现大部分个人并不持有股票；持股的600多人中组合股票数中位数仅为1；仅约5%的家庭持有10只或更多；实现合理分散最好持有超过10只（最好分布于经济的不同部门）。","label":"经验证据"},{"t":"戈茨曼-库玛尔（Goetzmann & Kumar）：谙熟金融者分散化不足较轻；分散化随收入、财富和年龄的增加而增加；交易量最大者最可能分散不足——过度自信或许是交易过度与分散化不足的共同驱动力；对价格趋势敏感和易受本土偏差影响者分散不足更严重（也是投资经验不足的标签）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">戈茨曼-库玛尔</strong>（Goetzmann &amp; Kumar）：谙熟金融者分散化不足较轻；分散化随收入、财富和年龄的增加而增加；交易量最大者最可能分散不足——过度自信或许是交易过度与分散化不足的共同驱动力；对价格趋势敏感和易受本土偏差影响者分散不足更严重（也是投资经验不足的标签）。","label":"戈茨曼-库玛尔"},{"t":"过度风险承担：分散化不足等价于把过多资金投向并不存在确切高回报的证券；处置效应与过度自信相关——过度自信的交易者固执己见、贬低推动价格下跌的公共信息而坚定持有，承担过多风险暴露；期货日中失利的交易者会增加风险头寸且随后表现更差。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度风险承担</strong>：分散化不足等价于把过多资金投向并不存在确切高回报的证券；处置效应与过度自信相关——过度自信的交易者固执己见、贬低推动价格下跌的公共信息而坚定持有，承担过多风险暴露；期货日中失利的交易者会增加风险头寸且随后表现更差。","label":"过度风险承担"}],"k":"sec","i":0,"h":"9.3 分散化不足和承担过多风险","label":"9.3 分散化不足和承担过多风险"},{"t":"9.4 过度乐观主义和分析师","c":[{"t":"现象：分析师倾向于对所覆盖公司的表现过度乐观，美国和其他国家同样存在。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">现象</strong>：分析师倾向于对所覆盖公司的表现过度乐观，美国和其他国家同样存在。","label":"现象：分析师倾向于对所覆盖公司的表现…"},{"t":"证据（Jegadeesh & Kim, 2006）：1993—2002年G7分析师建议分布中，买入类远多于卖出类；美国最显著（强力买入+买入合计约62.2%，卖出/强力卖出仅3.3%），德国最不显著（约38.6%对19.9%）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">证据</strong>（Jegadeesh &amp; Kim, 2006）：1993—2002年G7分析师建议分布中，买入类远多于卖出类；美国最显著（强力买入+买入合计约62.2%，卖出/强力卖出仅3.3%），德国最不显著（约38.6%对19.9%）。","label":"证据（Jegadeesh & Kim…"},{"t":"解释：过度乐观是一种解释，另一种是迎合潜在发行者的利益冲突（第12章重温）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">解释</strong>：过度乐观是一种解释，另一种是迎合潜在发行者的利益冲突（第12章重温）。","label":"解释：过度乐观是一种解释，另一种是迎…"}],"k":"sec","i":0,"h":"9.4 过度乐观主义和分析师","label":"9.4 过度乐观主义和分析师"}],"k":"chap","h":"第9章 金融决策过度自信的含义","label":"第9章 金融决策过度自信的含义"},{"t":"第10章 个人投资者和情绪的力量","c":[{"t":"本章要点","c":[{"t":"一些研究者认为投资者的情绪会转化成市场的情绪，进而影响市场结果；在情绪与风险态度之间的关系尚未完全弄清之前，这些结论需要谨慎解读。","c":[],"k":"b","i":1,"h":"一些研究者认为投资者的情绪会转化成市场的情绪，进而影响市场结果；在情绪与风险态度之间的关系尚未完全弄清之前，这些结论需要谨慎解读。","label":"一些研究者认为投资者的情绪会转化成市…"},{"t":"许多证据显示自豪和后悔这两个情绪对个人金融决策有显著影响。","c":[],"k":"b","i":1,"h":"许多证据显示自豪和后悔这两个情绪对个人金融决策有显著影响。","label":"许多证据显示自豪和后悔这两个情绪对个…"},{"t":"根据处置效应，人们会在盈利时过早售卖，而在亏损时持有过久；经验证据记录了这种倾向。","c":[],"k":"b","i":1,"h":"根据处置效应，人们会在盈利时过早售卖，而在亏损时持有过久；经验证据记录了这种倾向。","label":"根据处置效应，人们会在盈利时过早售卖…"},{"t":"处置效应传统上由前景理论加以解释：因为价值函数的形态，失利的投资者风险规避程度更低，更有可能持有这些股票。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">处置效应传统上由前景理论加以解释</strong>：因为价值函数的形态，失利的投资者风险规避程度更低，更有可能持有这些股票。","label":"处置效应传统上由前景理论加以解释"},{"t":"近来的理论争论和实验证据显示，较低的风险规避程度源于\"后悔\"这一情绪，这为处置效应提供了较好的解释。","c":[],"k":"b","i":1,"h":"近来的理论争论和实验证据显示，较低的风险规避程度源于&quot;后悔&quot;这一情绪，这为处置效应提供了较好的解释。","label":"近来的理论争论和实验证据显示，较低的…"},{"t":"根据赌场资金效应，投资者在获利之后会变得不那么风险规避。","c":[],"k":"b","i":1,"h":"根据赌场资金效应，投资者在获利之后会变得不那么风险规避。","label":"根据赌场资金效应，投资者在获利之后会…"},{"t":"失利后，蛇咬效应（人们更不可能冒险）与收支平衡效应（人们更愿冒险）在不同方向上运转，而后者一般居于主导地位。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">失利后，蛇咬效应</strong>（人们更不可能冒险）与收支平衡效应（人们更愿冒险）在不同方向上运转，而后者一般居于主导地位。","label":"失利后，蛇咬效应"},{"t":"决策的路径依赖表明人们有时会整合序贯赌博，对大型游戏节目参与者决策的研究证实了这一点。","c":[],"k":"b","i":1,"h":"决策的路径依赖表明人们有时会整合序贯赌博，对大型游戏节目参与者决策的研究证实了这一点。","label":"决策的路径依赖表明人们有时会整合序贯…"},{"t":"情感反映了一个人对刺激的印象和评估；因为人们对事物的看法与情感经历有关，情感对决策过程有着重要影响。","c":[],"k":"b","i":1,"h":"情感反映了一个人对刺激的印象和评估；因为人们对事物的看法与情感经历有关，情感对决策过程有着重要影响。","label":"情感反映了一个人对刺激的印象和评估；…"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"引言","c":[{"t":"市场波动一般归因于投资者情绪，但如何从产生市场结果的基本面中区分情绪的影响并不容易；情绪有认知、心理和演化几方面（第7章），且被论证在平静时有助于而非阻碍决策；本章考察情绪的各个方面如何在金融领域影响个人决策行为。","c":[],"k":"b","i":1,"h":"市场波动一般归因于投资者情绪，但如何从产生市场结果的基本面中区分情绪的影响并不容易；情绪有认知、心理和演化几方面（第7章），且被论证在平静时有助于而非阻碍决策；本章考察情绪的各个方面如何在金融领域影响个人决策行为。","label":"市场波动一般归因于投资者情绪，但如何…"}],"k":"sec","i":0,"h":"引言","label":"引言"},{"t":"10.1 投资者的心情能代表市场境况吗","c":[{"t":"术语：情绪低落（depression）：具有一定生理基础、即使没有认知评估也会发生的长期消极状态，不同于一般的糟糕心情。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：情绪低落（depression）：具有一定生理基础、即使没有认知评估也会发生的长期消极状态，不同于一般的糟糕心情。","label":"术语：情绪低落（depression…"},{"t":"总量层面的情绪证据：希勒在《非理性繁荣》中认为\"投资者投资时的情绪状态是导致牛市最重要的一个因素\"；26个国际证券交易所的数据显示清晨阳光带来的好心情对应较高的股票回报（Hirshleifer & Shumway）；夏时制打乱交易者睡眠模式时股市下跌（Kamstra等）；世界杯淘汰赛失利后，失利国家的市场显著下跌（Edmans等）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总量层面的情绪证据</strong>：希勒在《非理性繁荣》中认为&quot;投资者投资时的情绪状态是导致牛市最重要的一个因素&quot;；26个国际证券交易所的数据显示清晨阳光带来的好心情对应较高的股票回报（Hirshleifer &amp; Shumway）；夏时制打乱交易者睡眠模式时股市下跌（Kamstra等）；世界杯淘汰赛失利后，失利国家的市场显著下跌（Edmans等）。","label":"总量层面的情绪证据"},{"t":"保留意见：总量研究是否证明个人行为转化为市场结果仍有争议——即使人们在阳光充足的日子非理性乐观，市场行为仍可与理性定价相一致。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">保留意见</strong>：总量研究是否证明个人行为转化为市场结果仍有争议——即使人们在阳光充足的日子非理性乐观，市场行为仍可与理性定价相一致。","label":"保留意见"},{"t":"未解之谜：尚无刻画情绪与风险态度关系的简单方法。开心的人更乐观、认为好事更可能发生，却更少真正参加赌博（不想破坏好心情，反而更风险规避）；心情低落者有的更冒险（鲁莽驾车、酗酒），有的更避险；情绪低落与风险规避的联系悬而未决（焦虑与低落症状之间的相关性可能是根源），需要神经科学的进一步研究（第20章）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">未解之谜</strong>：尚无刻画情绪与风险态度关系的简单方法。开心的人更乐观、认为好事更可能发生，却更少真正参加赌博（不想破坏好心情，反而更风险规避）；心情低落者有的更冒险（鲁莽驾车、酗酒），有的更避险；情绪低落与风险规避的联系悬而未决（焦虑与低落症状之间的相关性可能是根源），需要神经科学的进一步研究（第20章）。","label":"未解之谜"},{"t":"相关线索：把白天变短引起的低落情绪与市场周期联系起来的研究，关于风险态度与情绪低落之间联系的证据也未给出明确说法。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">相关线索</strong>：把白天变短引起的低落情绪与市场周期联系起来的研究，关于风险态度与情绪低落之间联系的证据也未给出明确说法。","label":"相关线索"}],"k":"sec","i":0,"h":"10.1 投资者的心情能代表市场境况吗","label":"10.1 投资者的心情能代表市场境况吗"},{"t":"10.2 自豪和后悔","c":[{"t":"术语：后悔（regret）：因糟糕的投资决策而期望当初另作选择时体验的消极情绪；把事实告诉配偶、朋友或同事会放大这种消极感受。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：后悔（regret）：因糟糕的投资决策而期望当初另作选择时体验的消极情绪；把事实告诉配偶、朋友或同事会放大这种消极感受。","label":"术语：后悔（regret）：因糟糕的…"},{"t":"术语：自豪（pride）：后悔的另一面，交易大赚时体验的积极情绪。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：自豪（pride）：后悔的另一面，交易大赚时体验的积极情绪。","label":"术语：自豪（pride）：后悔的另一…"},{"t":"不对称性：人们极力避免出现后悔的感觉，对消极情绪（后悔）有着强烈的抵触。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">不对称性</strong>：人们极力避免出现后悔的感觉，对消极情绪（后悔）有着强烈的抵触。","label":"不对称性"},{"t":"与风险寻求的联系：处于损失区域而变得风险偏好，或许正是想避免失败带来的后悔；彩票效应（低概率的大赚）让人觉得凭本事克服了所有困难、可向朋友炫耀精明，自豪感使人更加冒险。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">与风险寻求的联系</strong>：处于损失区域而变得风险偏好，或许正是想避免失败带来的后悔；彩票效应（低概率的大赚）让人觉得凭本事克服了所有困难、可向朋友炫耀精明，自豪感使人更加冒险。","label":"与风险寻求的联系"}],"k":"sec","i":0,"h":"10.2 自豪和后悔","label":"10.2 自豪和后悔"},{"t":"10.3 处置效应","c":[{"t":"术语：处置效应（disposition effect）：投资者过早卖掉表现良好的股票而持有亏损股票太久的倾向。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：处置效应（disposition effect）：投资者过早卖掉表现良好的股票而持有亏损股票太久的倾向。","label":"术语：处置效应（dispositio…"},{"t":"术语：获利套现比例（proportion of gains realized, PGR）：已实现收益/(已实现收益+账面收益)。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：获利套现比例（proportion of gains realized, PGR）：已实现收益/(已实现收益+账面收益)。","label":"术语：获利套现比例（proporti…"},{"t":"术语：亏损套现比例（proportion of losses realized, PLR）：已实现损失/(已实现损失+账面损失)。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：亏损套现比例（proportion of losses realized, PLR）：已实现损失/(已实现损失+账面损失)。","label":"术语：亏损套现比例（proporti…"},{"t":"术语：心理账户（mental accounting）：把不同投资分账独立评估，导致难以在心理上接受实现亏损。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：心理账户（mental accounting）：把不同投资分账独立评估，导致难以在心理上接受实现亏损。","label":"术语：心理账户（mental acc…"},{"t":"术语：税收互换（tax swap）：卖出亏损股票同时买进另一只相似风险的股票，在不改变组合风险暴露的情况下实现税收收益。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：税收互换（tax swap）：卖出亏损股票同时买进另一只相似风险的股票，在不改变组合风险暴露的情况下实现税收收益。","label":"术语：税收互换（tax swap）：…"},{"t":"10.3.1 经验证据：奥迪安（Odean, 1998）","c":[{"t":"数据：1987—1993年10000个折扣经纪账户的近100000次交易；以每只证券的购买价格（多重交易下为平均购买价）为参照点，与前景理论一致。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数据</strong>：1987—1993年10000个折扣经纪账户的近100000次交易；以每只证券的购买价格（多重交易下为平均购买价）为参照点，与前景理论一致。","label":"数据：1987—1993年10000…"},{"t":"度量：PGR=已实现收益/(已实现收益+账面收益)；PLR=已实现损失/(已实现损失+账面损失)；以\"卖出占机会\"的比率解决牛市中赚钱股票天然卖得多的干扰，检验PGR>PLR。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">度量</strong>：PGR=已实现收益/(已实现收益+账面收益)；PLR=已实现损失/(已实现损失+账面损失)；以&quot;卖出占机会&quot;的比率解决牛市中赚钱股票天然卖得多的干扰，检验PGR&gt;PLR。","label":"度量：PGR=已实现收益/(已实现收…"},{"t":"结果：全年PGR=0.148对PLR=0.098（差异显著，|t|=35），获利卖出的倾向明显更高；12月因税损卖出而例外（PLR=0.128反高于PGR=0.108），其余11个月处置效应居主导（PGR=0.152对PLR=0.094）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：全年PGR=0.148对PLR=0.098（差异显著，|t|=35），获利卖出的倾向明显更高；12月因税损卖出而例外（PLR=0.128反高于PGR=0.108），其余11个月处置效应居主导（PGR=0.152对PLR=0.094）。","label":"结果：全年PGR=0.148对PLR…"},{"t":"理性解释的排除：组合再平衡并非值得重视的偏差；长期反转论不成立——投资者卖掉的是中期而非长期胜者、持有的是中期而非长期败者，恰好做反；一年后卖掉的胜者经风险调整收益超过持有的败者3.41%，故称\"胜者卖得太快、败者持有太久\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理性解释的排除</strong>：组合再平衡并非值得重视的偏差；长期反转论不成立——投资者卖掉的是中期而非长期胜者、持有的是中期而非长期败者，恰好做反；一年后卖掉的胜者经风险调整收益超过持有的败者3.41%，故称&quot;胜者卖得太快、败者持有太久&quot;。","label":"理性解释的排除"}],"k":"b","i":1,"h":"<strong class=\"lead\">10.3.1 经验证据</strong>：奥迪安（Odean, 1998）","label":"10.3.1 经验证据"},{"t":"10.3.2 前景理论作为处置效应的一个解释","c":[{"t":"谢弗林-斯塔特曼（Shefrin & Statman, 1985）的两类解释：前景理论（与心理账户）；后悔规避（与自我控制问题）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">谢弗林-斯塔特曼</strong>（Shefrin &amp; Statman, 1985）的两类解释：前景理论（与心理账户）；后悔规避（与自我控制问题）。","label":"谢弗林-斯塔特曼"},{"t":"前景理论逻辑：经历较大获利后（D）转入价值函数的风险规避区域，只有财富的巨大反转才会复原；经历较大失利后（A）转入风险寻求区域——失利者风险规避程度更低，因此更可能继续持有亏损股票。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">前景理论逻辑</strong>：经历较大获利后（D）转入价值函数的风险规避区域，只有财富的巨大反转才会复原；经历较大失利后（A）转入风险寻求区域——失利者风险规避程度更低，因此更可能继续持有亏损股票。","label":"前景理论逻辑"},{"t":"心理账户与税收互换：若按心理账户分账评估各只股票，税收互换意味着在心理上实现账户亏损，许多人难以做到。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">心理账户与税收互换</strong>：若按心理账户分账评估各只股票，税收互换意味着在心理上实现账户亏损，许多人难以做到。","label":"心理账户与税收互换"},{"t":"后悔厌恶与自我控制：卖出亏损股票等于承认（事后看）错误的投资决策、引发后悔，故推迟卖出；卖出获利股票则带来自豪；即使投资者知道自己在做错事，也难以控制这一行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">后悔厌恶与自我控制</strong>：卖出亏损股票等于承认（事后看）错误的投资决策、引发后悔，故推迟卖出；卖出获利股票则带来自豪；即使投资者知道自己在做错事，也难以控制这一行为。","label":"后悔厌恶与自我控制"}],"k":"b","i":1,"h":"10.3.2 前景理论作为处置效应的一个解释","label":"10.3.2 前景理论作为处置效应的…"},{"t":"10.3.3 另一个可能的解释：巴伯瑞斯-熊伟（Barberis & Xiong）","c":[{"t":"视角：对不严谨的论证采取更严格的理论检验；在卡尼曼-特沃斯基参数化下，两期模型中前景理论的隐含行为很容易与处置效应正好相反。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">视角</strong>：对不严谨的论证采取更严格的理论检验；在卡尼曼-特沃斯基参数化下，两期模型中前景理论的隐含行为很容易与处置效应正好相反。","label":"视角：对不严谨的论证采取更严格的理论…"},{"t":"关键：前景理论没有考虑最初购买的决定——损失厌恶（λ=2）要求高预期回报，如50美元、涨跌概率相等的股票，仅当下期可能损失不超过5美元时投资者才愿意初始持有。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键</strong>：前景理论没有考虑最初购买的决定——损失厌恶（λ=2）要求高预期回报，如50美元、涨跌概率相等的股票，仅当下期可能损失不超过5美元时投资者才愿意初始持有。","label":"关键：前景理论没有考虑最初购买的决定…"},{"t":"推演：先涨到60美元者（获利10美元），随后的下跌会带走一半盈利，且价值函数在收益域内轻微凹、接近风险中性，投资者倾向减持；先跌至45美元者若回升，仅需半仓即可回到初始位置——前景理论下投资者乐于获利时增持、赔钱时卖出，与处置效应相反。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推演</strong>：先涨到60美元者（获利10美元），随后的下跌会带走一半盈利，且价值函数在收益域内轻微凹、接近风险中性，投资者倾向减持；先跌至45美元者若回升，仅需半仓即可回到初始位置——前景理论下投资者乐于获利时增持、赔钱时卖出，与处置效应相反。","label":"推演：先涨到60美元者（获利10美元…"}],"k":"b","i":1,"h":"<strong class=\"lead\">10.3.3 另一个可能的解释</strong>：巴伯瑞斯-熊伟（Barberis &amp; Xiong）","label":"10.3.3 另一个可能的解释"},{"t":"10.3.4 实验证据","c":[{"t":"萨默斯-达克斯伯里（Summers & Duxbury）：把\"结果好坏\"与\"个人选择\"分离——持有非自选（继承自亲属）股票的组不出现处置效应；自由选择股票的组显著出现（统计显著性小于1%）。处置效应的前提是投资者对投资结果的关注：自选亏损引发的后悔比失望更强、自选盈利引发的惊喜比高兴更强——情绪是理解投资选择的关键。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">萨默斯-达克斯伯里</strong>（Summers &amp; Duxbury）：把&quot;结果好坏&quot;与&quot;个人选择&quot;分离——持有非自选（继承自亲属）股票的组不出现处置效应；自由选择股票的组显著出现（统计显著性小于1%）。处置效应的前提是投资者对投资结果的关注：自选亏损引发的后悔比失望更强、自选盈利引发的惊喜比高兴更强——情绪是理解投资选择的关键。","label":"萨默斯-达克斯伯里"},{"t":"韦伯-卡默勒（Weber & Camerer）：当每期结束时股票被强制自动卖出（无论偏好如何）时，处置效应变得温和——自动清仓抑制了后悔与大喜的负面情绪，与情绪解释一致。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">韦伯-卡默勒</strong>（Weber &amp; Camerer）：当每期结束时股票被强制自动卖出（无论偏好如何）时，处置效应变得温和——自动清仓抑制了后悔与大喜的负面情绪，与情绪解释一致。","label":"韦伯-卡默勒"}],"k":"b","i":1,"h":"10.3.4 实验证据","label":"10.3.4 实验证据"}],"k":"sec","i":0,"h":"10.3 处置效应","label":"10.3 处置效应"},{"t":"10.4 赌场资金效应","c":[{"t":"术语：路径依赖（path dependence）：人们的决策受到之前发生事情的影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：路径依赖（path dependence）：人们的决策受到之前发生事情的影响。","label":"术语：路径依赖（path depen…"},{"t":"术语：赌场资金效应（house money effect）：先前获利后人们更愿意承担风险，如同用\"从庄家那里赢来的钱\"下注。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：赌场资金效应（house money effect）：先前获利后人们更愿意承担风险，如同用&quot;从庄家那里赢来的钱&quot;下注。","label":"术语：赌场资金效应（house mo…"},{"t":"术语：收支平衡效应（break-even effect）：先前失利后人们更愿冒险以求收支平衡。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：收支平衡效应（break-even effect）：先前失利后人们更愿冒险以求收支平衡。","label":"术语：收支平衡效应（break-ev…"},{"t":"术语：蛇咬效应（snake-bit effect）：先前失利使风险规避加强、更不愿冒险。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：蛇咬效应（snake-bit effect）：先前失利使风险规避加强、更不愿冒险。","label":"术语：蛇咬效应（snake-bit …"},{"t":"10.4.1 赌场资金效应的证据","c":[{"t":"泰勒-约翰逊（Thaler & Johnson, 1990）：学生实验显示事前获利后人们对预想的风险更开放；失利后收支平衡效应与蛇咬效应并存、方向相反。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">泰勒-约翰逊</strong>（Thaler &amp; Johnson, 1990）：学生实验显示事前获利后人们对预想的风险更开放；失利后收支平衡效应与蛇咬效应并存、方向相反。","label":"泰勒-约翰逊"},{"t":"波斯特等（Post, van den Assem, Baltussen & Thaler）：\"成交还是不成交\"游戏节目研究（2002年始于荷兰，后至德国、墨西哥、西班牙、美国；荷兰赌金0.01~5000000欧元；26只箱子暗藏票据，参赛者先锁定一只不开，逐轮开箱后\"银行\"逐轮出价，接受即获确定支付并结束，否则继续，直到成交或拿走所选箱中的支付）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">波斯特等</strong>（Post, van den Assem, Baltussen &amp; Thaler）：&quot;成交还是不成交&quot;游戏节目研究（2002年始于荷兰，后至德国、墨西哥、西班牙、美国；荷兰赌金0.01~5000000欧元；26只箱子暗藏票据，参赛者先锁定一只不开，逐轮开箱后&quot;银行&quot;逐轮出价，接受即获确定支付并结束，否则继续，直到成交或拿走所选箱中的支付）。","label":"波斯特等"},{"t":"发现：低支付箱被打开时参赛者更冒险（感觉相对期望获利在望——赌场资金效应）；高价值箱被打开时感觉相对期望发生了损失，风险规避递减、更偏好有望翻本的冒险（收支平衡效应）。底线：期望财富的变动无论正负，都会显著提高风险偏好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">发现</strong>：低支付箱被打开时参赛者更冒险（感觉相对期望获利在望——赌场资金效应）；高价值箱被打开时感觉相对期望发生了损失，风险规避递减、更偏好有望翻本的冒险（收支平衡效应）。底线：期望财富的变动无论正负，都会显著提高风险偏好。","label":"发现：低支付箱被打开时参赛者更冒险（…"}],"k":"b","i":1,"h":"10.4.1 赌场资金效应的证据","label":"10.4.1 赌场资金效应的证据"},{"t":"10.4.2 前景理论和序贯决策","c":[{"t":"表面矛盾与化解：前景理论用于描述一次性赌博；赌场资金效应应被理解为序贯赌博被\"统一\"（综合）而非\"分散\"（分账）考虑的证据——大赚后统一思考会安全离开价值函数的损失规避节点，变得不那么风险规避；自豪与后悔同样取决于按增量还是综合来分类。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表面矛盾与化解</strong>：前景理论用于描述一次性赌博；赌场资金效应应被理解为序贯赌博被&quot;统一&quot;（综合）而非&quot;分散&quot;（分账）考虑的证据——大赚后统一思考会安全离开价值函数的损失规避节点，变得不那么风险规避；自豪与后悔同样取决于按增量还是综合来分类。","label":"表面矛盾与化解"},{"t":"资产定价模型：巴伯瑞斯-黄明-桑托斯（Barberis, Huang & Santos, 2001）让投资者从消费与财富变动中获得效用；损失规避使投资者对财富减少比增加更敏感，之前的投资结果影响之后的行为——股价上涨后先前赢利缓冲了未来损失，风险规避降低；下跌后更关注未来损失，风险规避升高；模型预测金融市场存在赌场资金效应并放大价格波动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">资产定价模型</strong>：巴伯瑞斯-黄明-桑托斯（Barberis, Huang &amp; Santos, 2001）让投资者从消费与财富变动中获得效用；损失规避使投资者对财富减少比增加更敏感，之前的投资结果影响之后的行为——股价上涨后先前赢利缓冲了未来损失，风险规避降低；下跌后更关注未来损失，风险规避升高；模型预测金融市场存在赌场资金效应并放大价格波动。","label":"资产定价模型"},{"t":"市场实验（Ackert等）：交易前获得较多收入的交易者会购买更多资产，市场价格显著上涨并在整个三期中持续走高——与赌场资金效应一致；但对职业交易者的观察显示财富的绝对水平（而非变化）决定行为，可能因其受过正规训练、较少受前景理论与情绪影响；个人行为如何适应或影响市场结果仍需更多研究。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">市场实验</strong>（Ackert等）：交易前获得较多收入的交易者会购买更多资产，市场价格显著上涨并在整个三期中持续走高——与赌场资金效应一致；但对职业交易者的观察显示财富的绝对水平（而非变化）决定行为，可能因其受过正规训练、较少受前景理论与情绪影响；个人行为如何适应或影响市场结果仍需更多研究。","label":"市场实验"}],"k":"b","i":1,"h":"10.4.2 前景理论和序贯决策","label":"10.4.2 前景理论和序贯决策"}],"k":"sec","i":0,"h":"10.4 赌场资金效应","label":"10.4 赌场资金效应"},{"t":"10.5 情感","c":[{"t":"术语：情感（affect）：刺激的质量，反映一个人对它的印象和评估；情感判断是对刺激的感知。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：情感（affect）：刺激的质量，反映一个人对它的印象和评估；情感判断是对刺激的感知。","label":"术语：情感（affect）：刺激的质…"},{"t":"术语：情感启发式（affect heuristic）：以正面/负面的情感反应快速评价刺激，从而简化判断与决策的捷径。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：情感启发式（affect heuristic）：以正面/负面的情感反应快速评价刺激，从而简化判断与决策的捷径。","label":"术语：情感启发式（affect he…"},{"t":"机制：人们的想法由感知和符号影像构成，影像与正面或负面的感觉及生理（身体）状态相联系；情感反应是身体不同状态的认知表现，大脑利用情绪解读特定环境；人们乐于接受正面标志的刺激而刻意回避负面标志的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">机制</strong>：人们的想法由感知和符号影像构成，影像与正面或负面的感觉及生理（身体）状态相联系；情感反应是身体不同状态的认知表现，大脑利用情绪解读特定环境；人们乐于接受正面标志的刺激而刻意回避负面标志的。","label":"机制：人们的想法由感知和符号影像构成…"},{"t":"金融证据：实验参与者对一个工厂行业属性的主观印象决定了其对该厂的投资意愿（MacGregor等）；企业形象对投资者的投资决策具有显著影响（Ackert & Church）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">金融证据</strong>：实验参与者对一个工厂行业属性的主观印象决定了其对该厂的投资意愿（MacGregor等）；企业形象对投资者的投资决策具有显著影响（Ackert &amp; Church）。","label":"金融证据"},{"t":"边界：心理学家相信即使没有认知评价，情感反应也会影响判断和决策；当情感反应与认知评价带来冲突时，情绪方面可能对行为具有决定性影响——但为何某种特殊力量最具决定性仍需更多学习。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">边界</strong>：心理学家相信即使没有认知评价，情感反应也会影响判断和决策；当情感反应与认知评价带来冲突时，情绪方面可能对行为具有决定性影响——但为何某种特殊力量最具决定性仍需更多学习。","label":"边界：心理学家相信即使没有认知评价，…"}],"k":"sec","i":0,"h":"10.5 情感","label":"10.5 情感"}],"k":"chap","h":"第10章 个人投资者和情绪的力量","label":"第10章 个人投资者和情绪的力量"}],"k":"part","h":"第三篇 投资者行为","label":"第三篇 投资者行为","col":"#e08a1e","pc":"p3"},{"t":"第四篇 社会力量","c":[{"t":"第11章 社会力量：利己还是利他","c":[{"t":"本章要点","c":[{"t":"经济人（homo economicus）：金融理论中理性且自利的决策者形象，这一概念一般归于19世纪经济学家约翰·斯图尔特·穆勒，尽管他本人并未使用过该词。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经济人</strong>（homo economicus）：金融理论中理性且自利的决策者形象，这一概念一般归于19世纪经济学家约翰·斯图尔特·穆勒，尽管他本人并未使用过该词。","label":"经济人（homo economicu…"},{"t":"其他方面偏好（other-regarding preference）：不只关心自身物质利益、还顾及公平与他人处境的偏好（如公平、互惠、信任），是本章考察的核心。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">其他方面偏好</strong>（other-regarding preference）：不只关心自身物质利益、还顾及公平与他人处境的偏好（如公平、互惠、信任），是本章考察的核心。","label":"其他方面偏好"},{"t":"三个经典博弈给出证据：最后通牒博弈中低于20%禀赋的提议约有一半被拒；独裁者博弈中64%的人仍把钱送给陌生人；信任博弈中投资者送出约一半禀赋，但受托人互惠比率多低于50%。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">三个经典博弈给出证据</strong>：最后通牒博弈中低于20%禀赋的提议约有一半被拒；独裁者博弈中64%的人仍把钱送给陌生人；信任博弈中投资者送出约一半禀赋，但受托人互惠比率多低于50%。","label":"三个经典博弈给出证据"},{"t":"忽视社会偏好会误判金融问题：仅改变竞争回应者人数，买者获得的交易好处就从41%降到19%再到14%；显性激励合同可能被工人视为不信任并挤出自愿合作。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">忽视社会偏好会误判金融问题</strong>：仅改变竞争回应者人数，买者获得的交易好处就从41%降到19%再到14%；显性激励合同可能被工人视为不信任并挤出自愿合作。","label":"忽视社会偏好会误判金融问题"},{"t":"遵从（conformity）：人们屈服于真实或假想的社会压力而跟随他人——Asch线段实验中学生在1/3的情境下遵从错误多数，3/4至少遵从一次；集体思维与米尔格拉姆电击实验进一步显示社会压力的力量。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">遵从</strong>（conformity）：人们屈服于真实或假想的社会压力而跟随他人——Asch线段实验中学生在1/3的情境下遵从错误多数，3/4至少遵从一次；集体思维与米尔格拉姆电击实验进一步显示社会压力的力量。","label":"遵从（conformity）：人们屈…"},{"t":"社会神经科学（social neuroscience）：功能磁共振成像显示不公平提议同时激活前脑（理性）与边缘系统（情绪），拒绝时常是情绪获胜。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">社会神经科学</strong>（social neuroscience）：功能磁共振成像显示不公平提议同时激活前脑（理性）与边缘系统（情绪），拒绝时常是情绪获胜。","label":"社会神经科学"},{"t":"进化解释：亲社会群体表现更好，人类偏好合作与平等交换可能是进化的产物。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">进化解释</strong>：亲社会群体表现更好，人类偏好合作与平等交换可能是进化的产物。","label":"进化解释"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"11.1 理性经济人","c":[{"t":"经济人（homo economicus）：金融理论中描述的理性和自利的决策者，概念一般归于约翰·斯图尔特·穆勒（John Stuart Mill），但他实际上并没有用过这个词。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经济人</strong>（homo economicus）：金融理论中描述的理性和自利的决策者，概念一般归于约翰·斯图尔特·穆勒（John Stuart Mill），但他实际上并没有用过这个词。","label":"经济人（homo economicu…"},{"t":"穆勒的界定：经济学不把人类全部本性看作社会力量修饰的结果，只把人看作想拥有财富、并有能力判断达到此目的各种方法相对效率的人；抽象掉除\"永久伤害性\"因素（如厌恶劳动、沉溺享乐）之外的其他激情和需求。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">穆勒的界定</strong>：经济学不把人类全部本性看作社会力量修饰的结果，只把人看作想拥有财富、并有能力判断达到此目的各种方法相对效率的人；抽象掉除&quot;永久伤害性&quot;因素（如厌恶劳动、沉溺享乐）之外的其他激情和需求。","label":"穆勒的界定"},{"t":"抽象的理由：若把大量因素纳入模型，模型将变得不确定、无法提供预测或指导决策方向；\"如果经济学要成为一门科学，实际的规则必须能够建立在此基础上\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">抽象的理由</strong>：若把大量因素纳入模型，模型将变得不确定、无法提供预测或指导决策方向；&quot;如果经济学要成为一门科学，实际的规则必须能够建立在此基础上&quot;。","label":"抽象的理由"},{"t":"穆勒并未取消社会的作用：他的大量工作集中于制度的重要作用，例如批评爱尔兰农场租赁体系会剥夺农场主努力工作的激情。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">穆勒并未取消社会的作用</strong>：他的大量工作集中于制度的重要作用，例如批评爱尔兰农场租赁体系会剥夺农场主努力工作的激情。","label":"穆勒并未取消社会的作用"},{"t":"本章立场：近期证据显示人们并不只关注货币激励，\"人仅为占有和消费财富\"的假设可能太狭隘；对人类行为动机的更深刻研究对理解金融决策至关重要。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章立场</strong>：近期证据显示人们并不只关注货币激励，&quot;人仅为占有和消费财富&quot;的假设可能太狭隘；对人类行为动机的更深刻研究对理解金融决策至关重要。","label":"本章立场"}],"k":"sec","i":0,"h":"11.1 理性经济人","label":"11.1 理性经济人"},{"t":"11.2 公平、互惠和信任","c":[{"t":"公平与信任是商业交易的基础：信任是经济有效运转的前提；合同虽可明确每笔交易的每个细节，但成本高昂，若相信他人会公平作为，交易成本大幅降低。日常例证是饭店小费——并非必须，但顾客认为应该给，服务员也视为对其工作的认可。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">公平与信任是商业交易的基础</strong>：信任是经济有效运转的前提；合同虽可明确每笔交易的每个细节，但成本高昂，若相信他人会公平作为，交易成本大幅降低。日常例证是饭店小费——并非必须，但顾客认为应该给，服务员也视为对其工作的认可。","label":"公平与信任是商业交易的基础"},{"t":"11.2.1 最后通牒博弈（ultimatum game）","c":[{"t":"规则：提议者获得10美元禀赋，向随机配对、互不相识的回应者提议送出0—10美元中的某个数额x；回应者可接受（提议实现）或拒绝（双方一无所获）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规则</strong>：提议者获得10美元禀赋，向随机配对、互不相识的回应者提议送出0—10美元中的某个数额x；回应者可接受（提议实现）或拒绝（双方一无所获）。","label":"规则：提议者获得10美元禀赋，向随机…"},{"t":"传统预测：自利回应者会接受任何正数额，提议者据此只提议1美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传统预测</strong>：自利回应者会接受任何正数额，提议者据此只提议1美元。","label":"传统预测"},{"t":"实际结果：平均提议高于最低数额；在不同国家不同类型参与者的许多实验中，回应者约有一半的次数会拒绝少于提议者20%禀赋（本例2美元）的提议。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实际结果</strong>：平均提议高于最低数额；在不同国家不同类型参与者的许多实验中，回应者约有一半的次数会拒绝少于提议者20%禀赋（本例2美元）的提议。","label":"实际结果"},{"t":"两点与自利假设不一致：其一，回应者拒绝正数额，与最大化利益相反；其二，提议者平均比最低数额慷慨——但这可能是预期到报复后的策略性行为，公平解释欠佳。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两点与自利假设不一致</strong>：其一，回应者拒绝正数额，与最大化利益相反；其二，提议者平均比最低数额慷慨——但这可能是预期到报复后的策略性行为，公平解释欠佳。","label":"两点与自利假设不一致"}],"k":"b","i":1,"h":"<strong class=\"lead\">11.2.1 最后通牒博弈</strong>（ultimatum game）","label":"11.2.1 最后通牒博弈"},{"t":"11.2.2 独裁者博弈（dictator game）","c":[{"t":"规则：与最后通牒博弈相同，但回应者没有任何决策权，提议即结束；姓名严格保密，名誉不起作用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规则</strong>：与最后通牒博弈相同，但回应者没有任何决策权，提议即结束；姓名严格保密，名誉不起作用。","label":"规则：与最后通牒博弈相同，但回应者没…"},{"t":"作用：区分公平与策略——若不关注公平，提议者就不会给钱。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">作用</strong>：区分公平与策略——若不关注公平，提议者就不会给钱。","label":"作用：区分公平与策略——若不关注公平…"},{"t":"实际结果（禀赋5美元的对比实验）：最后通牒博弈的提议分布明显更集中于右方（更慷慨），所有参与者都提议了正数额；独裁者博弈中36%的参与者分文不送，但64%的人把钱给了不认识、将来未必再见的人——没有报复、惩罚或名誉损失的机会，说明许多人的确重视公平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实际结果</strong>（禀赋5美元的对比实验）：最后通牒博弈的提议分布明显更集中于右方（更慷慨），所有参与者都提议了正数额；独裁者博弈中36%的参与者分文不送，但64%的人把钱给了不认识、将来未必再见的人——没有报复、惩罚或名誉损失的机会，说明许多人的确重视公平。","label":"实际结果"},{"t":"附加观察：最后通牒博弈中约20%的回应者愿意付出自己的收入去报复不公平的提议。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">附加观察</strong>：最后通牒博弈中约20%的回应者愿意付出自己的收入去报复不公平的提议。","label":"附加观察"}],"k":"b","i":1,"h":"<strong class=\"lead\">11.2.2 独裁者博弈</strong>（dictator game）","label":"11.2.2 独裁者博弈"},{"t":"11.2.3 信任博弈（trust game）","c":[{"t":"规则：双方各得10美元；投资者（房间A）送出x美元给受托人（房间B），每1美元被放大3倍；受托人决定返还y（0到3x）并自留其余。因测度信任且投资行为又称投资博弈（investment game）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规则</strong>：双方各得10美元；投资者（房间A）送出x美元给受托人（房间B），每1美元被放大3倍；受托人决定返还y（0到3x）并自留其余。因测度信任且投资行为又称投资博弈（investment game）。","label":"规则：双方各得10美元；投资者（房间…"},{"t":"传统预测：纯粹自利的受托人不会返还一分钱（y=0），投资者预见到这一点就不送（x=0）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传统预测</strong>：纯粹自利的受托人不会返还一分钱（y=0），投资者预见到这一点就不送（x=0）。","label":"传统预测"},{"t":"收益结构：无信任时总收益20美元（10+10）；完全信任时40美元（10×3+10）——信任使所有参与者潜在地得到改善。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">收益结构</strong>：无信任时总收益20美元（10+10）；完全信任时40美元（10×3+10）——信任使所有参与者潜在地得到改善。","label":"收益结构"},{"t":"实际结果：投资者平均送出约一半禀赋（44人中33人至少送一半，平均6美元）；互惠比率大多低于50%，许多投资者收益少于付出——信任并不必然获益，但没有信任，许多潜在的交易好处将不存在。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实际结果</strong>：投资者平均送出约一半禀赋（44人中33人至少送一半，平均6美元）；互惠比率大多低于50%，许多投资者收益少于付出——信任并不必然获益，但没有信任，许多潜在的交易好处将不存在。","label":"实际结果"}],"k":"b","i":1,"h":"<strong class=\"lead\">11.2.3 信任博弈</strong>（trust game）","label":"11.2.3 信任博弈"},{"t":"11.2.3 谁更公平","c":[{"t":"个体差异：研究结论复杂，文化、性别或教育背景均无确定结论；看起来有持久影响的因素是年龄——小朋友更自利，长大过程中变得更具社会观念。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个体差异</strong>：研究结论复杂，文化、性别或教育背景均无确定结论；看起来有持久影响的因素是年龄——小朋友更自利，长大过程中变得更具社会观念。","label":"个体差异"},{"t":"马奇根加人（Machiguenga）：秘鲁亚马孙以狩猎捕鱼、刀耕火种为生，交换限于家庭单位内、家庭之外合作很少；实验发现他们比其他群体更不慷慨。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">马奇根加人</strong>（Machiguenga）：秘鲁亚马孙以狩猎捕鱼、刀耕火种为生，交换限于家庭单位内、家庭之外合作很少；实验发现他们比其他群体更不慷慨。","label":"马奇根加人"},{"t":"跨文化实验：同一研究小组对15个文化群体做最后通牒博弈；学生提议者通常送出42%—48%的禀赋，不同文化群体则从25%到57%不等；零提议在某些组罕见、在另一些组普遍；低于20%禀赋的低提议有群体从不拒绝，超过50%的提议（通常被认为很公平）却在另一些组被拒。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">跨文化实验</strong>：同一研究小组对15个文化群体做最后通牒博弈；学生提议者通常送出42%—48%的禀赋，不同文化群体则从25%到57%不等；零提议在某些组罕见、在另一些组普遍；低于20%禀赋的低提议有群体从不拒绝，超过50%的提议（通常被认为很公平）却在另一些组被拒。","label":"跨文化实验"},{"t":"关键结论：个体统计特征作用不大，经济组织与市场一体化程度影响显著——交易活跃文化中的参与者提议更慷慨；由此引出\"人们因交换而亲社会，还是因亲社会而更易交换\"的问题，对理解金融市场意义重大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键结论</strong>：个体统计特征作用不大，经济组织与市场一体化程度影响显著——交易活跃文化中的参与者提议更慷慨；由此引出&quot;人们因交换而亲社会，还是因亲社会而更易交换&quot;的问题，对理解金融市场意义重大。","label":"关键结论"}],"k":"b","i":1,"h":"11.2.3 谁更公平","label":"11.2.3 谁更公平"}],"k":"sec","i":0,"h":"11.2 公平、互惠和信任","label":"11.2 公平、互惠和信任"},{"t":"11.3 社会影响的作用","c":[{"t":"目的：在考察其他方面偏好的证据之后，用两个例子说明忽视社会影响会导致关于重要金融问题的错误结论——市场竞争与最优合同设计（源自Fehr与Fischbacher）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">目的</strong>：在考察其他方面偏好的证据之后，用两个例子说明忽视社会影响会导致关于重要金融问题的错误结论——市场竞争与最优合同设计（源自Fehr与Fischbacher）。","label":"目的：在考察其他方面偏好的证据之后，…"},{"t":"11.3.1 市场中的竞争","c":[{"t":"修正的最后通牒博弈：回应者从1个增至2个或5个并彼此竞争；多人接受时随机选一人成交，全部拒绝则一无所获。类比一个卖者（提议者）面对多个竞争买者（回应者）的商品市场。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">修正的最后通牒博弈</strong>：回应者从1个增至2个或5个并彼此竞争；多人接受时随机选一人成交，全部拒绝则一无所获。类比一个卖者（提议者）面对多个竞争买者（回应者）的商品市场。","label":"修正的最后通牒博弈"},{"t":"自利预测：卖者把价格定在买者最高支付意愿上、拿走全部交易所得；增加买者竞争对结果没有影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自利预测</strong>：卖者把价格定在买者最高支付意愿上、拿走全部交易所得；增加买者竞争对结果没有影响。","label":"自利预测"},{"t":"实际结果（Fischbacher、Fong、Fehr，20期实验BG/RC2/RC5）：1个回应者时成交者获得交易好处的41%；2个时仅19%；5个时14%。竞争对市场影响巨大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实际结果</strong>（Fischbacher、Fong、Fehr，20期实验BG/RC2/RC5）：1个回应者时成交者获得交易好处的41%；2个时仅19%；5个时14%。竞争对市场影响巨大。","label":"实际结果"},{"t":"解释：单个回应者可以拒绝低提议以惩罚不公平，提议者不敢压太低；多个回应者竞争时，任一回应者无法确定他人是否拒绝，其中自利者接受正提议，通常互惠的回应者也会因他人自利而接受更低提议。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解释</strong>：单个回应者可以拒绝低提议以惩罚不公平，提议者不敢压太低；多个回应者竞争时，任一回应者无法确定他人是否拒绝，其中自利者接受正提议，通常互惠的回应者也会因他人自利而接受更低提议。","label":"解释：单个回应者可以拒绝低提议以惩罚…"},{"t":"推论：当人们关注公平时，竞争对市场结果具有重要影响，不能忽视公平作为市场中潜在的重要因素。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推论</strong>：当人们关注公平时，竞争对市场结果具有重要影响，不能忽视公平作为市场中潜在的重要因素。","label":"推论：当人们关注公平时，竞争对市场结…"}],"k":"b","i":1,"h":"11.3.1 市场中的竞争","label":"11.3.1 市场中的竞争"},{"t":"11.3.2 激励与合同设计","c":[{"t":"背景：委托-代理关系需要合同设计（厂长激励工人、股东激励经理）；实验显示工人面对慷慨或公平工资时的努力程度高于自利代理人模型的预测，但人群中差异大——有人自利、大部分人互惠。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：委托-代理关系需要合同设计（厂长激励工人、股东激励经理）；实验显示工人面对慷慨或公平工资时的努力程度高于自利代理人模型的预测，但人群中差异大——有人自利、大部分人互惠。","label":"背景：委托-代理关系需要合同设计（厂…"},{"t":"问题：能否对自利者设计显性激励（如未达最低努力即受罚）以获得更高努力？物质激励可能引发更高努力，但工人可能视其为不信任的标志。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题</strong>：能否对自利者设计显性激励（如未达最低努力即受罚）以获得更高努力？物质激励可能引发更高努力，但工人可能视其为不信任的标志。","label":"问题：能否对自利者设计显性激励（如未…"},{"t":"Fehr与Gächter的实验：雇主提供工资并指定努力水平；信任组（TT）明示要求但不严格，激励组（IT）雇主可开除偷懒工人（存在显性激励机制）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">Fehr与Gächter的实验</strong>：雇主提供工资并指定努力水平；信任组（TT）明示要求但不严格，激励组（IT）雇主可开除偷懒工人（存在显性激励机制）。","label":"Fehr与Gächter的实验"},{"t":"结果：除最低工资外，工人选择的平均努力水平低于显性激励预期；公平互惠产生的动机与物质激励之间存在紧张关系，工人可能对显性激励做出敌意反应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：除最低工资外，工人选择的平均努力水平低于显性激励预期；公平互惠产生的动机与物质激励之间存在紧张关系，工人可能对显性激励做出敌意反应。","label":"结果：除最低工资外，工人选择的平均努…"},{"t":"启示：委托-代理模型认为最佳合同应包括所有可证实、可测度的表现，而该研究为\"最优的不完全雇用合同\"提供见解——业绩激励可能产生预期之外的影响（密切监督还可能引发怨恨与敌意）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">启示</strong>：委托-代理模型认为最佳合同应包括所有可证实、可测度的表现，而该研究为&quot;最优的不完全雇用合同&quot;提供见解——业绩激励可能产生预期之外的影响（密切监督还可能引发怨恨与敌意）。","label":"启示：委托-代理模型认为最佳合同应包…"}],"k":"b","i":1,"h":"11.3.2 激励与合同设计","label":"11.3.2 激励与合同设计"}],"k":"sec","i":0,"h":"11.3 社会影响的作用","label":"11.3 社会影响的作用"},{"t":"11.4 遵从","c":[{"t":"遵从（conformity）：当人们屈服于真实或假想的社会压力时出现的行为；第12章将考察其两个经验证据——专业分析师导致的羊群效应与公司董事会的最优组成。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">遵从</strong>（conformity）：当人们屈服于真实或假想的社会压力时出现的行为；第12章将考察其两个经验证据——专业分析师导致的羊群效应与公司董事会的最优组成。","label":"遵从（conformity）：当人们…"},{"t":"11.4.1 遵从的检验","c":[{"t":"Asch线段实验：判断A、B、C中哪条线段与标准线段等长（答案显然是C）；当房间内8名大学生都说是A时，Solomon Asch发现学生在1/3的情况下遵从错误的多数意见，3/4的学生至少遵从一次。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">Asch线段实验</strong>：判断A、B、C中哪条线段与标准线段等长（答案显然是C）；当房间内8名大学生都说是A时，Solomon Asch发现学生在1/3的情况下遵从错误的多数意见，3/4的学生至少遵从一次。","label":"Asch线段实验"},{"t":"重复与解释：实验被多次重复，遵从程度随时间变化；心理学家认为遵从是社会规则和文化的反映。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">重复与解释</strong>：实验被多次重复，遵从程度随时间变化；心理学家认为遵从是社会规则和文化的反映。","label":"重复与解释"},{"t":"集体思维（groupthink）：遵从的极端形式，可发生在与外来影响隔绝的小团体中；成员起初思考相似、强调忠诚、打压异议，可能忽视相关信息并自认绝对正确。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">集体思维</strong>（groupthink）：遵从的极端形式，可发生在与外来影响隔绝的小团体中；成员起初思考相似、强调忠诚、打压异议，可能忽视相关信息并自认绝对正确。","label":"集体思维"},{"t":"哥伦比亚号案例：NASA曾被一个小组警告飞船安全问题，却赶走9名成员中的5人并继续发射，7名宇航员身亡——集体思维的灾难性结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">哥伦比亚号案例</strong>：NASA曾被一个小组警告飞船安全问题，却赶走9名成员中的5人并继续发射，7名宇航员身亡——集体思维的灾难性结果。","label":"哥伦比亚号案例"},{"t":"警告信号与预防：忽视警告、惩罚异议者、看似永远正确即警示信号；鼓励成员表达看法、尤其与多数不一致的观点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">警告信号与预防</strong>：忽视警告、惩罚异议者、看似永远正确即警示信号；鼓励成员表达看法、尤其与多数不一致的观点。","label":"警告信号与预防"},{"t":"延伸到羊群效应（herding）：人们倾向于根据周围人的评价描述自己（社会比较理论）；职业分析师基于参照组行为决策；羊群效应在金融出版物中带负面含义，但若别人的消息正确，羊群未必是坏事。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">延伸到羊群效应</strong>（herding）：人们倾向于根据周围人的评价描述自己（社会比较理论）；职业分析师基于参照组行为决策；羊群效应在金融出版物中带负面含义，但若别人的消息正确，羊群未必是坏事。","label":"延伸到羊群效应"}],"k":"b","i":1,"h":"11.4.1 遵从的检验","label":"11.4.1 遵从的检验"},{"t":"11.4.2 遵从权威","c":[{"t":"米尔格拉姆实验（Stanley Milgram，20世纪60年代）：受试者任\"教师\"，对答错的\"学生\"（实为演员）实施0—450V电击；借检验对权威的遵从——权威感来自实验组织者的头衔与职业服装，且参与者获得报酬。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">米尔格拉姆实验</strong>（Stanley Milgram，20世纪60年代）：受试者任&quot;教师&quot;，对答错的&quot;学生&quot;（实为演员）实施0—450V电击；借检验对权威的遵从——权威感来自实验组织者的头衔与职业服装，且参与者获得报酬。","label":"米尔格拉姆实验"},{"t":"结果：原始研究中每个受试者都实施了一些电击；在\"教师看不见学生、300V时只能听到敲墙抗议、315V后无声\"的变种中，40名受试者有26人实施了最大电击，尽管许多人明显抗拒仍继续。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：原始研究中每个受试者都实施了一些电击；在&quot;教师看不见学生、300V时只能听到敲墙抗议、315V后无声&quot;的变种中，40名受试者有26人实施了最大电击，尽管许多人明显抗拒仍继续。","label":"结果：原始研究中每个受试者都实施了一…"},{"t":"变种的规律：房间中有人不遵从、实验安排者离开房间、教师与学生同处一室、实验人员给出自相矛盾指令时，参与者更可能违背实验安排。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">变种的规律</strong>：房间中有人不遵从、实验安排者离开房间、教师与学生同处一室、实验人员给出自相矛盾指令时，参与者更可能违背实验安排。","label":"变种的规律"},{"t":"结论：当权威要求行动时，人们有时会违背自己的良心。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：当权威要求行动时，人们有时会违背自己的良心。","label":"结论：当权威要求行动时，人们有时会违…"}],"k":"b","i":1,"h":"11.4.2 遵从权威","label":"11.4.2 遵从权威"}],"k":"sec","i":0,"h":"11.4 遵从","label":"11.4 遵从"},{"t":"11.5 社会行为和情绪","c":[{"t":"社会神经科学（social neuroscience）：研究\"社会大脑\"——与他人交往时的神经电流运作过程；功能磁共振成像（fMRI）允许观察不同时段大脑哪个部分在运作。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">社会神经科学</strong>（social neuroscience）：研究&quot;社会大脑&quot;——与他人交往时的神经电流运作过程；功能磁共振成像（fMRI）允许观察不同时段大脑哪个部分在运作。","label":"社会神经科学"},{"t":"最后通牒博弈的fMRI证据：明显不公平的提议同时引发前脑活动（理性思考：接受是否符合私利）与边缘系统活动（情绪：感到被不公平对待）；当不公平提议被拒绝时，可观察到边缘系统的活动占据上风。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">最后通牒博弈的fMRI证据</strong>：明显不公平的提议同时引发前脑活动（理性思考：接受是否符合私利）与边缘系统活动（情绪：感到被不公平对待）；当不公平提议被拒绝时，可观察到边缘系统的活动占据上风。","label":"最后通牒博弈的fMRI证据"},{"t":"与第7章的联系：大脑边缘系统是情绪的基础位置，前脑是理性思维的关键部位。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">与第7章的联系</strong>：大脑边缘系统是情绪的基础位置，前脑是理性思维的关键部位。","label":"与第7章的联系"}],"k":"sec","i":0,"h":"11.5 社会行为和情绪","label":"11.5 社会行为和情绪"},{"t":"11.6 社会行为和进化","c":[{"t":"进化假说：进化可能使人们偏好合作与平等交易；亲社会群体比不亲社会群体表现更好，从而偏好互惠行为。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">进化假说</strong>：进化可能使人们偏好合作与平等交易；亲社会群体比不亲社会群体表现更好，从而偏好互惠行为。","label":"进化假说"},{"t":"遵从的作用：若社会中人人总按私利行事，遵从会鼓励合作行为。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">遵从的作用</strong>：若社会中人人总按私利行事，遵从会鼓励合作行为。","label":"遵从的作用"},{"t":"回到穆勒与政策：证据显示其他方面偏好确实影响行为；做推断与政策建议时有许多因素影响行为、模型不可能包括一切——\"没有两个个体完全相同，除非在某些特殊情况下，没有一般的信条会永远正确\"；现今研究者认为必须考虑社会影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">回到穆勒与政策</strong>：证据显示其他方面偏好确实影响行为；做推断与政策建议时有许多因素影响行为、模型不可能包括一切——&quot;没有两个个体完全相同，除非在某些特殊情况下，没有一般的信条会永远正确&quot;；现今研究者认为必须考虑社会影响。","label":"回到穆勒与政策"},{"t":"承接第12章：安然公司的倒闭及相关巨大后果将展示社会力量如何起作用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">承接第12章</strong>：安然公司的倒闭及相关巨大后果将展示社会力量如何起作用。","label":"承接第12章"}],"k":"sec","i":0,"h":"11.6 社会行为和进化","label":"11.6 社会行为和进化"}],"k":"chap","h":"<strong class=\"lead\">第11章 社会力量</strong>：利己还是利他","label":"第11章 社会力量"},{"t":"第12章 社会力量：一家美国公司的倒闭","c":[{"t":"本章要点","c":[{"t":"公司（corporation）：独立于其创立者或所有者的法人实体，生命不有限、所有权可轻易转移、股东只承担有限责任而最多失去其投资。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">公司</strong>（corporation）：独立于其创立者或所有者的法人实体，生命不有限、所有权可轻易转移、股东只承担有限责任而最多失去其投资。","label":"公司（corporation）：独立…"},{"t":"董事会（board of directors）：公司内部的监督机构，为经理层提供建议并进行纪律约束，是缓解经理层（代理人）与股东（委托人）之间代理问题的制度安排。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">董事会</strong>（board of directors）：公司内部的监督机构，为经理层提供建议并进行纪律约束，是缓解经理层（代理人）与股东（委托人）之间代理问题的制度安排。","label":"董事会（board of direc…"},{"t":"董事会最优结构：小规模、以外部董事为主的董事会更有效，但\"外部\"不等于\"独立\"——董事之间的社会联系（任意两董事仅需4.3人的链条连接）可能使独立性失效。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">董事会最优结构</strong>：小规模、以外部董事为主的董事会更有效，但&quot;外部&quot;不等于&quot;独立&quot;——董事之间的社会联系（任意两董事仅需4.3人的链条连接）可能使独立性失效。","label":"董事会最优结构"},{"t":"董事的行为偏差：薪酬决策中的自利、\"善意的谎言\"、错位的忠诚（呼应米尔格拉姆的遵从权威实验）都可能导致董事会失灵。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">董事的行为偏差</strong>：薪酬决策中的自利、&quot;善意的谎言&quot;、错位的忠诚（呼应米尔格拉姆的遵从权威实验）都可能导致董事会失灵。","label":"董事的行为偏差"},{"t":"三类证券分析师（卖方、买方、独立）是信息中介；卖方分析师因投资银行业务关系与信息渠道而系统性乐观，并存在羊群效应与\"理性的羊群行为\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">三类证券分析师</strong>（卖方、买方、独立）是信息中介；卖方分析师因投资银行业务关系与信息渠道而系统性乐观，并存在羊群效应与&quot;理性的羊群行为&quot;。","label":"三类证券分析师"},{"t":"安然案例解剖：特殊目的实体（SPE）与公允价值会计掩盖债务；董事会\"按需签章\"（薪酬全美最高、审计委员会仅85分钟）；分析师持续乐观；审计师安达信因巨额费用失职——多方社会力量共同促成倒闭。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">安然案例解剖</strong>：特殊目的实体（SPE）与公允价值会计掩盖债务；董事会&quot;按需签章&quot;（薪酬全美最高、审计委员会仅85分钟）；分析师持续乐观；审计师安达信因巨额费用失职——多方社会力量共同促成倒闭。","label":"安然案例解剖"},{"t":"监管回应：《公平信息披露法案》（Reg FD）与《萨班斯-奥克斯利法案》（SOX，2002），后者要求研究部门与投资银行建立隔离机制。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">监管回应</strong>：《公平信息披露法案》（Reg FD）与《萨班斯-奥克斯利法案》（SOX，2002），后者要求研究部门与投资银行建立隔离机制。","label":"监管回应"},{"t":"核心教训：组织中的任何人都要保持独立个性、对情况独立评估，避免被社会力量驱使；忠诚于组织比忠诚于个人更危险。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">核心教训</strong>：组织中的任何人都要保持独立个性、对情况独立评估，避免被社会力量驱使；忠诚于组织比忠诚于个人更危险。","label":"核心教训"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"12.1 公司董事会","c":[{"t":"公司（corporation）：独立于其创立者或所有者的法人实体；生命不有限，所有权可轻易转移，股份所有者仅承担有限责任。首席大法官约翰·马绍尔1819年的经典描述强调公司\"不朽和个性化\"，近200年来仍影响国家干预公司事务的能力。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">公司</strong>（corporation）：独立于其创立者或所有者的法人实体；生命不有限，所有权可轻易转移，股份所有者仅承担有限责任。首席大法官约翰·马绍尔1819年的经典描述强调公司&quot;不朽和个性化&quot;，近200年来仍影响国家干预公司事务的能力。","label":"公司（corporation）：独立…"},{"t":"外部约束：在美国，最大的外部力量是证券交易委员会（SEC），依1934年《证券交易法》成立，目的是\"保护投资者，维护公平、有序和有效的市场，促进资本形成\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">外部约束</strong>：在美国，最大的外部力量是证券交易委员会（SEC），依1934年《证券交易法》成立，目的是&quot;保护投资者，维护公平、有序和有效的市场，促进资本形成&quot;。","label":"外部约束"},{"t":"12.1.1 公司董事会的好处","c":[{"t":"存在的经济原因：董事会制度全球普遍，许多董事会在相关法规问世之前就已存在；董事会可能是减少经理层（代理人）与股东（委托人）之间代理问题的办法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">存在的经济原因</strong>：董事会制度全球普遍，许多董事会在相关法规问世之前就已存在；董事会可能是减少经理层（代理人）与股东（委托人）之间代理问题的办法。","label":"存在的经济原因"},{"t":"搭便车问题（free rider problem）：公司规模大、股东众多，难以直接监管经理层；部分股东推脱监管责任、依赖他人监管；普通股东还可能缺少理解复杂商业交易的必要知识、技能和信息。董事会因此成为代理问题的有效解决办法——若股东相信董事会，就通过对公司投资表明信任。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">搭便车问题</strong>（free rider problem）：公司规模大、股东众多，难以直接监管经理层；部分股东推脱监管责任、依赖他人监管；普通股东还可能缺少理解复杂商业交易的必要知识、技能和信息。董事会因此成为代理问题的有效解决办法——若股东相信董事会，就通过对公司投资表明信任。","label":"搭便车问题"},{"t":"董事会规模：小董事会更有效——规模过大时董事较少参与企业管理并带来代理问题（如董事会对其他董事免费搭车）；经验证据一致（小董事会更有效、更能提升企业价值）；近期理论表明最优规模还依赖于股东维权水平等企业个体特征。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">董事会规模</strong>：小董事会更有效——规模过大时董事较少参与企业管理并带来代理问题（如董事会对其他董事免费搭车）；经验证据一致（小董事会更有效、更能提升企业价值）；近期理论表明最优规模还依赖于股东维权水平等企业个体特征。","label":"董事会规模"},{"t":"董事会构成：内部人（insiders，公司经理层或执行者；优点是掌握公司具体信息、直接服务公司、了解经营活动）与外部人（outsiders，非雇员；优点是背景广泛、独立的价值判断、股东身份）；横截面数据发现构成与公司表现有关的些许证据。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">董事会构成</strong>：内部人（insiders，公司经理层或执行者；优点是掌握公司具体信息、直接服务公司、了解经营活动）与外部人（outsiders，非雇员；优点是背景广泛、独立的价值判断、股东身份）；横截面数据发现构成与公司表现有关的些许证据。","label":"董事会构成"}],"k":"b","i":1,"h":"12.1.1 公司董事会的好处","label":"12.1.1 公司董事会的好处"},{"t":"12.1.2 外部董事","c":[{"t":"政策倾向：公司丑闻后，董事会成员绝大部分为外部董事的政策受欢迎，但长期少有证据支持——因为独立性本质上是不可观测的（CEO与\"独立\"董事是普林斯顿室友、周末打网球、互任对方公司独立董事怎么办）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政策倾向</strong>：公司丑闻后，董事会成员绝大部分为外部董事的政策受欢迎，但长期少有证据支持——因为独立性本质上是不可观测的（CEO与&quot;独立&quot;董事是普林斯顿室友、周末打网球、互任对方公司独立董事怎么办）。","label":"政策倾向"},{"t":"实验证据：检查董事会中内部董事与外部董事冲突时的投票行为，设置与所有者利益一致的不知情外部人与利益不太一致的知情内部人；结果显示外部董事占主导的董事会常常形成与所有者利益一致的结果，且小董事会决策更有效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实验证据</strong>：检查董事会中内部董事与外部董事冲突时的投票行为，设置与所有者利益一致的不知情外部人与利益不太一致的知情内部人；结果显示外部董事占主导的董事会常常形成与所有者利益一致的结果，且小董事会决策更有效。","label":"实验证据"}],"k":"b","i":1,"h":"12.1.2 外部董事","label":"12.1.2 外部董事"},{"t":"12.1.3 这是一个很小的世界","c":[{"t":"六度分离（six degrees of separation）与米尔格拉姆的实地实验：任意两个美国人平均可通过五六个人的链条连接。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">六度分离</strong>（six degrees of separation）与米尔格拉姆的实地实验：任意两个美国人平均可通过五六个人的链条连接。","label":"六度分离"},{"t":"董事的更小世界：对服务于几百家美国最大公司的几千名董事的研究发现，董事之间仅需4.3人的链条即可连接（一条链接=两人同在一个董事会）；若董事会每月碰面一次，一个董事会讨论的想法（或谣言）会在仅6个月内传到97%的美国大公司董事会。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">董事的更小世界</strong>：对服务于几百家美国最大公司的几千名董事的研究发现，董事之间仅需4.3人的链条即可连接（一条链接=两人同在一个董事会）；若董事会每月碰面一次，一个董事会讨论的想法（或谣言）会在仅6个月内传到97%的美国大公司董事会。","label":"董事的更小世界"},{"t":"治理含义：基于1992—2003年法国高管与董事数据的研究发现，相互联系的CEO会任命朋友为董事，结果是没效率的执行者在位很久；另一面，社会网络也可能帮助识别优质董事——影响是双面的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">治理含义</strong>：基于1992—2003年法国高管与董事数据的研究发现，相互联系的CEO会任命朋友为董事，结果是没效率的执行者在位很久；另一面，社会网络也可能帮助识别优质董事——影响是双面的。","label":"治理含义"}],"k":"b","i":1,"h":"12.1.3 这是一个很小的世界","label":"12.1.3 这是一个很小的世界"},{"t":"12.1.4 董事、补偿和自利","c":[{"t":"管理创新的传播：董事的小世界意味着管理创新（无论增减企业价值）会很快传播，经理层对扩散敏感。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理创新的传播</strong>：董事的小世界意味着管理创新（无论增减企业价值）会很快传播，经理层对扩散敏感。","label":"管理创新的传播"},{"t":"CEO补偿：董事会最重要的决定之一，任务是把经理层激励与股东利益联系起来；2006年美国500家最大公司CEO平均工资1520万美元、比2005年上涨38%，大众媒体与股东关注高薪损害股东福利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">CEO补偿</strong>：董事会最重要的决定之一，任务是把经理层激励与股东利益联系起来；2006年美国500家最大公司CEO平均工资1520万美元、比2005年上涨38%，大众媒体与股东关注高薪损害股东福利。","label":"CEO补偿"},{"t":"自利情景：若你朋友苏珊是CEO且她是你们公司董事、下周你们董事会将决定你的补偿，你会如何决定她的薪酬？若熟人基思正在提名新董事、而你认为他可能想获得你的支持——董事资格对个人名誉与金钱都很重要（知名企业董事年薪可达数十万美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自利情景</strong>：若你朋友苏珊是CEO且她是你们公司董事、下周你们董事会将决定你的补偿，你会如何决定她的薪酬？若熟人基思正在提名新董事、而你认为他可能想获得你的支持——董事资格对个人名誉与金钱都很重要（知名企业董事年薪可达数十万美元）。","label":"自利情景"},{"t":"善意的谎言（white lies）：研究显示人们常撒自认为\"善意\"的谎言以塑造他人对自己的印象；若能抹平社会问题可算有益，但小谎言往往变成有害的欺骗——董事可能不认为自己不诚实，却没有完全诚实。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">善意的谎言</strong>（white lies）：研究显示人们常撒自认为&quot;善意&quot;的谎言以塑造他人对自己的印象；若能抹平社会问题可算有益，但小谎言往往变成有害的欺骗——董事可能不认为自己不诚实，却没有完全诚实。","label":"善意的谎言"}],"k":"b","i":1,"h":"12.1.4 董事、补偿和自利","label":"12.1.4 董事、补偿和自利"},{"t":"12.1.5 董事和忠诚","c":[{"t":"错位的忠诚：忠诚被人们看重、在商业关系中尤有价值；因倾向于服从，董事们会跟CEO站在一起（呼应米尔格拉姆实验：权威要求行动时人们有时违背良心）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">错位的忠诚</strong>：忠诚被人们看重、在商业关系中尤有价值；因倾向于服从，董事们会跟CEO站在一起（呼应米尔格拉姆实验：权威要求行动时人们有时违背良心）。","label":"错位的忠诚"},{"t":"缓解办法：鼓励不同观点、分散的董事会构成、真正的独立董事，并鼓励董事会在CEO不在场的情况下碰面——这些实践也能避免第11章讨论的集体思维的弊端。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">缓解办法</strong>：鼓励不同观点、分散的董事会构成、真正的独立董事，并鼓励董事会在CEO不在场的情况下碰面——这些实践也能避免第11章讨论的集体思维的弊端。","label":"缓解办法"}],"k":"b","i":1,"h":"12.1.5 董事和忠诚","label":"12.1.5 董事和忠诚"}],"k":"sec","i":0,"h":"12.1 公司董事会","label":"12.1 公司董事会"},{"t":"12.2 分析师","c":[{"t":"背景：公司丑闻后董事会行为受质疑，金融分析师也受到大量关注；分析师易受羊群效应影响（偶尔反羊群），其赢利预测和建议经常过于乐观。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">背景</strong>：公司丑闻后董事会行为受质疑，金融分析师也受到大量关注；分析师易受羊群效应影响（偶尔反羊群），其赢利预测和建议经常过于乐观。","label":"背景：公司丑闻后董事会行为受质疑，金…"},{"t":"12.2.1 职业证券分析师们做什么","c":[{"t":"证券分析师（security analysts）：信息的中介；以专业技能分析大量信息（财务状况、交易表现、媒体、公司高管与其他内部人士的谈话等）并提供离散化建议（推荐买入、买入、持有、卖出、推荐卖出）与预测（赢利水平、公司增长率），帮助投资者评价企业前景。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证券分析师</strong>（security analysts）：信息的中介；以专业技能分析大量信息（财务状况、交易表现、媒体、公司高管与其他内部人士的谈话等）并提供离散化建议（推荐买入、买入、持有、卖出、推荐卖出）与预测（赢利水平、公司增长率），帮助投资者评价企业前景。","label":"证券分析师"},{"t":"三类分析师：卖方分析师（sell-side analyst，受雇于经纪商、交易商和投资银行，报告常用于吸引投资银行业务）；买方分析师（buy-side analyst，受雇于共同基金、对冲基金与保险公司等大型货币管理公司，服务内部）；独立分析师（independent analyst，不属于大型投资或货币管理公司，靠收费赚钱）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三类分析师</strong>：卖方分析师（sell-side analyst，受雇于经纪商、交易商和投资银行，报告常用于吸引投资银行业务）；买方分析师（buy-side analyst，受雇于共同基金、对冲基金与保险公司等大型货币管理公司，服务内部）；独立分析师（independent analyst，不属于大型投资或货币管理公司，靠收费赚钱）。","label":"三类分析师"}],"k":"b","i":1,"h":"12.2.1 职业证券分析师们做什么","label":"12.2.1 职业证券分析师们做什么"},{"t":"12.2.2 证券分析师们的表现","c":[{"t":"总体证据：分析师普遍过分乐观；因买方报告不对外公开，研究集中于卖方与独立分析师。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总体证据</strong>：分析师普遍过分乐观；因买方报告不对外公开，研究集中于卖方与独立分析师。","label":"总体证据"},{"t":"利益冲突的来源：卖方分析师想以乐观预测为公司增加收入（尤其因其不直接贡献收入）；乐观预测帮助投行售股并吸引未来投行业务。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利益冲突的来源</strong>：卖方分析师想以乐观预测为公司增加收入（尤其因其不直接贡献收入）；乐观预测帮助投行售股并吸引未来投行业务。","label":"利益冲突的来源"},{"t":"经验证据：与某企业有投资银行业务关系的分析师预测显著更乐观；由附属承销商推荐的股票事后表现显著更差；即使雇用独立研究机构也存在冲突——管理层是公司重要信息来源，低赢利预测或卖出建议会关闭信息渠道。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经验证据</strong>：与某企业有投资银行业务关系的分析师预测显著更乐观；由附属承销商推荐的股票事后表现显著更差；即使雇用独立研究机构也存在冲突——管理层是公司重要信息来源，低赢利预测或卖出建议会关闭信息渠道。","label":"经验证据"}],"k":"b","i":1,"h":"12.2.2 证券分析师们的表现","label":"12.2.2 证券分析师们的表现"},{"t":"12.2.3 分析师们是否有羊群效应","c":[{"t":"不确定性与乐观：公司不确定性大时分析师较少担心名声问题、敢于发布乐观预测；不确定性小时盲从较少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不确定性与乐观</strong>：公司不确定性大时分析师较少担心名声问题、敢于发布乐观预测；不确定性小时盲从较少。","label":"不确定性与乐观"},{"t":"羊群效应（herding）：行为的收敛；在投资者中常被视作市场价格大幅波动的解释，但若大家信息相似，跟随他人也可能只是有相似信息的结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">羊群效应</strong>（herding）：行为的收敛；在投资者中常被视作市场价格大幅波动的解释，但若大家信息相似，跟随他人也可能只是有相似信息的结果。","label":"羊群效应"},{"t":"社会学习（social learning）：信息获取有成本时，即使自己的信息更好也跟随他人行为（如在新城市看到长队就跟随排队就餐），这可能是理性的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社会学习</strong>（social learning）：信息获取有成本时，即使自己的信息更好也跟随他人行为（如在新城市看到长队就跟随排队就餐），这可能是理性的。","label":"社会学习"},{"t":"理性的羊群行为（rational herding）：Trueman的理论模型中，低能力分析师的预测不完全反映私人信息；当预测序贯发布时，低能力分析师会忽视自己的信息、模仿他人，希望被视作高能力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理性的羊群行为</strong>（rational herding）：Trueman的理论模型中，低能力分析师的预测不完全反映私人信息；当预测序贯发布时，低能力分析师会忽视自己的信息、模仿他人，希望被视作高能力。","label":"理性的羊群行为"},{"t":"反羊群：也有证据显示分析师有时违反羊群效应——关注职业生涯时想有所作为（脱颖而出）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反羊群</strong>：也有证据显示分析师有时违反羊群效应——关注职业生涯时想有所作为（脱颖而出）。","label":"反羊群：也有证据显示分析师有时违反羊…"}],"k":"b","i":1,"h":"12.2.3 分析师们是否有羊群效应","label":"12.2.3 分析师们是否有羊群效应"}],"k":"sec","i":0,"h":"12.2 分析师","label":"12.2 分析师"},{"t":"12.3 安然公司","c":[{"t":"背景：2000年12月安然市值超过600亿美元，《福布斯》评为美国最有创意的大公司；2001年12月申请破产保护——当时美国最大破产案，至今仅次于世通公司；安然领导的傲慢与嚣张气焰出名（过度自信见第9章）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">背景</strong>：2000年12月安然市值超过600亿美元，《福布斯》评为美国最有创意的大公司；2001年12月申请破产保护——当时美国最大破产案，至今仅次于世通公司；安然领导的傲慢与嚣张气焰出名（过度自信见第9章）。","label":"背景：2000年12月安然市值超过6…"},{"t":"12.3.1 安然公司的运营和股票表现","c":[{"t":"历史：1985年由肯尼思·雷（Kenneth Lay）兼并几家天然气管道公司建立；受益于天然气市场解除管制与管道网络；随后把\"让能源买卖双方管理风险\"的交易模式复制到天然气及其他市场，表面上成功、少有人怀疑或调查其交易活动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">历史</strong>：1985年由肯尼思·雷（Kenneth Lay）兼并几家天然气管道公司建立；受益于天然气市场解除管制与管道网络；随后把&quot;让能源买卖双方管理风险&quot;的交易模式复制到天然气及其他市场，表面上成功、少有人怀疑或调查其交易活动。","label":"历史：1985年由肯尼思·雷（Ken…"},{"t":"股价：2000年最高点每股90.75美元；2001年破产时每股仅值0.25美元；许多雇员用退休金账户大量持有安然股票而惨遭损失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">股价</strong>：2000年最高点每股90.75美元；2001年破产时每股仅值0.25美元；许多雇员用退休金账户大量持有安然股票而惨遭损失。","label":"股价：2000年最高点每股90.75…"},{"t":"图表警示：1990—2001年安然股价相对标普500并不特别出众（当时整体牛市可能是资产泡沫）；2000年底安然市盈率高达68、同期标普500约37——高价可能反映对公司未来业绩的乐观预期，也可能反映经营管理与财务信息汇报方法的选择。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图表警示</strong>：1990—2001年安然股价相对标普500并不特别出众（当时整体牛市可能是资产泡沫）；2000年底安然市盈率高达68、同期标普500约37——高价可能反映对公司未来业绩的乐观预期，也可能反映经营管理与财务信息汇报方法的选择。","label":"图表警示"},{"t":"特殊目的实体（SPE, special purpose entity）：安然制造了上百个，有的用于躲避国外所得税、有的用于隐藏财务负债；按当时会计法规，只要独立第三方持有SPE股份的3%，安然就无需合并其财务状况；安然以自身股票为初始资产、用巨额债务支撑SPE业务，股价上涨时一切安好，股价下跌时SPE资不抵债、安然被迫接管债务。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">特殊目的实体</strong>（SPE, special purpose entity）：安然制造了上百个，有的用于躲避国外所得税、有的用于隐藏财务负债；按当时会计法规，只要独立第三方持有SPE股份的3%，安然就无需合并其财务状况；安然以自身股票为初始资产、用巨额债务支撑SPE业务，股价上涨时一切安好，股价下跌时SPE资不抵债、安然被迫接管债务。","label":"特殊目的实体"},{"t":"跑车类比：把跑车以6万美元卖给朋友约翰、却借给他6万美元买车——遗漏关键信息不算撒谎也不违法，但若细节透明，\"妻子\"（股东）不会认可；说明管理层靠遗漏而非撒谎欺骗股东。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">跑车类比</strong>：把跑车以6万美元卖给朋友约翰、却借给他6万美元买车——遗漏关键信息不算撒谎也不违法，但若细节透明，&quot;妻子&quot;（股东）不会认可；说明管理层靠遗漏而非撒谎欺骗股东。","label":"跑车类比"},{"t":"公允价值会计（fair value accounting）：市场价值不可得时用模型估计资产价值；安然高管选择\"最美好的图景\"，如把进入长期合同的估计未来现金流记为当期收入。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公允价值会计</strong>（fair value accounting）：市场价值不可得时用模型估计资产价值；安然高管选择&quot;最美好的图景&quot;，如把进入长期合同的估计未来现金流记为当期收入。","label":"公允价值会计"},{"t":"百视达案例：2000年7月19日安然与百视达影业签20年视频点播（VOD）合约，安然自估1.1亿美元利润而百视达认为无利可图；2001年3月合约解除，2001年10月安然被迫冲销先前利润。事后财务报表很容易看出疑问——为什么董事与分析师没有注意？","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">百视达案例</strong>：2000年7月19日安然与百视达影业签20年视频点播（VOD）合约，安然自估1.1亿美元利润而百视达认为无利可图；2001年3月合约解除，2001年10月安然被迫冲销先前利润。事后财务报表很容易看出疑问——为什么董事与分析师没有注意？","label":"百视达案例"}],"k":"b","i":1,"h":"12.3.1 安然公司的运营和股票表现","label":"12.3.1 安然公司的运营和股票表现"},{"t":"12.3.2 董事","c":[{"t":"薪酬与失职：2000年安然董事平均服务补偿38万美元、全美最高；审计委员会（含外部董事）每次仅约85分钟审议重要事项——董事对经理层的监督似乎只是按需签章。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">薪酬与失职</strong>：2000年安然董事平均服务补偿38万美元、全美最高；审计委员会（含外部董事）每次仅约85分钟审议重要事项——董事对经理层的监督似乎只是按需签章。","label":"薪酬与失职"},{"t":"构成问题：董事会中有2名CEO与15名外部董事；他们虽有丰富经验和出色专业知识，但是否真正独立无法确定——\"绝大部分外部董事\"的标准只是看起来得到满足。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">构成问题</strong>：董事会中有2名CEO与15名外部董事；他们虽有丰富经验和出色专业知识，但是否真正独立无法确定——&quot;绝大部分外部董事&quot;的标准只是看起来得到满足。","label":"构成问题"},{"t":"规模问题：董事会规模过大（研究显示小董事会更好）；事后得知董事并未特别参与或质疑管理层。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规模问题</strong>：董事会规模过大（研究显示小董事会更好）；事后得知董事并未特别参与或质疑管理层。","label":"规模问题"},{"t":"代价：董事名声蒙污、难以恢复；2005年10名董事同意股东诉讼和解，尽管通常有公司保险保护，仍自掏腰包支付1300万美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">代价</strong>：董事名声蒙污、难以恢复；2005年10名董事同意股东诉讼和解，尽管通常有公司保险保护，仍自掏腰包支付1300万美元。","label":"代价：董事名声蒙污、难以恢复；200…"},{"t":"归因之难：很难区分和测度私利、忠诚与集体思维对董事行为的影响程度，但可以肯定这些社会力量确实起了作用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">归因之难</strong>：很难区分和测度私利、忠诚与集体思维对董事行为的影响程度，但可以肯定这些社会力量确实起了作用。","label":"归因之难"}],"k":"b","i":1,"h":"12.3.2 董事","label":"12.3.2 董事"},{"t":"12.3.3 分析师","c":[{"t":"行为：调查期间分析师持续乐观，接受或未质疑经理层的辩解；即使证券交易委员会开始调查安然利益冲突后，分析师的平均推荐仍是买入。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行为</strong>：调查期间分析师持续乐观，接受或未质疑经理层的辩解；即使证券交易委员会开始调查安然利益冲突后，分析师的平均推荐仍是买入。","label":"行为：调查期间分析师持续乐观，接受或…"},{"t":"动机：利益冲突——安然能产生大量投资银行费用，即使现无业务的分析师也受未来业务关系制约；还想与经理层保持良好关系以保持通畅的信息渠道。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">动机</strong>：利益冲突——安然能产生大量投资银行费用，即使现无业务的分析师也受未来业务关系制约；还想与经理层保持良好关系以保持通畅的信息渠道。","label":"动机：利益冲突——安然能产生大量投资…"},{"t":"监管回应：《公平信息披露法案》（Regulation Fair Disclosure, Reg FD）禁止上市公司向投资者选择性披露、要求向所有投资者同时披露；2002年《萨班斯-奥克斯利法案》（Sarbanes-Oxley Act, SOX）要求在研究部门与投资银行之间建立隔离机制，以提升公众对分析师研究的信任。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">监管回应</strong>：《公平信息披露法案》（Regulation Fair Disclosure, Reg FD）禁止上市公司向投资者选择性披露、要求向所有投资者同时披露；2002年《萨班斯-奥克斯利法案》（Sarbanes-Oxley Act, SOX）要求在研究部门与投资银行之间建立隔离机制，以提升公众对分析师研究的信任。","label":"监管回应"}],"k":"b","i":1,"h":"12.3.3 分析师","label":"12.3.3 分析师"},{"t":"12.3.4 在安然公司倒闭中的其他参与人","c":[{"t":"投资者与高管：互联网股票狂涨期投资者只关注短期收益；高管补偿很大部分是股票期权、同样关注短期（第15章：经理可利用投资者非理性获利并采取迎合行动）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">投资者与高管</strong>：互联网股票狂涨期投资者只关注短期收益；高管补偿很大部分是股票期权、同样关注短期（第15章：经理可利用投资者非理性获利并采取迎合行动）。","label":"投资者与高管"},{"t":"审计师安达信（Arthur Andersen）：过早接受安然的商业模式与财务方法；审计师本应获得必要专业水平并提出疑问；2000年从安然赚取2500万美元审计费和2700万美元咨询费，巨额费用可能使其忽视责任；2002年因粉饰安然文件被指妨碍司法公正、会计从业证书自动失效；2005年最高法院推翻判决，但公司基本再未恢复。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">审计师安达信</strong>（Arthur Andersen）：过早接受安然的商业模式与财务方法；审计师本应获得必要专业水平并提出疑问；2000年从安然赚取2500万美元审计费和2700万美元咨询费，巨额费用可能使其忽视责任；2002年因粉饰安然文件被指妨碍司法公正、会计从业证书自动失效；2005年最高法院推翻判决，但公司基本再未恢复。","label":"审计师安达信"}],"k":"b","i":1,"h":"12.3.4 在安然公司倒闭中的其他参与人","label":"12.3.4 在安然公司倒闭中的其他…"},{"t":"12.3.5 组织文化和个体性格","c":[{"t":"现象：员工、投资者、董事会成员与分析师都\"爱\"安然；即使损失增加仍保持乐观（2001年12月瑞士信贷第一波士顿的柯特·劳纳仍为其辩护，尽管承认对财务披露有疑问）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现象</strong>：员工、投资者、董事会成员与分析师都&quot;爱&quot;安然；即使损失增加仍保持乐观（2001年12月瑞士信贷第一波士顿的柯特·劳纳仍为其辩护，尽管承认对财务披露有疑问）。","label":"现象：员工、投资者、董事会成员与分析…"},{"t":"文化与忠诚：安然员工对公司忠诚、认为公司不可战胜；米尔格拉姆指出，人融入组织结构后，新的存在取代自立个人，不受个人道德约束、只关心权威的制裁——忠诚于组织比忠诚于个人更危险。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化与忠诚</strong>：安然员工对公司忠诚、认为公司不可战胜；米尔格拉姆指出，人融入组织结构后，新的存在取代自立个人，不受个人道德约束、只关心权威的制裁——忠诚于组织比忠诚于个人更危险。","label":"文化与忠诚"},{"t":"教训：无论你是董事会成员、分析师、员工还是股东，都要对情况独立评估，避免被社会力量驱使。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">教训</strong>：无论你是董事会成员、分析师、员工还是股东，都要对情况独立评估，避免被社会力量驱使。","label":"教训：无论你是董事会成员、分析师、员…"}],"k":"b","i":1,"h":"12.3.5 组织文化和个体性格","label":"12.3.5 组织文化和个体性格"}],"k":"sec","i":0,"h":"12.3 安然公司","label":"12.3 安然公司"}],"k":"chap","h":"<strong class=\"lead\">第12章 社会力量</strong>：一家美国公司的倒闭","label":"第12章 社会力量"}],"k":"part","h":"第四篇 社会力量","label":"第四篇 社会力量","col":"#8b5cf6","pc":"p4"},{"t":"第五篇 市场中的结果","c":[{"t":"第13章 市场异象的行为解释","c":[{"t":"本章要点","c":[{"t":"公告后赢利变动的漂移（赢利公告后漂移）似乎受投资者和分析师锚定于公司近期赢利、对新信息反应不足的影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">公告后赢利变动的漂移</strong>（赢利公告后漂移）似乎受投资者和分析师锚定于公司近期赢利、对新信息反应不足的影响。","label":"公告后赢利变动的漂移"},{"t":"价值股溢价很可能由行为方面因素和机构的委托代理问题同时导致。","c":[],"k":"b","i":1,"h":"价值股溢价很可能由行为方面因素和机构的委托代理问题同时导致。","label":"价值股溢价很可能由行为方面因素和机构…"},{"t":"已提出一系列理论模型来解释动量效应和反转效应。","c":[],"k":"b","i":1,"h":"已提出一系列理论模型来解释动量效应和反转效应。","label":"已提出一系列理论模型来解释动量效应和…"},{"t":"DHS模型基于过度自信解释反转效应；GH模型基于前景理论、心理账户和处置效应解释动量效应；BSV模型基于锚定效应和代表性启发同时解释动量效应和反转效应。","c":[],"k":"b","i":1,"h":"DHS模型基于过度自信解释反转效应；GH模型基于前景理论、心理账户和处置效应解释动量效应；BSV模型基于锚定效应和代表性启发同时解释动量效应和反转效应。","label":"DHS模型基于过度自信解释反转效应；…"},{"t":"许多经验证据能和这些模型较好契合。","c":[],"k":"b","i":1,"h":"许多经验证据能和这些模型较好契合。","label":"许多经验证据能和这些模型较好契合。"},{"t":"另一观点：识别异象的研究中风险的解释是错误的，风险经正确调整后这些异象可能只是某些风险的溢价。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">另一观点</strong>：识别异象的研究中风险的解释是错误的，风险经正确调整后这些异象可能只是某些风险的溢价。","label":"另一观点"},{"t":"法玛-弗伦奇三因素模型在市场风险之外加入账面市值比和规模因素作为风险调整工具。","c":[],"k":"b","i":1,"h":"法玛-弗伦奇三因素模型在市场风险之外加入账面市值比和规模因素作为风险调整工具。","label":"法玛-弗伦奇三因素模型在市场风险之外…"},{"t":"在三因素模型中价值指标是风险因素而非异象，但价值暴露是否真代表额外风险仍受怀疑。","c":[],"k":"b","i":1,"h":"在三因素模型中价值指标是风险因素而非异象，但价值暴露是否真代表额外风险仍受怀疑。","label":"在三因素模型中价值指标是风险因素而非…"},{"t":"还没有风险调整方法能令人信服地解释动量效应。","c":[],"k":"b","i":1,"h":"还没有风险调整方法能令人信服地解释动量效应。","label":"还没有风险调整方法能令人信服地解释动…"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"13.1 赢利公告、价值股和成长股","c":[{"t":"13.1.1 什么造成了股票市场对赢利公告的滞后反应","c":[{"t":"异象（anomaly）：与市场有效性不一致且无法用标准模型解释的经验证据；本章解释赢利公告迟滞反应、价值股-成长股、动量与反转三类异象，小公司效应（small firm effect）：小市值公司收益系统性高于大市值公司的现象，因在法玛-弗伦奇三因素模型中起关键作用也被列为关键异象。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">异象</strong>（anomaly）：与市场有效性不一致且无法用标准模型解释的经验证据；本章解释赢利公告迟滞反应、价值股-成长股、动量与反转三类异象，小公司效应（small firm effect）：小市值公司收益系统性高于大市值公司的现象，因在法玛-弗伦奇三因素模型中起关键作用也被列为关键异象。","label":"异象（anomaly）：与市场有效性…"},{"t":"赢利公告后漂移：出乎意料的好/坏赢利公告只部分反映在价格中，出现一段时间迟滞反应；可能解释是投资者和分析师锚定（anchoring）：以初始信息为参照、对新信息调整不足的倾向，锚定于公司近期赢利而对新信息反应不足；价值线分析师季度赢利预测误差与之前三阶预测误差正相关，佐证反应不足；研究发现主要是中小（不成熟）投资者的交易行为导致迟滞反应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">赢利公告后漂移</strong>：出乎意料的好/坏赢利公告只部分反映在价格中，出现一段时间迟滞反应；可能解释是投资者和分析师锚定（anchoring）：以初始信息为参照、对新信息调整不足的倾向，锚定于公司近期赢利而对新信息反应不足；价值线分析师季度赢利预测误差与之前三阶预测误差正相关，佐证反应不足；研究发现主要是中小（不成熟）投资者的交易行为导致迟滞反应。","label":"赢利公告后漂移"},{"t":"短期反应不足与长期反应过度并存：P/E比率是市场赢利期望的测度，高P/E反映高增速预期、低P/E反映低增速预期；1999年底美国市场P/E 10分位数7.4、90分位数53.9；分析师5年期赢利增长率预测10分位与90分位分别为8.9%与40%，但长期高速成长罕见、均值反转才是普遍现象。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短期反应不足与长期反应过度并存</strong>：P/E比率是市场赢利期望的测度，高P/E反映高增速预期、低P/E反映低增速预期；1999年底美国市场P/E 10分位数7.4、90分位数53.9；分析师5年期赢利增长率预测10分位与90分位分别为8.9%与40%，但长期高速成长罕见、均值反转才是普遍现象。","label":"短期反应不足与长期反应过度并存"},{"t":"分析师预测过于分散且有时过于乐观：除乐观的心理学解释外还有委托代理解释——公平披露条例前与公司关系良好的分析师能更早获得信息，获得内幕信息的同时做出有偏预测或是最优（最小化期望预测误差的标准差）；分析师所在公司与被评级公司有承销业务联系时更倾向乐观估计。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">分析师预测过于分散且有时过于乐观</strong>：除乐观的心理学解释外还有委托代理解释——公平披露条例前与公司关系良好的分析师能更早获得信息，获得内幕信息的同时做出有偏预测或是最优（最小化期望预测误差的标准差）；分析师所在公司与被评级公司有承销业务联系时更倾向乐观估计。","label":"分析师预测过于分散且有时过于乐观"}],"k":"b","i":1,"h":"13.1.1 什么造成了股票市场对赢利公告的滞后反应","label":"13.1.1 什么造成了股票市场对赢…"},{"t":"13.1.2 什么带来了价值股的优势","c":[{"t":"拉康尼肖克、史雷弗和维舍（LSV）考察了剔除风险因素之外的解释，给出四个答案：前两个是判断失误（个人投资者更易犯），后两个是委托代理问题（涉及机构投资者）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">拉康尼肖克、史雷弗和维舍</strong>（LSV）考察了剔除风险因素之外的解释，给出四个答案：前两个是判断失误（个人投资者更易犯），后两个是委托代理问题（涉及机构投资者）。","label":"拉康尼肖克、史雷弗和维舍"},{"t":"期望误差假说（expectations error hypothesis）：投资者犯了判断错误，把股票历史的高速增长过度推延至将来；直觉是市场对好消息反应过度（或先反应不足后过度）——成长股涨过头后回调、价值股跌过头后反弹，故价值股日后回报更高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">期望误差假说</strong>（expectations error hypothesis）：投资者犯了判断错误，把股票历史的高速增长过度推延至将来；直觉是市场对好消息反应过度（或先反应不足后过度）——成长股涨过头后回调、价值股跌过头后反弹，故价值股日后回报更高。","label":"期望误差假说"},{"t":"\"典型\"影响：投资者认为投资于好公司必然就是好的投资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">&quot;典型&quot;影响</strong>：投资者认为投资于好公司必然就是好的投资。","label":"\"典型\"影响"},{"t":"委托代理解释一：股东把针对稳定赢利、快速成长公司的投资视作谨慎投资，机构投资者为展现谨慎代理人形象而避开失宠的价值股。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">委托代理解释一</strong>：股东把针对稳定赢利、快速成长公司的投资视作谨慎投资，机构投资者为展现谨慎代理人形象而避开失宠的价值股。","label":"委托代理解释一"},{"t":"委托代理解释二：机构考核期限很短，不愿偏向特定策略而出现跟踪误差；价值投资需要特定策略且回报实现较晚，因此被视为\"有风险\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">委托代理解释二</strong>：机构考核期限很短，不愿偏向特定策略而出现跟踪误差；价值投资需要特定策略且回报实现较晚，因此被视为&quot;有风险&quot;。","label":"委托代理解释二"},{"t":"支持期望误差假说的证据：按分析师赢利增长率预测构建组合，高预测组收益显著低于低预测组（赢利公布3天窗口内亦然）；按账面市值比排序的最高分组组合其后几年收益率高于最低分组，且差异在5年或更长时间内经济与统计显著；账面市值比效应是一般性异象。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">支持期望误差假说的证据</strong>：按分析师赢利增长率预测构建组合，高预测组收益显著低于低预测组（赢利公布3天窗口内亦然）；按账面市值比排序的最高分组组合其后几年收益率高于最低分组，且差异在5年或更长时间内经济与统计显著；账面市值比效应是一般性异象。","label":"支持期望误差假说的证据"},{"t":"套利限制：噪声交易者（noise trader）：非理性交易使错误定价可能进一步偏离，套利机会因此不被轻易消除；与之一致的证据——价格波动性更大（定价错误更可能恶化）的股票账面市值比效应更严重；投资者越不老练，效应越显著；股价进入价值区域时内部人（信息占优）频繁买入。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">套利限制</strong>：噪声交易者（noise trader）：非理性交易使错误定价可能进一步偏离，套利机会因此不被轻易消除；与之一致的证据——价格波动性更大（定价错误更可能恶化）的股票账面市值比效应更严重；投资者越不老练，效应越显著；股价进入价值区域时内部人（信息占优）频繁买入。","label":"套利限制"}],"k":"b","i":1,"h":"13.1.2 什么带来了价值股的优势","label":"13.1.2 什么带来了价值股的优势"}],"k":"sec","i":0,"h":"13.1 赢利公告、价值股和成长股","label":"13.1 赢利公告、价值股和成长股"},{"t":"13.2 动量效应与反转效应","c":[{"t":"动量效应（momentum effect）：中期内股票收益延续过去趋势（赢家继续赢、输家继续输）的现象；反转效应（reversal effect）：长期内过去赢家跑输、输家跑赢的回复现象；两者合起来即投资者一开始反应不足、之后反应过度，与赢利公告文献（反应不足）、价值投资文献（反应过度及反转）互相印证。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">动量效应</strong>（momentum effect）：中期内股票收益延续过去趋势（赢家继续赢、输家继续输）的现象；反转效应（reversal effect）：长期内过去赢家跑输、输家跑赢的回复现象；两者合起来即投资者一开始反应不足、之后反应过度，与赢利公告文献（反应不足）、价值投资文献（反应过度及反转）互相印证。","label":"动量效应"},{"t":"13.2.1 DHS模型及对反转效应的解释","c":[{"t":"DHS模型（Daniel-Hirshleifer-Subrahmanyam model）：基于过度自信（overconfidence）：高估自身信息准确性的倾向——知情交易者高估私有信息准确性，导致价格序列负相关，即反转效应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">DHS模型</strong>（Daniel-Hirshleifer-Subrahmanyam model）：基于过度自信（overconfidence）：高估自身信息准确性的倾向——知情交易者高估私有信息准确性，导致价格序列负相关，即反转效应。","label":"DHS模型"},{"t":"设定：一类风险中性的交易者拥有私有信息但过度自信；t=0均衡，t=1出现私人噪声信号S1=θ+ε（θ为证券真实价值变动，ε为零均值噪声），t=2正式获知真实价值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">设定</strong>：一类风险中性的交易者拥有私有信息但过度自信；t=0均衡，t=1出现私人噪声信号S1=θ+ε（θ为证券真实价值变动，ε为零均值噪声），t=2正式获知真实价值。","label":"设定：一类风险中性的交易者拥有私有信…"},{"t":"理性价格按方差权重分离信息与噪声：P1=σθ²/(σθ²+σε²)·(θ+ε)；当信号一半为真实信息时理性价格迅速收敛于均衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理性价格按方差权重分离信息与噪声</strong>：P1=σθ²/(σθ²+σε²)·(θ+ε)；当信号一半为真实信息时理性价格迅速收敛于均衡。","label":"理性价格按方差权重分离信息与噪声"},{"t":"过度自信者低估信号误差方差，把更大比例的信号当作真实信息，价格被信号影响过度，其后反转成为必然；模拟例（θ=2）：噪声较大时理性价格2.25、噪声较小时1.75，过度自信投资者把后者推高至2.33。","c":[],"k":"b","i":2,"h":"过度自信者低估信号误差方差，把更大比例的信号当作真实信息，价格被信号影响过度，其后反转成为必然；模拟例（θ=2）：噪声较大时理性价格2.25、噪声较小时1.75，过度自信投资者把后者推高至2.33。","label":"过度自信者低估信号误差方差，把更大比…"},{"t":"可校验假设：管理层在认为股票被高估时发行股份、被低估时回购（第15章证据支持）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">可校验假设</strong>：管理层在认为股票被高估时发行股份、被低估时回购（第15章证据支持）。","label":"可校验假设"}],"k":"b","i":1,"h":"13.2.1 DHS模型及对反转效应的解释","label":"13.2.1 DHS模型及对反转效应…"},{"t":"13.2.2 GH模型及对动量效应的解释","c":[{"t":"GH模型（Grinblatt-Han model）：基于前景理论、心理账户（mental accounting）：分门别类、块状处理信息的倾向——和处置效应（disposition effect）：获利卖出过快、损失卖出过迟的倾向，解释动量效应：投资者受参考点影响，需求曲线反映股票最近表现，导致对好（坏）消息的迟滞反应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">GH模型</strong>（Grinblatt-Han model）：基于前景理论、心理账户（mental accounting）：分门别类、块状处理信息的倾向——和处置效应（disposition effect）：获利卖出过快、损失卖出过迟的倾向，解释动量效应：投资者受参考点影响，需求曲线反映股票最近表现，导致对好（坏）消息的迟滞反应。","label":"GH模型"},{"t":"直觉基础：前景理论价值函数在收益区域凹（风险规避）、损失区域凸（风险寻求）、扭结处为参考点；心理账户使投资者逐一审视单个证券而非从组合视角。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">直觉基础</strong>：前景理论价值函数在收益区域凹（风险规避）、损失区域凸（风险寻求）、扭结处为参考点；心理账户使投资者逐一审视单个证券而非从组合视角。","label":"直觉基础"},{"t":"关键机制：越远离风险寻求区域越难再进入——蒙受损失证券的需求更高（损失越大需求越大）、获得利得证券的需求减少（利得越多需求越低），这是处置效应的可能解释、GH模型的关键。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键机制</strong>：越远离风险寻求区域越难再进入——蒙受损失证券的需求更高（损失越大需求越大）、获得利得证券的需求减少（利得越多需求越低），这是处置效应的可能解释、GH模型的关键。","label":"关键机制"},{"t":"需求与均衡价格：理性投资者需求D(R),=1+b(Vt−pt)（b>0，价值高于价格时需求增加）；受前景理论与心理账户影响者（PT/MA）再叠加λ(ref,−pt)，ref,为参考点、λ>0衡量资本损益相对重要性（ref,>pt时处于风险寻求区域、需求增加）；市场出清价格pt=w·Vt+(1−w)·ref,，w=1/(1+μλ)——价格是真实价值与参考点的加权，PT/MA投资者占比μ越大、λ越大，参考点影响越强、反应不足越严重。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求与均衡价格</strong>：理性投资者需求D(R),=1+b(Vt−pt)（b&gt;0，价值高于价格时需求增加）；受前景理论与心理账户影响者（PT/MA）再叠加λ(ref,−pt)，ref,为参考点、λ&gt;0衡量资本损益相对重要性（ref,&gt;pt时处于风险寻求区域、需求增加）；市场出清价格pt=w·Vt+(1−w)·ref,，w=1/(1+μλ)——价格是真实价值与参考点的加权，PT/MA投资者占比μ越大、λ越大，参考点影响越强、反应不足越严重。","label":"需求与均衡价格"},{"t":"参考点动态：ref,+1=v·pt+(1−v)·ref,，调整速度v与换手率相联系（新买方以买入价为参考点）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考点动态</strong>：ref,+1=v·pt+(1−v)·ref,，调整速度v与换手率相联系（新买方以买入价为参考点）。","label":"参考点动态"},{"t":"期望收益率E(R,+1)=(1−w)v(pt−ref,)/pt：未实现资本利得(pt−ref,)越高、参考点调整越快，期望收益越高；模型并未把未来期望收益与历史收益率（动量）直接挂钩，但未实现资本利得与历史收益率高度相关，且比历史收益率更能预测未来收益——控制处置效应后，以历史收益率为基础的动量消失。","c":[],"k":"b","i":2,"h":"期望收益率E(R,+1)=(1−w)v(pt−ref,)/pt：未实现资本利得(pt−ref,)越高、参考点调整越快，期望收益越高；模型并未把未来期望收益与历史收益率（动量）直接挂钩，但未实现资本利得与历史收益率高度相关，且比历史收益率更能预测未来收益——控制处置效应后，以历史收益率为基础的动量消失。","label":"期望收益率E"},{"t":"局限：只解释动量效应，不含反转效应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">局限</strong>：只解释动量效应，不含反转效应。","label":"局限：只解释动量效应，不含反转效应。"}],"k":"b","i":1,"h":"13.2.2 GH模型及对动量效应的解释","label":"13.2.2 GH模型及对动量效应的解释"},{"t":"13.2.3 BSV模型及对动量效应和反转效应的解释","c":[{"t":"BSV模型（Barberis-Shleifer-Vishny model）：基于锚定效应和代表性启发（representativeness heuristic）：以小样本特征推断总体、非黑即白的倾向——投资者粗枝大叶的校准，先低估后高估小概率事件，即\"缓慢过度反应\"，同时解释动量与反转。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">BSV模型</strong>（Barberis-Shleifer-Vishny model）：基于锚定效应和代表性启发（representativeness heuristic）：以小样本特征推断总体、非黑即白的倾向——投资者粗枝大叶的校准，先低估后高估小概率事件，即&quot;缓慢过度反应&quot;，同时解释动量与反转。","label":"BSV模型"},{"t":"赢利遵循随机游走（历史增速无助于预测未来增速）：n,+1=n,+e,+1，e取±y等概率；投资者只进行粗校准，认为股票处于两个可转换区域：区域1=均值反转（给定当期赢利增/减，下期同向概率πL较小）、区域2=持续（同向概率πR较大，πL<πR）；区域间转移概率λ1（1→2）、λ2（2→1）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">赢利遵循随机游走</strong>（历史增速无助于预测未来增速）：n,+1=n,+e,+1，e取±y等概率；投资者只进行粗校准，认为股票处于两个可转换区域：区域1=均值反转（给定当期赢利增/减，下期同向概率πL较小）、区域2=持续（同向概率πR较大，πL&lt;πR）；区域间转移概率λ1（1→2）、λ2（2→1）。","label":"赢利遵循随机游走"},{"t":"推断更新：连续同向赢利变动→处于区域1的推算概率q下降（转向持续信念）；赢利变动方向反转→q上升（回到均值反转信念）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推断更新</strong>：连续同向赢利变动→处于区域1的推算概率q下降（转向持续信念）；赢利变动方向反转→q上升（回到均值反转信念）。","label":"推断更新"},{"t":"估值：赢利全部以股利发放，若正确认识随机游走，价格即年金式p,=n,/R；BSV中价格在基准上叠加q,的函数k,——q,高于某值时k,为负，价格随赢利变动同向但幅度不足（反应不足）；q,低于某值时k,为正，出现反应过度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">估值</strong>：赢利全部以股利发放，若正确认识随机游走，价格即年金式p,=n,/R；BSV中价格在基准上叠加q,的函数k,——q,高于某值时k,为负，价格随赢利变动同向但幅度不足（反应不足）；q,低于某值时k,为正，出现反应过度。","label":"估值：赢利全部以股利发放，若正确认识…"},{"t":"模拟（6年、2000家公司，πR=3/4、πL=1/3、λ1=0.1、λ2=0.3）：连续好（坏）信息组合先持续上涨（下跌）后纠正；收益排序组合1-2年持续（0.0391、0.0131）、3-4年反转（−0.0072、−0.0309），与动量反转文献一致；按P/E分层的最高与最低比率收益率差为4.35%，与价值股-成长股效应一致。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">模拟</strong>（6年、2000家公司，πR=3/4、πL=1/3、λ1=0.1、λ2=0.3）：连续好（坏）信息组合先持续上涨（下跌）后纠正；收益排序组合1-2年持续（0.0391、0.0131）、3-4年反转（−0.0072、−0.0309），与动量反转文献一致；按P/E分层的最高与最低比率收益率差为4.35%，与价值股-成长股效应一致。","label":"模拟（6年、2000家公司，πR=3…"},{"t":"结论：BSV模型大体能同时解释赢利漂移、动量效应、反转效应与价值股-成长股效应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：BSV模型大体能同时解释赢利漂移、动量效应、反转效应与价值股-成长股效应。","label":"结论：BSV模型大体能同时解释赢利漂…"}],"k":"b","i":1,"h":"13.2.3 BSV模型及对动量效应和反转效应的解释","label":"13.2.3 BSV模型及对动量效应…"}],"k":"sec","i":0,"h":"13.2 动量效应与反转效应","label":"13.2 动量效应与反转效应"},{"t":"13.3 异象的理性投资者解释","c":[{"t":"发现异象不能断言市场无效：关于异象的解释有些与理性投资者及市场有效性一致。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">发现异象不能断言市场无效</strong>：关于异象的解释有些与理性投资者及市场有效性一致。","label":"发现异象不能断言市场无效"},{"t":"数据挖掘反驳：观察足够长时间时\"数据将符合趋势\"；但动量效应与价值溢价等持久性异象在各时间段、不同市场均有发现，极大动摇该反驳；计算方法瑕疵之说技术性强，对大部分异象站不住脚。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">数据挖掘反驳</strong>：观察足够长时间时&quot;数据将符合趋势&quot;；但动量效应与价值溢价等持久性异象在各时间段、不同市场均有发现，极大动摇该反驳；计算方法瑕疵之说技术性强，对大部分异象站不住脚。","label":"数据挖掘反驳"},{"t":"13.3.1 不合理的风险调整","c":[{"t":"联合假设检验（joint hypothesis test）：市场有效性检验=市场有效性+专门的风险调整模型两部分；拒绝原假设意味着市场非有效、或风险调整方法错误、或两者兼有。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">联合假设检验</strong>（joint hypothesis test）：市场有效性检验=市场有效性+专门的风险调整模型两部分；拒绝原假设意味着市场非有效、或风险调整方法错误、或两者兼有。","label":"联合假设检验"},{"t":"赌场例子：老虎机宣称回报率−2%但实际期望损失5%；以宣称值作基准检验会拒绝有效性，但问题在均衡模型（基准定价）错误而非市场无效——说明市场有效性的偏离可能是暂时的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">赌场例子</strong>：老虎机宣称回报率−2%但实际期望损失5%；以宣称值作基准检验会拒绝有效性，但问题在均衡模型（基准定价）错误而非市场无效——说明市场有效性的偏离可能是暂时的。","label":"赌场例子"},{"t":"法玛-弗伦奇1992：CAPM在1963-1990年数据中似乎不再有效（检验不支持\"平均收益率与贝塔正相关\"），公司规模与账面市值比能解释股票收益；控制规模与账面市值比构建的组合后，市场超额收益率能很好解释收益率变动——规模与账面市值比是股票收益率风险的重要影响因素。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">法玛-弗伦奇1992</strong>：CAPM在1963-1990年数据中似乎不再有效（检验不支持&quot;平均收益率与贝塔正相关&quot;），公司规模与账面市值比能解释股票收益；控制规模与账面市值比构建的组合后，市场超额收益率能很好解释收益率变动——规模与账面市值比是股票收益率风险的重要影响因素。","label":"法玛-弗伦奇1992"}],"k":"b","i":1,"h":"13.3.1 不合理的风险调整","label":"13.3.1 不合理的风险调整"},{"t":"13.3.2 法玛-弗伦奇三因素模型","c":[{"t":"法玛-弗伦奇三因素模型（Fama-French three-factor model）：超额回报不仅经市场风险调整，还需经规模、账面市值比相联系的风险调整；回归式R;,t−Rf,t=α+β1(Rm,t−Rf,t)+β2·规模因素+β3·HML,t+e（规模因素通常记作SMB，账面市值比因素为HML），不存在超额回报时阿尔法α为零。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">法玛-弗伦奇三因素模型</strong>（Fama-French three-factor model）：超额回报不仅经市场风险调整，还需经规模、账面市值比相联系的风险调整；回归式R;,t−Rf,t=α+β1(Rm,t−Rf,t)+β2·规模因素+β3·HML,t+e（规模因素通常记作SMB，账面市值比因素为HML），不存在超额回报时阿尔法α为零。","label":"法玛-弗伦奇三因素模型"},{"t":"争论：有人认为它合理反映了广为所知的风险来源，有人质疑它把投资者非理性误差转换成风险因素、是做作的模型；法玛-弗伦奇认为第二、三因素是\"破产风险\"的不同侧面，但困境股票在熊市中并未显著表现不好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">争论</strong>：有人认为它合理反映了广为所知的风险来源，有人质疑它把投资者非理性误差转换成风险因素、是做作的模型；法玛-弗伦奇认为第二、三因素是&quot;破产风险&quot;的不同侧面，但困境股票在熊市中并未显著表现不好。","label":"争论：有人认为它合理反映了广为所知的…"},{"t":"即使认为风险背后是非理性因素的人也承认它是实用的专业投资表现评价调整方法（第19章再讨论）。","c":[],"k":"b","i":2,"h":"即使认为风险背后是非理性因素的人也承认它是实用的专业投资表现评价调整方法（第19章再讨论）。","label":"即使认为风险背后是非理性因素的人也承…"}],"k":"b","i":1,"h":"13.3.2 法玛-弗伦奇三因素模型","label":"13.3.2 法玛-弗伦奇三因素模型"},{"t":"13.3.3 动量效应的解释","c":[{"t":"法玛-弗伦奇三因素模型无法解释动量效应，法玛和弗伦奇也承认（动量研究常用三因素调整，结果不受影响；无风险支持时可把动量作为第四因素加入，如Carhart模型）。","c":[],"k":"b","i":2,"h":"法玛-弗伦奇三因素模型无法解释动量效应，法玛和弗伦奇也承认（动量研究常用三因素调整，结果不受影响；无风险支持时可把动量作为第四因素加入，如Carhart模型）。","label":"法玛-弗伦奇三因素模型无法解释动量效…"},{"t":"风险解释：把动量效应与经济周期、市场状态联系，不可分散的宏观经济风险可解释大部分（但该结果未能通过控制微观结构偏差的常用检验；动量利润仅存在于上涨市场之后，与DHS模型过度自信与市场表现正相关的观点一致）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">风险解释</strong>：把动量效应与经济周期、市场状态联系，不可分散的宏观经济风险可解释大部分（但该结果未能通过控制微观结构偏差的常用检验；动量利润仅存在于上涨市场之后，与DHS模型过度自信与市场表现正相关的观点一致）。","label":"风险解释"},{"t":"最新理性修正：时变不确定贝塔的CAPM——市场表现好时投资者经贝叶斯推断向上修正遭受利好冲击股票的贝塔、向下修正利空冲击股票的贝塔，动量\"收益\"可能是尚未被解释风险的反映。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最新理性修正</strong>：时变不确定贝塔的CAPM——市场表现好时投资者经贝叶斯推断向上修正遭受利好冲击股票的贝塔、向下修正利空冲击股票的贝塔，动量&quot;收益&quot;可能是尚未被解释风险的反映。","label":"最新理性修正"}],"k":"b","i":1,"h":"13.3.3 动量效应的解释","label":"13.3.3 动量效应的解释"},{"t":"13.3.4 市场有效性的暂时偏离及适应性市场假说","c":[{"t":"市场可能暂时无效，当足够多的套利者构思出获利方法时定价偏差逐渐消失；有证据表明小公司效应正不断减轻。","c":[],"k":"b","i":2,"h":"市场可能暂时无效，当足够多的套利者构思出获利方法时定价偏差逐渐消失；有证据表明小公司效应正不断减轻。","label":"市场可能暂时无效，当足够多的套利者构…"},{"t":"LSV 1994：随成熟量化策略（基于市场表现而非个体股票选择构建组合）发展，价值股需求将增加、热门股票选择偏好的委托代理问题将减轻；该文发表后成长组合先显著跑赢数年，新千年价值效应又强劲反弹。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">LSV 1994</strong>：随成熟量化策略（基于市场表现而非个体股票选择构建组合）发展，价值股需求将增加、热门股票选择偏好的委托代理问题将减轻；该文发表后成长组合先显著跑赢数年，新千年价值效应又强劲反弹。","label":"LSV 1994"},{"t":"价值效应根源是行为方式、习惯改变一向缓慢，因此有理由相信比无行为根源的小公司效应更持久。","c":[],"k":"b","i":2,"h":"价值效应根源是行为方式、习惯改变一向缓慢，因此有理由相信比无行为根源的小公司效应更持久。","label":"价值效应根源是行为方式、习惯改变一向…"},{"t":"适应性市场假说（adaptive markets hypothesis，安德鲁·洛提出）：异象波动的周期性与市场演化进程相关；信念错误与有限套利导致的异象在足够长时间与竞争力量作用下逐渐消失、与现实不符的信念将适应新环境；套利力量缺失时人的本性占据主导并导致套利机会再现。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">适应性市场假说</strong>（adaptive markets hypothesis，安德鲁·洛提出）：异象波动的周期性与市场演化进程相关；信念错误与有限套利导致的异象在足够长时间与竞争力量作用下逐渐消失、与现实不符的信念将适应新环境；套利力量缺失时人的本性占据主导并导致套利机会再现。","label":"适应性市场假说"}],"k":"b","i":1,"h":"13.3.4 市场有效性的暂时偏离及适应性市场假说","label":"13.3.4 市场有效性的暂时偏离及…"}],"k":"sec","i":0,"h":"13.3 异象的理性投资者解释","label":"13.3 异象的理性投资者解释"}],"k":"chap","h":"第13章 市场异象的行为解释","label":"第13章 市场异象的行为解释"},{"t":"第14章 行为因素能否解释股票市场之谜","c":[{"t":"本章要点","c":[{"t":"股票市场溢价是股票市场与债务市场期望收益率之差；产生观测到的溢价水平需要非常高的风险厌恶程度，因而成为谜题。","c":[],"k":"b","i":1,"h":"股票市场溢价是股票市场与债务市场期望收益率之差；产生观测到的溢价水平需要非常高的风险厌恶程度，因而成为谜题。","label":"股票市场溢价是股票市场与债务市场期望…"},{"t":"幸存者偏差：失效的观测值随时间从样本中消失，存活者产生有偏（偏高）的结果，这或许是股票市场溢价的原因之一。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">幸存者偏差</strong>：失效的观测值随时间从样本中消失，存活者产生有偏（偏高）的结果，这或许是股票市场溢价的原因之一。","label":"幸存者偏差"},{"t":"损失厌恶、心理账户和所谓短视的损失厌恶能解释投资者为何对股票要求高的风险溢价。","c":[],"k":"b","i":1,"h":"损失厌恶、心理账户和所谓短视的损失厌恶能解释投资者为何对股票要求高的风险溢价。","label":"损失厌恶、心理账户和所谓短视的损失厌…"},{"t":"当市场高价更多基于投资者的热情而非经济基本面时即出现投机性泡沫；郁金香狂热、科技互联网泡沫等价格泡沫在各个市场中反复出现。","c":[],"k":"b","i":1,"h":"当市场高价更多基于投资者的热情而非经济基本面时即出现投机性泡沫；郁金香狂热、科技互联网泡沫等价格泡沫在各个市场中反复出现。","label":"当市场高价更多基于投资者的热情而非经…"},{"t":"博傻理论：人们对某一资产的购买是因为认为有人会出更高的价格将其买走。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">博傻理论</strong>：人们对某一资产的购买是因为认为有人会出更高的价格将其买走。","label":"博傻理论"},{"t":"20世纪90年代美国股市似乎与基本面决定的价值有很大偏离，科技类股票最严重；美联储前主席格林斯潘以\"非理性繁荣\"形容 5.1%；全样本最小股票溢价为3.5%（股票与债券几何收益率之差），1926年以来区间溢价为5.2%。","label":"表14-1"}],"k":"b","i":1,"h":"14.1.1 股票市场溢价","label":"14.1.1 股票市场溢价"},{"t":"14.1.2 股票市场溢价何以成为一个谜题","c":[{"t":"谜题所在：股票风险更大理应获得更高回报，但在期望效用理论成立时，解释观测溢价需要非常高的风险厌恶水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">谜题所在</strong>：股票风险更大理应获得更高回报，但在期望效用理论成立时，解释观测溢价需要非常高的风险厌恶水平。","label":"谜题所在"},{"t":"梅拉-普雷斯科特：合理风险厌恶水平下风险溢价仅为0.1%；常用对数效用函数的相对风险厌恶系数（coefficient of relative risk aversion）为1.0，数值越高风险厌恶越大；为产生观察到的溢价，系数需达到惊人的30。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">梅拉-普雷斯科特</strong>：合理风险厌恶水平下风险溢价仅为0.1%；常用对数效用函数的相对风险厌恶系数（coefficient of relative risk aversion）为1.0，数值越高风险厌恶越大；为产生观察到的溢价，系数需达到惊人的30。","label":"梅拉-普雷斯科特"},{"t":"确定性等价游戏：游戏P1(0.50, 50,000美元, 100,000美元)对风险厌恶系数为30的人，无差异点（确定性等价）为51,209美元——显然不是人们常有的风险厌恶程度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">确定性等价游戏</strong>：游戏P1(0.50, 50,000美元, 100,000美元)对风险厌恶系数为30的人，无差异点（确定性等价）为51,209美元——显然不是人们常有的风险厌恶程度。","label":"确定性等价游戏"}],"k":"b","i":1,"h":"14.1.2 股票市场溢价何以成为一个谜题","label":"14.1.2 股票市场溢价何以成为一…"},{"t":"14.1.3 什么能解释这一谜题","c":[{"t":"理性解释——幸存者偏差（survivorship bias）：失效（中断）的观测值随时间退出样本，只统计幸存者会使结果有偏；高尔夫锦标赛模拟：100名水平相同选手（杆数均值71、标准差3）两轮后一半晋级，晋级者四轮平均70.1，低于全体100人前两轮平均70.9。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理性解释——幸存者偏差</strong>（survivorship bias）：失效（中断）的观测值随时间退出样本，只统计幸存者会使结果有偏；高尔夫锦标赛模拟：100名水平相同选手（杆数均值71、标准差3）两轮后一半晋级，晋级者四轮平均70.1，低于全体100人前两轮平均70.9。","label":"理性解释——幸存者偏差"},{"t":"应用：布朗-戈茨曼-罗斯考察各国股市历史——20世纪初存在36个股市，超半数因战争或国有化中断交易并造成投资者巨大损失；只考虑连续交易的市场会使平均市场回报率向上偏差。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用</strong>：布朗-戈茨曼-罗斯考察各国股市历史——20世纪初存在36个股市，超半数因战争或国有化中断交易并造成投资者巨大损失；只考虑连续交易的市场会使平均市场回报率向上偏差。","label":"应用：布朗-戈茨曼-罗斯考察各国股市…"},{"t":"行为解释一——模糊厌恶（ambiguity aversion）：投资者不仅不知道从收益率分布中抽到的随机数是什么，还不知道分布参数（如均值）是什么——与问卷中事前股票溢价预测高度分散吻合；模糊厌恶叠加风险厌恶使\"实际风险厌恶水平\"上升，适当设定下可得约5%的溢价。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行为解释一——模糊厌恶</strong>（ambiguity aversion）：投资者不仅不知道从收益率分布中抽到的随机数是什么，还不知道分布参数（如均值）是什么——与问卷中事前股票溢价预测高度分散吻合；模糊厌恶叠加风险厌恶使&quot;实际风险厌恶水平&quot;上升，适当设定下可得约5%的溢价。","label":"行为解释一——模糊厌恶"},{"t":"行为解释二——损失厌恶（loss aversion）与心理账户：本阿齐-泰勒采用前景理论价值函数并简化为参考点处扭结的线性函数（损失厌恶系数λ=2.5）；一次性游戏P2(0.50, 200美元, −100美元)的价值为−25（拒绝参与），两轮合并考察（P3）时损失概率由50%降至25%、价值为+25（接受）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行为解释二——损失厌恶</strong>（loss aversion）与心理账户：本阿齐-泰勒采用前景理论价值函数并简化为参考点处扭结的线性函数（损失厌恶系数λ=2.5）；一次性游戏P2(0.50, 200美元, −100美元)的价值为−25（拒绝参与），两轮合并考察（P3）时损失概率由50%降至25%、价值为+25（接受）。","label":"行为解释二——损失厌恶"},{"t":"短视的损失厌恶（myopic loss aversion）：人们厌恶风险且过于频繁地审视账户损益，审视频率约一年（人们通常仔细审查财富账户的频率）；投资者为退休长期投资、期末损失才是真损失，却忍不住过早记账、不愿接受短期损失——由此对股票要求高溢价；证据显示芝加哥交易所职业交易员比普通学生更明显表现出短视损失厌恶。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短视的损失厌恶</strong>（myopic loss aversion）：人们厌恶风险且过于频繁地审视账户损益，审视频率约一年（人们通常仔细审查财富账户的频率）；投资者为退休长期投资、期末损失才是真损失，却忍不住过早记账、不愿接受短期损失——由此对股票要求高溢价；证据显示芝加哥交易所职业交易员比普通学生更明显表现出短视损失厌恶。","label":"短视的损失厌恶"}],"k":"b","i":1,"h":"14.1.3 什么能解释这一谜题","label":"14.1.3 什么能解释这一谜题"}],"k":"sec","i":0,"h":"14.1 股票溢价之谜","label":"14.1 股票溢价之谜"},{"t":"14.2 现实世界的泡沫","c":[{"t":"股价有时与公司预期及观测表现完全无关；安然事件中投资者愿付高股价也起了作用；纳斯达克综合指数1999年3月10日收于2,406.00点，2000年3月10日翻番并最高收于5,048.62点，随后急跌至2002年10月9日的1,114.11点。","c":[],"k":"b","i":1,"h":"股价有时与公司预期及观测表现完全无关；安然事件中投资者愿付高股价也起了作用；纳斯达克综合指数1999年3月10日收于2,406.00点，2000年3月10日翻番并最高收于5,048.62点，随后急跌至2002年10月9日的1,114.11点。","label":"股价有时与公司预期及观测表现完全无关…"},{"t":"14.2.1 郁金香狂热","c":[{"t":"投机泡沫（bubble / speculative bubble）：高价格的产生更多源于投资者热情而非经济基本面；泡沫只能事后定义——某时点泡沫破裂、价格向下调整（有时非常迅速）；后见之明偏差使投资者声称\"早知道\"存在泡沫，却又参与其中并常遭受巨大损失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">投机泡沫</strong>（bubble / speculative bubble）：高价格的产生更多源于投资者热情而非经济基本面；泡沫只能事后定义——某时点泡沫破裂、价格向下调整（有时非常迅速）；后见之明偏差使投资者声称&quot;早知道&quot;存在泡沫，却又参与其中并常遭受巨大损失。","label":"投机泡沫"},{"t":"1630年（前后）的郁金香狂热：郁金香16世纪首次出现在西欧，热衷始于贵族、后中产阶级加入，需求逐年放大，荷兰、德国等地城市纷纷设立郁金香交易所；赌博与投机盛行，有人愿以总计2,500弗罗林的商品财富（2拉斯特小麦448、4拉斯特黑麦558、4头牛480、8头猪240、12头羊120、2桶葡萄酒70、4发酵桶啤酒32、2发酵桶黄油192、1,000份奶酪120、1张床100、1套衣服80、1个银质茶杯60）换取一个稀罕球茎（弗罗林为荷兰本位币，2002年才被欧元取代）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">1630年</strong>（前后）的郁金香狂热：郁金香16世纪首次出现在西欧，热衷始于贵族、后中产阶级加入，需求逐年放大，荷兰、德国等地城市纷纷设立郁金香交易所；赌博与投机盛行，有人愿以总计2,500弗罗林的商品财富（2拉斯特小麦448、4拉斯特黑麦558、4头牛480、8头猪240、12头羊120、2桶葡萄酒70、4发酵桶啤酒32、2发酵桶黄油192、1,000份奶酪120、1张床100、1套衣服80、1个银质茶杯60）换取一个稀罕球茎（弗罗林为荷兰本位币，2002年才被欧元取代）。","label":"1630年"},{"t":"博傻理论（greater fool theory）：虽然认为资产价格过高仍买入，因为相信会有\"更傻\"的人出更高的价格买走——郁金香买主可能明知球茎不值2,500弗罗林，但预期有人出更高价。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">博傻理论</strong>（greater fool theory）：虽然认为资产价格过高仍买入，因为相信会有&quot;更傻&quot;的人出更高的价格买走——郁金香买主可能明知球茎不值2,500弗罗林，但预期有人出更高价。","label":"博傻理论"},{"t":"备选（非全然非理性）解释：郁金香品种与色彩繁多、或真是稀罕之物（类比艺术收藏家为名画一掷千金）；当时高估价或许是彼时偏好的反映，价格骤跌或源于偏好突变——可能性小但并非全无可能。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">备选</strong>（非全然非理性）解释：郁金香品种与色彩繁多、或真是稀罕之物（类比艺术收藏家为名画一掷千金）；当时高估价或许是彼时偏好的反映，价格骤跌或源于偏好突变——可能性小但并非全无可能。","label":"备选（非全然非理性）解释：郁金香品种…"}],"k":"b","i":1,"h":"14.2.1 郁金香狂热","label":"14.2.1 郁金香狂热"},{"t":"14.2.2 科技互联网泡沫","c":[{"t":"席勒：\"非理性繁荣\"（irrational exuberance）最能说明20世纪90年代后期市场情绪；该词由美联储主席格林斯潘1996年12月5日演讲提出，股市短暂下跌后继续上扬、于2000年早期见顶。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">席勒</strong>：&quot;非理性繁荣&quot;（irrational exuberance）最能说明20世纪90年代后期市场情绪；该词由美联储主席格林斯潘1996年12月5日演讲提出，股市短暂下跌后继续上扬、于2000年早期见顶。","label":"席勒：\"非理性繁荣\"（irratio…"},{"t":"标准普尔500（1871年1月-2008年8月，实际价格与收益，经CPI调整）与市盈率曲线：历史高峰为1929年9月的32.6（20年代牛市顶点，之后至1932年市值跌逾80%），1901年与1966年的高峰后亦有大跌；而1999年44.2的市盈率前所未有。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">标准普尔500</strong>（1871年1月-2008年8月，实际价格与收益，经CPI调整）与市盈率曲线：历史高峰为1929年9月的32.6（20年代牛市顶点，之后至1932年市值跌逾80%），1901年与1966年的高峰后亦有大跌；而1999年44.2的市盈率前所未有。","label":"标准普尔500"},{"t":"投资者凭什么接受高价：\"新时代\"论点——个人计算机（特别是通过互联网）将极大提升未来赢利与效率；席勒论证互联网、在线交易的便利与24小时连续营业是泡沫的重要因素；理性解释之门未关：Schwartz-Moon（2000）指出按所选拥参数与足够高的赢利增速，互联网股票高股价可能是理性的结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">投资者凭什么接受高价</strong>：&quot;新时代&quot;论点——个人计算机（特别是通过互联网）将极大提升未来赢利与效率；席勒论证互联网、在线交易的便利与24小时连续营业是泡沫的重要因素；理性解释之门未关：Schwartz-Moon（2000）指出按所选拥参数与足够高的赢利增速，互联网股票高股价可能是理性的结果。","label":"投资者凭什么接受高价"},{"t":"席勒信心指数（1989年起耶鲁投资者行为项目问卷调查）：由选择\"股价太低\"或\"差不多合理\"者占有效选择（太低/太高/差不多合理）的比例构建，对个人与机构投资者分别编制；1989~1999年持续下降，1999年低点仅31%的个人投资者与29%的机构投资者认为市场未被高估（即69%/71%认为股价过高）；2000年早期见顶后下降趋势逆转、恢复到90年代早期水平，2003~2008年中期总体相对稳定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">席勒信心指数</strong>（1989年起耶鲁投资者行为项目问卷调查）：由选择&quot;股价太低&quot;或&quot;差不多合理&quot;者占有效选择（太低/太高/差不多合理）的比例构建，对个人与机构投资者分别编制；1989~1999年持续下降，1999年低点仅31%的个人投资者与29%的机构投资者认为市场未被高估（即69%/71%认为股价过高）；2000年早期见顶后下降趋势逆转、恢复到90年代早期水平，2003~2008年中期总体相对稳定。","label":"席勒信心指数"},{"t":"那些在上涨中仍买入的投资者或受博傻理论驱动；为确定泡沫产生的关键因素，转入实验金融研究。","c":[],"k":"b","i":2,"h":"那些在上涨中仍买入的投资者或受博傻理论驱动；为确定泡沫产生的关键因素，转入实验金融研究。","label":"那些在上涨中仍买入的投资者或受博傻理…"}],"k":"b","i":1,"h":"14.2.2 科技互联网泡沫","label":"14.2.2 科技互联网泡沫"}],"k":"sec","i":0,"h":"14.2 现实世界的泡沫","label":"14.2 现实世界的泡沫"},{"t":"14.3 实验泡沫市场","c":[{"t":"14.3.1 泡沫市场的实验设计","c":[{"t":"史密斯、苏查内克、威廉1988年首次报告实验资产市场中的泡沫：最令人惊奇的是在机制非常简单、证券内在价值一目了然的市场中泡沫依然存在（现实中证券内在价值从来难以确定）。","c":[],"k":"b","i":2,"h":"史密斯、苏查内克、威廉1988年首次报告实验资产市场中的泡沫：最令人惊奇的是在机制非常简单、证券内在价值一目了然的市场中泡沫依然存在（现实中证券内在价值从来难以确定）。","label":"史密斯、苏查内克、威廉1988年首次…"},{"t":"泡沫市场设计（bubble market design）：实验主体对资产进行有限期交易，资产每期末支付股利、股利分布已知且各期相同；风险中性下内在价值=每期期望股利×剩余期限数（风险厌恶时内在价值略低）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">泡沫市场设计</strong>（bubble market design）：实验主体对资产进行有限期交易，资产每期末支付股利、股利分布已知且各期相同；风险中性下内在价值=每期期望股利×剩余期限数（风险厌恶时内在价值略低）。","label":"泡沫市场设计"},{"t":"书中示例：共12期交易、每期5分钟，每期期望股利0.72美元，第一期内在价值8.64美元，其后每期递减0.72美元；另有彩票资产：期望收益与标准资产完全相同，但多为零支付、有4%概率得18美元大额支付。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中示例</strong>：共12期交易、每期5分钟，每期期望股利0.72美元，第一期内在价值8.64美元，其后每期递减0.72美元；另有彩票资产：期望收益与标准资产完全相同，但多为零支付、有4%概率得18美元大额支付。","label":"书中示例"},{"t":"典型走势：第一期价格通常低于内在价值（初始不熟练、初始风险厌恶），随后迅速上升并超过内在价值，部分泡沫持续性强，临近实验结束时价格急跌回归内在价值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">典型走势</strong>：第一期价格通常低于内在价值（初始不熟练、初始风险厌恶），随后迅速上升并超过内在价值，部分泡沫持续性强，临近实验结束时价格急跌回归内在价值。","label":"典型走势"}],"k":"b","i":1,"h":"14.3.1 泡沫市场的实验设计","label":"14.3.1 泡沫市场的实验设计"},{"t":"14.3.2 从这些实验中我们能学到什么","c":[{"t":"老练程度：交易者掌握更多金融知识、有实验泡沫市场经历时，泡沫更轻微且消除更快（专业知识含经历与知识）；即使只有部分投资者老练，价格对内在价值的偏离也变小——定价有效不要求所有交易者都知识丰富、经历丰富。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">老练程度</strong>：交易者掌握更多金融知识、有实验泡沫市场经历时，泡沫更轻微且消除更快（专业知识含经历与知识）；即使只有部分投资者老练，价格对内在价值的偏离也变小——定价有效不要求所有交易者都知识丰富、经历丰富。","label":"老练程度"},{"t":"彩票资产（lottery asset）：与标准资产期望收益完全相同却被支付更高价格——与前景理论权重函数一致的高估小概率（概率判断误差），或交易中赌徒式兴奋使人们更愿承担风险（投机）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">彩票资产</strong>（lottery asset）：与标准资产期望收益完全相同却被支付更高价格——与前景理论权重函数一致的高估小概率（概率判断误差），或交易中赌徒式兴奋使人们更愿承担风险（投机）。","label":"彩票资产"},{"t":"流动性：市场资金充裕对投机与泡沫形成火上浇油（类似赌场资金效应）；限制交易者只能买入或只能卖出（消除投机可能）后泡沫仍常出现——投机并非泡沫形成之必须，关键在于人们的非理性行为；另有研究发现泡沫出现频率与程度和概率判断误差相联系，同时投机在定价中起重要作用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">流动性</strong>：市场资金充裕对投机与泡沫形成火上浇油（类似赌场资金效应）；限制交易者只能买入或只能卖出（消除投机可能）后泡沫仍常出现——投机并非泡沫形成之必须，关键在于人们的非理性行为；另有研究发现泡沫出现频率与程度和概率判断误差相联系，同时投机在定价中起重要作用。","label":"流动性：市场资金充裕对投机与泡沫形成…"},{"t":"市场管理模式：卖空限制促进泡沫形成——悲观而持股者可抛售表达观点，悲观而不持股者却无法操作，乐观者成为定价主体，价格可能被推至很高水平；政策含义：增加交易限制反而可能损害市场有效性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">市场管理模式</strong>：卖空限制促进泡沫形成——悲观而持股者可抛售表达观点，悲观而不持股者却无法操作，乐观者成为定价主体，价格可能被推至很高水平；政策含义：增加交易限制反而可能损害市场有效性。","label":"市场管理模式"}],"k":"b","i":1,"h":"14.3.2 从这些实验中我们能学到什么","label":"14.3.2 从这些实验中我们能学到什么"}],"k":"sec","i":0,"h":"14.3 实验泡沫市场","label":"14.3 实验泡沫市场"},{"t":"14.4 行为金融和市场定价","c":[{"t":"席勒：\"对投机性资产的投资从来都是一种社会行为\"；资产价格可能受时尚、社会风气（包括风险态度）以及后见之明等一系列行为因素影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">席勒</strong>：&quot;对投机性资产的投资从来都是一种社会行为&quot;；资产价格可能受时尚、社会风气（包括风险态度）以及后见之明等一系列行为因素影响。","label":"席勒：\"对投机性资产的投资从来都是一…"},{"t":"BHS模型（Barberis-Huang-Santos model）：损失厌恶投资者的风险态度随事前结果变化——股票价格上升带来的收益成为潜在损失的缓冲、风险厌恶程度减轻；价格下降使投资者更关注未来损失、风险厌恶程度增加；总结果是股票市场更大的波动性。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">BHS模型</strong>（Barberis-Huang-Santos model）：损失厌恶投资者的风险态度随事前结果变化——股票价格上升带来的收益成为潜在损失的缓冲、风险厌恶程度减轻；价格下降使投资者更关注未来损失、风险厌恶程度增加；总结果是股票市场更大的波动性。","label":"BHS模型"}],"k":"sec","i":0,"h":"14.4 行为金融和市场定价","label":"14.4 行为金融和市场定价"},{"t":"14.5 过度波动性","c":[{"t":"14.5.1 价格是不是变化过度了","c":[{"t":"过度波动（excessive volatility）：市场波动仅部分能归因于新信息的出现；卡特
