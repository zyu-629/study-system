"19.2.2 使用交易量指标完善动量投资（李-斯沃米娜坦）","label":"19.2.2 使用交易量指标完善动量投资"},{"t":"19.2.3 动量和反转（格林布拉特-莫斯科维茨）","c":[{"t":"利用历史收益率的全部期限结构可以获利：短期（1个月）与长期（3—5年）收益率负序列相关，中期（6—12个月）正序列相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利用历史收益率的全部期限结构可以获利</strong>：短期（1个月）与长期（3—5年）收益率负序列相关，中期（6—12个月）正序列相关。","label":"利用历史收益率的全部期限结构可以获利"},{"t":"方法允许历史收益与损失之间的不对称，并考虑收益/损失的一致性；理论联系：格林布拉特-汉模型中决定未来收益的是未实现资本利得——一直赢利的股票更可能拥有较大的未实现资本利得。","c":[],"k":"b","i":2,"h":"方法允许历史收益与损失之间的不对称，并考虑收益/损失的一致性；理论联系：格林布拉特-汉模型中决定未来收益的是未实现资本利得——一直赢利的股票更可能拥有较大的未实现资本利得。","label":"方法允许历史收益与损失之间的不对称，…"},{"t":"回归结果要点：前12至前2个月累积收益显著正相关；输者（该期收益为负）的序列相关更强、持续性更长；\"一致赢者\"指示变量（11个月中至少8个月为正收益）显著为正——一致性增强动量；\"一致输者\"没有任何影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">回归结果要点</strong>：前12至前2个月累积收益显著正相关；输者（该期收益为负）的序列相关更强、持续性更长；&quot;一致赢者&quot;指示变量（11个月中至少8个月为正收益）显著为正——一致性增强动量；&quot;一致输者&quot;没有任何影响。","label":"回归结果要点"},{"t":"结论：输者的序列相关（不论正负）被放大；赢者的一致性提高了收益（增强动量并削弱反转）；输者一致性从不会有任何影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：输者的序列相关（不论正负）被放大；赢者的一致性提高了收益（增强动量并削弱反转）；输者一致性从不会有任何影响。","label":"结论：输者的序列相关（不论正负）被放…"},{"t":"经济意义：按回归系数将股票排成期望收益十分位，零成本组合中第10与第1十分位的月收益率缺口达1.68%且十分显著——这正是技术分析人员凭历史收益做的事，只是缺少统计严谨性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济意义</strong>：按回归系数将股票排成期望收益十分位，零成本组合中第10与第1十分位的月收益率缺口达1.68%且十分显著——这正是技术分析人员凭历史收益做的事，只是缺少统计严谨性。","label":"经济意义"},{"t":"（蒙蒂尔）把短期动量与长期反转纳入同一框架的三种行为模型：巴伯瑞斯-史雷夫-维什尼（保守偏差/锚定＋代表性偏差→先反应不足后反应过度）；洪-斯坦（信息观察者与动量交易者两类有界理性投资者的互动）；丹尼尔-赫舒拉发-萨布拉玛尼安（过度自信＋自我归因偏差→只重视佐证信息、信心渐增，形成动量即延迟的过度反应；基础数据可视度低时过度自信最强，错误定价更易出现在成长股）。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）把短期动量与长期反转纳入同一框架的三种行为模型：巴伯瑞斯-史雷夫-维什尼（保守偏差/锚定＋代表性偏差→先反应不足后反应过度）；洪-斯坦（信息观察者与动量交易者两类有界理性投资者的互动）；丹尼尔-赫舒拉发-萨布拉玛尼安（过度自信＋自我归因偏差→只重视佐证信息、信心渐增，形成动量即延迟的过度反应；基础数据可视度低时过度自信最强，错误定价更易出现在成长股）。","label":"（蒙蒂尔）把短期动量与长期反转纳入同…"},{"t":"（蒙蒂尔）实验证据（布卢姆菲尔德等）：人们对收益时间序列的旧信息赋予过高权重——对可靠信息（近期盈利公告）反应不足、对不可靠信息（分析师长期增长预测）反应过度；对多次延续之后的变化反应过度、对多次反转之后的变化反应不足，支持巴伯瑞斯-史雷夫-维什尼的机制转换信念。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）实验证据（布卢姆菲尔德等）：人们对收益时间序列的旧信息赋予过高权重——对可靠信息（近期盈利公告）反应不足、对不可靠信息（分析师长期增长预测）反应过度；对多次延续之后的变化反应过度、对多次反转之后的变化反应不足，支持巴伯瑞斯-史雷夫-维什尼的机制转换信念。","label":"（蒙蒂尔）实验证据（布卢姆菲尔德等）…"}],"k":"b","i":1,"h":"<strong class=\"lead\">19.2.3 动量和反转</strong>（格林布拉特-莫斯科维茨）","label":"19.2.3 动量和反转"},{"t":"19.2.4 动量和价值（阿斯纳斯）","c":[{"t":"同时使用价值与动量条件：美国股票按两条件各分五分位，交叉形成25个组合。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">同时使用价值与动量条件</strong>：美国股票按两条件各分五分位，交叉形成25个组合。","label":"同时使用价值与动量条件"},{"t":"高动量-高价值组合平均月收益1.62%，低动量-低价值0.03%，多空组合收益1.59%。","c":[],"k":"b","i":2,"h":"高动量-高价值组合平均月收益1.62%，低动量-低价值0.03%，多空组合收益1.59%。","label":"高动量-高价值组合平均月收益1.62…"},{"t":"收益没有人们预期的那么高：价值条件对低交易量股票效果最好，而动量条件对低价值股票效果最好（低价值股中动量创造的收益率差额为1.47%）——两个条件并非正交叠加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">收益没有人们预期的那么高</strong>：价值条件对低交易量股票效果最好，而动量条件对低价值股票效果最好（低价值股中动量创造的收益率差额为1.47%）——两个条件并非正交叠加。","label":"收益没有人们预期的那么高"}],"k":"b","i":1,"h":"<strong class=\"lead\">19.2.4 动量和价值</strong>（阿斯纳斯）","label":"19.2.4 动量和价值"}],"k":"sec","i":0,"h":"19.2 完善异象捕获","label":"19.2 完善异象捕获"},{"t":"19.3 多元方法","c":[{"t":"莱因加纳姆（1988）","c":[{"t":"用222家1970—1983年间股价某一年至少翻番的公司提炼赢者共同特征，得到4个关键特征：市净率小于1（价值）、季度收入增长加速（优质公司筛选）、流通普通股少于2000万股（市值代理）、相对强度高（动量，季度价格变化的加权平均）。","c":[],"k":"b","i":2,"h":"用222家1970—1983年间股价某一年至少翻番的公司提炼赢者共同特征，得到4个关键特征：市净率小于1（价值）、季度收入增长加速（优质公司筛选）、流通普通股少于2000万股（市值代理）、相对强度高（动量，季度价格变化的加权平均）。","label":"用222家1970—1983年间股价…"},{"t":"样本外检验：排除这222家，用4特征筛选其余上市公司，全部特征齐备触发买入信号并随意持有两年；持有8个季度中每季计算超额收益，结果比标普500高37.14%（相同风险水平）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">样本外检验</strong>：排除这222家，用4特征筛选其余上市公司，全部特征齐备触发买入信号并随意持有两年；持有8个季度中每季计算超额收益，结果比标普500高37.14%（相同风险水平）。","label":"样本外检验"}],"k":"b","i":1,"h":"<strong class=\"lead\">莱因加纳姆</strong>（1988）","label":"莱因加纳姆"},{"t":"豪根-贝克","c":[{"t":"把可选因素的预测贡献分为5大类：风险（贝塔、宏观经济敏感度）、流动性（每股价格、交易量——流动性差者需更高收益补偿交易成本）、价格水平（本质刻画价值策略）、增长潜能（更高未来增长的可能性，用赢利指标代理）、技术（动量与反转测度）；对每月横截面做因素回归。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">把可选因素的预测贡献分为5大类</strong>：风险（贝塔、宏观经济敏感度）、流动性（每股价格、交易量——流动性差者需更高收益补偿交易成本）、价格水平（本质刻画价值策略）、增长潜能（更高未来增长的可能性，用赢利指标代理）、技术（动量与反转测度）；对每月横截面做因素回归。","label":"把可选因素的预测贡献分为5大类"},{"t":"结果：因素的影响在前后两半样本间显著一致；风险测度没有出现；占主导的是技术因素、价格水平因素与流动性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：因素的影响在前后两半样本间显著一致；风险测度没有出现；占主导的是技术因素、价格水平因素与流动性。","label":"结果：因素的影响在前后两半样本间显著…"},{"t":"样本外应用：用样本期开始前12个月估计因素敏感度→拟合各股期望收益→按期望收益排序十分位（第10最高），该步骤重复180个月，排序成功预测了未来表现。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">样本外应用</strong>：用样本期开始前12个月估计因素敏感度→拟合各股期望收益→按期望收益排序十分位（第10最高），该步骤重复180个月，排序成功预测了未来表现。","label":"样本外应用"},{"t":"保留意见：汉娜与里迪质疑——当纳入交易成本后（该策略须每月重新调整组合），除动量与价值因素之外似乎没有增加价值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">保留意见</strong>：汉娜与里迪质疑——当纳入交易成本后（该策略须每月重新调整组合），除动量与价值因素之外似乎没有增加价值。","label":"保留意见"}],"k":"b","i":1,"h":"豪根-贝克","label":"豪根-贝克"}],"k":"sec","i":0,"h":"19.3 多元方法","label":"19.3 多元方法"},{"t":"19.4 风格循环","c":[{"t":"定义与做法：从一种投资风格转变为另一种风格，试图测定整体风格转变的时间；需要具有一定可靠性的预测模型，常用宏观经济因素如违约风险溢价、期限结构斜率与总股息率；美国、英国与日本的证据表明可提高收益。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">定义与做法</strong>：从一种投资风格转变为另一种风格，试图测定整体风格转变的时间；需要具有一定可靠性的预测模型，常用宏观经济因素如违约风险溢价、期限结构斜率与总股息率；美国、英国与日本的证据表明可提高收益。","label":"定义与做法"},{"t":"（蒙蒂尔）风格轮动的潜在收益：完美把握每季最优风格的假想组合显示，风格择时可产生与传统资产配置大致相当的业绩提升效果；李维斯与利达科斯（英国1968—1997年）发现完美轮换预见者年均回报29.10%，计入每笔100个基点交易成本后仍达24.51%，远超富时全指约16%。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）风格轮动的潜在收益：完美把握每季最优风格的假想组合显示，风格择时可产生与传统资产配置大致相当的业绩提升效果；李维斯与利达科斯（英国1968—1997年）发现完美轮换预见者年均回报29.10%，计入每笔100个基点交易成本后仍达24.51%，远超富时全指约16%。","label":"（蒙蒂尔）风格轮动的潜在收益：完美把…"},{"t":"国际证据（德罗齐埃、劳赫与普兰特）","c":[{"t":"数据：1975—2003年美国、加拿大、澳大利亚、中国香港、日本、新加坡及12个欧洲主要市场的美元计价MSCI指数。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数据</strong>：1975—2003年美国、加拿大、澳大利亚、中国香港、日本、新加坡及12个欧洲主要市场的美元计价MSCI指数。","label":"数据：1975—2003年美国、加拿…"},{"t":"相对价值策略：账面市值比最高4个市场多头、最低4个空头，月收益0.32%；相对强度（动量）策略：历史年收益率最高4个市场多头、最低4个空头，月收益0.81%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">相对价值策略</strong>：账面市值比最高4个市场多头、最低4个空头，月收益0.32%；相对强度（动量）策略：历史年收益率最高4个市场多头、最低4个空头，月收益0.81%。","label":"相对价值策略"},{"t":"两个组合相互负相关（按5年期滚动计算的相关系数均值-0.56）——体现风格多样化方法的功效；各50%权重的组合月收益0.86%，且风险较任一组成部分大幅降低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个组合相互负相关</strong>（按5年期滚动计算的相关系数均值-0.56）——体现风格多样化方法的功效；各50%权重的组合月收益0.86%，且风险较任一组成部分大幅降低。","label":"两个组合相互负相关"},{"t":"风格循环决策规则：市场上升时相对强度更成功（高市场收益伴随较大的整体过度自信，联系丹尼尔等动量模型）；市场下跌时相对价值更成功（赌场资金效应——风险厌恶随市场失利而增强）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">风格循环决策规则</strong>：市场上升时相对强度更成功（高市场收益伴随较大的整体过度自信，联系丹尼尔等动量模型）；市场下跌时相对价值更成功（赌场资金效应——风险厌恶随市场失利而增强）。","label":"风格循环决策规则"},{"t":"效果：转向相对价值的信号共203个月，成功100个月（成功月均3.32%、失败月-1.38%），加权平均月收益0.93%（对比始终相对价值的0.32%）；转向相对强度141个月，成功90个月（5.18%对-4.12%），加权1.81%（对比0.81%）；整体风格转换月收益1.30%，风险调整后仅略微减弱。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效果</strong>：转向相对价值的信号共203个月，成功100个月（成功月均3.32%、失败月-1.38%），加权平均月收益0.93%（对比始终相对价值的0.32%）；转向相对强度141个月，成功90个月（5.18%对-4.12%），加权1.81%（对比0.81%）；整体风格转换月收益1.30%，风险调整后仅略微减弱。","label":"效果：转向相对价值的信号共203个月…"}],"k":"b","i":1,"h":"<strong class=\"lead\">国际证据</strong>（德罗齐埃、劳赫与普兰特）","label":"国际证据"},{"t":"（蒙蒂尔）风格转换时机选择的衡量指标","c":[{"t":"隐含股权风险溢价（ERP）：隐含ERP =（100/12个月远期市盈率）−长期增长率−当前10年期债券收益率；ERP可视为投资者时间跨度的代表（贝纳茨与塞勒：展望理论＋短视行为）；市净率是隐含股权久期的噪声代理（德肖、斯隆与苏莱曼）——股息收益的可预测性更高，高股息率的价值型股票是久期较短的资产；隐含ERP下跌=投资者延长视角→青睐长久期的成长型股票；ERP上升=追求回报确定性→价值型股票获益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">隐含股权风险溢价</strong>（ERP）：隐含ERP =（100/12个月远期市盈率）−长期增长率−当前10年期债券收益率；ERP可视为投资者时间跨度的代表（贝纳茨与塞勒：展望理论＋短视行为）；市净率是隐含股权久期的噪声代理（德肖、斯隆与苏莱曼）——股息收益的可预测性更高，高股息率的价值型股票是久期较短的资产；隐含ERP下跌=投资者延长视角→青睐长久期的成长型股票；ERP上升=追求回报确定性→价值型股票获益。","label":"隐含股权风险溢价"},{"t":"股息支付率：总体上经济繁荣时期价值型表现更好、萧条时期成长型更好（90年代末互联网泡沫是例外，恰证泡沫本质）；林特纳发现公司为不让投资者失望而平滑股息，伯恩斯坦指出股息波动小于收益、支付率是收益的\"永久性/规范化\"追踪——支付率低意味着近期盈利强、未来或转弱；经验上支付率处于低谷时成长型占优，探底完成后价值型胜出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">股息支付率</strong>：总体上经济繁荣时期价值型表现更好、萧条时期成长型更好（90年代末互联网泡沫是例外，恰证泡沫本质）；林特纳发现公司为不让投资者失望而平滑股息，伯恩斯坦指出股息波动小于收益、支付率是收益的&quot;永久性/规范化&quot;追踪——支付率低意味着近期盈利强、未来或转弱；经验上支付率处于低谷时成长型占优，探底完成后价值型胜出。","label":"股息支付率"},{"t":"IPO活动：IPO的初始回报与数量呈周期性；刚上市公司多为小盘成长型股票，IPO窗口最宽时小盘成长引领市场；小盘成长失宠往往持续数年（1974—1981年最极端，20世纪60年代初失宠近5年，1987年股灾后IPO低迷数年）——IPO发行量是判断哪种风格正在流行的良好指标。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">IPO活动</strong>：IPO的初始回报与数量呈周期性；刚上市公司多为小盘成长型股票，IPO窗口最宽时小盘成长引领市场；小盘成长失宠往往持续数年（1974—1981年最极端，20世纪60年代初失宠近5年，1987年股灾后IPO低迷数年）——IPO发行量是判断哪种风格正在流行的良好指标。","label":"IPO活动"}],"k":"b","i":1,"h":"（蒙蒂尔）风格转换时机选择的衡量指标","label":"（蒙蒂尔）风格转换时机选择的衡量指标"}],"k":"sec","i":0,"h":"19.4 风格循环","label":"19.4 风格循环"},{"t":"19.5 利用行为金融能否提高投资组合的表现","c":[{"t":"19.5.1 早期证据","c":[{"t":"一项研究评估了16只自我宣称或媒体确认的行为共同基金；缺点：样本不足、无法保证基金确实采用行为投资——把名称或公开宣称的策略改为时髦事物即可吸引资金流入。","c":[],"k":"b","i":2,"h":"一项研究评估了16只自我宣称或媒体确认的行为共同基金；缺点：样本不足、无法保证基金确实采用行为投资——把名称或公开宣称的策略改为时髦事物即可吸引资金流入。","label":"一项研究评估了16只自我宣称或媒体确…"},{"t":"结果：作为群体这些基金的表现比标普500好，并确实吸引了投资者资金；但当法玛-弗伦奇三因素模型补充动量因素后，行为基金没有超额收益——它们似乎主要在利用价值优势。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：作为群体这些基金的表现比标普500好，并确实吸引了投资者资金；但当法玛-弗伦奇三因素模型补充动量因素后，行为基金没有超额收益——它们似乎主要在利用价值优势。","label":"结果：作为群体这些基金的表现比标普5…"},{"t":"结论与商榷：作者认为至今没有证据表明行为投资取得成效；但把动量作为附加风险因素本身受质疑，且要求基金超越简单利用已知异象（小公司效应、价值、动量）是合理标准；此外样本限制与检验能力问题突出——小幅增值可能存在，但统计检验无法推断。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论与商榷</strong>：作者认为至今没有证据表明行为投资取得成效；但把动量作为附加风险因素本身受质疑，且要求基金超越简单利用已知异象（小公司效应、价值、动量）是合理标准；此外样本限制与检验能力问题突出——小幅增值可能存在，但统计检验无法推断。","label":"结论与商榷"}],"k":"b","i":1,"h":"19.5.1 早期证据","label":"19.5.1 早期证据"},{"t":"19.5.2 什么是行为投资","c":[{"t":"仅把基金命名为\"行为××\"或在招募说明书中宣扬行为金融准则是完全不够的；大量异象是公共知识（顶级期刊发表、流行媒体报道）。","c":[],"k":"b","i":2,"h":"仅把基金命名为&quot;行为××&quot;或在招募说明书中宣扬行为金融准则是完全不够的；大量异象是公共知识（顶级期刊发表、流行媒体报道）。","label":"仅把基金命名为\"行为××\"或在招募说…"},{"t":"作者立场：在组合构建中使用公共知识还不等于行为投资，还需要其他元素——过去运作良好的筛选条件未必未来有效（裙长指数、超级杯赢家等欺骗性条件不应理睬）；数据中的模式未来是否起作用，主要取决于该模式是否存在行为基础。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">作者立场</strong>：在组合构建中使用公共知识还不等于行为投资，还需要其他元素——过去运作良好的筛选条件未必未来有效（裙长指数、超级杯赢家等欺骗性条件不应理睬）；数据中的模式未来是否起作用，主要取决于该模式是否存在行为基础。","label":"作者立场"},{"t":"有行为基础的异象是\"天然的\"：考虑有限套利与人类本性，即使套利可能消除它们也未必容易做到，特别是当筛选因素经额外辅助因素精炼之后。","c":[],"k":"b","i":2,"h":"有行为基础的异象是&quot;天然的&quot;：考虑有限套利与人类本性，即使套利可能消除它们也未必容易做到，特别是当筛选因素经额外辅助因素精炼之后。","label":"有行为基础的异象是\"天然的\""},{"t":"对比：价值优势是行为模式的关键（盛行，尽管有周期性），小公司效应不是（其存在性持续受质疑）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对比</strong>：价值优势是行为模式的关键（盛行，尽管有周期性），小公司效应不是（其存在性持续受质疑）。","label":"对比：价值优势是行为模式的关键（盛行…"},{"t":"行为投资的内涵应比单纯的经验规律更广：它包含一种被证明基于行为因素的偏好；行为投资能否带来收益增加，是结果有待确认的重要问题。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行为投资的内涵应比单纯的经验规律更广</strong>：它包含一种被证明基于行为因素的偏好；行为投资能否带来收益增加，是结果有待确认的重要问题。","label":"行为投资的内涵应比单纯的经验规律更广"}],"k":"b","i":1,"h":"19.5.2 什么是行为投资","label":"19.5.2 什么是行为投资"}],"k":"sec","i":0,"h":"19.5 利用行为金融能否提高投资组合的表现","label":"19.5 利用行为金融能否提高投资组…"}],"k":"chap","h":"第19章 行为投资","label":"第19章 行为投资"},{"t":"第20章 神经金融学和交易员的大脑","c":[{"t":"本章要点","c":[{"t":"认知与情绪都强烈影响人们的决策，交易员也不例外；解释一个人的成功或失败时，天性论与环境论之争的答案是两者兼备——环境基础与生物基础同时存在。","c":[],"k":"b","i":1,"h":"认知与情绪都强烈影响人们的决策，交易员也不例外；解释一个人的成功或失败时，天性论与环境论之争的答案是两者兼备——环境基础与生物基础同时存在。","label":"认知与情绪都强烈影响人们的决策，交易…"},{"t":"专业技能（expertise）按相对表现定义——处于各自领域领先行列者被视为专家；交易员拥有无法用语言描述的隐性知识（内隐学习），它可以通过大量实践与重复训练出来。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">专业技能</strong>（expertise）按相对表现定义——处于各自领域领先行列者被视为专家；交易员拥有无法用语言描述的隐性知识（内隐学习），它可以通过大量实践与重复训练出来。","label":"专业技能"},{"t":"神经金融学（neurofinance）/神经经济学（neuroeconomics）使用大脑成像技术研究金融经济决策时大脑如何运转，把情绪变成可测量的过程并纳入决策模型。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">神经金融学</strong>（neurofinance）/神经经济学（neuroeconomics）使用大脑成像技术研究金融经济决策时大脑如何运转，把情绪变成可测量的过程并纳入决策模型。","label":"神经金融学"},{"t":"生理证据显示职业交易员之间存在与经验相关的差异；对赢利和损失反应最强烈的人交易表现最差——平稳的情绪显然是必需的。","c":[],"k":"b","i":1,"h":"生理证据显示职业交易员之间存在与经验相关的差异；对赢利和损失反应最强烈的人交易表现最差——平稳的情绪显然是必需的。","label":"生理证据显示职业交易员之间存在与经验…"},{"t":"大脑对赢利与损失、风险与不确定性的处理在激活区域和时间上均不同：预期赢利激活富含多巴胺的伏隔核（NAcc）；不确定性激活情绪区域（前额脑区底部与杏仁核），风险则激活顶叶等认知区域。","c":[],"k":"b","i":1,"h":"大脑对赢利与损失、风险与不确定性的处理在激活区域和时间上均不同：预期赢利激活富含多巴胺的伏隔核（NAcc）；不确定性激活情绪区域（前额脑区底部与杏仁核），风险则激活顶叶等认知区域。","label":"大脑对赢利与损失、风险与不确定性的处…"},{"t":"练习是在交易中胜出的必需因素；好的交易员可能凭直觉做出决策，同时确保控制自己的情绪反应。","c":[],"k":"b","i":1,"h":"练习是在交易中胜出的必需因素；好的交易员可能凭直觉做出决策，同时确保控制自己的情绪反应。","label":"练习是在交易中胜出的必需因素；好的交…"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"20.1 专业技能和内隐学习","c":[{"t":"莫莉情境（书中实例）：在音乐会上能立即认出朋友的面孔，却无法向从未见过她的朋友描述到可以辨认的程度——语言是明确的，而两张类似面孔的特征可能是模糊的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">莫莉情境</strong>（书中实例）：在音乐会上能立即认出朋友的面孔，却无法向从未见过她的朋友描述到可以辨认的程度——语言是明确的，而两张类似面孔的特征可能是模糊的。","label":"莫莉情境"},{"t":"内隐学习（implicit learning）/隐性知识（tacit knowledge）：人们拥有无法用语言表达的知识；斯廷巴杰认为交易员同样掌握关于市场却难以言传的信息——市场可能比我们拥有的用来描述它的语言更复杂。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">内隐学习</strong>（implicit learning）/隐性知识（tacit knowledge）：人们拥有无法用语言表达的知识；斯廷巴杰认为交易员同样掌握关于市场却难以言传的信息——市场可能比我们拥有的用来描述它的语言更复杂。","label":"内隐学习"},{"t":"专业技能的定义：通常按相对表现考察，处于领域领先行列者被认为是专家；象棋大师或职业运动员常本能地知道最佳行动，也许完全没有认知基础。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">专业技能的定义</strong>：通常按相对表现考察，处于领域领先行列者被认为是专家；象棋大师或职业运动员常本能地知道最佳行动，也许完全没有认知基础。","label":"专业技能的定义"},{"t":"情绪可独立于认知发展（第7章）：你可能感到害怕而事先没有从认知上察觉恐惧来源——交易员可能先凭本能决策，然后在认知上产生与预期一致的解释；获取相同信息、以相同方式策略行动的交易员，对自身行为的理解却大相径庭。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪可独立于认知发展</strong>（第7章）：你可能感到害怕而事先没有从认知上察觉恐惧来源——交易员可能先凭本能决策，然后在认知上产生与预期一致的解释；获取相同信息、以相同方式策略行动的交易员，对自身行为的理解却大相径庭。","label":"情绪可独立于认知发展"},{"t":"\"成功的交易员对市场产生感觉，但不会在那些感觉中迷失自己\"；对优秀运动员的研究得出相似结论——情绪以及有效控制情绪的能力是表现变动的重要原因；优秀交易员对特定市场形势有直觉，但仍采取小心谨慎的策略控制自己的行为。","c":[],"k":"b","i":1,"h":"&quot;成功的交易员对市场产生感觉，但不会在那些感觉中迷失自己&quot;；对优秀运动员的研究得出相似结论——情绪以及有效控制情绪的能力是表现变动的重要原因；优秀交易员对特定市场形势有直觉，但仍采取小心谨慎的策略控制自己的行为。","label":"\"成功的交易员对市场产生感觉，但不会…"},{"t":"专业技能可以训练：天赋可能是必要的，但实践和重复是成功专家的共同因素（有造诣的小提琴家平均练习10000小时）；交易实践培养了把了解到的市场信息和应采取的行动联系起来的能力——临场才花几小时甚至几分钟评估市场环境的当日交易者会发现成功十分困难。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">专业技能可以训练</strong>：天赋可能是必要的，但实践和重复是成功专家的共同因素（有造诣的小提琴家平均练习10000小时）；交易实践培养了把了解到的市场信息和应采取的行动联系起来的能力——临场才花几小时甚至几分钟评估市场环境的当日交易者会发现成功十分困难。","label":"专业技能可以训练"}],"k":"sec","i":0,"h":"20.1 专业技能和内隐学习","label":"20.1 专业技能和内隐学习"},{"t":"20.2 神经金融学","c":[{"t":"定义：神经金融学与神经经济学使用神经技术检测一个人在做金融经济决策时大脑是怎样运转的；融合来自经济学、金融学、心理学与神经科学的结论。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">定义</strong>：神经金融学与神经经济学使用神经技术检测一个人在做金融经济决策时大脑是怎样运转的；融合来自经济学、金融学、心理学与神经科学的结论。","label":"定义：神经金融学与神经经济学使用神经…"},{"t":"大脑成像技术使科学家能真实测量情绪反应；兹韦格：神经经济学让投资者把投资行为理解为一种基本生理功能，从而对\"所关心的问题\"产生前所未有的深刻理解，更有准备地做出好的投资决策。","c":[],"k":"b","i":1,"h":"大脑成像技术使科学家能真实测量情绪反应；兹韦格：神经经济学让投资者把投资行为理解为一种基本生理功能，从而对&quot;所关心的问题&quot;产生前所未有的深刻理解，更有准备地做出好的投资决策。","label":"大脑成像技术使科学家能真实测量情绪反应；兹韦格"},{"t":"研究目的不是勾勒大脑的特定部位，而是观察大脑在各种行为过程中如何反应，从而了解大脑如何运作并解决问题——弄清认知过程与情绪反应如何融合：哪种反应受控制、哪种是自动的；这将改善决策模型与投资者教育。","c":[],"k":"b","i":1,"h":"研究目的不是勾勒大脑的特定部位，而是观察大脑在各种行为过程中如何反应，从而了解大脑如何运作并解决问题——弄清认知过程与情绪反应如何融合：哪种反应受控制、哪种是自动的；这将改善决策模型与投资者教育。","label":"研究目的不是勾勒大脑的特定部位，而是…"},{"t":"与第7章的衔接：自动的反应使杏仁核兴奋，受控制的反应使前脑（前额皮质）活跃；成像技术可以观察任务中大脑的活跃区域。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">与第7章的衔接</strong>：自动的反应使杏仁核兴奋，受控制的反应使前脑（前额皮质）活跃；成像技术可以观察任务中大脑的活跃区域。","label":"与第7章的衔接"},{"t":"达马西奥的脑损伤病人研究：因前额叶受损而情绪平稳的病人决策能力受损——决策过程和情绪密切相关；脑成像技术比脑损伤研究能控制更多因素、更加精确，并催生了更好包含心理因素（包括情绪）的新模型与新理论。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">达马西奥的脑损伤病人研究</strong>：因前额叶受损而情绪平稳的病人决策能力受损——决策过程和情绪密切相关；脑成像技术比脑损伤研究能控制更多因素、更加精确，并催生了更好包含心理因素（包括情绪）的新模型与新理论。","label":"达马西奥的脑损伤病人研究"}],"k":"sec","i":0,"h":"20.2 神经金融学","label":"20.2 神经金融学"},{"t":"20.3 神经金融学的观点","c":[{"t":"交易员的生理特征（洛与雷平）：研究职业证券交易员真实交易时的生理特征，发现市场活动与皮肤电反应、心血管数据等生理特征显著相关；交易员之间的差别也被检测出来，也许与交易经验有关。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">交易员的生理特征</strong>（洛与雷平）：研究职业证券交易员真实交易时的生理特征，发现市场活动与皮肤电反应、心血管数据等生理特征显著相关；交易员之间的差别也被检测出来，也许与交易经验有关。","label":"交易员的生理特征"},{"t":"情绪与表现（洛、雷平与斯廷巴杰）：对赢利和损失反应最强烈的人具有最差的交易表现——平稳的情绪显然是必需的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪与表现</strong>（洛、雷平与斯廷巴杰）：对赢利和损失反应最强烈的人具有最差的交易表现——平稳的情绪显然是必需的。","label":"情绪与表现"},{"t":"赢利与损失（纳特森等）：预期赢利时皮质下区域伏隔核（NAcc）变得活跃；该区域富含多巴胺——既与货币报酬的积极作用有关又与致瘾药物的使用有关；伏隔核只在预期赢利（而非损失）时活跃，支持前景理论\"人们对赢利与损失的感受不同\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">赢利与损失</strong>（纳特森等）：预期赢利时皮质下区域伏隔核（NAcc）变得活跃；该区域富含多巴胺——既与货币报酬的积极作用有关又与致瘾药物的使用有关；伏隔核只在预期赢利（而非损失）时活跃，支持前景理论&quot;人们对赢利与损失的感受不同&quot;。","label":"赢利与损失"},{"t":"风险与不确定性（鲁斯蒂奇尼等；徐等）：面对不确定性（概率未知）时最活跃的是前额脑区底部（结合情绪与认知的区域）和杏仁核（情绪反应关键区域）；面对风险（概率可估计）时活跃区域通常在顶叶——风险下的选择由认知因素驱动；不确定性与情绪反应联系更紧密，风险则导致认知反应。","c":[{"t":"推论：在2008年式的高度不确定时期，投资者无法正确估计未来收益的分布，行为从理性思考转变为以情绪反应为主——普遍不愿持有风险资产，反而加剧市场下跌的趋势。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推论</strong>：在2008年式的高度不确定时期，投资者无法正确估计未来收益的分布，行为从理性思考转变为以情绪反应为主——普遍不愿持有风险资产，反而加剧市场下跌的趋势。","label":"推论：在2008年式的高度不确定时期…"}],"k":"b","i":1,"h":"<strong class=\"lead\">风险与不确定性</strong>（鲁斯蒂奇尼等；徐等）：面对不确定性（概率未知）时最活跃的是前额脑区底部（结合情绪与认知的区域）和杏仁核（情绪反应关键区域）；面对风险（概率可估计）时活跃区域通常在顶叶——风险下的选择由认知因素驱动；不确定性与情绪反应联系更紧密，风险则导致认知反应。","label":"风险与不确定性"},{"t":"损失厌恶的神经系统测试（希夫等）：将大脑中与处理情绪相关区域受损的病人与对照组比较；病变组明显更愿意承担风险，且风险厌恶程度表现出更高的一致性——对恐惧反应能力降低的人行为更符合预期效用理论，为目光短浅的损失厌恶提供了神经证据。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">损失厌恶的神经系统测试</strong>（希夫等）：将大脑中与处理情绪相关区域受损的病人与对照组比较；病变组明显更愿意承担风险，且风险厌恶程度表现出更高的一致性——对恐惧反应能力降低的人行为更符合预期效用理论，为目光短浅的损失厌恶提供了神经证据。","label":"损失厌恶的神经系统测试"},{"t":"报酬与风险的时间差（普鲁朔夫等）：在赌博游戏中改变期望价值与风险并监测大脑活动——大脑对报酬的反应是即时的，对风险的反应是延时的；活动的时间与位置可区分风险与报酬的影响，有助于研究风险感知偏差如何导致不甚理想的行为。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">报酬与风险的时间差</strong>（普鲁朔夫等）：在赌博游戏中改变期望价值与风险并监测大脑活动——大脑对报酬的反应是即时的，对风险的反应是延时的；活动的时间与位置可区分风险与报酬的影响，有助于研究风险感知偏差如何导致不甚理想的行为。","label":"报酬与风险的时间差"}],"k":"sec","i":0,"h":"20.3 神经金融学的观点","label":"20.3 神经金融学的观点"},{"t":"20.4 专业技能和情绪","c":[{"t":"实践建议：了解游戏规则很重要（仔细研究投资是个好主意），但通过在不同市场条件下的大量模拟练习才能促进交易时做出更好的决策——熟能生巧。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">实践建议</strong>：了解游戏规则很重要（仔细研究投资是个好主意），但通过在不同市场条件下的大量模拟练习才能促进交易时做出更好的决策——熟能生巧。","label":"实践建议"},{"t":"成为专家值得吗：差别回报指数（某一特定百分位水平的收入÷收入中位数）显示，对金融和商业顾问（包括股票经纪人）来说收入与成就紧密联系——第90百分位水平的差别回报指数为3.5，即前10%从业者的收入是中位数的3.5倍，这是被研究行业中的最大观测值；成为优秀理财顾问的收益远远超过成本。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">成为专家值得吗</strong>：差别回报指数（某一特定百分位水平的收入÷收入中位数）显示，对金融和商业顾问（包括股票经纪人）来说收入与成就紧密联系——第90百分位水平的差别回报指数为3.5，即前10%从业者的收入是中位数的3.5倍，这是被研究行业中的最大观测值；成为优秀理财顾问的收益远远超过成本。","label":"成为专家值得吗"},{"t":"隐性知识预测商业成功（以薪水、排名和公司实力衡量）；实践知识——获得隐性知识并将其转化为好策略的能力——是个人所处环境和能力的函数：具备一定能力，努力工作可以获得成功。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">隐性知识预测商业成功</strong>（以薪水、排名和公司实力衡量）；实践知识——获得隐性知识并将其转化为好策略的能力——是个人所处环境和能力的函数：具备一定能力，努力工作可以获得成功。","label":"隐性知识预测商业成功"},{"t":"情绪警示：本书已论证情绪可以改善决策，但证据表明交易员应谨慎对待强烈的情绪反应。","c":[{"t":"最后通牒博弈的神经成像（桑费等）：不公平提议被拒绝时，与情绪相连的前脑岛区域活动显著增强；只关心收入增加的应答者本应接受\"不公平\"提议——交易员应在经受强烈情绪反应时发挥认知技能，抑制情绪化的反应趋势。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最后通牒博弈的神经成像</strong>（桑费等）：不公平提议被拒绝时，与情绪相连的前脑岛区域活动显著增强；只关心收入增加的应答者本应接受&quot;不公平&quot;提议——交易员应在经受强烈情绪反应时发挥认知技能，抑制情绪化的反应趋势。","label":"最后通牒博弈的神经成像"},{"t":"认知评估与情绪反应可能完全不同：尽管驾驶汽车已被证明更危险，对飞机失事的情绪反应通常占主导，使一部分人远离飞机。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">认知评估与情绪反应可能完全不同</strong>：尽管驾驶汽车已被证明更危险，对飞机失事的情绪反应通常占主导，使一部分人远离飞机。","label":"认知评估与情绪反应可能完全不同"}],"k":"b","i":1,"h":"<strong class=\"lead\">情绪警示</strong>：本书已论证情绪可以改善决策，但证据表明交易员应谨慎对待强烈的情绪反应。","label":"情绪警示"}],"k":"sec","i":0,"h":"20.4 专业技能和情绪","label":"20.4 专业技能和情绪"}],"k":"chap","h":"第20章 神经金融学和交易员的大脑","label":"第20章 神经金融学和交易员的大脑"}],"k":"part","h":"第八篇 理财","label":"第八篇 理财","col":"#d97706","pc":"p8"},{"t":"第九篇 行为投资实操（蒙蒂尔）","c":[{"t":"第21章 行为视角下的股票估值","c":[{"t":"本章要点","c":[{"t":"股票价格可以长期偏离基本面：选美比赛式推理与实验市场证据共同表明，即使在最简单、信息完全的市场中投机泡沫也会反复出现","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">股票价格可以长期偏离基本面</strong>：选美比赛式推理与实验市场证据共同表明，即使在最简单、信息完全的市场中投机泡沫也会反复出现","label":"股票价格可以长期偏离基本面"},{"t":"分析师的估值过程被过度乐观、锚定效应与狭窄框架三大行为偏差系统性扭曲，估值应转向绝对估值（DCF）与现金流分析","c":[],"k":"b","i":1,"h":"分析师的估值过程被过度乐观、锚定效应与狭窄框架三大行为偏差系统性扭曲，估值应转向绝对估值（DCF）与现金流分析","label":"分析师的估值过程被过度乐观、锚定效应…"},{"t":"资本成本的估计远比教科书复杂：CAPM面临罗尔批评、估计自由度过多的困扰，其九条假设均不现实，实证上被小盘股效应与价值效应击穿","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">资本成本的估计远比教科书复杂</strong>：CAPM面临罗尔批评、估计自由度过多的困扰，其九条假设均不现实，实证上被小盘股效应与价值效应击穿","label":"资本成本的估计远比教科书复杂"},{"t":"法玛-弗兰奇三因子（SMB、HML）与动量的来源存在三说——风险定价、非风险的特征与行为认知错误，现有证据偏向特征与行为解释","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">法玛-弗兰奇三因子</strong>（SMB、HML）与动量的来源存在三说——风险定价、非风险的特征与行为认知错误，现有证据偏向特征与行为解释","label":"法玛-弗兰奇三因子"},{"t":"套利有限性使非系统性风险与流动性也进入定价；本章以分析师指南八条要点收束为实操守则","c":[],"k":"b","i":1,"h":"套利有限性使非系统性风险与流动性也进入定价；本章以分析师指南八条要点收束为实操守则","label":"套利有限性使非系统性风险与流动性也进…"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"凯恩斯的选美比赛","c":[{"t":"凯恩斯选美比赛（beauty contest）：投资如选美，关键不是选自己认为最美的，而是推测\"大众认为谁最美\"，乃至推测大众如何推测大众——一层层向前推理","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">凯恩斯选美比赛</strong>（beauty contest）：投资如选美，关键不是选自己认为最美的，而是推测&quot;大众认为谁最美&quot;，乃至推测大众如何推测大众——一层层向前推理","label":"凯恩斯选美比赛"},{"t":"选数游戏：参与者从0至100选数，平均数的三分之二者获胜；若假设均值为50则应选33，但领先一步应选22，再领先一步应选15，依此类推","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">选数游戏</strong>：参与者从0至100选数，平均数的三分之二者获胜；若假设均值为50则应选33，但领先一步应选22，再领先一步应选15，依此类推","label":"选数游戏"},{"t":"纳什均衡（Nash equilibrium）：稳定均衡是所有人都选0；实验显示CEO、经济学博士、博弈论学者与财经媒体读者等群体结果高度一致——参与者普遍只做0至3层推理，很少有人选0","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">纳什均衡</strong>（Nash equilibrium）：稳定均衡是所有人都选0；实验显示CEO、经济学博士、博弈论学者与财经媒体读者等群体结果高度一致——参与者普遍只做0至3层推理，很少有人选0","label":"纳什均衡"},{"t":"与泡沫的对应：即使所有投资者都预期崩盘，也不会行动——他们猜测别人会先抛售，并计划刚好在大规模抛售前卖出；这正好解释了互联网股票泡沫中\"明知估值疯狂仍买入\"的正反馈现象","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">与泡沫的对应</strong>：即使所有投资者都预期崩盘，也不会行动——他们猜测别人会先抛售，并计划刚好在大规模抛售前卖出；这正好解释了互联网股票泡沫中&quot;明知估值疯狂仍买入&quot;的正反馈现象","label":"与泡沫的对应"}],"k":"sec","i":0,"h":"凯恩斯的选美比赛","label":"凯恩斯的选美比赛"},{"t":"基本面的相关性","c":[{"t":"实验市场（Caginalp、Porter和Smith）：被试以已知概率分布的股息交易15个时段、期末股票归零，公允价值可由股息贴现模型精确算出且逐期递减——这是信息完全的理想市场","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">实验市场</strong>（Caginalp、Porter和Smith）：被试以已知概率分布的股息交易15个时段、期末股票归零，公允价值可由股息贴现模型精确算出且逐期递减——这是信息完全的理想市场","label":"实验市场"},{"t":"实验结果：经济学研究生组的市场价格贴近基本面价值；本科生组制造出严重泡沫，价格最高达价值的2.7倍；企业高管组更甚，最高约5.3倍——即使信息完全免费、市场最简单，泡沫依然出现","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">实验结果</strong>：经济学研究生组的市场价格贴近基本面价值；本科生组制造出严重泡沫，价格最高达价值的2.7倍；企业高管组更甚，最高约5.3倍——即使信息完全免费、市场最简单，泡沫依然出现","label":"实验结果"},{"t":"泡沫的伴随特征：繁荣往往持续很长（10-11个时段），交易量巨大（达流通股量的5-6倍）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">泡沫的伴随特征</strong>：繁荣往往持续很长（10-11个时段），交易量巨大（达流通股量的5-6倍）","label":"泡沫的伴随特征"},{"t":"泡沫更易出现的五个条件：缺乏经验的交易员居多、基本面价值不确定性更大、证券像彩票（小概率大赔率）、可凭保证金购买、卖空困难","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">泡沫更易出现的五个条件</strong>：缺乏经验的交易员居多、基本面价值不确定性更大、证券像彩票（小概率大赔率）、可凭保证金购买、卖空困难","label":"泡沫更易出现的五个条件"}],"k":"sec","i":0,"h":"基本面的相关性","label":"基本面的相关性"},{"t":"估值与行为偏差","c":[{"t":"偏差一：过度乐观（over-optimism）：代理问题（靠近公司管理层、依赖投行融资业务、自家经纪部门或本人持仓）叠加控制力幻觉（分析师感觉与所分析公司亲近），导致建议分布几乎全是正面评级、负面建议极少","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">偏差一</strong>：过度乐观（over-optimism）：代理问题（靠近公司管理层、依赖投行融资业务、自家经纪部门或本人持仓）叠加控制力幻觉（分析师感觉与所分析公司亲近），导致建议分布几乎全是正面评级、负面建议极少","label":"偏差一：过度乐观（over-opti…"},{"t":"预测的\"下调至可超越\"模式（walk down to beatable earnings）：分析师先发布乐观预测，临近业绩公布再下调至可达到的水平——提前24个月的预测平均比实际结果高出约17%","c":[],"k":"b","i":1,"h":"预测的&quot;下调至可超越&quot;模式（walk down to beatable earnings）：分析师先发布乐观预测，临近业绩公布再下调至可达到的水平——提前24个月的预测平均比实际结果高出约17%","label":"预测的\"下调至可超越\"模式"},{"t":"绝对估值，而非相对估值：康奈尔主张唯一真正有效的估值是现金流贴现（DCF，discounted cash flow）；相对估值（P/E、P/B对标行业平均）是锚定效应（anchoring）的产物，给不出真正的公允价值","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">绝对估值，而非相对估值</strong>：康奈尔主张唯一真正有效的估值是现金流贴现（DCF，discounted cash flow）；相对估值（P/E、P/B对标行业平均）是锚定效应（anchoring）的产物，给不出真正的公允价值","label":"绝对估值，而非相对估值"},{"t":"分析师的实际做法：布拉德肖发现股票推荐与PE/G比率（市盈率与预测长期增长率之比）紧密相关，而与内在价值偏离程度无关；布洛克确认现值类方法在实践中远不如理论上常用","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">分析师的实际做法</strong>：布拉德肖发现股票推荐与PE/G比率（市盈率与预测长期增长率之比）紧密相关，而与内在价值偏离程度无关；布洛克确认现值类方法在实践中远不如理论上常用","label":"分析师的实际做法"},{"t":"目标价格的锚定（Brav和Lehavy）：分析师目标价追随市价——一年前的测算价比现价高出约两成，偏离约10周被\"修正\"，且修正几乎完全靠分析师下调目标价实现，而非价格回归目标价","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">目标价格的锚定</strong>（Brav和Lehavy）：分析师目标价追随市价——一年前的测算价比现价高出约两成，偏离约10周被&quot;修正&quot;，且修正几乎完全靠分析师下调目标价实现，而非价格回归目标价","label":"目标价格的锚定"},{"t":"案例·英特尔（康奈尔研究）：营收指引低于此前预测与分析师预期后，股价数日内跌去近三成、市值蒸发上千亿美元；DCF模型显示巨大过度反应，而分析师在高位时的推荐反而比低位时更积极","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">案例·英特尔</strong>（康奈尔研究）：营收指引低于此前预测与分析师预期后，股价数日内跌去近三成、市值蒸发上千亿美元；DCF模型显示巨大过度反应，而分析师在高位时的推荐反而比低位时更积极","label":"案例·英特尔"},{"t":"逆向工程模型（reverse-engineered models）：从当前市场价格反推隐含的现金流增长率，再与自下而上的模型对比评估可能性；买方分析师采纳快于卖方","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">逆向工程模型</strong>（reverse-engineered models）：从当前市场价格反推隐含的现金流增长率，再与自下而上的模型对比评估可能性；买方分析师采纳快于卖方","label":"逆向工程模型"},{"t":"偏差二：狭窄框架效应（narrow framing）：分析师关注会计收益而非现金流；布洛克调查显示多数分析师把收益排在现金流之上","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">偏差二</strong>：狭窄框架效应（narrow framing）：分析师关注会计收益而非现金流；布洛克调查显示多数分析师把收益排在现金流之上","label":"偏差二：狭窄框架效应（narrow …"},{"t":"应计收益（accruals）：分析师未能把应计信息纳入预测，而高应计公司股票恰恰表现不佳（受代表性启发式偏差影响按过去利润表外推）；卖空者也偏好\"魅力股\"而非利用收益质量差异（理查森）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">应计收益</strong>（accruals）：分析师未能把应计信息纳入预测，而高应计公司股票恰恰表现不佳（受代表性启发式偏差影响按过去利润表外推）；卖空者也偏好&quot;魅力股&quot;而非利用收益质量差异（理查森）","label":"应计收益"},{"t":"收益分解：坎贝尔和席勒把收益分解为现金流预期与贴现率变化；乌尔塔霍姆扩展到公司层面——个股回报中现金流预期的重要性约为贴现率变化的两倍","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">收益分解</strong>：坎贝尔和席勒把收益分解为现金流预期与贴现率变化；乌尔塔霍姆扩展到公司层面——个股回报中现金流预期的重要性约为贴现率变化的两倍","label":"收益分解"},{"t":"现金流方法的落地：EVA（经济增加值，economic value added）是NPV思想的现代名字——经济利润超过资本成本才创造价值；CFROI（投资的现金流回报）基于内部收益率（IRR），衡量现有资产平均寿命下的预期投资收益率，公司应扩大CFROI与资本成本的差距","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">现金流方法的落地</strong>：EVA（经济增加值，economic value added）是NPV思想的现代名字——经济利润超过资本成本才创造价值；CFROI（投资的现金流回报）基于内部收益率（IRR），衡量现有资产平均寿命下的预期投资收益率，公司应扩大CFROI与资本成本的差距","label":"现金流方法的落地"}],"k":"sec","i":0,"h":"估值与行为偏差","label":"估值与行为偏差"},{"t":"资本成本","c":[{"t":"基本公式：贴现率＝无风险利率＋β×市场股权风险溢价；本章聚焦股权成本与β的估计（股权风险溢价留待资产配置章）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">基本公式</strong>：贴现率＝无风险利率＋β×市场股权风险溢价；本章聚焦股权成本与β的估计（股权风险溢价留待资产配置章）","label":"基本公式"},{"t":"CAPM（资本资产定价模型）估计的五个决策难点：①市场组合的代理——罗尔批评（Roll critique）指出真实市场组合不可观察，指数选择会使风险溢价估计偏差可达1个百分点、β随指数不同而异；②观察期间（日/周/月）；③样本期间（如5年月度数据对比260周周度数据）；④估计方法——流动性差的股票宜用斯科尔斯-威廉或迪姆森校正法而非普通最小二乘法；⑤收缩因子（shrinkage factor）——2/3的β估计值加1/3的市场β，使估计向1收敛","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">CAPM</strong>（资本资产定价模型）估计的五个决策难点：①市场组合的代理——罗尔批评（Roll critique）指出真实市场组合不可观察，指数选择会使风险溢价估计偏差可达1个百分点、β随指数不同而异；②观察期间（日/周/月）；③样本期间（如5年月度数据对比260周周度数据）；④估计方法——流动性差的股票宜用斯科尔斯-威廉或迪姆森校正法而非普通最小二乘法；⑤收缩因子（shrinkage factor）——2/3的β估计值加1/3的市场β，使估计向1收敛","label":"CAPM"},{"t":"实用结论：法玛和麦克白表明组合层面β比个股更稳定（随时间变化小、剩余方差更低）；巴特霍尔迪和皮尔斯推荐\"5年月度数据＋等权指数\"的组合","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">实用结论</strong>：法玛和麦克白表明组合层面β比个股更稳定（随时间变化小、剩余方差更低）；巴特霍尔迪和皮尔斯推荐&quot;5年月度数据＋等权指数&quot;的组合","label":"实用结论"},{"t":"实验证据（伯萨尔特）：实验市场中市场组合可人为设定，是最干净的CAPM检验场；但被试多懂标准金融理论，结论天然偏向支持CAPM——被试类型会左右实验结果","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">实验证据</strong>（伯萨尔特）：实验市场中市场组合可人为设定，是最干净的CAPM检验场；但被试多懂标准金融理论，结论天然偏向支持CAPM——被试类型会左右实验结果","label":"实验证据"},{"t":"实证证据：早期个股检验（林特纳）失败，改用组合后（法玛-麦克白）成立；班兹发现与β无关的小盘股效应（且近十年基本消失——可能只是特殊风格偏好而非真实风险因子）；价值效应（低P/B的价值股跑赢高P/B的成长股）；最优组合平均回报可达最差组合的3倍且与β无关；科克伦：给定账面市值比下规模变化与β正相关，给定规模下账面市值比变化与β负相关","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">实证证据</strong>：早期个股检验（林特纳）失败，改用组合后（法玛-麦克白）成立；班兹发现与β无关的小盘股效应（且近十年基本消失——可能只是特殊风格偏好而非真实风险因子）；价值效应（低P/B的价值股跑赢高P/B的成长股）；最优组合平均回报可达最差组合的3倍且与β无关；科克伦：给定账面市值比下规模变化与β正相关，给定规模下账面市值比变化与β负相关","label":"实证证据"},{"t":"CAPM的九条假设：无交易成本、任意头寸不影响价格、无税收、投资者风险厌恶、共同时间跨度、仅在均值-方差空间看股票、靠多元化控险、含人力资本的全部资产可交易、可按无风险利率借贷——没有一条符合金融市场现实","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">CAPM的九条假设</strong>：无交易成本、任意头寸不影响价格、无税收、投资者风险厌恶、共同时间跨度、仅在均值-方差空间看股票、靠多元化控险、含人力资本的全部资产可交易、可按无风险利率借贷——没有一条符合金融市场现实","label":"CAPM的九条假设"},{"t":"卡尔塞斯基的解释：共同基金行业扩张＋资金追逐回报（总体与横截面两个方向），基金经理在牛市偏好高β股票以跑赢同行，降低高β股的均衡预期收益、弱化β与收益的关系；单因素模型被全面否定恰与基金业快速扩张同期","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">卡尔塞斯基的解释</strong>：共同基金行业扩张＋资金追逐回报（总体与横截面两个方向），基金经理在牛市偏好高β股票以跑赢同行，降低高β股的均衡预期收益、弱化β与收益的关系；单因素模型被全面否定恰与基金业快速扩张同期","label":"卡尔塞斯基的解释"},{"t":"法玛-弗兰奇三因子模型（FF3，Fama-French three-factor model）：在市场超额回报上增加SMB（小盘减大盘）与HML（高账面市值比减低账面市值比，即价值减成长）；因子由规模×账面市值比的6个价值加权组合构成，每年6月底重建，规模分界为NYSE市值中位数、账面市值比分界为NYSE的30%/70%分位","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">法玛-弗兰奇三因子模型</strong>（FF3，Fama-French three-factor model）：在市场超额回报上增加SMB（小盘减大盘）与HML（高账面市值比减低账面市值比，即价值减成长）；因子由规模×账面市值比的6个价值加权组合构成，每年6月底重建，规模分界为NYSE市值中位数、账面市值比分界为NYSE的30%/70%分位","label":"法玛-弗兰奇三因子模型"},{"t":"因子来源之争一·风险观点（有效市场）：均衡定价要求SMB/HML代表所有投资者都担心的基本面风险；瓦萨卢发现两因子能预测GDP变动（类似收益率曲线的斜率），但证据不够充分","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">因子来源之争一·风险观点</strong>（有效市场）：均衡定价要求SMB/HML代表所有投资者都担心的基本面风险；瓦萨卢发现两因子能预测GDP变动（类似收益率曲线的斜率），但证据不够充分","label":"因子来源之争一·风险观点"},{"t":"因子来源之争二·非风险观点：因子必须稳定才配称均衡因子——1881-1913年德国数据中HML符号反转（成长反超价值）、SMB似为样本选择偏差的产物；麦金利指出CAPM偏差的平方夏普比率过大，无法用多因子风险解释，更像数据窥探（data snooping）；丹尼尔和迪特曼用\"学位与智商\"类比构造因子平衡组合与特征平衡组合，发现特征平衡组合回报约为零、因子平衡组合显著为正——特征（账面市值比高低）而非协方差驱动预期收益","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">因子来源之争二·非风险观点</strong>：因子必须稳定才配称均衡因子——1881-1913年德国数据中HML符号反转（成长反超价值）、SMB似为样本选择偏差的产物；麦金利指出CAPM偏差的平方夏普比率过大，无法用多因子风险解释，更像数据窥探（data snooping）；丹尼尔和迪特曼用&quot;学位与智商&quot;类比构造因子平衡组合与特征平衡组合，发现特征平衡组合回报约为零、因子平衡组合显著为正——特征（账面市值比高低）而非协方差驱动预期收益","label":"因子来源之争二·非风险观点"},{"t":"因子来源之争三·行为观点（舍夫林和斯塔特曼）：对比已实现收益与收益期望值——数据窥探应\"仅已实现收益与因子相关\"、风险解释应\"两者同向相关\"、认知错误应\"两者反向\"；利用第一声与《财富》调查数据发现与认知错误一致：投资者预期成长股跑赢市场，实际常常落空；FF3或可视为\"行为Beta\"（behavioral beta，行为资产定价模型BAPM的核心概念）——代表纠正市场错误定价的基准组合","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">因子来源之争三·行为观点</strong>（舍夫林和斯塔特曼）：对比已实现收益与收益期望值——数据窥探应&quot;仅已实现收益与因子相关&quot;、风险解释应&quot;两者同向相关&quot;、认知错误应&quot;两者反向&quot;；利用第一声与《财富》调查数据发现与认知错误一致：投资者预期成长股跑赢市场，实际常常落空；FF3或可视为&quot;行为Beta&quot;（behavioral beta，行为资产定价模型BAPM的核心概念）——代表纠正市场错误定价的基准组合","label":"因子来源之争三·行为观点"},{"t":"动量（momentum）：FF3最显著的失败——过去3-12个月的赢家每月继续跑赢输家约1%；行为解释（投资者对信息的延迟过度反应）预测持有期后输家回报反超赢家，数据窥探解释预测构成后回报恒为正；杰格蒂什和迪特曼找到明确的反转证据，支持行为解释","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">动量</strong>（momentum）：FF3最显著的失败——过去3-12个月的赢家每月继续跑赢输家约1%；行为解释（投资者对信息的延迟过度反应）预测持有期后输家回报反超赢家，数据窥探解释预测构成后回报恒为正；杰格蒂什和迪特曼找到明确的反转证据，支持行为解释","label":"动量（momentum）：FF3最显…"}],"k":"sec","i":0,"h":"资本成本","label":"资本成本"},{"t":"套利有限性因素","c":[{"t":"非系统性风险（idiosyncratic risk）：投资者分散做得并不好＋套利者面临融资风险（须盯住短期价格波动、提防追加保证金），使非系统性风险重新进入资产定价","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">非系统性风险</strong>（idiosyncratic risk）：投资者分散做得并不好＋套利者面临融资风险（须盯住短期价格波动、提防追加保证金），使非系统性风险重新进入资产定价","label":"非系统性风险"},{"t":"坎贝尔等的发现：个股风险较20世纪60年代翻倍、市场整体波动无趋势，故平均成对相关性降至60年代的约三分之一；达到完全分散所需持股数——教科书口径的10-15只（源自60年代数据）→1974-85年需20多只→1996-97年需约50只","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">坎贝尔等的发现</strong>：个股风险较20世纪60年代翻倍、市场整体波动无趋势，故平均成对相关性降至60年代的约三分之一；达到完全分散所需持股数——教科书口径的10-15只（源自60年代数据）→1974-85年需20多只→1996-97年需约50只","label":"坎贝尔等的发现"},{"t":"个股波动上升的三个解释：①企业集团破产解体——专注核心业务与细分市场的公司天然暴露更高非系统性风险；②公司生命周期加速——公司更早上市（拥有12个月盈利记录的新上市公司比例在90年代末大幅下滑），投资者的担忧直接转化为波动；③金融体系加速——自动交易、高换手基金经理与短线交易者推波助澜；马尔基和徐补充：成长股非系统性风险更高，且与长期收益增长预期正相关","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">个股波动上升的三个解释</strong>：①企业集团破产解体——专注核心业务与细分市场的公司天然暴露更高非系统性风险；②公司生命周期加速——公司更早上市（拥有12个月盈利记录的新上市公司比例在90年代末大幅下滑），投资者的担忧直接转化为波动；③金融体系加速——自动交易、高换手基金经理与短线交易者推波助澜；马尔基和徐补充：成长股非系统性风险更高，且与长期收益增长预期正相关","label":"个股波动上升的三个解释"},{"t":"流动性（liquidity）：快速、低成本、不显著改变价格地大量交易的能力；衡量从报价价差、深度、成交量、换手率到基于指令流的指标不等，各家口径方向基本一致","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">流动性</strong>（liquidity）：快速、低成本、不显著改变价格地大量交易的能力；衡量从报价价差、深度、成交量、换手率到基于指令流的指标不等，各家口径方向基本一致","label":"流动性（liquidity）：快速、…"},{"t":"流动性定价（帕斯特和斯丹博）：流动性Beta是显著的定价因子——按流动性Beta分组的最高与最低十分位之间的超额收益（阿尔法）年化约7.5%（FF3＋动量模型）至9%以上（FF3）；分析师极少把流动性纳入估值考量","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">流动性定价</strong>（帕斯特和斯丹博）：流动性Beta是显著的定价因子——按流动性Beta分组的最高与最低十分位之间的超额收益（阿尔法）年化约7.5%（FF3＋动量模型）至9%以上（FF3）；分析师极少把流动性纳入估值考量","label":"流动性定价"}],"k":"sec","i":0,"h":"套利有限性因素","label":"套利有限性因素"},{"t":"使用注意事项","c":[{"t":"因子来源决定用法：若因子源于有效定价的风险，最优做法是构建并持有被追踪的线性组合；若源于行为偏差与套利有限性，则基本面价值与市场价值分离，投资者存在获得更高回报的空间","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">因子来源决定用法</strong>：若因子源于有效定价的风险，最优做法是构建并持有被追踪的线性组合；若源于行为偏差与套利有限性，则基本面价值与市场价值分离，投资者存在获得更高回报的空间","label":"因子来源决定用法"},{"t":"估什么用什么：估计基本面价值（如公司财务用途）可用CAPM的β；估计市场价值则应使用扩展的多因子模型——市场溢价＋SMB＋HML＋动量（WML）＋非系统性风险（IDVOL）＋流动性（LIQUID），或直接采用基于特征（账面市值比、市值、动量）的模型","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">估什么用什么</strong>：估计基本面价值（如公司财务用途）可用CAPM的β；估计市场价值则应使用扩展的多因子模型——市场溢价＋SMB＋HML＋动量（WML）＋非系统性风险（IDVOL）＋流动性（LIQUID），或直接采用基于特征（账面市值比、市值、动量）的模型","label":"估什么用什么"},{"t":"企业视角（斯坦因）：追求短期股价的管理层应使用多因素贴现率，追求长期价值则应估计基本面资产风险；推论——融资受限、常进股市的公司用市场敏感的贴现率：情绪恶化时抬高投资门槛、被迫贱卖资产（航空业例证），情绪亢奋时降低门槛、可能过度投资","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">企业视角</strong>（斯坦因）：追求短期股价的管理层应使用多因素贴现率，追求长期价值则应估计基本面资产风险；推论——融资受限、常进股市的公司用市场敏感的贴现率：情绪恶化时抬高投资门槛、被迫贱卖资产（航空业例证），情绪亢奋时降低门槛、可能过度投资","label":"企业视角"}],"k":"sec","i":0,"h":"使用注意事项","label":"使用注意事项"},{"t":"分析师指 i":1,"h":"<strong class=\"lead\">特征模型的组合含义</strong>：若预期收益与FF3一致，投资者只应持有三个因子的线性组合，任何偏离都只增加方差而不增加预期收益（基金分离定理的多维扩展）；丹尼尔和迪特曼表明协方差与预期收益没有直接联系——在特征模型下，单独估计协方差矩阵做均值-方差最优化可构建更优组合、取得预期收益","label":"特征模型的组合含义"},{"t":"协方差估计的价值上限（陈、卡尔塞斯基和拉孔尼修克）：假想完美远见投资者从250只随机股票中、在无卖空且单票权重上限2%的约束下构建最小方差组合——其标准差（6.85%）远低于等权对照组（16.5%）；用模型预测协方差虽不及完美远见，仍能显著低于对照组","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">协方差估计的价值上限</strong>（陈、卡尔塞斯基和拉孔尼修克）：假想完美远见投资者从250只随机股票中、在无卖空且单票权重上限2%的约束下构建最小方差组合——其标准差（6.85%）远低于等权对照组（16.5%）；用模型预测协方差虽不及完美远见，仍能显著低于对照组","label":"协方差估计的价值上限"},{"t":"预测方法比较：用过去60个月数据做历史外插会过度拟合、产生极端预测；CAPM与FF3模型能平滑数据、极值预测更少、预测误差更小，优于历史外插；但预测相关性的改善并不带来收益增加——预测风险的能力与预测回报的能力同样值得投入","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">预测方法比较</strong>：用过去60个月数据做历史外插会过度拟合、产生极端预测；CAPM与FF3模型能平滑数据、极值预测更少、预测误差更小，优于历史外插；但预测相关性的改善并不带来收益增加——预测风险的能力与预测回报的能力同样值得投入","label":"预测方法比较"},{"t":"莫斯科维茨（GARCH框架）：市场资产组合（股票风险溢价）对协方差的贡献最大、预测效果最好；SMB相关的异常回报与协方差矩阵联系紧密并能提高预测；HML与动量回报与协方差风险无关","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">莫斯科维茨</strong>（GARCH框架）：市场资产组合（股票风险溢价）对协方差的贡献最大、预测效果最好；SMB相关的异常回报与协方差矩阵联系紧密并能提高预测；HML与动量回报与协方差风险无关","label":"莫斯科维茨"},{"t":"陈（跨期CAPM检验）：因子须能预测未来市场回报、风险溢价须与经济主体承担风险的意愿挂钩——HML与动量被模型拒绝，SMB未被拒绝；即规模大致被正确定价，价值/成长与动量并非均衡因素","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">陈</strong>（跨期CAPM检验）：因子须能预测未来市场回报、风险溢价须与经济主体承担风险的意愿挂钩——HML与动量被模型拒绝，SMB未被拒绝；即规模大致被正确定价，价值/成长与动量并非均衡因素","label":"陈（跨期CAPM检验）：因子须能预测…"}],"k":"sec","i":0,"h":"协方差","label":"协方差"},{"t":"相关性","c":[{"t":"非对称相关性（asymmetric correlation）：市场格言\"熊市中唯一上升的是相关性\"；厄尔布、哈维和维斯坎塔按市场状态分组估计1970-1993年MSCI美元回报——美德市场同涨时相关性不足一成，同跌时跃升至五成以上；尽管与现代投资组合理论\"相关性恒定\"的假设明显冲突，组合构建者与风险经理仍继续按恒定相关建模","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">非对称相关性</strong>（asymmetric correlation）：市场格言&quot;熊市中唯一上升的是相关性&quot;；厄尔布、哈维和维斯坎塔按市场状态分组估计1970-1993年MSCI美元回报——美德市场同涨时相关性不足一成，同跌时跃升至五成以上；尽管与现代投资组合理论&quot;相关性恒定&quot;的假设明显冲突，组合构建者与风险经理仍继续按恒定相关建模","label":"非对称相关性"},{"t":"后续证据：朗津和索尔尼克用极值理论发现国际市场的非对称（半）相关，且GARCH类标准波动率模型无法复制；安和陈发现个股与美股在\"下行\"走势中的相关性比正态分布隐含值平均高约11.6个百分点，\"上行\"走势则相差无几；小公司、价值股、过去的失败组合非对称更强，公用事业与石油等防御性行业尤甚","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">后续证据</strong>：朗津和索尔尼克用极值理论发现国际市场的非对称（半）相关，且GARCH类标准波动率模型无法复制；安和陈发现个股与美股在&quot;下行&quot;走势中的相关性比正态分布隐含值平均高约11.6个百分点，&quot;上行&quot;走势则相差无几；小公司、价值股、过去的失败组合非对称更强，公用事业与石油等防御性行业尤甚","label":"后续证据"},{"t":"长期视角（哥茨曼、李和罗文霍斯特）：150余年全球相关性结构随时间大幅变化，当前接近历史高点（上一次出现在大萧条时期）；当今国际投资者获得的分散化好处约一半来自可交易市场数量增加、另一半来自市场间相关性低于平均水平","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">长期视角</strong>（哥茨曼、李和罗文霍斯特）：150余年全球相关性结构随时间大幅变化，当前接近历史高点（上一次出现在大萧条时期）；当今国际投资者获得的分散化好处约一半来自可交易市场数量增加、另一半来自市场间相关性低于平均水平","label":"长期视角"},{"t":"实际含义：若忽略下行期相关性的增加，最优配置中分散化的价值会被夸大；风险管理同理","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">实际含义</strong>：若忽略下行期相关性的增加，最优配置中分散化的价值会被夸大；风险管理同理","label":"实际含义"},{"t":"行为解释一·有限套利：套利者被迫平仓会把冲击传导到通常不相关的资产（LTCM在俄罗斯事件冲击下平仓，扭曲了丹麦抵押贷款支持资产市场）；在凯尔和王、格龙布和瓦亚诺斯的模型中相关性是内生的","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">行为解释一·有限套利</strong>：套利者被迫平仓会把冲击传导到通常不相关的资产（LTCM在俄罗斯事件冲击下平仓，扭曲了丹麦抵押贷款支持资产市场）；在凯尔和王、格龙布和瓦亚诺斯的模型中相关性是内生的","label":"行为解释一·有限套利"},{"t":"行为解释二·损失规避（loss aversion）：巴伯里斯、黄和桑托斯表明损失规避的投资者对下行风险格外厌恶（对损失的感受约是收益的两倍），也会产生非对称相关","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">行为解释二·损失规避</strong>（loss aversion）：巴伯里斯、黄和桑托斯表明损失规避的投资者对下行风险格外厌恶（对损失的感受约是收益的两倍），也会产生非对称相关","label":"行为解释二·损失规避"},{"t":"内生相关的典型一幕·LTCM与VaR同质化：LTCM与所罗门套利部门等大量机构都用VaR（value at risk，风险价值）控制风险，市场受冲击时所有VaR模型同时报警→集体平仓→反馈循环→资产抛售加剧","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">内生相关的典型一幕·LTCM与VaR同质化</strong>：LTCM与所罗门套利部门等大量机构都用VaR（value at risk，风险价值）控制风险，市场受冲击时所有VaR模型同时报警→集体平仓→反馈循环→资产抛售加剧","label":"内生相关的典型一幕·LTCM与VaR同质化"},{"t":"对VaR的影响（乔瑞）：剧烈波动时期指数间相关性平均高出约0.12；组合风险与相关性平方根成正比，VaR估计应乘以约1.13——忽略该效应将低估风险约13%","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对VaR的影响</strong>（乔瑞）：剧烈波动时期指数间相关性平均高出约0.12；组合风险与相关性平方根成正比，VaR估计应乘以约1.13——忽略该效应将低估风险约13%","label":"对VaR的影响"},{"t":"行业层面同样非对称：市场下行阶段行业之间的关联度显著更高","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">行业层面同样非对称</strong>：市场下行阶段行业之间的关联度显著更高","label":"行业层面同样非对称"},{"t":"改进方向（加比）：神经网络先预测市场变动方向，再将其输入第二个网络预测非对称相关，表现优于恒定相关假设的传统方法","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">改进方向</strong>（加比）：神经网络先预测市场变动方向，再将其输入第二个网络预测非对称相关，表现优于恒定相关假设的传统方法","label":"改进方向"}],"k":"sec","i":0,"h":"相关性","label":"相关性"},{"t":"回报的分布","c":[{"t":"正态分布（钟形曲线）不能很好描述金融市场回报的分布","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">正态分布</strong>（钟形曲线）不能很好描述金融市场回报的分布","label":"正态分布"},{"t":"偏态（skewness）：分布不对称即偏态；负偏意味着左尾长、存在较大的负值","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">偏态</strong>（skewness）：分布不对称即偏态；负偏意味着左尾长、存在较大的负值","label":"偏态（skewness）：分布不对称…"},{"t":"偏态的行为解释（洪和斯坦因）：卖空约束＋意见分歧——下跌会揭示悲观者（原被卖空约束挡在场外）的估值信息、波动上升，上涨时被边缘化的卖空者无法入场、价格透露的信息少；衰退后波动性增加是偏态分布的根源","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">偏态的行为解释</strong>（洪和斯坦因）：卖空约束＋意见分歧——下跌会揭示悲观者（原被卖空约束挡在场外）的估值信息、波动上升，上涨时被边缘化的卖空者无法入场、价格透露的信息少；衰退后波动性增加是偏态分布的根源","label":"偏态的行为解释"},{"t":"推论与检验（陈、洪和斯坦因）：意见越不一致的股票偏度应越大；以营业额上升作分歧代理，发现换手率上升的股票随后的偏态确实更明显","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">推论与检验</strong>（陈、洪和斯坦因）：意见越不一致的股票偏度应越大；以营业额上升作分歧代理，发现换手率上升的股票随后的偏态确实更明显","label":"推论与检验"},{"t":"峰度（kurtosis）：衡量分布的平坦程度；正态分布峰度为3，大于3即尖峰态（leptokurtic）——出现绝对值较大的正值和负值的可能性大于正态","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">峰度</strong>（kurtosis）：衡量分布的平坦程度；正态分布峰度为3，大于3即尖峰态（leptokurtic）——出现绝对值较大的正值和负值的可能性大于正态","label":"峰度（kurtosis）：衡量分布的…"},{"t":"厚尾的两种解释：①真实分布平稳且确有厚尾；②分布随时间变化——震荡期离散度暂时放大，固定模型会把那时的观测当作离群值","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">厚尾的两种解释</strong>：①真实分布平稳且确有厚尾；②分布随时间变化——震荡期离散度暂时放大，固定模型会把那时的观测当作离群值","label":"厚尾的两种解释"}],"k":"sec","i":0,"h":"回报的分布","label":"回报的分布"},{"t":"厚尾还是离群值","c":[{"t":"主流做法的隐患：风险管理、组合优化与战术资产配置都建立在\"市场危机只是厚尾观察、对尾部推断足够多就能发现风险\"的误导观点上","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">主流做法的隐患</strong>：风险管理、组合优化与战术资产配置都建立在&quot;市场危机只是厚尾观察、对尾部推断足够多就能发现风险&quot;的误导观点上","label":"主流做法的隐患"},{"t":"物理学家的启示：金融领域习惯把\"规模\"当作给定，统计力学则强调定义合适的尺度；约翰森和索尔内特用与时间无关的\"下落\"（drawdown）——从上一个局部最大值到下一个局部最小值的累积损失（峰到谷）——以事件时间替代日历时间","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">物理学家的启示</strong>：金融领域习惯把&quot;规模&quot;当作给定，统计力学则强调定义合适的尺度；约翰森和索尔内特用与时间无关的&quot;下落&quot;（drawdown）——从上一个局部最大值到下一个局部最小值的累积损失（峰到谷）——以事件时间替代日历时间","label":"物理学家的启示"},{"t":"下落分布的意义：衡量市场连续下跌如何相互影响、构成市场的\"记忆\"，与损失规避和参照点等心理特征直接相关","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">下落分布的意义</strong>：衡量市场连续下跌如何相互影响、构成市场的&quot;记忆&quot;，与损失规避和参照点等心理特征直接相关","label":"下落分布的意义"},{"t":"关键发现：幅度低于15%的下落很好地服从Lévy分布（厚尾、指数式衰减）；据此推算，20世纪级别的大危机大约每160个世纪才应出现一次——但仅20世纪就至少出现三次；因此市场危机是离群值，而非潜伏在厚尾中的极端事件","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">关键发现</strong>：幅度低于15%的下落很好地服从Lévy分布（厚尾、指数式衰减）；据此推算，20世纪级别的大危机大约每160个世纪才应出现一次——但仅20世纪就至少出现三次；因此市场危机是离群值，而非潜伏在厚尾中的极端事件","label":"关键发现"},{"t":"验证与普遍性：基于GARCH模拟100万年的市场数据，任何时点都无法生成规模足够大的危机；该离群值模式在美股各指数、加拿大、澳大利亚、新加坡、香港、日本、英国、德国、意大利市场及美元兑主要货币、黄金等市场普遍存在","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">验证与普遍性</strong>：基于GARCH模拟100万年的市场数据，任何时点都无法生成规模足够大的危机；该离群值模式在美股各指数、加拿大、澳大利亚、新加坡、香港、日本、英国、德国、意大利市场及美元兑主要货币、黄金等市场普遍存在","label":"验证与普遍性"},{"t":"对极值理论（EVT，extreme value theory）的挑战：①估计过程在尾部的概率分布不稳定（迪博尔德等）；②EVT假定回报独立——尾部厚度应随持有期增加而下降，但经验上危机时期回报呈现强相关，下落期间的状况表明危机期回报远非独立","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对极值理论</strong>（EVT，extreme value theory）的挑战：①估计过程在尾部的概率分布不稳定（迪博尔德等）；②EVT假定回报独立——尾部厚度应随持有期增加而下降，但经验上危机时期回报呈现强相关，下落期间的状况表明危机期回报远非独立","label":"对极值理论"},{"t":"结论：市场危机与普通厚尾都是内生自组织过程的产物，但属不同现象——自组织对应常态期的厚尾分布，临界对应危机发生的特殊时期（下一章展开其可观察特征）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">结论</strong>：市场危机与普通厚尾都是内生自组织过程的产物，但属不同现象——自组织对应常态期的厚尾分布，临界对应危机发生的特殊时期（下一章展开其可观察特征）","label":"结论：市场危机与普通厚尾都是内生自组…"}],"k":"sec","i":0,"h":"厚尾还是离群值","label":"厚尾还是离群值"}],"k":"chap","h":"第22章 行为组合构建与风险管理","label":"第22章 行为组合构建与风险管理"},{"t":"第23章 行为资产配置与市场指标","c":[{"t":"本章要点","c":[{"t":"市场价格可长期大幅偏离基本面（席勒），这为战术资产配置（TAA）留出改进空间","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">市场价格可长期大幅偏离基本面</strong>（席勒），这为战术资产配置（TAA）留出改进空间","label":"市场价格可长期大幅偏离基本面"},{"t":"股票-债券相对估值的核心工具：股息率、盈利收益率、股息支付率与隐含股权风险溢价等估值利差","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">股票-债券相对估值的核心工具</strong>：股息率、盈利收益率、股息支付率与隐含股权风险溢价等估值利差","label":"股票-债券相对估值的核心工具"},{"t":"一级市场活动（IPO与再融资、并购融资方式、内幕交易）与 调整后股息率仍在底部","label":"回购调整"},{"t":"高持平性：股息率随时间变化极慢，更适合战略资产配置而非战术配置","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">高持平性</strong>：股息率随时间变化极慢，更适合战略资产配置而非战术配置","label":"高持平性"},{"t":"短期无效的证据（费希尔和斯塔特曼）：确认偏差（confirmation bias）让人只记得低股息率后的低回报年份——事实上低股息率后低回报与高回报的年份几乎各半，散点图回归线平坦，股息率与一年期回报几乎无关","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">短期无效的证据</strong>（费希尔和斯塔特曼）：确认偏差（confirmation bias）让人只记得低股息率后的低回报年份——事实上低股息率后低回报与高回报的年份几乎各半，散点图回归线平坦，股息率与一年期回报几乎无关","label":"短期无效的证据"},{"t":"十年尺度的均值复归：50年代高股息率对应60年代高回报、60年代低对应70年代低、70年代高对应80/90年代繁荣；低股息率意味着要么股息增长更高要么回报更低——统计上通常意味着回报更低（乌尔塔霍姆以市净率得出同样结论）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">十年尺度的均值复归</strong>：50年代高股息率对应60年代高回报、60年代低对应70年代低、70年代高对应80/90年代繁荣；低股息率意味着要么股息增长更高要么回报更低——统计上通常意味着回报更低（乌尔塔霍姆以市净率得出同样结论）","label":"十年尺度的均值复归"},{"t":"天气类比（科克伦）：预测股息率复归如预测伦敦二月严寒后的转暖——逐日难以预测，但数月后的均值复归是最佳预测","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">天气类比</strong>（科克伦）：预测股息率复归如预测伦敦二月严寒后的转暖——逐日难以预测，但数月后的均值复归是最佳预测","label":"天气类比"}],"k":"sec","i":0,"h":"股息率、价差和相关比率","label":"股息率、价差和相关比率"},{"t":"盈利收益率、价差和相关比率","c":[{"t":"盈利收益率（earnings yield）：市盈率的倒数，可与债券收益率直接比较；比率/价差并无理论基础，却因实用而受从业者长期喜爱，且天然回避股息模型的回购问题","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">盈利收益率</strong>（earnings yield）：市盈率的倒数，可与债券收益率直接比较；比率/价差并无理论基础，却因实用而受从业者长期喜爱，且天然回避股息模型的回购问题","label":"盈利收益率"},{"t":"性质：盈利收益率＝股息率＋留存收益率，可视为理论总收益；若投资有效，未来股息增长应不低于留存收益——数据显示经理人通常做不到（实际股息增长远逊留存收益）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">性质</strong>：盈利收益率＝股息率＋留存收益率，可视为理论总收益；若投资有效，未来股息增长应不低于留存收益——数据显示经理人通常做不到（实际股息增长远逊留存收益）","label":"性质：盈利收益率＝股息率＋留存收益率…"},{"t":"缺陷：依赖会计收益，收益报告口径变化会扭曲指标","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">缺陷</strong>：依赖会计收益，收益报告口径变化会扭曲指标","label":"缺陷：依赖会计收益，收益报告口径变化…"},{"t":"变形与最优选择：历史PE与远期PE（一致预期）两种口径；施加现实约束后，预期债券股权收益比率（PBEER）表现最好——用I/B/E/S预期的盈利收益率对当前名义债券收益率；该模型甚至进入格林斯潘的讲话，且被证明可据此交易标普500获利","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">变形与最优选择</strong>：历史PE与远期PE（一致预期）两种口径；施加现实约束后，预期债券股权收益比率（PBEER）表现最好——用I/B/E/S预期的盈利收益率对当前名义债券收益率；该模型甚至进入格林斯潘的讲话，且被证明可据此交易标普500获利","la // 分词：英文/数字串保持完整（可断在连字符后），其余逐字符；避免英文单词被硬切断
function tokenize(t){
  const out = []; const re = /[A-Za-z0-9][A-Za-z0-9'&+./·-]*(?:-[A-Za-z0-9][A-Za-z0-9'&+./·-]*)*-?|\s+|[\s\S]/g;
  let m; while ((m = re.exec(t))) out.push(m[0]);
  return out;
}
function wrapTokens(t, cf){
  const maxW = cf.maxW - 26;
  const W = s => ctx.measureText(s).width;
  const lines = []; let cur = "";
  const pushCur = () => { if (cur){ lines.push(cur.replace(/\s+$/, "")); cur = ""; } };
  for (const tk of tokenize(t)){
    if (/^\s+$/.test(tk)){ if (cur) cur += " "; continue; }
    if (cur && W(cur + tk) > maxW) pushCur();
    if (W(tk) > maxW){                       // 单 token 超宽（超长英文/URL）按字符硬断
      let s = tk;
      while (W(s) > maxW){
        let lo = 1, hi = s.length;
        while (lo < hi){ const mid = (lo + hi + 1) >> 1; if (W(s.slice(0, mid)) <= maxW) lo = mid; else hi = mid - 1; }
        lines.push(s.slice(0, lo)); s = s.slice(lo);
      }
      cur = s; continue;
    }
    cur += tk;
  }
  pushCur();
  if (lines.length <= cf.maxLines) return lines;
  const rest = lines.slice(cf.maxLines - 1).join(" ");
  let last = "";
  for (const tk of tokenize(rest)){
    if (/^\s+$/.test(tk)){ if (last) last += " "; continue; }
    if (W(last + tk + "…") > maxW) break;
    last += tk;
  }
  if (!last){ let s = rest; while (W(s + "…") > maxW && s.length > 1) s = s.slice(0, -1); last = s; }
  return lines.slice(0, cf.maxLines - 1).concat([last + "…"]);
}
walkAll(DATA, n => {
  const cf = CFG[n.k] || CFG.b;
  ctx.font = (cf.bold ? "600 " : "") + cf.fs + 'px -apple-system,"PingFang SC",sans-serif';
  n._lines = wrapTokens(n.label || n.t, cf);
  n._lw = Math.max.apply(null, n._lines.map(l => ctx.measureText(l).width));
  n._w = Math.min(cf.maxW, n._lw + 24);
  n._h = n._lines.length * (cf.fs * 1.32) + 10;
  n.open = OPENKINDS.indexOf(n.k) >= 0;
});

// 列 x 坐标（每层取该层最宽节点保证不重叠）
const colX = [0];
(function(){
  let x = 0;
  for (const k of ["root", "part", "chap", "sec"]){
    let mw = 120;
    walkAll(DATA, n => { if (n.k === k) mw = Math.max(mw, n._w); });
    x += mw + 48; colX.push(x);
  }
  for (let d = 4; d <= 9; d++){ colX.push(x); x += 120; }
})();
const colXOf = d => colX[Math.min(d, colX.length - 1)] + (d > 9 ? (d - 9) * 0 : 0);

// ---------- 布局 + 渲染 ----------
const svg = document.getElementById("svg"), vp = document.getElementById("vp");
let cursorY = 0, lastMaxX = 300, vis = [];
function layout(n, depth){
  n._d = depth; n._x = colXOf(depth);
  const kids = (n.c && n.open) ? n.c : [];
  if (!kids.length){ n._y = cursorY + n._h / 2 + 6; cursorY += n._h + 12; return n._y; }
  const ys = kids.map(k => layout(k, depth + 1));
  n._y = (ys[0] + ys[ys.length - 1]) / 2;
  return n._y;
}
function esc(s){ return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function renderMap(){
  cursorY = 0; vis = [];
  layout(DATA, 0);
  let links = "", nodes = "";
  (function link(n){
    const kids = (n.c && n.open) ? n.c : [];
    for (const k of kids){
      const x1 = n._x + n._w, y1 = n._y, x2 = k._x, y2 = k._y;
      const dx = Math.max(24, (x2 - x1) * 0.5);
      const col = partColor(k);
      const op = ((k.k === "part" || k.k === "chap") ? 0.8 : (k.k === "sec" ? 0.5 : 0.4)) * (_searchOn && !k._hit && !k._path ? 0.15 : 1);
      const sw = k.k === "part" ? 2.6 : (k.k === "chap" ? 1.8 : 1.5);
      links += '<path d="M' + x1 + ',' + y1.toFixed(1) + ' C' + (x1 + dx) + ',' + y1.toFixed(1) + ' ' +
               (x2 - dx) + ',' + y2.toFixed(1) + ' ' + x2 + ',' + y2.toFixed(1) +
               '" fill="none" stroke="' + col + '" stroke-opacity="' + op + '" stroke-width="' + sw + '"/>';
      link(k);
    }
  })(DATA);
  (function draw(n){
    vis.push(n);
    lastMaxX = Math.max(lastMaxX, n._x + n._w);
    const cf = CFG[n.k] || CFG.b, col = partColor(n);
    const dark = n.k === "root" || n.k === "part";
    const fill = dark ? (n.k === "root" ? "#2f3440" : col) : (n.k === "chap" ? "#ffffff" : (n.k === "sec" ? "#eef2ff" : "#fcfcfc"));
    const hit = !!n._hit;
    const dim = _searchOn && !hit && !n._path;
    const stroke = hit ? "#e25563" : (dark ? "none" : (n.k === "chap" ? col : (n.k === "sec" ? "#c7d2fe" : "#e7e5de")));
    const sw = hit ? 2.2 : (dark ? 0 : (n.k === "chap" ? 1.7 : (n.k === "sec" ? 1.3 : 1)));
    const txt = dark ? "#fff" : (n.k === "chap" ? "#1f1f1f" : (n.k === "sec" ? "#1e3a8a" : "#5a5a55"));
    let tspans = "";
    n._lines.forEach((l, i) => {
      tspans += '<tspan x="' + (n._x + 12) + '" y="' + (n._y - n._h / 2 + cf.fs * 1.32 * (i + 0.82)).toFixed(1) + '">' + esc(l) + '</tspan>';
    });
    const dashAttr = hit ? ' stroke-dasharray="5 3"' : "";
    nodes += '<g class="pill" style="cursor:' + ((n.c && n.c.length) ? "pointer" : "default") + '"' + (dim ? ' opacity="0.18"' : "") + '>' +
      '<rect x="' + n._x + '" y="' + (n._y - n._h / 2).toFixed(1) + '" width="' + n._w.toFixed(1) +
      '" height="' + n._h.toFixed(1) + '" rx="7" fill="' + fill + '" stroke="' + stroke +
      '" stroke-width="' + sw + '"' + dashAttr + '/>' +
      '<text font-size="' + cf.fs + '" font-weight="' + (cf.bold ? 600 : 400) + '" fill="' + txt + '">' + tspans + '</text>' +
      '<title>' + esc(n.t) + '</title></g>';
    ((n.c && n.open) ? n.c : []).forEach(draw);
  })(DATA);
  vp.innerHTML = links + nodes;
  const gs = vp.querySelectorAll("g.pill");
  gs.forEach((g, i) => {
    g.addEventListener("click", e => {
      const n = vis[i];
      if (!n || !n.c || !n.c.length) return;
      e.stopPropagation();
      n.open = !n.open;
      renderMap();
      const bb = svg.getBoundingClientRect();
      tf.y = bb.height / 2 - n._y * tf.s;
      const sx = n._x * tf.s + tf.x;
      if (sx < 60) tf.x += 60 - sx;
      applyTf();
    });
  });
}

// ---------- 缩放平移 ----------
let tf = { x: 0, y: 0, s: 1 };
function applyTf(){ vp.setAttribute("transform", "translate(" + tf.x + "," + tf.y + ") scale(" + tf.s + ")"); }
function fitView(){
  const bb = svg.getBoundingClientRect();
  const h = Math.max(cursorY, 120), w = Math.max(lastMaxX + 60, 400);
  const s = Math.max(0.15, Math.min((bb.width - 70) / w, (bb.height - 70) / h, 0.85));
  tf = { s: s, x: (bb.width - w * s) / 2, y: (bb.height - h * s) / 2 };
  applyTf();
}
const viewMap = document.getElementById("viewMap");
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const bb = svg.getBoundingClientRect(), mx = e.clientX - bb.left, my = e.clientY - bb.top;
  tf.x = mx - (mx - tf.x) * k; tf.y = my - (my - tf.y) * k;
  tf.s = Math.min(3, Math.max(0.08, tf.s * k));
  applyTf();
}, { passive: false });
let drag = null;
svg.addEventListener("mousedown", e => { drag = { x: e.clientX, y: e.clientY, tx: tf.x, ty: tf.y }; viewMap.classList.add("dragging"); });
window.addEventListener("mousemove", e => { if (!drag) return; tf.x = drag.tx + e.clientX - drag.x; tf.y = drag.ty + e.clientY - drag.y; applyTf(); });
window.addEventListener("mouseup", () => { drag = null; viewMap.classList.remove("dragging"); });
svg.addEventListener("dblclick", e => { if (e.target === svg) fitView(); });
// 触摸：单指拖动、双指捏合缩放
let tstart = null, tdist = 0;
viewMap.addEventListener("touchstart", e => {
  if (e.touches.length === 1){ const t = e.touches[0]; tstart = { x: t.clientX, y: t.clientY, tx: tf.x, ty: tf.y }; }
  else if (e.touches.length === 2){ tdist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); tstart = null; }
}, { passive: true });
viewMap.addEventListener("touchmove", e => {
  if (e.touches.length === 1 && tstart){
    e.preventDefault();
    const t = e.touches[0];
    tf.x = tstart.tx + t.clientX - tstart.x; tf.y = tstart.ty + t.clientY - tstart.y;
    applyTf();
  } else if (e.touches.length === 2 && tdist){
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const bb = svg.getBoundingClientRect();
    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - bb.left, my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - bb.top;
    const k = Math.min(3, Math.max(0.08, tf.s * d / tdist));
    tf.x = mx - (mx - tf.x) * (k / tf.s); tf.y = my - (my - tf.y) * (k / tf.s);
    tf.s = k; tdist = d;
    applyTf();
  }
}, { passive: false });
viewMap.addEventListener("touchend", () => { tstart = null; tdist = 0; });  // 双击空白复位

// ---------- 大纲视图 ----------
const otree = document.getElementById("otree");
function buildOutline(n){
  if (n.c && n.c.length){
    const d = document.createElement("details");
    d.className = n.k === "part" ? ("part " + n.pc) : n.k;
    d.open = n.k === "root" || n.k === "part" || n.k === "chap";
    const s = document.createElement("summary"); s.innerHTML = n.h || ""; d.appendChild(s);
    const kids = document.createElement("div"); kids.className = "kids";
    n.c.forEach(c => kids.appendChild(buildOutline(c)));
    d.appendChild(kids);
    return d;
  }
  const dv = document.createElement("div"); dv.className = "leaf " + n.k; dv.innerHTML = n.h || "";
  return dv;
}
otree.appendChild(buildOutline(DATA));

// ---------- 视图切换 ----------
let view = "map";
function showView(v){
  view = v;
  document.getElementById("tabMap").classList.toggle("on", v === "map");
  document.getElementById("tabOutline").classList.toggle("on", v === "outline");
  viewMap.style.display = v === "map" ? "block" : "none";
  document.getElementById("viewOutline").style.display = v === "outline" ? "block" : "none";
  if (v === "map"){ renderMap(); applyTf(); }
}
document.getElementById("tabMap").onclick = () => showView("map");
document.getElementById("tabOutline").onclick = () => showView("outline");
document.getElementById("fit").onclick = () => { if (view === "map") fitView(); };

function setOpenAll(deep){
  walkAll(DATA, n => { if (n.c) n.open = deep ? true : TOPKINDS.indexOf(n.k) >= 0; });
  if (view === "map"){ renderMap(); fitView(); }
  else otree.querySelectorAll("details").forEach(d => d.open = d.classList.contains("root") || d.classList.contains("part") || d.classList.contains("chap"));
}
document.getElementById("expand").onclick = () => setOpenAll(true);
document.getElementById("collapse").onclick = () => setOpenAll(false);

// ---------- 搜索 ----------
const q = document.getElementById("q"), hitsEl = document.getElementById("hits");
let timer = null, _searchOn = false;
q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(doSearch, 150); });
q.addEventListener("keydown", e => { if (e.key === "Escape"){ q.value = ""; doSearch(); } });
function clearMarks(){ document.querySelectorAll("mark").forEach(m => m.replaceWith(document.createTextNode(m.textContent))); }
function setHits(t){ hitsEl.textContent = t; hitsEl.style.display = t ? "inline" : "none"; }
function doSearch(){
  const kw = q.value.trim().toLowerCase();
  clearMarks();
  walkAll(DATA, n => { n._hit = false; n._path = false; });
  _searchOn = kw !== "";
  if (!kw){
    setHits("");
    otree.querySelectorAll(".hide").forEach(el => el.classList.remove("hide"));
    otree.querySelectorAll("details").forEach(d => d.open = d.classList.contains("root") || d.classList.contains("part") || d.classList.contains("chap"));
    setOpenDefault(); renderMap(); fitView();
    return;
  }
  const matches = [];
  walkAll(DATA, n => { if (n.t.toLowerCase().indexOf(kw) >= 0){ n._hit = true; matches.push(n); } });
  matches.forEach(m => { let p = m._p; while (p){ p._path = true; p = p._p; } });
  if (view === "map"){
    matches.forEach(m => { let p = m._p; while (p){ p.open = true; p = p._p; } });
    renderMap();
    setHits(matches.length ? matches.length + " 处命中" : "无命中");
    if (matches.length){
      if (tf.s < 0.3) tf.s = 0.5;   // 防御：过小缩放下命中不可读
      const n = matches[0], bb = svg.getBoundingClientRect();
      tf.x = bb.width / 2 - (n._x + n._w / 2) * tf.s;
      tf.y = bb.height / 2 - n._y * tf.s;
      applyTf();
    }
  } else {
    const details = Array.from(otree.querySelectorAll("details"));
    const leaves = Array.from(otree.querySelectorAll(".leaf"));
    const els = details.map(d => ({ el: d, tx: d.querySelector("summary").textContent, isD: true }))
      .concat(leaves.map(l => ({ el: l, tx: l.textContent, isD: false })));
    const anc = new Set();
    for (const n of els) if (n.tx.toLowerCase().indexOf(kw) >= 0){
      let p = n.el.parentElement;
      while (p && p !== otree){ const dd = p.closest ? p.closest("details") : null; if (dd) anc.add(dd); p = p.parentElement; }
    }
    for (const n of els){
      const hit = n.tx.toLowerCase().indexOf(kw) >= 0;
      n.el.classList.toggle("hide", !(hit || anc.has(n.el)));
      if (n.isD && (hit || anc.has(n.el))) n.el.open = true;
    }
    let nHit = 0;
    for (const n of els) if (n.tx.toLowerCase().indexOf(kw) >= 0) nHit++;
    setHits(nHit + " 处命中");
    otree.querySelectorAll("summary, .leaf").forEach(el => {
      const t = el.childNodes[0];
      if (t && t.nodeType === 3){
        const idx = t.textContent.toLowerCase().indexOf(kw);
        if (idx >= 0){
          const range = document.createRange();
          range.setStart(t, idx); range.setEnd(t, idx + kw.length);
          try { const mk = document.createElement("mark"); range.surroundContents(mk); } catch (e) {}
        }
      }
    });
  }
}
function setOpenDefault(){ walkAll(DATA, n => { if (n.c) n.open = OPENKINDS.indexOf(n.k) >= 0; }); }

// ---------- 初始化 ----------
showView("map");
fitView();
if (window.innerWidth < 760) showView("outline");  // 手机默认大纲视图  // 同步执行：rAF 在标签页不可见时会被推迟，若拖到搜索之后会覆盖定位
</script>
</body>
</html>
