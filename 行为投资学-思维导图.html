aming effect）：感知与记忆受信息的呈现方式（框定）影响，是金融决策存在框定依赖的重要原因。","label":"框定效应"},{"t":"对比效应：中等身材的体育解说员采访篮球运动员显得四肢短小、采访赛马运动员显得高大；缪勒-莱尔错觉——等长的两条线段因内外箭头而被误判长短。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对比效应</strong>：中等身材的体育解说员采访篮球运动员显得四肢短小、采访赛马运动员显得高大；缪勒-莱尔错觉——等长的两条线段因内外箭头而被误判长短。","label":"对比效应"},{"t":"首因效应（primacy effect）：以\"聪明、刻苦、冲动、挑剔、顽固、嫉妒\"的顺序描述一个人，比\"嫉妒、顽固、挑剔、冲动、刻苦、聪明\"的顺序留下更正面印象——最先出现的特征影响更强。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">首因效应</strong>（primacy effect）：以&quot;聪明、刻苦、冲动、挑剔、顽固、嫉妒&quot;的顺序描述一个人，比&quot;嫉妒、顽固、挑剔、冲动、刻苦、聪明&quot;的顺序留下更正面印象——最先出现的特征影响更强。","label":"首因效应"},{"t":"近因效应（recency effect）：事件按时序发生时，最后出现的事件影响最大；两者强弱视情形而定——事件间隔很长时近因主导（上周的事比去年的影响大），两件紧随的事件（如两场政治演讲）通常首因主导。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">近因效应</strong>（recency effect）：事件按时序发生时，最后出现的事件影响最大；两者强弱视情形而定——事件间隔很长时近因主导（上周的事比去年的影响大），两件紧随的事件（如两场政治演讲）通常首因主导。","label":"近因效应"},{"t":"晕轮效应（halo effect）：衣着得体、相貌漂亮者获得更高评价，如长相漂亮的答辩学生写的文章更容易获得好评。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">晕轮效应</strong>（halo effect）：衣着得体、相貌漂亮者获得更高评价，如长相漂亮的答辩学生写的文章更容易获得好评。","label":"晕轮效应"}],"k":"b","i":1,"h":"5.1.3 框定效应","label":"5.1.3 框定效应"},{"t":"5.1.4 易于加工与信息超载","c":[{"t":"易于加工（ease of processing）：已理解或容易理解的信息被认为更有可能是正确的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">易于加工</strong>（ease of processing）：已理解或容易理解的信息被认为更有可能是正确的。","label":"易于加工"},{"t":"信息超载（information overload）：过多信息导致令人困惑、无法决策的状态；超市果酱果冻实验——更多样品选择吸引更多人群，较少选择却卖出更多商品；拖延可能导致长期无所作为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信息超载</strong>（information overload）：过多信息导致令人困惑、无法决策的状态；超市果酱果冻实验——更多样品选择吸引更多人群，较少选择却卖出更多商品；拖延可能导致长期无所作为。","label":"信息超载"}],"k":"b","i":1,"h":"5.1.4 易于加工与信息超载","label":"5.1.4 易于加工与信息超载"},{"t":"5.1.5 启发式","c":[{"t":"启发式（heuristics）：基于信息集某个子集进行决策的规则；因注意力、信息与信息处理能力有限而必须使用，且常常毫无意识地运行。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">启发式</strong>（heuristics）：基于信息集某个子集进行决策的规则；因注意力、信息与信息处理能力有限而必须使用，且常常毫无意识地运行。","label":"启发式（heuristics）：基于…"},{"t":"第一类启发式（type 1 heuristics）：灵活、自发、无意识、省力，适合快速决策或低风险情形（\"我选汉堡而不是热狗，因为我平时更喜欢汉堡\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第一类启发式</strong>（type 1 heuristics）：灵活、自发、无意识、省力，适合快速决策或低风险情形（&quot;我选汉堡而不是热狗，因为我平时更喜欢汉堡&quot;）。","label":"第一类启发式"},{"t":"第二类启发式（type 2 heuristics）：有意识、需要付出更多努力，适合决策风险较高的情况；第一类得到的最初选择有时被第二类否决（\"今天吃热狗，想换换口味\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第二类启发式</strong>（type 2 heuristics）：有意识、需要付出更多努力，适合决策风险较高的情况；第一类得到的最初选择有时被第二类否决（&quot;今天吃热狗，想换换口味&quot;）。","label":"第二类启发式"},{"t":"进化起源：进化把人类武装起来应对生存挑战，但一套好的启发式只要求比竞争对手好、不必最优；金融决策中的许多问题最近才出现，启发式用于原领域之外时可能失效（瑞士军刀类比）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">进化起源</strong>：进化把人类武装起来应对生存挑战，但一套好的启发式只要求比竞争对手好、不必最优；金融决策中的许多问题最近才出现，启发式用于原领域之外时可能失效（瑞士军刀类比）。","label":"进化起源"}],"k":"b","i":1,"h":"5.1.5 启发式","label":"5.1.5 启发式"},{"t":"5.1.6 启发式的例子","c":[{"t":"听到巨响立刻跑开、扔掉散发怪味的食品：两种自发的第一类启发式，对人类生存延续贡献巨大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">听到巨响立刻跑开、扔掉散发怪味的食品</strong>：两种自发的第一类启发式，对人类生存延续贡献巨大。","label":"听到巨响立刻跑开、扔掉散发怪味的食品"}],"k":"b","i":1,"h":"5.1.6 启发式的例子","label":"5.1.6 启发式的例子"}],"k":"sec","i":0,"h":"5.1 感知、记忆和启发","label":"5.1 感知、记忆和启发"},{"t":"5.2 熟悉度和相关的启发式","c":[{"t":"总起：一族相互关联的启发式使人产生与客观原因无关的偏好——对熟悉的事物更舒服、厌恶模糊性、坚持已拥有的事物、回避新行动，核心是追求安逸。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总起</strong>：一族相互关联的启发式使人产生与客观原因无关的偏好——对熟悉的事物更舒服、厌恶模糊性、坚持已拥有的事物、回避新行动，核心是追求安逸。","label":"总起：一族相互关联的启发式使人产生与…"},{"t":"5.2.1 熟悉的事物","c":[{"t":"熟悉度（familiarity）：人们更容易接受自认为掌握了相关信息、觉得自己胜券在握的赌博。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">熟悉度</strong>（familiarity）：人们更容易接受自认为掌握了相关信息、觉得自己胜券在握的赌博。","label":"熟悉度（familiarity）：人…"},{"t":"希思与特沃斯基实验：先做多项选择题并自报置信概率，再在\"以该概率获胜的随机赌局\"与\"答题赌局\"之间选择——主观判断概率高时倾向选择有把握的赌局，说明人们偏好熟悉的事物。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">希思与特沃斯基实验</strong>：先做多项选择题并自报置信概率，再在&quot;以该概率获胜的随机赌局&quot;与&quot;答题赌局&quot;之间选择——主观判断概率高时倾向选择有把握的赌局，说明人们偏好熟悉的事物。","label":"希思与特沃斯基实验"}],"k":"b","i":1,"h":"5.2.1 熟悉的事物","label":"5.2.1 熟悉的事物"},{"t":"5.2.2 模糊厌恶","c":[{"t":"模糊厌恶（ambiguity aversion）：相对于概率分布已知的赌局，人们不喜欢概率分布未知的赌局。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">模糊厌恶</strong>（ambiguity aversion）：相对于概率分布已知的赌局，人们不喜欢概率分布未知的赌局。","label":"模糊厌恶"},{"t":"Ellsberg坛子实验：从\"已知50黑球+50红球\"的坛子与\"只知共100只球\"的坛子抽球，无条件获胜概率相同，人们却偏好前者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">Ellsberg坛子实验</strong>：从&quot;已知50黑球+50红球&quot;的坛子与&quot;只知共100只球&quot;的坛子抽球，无条件获胜概率相同，人们却偏好前者。","label":"Ellsberg坛子实验"},{"t":"风险（概率分布已知）与不确定性（分布未知）的区分：模糊厌恶源于对不确定性的不适；它在很大程度上是情绪行为（尤其恐惧）而非启发式。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">风险</strong>（概率分布已知）与不确定性（分布未知）的区分：模糊厌恶源于对不确定性的不适；它在很大程度上是情绪行为（尤其恐惧）而非启发式。","label":"风险（概率分布已知）与不确定性（分布…"}],"k":"b","i":1,"h":"5.2.2 模糊厌恶","label":"5.2.2 模糊厌恶"},{"t":"5.2.3 多元启发式","c":[{"t":"多元启发式（diversity heuristic）：当不同选择之间不相互排斥时，人们喜欢每个事物都尝试一下（吃自助餐时品尝最多种类）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">多元启发式</strong>（diversity heuristic）：当不同选择之间不相互排斥时，人们喜欢每个事物都尝试一下（吃自助餐时品尝最多种类）。","label":"多元启发式"},{"t":"西蒙森的发现：为未来消费大量购物时倾向选择不同种类的物品（不同味道的奶酪），每次即时消费则只购买一种。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">西蒙森的发现</strong>：为未来消费大量购物时倾向选择不同种类的物品（不同味道的奶酪），每次即时消费则只购买一种。","label":"西蒙森的发现"},{"t":"三个动因：很多人天生偏好多样性与新鲜事物；未来偏好包含不确定性，分散购买如同分散投资降低风险；追求多样化简化决策、节省时间并减少决策冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三个动因</strong>：很多人天生偏好多样性与新鲜事物；未来偏好包含不确定性，分散购买如同分散投资降低风险；追求多样化简化决策、节省时间并减少决策冲突。","label":"三个动因"}],"k":"b","i":1,"h":"5.2.3 多元启发式","label":"5.2.3 多元启发式"},{"t":"5.2.4 安于现状偏差和禀赋效应","c":[{"t":"安于现状偏差（status quo bias）：偏爱现状、不愿改变，担心采取积极行动会带来后悔；作为启发式即\"坚守你所拥有的，除非有很充分的理由做出其他选择\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">安于现状偏差</strong>（status quo bias）：偏爱现状、不愿改变，担心采取积极行动会带来后悔；作为启发式即&quot;坚守你所拥有的，除非有很充分的理由做出其他选择&quot;。","label":"安于现状偏差"},{"t":"禀赋效应（endowment effect）：人们倾向于持有目前已经拥有的事物（第3章用损失厌恶解释，此处作为启发式再现）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">禀赋效应</strong>（endowment effect）：人们倾向于持有目前已经拥有的事物（第3章用损失厌恶解释，此处作为启发式再现）。","label":"禀赋效应"},{"t":"遗产配置实验（Samuelson与Zeckhauser）：把刚获得的遗产分配到中等风险XYZ股票、高风险ABC股票、美国国库券、市政债券四种资产上；对照实验中无论哪种资产被设定为初始禀赋，它都成为最受欢迎的选择——人们对保持现状最舒服，即使现状并非自己选的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">遗产配置实验</strong>（Samuelson与Zeckhauser）：把刚获得的遗产分配到中等风险XYZ股票、高风险ABC股票、美国国库券、市政债券四种资产上；对照实验中无论哪种资产被设定为初始禀赋，它都成为最受欢迎的选择——人们对保持现状最舒服，即使现状并非自己选的。","label":"遗产配置实验"}],"k":"b","i":1,"h":"5.2.4 安于现状偏差和禀赋效应","label":"5.2.4 安于现状偏差和禀赋效应"},{"t":"5.2.5 启发式和偏差、前景理论和情绪","c":[{"t":"本节所有启发式都源于对安逸的追求；禀赋效应可由前景理论解释、也可视为启发式导致的偏差，模糊厌恶含明显情绪成分——前景理论、启发式和偏差与情绪之间的界限有些模糊。","c":[],"k":"b","i":2,"h":"本节所有启发式都源于对安逸的追求；禀赋效应可由前景理论解释、也可视为启发式导致的偏差，模糊厌恶含明显情绪成分——前景理论、启发式和偏差与情绪之间的界限有些模糊。","label":"本节所有启发式都源于对安逸的追求；禀…"}],"k":"b","i":1,"h":"5.2.5 启发式和偏差、前景理论和情绪","label":"5.2.5 启发式和偏差、前景理论和情绪"},{"t":"模糊规避使投资者对自己不了解的股票非常谨慎，其另一面是对熟悉事物的特别偏好；401(K)计划中配置占比第二高的资产是本公司股票，可口可乐员工将不少于76%的退休金可自由支配份额投入自家股票，关键理由是\"过去表现不错\"；但贝纳茨的检验发现是否配置自家股票与随后的整体回报无关（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"模糊规避使投资者对自己不了解的股票非常谨慎，其另一面是对熟悉事物的特别偏好；401(K)计划中配置占比第二高的资产是本公司股票，可口可乐员工将不少于76%的退休金可自由支配份额投入自家股票，关键理由是&quot;过去表现不错&quot;；但贝纳茨的检验发现是否配置自家股票与随后的整体回报无关（蒙蒂尔）。","label":"模糊规避使投资者对自己不了解的股票非…"},{"t":"分散化不足并不限于个股层面：本土偏好——美国、英国、日本70%至90%的股票投资集中在国内，难以用资本管制或信息不对称解释；本地偏好——科瓦尔和莫斯科维茨发现基金经理每10只股票中有1只因公司与自己同城而选中，这些公司多为规模较小、杠杆率较高、产品竞争力有限的企业；休伯曼发现\"小贝尔\"本地电话公司的股东几乎在所有州都多于其他地区持有者，而从收入相关性看，分散投资于非本地电话公司才是更理性选择（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">分散化不足并不限于个股层面</strong>：本土偏好——美国、英国、日本70%至90%的股票投资集中在国内，难以用资本管制或信息不对称解释；本地偏好——科瓦尔和莫斯科维茨发现基金经理每10只股票中有1只因公司与自己同城而选中，这些公司多为规模较小、杠杆率较高、产品竞争力有限的企业；休伯曼发现&quot;小贝尔&quot;本地电话公司的股东几乎在所有州都多于其他地区持有者，而从收入相关性看，分散投资于非本地电话公司才是更理性选择（蒙蒂尔）。","label":"分散化不足并不限于个股层面"}],"k":"sec","i":0,"h":"5.2 熟悉度和相关的启发式","label":"5.2 熟悉度和相关的启发式"},{"t":"5.3 代表性启发式及相关偏差","c":[{"t":"总起：特沃斯基与卡尼曼鉴定出三种能让人误入歧途的关键启发式——代表性、可得性、锚定；许多金融决策依赖概率估计（公司持续盈利、利率上升、研发成功的可能性），而人们理解概率面临很大困难。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总起</strong>：特沃斯基与卡尼曼鉴定出三种能让人误入歧途的关键启发式——代表性、可得性、锚定；许多金融决策依赖概率估计（公司持续盈利、利率上升、研发成功的可能性），而人们理解概率面临很大困难。","label":"总起：特沃斯基与卡尼曼鉴定出三种能让…"},{"t":"代表性启发式（representativeness heuristic）：概率估计依赖A在多大程度上代表B（A与B的相似程度）；相似则B发生导致A的概率被高估，不相似则被低估——典型后果是在充分了解情况的基础上把某事件发生的概率判断得比实际更大（或更小）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">代表性启发式</strong>（representativeness heuristic）：概率估计依赖A在多大程度上代表B（A与B的相似程度）；相似则B发生导致A的概率被高估，不相似则被低估——典型后果是在充分了解情况的基础上把某事件发生的概率判断得比实际更大（或更小）。","label":"代表性启发式"},{"t":"5.3.1 联合谬误","c":[{"t":"联合谬误（conjunction fallacy）：误以为联合概率P(A∩B)大于简单概率P(A)；实际上交集概率必定不大于任一子集概率（文氏图）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">联合谬误</strong>（conjunction fallacy）：误以为联合概率P(A∩B)大于简单概率P(A)；实际上交集概率必定不大于任一子集概率（文氏图）。","label":"联合谬误"},{"t":"例：人们觉得\"第二天彩票中奖且十分高兴\"比\"仅仅中奖\"更可能——欢天喜地的中奖者与沮丧的未中奖者似乎更能\"代表\"彩民群体。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例</strong>：人们觉得&quot;第二天彩票中奖且十分高兴&quot;比&quot;仅仅中奖&quot;更可能——欢天喜地的中奖者与沮丧的未中奖者似乎更能&quot;代表&quot;彩民群体。","label":"例：人们觉得\"第二天彩票中奖且十分高…"},{"t":"蒙蒂尔的琳达问题：31岁、单身、直言不讳、主修哲学、关心平等与歧视的琳达，被多数人判断为更可能是\"银行职员兼女权运动积极分子\"而非\"银行职员\"，犯的正是忽略基准概率的联合谬误——两个集合的交集永远不可能大于其中一个集合，且银行柜员的数量远多于参加女权运动的银行柜员（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">蒙蒂尔的琳达问题</strong>：31岁、单身、直言不讳、主修哲学、关心平等与歧视的琳达，被多数人判断为更可能是&quot;银行职员兼女权运动积极分子&quot;而非&quot;银行职员&quot;，犯的正是忽略基准概率的联合谬误——两个集合的交集永远不可能大于其中一个集合，且银行柜员的数量远多于参加女权运动的银行柜员（蒙蒂尔）。","label":"蒙蒂尔的琳达问题"}],"k":"b","i":1,"h":"5.3.1 联合谬误","label":"5.3.1 联合谬误"},{"t":"5.3.2 基率忽视","c":[{"t":"基率忽视（base rate neglect）：忽视总体基础概率、过度倚重样本（描述性）信息的倾向。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">基率忽视</strong>（base rate neglect）：忽视总体基础概率、过度倚重样本（描述性）信息的倾向。","label":"基率忽视"},{"t":"律师/工程师实验：先告知群体70%是工程师、30%是律师（或相反），再给出中性的\"迪克\"的描述；被试判断五五开——无论先验如何，基础概率被完全忽视；更普遍的情形是注意到基础概率但重视不足。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">律师/工程师实验</strong>：先告知群体70%是工程师、30%是律师（或相反），再给出中性的&quot;迪克&quot;的描述；被试判断五五开——无论先验如何，基础概率被完全忽视；更普遍的情形是注意到基础概率但重视不足。","label":"律师/工程师实验"},{"t":"贝叶斯法则（Bayes' rule）：P(B|A)=P(A|B)×[P(B)/P(A)]，即后验概率=似然×先验比，是依据新信息最优更新概率的有效关系式。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贝叶斯法则</strong>（Bayes&#x27; rule）：P(B|A)=P(A|B)×[P(B)/P(A)]，即后验概率=似然×先验比，是依据新信息最优更新概率的有效关系式。","label":"贝叶斯法则"},{"t":"气压计例子：基础概率P(雨天)=40%，已知P(预测下雨|雨天)=90%、P(预测下雨|晴天)=2.5%；得知气压计预测下雨后，P(雨天|预测下雨)=0.9×(0.4/0.375)=96%——从40%升至96%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">气压计例子</strong>：基础概率P(雨天)=40%，已知P(预测下雨|雨天)=90%、P(预测下雨|晴天)=2.5%；得知气压计预测下雨后，P(雨天|预测下雨)=0.9×(0.4/0.375)=96%——从40%升至96%。","label":"气压计例子"},{"t":"热手现象（hot hand）的贝叶斯计算：假想NBA球员约翰·卡什历史命中率40%、今晚10投8中；以历史记录为基率更新，P(下次命中|10中8)=0.4×(0.06/0.04)=60%——假想数据确实存在热手；但低估基率就会对\"运气\"过于乐观。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">热手现象</strong>（hot hand）的贝叶斯计算：假想NBA球员约翰·卡什历史命中率40%、今晚10投8中；以历史记录为基率更新，P(下次命中|10中8)=0.4×(0.06/0.04)=60%——假想数据确实存在热手；但低估基率就会对&quot;运气&quot;过于乐观。","label":"热手现象"},{"t":"真实证据（吉洛维奇、瓦朗和特沃斯基）：费城76人队1980-81赛季，91%的球迷相信热手，但连续命中三次后球员平均命中率46%，反而低于连续未中三次后的56%；D. Dawkins连续失手三次后命中88%、连续命中三次后仅51%；本次命中与上次命中之间的相关系数除一人外全为负——热手只是一种幻觉。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">真实证据</strong>（吉洛维奇、瓦朗和特沃斯基）：费城76人队1980-81赛季，91%的球迷相信热手，但连续命中三次后球员平均命中率46%，反而低于连续未中三次后的56%；D. Dawkins连续失手三次后命中88%、连续命中三次后仅51%；本次命中与上次命中之间的相关系数除一人外全为负——热手只是一种幻觉。","label":"真实证据"},{"t":"反转现象的可能解释：连续命中后球员骄傲自大、尝试高难度投篮，对手防守也更集中；连续失利的球员倾向选择成功率更高的投篮方式。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反转现象的可能解释</strong>：连续命中后球员骄傲自大、尝试高难度投篮，对手防守也更集中；连续失利的球员倾向选择成功率更高的投篮方式。","label":"反转现象的可能解释"}],"k":"b","i":1,"h":"5.3.2 基率忽视","label":"5.3.2 基率忽视"},{"t":"5.3.3 赌徒谬误与热手现象","c":[{"t":"赌徒谬误（gambler's fallacy）：认为机会是自我修正的过程，连续同向结果后\"该反了\"；错在把大数定律错误应用于小样本，即使用\"小数定律\"（law of small numbers）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">赌徒谬误</strong>（gambler&#x27;s fallacy）：认为机会是自我修正的过程，连续同向结果后&quot;该反了&quot;；错在把大数定律错误应用于小样本，即使用&quot;小数定律&quot;（law of small numbers）。","label":"赌徒谬误"},{"t":"纸牌游戏中苏珊连续摸到好牌：认为她会继续走运（热手）或\"该摸差牌了\"（赌徒谬误）都不成立——独立事件中她随后摸到好牌的概率仍是50%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">纸牌游戏中苏珊连续摸到好牌</strong>：认为她会继续走运（热手）或&quot;该摸差牌了&quot;（赌徒谬误）都不成立——独立事件中她随后摸到好牌的概率仍是50%。","label":"纸牌游戏中苏珊连续摸到好牌"},{"t":"出生顺序实验：已知\"女男女男男女\"顺序有72家，被试普遍估计\"男女男男男男\"更少——尽管任何一种顺序出现概率相等，后者只是\"看起来不够随机\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">出生顺序实验</strong>：已知&quot;女男女男男女&quot;顺序有72家，被试普遍估计&quot;男女男男男男&quot;更少——尽管任何一种顺序出现概率相等，后者只是&quot;看起来不够随机&quot;。","label":"出生顺序实验"},{"t":"抛硬币序列\"正反正反反正\"与\"正正正反反反\"概率相同，但多数人认为前者更像随机样本——人们相信样本与总体的相似性比统计理论预测的更接近（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"抛硬币序列&quot;正反正反反正&quot;与&quot;正正正反反反&quot;概率相同，但多数人认为前者更像随机样本——人们相信样本与总体的相似性比统计理论预测的更接近（蒙蒂尔）。","label":"抛硬币序列\"正反正反反正\"与\"正正正…"},{"t":"布卢姆菲尔德和黑尔斯的随机游走实验：人们对多次延续之后发生的变化反应过度，而对多次反转之后发生的变化反应不足——\"延续\"与\"反转\"两种心理状态并存（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">布卢姆菲尔德和黑尔斯的随机游走实验</strong>：人们对多次延续之后发生的变化反应过度，而对多次反转之后发生的变化反应不足——&quot;延续&quot;与&quot;反转&quot;两种心理状态并存（蒙蒂尔）。","label":"布卢姆菲尔德和黑尔斯的随机游走实验"}],"k":"b","i":1,"h":"5.3.3 赌徒谬误与热手现象","label":"5.3.3 赌徒谬误与热手现象"},{"t":"5.3.4 高估可预测性","c":[{"t":"高估可预测性：人们倾向于相信事件可以被预测，即使依据毫无信息量——让学生依据心情预测大学GPA，受访学生给出的相关系数均值为0.7。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">高估可预测性</strong>：人们倾向于相信事件可以被预测，即使依据毫无信息量——让学生依据心情预测大学GPA，受访学生给出的相关系数均值为0.7。","label":"高估可预测性"},{"t":"规范做法是在总体均值与样本估计之间权衡：GPA总体均值3.0时，越认为样本没有意义，估计越应趋近均值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规范做法是在总体均值与样本估计之间权衡</strong>：GPA总体均值3.0时，越认为样本没有意义，估计越应趋近均值。","label":"规范做法是在总体均值与样本估计之间权衡"},{"t":"GPA实验：高中GPA均值3.44、大学GPA均值3.08；对高中GPA为2.2的学生，被试预测其大学GPA为2.03，而实际这类学生的GPA为2.7——轻视均值回归、夸大样本权重（高中成绩并非大学表现的理想预测指标）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">GPA实验</strong>：高中GPA均值3.44、大学GPA均值3.08；对高中GPA为2.2的学生，被试预测其大学GPA为2.03，而实际这类学生的GPA为2.7——轻视均值回归、夸大样本权重（高中成绩并非大学表现的理想预测指标）。","label":"GPA实验"},{"t":"轻视均值回归与低估基率相似：两者都赋予手中样本相对总体特征过多的权重。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">轻视均值回归与低估基率相似</strong>：两者都赋予手中样本相对总体特征过多的权重。","label":"轻视均值回归与低估基率相似"}],"k":"b","i":1,"h":"5.3.4 高估可预测性","label":"5.3.4 高估可预测性"},{"t":"5.3.5 可得性启发式、近因效应与显著性效应","c":[{"t":"可得性启发式（availability heuristic）：人们认为容易铭记于心（容易想起）的事件发生的可能性较大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">可得性启发式</strong>（availability heuristic）：人们认为容易铭记于心（容易想起）的事件发生的可能性较大。","label":"可得性启发式"},{"t":"字母K实验：人们判断首字母为K的单词比第三位为K的更多，因为更容易想起前者——现实中恰好相反。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">字母K实验</strong>：人们判断首字母为K的单词比第三位为K的更多，因为更容易想起前者——现实中恰好相反。","label":"字母K实验"},{"t":"利己可得性：夫妻各自报告在家务中的贡献比例，20对夫妇中16对的比例之和超过100%——回想自己做过的事更容易，对自己行为的记忆越深、高估程度越高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利己可得性</strong>：夫妻各自报告在家务中的贡献比例，20对夫妇中16对的比例之和超过100%——回想自己做过的事更容易，对自己行为的记忆越深、高估程度越高。","label":"利己可得性"},{"t":"近因偏差（recency bias）：最近发生的事情更容易回想、影响最大（与时序情形下的近因效应一致）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">近因偏差</strong>（recency bias）：最近发生的事情更容易回想、影响最大（与时序情形下的近因效应一致）。","label":"近因偏差"},{"t":"显著性偏差（salience bias）：鲜明、易想象的事件被高估——空难的头版报道使人（至少暂时）高估类似事件概率，甚至回避航空旅行；社会显著性——6人小组中唯一的女性（或黑人）其行为更易被记住，且判断更极端。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">显著性偏差</strong>（salience bias）：鲜明、易想象的事件被高估——空难的头版报道使人（至少暂时）高估类似事件概率，甚至回避航空旅行；社会显著性——6人小组中唯一的女性（或黑人）其行为更易被记住，且判断更极端。","label":"显著性偏差"},{"t":"普劳斯之问：多数人认为死于鲨鱼袭击比死于飞机部件坠落更可能，实际后者是前者的30倍——鲨鱼袭击更受关注且更易想象（《大白鲨》的功劳），可得性误导了频率判断（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">普劳斯之问</strong>：多数人认为死于鲨鱼袭击比死于飞机部件坠落更可能，实际后者是前者的30倍——鲨鱼袭击更受关注且更易想象（《大白鲨》的功劳），可得性误导了频率判断（蒙蒂尔）。","label":"普劳斯之问"},{"t":"媒体报道与选股：伽达罗斯基发现媒体报道频率很高的股票在随后两年表现不佳——报纸封面消息左右选股，\"发光的未必都是金子\"（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">媒体报道与选股</strong>：伽达罗斯基发现媒体报道频率很高的股票在随后两年表现不佳——报纸封面消息左右选股，&quot;发光的未必都是金子&quot;（蒙蒂尔）。","label":"媒体报道与选股"}],"k":"b","i":1,"h":"5.3.5 可得性启发式、近因效应与显著性效应","label":"5.3.5 可得性启发式、近因效应与…"}],"k":"sec","i":0,"h":"5.3 代表性启发式及相关偏差","label":"5.3 代表性启发式及相关偏差"},{"t":"5.4 锚定","c":[{"t":"总起：锚定（anchoring）——人们从一个初始值开始进行估计并不断调整，而调整常常不充分；初始值可来自问题设计、无关数字或自发产生。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总起</strong>：锚定（anchoring）——人们从一个初始值开始进行估计并不断调整，而调整常常不充分；初始值可来自问题设计、无关数字或自发产生。","label":"总起：锚定（anchoring）——…"},{"t":"数字序列实验：估计1×2×3×…×8，答案中位数512（正确答案40320）；倒序8×7×6×…×1中位数2250——以前几个数的乘积为锚、不考虑序列长度，调整不充分。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">数字序列实验</strong>：估计1×2×3×…×8，答案中位数512（正确答案40320）；倒序8×7×6×…×1中位数2250——以前几个数的乘积为锚、不考虑序列长度，调整不充分。","label":"数字序列实验"},{"t":"转盘实验：先旋转标有1至100的转盘，问\"联合国成员国中非洲国家的百分比是否高于或低于该数\"，再请被试给出估计——转盘显示10的被试答案中位数25，显示65的中位数45；与问题毫无关系的数字显著影响判断。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">转盘实验</strong>：先旋转标有1至100的转盘，问&quot;联合国成员国中非洲国家的百分比是否高于或低于该数&quot;，再请被试给出估计——转盘显示10的被试答案中位数25，显示65的中位数45；与问题毫无关系的数字显著影响判断。","label":"转盘实验"},{"t":"自发锚定：鲸鱼标准体长69英尺、\"第二个登陆西印度群岛的欧洲探险家是哪一年\"（多数人知道哥伦布1492年，以此为起点向后调整）；64%至89%的被试承认使用了相关锚，但面对不相关锚只有12%至14%承认——不相关锚的力量远超自觉。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">自发锚定</strong>：鲸鱼标准体长69英尺、&quot;第二个登陆西印度群岛的欧洲探险家是哪一年&quot;（多数人知道哥伦布1492年，以此为起点向后调整）；64%至89%的被试承认使用了相关锚，但面对不相关锚只有12%至14%承认——不相关锚的力量远超自觉。","label":"自发锚定"},{"t":"5.4.1 怎样解释锚定","c":[{"t":"解释一（适合相关锚）：对真实值存在不确定性，人们调整答案直到进入\"看似可信的范围\"——不确定性越严重，可信范围越大，调整越不充分。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解释一</strong>（适合相关锚）：对真实值存在不确定性，人们调整答案直到进入&quot;看似可信的范围&quot;——不确定性越严重，可信范围越大，调整越不充分。","label":"解释一（适合相关锚）：对真实值存在不…"},{"t":"解释二（认知惰性）：关注锚值容易，偏离锚值的调整需要付出认知努力，因此人们通常过早停止调整。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解释二</strong>（认知惰性）：关注锚值容易，偏离锚值的调整需要付出认知努力，因此人们通常过早停止调整。","label":"解释二（认知惰性）：关注锚值容易，偏…"},{"t":"不相关锚的解释：问题设计中固有的锚作为有意识或潜意识的暗示，激活了\"符合锚\"的存储信息——记忆被\"事先准备好\"，或外部记忆搜寻有偏。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不相关锚的解释</strong>：问题设计中固有的锚作为有意识或潜意识的暗示，激活了&quot;符合锚&quot;的存储信息——记忆被&quot;事先准备好&quot;，或外部记忆搜寻有偏。","label":"不相关锚的解释"}],"k":"b","i":1,"h":"5.4.1 怎样解释锚定","label":"5.4.1 怎样解释锚定"},{"t":"5.4.2 锚定与代表性偏差","c":[{"t":"表面矛盾：忽视基率者对样本信息（尤其最新信息）反应过度，而锚定使人未充分关注样本数据。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表面矛盾</strong>：忽视基率者对样本信息（尤其最新信息）反应过度，而锚定使人未充分关注样本数据。","label":"表面矛盾"},{"t":"粗糙校准（rough calibration）：人们看待事情非黑即白、没有灰色地带；野餐例子——听到\"天气晴朗\"就认为下雨概率为零，无视乌云不断积累（锚定于预报、保守调整），最后突然跳到\"肯定下雨\"——从不充分调整到骤然反转。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">粗糙校准</strong>（rough calibration）：人们看待事情非黑即白、没有灰色地带；野餐例子——听到&quot;天气晴朗&quot;就认为下雨概率为零，无视乌云不断积累（锚定于预报、保守调整），最后突然跳到&quot;肯定下雨&quot;——从不充分调整到骤然反转。","label":"粗糙校准"}],"k":"b","i":1,"h":"5.4.2 锚定与代表性偏差","label":"5.4.2 锚定与代表性偏差"},{"t":"保守偏差（conservative bias）：人们坚持既定观点和假设，立场一旦形成很难摆脱，即使观点开始变化也非常缓慢，导致对事件的反应不足（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">保守偏差</strong>（conservative bias）：人们坚持既定观点和假设，立场一旦形成很难摆脱，即使观点开始变化也非常缓慢，导致对事件的反应不足（蒙蒂尔）。","label":"保守偏差"},{"t":"锚定与估值：在缺乏坚实可靠信息时，历史价格成为今天价格的\"锚\"；斯塔特曼和费希尔指出，若把股息计入，道琼斯工业平均指数1998年末应达652230.87（1896年创设时40.94），而基金经理猜测的最高值只有两三倍——历史点位是极强的锚（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">锚定与估值</strong>：在缺乏坚实可靠信息时，历史价格成为今天价格的&quot;锚&quot;；斯塔特曼和费希尔指出，若把股息计入，道琼斯工业平均指数1998年末应达652230.87（1896年创设时40.94），而基金经理猜测的最高值只有两三倍——历史点位是极强的锚（蒙蒂尔）。","label":"锚定与估值"},{"t":"锚定与房产估值：诺斯克拉夫特和尼尔让被试查看同一套待售房产、材料中仅挂牌价不同（119900美元对149900美元），被试给出的预期估价、挂牌建议、愿意支付价与最低接受卖价全部随挂牌价移动——初始报价对估值的影响达11%至14%（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">锚定与房产估值</strong>：诺斯克拉夫特和尼尔让被试查看同一套待售房产、材料中仅挂牌价不同（119900美元对149900美元），被试给出的预期估价、挂牌建议、愿意支付价与最低接受卖价全部随挂牌价移动——初始报价对估值的影响达11%至14%（蒙蒂尔）。","label":"锚定与房产估值"},{"t":"锚定与分析师估值：相对估值锚定行业平均指标（用市盈率判断\"便宜\"而不问行业绝对水平）；一些分析师做现金流贴现（DCF）估值时希望得出接近市价的数字（±5%锚定），基金经理因此高度怀疑DCF结果；改进方法是把DCF倒过来做\"反向工程DCF\"——从市场价格反推隐含增长，再与自下而上的预测比较（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">锚定与分析师估值</strong>：相对估值锚定行业平均指标（用市盈率判断&quot;便宜&quot;而不问行业绝对水平）；一些分析师做现金流贴现（DCF）估值时希望得出接近市价的数字（±5%锚定），基金经理因此高度怀疑DCF结果；改进方法是把DCF倒过来做&quot;反向工程DCF&quot;——从市场价格反推隐含增长，再与自下而上的预测比较（蒙蒂尔）。","label":"锚定与分析师估值"},{"t":"锚定与盈余公告漂移：股市对基本面信息反应不足——盈余公告发布后60天，盈余超预期最高股票的回报比市场高2%，而公告前60天其回报已超过市场4%至5%（伯纳德）——锚定使市场对盈余信息的调整缓慢（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">锚定与盈余公告漂移</strong>：股市对基本面信息反应不足——盈余公告发布后60天，盈余超预期最高股票的回报比市场高2%，而公告前60天其回报已超过市场4%至5%（伯纳德）——锚定使市场对盈余信息的调整缓慢（蒙蒂尔）。","label":"锚定与盈余公告漂移"},{"t":"锚定与远期贴水之谜：无抛补利率平价（UIP）要求回归系数b=1，但75项已发表研究的平均系数为-0.9（Froot）——利差扩大反而伴随本币升值；格伦和吉齐茨基用混合模型解释：一部分投资者锚定历史数据、对利率差变化反应迟缓（锚定交易者），其余是理性、风险规避且可能流动性受限的交易者，锚定交易者的存在使利率差变化不能立即反映到汇率中（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">锚定与远期贴水之谜</strong>：无抛补利率平价（UIP）要求回归系数b=1，但75项已发表研究的平均系数为-0.9（Froot）——利差扩大反而伴随本币升值；格伦和吉齐茨基用混合模型解释：一部分投资者锚定历史数据、对利率差变化反应迟缓（锚定交易者），其余是理性、风险规避且可能流动性受限的交易者，锚定交易者的存在使利率差变化不能立即反映到汇率中（蒙蒂尔）。","label":"锚定与远期贴水之谜"}],"k":"sec","i":0,"h":"5.4 锚定","label":"5.4 锚定"},{"t":"5.5 非理性和适应性","c":[{"t":"总起：\"启发式和偏差\"纲领的主要目的是阐明启发式会使人误入歧途；吉格伦泽等认为有缺陷的不是启发式本身，而是关于启发式的特定观点。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总起</strong>：&quot;启发式和偏差&quot;纲领的主要目的是阐明启发式会使人误入歧途；吉格伦泽等认为有缺陷的不是启发式本身，而是关于启发式的特定观点。","label":"总起：\"启发式和偏差\"纲领的主要目的…"},{"t":"5.5.1 快速节俭启发式","c":[{"t":"快速节俭启发式（fast and frugal heuristics）：启发式的目的在于用最少的时间、知识和计算量在现实世界中做出合适的选择。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">快速节俭启发式</strong>（fast and frugal heuristics）：启发式的目的在于用最少的时间、知识和计算量在现实世界中做出合适的选择。","label":"快速节俭启发式"},{"t":"与有限理性（bounded rationality，赫伯特·西蒙）一致：人们没有能力解决传统模型设定的复杂最优化问题，转而\"追求要求最低的满意结果\"（satisficing）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与有限理性</strong>（bounded rationality，赫伯特·西蒙）一致：人们没有能力解决传统模型设定的复杂最优化问题，转而&quot;追求要求最低的满意结果&quot;（satisficing）。","label":"与有限理性"},{"t":"生态理性：启发式要与环境相匹配，决策者凭借\"适应性工具箱\"力图在恰当的时机使用合适的工具。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">生态理性</strong>：启发式要与环境相匹配，决策者凭借&quot;适应性工具箱&quot;力图在恰当的时机使用合适的工具。","label":"生态理性"},{"t":"对完全信息模型的批判：完全信息模型把所有数据（含噪声）都当作信息，经常\"过度拟合\"；快速节俭启发式经演化剔除了无效信息——若考虑环境约束后决策合理，错误估计概率的问题未必严重。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对完全信息模型的批判</strong>：完全信息模型把所有数据（含噪声）都当作信息，经常&quot;过度拟合&quot;；快速节俭启发式经演化剔除了无效信息——若考虑环境约束后决策合理，错误估计概率的问题未必严重。","label":"对完全信息模型的批判"}],"k":"b","i":1,"h":"5.5.1 快速节俭启发式","label":"5.5.1 快速节俭启发式"},{"t":"5.5.2 对批评的回应","c":[{"t":"吉洛维奇与格里芬的回应：启发式并非一定非理性，它们常常依赖复杂的潜在处理过程，是对概率问题的正常直觉反应；将启发式与\"惰性和懒散\"挂钩是误解。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">吉洛维奇与格里芬的回应</strong>：启发式并非一定非理性，它们常常依赖复杂的潜在处理过程，是对概率问题的正常直觉反应；将启发式与&quot;惰性和懒散&quot;挂钩是误解。","label":"吉洛维奇与格里芬的回应"},{"t":"承认：启发式和偏差研究能准确找到启发式引起系统性偏差的例子，这通常发生在启发式被应用于合理领域之外时；相关研究（如第18章\"消除偏差\"）具有规范意义。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">承认</strong>：启发式和偏差研究能准确找到启发式引起系统性偏差的例子，这通常发生在启发式被应用于合理领域之外时；相关研究（如第18章&quot;消除偏差&quot;）具有规范意义。","label":"承认：启发式和偏差研究能准确找到启发…"},{"t":"反对\"启发式经过长期进化提炼就必然最优\"的观点。","c":[],"k":"b","i":2,"h":"反对&quot;启发式经过长期进化提炼就必然最优&quot;的观点。","label":"反对\"启发式经过长期进化提炼就必然最…"}],"k":"b","i":1,"h":"5.5.2 对批评的回应","label":"5.5.2 对批评的回应"}],"k":"sec","i":0,"h":"5.5 非理性和适应性","label":"5.5 非理性和适应性"},{"t":"5.6 展望","c":[{"t":"5.6.1 启发式及其偏差与金融决策","c":[{"t":"熟悉度→对本地和国内证券的过度投资；高估可预测性→\"好公司就是好投资\"的荒谬观点；锚定→观点（无论对错）一旦形成便长期坚持；轻视均值回归→推断未来盈利增长时过度依赖历史表现。","c":[],"k":"b","i":2,"h":"熟悉度→对本地和国内证券的过度投资；高估可预测性→&quot;好公司就是好投资&quot;的荒谬观点；锚定→观点（无论对错）一旦形成便长期坚持；轻视均值回归→推断未来盈利增长时过度依赖历史表现。","label":"熟悉度→对本地和国内证券的过度投资；…"},{"t":"可得性→投资者关注新闻媒体报道的证券；近因效应→购买热点股票和基金（几乎没有证据表明这种决策正确）；偏爱易于处理的事物→公司经理人倾向选择次优的资本预算标准。","c":[],"k":"b","i":2,"h":"可得性→投资者关注新闻媒体报道的证券；近因效应→购买热点股票和基金（几乎没有证据表明这种决策正确）；偏爱易于处理的事物→公司经理人倾向选择次优的资本预算标准。","label":"可得性→投资者关注新闻媒体报道的证券…"},{"t":"多元启发式→养老金计划中得到糟糕的资产配置；安于现状偏差→投资者愿意坚持现有的不合适配置；信息过载→可以解释养老金参与率很低。","c":[],"k":"b","i":2,"h":"多元启发式→养老金计划中得到糟糕的资产配置；安于现状偏差→投资者愿意坚持现有的不合适配置；信息过载→可以解释养老金参与率很低。","label":"多元启发式→养老金计划中得到糟糕的资…"}],"k":"b","i":1,"h":"5.6.1 启发式及其偏差与金融决策","label":"5.6.1 启发式及其偏差与金融决策"},{"t":"5.6.2 启发式导致的偏差能否相互抵消","c":[{"t":"如果许多投资者同时使用相同的启发式，个体偏差会形成系统性偏差并造成定价错误（第13章详论市场结果）。","c":[],"k":"b","i":2,"h":"如果许多投资者同时使用相同的启发式，个体偏差会形成系统性偏差并造成定价错误（第13章详论市场结果）。","label":"如果许多投资者同时使用相同的启发式，…"},{"t":"动量效应与反转效应的行为解释：巴伯里斯、施莱弗和维什尼的著名模型用基率忽视和锚定来解释这两种市场异象。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">动量效应与反转效应的行为解释</strong>：巴伯里斯、施莱弗和维什尼的著名模型用基率忽视和锚定来解释这两种市场异象。","label":"动量效应与反转效应的行为解释"},{"t":"股权溢价之谜（股票历史收益高出债券的部分无法用合理的风险溢价完全解释）的一种可能解释是模糊厌恶——股票投资除标准风险外还承担真实收益分布的不确定性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">股权溢价之谜</strong>（股票历史收益高出债券的部分无法用合理的风险溢价完全解释）的一种可能解释是模糊厌恶——股票投资除标准风险外还承担真实收益分布的不确定性。","label":"股权溢价之谜"},{"t":"蒙蒂尔给出另一种解释：基于展望理论——投资者关心的是损失的可能性而非方差，短视的损失厌恶（约2.25倍）使一年持有期上股票与债券的预期价值相当，从而解释约7%的股权风险溢价，耐心者则收获溢价（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">蒙蒂尔给出另一种解释</strong>：基于展望理论——投资者关心的是损失的可能性而非方差，短视的损失厌恶（约2.25倍）使一年持有期上股票与债券的预期价值相当，从而解释约7%的股权风险溢价，耐心者则收获溢价（蒙蒂尔）。","label":"蒙蒂尔给出另一种解释"},{"t":"蒙蒂尔：阿米尔和甘扎赫检验收益与分析师预测修正——乐观情绪使预测整体过于乐观、且在预期修正为负面时反应不足；代表性启发产生过于极端的预测，锚定导致过于温和的预测，谁主导取决于锚定点的突出程度（自己先前的预测比公开收益数据更突出，其中含沉没成本）；认知偏差在某些情况下相互抵消，也可能使情况恶化——行为金融学必须回答何时反应不足、何时反应过度（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">蒙蒂尔</strong>：阿米尔和甘扎赫检验收益与分析师预测修正——乐观情绪使预测整体过于乐观、且在预期修正为负面时反应不足；代表性启发产生过于极端的预测，锚定导致过于温和的预测，谁主导取决于锚定点的突出程度（自己先前的预测比公开收益数据更突出，其中含沉没成本）；认知偏差在某些情况下相互抵消，也可能使情况恶化——行为金融学必须回答何时反应不足、何时反应过度（蒙蒂尔）。","label":"蒙蒂尔：阿米尔和甘扎赫检验收益与分析…"}],"k":"b","i":1,"h":"5.6.2 启发式导致的偏差能否相互抵消","label":"5.6.2 启发式导致的偏差能否相互抵消"}],"k":"sec","i":0,"h":"5.6 展望","label":"5.6 展望"}],"k":"chap","h":"第5章 启发式预测和偏差","label":"第5章 启发式预测和偏差"},{"t":"第6章 过度自信","c":[{"t":"本章要点","c":[{"t":"过度自信（overconfidence）：人们倾向于高估自己的知识水平、能力和信息的精确度，或者对未来及控制未来的能力过于乐观的倾向；心理学证据表明大多数人多数时候都是过度自信的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度自信</strong>（overconfidence）：人们倾向于高估自己的知识水平、能力和信息的精确度，或者对未来及控制未来的能力过于乐观的倾向；心理学证据表明大多数人多数时候都是过度自信的。","label":"过度自信"},{"t":"错误校准（miscalibration）是过度自信的核心测度：人们给出的x%置信区间中包含正确答案的频率明显低于x%——区间太窄。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">错误校准</strong>（miscalibration）是过度自信的核心测度：人们给出的x%置信区间中包含正确答案的频率明显低于x%——区间太窄。","label":"错误校准"},{"t":"过度自信并不普遍：在简单问题上可能出现信心不足，即难易效应（hard-easy effect）；判断依据说服力低而来源可信度高时也会信心不足。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度自信并不普遍</strong>：在简单问题上可能出现信心不足，即难易效应（hard-easy effect）；判断依据说服力低而来源可信度高时也会信心不足。","label":"过度自信并不普遍"},{"t":"过度自信还有三种表现形式：自我感觉良好效应（高于平均）、控制幻觉（以为能控制随机事件）、过度乐观（高估有利结果、低估不利结果，典型如规划谬误）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度自信还有三种表现形式</strong>：自我感觉良好效应（高于平均）、控制幻觉（以为能控制随机事件）、过度乐观（高估有利结果、低估不利结果，典型如规划谬误）。","label":"过度自信还有三种表现形式"},{"t":"过度自信程度因人而异：专业人员（市场预测、投资银行、经理人、律师、医学专家）同样过度自信；受过良好教育的男性最普遍，\"男子气概\"任务上性别差异更大。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度自信程度因人而异</strong>：专业人员（市场预测、投资银行、经理人、律师、医学专家）同样过度自信；受过良好教育的男性最普遍，&quot;男子气概&quot;任务上性别差异更大。","label":"过度自信程度因人而异"},{"t":"过度自信的测度并不稳定：同一人在一种实验中过度自信、另一种实验中可能信心不足；吉格伦泽证明重新设计问题（用频率判断替代逐题置信度）可以\"消除\"过度自信。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度自信的测度并不稳定</strong>：同一人在一种实验中过度自信、另一种实验中可能信心不足；吉格伦泽证明重新设计问题（用频率判断替代逐题置信度）可以&quot;消除&quot;过度自信。","label":"过度自信的测度并不稳定"},{"t":"三种偏差阻碍人们从错误中学习并维持过度自信：自我归因偏差、事后聪明偏差、证实偏差。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">三种偏差阻碍人们从错误中学习并维持过度自信</strong>：自我归因偏差、事后聪明偏差、证实偏差。","label":"三种偏差阻碍人们从错误中学习并维持过度自信"},{"t":"过度自信也许可以缓和：目标遥远、拥有行动方案时的适度乐观甚至可能改善表现；落空的失望可由改变标准、质疑预期、寻找合理借口等防御机制化解。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度自信也许可以缓和</strong>：目标遥远、拥有行动方案时的适度乐观甚至可能改善表现；落空的失望可由改变标准、质疑预期、寻找合理借口等防御机制化解。","label":"过度自信也许可以缓和"},{"t":"金融应用：投资者预期自己的组合跑赢市场（过度乐观）、过度交易、持股过于集中、承担过多风险；牛市盈利归功自己、下跌归咎环境是自我归因偏差的典型表现。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">金融应用</strong>：投资者预期自己的组合跑赢市场（过度乐观）、过度交易、持股过于集中、承担过多风险；牛市盈利归功自己、下跌归咎环境是自我归因偏差的典型表现。","label":"金融应用"},{"t":"12只股票涨跌预测实验中，被试仅47%预测正确，却平均自信65%——错误校准在股票预测领域的直接证据；而天气预报员与职业出版商因能获得常规反馈而校准更好，股市预测者与分析师却未因此变得谦逊（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"12只股票涨跌预测实验中，被试仅47%预测正确，却平均自信65%——错误校准在股票预测领域的直接证据；而天气预报员与职业出版商因能获得常规反馈而校准更好，股市预测者与分析师却未因此变得谦逊（蒙蒂尔）。","label":"12只股票涨跌预测实验中，被试仅47…"},{"t":"交易数据检验：男性交易周转率比女性高45%，单身男性比单身女性高67%；周转率越高净收益越低，过度自信转化为过度交易与业绩损失（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">交易数据检验</strong>：男性交易周转率比女性高45%，单身男性比单身女性高67%；周转率越高净收益越低，过度自信转化为过度交易与业绩损失（蒙蒂尔）。","label":"交易数据检验"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"6.1 错误校准","c":[{"t":"6.1.1 什么是错误校准","c":[{"t":"错误校准（miscalibration）：人们高估自己知识准确度的倾向；过度自信的典型测度（过度自信一词有时狭义地专指错误校准）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">错误校准</strong>（miscalibration）：人们高估自己知识准确度的倾向；过度自信的典型测度（过度自信一词有时狭义地专指错误校准）。","label":"错误校准"},{"t":"置信区间法：控制实验中为已知数量（如珠穆朗玛峰的高度、某个月的道琼斯指数）设定90%置信区间，实验发现区间普遍太窄。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">置信区间法</strong>：控制实验中为已知数量（如珠穆朗玛峰的高度、某个月的道琼斯指数）设定90%置信区间，实验发现区间普遍太窄。","label":"置信区间法"},{"t":"校准标准：回答大量x%置信区间问题时，含正确答案的区间应占x%（个体层面）；或对同一问题应有x%的人给出含真值的区间（群体层面）——实际比例明显偏低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">校准标准</strong>：回答大量x%置信区间问题时，含正确答案的区间应占x%（个体层面）；或对同一问题应有x%的人给出含真值的区间（群体层面）——实际比例明显偏低。","label":"校准标准"},{"t":"备选答案法：回答问题后自估所选答案的正确率——自报平均正确率70%而实际仅答对55%即为过度自信；人们认为\"肯定发生\"的事实际仅80%发生，认为\"不可能\"的事发生概率约20%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">备选答案法</strong>：回答问题后自估所选答案的正确率——自报平均正确率70%而实际仅答对55%即为过度自信；人们认为&quot;肯定发生&quot;的事实际仅80%发生，认为&quot;不可能&quot;的事发生概率约20%。","label":"备选答案法"},{"t":"股票预测实验：要求被试根据市场报告预测12只股票的未来涨跌，仅47%的预测正确，被试平均认为自己的准确率为65%（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">股票预测实验</strong>：要求被试根据市场报告预测12只股票的未来涨跌，仅47%的预测正确，被试平均认为自己的准确率为65%（蒙蒂尔）。","label":"股票预测实验"}],"k":"b","i":1,"h":"6.1.1 什么是错误校准","label":"6.1.1 什么是错误校准"},{"t":"6.1.2 校准实验的例子","c":[{"t":"阿尔伯特与雷法研究：调查1968-69学年在哈佛大学攻读MBA的800名学生——先答3个\"非此即彼\"的观点/偏好题，再对10个答案未知的问题给出0.01、0.25、0.50、0.75、0.99五个分位数（问题从同伴见解到生僻事实：医生电话数目、美国鸡蛋产量、巴拿马运河收入等）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">阿尔伯特与雷法研究</strong>：调查1968-69学年在哈佛大学攻读MBA的800名学生——先答3个&quot;非此即彼&quot;的观点/偏好题，再对10个答案未知的问题给出0.01、0.25、0.50、0.75、0.99五个分位数（问题从同伴见解到生僻事实：医生电话数目、美国鸡蛋产量、巴拿马运河收入等）。","label":"阿尔伯特与雷法研究"},{"t":"区间划分：PR1（低于0.01）至PR6（高于0.99）共六个百分位数区间；0.75与0.25之差是50%置信区间（四分位差），0.99与0.01之差是98%置信区间。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">区间划分</strong>：PR1（低于0.01）至PR6（高于0.99）共六个百分位数区间；0.75与0.25之差是50%置信区间（四分位差），0.99与0.01之差是98%置信区间。","label":"区间划分"},{"t":"结果：四分位差（PR3+PR4）应包含正确答案500次，实际仅334次——中等水平的过度自信；两端区间（PR1+PR6）应仅2%，第6题（波士顿电话簿医生数）高达51%（24%+27%），所有问题都远超2%——错误校准的有力证据。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：四分位差（PR3+PR4）应包含正确答案500次，实际仅334次——中等水平的过度自信；两端区间（PR1+PR6）应仅2%，第6题（波士顿电话簿医生数）高达51%（24%+27%），所有问题都远超2%——错误校准的有力证据。","label":"结果：四分位差（PR3+PR4）应包…"},{"t":"难易效应（hard-easy effect）：前3道\"简单\"题（与个人经验和见解相关、可深思熟虑）出现轻微信心不足，后7道\"难\"题过度自信——过度自信并不普遍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">难易效应</strong>（hard-easy effect）：前3道&quot;简单&quot;题（与个人经验和见解相关、可深思熟虑）出现轻微信心不足，后7道&quot;难&quot;题过度自信——过度自信并不普遍。","label":"难易效应"},{"t":"信心不足的另一情形：判断依据的说服力很低但来源可信性很高时——如内容中性而来源可靠的推荐信导致信心不足，来源可疑却评价十分正面的推荐信则更可能导致过度自信。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信心不足的另一情形</strong>：判断依据的说服力很低但来源可信性很高时——如内容中性而来源可靠的推荐信导致信心不足，来源可疑却评价十分正面的推荐信则更可能导致过度自信。","label":"信心不足的另一情形"}],"k":"b","i":1,"h":"6.1.2 校准实验的例子","label":"6.1.2 校准实验的例子"}],"k":"sec","i":0,"h":"6.1 错误校准","label":"6.1 错误校准"},{"t":"6.2 过度自信的其他表现形式","c":[{"t":"总起：除错误校准外，还包括自我感觉良好效应、控制幻觉、过度乐观；不同表现形式未必测度同一心理结构（同一人可能既是过度自信又是信心不足）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总起</strong>：除错误校准外，还包括自我感觉良好效应、控制幻觉、过度乐观；不同表现形式未必测度同一心理结构（同一人可能既是过度自信又是信心不足）。","label":"总起：除错误校准外，还包括自我感觉良…"},{"t":"6.2.1 自我感觉良好效应","c":[{"t":"自我感觉良好效应（better-than-average effect）：多数人把自己的正面个人特质（运动技能、驾驶水平等）与平均水平比较时，认为优于平均——而任一群体实际只有约50%更优秀。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自我感觉良好效应</strong>（better-than-average effect）：多数人把自己的正面个人特质（运动技能、驾驶水平等）与平均水平比较时，认为优于平均——而任一群体实际只有约50%更优秀。","label":"自我感觉良好效应"},{"t":"一项调查中82%的学生认为自己的驾驶技术位居全组前30%。","c":[],"k":"b","i":2,"h":"一项调查中82%的学生认为自己的驾驶技术位居全组前30%。","label":"一项调查中82%的学生认为自己的驾驶…"},{"t":"助长因素：\"优秀\"的确切定义不清晰，人们脑海中的定义使自己看起来最优秀（方向盘操作最熟练、最擅长预判危险、高速穿梭技术最好）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">助长因素</strong>：&quot;优秀&quot;的确切定义不清晰，人们脑海中的定义使自己看起来最优秀（方向盘操作最熟练、最擅长预判危险、高速穿梭技术最好）。","label":"助长因素"},{"t":"双重机制：动机机制——高于平均增强自尊；认知机制——最容易想到的绩效标准通常是自己最擅长的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">双重机制</strong>：动机机制——高于平均增强自尊；认知机制——最容易想到的绩效标准通常是自己最擅长的。","label":"双重机制"},{"t":"约80%的人自认为是好司机；就像\"忘忧湖的小孩\"一样，人们总认为自己高于平均水平（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"约80%的人自认为是好司机；就像&quot;忘忧湖的小孩&quot;一样，人们总认为自己高于平均水平（蒙蒂尔）。","label":"约80%的人自认为是好司机；就像\"忘…"}],"k":"b","i":1,"h":"6.2.1 自我感觉良好效应","label":"6.2.1 自我感觉良好效应"},{"t":"6.2.2 控制幻觉","c":[{"t":"控制幻觉（illusion of control）：当人们认为自己对事件有超乎寻常的控制能力时出现，尤其针对随机事件。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">控制幻觉</strong>（illusion of control）：当人们认为自己对事件有超乎寻常的控制能力时出现，尤其针对随机事件。","label":"控制幻觉"},{"t":"例：人们认为掷骰子者似乎可以控制投掷结果；感染风险被认为与即将接触者的身份地位相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例</strong>：人们认为掷骰子者似乎可以控制投掷结果；感染风险被认为与即将接触者的身份地位相关。","label":"例：人们认为掷骰子者似乎可以控制投掷…"},{"t":"兰格纸牌赌局实验：纯运气的比大小游戏（每局最高赌注25美分），对手由实验助手扮演\"思维敏捷\"或\"迟钝\"；面对\"迟钝\"对手时被试选择的赌注明显更高（16.25美分对11.04美分）——优越感导致被试认为自己可以影响随机事件。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">兰格纸牌赌局实验</strong>：纯运气的比大小游戏（每局最高赌注25美分），对手由实验助手扮演&quot;思维敏捷&quot;或&quot;迟钝&quot;；面对&quot;迟钝&quot;对手时被试选择的赌注明显更高（16.25美分对11.04美分）——优越感导致被试认为自己可以影响随机事件。","label":"兰格纸牌赌局实验"}],"k":"b","i":1,"h":"6.2.2 控制幻觉","label":"6.2.2 控制幻觉"},{"t":"6.2.3 过度乐观","c":[{"t":"过度乐观（excessive optimism）：人们过于高估有利结果的概率、低估不利结果的概率（如中彩票与患癌症）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">过度乐观</strong>（excessive optimism）：人们过于高估有利结果的概率、低估不利结果的概率（如中彩票与患癌症）。","label":"过度乐观"},{"t":"证据：学生期望获得的分数比实际更高、高估将获得的工作机会；尽管离婚率很高，新婚夫妇几乎普遍认为婚姻会天长地久。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证据</strong>：学生期望获得的分数比实际更高、高估将获得的工作机会；尽管离婚率很高，新婚夫妇几乎普遍认为婚姻会天长地久。","label":"证据：学生期望获得的分数比实际更高、…"},{"t":"规划谬误（planning fallacy）：认为可以完成的任务比实际完成的多、预算涵盖了所有费用；悉尼歌剧院计划花费700万美元于1963年完工，实际推迟10年、总成本达1.2亿美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规划谬误</strong>（planning fallacy）：认为可以完成的任务比实际完成的多、预算涵盖了所有费用；悉尼歌剧院计划花费700万美元于1963年完工，实际推迟10年、总成本达1.2亿美元。","label":"规划谬误"},{"t":"代价：目标落空导致失望、自卑及社会认可度降低；追求不切实际的目标浪费时间与金钱，还可能使未来不愿为力所能及的目标奋斗。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">代价</strong>：目标落空导致失望、自卑及社会认可度降低；追求不切实际的目标浪费时间与金钱，还可能使未来不愿为力所能及的目标奋斗。","label":"代价：目标落空导致失望、自卑及社会认…"},{"t":"过度自信与过度乐观共同作用，使投资者高估自己的知识、对风险的理解和对局面的掌控能力——\"不要把头脑和牛市搞混了\"（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"过度自信与过度乐观共同作用，使投资者高估自己的知识、对风险的理解和对局面的掌控能力——&quot;不要把头脑和牛市搞混了&quot;（蒙蒂尔）。","label":"过度自信与过度乐观共同作用，使投资者…"}],"k":"b","i":1,"h":"6.2.3 过度乐观","label":"6.2.3 过度乐观"},{"t":"6.2.4 多种意义上的过度自信","c":[{"t":"保龄球例子：预测得225分（90%置信区间200-250），而历史平均175（区间125-225）——过度乐观（高估50分）与错误校准（区间仅为应有长度的一半）同时出现。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">保龄球例子</strong>：预测得225分（90%置信区间200-250），而历史平均175（区间125-225）——过度乐观（高估50分）与错误校准（区间仅为应有长度的一半）同时出现。","label":"保龄球例子"},{"t":"现实中难以区分不同形式：选超纲课程可能因为过度乐观，也可能因为不知道自己的真实能力（把过去的失败归咎于不可控因素），还可能是自我感觉良好效应（确实相信自己有能力出色）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现实中难以区分不同形式</strong>：选超纲课程可能因为过度乐观，也可能因为不知道自己的真实能力（把过去的失败归咎于不可控因素），还可能是自我感觉良好效应（确实相信自己有能力出色）。","label":"现实中难以区分不同形式"}],"k":"b","i":1,"h":"6.2.4 多种意义上的过度自信","label":"6.2.4 多种意义上的过度自信"},{"t":"6.2.5 人们过度自信的程度相同吗","c":[{"t":"专业人员同样过度自信：市场预测、投资银行、职业经理人、律师、医学专家等领域均得到验证——过度自信困扰专业人员也困扰非专业人员。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专业人员同样过度自信</strong>：市场预测、投资银行、职业经理人、律师、医学专家等领域均得到验证——过度自信困扰专业人员也困扰非专业人员。","label":"专业人员同样过度自信"},{"t":"性别差异：男性往往比女性更加过度自信，且在\"男子气概\"的任务上差别更明显。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">性别差异</strong>：男性往往比女性更加过度自信，且在&quot;男子气概&quot;的任务上差别更明显。","label":"性别差异"},{"t":"教育悖论：加拿大调查显示，受教育程度较高的人不仅在投资知识上更自信（正常），而且更过度自信——认知与实际情况之间的差距更明显；苏格拉底：\"我除了知道我的无知这个事实外一无所知\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">教育悖论</strong>：加拿大调查显示，受教育程度较高的人不仅在投资知识上更自信（正常），而且更过度自信——认知与实际情况之间的差距更明显；苏格拉底：&quot;我除了知道我的无知这个事实外一无所知&quot;。","label":"教育悖论"},{"t":"反馈的作用：天气预报员与职业出版商在做出判断后会收到常规性反馈，因而更擅长自我校准；面对类似反馈条件的股票市场预测者与分析师们却并未学会谦逊（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反馈的作用</strong>：天气预报员与职业出版商在做出判断后会收到常规性反馈，因而更擅长自我校准；面对类似反馈条件的股票市场预测者与分析师们却并未学会谦逊（蒙蒂尔）。","label":"反馈的作用"},{"t":"进化根源：过度自信与乐观能更容易在求偶中取得成功；且几乎每种语言中形容乐观的形容词约为悲观形容词的5到6倍——两类偏差可能正是人性的一部分（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">进化根源</strong>：过度自信与乐观能更容易在求偶中取得成功；且几乎每种语言中形容乐观的形容词约为悲观形容词的5到6倍——两类偏差可能正是人性的一部分（蒙蒂尔）。","label":"进化根源"}],"k":"b","i":1,"h":"6.2.5 人们过度自信的程度相同吗","label":"6.2.5 人们过度自信的程度相同吗"},{"t":"6.2.6 人们是否始终如一地过度自信","c":[{"t":"测度不一致：随实验变换，人们有时过度自信、有时信心不足；个体间过度自信程度的相关性有时很低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">测度不一致</strong>：随实验变换，人们有时过度自信、有时信心不足；个体间过度自信程度的相关性有时很低。","label":"测度不一致"},{"t":"吉格伦泽的质疑：通过校准实验证明的过度自信可能是一种幻觉——重新设计题目可以消除过度自信。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">吉格伦泽的质疑</strong>：通过校准实验证明的过度自信可能是一种幻觉——重新设计题目可以消除过度自信。","label":"吉格伦泽的质疑"},{"t":"表6-3证据：先答题后逐题自估置信水平（50%至100%）时，判断均值0.67与0.72对实际正确率0.52与0.56（过度自信15-16个百分点）；改为答完所有题后估计自己答对的题数（频率判断与频率比较），差异降为-0.01与-0.04——过度自信消失，实验设计影响结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表6-3证据</strong>：先答题后逐题自估置信水平（50%至100%）时，判断均值0.67与0.72对实际正确率0.52与0.56（过度自信15-16个百分点）；改为答完所有题后估计自己答对的题数（频率判断与频率比较），差异降为-0.01与-0.04——过度自信消失，实验设计影响结果。","label":"表6-3证据"}],"k":"b","i":1,"h":"6.2.6 人们是否始终如一地过度自信","label":"6.2.6 人们是否始终如一地过度自信"}],"k":"sec","i":0,"h":"6.2 过度自信的其他表现形式","label":"6.2 过度自信的其他表现形式"},{"t":"6.3 阻碍修正的因素","c":[{"t":"总起：为什么过度自信广泛存在、且人们不能从历史错误中吸取教训？三种行为偏差解释过度自信的持久性。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总起</strong>：为什么过度自信广泛存在、且人们不能从历史错误中吸取教训？三种行为偏差解释过度自信的持久性。","label":"总起：为什么过度自信广泛存在、且人们…"},{"t":"6.3.1 干扰学习的偏差","c":[{"t":"归因理论（attribution theory）：研究人们如何进行归因——如何解释行为或结果的成因；观察他人时倾向于归因于素质因素而非情境因素（某人行为恶劣→认为他是坏蛋，而非查找环境细节）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">归因理论</strong>（attribution theory）：研究人们如何进行归因——如何解释行为或结果的成因；观察他人时倾向于归因于素质因素而非情境因素（某人行为恶劣→认为他是坏蛋，而非查找环境细节）。","label":"归因理论"},{"t":"自我归因偏差（self-attribution bias）：把成功或好结果归因于自己的能力，把失败归咎于自己不能控制的外部环境；成功使过度自信程度更高、失败只带来很小的反向修正——人们\"学会\"做过度自信的人。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自我归因偏差</strong>（self-attribution bias）：把成功或好结果归因于自己的能力，把失败归咎于自己不能控制的外部环境；成功使过度自信程度更高、失败只带来很小的反向修正——人们&quot;学会&quot;做过度自信的人。","label":"自我归因偏差"},{"t":"事后聪明偏差（hindsight bias）：促使人们产生\"我早知如此\"的想法；当焦点事件有明确的可选结果（选举、世界杯决赛）、事件有感情色彩或道德寓意、或结果揭晓前经历想象过程时尤为盛行。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">事后聪明偏差</strong>（hindsight bias）：促使人们产生&quot;我早知如此&quot;的想法；当焦点事件有明确的可选结果（选举、世界杯决赛）、事件有感情色彩或道德寓意、或结果揭晓前经历想象过程时尤为盛行。","label":"事后聪明偏差"},{"t":"证实偏差（confirmation bias）：寻找与已有信念一致的证据、忽略相矛盾的事实；死刑支持者与反对者同时看到一份双重性质的证据后信念两极分化，双方都筛选出支持自己观点的论据。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证实偏差</strong>（confirmation bias）：寻找与已有信念一致的证据、忽略相矛盾的事实；死刑支持者与反对者同时看到一份双重性质的证据后信念两极分化，双方都筛选出支持自己观点的论据。","label":"证实偏差"},{"t":"从认知失调角度理解：证据与信念不符时的心理冲突促使人们放弃或改变原有认知以恢复调和——对违背假设的信息选择忽视、对支持假设的信息加倍重视，面临挑战既有观点的新数据时说\"这不过是特殊情况而已\"（蒙蒂尔）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">从认知失调角度理解</strong>：证据与信念不符时的心理冲突促使人们放弃或改变原有认知以恢复调和——对违背假设的信息选择忽视、对支持假设的信息加倍重视，面临挑战既有观点的新数据时说&quot;这不过是特殊情况而已&quot;（蒙蒂尔）。","label":"从认知失调角度理解"}],"k":"b","i":1,"h":"6.3.1 干扰学习的偏差","label":"6.3.1 干扰学习的偏差"},{"t":"6.3.2 过度自信是不是一种不可缓和的缺陷","c":[{"t":"可缓和的条件：处在实现目标的初级阶段（目标遥远）、以及拥有应对多种可选计划的行动方案时，人们对未来的预测更乐观；此时过度乐观可能提高实际表现。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">可缓和的条件</strong>：处在实现目标的初级阶段（目标遥远）、以及拥有应对多种可选计划的行动方案时，人们对未来的预测更乐观；此时过度乐观可能提高实际表现。","label":"可缓和的条件"},{"t":"防御机制：成绩未达预期时——\"不管怎样我比平均分高\"（改变标准）、\"考虑到难度我的预期很荒谬\"（预期出现问题）、\"睡眠不足头疼影响了发挥\"（合理的借口）；这些机制缓和失望、保护自尊，使人们下次仍保持乐观。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">防御机制</strong>：成绩未达预期时——&quot;不管怎样我比平均分高&quot;（改变标准）、&quot;考虑到难度我的预期很荒谬&quot;（预期出现问题）、&quot;睡眠不足头疼影响了发挥&quot;（合理的借口）；这些机制缓和失望、保护自尊，使人们下次仍保持乐观。","label":"防御机制"}],"k":"b","i":1,"h":"6.3.2 过度自信是不是一种不可缓和的缺陷","label":"6.3.2 过度自信是不是一种不可缓…"}],"k":"sec","i":0,"h":"6.3 阻碍修正的因素","label":"6.3 阻碍修正的因素"},{"t":"6.4 展望金融领域的应用","c":[{"t":"投资者过度乐观的证据：1998-2000年盖洛普为UBS PaineWebber做的15次调研（每次约1000位受访者）——受访者平均预期自己资产组合未来12个月的收益率优于整个市场；男性预期超出幅度高于女性，女性也过度乐观但程度较低（与性别效应一致）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">投资者过度乐观的证据</strong>：1998-2000年盖洛普为UBS PaineWebber做的15次调研（每次约1000位受访者）——受访者平均预期自己资产组合未来12个月的收益率优于整个市场；男性预期超出幅度高于女性，女性也过度乐观但程度较低（与性别效应一致）。","label":"投资者过度乐观的证据"},{"t":"第9章预告：过度自信导致投资者过度交易、持股过于集中、承担过多风险；错误校准（自认信息与分析比真实更精确）使投资者误信自己能进行波段操作或挑出下一只热门股票。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第9章预告</strong>：过度自信导致投资者过度交易、持股过于集中、承担过多风险；错误校准（自认信息与分析比真实更精确）使投资者误信自己能进行波段操作或挑出下一只热门股票。","label":"第9章预告"},{"t":"自我归因偏差在投资中的作用：市场上行时大部分股票表现强劲，投资者把组合上涨视为对自己聪明的肯定；股价下跌时则归咎于市场或经济等不可控的外部环境。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">自我归因偏差在投资中的作用</strong>：市场上行时大部分股票表现强劲，投资者把组合上涨视为对自己聪明的肯定；股价下跌时则归咎于市场或经济等不可控的外部环境。","label":"自我归因偏差在投资中的作用"},{"t":"市场层面：解释动量效应与反转效应等市场异象的模型中，过度自信及其相关偏差扮演重要角色（第13章）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">市场层面</strong>：解释动量效应与反转效应等市场异象的模型中，过度自信及其相关偏差扮演重要角色（第13章）。","label":"市场层面"},{"t":"企业层面：过度乐观及其他形式的过度自信使职业经理人和企业家轻易进入市场、认为投资对现金流敏感度高、过度投资、热衷兼并收购、承担过多债务（第16章）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">企业层面</strong>：过度乐观及其他形式的过度自信使职业经理人和企业家轻易进入市场、认为投资对现金流敏感度高、过度投资、热衷兼并收购、承担过多债务（第16章）。","label":"企业层面"},{"t":"过度自信不全是负面因素：\"很可能成功\"的信念促使创业者更加努力、动力十足，实际上提高了成功的可能性（考虑市场进入战略）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度自信不全是负面因素</strong>：&quot;很可能成功&quot;的信念促使创业者更加努力、动力十足，实际上提高了成功的可能性（考虑市场进入战略）。","label":"过度自信不全是负面因素"},{"t":"过度自信的个人投资者证据（奥戴恩对一家折扣经纪人10000个交易账户的研究）：个人投资者卖出一只股票并立刻买入新股的行为与过度自信的预测吻合——第一年卖出的股票回报高于买入的股票3.4%，剔除非投机性交易（流动性需求、节税、再平衡）后差距达5.07%；巴伯和奥戴恩《交易有损财富》显示周转率越高净利润越低；男性交易周转率比女性高45%（年化净回报分别降低2.5%与1.7%），单身男性比单身女性高67%、年化收益低3.5%——夫妻共有账户交易观念较温和，伴侣似乎抑制了男性的过度自信（蒙蒂尔）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过度自信的个人投资者证据</strong>（奥戴恩对一家折扣经纪人10000个交易账户的研究）：个人投资者卖出一只股票并立刻买入新股的行为与过度自信的预测吻合——第一年卖出的股票回报高于买入的股票3.4%，剔除非投机性交易（流动性需求、节税、再平衡）后差距达5.07%；巴伯和奥戴恩《交易有损财富》显示周转率越高净利润越低；男性交易周转率比女性高45%（年化净回报分别降低2.5%与1.7%），单身男性比单身女性高67%、年化收益低3.5%——夫妻共有账户交易观念较温和，伴侣似乎抑制了男性的过度自信（蒙蒂尔）。","label":"过度自信的个人投资者证据"}],"k":"sec","i":0,"h":"6.4 展望金融领域的应用","label":"6.4 展望金融领域的应用"}],"k":"chap","h":"第6章 过度自信","label":"第6章 过度自信"},{"t":"第7章 情绪基础","c":[{"t":"本章要点","c":[{"t":"情绪（emotion）是包含认知、生理与行为元素、指向特定对象的心理状态；琼·埃尔斯特的6个可观测特征（认知先行、意向对象、生理激发、生理表现、效价、行动倾向）将其与心情、情感等其他心理状态区分开。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪</strong>（emotion）是包含认知、生理与行为元素、指向特定对象的心理状态；琼·埃尔斯特的6个可观测特征（认知先行、意向对象、生理激发、生理表现、效价、行动倾向）将其与心情、情感等其他心理状态区分开。","label":"情绪（emotion）是包含认知、生…"},{"t":"情绪理论简史：从早期\"情绪是对情境的思考\"，经詹姆斯的\"身体反应引发情绪\"、坎农的\"大脑先于身体感知\"、沙克特与辛格的\"生理唤起+认知解释\"，到扎伊翁次的\"情绪可以独立于认知形成\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪理论简史</strong>：从早期&quot;情绪是对情境的思考&quot;，经詹姆斯的&quot;身体反应引发情绪&quot;、坎农的&quot;大脑先于身体感知&quot;、沙克特与辛格的&quot;生理唤起+认知解释&quot;，到扎伊翁次的&quot;情绪可以独立于认知形成&quot;。","label":"情绪理论简史"},{"t":"进化论视角：情绪是自然选择的产物，承担促进生存、繁衍与信息传递的适应性角色，且能在个体间传染（雪球效应）；跨文化面部表情相似，原始情绪（primary emotions）在人类大脑中根深蒂固。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">进化论视角</strong>：情绪是自然选择的产物，承担促进生存、繁衍与信息传递的适应性角色，且能在个体间传染（雪球效应）；跨文化面部表情相似，原始情绪（primary emotions）在人类大脑中根深蒂固。","label":"进化论视角"},{"t":"大脑与情绪：边缘系统（丘脑、扁桃核、海马体、扣带回等）被视为情绪活动的中枢；额叶掌管判断、决策与未来规划；人脑在过去的百万年间体积扩大了一倍。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">大脑与情绪</strong>：边缘系统（丘脑、扁桃核、海马体、扣带回等）被视为情绪活动的中枢；额叶掌管判断、决策与未来规划；人脑在过去的百万年间体积扩大了一倍。","label":"大脑与情绪"},{"t":"情绪和推理不可分离（达马西奥）：额叶受损而情绪缺失的病人（菲尼亚斯·盖奇、埃里奥特）认知正常却无法决策与规划未来；情绪通过聚焦关键点、提升创造力两条途径改善决策。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪和推理不可分离</strong>（达马西奥）：额叶受损而情绪缺失的病人（菲尼亚斯·盖奇、埃里奥特）认知正常却无法决策与规划未来；情绪通过聚焦关键点、提升创造力两条途径改善决策。","label":"情绪和推理不可分离"},{"t":"情绪的源泉包括认知因素、生理因素与进化因素；人不能选择情绪，但至少可以在一定程度上控制情绪反应的程度。","c":[],"k":"b","i":1,"h":"情绪的源泉包括认知因素、生理因素与进化因素；人不能选择情绪，但至少可以在一定程度上控制情绪反应的程度。","label":"情绪的源泉包括认知因素、生理因素与进…"},{"t":"展望：倒S形权重函数可能由情绪引起（彩票对应贪婪、保险对应恐惧）；情绪与处置效应、赌场资金效应、股票溢价之谜等金融现象相关；神经金融学（neurofinance）是研究金融决策中大脑运转的新兴领域。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">展望</strong>：倒S形权重函数可能由情绪引起（彩票对应贪婪、保险对应恐惧）；情绪与处置效应、赌场资金效应、股票溢价之谜等金融现象相关；神经金融学（neurofinance）是研究金融决策中大脑运转的新兴领域。","label":"展望：倒S形权重函数可能由情绪引起（…"},{"t":"（蒙蒂尔）投资者不止会犯错，而且会以可预见的模式犯错：过度乐观、过度自信与认知失调是最常见的心理特征偏差，其投资后果（过度交易、确认与保守偏差导致的反应不足）已被大量数据证实。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）投资者不止会犯错，而且会以可预见的模式犯错：过度乐观、过度自信与认知失调是最常见的心理特征偏差，其投资后果（过度交易、确认与保守偏差导致的反应不足）已被大量数据证实。","label":"（蒙蒂尔）投资者不止会犯错，而且会以…"}],"k":"sec","i":0,"h":"本章要点","label":"本章要点"},{"t":"7.1 情绪的本质","c":[{"t":"心理学家普遍认同快乐、伤心、愤怒、兴趣、轻视、厌恶、骄傲、恐惧、惊奇、后悔等状态是情绪；核心问题是：情绪的准确定义是什么、如何与心情等其他心理状态区分。","c":[],"k":"b","i":1,"h":"心理学家普遍认同快乐、伤心、愤怒、兴趣、轻视、厌恶、骄傲、恐惧、惊奇、后悔等状态是情绪；核心问题是：情绪的准确定义是什么、如何与心情等其他心理状态区分。","label":"心理学家普遍认同快乐、伤心、愤怒、兴…"},{"t":"琼·埃尔斯特提出用6个可观测特征定义情绪：","c":[{"t":"认知先行（cognitive antecedents）：多数情况下信念引发情绪——对闯红灯司机的愤怒源于\"他开车马虎且差点伤害到我\"；这与主要由感觉信号引起的身体饥饿状态不同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">认知先行</strong>（cognitive antecedents）：多数情况下信念引发情绪——对闯红灯司机的愤怒源于&quot;他开车马虎且差点伤害到我&quot;；这与主要由感觉信号引起的身体饥饿状态不同。","label":"认知先行"},{"t":"意向对象（intentional objects）：情绪与特定的人或处境相关，且情绪对象通常与引发它的信念紧密相关（因为司机鲁莽才对他生气）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">意向对象</strong>（intentional objects）：情绪与特定的人或处境相关，且情绪对象通常与引发它的信念紧密相关（因为司机鲁莽才对他生气）。","label":"意向对象"},{"t":"生理激发（physiological arousal）：激素与神经系统随情绪反应变化，如险些相撞时血压升高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">生理激发</strong>（physiological arousal）：激素与神经系统随情绪反应变化，如险些相撞时血压升高。","label":"生理激发"},{"t":"生理表现（physiological expression）：可通过可观测的机体表现体现（提高嗓门、挥舞拳头、涨红脸）；但同一表现可由不同情绪导致（面红耳赤也可能是尴尬），并非独一无二。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">生理表现</strong>（physiological expression）：可通过可观测的机体表现体现（提高嗓门、挥舞拳头、涨红脸）；但同一表现可由不同情绪导致（面红耳赤也可能是尴尬），并非独一无二。","label":"生理表现"},{"t":"效价（valence）：在以中性点为中心、两端为积极与消极情感的量表上评价情绪；强烈程度不等于效价极端程度（如枯燥是效价很低但可能强烈的情绪）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效价</strong>（valence）：在以中性点为中心、两端为积极与消极情感的量表上评价情绪；强烈程度不等于效价极端程度（如枯燥是效价很低但可能强烈的情绪）。","label":"效价（valence）：在以中性点为…"},{"t":"行动倾向（action tendencies）：情绪伴随强烈的行动冲动，甚至觉得不得不行动；对行动倾向的控制可能是有意识的，也可能是无意识的，还受社会力量驾驭（担心被视为反应失控而放弃追车）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行动倾向</strong>（action tendencies）：情绪伴随强烈的行动冲动，甚至觉得不得不行动；对行动倾向的控制可能是有意识的，也可能是无意识的，还受社会力量驾驭（担心被视为反应失控而放弃追车）。","label":"行动倾向"}],"k":"b","i":1,"h":"<strong class=\"lead\">琼·埃尔斯特提出用6个可观测特征定义情绪</strong>：","label":"琼·埃尔斯特提出用6个可观测特征定义情绪"},{"t":"情绪与心情（mood）的区分：两者都有积极与消极效价，但心情持续更久，且不针对任何特定事物；情绪的产生与某个客体或刺激因素相关。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪与心情</strong>（mood）的区分：两者都有积极与消极效价，但心情持续更久，且不针对任何特定事物；情绪的产生与某个客体或刺激因素相关。","label":"情绪与心情"},{"t":"情感（affect）与情感评估（affective assessment）：情感是人们如何体验一种感觉，情感评估是对刺激做出响应时的感受（好/坏、积极/消极）；情感评估是一种判断，但不需要（也不排除）认知反应——玫瑰闻起来香，却未必能从认知上解释原因。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情感</strong>（affect）与情感评估（affective assessment）：情感是人们如何体验一种感觉，情感评估是对刺激做出响应时的感受（好/坏、积极/消极）；情感评估是一种判断，但不需要（也不排除）认知反应——玫瑰闻起来香，却未必能从认知上解释原因。","label":"情感（affect）与情感评估（af…"},{"t":"以往心理学偏重消极情绪（愤怒、恐惧等），积极心理学（positive psychology）主张关注情绪的积极功能，以促进人类社会健康发展。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">以往心理学偏重消极情绪</strong>（愤怒、恐惧等），积极心理学（positive psychology）主张关注情绪的积极功能，以促进人类社会健康发展。","label":"以往心理学偏重消极情绪"}],"k":"sec","i":0,"h":"7.1 情绪的本质","label":"7.1 情绪的本质"},{"t":"7.2 情绪理论简史","c":[{"t":"早期认知取向：情绪被解释为对情境的思考；心理学家并不把思维过程与情绪视为可分离的对立因素，情绪包含认知元素、生理元素和明显的行为元素。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">早期认知取向</strong>：情绪被解释为对情境的思考；心理学家并不把思维过程与情绪视为可分离的对立因素，情绪包含认知元素、生理元素和明显的行为元素。","label":"早期认知取向"},{"t":"詹姆斯理论（1884）：情绪是由自主反应引发的情感；自主神经系统（autonomic nervous system）控制出汗、颤抖、逃跑等非自主反应——看到熊时先停止行进、身体反应，然后才意识到恐惧：\"我们感到难过是因为我们哭泣，感到愤怒是因为我们开始攻击，感到恐惧是因为我们发抖\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">詹姆斯理论</strong>（1884）：情绪是由自主反应引发的情感；自主神经系统（autonomic nervous system）控制出汗、颤抖、逃跑等非自主反应——看到熊时先停止行进、身体反应，然后才意识到恐惧：&quot;我们感到难过是因为我们哭泣，感到愤怒是因为我们开始攻击，感到恐惧是因为我们发抖&quot;。","label":"詹姆斯理论"},{"t":"坎农的批评（1927）：许多不同情绪伴随十分相似的生理反应（高兴与愤怒都可能握拳），自主反应无法区分情绪；且大脑在身体采取行动之前就已对刺激做出反应——看到熊时大脑与神经系统同时接收信号，随后意识到恐惧并产生自主唤起。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">坎农的批评</strong>（1927）：许多不同情绪伴随十分相似的生理反应（高兴与愤怒都可能握拳），自主反应无法区分情绪；且大脑在身体采取行动之前就已对刺激做出反应——看到熊时大脑与神经系统同时接收信号，随后意识到恐惧并产生自主唤起。","label":"坎农的批评"},{"t":"沙克特—辛格模型（1962）：情绪=自主唤起+对情境的认知评估；身体先做出反应，大脑随后为唤起寻求解释——意识到身体对熊做出了反应时才感到恐惧，情绪还会实施控制（想跑但保持冷静尽快离开，因为逃跑会引来追赶）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">沙克特—辛格模型</strong>（1962）：情绪=自主唤起+对情境的认知评估；身体先做出反应，大脑随后为唤起寻求解释——意识到身体对熊做出了反应时才感到恐惧，情绪还会实施控制（想跑但保持冷静尽快离开，因为逃跑会引来追赶）。","label":"沙克特—辛格模型"},{"t":"扎伊翁次的挑战（1980）：用面对刺激的潜意识做实验，发现人们偏好以前遇到过的刺激却无法识别——情绪的形成可以独立于认知，质疑了评估模型的普适性。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">扎伊翁次的挑战</strong>（1980）：用面对刺激的潜意识做实验，发现人们偏好以前遇到过的刺激却无法识别——情绪的形成可以独立于认知，质疑了评估模型的普适性。","label":"扎伊翁次的挑战"}],"k":"sec","i":0,"h":"7.2 情绪理论简史","label":"7.2 情绪理论简史"},{"t":"7.3 进化论视角","c":[{"t":"达尔文：与物理特征一样，情绪可以遗传并逐渐成为天生的；有助于物种生存的特质最终成为物种特征。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">达尔文</strong>：与物理特征一样，情绪可以遗传并逐渐成为天生的；有助于物种生存的特质最终成为物种特征。","label":"达尔文：与物理特征一样，情绪可以遗传…"},{"t":"基本情绪促进繁衍与生存：许多情绪是对刺激的快速先天反应，认知作用很小；情绪引发合理的行动与交流，承担适应性角色（猫、狗面对危险时表情相似并竖毛，向周围传递\"赶快离开\"的信息）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">基本情绪促进繁衍与生存</strong>：许多情绪是对刺激的快速先天反应，认知作用很小；情绪引发合理的行动与交流，承担适应性角色（猫、狗面对危险时表情相似并竖毛，向周围传递&quot;赶快离开&quot;的信息）。","label":"基本情绪促进繁衍与生存"},{"t":"情绪的传递与传染：情绪使旁观者产生类似情绪，传染过程通常是潜意识的、非认知的——仅观看微笑图片就会引起观察者发笑、观众与演员情绪同步、紧张会传递给观众；社会背景下出现\"雪球效应\"，即许多人对同一原始刺激产生相同感受并相互传染，这对解释市场波动具有潜在重要性。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪的传递与传染</strong>：情绪使旁观者产生类似情绪，传染过程通常是潜意识的、非认知的——仅观看微笑图片就会引起观察者发笑、观众与演员情绪同步、紧张会传递给观众；社会背景下出现&quot;雪球效应&quot;，即许多人对同一原始刺激产生相同感受并相互传染，这对解释市场波动具有潜在重要性。","label":"情绪的传递与传染"},{"t":"跨文化相似性：不同文化背景的人群用相似的面部表情或身体表达传达相同的情绪；面部表情定义的基本情绪集合包括愤怒、厌恶、恐惧、有趣、兴奋和吃惊。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">跨文化相似性</strong>：不同文化背景的人群用相似的面部表情或身体表达传达相同的情绪；面部表情定义的基本情绪集合包括愤怒、厌恶、恐惧、有趣、兴奋和吃惊。","label":"跨文化相似性"},{"t":"原始情绪（primary emotions）：在大脑中扎根更早、进化早于其他心理系统的七种情绪——愤怒、轻视、厌恶、恐惧、快乐、伤心和吃惊；控制复杂心理过程的大脑区域是此后才进化出来的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">原始情绪</strong>（primary emotions）：在大脑中扎根更早、进化早于其他心理系统的七种情绪——愤怒、轻视、厌恶、恐惧、快乐、伤心和吃惊；控制复杂心理过程的大脑区域是此后才进化出来的。","label":"原始情绪"}],"k":"sec","i":0,"h":"7.3 进化论视角","label":"7.3 进化论视角"},{"t":"7.4 大脑与情绪","c":[{"t":"研究工具：正电子成像术（PET）用无害放射性物质描绘脑活动图谱；功能性磁共振成像（fMRI）无需注入物质，通过监测血液与氧气流量确定活跃区域。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">研究工具</strong>：正电子成像术（PET）用无害放射性物质描绘脑活动图谱；功能性磁共振成像（fMRI）无需注入物质，通过监测血液与氧气流量确定活跃区域。","label":"研究工具"},{"t":"脑干结构：脑髓连接脑与脊髓、控制呼吸、血压和循环等潜意识功能；脑桥连接脑干与脑髓、控制眼球活动与睡眠梦境；小脑协调运动并维持身体平衡。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">脑干结构</strong>：脑髓连接脑与脊髓、控制呼吸、血压和循环等潜意识功能；脑桥连接脑干与脑髓、控制眼球活动与睡眠梦境；小脑协调运动并维持身体平衡。","label":"脑干结构"},{"t":"边缘系统（limbic system）：位于脑深部、控制人类本能，被认为是大部分情绪活动的中枢——丘脑位于其中间，整合并传递大多数感觉信息；扁桃核（amygdala，又称杏仁核）评估感觉信息，对愤怒、恐惧等原始情绪的评估是自主的而非控制评估的结果；海马体对长期记忆储存十分重要，支持用以往事件评估新情境；扣带回是评估情绪经历的重要区域；穹窿与海马旁回连接部分脑区。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">边缘系统</strong>（limbic system）：位于脑深部、控制人类本能，被认为是大部分情绪活动的中枢——丘脑位于其中间，整合并传递大多数感觉信息；扁桃核（amygdala，又称杏仁核）评估感觉信息，对愤怒、恐惧等原始情绪的评估是自主的而非控制评估的结果；海马体对长期记忆储存十分重要，支持用以往事件评估新情境；扣带回是评估情绪经历的重要区域；穹窿与海马旁回连接部分脑区。","label":"边缘系统"},{"t":"前脑（forebrain）与四脑叶：大脑分两个半球，各含颞叶、枕叶、顶叶、额叶——颞叶控制讲话、语言和记忆；枕叶是视觉中枢；顶叶是感觉中枢（皮肤响应与温度）；额叶（frontal lobe）最大，控制运动能力、记忆、判断、决策以及为将来计划的能力。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">前脑</strong>（forebrain）与四脑叶：大脑分两个半球，各含颞叶、枕叶、顶叶、额叶——颞叶控制讲话、语言和记忆；枕叶是视觉中枢；顶叶是感觉中枢（皮肤响应与温度）；额叶（frontal lobe）最大，控制运动能力、记忆、判断、决策以及为将来计划的能力。","label":"前脑（forebrain）与四脑叶：…"},{"t":"过去的百万年间人脑迅速成长、体积扩大一倍；计划未来的能力是人类相对其他脊椎动物的关键优势。","c":[],"k":"b","i":1,"h":"过去的百万年间人脑迅速成长、体积扩大一倍；计划未来的能力是人类相对其他脊椎动物的关键优势。","label":"过去的百万年间人脑迅速成长、体积扩大…"}],"k":"sec","i":0,"h":"7.4 大脑与情绪","label":"7.4 大脑与情绪"},{"t":"7.5 情绪和推理","c":[{"t":"达马西奥的证据：为推理和情绪服务的神经系统不可分离，决策与情绪共生共存；额叶受损而情绪异常的病人认知能力正常甚至高于平均水平（抽象推理、注意力、知识、语言、记忆均无缺陷），却存在决策困难、不能计划未来的活动。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">达马西奥的证据</strong>：为推理和情绪服务的神经系统不可分离，决策与情绪共生共存；额叶受损而情绪异常的病人认知能力正常甚至高于平均水平（抽象推理、注意力、知识、语言、记忆均无缺陷），却存在决策困难、不能计划未来的活动。","label":"达马西奥的证据"},{"t":"菲尼亚斯·盖奇案例（1848）：25岁的工地工头因爆炸被一根3.7英尺长的铁棒从左脸颊刺穿头顶，奇迹生还且语言功能无损；但个性剧变、不再关心未来，被原雇主拒绝返岗，每份工作都难以持久——性格变化与额叶受损相联系。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">菲尼亚斯·盖奇案例</strong>（1848）：25岁的工地工头因爆炸被一根3.7英尺长的铁棒从左脸颊刺穿头顶，奇迹生还且语言功能无损；但个性剧变、不再关心未来，被原雇主拒绝返岗，每份工作都难以持久——性格变化与额叶受损相联系。","label":"菲尼亚斯·盖奇案例"},{"t":"埃里奥特案例：30岁时切除额叶肿瘤后，智商、记忆、感知、语言、计算与理解能力均无明显受损，却找不到工作、无法维持社会关系；对过去能引起强烈反应的刺激情绪反应消失，无法思考自己的选择如何影响未来生活——计划与情绪存在关联的例证。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">埃里奥特案例</strong>：30岁时切除额叶肿瘤后，智商、记忆、感知、语言、计算与理解能力均无明显受损，却找不到工作、无法维持社会关系；对过去能引起强烈反应的刺激情绪反应消失，无法思考自己的选择如何影响未来生活——计划与情绪存在关联的例证。","label":"埃里奥特案例"},{"t":"神经科学（neuroscience）认为情绪通过两条途径改善决策：其一，当决策重要、备选方案过多时，情绪推动选择、聚焦决策关键点，避免逐一评估的不合理时间成本；其二，积极情绪便于获取大脑信息，提升创造力、解决问题与谈判的能力，构建更好的决策过程。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">神经科学</strong>（neuroscience）认为情绪通过两条途径改善决策：其一，当决策重要、备选方案过多时，情绪推动选择、聚焦决策关键点，避免逐一评估的不合理时间成本；其二，积极情绪便于获取大脑信息，提升创造力、解决问题与谈判的能力，构建更好的决策过程。","label":"神经科学"},{"t":"情绪智力（emotional intelligence, EI）与情商（EQ）：像IQ测量认知能力一样，EQ测量识别与管理自己和他人情绪反应的能力；个人成功在很大程度上依赖情商——情绪让我们对危险遭遇或金融决策等不同情境做出迅速、合适、理性的反应。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪智力</strong>（emotional intelligence, EI）与情商（EQ）：像IQ测量认知能力一样，EQ测量识别与管理自己和他人情绪反应的能力；个人成功在很大程度上依赖情商——情绪让我们对危险遭遇或金融决策等不同情境做出迅速、合适、理性的反应。","label":"情绪智力"}],"k":"sec","i":0,"h":"7.5 情绪和推理","label":"7.5 情绪和推理"},{"t":"7.6 思维、身体和情绪","c":[{"t":"情绪的源泉是认知因素、生理因素与进化因素的综合；思维过程与情绪不能被视为可分离的对立影响因素。","c":[],"k":"b","i":1,"h":"情绪的源泉是认知因素、生理因素与进化因素的综合；思维过程与情绪不能被视为可分离的对立影响因素。","label":"情绪的源泉是认知因素、生理因素与进化…"},{"t":"人类的推理是思维与身体复杂相互作用的结果，理解人类行为必须同时考虑现有的各方面因素。","c":[],"k":"b","i":1,"h":"人类的推理是思维与身体复杂相互作用的结果，理解人类行为必须同时考虑现有的各方面因素。","label":"人类的推理是思维与身体复杂相互作用的…"},{"t":"虽然情绪不是有意识的选择，但至少在一定程度上可以控制情绪反应的程度；在极端情绪（无论积极或消极）下缓和反应、尝试选择最好的应对，境况都会更好。","c":[],"k":"b","i":1,"h":"虽然情绪不是有意识的选择，但至少在一定程度上可以控制情绪反应的程度；在极端情绪（无论积极或消极）下缓和反应、尝试选择最好的应对，境况都会更好。","label":"虽然情绪不是有意识的选择，但至少在一…"}],"k":"sec","i":0,"h":"7.6 思维、身体和情绪","label":"7.6 思维、身体和情绪"},{"t":"7.7 展望：情绪对金融决策的影响","c":[{"t":"前景理论的情绪解读：购买彩票（预期收益为负、非投资）与渴望一夜暴富的贪婪相关；购买保险（同样预期收益为负）与害怕灾难、破产的恐惧相关——倒S形权重函数可能正是由情绪引起的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">前景理论的情绪解读</strong>：购买彩票（预期收益为负、非投资）与渴望一夜暴富的贪婪相关；购买保险（同样预期收益为负）与害怕灾难、破产的恐惧相关——倒S形权重函数可能正是由情绪引起的。","label":"前景理论的情绪解读"},{"t":"亲吻实验（罗滕施特赖奇与赫西伊）：确定性条件下70%的学生选50美元而非亲吻最爱影星；在两个各1%机会的彩票之间65%选亲吻机会——情绪丰富的情境下倒S形权重函数更弯曲（小概率事件被赋予更大权重）；彩票广告用跑车与南海日光浴而非现金描绘中奖者，正是利用了这一点。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">亲吻实验</strong>（罗滕施特赖奇与赫西伊）：确定性条件下70%的学生选50美元而非亲吻最爱影星；在两个各1%机会的彩票之间65%选亲吻机会——情绪丰富的情境下倒S形权重函数更弯曲（小概率事件被赋予更大权重）；彩票广告用跑车与南海日光浴而非现金描绘中奖者，正是利用了这一点。","label":"亲吻实验"},{"t":"后续章节路线图：第10章情绪与个体投资者——处置效应（持有亏损资产却卖出盈利资产）、赌场资金效应（获利后承担更多风险）与盈亏平衡效应（亏损后承担更多风险），以及市场情绪是否影响价格；第14章股票溢价之谜——损失厌恶与对未知的恐惧提供情绪基础；第16章企业经理人情绪影响投资项目选择；第20章神经金融学（neurofinance）运用神经技术检验金融决策时大脑的运转方式（如交易技术的形成）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">后续章节路线图</strong>：第10章情绪与个体投资者——处置效应（持有亏损资产却卖出盈利资产）、赌场资金效应（获利后承担更多风险）与盈亏平衡效应（亏损后承担更多风险），以及市场情绪是否影响价格；第14章股票溢价之谜——损失厌恶与对未知的恐惧提供情绪基础；第16章企业经理人情绪影响投资项目选择；第20章神经金融学（neurofinance）运用神经技术检验金融决策时大脑的运转方式（如交易技术的形成）。","label":"后续章节路线图"}],"k":"sec","i":0,"h":"<strong class=\"lead\">7.7 展望</strong>：情绪对金融决策的影响","label":"7.7 展望"},{"t":"补充视角：投资者心理特征偏差（蒙蒂尔）","c":[{"t":"（蒙蒂尔）投资者不止会犯错，而且以一种可以预见的模式犯错；人们用经验法则（启发法，heuristics）处理海量信息，行为金融学以心理学依据取代理性人假设。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）投资者不止会犯错，而且以一种可以预见的模式犯错；人们用经验法则（启发法，heuristics）处理海量信息，行为金融学以心理学依据取代理性人假设。","label":"（蒙蒂尔）投资者不止会犯错，而且以一…"},{"t":"（蒙蒂尔）过度乐观（over-optimism）：约80%的人自认是好司机、约80%的学生自认能进班级前50%；其心理根源是控制力错觉（illusion of control，被随机性欺骗、误以为掌控局势）与自我归因偏差（self-attribution bias，好结果归能力、坏结果归运气）。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）过度乐观（over-optimism）：约80%的人自认是好司机、约80%的学生自认能进班级前50%；其心理根源是控制力错觉（illusion of control，被随机性欺骗、误以为掌控局势）与自我归因偏差（self-attribution bias，好结果归能力、坏结果归运气）。","label":"（蒙蒂尔）过度乐观（over-opt…"},{"t":"（蒙蒂尔）过度自信（overconfidence）：Lichtenstein等的经典研究发现被试系统性高估自己答对的概率——自认确定正确时实际正确率仅约80%；预测12只股票涨跌时实际正确47%、自估65%；有常规反馈的职业出版商与天气预报员校准更好，而拥有类似条件的分析师与市场预测者并未因此谦逊。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）过度自信（overconfidence）：Lichtenstein等的经典研究发现被试系统性高估自己答对的概率——自认确定正确时实际正确率仅约80%；预测12只股票涨跌时实际正确47%、自估65%；有常规反馈的职业出版商与天气预报员校准更好，而拥有类似条件的分析师与市场预测者并未因此谦逊。","label":"（蒙蒂尔）过度自信（overconf…"},{"t":"（蒙蒂尔）过度自信的投资后果（Odean对1万个折扣经纪账户的研究）：个人投资者卖出股票次年的回报比同期买入的股票高3.4%（剔除非投机性交易后达5.07%）；男性交易周转率比女性高45%、年化净回报率多降0.8个百分点（2.5%对1.7%）；单身男性比单身女性周转率高67%、年化收益低3.5%——\"不要把头脑和牛市搞混了\"。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）过度自信的投资后果（Odean对1万个折扣经纪账户的研究）：个人投资者卖出股票次年的回报比同期买入的股票高3.4%（剔除非投机性交易后达5.07%）；男性交易周转率比女性高45%、年化净回报率多降0.8个百分点（2.5%对1.7%）；单身男性比单身女性周转率高67%、年化收益低3.5%——&quot;不要把头脑和牛市搞混了&quot;。","label":"（蒙蒂尔）过度自信的投资后果（Ode…"},{"t":"（蒙蒂尔）认知失调（cognitive dissonance）：证据与自己的信念冲突时经历的心理不适，人会改变认知以恢复一致；表现为确认偏差（confirmation bias，忽视不利信息、加倍重视有利信息）与保守偏差（conservatism，固守既定观点、更新缓慢），导致对负面新证据的反应不足。","c":[],"k":"b","i":1,"h":"（蒙蒂尔）认知失调（cognitive dissonance）：证据与自己的信念冲突时经历的心理不适，人会改变认知以恢复一致；表现为确认偏差（confirmation bias，忽视不利信息、加倍重视有利信息）与保守偏差（conservatism，固守既定观点、更新缓慢），导致对负面新证据的反应不足。","label":"（蒙蒂尔）认知失调（cognitiv…"}],"k":"sec","i":0,"h":"<strong class=\"lead\">补充视角</strong>：投资者心理特征偏差（蒙蒂尔）","label":"补充视角"}],"k":"chap","h":"第7章 情绪基础","label":"第7章 情绪基础"}],"k":"part","h":"第二篇 行为科学的基础","label":"第二篇 行为科学的基础","col":"#0e9f8a","pc":"p2"},{"t":"第三篇 投资者行为","c":[{"t":"第8章 启发式及其偏差对金融决策的启示","c":[{"t":"本章要点","c":[{"t":"熟悉导致的金融行为：本地偏差（home bias）——投资者过度持有本国与本地证券，与分散化收益相矛盾；解释包括对本国市场的过度乐观、熟悉带来的舒适、信息优势与对冲需求；距离、语言、文化甚至品牌认知都会影响持股。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">熟悉导致的金融行为</strong>：本地偏差（home bias）——投资者过度持有本国与本地证券，与分散化收益相矛盾；解释包括对本国市场的过度乐观、熟悉带来的舒适、信息优势与对冲需求；距离、语言、文化甚至品牌认知都会影响持股。","label":"熟悉导致的金融行为"},{"t":"代表性启发式偏差导致的金融行为：投资者相信\"好公司就是好投资\"、因近因效应追逐近期赢家（动量）、并买入吸引注意的股票（易得性偏差）；动量效应存在于3~12个月，3年以上则出现反转效应。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">代表性启发式偏差导致的金融行为</strong>：投资者相信&quot;好公司就是好投资&quot;、因近因效应追逐近期赢家（动量）、并买入吸引注意的股票（易得性偏差）；动量效应存在于3~12个月，3年以上则出现反转效应。","label":"代表性启发式偏差导致的金融行为"},{"t":"锚定（anchoring）使估值受到无关暗示的影响：房地产标价实验证明连专业经纪人也会被锚定；分析师的盈余预测与推荐存在锚定与羊群行为。","c":[],"k":"b","i":1,"h":"<strong </strong>：好公司的管理、盈利等特征都应已反映在股价中（好的企业卖好的价格），事前好坏公司是相同的投资机会；&quot;好公司=好投资&quot;违背有效市场且是错误的，但大多数人确实这样想。","label":"有效市场的逻辑"},{"t":"Shefrin与Statman用《财富》杂志企业特征调查（以管理质量为企业质量代理变量，82%受访者视其为最重要）：管理质量与\"作为长期投资的价值\"高度相关（相关系数0.93，即R²的平方根）——企业高管认为好公司就是好投资。","c":[],"k":"b","i":3,"h":"Shefrin与Statman用《财富》杂志企业特征调查（以管理质量为企业质量代理变量，82%受访者视其为最重要）：管理质量与&quot;作为长期投资的价值&quot;高度相关（相关系数0.93，即R²的平方根）——企业高管认为好公司就是好投资。","label":"Shefrin与Statman用《财…"},{"t":"补充回归：大企业与低账面市值比（成长性）企业被视为好企业；即使控制规模与账面市值比，两者对投资价值仍有独立影响——大型成长企业被视为好投资，而第4章的实证结果完全相反（小盘价值股才有超额收益），代表性偏差可能导致小公司效应与价值股效应。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">补充回归</strong>：大企业与低账面市值比（成长性）企业被视为好企业；即使控制规模与账面市值比，两者对投资价值仍有独立影响——大型成长企业被视为好投资，而第4章的实证结果完全相反（小盘价值股才有超额收益），代表性偏差可能导致小公司效应与价值股效应。","label":"补充回归"},{"t":"公司形象与品牌：仅向实验参与者披露与企业形象相关、与投资价值无关的信息，参与者仍更喜欢投资正面形象企业；品牌认知一旦形成，散户对该股票的需求随之增加。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">公司形象与品牌</strong>：仅向实验参与者披露与企业形象相关、与投资价值无关的信息，参与者仍更喜欢投资正面形象企业；品牌认知一旦形成，散户对该股票的需求随之增加。","label":"公司形象与品牌"}],"k":"b","i":2,"h":"8.2.1 好公司与好投资","label":"8.2.1 好公司与好投资"},{"t":"8.2.2 追逐赢者","c":[{"t":"近因效应：投资者把过去表现当作未来表现的代表——过去成功的股票或基金被视为未来也会成功；趋势跟随（trend-following）/动量投资（momentum chasing）长期是技术分析的核心策略。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">近因效应</strong>：投资者把过去表现当作未来表现的代表——过去成功的股票或基金被视为未来也会成功；趋势跟随（trend-following）/动量投资（momentum chasing）长期是技术分析的核心策略。","label":"近因效应"},{"t":"调查与资金流证据：美国个体投资者协会调查显示，近期市场上涨后多数人对股市看涨；优秀的历史收益率吸引大量资金流入共同基金；日本新个人投资者买入的股票正是历史表现优异者。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">调查与资金流证据</strong>：美国个体投资者协会调查显示，近期市场上涨后多数人对股市看涨；优秀的历史收益率吸引大量资金流入共同基金；日本新个人投资者买入的股票正是历史表现优异者。","label":"调查与资金流证据"},{"t":"加拿大自管退休金调查：两只股票过去5年平均收益5%与15%、分析师预测未来5年均为10%——中性预期下应平均配置，但63.8%的受访者正反馈交易（押历史赢家），仅11.6%逆向交易。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">加拿大自管退休金调查</strong>：两只股票过去5年平均收益5%与15%、分析师预测未来5年均为10%——中性预期下应平均配置，但63.8%的受访者正反馈交易（押历史赢家），仅11.6%逆向交易。","label":"加拿大自管退休金调查"},{"t":"Benartzi的401(k)研究：按公司股票过去10年收益分组，表现最好组员工将40%可支配资金投于公司股票、最差组仅10%；此后一年投资最多的员工比投资最少的少赚6.77%——动量外推得不偿失。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">Benartzi的401(k)研究</strong>：按公司股票过去10年收益分组，表现最好组员工将40%可支配资金投于公司股票、最差组仅10%；此后一年投资最多的员工比投资最少的少赚6.77%——动量外推得不偿失。","label":"Benartzi的401"},{"t":"动量与反转的时间边界：过去3~6个月收益与随后收益正相关（动量效应，Jegadeesh与Titman）；3年及以上出现反转效应（负相关，De Bondt与Thaler）——第13章给出解释中期动量与长期反转的行为模型。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">动量与反转的时间边界</strong>：过去3~6个月收益与随后收益正相关（动量效应，Jegadeesh与Titman）；3年及以上出现反转效应（负相关，De Bondt与Thaler）——第13章给出解释中期动量与长期反转的行为模型。","label":"动量与反转的时间边界"}],"k":"b","i":2,"h":"8.2.2 追逐赢者","label":"8.2.2 追逐赢者"},{"t":"8.2.3 易得性偏差和注意力吸引","c":[{"t":"Barber与Odean：注意力是稀缺资源，面对大量投资机会，散户的交易倾向于集中在信息容易获得的股票上；吸引注意的三种方式——新闻报道、异常高的交易量、极端收益率。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">Barber与Odean</strong>：注意力是稀缺资源，面对大量投资机会，散户的交易倾向于集中在信息容易获得的股票上；吸引注意的三种方式——新闻报道、异常高的交易量、极端收益率。","label":"Barber与Odean"},{"t":"方向不对称：散户很少卖空、通常持股有限，坏消息被忽略、好消息促成购买——新闻倾向于使个人投资者净买入；机构投资者研究覆盖大部分甚至全部股票，受注意力驱动的影响很小（实证支持）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">方向不对称</strong>：散户很少卖空、通常持股有限，坏消息被忽略、好消息促成购买——新闻倾向于使个人投资者净买入；机构投资者研究覆盖大部分甚至全部股票，受注意力驱动的影响很小（实证支持）。","label":"方向不对称"},{"t":"（蒙蒂尔）易得性启发（availability heuristic）：以想起例子的难易程度评估事件频率或概率——鲨鱼袭击比飞机部件坠落更受关注、更易想象，但后者致死率是前者的30倍；英语单词字母K在开头还是第三位，152人中有105人答\"开头\"，实际第三位约多一倍；金融上媒体报道频率很高的股票随后两年表现不佳（Gadarowski）——发光的未必都是金子。","c":[],"k":"b","i":3,"h":"（蒙蒂尔）易得性启发（availability heuristic）：以想起例子的难易程度评估事件频率或概率——鲨鱼袭击比飞机部件坠落更受关注、更易想象，但后者致死率是前者的30倍；英语单词字母K在开头还是第三位，152人中有105人答&quot;开头&quot;，实际第三位约多一倍；金融上媒体报道频率很高的股票随后两年表现不佳（Gadarowski）——发光的未必都是金子。","label":"（蒙蒂尔）易得性启发（availab…"}],"k":"b","i":2,"h":"8.2.3 易得性偏差和注意力吸引","label":"8.2.3 易得性偏差和注意力吸引"},{"t":"（蒙蒂尔）代表性启发的经典演示","c":[{"t":"琳达问题：31岁、单身、直言不讳、主修哲学、关心平权的琳达，更可能是\"银行职员\"还是\"银行职员兼女权积极分子\"？多数人选后者——违反集合论（交集不可能大于子集），属于忽略基准概率（base rate neglect）：银行职员数量远多于参加女权运动的银行职员。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">琳达问题</strong>：31岁、单身、直言不讳、主修哲学、关心平权的琳达，更可能是&quot;银行职员&quot;还是&quot;银行职员兼女权积极分子&quot;？多数人选后者——违反集合论（交集不可能大于子集），属于忽略基准概率（base rate neglect）：银行职员数量远多于参加女权运动的银行职员。","label":"琳达问题"},{"t":"小数定律（law of small numbers）：相信小样本能代表总体——\"正反正反反正\"与\"正正正反反反\"概率相同（各0.5⁶），人们却认为前者更随机；Bloomfield与Hales发现人们对随机游走中多次延续之后的变化反应过度、对多次反转之后的变化反应不足。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">小数定律</strong>（law of small numbers）：相信小样本能代表总体——&quot;正反正反反正&quot;与&quot;正正正反反反&quot;概率相同（各0.5⁶），人们却认为前者更随机；Bloomfield与Hales发现人们对随机游走中多次延续之后的变化反应过度、对多次反转之后的变化反应不足。","label":"小数定律"},{"t":"金融应用：投资者按小数定律处理收益数据——公司多期收益良好即被相信会持续高增长（\"不可能处于平均水平\"）；误以为好公司的股票就是好股票（Solt与Statman；Shefrin与Statman），而收益存在均值复归，\"好公司\"的收益很可能回落到平均水平。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">金融应用</strong>：投资者按小数定律处理收益数据——公司多期收益良好即被相信会持续高增长（&quot;不可能处于平均水平&quot;）；误以为好公司的股票就是好股票（Solt与Statman；Shefrin与Statman），而收益存在均值复归，&quot;好公司&quot;的收益很可能回落到平均水平。","label":"金融应用"}],"k":"b","i":2,"h":"（蒙蒂尔）代表性启发的经典演示","label":"（蒙蒂尔）代表性启发的经典演示"}],"k":"b","i":1,"h":"8.2 代表性启发式偏差引起的金融行为","label":"8.2 代表性启发式偏差引起的金融行为"},{"t":"8.3 锚定在容易获得的暗示上","c":[{"t":"8.3.1 对房地产估值的实验研究","c":[{"t":"Northcraft与Neale：随机选取的两组房地产经纪人评估同一栋房子，行走路线与信息（含标价）相同，唯一差别是标价——第一组65 900美元，第二组83 900~180 000美元。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">Northcraft与Neale</strong>：随机选取的两组房地产经纪人评估同一栋房子，行走路线与信息（含标价）相同，唯一差别是标价——第一组65 900美元，第二组83 900~180 000美元。","label":"Northcraft与Neale"},{"t":"结果：两组平均估价67 811美元与75 190美元；以两组中值71 500.50美元为真实值最佳估计，差距达10%；而承认考虑了标价的经纪人不到25%。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">结果</strong>：两组平均估价67 811美元与75 190美元；以两组中值71 500.50美元为真实值最佳估计，差距达10%；而承认考虑了标价的经纪人不到25%。","label":"结果：两组平均估价67 811美元与…"},{"t":"估价机制：估价=a×个人估价+(1-a)×标价——第一组事后a=0.34（标价影响很大）、第二组a=0.7；a相等时为0.59，对应估价69 136.43美元，标价仍具有重要影响。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">估价机制</strong>：估价=a×个人估价+(1-a)×标价——第一组事后a=0.34（标价影响很大）、第二组a=0.7；a相等时为0.59，对应估价69 136.43美元，标价仍具有重要影响。","label":"估价机制"},{"t":"推广到市场：所有人都锚定于市场价格（有理性的一面——价格是市场参与者的共同估价），但当初始值偏离合理值时仍会影响最终市场价格——1999年网络股泡沫中，为高价辩护的人是否深受市场价格锚定的影响，回想起来似乎是重要的一方面。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">推广到市场</strong>：所有人都锚定于市场价格（有理性的一面——价格是市场参与者的共同估价），但当初始值偏离合理值时仍会影响最终市场价格——1999年网络股泡沫中，为高价辩护的人是否深受市场价格锚定的影响，回想起来似乎是重要的一方面。","label":"推广到市场"}],"k":"b","i":2,"h":"8.3.1 对房地产估值的实验研究","label":"8.3.1 对房地产估值的实验研究"},{"t":"8.3.2 锚定、羊群行为和分析师","c":[{"t":"羊群行为（herding）：房地产实验中，被告知另一代理人估价的代理人会向该估价趋同（即使考虑标价影响也成立）——社会层面的从众（第12章详述）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">羊群行为</strong>（herding）：房地产实验中，被告知另一代理人估价的代理人会向该估价趋同（即使考虑标价影响也成立）——社会层面的从众（第12章详述）。","label":"羊群行为"},{"t":"分析师的锚定检验：看分析师是否缓慢修正自己最初的观点判断；这类行为可能是几种市场异象的原因（第13章）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">分析师的锚定检验</strong>：看分析师是否缓慢修正自己最初的观点判断；这类行为可能是几种市场异象的原因（第13章）。","label":"分析师的锚定检验"},{"t":"分析师的羊群证据：推荐修正存在从众行为；盈余预测的证据不一——英国数据发现羊群行为，德国数据发现恰恰相反的\"逆羊群效应\"；当从众安全省事时羊群有意义，若自认掌握私人信息或期望脱颖而出（职业生涯考量），逆羊群也可能是合理的。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">分析师的羊群证据</strong>：推荐修正存在从众行为；盈余预测的证据不一——英国数据发现羊群行为，德国数据发现恰恰相反的&quot;逆羊群效应&quot;；当从众安全省事时羊群有意义，若自认掌握私人信息或期望脱颖而出（职业生涯考量），逆羊群也可能是合理的。","label":"分析师的羊群证据"}],"k":"b","i":2,"h":"8.3.2 锚定、羊群行为和分析师","label":"8.3.2 锚定、羊群行为和分析师"},{"t":"（蒙蒂尔）锚定的更多证据","c":[{"t":"联合国转盘实验（Tversky与Kahneman）：被试先回答\"非洲国家加入联合国的比例高于还是低于转盘指向数字\"再给出估计——转盘指向10与65时，预测均值分别为25与45；完全无关的数字显著改变了判断。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">联合国转盘实验</strong>（Tversky与Kahneman）：被试先回答&quot;非洲国家加入联合国的比例高于还是低于转盘指向数字&quot;再给出估计——转盘指向10与65时，预测均值分别为25与45；完全无关的数字显著改变了判断。","label":"联合国转盘实验"},{"t":"道琼斯指数的股息之锚（Statman与Fisher）：道指1896年创设时40.94、1998年末9181.43，但该指数剔除了股息；若把股息计入，1998年末应达652 230.87——基金经理的猜测只有2~3倍，历史价格成为今天价格的\"锚\"。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">道琼斯指数的股息之锚</strong>（Statman与Fisher）：道指1896年创设时40.94、1998年末9181.43，但该指数剔除了股息；若把股息计入，1998年末应达652 230.87——基金经理的猜测只有2~3倍，历史价格成为今天价格的&quot;锚&quot;。","label":"道琼斯指数的股息之锚"},{"t":"盈余公告漂移（Bernard）：盈余超预期最高的股票在公告后60天内回报仍比市场高约2%，而公告前60天已跑赢市场4%~5%——市场对基本面信息（股息、股票发行、盈余公告）反应不足；英国市场有类似发现。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">盈余公告漂移</strong>（Bernard）：盈余超预期最高的股票在公告后60天内回报仍比市场高约2%，而公告前60天已跑赢市场4%~5%——市场对基本面信息（股息、股票发行、盈余公告）反应不足；英国市场有类似发现。","label":"盈余公告漂移"},{"t":"远期贴水之谜：无抛补利率平价（UIP）下回归 ∆s=a+b(I−I*)+e 的b应为1，实证中b始终小于1、经常小于0（75项已发表研究的平均系数为−0.9，Froot）——高利率货币趋于升值而非贬值，套息交易（carry trade）有利可图，说明外汇市场远不够有效；风险溢价解释难以自洽（要求风险溢价方差大于预期贬值与利率差的方差且两者协方差为负），格伦与吉齐茨基用\"锚定历史数据的迟钝交易者+理性风险规避的流动性受限交易者\"两类人模型解释b<0，Froot在回归中加入过去远期贴水后b转为正且接近1。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">远期贴水之谜</strong>：无抛补利率平价（UIP）下回归 ∆s=a+b(I−I*)+e 的b应为1，实证中b始终小于1、经常小于0（75项已发表研究的平均系数为−0.9，Froot）——高利率货币趋于升值而非贬值，套息交易（carry trade）有利可图，说明外汇市场远不够有效；风险溢价解释难以自洽（要求风险溢价方差大于预期贬值与利率差的方差且两者协方差为负），格伦与吉齐茨基用&quot;锚定历史数据的迟钝交易者+理性风险规避的流动性受限交易者&quot;两类人模型解释b&lt;0，Froot在回归中加入过去远期贴水后b转为正且接近1。","label":"远期贴水之谜"},{"t":"分析师预测修正（Amir与Ganzach）：乐观情绪既影响预测水平也影响极端程度（整体过度乐观、负向修正时过度温和即反应不足）；代表性使预测过于极端、锚定使预测过于温和；谁主导取决于锚定点的突出程度——自己先前的预测比公开收益数据更突出（沉没成本让人心理上难以忘记），坏消息下分析师更不愿离开锚，负向修正的反应不足比正向修正更明显。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">分析师预测修正</strong>（Amir与Ganzach）：乐观情绪既影响预测水平也影响极端程度（整体过度乐观、负向修正时过度温和即反应不足）；代表性使预测过于极端、锚定使预测过于温和；谁主导取决于锚定点的突出程度——自己先前的预测比公开收益数据更突出（沉没成本让人心理上难以忘记），坏消息下分析师更不愿离开锚，负向修正的反应不足比正向修正更明显。","label":"分析师预测修正"}],"k":"b","i":2,"h":"（蒙蒂尔）锚定的更多证据","label":"（蒙蒂尔）锚定的更多证据"}],"k":"b","i":1,"h":"8.3 锚定在容易获得的暗示上","label":"8.3 锚定在容易获得的暗示上"},{"t":"补充视角：框架效应与损失相关偏差（蒙蒂尔）","c":[{"t":"（蒙蒂尔）狭窄框架效应（narrow framing）/心理会计（mental accounting）：问题呈现方式改变决策（两条线的错觉——加辅助线后\"下方的线更长\"的错误消失）；把财富按用途人为拆分——每月不还清信用卡（年息28%~29%）却持有银行存款（利息6%）是不理性的；同时决策的两对选择：多数人选A（确定得2400英镑）与D（75%可能损失10000英镑），但A+D=−5100劣于B+C=−5000——分框架使人在两处都做出错误组合。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）狭窄框架效应（narrow framing）/心理会计（mental accounting）：问题呈现方式改变决策（两条线的错觉——加辅助线后&quot;下方的线更长&quot;的错误消失）；把财富按用途人为拆分——每月不还清信用卡（年息28%~29%）却持有银行存款（利息6%）是不理性的；同时决策的两对选择：多数人选A（确定得2400英镑）与D（75%可能损失10000英镑），但A+D=−5100劣于B+C=−5000——分框架使人在两处都做出错误组合。","label":"（蒙蒂尔）狭窄框架效应（narrow…"},{"t":"（蒙蒂尔）现金流还是盈利：盈利=应计项目+现金流，只关注盈利的框架使人无法透视报告中的现金流；Sloan发现做多低应计项目、做空高应计项目的零投资组合年超额收益超过10%（31年中有28年为正）；Houge与Loughran的\"收益质量\"策略（买入现金流占比高的公司、卖出应计主导的公司）平均年超额收益16%；预计报表1美元收益仅相当于GAAP报表47美分（标普500按预计口径亏损公司占8%、按GAAP达19%）；利用预计报表与GAAP收益差异交易三年可赚15%，聚焦\"刚好达标且扣除项目大于超预期\"的公司则高达32%（Doyle等）。","c":[],"k":"b","i":2,"h":"（蒙蒂尔）现金流还是盈利：盈利=应计项目+现金流，只关注盈利的框架使人无法透视报告中的现金流；Sloan发现做多低应计项目、做空高应计项目的零投资组合年超额收益超过10%（
