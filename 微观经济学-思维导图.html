平等两个目标；若一种税制能以对纳税人较低的成本筹集到与另一种税制等量的收入，它就更有效率。"},{"t":"税收的成本：最明显的是支付的税收本身（不可避免的转移）；此外还有两种成本——税收扭曲人们决策从而引起无谓损失；纳税人在遵照税法纳税时承担的管理负担。有效率的税制是所引起的无谓损失和管理负担都很小的税制。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">税收的成本</strong>：最明显的是支付的税收本身（不可避免的转移）；此外还有两种成本——税收扭曲人们决策从而引起无谓损失；纳税人在遵照税法纳税时承担的管理负担。有效率的税制是所引起的无谓损失和管理负担都很小的税制。"},{"t":"12.2.1 无谓损失","c":[{"t":"定义：税收的无谓损失是纳税人经济福利的减少超过政府筹集到的收入的部分；是人们根据税收激励、而不是根据所买卖物品与服务的真实成本与收益配置资源时税收引起的无效率（呼应第8章）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定义</strong>：税收的无谓损失是纳税人经济福利的减少超过政府筹集到的收入的部分；是人们根据税收激励、而不是根据所买卖物品与服务的真实成本与收益配置资源时税收引起的无效率（呼应第8章）。"},{"t":"比萨饼例子：Jake对一块比萨饼评价8美元、Jane评价6美元，无税时价格5美元两人都买（总剩余4美元）；征2美元税后价格升至7美元，Jake仍买（剩余1美元）、Jane退出购买；政府得2美元税收，消费者总剩余减少3美元，无谓损失1美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">比萨饼例子</strong>：Jake对一块比萨饼评价8美元、Jane评价6美元，无税时价格5美元两人都买（总剩余4美元）；征2美元税后价格升至7美元，Jake仍买（剩余1美元）、Jane退出购买；政府得2美元税收，消费者总剩余减少3美元，无谓损失1美元。"},{"t":"关键结论：无谓损失不是来自纳税的人（Jake的剩余减少2美元正好被政府收入抵消），而是来自没有纳税、却因税收改变行为的人（Jane）——她的福利减少了，却没有可用于抵消的政府收入。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键结论</strong>：无谓损失不是来自纳税的人（Jake的剩余减少2美元正好被政府收入抵消），而是来自没有纳税、却因税收改变行为的人（Jane）——她的福利减少了，却没有可用于抵消的政府收入。"},{"t":"案例研究要点（应该对收入征税，还是应该对消费征税）：所得税既不鼓励勤奋工作也不鼓励储蓄——25岁的人存1000美元，8%利率40年后可得21720美元，若利息被征1/4的税，有效利率仅6%，40年后只有10290美元，不到一半；一些经济学家主张改对支出量征税，即消费税（consumption tax），储蓄在最后支出前不需纳税，不扭曲储蓄决策；美国税法已部分像消费税（个人退休账户、401(k)计划中收入及累积利息在退休支取前不纳税）；欧洲各国更多靠增值税（在生产各增值环节分段征收，类似零售税）；格林斯潘：从促进增长看消费税最好，会鼓励储蓄和资本形成，但转型面临挑战。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究要点</strong>（应该对收入征税，还是应该对消费征税）：所得税既不鼓励勤奋工作也不鼓励储蓄——25岁的人存1000美元，8%利率40年后可得21720美元，若利息被征1/4的税，有效利率仅6%，40年后只有10290美元，不到一半；一些经济学家主张改对支出量征税，即消费税（consumption tax），储蓄在最后支出前不需纳税，不扭曲储蓄决策；美国税法已部分像消费税（个人退休账户、401(k)计划中收入及累积利息在退休支取前不纳税）；欧洲各国更多靠增值税（在生产各增值环节分段征收，类似零售税）；格林斯潘：从促进增长看消费税最好，会鼓励储蓄和资本形成，但转型面临挑战。"}],"k":"b","i":1,"h":"12.2.1 无谓损失"},{"t":"12.2.2 管理负担","c":[{"t":"内容：税制的管理负担是其引起的无效率的一部分，包括填纳税申报表的时间、全年为税收保存记录的时间、政府实施税法所需的资源；许多高税率纳税人雇纳税律师和会计师——这是合法避税，不同于非法逃税。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">内容</strong>：税制的管理负担是其引起的无效率的一部分，包括填纳税申报表的时间、全年为税收保存记录的时间、政府实施税法所需的资源；许多高税率纳税人雇纳税律师和会计师——这是合法避税，不同于非法逃税。"},{"t":"漏洞：纳税顾问利用税法的细小条款即\"漏洞\"避税；漏洞或源于税法的含糊遗漏，或源于国会有选择的特殊对待（如联邦税法优待市政公债投资者）；一个人眼中的漏洞可能是另一人眼中的合理扣除。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">漏洞</strong>：纳税顾问利用税法的细小条款即&quot;漏洞&quot;避税；漏洞或源于税法的含糊遗漏，或源于国会有选择的特殊对待（如联邦税法优待市政公债投资者）；一个人眼中的漏洞可能是另一人眼中的合理扣除。"},{"t":"结论：专门用于遵从税法的资源是一种无谓损失——政府只得到缴纳的税金，纳税人还额外失去整理文件、计算和避税的时间与金钱；简化税法可减少管理负担，但政治上困难（人人都想消除有利于他人的漏洞、不愿放弃有利于自己的漏洞），特殊利益游说导致税法日趋复杂。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：专门用于遵从税法的资源是一种无谓损失——政府只得到缴纳的税金，纳税人还额外失去整理文件、计算和避税的时间与金钱；简化税法可减少管理负担，但政治上困难（人人都想消除有利于他人的漏洞、不愿放弃有利于自己的漏洞），特殊利益游说导致税法日趋复杂。"}],"k":"b","i":1,"h":"12.2.2 管理负担"},{"t":"12.2.3 边际税率与平均税率","c":[{"t":"平均税率（average tax rate）：支付的总税收除以总收入；衡量纳税人做出的牺牲（收入中用于纳税的比例），想知道纳税人的牺牲时用它合适。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">平均税率</strong>（average tax rate）：支付的总税收除以总收入；衡量纳税人做出的牺牲（收入中用于纳税的比例），想知道纳税人的牺牲时用它合适。"},{"t":"边际税率（marginal tax rate）：增加1美元收入所支付的额外税收；衡量税制在多大程度上扭曲激励——理性人考虑边际量，边际税率决定政府从增加的收入中拿走多少，因此决定所得税无谓损失的是边际税率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边际税率</strong>（marginal tax rate）：增加1美元收入所支付的额外税收；衡量税制在多大程度上扭曲激励——理性人考虑边际量，边际税率决定政府从增加的收入中拿走多少，因此决定所得税无谓损失的是边际税率。"},{"t":"算例：第一个5万美元收入征20%、超过部分征50%；收入6万美元者纳税1.5万美元（1万+0.5万），平均税率25%（1.5万/6万），边际税率50%（再多赚1美元缴0.5美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">算例</strong>：第一个5万美元收入征20%、超过部分征50%；收入6万美元者纳税1.5万美元（1万+0.5万），平均税率25%（1.5万/6万），边际税率50%（再多赚1美元缴0.5美元）。"}],"k":"b","i":1,"h":"12.2.3 边际税率与平均税率"},{"t":"12.2.4 定额税","c":[{"t":"定义：定额税（lump-sum tax）是对每个人等量征收的税收，无论其收入如何、采取什么行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定义</strong>：定额税（lump-sum tax）是对每个人等量征收的税收，无论其收入如何、采取什么行为。"},{"t":"两种税率的表现：对收入2万美元者，4000美元定额税的平均税率是20%；对收入4万美元者是10%；对两者边际税率都是零——收入增加1美元不改变应缴税额。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两种税率的表现</strong>：对收入2万美元者，4000美元定额税的平均税率是20%；对收入4万美元者是10%；对两者边际税率都是零——收入增加1美元不改变应缴税额。"},{"t":"效率：定额税可能是最有效率的税——个人决策不改变应纳税额，不扭曲激励、不引起无谓损失；人人都能轻易算出税额、无需雇纳税律师和会计师，管理负担最小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效率</strong>：定额税可能是最有效率的税——个人决策不改变应纳税额，不扭曲激励、不引起无谓损失；人人都能轻易算出税额、无需雇纳税律师和会计师，管理负担最小。"},{"t":"为何罕见：效率只是税制的一个目标；定额税对穷人和富人收取同样的量，大多数人认为这种结果不公平——由此引出税收政策的另一个主要目标：平等。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">为何罕见</strong>：效率只是税制的一个目标；定额税对穷人和富人收取同样的量，大多数人认为这种结果不公平——由此引出税收政策的另一个主要目标：平等。"}],"k":"b","i":1,"h":"12.2.4 定额税"}],"k":"sec","i":0,"h":"12.2 税收和效率"},{"t":"12.3 税收与平等","c":[{"t":"争论焦点：税收政策在美国政治中引起最激烈的争论，焦点很少是效率，而是税收负担应如何分配的分歧；人人都同意税制应该平等，但对如何判断税制的平等性存在许多分歧。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">争论焦点</strong>：税收政策在美国政治中引起最激烈的争论，焦点很少是效率，而是税收负担应如何分配的分歧；人人都同意税制应该平等，但对如何判断税制的平等性存在许多分歧。"},{"t":"12.3.1 受益原则","c":[{"t":"受益原则（benefits principle）：认为人们应该根据他们从政府服务中得到的收益来纳税的思想；它努力使公共物品在付费上与私人物品相似（常看电影的人买票花得多）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">受益原则</strong>（benefits principle）：认为人们应该根据他们从政府服务中得到的收益来纳税的思想；它努力使公共物品在付费上与私人物品相似（常看电影的人买票花得多）。"},{"t":"应用一（汽油税）：一些州的汽油税收入用于修建维护公路，买汽油多的人也是用路多的人，被视为为该政府服务付费的公平方法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用一</strong>（汽油税）：一些州的汽油税收入用于修建维护公路，买汽油多的人也是用路多的人，被视为为该政府服务付费的公平方法。"},{"t":"应用二（富人多纳税）：富人从警察保护（有更多财产需要保护）、防火、国防、法院系统等公共服务中受益更多，按受益原则应多缴维持费用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用二</strong>（富人多纳税）：富人从警察保护（有更多财产需要保护）、防火、国防、法院系统等公共服务中受益更多，按受益原则应多缴维持费用。"},{"t":"应用三（反贫困计划）：人们喜欢生活在没有贫困的社会中，反贫困计划是一种公共物品；若富人对这种公共物品的货币评价更高，受益原则也支持用富人纳的税为其提供资金。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用三</strong>（反贫困计划）：人们喜欢生活在没有贫困的社会中，反贫困计划是一种公共物品；若富人对这种公共物品的货币评价更高，受益原则也支持用富人纳的税为其提供资金。"}],"k":"b","i":1,"h":"12.3.1 受益原则"},{"t":"12.3.2 支付能力原则","c":[{"t":"支付能力原则（ability-to-pay principle）：认为应该根据一个人所能承受的负担来对其征税的思想；它支持所有公民做出\"平等的牺牲\"——穷人为1000美元税做出的牺牲可能大于富人为1万美元税的牺牲。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">支付能力原则</strong>（ability-to-pay principle）：认为应该根据一个人所能承受的负担来对其征税的思想；它支持所有公民做出&quot;平等的牺牲&quot;——穷人为1000美元税做出的牺牲可能大于富人为1万美元税的牺牲。"},{"t":"纵向平等（vertical equity）：主张支付能力更强的纳税人应该缴纳更多税收的思想。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">纵向平等</strong>（vertical equity）：主张支付能力更强的纳税人应该缴纳更多税收的思想。"},{"t":"纵向平等的三种税制形态：比例税（proportional tax）——所有纳税人按收入的相同比例纳税；累退税（regressive tax）——高收入纳税人缴纳的税收量虽大，但占收入的比例低于低收入者；累进税（progressive tax）——高收入纳税人缴纳的税收占收入的比例高于低收入者。三种税制下高收入者纳税额都更多，区别在税额随收入增加的速率；哪种最公平没有显而易见的答案，经济理论也无助于找出——\"平等和美丽一样，是情人眼里出西施\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">纵向平等的三种税制形态</strong>：比例税（proportional tax）——所有纳税人按收入的相同比例纳税；累退税（regressive tax）——高收入纳税人缴纳的税收量虽大，但占收入的比例低于低收入者；累进税（progressive tax）——高收入纳税人缴纳的税收占收入的比例高于低收入者。三种税制下高收入者纳税额都更多，区别在税额随收入增加的速率；哪种最公平没有显而易见的答案，经济理论也无助于找出——&quot;平等和美丽一样，是情人眼里出西施&quot;。"},{"t":"案例研究要点（如何分配税收负担，2011年CBO数据，含全部联邦税）：按收入把家庭分为五等分——最穷1/5家庭纳税占其收入1.9%，中等群体11.2%，最富1/5为23.4%，收入最高的1%达29.0%，美国联邦税制是累进的；最富1/5家庭赚到全部收入的51.9%、支付全部税收的68.7%，最高1%赚14.6%、付24%；货币还以转移支付形式流回家庭（转移支付是税收的反面），计入后最穷1/5家庭的平均税率变成相当大的负数（得到的转移支付远大于缴的税）——评价政府政策的累进性既要考虑人们所支付的、也要考虑人们所得到的；2012年底法案大幅提高顶端纳税人税收，最高1%家庭的税率将从29%升至33.3%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究要点</strong>（如何分配税收负担，2011年CBO数据，含全部联邦税）：按收入把家庭分为五等分——最穷1/5家庭纳税占其收入1.9%，中等群体11.2%，最富1/5为23.4%，收入最高的1%达29.0%，美国联邦税制是累进的；最富1/5家庭赚到全部收入的51.9%、支付全部税收的68.7%，最高1%赚14.6%、付24%；货币还以转移支付形式流回家庭（转移支付是税收的反面），计入后最穷1/5家庭的平均税率变成相当大的负数（得到的转移支付远大于缴的税）——评价政府政策的累进性既要考虑人们所支付的、也要考虑人们所得到的；2012年底法案大幅提高顶端纳税人税收，最高1%家庭的税率将从29%升至33.3%。"},{"t":"横向平等（horizontal equity）：主张有相似支付能力的纳税人应该缴纳等量税收的思想；实践难点在于必须先决定家庭之间的哪些差别与支付能力相关（收入同为10万美元、无孩子但有4万美元医疗支出的Smith家，与有四个孩子、6万美元学费支出的Jones家，缴同样的税是否公平）——美国所得税中有很多根据特定情况改变纳税义务的特殊条款。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">横向平等</strong>（horizontal equity）：主张有相似支付能力的纳税人应该缴纳等量税收的思想；实践难点在于必须先决定家庭之间的哪些差别与支付能力相关（收入同为10万美元、无孩子但有4万美元医疗支出的Smith家，与有四个孩子、6万美元学费支出的Jones家，缴同样的税是否公平）——美国所得税中有很多根据特定情况改变纳税义务的特殊条款。"}],"k":"b","i":1,"h":"12.3.2 支付能力原则"},{"t":"12.3.3 税收归宿与税收平等","c":[{"t":"税收归宿：对谁承担税收负担的研究，是评价税收平等性的核心问题；承受税收负担的人并不总是从政府收到税单的人——税收改变供给与需求，从而改变均衡价格，其影响超出法定纳税人；评价纵向平等与横向平等时必须把这些间接影响考虑在内。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">税收归宿</strong>：对谁承担税收负担的研究，是评价税收平等性的核心问题；承受税收负担的人并不总是从政府收到税单的人——税收改变供给与需求，从而改变均衡价格，其影响超出法定纳税人；评价纵向平等与横向平等时必须把这些间接影响考虑在内。"},{"t":"粘蝇纸理论：税收归宿的粘蝇纸理论认为税收负担像粘蝇纸上的苍蝇，被粘在它首次落下的地方；这种假设很少正确——对昂贵皮衣征税看似纵向平等（买者多为富人），但买者可轻易转向其他奢侈品时，负担将更多落在皮衣的生产者和卖者（多数工人并不富有）身上。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">粘蝇纸理论</strong>：税收归宿的粘蝇纸理论认为税收负担像粘蝇纸上的苍蝇，被粘在它首次落下的地方；这种假设很少正确——对昂贵皮衣征税看似纵向平等（买者多为富人），但买者可轻易转向其他奢侈品时，负担将更多落在皮衣的生产者和卖者（多数工人并不富有）身上。"},{"t":"案例研究要点（谁支付公司所得税）：公司所得税受欢迎部分因为它看上去由富有的公司支付，但个人支付所有税收——公司更像税收征集人而非纳税人；对汽车公司增税→利润减少→所有者减少对新厂投资（转投其他行业或国家）→汽车供给减少、对汽车工人的需求减少→汽车价格上升、工人工资下降；许多经济学家认为工人和顾客承担了公司所得税的大部分负担，而他们往往并不是富人——这正是粘蝇纸理论的危险所在。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究要点</strong>（谁支付公司所得税）：公司所得税受欢迎部分因为它看上去由富有的公司支付，但个人支付所有税收——公司更像税收征集人而非纳税人；对汽车公司增税→利润减少→所有者减少对新厂投资（转投其他行业或国家）→汽车供给减少、对汽车工人的需求减少→汽车价格上升、工人工资下降；许多经济学家认为工人和顾客承担了公司所得税的大部分负担，而他们往往并不是富人——这正是粘蝇纸理论的危险所在。"}],"k":"b","i":1,"h":"12.3.3 税收归宿与税收平等"}],"k":"sec","i":0,"h":"12.3 税收与平等"},{"t":"12.4 结论：平等与效率之间的权衡取舍","c":[{"t":"几乎人人都同意平等和效率是税制两个最重要的目标，但两者往往冲突，特别是以累进性评价平等时；人们对税收政策的分歧多源于对两目标侧重不同。","c":[],"k":"b","i":1,"h":"几乎人人都同意平等和效率是税制两个最重要的目标，但两者往往冲突，特别是以累进性评价平等时；人们对税收政策的分歧多源于对两目标侧重不同。"},{"t":"政治摆动的历史例证：里根1980年当选时最富美国人边际税率50%、利息收入70%，他认为高税率严重扭曲工作和储蓄激励，1981与1986年两度大幅减税，离任时最高边际税率仅28%；克林顿认为富人未缴公正份额（纵向平等），1993年把最高税率提高到约40%；布什部分扭转增税、降至35%；奥巴马2013年起把最高边际税率拉回约40%。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">政治摆动的历史例证</strong>：里根1980年当选时最富美国人边际税率50%、利息收入70%，他认为高税率严重扭曲工作和储蓄激励，1981与1986年两度大幅减税，离任时最高边际税率仅28%；克林顿认为富人未缴公正份额（纵向平等），1993年把最高税率提高到约40%；布什部分扭转增税、降至35%；奥巴马2013年起把最高边际税率拉回约40%。"},{"t":"经济学家的作用：单靠经济学不能确定平衡效率与平等目标的最好方法（还涉及政治哲学），但经济学家可以说明设计税制时社会面临的权衡取舍，并帮助避免那些牺牲了效率而从平等来看也没有任何好处的政策。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经济学家的作用</strong>：单靠经济学不能确定平衡效率与平等目标的最好方法（还涉及政治哲学），但经济学家可以说明设计税制时社会面临的权衡取舍，并帮助避免那些牺牲了效率而从平等来看也没有任何好处的政策。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">12.4 结论</strong>：平等与效率之间的权衡取舍"}],"k":"chap","h":"第12章 税制的设计"}],"k":"part","h":"第4篇 公共部门经济学","col":"#8b5cf6","pc":"p4"},{"t":"第5篇 企业行为与产业组织","c":[{"t":"第13章 生产成本","c":[{"t":"本章内容提要","c":[{"t":"企业的目标是利润最大化，利润等于总收益减总成本。","c":[],"k":"b","i":1,"h":"企业的目标是利润最大化，利润等于总收益减总成本。"},{"t":"分析企业行为时要包括生产的所有机会成本：一些是显性的（如支付给工人的工资），另一些是隐性的（如所有者在自己的企业工作而放弃的工资）；经济利润既考虑显性成本也考虑隐性成本，会计利润只考虑显性成本。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">分析企业行为时要包括生产的所有机会成本</strong>：一些是显性的（如支付给工人的工资），另一些是隐性的（如所有者在自己的企业工作而放弃的工资）；经济利润既考虑显性成本也考虑隐性成本，会计利润只考虑显性成本。"},{"t":"企业的成本反映其生产过程：随着投入量增加，典型企业的生产函数越来越平坦（边际产量递减），因此总成本曲线随产量增加变得越来越陡峭。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">企业的成本反映其生产过程</strong>：随着投入量增加，典型企业的生产函数越来越平坦（边际产量递减），因此总成本曲线随产量增加变得越来越陡峭。"},{"t":"总成本可分为固定成本与可变成本；由此可导出两种相关衡量指标——平均总成本（总成本除以产量）与边际成本（产量增加一单位时总成本的增加量）。","c":[],"k":"b","i":1,"h":"总成本可分为固定成本与可变成本；由此可导出两种相关衡量指标——平均总成本（总成本除以产量）与边际成本（产量增加一单位时总成本的增加量）。"},{"t":"对典型企业：边际成本随产量增加而上升，平均总成本先下降后上升（U形），边际成本曲线总是与平均总成本曲线相交于平均总成本的最低点。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对典型企业</strong>：边际成本随产量增加而上升，平均总成本先下降后上升（U形），边际成本曲线总是与平均总成本曲线相交于平均总成本的最低点。"},{"t":"企业成本取决于所考虑的时间范围：许多成本在短期中固定、在长期中可变，短期平均总成本比长期增加得更快；长期平均总成本曲线的形状揭示规模经济、规模收益不变与规模不经济。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">企业成本取决于所考虑的时间范围</strong>：许多成本在短期中固定、在长期中可变，短期平均总成本比长期增加得更快；长期平均总成本曲线的形状揭示规模经济、规模收益不变与规模不经济。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"13.1 什么是成本","c":[{"t":"13.1.1 总收益、总成本和利润","c":[{"t":"总收益（total revenue）：企业出售其产品所得到的货币量，等于产量乘以价格（1万块糕点×每块2美元=2万美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总收益</strong>（total revenue）：企业出售其产品所得到的货币量，等于产量乘以价格（1万块糕点×每块2美元=2万美元）。"},{"t":"总成本（total cost）：企业用于生产的投入品（面粉、糖、工人劳动、烤箱等）的市场价值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总成本</strong>（total cost）：企业用于生产的投入品（面粉、糖、工人劳动、烤箱等）的市场价值。"},{"t":"利润（profit）：总收益减去总成本；经济学家通常假设企业的目标是利润最大化，这一假设在大多数情况下效果很好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利润</strong>（profit）：总收益减去总成本；经济学家通常假设企业的目标是利润最大化，这一假设在大多数情况下效果很好。"}],"k":"b","i":1,"h":"13.1.1 总收益、总成本和利润"},{"t":"13.1.2 作为机会成本的成本","c":[{"t":"核心原理：某种东西的成本是你为了得到它所放弃的东西——经济学家提到企业生产成本时，包括企业生产其物品与服务的所有机会成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心原理</strong>：某种东西的成本是你为了得到它所放弃的东西——经济学家提到企业生产成本时，包括企业生产其物品与服务的所有机会成本。"},{"t":"显性成本（explicit costs）：需要企业支出货币的投入成本，如Caroline买面粉的1000美元、支付给工人的工资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">显性成本</strong>（explicit costs）：需要企业支出货币的投入成本，如Caroline买面粉的1000美元、支付给工人的工资。"},{"t":"隐性成本（implicit costs）：不需要企业支出货币的投入成本，如精通电脑的Caroline在糕点厂工作每小时放弃的100美元程序员收入。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">隐性成本</strong>（implicit costs）：不需要企业支出货币的投入成本，如精通电脑的Caroline在糕点厂工作每小时放弃的100美元程序员收入。"},{"t":"总成本=显性成本+隐性成本；经济学家衡量全部机会成本（因其影响生产与定价决策），会计师只记录流入和流出企业的货币、往往忽略隐性成本。","c":[],"k":"b","i":2,"h":"总成本=显性成本+隐性成本；经济学家衡量全部机会成本（因其影响生产与定价决策），会计师只记录流入和流出企业的货币、往往忽略隐性成本。"}],"k":"b","i":1,"h":"13.1.2 作为机会成本的成本"},{"t":"13.1.3 作为一种机会成本的资本成本","c":[{"t":"已投资于企业的金融资本的机会成本，是几乎每个企业都有的一项重要隐性成本：Caroline用30万美元储蓄买下糕点厂，就放弃了按5%利率每年1.5万美元的利息收入；会计师不把这1.5万美元列为成本（没有货币流出企业），经济学家将其计为隐性成本。","c":[],"k":"b","i":2,"h":"已投资于企业的金融资本的机会成本，是几乎每个企业都有的一项重要隐性成本：Caroline用30万美元储蓄买下糕点厂，就放弃了按5%利率每年1.5万美元的利息收入；会计师不把这1.5万美元列为成本（没有货币流出企业），经济学家将其计为隐性成本。"},{"t":"变体：若Caroline只有10万美元储蓄、以5%利率从银行借20万美元——会计师只把每年1万美元贷款利息计为显性成本；经济学家认为拥有企业的机会成本仍是1.5万美元=支付的银行贷款利息（显性1万美元）+放弃的储蓄利息（隐性5000美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">变体</strong>：若Caroline只有10万美元储蓄、以5%利率从银行借20万美元——会计师只把每年1万美元贷款利息计为显性成本；经济学家认为拥有企业的机会成本仍是1.5万美元=支付的银行贷款利息（显性1万美元）+放弃的储蓄利息（隐性5000美元）。"}],"k":"b","i":1,"h":"13.1.3 作为一种机会成本的资本成本"},{"t":"13.1.4 经济利润与会计利润","c":[{"t":"经济利润（economic profit）：总收益减去总成本，包括显性成本与隐性成本（即减去生产的全部机会成本）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济利润</strong>（economic profit）：总收益减去总成本，包括显性成本与隐性成本（即减去生产的全部机会成本）。"},{"t":"会计利润（accounting profit）：总收益仅仅减去企业的显性成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">会计利润</strong>（accounting profit）：总收益仅仅减去企业的显性成本。"},{"t":"关系：因会计师忽略隐性成本，会计利润通常大于经济利润；从经济学家的角度看，要使企业有利可图，总收益必须弥补全部机会成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关系</strong>：因会计师忽略隐性成本，会计利润通常大于经济利润；从经济学家的角度看，要使企业有利可图，总收益必须弥补全部机会成本。"},{"t":"意义：正经济利润是企业供给物品与服务的动机所在——获得正经济利润的企业将继续经营；经济亏损（经济利润为负）时所有者收入不足以弥补所有生产成本，除非条件改变，最终将关闭企业并退出该行业；了解企业决策必须紧盯经济利润。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">意义</strong>：正经济利润是企业供给物品与服务的动机所在——获得正经济利润的企业将继续经营；经济亏损（经济利润为负）时所有者收入不足以弥补所有生产成本，除非条件改变，最终将关闭企业并退出该行业；了解企业决策必须紧盯经济利润。"}],"k":"b","i":1,"h":"13.1.4 经济利润与会计利润"}],"k":"sec","i":0,"h":"13.1 什么是成本"},{"t":"13.2 生产与成本","c":[{"t":"简化假设：工厂规模固定，Caroline只能通过改变工人数量改变糕点产量——该假设短期现实、长期不现实，故本节描述的是短期中的生产决策。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">简化假设</strong>：工厂规模固定，Caroline只能通过改变工人数量改变糕点产量——该假设短期现实、长期不现实，故本节描述的是短期中的生产决策。"},{"t":"13.2.1 生产函数","c":[{"t":"生产函数（production function）：用于生产一种物品的投入量与该物品产量之间的关系（0个工人产0块、1个工人50块、2个工人90块、3个工人120块……）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">生产函数</strong>（production function）：用于生产一种物品的投入量与该物品产量之间的关系（0个工人产0块、1个工人50块、2个工人90块、3个工人120块……）。"},{"t":"边际产量（marginal product）：增加一单位投入所引起的产量增加——第2个工人的边际产量是40块（90−50），第3个是30块。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边际产量</strong>（marginal product）：增加一单位投入所引起的产量增加——第2个工人的边际产量是40块（90−50），第3个是30块。"},{"t":"边际产量递减（diminishing marginal product）：一种投入的边际产量随着投入量增加而减少的特征——工人增多后不得不共享设备、在拥挤的厨房工作甚至相互妨碍，每个增量工人的贡献越来越小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边际产量递减</strong>（diminishing marginal product）：一种投入的边际产量随着投入量增加而减少的特征——工人增多后不得不共享设备、在拥挤的厨房工作甚至相互妨碍，每个增量工人的贡献越来越小。"},{"t":"图形结论：生产函数的斜率（\"向上量比向前量\"）衡量工人的边际产量；随边际产量递减，生产函数随工人增加变得越来越平坦。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>：生产函数的斜率（&quot;向上量比向前量&quot;）衡量工人的边际产量；随边际产量递减，生产函数随工人增加变得越来越平坦。"}],"k":"b","i":1,"h":"13.2.1 生产函数"},{"t":"13.2.2 从生产函数到总成本曲线","c":[{"t":"数字设定：工厂成本每小时30美元、每个工人每小时10美元；雇1个工人总成本每小时40美元，2个工人50美元，以此类推；总成本曲线表示产量与生产总成本之间的关系。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数字设定</strong>：工厂成本每小时30美元、每个工人每小时10美元；雇1个工人总成本每小时40美元，2个工人50美元，以此类推；总成本曲线表示产量与生产总成本之间的关系。"},{"t":"生产函数与总成本曲线是同一枚硬币的正反面：随产量增加，生产函数越来越平坦，而总成本曲线越来越陡峭；两条曲线斜率的变化同出于一个原因——边际产量递减（厨房拥挤时，多生产一块糕点要求增加更多工人，成本随之增加）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">生产函数与总成本曲线是同一枚硬币的正反面</strong>：随产量增加，生产函数越来越平坦，而总成本曲线越来越陡峭；两条曲线斜率的变化同出于一个原因——边际产量递减（厨房拥挤时，多生产一块糕点要求增加更多工人，成本随之增加）。"}],"k":"b","i":1,"h":"13.2.2 从生产函数到总成本曲线"}],"k":"sec","i":0,"h":"13.2 生产与成本"},{"t":"13.3 成本的各种衡量指标","c":[{"t":"13.3.1 固定成本与可变成本","c":[{"t":"固定成本（fixed costs）：不随着产量变动而变动的成本，即使企业根本不生产也要发生——如Conrad的租金、簿记员的薪水（例中为每小时3美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">固定成本</strong>（fixed costs）：不随着产量变动而变动的成本，即使企业根本不生产也要发生——如Conrad的租金、簿记员的薪水（例中为每小时3美元）。"},{"t":"可变成本（variable costs）：随着产量变动而变动的成本——如咖啡豆、牛奶、糖、纸杯的成本和增雇工人的薪水；不生产时可变成本为零。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">可变成本</strong>（variable costs）：随着产量变动而变动的成本——如咖啡豆、牛奶、糖、纸杯的成本和增雇工人的薪水；不生产时可变成本为零。"},{"t":"企业总成本=固定成本+可变成本。","c":[],"k":"b","i":2,"h":"企业总成本=固定成本+可变成本。"}],"k":"b","i":1,"h":"13.3.1 固定成本与可变成本"},{"t":"13.3.2 平均成本与边际成本","c":[{"t":"平均总成本（average total cost）：总成本除以产量（ATC=TC/Q），回答\"生产普通的一单位产品需要多少成本\"；因总成本=固定成本+可变成本，故ATC=平均固定成本+平均可变成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">平均总成本</strong>（average total cost）：总成本除以产量（ATC=TC/Q），回答&quot;生产普通的一单位产品需要多少成本&quot;；因总成本=固定成本+可变成本，故ATC=平均固定成本+平均可变成本。"},{"t":"平均固定成本（average fixed cost）：固定成本除以产量（AFC=FC/Q）；平均可变成本（average variable cost）：可变成本除以产量（AVC=VC/Q）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">平均固定成本</strong>（average fixed cost）：固定成本除以产量（AFC=FC/Q）；平均可变成本（average variable cost）：可变成本除以产量（AVC=VC/Q）。"},{"t":"边际成本（marginal cost）：额外一单位产量所引起的总成本的增加（MC=ΔTC/ΔQ），回答\"多生产一单位产品需要多少成本\"；例：产量从2杯增至3杯，总成本从3.8美元增至4.5美元，第3杯的边际成本为0.7美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边际成本</strong>（marginal cost）：额外一单位产量所引起的总成本的增加（MC=ΔTC/ΔQ），回答&quot;多生产一单位产品需要多少成本&quot;；例：产量从2杯增至3杯，总成本从3.8美元增至4.5美元，第3杯的边际成本为0.7美元。"},{"t":"这两组指标对企业决定向市场供给多少产品至关重要（下一章展开）。","c":[],"k":"b","i":2,"h":"这两组指标对企业决定向市场供给多少产品至关重要（下一章展开）。"}],"k":"b","i":1,"h":"13.3.2 平均成本与边际成本"},{"t":"13.3.3 成本曲线及其形状","c":[{"t":"递增的边际成本：MC随产量增加而上升，正的斜率反映边际产量递减——产量低时设备闲置、增雇工人边际产量大而边际成本低；产量高时车间拥挤、设备充分利用，增量工人边际产量小而边际成本大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">递增的边际成本</strong>：MC随产量增加而上升，正的斜率反映边际产量递减——产量低时设备闲置、增雇工人边际产量大而边际成本低；产量高时车间拥挤、设备充分利用，增量工人边际产量小而边际成本大。"},{"t":"U形平均总成本：AFC总是随产量增加而下降（固定成本分摊到更多单位产品上），AVC一般随产量增加而增加（边际产量递减）；产量很低时AFC占主导使ATC高，产量很高时AVC上升占主导，两者的\"拉锯战\"使ATC呈U形（例中产量达每小时5杯时ATC降到最低1.3美元，超过6杯后AVC的增加开始起决定性作用）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">U形平均总成本</strong>：AFC总是随产量增加而下降（固定成本分摊到更多单位产品上），AVC一般随产量增加而增加（边际产量递减）；产量很低时AFC占主导使ATC高，产量很高时AVC上升占主导，两者的&quot;拉锯战&quot;使ATC呈U形（例中产量达每小时5杯时ATC降到最低1.3美元，超过6杯后AVC的增加开始起决定性作用）。"},{"t":"有效规模（efficient scale）：使平均总成本最小的产量——Conrad的有效规模是每小时5杯或6杯咖啡；产量低于它时ATC高因固定成本分摊在少量产品上，高于它时ATC高因投入品的边际产量大大递减。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有效规模</strong>（efficient scale）：使平均总成本最小的产量——Conrad的有效规模是每小时5杯或6杯咖啡；产量低于它时ATC高因固定成本分摊在少量产品上，高于它时ATC高因投入品的边际产量大大递减。"},{"t":"边际成本与平均总成本之间的关系：只要MC小于ATC，ATC就下降；只要MC大于ATC，ATC就上升（类比：边际成本像下一门课的成绩，平均总成本像累积平均绩点——低于平均的成绩拉低绩点，高于平均的拉高绩点），这对所有企业都正确。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边际成本与平均总成本之间的关系</strong>：只要MC小于ATC，ATC就下降；只要MC大于ATC，ATC就上升（类比：边际成本像下一门课的成绩，平均总成本像累积平均绩点——低于平均的成绩拉低绩点，高于平均的拉高绩点），这对所有企业都正确。"},{"t":"推论：边际成本曲线与平均总成本曲线相交于ATC曲线的最低点——交点之前MC低于ATC使ATC下降，交点之后MC高于ATC使ATC上升；这个最低平均总成本点在下一章对竞争企业的分析中起关键作用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推论</strong>：边际成本曲线与平均总成本曲线相交于ATC曲线的最低点——交点之前MC低于ATC使ATC下降，交点之后MC高于ATC使ATC上升；这个最低平均总成本点在下一章对竞争企业的分析中起关键作用。"}],"k":"b","i":1,"h":"13.3.3 成本曲线及其形状"},{"t":"13.3.4 典型的成本曲线","c":[{"t":"现实补充：许多企业并非雇第一个工人后边际产量立即递减——第二个或第三个工人的边际产量可能高于第一个（团队分工比单人更有生产率），因此企业在边际产量递减之前会先经历一段边际产量递增。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现实补充</strong>：许多企业并非雇第一个工人后边际产量立即递减——第二个或第三个工人的边际产量可能高于第一个（团队分工比单人更有生产率），因此企业在边际产量递减之前会先经历一段边际产量递增。"},{"t":"相应图形：低产量时MC曲线下降（边际产量递增），之后上升（边际产量递减）；边际产量的先递增后递减也使AVC呈U形；MC与AVC在上升前都有一段时间下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">相应图形</strong>：低产量时MC曲线下降（边际产量递增），之后上升（边际产量递减）；边际产量的先递增后递减也使AVC呈U形；MC与AVC在上升前都有一段时间下降。"},{"t":"三个应记住的最重要共同特征：随产量增加边际成本最终会上升；平均总成本曲线是U形的；边际成本曲线与平均总成本曲线相交于平均总成本曲线的最低点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三个应记住的最重要共同特征</strong>：随产量增加边际成本最终会上升；平均总成本曲线是U形的；边际成本曲线与平均总成本曲线相交于平均总成本曲线的最低点。"}],"k":"b","i":1,"h":"13.3.4 典型的成本曲线"}],"k":"sec","i":0,"h":"13.3 成本的各种衡量指标"},{"t":"13.4 短期成本与长期成本","c":[{"t":"13.4.1 短期与长期平均总成本之间的关系","c":[{"t":"固定与可变的划分取决于时间范围：福特公司在只有几个月的短期中不能调整工厂数量与规模，多产汽车只能多雇工人，工厂成本是固定成本；在几年的长期中可扩厂、建新厂、关旧厂，工厂成本成为可变成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">固定与可变的划分取决于时间范围</strong>：福特公司在只有几个月的短期中不能调整工厂数量与规模，多产汽车只能多雇工人，工厂成本是固定成本；在几年的长期中可扩厂、建新厂、关旧厂，工厂成本成为可变成本。"},{"t":"图形结论：长期平均总成本曲线是比短期平均总成本曲线平坦得多的U形曲线，且所有短期成本曲线都在长期曲线上或以上——因为长期中企业有更大灵活性，可以选择自己想要的短期成本曲线；短期中只能使用过去的选择所决定的那一条。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>：长期平均总成本曲线是比短期平均总成本曲线平坦得多的U形曲线，且所有短期成本曲线都在长期曲线上或以上——因为长期中企业有更大灵活性，可以选择自己想要的短期成本曲线；短期中只能使用过去的选择所决定的那一条。"},{"t":"算例：日产量从1000辆增至1200辆，短期只能在现有中型工厂多雇工人，因边际产量递减每辆车ATC从1万美元升至1.2万美元；长期可扩大工厂和劳动力规模，使ATC回到1万美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">算例</strong>：日产量从1000辆增至1200辆，短期只能在现有中型工厂多雇工人，因边际产量递减每辆车ATC从1万美元升至1.2万美元；长期可扩大工厂和劳动力规模，使ATC回到1万美元。"},{"t":"进入长期所需时间因企业而异：大型制造业企业（汽车公司）建更大的工厂可能要一年以上，咖啡店主几天内就能再买一台咖啡机——没有唯一答案。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">进入长期所需时间因企业而异</strong>：大型制造业企业（汽车公司）建更大的工厂可能要一年以上，咖啡店主几天内就能再买一台咖啡机——没有唯一答案。"}],"k":"b","i":1,"h":"13.4.1 短期与长期平均总成本之间的关系"},{"t":"13.4.2 规模经济与规模不经济","c":[{"t":"规模经济（economies of scale）：长期平均总成本随产量增加而减少的特性；产生原因是较高的产量水平允许在工人中实现专业化，专业化使工人更精通某项工作（福特可用现代化流水线降低成本）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规模经济</strong>（economies of scale）：长期平均总成本随产量增加而减少的特性；产生原因是较高的产量水平允许在工人中实现专业化，专业化使工人更精通某项工作（福特可用现代化流水线降低成本）。"},{"t":"规模不经济（diseconomies of scale）：长期平均总成本随产量增加而增加的特性；产生原因是任何大型组织中固有的协调问题（汽车产量越多管理团队越庞大，管理者压低成本的效率越低）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规模不经济</strong>（diseconomies of scale）：长期平均总成本随产量增加而增加的特性；产生原因是任何大型组织中固有的协调问题（汽车产量越多管理团队越庞大，管理者压低成本的效率越低）。"},{"t":"规模收益不变（constant returns to scale）：长期平均总成本不随产量变动而变动的特性；福特在产量低时有规模经济、中等产量时规模收益不变、产量高时规模不经济。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规模收益不变</strong>（constant returns to scale）：长期平均总成本不随产量变动而变动的特性；福特在产量低时有规模经济、中等产量时规模收益不变、产量高时规模不经济。"},{"t":"长期ATC通常U形的原因：产量低时下降是因为专业化程度提高（协调问题不尖锐）；产量高时上升是因为专业化的好处已实现而协调问题越来越严重。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长期ATC通常U形的原因</strong>：产量低时下降是因为专业化程度提高（协调问题不尖锐）；产量高时上升是因为专业化的好处已实现而协调问题越来越严重。"},{"t":"参考资料要点（针厂的经验）：\"样样通，样样松\"——斯密在《国富论》中描述针厂分工：一人抽铁丝、一人拉直、一人截断、一人削尖、一人磨光顶端，装圆头、涂白、装盒各有专门工序；因专业化，每工人每天能生产成千上万枚针，若独立工作\"每人每天肯定不能制造出20枚针，或许连1枚也造不出来\"；大针厂比小针厂人均产量更高、每枚针平均成本更低；专业化实现规模经济正是现代社会如此繁荣的原因之一（如建房由建筑商雇木工、水暖工、电工、油漆工分工完成）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料要点</strong>（针厂的经验）：&quot;样样通，样样松&quot;——斯密在《国富论》中描述针厂分工：一人抽铁丝、一人拉直、一人截断、一人削尖、一人磨光顶端，装圆头、涂白、装盒各有专门工序；因专业化，每工人每天能生产成千上万枚针，若独立工作&quot;每人每天肯定不能制造出20枚针，或许连1枚也造不出来&quot;；大针厂比小针厂人均产量更高、每枚针平均成本更低；专业化实现规模经济正是现代社会如此繁荣的原因之一（如建房由建筑商雇木工、水暖工、电工、油漆工分工完成）。"}],"k":"b","i":1,"h":"13.4.2 规模经济与规模不经济"}],"k":"sec","i":0,"h":"13.4 短期成本与长期成本"},{"t":"13.5 结论","c":[{"t":"本章提供研究企业如何做出生产与定价决策的工具：现在应懂得经济学家所用\"成本\"一词的含义，以及成本如何随企业产量变动而变动（边际成本、平均总成本等诸定义可汇总成表）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章提供研究企业如何做出生产与定价决策的工具</strong>：现在应懂得经济学家所用&quot;成本&quot;一词的含义，以及成本如何随企业产量变动而变动（边际成本、平均总成本等诸定义可汇总成表）。"},{"t":"成本曲线本身并不能告诉我们企业将做出什么决策，但它是这种决策的重要组成部分——下一章的铺垫。","c":[],"k":"b","i":1,"h":"成本曲线本身并不能告诉我们企业将做出什么决策，但它是这种决策的重要组成部分——下一章的铺垫。"}],"k":"sec","i":0,"h":"13.5 结论"}],"k":"chap","h":"第13章 生产成本"},{"t":"第14章 竞争市场上的企业","c":[{"t":"本章内容提要","c":[{"t":"竞争企业是价格接受者，其收益与产量成比例：物品的价格既等于企业的平均收益，也等于边际收益（P=AR=MR）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">竞争企业是价格接受者，其收益与产量成比例</strong>：物品的价格既等于企业的平均收益，也等于边际收益（P=AR=MR）。"},{"t":"利润最大化的通用法则是边际收益等于边际成本（MR=MC）；由于竞争企业的边际收益等于市场价格，企业选择使边际成本等于价格的产量，因此边际成本曲线就是竞争企业的供给曲线。","c":[],"k":"b","i":1,"h":"利润最大化的通用法则是边际收益等于边际成本（MR=MC）；由于竞争企业的边际收益等于市场价格，企业选择使边际成本等于价格的产量，因此边际成本曲线就是竞争企业的供给曲线。"},{"t":"短期中，当企业不能收回固定成本时，若价格低于平均可变成本（P<AVC），企业暂时停止营业；长期中，若价格低于平均总成本（P<ATC），企业退出市场。","c":[],"k":"b","i":1,"h":"短期中，当企业不能收回固定成本时，若价格低于平均可变成本（P&lt;AVC），企业暂时停止营业；长期中，若价格低于平均总成本（P&lt;ATC），企业退出市场。"},{"t":"在可以自由进入与退出的市场上，长期中经济利润为零：所有企业都在有效规模上生产，价格等于最低平均总成本，企业数量自发调整以满足该价格下的需求量。","c":[],"k":"b","i":1,"h":"在可以自由进入与退出的市场上，长期中经济利润为零：所有企业都在有效规模上生产，价格等于最低平均总成本，企业数量自发调整以满足该价格下的需求量。"},{"t":"需求变动在不同时间范围内影响不同：短期中需求增加推高价格并带来利润、需求减少压低价格并带来亏损；但只要企业能自由进入退出，长期中企业数量会自发调整，使市场回到零利润均衡；长期供给曲线一般比短期更富有弹性。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">需求变动在不同时间范围内影响不同</strong>：短期中需求增加推高价格并带来利润、需求减少压低价格并带来亏损；但只要企业能自由进入退出，长期中企业数量会自发调整，使市场回到零利润均衡；长期供给曲线一般比短期更富有弹性。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"14.1 什么是竞争市场","c":[{"t":"14.1.1 竞争的含义","c":[{"t":"竞争市场（competitive market）：有许多交易相同物品的买者与卖者、以至于每一个买者与卖者都是价格接受者的市场；又称完全竞争市场。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">竞争市场</strong>（competitive market）：有许多交易相同物品的买者与卖者、以至于每一个买者与卖者都是价格接受者的市场；又称完全竞争市场。"},{"t":"两个基本特征：市场上有许多买者和许多卖者；各个卖者提供的物品大体上是相同的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个基本特征</strong>：市场上有许多买者和许多卖者；各个卖者提供的物品大体上是相同的。"},{"t":"由这两个条件，任何一个买者或卖者的行为对市场价格的影响都可以忽略不计，每个买者和卖者都把市场价格当作既定的。","c":[],"k":"b","i":2,"h":"由这两个条件，任何一个买者或卖者的行为对市场价格的影响都可以忽略不计，每个买者和卖者都把市场价格当作既定的。"},{"t":"价格接受者（price taker）：接受市场决定价格的买者或卖者；以牛奶市场为例，卖者可按现行价格卖出想卖的所有量，没有理由收低价，收取高价则买者会到别处购买。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">价格接受者</strong>（price taker）：接受市场决定价格的买者或卖者；以牛奶市场为例，卖者可按现行价格卖出想卖的所有量，没有理由收低价，收取高价则买者会到别处购买。"},{"t":"第三个特征（仅完全竞争需要）：企业可以自由地进入或退出市场；该条件对\"企业成为价格接受者\"并非必要，但自由进入与退出是影响长期均衡的强大力量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第三个特征</strong>（仅完全竞争需要）：企业可以自由地进入或退出市场；该条件对&quot;企业成为价格接受者&quot;并非必要，但自由进入与退出是影响长期均衡的强大力量。"},{"t":"与此相对，能影响其出售物品市场价格的企业拥有市场势力（market power）——本章开篇以加油站（提价20%销量大跌）与自来水公司（提价20%销量略降）对比引出，前者竞争、后者有市场势力。","c":[],"k":"b","i":2,"h":"与此相对，能影响其出售物品市场价格的企业拥有市场势力（market power）——本章开篇以加油站（提价20%销量大跌）与自来水公司（提价20%销量略降）对比引出，前者竞争、后者有市场势力。"}],"k":"b","i":1,"h":"14.1.1 竞争的含义"},{"t":"14.1.2 竞争企业的收益","c":[{"t":"以Vaca家庭牛奶场为例：总收益 TR=P×Q；牛奶价格不取决于该牛奶场的产量，故总收益与产量同比例变动（产量翻番，价格不变，总收益翻番）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">以Vaca家庭牛奶场为例</strong>：总收益 TR=P×Q；牛奶价格不取决于该牛奶场的产量，故总收益与产量同比例变动（产量翻番，价格不变，总收益翻番）。"},{"t":"平均收益（average revenue）：总收益除以销售量，AR=TR/Q=(P×Q)/Q=P；这不仅适用于竞争企业，对所有企业而言，平均收益总等于物品的价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">平均收益</strong>（average revenue）：总收益除以销售量，AR=TR/Q=(P×Q)/Q=P；这不仅适用于竞争企业，对所有企业而言，平均收益总等于物品的价格。"},{"t":"边际收益（marginal revenue）：增加一单位销售量所引起的总收益变动量，MR=ΔTR/ΔQ；对竞争企业，P固定，产量每增加一单位总收益就增加P，因此边际收益等于物品的价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边际收益</strong>（marginal revenue）：增加一单位销售量所引起的总收益变动量，MR=ΔTR/ΔQ；对竞争企业，P固定，产量每增加一单位总收益就增加P，因此边际收益等于物品的价格。"},{"t":"图形结论：竞争企业面对一条水平的需求曲线（在该市场价格上完全富有弹性），且有 P=AR=MR。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>：竞争企业面对一条水平的需求曲线（在该市场价格上完全富有弹性），且有 P=AR=MR。"},{"t":"即问即答：当竞争企业的销售量翻一番时，产品价格不变，总收益翻一番。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答</strong>：当竞争企业的销售量翻一番时，产品价格不变，总收益翻一番。"}],"k":"b","i":1,"h":"14.1.2 竞争企业的收益"}],"k":"sec","i":0,"h":"14.1 什么是竞争市场"},{"t":"14.2 利润最大化与竞争企业的供给曲线","c":[{"t":"14.2.1 一个简单的利润最大化例子","c":[{"t":"Vaca牛奶场数字实例（牛奶价格每加仑6美元，固定成本3美元）：逐加仑比较边际收益与边际成本，只要MR>MC，增产就增加利润；生产4或5加仑时利润最大，为7美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">Vaca牛奶场数字实例</strong>（牛奶价格每加仑6美元，固定成本3美元）：逐加仑比较边际收益与边际成本，只要MR&gt;MC，增产就增加利润；生产4或5加仑时利润最大，为7美元。"},{"t":"第6加仑的边际收益为6美元、边际成本为7美元，生产它使利润减少1美元，故产量不会超过5加仑。","c":[],"k":"b","i":2,"h":"第6加仑的边际收益为6美元、边际成本为7美元，生产它使利润减少1美元，故产量不会超过5加仑。"},{"t":"这是经济学十大原理之一\"理性人考虑边际量\"的运用：MR>MC（产量1、2、3加仑）则增产，MR<MC（产量6、7、8加仑）则减产，逐步调整即自然落在利润最大化产量上。","c":[],"k":"b","i":2,"h":"这是经济学十大原理之一&quot;理性人考虑边际量&quot;的运用：MR&gt;MC（产量1、2、3加仑）则增产，MR&lt;MC（产量6、7、8加仑）则减产，逐步调整即自然落在利润最大化产量上。"}],"k":"b","i":1,"h":"14.2.1 一个简单的利润最大化例子"},{"t":"14.2.2 边际成本曲线和企业的供给决策","c":[{"t":"成本曲线三特征：边际成本曲线（MC）向右上方倾斜；平均总成本曲线（ATC）呈U形；MC与ATC相交于ATC的最低点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成本曲线三特征</strong>：边际成本曲线（MC）向右上方倾斜；平均总成本曲线（ATC）呈U形；MC与ATC相交于ATC的最低点。"},{"t":"市场价格P表现为一条水平线，因为竞争企业是价格接受者——无论生产多少价格都相同；且对该企业 P=AR=MR。","c":[],"k":"b","i":2,"h":"市场价格P表现为一条水平线，因为竞争企业是价格接受者——无论生产多少价格都相同；且对该企业 P=AR=MR。"},{"t":"利润最大化的三个一般性规律（适用于任何利润最大化企业）：若MR>MC，企业应增加产量；若MC>MR，企业应减少产量；在利润最大化的产量水平，MR与MC正好相等。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利润最大化的三个一般性规律</strong>（适用于任何利润最大化企业）：若MR&gt;MC，企业应增加产量；若MC&gt;MR，企业应减少产量；在利润最大化的产量水平，MR与MC正好相等。"},{"t":"竞争企业对任何既定价格，通过价格与边际成本曲线的交点找出利润最大化产量；价格上升（P1→P2）时产量沿MC曲线增加（Q1→Q2）。","c":[],"k":"b","i":2,"h":"竞争企业对任何既定价格，通过价格与边际成本曲线的交点找出利润最大化产量；价格上升（P1→P2）时产量沿MC曲线增加（Q1→Q2）。"},{"t":"图形结论：由于边际成本曲线决定了企业在任何一种既定价格时愿意供给的数量，边际成本曲线就是竞争企业的供给曲线（有限制条件，见14.2.3与14.2.5）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>：由于边际成本曲线决定了企业在任何一种既定价格时愿意供给的数量，边际成本曲线就是竞争企业的供给曲线（有限制条件，见14.2.3与14.2.5）。"}],"k":"b","i":1,"h":"14.2.2 边际成本曲线和企业的供给决策"},{"t":"14.2.3 企业的短期停止营业决策","c":[{"t":"停止营业（shutdown）：由于当前市场条件而导致企业在某个特定时期不生产任何东西的短期决策；退出（exit）：企业离开市场的长期决策。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">停止营业</strong>（shutdown）：由于当前市场条件而导致企业在某个特定时期不生产任何东西的短期决策；退出（exit）：企业离开市场的长期决策。"},{"t":"两类决策区别的根源：大多数企业短期中不能避开固定成本、长期中可以；暂时停止营业的企业仍必须支付固定成本，而退出市场的企业可变成本、固定成本都不必支付。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两类决策区别的根源</strong>：大多数企业短期中不能避开固定成本、长期中可以；暂时停止营业的企业仍必须支付固定成本，而退出市场的企业可变成本、固定成本都不必支付。"},{"t":"农民与土地的例子：荒废一季时土地成本无法弥补，此时土地的固定成本是沉没成本；若完全离开农业则可出售土地，故长期退出决策中土地成本并未沉没。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">农民与土地的例子</strong>：荒废一季时土地成本无法弥补，此时土地的固定成本是沉没成本；若完全离开农业则可出售土地，故长期退出决策中土地成本并未沉没。"},{"t":"停止营业规则的推导：若 TR<VC，停止营业；两边除以Q 得 TR/Q<VC/Q，即平均收益（价格）小于平均可变成本：若 P<AVC，停止营业。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">停止营业规则的推导</strong>：若 TR&lt;VC，停止营业；两边除以Q 得 TR/Q&lt;VC/Q，即平均收益（价格）小于平均可变成本：若 P&lt;AVC，停止营业。"},{"t":"直观解释：价格若弥补不了平均可变成本，完全停产虽仍损失固定成本，但比继续营业损失更少；将来价格回升超过AVC可重新开张。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">直观解释</strong>：价格若弥补不了平均可变成本，完全停产虽仍损失固定成本，但比继续营业损失更少；将来价格回升超过AVC可重新开张。"},{"t":"图形结论：竞争企业的短期供给曲线是边际成本曲线位于平均可变成本曲线之上的那一部分（P<AVC时产量为零）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>：竞争企业的短期供给曲线是边际成本曲线位于平均可变成本曲线之上的那一部分（P&lt;AVC时产量为零）。"}],"k":"b","i":1,"h":"14.2.3 企业的短期停止营业决策"},{"t":"14.2.4 覆水难收与其他沉没成本","c":[{"t":"沉没成本（sunk cost）：已经发生而且无法收回的成本；因为无法收回，做各种决策（包括经营战略）时可以不考虑沉没成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">沉没成本</strong>（sunk cost）：已经发生而且无法收回的成本；因为无法收回，做各种决策（包括经营战略）时可以不考虑沉没成本。"},{"t":"短期中固定成本是沉没成本，与企业的短期供给决策无关——短期供给曲线只由MC与AVC的相对位置决定。","c":[],"k":"b","i":2,"h":"短期中固定成本是沉没成本，与企业的短期供给决策无关——短期供给曲线只由MC与AVC的相对位置决定。"},{"t":"个人决策应用（示例数字）：对电影的评价为15美元，已花10美元买的票弄丢了，应再买一张——看电影的收益（15美元）仍大于机会成本（第二张票10美元），丢掉的票是沉没成本，\"覆水难收\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个人决策应用</strong>（示例数字）：对电影的评价为15美元，已花10美元买的票弄丢了，应再买一张——看电影的收益（15美元）仍大于机会成本（第二张票10美元），丢掉的票是沉没成本，&quot;覆水难收&quot;。"},{"t":"案例研究「生意冷清的餐馆和淡季的小型高尔夫球场」要点：午餐时段是否开门只看可变成本（增加的食物与店员工资）能否被收入弥补，租金、厨房设备、餐具等固定成本在短期中是沉没成本、与决策无关；夏季度假区高尔夫球场同理，只在一年中收入大于可变成本的时段开业。","c":[],"k":"b","i":2,"h":"案例研究「生意冷清的餐馆和淡季的小型高尔夫球场」要点：午餐时段是否开门只看可变成本（增加的食物与店员工资）能否被收入弥补，租金、厨房设备、餐具等固定成本在短期中是沉没成本、与决策无关；夏季度假区高尔夫球场同理，只在一年中收入大于可变成本的时段开业。"}],"k":"b","i":1,"h":"14.2.4 覆水难收与其他沉没成本"},{"t":"14.2.5 企业退出或进入一个市场的长期决策","c":[{"t":"退出规则的推导：若 TR<TC，退出；两边除以Q 得 P<ATC，就退出——价格低于平均总成本时企业选择退出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">退出规则的推导</strong>：若 TR&lt;TC，退出；两边除以Q 得 P&lt;ATC，就退出——价格低于平均总成本时企业选择退出。"},{"t":"进入规则与退出规则相反：若 P>ATC，就进入（正在考虑开办企业的企业家面临同样的激励）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">进入规则与退出规则相反</strong>：若 P&gt;ATC，就进入（正在考虑开办企业的企业家面临同样的激励）。"},{"t":"图形结论：竞争企业的长期供给曲线是边际成本曲线位于平均总成本曲线之上的那一部分。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>：竞争企业的长期供给曲线是边际成本曲线位于平均总成本曲线之上的那一部分。"}],"k":"b","i":1,"h":"14.2.5 企业退出或进入一个市场的长期决策"},{"t":"14.2.6 用竞争企业图形来衡量利润","c":[{"t":"利润=TR−TC=(TR/Q−TC/Q)×Q=(P−ATC)×Q，该式对竞争企业与其他企业同样成立。","c":[],"k":"b","i":2,"h":"利润=TR−TC=(TR/Q−TC/Q)×Q=(P−ATC)×Q，该式对竞争企业与其他企业同样成立。"},{"t":"图形结论：价格与平均总成本之间矩形的面积代表企业利润——矩形的高是P−ATC，宽是Q。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>：价格与平均总成本之间矩形的面积代表企业利润——矩形的高是P−ATC，宽是Q。"},{"t":"当P>ATC时矩形为正利润；当P<ATC时利润最大化意味着亏损最小化（仍在P=MC产量上生产），矩形面积(ATC−P)×Q为亏损，企业在长期中将选择退出市场。","c":[],"k":"b","i":2,"h":"当P&gt;ATC时矩形为正利润；当P&lt;ATC时利润最大化意味着亏损最小化（仍在P=MC产量上生产），矩形面积(ATC−P)×Q为亏损，企业在长期中将选择退出市场。"},{"t":"即问即答：竞争企业通过选择使边际成本等于价格的产量实现利润最大化；价格低于平均可变成本时暂时停止营业，价格低于平均总成本时（长期）退出市场。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答</strong>：竞争企业通过选择使边际成本等于价格的产量实现利润最大化；价格低于平均可变成本时暂时停止营业，价格低于平均总成本时（长期）退出市场。"}],"k":"b","i":1,"h":"14.2.6 用竞争企业图形来衡量利润"}],"k":"sec","i":0,"h":"14.2 利润最大化与竞争企业的供给曲线"},{"t":"14.3 竞争市场的供给曲线","c":[{"t":"14.3.1 短期：有固定数量企业的市场供给","c":[{"t":"短期中企业进入和退出通常困难，\"企业数量固定\"的假设合适；长期中企业数量可随市场条件调整。","c":[],"k":"b","i":2,"h":"短期中企业进入和退出通常困难，&quot;企业数量固定&quot;的假设合适；长期中企业数量可随市场条件调整。"},{"t":"在任意既定价格下，每个企业供给使边际成本等于价格的产量（只要价格高于平均可变成本）；市场供给量等于各单个企业供给量之和。","c":[],"k":"b","i":2,"h":"在任意既定价格下，每个企业供给使边际成本等于价格的产量（只要价格高于平均可变成本）；市场供给量等于各单个企业供给量之和。"},{"t":"以1000家相同企业为例：市场供给量是1000乘以每个企业的供给量；短期市场供给曲线由单个企业边际成本曲线（AVC以上部分）水平加总得到。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">以1000家相同企业为例</strong>：市场供给量是1000乘以每个企业的供给量；短期市场供给曲线由单个企业边际成本曲线（AVC以上部分）水平加总得到。"}],"k":"b","i":1,"h":"<strong class=\"lead\">14.3.1 短期</strong>：有固定数量企业的市场供给"},{"t":"14.3.2 长期：有进入与退出的市场供给","c":[{"t":"假设每个人都可以获得同样的技术并购买同样的投入品，因此所有企业和潜在企业都有同样的成本曲线。","c":[],"k":"b","i":2,"h":"假设每个人都可以获得同样的技术并购买同样的投入品，因此所有企业和潜在企业都有同样的成本曲线。"},{"t":"进入与退出的激励：现有企业盈利→新企业进入→企业数量与供给量增加→价格下降、利润减少；企业亏损→一些企业退出→供给量减少→价格上升、利润增加；该过程结束时，留在市场中的企业的经济利润必定为零。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">进入与退出的激励</strong>：现有企业盈利→新企业进入→企业数量与供给量增加→价格下降、利润减少；企业亏损→一些企业退出→供给量减少→价格上升、利润增加；该过程结束时，留在市场中的企业的经济利润必定为零。"},{"t":"零利润条件：利润=(P−ATC)×Q，当且仅当价格等于平均总成本时，经营中的企业利润为零。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">零利润条件</strong>：利润=(P−ATC)×Q，当且仅当价格等于平均总成本时，经营中的企业利润为零。"},{"t":"长期均衡的双重条件：企业利润最大化要求P=MC；自由进入退出驱使P=ATC；两者同时成立要求MC=ATC，而这只发生在平均总成本最低点——即企业的有效规模（efficient scale）上。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长期均衡的双重条件</strong>：企业利润最大化要求P=MC；自由进入退出驱使P=ATC；两者同时成立要求MC=ATC，而这只发生在平均总成本最低点——即企业的有效规模（efficient scale）上。"},{"t":"图形结论：长期市场供给曲线是在最低平均总成本价格上的一条水平线（完全富有弹性）；任何更高的价格带来利润、引起进入并增加供给，更低的价格引起亏损、引起退出并减少供给，最终企业数量自发调整，使价格等于最低ATC，且该价格下有足够企业满足全部需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>：长期市场供给曲线是在最低平均总成本价格上的一条水平线（完全富有弹性）；任何更高的价格带来利润、引起进入并增加供给，更低的价格引起亏损、引起退出并减少供给，最终企业数量自发调整，使价格等于最低ATC，且该价格下有足够企业满足全部需求。"}],"k":"b","i":1,"h":"<strong class=\"lead\">14.3.2 长期</strong>：有进入与退出的市场供给"},{"t":"14.3.3 如果竞争企业利润为零，为什么它们要留在市场上","c":[{"t":"总成本包括企业的所有机会成本（含企业所有者投入经营的时间与金钱的成本）；零利润均衡时，企业收益恰好补偿所有者的这些机会成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总成本包括企业的所有机会成本</strong>（含企业所有者投入经营的时间与金钱的成本）；零利润均衡时，企业收益恰好补偿所有者的这些机会成本。"},{"t":"示例数字：农民投入100万美元办农场，放弃了每年5万美元利息和3万美元工资，机会成本合计8万美元；利润为零时，经营农场的收益仍弥补了这8万美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">示例数字</strong>：农民投入100万美元办农场，放弃了每年5万美元利息和3万美元工资，机会成本合计8万美元；利润为零时，经营农场的收益仍弥补了这8万美元。"},{"t":"会计利润与经济利润的区别：会计师只关注显性成本，经济学家还包括隐性成本；零利润均衡时经济利润为零，但会计利润为正（例中为8万美元），足以使农民继续经营。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">会计利润与经济利润的区别</strong>：会计师只关注显性成本，经济学家还包括隐性成本；零利润均衡时经济利润为零，但会计利润为正（例中为8万美元），足以使农民继续经营。"}],"k":"b","i":1,"h":"14.3.3 如果竞争企业利润为零，为什么它们要留在市场上"},{"t":"14.3.4 短期与长期内的需求移动","c":[{"t":"起点：市场处于长期均衡（A点），价格P1等于最低平均总成本，每个企业获得零利润。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">起点</strong>：市场处于长期均衡（A点），价格P1等于最低平均总成本，每个企业获得零利润。"},{"t":"需求增加（示例：科学家发现牛奶有保健功效，需求曲线D1右移到D2）：短期均衡从A点到B点，价格升到P2、市场销售量从Q1增至Q2——现有企业沿各自的边际成本曲线增产，价格高于平均总成本，企业赚到正利润。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求增加</strong>（示例：科学家发现牛奶有保健功效，需求曲线D1右移到D2）：短期均衡从A点到B点，价格升到P2、市场销售量从Q1增至Q2——现有企业沿各自的边际成本曲线增产，价格高于平均总成本，企业赚到正利润。"},{"t":"长期反应：利润鼓励新企业进入（如农民从其他农产品转向牛奶），短期供给曲线从S1右移到S2，价格下降；最终价格回到最低平均总成本（P1），市场达到新的长期均衡C点，销售量增至Q3，利润再次为零。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长期反应</strong>：利润鼓励新企业进入（如农民从其他农产品转向牛奶），短期供给曲线从S1右移到S2，价格下降；最终价格回到最低平均总成本（P1），市场达到新的长期均衡C点，销售量增至Q3，利润再次为零。"},{"t":"结论：长期中每个企业仍在有效规模上生产，只是行业中企业数量更多；需求扩大的长期结果是企业数量与总供给量增加而价格不变（同质成本假设下）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：长期中每个企业仍在有效规模上生产，只是行业中企业数量更多；需求扩大的长期结果是企业数量与总供给量增加而价格不变（同质成本假设下）。"}],"k":"b","i":1,"h":"14.3.4 短期与长期内的需求移动"},{"t":"14.3.5 为什么长期供给曲线可能向右上方倾斜","c":[{"t":"原因一：一些用于生产的资源数量有限（如农业土地），需求扩张抬高资源价格、增加所有企业成本——农产品需求增加无法在成本不增加的情况下扩大供给，价格须上升。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原因一</strong>：一些用于生产的资源数量有限（如农业土地），需求扩张抬高资源价格、增加所有企业成本——农产品需求增加无法在成本不增加的情况下扩大供给，价格须上升。"},{"t":"原因二：不同企业可能有不同的成本（如油漆工市场：手艺快慢、时间的机会成本不同）；在任何既定价格下低成本者先进入，扩大供给须吸引高成本进入者，价格必须上升才使进入对其有利可图。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原因二</strong>：不同企业可能有不同的成本（如油漆工市场：手艺快慢、时间的机会成本不同）；在任何既定价格下低成本者先进入，扩大供给须吸引高成本进入者，价格必须上升才使进入对其有利可图。"},{"t":"边际企业（marginal firm）：价格有任何下降就会退出市场的企业；企业成本不同时，市场价格代表边际企业的平均总成本——边际企业赚到零利润，成本更低的企业赚到正利润，且这种利润不会被进入消除（潜在进入者成本更高，只有价格上升它们才会进入）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边际企业</strong>（marginal firm）：价格有任何下降就会退出市场的企业；企业成本不同时，市场价格代表边际企业的平均总成本——边际企业赚到零利润，成本更低的企业赚到正利润，且这种利润不会被进入消除（潜在进入者成本更高，只有价格上升它们才会进入）。"},{"t":"基本结论仍成立：由于企业在长期中比短期中更容易进入和退出，长期供给曲线一般比短期供给曲线更富有弹性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">基本结论仍成立</strong>：由于企业在长期中比短期中更容易进入和退出，长期供给曲线一般比短期供给曲线更富有弹性。"},{"t":"即问即答：在可以自由进入与退出的长期中，市场价格既等于边际成本（利润最大化），又等于平均总成本（零利润），两者同时成立，企业于是处于有效规模（ATC最低点）上。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答</strong>：在可以自由进入与退出的长期中，市场价格既等于边际成本（利润最大化），又等于平均总成本（零利润），两者同时成立，企业于是处于有效规模（ATC最低点）上。"}],"k":"b","i":1,"h":"14.3.5 为什么长期供给曲线可能向右上方倾斜"}],"k":"sec","i":0,"h":"14.3 竞争市场的供给曲线"},{"t":"14.4 结论：在供给曲线背后","c":[{"t":"本章把\"理性人考虑边际量\"运用于竞争企业，边际分析提供了竞争市场中的供给曲线理论。","c":[],"k":"b","i":1,"h":"本章把&quot;理性人考虑边际量&quot;运用于竞争企业，边际分析提供了竞争市场中的供给曲线理论。"},{"t":"从竞争且利润最大化的市场购买物品时，支付的价格接近生产成本：价格等于边际成本；若企业可自由进入退出，价格还等于可能的最低平均总成本。","c":[],"k":"b","i":1,"h":"从竞争且利润最大化的市场购买物品时，支付的价格接近生产成本：价格等于边际成本；若企业可自由进入退出，价格还等于可能的最低平均总成本。"},{"t":"本章假设企业是价格接受者，但提出的许多工具对研究竞争较少的市场同样有用；下一章转向有市场势力的企业，边际分析仍将适用，但含义完全不同。","c":[],"k":"b","i":1,"h":"本章假设企业是价格接受者，但提出的许多工具对研究竞争较少的市场同样有用；下一章转向有市场势力的企业，边际分析仍将适用，但含义完全不同。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">14.4 结论</strong>：在供给曲线背后"}],"k":"chap","h":"第14章 竞争市场上的企业"},{"t":"第15章 垄断","c":[{"t":"本章内容提要","c":[{"t":"垄断企业是在其市场上作为唯一卖者的企业（产品没有相近替代品）；垄断产生的基本原因是进入壁垒，三个来源是：垄断资源、政府创造的垄断、自然垄断。","c":[],"k":"b","i":1,"h":"垄断企业是在其市场上作为唯一卖者的企业（产品没有相近替代品）；垄断产生的基本原因是进入壁垒，三个来源是：垄断资源、政府创造的垄断、自然垄断。"},{"t":"垄断企业是市场上唯一的生产者，面临向右下方倾斜的市场需求曲线；增加一单位产量必须降低所有单位的价格，因此垄断企业的边际收益总是低于其价格（MR<P），甚至可以为负。","c":[],"k":"b","i":1,"h":"垄断企业是市场上唯一的生产者，面临向右下方倾斜的市场需求曲线；增加一单位产量必须降低所有单位的价格，因此垄断企业的边际收益总是低于其价格（MR&lt;P），甚至可以为负。"},{"t":"与竞争企业一样，垄断企业通过生产使边际收益等于边际成本（MR=MC）的产量实现利润最大化，再根据需求曲线确定价格；但垄断企业的价格高于边际收益，因而高于边际成本（P>MR=MC），且垄断企业没有供给曲线。","c":[],"k":"b","i":1,"h":"与竞争企业一样，垄断企业通过生产使边际收益等于边际成本（MR=MC）的产量实现利润最大化，再根据需求曲线确定价格；但垄断企业的价格高于边际收益，因而高于边际成本（P&gt;MR=MC），且垄断企业没有供给曲线。"},{"t":"垄断企业利润最大化的产量低于使消费者剩余与生产者剩余之和最大化的产量：高价格使一些对物品评价大于生产成本的消费者不再购买，因此垄断引起无谓损失（与税收的无谓损失类似，垄断企业类似私人收税者）。","c":[],"k":"b","i":1,"h":"垄断企业利润最大化的产量低于使消费者剩余与生产者剩余之和最大化的产量：高价格使一些对物品评价大于生产成本的消费者不再购买，因此垄断引起无谓损失（与税收的无谓损失类似，垄断企业类似私人收税者）。"},{"t":"垄断利润本身只是剩余从消费者向生产者的转移、不是一个社会问题，问题出在无效率的低产量（无谓损失）以及维持垄断地位的额外成本。","c":[],"k":"b","i":1,"h":"垄断利润本身只是剩余从消费者向生产者的转移、不是一个社会问题，问题出在无效率的低产量（无谓损失）以及维持垄断地位的额外成本。"},{"t":"价格歧视（按支付意愿对不同顾客收取不同价格）能增加垄断利润；完全价格歧视消除无谓损失、全部剩余归垄断者；不完全价格歧视对福利的影响不确定。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">价格歧视</strong>（按支付意愿对不同顾客收取不同价格）能增加垄断利润；完全价格歧视消除无谓损失、全部剩余归垄断者；不完全价格歧视对福利的影响不确定。"},{"t":"决策者可以用四种方式对垄断的无效率做出反应：用反托拉斯法使行业更具竞争性、管制垄断企业收取的价格、把垄断企业变为政府经营的企业、不作为——每种政策都有缺点。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">决策者可以用四种方式对垄断的无效率做出反应</strong>：用反托拉斯法使行业更具竞争性、管制垄断企业收取的价格、把垄断企业变为政府经营的企业、不作为——每种政策都有缺点。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"15.1 为什么会产生垄断","c":[{"t":"15.1.1 垄断资源","c":[{"t":"垄断企业（monopoly）：作为一种没有相近替代品的产品的唯一卖者的企业；垄断产生的基本原因是进入壁垒（barriers to entry）——其他企业不能进入该市场并与之竞争。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">垄断企业</strong>（monopoly）：作为一种没有相近替代品的产品的唯一卖者的企业；垄断产生的基本原因是进入壁垒（barriers to entry）——其他企业不能进入该市场并与之竞争。"},{"t":"进入壁垒的三个主要形成原因：垄断资源（关键资源由单个企业拥有）；政府管制（政府给予单个企业排他性地生产某种物品或服务的权利）；生产流程（某个企业能以低于大多数企业的成本生产产品）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">进入壁垒的三个主要形成原因</strong>：垄断资源（关键资源由单个企业拥有）；政府管制（政府给予单个企业排他性地生产某种物品或服务的权利）；生产流程（某个企业能以低于大多数企业的成本生产产品）。"},{"t":"关键资源垄断的例子：小镇上只有一口井且无法从别处得到水，井的主人垄断了水——对水这类必需品，即使多抽取1加仑的边际成本很低，垄断者也可定相当高的价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键资源垄断的例子</strong>：小镇上只有一口井且无法从别处得到水，井的主人垄断了水——对水这类必需品，即使多抽取1加仑的边际成本很低，垄断者也可定相当高的价格。"},{"t":"案例研究「DeBeers钻石公司」要点：1888年由英国商人Cecil Rhodes建立，一度控制全世界钻石矿产量的80%；因市场份额小于100%，DeBeers不完全是一个垄断企业，但对钻石价格有巨大影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「DeBeers钻石公司」要点</strong>：1888年由英国商人Cecil Rhodes建立，一度控制全世界钻石矿产量的80%；因市场份额小于100%，DeBeers不完全是一个垄断企业，但对钻石价格有巨大影响。"},{"t":"靠关键资源形成垄断在现实中很少见：经济庞大、资源由许多人拥有、许多市场的自然范围是世界性的，拥有\"没有相近替代品的资源\"的企业极少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">靠关键资源形成垄断在现实中很少见</strong>：经济庞大、资源由许多人拥有、许多市场的自然范围是世界性的，拥有&quot;没有相近替代品的资源&quot;的企业极少。"}],"k":"b","i":1,"h":"15.1.1 垄断资源"},{"t":"15.1.2 政府创造的垄断","c":[{"t":"有时垄断产生于想成为垄断者的政治影响（如国王赋予朋友或盟友排他性经营许可证），有时政府出于公共利益赋予垄断权利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有时垄断产生于想成为垄断者的政治影响</strong>（如国王赋予朋友或盟友排他性经营许可证），有时政府出于公共利益赋予垄断权利。"},{"t":"专利法与版权法是两个重要例子：新药专利给予20年排他性生产并销售的权利；版权保证未经作者许可任何人都不能印刷出售该作品，使小说家成为其小说销售的垄断者（微软Windows即靠版权获得垄断地位）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专利法与版权法是两个重要例子</strong>：新药专利给予20年排他性生产并销售的权利；版权保证未经作者许可任何人都不能印刷出售该作品，使小说家成为其小说销售的垄断者（微软Windows即靠版权获得垄断地位）。"},{"t":"专利与版权的收益与成本：收益是增加了对创造性活动（药物研发、写书）的激励；成本是被部分抵消的垄断定价代价——允许垄断者收取较高价格、赚取较多利润。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专利与版权的收益与成本</strong>：收益是增加了对创造性活动（药物研发、写书）的激励；成本是被部分抵消的垄断定价代价——允许垄断者收取较高价格、赚取较多利润。"}],"k":"b","i":1,"h":"15.1.2 政府创造的垄断"},{"t":"15.1.3 自然垄断","c":[{"t":"自然垄断（natural monopoly）：由于一个企业能以低于两个或更多企业的成本向整个市场供给一种物品或服务而产生的垄断；当相关产量范围存在规模经济（平均总成本持续下降）时产生。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自然垄断</strong>（natural monopoly）：由于一个企业能以低于两个或更多企业的成本向整个市场供给一种物品或服务而产生的垄断；当相关产量范围存在规模经济（平均总成本持续下降）时产生。"},{"t":"逻辑：在既定产量下，企业数量越多、每个企业的产量越少，平均总成本越高；因此单个企业可以以最低成本生产任何既定数量的产品。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">逻辑</strong>：在既定产量下，企业数量越多、每个企业的产量越少，平均总成本越高；因此单个企业可以以最低成本生产任何既定数量的产品。"},{"t":"例子一：供水——企业必须铺设遍及全镇的水管网，若两家或更多企业竞争，每家都要支付铺设管网的固定成本，独家供水的平均总成本最低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子一</strong>：供水——企业必须铺设遍及全镇的水管网，若两家或更多企业竞争，每家都要支付铺设管网的固定成本，独家供水的平均总成本最低。"},{"t":"例子二：很少使用、从不拥挤的桥（俱乐部物品：有排他性而无消费中的竞争性）——修桥的固定成本大、增加一个使用者的边际成本微乎其微，过桥的平均总成本随人次增加而下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子二</strong>：很少使用、从不拥挤的桥（俱乐部物品：有排他性而无消费中的竞争性）——修桥的固定成本大、增加一个使用者的边际成本微乎其微，过桥的平均总成本随人次增加而下降。"},{"t":"自然垄断企业很少担心新进入者：垄断利润虽增加进入的吸引力，但潜在进入者知道进入后每个企业的市场份额变小、无法实现垄断者那样低的成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自然垄断企业很少担心新进入者</strong>：垄断利润虽增加进入的吸引力，但潜在进入者知道进入后每个企业的市场份额变小、无法实现垄断者那样低的成本。"},{"t":"市场规模是重要因素：人数少时一座桥是自然垄断；随人数增加桥变得拥挤、可能需要两座或更多桥——自然垄断市场可能随市场扩大变为更具竞争性的市场。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">市场规模是重要因素</strong>：人数少时一座桥是自然垄断；随人数增加桥变得拥挤、可能需要两座或更多桥——自然垄断市场可能随市场扩大变为更具竞争性的市场。"},{"t":"即问即答：市场存在垄断的三个原因是垄断资源、政府创造的垄断与自然垄断；例如小镇唯一的水井（资源）、专利药（政府）、供水管网（自然垄断）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答</strong>：市场存在垄断的三个原因是垄断资源、政府创造的垄断与自然垄断；例如小镇唯一的水井（资源）、专利药（政府）、供水管网（自然垄断）。"}],"k":"b","i":1,"h":"15.1.3 自然垄断"}],"k":"sec","i":0,"h":"15.1 为什么会产生垄断"},{"t":"15.2 垄断企业如何做出生产与定价决策","c":[{"t":"15.2.1 垄断与竞争","c":[{"t":"关键差别：垄断企业具有影响其产品价格的能力；竞争企业与市场相比规模很小、接受既定价格，而垄断企业可通过调整向市场供给的产量来改变价格——竞争企业是价格接受者，垄断企业是价格决定者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键差别</strong>：垄断企业具有影响其产品价格的能力；竞争企业与市场相比规模很小、接受既定价格，而垄断企业可通过调整向市场供给的产量来改变价格——竞争企业是价格接受者，垄断企业是价格决定者。"},{"t":"图形结论：竞争企业面临一条水平的需求曲线（其产品有许多完全替代品，单个企业面对的需求完全富有弹性）；垄断企业的需求曲线就是市场需求曲线，向右下方倾斜——若提高价格，消费者就少买；若减少产量，价格则上升。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>：竞争企业面临一条水平的需求曲线（其产品有许多完全替代品，单个企业面对的需求完全富有弹性）；垄断企业的需求曲线就是市场需求曲线，向右下方倾斜——若提高价格，消费者就少买；若减少产量，价格则上升。"},{"t":"市场需求曲线限制了垄断企业通过市场势力获利的能力：垄断企业可以选择需求曲线上的任意一点（价格-产量组合），但不能选择需求曲线外的一点。","c":[],"k":"b","i":2,"h":"市场需求曲线限制了垄断企业通过市场势力获利的能力：垄断企业可以选择需求曲线上的任意一点（价格-产量组合），但不能选择需求曲线外的一点。"}],"k":"b","i":1,"h":"15.2.1 垄断与竞争"},{"t":"15.2.2 垄断企业的收益","c":[{"t":"以小镇唯一供水企业的收益表为例：前两列构成向右下方倾斜的需求表（产量从1加仑增至2加仑，价格须从10美元降到9美元）；总收益 TR=P×Q。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">以小镇唯一供水企业的收益表为例</strong>：前两列构成向右下方倾斜的需求表（产量从1加仑增至2加仑，价格须从10美元降到9美元）；总收益 TR=P×Q。"},{"t":"平均收益总等于物品的价格（AR=TR/Q=P），这一点对垄断企业和竞争企业同样正确。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">平均收益总等于物品的价格</strong>（AR=TR/Q=P），这一点对垄断企业和竞争企业同样正确。"},{"t":"核心结论：垄断企业的边际收益总是小于其价格（MR<P）。原因：为增加销售量，垄断企业必须降低向所有消费者收取的价格——卖出第4加仑水价格是7美元，但前3加仑每加仑要少收1美元，边际收益只有4美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心结论</strong>：垄断企业的边际收益总是小于其价格（MR&lt;P）。原因：为增加销售量，垄断企业必须降低向所有消费者收取的价格——卖出第4加仑水价格是7美元，但前3加仑每加仑要少收1美元，边际收益只有4美元。"},{"t":"两种效应：产量效应（销售数量Q增大，可能增加总收益）与价格效应（价格P降低，可能减少总收益）；竞争企业增加产量时没有价格效应，故其MR=P。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两种效应</strong>：产量效应（销售数量Q增大，可能增加总收益）与价格效应（价格P降低，可能减少总收益）；竞争企业增加产量时没有价格效应，故其MR=P。"},{"t":"图形结论：边际收益曲线与需求曲线（即平均收益曲线）从纵轴上同一点出发（第一单位的MR=价格），此后MR曲线位于需求曲线之下。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>：边际收益曲线与需求曲线（即平均收益曲线）从纵轴上同一点出发（第一单位的MR=价格），此后MR曲线位于需求曲线之下。"},{"t":"边际收益甚至可以为负：当价格效应大于产量效应时，多生产一单位反而使总收益减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边际收益甚至可以为负</strong>：当价格效应大于产量效应时，多生产一单位反而使总收益减少。"}],"k":"b","i":1,"h":"15.2.2 垄断企业的收益"},{"t":"15.2.3 利润最大化","c":[{"t":"同样运用\"理性人考虑边际量\"：低产量时MC<MR，增产增加利润；高产量时MC>MR，减产增加利润；利润最大化产量由边际收益曲线与边际成本曲线的交点决定。","c":[],"k":"b","i":2,"h":"同样运用&quot;理性人考虑边际量&quot;：低产量时MC&lt;MR，增产增加利润；高产量时MC&gt;MR，减产增加利润；利润最大化产量由边际收益曲线与边际成本曲线的交点决定。"},{"t":"定价方法：在选定MR=MC的产量后，用需求曲线找出为销售该产量它能收取的最高价格（需求曲线把消费者愿意支付的价格和销售量联系起来）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定价方法</strong>：在选定MR=MC的产量后，用需求曲线找出为销售该产量它能收取的最高价格（需求曲线把消费者愿意支付的价格和销售量联系起来）。"},{"t":"与竞争企业的关键对照：竞争企业 P=MR=MC；垄断企业 P>MR=MC。利润最大化原则（MR=MC）两者相同，差别在于价格与边际收益、边际成本的关系——竞争市场P=MC，垄断市场P>MC，这是理解垄断社会成本的关键。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与竞争企业的关键对照</strong>：竞争企业 P=MR=MC；垄断企业 P&gt;MR=MC。利润最大化原则（MR=MC）两者相同，差别在于价格与边际收益、边际成本的关系——竞争市场P=MC，垄断市场P&gt;MC，这是理解垄断社会成本的关键。"},{"t":"垄断企业没有供给曲线：供给曲线揭示企业在任何一种既定价格时选择的供给量，这一概念只对价格接受者有意义；垄断企业在选择供给量的同时确定价格（沿需求曲线），供给决策不能与需求曲线分开，因此从不谈及垄断企业的供给曲线。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">垄断企业没有供给曲线</strong>：供给曲线揭示企业在任何一种既定价格时选择的供给量，这一概念只对价格接受者有意义；垄断企业在选择供给量的同时确定价格（沿需求曲线），供给决策不能与需求曲线分开，因此从不谈及垄断企业的供给曲线。"},{"t":"即问即答：垄断企业先选择使MR=MC的产量，再按需求曲线确定该产量下的价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答</strong>：垄断企业先选择使MR=MC的产量，再按需求曲线确定该产量下的价格。"}],"k":"b","i":1,"h":"15.2.3 利润最大化"},{"t":"15.2.4 垄断企业的利润","c":[{"t":"利润=TR−TC=(TR/Q−TC/Q)×Q=(P−ATC)×Q，与竞争企业的公式相同。","c":[],"k":"b","i":2,"h":"利润=TR−TC=(TR/Q−TC/Q)×Q=(P−ATC)×Q，与竞争企业的公式相同。"},{"t":"图形结论：垄断企业的利润等于方框的面积——方框的高是价格减平均总成本（P−ATC，即每单位产品的利润），宽是销售量QMAX。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>：垄断企业的利润等于方框的面积——方框的高是价格减平均总成本（P−ATC，即每单位产品的利润），宽是销售量QMAX。"},{"t":"案例研究「垄断药品与非专利药品」要点：药品市场的边际成本大体不变；专利保护期内垄断企业按MR=MC定产并收取大大高于边际成本的垄断价格；专利到期后新企业进入销售同成分的非专利药品，市场变得更竞争，价格下降趋向边际成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「垄断药品与非专利药品」要点</strong>：药品市场的边际成本大体不变；专利保护期内垄断企业按MR=MC定产并收取大大高于边际成本的垄断价格；专利到期后新企业进入销售同成分的非专利药品，市场变得更竞争，价格下降趋向边际成本。"},{"t":"但专利到期并未使垄断者失去全部市场势力：一些消费者忠于品牌（担心成分不同），原垄断者可继续收取较高价——氟西汀（Prozac）专利2001年到期后，Prozac牌的价格约为同成分非专利药的三倍，价格差别得以持续是因为一些消费者不相信两者可完全替代。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">但专利到期并未使垄断者失去全部市场势力</strong>：一些消费者忠于品牌（担心成分不同），原垄断者可继续收取较高价——氟西汀（Prozac）专利2001年到期后，Prozac牌的价格约为同成分非专利药的三倍，价格差别得以持续是因为一些消费者不相信两者可完全替代。"}],"k":"b","i":1,"h":"15.2.4 垄断企业的利润"}],"k":"sec","i":0,"h":"15.2 垄断企业如何做出生产与定价决策"},{"t":"15.3 垄断的福利代价","c":[{"t":"15.3.1 无谓损失","c":[{"t":"分析工具：总剩余=消费者剩余+生产者剩余；垄断市场上只有一个生产者（垄断企业）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">分析工具</strong>：总剩余=消费者剩余+生产者剩余；垄断市场上只有一个生产者（垄断企业）。"},{"t":"有效率产量：需求曲线反映物品对消费者的价值（支付意愿），边际成本曲线反映生产成本；社会有效率的产量在需求曲线与边际成本曲线的相交处——低于它时增加一单位的价值大于成本，高于它时相反。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有效率产量</strong>：需求曲线反映物品对消费者的价值（支付意愿），边际成本曲线反映生产成本；社会有效率的产量在需求曲线与边际成本曲线的相交处——低于它时增加一单位的价值大于成本，高于它时相反。"},{"t":"仁慈的社会计划者将收取等于边际成本的价格（与竞争企业一样），价格向消费者提供生产成本的准确信号，消费者将购买有效率的产量。","c":[],"k":"b","i":2,"h":"仁慈的社会计划者将收取等于边际成本的价格（与竞争企业一样），价格向消费者提供生产成本的准确信号，消费者将购买有效率的产量。"},{"t":"垄断的无效率：垄断企业选择MR=MC的产量，小于社会有效率的产量（需求=MC处）；无效率的低产量等价于无效率的高价格——一些潜在消费者对物品的评价高于边际成本但低于垄断价格，因而不购买，使对双方有益的交易无法进行。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">垄断的无效率</strong>：垄断企业选择MR=MC的产量，小于社会有效率的产量（需求=MC处）；无效率的低产量等价于无效率的高价格——一些潜在消费者对物品的评价高于边际成本但低于垄断价格，因而不购买，使对双方有益的交易无法进行。"},{"t":"无谓损失（deadweight loss）：需求曲线与边际成本曲线之间的三角形面积，衡量垄断定价引起的总剩余损失，即垄断企业运用市场势力引起的经济福利减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">无谓损失</strong>（deadweight loss）：需求曲线与边际成本曲线之间的三角形面积，衡量垄断定价引起的总剩余损失，即垄断企业运用市场势力引起的经济福利减少。"},{"t":"与税收类比：垄断企业类似一个私人收税者，垄断加价像打入消费者支付意愿与生产者成本之间的一个楔子，使销售量低于社会最优水平；区别在于政府得到税收收入，私人企业得到垄断利润。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与税收类比</strong>：垄断企业类似一个私人收税者，垄断加价像打入消费者支付意愿与生产者成本之间的一个楔子，使销售量低于社会最优水平；区别在于政府得到税收收入，私人企业得到垄断利润。"}],"k":"b","i":1,"h":"15.3.1 无谓损失"},{"t":"15.3.2 垄断利润：是一种社会代价吗","c":[{"t":"垄断利润本身不一定是一个社会问题：消费者因垄断价格额外多付的每一美元，使消费者状况变坏1美元、生产者状况变好1美元，这种转移不改变总剩余——利润仅代表生产者那一块变大、消费者那一块变小，经济蛋糕的规模没有变小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">垄断利润本身不一定是一个社会问题</strong>：消费者因垄断价格额外多付的每一美元，使消费者状况变坏1美元、生产者状况变好1美元，这种转移不改变总剩余——利润仅代表生产者那一块变大、消费者那一块变小，经济蛋糕的规模没有变小。"},{"t":"除非基于消费者比生产者更应得到剩余的规范判断（超出经济效率范围的平等问题），垄断利润不是社会问题；问题产生于无效率的低产量，无谓损失衡量经济蛋糕变小了多少。","c":[],"k":"b","i":2,"h":"除非基于消费者比生产者更应得到剩余的规范判断（超出经济效率范围的平等问题），垄断利润不是社会问题；问题产生于无效率的低产量，无谓损失衡量经济蛋糕变小了多少。"},{"t":"可能的例外：若垄断企业为维持垄断地位不得不引起额外成本（如雇用游说者说服立法者），垄断的社会损失既包括这些成本，也包括产量下降引起的无谓损失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">可能的例外</strong>：若垄断企业为维持垄断地位不得不引起额外成本（如雇用游说者说服立法者），垄断的社会损失既包括这些成本，也包括产量下降引起的无谓损失。"},{"t":"即问即答：垄断企业的产量低于使总剩余最大化的产量，两者之差对应的需求曲线与边际成本曲线之间的三角形就是无谓损失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答</strong>：垄断企业的产量低于使总剩余最大化的产量，两者之差对应的需求曲线与边际成本曲线之间的三角形就是无谓损失。"}],"k":"b","i":1,"h":"<strong class=\"lead\">15.3.2 垄断利润</strong>：是一种社会代价吗"}],"k":"sec","i":0,"h":"15.3 垄断的福利代价"},{"t":"15.4 价格歧视","c":[{"t":"15.4.1 一个关于定价的寓言（Readalot出版公司）","c":[{"t":"设定：为获得畅销小说的排他性出版权支付作者固定200万美元，印刷成本为0；两类读者——10万名崇拜者愿付30美元、40万名不太热心的读者最多愿付5美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">设定</strong>：为获得畅销小说的排他性出版权支付作者固定200万美元，印刷成本为0；两类读者——10万名崇拜者愿付30美元、40万名不太热心的读者最多愿付5美元。"},{"t":"单一价格的比较：收30美元时售出10万本、收益300万美元、利润100万美元；收5美元时售出50万本、收益250万美元、利润50万美元——利润最大化选择是30美元、放弃40万名热心不足的读者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">单一价格的比较</strong>：收30美元时售出10万本、收益300万美元、利润100万美元；收5美元时售出50万本、收益250万美元、利润50万美元——利润最大化选择是30美元、放弃40万名热心不足的读者。"},{"t":"单一高价引起无谓损失：40万名读者愿付5美元而提供书的边际成本为0，收30美元损失了200万美元的总剩余。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">单一高价引起无谓损失</strong>：40万名读者愿付5美元而提供书的边际成本为0，收30美元损失了200万美元的总剩余。"},{"t":"发现两个读者群处于分离的市场（崇拜者在澳大利亚、其他读者在美国、难以跨国买书）后：对前者收30美元、对后者收5美元，总收益500万美元、利润300万美元，远高于统一定价的100万美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">发现两个读者群处于分离的市场</strong>（崇拜者在澳大利亚、其他读者在美国、难以跨国买书）后：对前者收30美元、对后者收5美元，总收益500万美元、利润300万美元，远高于统一定价的100万美元。"},{"t":"现实对应：出版商先出昂贵精装本、再出便宜平装本，两种版本价差远大于印刷成本差——向崇拜者卖精装、向不太热心者卖平装，即价格歧视。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现实对应</strong>：出版商先出昂贵精装本、再出便宜平装本，两种版本价差远大于印刷成本差——向崇拜者卖精装、向不太热心者卖平装，即价格歧视。"},{"t":"前提：价格歧视在竞争市场上不可能（企业按市场价格可卖出想卖的所有量，抬价顾客就转向他人）；实行价格歧视的企业必有一定市场势力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">前提</strong>：价格歧视在竞争市场上不可能（企业按市场价格可卖出想卖的所有量，抬价顾客就转向他人）；实行价格歧视的企业必有一定市场势力。"}],"k":"b","i":1,"h":"<strong class=\"lead\">15.4.1 一个关于定价的寓言</strong>（Readalot出版公司）"},{"t":"15.4.2 \"定价寓言\"的寓意","c":[{"t":"结论一：价格歧视是利润最大化垄断企业的一种理性策略——对不同顾客收取的不同价格比单一价格更接近各顾客的支付意愿。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论一</strong>：价格歧视是利润最大化垄断企业的一种理性策略——对不同顾客收取的不同价格比单一价格更接近各顾客的支付意愿。"},{"t":"结论二：价格歧视要求能根据支付意愿划分顾客（地域、年龄、收入等）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论二</strong>：价格歧视要求能根据支付意愿划分顾客（地域、年龄、收入等）。"},{"t":"结论二的推论：某些市场力量会阻止价格歧视——套利（arbitrage），即在一个市场上以低价购买物品、在另一个市场上以高价出售以从价格差中获利的过程；若澳大利亚书店可从美国进书转卖，价格歧视即失效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论二的推论</strong>：某些市场力量会阻止价格歧视——套利（arbitrage），即在一个市场上以低价购买物品、在另一个市场上以高价出售以从价格差中获利的过程；若澳大利亚书店可从美国进书转卖，价格歧视即失效。"},{"t":"结论三（最惊人）：价格歧视可以增进经济福利——实行价格歧视后所有读者都得到了书，消除了垄断定价固有的无效率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论三</strong>（最惊人）：价格歧视可以增进经济福利——实行价格歧视后所有读者都得到了书，消除了垄断定价固有的无效率。"},{"t":"福利归属：价格歧视带来的总剩余增加全部以更高利润的形式归企业；消费者买到了书但支付的价格等于其评价，没有得到消费者剩余。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">福利归属</strong>：价格歧视带来的总剩余增加全部以更高利润的形式归企业；消费者买到了书但支付的价格等于其评价，没有得到消费者剩余。"}],"k":"b","i":1,"h":"15.4.2 &quot;定价寓言&quot;的寓意"},{"t":"15.4.3 对价格歧视的分析","c":[{"t":"完全价格歧视（perfect price discrimination）：垄断企业完全了解每个顾客的支付意愿，并对每位顾客收取不同价格——恰好等于其支付意愿，垄断企业得到每次交易中的全部剩余。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">完全价格歧视</strong>（perfect price discrimination）：垄断企业完全了解每个顾客的支付意愿，并对每位顾客收取不同价格——恰好等于其支付意愿，垄断企业得到每次交易中的全部剩余。"},{"t":"图形结论（假设边际成本与平均总成本不变且相等）：单一价格垄断下存在无谓损失；完全价格歧视下，每位对物品评价大于边际成本的顾客都买到物品并被收取其愿付的价格，所有互惠贸易都得以进行，没有无谓损失，垄断生产者以利润形式获得市场的全部剩余。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>（假设边际成本与平均总成本不变且相等）：单一价格垄断下存在无谓损失；完全价格歧视下，每位对物品评价大于边际成本的顾客都买到物品并被收取其愿付的价格，所有互惠贸易都得以进行，没有无谓损失，垄断生产者以利润形式获得市场的全部剩余。"},{"t":"三项比较：与单一价格垄断相比，完全价格歧视增加了利润、增加了总剩余、减少了消费者剩余（降为零）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三项比较</strong>：与单一价格垄断相比，完全价格歧视增加了利润、增加了总剩余、减少了消费者剩余（降为零）。"},{"t":"现实中价格歧视是不完全的：顾客不会发出支付意愿的信号，企业只能按群体划分（年轻人与老年人、平时与周末购物者、美国人与澳大利亚人等），各群体内部支付意愿仍有差异，故完全价格歧视不可能。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现实中价格歧视是不完全的</strong>：顾客不会发出支付意愿的信号，企业只能按群体划分（年轻人与老年人、平时与周末购物者、美国人与澳大利亚人等），各群体内部支付意愿仍有差异，故完全价格歧视不可能。"},{"t":"不完全价格歧视对福利的影响没有一般性答案：与单一价格垄断相比，可能增加、减少或不改变市场总剩余；唯一确定的结论是价格歧视增加了垄断利润（否则企业会选择统一定价）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不完全价格歧视对福利的影响没有一般性答案</strong>：与单一价格垄断相比，可能增加、减少或不改变市场总剩余；唯一确定的结论是价格歧视增加了垄断利润（否则企业会选择统一定价）。"}],"k":"b","i":1,"h":"15.4.3 对价格歧视的分析"},{"t":"15.4.4 价格歧视的例子","c":[{"t":"电影票：许多电影院对儿童和老年人收取低价——竞争市场上无法解释（为两类观众提供座位的边际成本相同），但电影院有某种地区性垄断力量、且儿童与老年人支付意愿较低，差别定价增加利润。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">电影票</strong>：许多电影院对儿童和老年人收取低价——竞争市场上无法解释（为两类观众提供座位的边际成本相同），但电影院有某种地区性垄断力量、且儿童与老年人支付意愿较低，差别定价增加利润。"},{"t":"飞机票价：对往返并在对方城市周六停留一晚的旅客收低价——用以区分支付意愿高、不愿停留的公务乘客与支付意愿低、愿意停留的休闲乘客。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">飞机票价</strong>：对往返并在对方城市周六停留一晚的旅客收低价——用以区分支付意愿高、不愿停留的公务乘客与支付意愿低、愿意停留的休闲乘客。"},{"t":"折扣券：剪券的意愿与支付意愿负相关（富裕繁忙的高层管理人员不大可能花时间剪券、失业者更可能剪券），对剪券顾客收低价即成功的价格歧视。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">折扣券</strong>：剪券的意愿与支付意愿负相关（富裕繁忙的高层管理人员不大可能花时间剪券、失业者更可能剪券），对剪券顾客收低价即成功的价格歧视。"},{"t":"财务援助：高学费加选择性资助——富有学生支付意愿高，学校按学生对上学的评价收取不同价格，行为与价格歧视垄断企业相似。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">财务援助</strong>：高学费加选择性资助——富有学生支付意愿高，学校按学生对上学的评价收取不同价格，行为与价格歧视垄断企业相似。"},{"t":"数量折扣：对购买不同数量的同一顾客收取不同价格（面包店单个甜甜圈0.5美元、一打5美元）——顾客对第一单位付出的价格高于第十二单位，因边际支付意愿随购买量增加而下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数量折扣</strong>：对购买不同数量的同一顾客收取不同价格（面包店单个甜甜圈0.5美元、一打5美元）——顾客对第一单位付出的价格高于第十二单位，因边际支付意愿随购买量增加而下降。"},{"t":"新闻摘录「高等教育中的价格歧视」（Evan Soltas）要点：学费标价涨得比通胀快得多，但以助学金、奖学金为基础的净学费只是温和增长；大学以收入为基础实行价格歧视——富裕家庭付更多并补贴不太富裕的学生；哈佛2012年学费标价54496美元、平均助学金约41000美元，教育费用负担更具累进性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新闻摘录「高等教育中的价格歧视」</strong>（Evan Soltas）要点：学费标价涨得比通胀快得多，但以助学金、奖学金为基础的净学费只是温和增长；大学以收入为基础实行价格歧视——富裕家庭付更多并补贴不太富裕的学生；哈佛2012年学费标价54496美元、平均助学金约41000美元，教育费用负担更具累进性。"},{"t":"即问即答：两个例子如电影票与折扣券；完全价格歧视使消费者剩余为零、企业利润与总剩余增加、无谓损失消除。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答</strong>：两个例子如电影票与折扣券；完全价格歧视使消费者剩余为零、企业利润与总剩余增加、无谓损失消除。"}],"k":"b","i":1,"h":"15.4.4 价格歧视的例子"}],"k":"sec","i":0,"h":"15.4 价格歧视"},{"t":"15.5 针对垄断的公共政策","c":[{"t":"政府决策者应对垄断问题的四种方式：努力使垄断行业更有竞争性；管制垄断企业的行为；把一些私人垄断企业变为公共企业；不作为。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">政府决策者应对垄断问题的四种方式</strong>：努力使垄断行业更有竞争性；管制垄断企业的行为；把一些私人垄断企业变为公共企业；不作为。"},{"t":"15.5.1 用反托拉斯法增强竞争","c":[{"t":"反托拉斯法（antitrust laws）：旨在遏制垄断势力的法律集成；第一个也是最重要的是1890年《谢尔曼反托拉斯法》，1914年《克莱顿反托拉斯法》加强政府权力并使私人诉讼合法化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反托拉斯法</strong>（antitrust laws）：旨在遏制垄断势力的法律集成；第一个也是最重要的是1890年《谢尔曼反托拉斯法》，1914年《克莱顿反托拉斯法》加强政府权力并使私人诉讼合法化。"},{"t":"反托拉斯法允许政府阻止合并（1994年阻止微软收购Intuit；2011年阻止AT&T收购T-Mobile）、把大公司分拆为小公司、禁止公司以使市场竞争性减弱的方法协调活动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反托拉斯法允许政府阻止合并</strong>（1994年阻止微软收购Intuit；2011年阻止AT&amp;T收购T-Mobile）、把大公司分拆为小公司、禁止公司以使市场竞争性减弱的方法协调活动。"},{"t":"成本与收益：合并未必为减弱竞争，也可能通过更有效率的联合生产降低成本（\"协同效应\"，如银行、航空业合并减少行政管理人员）；政府须衡量协同效应的社会收益与竞争减少的社会成本，能否准确进行这种成本-收益分析存在争论，反托拉斯法的运用即使在专家中也常引起争论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成本与收益</strong>：合并未必为减弱竞争，也可能通过更有效率的联合生产降低成本（&quot;协同效应&quot;，如银行、航空业合并减少行政管理人员）；政府须衡量协同效应的社会收益与竞争减少的社会成本，能否准确进行这种成本-收益分析存在争论，反托拉斯法的运用即使在专家中也常引起争论。"}],"k":"b","i":1,"h":"15.5.1 用反托拉斯法增强竞争"},{"t":"15.5.2 管制","c":[{"t":"常用于自然垄断（自来水、电力公司）：政府机构不允许其随意定价，而是管制其价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">常用于自然垄断</strong>（自来水、电力公司）：政府机构不允许其随意定价，而是管制其价格。"},{"t":"边际成本定价的第一个问题（成本曲线的逻辑）：自然垄断下ATC递减，故MC<ATC；若令价格等于边际成本，价格将低于平均总成本，企业亏损而宁愿离开行业。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边际成本定价的第一个问题</strong>（成本曲线的逻辑）：自然垄断下ATC递减，故MC&lt;ATC；若令价格等于边际成本，价格将低于平均总成本，企业亏损而宁愿离开行业。"},{"t":"对亏损的应对（均不完美）：政府补贴垄断企业（但为筹资征税又引起税收的无谓损失）；或允许收取等于平均总成本的价格（平均成本定价，企业零经济利润，但价格不再反映边际成本，引起无谓损失，实际上类似对垄断商品征税）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对亏损的应对</strong>（均不完美）：政府补贴垄断企业（但为筹资征税又引起税收的无谓损失）；或允许收取等于平均总成本的价格（平均成本定价，企业零经济利润，但价格不再反映边际成本，引起无谓损失，实际上类似对垄断商品征税）。"},{"t":"第二个问题（激励）：边际成本（或平均成本）定价不能激励垄断企业降低成本——成本一降管制者就降价，企业无法从降成本中受益；实践中管制者允许企业以更高利润的形式保留部分降成本利益，这要求对边际成本定价有一定背离。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第二个问题</strong>（激励）：边际成本（或平均成本）定价不能激励垄断企业降低成本——成本一降管制者就降价，企业无法从降成本中受益；实践中管制者允许企业以更高利润的形式保留部分降成本利益，这要求对边际成本定价有一定背离。"}],"k":"b","i":1,"h":"15.5.2 管制"},{"t":"15.5.3 公有制","c":[{"t":"政府不是管制私人经营的自然垄断企业，而是自己经营（欧洲许多国家的电话、供水、电力公司；美国的邮政服务——普通一级邮件投递常被认为是自然垄断）。","c":[],"k":"b","i":2,"h":"政府不是管制私人经营的自然垄断企业，而是自己经营（欧洲许多国家的电话、供水、电力公司；美国的邮政服务——普通一级邮件投递常被认为是自然垄断）。"},{"t":"经济学家通常更偏爱私有制：关键在于所有权如何影响生产成本——私人所有者能以高利润形式得到部分利益，有成本最小化的激励（管理不善可解雇管理者）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学家通常更偏爱私有制</strong>：关键在于所有权如何影响生产成本——私人所有者能以高利润形式得到部分利益，有成本最小化的激励（管理不善可解雇管理者）。"},{"t":"公有制的缺陷：政府官员经营不善时损失由顾客和纳税人承担，只能求助于政治制度；官员可能成为特殊利益集团并企图阻止降低成本的改革——作为保证企业良好经营的方法，投票机制不如利润动机可靠。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公有制的缺陷</strong>：政府官员经营不善时损失由顾客和纳税人承担，只能求助于政治制度；官员可能成为特殊利益集团并企图阻止降低成本的改革——作为保证企业良好经营的方法，投票机制不如利润动机可靠。"}],"k":"b","i":1,"h":"15.5.3 公有制"},{"t":"15.5.4 不作为","c":[{"t":"每项旨在减少垄断问题的政策都有缺点，一些经济学家认为政府通常最好不设法纠正垄断定价的无效率。","c":[],"k":"b","i":2,"h":"每项旨在减少垄断问题的政策都有缺点，一些经济学家认为政府通常最好不设法纠正垄断定价的无效率。"},{"t":"诺贝尔奖得主乔治·斯蒂格勒的论述：美国经济\"市场失灵\"的程度，远远小于根植于现实政治制度中的经济政策不完善所引起的\"政治失灵\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">诺贝尔奖得主乔治·斯蒂格勒的论述</strong>：美国经济&quot;市场失灵&quot;的程度，远远小于根植于现实政治制度中的经济政策不完善所引起的&quot;政治失灵&quot;。"},{"t":"确定政府在经济中的适当角色需要结合政治学与经济学进行判断。","c":[],"k":"b","i":2,"h":"确定政府在经济中的适当角色需要结合政治学与经济学进行判断。"},{"t":"即问即答：四种方式是反托拉斯法、管制、公有制、不作为；潜在问题分别如合并的协同效应难以甄别、边际成本定价致亏损且削弱降成本激励、投票机制不如利润动机可靠、放任垄断无谓损失存在。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答</strong>：四种方式是反托拉斯法、管制、公有制、不作为；潜在问题分别如合并的协同效应难以甄别、边际成本定价致亏损且削弱降成本激励、投票机制不如利润动机可靠、放任垄断无谓损失存在。"}],"k":"b","i":1,"h":"15.5.4 不作为"}],"k":"sec","i":0,"h":"15.5 针对垄断的公共政策"},{"t":"15.6 结论：垄断的普遍性","c":[{"t":"表15-2总结竞争与垄断的比较。","c":[{"t":"相似之处：企业目标都是利润最大化；最大化原则都是MR=MC；短期中都能赚到经济利润。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">相似之处</strong>：企业目标都是利润最大化；最大化原则都是MR=MC；短期中都能赚到经济利润。"},{"t":"不同之处：企业数量（许多/一家）；边际收益（MR=P/MR<P）；价格（P=MC/P>MC）；能否生产使福利最大化的产量水平（能/不能）；长期中能否进入（能/不能）；长期中能否赚到经济利润（不能/能）；有无价格歧视的可能性（没有/有）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不同之处</strong>：企业数量（许多/一家）；边际收益（MR=P/MR&lt;P）；价格（P=MC/P&gt;MC）；能否生产使福利最大化的产量水平（能/不能）；长期中能否进入（能/不能）；长期中能否赚到经济利润（不能/能）；有无价格歧视的可能性（没有/有）。"}],"k":"b","i":1,"h":"表15-2总结竞争与垄断的比较。"},{"t":"公共政策视角的关键结论：垄断企业生产小于社会有效率的数量、收取高于边际成本的价格，引起无谓损失；某些情况下垄断企业可通过价格歧视减少这种无效率，另一些时候需要政策制定者扮演积极角色。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">公共政策视角的关键结论</strong>：垄断企业生产小于社会有效率的数量、收取高于边际成本的价格，引起无谓损失；某些情况下垄断企业可通过价格歧视减少这种无效率，另一些时候需要政策制定者扮演积极角色。"},{"t":"垄断的普遍性是程度问题：从某种意义上说垄断是常见的——多数企业对自己收取的价格都有某种控制力（产品不完全相同，如福特Taurus与丰田Camry、不同品牌冰淇淋），每种产品都有向右下方倾斜的需求曲线，每个生产者都有一定垄断权力。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">垄断的普遍性是程度问题</strong>：从某种意义上说垄断是常见的——多数企业对自己收取的价格都有某种控制力（产品不完全相同，如福特Taurus与丰田Camry、不同品牌冰淇淋），每种产品都有向右下方倾斜的需求曲线，每个生产者都有一定垄断权力。"},{"t":"但有相当大垄断权力的企业很少：多数物品都有替代品，即使不完全相同也相似（提价很多顾客就转向其他品牌）——认为许多企业有某种垄断势力是正确的，认为其垄断势力通常有限也是正确的；假设企业在竞争市场上经营即使不完全正确，也不至于太离谱。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">但有相当大垄断权力的企业很少</strong>：多数物品都有替代品，即使不完全相同也相似（提价很多顾客就转向其他品牌）——认为许多企业有某种垄断势力是正确的，认为其垄断势力通常有限也是正确的；假设企业在竞争市场上经营即使不完全正确，也不至于太离谱。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">15.6 结论</strong>：垄断的普遍性"}],"k":"chap","h":"第15章 垄断"},{"t":"第16章 垄断竞争","c":[{"t":"本章内容提要","c":[{"t":"垄断竞争市场有三个特点：许多企业、有差异的产品和自由进入。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">垄断竞争市场有三个特点</strong>：许多企业、有差异的产品和自由进入。"},{"t":"垄断竞争市场的长期均衡在两个相关的方面不同于完全竞争市场：第一，每个企业都有过剩生产能力，即在平均总成本曲线向右下方倾斜的部分运营；第二，每个企业都收取高于边际成本的价格。","c":[],"k":"b","i":1,"h":"垄断竞争市场的长期均衡在两个相关的方面不同于完全竞争市场：第一，每个企业都有过剩生产能力，即在平均总成本曲线向右下方倾斜的部分运营；第二，每个企业都收取高于边际成本的价格。"},{"t":"垄断竞争不具备完全竞争的所有合意特点：高于边际成本的价格加成引起标准的无谓损失，且企业数量（从而产品种类）可能过多或过少；实践中政策制定者纠正这些无效率的能力是有限的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">垄断竞争不具备完全竞争的所有合意特点</strong>：高于边际成本的价格加成引起标准的无谓损失，且企业数量（从而产品种类）可能过多或过少；实践中政策制定者纠正这些无效率的能力是有限的。"},{"t":"垄断竞争中固有的产品差异使企业使用广告与品牌：批评者认为广告与品牌操纵消费者爱好并减少竞争；支持者认为它们向消费者提供信息，并使价格和产品质量上的竞争更为激烈。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">垄断竞争中固有的产品差异使企业使用广告与品牌</strong>：批评者认为广告与品牌操纵消费者爱好并减少竞争；支持者认为它们向消费者提供信息，并使价格和产品质量上的竞争更为激烈。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"16.1 在垄断和完全竞争之间","c":[{"t":"市场结构的谱系：完全竞争（P=MC，长期经济利润为零）与垄断（P>MC，正经济利润与无谓损失）是市场结构的两种极端；经济中大部分市场介于两者之间，经济学家称之为不完全竞争。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">市场结构的谱系</strong>：完全竞争（P=MC，长期经济利润为零）与垄断（P&gt;MC，正经济利润与无谓损失）是市场结构的两种极端；经济中大部分市场介于两者之间，经济学家称之为不完全竞争。"},{"t":"寡头（oligopoly）：只有少数几个卖者提供相似或相同产品的市场结构。卖者数量少使激烈竞争不大可能产生，并使卖者之间的策略性相互作用极为重要；常用四企业集中率（最大的四家企业在市场总产量中所占的百分比）衡量集中程度，高度集中的行业如大型家用电器（90%）、轮胎（91%）、电灯泡（92%）、苏打（94%）、无线通信（95%）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">寡头</strong>（oligopoly）：只有少数几个卖者提供相似或相同产品的市场结构。卖者数量少使激烈竞争不大可能产生，并使卖者之间的策略性相互作用极为重要；常用四企业集中率（最大的四家企业在市场总产量中所占的百分比）衡量集中程度，高度集中的行业如大型家用电器（90%）、轮胎（91%）、电灯泡（92%）、苏打（94%）、无线通信（95%）。"},{"t":"垄断竞争（monopolistic competition）：有许多企业出售相似但不相同产品的市场结构；每家企业都垄断着自己生产的产品，但许多其他企业也生产相似但不相同的产品来争夺同样的顾客。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">垄断竞争</strong>（monopolistic competition）：有许多企业出售相似但不相同产品的市场结构；每家企业都垄断着自己生产的产品，但许多其他企业也生产相似但不相同的产品来争夺同样的顾客。"},{"t":"垄断竞争市场的三大特征","c":[{"t":"许多卖者：有许多企业争夺相同的顾客群体。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">许多卖者</strong>：有许多企业争夺相同的顾客群体。"},{"t":"产品存在差异（产品差异化，product differentiation）：每个企业生产的产品至少与其他企业的略有不同，因此每个企业都不是价格接受者，而是面临一条向右下方倾斜的需求曲线。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">产品存在差异</strong>（产品差异化，product differentiation）：每个企业生产的产品至少与其他企业的略有不同，因此每个企业都不是价格接受者，而是面临一条向右下方倾斜的需求曲线。"},{"t":"自由进入和退出：企业可以无限制地进入或退出市场，市场上企业的数量要一直调整到经济利润为零时为止。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自由进入和退出</strong>：企业可以无限制地进入或退出市场，市场上企业的数量要一直调整到经济利润为零时为止。"}],"k":"b","i":1,"h":"垄断竞争市场的三大特征"},{"t":"典型市场：书籍、电脑游戏、餐馆、钢琴课、点心和衣服等。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">典型市场</strong>：书籍、电脑游戏、餐馆、钢琴课、点心和衣服等。"},{"t":"与寡头的区别：寡头与完全竞争的区别在于只有几个卖者、策略性相互作用重要；垄断竞争的卖者众多且每个卖者与市场相比都很小，其与完全竞争的区别在于每个卖者都提供略有差异的产品。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">与寡头的区别</strong>：寡头与完全竞争的区别在于只有几个卖者、策略性相互作用重要；垄断竞争的卖者众多且每个卖者与市场相比都很小，其与完全竞争的区别在于每个卖者都提供略有差异的产品。"},{"t":"四种市场结构的判定（图16-1 结论）：先问市场上有多少家企业——只有一家为垄断（自来水、有线电视），只有几家为寡头（网球、香烟）；企业很多时再问产品是否相同——相同为完全竞争（小麦、牛奶），有差异为垄断竞争（小说、电影）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">四种市场结构的判定</strong>（图16-1 结论）：先问市场上有多少家企业——只有一家为垄断（自来水、有线电视），只有几家为寡头（网球、香烟）；企业很多时再问产品是否相同——相同为完全竞争（小麦、牛奶），有差异为垄断竞争（小说、电影）。"},{"t":"现实界限并不分明：没有神奇数字区分\"很少\"与\"很多\"（约12家公司在美国卖汽车，归属有争议），也没有确切方法区分\"有差异\"与\"相同\"（不同品牌的牛奶是否相同也有争议），分析实际市场时须记住各种结构的结论在适当时候才运用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">现实界限并不分明</strong>：没有神奇数字区分&quot;很少&quot;与&quot;很多&quot;（约12家公司在美国卖汽车，归属有争议），也没有确切方法区分&quot;有差异&quot;与&quot;相同&quot;（不同品牌的牛奶是否相同也有争议），分析实际市场时须记住各种结构的结论在适当时候才运用。"},{"t":"即问即答要点：寡头=只有少数几个卖者提供相似或相同产品的市场（如网球）；垄断竞争=有许多企业出售相似但不相同产品的市场（如小说）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：寡头=只有少数几个卖者提供相似或相同产品的市场（如网球）；垄断竞争=有许多企业出售相似但不相同产品的市场（如小说）。"}],"k":"sec","i":0,"h":"16.1 在垄断和完全竞争之间"},{"t":"16.2 有差异产品的竞争","c":[{"t":"16.2.1 短期中的垄断竞争企业","c":[{"t":"因产品与其他企业有差异，企业面临向右下方倾斜的需求曲线（完全竞争企业面临由市场价格决定的水平需求曲线）。","c":[],"k":"b","i":2,"h":"因产品与其他企业有差异，企业面临向右下方倾斜的需求曲线（完全竞争企业面临由市场价格决定的水平需求曲线）。"},{"t":"短期行为与垄断企业一样：遵循利润最大化规律，选择边际收益等于边际成本（MR=MC）的产量，再用需求曲线找出可出售的价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短期行为与垄断企业一样</strong>：遵循利润最大化规律，选择边际收益等于边际成本（MR=MC）的产量，再用需求曲线找出可出售的价格。"},{"t":"短期两种可能：价格高于平均总成本，企业获得正利润；价格低于平均总成本，企业不能获得正利润，能做的最好是使亏损最小化。短期中垄断竞争与垄断这两种市场结构是相似的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短期两种可能</strong>：价格高于平均总成本，企业获得正利润；价格低于平均总成本，企业不能获得正利润，能做的最好是使亏损最小化。短期中垄断竞争与垄断这两种市场结构是相似的。"}],"k":"b","i":1,"h":"16.2.1 短期中的垄断竞争企业"},{"t":"16.2.2 长期均衡","c":[{"t":"进入与退出的调整：企业有利润时新企业有进入激励，进入增加了顾客可选择的产品，使已有企业面临的需求曲线向左移动、利润下降；企业有亏损时企业有退出激励，退出使留下来的企业需求曲线向右移动、亏损减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">进入与退出的调整</strong>：企业有利润时新企业有进入激励，进入增加了顾客可选择的产品，使已有企业面临的需求曲线向左移动、利润下降；企业有亏损时企业有退出激励，退出使留下来的企业需求曲线向右移动、亏损减少。"},{"t":"过程一直持续到市场上企业正好有零经济利润为止；长期均衡图上需求曲线正好与平均总成本曲线相切（两曲线相接触而不相交），切点与 MR=MC 的产量处于同一条垂线上——该产量使利润最大化，而长期中最大的利润正好为零。","c":[],"k":"b","i":2,"h":"过程一直持续到市场上企业正好有零经济利润为止；长期均衡图上需求曲线正好与平均总成本曲线相切（两曲线相接触而不相交），切点与 MR=MC 的产量处于同一条垂线上——该产量使利润最大化，而长期中最大的利润正好为零。"},{"t":"长期均衡两大特点","c":[{"t":"像垄断：价格大于边际成本（P>MC）。因为利润最大化要求 MR=MC，而向右下方倾斜的需求曲线使 MR<P。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">像垄断</strong>：价格大于边际成本（P&gt;MC）。因为利润最大化要求 MR=MC，而向右下方倾斜的需求曲线使 MR&lt;P。"},{"t":"像竞争：价格等于平均总成本（P=ATC）。因为自由进入和退出使经济利润为零。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">像竞争</strong>：价格等于平均总成本（P=ATC）。因为自由进入和退出使经济利润为零。"}],"k":"b","i":2,"h":"长期均衡两大特点"},{"t":"与垄断的区别：垄断企业是没有相近替代产品的唯一卖者，即使在长期中也可以有正经济利润；垄断竞争市场可以自由进入，企业的经济利润被驱使为零。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与垄断的区别</strong>：垄断企业是没有相近替代产品的唯一卖者，即使在长期中也可以有正经济利润；垄断竞争市场可以自由进入，企业的经济利润被驱使为零。"}],"k":"b","i":1,"h":"16.2.2 长期均衡"},{"t":"16.2.3 垄断竞争与完全竞争（长期均衡的两个差别）","c":[{"t":"过剩生产能力（excess capacity）：有效规模指使平均总成本最小的产量。完全竞争企业在有效规模上生产；垄断竞争企业的产量低于有效规模，在生产位于平均总成本曲线向右下方倾斜的部分上运营。企业本可以增加产量并降低平均总成本，但为把增加的产品卖出去必须降价，因此继续以存在过剩生产能力的状态运营更有利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">过剩生产能力</strong>（excess capacity）：有效规模指使平均总成本最小的产量。完全竞争企业在有效规模上生产；垄断竞争企业的产量低于有效规模，在生产位于平均总成本曲线向右下方倾斜的部分上运营。企业本可以增加产量并降低平均总成本，但为把增加的产品卖出去必须降价，因此继续以存在过剩生产能力的状态运营更有利。"},{"t":"高于边际成本的价格加成（markup）：完全竞争企业价格等于边际成本；垄断竞争企业价格高于边际成本，因为企业总有某种市场势力。零利润状况只保证价格等于平均总成本，并不保证价格等于边际成本——长期均衡时企业在 ATC 曲线向下的部分运营，边际成本低于平均总成本，故 P=ATC 时必有 P>MC。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">高于边际成本的价格加成</strong>（markup）：完全竞争企业价格等于边际成本；垄断竞争企业价格高于边际成本，因为企业总有某种市场势力。零利润状况只保证价格等于平均总成本，并不保证价格等于边际成本——长期均衡时企业在 ATC 曲线向下的部分运营，边际成本低于平均总成本，故 P=ATC 时必有 P&gt;MC。"},{"t":"行为含义：\"你愿意多一位顾客按现价购买吗？\"完全竞争企业回答无所谓（P=MC，多销售一单位利润为零）；垄断竞争企业总是渴望多一个顾客（P>MC，按标价多售一单位利润增多）。垄断竞争市场是卖者向买者\"寄圣诞贺卡\"的市场。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行为含义</strong>：&quot;你愿意多一位顾客按现价购买吗？&quot;完全竞争企业回答无所谓（P=MC，多销售一单位利润为零）；垄断竞争企业总是渴望多一个顾客（P&gt;MC，按标价多售一单位利润增多）。垄断竞争市场是卖者向买者&quot;寄圣诞贺卡&quot;的市场。"}],"k":"b","i":1,"h":"<strong class=\"lead\">16.2.3 垄断竞争与完全竞争</strong>（长期均衡的两个差别）"},{"t":"16.2.4 垄断竞争与社会福利","c":[{"t":"无效率来源一：高于边际成本的价格加成。一些对物品的评价高于边际成本（但低于价格）的顾客没有购买物品，市场存在垄断定价的正常的无谓损失。但政策制定者没有简单易行的办法：强制边际成本定价需管制所有生产有差异产品的企业，管理负担巨大；且垄断竞争已是零利润，要求降价到等于边际成本会使企业亏损，政府需补贴维持其经营，与其加税补贴，通常认为允许垄断定价的无效率存在更好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">无效率来源一</strong>：高于边际成本的价格加成。一些对物品的评价高于边际成本（但低于价格）的顾客没有购买物品，市场存在垄断定价的正常的无谓损失。但政策制定者没有简单易行的办法：强制边际成本定价需管制所有生产有差异产品的企业，管理负担巨大；且垄断竞争已是零利润，要求降价到等于边际成本会使企业亏损，政府需补贴维持其经营，与其加税补贴，通常认为允许垄断定价的无效率存在更好。"},{"t":"无效率来源二：市场上的企业数量可能不是\"理想\"数量（太多或太少企业进入），可视为与新企业进入相关的两种外部性","c":[{"t":"产品多样化外部性（product-variety externality）：消费者从新产品引进中得到消费者剩余，新企业进入给消费者带来正外部性。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">产品多样化外部性</strong>（product-variety externality）：消费者从新产品引进中得到消费者剩余，新企业进入给消费者带来正外部性。"},{"t":"抢走业务外部性（business-stealing externality）：其他企业因新竞争者进入而失去部分顾客和利润，新企业进入给原有企业带来负外部性。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">抢走业务外部性</strong>（business-stealing externality）：其他企业因新竞争者进入而失去部分顾客和利润，新企业进入给原有企业带来负外部性。"},{"t":"产品可能太多也可能太少，取决于哪一种外部性更大；完全竞争企业生产相同产品并收取等于边际成本的价格，这两种外部性都不存在。","c":[],"k":"b","i":3,"h":"产品可能太多也可能太少，取决于哪一种外部性更大；完全竞争企业生产相同产品并收取等于边际成本的价格，这两种外部性都不存在。"}],"k":"b","i":2,"h":"<strong class=\"lead\">无效率来源二</strong>：市场上的企业数量可能不是&quot;理想&quot;数量（太多或太少企业进入），可视为与新企业进入相关的两种外部性"},{"t":"结论：垄断竞争下看不见的手并不能确保总剩余最大化，但这种无效率是模糊的、难以衡量也难以解决，公共政策没有简单易行的改善办法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：垄断竞争下看不见的手并不能确保总剩余最大化，但这种无效率是模糊的、难以衡量也难以解决，公共政策没有简单易行的改善办法。"},{"t":"即问即答要点：三个关键特征=许多卖者、产品差异、自由进入退出；长期均衡 P=ATC（相切、零利润）但 P>MC，与完全竞争（有效规模生产、P=MC）不同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：三个关键特征=许多卖者、产品差异、自由进入退出；长期均衡 P=ATC（相切、零利润）但 P&gt;MC，与完全竞争（有效规模生产、P=MC）不同。"}],"k":"b","i":1,"h":"16.2.4 垄断竞争与社会福利"}],"k":"sec","i":0,"h":"16.2 有差异产品的竞争"},{"t":"16.3 广告","c":[{"t":"广告是垄断竞争（以及某些寡头行业）的自然特征：当企业销售有差异的产品并收取高于边际成本的价格时，每个企业都有激励以做广告的方式吸引更多买者购买自己的特定产品。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">广告是垄断竞争</strong>（以及某些寡头行业）的自然特征：当企业销售有差异的产品并收取高于边际成本的价格时，每个企业都有激励以做广告的方式吸引更多买者购买自己的特定产品。"},{"t":"广告投入的分布：销售差异较大的消费品（药品、香水、软饮料、剃须刀片、早餐麦片、狗粮）的企业通常把收益的10%—20%用于广告；出售工业品（钻探机、通信卫星）的企业广告支出很少；出售同质产品（小麦、盐、糖、原油）的企业根本没有广告支出。就整个经济而言，企业总收益中约2%被用于广告。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">广告投入的分布</strong>：销售差异较大的消费品（药品、香水、软饮料、剃须刀片、早餐麦片、狗粮）的企业通常把收益的10%—20%用于广告；出售工业品（钻探机、通信卫星）的企业广告支出很少；出售同质产品（小麦、盐、糖、原油）的企业根本没有广告支出。就整个经济而言，企业总收益中约2%被用于广告。"},{"t":"16.3.1 关于广告的争论","c":[{"t":"批评者：企业做广告是为了操纵人们的爱好，许多广告是心理性的而不是信息性的（如软饮料广告只展现快乐情景，创造本来不存在的欲望）；广告抑制竞争——夸大产品之间的差异、提高品牌忠诚度，使买者不太关心相似产品之间的价格差，某一特定品牌的需求更缺乏弹性，企业得以收取高于边际成本的价格加成。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">批评者</strong>：企业做广告是为了操纵人们的爱好，许多广告是心理性的而不是信息性的（如软饮料广告只展现快乐情景，创造本来不存在的欲望）；广告抑制竞争——夸大产品之间的差异、提高品牌忠诚度，使买者不太关心相似产品之间的价格差，某一特定品牌的需求更缺乏弹性，企业得以收取高于边际成本的价格加成。"},{"t":"辩护者：企业用广告向顾客提供信息（价格、新产品推出、零售店位置），使顾客更好地选择，提高市场有效配置资源的能力；广告促进竞争——顾客更充分了解市场上所有企业、更容易利用价格差，每个企业的市场势力变小，广告也使新企业更容易进入。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">辩护者</strong>：企业用广告向顾客提供信息（价格、新产品推出、零售店位置），使顾客更好地选择，提高市场有效配置资源的能力；广告促进竞争——顾客更充分了解市场上所有企业、更容易利用价格差，每个企业的市场势力变小，广告也使新企业更容易进入。"},{"t":"政策趋势：过去律师、医生、药剂师等职业以广告\"非专业性\"为由使州政府禁止做广告；近年来法院认定这些限制的主要影响是抑制竞争，取消了许多禁止性法律。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政策趋势</strong>：过去律师、医生、药剂师等职业以广告&quot;非专业性&quot;为由使州政府禁止做广告；近年来法院认定这些限制的主要影响是抑制竞争，取消了许多禁止性法律。"},{"t":"案例研究「眼镜的价格」（Benham，1972）：利用20世纪60年代各州对配镜师广告规定的差异做自然实验——禁止广告的州眼镜平均价格33美元（约合2015年的256美元），不限制广告的州仅26美元（约202美元），广告使平均价格下降20%以上。在眼镜市场（也许还有许多其他市场）上，广告促进了竞争并使消费者得到较低的价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「眼镜的价格」</strong>（Benham，1972）：利用20世纪60年代各州对配镜师广告规定的差异做自然实验——禁止广告的州眼镜平均价格33美元（约合2015年的256美元），不限制广告的州仅26美元（约202美元），广告使平均价格下降20%以上。在眼镜市场（也许还有许多其他市场）上，广告促进了竞争并使消费者得到较低的价格。"}],"k":"b","i":1,"h":"16.3.1 关于广告的争论"},{"t":"16.3.2 作为质量信号的广告","c":[{"t":"许多广告只含有很少的明确信息（高收入演员吃麦片并感叹味道好极了），但看起来没有真正信息的广告实际上也告诉消费者关于产品质量的信息：企业愿意用大量的钱做广告，这本身就向消费者传递了产品质量的信号。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">许多广告只含有很少的明确信息</strong>（高收入演员吃麦片并感叹味道好极了），但看起来没有真正信息的广告实际上也告诉消费者关于产品质量的信息：企业愿意用大量的钱做广告，这本身就向消费者传递了产品质量的信号。"},{"t":"例子（通用磨坊与凯洛格）：麦片难吃的通用磨坊花1000万美元广告只能带来100万名消费者一次性购买的300万美元销售额，不值得，不做广告；麦片极棒的凯洛格因消费者会反复购买，可获3600万美元销售额，做广告有利可图。消费者尝试做广告的新麦片是完全理性的——\"它肯花这么多钱做广告，肯定是真的不错\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（通用磨坊与凯洛格）：麦片难吃的通用磨坊花1000万美元广告只能带来100万名消费者一次性购买的300万美元销售额，不值得，不做广告；麦片极棒的凯洛格因消费者会反复购买，可获3600万美元销售额，做广告有利可图。消费者尝试做广告的新麦片是完全理性的——&quot;它肯花这么多钱做广告，肯定是真的不错&quot;。"},{"t":"关键推论：广告的内容是无关紧要的，信号在于做广告本身及其昂贵的价格；便宜的广告不可能有效传递质量信号（好坏麦片都会做，消费者学会不理会）。这解释了企业为何付给著名演员大笔钱做表面无信息的广告——信息不在于广告内容，而仅在于做广告这一昂贵的事实。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键推论</strong>：广告的内容是无关紧要的，信号在于做广告本身及其昂贵的价格；便宜的广告不可能有效传递质量信号（好坏麦片都会做，消费者学会不理会）。这解释了企业为何付给著名演员大笔钱做表面无信息的广告——信息不在于广告内容，而仅在于做广告这一昂贵的事实。"}],"k":"b","i":1,"h":"16.3.2 作为质量信号的广告"},{"t":"16.3.3 品牌","c":[{"t":"现象：许多市场上并存出售有广泛知名度产品的企业与出售无品牌替代品的企业（拜尔牌阿司匹林旁的无品牌阿司匹林、百事可乐旁的不太熟悉的可乐），有品牌的企业花更多广告费、产品价格也更高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现象</strong>：许多市场上并存出售有广泛知名度产品的企业与出售无品牌替代品的企业（拜尔牌阿司匹林旁的无品牌阿司匹林、百事可乐旁的不太熟悉的可乐），有品牌的企业花更多广告费、产品价格也更高。"},{"t":"批评者：品牌使消费者感觉到实际上并不存在的差异，对有品牌物品支付更高价是广告引起的一种非理性；垄断竞争理论早期创立者张伯伦（Edward Chamberlin）据此主张政府通过拒绝承认专有商标来限制品牌。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">批评者</strong>：品牌使消费者感觉到实际上并不存在的差异，对有品牌物品支付更高价是广告引起的一种非理性；垄断竞争理论早期创立者张伯伦（Edward Chamberlin）据此主张政府通过拒绝承认专有商标来限制品牌。"},{"t":"辩护者：品牌是消费者确保所购物品具有高质量的有用方法，两种论据——第一，品牌向消费者提供在购买前不易判断的产品质量的信息；第二，品牌给企业提供保持高质量的激励，因为企业有保持自己品牌声誉的财务利害关系。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">辩护者</strong>：品牌是消费者确保所购物品具有高质量的有用方法，两种论据——第一，品牌向消费者提供在购买前不易判断的产品质量的信息；第二，品牌给企业提供保持高质量的激励，因为企业有保持自己品牌声誉的财务利害关系。"},{"t":"例子（麦当劳）：开车经过陌生小镇，当地餐馆可能以更低价格提供更好食物但你无法知道，麦当劳在许多城市提供统一产品，品牌是判断质量的简便方法；若顾客吃了变质食物生病，麦当劳会失去多年昂贵广告建立的声誉、损失全国多家店的销售额和利润，因此其确保食品安全的激励比当地餐馆更大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（麦当劳）：开车经过陌生小镇，当地餐馆可能以更低价格提供更好食物但你无法知道，麦当劳在许多城市提供统一产品，品牌是判断质量的简便方法；若顾客吃了变质食物生病，麦当劳会失去多年昂贵广告建立的声誉、损失全国多家店的销售额和利润，因此其确保食品安全的激励比当地餐馆更大。"},{"t":"争论焦点：消费者对品牌产品的偏好大于无品牌替代品是不是理性的——批评者认为是非理性消费者对广告反应的结果，辩护者认为有充分理由为可信任的质量支付更高价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">争论焦点</strong>：消费者对品牌产品的偏好大于无品牌替代品是不是理性的——批评者认为是非理性消费者对广告反应的结果，辩护者认为有充分理由为可信任的质量支付更高价格。"}],"k":"b","i":1,"h":"16.3.3 品牌"},{"t":"即问即答要点：广告可经\"夸大差异、提高品牌忠诚度、需求更缺乏弹性\"使市场竞争性降低，也可经\"提供信息、便于利用价格差、便利新企业进入\"使市场更有竞争性。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：广告可经&quot;夸大差异、提高品牌忠诚度、需求更缺乏弹性&quot;使市场竞争性降低，也可经&quot;提供信息、便于利用价格差、便利新企业进入&quot;使市场更有竞争性。"}],"k":"sec","i":0,"h":"16.3 广告"},{"t":"16.4 结论","c":[{"t":"垄断竞争是垄断和竞争的混合：像垄断——每个企业都面临向右下方倾斜的需求曲线，收取的价格高于边际成本；像竞争——市场上存在许多企业，进入与退出使每个企业的利润趋于零。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">垄断竞争是垄断和竞争的混合</strong>：像垄断——每个企业都面临向右下方倾斜的需求曲线，收取的价格高于边际成本；像竞争——市场上存在许多企业，进入与退出使每个企业的利润趋于零。"},{"t":"表16-1 三种结构对比：三者共同点——企业目标均为利润最大化、最大化原则均为 MR=MC、短期中都能赚到（可能的）经济利润；垄断竞争与垄断共同点——不是价格接受者、P>MC、不能生产出使福利最大化的产量水平；垄断竞争与完全竞争共同点——企业数量许多、长期中能进入、长期中赚不到经济利润；唯有垄断长期能有正经济利润。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">表16-1 三种结构对比</strong>：三者共同点——企业目标均为利润最大化、最大化原则均为 MR=MC、短期中都能赚到（可能的）经济利润；垄断竞争与垄断共同点——不是价格接受者、P&gt;MC、不能生产出使福利最大化的产量水平；垄断竞争与完全竞争共同点——企业数量许多、长期中能进入、长期中赚不到经济利润；唯有垄断长期能有正经济利润。"},{"t":"广告与品牌的总体评价：在某种程度上广告操纵了消费者偏好、促成非理性的品牌忠诚并抑制竞争；在更大程度上广告提供信息、建立具有可靠质量的品牌并促进竞争。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">广告与品牌的总体评价</strong>：在某种程度上广告操纵了消费者偏好、促成非理性的品牌忠诚并抑制竞争；在更大程度上广告提供信息、建立具有可靠质量的品牌并促进竞争。"},{"t":"总体评价：垄断竞争理论描述了经济中的许多市场，但并没有得出简单而令人信服的公共政策建议——从理论看资源配置并不完美，从实际政策制定者看也没有什么办法可以改善这种状况。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总体评价</strong>：垄断竞争理论描述了经济中的许多市场，但并没有得出简单而令人信服的公共政策建议——从理论看资源配置并不完美，从实际政策制定者看也没有什么办法可以改善这种状况。"}],"k":"sec","i":0,"h":"16.4 结论"}],"k":"chap","h":"第16章 垄断竞争"},{"t":"第17章 寡头","c":[{"t":"本章内容提要","c":[{"t":"寡头通过形成一个卡特尔并像垄断者那样行事来使自己的总利润最大化；但如果寡头独立地做出产量决策，结果是产量大于垄断产量、价格低于垄断价格。寡头市场上企业数量越多，产量和价格越接近于完全竞争状态下的水平。","c":[],"k":"b","i":1,"h":"寡头通过形成一个卡特尔并像垄断者那样行事来使自己的总利润最大化；但如果寡头独立地做出产量决策，结果是产量大于垄断产量、价格低于垄断价格。寡头市场上企业数量越多，产量和价格越接近于完全竞争状态下的水平。"},{"t":"囚徒困境表明，利己使人们即使在合作符合他们共同利益时也无法维持合作；囚徒困境的逻辑适用于许多情况，包括军备竞赛、公共资源问题和寡头。","c":[],"k":"b","i":1,"h":"囚徒困境表明，利己使人们即使在合作符合他们共同利益时也无法维持合作；囚徒困境的逻辑适用于许多情况，包括军备竞赛、公共资源问题和寡头。"},{"t":"政策制定者用反托拉斯法来防止寡头从事减少竞争的行为；这些法律的适用性是有争议的，因为有些看来可能减少竞争的行为实际上可能有合理的经营目的。","c":[],"k":"b","i":1,"h":"政策制定者用反托拉斯法来防止寡头从事减少竞争的行为；这些法律的适用性是有争议的，因为有些看来可能减少竞争的行为实际上可能有合理的经营目的。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"17.1 只有少数几个卖者的市场","c":[{"t":"寡头（oligopoly）：只有少数几个卖者提供相似或相同产品的市场结构。寡头市场的本质是只有少数几个卖者，市场上任何一个卖者的行为对其他所有企业的利润都可能有很大的影响，寡头企业以一种竞争企业所没有的方式相互依存（例子：美国销售的网球几乎全部由 Penn、Wilson、Prince、Dunlop Slazenger 四家生产）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">寡头</strong>（oligopoly）：只有少数几个卖者提供相似或相同产品的市场结构。寡头市场的本质是只有少数几个卖者，市场上任何一个卖者的行为对其他所有企业的利润都可能有很大的影响，寡头企业以一种竞争企业所没有的方式相互依存（例子：美国销售的网球几乎全部由 Penn、Wilson、Prince、Dunlop Slazenger 四家生产）。"},{"t":"寡头的关键特征：合作与利己之间的冲突——寡头集团合作起来并像一个垄断者那样行事（生产少量产品并收取高于边际成本的价格）会使其情况最好；但由于每个寡头只关心自己的利润，存在强大的激励使企业集团很难维持合作的结果。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">寡头的关键特征</strong>：合作与利己之间的冲突——寡头集团合作起来并像一个垄断者那样行事（生产少量产品并收取高于边际成本的价格）会使其情况最好；但由于每个寡头只关心自己的利润，存在强大的激励使企业集团很难维持合作的结果。"},{"t":"博弈论（game theory）：研究在策略状况下人们如何行为的理论；\"策略\"指一个人在不同行为之中做出选择时，必须考虑其他人会对他采取的行为做出什么反应。博弈论对理解完全竞争、垄断竞争（每个企业与市场相比太小）和垄断（只有一家企业）是不必要的，但对理解寡头和许多只有几个相互关联参与者的情况有用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">博弈论</strong>（game theory）：研究在策略状况下人们如何行为的理论；&quot;策略&quot;指一个人在不同行为之中做出选择时，必须考虑其他人会对他采取的行为做出什么反应。博弈论对理解完全竞争、垄断竞争（每个企业与市场相比太小）和垄断（只有一家企业）是不必要的，但对理解寡头和许多只有几个相互关联参与者的情况有用。"},{"t":"17.1.1 双头的例子","c":[{"t":"双头（duopoly）：只有两个卖者的寡头，是寡头中最简单的类型；有三家或更多数量的寡头所面临的问题与双头相同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">双头</strong>（duopoly）：只有两个卖者的寡头，是寡头中最简单的类型；有三家或更多数量的寡头所面临的问题与双头相同。"},{"t":"设定：镇上只有 Jack 和 Jill 两口水井所有者，每周决定抽多少水出售；假设抽水的边际成本为零。按需求表（总量10加仑价110美元、20加仑价100美元……120加仑价0），总收益即总利润，最大值为60加仑×60美元=3600美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">设定</strong>：镇上只有 Jack 和 Jill 两口水井所有者，每周决定抽多少水出售；假设抽水的边际成本为零。按需求表（总量10加仑价110美元、20加仑价100美元……120加仑价0），总收益即总利润，最大值为60加仑×60美元=3600美元。"}],"k":"b","i":1,"h":"17.1.1 双头的例子"},{"t":"17.1.2 竞争、垄断和卡特尔（三个基点）","c":[{"t":"完全竞争结果：每家企业生产决策使价格等于边际成本；因 MC=0，均衡价格为0、均衡数量120加仑，生产量与消费量是有效率的数量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">完全竞争结果</strong>：每家企业生产决策使价格等于边际成本；因 MC=0，均衡价格为0、均衡数量120加仑，生产量与消费量是有效率的数量。"},{"t":"垄断结果：产量60加仑、每加仑60美元时总利润最大；价格大于边际成本是垄断者的标准情况，结果是社会无效率的（低于对社会有效率的120加仑）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">垄断结果</strong>：产量60加仑、每加仑60美元时总利润最大；价格大于边际成本是垄断者的标准情况，结果是社会无效率的（低于对社会有效率的120加仑）。"},{"t":"勾结（collusion）：一个市场上的企业之间就生产的产量或收取的价格达成的协议。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">勾结</strong>（collusion）：一个市场上的企业之间就生产的产量或收取的价格达成的协议。"},{"t":"卡特尔（cartel）：联合起来行事的企业集团。一旦形成了卡特尔，市场实际上就是由一个垄断者来提供服务，可运用垄断分析；卡特尔不仅必须就总产量水平达成一致，还要就每个成员的生产量达成一致（每个成员都想有较大市场份额，因为市场份额越大利润越大）；若 Jack 与 Jill 平分市场，每人生产30加仑、价格60美元、各得1800美元利润。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">卡特尔</strong>（cartel）：联合起来行事的企业集团。一旦形成了卡特尔，市场实际上就是由一个垄断者来提供服务，可运用垄断分析；卡特尔不仅必须就总产量水平达成一致，还要就每个成员的生产量达成一致（每个成员都想有较大市场份额，因为市场份额越大利润越大）；若 Jack 与 Jill 平分市场，每人生产30加仑、价格60美元、各得1800美元利润。"},{"t":"卡特尔往往不可能的原因：成员之间对如何瓜分利润的争斗使协议难以达成；反托拉斯法把禁止寡头之间的显性协议作为公共政策的关键，即使只是与竞争对手谈论定价和生产限制也可能构成犯罪。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">卡特尔往往不可能的原因</strong>：成员之间对如何瓜分利润的争斗使协议难以达成；反托拉斯法把禁止寡头之间的显性协议作为公共政策的关键，即使只是与竞争对手谈论定价和生产限制也可能构成犯罪。"}],"k":"b","i":1,"h":"<strong class=\"lead\">17.1.2 竞争、垄断和卡特尔</strong>（三个基点）"},{"t":"17.1.3 寡头的均衡","c":[{"t":"利己的逻辑达不到垄断结果：设想对方守约只产30加仑，自己增产到40加仑可获利2000美元（>守约的1800美元），尽管市场总利润减少但自己市场份额更大；双方都如此推理，各带40加仑，总销量80加仑、价格降为40美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利己的逻辑达不到垄断结果</strong>：设想对方守约只产30加仑，自己增产到40加仑可获利2000美元（&gt;守约的1800美元），尽管市场总利润减少但自己市场份额更大；双方都如此推理，各带40加仑，总销量80加仑、价格降为40美元。"},{"t":"利己也不会一路达到竞争结果：当两人各产40加仑时，再增到50加仑会使利润从1600降到1500美元——寡头认识到增产会降低价格从而影响利润，不会按 P=MC 生产。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利己也不会一路达到竞争结果</strong>：当两人各产40加仑时，再增到50加仑会使利润从1600降到1500美元——寡头认识到增产会降低价格从而影响利润，不会按 P=MC 生产。"},{"t":"纳什均衡（Nash equilibrium）：相互作用的经济主体在假定所有其他主体所选策略为既定的情况下，选择他们自己最优策略的状态（以经济理论家约翰·纳什命名）。当 Jill 生产40加仑为既定时，Jack 的最优策略是生产40加仑，反之亦然——一旦达到纳什均衡，双方都没有做出不同决策的激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">纳什均衡</strong>（Nash equilibrium）：相互作用的经济主体在假定所有其他主体所选策略为既定的情况下，选择他们自己最优策略的状态（以经济理论家约翰·纳什命名）。当 Jill 生产40加仑为既定时，Jack 的最优策略是生产40加仑，反之亦然——一旦达到纳什均衡，双方都没有做出不同决策的激励。"},{"t":"结论：当寡头企业单独地选择利润最大化的产量时，它们生产的产量大于垄断的产量水平，但小于竞争的产量水平；寡头价格低于垄断价格，但高于竞争价格（竞争价格等于边际成本）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：当寡头企业单独地选择利润最大化的产量时，它们生产的产量大于垄断的产量水平，但小于竞争的产量水平；寡头价格低于垄断价格，但高于竞争价格（竞争价格等于边际成本）。"}],"k":"b","i":1,"h":"17.1.3 寡头的均衡"},{"t":"17.1.4 寡头数量如何影响市场结果","c":[{"t":"卡特尔随规模扩大更难维持：卖者从两个增加到四个后，虽然仍可就垄断产量定价使总利润最大，但随着集团规模的扩大，达成和实施协议变得越来越困难。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">卡特尔随规模扩大更难维持</strong>：卖者从两个增加到四个后，虽然仍可就垄断产量定价使总利润最大，但随着集团规模的扩大，达成和实施协议变得越来越困难。"},{"t":"不形成卡特尔时，每个寡头增产决策要权衡两种效应","c":[{"t":"产量效应：由于价格高于边际成本，在现行价格时每多销售1加仑水都将增加利润。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">产量效应</strong>：由于价格高于边际成本，在现行价格时每多销售1加仑水都将增加利润。"},{"t":"价格效应：提高产量将增加总销售量，从而降低水的价格并减少所销售的所有其他产品的利润。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">价格效应</strong>：提高产量将增加总销售量，从而降低水的价格并减少所销售的所有其他产品的利润。"},{"t":"每个寡头把其他企业的产量看成既定的，一直增加产量直至这两种边际效应恰好平衡。","c":[],"k":"b","i":3,"h":"每个寡头把其他企业的产量看成既定的，一直增加产量直至这两种边际效应恰好平衡。"}],"k":"b","i":2,"h":"不形成卡特尔时，每个寡头增产决策要权衡两种效应"},{"t":"卖者数量越多，每个卖者就越不关心自己对市场价格的影响，价格效应在减小；当寡头数量增加到极大时，价格效应完全消失，个别企业的生产决策不再影响市场价格，企业把市场价格作为既定的——一个大的寡头市场本质上是一个竞争企业集团，价格接近于边际成本，生产量接近于对社会有效率的水平。","c":[],"k":"b","i":2,"h":"卖者数量越多，每个卖者就越不关心自己对市场价格的影响，价格效应在减小；当寡头数量增加到极大时，价格效应完全消失，个别企业的生产决策不再影响市场价格，企业把市场价格作为既定的——一个大的寡头市场本质上是一个竞争企业集团，价格接近于边际成本，生产量接近于对社会有效率的水平。"},{"t":"国际贸易视角：若各国禁止汽车的国际贸易，每个国家就都是只有两个成员的寡头市场；有国际贸易时市场是六成员的世界市场，自由贸易增加了每个消费者可以选择的生产者数量，增加的竞争使价格接近于边际成本——除比较优势理论之外，寡头理论提供了各国可以从自由贸易中获益的另一个理由。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">国际贸易视角</strong>：若各国禁止汽车的国际贸易，每个国家就都是只有两个成员的寡头市场；有国际贸易时市场是六成员的世界市场，自由贸易增加了每个消费者可以选择的生产者数量，增加的竞争使价格接近于边际成本——除比较优势理论之外，寡头理论提供了各国可以从自由贸易中获益的另一个理由。"},{"t":"即问即答要点：若寡头成员能就总产量达成一致，他们会选择垄断产量（本例60加仑）；若单独决策，总产量更大——利己使产量大于垄断水平，因为每个寡头都有扩大生产攫取更大市场份额的诱惑。","c
