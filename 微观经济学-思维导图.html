":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：若寡头成员能就总产量达成一致，他们会选择垄断产量（本例60加仑）；若单独决策，总产量更大——利己使产量大于垄断水平，因为每个寡头都有扩大生产攫取更大市场份额的诱惑。"}],"k":"b","i":1,"h":"17.1.4 寡头数量如何影响市场结果"}],"k":"sec","i":0,"h":"17.1 只有少数几个卖者的市场"},{"t":"17.2 合作经济学","c":[{"t":"囚徒困境（prisoners' dilemma）：两个被捕的囚徒之间的一种特殊\"博弈\"，说明为什么甚至在合作对双方都有利时，保持合作也是困难的；其故事包含适用于任何一个力图维持其成员间合作的集团的一般性结论。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">囚徒困境</strong>（prisoners&#x27; dilemma）：两个被捕的囚徒之间的一种特殊&quot;博弈&quot;，说明为什么甚至在合作对双方都有利时，保持合作也是困难的；其故事包含适用于任何一个力图维持其成员间合作的集团的一般性结论。"},{"t":"17.2.1 囚徒困境","c":[{"t":"故事：Bonnie 和 Clyde 被警察分别审问。警察有足够证据证明非法携带枪支的轻罪（各判1年），并怀疑合伙抢劫银行但缺乏证据；向每人提出交易——坦白并供出同伙可获得自由（同伙判20年），两人都坦白则各判8年。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">故事</strong>：Bonnie 和 Clyde 被警察分别审问。警察有足够证据证明非法携带枪支的轻罪（各判1年），并怀疑合伙抢劫银行但缺乏证据；向每人提出交易——坦白并供出同伙可获得自由（同伙判20年），两人都坦白则各判8年。"},{"t":"占优策略（dominant strategy）：如果无论其他参与者采取什么策略，某一策略都是一个参与者可以采取的最好的策略，这种策略称为占优策略。无论对方坦白还是沉默，坦白都使自己刑期更短，故坦白是每个囚徒的占优策略。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">占优策略</strong>（dominant strategy）：如果无论其他参与者采取什么策略，某一策略都是一个参与者可以采取的最好的策略，这种策略称为占优策略。无论对方坦白还是沉默，坦白都使自己刑期更短，故坦白是每个囚徒的占优策略。"},{"t":"结果：两人都坦白、各判8年。这是一个纳什均衡（其他人策略既定时每人都选择了可能的最优策略），但从两人的角度看是糟糕的结果——都保持沉默各判1年更好。由于各自追求自己的利益，两个囚徒共同达到了使每个人状况都变坏的结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：两人都坦白、各判8年。这是一个纳什均衡（其他人策略既定时每人都选择了可能的最优策略），但从两人的角度看是糟糕的结果——都保持沉默各判1年更好。由于各自追求自己的利益，两个囚徒共同达到了使每个人状况都变坏的结果。"},{"t":"事先协议也没用：即使被捕前做出了不坦白的承诺，一旦被分别审问，利己的逻辑就会起主导作用并使他们坦白——两个囚犯之间的合作难以维持，因为从个人的角度看合作是不理性的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">事先协议也没用</strong>：即使被捕前做出了不坦白的承诺，一旦被分别审问，利己的逻辑就会起主导作用并使他们坦白——两个囚犯之间的合作难以维持，因为从个人的角度看合作是不理性的。"}],"k":"b","i":1,"h":"17.2.1 囚徒困境"},{"t":"17.2.2 作为囚徒困境的寡头","c":[{"t":"Jack 与 Jill 约定各保持30加仑的低产量以维持高价共赚最大利润；达成协议后各自要决定是遵守还是违背：若 Jill 守约，Jack 产40加仑赚2000美元（>守约的1800美元）；若 Jill 违约产40加仑，Jack 产40加仑赚1600美元（>守约的1500美元）——无论对方如何，违背协议保持高产量都是占优策略。","c":[],"k":"b","i":2,"h":"Jack 与 Jill 约定各保持30加仑的低产量以维持高价共赚最大利润；达成协议后各自要决定是遵守还是违背：若 Jill 守约，Jack 产40加仑赚2000美元（&gt;守约的1800美元）；若 Jill 违约产40加仑，Jack 产40加仑赚1600美元（&gt;守约的1500美元）——无论对方如何，违背协议保持高产量都是占优策略。"},{"t":"结果：两人都保持40加仑的高产量，各得较低的1600美元利润——垄断结果对寡头整体来讲是理性的，但每个寡头都有违背协议的激励；正如利己使囚徒坦白，利己也使寡头难以维持低产量、高价格和垄断利润的合作性结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：两人都保持40加仑的高产量，各得较低的1600美元利润——垄断结果对寡头整体来讲是理性的，但每个寡头都有违背协议的激励；正如利己使囚徒坦白，利己也使寡头难以维持低产量、高价格和垄断利润的合作性结果。"},{"t":"案例研究「世界石油市场（OPEC）」：世界大部分石油由少数国家生产，它们组成寡头市场并形成卡特尔——石油输出国组织（OPEC，1960年成立，1973年已有13个成员，控制世界石油储量约四分之三），力图通过协议减产提价并确定各成员产量。OPEC 面临与 Jack 和 Jill 相同的问题：每个成员都受增产以得到总利润更大份额的诱惑，常就减产达成协议后私下违背。1973—1985年合作最成功（原油价格从1972年每桶3美元升至1974年11美元、1981年35美元）；20世纪80年代中期成员就产量发生争议，1986年价格回落至每桶13美元；近年协议越来越难达成实施，油价更多由供求驱动。合作的缺乏损害了产油国利润，但使全世界消费者受益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「世界石油市场</strong>（OPEC）」：世界大部分石油由少数国家生产，它们组成寡头市场并形成卡特尔——石油输出国组织（OPEC，1960年成立，1973年已有13个成员，控制世界石油储量约四分之三），力图通过协议减产提价并确定各成员产量。OPEC 面临与 Jack 和 Jill 相同的问题：每个成员都受增产以得到总利润更大份额的诱惑，常就减产达成协议后私下违背。1973—1985年合作最成功（原油价格从1972年每桶3美元升至1974年11美元、1981年35美元）；20世纪80年代中期成员就产量发生争议，1986年价格回落至每桶13美元；近年协议越来越难达成实施，油价更多由供求驱动。合作的缺乏损害了产油国利润，但使全世界消费者受益。"}],"k":"b","i":1,"h":"17.2.2 作为囚徒困境的寡头"},{"t":"17.2.3 囚徒困境的其他例子","c":[{"t":"军备竞赛：二战后美苏两国就\"建造新式武器还是裁军\"博弈——每个国家都愿意拥有比另一国更强大的军备，也喜欢生活在不受对方军备威胁的安全世界；无论对方军备还是裁军，选择军备都使本国状况更好，军备是每国的占优策略，结果是两国都处于危险之中的不良结果。冷战期间的军备控制谈判和协议面临与寡头维持卡特尔相同的问题（争论保留数量、担心对方违约）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">军备竞赛</strong>：二战后美苏两国就&quot;建造新式武器还是裁军&quot;博弈——每个国家都愿意拥有比另一国更强大的军备，也喜欢生活在不受对方军备威胁的安全世界；无论对方军备还是裁军，选择军备都使本国状况更好，军备是每国的占优策略，结果是两国都处于危险之中的不良结果。冷战期间的军备控制谈判和协议面临与寡头维持卡特尔相同的问题（争论保留数量、担心对方违约）。"},{"t":"公共资源：Exxon 和 Texaco 共同拥有储值1200万美元的公共油田，钻一口井花100万美元；各钻一口井各得一半石油、赚500万美元；若一家钻两口井可得2/3石油、600万美元利润（另一家300万）；若都钻两口井又平分石油，各承担两口井成本、利润只有400万美元。钻两口井是每家公司的占优策略——利己又使博弈者得到不利结果，说明人们倾向于过度使用公共资源（第11章）可看作囚徒困境。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公共资源</strong>：Exxon 和 Texaco 共同拥有储值1200万美元的公共油田，钻一口井花100万美元；各钻一口井各得一半石油、赚500万美元；若一家钻两口井可得2/3石油、600万美元利润（另一家300万）；若都钻两口井又平分石油，各承担两口井成本、利润只有400万美元。钻两口井是每家公司的占优策略——利己又使博弈者得到不利结果，说明人们倾向于过度使用公共资源（第11章）可看作囚徒困境。"}],"k":"b","i":1,"h":"17.2.3 囚徒困境的其他例子"},{"t":"17.2.4 囚徒困境与社会福利","c":[{"t":"合作缺乏是否为社会问题取决于环境：军备竞赛中两国最后都处于危险中，公共资源博弈中额外钻的井完全是浪费——这两种情况下达成合作性结果会使社会状况更好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">合作缺乏是否为社会问题取决于环境</strong>：军备竞赛中两国最后都处于危险中，公共资源博弈中额外钻的井完全是浪费——这两种情况下达成合作性结果会使社会状况更好。"},{"t":"寡头场合相反：垄断结果对寡头是好的，但对物品的消费者是糟糕的；竞争的结果（使总剩余最大化）对社会最好，当寡头不能合作时，他们生产的数量接近于这个最优水平。只有当市场存在竞争时，看不见的手才能引导资源有效率地配置，而只有市场上的企业不能相互合作时，市场才是竞争的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">寡头场合相反</strong>：垄断结果对寡头是好的，但对物品的消费者是糟糕的；竞争的结果（使总剩余最大化）对社会最好，当寡头不能合作时，他们生产的数量接近于这个最优水平。只有当市场存在竞争时，看不见的手才能引导资源有效率地配置，而只有市场上的企业不能相互合作时，市场才是竞争的。"},{"t":"审讯嫌疑犯场合同样：嫌疑犯之间的缺乏合作是合意的，警察可以使更多罪犯认罪服法——囚徒困境对囚犯是一种困境，但对其他每个人都是一种福音。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">审讯嫌疑犯场合同样</strong>：嫌疑犯之间的缺乏合作是合意的，警察可以使更多罪犯认罪服法——囚徒困境对囚犯是一种困境，但对其他每个人都是一种福音。"}],"k":"b","i":1,"h":"17.2.4 囚徒困境与社会福利"},{"t":"17.2.5 人们有时能合作的原因","c":[{"t":"囚徒困境表明合作困难，但并非不可能（并非所有囚犯都出卖同伙、卡特尔也能维持勾结协议）；最经常的情况是，参与者可以解决囚徒困境是因为他们的博弈不是一次性的，而是多次的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">囚徒困境表明合作困难，但并非不可能</strong>（并非所有囚犯都出卖同伙、卡特尔也能维持勾结协议）；最经常的情况是，参与者可以解决囚徒困境是因为他们的博弈不是一次性的，而是多次的。"},{"t":"重复博弈中的惩罚机制：Jack 和 Jill 每周进行同样博弈，可在最初协议中规定——一旦有人违约生产40加仑，两人以后都永远生产40加仑（\"永远违约\"）。这种惩罚容易实施；欺骗的一次性好处是利润从1800增到2000美元，但只能维持一周，以后利润永远降为1600美元——只要参与者都非常关心未来的利润，就会放弃违规带来的一次性好处，合作性结果可能达到。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">重复博弈中的惩罚机制</strong>：Jack 和 Jill 每周进行同样博弈，可在最初协议中规定——一旦有人违约生产40加仑，两人以后都永远生产40加仑（&quot;永远违约&quot;）。这种惩罚容易实施；欺骗的一次性好处是利润从1800增到2000美元，但只能维持一周，以后利润永远降为1600美元——只要参与者都非常关心未来的利润，就会放弃违规带来的一次性好处，合作性结果可能达到。"},{"t":"案例研究「囚徒困境的比赛」：政治学家 Robert Axelrod 主持反复囚徒困境的电脑程序比赛，得分（总刑期）最低者胜。赢家是最简单的\"一报还一报\"（tit-for-tat）策略：从合作开始，然后上一次另一方怎么做自己也怎么做——友好开始、惩罚不友好的参与者、对方重新合作就给予原谅。这种简单策略胜过所有更复杂的策略；它实质是《圣经》\"以眼还眼，以牙还牙\"的策略，可能是进行生活中某些博弈时的一个好的经验法则。（在反复多次的博弈中，一段不合作时期之后允许参与者回到合作性结果的策略，可能比\"永远违约\"的不宽容策略更好。）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「囚徒困境的比赛」</strong>：政治学家 Robert Axelrod 主持反复囚徒困境的电脑程序比赛，得分（总刑期）最低者胜。赢家是最简单的&quot;一报还一报&quot;（tit-for-tat）策略：从合作开始，然后上一次另一方怎么做自己也怎么做——友好开始、惩罚不友好的参与者、对方重新合作就给予原谅。这种简单策略胜过所有更复杂的策略；它实质是《圣经》&quot;以眼还眼，以牙还牙&quot;的策略，可能是进行生活中某些博弈时的一个好的经验法则。（在反复多次的博弈中，一段不合作时期之后允许参与者回到合作性结果的策略，可能比&quot;永远违约&quot;的不宽容策略更好。）"}],"k":"b","i":1,"h":"17.2.5 人们有时能合作的原因"},{"t":"即问即答要点：寡头想维持垄断利润却做不到，正是因为一次性博弈中每个企业都有违反协议的占优激励——这正是囚徒困境告诉我们的关于寡头的道理。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：寡头想维持垄断利润却做不到，正是因为一次性博弈中每个企业都有违反协议的占优激励——这正是囚徒困境告诉我们的关于寡头的道理。"}],"k":"sec","i":0,"h":"17.2 合作经济学"},{"t":"17.3 针对寡头的公共政策","c":[{"t":"总方向：从整个社会角度看，寡头之间的合作是不合意的（产量太低而价格太高）；决策者应努力使寡头企业竞争而不是合作——体现\"政府有时可以改善市场结果\"这一原理。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总方向</strong>：从整个社会角度看，寡头之间的合作是不合意的（产量太低而价格太高）；决策者应努力使寡头企业竞争而不是合作——体现&quot;政府有时可以改善市场结果&quot;这一原理。"},{"t":"17.3.1 贸易限制与反托拉斯法","c":[{"t":"普通法传统：几百年来英国和美国的法官都认定竞争者之间减少产量并提高价格的协议违背了公共利益，拒绝执行这类协议。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">普通法传统</strong>：几百年来英国和美国的法官都认定竞争者之间减少产量并提高价格的协议违背了公共利益，拒绝执行这类协议。"},{"t":"《谢尔曼反托拉斯法》（1890）：把限制各州之间及与外国之间贸易的合约、托拉斯或其他形式的联合、勾结宣布为违法，并规定垄断图谋者可处罚金或监禁——把寡头之间的协议从一种未执行的合约提升为有罪的勾结。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">《谢尔曼反托拉斯法》</strong>（1890）：把限制各州之间及与外国之间贸易的合约、托拉斯或其他形式的联合、勾结宣布为违法，并规定垄断图谋者可处罚金或监禁——把寡头之间的协议从一种未执行的合约提升为有罪的勾结。"},{"t":"《克莱顿法》（1914）：受限制贸易的非法协议危害的个人可提起诉讼并获得三倍于所受损害的赔偿——鼓励私人提起针对勾结寡头的法律诉讼；如今美国司法部和私人方面都有权执行反托拉斯法，既用于阻止使过多市场势力集中于单个企业的合并，也用于防止寡头以降低市场竞争性的方式共同行事。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">《克莱顿法》</strong>（1914）：受限制贸易的非法协议危害的个人可提起诉讼并获得三倍于所受损害的赔偿——鼓励私人提起针对勾结寡头的法律诉讼；如今美国司法部和私人方面都有权执行反托拉斯法，既用于阻止使过多市场势力集中于单个企业的合并，也用于防止寡头以降低市场竞争性的方式共同行事。"},{"t":"案例研究「一次违法的通话」：1983年《纽约时报》报道，美国航空公司总裁 Crandall 电话建议布拉尼夫航空公司总裁 Putnam 将票价提高20%（\"我们想谈什么就能谈什么\"），Putnam 回答\"我们不能谈论定价问题\"并把录音带交给司法部，司法部立即起诉；两年后 Crandall 达成和解，同意接受包括限制与其他航空公司官员接触在内的业务限制。《谢尔曼法》禁止相互竞争的企业的高层管理人员哪怕仅仅是谈论定价问题（亚当·斯密《国富论》早已观察到\"同业者集会的结果是针对公众的合谋，或是某种提高价格的计谋\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「一次违法的通话」</strong>：1983年《纽约时报》报道，美国航空公司总裁 Crandall 电话建议布拉尼夫航空公司总裁 Putnam 将票价提高20%（&quot;我们想谈什么就能谈什么&quot;），Putnam 回答&quot;我们不能谈论定价问题&quot;并把录音带交给司法部，司法部立即起诉；两年后 Crandall 达成和解，同意接受包括限制与其他航空公司官员接触在内的业务限制。《谢尔曼法》禁止相互竞争的企业的高层管理人员哪怕仅仅是谈论定价问题（亚当·斯密《国富论》早已观察到&quot;同业者集会的结果是针对公众的合谋，或是某种提高价格的计谋&quot;）。"}],"k":"b","i":1,"h":"17.3.1 贸易限制与反托拉斯法"},{"t":"17.3.2 关于反托拉斯政策的争论","c":[{"t":"共识与争议：大多数评论者同意竞争企业之间的价格勾结协议应该是非法的；但反托拉斯法还被用于谴责一些影响并不明显的经营做法，三个例子如下。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">共识与争议</strong>：大多数评论者同意竞争企业之间的价格勾结协议应该是非法的；但反托拉斯法还被用于谴责一些影响并不明显的经营做法，三个例子如下。"},{"t":"转售价格维持（resale price maintenance）：制造商（如超级电子公司以50美元把播放机卖给零售商）要求零售商向顾客收取指定价格（75美元）。乍看反竞争，法庭往往认定其违背反托拉斯法；但辩护者的两个理由——第一，它不是减少竞争的有效工具：公司若有市场势力可通过批发价格实施，且零售商卡特尔出售数量低于竞争的零售商，制造商状况反而变坏；第二，它有合理目标：防止顾客在提供展示间和销售服务的商店了解产品、再到不提供服务的折扣店购买的搭便车行为（良好服务是零售商们的公共物品），转售价格维持是解决搭便车问题的方法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">转售价格维持</strong>（resale price maintenance）：制造商（如超级电子公司以50美元把播放机卖给零售商）要求零售商向顾客收取指定价格（75美元）。乍看反竞争，法庭往往认定其违背反托拉斯法；但辩护者的两个理由——第一，它不是减少竞争的有效工具：公司若有市场势力可通过批发价格实施，且零售商卡特尔出售数量低于竞争的零售商，制造商状况反而变坏；第二，它有合理目标：防止顾客在提供展示间和销售服务的商店了解产品、再到不提供服务的折扣店购买的搭便车行为（良好服务是零售商们的公共物品），转售价格维持是解决搭便车问题的方法。"},{"t":"掠夺性定价（predatory pricing）：有市场势力的大企业（如 Coyote 航空）为把新进入者（Roadrunner，夺走20%市场）赶出市场、以便恢复垄断再提价而大幅降价。虽然这是反托拉斯诉讼中的普遍说法，但经济学家怀疑它不太可能甚至根本不可能获利：价格战的价格必须低于成本，掠夺者因市场份额大而承担大部分亏损（\"掠夺者遭受的苦难大于被掠夺者\"，如哔哗鸟与歪心狼动画片）；法庭也难以说明哪种降价是竞争性的、哪种是掠夺性的，尚无简单答案。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">掠夺性定价</strong>（predatory pricing）：有市场势力的大企业（如 Coyote 航空）为把新进入者（Roadrunner，夺走20%市场）赶出市场、以便恢复垄断再提价而大幅降价。虽然这是反托拉斯诉讼中的普遍说法，但经济学家怀疑它不太可能甚至根本不可能获利：价格战的价格必须低于成本，掠夺者因市场份额大而承担大部分亏损（&quot;掠夺者遭受的苦难大于被掠夺者&quot;，如哔哗鸟与歪心狼动画片）；法庭也难以说明哪种降价是竞争性的、哪种是掠夺性的，尚无简单答案。"},{"t":"搭售（tying，捆绑销售）：以单一价格同时提供两种产品而非分别定价（如 Makemoney 制片厂将高票房的《复仇者联盟》与不盈利的《哈姆雷特》捆绑）。最高法院以\"用高需求产品迫使买者购买低需求产品、扩大市场势力\"为由禁止；但经济学家指出：强迫接受一文不值的产品并不能提高买者的支付意愿，捆绑不能简单增加市场势力；更合理的解释是搭售是价格歧视的一种形式——当不同买者对两种产品评价相反时（城市影院愿为两片分别付1.5万/0.5万，乡村影院相反），分别定价只能各收1.5万，捆绑则可从每家收2万，接近买者总支付意愿。搭售对社会是否有不利影响尚不明确。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">搭售</strong>（tying，捆绑销售）：以单一价格同时提供两种产品而非分别定价（如 Makemoney 制片厂将高票房的《复仇者联盟》与不盈利的《哈姆雷特》捆绑）。最高法院以&quot;用高需求产品迫使买者购买低需求产品、扩大市场势力&quot;为由禁止；但经济学家指出：强迫接受一文不值的产品并不能提高买者的支付意愿，捆绑不能简单增加市场势力；更合理的解释是搭售是价格歧视的一种形式——当不同买者对两种产品评价相反时（城市影院愿为两片分别付1.5万/0.5万，乡村影院相反），分别定价只能各收1.5万，捆绑则可从每家收2万，接近买者总支付意愿。搭售对社会是否有不利影响尚不明确。"},{"t":"一般原则：看起来减少竞争的经营做法实际上可能有其合理的目的——这个原则使反托拉斯法的适用变得更为困难，执法的经济学家、律师和法官必须确定公共政策应禁止哪一类抑制竞争并减少经济福利的行为，这项工作通常并不容易。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般原则</strong>：看起来减少竞争的经营做法实际上可能有其合理的目的——这个原则使反托拉斯法的适用变得更为困难，执法的经济学家、律师和法官必须确定公共政策应禁止哪一类抑制竞争并减少经济福利的行为，这项工作通常并不容易。"},{"t":"案例研究「微软案」：1998年美国政府起诉微软，中心问题是搭售——是否应允许微软把互联网浏览器与 Windows 操作系统捆绑。政府称捆绑是为了把操作系统市场的市场势力扩大到不相关的浏览器市场、阻止其他软件公司进入；微软辩称把新功能融入老产品是技术进步自然而然的一部分（汽车融入CD播放器和空调、照相机有内置闪光灯），且 Windows 定价低（约占普通电脑价格的3%）说明其市场势力受限。1999年法官 Jackson 判定微软有极大垄断势力并非法滥用；2000年他命令拆分微软为两个公司，上诉法院驳回拆分命令；2001年司法部不再要求拆分；2002年和解——微软接受对某些经营做法的限制，政府同意浏览器仍可作为 Windows 的一部分；此后微软仍面临多起私人反垄断诉讼和欧盟认定的反竞争行为诉讼。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「微软案」</strong>：1998年美国政府起诉微软，中心问题是搭售——是否应允许微软把互联网浏览器与 Windows 操作系统捆绑。政府称捆绑是为了把操作系统市场的市场势力扩大到不相关的浏览器市场、阻止其他软件公司进入；微软辩称把新功能融入老产品是技术进步自然而然的一部分（汽车融入CD播放器和空调、照相机有内置闪光灯），且 Windows 定价低（约占普通电脑价格的3%）说明其市场势力受限。1999年法官 Jackson 判定微软有极大垄断势力并非法滥用；2000年他命令拆分微软为两个公司，上诉法院驳回拆分命令；2001年司法部不再要求拆分；2002年和解——微软接受对某些经营做法的限制，政府同意浏览器仍可作为 Windows 的一部分；此后微软仍面临多起私人反垄断诉讼和欧盟认定的反竞争行为诉讼。"},{"t":"新闻摘录「欧盟对谷歌」：2015年欧盟委员会正式起诉谷歌为自己的比价服务歪曲搜索结果，并加强调查其安卓操作系统。欧盟对美高科技公司的大规模诉讼始于2000年对微软的指控（后追加媒体播放器与浏览器捆绑之诉），微软最终支付22亿欧元罚款；反垄断诉讼还改变了微软的文化。欧美法律标准存在差异：美国反垄断法主要保护消费者，欧洲还保护竞争者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新闻摘录「欧盟对谷歌」</strong>：2015年欧盟委员会正式起诉谷歌为自己的比价服务歪曲搜索结果，并加强调查其安卓操作系统。欧盟对美高科技公司的大规模诉讼始于2000年对微软的指控（后追加媒体播放器与浏览器捆绑之诉），微软最终支付22亿欧元罚款；反垄断诉讼还改变了微软的文化。欧美法律标准存在差异：美国反垄断法主要保护消费者，欧洲还保护竞争者。"}],"k":"b","i":1,"h":"17.3.2 关于反托拉斯政策的争论"},{"t":"即问即答要点：企业达成的（竞争者之间减少产量、提高价格的）协议是非法的；反托拉斯法存在争议，因为一些看来减少竞争的经营做法（转售价格维持、掠夺性定价、搭售）实际上可能有其合理的目的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：企业达成的（竞争者之间减少产量、提高价格的）协议是非法的；反托拉斯法存在争议，因为一些看来减少竞争的经营做法（转售价格维持、掠夺性定价、搭售）实际上可能有其合理的目的。"}],"k":"sec","i":0,"h":"17.3 针对寡头的公共政策"},{"t":"17.4 结论","c":[{"t":"寡头希望像垄断者那样行事，但利己使他们趋近于竞争；寡头最终介于这两者之间的何处，取决于寡头市场上的企业数量以及这些企业的合作程度如何。","c":[],"k":"b","i":1,"h":"寡头希望像垄断者那样行事，但利己使他们趋近于竞争；寡头最终介于这两者之间的何处，取决于寡头市场上的企业数量以及这些企业的合作程度如何。"},{"t":"囚徒困境的故事说明了为什么寡头即使在合作符合它们的最大利益时也不能维持合作。","c":[],"k":"b","i":1,"h":"囚徒困境的故事说明了为什么寡头即使在合作符合它们的最大利益时也不能维持合作。"},{"t":"决策者通过反托拉斯法管制寡头的行为，其适用范围一直备受争议：竞争企业之间的价格勾结显然减少经济福利、应该是违法的；但一些看来减少了竞争的经营做法也可能有合理的（即便微小）目的——决策者在运用反托拉斯法的巨大权力来限制企业行为时，需谨慎行事。","c":[],"k":"b","i":1,"h":"决策者通过反托拉斯法管制寡头的行为，其适用范围一直备受争议：竞争企业之间的价格勾结显然减少经济福利、应该是违法的；但一些看来减少了竞争的经营做法也可能有合理的（即便微小）目的——决策者在运用反托拉斯法的巨大权力来限制企业行为时，需谨慎行事。"}],"k":"sec","i":0,"h":"17.4 结论"}],"k":"chap","h":"第17章 寡头"}],"k":"part","h":"第5篇 企业行为与产业组织","col":"#e25563","pc":"p5"},{"t":"第6篇 劳动市场经济学","c":[{"t":"第18章 生产要素市场","c":[{"t":"本章内容提要","c":[{"t":"经济的收入是在生产要素市场上分配的，三种最重要的生产要素是劳动、土地和资本。","c":[],"k":"b","i":1,"h":"经济的收入是在生产要素市场上分配的，三种最重要的生产要素是劳动、土地和资本。"},{"t":"要素需求（例如劳动需求）是一种派生需求，它产生于用这些要素生产物品与服务的企业；竞争的、以利润最大化为目标的企业在某种要素的边际产量值等于其价格这一点上使用该要素。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">要素需求</strong>（例如劳动需求）是一种派生需求，它产生于用这些要素生产物品与服务的企业；竞争的、以利润最大化为目标的企业在某种要素的边际产量值等于其价格这一点上使用该要素。"},{"t":"劳动的供给产生于个人在工作和闲暇之间的权衡取舍；向右上方倾斜的劳动供给曲线意味着人们对工资上升的反应是更多工作、更少享受闲暇。","c":[],"k":"b","i":1,"h":"劳动的供给产生于个人在工作和闲暇之间的权衡取舍；向右上方倾斜的劳动供给曲线意味着人们对工资上升的反应是更多工作、更少享受闲暇。"},{"t":"支付给每种要素的价格的调整使该要素的供求趋于平衡；由于要素需求反映了该要素的边际产量值，均衡时每种要素都根据其对物品和服务生产的边际贡献获得报酬。","c":[],"k":"b","i":1,"h":"支付给每种要素的价格的调整使该要素的供求趋于平衡；由于要素需求反映了该要素的边际产量值，均衡时每种要素都根据其对物品和服务生产的边际贡献获得报酬。"},{"t":"由于生产要素是同时使用的，任何一种要素的边际产量都取决于可以得到的所有要素量，因此一种要素供给的变动会改变所有要素的均衡收入。","c":[],"k":"b","i":1,"h":"由于生产要素是同时使用的，任何一种要素的边际产量都取决于可以得到的所有要素量，因此一种要素供给的变动会改变所有要素的均衡收入。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"18.1 对劳动的需求","c":[{"t":"引论：供给与需求的基本工具同样适用于劳动市场——苹果市场决定苹果价格，摘苹果工人市场决定工资；劳动市场区别于大多数其他市场之处在于劳动需求是派生需求（derived demand），即企业的要素需求是从它向另一个市场供给物品的决策派生出来的（对程序员的需求与软件供给相联，对加油站服务员的需求与汽油供给相联）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">引论</strong>：供给与需求的基本工具同样适用于劳动市场——苹果市场决定苹果价格，摘苹果工人市场决定工资；劳动市场区别于大多数其他市场之处在于劳动需求是派生需求（derived demand），即企业的要素需求是从它向另一个市场供给物品的决策派生出来的（对程序员的需求与软件供给相联，对加油站服务员的需求与汽油供给相联）。"},{"t":"18.1.1 竞争的、以利润最大化为目标的企业","c":[{"t":"假设一（竞争性）：企业在产品市场（作为卖者）和劳动市场（作为买者）都是竞争性的，是价格接受者，对市场价格和工资几乎没有影响，只需决定出售多少产品、雇用多少工人。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">假设一</strong>（竞争性）：企业在产品市场（作为卖者）和劳动市场（作为买者）都是竞争性的，是价格接受者，对市场价格和工资几乎没有影响，只需决定出售多少产品、雇用多少工人。"},{"t":"假设二（利润最大化）：企业并不直接关心雇用工人数和产量，只关心利润（总收益减总成本）；苹果供给与工人需求都由利润最大化这一首要目标派生而来。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">假设二</strong>（利润最大化）：企业并不直接关心雇用工人数和产量，只关心利润（总收益减总成本）；苹果供给与工人需求都由利润最大化这一首要目标派生而来。"}],"k":"b","i":1,"h":"18.1.1 竞争的、以利润最大化为目标的企业"},{"t":"18.1.2 生产函数与劳动的边际产量","c":[{"t":"术语：生产函数（production function）——用于生产一种物品的投入量与该物品产量之间的关系（此处投入为摘苹果工人，产出为苹果，果树、土地、卡车等其他投入固定）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：生产函数（production function）——用于生产一种物品的投入量与该物品产量之间的关系（此处投入为摘苹果工人，产出为苹果，果树、土地、卡车等其他投入固定）。"},{"t":"术语：劳动的边际产量（marginal product of labor, MPL）——增加一单位劳动所引起的产量增加量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：劳动的边际产量（marginal product of labor, MPL）——增加一单位劳动所引起的产量增加量。"},{"t":"术语：边际产量递减（diminishing marginal product）——一单位投入的边际产量随着投入量增加而减少的性质。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：边际产量递减（diminishing marginal product）——一单位投入的边际产量随着投入量增加而减少的性质。"},{"t":"书中数字（示例）：雇1个工人每周摘100蒲式耳苹果，雇2个共摘180蒲式耳（第2个工人 MPL=80），3个共240（MPL=60），4个共280（MPL=40），5个共300（MPL=20）；工人增多后只能爬高梯摘果，新增工人贡献越来越小，生产函数随投入增加越来越平坦。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中数字</strong>（示例）：雇1个工人每周摘100蒲式耳苹果，雇2个共摘180蒲式耳（第2个工人 MPL=80），3个共240（MPL=60），4个共280（MPL=40），5个共300（MPL=20）；工人增多后只能爬高梯摘果，新增工人贡献越来越小，生产函数随投入增加越来越平坦。"}],"k":"b","i":1,"h":"18.1.2 生产函数与劳动的边际产量"},{"t":"18.1.3 边际产量值和劳动需求","c":[{"t":"术语：边际产量值（value of the marginal product, VMPL）——一种投入的边际产量乘以该产品的价格，即 VMPL = P × MPL；经济学家有时称之为边际收益产量（企业从多使用一单位要素中得到的额外收益）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：边际产量值（value of the marginal product, VMPL）——一种投入的边际产量乘以该产品的价格，即 VMPL = P × MPL；经济学家有时称之为边际收益产量（企业从多使用一单位要素中得到的额外收益）。"},{"t":"术语：劳动需求（labor demand）——企业在每一种既定工资水平下所需要的劳动数量；由于竞争企业产品价格不变而边际产量递减，VMPL 随工人数增加而递减，VMPL 曲线向右下方倾斜。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：劳动需求（labor demand）——企业在每一种既定工资水平下所需要的劳动数量；由于竞争企业产品价格不变而边际产量递减，VMPL 随工人数增加而递减，VMPL 曲线向右下方倾斜。"},{"t":"雇佣决策规则：企业雇用工人数要达到 VMPL 等于工资的那一点（VMPL = W）；低于该水平再多雇1个工人增加利润，高于该水平雇用边际工人无利可图。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">雇佣决策规则</strong>：企业雇用工人数要达到 VMPL 等于工资的那一点（VMPL = W）；低于该水平再多雇1个工人增加利润，高于该水平雇用边际工人无利可图。"},{"t":"书中数字（示例）：苹果每蒲式耳10美元、市场工资每周500美元时，第1个工人 VMPL=1000美元（利润+500），第2个800美元（+300），第3个600美元（+100），第4个400美元（亏损100），故企业只雇3个工人。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中数字</strong>（示例）：苹果每蒲式耳10美元、市场工资每周500美元时，第1个工人 VMPL=1000美元（利润+500），第2个800美元（+300），第3个600美元（+100），第4个400美元（亏损100），故企业只雇3个工人。"},{"t":"核心结论：对一个竞争性的、以利润最大化为目标的企业来说，边际产量值曲线就是它的劳动需求曲线。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心结论</strong>：对一个竞争性的、以利润最大化为目标的企业来说，边际产量值曲线就是它的劳动需求曲线。"},{"t":"参考资料「投入需求与产量供给：同一枚硬币的两面」：若工资 W、边际产量 MPL，则一单位产量的边际成本 MC = W/MPL；把 VMPL = W 两边除以 MPL 即得 P = MC——企业雇劳动到 VMPL = W 之时，正是其产量达到 P = MC 之时，投入需求决策与产量供给决策是同一枚硬币的正反两面；边际产量递减与边际成本递增紧密相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「投入需求与产量供给</strong>：同一枚硬币的两面」：若工资 W、边际产量 MPL，则一单位产量的边际成本 MC = W/MPL；把 VMPL = W 两边除以 MPL 即得 P = MC——企业雇劳动到 VMPL = W 之时，正是其产量达到 P = MC 之时，投入需求决策与产量供给决策是同一枚硬币的正反两面；边际产量递减与边际成本递增紧密相关。"}],"k":"b","i":1,"h":"18.1.3 边际产量值和劳动需求"},{"t":"18.1.4 什么会引起劳动需求曲线移动","c":[{"t":"产品价格：VMPL = P × MPL，苹果价格上升提高每个工人的边际产量值、使劳动需求曲线右移；价格下降则左移。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">产品价格</strong>：VMPL = P × MPL，苹果价格上升提高每个工人的边际产量值、使劳动需求曲线右移；价格下降则左移。"},{"t":"技术变革：1960—2015年普通美国工人每小时产量增加195%（实际工资同期上升165%、就业翻了一番）；劳动扩张型技术进步（如钉枪之于木匠）提高劳动边际产量、使需求右移；劳动节约型技术变革（如廉价工业机器人）降低劳动边际产量、使需求左移；历史上大多数技术进步是劳动扩张型的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">技术变革</strong>：1960—2015年普通美国工人每小时产量增加195%（实际工资同期上升165%、就业翻了一番）；劳动扩张型技术进步（如钉枪之于木匠）提高劳动边际产量、使需求右移；劳动节约型技术变革（如廉价工业机器人）降低劳动边际产量、使需求左移；历史上大多数技术进步是劳动扩张型的。"},{"t":"其他要素的供给：一种要素的可获得量影响其他要素的边际产量，如梯子供给减少会降低摘苹果工人的边际产量，从而减少对摘苹果工人的需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">其他要素的供给</strong>：一种要素的可获得量影响其他要素的边际产量，如梯子供给减少会降低摘苹果工人的边际产量，从而减少对摘苹果工人的需求。"},{"t":"即问即答要点：MPL 是增加一单位劳动增加的产量，VMPL 是 MPL 乘以产品价格；竞争性利润最大化企业按 VMPL = W 决定雇用量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：MPL 是增加一单位劳动增加的产量，VMPL 是 MPL 乘以产品价格；竞争性利润最大化企业按 VMPL = W 决定雇用量。"}],"k":"b","i":1,"h":"18.1.4 什么会引起劳动需求曲线移动"}],"k":"sec","i":0,"h":"18.1 对劳动的需求"},{"t":"18.2 对劳动的供给","c":[{"t":"18.2.1 工作与闲暇之间的权衡取舍","c":[{"t":"术语：劳动供给（labor supply）——工人在每种既定工资下愿意提供的劳动量，其背后是工作与闲暇之间的权衡取舍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：劳动供给（labor supply）——工人在每种既定工资下愿意提供的劳动量，其背后是工作与闲暇之间的权衡取舍。"},{"t":"机会成本逻辑：一小时闲暇的机会成本就是一小时工资（工资每小时15美元时为15美元）；工资上升到20美元时闲暇的机会成本增加，工人以减少闲暇、增加工作回应，故劳动供给曲线向右上方倾斜。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机会成本逻辑</strong>：一小时闲暇的机会成本就是一小时工资（工资每小时15美元时为15美元）；工资上升到20美元时闲暇的机会成本增加，工人以减少闲暇、增加工作回应，故劳动供给曲线向右上方倾斜。"},{"t":"例外提示：工资上升也使人更富有，高工资下人们可能选择更多闲暇，使劳动供给曲线向后弯曲（收入效应与替代效应的冲突，留待第21章）；本章暂假设曲线向右上方倾斜。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例外提示</strong>：工资上升也使人更富有，高工资下人们可能选择更多闲暇，使劳动供给曲线向后弯曲（收入效应与替代效应的冲突，留待第21章）；本章暂假设曲线向右上方倾斜。"}],"k":"b","i":1,"h":"18.2.1 工作与闲暇之间的权衡取舍"},{"t":"18.2.2 什么会引起劳动供给曲线移动","c":[{"t":"爱好变动：1950年34%的女性从事有酬职业或正在找工作，2015年升至57%（家庭规模变小、更多母亲工作），劳动供给增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">爱好变动</strong>：1950年34%的女性从事有酬职业或正在找工作，2015年升至57%（家庭规模变小、更多母亲工作），劳动供给增加。"},{"t":"可供选择的机会改变：任何一个劳动市场的供给都取决于其他市场上的机会，如摘梨工资突然上升会使一些摘苹果工人转业，摘苹果市场劳动供给减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">可供选择的机会改变</strong>：任何一个劳动市场的供给都取决于其他市场上的机会，如摘梨工资突然上升会使一些摘苹果工人转业，摘苹果市场劳动供给减少。"},{"t":"移民：工人跨地区、跨国家流动改变两地劳动供给；许多关于移民的争论集中在它对劳动供给和均衡工资的影响上。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">移民</strong>：工人跨地区、跨国家流动改变两地劳动供给；许多关于移民的争论集中在它对劳动供给和均衡工资的影响上。"},{"t":"即问即答要点：脑外科医生享受闲暇的机会成本高于看门人（其工资更高），这有助于解释医生工作时间如此之长。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：脑外科医生享受闲暇的机会成本高于看门人（其工资更高），这有助于解释医生工作时间如此之长。"}],"k":"b","i":1,"h":"18.2.2 什么会引起劳动供给曲线移动"}],"k":"sec","i":0,"h":"18.2 对劳动的供给"},{"t":"18.3 劳动市场的均衡","c":[{"t":"同时成立的两个结论：工资自发调整使劳动的供求达到平衡；工资等于劳动的边际产量值。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">同时成立的两个结论</strong>：工资自发调整使劳动的供求达到平衡；工资等于劳动的边际产量值。"},{"t":"术语：均衡工资（equilibrium wage）——使劳动供给量与需求量相等的工资水平；均衡时每个企业都在该工资下雇用了有利可图的最大劳动量（即雇到 VMPL = W），因此均衡工资必定等于劳动的边际产量值。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：均衡工资（equilibrium wage）——使劳动供给量与需求量相等的工资水平；均衡时每个企业都在该工资下雇用了有利可图的最大劳动量（即雇到 VMPL = W），因此均衡工资必定等于劳动的边际产量值。"},{"t":"一般性结论：改变劳动供求的任何事件必定使均衡工资和边际产量值等量变动，因为这两个量总是相等的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">一般性结论</strong>：改变劳动供求的任何事件必定使均衡工资和边际产量值等量变动，因为这两个量总是相等的。"},{"t":"18.3.1 劳动供给的移动","c":[{"t":"移民使摘苹果工人供给从 S1 右移到 S2：原工资下劳动过剩压低工资，工资下降使企业多雇工人有利可图，工人增多使边际产量与边际产量值下降——新均衡下工资与边际产量值都低于移民流入前（就业增加）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">移民使摘苹果工人供给从 S1 右移到 S2</strong>：原工资下劳动过剩压低工资，工资下降使企业多雇工人有利可图，工人增多使边际产量与边际产量值下降——新均衡下工资与边际产量值都低于移民流入前（就业增加）。"},{"t":"以色列事例（Angrist 研究）：1988年以色列针对被占领土动乱实施戒严、严查工作许可证，在以色列工作的巴勒斯坦人数量减少一半，留下者的工资增加约50%——留下工人的边际产量值大大提高，与理论预期完全一致。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">以色列事例</strong>（Angrist 研究）：1988年以色列针对被占领土动乱实施戒严、严查工作许可证，在以色列工作的巴勒斯坦人数量减少一半，留下者的工资增加约50%——留下工人的边际产量值大大提高，与理论预期完全一致。"},{"t":"一般均衡效应：经济由拥有不同工人的各种劳动市场组成；移民可能使其求职市场工资下降，却可能增加其他市场的需求（若移民是医生并购买苹果，摘苹果工人需求与工资上升）——移民的全部影响比表面更复杂。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般均衡效应</strong>：经济由拥有不同工人的各种劳动市场组成；移民可能使其求职市场工资下降，却可能增加其他市场的需求（若移民是医生并购买苹果，摘苹果工人需求与工资上升）——移民的全部影响比表面更复杂。"},{"t":"新闻摘录「移民经济学」（达拉斯联储 Orrenius 访谈）要点：移民约占美国人口13%（约4200万出生在外国），未注册者约1130万；美国依靠移民既做高技能工作（超过1/3的科学与工程博士学位授予外国出生学生，STEM 领域外国出生工人更具创新性）也做低技能工作；高技能移民经济与财政影响均为正，低技能移民带来低价等经济利益但财政影响往往消极（州与地方负担教育医疗支出）；低技能美国工人真实工资下降中约1%—3%由移民引起，资本流入与生产流程进步会部分抵消移民的工资效应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新闻摘录「移民经济学」</strong>（达拉斯联储 Orrenius 访谈）要点：移民约占美国人口13%（约4200万出生在外国），未注册者约1130万；美国依靠移民既做高技能工作（超过1/3的科学与工程博士学位授予外国出生学生，STEM 领域外国出生工人更具创新性）也做低技能工作；高技能移民经济与财政影响均为正，低技能移民带来低价等经济利益但财政影响往往消极（州与地方负担教育医疗支出）；低技能美国工人真实工资下降中约1%—3%由移民引起，资本流入与生产流程进步会部分抵消移民的工资效应。"}],"k":"b","i":1,"h":"18.3.1 劳动供给的移动"},{"t":"18.3.2 劳动需求的移动","c":[{"t":"苹果价格上升不改变既定工人数下的边际产量，但提高边际产量值，劳动需求右移，均衡工资与均衡就业量同时上升；反之同时下降。","c":[],"k":"b","i":2,"h":"苹果价格上升不改变既定工人数下的边际产量，但提高边际产量值，劳动需求右移，均衡工资与均衡就业量同时上升；反之同时下降。"},{"t":"推论：行业中企业的繁荣与工人的繁荣密切相关——苹果生产者利润多时摘苹果工人工资也高，石油工人收入与世界原油价格密切相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推论</strong>：行业中企业的繁荣与工人的繁荣密切相关——苹果生产者利润多时摘苹果工人工资也高，石油工人收入与世界原油价格密切相关。"}],"k":"b","i":1,"h":"18.3.2 劳动需求的移动"},{"t":"案例研究「生产率与工资」","c":[{"t":"命题：工资等于用劳动边际产量值衡量的生产率——生产率高的工人工资高，生产率低的工人工资低（第1章\"生活水平取决于生产能力\"原理在劳动市场的体现）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">命题</strong>：工资等于用劳动边际产量值衡量的生产率——生产率高的工人工资高，生产率低的工人工资低（第1章&quot;生活水平取决于生产能力&quot;原理在劳动市场的体现）。"},{"t":"1960—2015年：生产率（每小时产量）每年增长约2.0%，实际工资每年增长1.8%，几乎相等（该速度下约每35年翻一番）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">1960—2015年</strong>：生产率（每小时产量）每年增长约2.0%，实际工资每年增长1.8%，几乎相等（该速度下约每35年翻一番）。"},{"t":"1973年左右生产率增长从每年2.7%放缓到1.4%（持续到1995年，原因尚无很好解释），实际工资增长相应从每年2.7%放缓到1.2%。","c":[],"k":"b","i":2,"h":"1973年左右生产率增长从每年2.7%放缓到1.4%（持续到1995年，原因尚无很好解释），实际工资增长相应从每年2.7%放缓到1.2%。"},{"t":"1995年左右生产率增长加速（主要归因于电脑与信息技术的传播），1995—2015年生产率每年增长2.1%，实际工资每年增长1.8%——理论与历史都证明生产率与实际工资紧密联系。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">1995年左右生产率增长加速</strong>（主要归因于电脑与信息技术的传播），1995—2015年生产率每年增长2.1%，实际工资每年增长1.8%——理论与历史都证明生产率与实际工资紧密联系。"}],"k":"b","i":1,"h":"案例研究「生产率与工资」"},{"t":"参考资料「买方垄断」","c":[{"t":"术语：买方垄断（monopsony）——只有一个买者的市场，类似于垄断（只有一个卖者的市场）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：买方垄断（monopsony）——只有一个买者的市场，类似于垄断（只有一个卖者的市场）。"},{"t":"买方垄断雇主雇用的工人少于竞争企业，通过减少可获得的工作数量沿劳动供给曲线压低工资、增加利润；市场势力扭曲结果并引起无谓损失。","c":[],"k":"b","i":2,"h":"买方垄断雇主雇用的工人少于竞争企业，通过减少可获得的工作数量沿劳动供给曲线压低工资、增加利润；市场势力扭曲结果并引起无谓损失。"},{"t":"现实中买方垄断极少见（工人通常有许多可能雇主），供求模型仍是最好的分析工具。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现实中买方垄断极少见</strong>（工人通常有许多可能雇主），供求模型仍是最好的分析工具。"}],"k":"b","i":1,"h":"参考资料「买方垄断」"}],"k":"sec","i":0,"h":"18.3 劳动市场的均衡"},{"t":"18.4 其他生产要素：土地和资本","c":[{"t":"术语：资本（capital）——用于生产物品与服务的设备和建筑物的存量，即经济中过去生产的物品的积累并被用于生产新物品和服务（苹果企业的梯子、卡车、贮藏建筑物乃至苹果树本身）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：资本（capital）——用于生产物品与服务的设备和建筑物的存量，即经济中过去生产的物品的积累并被用于生产新物品和服务（苹果企业的梯子、卡车、贮藏建筑物乃至苹果树本身）。"},{"t":"18.4.1 土地和资本市场的均衡","c":[{"t":"两种价格的区分：购买价格是为无限期拥有生产要素而支付的价格；租赁价格是为在有限时期内使用生产要素而支付的价格；工资就是劳动的租赁价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两种价格的区分</strong>：购买价格是为无限期拥有生产要素而支付的价格；租赁价格是为在有限时期内使用生产要素而支付的价格；工资就是劳动的租赁价格。"},{"t":"均衡：土地的租赁价格与资本的租赁价格都由供给和需求决定；企业租用土地或资本也遵循与雇用劳动相同的逻辑——一直增加租用量直到该要素的边际产量值等于其价格，故每种要素的需求曲线反映该要素的边际生产率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">均衡</strong>：土地的租赁价格与资本的租赁价格都由供给和需求决定；企业租用土地或资本也遵循与雇用劳动相同的逻辑——一直增加租用量直到该要素的边际产量值等于其价格，故每种要素的需求曲线反映该要素的边际生产率。"},{"t":"收入分配结论：只要企业是竞争性且利润最大化的，每种要素的租赁价格就必须等于该要素的边际产量值——劳动、土地和资本各自赚到它们在生产过程中的边际贡献的价值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">收入分配结论</strong>：只要企业是竞争性且利润最大化的，每种要素的租赁价格就必须等于该要素的边际产量值——劳动、土地和资本各自赚到它们在生产过程中的边际贡献的价值。"},{"t":"购买价格的决定：租赁价格与购买价格相关——能产生有价值租赁收入流的要素买者愿出更高价，故均衡购买价格取决于当前的边际产量值以及预期未来的边际产量值。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">购买价格的决定</strong>：租赁价格与购买价格相关——能产生有价值租赁收入流的要素买者愿出更高价，故均衡购买价格取决于当前的边际产量值以及预期未来的边际产量值。"},{"t":"参考资料「什么是资本收入」：资本收入最终以利息（付给债券持有者和银行储户）、股利（付给股东）与留存收益（留在企业内增加未来收益、抬高股价）等形式归于家庭；无论形式如何，资本都根据其边际产量值获得报酬。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「什么是资本收入」</strong>：资本收入最终以利息（付给债券持有者和银行储户）、股利（付给股东）与留存收益（留在企业内增加未来收益、抬高股价）等形式归于家庭；无论形式如何，资本都根据其边际产量值获得报酬。"}],"k":"b","i":1,"h":"18.4.1 土地和资本市场的均衡"},{"t":"18.4.2 生产要素之间的联系","c":[{"t":"原理：任何一种要素的边际产量取决于可得到的其他要素量；由边际产量递减，供给充足的要素边际产量低从而价格低，供给稀缺的要素边际产量高从而价格高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原理</strong>：任何一种要素的边际产量取决于可得到的其他要素量；由边际产量递减，供给充足的要素边际产量低从而价格低，供给稀缺的要素边际产量高从而价格高。"},{"t":"传导机制（飓风毁梯之例）：飓风毁坏梯子→梯子供给减少、梯子均衡租赁价格上升→摘苹果工人边际产量减少→对摘苹果工人的需求下降→均衡工资下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传导机制</strong>（飓风毁梯之例）：飓风毁坏梯子→梯子供给减少、梯子均衡租赁价格上升→摘苹果工人边际产量减少→对摘苹果工人的需求下降→均衡工资下降。"},{"t":"一般结论：改变任何一种生产要素供给的事件会改变所有要素的收入；任何一种要素收入的变动，都可以通过分析该事件对该要素边际产量值的影响来确定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般结论</strong>：改变任何一种生产要素供给的事件会改变所有要素的收入；任何一种要素收入的变动，都可以通过分析该事件对该要素边际产量值的影响来确定。"}],"k":"b","i":1,"h":"18.4.2 生产要素之间的联系"},{"t":"案例研究「黑死病的经济学」","c":[{"t":"事实：14世纪欧洲鼠疫（黑死病）在短短几年内夺去大约三分之一人口。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">事实</strong>：14世纪欧洲鼠疫（黑死病）在短短几年内夺去大约三分之一人口。"},{"t":"劳动市场：工人供给减少→劳动的边际产量增加（边际产量递减反向起作用）→工资提高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">劳动市场</strong>：工人供给减少→劳动的边际产量增加（边际产量递减反向起作用）→工资提高。"},{"t":"土地市场：耕种土地的工人减少→增加一单位土地生产的额外产量减少→土地的边际产量减少→地租下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">土地市场</strong>：耕种土地的工人减少→增加一单位土地生产的额外产量减少→土地的边际产量减少→地租下降。"},{"t":"历史证据与理论一致：这一时期工资翻了将近一番，租金减少了50%甚至更多；黑死病给农民阶级带来经济繁荣，使土地阶级收入减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">历史证据与理论一致</strong>：这一时期工资翻了将近一番，租金减少了50%甚至更多；黑死病给农民阶级带来经济繁荣，使土地阶级收入减少。"}],"k":"b","i":1,"h":"案例研究「黑死病的经济学」"}],"k":"sec","i":0,"h":"<strong class=\"lead\">18.4 其他生产要素</strong>：土地和资本"},{"t":"18.5 结论","c":[{"t":"本章理论即新古典分配理论（neoclassical theory of distribution）：每种生产要素所得到的报酬量取决于该要素的供给与需求，需求取决于该要素的边际生产率；均衡时每种要素都获得它在物品与服务生产中所提供的边际贡献的价值。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章理论即新古典分配理论</strong>（neoclassical theory of distribution）：每种生产要素所得到的报酬量取决于该要素的供给与需求，需求取决于该要素的边际生产率；均衡时每种要素都获得它在物品与服务生产中所提供的边际贡献的价值。"},{"t":"开篇之问的回答：电脑程序员收入高于加油站服务员，是因为程序员生产的物品的市场价值大于服务员生产的物品的市场价值——工人工资反映其所生产物品的市场价格；若人们少用电脑多开车，两种物品价格变动会改变两类工人的均衡工资。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">开篇之问的回答</strong>：电脑程序员收入高于加油站服务员，是因为程序员生产的物品的市场价值大于服务员生产的物品的市场价值——工人工资反映其所生产物品的市场价格；若人们少用电脑多开车，两种物品价格变动会改变两类工人的均衡工资。"}],"k":"sec","i":0,"h":"18.5 结论"}],"k":"chap","h":"第18章 生产要素市场"},{"t":"第19章 收入与歧视","c":[{"t":"本章内容提要","c":[{"t":"工人由于许多原因而赚到不同的工资：在某种程度上，工资差别是对工人工作特性的补偿；其他条件相同时，从事艰苦、乏味工作的工人得到的工资高于从事轻松、有趣工作的工人。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">工人由于许多原因而赚到不同的工资</strong>：在某种程度上，工资差别是对工人工作特性的补偿；其他条件相同时，从事艰苦、乏味工作的工人得到的工资高于从事轻松、有趣工作的工人。"},{"t":"人力资本多的工人得到的工资高于人力资本少的工人；累积的人力资本的收益很高，而且在过去几十年来一直在增加。","c":[],"k":"b","i":1,"h":"人力资本多的工人得到的工资高于人力资本少的工人；累积的人力资本的收益很高，而且在过去几十年来一直在增加。"},{"t":"虽然受教育年限、经验和工作特性都像理论所预期的那样影响收入，但有许多收入差别不能用经济学家可以衡量的东西来解释；收入中无法解释的差异主要归因于天生的能力、努力和机遇。","c":[],"k":"b","i":1,"h":"虽然受教育年限、经验和工作特性都像理论所预期的那样影响收入，但有许多收入差别不能用经济学家可以衡量的东西来解释；收入中无法解释的差异主要归因于天生的能力、努力和机遇。"},{"t":"一些经济学家提出，受教育更多的人得到更高工资并不是因为教育提高了其生产率，而是因为有更高天赋的工人把教育作为一种向雇主显示他们高能力的信号；如果信号理论正确，提高所有工人的受教育程度就不会提高整体工资水平。","c":[],"k":"b","i":1,"h":"一些经济学家提出，受教育更多的人得到更高工资并不是因为教育提高了其生产率，而是因为有更高天赋的工人把教育作为一种向雇主显示他们高能力的信号；如果信号理论正确，提高所有工人的受教育程度就不会提高整体工资水平。"},{"t":"有时工资会高于使供求平衡的水平：高于均衡水平的工资产生的三个原因是最低工资法、工会和效率工资。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">有时工资会高于使供求平衡的水平</strong>：高于均衡水平的工资产生的三个原因是最低工资法、工会和效率工资。"},{"t":"收入中的一些差别是基于种族、性别或其他因素的歧视；但对歧视进行衡量很困难，因为必须根据人力资本和工作特性的差别进行矫正。","c":[],"k":"b","i":1,"h":"收入中的一些差别是基于种族、性别或其他因素的歧视；但对歧视进行衡量很困难，因为必须根据人力资本和工作特性的差别进行矫正。"},{"t":"竞争市场倾向于限制歧视对工资的影响：如果一个工人群体的工资由于与边际生产率无关的原因低于另一个群体，非歧视企业将比歧视企业盈利更多，利润最大化行为可以减少歧视性工资差别；如果顾客愿意向歧视企业支付更多，或政府通过要求企业歧视的法律，歧视就会持续下去。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">竞争市场倾向于限制歧视对工资的影响</strong>：如果一个工人群体的工资由于与边际生产率无关的原因低于另一个群体，非歧视企业将比歧视企业盈利更多，利润最大化行为可以减少歧视性工资差别；如果顾客愿意向歧视企业支付更多，或政府通过要求企业歧视的法律，歧视就会持续下去。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"19.1 决定均衡工资的若干因素","c":[{"t":"引论：第18章新古典理论（工资由供求决定、劳动需求反映边际生产率）只是起点；本章考察工人与工作的特点如何影响劳动供给、劳动需求和均衡工资（普通医生年薪约20万美元、警官约6万、快餐厨师约2万）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">引论</strong>：第18章新古典理论（工资由供求决定、劳动需求反映边际生产率）只是起点；本章考察工人与工作的特点如何影响劳动供给、劳动需求和均衡工资（普通医生年薪约20万美元、警官约6万、快餐厨师约2万）。"},{"t":"19.1.1 补偿性工资差别","c":[{"t":"术语：补偿性工资差别（compensating differential）——为抵消不同工作的非货币特性而产生的工资差别。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：补偿性工资差别（compensating differential）——为抵消不同工作的非货币特性而产生的工资差别。"},{"t":"供求逻辑：按非货币特性判断越\"好\"的工作（轻松、有趣而安全），工资既定时愿意从事的人越多，劳动供给越大；因此\"好\"工作的均衡工资往往比\"坏\"工作（艰苦、枯燥而危险）低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供求逻辑</strong>：按非货币特性判断越&quot;好&quot;的工作（轻松、有趣而安全），工资既定时愿意从事的人越多，劳动供给越大；因此&quot;好&quot;工作的均衡工资往往比&quot;坏&quot;工作（艰苦、枯燥而危险）低。"},{"t":"书中例子：海滩入场证检查员与清洁工——工资相同时多数人选前者，故镇里必须给清洁工更高工资；煤矿工人工资高于相似教育水平工人（补偿不干净、危险与长期健康问题）；工厂夜班工人工资高于白班工人（补偿昼夜颠倒的生活方式）；教授工资低于受教育程度相近的律师和医生（教授工作的学术与个人满足感本身就是补偿）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中例子</strong>：海滩入场证检查员与清洁工——工资相同时多数人选前者，故镇里必须给清洁工更高工资；煤矿工人工资高于相似教育水平工人（补偿不干净、危险与长期健康问题）；工厂夜班工人工资高于白班工人（补偿昼夜颠倒的生活方式）；教授工资低于受教育程度相近的律师和医生（教授工作的学术与个人满足感本身就是补偿）。"}],"k":"b","i":1,"h":"19.1.1 补偿性工资差别"},{"t":"19.1.2 人力资本","c":[{"t":"术语：人力资本（human capital）——对人的投资的积累，如教育和在职培训；最重要的一类人力资本是教育。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：人力资本（human capital）——对人的投资的积累，如教育和在职培训；最重要的一类人力资本是教育。"},{"t":"性质：与一切资本一样，教育代表为提高未来生产率而在某一时点的资源支出；但教育投资与特定的人相联系，这是它成为\"人力\"资本的原因。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">性质</strong>：与一切资本一样，教育代表为提高未来生产率而在某一时点的资源支出；但教育投资与特定的人相联系，这是它成为&quot;人力&quot;资本的原因。"},{"t":"供求解释：企业（需求方）愿向教育水平高的工人支付更高工资，因其边际生产率较高；工人（供给方）只有在受教育能得到回报时才愿意支付受教育成本——高低教育工人之间的工资差别可看作对受教育成本的补偿性工资差别。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供求解释</strong>：企业（需求方）愿向教育水平高的工人支付更高工资，因其边际生产率较高；工人（供给方）只有在受教育能得到回报时才愿意支付受教育成本——高低教育工人之间的工资差别可看作对受教育成本的补偿性工资差别。"},{"t":"事实：美国大学毕业生收入比只有高中文凭的工人高出几乎一倍；该差距在许多国家得到验证，在欠发达国家更大（受过教育的工人供给稀缺）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">事实</strong>：美国大学毕业生收入比只有高中文凭的工人高出几乎一倍；该差距在许多国家得到验证，在欠发达国家更大（受过教育的工人供给稀缺）。"},{"t":"案例研究「技能的价值日益增加」：男性大学溢价从1974年的+42%升至2014年的+81%，女性从+35%升至+71%（高技能与低技能工人收入差距过去几十年来一直在扩大）；两种假说都指向对熟练劳动力相对需求的增加——一是国际贸易（进口非熟练劳动生产的物品、出口熟练劳动生产的物品，进口占比从1974年8%升至2014年17%），二是技能偏向型的技术变革（电脑增加对会用电脑者的需求、减少对被电脑替代者如档案管理员的需求）；二者可能共同导致日益扩大的不平等，并无简单答案。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「技能的价值日益增加」</strong>：男性大学溢价从1974年的+42%升至2014年的+81%，女性从+35%升至+71%（高技能与低技能工人收入差距过去几十年来一直在扩大）；两种假说都指向对熟练劳动力相对需求的增加——一是国际贸易（进口非熟练劳动生产的物品、出口熟练劳动生产的物品，进口占比从1974年8%升至2014年17%），二是技能偏向型的技术变革（电脑增加对会用电脑者的需求、减少对被电脑替代者如档案管理员的需求）；二者可能共同导致日益扩大的不平等，并无简单答案。"}],"k":"b","i":1,"h":"19.1.2 人力资本"},{"t":"19.1.3 能力、努力和机遇","c":[{"t":"能力：由先天遗传和后天培养，人体力与脑力特征不同（如大联盟运动员收入高于小联盟运动员主要因天赋更高，而非补偿性差别或教育）；各种职业中天赋都重要。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">能力</strong>：由先天遗传和后天培养，人体力与脑力特征不同（如大联盟运动员收入高于小联盟运动员主要因天赋更高，而非补偿性差别或教育）；各种职业中天赋都重要。"},{"t":"努力：工作勤奋者生产能力更高、工资更高；企业有时直接按产量付酬（销售人员按销售额百分比提成），有时以高年薪或奖金间接补偿。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">努力</strong>：工作勤奋者生产能力更高、工资更高；企业有时直接按产量付酬（销售人员按销售额百分比提成），有时以高年薪或奖金间接补偿。"},{"t":"机遇：机遇也在起作用——如进职业学校学修真空管电视机的人因晶体管的发明而技能过时，工资低于受相似年限培训的人；这是经济学家承认但未深入论述的现象。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机遇</strong>：机遇也在起作用——如进职业学校学修真空管电视机的人因晶体管的发明而技能过时，工资低于受相似年限培训的人；这是经济学家承认但未深入论述的现象。"},{"t":"重要性（间接证据）：可衡量变量（受教育年限、工作年限、年龄、工作特性）虽如理论预期影响工资，但只能解释经济中不足一半的工资差别；无法解释的差别如此之大，说明被忽略的变量（能力、努力和机遇）起着重要作用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">重要性</strong>（间接证据）：可衡量变量（受教育年限、工作年限、年龄、工作特性）虽如理论预期影响工资，但只能解释经济中不足一半的工资差别；无法解释的差别如此之大，说明被忽略的变量（能力、努力和机遇）起着重要作用。"},{"t":"术语：能力、努力和机遇（ability, effort, and chance）——决定工资却难以衡量的三类个人因素。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：能力、努力和机遇（ability, effort, and chance）——决定工资却难以衡量的三类个人因素。"},{"t":"漂亮经济学（Hamermesh 与 Biddle 1994年《美国经济评论》研究）：被认为更有魅力的人收入比相貌平常的人平均高5%，相貌平常的人比不太有魅力的人高5%—10%，男女结论类似；三种解释——（1）漂亮本身是决定生产率和工资的内在能力之一（表演、销售、侍者等需当众露面的工作，有魅力的工人对企业价值更大）；（2）外貌是对其他类型能力的间接衡量（服装、发型、举止等可控制气质也反映聪明程度）；（3）以貌取人是一种歧视。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">漂亮经济学</strong>（Hamermesh 与 Biddle 1994年《美国经济评论》研究）：被认为更有魅力的人收入比相貌平常的人平均高5%，相貌平常的人比不太有魅力的人高5%—10%，男女结论类似；三种解释——（1）漂亮本身是决定生产率和工资的内在能力之一（表演、销售、侍者等需当众露面的工作，有魅力的工人对企业价值更大）；（2）外貌是对其他类型能力的间接衡量（服装、发型、举止等可控制气质也反映聪明程度）；（3）以貌取人是一种歧视。"}],"k":"b","i":1,"h":"19.1.3 能力、努力和机遇"},{"t":"19.1.4 教育的另一种观点：信号","c":[{"t":"人力资本理论：学校教育增加工资是因为教育提高了工人的生产率（被广泛接受）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人力资本理论</strong>：学校教育增加工资是因为教育提高了工人的生产率（被广泛接受）。"},{"t":"信号理论：企业把教育状况当作区分高能力与低能力工人的方法——获得大学学历并未提升生产率，而是向未来雇主发出高能力的信号；因为高能力的人比低能力的人更容易获得大学学历，企业把学历解释为能力信号是合理的；与第16章广告的信号理论相似（行为本身无内在利益，而是以承担该行为的意愿传递私人信息）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信号理论</strong>：企业把教育状况当作区分高能力与低能力工人的方法——获得大学学历并未提升生产率，而是向未来雇主发出高能力的信号；因为高能力的人比低能力的人更容易获得大学学历，企业把学历解释为能力信号是合理的；与第16章广告的信号理论相似（行为本身无内在利益，而是以承担该行为的意愿传递私人信息）。"},{"t":"政策含义的分歧：人力资本论下，提高所有工人的教育水平会提高所有工人的生产率和工资；信号论下，教育并未提高生产率，提高教育水平不影响工资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政策含义的分歧</strong>：人力资本论下，提高所有工人的教育水平会提高所有工人的生产率和工资；信号论下，教育并未提高生产率，提高教育水平不影响工资。"},{"t":"折中判断：最可能的情况是真理在两种极端之间——教育收益结合了人力资本的生产率提高效应与信号的生产率显示效应，两种效应的相对大小有待讨论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">折中判断</strong>：最可能的情况是真理在两种极端之间——教育收益结合了人力资本的生产率提高效应与信号的生产率显示效应，两种效应的相对大小有待讨论。"}],"k":"b","i":1,"h":"<strong class=\"lead\">19.1.4 教育的另一种观点</strong>：信号"},{"t":"19.1.5 超级明星现象","c":[{"t":"现象：多数演员赚钱很少，而小罗伯特·唐尼每部片子赚数百万美元；莎拉波娃在职业巡回赛赚数百万——最好的演员与运动员是收入远超同行的超级明星，但最好的木匠与管道工却拿不到几百万。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现象</strong>：多数演员赚钱很少，而小罗伯特·唐尼每部片子赚数百万美元；莎拉波娃在职业巡回赛赚数百万——最好的演员与运动员是收入远超同行的超级明星，但最好的木匠与管道工却拿不到几百万。"},{"t":"超级明星产生的市场有两个特点：市场上的每位顾客都希望享受最优生产者提供的物品；生产这种物品所用的技术可以使最优生产者以低成本向每位顾客提供物品。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">超级明星产生的市场有两个特点</strong>：市场上的每位顾客都希望享受最优生产者提供的物品；生产这种物品所用的技术可以使最优生产者以低成本向每位顾客提供物品。"},{"t":"解释：看电影两遍不如看唐尼，且复制电影的低成本使他能同时向数百万人提供服务；电视转播使数百万球迷都能欣赏莎拉波娃的球艺；而木匠只能为有限的顾客提供服务，故不存在超级明星木匠与管道工，普通木匠仍能过上好日子。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解释</strong>：看电影两遍不如看唐尼，且复制电影的低成本使他能同时向数百万人提供服务；电视转播使数百万球迷都能欣赏莎拉波娃的球艺；而木匠只能为有限的顾客提供服务，故不存在超级明星木匠与管道工，普通木匠仍能过上好日子。"}],"k":"b","i":1,"h":"19.1.5 超级明星现象"},{"t":"19.1.6 高于均衡水平的工资：最低工资法、工会和效率工资","c":[{"t":"原因一（最低工资法）：对大多数工人无影响（其均衡工资远高于法定最低工资），但把最低技能、最无经验工人的工资提高到无管制劳动市场水平之上。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原因一</strong>（最低工资法）：对大多数工人无影响（其均衡工资远高于法定最低工资），但把最低技能、最无经验工人的工资提高到无管制劳动市场水平之上。"},{"t":"术语：工会（union）——与雇主谈判工资和工作条件的工人协会；术语：罢工（strike）——工会有组织地从企业撤出劳动。工会通过罢工威胁等市场势力把工资提高到无工会时的水平之上；研究表明工会工人比类似非工会工人赚的钱高10%—20%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：工会（union）——与雇主谈判工资和工作条件的工人协会；术语：罢工（strike）——工会有组织地从企业撤出劳动。工会通过罢工威胁等市场势力把工资提高到无工会时的水平之上；研究表明工会工人比类似非工会工人赚的钱高10%—20%。"},{"t":"术语：效率工资（efficiency wages）——企业为了提高工人的生产率而支付的高于均衡工资的工资；高工资可以降低工人的流动性、提高工人的努力程度、并提高申请该企业工作岗位的工人素质。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：效率工资（efficiency wages）——企业为了提高工人的生产率而支付的高于均衡工资的工资；高工资可以降低工人的流动性、提高工人的努力程度、并提高申请该企业工作岗位的工人素质。"},{"t":"共同后果：无论由最低工资法、工会还是效率工资引起，工资被推到均衡水平之上都会增加劳动供给量、减少劳动需求量，结果是劳动过剩或失业（失业与相关政策属宏观经济学主题，但分析收入时不可完全忽略）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">共同后果</strong>：无论由最低工资法、工会还是效率工资引起，工资被推到均衡水平之上都会增加劳动供给量、减少劳动需求量，结果是劳动过剩或失业（失业与相关政策属宏观经济学主题，但分析收入时不可完全忽略）。"},{"t":"即问即答要点：补偿性工资差别即不同工作非货币特性引起的工资差别（如夜班津贴）；受教育多的工人收入更高的两个原因——人力资本论下教育提高生产率，信号论下教育显示天赋。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：补偿性工资差别即不同工作非货币特性引起的工资差别（如夜班津贴）；受教育多的工人收入更高的两个原因——人力资本论下教育提高生产率，信号论下教育显示天赋。"}],"k":"b","i":1,"h":"<strong class=\"lead\">19.1.6 高于均衡水平的工资</strong>：最低工资法、工会和效率工资"}],"k":"sec","i":0,"h":"19.1 决定均衡工资的若干因素"},{"t":"19.2 歧视经济学","c":[{"t":"术语：歧视（discrimination）——对仅仅是种族、民族、性别、年龄或其他个人特征不同的相似个人提供不同的机会；歧视反映了某些人对某个社会群体的偏见，经济学家力图客观研究以把假象与现实分开。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：歧视（discrimination）——对仅仅是种族、民族、性别、年龄或其他个人特征不同的相似个人提供不同的机会；歧视反映了某些人对某个社会群体的偏见，经济学家力图客观研究以把假象与现实分开。"},{"t":"19.2.1 对劳动市场的歧视进行衡量","c":[{"t":"表面数字（2014年美国中值年收入）：黑人男性比白人男性低约20%，黑人女性比白人女性低约17%；白人女性比白人男性低21%，黑人女性比黑人男性低18%——表面看似乎是雇主歧视的证据。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表面数字</strong>（2014年美国中值年收入）：黑人男性比白人男性低约20%，黑人女性比白人女性低约17%；白人女性比白人男性低21%，黑人女性比黑人男性低18%——表面看似乎是雇主歧视的证据。"},{"t":"衡量困难的核心：即使在没有歧视的劳动市场上工资也会不同（人力资本量、能从事和愿从事的工作种类不同）；简单地观察群体间工资差别证明不了雇主歧视。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">衡量困难的核心</strong>：即使在没有歧视的劳动市场上工资也会不同（人力资本量、能从事和愿从事的工作种类不同）；简单地观察群体间工资差别证明不了雇主歧视。"},{"t":"人力资本的解释：2014年25岁及以上男性中32%的白人拥有大学学历而黑人为20%（女性为32%对24%）；历史上以黑人为主的地区公立学校质量（经费、班级规模）更低，若计入教育质量，人力资本差别会更大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人力资本的解释</strong>：2014年25岁及以上男性中32%的白人拥有大学学历而黑人为20%（女性为32%对24%）；历史上以黑人为主的地区公立学校质量（经费、班级规模）更低，若计入教育质量，人力资本差别会更大。"},{"t":"工作经验的解释：女性往往中断工作抚养孩子，25—44岁人口中只有75%的女性加入劳动力队伍（男性为90%），故女性尤其年长女性工人的经验少于男性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工作经验的解释</strong>：女性往往中断工作抚养孩子，25—44岁人口中只有75%的女性加入劳动力队伍（男性为90%），故女性尤其年长女性工人的经验少于男性。"},{"t":"补偿性差别的解释：男女不总选同类工作（女性更可能当秘书、男性更可能当卡车司机），相对工资部分取决于工作条件；非货币因素难以衡量，其解释力也难以确定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">补偿性差别的解释</strong>：男女不总选同类工作（女性更可能当秘书、男性更可能当卡车司机），相对工资部分取决于工作条件；非货币因素难以衡量，其解释力也难以确定。"},{"t":"结论：经济学家唯一达成共识的是否定性结论——不同群体平均工资的差别部分反映人力资本和工作特性的差别，这些差别本身并不能说明劳动市场存在多大歧视；群体间人力资本差异本身可能反映进入劳动市场之前就已发生的歧视（如向女生提供较易课程、黑人学校质量低劣），其表象是经济上的，深层原因却是政治上的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：经济学家唯一达成共识的是否定性结论——不同群体平均工资的差别部分反映人力资本和工作特性的差别，这些差别本身并不能说明劳动市场存在多大歧视；群体间人力资本差异本身可能反映进入劳动市场之前就已发生的歧视（如向女生提供较易课程、黑人学校质量低劣），其表象是经济上的，深层原因却是政治上的。"},{"t":"案例研究「Emily 比 Lakisha 更容易找到工作吗」（Bertrand 与 Mullainathan 2004年《美国经济评论》田野实验）：按波士顿和芝加哥报纸1300多则招聘广告寄出近5000份假简历，一半用非裔常用名（如 Lakisha Washington、Jamal Jones），一半用白人常用名（如 Emily Walsh、Greg Baker），其余内容相似；结果是白人姓名求职者接到的雇主回电比非裔姓名者高出50%以上，且歧视存在于包括自称\"机会平等雇主\"在内的各类雇主——种族歧视仍是劳动市场的一个显著特点。","c":[],"k":"b","i":2,"h":"案例研究「Emily 比 Lakisha 更容易找到工作吗」（Bertrand 与 Mullainathan 2004年《美国经济评论》田野实验）：按波士顿和芝加哥报纸1300多则招聘广告寄出近5000份假简历，一半用非裔常用名（如 Lakisha Washington、Jamal Jones），一半用白人常用名（如 Emily Walsh、Greg Baker），其余内容相似；结果是白人姓名求职者接到的雇主回电比非裔姓名者高出50%以上，且歧视存在于包括自称&quot;机会平等雇主&quot;在内的各类雇主——种族歧视仍是劳动市场的一个显著特点。"}],"k":"b","i":1,"h":"19.2.1 对劳动市场的歧视进行衡量"},{"t":"19.2.2 雇主的歧视","c":[{"t":"利润动机是竞争市场对雇主歧视的自发矫正：设想按发色歧视的经济——金发人与褐发人技能相同，但雇主偏好褐发人，使金发工人需求低、收入低；此时雇用金发工人的企业工资成本更低，可凭低价打垮歧视企业，\"金发人\"企业进入、\"褐发人\"企业亏损退出，直到工资差别消失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利润动机是竞争市场对雇主歧视的自发矫正</strong>：设想按发色歧视的经济——金发人与褐发人技能相同，但雇主偏好褐发人，使金发工人需求低、收入低；此时雇用金发工人的企业工资成本更低，可凭低价打垮歧视企业，&quot;金发人&quot;企业进入、&quot;褐发人&quot;企业亏损退出，直到工资差别消失。"},{"t":"一般结论：在与既对赚钱感兴趣又关心歧视的企业的竞争中，只对赚钱感兴趣的企业处于优势地位，没有歧视的企业取代有歧视的企业。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般结论</strong>：在与既对赚钱感兴趣又关心歧视的企业的竞争中，只对赚钱感兴趣的企业处于优势地位，没有歧视的企业取代有歧视的企业。"},{"t":"案例研究「电车上的种族隔离与利润动机」（Roback 1986年《经济史杂志》）：20世纪初南部电车的种族隔离（白人坐前、黑人坐后）是法律要求的结果，法律通过之前座位歧视很少见；经营电车的企业反对隔离法——分开座位增加成本、减少利润（\"公司不得不拖着许多空位跑\"）；州政府法律、公众煽动及逮捕总裁的威胁迫使公司就范，其动机是经济的而非人权信念——企业所有者通常对赚钱比对歧视更感兴趣，歧视性做法的最终来源往往不在企业本身。","c":[],"k":"b","i":2,"h":"案例研究「电车上的种族隔离与利润动机」（Roback 1986年《经济史杂志》）：20世纪初南部电车的种族隔离（白人坐前、黑人坐后）是法律要求的结果，法律通过之前座位歧视很少见；经营电车的企业反对隔离法——分开座位增加成本、减少利润（&quot;公司不得不拖着许多空位跑&quot;）；州政府法律、公众煽动及逮捕总裁的威胁迫使公司就范，其动机是经济的而非人权信念——企业所有者通常对赚钱比对歧视更感兴趣，歧视性做法的最终来源往往不在企业本身。"}],"k":"b","i":1,"h":"19.2.2 雇主的歧视"},{"t":"19.2.3 顾客与政府的歧视","c":[{"t":"术语：顾客歧视（customer discrimination）——顾客对为其服务的工人群体持有歧视性偏好；若顾客偏好褐发服务员，雇金发服务员的低价餐馆也未必能消除工资差别，经济中将并存两类餐馆（金发餐馆成本低价低、褐发餐馆成本高价高），有歧视偏好的顾客以高价格形式为偏好支付代价——顾客歧视使歧视性工资差别与竞争市场不矛盾。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：顾客歧视（customer discrimination）——顾客对为其服务的工人群体持有歧视性偏好；若顾客偏好褐发服务员，雇金发服务员的低价餐馆也未必能消除工资差别，经济中将并存两类餐馆（金发餐馆成本低价低、褐发餐馆成本高价高），有歧视偏好的顾客以高价格形式为偏好支付代价——顾客歧视使歧视性工资差别与竞争市场不矛盾。"},{"t":"政府歧视：政府通过法律强制实行歧视性做法（如宣布金发人在餐馆只能刷盘子不能当服务员；南部电车种族隔离法；南非1990年放弃种族隔离制度前禁止黑人从事某些工作），压制了自由竞争市场正常的平等化力量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政府歧视</strong>：政府通过法律强制实行歧视性做法（如宣布金发人在餐馆只能刷盘子不能当服务员；南部电车种族隔离法；南非1990年放弃种族隔离制度前禁止黑人从事某些工作），压制了自由竞争市场正常的平等化力量。"},{"t":"总结：竞争市场包含一种自发矫正雇主歧视的方法——只关心利润的企业进入市场倾向于消除歧视性工资差别；只有顾客愿意为维持歧视性做法支付或政府强制歧视时，这种工资差别才能持续下去。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总结</strong>：竞争市场包含一种自发矫正雇主歧视的方法——只关心利润的企业进入市场倾向于消除歧视性工资差别；只有顾客愿意为维持歧视性做法支付或政府强制歧视时，这种工资差别才能持续下去。"},{"t":"案例研究「体育运动中的歧视」：运动队有客观的生产率衡量标准（击球率、本垒打、盗垒数），便于矫正生产率差别后研究歧视；1988年《劳动经济学杂志》研究发现黑人篮球运动员收入比能力相当的白人运动员低20%，且白人较多的球队观众更多——顾客歧视使黑人运动员给老板赚的钱不如白人多，即使老板只关心利润差别也持续；20世纪60年代后期棒球数据同样显示黑人运动员收入较低、看黑人投球比赛的球迷更少，但近年棒球工资研究未发现歧视性差别；1990年《经济学季刊》研究老式队员卡市场——黑人击球手的队员卡售价比能力相当的白人低10%、投球手低13%，表明棒球迷中存在顾客歧视。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「体育运动中的歧视」</strong>：运动队有客观的生产率衡量标准（击球率、本垒打、盗垒数），便于矫正生产率差别后研究歧视；1988年《劳动经济学杂志》研究发现黑人篮球运动员收入比能力相当的白人运动员低20%，且白人较多的球队观众更多——顾客歧视使黑人运动员给老板赚的钱不如白人多，即使老板只关心利润差别也持续；20世纪60年代后期棒球数据同样显示黑人运动员收入较低、看黑人投球比赛的球迷更少，但近年棒球工资研究未发现歧视性差别；1990年《经济学季刊》研究老式队员卡市场——黑人击球手的队员卡售价比能力相当的白人低10%、投球手低13%，表明棒球迷中存在顾客歧视。"},{"t":"即问即答要点：难定歧视是因为须矫正群体间生产率（人力资本与工作特性）差别；利润最大化企业以低工资雇用受歧视群体、凭成本优势取代歧视企业从而消除歧视性工资差别；歧视性工资差别靠顾客支付意愿或政府强制才能保持。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：难定歧视是因为须矫正群体间生产率（人力资本与工作特性）差别；利润最大化企业以低工资雇用受歧视群体、凭成本优势取代歧视企业从而消除歧视性工资差别；歧视性工资差别靠顾客支付意愿或政府强制才能保持。"}],"k":"b","i":1,"h":"19.2.3 顾客与政府的歧视"}],"k":"sec","i":0,"h":"19.2 歧视经济学"},{"t":"19.3 结论","c":[{"t":"竞争市场上，工人赚到的工资等于他们对物品与服务生产的边际贡献值；但影响边际产量值的因素很多——企业对较有才能、较勤奋、较有经验而受教育较多的工人支付更多（生产率较高），对受顾客歧视的工人支付更少（对收益的贡献较少）。","c":[],"k":"b","i":1,"h":"竞争市场上，工人赚到的工资等于他们对物品与服务生产的边际贡献值；但影响边际产量值的因素很多——企业对较有才能、较勤奋、较有经验而受教育较多的工人支付更多（生产率较高），对受顾客歧视的工人支付更少（对收益的贡献较少）。"},{"t":"这两章的劳动市场理论解释了为什么一些工人的工资比另一些工人高，但并未说明由此引起的收入分配是否平等、公正或合意——那是第20章的话题。","c":[],"k":"b","i":1,"h":"这两章的劳动市场理论解释了为什么一些工人的工资比另一些工人高，但并未说明由此引起的收入分配是否平等、公正或合意——那是第20章的话题。"}],"k":"sec","i":0,"h":"19.3 结论"}],"k":"chap","h":"第19章 收入与歧视"},{"t":"第20章 收入不平等与贫困","c":[{"t":"本章内容提要","c":[{"t":"收入分配数据表明美国社会存在巨大的不平等：最富的1/5家庭的收入是最穷的1/5家庭收入的12倍还多（2014年两者分别占总收入的48.9%与3.6%，约13倍）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">收入分配数据表明美国社会存在巨大的不平等</strong>：最富的1/5家庭的收入是最穷的1/5家庭收入的12倍还多（2014年两者分别占总收入的48.9%与3.6%，约13倍）。"},{"t":"由于实物转移支付、经济生命周期、暂时收入与持久收入之分、经济流动性对理解收入变动如此重要，仅用某一年的收入分配数据判断社会不平等程度很困难；把这些因素纳入考虑后，结论总倾向于表明经济福利的分配比年收入的分配更平等。","c":[],"k":"b","i":1,"h":"由于实物转移支付、经济生命周期、暂时收入与持久收入之分、经济流动性对理解收入变动如此重要，仅用某一年的收入分配数据判断社会不平等程度很困难；把这些因素纳入考虑后，结论总倾向于表明经济福利的分配比年收入的分配更平等。"},{"t":"政治哲学家对政府在改变收入分配中的作用观点不同：功利主义者（穆勒）选择使每个人效用之和最大化的分配；自由主义者（罗尔斯）主张在\"无知之幕\"下决定分配；自由至上主义者（诺齐克）只要求政府保证公正的过程，不关注结果的不平等。","c":[],"k":"b","i":1,"h":"政治哲学家对政府在改变收入分配中的作用观点不同：功利主义者（穆勒）选择使每个人效用之和最大化的分配；自由主义者（罗尔斯）主张在&quot;无知之幕&quot;下决定分配；自由至上主义者（诺齐克）只要求政府保证公正的过程，不关注结果的不平等。"},{"t":"帮助穷人的政策有多种——最低工资法、福利、负所得税与实物转移支付；它们都帮助了一些家庭脱贫，但也有意想不到的副作用：经济援助随收入增加而减少，使穷人面临很高的有效边际税率，不鼓励贫困家庭依靠自己的力量脱贫。","c":[],"k":"b","i":1,"h":"帮助穷人的政策有多种——最低工资法、福利、负所得税与实物转移支付；它们都帮助了一些家庭脱贫，但也有意想不到的副作用：经济援助随收入增加而减少，使穷人面临很高的有效边际税率，不鼓励贫困家庭依靠自己的力量脱贫。"},{"t":"结论：决策者面临平等与效率之间的权衡取舍——越平等地分割蛋糕，蛋糕就会变得越小。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">结论</strong>：决策者面临平等与效率之间的权衡取舍——越平等地分割蛋糕，蛋糕就会变得越小。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"20.1 对不平等的衡量","c":[{"t":"本节先回答四个衡量问题：社会不平等程度有多大？多少人生活在贫困之中？衡量不平等时引出哪些问题？人们在不同收入阶层之间流动的频度如何？","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本节先回答四个衡量问题</strong>：社会不平等程度有多大？多少人生活在贫困之中？衡量不平等时引出哪些问题？人们在不同收入阶层之间流动的频度如何？"},{"t":"20.1.1 美国的收入不平等","c":[{"t":"五等分法：按年收入给所有家庭排队，分成收入最低1/5、次低1/5、中间1/5、次高1/5、最高1/5，另看最高的5%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">五等分法</strong>：按年收入给所有家庭排队，分成收入最低1/5、次低1/5、中间1/5、次高1/5、最高1/5，另看最高的5%。"},{"t":"2014年数据：收入最低的1/5家庭得到全部收入的3.6%，最高的1/5得到48.9%，最高的5%得到20.8%（比最穷的40%家庭的总收入还多）；最高1/5的年收入约为最低1/5的13倍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">2014年数据</strong>：收入最低的1/5家庭得到全部收入的3.6%，最高的1/5得到48.9%，最高的5%得到20.8%（比最穷的40%家庭的总收入还多）；最高1/5的年收入约为最低1/5的13倍。"},{"t":"时间趋势：1935—1970年分配逐渐平等（最低1/5份额由4.1%升至5.4%，最高1/5由51.7%降至40.9%）；1970—2014年趋势反转（最低1/5降至3.6%，最高1/5升至48.9%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">时间趋势</strong>：1935—1970年分配逐渐平等（最低1/5份额由4.1%升至5.4%，最高1/5由51.7%降至40.9%）；1970—2014年趋势反转（最低1/5降至3.6%，最高1/5升至48.9%）。"},{"t":"近年不平等加剧的解释（承接第19章）：与低工资国家国际贸易的增长和技术变革减少了对不熟练劳动的需求、增加了对熟练劳动的需求，不熟练工人相对工资下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">近年不平等加剧的解释</strong>（承接第19章）：与低工资国家国际贸易的增长和技术变革减少了对不熟练劳动的需求、增加了对熟练劳动的需求，不熟练工人相对工资下降。"}],"k":"b","i":1,"h":"20.1.1 美国的收入不平等"},{"t":"20.1.2 世界各国的不平等状况","c":[{"t":"数据口径警告：各国收集数据方法不一（个人收入/家庭收入/支出），跨国差异难以区分真实差别与统计口径差别。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数据口径警告</strong>：各国收集数据方法不一（个人收入/家庭收入/支出），跨国差异难以区分真实差别与统计口径差别。"},{"t":"五分率（最富1/5收入÷最穷1/5收入）：瑞典3.7倍最平等，南非28.5倍最不平等；美国比一般国家略不平等，比日本、德国等发达国家严重得多，比南非、巴西等发展中国家平等，与中国程度相近。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">五分率</strong>（最富1/5收入÷最穷1/5收入）：瑞典3.7倍最平等，南非28.5倍最不平等；美国比一般国家略不平等，比日本、德国等发达国家严重得多，比南非、巴西等发展中国家平等，与中国程度相近。"},{"t":"新闻摘录「收入分配的全球视野」（Tyler Cowen）要点：全球范围的收入不平等近二十年大部分时间呈下降趋势（Lakner与Milanovic研究）；中印经济起飞是平等主义的历史性成就；一国之内不平等可能加剧而全球不平等下降（如中国出口压低美国部分中产工资、又通过股份抬高最富1%收入；移民使移入者境况大幅改善）；讨论不平等时应先分清\"哪一层\"的不平等。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新闻摘录「收入分配的全球视野」</strong>（Tyler Cowen）要点：全球范围的收入不平等近二十年大部分时间呈下降趋势（Lakner与Milanovic研究）；中印经济起飞是平等主义的历史性成就；一国之内不平等可能加剧而全球不平等下降（如中国出口压低美国部分中产工资、又通过股份抬高最富1%收入；移民使移入者境况大幅改善）；讨论不平等时应先分清&quot;哪一层&quot;的不平等。"}],"k":"b","i":1,"h":"20.1.2 世界各国的不平等状况"},{"t":"20.1.3 贫困率","c":[{"t":"贫困率（poverty rate）：家庭收入低于一个称为贫困线的绝对水平的人口所占的百分比。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贫困率</strong>（poverty rate）：家庭收入低于一个称为贫困线的绝对水平的人口所占的百分比。"},{"t":"贫困线（poverty line）：由联邦政府按提供充足食物成本的大约三倍的标准确定的收入绝对水平，低于此水平的家庭被认为处于贫困状态；贫困线取决于家庭规模，并随价格水平逐年调整。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贫困线</strong>（poverty line）：由联邦政府按提供充足食物成本的大约三倍的标准确定的收入绝对水平，低于此水平的家庭被认为处于贫困状态；贫困线取决于家庭规模，并随价格水平逐年调整。"},{"t":"2014年数据：美国中值家庭收入66632美元，四口之家贫困线24230美元，贫困率14.8%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">2014年数据</strong>：美国中值家庭收入66632美元，四口之家贫困线24230美元，贫困率14.8%。"},{"t":"历史轨迹：贫困率从1959年的22.4%降至1973年的11.1%——因贫困线是绝对标准，经济增长把整个收入分配向上推动（\"水涨船高\"）；但70年代初以后平均收入继续增加，贫困率却再未低于1973年水平：不平等加剧使最贫穷家庭无法分享经济繁荣的成果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">历史轨迹</strong>：贫困率从1959年的22.4%降至1973年的11.1%——因贫困线是绝对标准，经济增长把整个收入分配向上推动（&quot;水涨船高&quot;）；但70年代初以后平均收入继续增加，贫困率却再未低于1973年水平：不平等加剧使最贫穷家庭无法分享经济繁荣的成果。"},{"t":"贫困的三个事实：贫困与种族相关（黑人和西班牙裔生活在贫困中的可能性约为白人的两倍）；贫困与年龄相关（孩子比一般人更易贫困，老年人更不易）；贫困与家庭结构相关（单身母亲家庭贫困的可能性是已婚夫妇家庭的五倍多）；三因素会叠加（黑人/西班牙裔孩子+女性为家长的家庭一半以上生活在贫困中）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贫困的三个事实</strong>：贫困与种族相关（黑人和西班牙裔生活在贫困中的可能性约为白人的两倍）；贫困与年龄相关（孩子比一般人更易贫困，老年人更不易）；贫困与家庭结构相关（单身母亲家庭贫困的可能性是已婚夫妇家庭的五倍多）；三因素会叠加（黑人/西班牙裔孩子+女性为家长的家庭一半以上生活在贫困中）。"}],"k":"b","i":1,"h":"20.1.3 贫困率"},{"t":"20.1.4 衡量不平等时的问题","c":[{"t":"数据基于家庭货币年收入，但人们关心的是维持良好生活水平的能力；三方面原因使年度数据不完整。","c":[],"k":"b","i":2,"h":"数据基于家庭货币年收入，但人们关心的是维持良好生活水平的能力；三方面原因使年度数据不完整。"},{"t":"问题一：实物转移支付","c":[{"t":"实物转移支付（in-kind transfers）：以物品和服务而不是以现金形式给予穷人的转移支付（食品券、住房补贴、医疗服务等）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">实物转移支付</strong>（in-kind transfers）：以物品和服务而不是以现金形式给予穷人的转移支付（食品券、住房补贴、医疗服务等）。"},{"t":"标准衡量未计入实物转移支付；因其主要流向最穷成员，忽略它会高估贫困——按市场价值计入后，生活在贫困中的家庭数量比标准数据低约10%。","c":[],"k":"b","i":3,"h":"标准衡量未计入实物转移支付；因其主要流向最穷成员，忽略它会高估贫困——按市场价值计入后，生活在贫困中的家庭数量比标准数据低约10%。"}],"k":"b","i":2,"h":"<strong class=\"lead\">问题一</strong>：实物转移支付"},{"t":"问题二：经济生命周期","c":[{"t":"生命周期（life cycle）：在人的一生中有规律的收入变动模式（年轻时低、随年龄与经验增长、50岁左右最高、65岁退休时大幅减少）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">生命周期</strong>（life cycle）：在人的一生中有规律的收入变动模式（年轻时低、随年龄与经验增长、50岁左右最高、65岁退休时大幅减少）。"},{"t":"人们通过借款与储蓄平滑生命周期变动（年轻时借贷上学买房、中年储蓄率最高、为退休预作储蓄），任一年的生活水平更多取决于一生收入而非当年收入；正常的生命周期会加剧年度收入分配的不平等，但不代表生活水平的真正不平等。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">人们通过借款与储蓄平滑生命周期变动</strong>（年轻时借贷上学买房、中年储蓄率最高、为退休预作储蓄），任一年的生活水平更多取决于一生收入而非当年收入；正常的生命周期会加剧年度收入分配的不平等，但不代表生活水平的真正不平等。"}],"k":"b","i":2,"h":"<strong class=\"lead\">问题二</strong>：经济生命周期"},{"t":"问题三：暂时收入与持久收入","c":[{"t":"收入还因随机和暂时的力量变动（霜冻毁佛罗里达橙树使当地种植者收入暂时减少、加州种植者暂时增加）；家庭同样以储蓄/借款平滑暂时波动。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">收入还因随机和暂时的力量变动</strong>（霜冻毁佛罗里达橙树使当地种植者收入暂时减少、加州种植者暂时增加）；家庭同样以储蓄/借款平滑暂时波动。"},{"t":"持久收入（permanent income）：一个人的正常收入（平均收入）；家庭购买物品与服务的能力主要取决于持久收入，暂时收入的对应概念即暂时收入。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">持久收入</strong>（permanent income）：一个人的正常收入（平均收入）；家庭购买物品与服务的能力主要取决于持久收入，暂时收入的对应概念即暂时收入。"},{"t":"衡量生活水平不平等，持久收入的分配比年度收入的分配更相关；人们按持久收入消费，故消费不平等是持久收入不平等的主要判断标准；持久收入的分配比当期收入的分配更平等。","c":[],"k":"b","i":3,"h":"衡量生活水平不平等，持久收入的分配比年度收入的分配更相关；人们按持久收入消费，故消费不平等是持久收入不平等的主要判断标准；持久收入的分配比当期收入的分配更平等。"}],"k":"b","i":2,"h":"<strong class=\"lead\">问题三</strong>：暂时收入与持久收入"},{"t":"案例研究「不平等的其他衡量标准」（Cox与Alm）要点：2006年最富1/5平均收入149963美元、最穷1/5为9974美元（15倍）；考虑累进税收后为14倍；改看消费为3.9倍（年景好的家庭多储蓄、年景差的家庭动用储蓄）；再按家庭人数矫正（3.1人对1.7人）人均消费仅2.1倍——物质生活水平的不平等比年收入的不平等小得多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「不平等的其他衡量标准」</strong>（Cox与Alm）要点：2006年最富1/5平均收入149963美元、最穷1/5为9974美元（15倍）；考虑累进税收后为14倍；改看消费为3.9倍（年景好的家庭多储蓄、年景差的家庭动用储蓄）；再按家庭人数矫正（3.1人对1.7人）人均消费仅2.1倍——物质生活水平的不平等比年收入的不平等小得多。"}],"k":"b","i":1,"h":"20.1.4 衡量不平等时的问题"},{"t":"20.1.5 经济流动性","c":[{"t":"经济流动性（人们在各收入阶层之间的变动）在美国相当常见：向上移动源于好运或勤奋，向下移动源于坏运或懒惰。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济流动性</strong>（人们在各收入阶层之间的变动）在美国相当常见：向上移动源于好运或勤奋，向下移动源于坏运或懒惰。"},{"t":"后果：暂时贫困比贫困率显示的更常见，持久贫困更少见——典型10年中约四个家庭有一个至少1年处于贫困线之下，但只有不到3%的家庭处于贫困状态达8年或更长；反贫困政策需区分这两类群体。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">后果</strong>：暂时贫困比贫困率显示的更常见，持久贫困更少见——典型10年中约四个家庭有一个至少1年处于贫困线之下，但只有不到3%的家庭处于贫困状态达8年或更长；反贫困政策需区分这两类群体。"},{"t":"代际持续性：超过平均的收入会从父母延续到孩子但不完全（父亲比同辈平均高20%，儿子仅可能高8%；祖父与孙子收入关联很小）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">代际持续性</strong>：超过平均的收入会从父母延续到孩子但不完全（父亲比同辈平均高20%，儿子仅可能高8%；祖父与孙子收入关联很小）。"},{"t":"美国约4/5的百万富翁靠自己赚钱（开办企业、职务晋升），仅1/5靠继承财产。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">美国约4/5的百万富翁靠自己赚钱</strong>（开办企业、职务晋升），仅1/5靠继承财产。"},{"t":"即问即答要点：贫困率衡量收入低于贫困线的人口百分比；解释所衡量贫困率的三个问题是实物转移支付、经济生命周期与暂时收入（暂时vs持久收入）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：贫困率衡量收入低于贫困线的人口百分比；解释所衡量贫困率的三个问题是实物转移支付、经济生命周期与暂时收入（暂时vs持久收入）。"}],"k":"b","i":1,"h":"20.1.5 经济流动性"}],"k":"sec","i":0,"h":"20.1 对不平等的衡量"},{"t":"20.2 收入再分配的政治哲学","c":[{"t":"从实证（世界是什么样的）转向规范问题：政府对经济不平等应该做些什么？这不仅是经济学问题，需要借助政治哲学。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">从实证</strong>（世界是什么样的）转向规范问题：政府对经济不平等应该做些什么？这不仅是经济学问题，需要借助政治哲学。"},{"t":"20.2.1 功利主义","c":[{"t":"功利主义（utilitarianism）：一种政治哲学，主张政府应该选择使社会上所有人总效用最大化的政策；奠基人为英国哲学家杰里米·边沁与约翰·斯图亚特·穆勒，目的是把个人决策的逻辑运用于道德与公共政策问题。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">功利主义</strong>（utilitarianism）：一种政治哲学，主张政府应该选择使社会上所有人总效用最大化的政策；奠基人为英国哲学家杰里米·边沁与约翰·斯图亚特·穆勒，目的是把个人决策的逻辑运用于道德与公共政策问题。"},{"t":"效用（utility）：衡量幸福或满足程度的指标，是福利的衡量指标，也是功利主义者眼中所有公共政策和私人行动的最终目标。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效用</strong>（utility）：衡量幸福或满足程度的指标，是福利的衡量指标，也是功利主义者眼中所有公共政策和私人行动的最终目标。"},{"t":"再分配的依据——边际效用递减：穷人1美元额外收入带来的额外效用大于富人的1美元；Peter收入8万美元、Paul收入2万美元之例——拿走Peter的1美元给Paul，Peter效用的减少小于Paul效用的增加，总效用上升。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">再分配的依据——边际效用递减</strong>：穷人1美元额外收入带来的额外效用大于富人的1美元；Peter收入8万美元、Paul收入2万美元之例——拿走Peter的1美元给Paul，Peter效用的减少小于Paul效用的增加，总效用上升。"},{"t":"为什么不追求完全平等：再分配政策（所得税、随收入递减的转移支付）削弱双方勤奋工作的激励（人们对激励做出反应），工作减少使社会收入与总效用下降；功利主义政府必须在更大平等的好处与扭曲激励的损失之间保持平衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">为什么不追求完全平等</strong>：再分配政策（所得税、随收入递减的转移支付）削弱双方勤奋工作的激励（人们对激励做出反应），工作减少使社会收入与总效用下降；功利主义政府必须在更大平等的好处与扭曲激励的损失之间保持平衡。"},{"t":"\"漏水的桶\"寓言：若政府能无成本地在绿洲间运水，则使两处水量相等可最大化总效用；但桶是漏的（再分配有漏损），政府仍会根据Paul的口渴程度和漏洞大小转移一部分水，而不会追求完全平等。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">&quot;漏水的桶&quot;寓言</strong>：若政府能无成本地在绿洲间运水，则使两处水量相等可最大化总效用；但桶是漏的（再分配有漏损），政府仍会根据Paul的口渴程度和漏洞大小转移一部分水，而不会追求完全平等。"}],"k":"b","i":1,"h":"20.2.1 功利主义"},{"t":"20.2.2 自由主义","c":[{"t":"自由主义（liberalism）：一种政治哲学，主张政府应该选择被认为是公正的政策，这种公正要由一位在\"无知面纱（无知之幕）\"背后的无偏见观察者来评价；由约翰·罗尔斯在1971年《正义论》中提出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自由主义</strong>（liberalism）：一种政治哲学，主张政府应该选择被认为是公正的政策，这种公正要由一位在&quot;无知面纱（无知之幕）&quot;背后的无偏见观察者来评价；由约翰·罗尔斯在1971年《正义论》中提出。"},{"t":"思想实验：在任何人出生之前，所有人到一起设计统治社会的规则，此时对各自最终位置一无所知（\"无知之幕\"背后的\"原始状态\"）；无人能设计有利于自己特定状况的原则，公正的原则是公平协商的结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">思想实验</strong>：在任何人出生之前，所有人到一起设计统治社会的规则，此时对各自最终位置一无所知（&quot;无知之幕&quot;背后的&quot;原始状态&quot;）；无人能设计有利于自己特定状况的原则，公正的原则是公平协商的结果。"},{"t":"最大最小准则（maximin criterion）：一种主张，认为政府的目标应该是使社会上状况最差的人的福利最大化（使最小效用最大化），而非总效用最大化；原始状态下的人特别关注落入收入分配最底层的可能性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最大最小准则</strong>（maximin criterion）：一种主张，认为政府的目标应该是使社会上状况最差的人的福利最大化（使最小效用最大化），而非总效用最大化；原始状态下的人特别关注落入收入分配最底层的可能性。"},{"t":"该准则证明收入再分配政策的正确性（把富人收入转移给穷人增进最不幸者福利），但不带来完全平等：完全平等会摧毁勤奋激励、社会总收入大减、最不幸者状况反而恶化；准则允许能增强激励的收入不对称，但要求的再分配比功利主义更多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">该准则证明收入再分配政策的正确性</strong>（把富人收入转移给穷人增进最不幸者福利），但不带来完全平等：完全平等会摧毁勤奋激励、社会总收入大减、最不幸者状况反而恶化；准则允许能增强激励的收入不对称，但要求的再分配比功利主义更多。"},{"t":"社会保险（social insurance）：旨在保护人们规避负面事件风险的政府政策；从无知之幕的角度看，收入再分配很像保险政策——向富人征税补助穷人，等于为自己成为穷人家庭成员的可能性投保；由于人们不喜欢风险，应庆幸生活在提供这种保险的社会。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社会保险</strong>（social insurance）：旨在保护人们规避负面事件风险的政府政策；从无知之幕的角度看，收入再分配很像保险政策——向富人征税补助穷人，等于为自己成为穷人家庭成员的可能性投保；由于人们不喜欢风险，应庆幸生活在提供这种保险的社会。"},{"t":"争议：无知之幕背后的理性人是否足够厌恶风险以至遵循最大最小准则并不清楚；若其平等对待所有可能结果，则最优政策是使平均效用最大化，公正观更接近功利主义。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">争议</strong>：无知之幕背后的理性人是否足够厌恶风险以至遵循最大最小准则并不清楚；若其平等对待所有可能结果，则最优政策是使平均效用最大化，公正观更接近功利主义。"}],"k":"b","i":1,"h":"20.2.2 自由主义"},{"t":"20.2.3 自由至上主义","c":[{"t":"自由至上主义（libertarianism）：一种政治哲学，主张政府应该惩罚犯罪并实行自愿的协议，但不应该进行收入再分配。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自由至上主义</strong>（libertarianism）：一种政治哲学，主张政府应该惩罚犯罪并实行自愿的协议，但不应该进行收入再分配。"},{"t":"与前两派的根本分歧：功利主义和自由主义都把社会总收入当作社会计划者可自由再分配的共享资源；自由至上主义者认为社会本身并没有赚到收入——只是单个社会成员赚到了收入。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与前两派的根本分歧</strong>：功利主义和自由主义都把社会总收入当作社会计划者可自由再分配的共享资源；自由至上主义者认为社会本身并没有赚到收入——只是单个社会成员赚到了收入。"},{"t":"诺齐克（Robert Nozick）《无政府、国家与乌托邦》（1974）：没有任何集中的分配，每个人得到的东西都是其他人与他自愿交换或作为礼物送给他的；收入分配不是可以由谁\"再切一刀\"的蛋糕。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">诺齐克</strong>（Robert Nozick）《无政府、国家与乌托邦》（1974）：没有任何集中的分配，每个人得到的东西都是其他人与他自愿交换或作为礼物送给他的；收入分配不是可以由谁&quot;再切一刀&quot;的蛋糕。"},{"t":"评价方法：评价结果产生的过程而非结果本身——当分配以不公正手段达到（如偷窃）时政府有权纠正；只要决定分配的过程是正义的，分配结果无论如何不平等都是公正的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">评价方法</strong>：评价结果产生的过程而非结果本身——当分配以不公正手段达到（如偷窃）时政府有权纠正；只要决定分配的过程是正义的，分配结果无论如何不平等都是公正的。"},{"t":"类比：判断课程成绩的公正性，应保证评价过程公正而不追求成绩分布平均——\"过程而非结果\"在成绩问题上很有说服力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">类比</strong>：判断课程成绩的公正性，应保证评价过程公正而不追求成绩分布平均——&quot;过程而非结果&quot;在成绩问题上很有说服力。"},{"t":"结论：机会平等比收入平等更重要；政府应落实个人权利以确保人人有同等发挥才能并获得成功的机会，游戏规则建立后就没有理由改变由此产生的收入分配。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：机会平等比收入平等更重要；政府应落实个人权利以确保人人有同等发挥才能并获得成功的机会，游戏规则建立后就没有理由改变由此产生的收入分配。"},{"t":"即问即答要点：对\"向Petra征税补贴Paula\"——功利主义者看总效用（边际效用递减支持再分配，但激励扭曲限制了力度）；自由主义者看它是否改善状况最差者的福利（最大最小准则）；自由至上主义者反对（只要Petra赚钱的过程公正，再分配不正当）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：对&quot;向Petra征税补贴Paula&quot;——功利主义者看总效用（边际效用递减支持再分配，但激励扭曲限制了力度）；自由主义者看它是否改善状况最差者的福利（最大最小准则）；自由至上主义者反对（只要Petra赚钱的过程公正，再分配不正当）。"}],"k":"b","i":1,"h":"20.2.3 自由至上主义"}],"k":"sec","i":0,"h":"20.2 收入再分配的政治哲学"},{"t":"20.3 减少贫困的政策","c":[{"t":"共识与背景：尽管哲学争论继续，大多数人认为政府起码应帮助最需要帮助的人，提供免于极度贫困的\"安全网\"；贫困与无家可归、毒品依赖、健康问题、青少年怀孕、文盲、失业、犯罪等经济与社会问题相关；每种政策选择都能帮助一些人脱贫，但没有一种是完美的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">共识与背景</strong>：尽管哲学争论继续，大多数人认为政府起码应帮助最需要帮助的人，提供免于极度贫困的&quot;安全网&quot;；贫困与无家可归、毒品依赖、健康问题、青少年怀孕、文盲、失业、犯罪等经济与社会问题相关；每种政策选择都能帮助一些人脱贫，但没有一种是完美的。"},{"t":"20.3.1 最低工资法","c":[{"t":"争论：支持者视之为帮助有工作的穷人而政府又不用花钱的方法；批评者视之为对它想帮助的人的一种伤害。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">争论</strong>：支持者视之为帮助有工作的穷人而政府又不用花钱的方法；批评者视之为对它想帮助的人的一种伤害。"},{"t":"供求分析（第6章工具）：对技能低、经验不足的工人，较高最低工资使工资高于供求平衡水平，提高劳动成本、减少劳动需求量，结果是这些群体的高失业；仍就业者受益，原本在较低工资下能就业者状况变坏。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供求分析</strong>（第6章工具）：对技能低、经验不足的工人，较高最低工资使工资高于供求平衡水平，提高劳动成本、减少劳动需求量，结果是这些群体的高失业；仍就业者受益，原本在较低工资下能就业者状况变坏。"},{"t":"影响大小取决于劳动需求弹性：支持者认为不熟练劳动需求缺乏弹性、就业减少微不足道；批评者认为长期中需求富有弹性，且许多最低工资工人是中产阶级家庭的青少年——作为帮助穷人的政策目标不精准。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">影响大小取决于劳动需求弹性</strong>：支持者认为不熟练劳动需求缺乏弹性、就业减少微不足道；批评者认为长期中需求富有弹性，且许多最低工资工人是中产阶级家庭的青少年——作为帮助穷人的政策目标不精准。"}],"k":"b","i":1,"h":"20.3.1 最低工资法"},{"t":"20.3.2 福利","c":[{"t":"福利（welfare）：补贴贫困者收入的政府计划的总称（广义术语）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">福利</strong>（welfare）：补贴贫困者收入的政府计划的总称（广义术语）。"},{"t":"主要计划：贫困家庭临时援助（帮助需抚养孩子但没有成年人能支撑生活的家庭，典型受助者为在家抚养小孩的母亲）；补充性保障收入（SSI，为有病或有残疾的穷人提供帮助）。两项计划都要求收入低之外还有额外困难（有小孩或残疾），仅收入低并无资格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">主要计划</strong>：贫困家庭临时援助（帮助需抚养孩子但没有成年人能支撑生活的家庭，典型受助者为在家抚养小孩的母亲）；补充性保障收入（SSI，为有病或有残疾的穷人提供帮助）。两项计划都要求收入低之外还有额外困难（有小孩或残疾），仅收入低并无资格。"},{"t":"批评：福利激励人们变成\"需要帮助者\"——鼓励家庭破裂（无父亲才有资格）与未婚生育（有孩子即符合标准）；批评者认为这恶化了政策本要解决的问题，促成1996年法律对领取福利时间加以限制。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">批评</strong>：福利激励人们变成&quot;需要帮助者&quot;——鼓励家庭破裂（无父亲才有资格）与未婚生育（有孩子即符合标准）；批评者认为这恶化了政策本要解决的问题，促成1996年法律对领取福利时间加以限制。"},{"t":"证据并不明确：福利支持者指出靠福利仅够艰难度日；自20世纪70年代初以来（经通胀调整的）福利补助一直在下降，而单亲家庭儿童的百分比却上升了——长期趋势不支持\"福利导致双亲家庭减少\"的观点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证据并不明确</strong>：福利支持者指出靠福利仅够艰难度日；自20世纪70年代初以来（经通胀调整的）福利补助一直在下降，而单亲家庭儿童的百分比却上升了——长期趋势不支持&quot;福利导致双亲家庭减少&quot;的观点。"}],"k":"b","i":1,"h":"20.3.2 福利"},{"t":"20.3.3 负所得税","c":[{"t":"负所得税（negative income tax）：向高收入家庭征税并给低收入家庭补贴的税制。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">负所得税</strong>（negative income tax）：向高收入家庭征税并给低收入家庭补贴的税制。"},{"t":"运作示例：应纳税额＝收入×1/3−10000美元——收入6万美元纳税1万、9万美元纳税2万、3万美元不纳税、1.5万美元的家庭\"应纳\"−5000美元（政府寄去5000美元支票）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">运作示例</strong>：应纳税额＝收入×1/3−10000美元——收入6万美元纳税1万、9万美元纳税2万、3万美元不纳税、1.5万美元的家庭&quot;应纳&quot;−5000美元（政府寄去5000美元支票）。"},{"t":"优缺点：贫困家庭无须证明需要即可获得帮助，唯一资格是收入低，故不鼓励非婚生育和家庭破裂；但它不仅补贴不幸运的人，也补贴仅仅由于懒惰而陷于贫穷的人——一些人认为政府不应补贴这样的人。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">优缺点</strong>：贫困家庭无须证明需要即可获得帮助，唯一资格是收入低，故不鼓励非婚生育和家庭破裂；但它不仅补贴不幸运的人，也补贴仅仅由于懒惰而陷于贫穷的人——一些人认为政府不应补贴这样的人。"},{"t":"现实中的近似条款：劳动所得税抵免——使贫困劳动家庭得到的所得税返还大于其缴纳的税收；因只适用于工作的穷人，不会像其他反贫困计划那样鼓励不工作，但也无助于减轻因失业、生病或其他无工作能力引起的贫困。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现实中的近似条款</strong>：劳动所得税抵免——使贫困劳动家庭得到的所得税返还大于其缴纳的税收；因只适用于工作的穷人，不会像其他反贫困计划那样鼓励不工作，但也无助于减轻因失业、生病或其他无工作能力引起的贫困。"}],"k":"b","i":1,"h":"20.3.3 负所得税"},{"t":"20.3.4 实物转移支付","c":[{"t":"形式：慈善机构提供食物、衣服、居住场所和圣诞节玩具；政府的食品券计划（向低收入家庭发放可在商店购物的类似借记卡的塑料卡）；医疗援助向穷人提供医疗保健。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">形式</strong>：慈善机构提供食物、衣服、居住场所和圣诞节玩具；政府的食品券计划（向低收入家庭发放可在商店购物的类似借记卡的塑料卡）；医疗援助向穷人提供医疗保健。"},{"t":"实物vs现金之争：实物转移支付的支持者认为它确保穷人得到最需要的东西（最贫困成员中嗜酒吸毒更普遍，提供食物住所可避免助长恶习），这也是实物支付在政治上更受欢迎的原因；现金支付的支持者认为政府并不知道穷人最需要什么，实物转移支付无效率且不尊重穷人——许多穷人只是运气不好的普通人，给他们现金购买自己最需要的东西会使他们状况更好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实物vs现金之争</strong>：实物转移支付的支持者认为它确保穷人得到最需要的东西（最贫困成员中嗜酒吸毒更普遍，提供食物住所可避免助长恶习），这也是实物支付在政治上更受欢迎的原因；现金支付的支持者认为政府并不知道穷人最需要什么，实物转移支付无效率且不尊重穷人——许多穷人只是运气不好的普通人，给他们现金购买自己最需要的东西会使他们状况更好。"}],"k":"b","i":1,"h":"20.3.4 实物转移支付"},{"t":"20.3.5 反贫困计划和工作激励","c":[{"t":"激励问题的极端示例：设维持合理生活水平需2万美元，政府承诺补足任何家庭收入与2万美元的差额——收入低于2万美元者毫无找工作和保持工作的激励（每赚1美元补贴就减少1美元，相当于对增加的收入征收100%的税），巨大无谓损失；被鼓励不工作的人还失去在职培训机会，其子女也无法从全职工作的父母处学到经验。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">激励问题的极端示例</strong>：设维持合理生活水平需2万美元，政府承诺补足任何家庭收入与2万美元的差额——收入低于2万美元者毫无找工作和保持工作的激励（每赚1美元补贴就减少1美元，相当于对增加的收入征收100%的税），巨大无谓损失；被鼓励不工作的人还失去在职培训机会，其子女也无法从全职工作的父母处学到经验。"},{"t":"现实对应：福利、医疗援助、食品券、劳动所得税抵免都与家庭收入挂钩，收入增加即丧失资格；各项计划叠加使贫困家庭面临很高的有效边际税率，有时甚至超过100%——多赚钱反而状况变坏；批评者称这改变了工作态度、创造了\"贫困文化\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现实对应</strong>：福利、医疗援助、食品券、劳动所得税抵免都与家庭收入挂钩，收入增加即丧失资格；各项计划叠加使贫困家庭面临很高的有效边际税率，有时甚至超过100%——多赚钱反而状况变坏；批评者称这改变了工作态度、创造了&quot;贫困文化&quot;。"},{"t":"缓解办法及其代价：随收入增加逐渐减少补贴（如每赚1美元减30美分补贴，即30%有效边际税率）可保留部分工作激励，但会大大增加计划成本——补贴退坡越慢，符合资格的家庭越多、成本越大；决策者面临用高有效边际税率增加穷人负担与用高成本反贫困计划增加纳税人负担之间的权衡取舍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">缓解办法及其代价</strong>：随收入增加逐渐减少补贴（如每赚1美元减30美分补贴，即30%有效边际税率）可保留部分工作激励，但会大大增加计划成本——补贴退坡越慢，符合资格的家庭越多、成本越大；决策者面临用高有效边际税率增加穷人负担与用高成本反贫困计划增加纳税人负担之间的权衡取舍。"},{"t":"其他方法：劳动福利制度（任何得到补贴的人都须接受一份政府提供的工作）；只在有限时间内提供补贴——1996年福利改革法案把接受福利的年限定为一生5年，克林顿：\"福利应该成为人们的另一种机会，而不是一种生活方式。\"","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">其他方法</strong>：劳动福利制度（任何得到补贴的人都须接受一份政府提供的工作）；只在有限时间内提供补贴——1996年福利改革法案把接受福利的年限定为一生5年，克林顿：&quot;福利应该成为人们的另一种机会，而不是一种生活方式。&quot;"},{"t":"即问即答要点：三项帮助穷人的政策及其优缺点——最低工资（政府不花钱但可能造成低技能工人失业、目标不准）、负所得税/劳动所得税抵免（不扭曲家庭结构但补贴懒惰者或不覆盖无工作者）、实物转移支付（确保得到必需品但可能无效率）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：三项帮助穷人的政策及其优缺点——最低工资（政府不花钱但可能造成低技能工人失业、目标不准）、负所得税/劳动所得税抵免（不扭曲家庭结构但补贴懒惰者或不覆盖无工作者）、实物转移支付（确保得到必需品但可能无效率）。"}],"k":"b","i":1,"h":"20.3.5 反贫困计划和工作激励"}],"k":"sec","i":0,"h":"20.3 减少贫困的政策"},{"t":"20.4 结论","c":[{"t":"柏拉图：理想社会中最富的人的收入不超过最穷的人收入的四倍；显然现代社会的收入不平等已大大超过这一建议程度。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">柏拉图</strong>：理想社会中最富的人的收入不超过最穷的人收入的四倍；显然现代社会的收入不平等已大大超过这一建议程度。"},{"t":"\"政府有时可以改善市场结果\"如何运用于收入分配并无一致看法——多大不平等是合意的、公共政策是否应以改变分配为目标，哲学家与决策者仍在争论（如增税时富人、中产、穷人各应承担多少）。","c":[],"k":"b","i":1,"h":"&quot;政府有时可以改善市场结果&quot;如何运用于收入分配并无一致看法——多大不平等是合意的、公共政策是否应以改变分配为目标，哲学家与决策者仍在争论（如增税时富人、中产、穷人各应承担多少）。"},{"t":"牢记\"人们面临权衡取舍\"：惩罚成功和奖励失败的政策减少了对成功者的激励；决策者面临平等与效率之间的权衡取舍——越平等地分割蛋糕，蛋糕就会变得越小，这几乎是人人同意的有关收入分配的结论。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">牢记&quot;人们面临权衡取舍&quot;</strong>：惩罚成功和奖励失败的政策减少了对成功者的激励；决策者面临平等与效率之间的权衡取舍——越平等地分割蛋糕，蛋糕就会变得越小，这几乎是人人同意的有关收入分配的结论。"}],"k":"sec","i":0,"h":"20.4 结论"}],"k":"chap","h":"第20章 收入不平等与贫困"}],"k":"part","h":"第6篇 劳动市场经济学","col":"#2563eb","pc":"p6"},{"t":"第7篇 深入研究的论题","c":[{"t":"第21章 消费者选择理论","c":[{"t":"本章内容提要","c":[{"t":"消费者预算约束线表示在收入与物品价格既定时消费者可以购买的不同物品组合；预算约束线的斜率等于两种物品的相对价格。","c":[],"k":"b","i":1,"h":"消费者预算约束线表示在收入与物品价格既定时消费者可以购买的不同物品组合；预算约束线的斜率等于两种物品的相对价格。"},{"t":"无差异曲线代表消费者偏好：消费者对较高无差异曲线上各点的偏好大于较低曲线上的各点；无差异曲线上任何一点的斜率是边际替代率——消费者愿意用一种物品交换另一种物品的比率。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">无差异曲线代表消费者偏好</strong>：消费者对较高无差异曲线上各点的偏好大于较低曲线上的各点；无差异曲线上任何一点的斜率是边际替代率——消费者愿意用一种物品交换另一种物品的比率。"},{"t":"消费者通过选择同时位于预算约束线和最高无差异曲线上的那一点（最优点）实现最优化；在该点，边际替代率等于相对价格，即消费者对两种物品的评价等于市场的评价。","c":[],"k":"b","i":1,"h":"消费者通过选择同时位于预算约束线和最高无差异曲线上的那一点（最优点）实现最优化；在该点，边际替代率等于相对价格，即消费者对两种物品的评价等于市场的评价。"},{"t":"一种物品价格下降对消费的影响可分解为收入效应（因状况变好、移向更高无差异曲线引起的消费变动）与替代效应（因相对价格变动、沿一条无差异曲线移向不同边际替代率一点引起的消费变动）。","c":[],"k":"b","i":1,"h":"一种物品价格下降对消费的影响可分解为收入效应（因状况变好、移向更高无差异曲线引起的消费变动）与替代效应（因相对价格变动、沿一条无差异曲线移向不同边际替代率一点引起的消费变动）。"},{"t":"消费者选择理论适用于许多情况：它能解释需求曲线为什么可能向右上方倾斜（吉芬物品）、工资提高为什么既可能增加也可能减少劳动供给量、高利率为什么既可能增加也可能减少储蓄。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">消费者选择理论适用于许多情况</strong>：它能解释需求曲线为什么可能向右上方倾斜（吉芬物品）、工资提高为什么既可能增加也可能减少劳动供给量、高利率为什么既可能增加也可能减少储蓄。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"21.1 预算约束：消费者能买得起什么","c":[{"t":"出发点：人们消费得比想要的少是因为受到收入约束；为简化只考察两种物品——比萨饼（每个10美元）与百事可乐（每升2美元），消费者月收入1000美元全部用于二者。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">出发点</strong>：人们消费得比想要的少是因为受到收入约束；为简化只考察两种物品——比萨饼（每个10美元）与百事可乐（每升2美元），消费者月收入1000美元全部用于二者。"},{"t":"预算约束线（budget constraint）：对消费者可以支付得起的消费组合的限制；它表示消费者支付得起的消费组合，即比萨饼与百事可乐之间的权衡取舍。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">预算约束线</strong>（budget constraint）：对消费者可以支付得起的消费组合的限制；它表示消费者支付得起的消费组合，即比萨饼与百事可乐之间的权衡取舍。"},{"t":"端点与中间点：全买比萨饼为100个（A点）、全买百事可乐为500升（B点）、中点C为50个比萨饼与250升可乐（两种物品各花500美元）；线段AB上所有点都是可能的选择，每种组合花费正好1000美元。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">端点与中间点</strong>：全买比萨饼为100个（A点）、全买百事可乐为500升（B点）、中点C为50个比萨饼与250升可乐（两种物品各花500美元）；线段AB上所有点都是可能的选择，每种组合花费正好1000美元。"},{"t":"斜率的含义：从A到B，纵轴变动500升除以横轴变动100个，斜率为每个比萨饼5升百事可乐（负号略去）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">斜率的含义</strong>：从A到B，纵轴变动500升除以横轴变动100个，斜率为每个比萨饼5升百事可乐（负号略去）。"},{"t":"斜率＝相对价格：预算约束线的斜率等于两种物品的价格之比（比萨饼价格是可乐的5倍，1个比萨饼的机会成本是5升可乐）；它反映市场提供给消费者的权衡取舍。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">斜率＝相对价格</strong>：预算约束线的斜率等于两种物品的价格之比（比萨饼价格是可乐的5倍，1个比萨饼的机会成本是5升可乐）；它反映市场提供给消费者的权衡取舍。"},{"t":"即问即答要点：若百事可乐价格升为5美元，端点变为100个比萨饼与200升可乐，预算约束线斜率为2（每个比萨饼换2升百事可乐）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：若百事可乐价格升为5美元，端点变为100个比萨饼与200升可乐，预算约束线斜率为2（每个比萨饼换2升百事可乐）。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">21.1 预算约束</strong>：消费者能买得起什么"},{"t":"21.2 偏好：消费者想要什么","c":[{"t":"分析的第二方面：消费者的选择不仅取决于预算约束（买得起什么），还取决于偏好（想要什么）；两个不同组合中消费者选最适合爱好者，若同等适合则为无差异。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">分析的第二方面</strong>：消费者的选择不仅取决于预算约束（买得起什么），还取决于偏好（想要什么）；两个不同组合中消费者选最适合爱好者，若同等适合则为无差异。"},{"t":"21.2.1 用无差异曲线代表偏好","c":[{"t":"无差异曲线（indifference curve）：一条表示给消费者带来相同满足程度的消费组合的曲线；同一条曲线上的组合（如A、B、C）使消费者同样满足，一种物品减少时另一种必须增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">无差异曲线</strong>（indifference curve）：一条表示给消费者带来相同满足程度的消费组合的曲线；同一条曲线上的组合（如A、B、C）使消费者同样满足，一种物品减少时另一种必须增加。"},{"t":"边际替代率（marginal rate of substitution, MRS）：消费者愿意以一种物品交换另一种物品的比率；一条无差异曲线上任意一点的斜率等于该点的边际替代率（本例衡量为补偿少消费一个比萨饼须得到多少升百事可乐）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边际替代率</strong>（marginal rate of substitution, MRS）：消费者愿意以一种物品交换另一种物品的比率；一条无差异曲线上任意一点的斜率等于该点的边际替代率（本例衡量为补偿少消费一个比萨饼须得到多少升百事可乐）。"},{"t":"MRS随消费量而变：无差异曲线不是直线，同一条曲线上各点的边际替代率不同——愿意用比萨饼换可乐的量取决于饥饿或干渴程度，而这又取决于已消费的量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">MRS随消费量而变</strong>：无差异曲线不是直线，同一条曲线上各点的边际替代率不同——愿意用比萨饼换可乐的量取决于饥饿或干渴程度，而这又取决于已消费的量。"},{"t":"曲线束的排序功能：因对较多消费的偏好大于较少消费，消费者对较高无差异曲线的偏好大于较低曲线；无差异曲线束给出偏好的完整排序（可给任意两种组合排序，如对更高曲线上D点的偏好大于C点）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">曲线束的排序功能</strong>：因对较多消费的偏好大于较少消费，消费者对较高无差异曲线的偏好大于较低曲线；无差异曲线束给出偏好的完整排序（可给任意两种组合排序，如对更高曲线上D点的偏好大于C点）。"}],"k":"b","i":1,"h":"21.2.1 用无差异曲线代表偏好"},{"t":"21.2.2 无差异曲线的四个特征","c":[{"t":"特征1：消费者对较高无差异曲线的偏好大于较低无差异曲线——消费者通常偏好消费更多而非更少，较高曲线代表更多的物品量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">特征1</strong>：消费者对较高无差异曲线的偏好大于较低无差异曲线——消费者通常偏好消费更多而非更少，较高曲线代表更多的物品量。"},{"t":"特征2：无差异曲线向右下方倾斜——若减少一种物品的量，为使消费者同样满足必须增加另一种物品的量（大多数情况下消费者对两种物品都喜欢）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">特征2</strong>：无差异曲线向右下方倾斜——若减少一种物品的量，为使消费者同样满足必须增加另一种物品的量（大多数情况下消费者对两种物品都喜欢）。"},{"t":"特征3：无差异曲线不相交——反证：若相交，交点两侧的A、B、C将使消费者获得相同满足，尽管C点两种物品都更多，这与\"多多益善\"矛盾；故无差异曲线不能相交。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">特征3</strong>：无差异曲线不相交——反证：若相交，交点两侧的A、B、C将使消费者获得相同满足，尽管C点两种物品都更多，这与&quot;多多益善&quot;矛盾；故无差异曲线不能相交。"},{"t":"特征4：无差异曲线凸向原点——边际替代率取决于已消费的物品量；人们更愿意放弃已经大量拥有的物品，而不愿放弃拥有不多的物品。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">特征4</strong>：无差异曲线凸向原点——边际替代率取决于已消费的物品量；人们更愿意放弃已经大量拥有的物品，而不愿放弃拥有不多的物品。"},{"t":"凸性的例子：A点（大量可乐、少量比萨饼，很饿不太渴）时放弃1个比萨饼要6升可乐补偿（MRS＝6）；B点（大量比萨饼、少量可乐，很渴不太饿）时只要求1升可乐（MRS＝1）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">凸性的例子</strong>：A点（大量可乐、少量比萨饼，很饿不太渴）时放弃1个比萨饼要6升可乐补偿（MRS＝6）；B点（大量比萨饼、少量可乐，很渴不太饿）时只要求1升可乐（MRS＝1）。"}],"k":"b","i":1,"h":"21.2.2 无差异曲线的四个特征"},{"t":"21.2.3 无差异曲线的两个极端例子","c":[{"t":"无差异曲线的形状反映替代难易：物品容易替代时凸性较小，难以替代时凸性很大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">无差异曲线的形状反映替代难易</strong>：物品容易替代时凸性较小，难以替代时凸性很大。"},{"t":"完全替代品（perfect substitutes）：无差异曲线为直线的两种物品——如5美分硬币与10美分硬币，只关心总货币价值，边际替代率不变（MRS＝2，总愿用2个5美分换1个10美分）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">完全替代品</strong>（perfect substitutes）：无差异曲线为直线的两种物品——如5美分硬币与10美分硬币，只关心总货币价值，边际替代率不变（MRS＝2，总愿用2个5美分换1个10美分）。"},{"t":"完全互补品（perfect complements）：无差异曲线为直角形的两种物品——如左脚鞋与右脚鞋，只关心能配成的对数（5只左脚鞋配7只右脚鞋只有5双，多余的右脚鞋没有价值）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">完全互补品</strong>（perfect complements）：无差异曲线为直角形的两种物品——如左脚鞋与右脚鞋，只关心能配成的对数（5只左脚鞋配7只右脚鞋只有5双，多余的右脚鞋没有价值）。"},{"t":"现实中大多数物品介于两个极端之间：无差异曲线凸向原点，但不会是直角形。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现实中大多数物品介于两个极端之间</strong>：无差异曲线凸向原点，但不会是直角形。"},{"t":"即问即答要点：比萨饼与百事可乐无差异曲线的四个特征——高曲线更偏好、向右下方倾斜、不相交、凸向原点（MRS递减）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：比萨饼与百事可乐无差异曲线的四个特征——高曲线更偏好、向右下方倾斜、不相交、凸向原点（MRS递减）。"}],"k":"b","i":1,"h":"21.2.3 无差异曲线的两个极端例子"}],"k":"sec","i":0,"h":"<strong class=\"lead\">21.2 偏好</strong>：消费者想要什么"},{"t":"21.3 最优化：消费者选择什么","c":[{"t":"把两个方面结合：预算约束（支付得起的数量）＋偏好（愿意为之支付的东西），考察消费者购买什么的决策。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">把两个方面结合</strong>：预算约束（支付得起的数量）＋偏好（愿意为之支付的东西），考察消费者购买什么的决策。"},{"t":"21.3.1 消费者的最优选择","c":[{"t":"最优点：消费者想达到最高可能的无差异曲线，又必须处于预算约束线之上（或之内）；消费者可以达到的最高无差异曲线是与预算约束线刚好相接触（相切）的那条，接触点即最优点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最优点</strong>：消费者想达到最高可能的无差异曲线，又必须处于预算约束线之上（或之内）；消费者可以达到的最高无差异曲线是与预算约束线刚好相接触（相切）的那条，接触点即最优点。"},{"t":"三点对比：更受偏爱的A点在预算约束线之外（负担不起）；B点负担得起但在较低无差异曲线上（满足较低）；最优点代表可得的最优组合。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三点对比</strong>：更受偏爱的A点在预算约束线之外（负担不起）；B点负担得起但在较低无差异曲线上（满足较低）；最优点代表可得的最优组合。"},{"t":"最优条件：在最优点，无差异曲线的斜率（边际替代率）等于预算约束线的斜率（相对价格），即MRS＝相对价格；相对价格是市场愿意以一种物品换另一种物品的比率，MRS是消费者愿意交换的比率——消费者对两种物品的评价等于市场的评价，故市场价格反映了消费者对物品的评价（与第7章\"价格反映边际评价\"相呼应）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最优条件</strong>：在最优点，无差异曲线的斜率（边际替代率）等于预算约束线的斜率（相对价格），即MRS＝相对价格；相对价格是市场愿意以一种物品换另一种物品的比率，MRS是消费者愿意交换的比率——消费者对两种物品的评价等于市场的评价，故市场价格反映了消费者对物品的评价（与第7章&quot;价格反映边际评价&quot;相呼应）。"},{"t":"参考资料「效用：描述偏好和最优化的另一种方法」：","c":[{"t":"效用（utility）：对消费者从一组物品中得到的满足和幸福程度的抽象衡量；更高的无差异曲线提供更高的效用，一条无差异曲线可视为\"等效用曲线\"。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">效用</strong>（utility）：对消费者从一组物品中得到的满足和幸福程度的抽象衡量；更高的无差异曲线提供更高的效用，一条无差异曲线可视为&quot;等效用曲线&quot;。"},{"t":"边际效用：多消费一单位物品带来的效用增加；一般假设边际效用递减（已拥有的越多，额外一单位的边际效用越低）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">边际效用</strong>：多消费一单位物品带来的效用增加；一般假设边际效用递减（已拥有的越多，额外一单位的边际效用越低）。"},{"t":"MRS等于两种物品边际效用之比（若X的边际效用是Y的两倍，则需2单位Y补偿1单位X，MRS＝2）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">MRS等于两种物品边际效用之比</strong>（若X的边际效用是Y的两倍，则需2单位Y补偿1单位X，MRS＝2）。"},{"t":"最优化条件：MRS＝Px/Py 等价于 MUx/MUy＝Px/Py，整理得 MUx/Px＝MUy/Py——在最优点，为每种物品支出的每美元的边际效用相等（否则应把支出从每美元边际效用较低的物品转出）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">最优化条件</strong>：MRS＝Px/Py 等价于 MUx/MUy＝Px/Py，整理得 MUx/Px＝MUy/Py——在最优点，为每种物品支出的每美元的边际效用相等（否则应把支出从每美元边际效用较低的物品转出）。"},{"t":"\"效用最大化／每美元边际效用相等\"与\"达到最高无差异曲线／相切\"是同一件事的两种表述。","c":[],"k":"b","i":3,"h":"&quot;效用最大化／每美元边际效用相等&quot;与&quot;达到最高无差异曲线／相切&quot;是同一件事的两种表述。"}],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「效用</strong>：描述偏好和最优化的另一种方法」："}],"k":"b","i":1,"h":"21.3.1 消费者的最优选择"},{"t":"21.3.2 收入变动如何影响消费者的选择","c":[{"t":"收入增加使预算约束线向外平行移动（两种物品相对价格未变，斜率不变），消费者可达更高无差异曲线，最优点移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">收入增加使预算约束线向外平行移动</strong>（两种物品相对价格未变，斜率不变），消费者可达更高无差异曲线，最优点移动。"},{"t":"正常物品（normal good）：收入增加引起需求量增加的物品——最常见情形是收入增加后两种物品都买更多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">正常物品</strong>（normal good）：收入增加引起需求量增加的物品——最常见情形是收入增加后两种物品都买更多。"},{"t":"低档物品（inferior good）：收入增加引起需求量减少的物品——可能出现收入增加后多买比萨饼、少买百事可乐的情形（设比萨饼为正常物品、可乐为低档物品）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">低档物品</strong>（inferior good）：收入增加引起需求量减少的物品——可能出现收入增加后多买比萨饼、少买百事可乐的情形（设比萨饼为正常物品、可乐为低档物品）。"},{"t":"低档物品的实例：坐公共汽车——收入增加后人们更可能自己买车或坐出租车，更少坐公共汽车。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">低档物品的实例</strong>：坐公共汽车——收入增加后人们更可能自己买车或坐出租车，更少坐公共汽车。"}],"k":"b","i":1,"h":"21.3.2 收入变动如何影响消费者的选择"},{"t":"21.3.3 价格变动如何影响消费者的选择","c":[{"t":"设百事可乐价格由每升2美元降为1美元：预算约束线向外移动且发生旋转——全买比萨饼的端点A不变（可乐价格不影响该选择），全买可乐的端点从500升移至1000升（B点到D点）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">设百事可乐价格由每升2美元降为1美元</strong>：预算约束线向外移动且发生旋转——全买比萨饼的端点A不变（可乐价格不影响该选择），全买可乐的端点从500升移至1000升（B点到D点）。"},{"t":"与收入变动的区别：价格变动改变预算约束线的斜率（相对价格）——可乐降价后要用10升而非5升可乐换1个比萨饼，新预算约束线更为陡峭；收入变动则只引起平行移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与收入变动的区别</strong>：价格变动改变预算约束线的斜率（相对价格）——可乐降价后要用10升而非5升可乐换1个比萨饼，新预算约束线更为陡峭；收入变动则只引起平行移动。"},{"t":"新最优取决于偏好：就图21-9的偏好而言，消费者将购买更多百事可乐和更少的比萨饼。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新最优取决于偏好</strong>：就图21-9的偏好而言，消费者将购买更多百事可乐和更少的比萨饼。"}],"k":"b","i":1,"h":"21.3.3 价格变动如何影响消费者的选择"},{"t":"21.3.4 收入效应与替代效应","c":[{"t":"收入效应（income effect）：当价格的某种变动使消费者移动到更高或更低无差异曲线时所引起的消费变动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">收入效应</strong>（income effect）：当价格的某种变动使消费者移动到更高或更低无差异曲线时所引起的消费变动。"},{"t":"替代效应（substitution effect）：当价格的某种变动使消费者沿着一条既定的无差异曲线变动到有新边际替代率的一点时所引起的消费变动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">替代效应</strong>（substitution effect）：当价格的某种变动使消费者沿着一条既定的无差异曲线变动到有新边际替代率的一点时所引起的消费变动。"},{"t":"直观对应两种推理：可乐降价使购买力提高（\"我比以前更富了\"→两种都多买，收入效应）；可乐相对变便宜（\"比萨饼相对更贵了\"→少买比萨多买可乐，替代效应）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">直观对应两种推理</strong>：可乐降价使购买力提高（&quot;我比以前更富了&quot;→两种都多买，收入效应）；可乐相对变便宜（&quot;比萨饼相对更贵了&quot;→少买比萨多买可乐，替代效应）。"},{"t":"表21-1结论（百事可乐价格下降时）：收入效应使消费者买更多可乐和更多比萨饼（设均为正常物品）；替代效应使消费者买更多可乐和更少比萨饼；两者叠加——百事可乐的消费肯定增加（两效应同向），比萨饼难以确定（两效应反方向）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表21-1结论</strong>（百事可乐价格下降时）：收入效应使消费者买更多可乐和更多比萨饼（设均为正常物品）；替代效应使消费者买更多可乐和更少比萨饼；两者叠加——百事可乐的消费肯定增加（两效应同向），比萨饼难以确定（两效应反方向）。"},{"t":"图形分解（A→B→C）：消费者沿原无差异曲线I1从A点到B点为替代效应（满足不变、边际替代率变为反映新相对价格，过B点的辅助线与新预算约束线平行）；再从B点移到更高无差异曲线I2上的C点为收入效应（B、C两点边际替代率相同，仅福利变化）；B点是消费者实际不会选择的假设辅助点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形分解</strong>（A→B→C）：消费者沿原无差异曲线I1从A点到B点为替代效应（满足不变、边际替代率变为反映新相对价格，过B点的辅助线与新预算约束线平行）；再从B点移到更高无差异曲线I2上的C点为收入效应（B、C两点边际替代率相同，仅福利变化）；B点是消费者实际不会选择的假设辅助点。"}],"k":"b","i":1,"h":"21.3.4 收入效应与替代效应"},{"t":"21.3.5 需求曲线的推导","c":[{"t":"需求曲线是消费者最优决策的总结：可乐价格从2美元降至1美元，预算约束线外移，因收入效应与替代效应，购买量从250升增至750升；把每一价格下的最优购买量描点即得向右下方倾斜的需求曲线。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求曲线是消费者最优决策的总结</strong>：可乐价格从2美元降至1美元，预算约束线外移，因收入效应与替代效应，购买量从250升增至750升；把每一价格下的最优购买量描点即得向右下方倾斜的需求曲线。"},{"t":"消费者选择理论为需求曲线提供了理论基础；但该理论的价值不止于此——它还适用于生活中各种决策（见21.4）。","c":[],"k":"b","i":2,"h":"消费者选择理论为需求曲线提供了理论基础；但该理论的价值不止于此——它还适用于生活中各种决策（见21.4）。"},{"t":"即问即答要点：比萨饼价格上升时，预算约束线绕\"全买可乐\"的端点向内旋转且更平缓，消费者最优点移动；变动可分解为沿原无差异曲线的替代效应与移向更低无差异曲线的收入效应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：比萨饼价格上升时，预算约束线绕&quot;全买可乐&quot;的端点向内旋转且更平缓，消费者最优点移动；变动可分解为沿原无差异曲线的替代效应与移向更低无差异曲线的收入效应。"}],"k":"b","i":1,"h":"21.3.5 需求曲线的推导"}],"k":"sec","i":0,"h":"<strong class=\"lead\">21.3 最优化</strong>：消费者选择什么"},{"t":"21.4 三种应用","c":[{"t":"三个看似不相关的家庭决策问题都可用消费者选择模型分析：需求曲线都向右下方倾斜吗？工资如何影响劳动供给？利率如何影响家庭储蓄？","c":[],"k":"b","i":1,"h":"三个看似不相关的家庭决策问题都可用消费者选择模型分析：需求曲线都向右下方倾斜吗？工资如何影响劳动供给？利率如何影响家庭储蓄？"},{"t":"21.4.1 所有的需求曲线都向右下方倾斜吗","c":[{"t":"一般行为是需求定理（价格上升购买量减少，需求曲线向右下方倾斜），但理论允许例外：消费者有时会在价格上升时购买更多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般行为是需求定理</strong>（价格上升购买量减少，需求曲线向右下方倾斜），但理论允许例外：消费者有时会在价格上升时购买更多。"},{"t":"肉与土豆之例：土豆价格上升使预算约束线向内移动（绕\"全买肉\"的端点旋转），最优点从C点变到E点——消费者少买肉、多买土豆。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">肉与土豆之例</strong>：土豆价格上升使预算约束线向内移动（绕&quot;全买肉&quot;的端点旋转），最优点从C点变到E点——消费者少买肉、多买土豆。"},{"t":"机制：土豆是一种非常低档的物品——土豆涨价使消费者变穷，收入效应使其少买肉、多买土豆；同时土豆相对变贵，替代效应使其多买肉、少买土豆；此例中收入效应大到超过替代效应，净效果是多买土豆。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机制</strong>：土豆是一种非常低档的物品——土豆涨价使消费者变穷，收入效应使其少买肉、多买土豆；同时土豆相对变贵，替代效应使其多买肉、少买土豆；此例中收入效应大到超过替代效应，净效果是多买土豆。"},{"t":"吉芬物品（Giffen good）：价格上升引起需求量增加的物品（以最早注意到这种可能性的经济学家罗伯特·吉芬命名）；它是收入效应大于替代效应（极强的低档）物品，需求曲线向右上方倾斜。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">吉芬物品</strong>（Giffen good）：价格上升引起需求量增加的物品（以最早注意到这种可能性的经济学家罗伯特·吉芬命名）；它是收入效应大于替代效应（极强的低档）物品，需求曲线向右上方倾斜。"},{"t":"案例研究「寻找吉芬物品」要点：历史学家指出19世纪爱尔兰土豆灾荒时期土豆可能是吉芬物品（土豆对人们如此重要，涨价产生很强收入效应，人们削减奢侈品肉、多买主食土豆）；Robert Jensen与Nolan Miller（2008，《美国经济评论》）在中国湖南随机发放大米购物券补贴、实地考察5个月，发现贫穷家庭表现出吉芬行为的有力证据——补贴使大米价格下降反而使这些家庭减少大米消费；这是吉芬行为的第一个严格经验证据；需求定理并不完全可靠，但吉芬物品极为罕见。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「寻找吉芬物品」要点</strong>：历史学家指出19世纪爱尔兰土豆灾荒时期土豆可能是吉芬物品（土豆对人们如此重要，涨价产生很强收入效应，人们削减奢侈品肉、多买主食土豆）；Robert Jensen与Nolan Miller（2008，《美国经济评论》）在中国湖南随机发放大米购物券补贴、实地考察5个月，发现贫穷家庭表现出吉芬行为的有力证据——补贴使大米价格下降反而使这些家庭减少大米消费；这是吉芬行为的第一个严格经验证据；需求定理并不完全可靠，但吉芬物品极为罕见。"}],"k":"b","i":1,"h":"21.4.1 所有的需求曲线都向右下方倾斜吗"},{"t":"21.4.2 工资如何影响劳动供给","c":[{"t":"模型转换：消费者选择理论也可分析人们如何分配时间——闲暇与消费之间的权衡取舍；把\"闲暇\"与\"消费\"当作两种物品。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">模型转换</strong>：消费者选择理论也可分析人们如何分配时间——闲暇与消费之间的权衡取舍；把&quot;闲暇&quot;与&quot;消费&quot;当作两种物品。"},{"t":"Kayla的例子：每周除睡觉外有100小时，工资每小时50美元；全闲暇则无消费，全工作则每周消费5000美元无闲暇，每周工作40小时则享受60小时闲暇并消费2000美元；最优点为预算约束线与最高无差异曲线的切点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">Kayla的例子</strong>：每周除睡觉外有100小时，工资每小时50美元；全闲暇则无消费，全工作则每周消费5000美元无闲暇，每周工作40小时则享受60小时闲暇并消费2000美元；最优点为预算约束线与最高无差异曲线的切点。"},{"t":"工资从50美元增至60美元：预算约束线向外移动并更陡峭（放弃的每小时闲暇换来更多消费）；消费都增加，但闲暇可能减少（图a）也可能增加（图b）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工资从50美元增至60美元</strong>：预算约束线向外移动并更陡峭（放弃的每小时闲暇换来更多消费）；消费都增加，但闲暇可能减少（图a）也可能增加（图b）。"},{"t":"由闲暇决策导出劳动供给曲线：工作小时＝可用总小时−闲暇小时，闲暇的反向变动即劳动供给的同向变动——图a中闲暇减少、劳动供给曲线向右上方倾斜；图b中闲暇增加、劳动供给曲线向右下方倾斜。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">由闲暇决策导出劳动供给曲线</strong>：工作小时＝可用总小时−闲暇小时，闲暇的反向变动即劳动供给的同向变动——图a中闲暇减少、劳动供给曲线向右上方倾斜；图b中闲暇增加、劳动供给曲线向右下方倾斜。"},{"t":"替代效应：工资增加使相对于消费而言闲暇变得更昂贵，鼓励用消费替代闲暇（更勤奋工作）→劳动供给曲线右上倾。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">替代效应</strong>：工资增加使相对于消费而言闲暇变得更昂贵，鼓励用消费替代闲暇（更勤奋工作）→劳动供给曲线右上倾。"},{"t":"收入效应：工资增加使Kayla移到更高无差异曲线、状况变好，只要消费和闲暇都是正常物品，福利增加用于享受更高消费和更多闲暇（减少工作）→劳动供给曲线右下倾。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">收入效应</strong>：工资增加使Kayla移到更高无差异曲线、状况变好，只要消费和闲暇都是正常物品，福利增加用于享受更高消费和更多闲暇（减少工作）→劳动供给曲线右下倾。"},{"t":"理论无明确预期：替代效应大于收入效应则工作更多，收入效应大于替代效应则工作更少；劳动供给曲线既可能向右上方也可能向右下方倾斜。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理论无明确预期</strong>：替代效应大于收入效应则工作更多，收入效应大于替代效应则工作更少；劳动供给曲线既可能向右上方也可能向右下方倾斜。"},{"t":"案例研究「劳动供给的收入效应：历史趋势、彩票赢家及卡内基的猜测」要点：长期看劳动供给曲线实际向右下方倾斜——一百多年前每周工作6天、现在每周5天，而一般工人实际工资持续增加（技术进步提高生产率与劳动需求、工资上升，但收入效应大于替代效应，工人把更多财富用于闲暇）；彩票赢家：赢得5万美元以上者约25%一年内辞职、9%减少工时，赢100万美元以上者约40%不再工作——奖金使预算约束线平行外移而斜率（工资）不变、无替代效应，从而把收入效应分离出来；1993年《经济学季刊》研究：继承遗产超过15万美元的人不再工作的可能性是继承少于2.5万美元者的4倍；卡内基的猜测：\"给儿子留下巨额财产的父母会使他们儿子的才能和热情大大丧失\"——他生前死后把大部分财产捐给慈善机构。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「劳动供给的收入效应</strong>：历史趋势、彩票赢家及卡内基的猜测」要点：长期看劳动供给曲线实际向右下方倾斜——一百多年前每周工作6天、现在每周5天，而一般工人实际工资持续增加（技术进步提高生产率与劳动需求、工资上升，但收入效应大于替代效应，工人把更多财富用于闲暇）；彩票赢家：赢得5万美元以上者约25%一年内辞职、9%减少工时，赢100万美元以上者约40%不再工作——奖金使预算约束线平行外移而斜率（工资）不变、无替代效应，从而把收入效应分离出来；1993年《经济学季刊》研究：继承遗产超过15万美元的人不再工作的可能性是继承少于2.5万美元者的4倍；卡内基的猜测：&quot;给儿子留下巨额财产的父母会使他们儿子的才能和热情大大丧失&quot;——他生前死后把大部分财产捐给慈善机构。"},{"t":"即问即答要点：工资增加的收入效应（状况变好、闲暇是正常物品→多要闲暇）可能超过替代效应（闲暇更贵→少要闲暇），从而减少一个人想要工作的量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：工资增加的收入效应（状况变好、闲暇是正常物品→多要闲暇）可能超过替代效应（闲暇更贵→少要闲暇），从而减少一个人想要工作的量。"}],"k":"b","i":1,"h":"21.4.2 工资如何影响劳动供给"},{"t":"21.4.3 利率如何影响家庭储蓄","c":[{"t":"两时期模型：把一生分为年轻（工作）与年老（退休）两个时期，\"年轻时的消费\"与\"年老时的消费\"是两种物品，利率决定二者的相对价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两时期模型</strong>：把一生分为年轻（工作）与年老（退休）两个时期，&quot;年轻时的消费&quot;与&quot;年老时的消费&quot;是两种物品，利率决定二者的相对价格。"},{"t":"Saul的例子：年轻时赚10万美元，利率10%——年轻时每储蓄1美元年老可消费1.1美元；不储蓄则年轻时消费10万、年老为0，全储蓄则年轻时为0、年老消费11万；既定偏好下最优点为年轻时消费5万、年老时消费5.5万。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">Saul的例子</strong>：年轻时赚10万美元，利率10%——年轻时每储蓄1美元年老可消费1.1美元；不储蓄则年轻时消费10万、年老为0，全储蓄则年轻时为0、年老消费11万；既定偏好下最优点为年轻时消费5万、年老时消费5.5万。"},{"t":"利率从10%升至20%：预算约束线向外移动且更陡峭（年轻时放弃的每1美元消费在年老换来更多消费）；两种偏好下年老时的消费都增加，但年轻时的消费可能减少（储蓄增加，图a）也可能增加（储蓄减少，图b）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利率从10%升至20%</strong>：预算约束线向外移动且更陡峭（年轻时放弃的每1美元消费在年老换来更多消费）；两种偏好下年老时的消费都增加，但年轻时的消费可能减少（储蓄增加，图a）也可能增加（储蓄减少，图b）。"},{"t":"替代效应：利率上升使年老时消费相对于年轻时消费变得更便宜→年老多消费、年轻时少消费，即储蓄更多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">替代效应</strong>：利率上升使年老时消费相对于年轻时消费变得更便宜→年老多消费、年轻时少消费，即储蓄更多。"},{"t":"收入效应：利率上升使Saul移到更高无差异曲线、状况改善，只要两时期消费的都是正常物品→两时期都多消费，即储蓄减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">收入效应</strong>：利率上升使Saul移到更高无差异曲线、状况改善，只要两时期消费的都是正常物品→两时期都多消费，即储蓄减少。"},{"t":"结论：利率上升既可能鼓励储蓄（替代效应大）也可能抑制储蓄（收入效应大），消费者选择理论未给出确定方向。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：利率上升既可能鼓励储蓄（替代效应大）也可能抑制储蓄（收入效应大），消费者选择理论未给出确定方向。"},{"t":"政策含义：税收政策的一个重要问题部分取决于储蓄对利率的反应——主张减征利息及其他资本收入税者认为税后利率上升会鼓励储蓄；反对者认为收入效应与替代效应相互抵消、减税未必增加储蓄甚至可能减少；研究尚无一致看法，关于鼓励储蓄的税收政策是否达到预期效果仍存争论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政策含义</strong>：税收政策的一个重要问题部分取决于储蓄对利率的反应——主张减征利息及其他资本收入税者认为税后利率上升会鼓励储蓄；反对者认为收入效应与替代效应相互抵消、减税未必增加储蓄甚至可能减少；研究尚无一致看法，关于鼓励储蓄的税收政策是否达到预期效果仍存争论。"}],"k":"b","i":1,"h":"21.4.3 利率如何影响家庭储蓄"}],"k":"sec","i":0,"h":"21.4 三种应用"},{"t":"21.5 结论：人们真的这样想吗","c":[{"t":"质疑与回应：消费者并不是真的画预算约束线和无差异曲线做决策；但消费者选择理论并不旨在精确描述决策过程，它只是一个模型（模型不必完全符合现实）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">质疑与回应</strong>：消费者并不是真的画预算约束线和
