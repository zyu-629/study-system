国中等家庭收入一半），负面影响不大；反对者认为它引起失业、鼓励退学、剥夺不熟练工人的在职培训，且目标欠清晰——只有不到三分之一的最低工资领取者生活在贫困线以下的家庭中，许多是中产阶级家庭赚零花钱的兼职青少年。（对\"最低工资增至每小时15美元将使低工资工人就业率大幅下降\"的说法，仅34%的受访经济学家同意，可见存在争论。）","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">争论</strong>：支持者认为它是增加贫困工人收入的方法（2015年两个领取最低工资的成年人每周各工作40小时，年收入合计也只有30160美元，超过四口之家官方贫困线24%，但不到美国中等家庭收入一半），负面影响不大；反对者认为它引起失业、鼓励退学、剥夺不熟练工人的在职培训，且目标欠清晰——只有不到三分之一的最低工资领取者生活在贫困线以下的家庭中，许多是中产阶级家庭赚零花钱的兼职青少年。（对&quot;最低工资增至每小时15美元将使低工资工人就业率大幅下降&quot;的说法，仅34%的受访经济学家同意，可见存在争论。）"}],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「最低工资」</strong>：最低工资法规定任何一个雇主要支付的最低劳动价格（美国国会在1938年《公平劳动标准法案》中首次规定；2015年联邦最低工资为每小时7.25美元，法国最低工资比美国高30%以上）。"}],"k":"b","i":1,"h":"6.1.2 价格下限如何影响市场结果"},{"t":"6.1.3 对价格控制的评价","c":[{"t":"经济学家通常反对价格上限和价格下限（依据原理\"市场通常是组织经济活动的一种好方法\"）：价格不是偶然过程的结果，而是隐藏在供求曲线背后的千百万企业和消费者决策的结果，起着平衡供求、协调经济活动的关键作用；决策者用法令规定价格，就模糊了正常情况下指引社会资源配置的信号。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学家通常反对价格上限和价格下限</strong>（依据原理&quot;市场通常是组织经济活动的一种好方法&quot;）：价格不是偶然过程的结果，而是隐藏在供求曲线背后的千百万企业和消费者决策的结果，起着平衡供求、协调经济活动的关键作用；决策者用法令规定价格，就模糊了正常情况下指引社会资源配置的信号。"},{"t":"决策者进行价格控制是因为认为市场结果不公平，目标往往是帮助穷人（租金控制使人人都住得起房，最低工资帮助人们摆脱贫困）；但价格控制往往损害了那些它本想帮助的人——租金控制无法鼓励房东修缮住房并使找房困难；最低工资使一些工人成为失业者。","c":[],"k":"b","i":2,"h":"决策者进行价格控制是因为认为市场结果不公平，目标往往是帮助穷人（租金控制使人人都住得起房，最低工资帮助人们摆脱贫困）；但价格控制往往损害了那些它本想帮助的人——租金控制无法鼓励房东修缮住房并使找房困难；最低工资使一些工人成为失业者。"},{"t":"替代政策：政府可通过给贫困家庭部分租金补贴使其租得起房，租金补贴不减少住房供给量、不引起短缺；工资补贴（如劳动收入税收减免）既提高贫穷工人的生活水平，又不刺激企业少雇工人。但这些政策要花费政府资金、要求更高的税收，而税收也有自己的成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">替代政策</strong>：政府可通过给贫困家庭部分租金补贴使其租得起房，租金补贴不减少住房供给量、不引起短缺；工资补贴（如劳动收入税收减免）既提高贫穷工人的生活水平，又不刺激企业少雇工人。但这些政策要花费政府资金、要求更高的税收，而税收也有自己的成本。"},{"t":"即问即答要点：价格上限是法定最高价（如租金控制），引起短缺；价格下限是法定最低价（如最低工资），引起过剩。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：价格上限是法定最高价（如租金控制），引起短缺；价格下限是法定最低价（如最低工资），引起过剩。"}],"k":"b","i":1,"h":"6.1.3 对价格控制的评价"}],"k":"sec","i":0,"h":"6.1 价格控制"},{"t":"6.2 税收","c":[{"t":"问题引入：政府都用税收为公路、学校和国防筹资；当政府对一种物品征税时，谁实际上承担税收负担？","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">问题引入</strong>：政府都用税收为公路、学校和国防筹资；当政府对一种物品征税时，谁实际上承担税收负担？"},{"t":"税收归宿（tax incidence）：税收负担在市场参与者之间进行分配的方式。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">税收归宿</strong>（tax incidence）：税收负担在市场参与者之间进行分配的方式。"},{"t":"6.2.1 向卖者征税如何影响市场结果","c":[{"t":"书中设定：对每个冰淇淋蛋卷的销售征0.5美元的税；分析遵循三步骤——（1）确定法律影响供给曲线还是需求曲线；（2）确定曲线移动的方向；（3）考察移动如何影响均衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中设定</strong>：对每个冰淇淋蛋卷的销售征0.5美元的税；分析遵循三步骤——（1）确定法律影响供给曲线还是需求曲线；（2）确定曲线移动的方向；（3）考察移动如何影响均衡。"},{"t":"第一步：税收直接影响卖者，任何既定价格下需求量不变，需求曲线不变；对卖者征税使每一价格水平下的获利减少，供给曲线移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第一步</strong>：税收直接影响卖者，任何既定价格下需求量不变，需求曲线不变；对卖者征税使每一价格水平下的获利减少，供给曲线移动。"},{"t":"第二步：税收提高生产和销售成本，供给曲线向左（向上）移动；无论市场价格是多少，卖者纳税后的有效价格都低0.5美元，故供给曲线恰好向上移动税收量（0.5美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第二步</strong>：税收提高生产和销售成本，供给曲线向左（向上）移动；无论市场价格是多少，卖者纳税后的有效价格都低0.5美元，故供给曲线恰好向上移动税收量（0.5美元）。"},{"t":"第三步：新均衡下，冰淇淋价格从3美元升至3.3美元，均衡数量从100个减至90个——税收缩小了市场规模。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第三步</strong>：新均衡下，冰淇淋价格从3美元升至3.3美元，均衡数量从100个减至90个——税收缩小了市场规模。"},{"t":"归宿分析：买者每个蛋卷多付0.3美元，状况变坏；卖者虽收到3.3美元，但纳税后有效价格从3美元降至2.8美元（3.3−0.5），状况也变坏——虽只有卖者向政府付税，买卖双方却分摊了负担。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">归宿分析</strong>：买者每个蛋卷多付0.3美元，状况变坏；卖者虽收到3.3美元，但纳税后有效价格从3美元降至2.8美元（3.3−0.5），状况也变坏——虽只有卖者向政府付税，买卖双方却分摊了负担。"},{"t":"两个结论：其一，税收抑制市场活动，征税物品在新均衡时的销售量减少；其二，买者与卖者分摊税收负担，新均衡下买者支付得更多、卖者得到更少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个结论</strong>：其一，税收抑制市场活动，征税物品在新均衡时的销售量减少；其二，买者与卖者分摊税收负担，新均衡下买者支付得更多、卖者得到更少。"}],"k":"b","i":1,"h":"6.2.1 向卖者征税如何影响市场结果"},{"t":"6.2.2 向买者征税如何影响市场结果","c":[{"t":"第一步：税收首先影响买者，卖者提供物品的激励不变，供给曲线不变；需求曲线移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第一步</strong>：税收首先影响买者，卖者提供物品的激励不变，供给曲线不变；需求曲线移动。"},{"t":"第二步：买者的有效价格（含税）比市场价格高0.5美元，买者如同在更高价格上决定需求量，需求曲线恰好向下移动税收量（0.5美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第二步</strong>：买者的有效价格（含税）比市场价格高0.5美元，买者如同在更高价格上决定需求量，需求曲线恰好向下移动税收量（0.5美元）。"},{"t":"第三步：新均衡下，市场价格从3美元降至2.8美元，数量从100个减至90个；买者含税的有效价格从3美元升至3.3美元——市场又缩小了，买卖双方又分摊了负担。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第三步</strong>：新均衡下，市场价格从3美元降至2.8美元，数量从100个减至90个；买者含税的有效价格从3美元升至3.3美元——市场又缩小了，买卖双方又分摊了负担。"},{"t":"令人惊讶的结论：对买者征税和对卖者征税是等同的。两种方式都在买者支付的价格和卖者得到的价格之间打入一个相同的\"楔子\"，都使供求曲线的相对位置发生移动，新均衡时买卖双方分摊税收负担；唯一区别是谁把钱交给政府（\"柜台上放一个碗\"的比喻：无论0.5美元是买者直接放进碗，还是经卖者之手再进碗，都无关紧要）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">令人惊讶的结论</strong>：对买者征税和对卖者征税是等同的。两种方式都在买者支付的价格和卖者得到的价格之间打入一个相同的&quot;楔子&quot;，都使供求曲线的相对位置发生移动，新均衡时买卖双方分摊税收负担；唯一区别是谁把钱交给政府（&quot;柜台上放一个碗&quot;的比喻：无论0.5美元是买者直接放进碗，还是经卖者之手再进碗，都无关紧要）。"},{"t":"案例研究「国会能分配工薪税的负担吗」：FICA工薪税（依据《联邦保险税法案》，收入用于社会保障与医疗保险，2015年占普通工人收入的15.3%）法律规定企业与工人各付一半。但工薪税本质上是打入企业支付的工资与工人得到的工资之间的一个楔子：工人得到的工资减少、企业支付的工资增加，负担划分由供求力量决定，与立法的划分无关——即使法律要求全部向工人或全部向企业征收，结果也一样。这说明立法者可以决定税收来自谁的口袋，却不能用立法规定税收的真正负担。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「国会能分配工薪税的负担吗」</strong>：FICA工薪税（依据《联邦保险税法案》，收入用于社会保障与医疗保险，2015年占普通工人收入的15.3%）法律规定企业与工人各付一半。但工薪税本质上是打入企业支付的工资与工人得到的工资之间的一个楔子：工人得到的工资减少、企业支付的工资增加，负担划分由供求力量决定，与立法的划分无关——即使法律要求全部向工人或全部向企业征收，结果也一样。这说明立法者可以决定税收来自谁的口袋，却不能用立法规定税收的真正负担。"}],"k":"b","i":1,"h":"6.2.2 向买者征税如何影响市场结果"},{"t":"6.2.3 弹性与税收归宿","c":[{"t":"图6-9两种情形（都画出不移动的原供求曲线与打入买卖价格的楔子；哪条曲线移动取决于向谁征税，但这与归宿无关），差别在于供给和需求的相对弹性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图6-9两种情形</strong>（都画出不移动的原供求曲线与打入买卖价格的楔子；哪条曲线移动取决于向谁征税，但这与归宿无关），差别在于供给和需求的相对弹性。"},{"t":"供给富有弹性、需求缺乏弹性时（供给曲线平坦、需求曲线陡峭）：卖者得到的价格只有很少下降、只承担一小部分负担，买者支付的价格大幅上升、承担大部分税收负担。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给富有弹性、需求缺乏弹性时</strong>（供给曲线平坦、需求曲线陡峭）：卖者得到的价格只有很少下降、只承担一小部分负担，买者支付的价格大幅上升、承担大部分税收负担。"},{"t":"供给缺乏弹性、需求富有弹性时（供给曲线陡峭、需求曲线平坦）：买者支付的价格只有很少上升，卖者得到的价格大幅下降、承担大部分负担。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给缺乏弹性、需求富有弹性时</strong>（供给曲线陡峭、需求曲线平坦）：买者支付的价格只有很少上升，卖者得到的价格大幅下降、承担大部分负担。"},{"t":"一般结论：税收负担更多地落在缺乏弹性的市场一方。原因：弹性衡量当条件变得不利时买者或卖者离开市场的意愿——需求弹性小意味着买者对消费该物品没有适当的替代品，供给弹性小意味着卖者对生产该物品没有适当的替代品；替代品较少的一方不太愿意离开市场，从而必须承担更多负担。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般结论</strong>：税收负担更多地落在缺乏弹性的市场一方。原因：弹性衡量当条件变得不利时买者或卖者离开市场的意愿——需求弹性小意味着买者对消费该物品没有适当的替代品，供给弹性小意味着卖者对生产该物品没有适当的替代品；替代品较少的一方不太愿意离开市场，从而必须承担更多负担。"},{"t":"应用于工薪税：大多数劳动经济学家认为劳动的供给远比劳动的需求缺乏弹性，因此是工人而不是企业承担了大部分工薪税负担，与立法者期望的一半对一半相差甚远。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用于工薪税</strong>：大多数劳动经济学家认为劳动的供给远比劳动的需求缺乏弹性，因此是工人而不是企业承担了大部分工薪税负担，与立法者期望的一半对一半相差甚远。"},{"t":"案例研究「谁支付奢侈品税」：1990年美国国会通过对游艇、私人飞机、皮衣、珠宝和豪华轿车的奢侈品税，意图让能轻而易举承担税负的富人纳税。但游艇的需求极其富有弹性（百万富翁可不买游艇，改买大房子、去欧洲度假或留更大遗产），供给（至少短期）较为缺乏弹性（游艇工厂不能轻而易举转产，建造工人不愿改行）；需求富有弹性而供给缺乏弹性，负担主要落在供给者——建造游艇的企业和工人身上，而工人并不是富人，税负反而更多落在中产阶级身上。1993年国会废除了大部分奢侈品税。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「谁支付奢侈品税」</strong>：1990年美国国会通过对游艇、私人飞机、皮衣、珠宝和豪华轿车的奢侈品税，意图让能轻而易举承担税负的富人纳税。但游艇的需求极其富有弹性（百万富翁可不买游艇，改买大房子、去欧洲度假或留更大遗产），供给（至少短期）较为缺乏弹性（游艇工厂不能轻而易举转产，建造工人不愿改行）；需求富有弹性而供给缺乏弹性，负担主要落在供给者——建造游艇的企业和工人身上，而工人并不是富人，税负反而更多落在中产阶级身上。1993年国会废除了大部分奢侈品税。"}],"k":"b","i":1,"h":"6.2.3 弹性与税收归宿"}],"k":"sec","i":0,"h":"6.2 税收"},{"t":"6.3 结论","c":[{"t":"经济受两种规则体系支配：供求规律和政府制定的法规；即使只懂得一点经济学知识，也可以大致了解并评价价格控制与税收政策的影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经济受两种规则体系支配</strong>：供求规律和政府制定的法规；即使只懂得一点经济学知识，也可以大致了解并评价价格控制与税收政策的影响。"},{"t":"基本结论：当分析政府政策时，供给和需求是首要的、最有用的分析工具。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">基本结论</strong>：当分析政府政策时，供给和需求是首要的、最有用的分析工具。"},{"t":"即问即答要点：无论对汽车购买者还是销售者征收每辆1000美元的税，供求分析都显示——销售量减少，买者支付的价格上升，卖者得到的价格下降，两种征税方式结果相同。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：无论对汽车购买者还是销售者征收每辆1000美元的税，供求分析都显示——销售量减少，买者支付的价格上升，卖者得到的价格下降，两种征税方式结果相同。"}],"k":"sec","i":0,"h":"6.3 结论"}],"k":"chap","h":"第6章 供给、需求与政府政策"}],"k":"part","h":"第2篇 市场如何运行","col":"#0e9f8a","pc":"p2"},{"t":"第3篇 市场和福利","c":[{"t":"第7章 消费者、生产者与市场效率","c":[{"t":"本章内容提要","c":[{"t":"福利经济学（welfare economics）：研究资源配置如何影响经济福利的一门学问。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">福利经济学</strong>（welfare economics）：研究资源配置如何影响经济福利的一门学问。"},{"t":"消费者剩余等于买者的支付意愿减去其实际支付的量，衡量买者从参与市场中得到的利益；用需求曲线以下、价格以上的面积衡量。","c":[],"k":"b","i":1,"h":"消费者剩余等于买者的支付意愿减去其实际支付的量，衡量买者从参与市场中得到的利益；用需求曲线以下、价格以上的面积衡量。"},{"t":"生产者剩余等于卖者出售一种物品得到的量减去其生产成本，衡量卖者从参与市场中得到的利益；用价格以下、供给曲线以上的面积衡量。","c":[],"k":"b","i":1,"h":"生产者剩余等于卖者出售一种物品得到的量减去其生产成本，衡量卖者从参与市场中得到的利益；用价格以下、供给曲线以上的面积衡量。"},{"t":"效率（efficiency）指资源配置使社会所有成员得到的总剩余（消费者剩余＋生产者剩余）最大化的性质；平等（equality）指经济福利如何在社会成员中分配。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">效率</strong>（efficiency）指资源配置使社会所有成员得到的总剩余（消费者剩余＋生产者剩余）最大化的性质；平等（equality）指经济福利如何在社会成员中分配。"},{"t":"供给与需求的均衡使消费者剩余与生产者剩余的总和最大化：均衡结果是资源的有效配置，市场中看不见的手指引买者与卖者有效地配置资源。","c":[],"k":"b","i":1,"h":"供给与需求的均衡使消费者剩余与生产者剩余的总和最大化：均衡结果是资源的有效配置，市场中看不见的手指引买者与卖者有效地配置资源。"},{"t":"在存在市场势力或外部性等市场失灵的情况下，市场不能有效地配置资源。","c":[],"k":"b","i":1,"h":"在存在市场势力或外部性等市场失灵的情况下，市场不能有效地配置资源。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"7.1 消费者剩余","c":[{"t":"7.1.1 支付意愿","c":[{"t":"支付意愿（willingness to pay）：买者愿意为某种物品支付的最高量，衡量买者对物品的评价；每个买者都希望以低于自己支付意愿的价格购买、拒绝高于支付意愿的价格、对正好等于支付意愿的价格持无所谓态度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">支付意愿</strong>（willingness to pay）：买者愿意为某种物品支付的最高量，衡量买者对物品的评价；每个买者都希望以低于自己支付意愿的价格购买、拒绝高于支付意愿的价格、对正好等于支付意愿的价格持无所谓态度。"},{"t":"书中示例「猫王专辑拍卖」：四个买者的支付意愿为Taylor 100美元、Carrie 80美元、Rihanna 70美元、Gaga 50美元；从低价起叫价，价格上升到有人放弃为止——拍卖把专辑给了对它评价最高的买者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中示例「猫王专辑拍卖」</strong>：四个买者的支付意愿为Taylor 100美元、Carrie 80美元、Rihanna 70美元、Gaga 50美元；从低价起叫价，价格上升到有人放弃为止——拍卖把专辑给了对它评价最高的买者。"},{"t":"消费者剩余（consumer surplus）：买者愿意为一种物品支付的量减去其为此实际支付的量；衡量买者从参与市场中得到的利益。","c":[{"t":"一张专辑以80美元卖出：评价最高的Taylor 得到消费者剩余100−80＝20美元；未买到者也未花钱，剩余为0。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">一张专辑以80美元卖出</strong>：评价最高的Taylor 得到消费者剩余100−80＝20美元；未买到者也未花钱，剩余为0。"},{"t":"两张专辑都以70美元卖出：Taylor 剩余30美元、Carrie 剩余10美元，市场总消费者剩余40美元；价格更低时原有买者付得更少、剩余更高。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">两张专辑都以70美元卖出</strong>：Taylor 剩余30美元、Carrie 剩余10美元，市场总消费者剩余40美元；价格更低时原有买者付得更少、剩余更高。"}],"k":"b","i":2,"h":"<strong class=\"lead\">消费者剩余</strong>（consumer surplus）：买者愿意为一种物品支付的量减去其为此实际支付的量；衡量买者从参与市场中得到的利益。"}],"k":"b","i":1,"h":"7.1.1 支付意愿"},{"t":"7.1.2 用需求曲线衡量消费者剩余","c":[{"t":"需求曲线的高度反映买者的支付意愿：任何一种数量时，需求曲线给出的价格表示边际买者（如果价格再提高一点就首先离开市场的买者）的支付意愿（如数量4时高度50美元是Gaga 的支付意愿，数量3时高度70美元是Rihanna 的）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求曲线的高度反映买者的支付意愿</strong>：任何一种数量时，需求曲线给出的价格表示边际买者（如果价格再提高一点就首先离开市场的买者）的支付意愿（如数量4时高度50美元是Gaga 的支付意愿，数量3时高度70美元是Rihanna 的）。"},{"t":"由支付意愿可推导需求表和需求曲线：价格100美元以上需求量为0；80–100美元为1；70–80美元为2；50–70美元为3；50美元及以下为4。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">由支付意愿可推导需求表和需求曲线</strong>：价格100美元以上需求量为0；80–100美元为1；70–80美元为2；50–70美元为3；50美元及以下为4。"},{"t":"一般结论：需求曲线以下和价格以上的面积衡量一个市场上的消费者剩余——价格80美元时该面积为20美元，价格70美元时为40美元，与逐个买者计算的结果一致；因为需求曲线的高度衡量买者的评价（支付意愿），它与市场价格之差即每个买者的剩余，总面积是所有买者消费者剩余的总和。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般结论</strong>：需求曲线以下和价格以上的面积衡量一个市场上的消费者剩余——价格80美元时该面积为20美元，价格70美元时为40美元，与逐个买者计算的结果一致；因为需求曲线的高度衡量买者的评价（支付意愿），它与市场价格之差即每个买者的剩余，总面积是所有买者消费者剩余的总和。"}],"k":"b","i":1,"h":"7.1.2 用需求曲线衡量消费者剩余"},{"t":"7.1.3 价格降低如何增加消费者剩余","c":[{"t":"买者总想少付钱，价格降低使买者状况变好；在买者众多的市场上，阶梯状需求曲线近似为平滑曲线，但\"消费者剩余＝价格以上、需求曲线以下的面积\"的思想不变。","c":[],"k":"b","i":2,"h":"买者总想少付钱，价格降低使买者状况变好；在买者众多的市场上，阶梯状需求曲线近似为平滑曲线，但&quot;消费者剩余＝价格以上、需求曲线以下的面积&quot;的思想不变。"},{"t":"价格从P1降到P2时，消费者剩余的增加（面积BCFD）由两部分组成：其一，原来以较高价格P1购买Q1的原有买者现在支付得少了（矩形BCED）；其二，一些新买者因价格降低进入市场，需求量从Q1增加到Q2（三角形CEF）。","c":[],"k":"b","i":2,"h":"价格从P1降到P2时，消费者剩余的增加（面积BCFD）由两部分组成：其一，原来以较高价格P1购买Q1的原有买者现在支付得少了（矩形BCED）；其二，一些新买者因价格降低进入市场，需求量从Q1增加到Q2（三角形CEF）。"}],"k":"b","i":1,"h":"7.1.3 价格降低如何增加消费者剩余"},{"t":"7.1.4 消费者剩余衡量什么","c":[{"t":"消费者剩余衡量买者从一种物品中得到的自己感觉到的利益；如果决策者想尊重买者的偏好，消费者剩余不失为经济福利的一种好的衡量标准。","c":[],"k":"b","i":2,"h":"消费者剩余衡量买者从一种物品中得到的自己感觉到的利益；如果决策者想尊重买者的偏好，消费者剩余不失为经济福利的一种好的衡量标准。"},{"t":"例外情形：决策者可能选择不尊重某些驱动买者行为的偏好（如吸毒者愿为海洛因支付高价），此时支付意愿不是买者利益的好的衡量指标，消费者剩余也不是经济福利的好的衡量指标。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例外情形</strong>：决策者可能选择不尊重某些驱动买者行为的偏好（如吸毒者愿为海洛因支付高价），此时支付意愿不是买者利益的好的衡量指标，消费者剩余也不是经济福利的好的衡量指标。"},{"t":"在大多数市场上，消费者剩余确实反映经济福利：经济学家通常假设买者决策理性、偏好应该得到尊重，消费者是自己从购买物品中得到多少利益的最佳裁判。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">在大多数市场上，消费者剩余确实反映经济福利</strong>：经济学家通常假设买者决策理性、偏好应该得到尊重，消费者是自己从购买物品中得到多少利益的最佳裁判。"},{"t":"即问即答要点：火鸡需求曲线之下、价格之上的面积即该价格下的消费者剩余，衡量买者感觉到的利益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：火鸡需求曲线之下、价格之上的面积即该价格下的消费者剩余，衡量买者感觉到的利益。"}],"k":"b","i":1,"h":"7.1.4 消费者剩余衡量什么"}],"k":"sec","i":0,"h":"7.1 消费者剩余"},{"t":"7.2 生产者剩余","c":[{"t":"7.2.1 成本与销售意愿","c":[{"t":"成本（cost）：卖者为了生产一种物品而必须放弃的所有东西的价值，应解释为机会成本——包括直接支出（油漆、刷子等）和卖者对自己时间的评价；成本是卖者愿意接受这份工作的最低价格，衡量其出售意愿。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成本</strong>（cost）：卖者为了生产一种物品而必须放弃的所有东西的价值，应解释为机会成本——包括直接支出（油漆、刷子等）和卖者对自己时间的评价；成本是卖者愿意接受这份工作的最低价格，衡量其出售意愿。"},{"t":"书中示例「房屋油漆竞价」：四个卖者的成本为Andy 500美元、Pablo 600美元、Claude 800美元、Vincent 900美元；竞价从高价往下竞争——工作给予了能以最低成本从事工作的油漆工。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中示例「房屋油漆竞价」</strong>：四个卖者的成本为Andy 500美元、Pablo 600美元、Claude 800美元、Vincent 900美元；竞价从高价往下竞争——工作给予了能以最低成本从事工作的油漆工。"},{"t":"生产者剩余（producer surplus）：卖者出售一种物品得到的量减去其生产成本；衡量卖者从参与市场中得到的利益。","c":[{"t":"一间房子以600美元成交：成本最低的Andy 得到生产者剩余600−500＝100美元。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">一间房子以600美元成交</strong>：成本最低的Andy 得到生产者剩余600−500＝100美元。"},{"t":"两间房子都以800美元成交：Andy 剩余300美元、Pablo 剩余200美元，市场总生产者剩余500美元。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">两间房子都以800美元成交</strong>：Andy 剩余300美元、Pablo 剩余200美元，市场总生产者剩余500美元。"}],"k":"b","i":2,"h":"<strong class=\"lead\">生产者剩余</strong>（producer surplus）：卖者出售一种物品得到的量减去其生产成本；衡量卖者从参与市场中得到的利益。"}],"k":"b","i":1,"h":"7.2.1 成本与销售意愿"},{"t":"7.2.2 用供给曲线衡量生产者剩余","c":[{"t":"供给曲线的高度反映卖者的成本：任何一种数量时，供给曲线给出的价格表示边际卖者（如果价格再降低一点就首先离开市场的卖者）的成本（如数量4时高度900美元是Vincent 的成本，数量3时高度800美元是Claude 的）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给曲线的高度反映卖者的成本</strong>：任何一种数量时，供给曲线给出的价格表示边际卖者（如果价格再降低一点就首先离开市场的卖者）的成本（如数量4时高度900美元是Vincent 的成本，数量3时高度800美元是Claude 的）。"},{"t":"由成本可推导供给表和供给曲线：价格500美元以下供给量为0；500–600美元为1；600–800美元为2；800–900美元为3；900美元及以上为4。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">由成本可推导供给表和供给曲线</strong>：价格500美元以下供给量为0；500–600美元为1；600–800美元为2；800–900美元为3；900美元及以上为4。"},{"t":"一般结论：价格以下和供给曲线以上的面积衡量一个市场上的生产者剩余——价格600美元时该面积为100美元，价格800美元时为500美元，与逐个卖者计算的结果一致；供给曲线的高度衡量卖者的成本，价格与成本之差即每个卖者的剩余，总面积是所有卖者生产者剩余的总和。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般结论</strong>：价格以下和供给曲线以上的面积衡量一个市场上的生产者剩余——价格600美元时该面积为100美元，价格800美元时为500美元，与逐个卖者计算的结果一致；供给曲线的高度衡量卖者的成本，价格与成本之差即每个卖者的剩余，总面积是所有卖者生产者剩余的总和。"}],"k":"b","i":1,"h":"7.2.2 用供给曲线衡量生产者剩余"},{"t":"7.2.3 价格上升如何增加生产者剩余","c":[{"t":"生产者剩余＝价格以下、供给曲线以上的面积；价格从P1升到P2时，生产者剩余的增加（面积BCFD）由两部分组成：其一，原有卖者以更低价格P1出售的Q1现在卖到更高价格（矩形BCED）；其二，一些新卖者因价格较高进入市场，供给量从Q1增加到Q2（三角形CEF）。","c":[],"k":"b","i":2,"h":"生产者剩余＝价格以下、供给曲线以上的面积；价格从P1升到P2时，生产者剩余的增加（面积BCFD）由两部分组成：其一，原有卖者以更低价格P1出售的Q1现在卖到更高价格（矩形BCED）；其二，一些新卖者因价格较高进入市场，供给量从Q1增加到Q2（三角形CEF）。"},{"t":"用生产者剩余衡量卖者福利与用消费者剩余衡量买者福利的方法大体相同，两种福利衡量相似、可同时使用——这正是下一节的工作。","c":[],"k":"b","i":2,"h":"用生产者剩余衡量卖者福利与用消费者剩余衡量买者福利的方法大体相同，两种福利衡量相似、可同时使用——这正是下一节的工作。"},{"t":"即问即答要点：火鸡价格以下、供给曲线以上的面积即该价格下的生产者剩余，衡量卖者感觉到的利益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：火鸡价格以下、供给曲线以上的面积即该价格下的生产者剩余，衡量卖者感觉到的利益。"}],"k":"b","i":1,"h":"7.2.3 价格上升如何增加生产者剩余"}],"k":"sec","i":0,"h":"7.2 生产者剩余"},{"t":"7.3 市场效率","c":[{"t":"7.3.1 仁慈的社会计划者","c":[{"t":"仁慈的社会计划者：假设的无所不知、无所不能、意愿良好的独裁者，想使社会上每个人的经济福利最大化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">仁慈的社会计划者</strong>：假设的无所不知、无所不能、意愿良好的独裁者，想使社会上每个人的经济福利最大化。"},{"t":"总剩余的衡量：总剩余＝消费者剩余＋生产者剩余＝（买者的评价−买者支付的量）＋（卖者得到的量−卖者的成本）；由于买者支付的量等于卖者得到的量，中间两项抵消，故总剩余＝买者的评价−卖者的成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总剩余的衡量</strong>：总剩余＝消费者剩余＋生产者剩余＝（买者的评价−买者支付的量）＋（卖者得到的量−卖者的成本）；由于买者支付的量等于卖者得到的量，中间两项抵消，故总剩余＝买者的评价−卖者的成本。"},{"t":"效率（efficiency）：资源配置使社会所有成员得到的总剩余最大化的性质。若配置无效率，则买者和卖者之间交易的一些潜在利益还没有实现：物品若不是由成本最低的卖者生产（转给低成本者可降低总成本、增加总剩余），或不是由评价最高的买者消费（从评价低的买者转给评价高的买者可增加总剩余），配置就是无效率的。这种因偏离有效配置而未实现的潜在利益、造成的总剩余减少，就是无谓损失（deadweight loss）的含义（本章以\"未实现的交易利益\"的形式出现，该术语将在第8章正式展开）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效率</strong>（efficiency）：资源配置使社会所有成员得到的总剩余最大化的性质。若配置无效率，则买者和卖者之间交易的一些潜在利益还没有实现：物品若不是由成本最低的卖者生产（转给低成本者可降低总成本、增加总剩余），或不是由评价最高的买者消费（从评价低的买者转给评价高的买者可增加总剩余），配置就是无效率的。这种因偏离有效配置而未实现的潜在利益、造成的总剩余减少，就是无谓损失（deadweight loss）的含义（本章以&quot;未实现的交易利益&quot;的形式出现，该术语将在第8章正式展开）。"},{"t":"平等（equality）：在社会成员中平均地分配经济成果的性质。市场贸易的利益像一块蛋糕：效率问题涉及蛋糕是否尽可能地做大了，平等问题涉及蛋糕如何切分和分配；本章集中于效率，但真正的决策者往往也关心平等。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">平等</strong>（equality）：在社会成员中平均地分配经济成果的性质。市场贸易的利益像一块蛋糕：效率问题涉及蛋糕是否尽可能地做大了，平等问题涉及蛋糕如何切分和分配；本章集中于效率，但真正的决策者往往也关心平等。"}],"k":"b","i":1,"h":"7.3.1 仁慈的社会计划者"},{"t":"7.3.2 市场均衡的评价","c":[{"t":"市场均衡时，消费者剩余＝价格以上、需求曲线以下的面积，生产者剩余＝价格以下、供给曲线以上的面积，总剩余是供给曲线和需求曲线到均衡数量之间的面积。","c":[],"k":"b","i":2,"h":"市场均衡时，消费者剩余＝价格以上、需求曲线以下的面积，生产者剩余＝价格以下、供给曲线以上的面积，总剩余是供给曲线和需求曲线到均衡数量之间的面积。"},{"t":"均衡价格自动筛选参与者：评价高于价格的买者（需求曲线AE段）选择购买、低于价格者（EB段）不购买；成本低于价格的卖者（供给曲线CE段）选择生产销售、高于价格者（ED段）不生产。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">均衡价格自动筛选参与者</strong>：评价高于价格的买者（需求曲线AE段）选择购买、低于价格者（EB段）不购买；成本低于价格的卖者（供给曲线CE段）选择生产销售、高于价格者（ED段）不生产。"},{"t":"关于市场结果的三个观点：（1）自由市场把物品的供给分配给对这些物品评价最高的买者（用支付意愿衡量）；（2）自由市场将物品的需求分配给能够以最低成本生产这些物品的卖者；（3）自由市场生产出使消费者剩余和生产者剩余的总和最大化的物品量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关于市场结果的三个观点</strong>：（1）自由市场把物品的供给分配给对这些物品评价最高的买者（用支付意愿衡量）；（2）自由市场将物品的需求分配给能够以最低成本生产这些物品的卖者；（3）自由市场生产出使消费者剩余和生产者剩余的总和最大化的物品量。"},{"t":"均衡数量的效率：低于均衡的产量（如Q1）时，边际买者的评价大于边际卖者的成本，增加产量会增加总剩余；高于均衡的产量（如Q2）时，边际买者的评价小于边际卖者的成本，减少产量会增加总剩余——因此社会计划者应选择供求曲线相交时的产量，均衡结果是资源的有效配置，计划者不能通过改变消费配置、生产配置或产量来增进总福利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">均衡数量的效率</strong>：低于均衡的产量（如Q1）时，边际买者的评价大于边际卖者的成本，增加产量会增加总剩余；高于均衡的产量（如Q2）时，边际买者的评价小于边际卖者的成本，减少产量会增加总剩余——因此社会计划者应选择供求曲线相交时的产量，均衡结果是资源的有效配置，计划者不能通过改变消费配置、生产配置或产量来增进总福利。"},{"t":"自由放任与看不见的手：仁慈的计划者可以让市场自己得出她想要的结果（laissez faire，\"让人们自由行事吧\"）；现实中难以找到无所不知、无所不能且仁慈的独裁者——计划者若靠自己选择有效配置，需掌握经济中成千上万个市场上每个买者的评价与每个卖者的成本，任务实际上不可能完成，这解释了中央计划经济为何不能良好运行；而看不见的手利用所有信息，引导每个人达到按经济效率标准判断的最好结果，这正是经济学家通常宣称自由市场是组织经济活动的最好方法的原因（呼应火鸡的\"正确价格\"：使供求平衡的价格使消费者与生产者的总福利最大化）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自由放任与看不见的手</strong>：仁慈的计划者可以让市场自己得出她想要的结果（laissez faire，&quot;让人们自由行事吧&quot;）；现实中难以找到无所不知、无所不能且仁慈的独裁者——计划者若靠自己选择有效配置，需掌握经济中成千上万个市场上每个买者的评价与每个卖者的成本，任务实际上不可能完成，这解释了中央计划经济为何不能良好运行；而看不见的手利用所有信息，引导每个人达到按经济效率标准判断的最好结果，这正是经济学家通常宣称自由市场是组织经济活动的最好方法的原因（呼应火鸡的&quot;正确价格&quot;：使供求平衡的价格使消费者与生产者的总福利最大化）。"},{"t":"案例研究「人体器官市场是否应该存在」：母亲以捐肾给陌生人换儿子优先换肾的个案引出问题——社会将出售自己器官认定为非法，本质上是在人体器官市场实行零价格上限；与任何限制性价格上限一样，结果是短缺（病人换肾常要等好几年，每年成千上万人因等不到匹配肾源死去）。许多经济学家认为允许器官自由交易可产生巨大利益：人生来有两个肾通常只需一个，价格会使供求平衡、短缺消失，买卖双方状况都变好——资源的有效配置。批评者担心公平（器官会配置给最愿意购买并买得起的人，以损害穷人为代价使富人受益），但现行制度的公平同样值得质疑：多数人带着并不真正需要的多余器官生活，而一些同胞因得不到器官生命垂危。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「人体器官市场是否应该存在」</strong>：母亲以捐肾给陌生人换儿子优先换肾的个案引出问题——社会将出售自己器官认定为非法，本质上是在人体器官市场实行零价格上限；与任何限制性价格上限一样，结果是短缺（病人换肾常要等好几年，每年成千上万人因等不到匹配肾源死去）。许多经济学家认为允许器官自由交易可产生巨大利益：人生来有两个肾通常只需一个，价格会使供求平衡、短缺消失，买卖双方状况都变好——资源的有效配置。批评者担心公平（器官会配置给最愿意购买并买得起的人，以损害穷人为代价使富人受益），但现行制度的公平同样值得质疑：多数人带着并不真正需要的多余器官生活，而一些同胞因得不到器官生命垂危。"},{"t":"新闻摘录「看不见的手可以给你停车位」：旧金山用停车感应器与供求规律动态调价（每两个月可上调25美分或下调50美分，拥堵地段升至每小时4.5美元甚至6美元，空闲地段降价），目标是确保每个有计时器的街区至少总能找到一个空车位；提价后Drumm 大街正午占位率从98%降到86%，找车位更容易。该实验检验了UCLA 教授Donald Shoup《免费停车成本高昂》的思路——\"正确的价格\"是在每个街区可保有一两个空位的情况下城市可收取的最低价格。批评者担心涨价使穷人难以进入好地段，但停车费收入全部用于公共交通，且多数穷人并无汽车、反而从更快捷的公交中受益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新闻摘录「看不见的手可以给你停车位」</strong>：旧金山用停车感应器与供求规律动态调价（每两个月可上调25美分或下调50美分，拥堵地段升至每小时4.5美元甚至6美元，空闲地段降价），目标是确保每个有计时器的街区至少总能找到一个空车位；提价后Drumm 大街正午占位率从98%降到86%，找车位更容易。该实验检验了UCLA 教授Donald Shoup《免费停车成本高昂》的思路——&quot;正确的价格&quot;是在每个街区可保有一两个空位的情况下城市可收取的最低价格。批评者担心涨价使穷人难以进入好地段，但停车费收入全部用于公共交通，且多数穷人并无汽车、反而从更快捷的公交中受益。"},{"t":"即问即答要点：均衡状态下消费者剩余与生产者剩余如图所示；生产更多的火鸡会使总剩余减少，因为超过均衡数量后边际买者的支付意愿低于边际卖者的成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：均衡状态下消费者剩余与生产者剩余如图所示；生产更多的火鸡会使总剩余减少，因为超过均衡数量后边际买者的支付意愿低于边际卖者的成本。"}],"k":"b","i":1,"h":"7.3.2 市场均衡的评价"}],"k":"sec","i":0,"h":"7.3 市场效率"},{"t":"7.4 结论：市场效率与市场失灵","c":[{"t":"福利经济学的基本工具（消费者剩余与生产者剩余）表明：供求的力量可以有效地配置资源——即使市场每个买者与卖者只关心自己的福利，也会在看不见的手的指引下，达到使买者与卖者总利益最大化的均衡。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">福利经济学的基本工具</strong>（消费者剩余与生产者剩余）表明：供求的力量可以有效地配置资源——即使市场每个买者与卖者只关心自己的福利，也会在看不见的手的指引下，达到使买者与卖者总利益最大化的均衡。"},{"t":"市场有效率的结论依赖关于市场如何运行的假设，两个最重要的假设是：","c":[{"t":"市场是完全竞争的——现实中某个单个买者或卖者（或一小群）可能控制市场价格，这种影响价格的能力被称为市场势力；市场势力可使市场无效率，因为它使价格和数量背离供求均衡。","c":[],"k":"b","i":2,"h":"市场是完全竞争的——现实中某个单个买者或卖者（或一小群）可能控制市场价格，这种影响价格的能力被称为市场势力；市场势力可使市场无效率，因为它使价格和数量背离供求均衡。"},{"t":"市场结果只影响参与市场的买者和卖者——现实中买者与卖者的决策会影响不参与市场的人（如农药污染影响呼吸污染空气、饮用污染水的其他人），这种副作用被称为外部性；外部性使市场福利不仅取决于买者的评价和卖者的成本，从整个社会看市场均衡可能是无效率的。","c":[],"k":"b","i":2,"h":"市场结果只影响参与市场的买者和卖者——现实中买者与卖者的决策会影响不参与市场的人（如农药污染影响呼吸污染空气、饮用污染水的其他人），这种副作用被称为外部性；外部性使市场福利不仅取决于买者的评价和卖者的成本，从整个社会看市场均衡可能是无效率的。"}],"k":"b","i":1,"h":"市场有效率的结论依赖关于市场如何运行的假设，两个最重要的假设是："},{"t":"市场失灵（market failure）：一些不受管制的市场不能有效地配置资源的现象；市场势力和外部性是其典型例子。当出现市场失灵时，公共政策有可能纠正这些问题并提高经济效率，微观经济学家花许多精力研究何时发生市场失灵及哪种政策最有效。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">市场失灵</strong>（market failure）：一些不受管制的市场不能有效地配置资源的现象；市场势力和外部性是其典型例子。当出现市场失灵时，公共政策有可能纠正这些问题并提高经济效率，微观经济学家花许多精力研究何时发生市场失灵及哪种政策最有效。"},{"t":"尽管存在市场失灵的可能，市场中看不见的手仍然极其重要：本章的假设在许多市场中成立，市场有效率的结论直接适用；福利经济学工具还将在接下来两章用于研究税收和国际贸易的福利效应。","c":[],"k":"b","i":1,"h":"尽管存在市场失灵的可能，市场中看不见的手仍然极其重要：本章的假设在许多市场中成立，市场有效率的结论直接适用；福利经济学工具还将在接下来两章用于研究税收和国际贸易的福利效应。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">7.4 结论</strong>：市场效率与市场失灵"}],"k":"chap","h":"第7章 消费者、生产者与市场效率"},{"t":"第8章 应用：税收的代价","c":[{"t":"本章内容提要","c":[{"t":"无谓损失（deadweight loss）：当税收（或某种其他政策）扭曲了市场结果时所引起的总剩余减少。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">无谓损失</strong>（deadweight loss）：当税收（或某种其他政策）扭曲了市场结果时所引起的总剩余减少。"},{"t":"一种物品的税收使该物品买者与卖者的福利减少，而且消费者剩余和生产者剩余的减少常常超过政府筹集到的收入；总剩余（消费者剩余＋生产者剩余＋税收收入）的减少就是税收的无谓损失。","c":[],"k":"b","i":1,"h":"一种物品的税收使该物品买者与卖者的福利减少，而且消费者剩余和生产者剩余的减少常常超过政府筹集到的收入；总剩余（消费者剩余＋生产者剩余＋税收收入）的减少就是税收的无谓损失。"},{"t":"税收带来无谓损失，是因为它使买者少消费、卖者少生产，行为变动使市场规模缩小到使总剩余最大化的水平之下；供给弹性和需求弹性越大（市场参与者对价格变动的反应越大），无谓损失越大。","c":[],"k":"b","i":1,"h":"税收带来无谓损失，是因为它使买者少消费、卖者少生产，行为变动使市场规模缩小到使总剩余最大化的水平之下；供给弹性和需求弹性越大（市场参与者对价格变动的反应越大），无谓损失越大。"},{"t":"税收增加越多，它对激励的扭曲越大，无谓损失也就越大（无谓损失的增加快于税收规模的扩大）；但税收收入不会一直增加——它起初随税收规模扩大而增加，税收规模足够大后开始下降（拉弗曲线）。","c":[],"k":"b","i":1,"h":"税收增加越多，它对激励的扭曲越大，无谓损失也就越大（无谓损失的增加快于税收规模的扩大）；但税收收入不会一直增加——它起初随税收规模扩大而增加，税收规模足够大后开始下降（拉弗曲线）。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"8.1 税收的无谓损失","c":[{"t":"8.1.1 税收如何影响市场参与者","c":[{"t":"回顾第6章结论：一种物品的税无论向买者征收还是向卖者征收，结果都相同——向买者征税时需求曲线向下移动、向卖者征税时供给曲线向上移动，移动量均为税收规模；征税后买者支付的价格上升、卖者得到的价格下降，供求弹性决定税收负担在生产者与消费者之间的分配。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">回顾第6章结论</strong>：一种物品的税无论向买者征收还是向卖者征收，结果都相同——向买者征税时需求曲线向下移动、向卖者征税时供给曲线向上移动，移动量均为税收规模；征税后买者支付的价格上升、卖者得到的价格下降，供求弹性决定税收负担在生产者与消费者之间的分配。"},{"t":"税收楔子：税收在买者支付的价格和卖者得到的价格之间打入的一个楔子；由于这个楔子，销售量低于没有税收时的水平——对一种物品征税使这种物品的市场规模缩小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">税收楔子</strong>：税收在买者支付的价格和卖者得到的价格之间打入的一个楔子；由于这个楔子，销售量低于没有税收时的水平——对一种物品征税使这种物品的市场规模缩小。"},{"t":"用福利经济学工具衡量税收的得与失，需考虑三类市场参与者：","c":[{"t":"买者的利益用消费者剩余衡量（买者愿意支付的量减去他们实际支付的量）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">买者的利益用消费者剩余衡量</strong>（买者愿意支付的量减去他们实际支付的量）。"},{"t":"卖者的利益用生产者剩余衡量（卖者从某种物品得到的量减去其成本）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">卖者的利益用生产者剩余衡量</strong>（卖者从某种物品得到的量减去其成本）。"},{"t":"政府的利益用税收收入衡量：政府得到的总税收收入＝T×Q（T为税收规模，Q为物品销售量），图形上等于供给曲线和需求曲线之间矩形（高为T、宽为Q）的面积；这笔收入最终归得到它的人（用于道路、警察、公共教育或帮助需要帮助的人），并不归政府本身所有。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">政府的利益用税收收入衡量</strong>：政府得到的总税收收入＝T×Q（T为税收规模，Q为物品销售量），图形上等于供给曲线和需求曲线之间矩形（高为T、宽为Q）的面积；这笔收入最终归得到它的人（用于道路、警察、公共教育或帮助需要帮助的人），并不归政府本身所有。"}],"k":"b","i":2,"h":"用福利经济学工具衡量税收的得与失，需考虑三类市场参与者："},{"t":"没有税收时的福利：在供给曲线与需求曲线相交处找出均衡价格P1和销售量Q1；消费者剩余＝面积A+B+C（需求曲线与价格之间），生产者剩余＝面积D+E+F（供给曲线与价格之间），税收收入为零，总剩余＝A+B+C+D+E+F（即供求曲线到均衡数量之间的面积）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">没有税收时的福利</strong>：在供给曲线与需求曲线相交处找出均衡价格P1和销售量Q1；消费者剩余＝面积A+B+C（需求曲线与价格之间），生产者剩余＝面积D+E+F（供给曲线与价格之间），税收收入为零，总剩余＝A+B+C+D+E+F（即供求曲线到均衡数量之间的面积）。"},{"t":"有税收时的福利：买者支付的价格从P1上升到PB，消费者剩余只剩面积A；卖者得到的价格从P1下降到PS，生产者剩余只剩面积F；销售量从Q1减少为Q2，政府税收收入＝面积B+D；总剩余＝A+B+D+F。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有税收时的福利</strong>：买者支付的价格从P1上升到PB，消费者剩余只剩面积A；卖者得到的价格从P1下降到PS，生产者剩余只剩面积F；销售量从Q1减少为Q2，政府税收收入＝面积B+D；总剩余＝A+B+D+F。"},{"t":"福利的变动：税收使消费者剩余减少B+C、生产者剩余减少D+E、税收收入增加B+D；三者相加，市场总剩余净减少面积C+E——买者和卖者因税收遭受的损失大于政府筹集到的收入，这块净损失即无谓损失（面积C+E）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">福利的变动</strong>：税收使消费者剩余减少B+C、生产者剩余减少D+E、税收收入增加B+D；三者相加，市场总剩余净减少面积C+E——买者和卖者因税收遭受的损失大于政府筹集到的收入，这块净损失即无谓损失（面积C+E）。"},{"t":"无谓损失的机理（呼应经济学十大原理\"人们会对激励做出反应\"）：供求均衡本可使买者和卖者的总剩余最大化；税收提高买者价格、降低卖者价格，激励买者少消费、卖者少生产，市场规模缩小到最优水平之下（Q1移到Q2），税收扭曲激励，引起市场配置资源的无效率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">无谓损失的机理</strong>（呼应经济学十大原理&quot;人们会对激励做出反应&quot;）：供求均衡本可使买者和卖者的总剩余最大化；税收提高买者价格、降低卖者价格，激励买者少消费、卖者少生产，市场规模缩小到最优水平之下（Q1移到Q2），税收扭曲激励，引起市场配置资源的无效率。"}],"k":"b","i":1,"h":"8.1.1 税收如何影响市场参与者"},{"t":"8.1.2 无谓损失与贸易的好处","c":[{"t":"书中示例「Mike 与Mei 的打扫房间交易」：Mike 每周为Mei 打扫房间得100美元，Mike 的时间机会成本80美元、Mei 对打扫的评价120美元，两人各得20美元好处，总剩余40美元；政府对该服务征50美元的税后，不存在一种价格能让两人纳税后状况都变好（Mei 最多付120美元，Mike 纳税后只剩70美元，低于其80美元成本；Mike 要保住成本得收80美元，Mei 就得付130美元，高于其评价120美元），交易被取消——政府一分钱税收也没得到，两人共损失40美元剩余，这40美元是纯粹的无谓损失。","c":[],"k":"b","i":2,"h":"书中示例「Mike 与Mei 的打扫房间交易」：Mike 每周为Mei 打扫房间得100美元，Mike 的时间机会成本80美元、Mei 对打扫的评价120美元，两人各得20美元好处，总剩余40美元；政府对该服务征50美元的税后，不存在一种价格能让两人纳税后状况都变好（Mei 最多付120美元，Mike 纳税后只剩70美元，低于其80美元成本；Mike 要保住成本得收80美元，Mei 就得付130美元，高于其评价120美元），交易被取消——政府一分钱税收也没得到，两人共损失40美元剩余，这40美元是纯粹的无谓损失。"},{"t":"无谓损失的最终来源：税收引起无谓损失，是因为它使买者和卖者不能实现某些贸易的好处。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">无谓损失的最终来源</strong>：税收引起无谓损失，是因为它使买者和卖者不能实现某些贸易的好处。"},{"t":"图形结论：无谓损失＝供给曲线和需求曲线之间（均衡数量以内）三角形的面积（图8-3中的面积C+E）；当税收把买者价格推到PB、卖者价格压到PS时，边际买者和边际卖者离开市场，销售量从Q1减到Q2——但在Q1与Q2之间的每一数量上，买者对物品的评价仍大于卖者的成本，只是这些贸易好处（评价与成本之差）小于税收，一旦征税这些互利贸易就无法进行；无谓损失就是被税收阻止的互利贸易的剩余损失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图形结论</strong>：无谓损失＝供给曲线和需求曲线之间（均衡数量以内）三角形的面积（图8-3中的面积C+E）；当税收把买者价格推到PB、卖者价格压到PS时，边际买者和边际卖者离开市场，销售量从Q1减到Q2——但在Q1与Q2之间的每一数量上，买者对物品的评价仍大于卖者的成本，只是这些贸易好处（评价与成本之差）小于税收，一旦征税这些互利贸易就无法进行；无谓损失就是被税收阻止的互利贸易的剩余损失。"},{"t":"即问即答要点：对甜点征税，供求图中买者价格上升、卖者价格下降、销售量减少；供给与需求曲线之间的三角形即无谓损失——税收扭曲市场结果所引起的总剩余减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：对甜点征税，供求图中买者价格上升、卖者价格下降、销售量减少；供给与需求曲线之间的三角形即无谓损失——税收扭曲市场结果所引起的总剩余减少。"}],"k":"b","i":1,"h":"8.1.2 无谓损失与贸易的好处"}],"k":"sec","i":0,"h":"8.1 税收的无谓损失"},{"t":"8.2 决定无谓损失的因素","c":[{"t":"决定税收无谓损失大小的因素是供给和需求的价格弹性（价格弹性衡量供给量和需求量对价格变动的反应）。","c":[],"k":"b","i":1,"h":"决定税收无谓损失大小的因素是供给和需求的价格弹性（价格弹性衡量供给量和需求量对价格变动的反应）。"},{"t":"供给弹性的影响（需求曲线与税收规模不变）：供给缺乏弹性时无谓损失小，供给富有弹性时无谓损失大——无谓损失三角形在供给曲线比较富有弹性时较大。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">供给弹性的影响</strong>（需求曲线与税收规模不变）：供给缺乏弹性时无谓损失小，供给富有弹性时无谓损失大——无谓损失三角形在供给曲线比较富有弹性时较大。"},{"t":"需求弹性的影响（供给曲线与税收规模不变）：需求缺乏弹性时无谓损失小，需求富有弹性时无谓损失大。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">需求弹性的影响</strong>（供给曲线与税收规模不变）：需求缺乏弹性时无谓损失小，需求富有弹性时无谓损失大。"},{"t":"结论与原因：税收造成无谓损失，是因为它使买者和卖者改变行为——买者因价格上升而减少消费、卖者因价格下降而减少生产，市场规模缩小到最优水平之下；买者和卖者对价格变动的反应程度越大，均衡数量缩小得越多，因此供给和需求的弹性越大，税收的无谓损失就越大。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">结论与原因</strong>：税收造成无谓损失，是因为它使买者和卖者改变行为——买者因价格上升而减少消费、卖者因价格下降而减少生产，市场规模缩小到最优水平之下；买者和卖者对价格变动的反应程度越大，均衡数量缩小得越多，因此供给和需求的弹性越大，税收的无谓损失就越大。"},{"t":"案例研究「关于无谓损失的争论」要点：税收无谓损失的大小触及\"政府规模应该多大\"的政治问题——无谓损失越大，政府实施一项计划的成本越高，越支持低税小政府；无谓损失越小，政府计划的成本越小。","c":[{"t":"以美国最重要的税收——劳动税（社会保障税、医疗保险税及很大程度上联邦所得税、许多州劳动收入税）为例：劳动税是打入企业支付的工资和工人得到的工资之间的一个楔子，普通工人各种劳动税合计的边际税率（marginal tax rate，对最后1美元收入征收的税收）约为40%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">以美国最重要的税收——劳动税</strong>（社会保障税、医疗保险税及很大程度上联邦所得税、许多州劳动收入税）为例：劳动税是打入企业支付的工资和工人得到的工资之间的一个楔子，普通工人各种劳动税合计的边际税率（marginal tax rate，对最后1美元收入征收的税收）约为40%。"},{"t":"经济学家对40%劳动税的无谓损失是大是小看法不一致，根源在于对劳动供给弹性的看法不同。","c":[],"k":"b","i":2,"h":"经济学家对40%劳动税的无谓损失是大是小看法不一致，根源在于对劳动供给弹性的看法不同。"},{"t":"认为劳动税没有严重扭曲的一方：劳动供给相当缺乏弹性——无论工资如何，大多数人都会从事全职工作，劳动供给曲线几乎垂直，无谓损失很小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">认为劳动税没有严重扭曲的一方</strong>：劳动供给相当缺乏弹性——无论工资如何，大多数人都会从事全职工作，劳动供给曲线几乎垂直，无谓损失很小。"},{"t":"认为劳动税严重扭曲的一方：劳动供给较为富有弹性——许多工人可调整工作时间（加班）；一些家庭的第二个赚钱人（有孩子的已婚女性）在家务劳动与市场工作间权衡；许多老年人的退休时点与兼职决策取决于工资；一些人权衡合法工作与地下经济（underground economy，非法经济活动或可逃税的暗中支付工资的工作）——劳动税鼓励工人减少工时、第二个赚钱人留在家里、老年人早退休、一些人进入地下经济。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">认为劳动税严重扭曲的一方</strong>：劳动供给较为富有弹性——许多工人可调整工作时间（加班）；一些家庭的第二个赚钱人（有孩子的已婚女性）在家务劳动与市场工作间权衡；许多老年人的退休时点与兼职决策取决于工资；一些人权衡合法工作与地下经济（underground economy，非法经济活动或可逃税的暗中支付工资的工作）——劳动税鼓励工人减少工时、第二个赚钱人留在家里、老年人早退休、一些人进入地下经济。"},{"t":"两党在\"更多服务还是降低税负\"上的争论，部分源于双方在劳动供给弹性和税收无谓损失上的不同观点。","c":[],"k":"b","i":2,"h":"两党在&quot;更多服务还是降低税负&quot;上的争论，部分源于双方在劳动供给弹性和税收无谓损失上的不同观点。"}],"k":"b","i":1,"h":"<strong class=\"lead\">案例研究「关于无谓损失的争论」要点</strong>：税收无谓损失的大小触及&quot;政府规模应该多大&quot;的政治问题——无谓损失越大，政府实施一项计划的成本越高，越支持低税小政府；无谓损失越小，政府计划的成本越小。"},{"t":"即问即答要点：啤酒的需求比牛奶更富有弹性，故啤酒税的无谓损失更大——需求弹性越大，征税引起的数量缩减越多，无谓损失三角形越大。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：啤酒的需求比牛奶更富有弹性，故啤酒税的无谓损失更大——需求弹性越大，征税引起的数量缩减越多，无谓损失三角形越大。"}],"k":"sec","i":0,"h":"8.2 决定无谓损失的因素"},{"t":"8.3 税收变动时的无谓损失和税收收入","c":[{"t":"在市场供给曲线和需求曲线保持不变时，比较小额税、中额税、大额税的影响。","c":[],"k":"b","i":1,"h":"在市场供给曲线和需求曲线保持不变时，比较小额税、中额税、大额税的影响。"},{"t":"无谓损失随税收规模的变化：小额税的无谓损失（三角形面积）相当小，随税收规模增大变得越来越大；且无谓损失的增加快于税收规模的扩大——三角形面积取决于底和高的乘积，税收翻一番，底和高各翻一番，无谓损失增加为原来的4倍；税收增为3倍，无谓损失增为9倍。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">无谓损失随税收规模的变化</strong>：小额税的无谓损失（三角形面积）相当小，随税收规模增大变得越来越大；且无谓损失的增加快于税收规模的扩大——三角形面积取决于底和高的乘积，税收翻一番，底和高各翻一番，无谓损失增加为原来的4倍；税收增为3倍，无谓损失增为9倍。"},{"t":"税收收入随税收规模的变化：税收收入＝税收规模×销售量（供求曲线之间矩形面积）；小额税收入很少，税额增大收入先增加；税额进一步增大时市场大幅收缩，收入反而减少；税收极高时人们完全停止买卖物品，收入缩减为零。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">税收收入随税收规模的变化</strong>：税收收入＝税收规模×销售量（供求曲线之间矩形面积）；小额税收入很少，税额增大收入先增加；税额进一步增大时市场大幅收缩，收入反而减少；税收极高时人们完全停止买卖物品，收入缩减为零。"},{"t":"拉弗曲线（Laffer curve）：税收收入随税收规模先增加后减少的关系。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">拉弗曲线</strong>（Laffer curve）：税收收入随税收规模先增加后减少的关系。"},{"t":"案例研究「拉弗曲线和供给学派经济学」要点：","c":[{"t":"1974年经济学家阿瑟·拉弗（Arthur Laffer）在华盛顿一家餐馆的餐巾上画出税率与税收收入的关系图（即拉弗曲线），并主张美国已处于曲线向下倾斜的一边——税率之高使降低税率反而会增加税收收入；大多数经济学家对此表示怀疑：理论上减税增收可能正确，但没有证据表明美国税率实际达到了这种极端水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">1974年经济学家阿瑟·拉弗</strong>（Arthur Laffer）在华盛顿一家餐馆的餐巾上画出税率与税收收入的关系图（即拉弗曲线），并主张美国已处于曲线向下倾斜的一边——税率之高使降低税率反而会增加税收收入；大多数经济学家对此表示怀疑：理论上减税增收可能正确，但没有证据表明美国税率实际达到了这种极端水平。"},{"t":"里根的第一任预算局局长David Stockman 转述里根的经历：二战期间战时附加所得税高达90%，拍满四部电影就达到最高税率档，\"我们都拍完四部电影就停止工作去乡下度假\"——高税率使人更少工作、低税率使人更多工作。","c":[],"k":"b","i":2,"h":"里根的第一任预算局局长David Stockman 转述里根的经历：二战期间战时附加所得税高达90%，拍满四部电影就达到最高税率档，&quot;我们都拍完四部电影就停止工作去乡下度假&quot;——高税率使人更少工作、低税率使人更多工作。"},{"t":"里根1980年以减税为施政纲领：税收太高不鼓励人们努力工作，减税将给人们适当的工作激励、提高经济福利、甚至可能增加税收收入；由于主张降低税率以鼓励人们增加劳动供给，拉弗和里根的观点被称为供给学派经济学（supply-side economics）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">里根1980年以减税为施政纲领</strong>：税收太高不鼓励人们努力工作，减税将给人们适当的工作激励、提高经济福利、甚至可能增加税收收入；由于主张降低税率以鼓励人们增加劳动供给，拉弗和里根的观点被称为供给学派经济学（supply-side economics）。"},{"t":"经济学家至今争论：许多认为后来的历史否定了拉弗\"低税率增加税收收入\"的猜想，另一些认为20世纪80年代的事件支持供给学派；准确评价需要\"重演没有减税的历史\"，而这不可能做到。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学家至今争论</strong>：许多认为后来的历史否定了拉弗&quot;低税率增加税收收入&quot;的猜想，另一些认为20世纪80年代的事件支持供给学派；准确评价需要&quot;重演没有减税的历史&quot;，而这不可能做到。"},{"t":"中间立场：税率全面降低通常会减少税收收入，但一些纳税人（如面临最高税率者）可能处于拉弗曲线不利的一边，对他们减税可能增加收入；对税率高得多的国家（如20世纪80年代初瑞典一般工人边际税率约80%）拉弗的观点更有说服力——研究表明瑞典降税确实可增加税收收入。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">中间立场</strong>：税率全面降低通常会减少税收收入，但一些纳税人（如面临最高税率者）可能处于拉弗曲线不利的一边，对他们减税可能增加收入；对税率高得多的国家（如20世纪80年代初瑞典一般工人边际税率约80%）拉弗的观点更有说服力——研究表明瑞典降税确实可增加税收收入。"},{"t":"无争议的一般性结论：仅仅盯住税率并不能计算出税收变动会使政府收入增加或减少多少，后者还取决于税收变动如何影响人们的行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">无争议的一般性结论</strong>：仅仅盯住税率并不能计算出税收变动会使政府收入增加或减少多少，后者还取决于税收变动如何影响人们的行为。"}],"k":"b","i":1,"h":"<strong class=\"lead\">案例研究「拉弗曲线和供给学派经济学」要点</strong>："},{"t":"即问即答要点：汽油税翻番时，不能肯定税收收入增加（若市场收缩足够大，收入可能减少——拉弗曲线向下的一段）；但可以肯定无谓损失增加（税率越高，扭曲越大，无谓损失三角形越大）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：汽油税翻番时，不能肯定税收收入增加（若市场收缩足够大，收入可能减少——拉弗曲线向下的一段）；但可以肯定无谓损失增加（税率越高，扭曲越大，无谓损失三角形越大）。"}],"k":"sec","i":0,"h":"8.3 税收变动时的无谓损失和税收收入"},{"t":"8.4 结论","c":[{"t":"本章用消费者剩余和生产者剩余工具说明：当政府对一种物品的买者或卖者征税时，社会就损失了某些市场效率的好处——税收给市场参与者带来损失，不仅因为税收将资源从市场参与者手中转到政府手中，还因为税收改变了激励并扭曲了市场结果。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章用消费者剩余和生产者剩余工具说明</strong>：当政府对一种物品的买者或卖者征税时，社会就损失了某些市场效率的好处——税收给市场参与者带来损失，不仅因为税收将资源从市场参与者手中转到政府手中，还因为税收改变了激励并扭曲了市场结果。"},{"t":"本章与第6章的分析是理解税收经济影响的基础但并非终点：微观经济学家研究如何最好地设计税制（平等与效率的适当平衡），宏观经济学家研究税收如何影响整个经济及如何运用税制稳定经济活动、实现更快增长；税收主题将在后续学习中再次出现。","c":[],"k":"b","i":1,"h":"本章与第6章的分析是理解税收经济影响的基础但并非终点：微观经济学家研究如何最好地设计税制（平等与效率的适当平衡），宏观经济学家研究税收如何影响整个经济及如何运用税制稳定经济活动、实现更快增长；税收主题将在后续学习中再次出现。"}],"k":"sec","i":0,"h":"8.4 结论"}],"k":"chap","h":"<strong class=\"lead\">第8章 应用</strong>：税收的代价"},{"t":"第9章 应用：国际贸易","c":[{"t":"本章内容提要","c":[{"t":"世界价格（world price）：一种物品在世界市场上通行的价格。比较没有贸易时的国内价格与世界价格可确定自由贸易的影响：国内价格低，表明该国在生产这种物品上有比较优势，开放贸易后将成为出口者；国内价格高，表明世界其他国家有比较优势，该国将成为进口者。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">世界价格</strong>（world price）：一种物品在世界市场上通行的价格。比较没有贸易时的国内价格与世界价格可确定自由贸易的影响：国内价格低，表明该国在生产这种物品上有比较优势，开放贸易后将成为出口者；国内价格高，表明世界其他国家有比较优势，该国将成为进口者。"},{"t":"当一国允许贸易并成为出口者时，国内生产者状况变好、消费者状况变坏；成为进口者时，国内消费者状况变好、生产者状况变坏。两种情况下赢家的收益都大于输家的损失，贸易使一国的经济福利增加。","c":[],"k":"b","i":1,"h":"当一国允许贸易并成为出口者时，国内生产者状况变好、消费者状况变坏；成为进口者时，国内消费者状况变好、生产者状况变坏。两种情况下赢家的收益都大于输家的损失，贸易使一国的经济福利增加。"},{"t":"关税（tariff）：对在国外生产而在国内销售的物品征收的一种税。关税使市场向没有贸易时的均衡移动，减少了贸易的好处：国内生产者受益、政府筹集到收入，但消费者的损失大于这些好处，并引起无谓损失（过度生产与消费不足两个三角形之和）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">关税</strong>（tariff）：对在国外生产而在国内销售的物品征收的一种税。关税使市场向没有贸易时的均衡移动，减少了贸易的好处：国内生产者受益、政府筹集到收入，但消费者的损失大于这些好处，并引起无谓损失（过度生产与消费不足两个三角形之和）。"},{"t":"进口配额与关税相似——都减少进口量、提高国内价格、减少消费者福利、增加生产者福利并引起无谓损失；唯一差别是关税增加政府收入，而配额为进口许可证持有者创造剩余。","c":[],"k":"b","i":1,"h":"进口配额与关税相似——都减少进口量、提高国内价格、减少消费者福利、增加生产者福利并引起无谓损失；唯一差别是关税增加政府收入，而配额为进口许可证持有者创造剩余。"},{"t":"各种限制贸易的观点：保护工作岗位、国家安全、幼稚产业、不公平竞争、作为讨价还价筹码的保护；尽管在某些情况下有些道理，但经济学家相信自由贸易通常是更好的政策。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">各种限制贸易的观点</strong>：保护工作岗位、国家安全、幼稚产业、不公平竞争、作为讨价还价筹码的保护；尽管在某些情况下有些道理，但经济学家相信自由贸易通常是更好的政策。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"9.1 决定贸易的因素","c":[{"t":"9.1.1 没有贸易时的均衡","c":[{"t":"以假想的Isoland 国纺织品市场为分析对象（许多国家生产纺织品、国际贸易量大、决策者经常考虑贸易限制）。","c":[],"k":"b","i":2,"h":"以假想的Isoland 国纺织品市场为分析对象（许多国家生产纺织品、国际贸易量大、决策者经常考虑贸易限制）。"},{"t":"没有国际贸易时（政府法令禁止进出口且惩罚严厉），国内价格自发调整，使国内卖者的供给量与国内买者的需求量达到平衡；消费者剩余与生产者剩余之和衡量买者和卖者从参与该市场中得到的总利益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">没有国际贸易时</strong>（政府法令禁止进出口且惩罚严厉），国内价格自发调整，使国内卖者的供给量与国内买者的需求量达到平衡；消费者剩余与生产者剩余之和衡量买者和卖者从参与该市场中得到的总利益。"},{"t":"新总统组织经济学家小组评估贸易政策，要求回答三个问题：允许进出口后国内纺织品价格和销售量会发生什么变动？谁从自由贸易中获益、谁受损、好处会大于损失吗？应该把关税（对纺织品进口征税）作为新贸易政策的一部分吗？","c":[],"k":"b","i":2,"h":"新总统组织经济学家小组评估贸易政策，要求回答三个问题：允许进出口后国内纺织品价格和销售量会发生什么变动？谁从自由贸易中获益、谁受损、好处会大于损失吗？应该把关税（对纺织品进口征税）作为新贸易政策的一部分吗？"}],"k":"b","i":1,"h":"9.1.1 没有贸易时的均衡"},{"t":"9.1.2 世界价格和比较优势","c":[{"t":"判断Isoland 国成为进口国还是出口国：比较贸易前的国内价格与世界价格——世界价格高于国内价格，一旦允许贸易Isoland 国就成为出口国（国内生产者渴望国外高价格）；世界价格低于国内价格，就成为进口国（外国卖者提供更好的价格，国内消费者转向购买外国产品）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">判断Isoland 国成为进口国还是出口国</strong>：比较贸易前的国内价格与世界价格——世界价格高于国内价格，一旦允许贸易Isoland 国就成为出口国（国内生产者渴望国外高价格）；世界价格低于国内价格，就成为进口国（外国卖者提供更好的价格，国内消费者转向购买外国产品）。"},{"t":"国内价格反映纺织品的机会成本：国内价格低＝生产成本低＝Isoland 国在生产纺织品上有比较优势；国内价格高＝生产成本高＝外国有比较优势。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">国内价格反映纺织品的机会成本</strong>：国内价格低＝生产成本低＝Isoland 国在生产纺织品上有比较优势；国内价格高＝生产成本高＝外国有比较优势。"},{"t":"各国之间的贸易最终建立在比较优势的基础上（第3章）：贸易互惠，因为它使各国可以专门从事自己最擅长的活动；比较贸易前的世界价格与国内价格，可确定该国比世界其他国家更擅长还是更不擅长生产该物品。","c":[],"k":"b","i":2,"h":"各国之间的贸易最终建立在比较优势的基础上（第3章）：贸易互惠，因为它使各国可以专门从事自己最擅长的活动；比较贸易前的世界价格与国内价格，可确定该国比世界其他国家更擅长还是更不擅长生产该物品。"},{"t":"即问即答要点：Autarka 国羊毛套装国内价格3盎司黄金、邻国2盎司黄金——国内价格高于世界价格，开放自由贸易后Autarka 国将进口羊毛套装（外国生产上有比较优势）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：Autarka 国羊毛套装国内价格3盎司黄金、邻国2盎司黄金——国内价格高于世界价格，开放自由贸易后Autarka 国将进口羊毛套装（外国生产上有比较优势）。"}],"k":"b","i":1,"h":"9.1.2 世界价格和比较优势"}],"k":"sec","i":0,"h":"9.1 决定贸易的因素"},{"t":"9.2 贸易的赢家和输家","c":[{"t":"小型经济假设：假设Isoland 国相对世界经济是小型的，其行为对世界市场的影响微不足道——贸易政策的任何变化都不影响纺织品的世界价格，Isoland 人是世界经济中的价格接受者（把世界价格当作既定的，可按此价格任意买或卖）。该假设并非分析必需，但大大简化分析，且在大型经济情况下基本结论不变。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">小型经济假设</strong>：假设Isoland 国相对世界经济是小型的，其行为对世界市场的影响微不足道——贸易政策的任何变化都不影响纺织品的世界价格，Isoland 人是世界经济中的价格接受者（把世界价格当作既定的，可按此价格任意买或卖）。该假设并非分析必需，但大大简化分析，且在大型经济情况下基本结论不变。"},{"t":"9.2.1 出口国的得失","c":[{"t":"情形：贸易前国内均衡价格低于世界价格；允许自由贸易后，国内价格上升到等于世界价格（没有卖者接受更低、没有买者支付更高的价格）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情形</strong>：贸易前国内均衡价格低于世界价格；允许自由贸易后，国内价格上升到等于世界价格（没有卖者接受更低、没有买者支付更高的价格）。"},{"t":"数量结构：国内供给量大于国内需求量，差额即出口；世界价格处的水平线可视为世界其他国家的（完全富有弹性的）需求曲线——小型经济可按世界价格卖出想卖的任何数量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数量结构</strong>：国内供给量大于国内需求量，差额即出口；世界价格处的水平线可视为世界其他国家的（完全富有弹性的）需求曲线——小型经济可按世界价格卖出想卖的任何数量。"},{"t":"福利变动：贸易前消费者剩余＝A+B、生产者剩余＝C、总剩余＝A+B+C；贸易后消费者剩余减为A，生产者剩余增为B+C+D，总剩余＝A+B+C+D。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">福利变动</strong>：贸易前消费者剩余＝A+B、生产者剩余＝C、总剩余＝A+B+C；贸易后消费者剩余减为A，生产者剩余增为B+C+D，总剩余＝A+B+C+D。"},{"t":"结论（出口国两条）：当一国允许贸易并成为一种物品的出口者时，国内该物品生产者的状况变好、消费者的状况变坏；从赢家收益超过输家损失的意义上说，贸易使一国的经济福利增加了（净增面积D）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>（出口国两条）：当一国允许贸易并成为一种物品的出口者时，国内该物品生产者的状况变好、消费者的状况变坏；从赢家收益超过输家损失的意义上说，贸易使一国的经济福利增加了（净增面积D）。"}],"k":"b","i":1,"h":"9.2.1 出口国的得失"},{"t":"9.2.2 进口国的得失","c":[{"t":"情形：贸易前国内价格高于世界价格；允许贸易后国内价格下降到等于世界价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情形</strong>：贸易前国内价格高于世界价格；允许贸易后国内价格下降到等于世界价格。"},{"t":"数量结构：国内需求量大于国内供给量，差额靠向其他国家购买填补（进口）；世界价格处的水平线代表世界其他国家的（完全富有弹性的）供给曲线——小型经济可按世界价格买到想买的任何数量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数量结构</strong>：国内需求量大于国内供给量，差额靠向其他国家购买填补（进口）；世界价格处的水平线代表世界其他国家的（完全富有弹性的）供给曲线——小型经济可按世界价格买到想买的任何数量。"},{"t":"福利变动：贸易前消费者剩余＝A、生产者剩余＝B+C、总剩余＝A+B+C；贸易后消费者剩余增为A+B+D，生产者剩余减为C，总剩余＝A+B+C+D。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">福利变动</strong>：贸易前消费者剩余＝A、生产者剩余＝B+C、总剩余＝A+B+C；贸易后消费者剩余增为A+B+D，生产者剩余减为C，总剩余＝A+B+C+D。"},{"t":"结论（进口国两条）：当一国允许贸易并成为一种物品的进口者时，国内该物品消费者的状况变好、生产者的状况变坏；从赢家收益超过输家损失的意义上说，贸易使一国的经济福利增加了（净增面积D）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>（进口国两条）：当一国允许贸易并成为一种物品的进口者时，国内该物品消费者的状况变好、生产者的状况变坏；从赢家收益超过输家损失的意义上说，贸易使一国的经济福利增加了（净增面积D）。"},{"t":"与经济学十大原理\"贸易可以使每个人的状况都变得更好\"的联系：无论出口还是进口都产生赢家和输家，但赢家的收益都大于输家的损失，赢家可以补偿输家、补偿后状况仍比以前更好——从这种意义上说贸易可以使每个人状况都更好；但现实中很少发生这种补偿，若没有补偿，开放贸易是扩大经济蛋糕规模的政策，却可能使一些经济参与者分到的蛋糕变小。","c":[],"k":"b","i":2,"h":"与经济学十大原理&quot;贸易可以使每个人的状况都变得更好&quot;的联系：无论出口还是进口都产生赢家和输家，但赢家的收益都大于输家的损失，赢家可以补偿输家、补偿后状况仍比以前更好——从这种意义上说贸易可以使每个人状况都更好；但现实中很少发生这种补偿，若没有补偿，开放贸易是扩大经济蛋糕规模的政策，却可能使一些经济参与者分到的蛋糕变小。"},{"t":"贸易政策争论激烈的原因：政策创造赢家和输家时政治斗争登场；一些国家有时享受不到贸易的好处，是因为自由贸易的输家在政治上比赢家更有组织性，输家团结起来游说实行关税或进口配额等贸易限制。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贸易政策争论激烈的原因</strong>：政策创造赢家和输家时政治斗争登场；一些国家有时享受不到贸易的好处，是因为自由贸易的输家在政治上比赢家更有组织性，输家团结起来游说实行关税或进口配额等贸易限制。"}],"k":"b","i":1,"h":"9.2.2 进口国的得失"},{"t":"9.2.3 关税的影响","c":[{"t":"关税只有在一国成为进口国时才是重要的（若成为出口国、无人进口纺织品，对进口征税无关紧要）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关税只有在一国成为进口国时才是重要的</strong>（若成为出口国、无人进口纺织品，对进口征税无关紧要）。"},{"t":"价格效应：关税使进口纺织品的价格提高到世界价格之上，增加量等于关税；与进口品竞争的国内供给者可按世界价格加关税出售，故（进口品与国内品的）国内价格上升，幅度等于关税量，市场向没有贸易时的均衡价格移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">价格效应</strong>：关税使进口纺织品的价格提高到世界价格之上，增加量等于关税；与进口品竞争的国内供给者可按世界价格加关税出售，故（进口品与国内品的）国内价格上升，幅度等于关税量，市场向没有贸易时的均衡价格移动。"},{"t":"数量效应：国内需求量减少（Q1降到Q2）、国内供给量增加（Q1升到Q2），进口量减少，国内市场向没有贸易时的均衡移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数量效应</strong>：国内需求量减少（Q1降到Q2）、国内供给量增加（Q1升到Q2），进口量减少，国内市场向没有贸易时的均衡移动。"},{"t":"福利变动（以进口国自由贸易为基准）：消费者剩余由A+B+C+D+E+F减为A+B；生产者剩余由G增为C+G；政府收入＝关税规模×进口量＝面积E；总剩余由A+B+C+D+E+F+G变为A+B+C+E+G，净减少D+F——即关税的无谓损失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">福利变动</strong>（以进口国自由贸易为基准）：消费者剩余由A+B+C+D+E+F减为A+B；生产者剩余由G增为C+G；政府收入＝关税规模×进口量＝面积E；总剩余由A+B+C+D+E+F+G变为A+B+C+E+G，净减少D+F——即关税的无谓损失。"},{"t":"无谓损失的两个来源（关税是一种税，扭曲激励、使资源配置背离最优水平）：其一，关税使国内价格高于世界价格，鼓励国内生产者增产，尽管增产部分的成本高于按世界价格购买的成本——面积D是物品过度生产的无谓损失；其二，关税提高消费者支付的价格，使消费者减少购买，尽管他们对该物品的评价高于世界价格——面积F是物品消费不足的无谓损失；总无谓损失＝两个三角形面积之和。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">无谓损失的两个来源</strong>（关税是一种税，扭曲激励、使资源配置背离最优水平）：其一，关税使国内价格高于世界价格，鼓励国内生产者增产，尽管增产部分的成本高于按世界价格购买的成本——面积D是物品过度生产的无谓损失；其二，关税提高消费者支付的价格，使消费者减少购买，尽管他们对该物品的评价高于世界价格——面积F是物品消费不足的无谓损失；总无谓损失＝两个三角形面积之和。"},{"t":"参考资料「进口配额：另一种限制贸易的方法」要点：","c":[{"t":"进口配额（import quota）：对进口某种物品的数量实行的限制。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">进口配额</strong>（import quota）：对进口某种物品的数量实行的限制。"},{"t":"配额与关税相似：都减少了进口品的数量、提高了该物品的国内价格、减少了国内消费者的福利、增加了国内生产者的福利，并引起无谓损失。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">配额与关税相似</strong>：都减少了进口品的数量、提高了该物品的国内价格、减少了国内消费者的福利、增加了国内生产者的福利，并引起无谓损失。"},{"t":"唯一差别：关税增加了政府的收入，而进口配额为那些得到进口许可证的人创造了剩余——进口许可证持有者的利润＝国内价格（出售价）与世界价格（购买价）之间的差额。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">唯一差别</strong>：关税增加了政府的收入，而进口配额为那些得到进口许可证的人创造了剩余——进口许可证持有者的利润＝国内价格（出售价）与世界价格（购买价）之间的差额。"},{"t":"若政府对进口许可证收费且费额等于国内外价差，许可证持有者的全部利润交给政府，配额的作用与关税完全相同（消费者剩余、生产者剩余、政府收入完全相等）；但现实中用配额限贸的国家很少出售进口许可证。","c":[],"k":"b","i":3,"h":"若政府对进口许可证收费且费额等于国内外价差，许可证持有者的全部利润交给政府，配额的作用与关税完全相同（消费者剩余、生产者剩余、政府收入完全相等）；但现实中用配额限贸的国家很少出售进口许可证。"},{"t":"例子：美国政府有时施压让日本\"自愿\"限制日本汽车在美销售——日本政府把进口许可证分配给日本企业，剩余归这些企业；从美国经济福利的角度看，这种配额方式比征收关税更糟：两者都提价、限贸、引起无谓损失，但关税至少给美国政府带来收入，而不是给外国生产者带来利润。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">例子</strong>：美国政府有时施压让日本&quot;自愿&quot;限制日本汽车在美销售——日本政府把进口许可证分配给日本企业，剩余归这些企业；从美国经济福利的角度看，这种配额方式比征收关税更糟：两者都提价、限贸、引起无谓损失，但关税至少给美国政府带来收入，而不是给外国生产者带来利润。"}],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「进口配额</strong>：另一种限制贸易的方法」要点："}],"k":"b","i":1,"h":"9.2.3 关税的影响"},{"t":"9.2.4 贸易政策的结论","c":[{"t":"经济学家小组给总统的三问答案（信件概括）：","c":[{"t":"问题1：一旦允许贸易，国内价格被推动到等于世界通行价格的水平——世界价格高于国内价格则价格上升、消费减少、生产增加，该国成为出口者（本国生产有比较优势）；世界价格低于国内价格则价格下降、消费增加、生产减少，该国成为进口者（其他国家生产有比较优势）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">问题1</strong>：一旦允许贸易，国内价格被推动到等于世界通行价格的水平——世界价格高于国内价格则价格上升、消费减少、生产增加，该国成为出口者（本国生产有比较优势）；世界价格低于国内价格则价格下降、消费增加、生产减少，该国成为进口者（其他国家生产有比较优势）。"},{"t":"问题2：谁受益谁受损取决于价格升还是降——价格上升则生产者受益、消费者受损；价格下降则消费者受益、生产者受损；两种情况下收益都超过损失，自由贸易增加总福利。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">问题2</strong>：谁受益谁受损取决于价格升还是降——价格上升则生产者受益、消费者受损；价格下降则消费者受益、生产者受损；两种情况下收益都超过损失，自由贸易增加总福利。"},{"t":"问题3：只有成为进口国时关税才有影响；关税使经济接近没有贸易时的均衡，与大多数税收一样产生无谓损失——虽改善国内生产者福利并增加政府收入，但不足以弥补消费者的损失；从经济效率看，最好的政策是允许无关税的贸易。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">问题3</strong>：只有成为进口国时关税才有影响；关税使经济接近没有贸易时的均衡，与大多数税收一样产生无谓损失——虽改善国内生产者福利并增加政府收入，但不足以弥补消费者的损失；从经济效率看，最好的政策是允许无关税的贸易。"}],"k":"b","i":2,"h":"<strong class=\"lead\">经济学家小组给总统的三问答案</strong>（信件概括）："}],"k":"b","i":1,"h":"9.2.4 贸易政策的结论"},{"t":"9.2.5 国际贸易的其他好处","c":[{"t":"标准分析（供给、需求、生产者剩余、消费者剩余）之外，贸易还带来其他经济好处：","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">标准分析</strong>（供给、需求、生产者剩余、消费者剩余）之外，贸易还带来其他经济好处："},{"t":"增加了物品的多样性：不同国家生产的物品不完全相同（如德国啤酒与美国啤酒），自由贸易使所有国家的消费者拥有更多选择。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">增加了物品的多样性</strong>：不同国家生产的物品不完全相同（如德国啤酒与美国啤酒），自由贸易使所有国家的消费者拥有更多选择。"},{"t":"通过规模经济降低了成本：规模经济（economies of scale）指一些物品只有在大量生产时才能以低成本生产的现象；小国企业只在国内小市场销售就无法充分利用规模经济，自由贸易使企业进入更大的世界市场、更充分地实现规模经济。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">通过规模经济降低了成本</strong>：规模经济（economies of scale）指一些物品只有在大量生产时才能以低成本生产的现象；小国企业只在国内小市场销售就无法充分利用规模经济，自由贸易使企业进入更大的世界市场、更充分地实现规模经济。"},{"t":"促进了竞争：避开外国竞争者的公司更可能拥有市场势力（一种市场失灵），把价格提高到竞争性水平之上；开放贸易促进竞争，使看不见的手有更好的施展机会。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">促进了竞争</strong>：避开外国竞争者的公司更可能拥有市场势力（一种市场失灵），把价格提高到竞争性水平之上；开放贸易促进竞争，使看不见的手有更好的施展机会。"},{"t":"加强了思想交流：技术进步在世界范围内的转移通常与含有这些技术进步的物品的国际贸易相关（如贫穷农业国了解电脑革命的最好方法是购买国外电脑，而非自己生产）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">加强了思想交流</strong>：技术进步在世界范围内的转移通常与含有这些技术进步的物品的国际贸易相关（如贫穷农业国了解电脑革命的最好方法是购买国外电脑，而非自己生产）。"},{"t":"新闻摘录「把贸易作为经济发展的工具」（《安迪·沃霍尔的公共政策指南》）要点：自由贸易能帮助世界上最穷的居民——制造物品并自由交易是历史上最佳的反贫困利器；二十多年来全球贫困率基本每年降低一个百分点，自1990年以来约十亿人摆脱贫困，靠的不是联合国或外国援助，而是贫穷国家运用自由贸易（跨境供应链的高增长溢出）；中国自20世纪80年代以来6.8亿人摆脱绝对贫困与此相关；贸易加剧收入不平等的说法不成立——世界银行与卢森堡收入研究中心证实过去二十年间全球收入不平等状况改善，主要源于发展中国家从全球化中获得收入增长；遏制贸易有利于保护根深蒂固的国内利益，但不利于帮助世界范围内的穷人。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新闻摘录「把贸易作为经济发展的工具」</strong>（《安迪·沃霍尔的公共政策指南》）要点：自由贸易能帮助世界上最穷的居民——制造物品并自由交易是历史上最佳的反贫困利器；二十多年来全球贫困率基本每年降低一个百分点，自1990年以来约十亿人摆脱贫困，靠的不是联合国或外国援助，而是贫穷国家运用自由贸易（跨境供应链的高增长溢出）；中国自20世纪80年代以来6.8亿人摆脱绝对贫困与此相关；贸易加剧收入不平等的说法不成立——世界银行与卢森堡收入研究中心证实过去二十年间全球收入不平等状况改善，主要源于发展中国家从全球化中获得收入增长；遏制贸易有利于保护根深蒂固的国内利益，但不利于帮助世界范围内的穷人。"},{"t":"即问即答要点：Autarka 国羊毛套装价格从3盎司黄金降到2盎司黄金（进口国）——消费者剩余增加、生产者剩余减少、总剩余增加；对进口羊毛套装征关税将提高国内价格、减少上述贸易好处并产生无谓损失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：Autarka 国羊毛套装价格从3盎司黄金降到2盎司黄金（进口国）——消费者剩余增加、生产者剩余减少、总剩余增加；对进口羊毛套装征关税将提高国内价格、减少上述贸易好处并产生无谓损失。"}],"k":"b","i":1,"h":"9.2.5 国际贸易的其他好处"}],"k":"sec","i":0,"h":"9.2 贸易的赢家和输家"},{"t":"9.3 各种限制贸易的观点","c":[{"t":"背景：Isoland 国国内价格高于世界价格，自由贸易将损害国内纺织品生产者；纺织品公司反对自由贸易，主张政府保护国内行业免受国外竞争。以下为各种保护观点及经济学家的回应。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">背景</strong>：Isoland 国国内价格高于世界价格，自由贸易将损害国内纺织品生产者；纺织品公司反对自由贸易，主张政府保护国内行业免受国外竞争。以下为各种保护观点及经济学家的回应。"},{"t":"9.3.1 工作岗位论","c":[{"t":"反对者观点：与其他国家贸易消灭了国内工作岗位——纺织品自由贸易使价格下降、产量减少、行业就业下降，一些工人失业。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反对者观点</strong>：与其他国家贸易消灭了国内工作岗位——纺织品自由贸易使价格下降、产量减少、行业就业下降，一些工人失业。"},{"t":"经济学家的回应：自由贸易在消灭一些工作岗位的同时也创造了其他工作岗位——Isoland 人从他国购买纺织品时，这些国家得到可购买Isoland 其他物品的资源，工人可流向本国具有比较优势的行业；短期转变虽给一些工人带来困难，但使整个国家享有更高生活水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学家的回应</strong>：自由贸易在消灭一些工作岗位的同时也创造了其他工作岗位——Isoland 人从他国购买纺织品时，这些国家得到可购买Isoland 其他物品的资源，工人可流向本国具有比较优势的行业；短期转变虽给一些工人带来困难，但使整个国家享有更高生活水平。"},{"t":"对反驳的再回应：反对者称每件东西都可以在国外更便宜地生产，故任何行业就业都不利——但贸易的好处基于比较优势而非绝对优势，即使一国在生产每一种物品上都比另一国有优势，两国仍能从贸易中获益，每个国家的工人最终会在该国有比较优势的行业找到工作岗位。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对反驳的再回应</strong>：反对者称每件东西都可以在国外更便宜地生产，故任何行业就业都不利——但贸易的好处基于比较优势而非绝对优势，即使一国在生产每一种物品上都比另一国有优势，两国仍能从贸易中获益，每个国家的工人最终会在该国有比较优势的行业找到工作岗位。"},{"t":"新闻摘录「自由贸易的赢家应该补偿输家吗」（Landsburg《当你进行自由贸易时，你期望什么》）要点：外包使美国人整体是净赢家——低价格的利益足以补偿工资降低的损失，但\"承担得起补偿\"不等于\"有义务补偿\"；类比日常道德直觉——网购更便宜的洗发水无须补偿药店老板、搬进更便宜的公寓无须补偿原房东；几十年的关税与配额使制造业工人预期受保护的理由也不成立（校园恶霸靠旧规则获利、规则改变后不应获补偿的类比）；恶霸与贸易保护主义的共同之处：都借助暴力（直接的或法律的）使某些人致富、使他人承受非自愿损失。","c":[],"k":"b","i":2,"h":"新闻摘录「自由贸易的赢家应该补偿输家吗」（Landsburg《当你进行自由贸易时，你期望什么》）要点：外包使美国人整体是净赢家——低价格的利益足以补偿工资降低的损失，但&quot;承担得起补偿&quot;不等于&quot;有义务补偿&quot;；类比日常道德直觉——网购更便宜的洗发水无须补偿药店老板、搬进更便宜的公寓无须补偿原房东；几十年的关税与配额使制造业工人预期受保护的理由也不成立（校园恶霸靠旧规则获利、规则改变后不应获补偿的类比）；恶霸与贸易保护主义的共同之处：都借助暴力（直接的或法律的）使某些人致富、使他人承受非自愿损失。"}],"k":"b","i":1,"h":"9.3.1 工作岗位论"},{"t":"9.3.2 国家安全论","c":[{"t":"反对者观点：受外国竞争威胁的行业对国家安全至关重要——如钢铁是生产枪炮坦克的，自由贸易将使本国依靠外国供给，战争爆发、外国供给中断时可能无法生产足够的武器保卫自己。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反对者观点</strong>：受外国竞争威胁的行业对国家安全至关重要——如钢铁是生产枪炮坦克的，自由贸易将使本国依靠外国供给，战争爆发、外国供给中断时可能无法生产足够的武器保卫自己。"},{"t":"经济学家的回应：出于对国家安全的合理考虑，保护关键行业可能是合理的；但担心这种观点被渴望以损害消费者利益为代价牟利的生产者利用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学家的回应</strong>：出于对国家安全的合理考虑，保护关键行业可能是合理的；但担心这种观点被渴望以损害消费者利益为代价牟利的生产者利用。"},{"t":"鉴别标准：当国家安全论由行业代表而不是国防机构提出时，应谨慎看待——公司有夸大自己在国防中作用的激励，一国将军的观点可能非常不同；当军事部门是某行业产品的消费者时，它可从进口中获益（更便宜的钢铁使国家以低成本增加武器储备）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">鉴别标准</strong>：当国家安全论由行业代表而不是国防机构提出时，应谨慎看待——公司有夸大自己在国防中作用的激励，一国将军的观点可能非常不同；当军事部门是某行业产品的消费者时，它可从进口中获益（更便宜的钢铁使国家以低成本增加武器储备）。"}],"k":"b","i":1,"h":"9.3.2 国家安全论"},{"t":"9.3.3 幼稚产业论","c":[{"t":"反对者观点：新兴产业需要暂时性贸易限制以帮助其成长（保护期后产业成熟、能与外国企业竞争）；老产业类似，需要暂时性保护以对新情况做出调整。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反对者观点</strong>：新兴产业需要暂时性贸易限制以帮助其成长（保护期后产业成熟、能与外国企业竞争）；老产业类似，需要暂时性保护以对新情况做出调整。"},{"t":"实践层面的回应：幼稚产业论难以实施——政府要确定哪个产业受保护后最终有利可图、并确定利益是否大于保护给消费者带来的成本，而\"挑选赢家\"极为困难，通过政治程序挑选更困难，结果往往是保护了政治力量强大的产业；一旦政治力量强大的产业得到保护，这种\"暂时性\"政策很难取消。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实践层面的回应</strong>：幼稚产业论难以实施——政府要确定哪个产业受保护后最终有利可图、并确定利益是否大于保护给消费者带来的成本，而&quot;挑选赢家&quot;极为困难，通过政治程序挑选更困难，结果往往是保护了政治力量强大的产业；一旦政治力量强大的产业得到保护，这种&quot;暂时性&quot;政策很难取消。"},{"t":"理论层面的回应：即使新兴产业暂时不能与外国对手竞争获利，若长期有利可图，企业所有者应愿意为实现最终利润承受暂时亏损——保护并非幼稚产业成长的必需；历史表明，没有保护的情况下初创企业虽常经历暂时亏损，长期仍能取得成功。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理论层面的回应</strong>：即使新兴产业暂时不能与外国对手竞争获利，若长期有利可图，企业所有者应愿意为实现最终利润承受暂时亏损——保护并非幼稚产业成长的必需；历史表明，没有保护的情况下初创企业虽常经历暂时亏损，长期仍能取得成功。"}],"k":"b","i":1,"h":"9.3.3 幼稚产业论"},{"t":"9.3.4 不公平竞争论","c":[{"t":"反对者观点：只有各国都按同样规则行事，自由贸易才是合意的——若外国政府通过大幅度减税等补贴其行业（如Neighborland 国补贴纺织品），让企业在此条件下竞争不公平，本国行业应得到保护。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反对者观点</strong>：只有各国都按同样规则行事，自由贸易才是合意的——若外国政府通过大幅度减税等补贴其行业（如Neighborland 国补贴纺织品），让企业在此条件下竞争不公平，本国行业应得到保护。"},{"t":"经济学家的回应：从另一个国家以有补贴的价格购买物品并不损害本国——本国生产者蒙受损失，但消费者从低价格中获益，且消费者得到的好处大于生产者的损失；外国补贴可能是糟糕的政策，但承担税负的是外国（Neighborland 国）纳税人，本国可以从以受补贴价格购买物品的机会中获益——也许应该感谢而不是反对对方的补贴。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学家的回应</strong>：从另一个国家以有补贴的价格购买物品并不损害本国——本国生产者蒙受损失，但消费者从低价格中获益，且消费者得到的好处大于生产者的损失；外国补贴可能是糟糕的政策，但承担税负的是外国（Neighborland 国）纳税人，本国可以从以受补贴价格购买物品的机会中获益——也许应该感谢而不是反对对方的补贴。"}],"k":"b","i":1,"h":"9.3.4 不公平竞争论"},{"t":"9.3.5 作为讨价还价筹码的保护论","c":[{"t":"反对者观点：贸易限制威胁有助于消除外国政府业已实施的贸易限制——如Isoland 国威胁除非Neighborland 国取消小麦关税，否则对其纺织品征关税；若对方屈服取消关税，结果可能是更自由的贸易。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反对者观点</strong>：贸易限制威胁有助于消除外国政府业已实施的贸易限制——如Isoland 国威胁除非Neighborland 国取消小麦关税，否则对其纺织品征关税；若对方屈服取消关税，结果可能是更自由的贸易。"},{"t":"经济学家的回应：问题在于威胁可能不起作用——若威胁无效，该国面临两种坏可能性之间的选择：实施威胁并实行贸易限制（减少本国经济福利），或收回威胁（在国际事务中失去威信）；面对这种选择，该国也许会希望一开始就不做这种威胁。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学家的回应</strong>：问题在于威胁可能不起作用——若威胁无效，该国面临两种坏可能性之间的选择：实施威胁并实行贸易限制（减少本国经济福利），或收回威胁（在国际事务中失去威信）；面对这种选择，该国也许会希望一开始就不做这种威胁。"},{"t":"案例研究「贸易协定和世界贸易组织」要点：","c":[{"t":"实现自由贸易的两种方法：单边方法——一国自己取消贸易限制（英国19世纪的做法，及近年来的智利和韩国）；多边方法——与贸易伙伴谈判，在他国减少贸易限制的同时自己也减少（如1993年签署的北美自由贸易协定NAFTA，降低美、墨、加之间贸易壁垒）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">实现自由贸易的两种方法</strong>：单边方法——一国自己取消贸易限制（英国19世纪的做法，及近年来的智利和韩国）；多边方法——与贸易伙伴谈判，在他国减少贸易限制的同时自己也减少（如1993年签署的北美自由贸易协定NAFTA，降低美、墨、加之间贸易壁垒）。"},{"t":"关贸总协定（GATT）：二战后美国为应对20世纪30年代大萧条期间的高关税（许多经济学家相信这些高关税加剧了当时全世界的经济困难）而协助建立的一系列连续谈判；GATT 成功把成员国平均关税从二战后的约40%降到现在的约5%。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">关贸总协定</strong>（GATT）：二战后美国为应对20世纪30年代大萧条期间的高关税（许多经济学家相信这些高关税加剧了当时全世界的经济困难）而协助建立的一系列连续谈判；GATT 成功把成员国平均关税从二战后的约40%降到现在的约5%。"},{"t":"世界贸易组织（WTO）：1995年成立、总部在瑞士日内瓦、实施GATT 所确立规则的国际机构；到2015年有162个成员，占世界贸易总量97%以上；职能是制定贸易协定、组织谈判论坛并处理成员国之间的争端。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">世界贸易组织</strong>（WTO）：1995年成立、总部在瑞士日内瓦、实施GATT 所确立规则的国际机构；到2015年有162个成员，占世界贸易总量97%以上；职能是制定贸易协定、组织谈判论坛并处理成员国之间的争端。"},{"t":"多边方法的优缺点：优点是可能比单边方法带来更自由的贸易（同时减少本国和国外的贸易限制）；缺点是国际谈判失败时，结果会比单边方法更多地限制贸易。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">多边方法的优缺点</strong>：优点是可能比单边方法带来更自由的贸易（同时减少本国和国外的贸易限制）；缺点是国际谈判失败时，结果会比单边方法更多地限制贸易。"},{"t":"多边方法的政治优势：大多数市场中生产者比消费者人数少、组织更紧密、政治影响力更大，单边降低关税在国内政治上有困难；若外国同时承诺降低其关税（如对方降小麦关税），本国受损于贸易限制、有政治影响力的出口部门（种小麦的农民）就会支持协议——当单边方法无法赢得政治支持时，多边方法有时可以。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">多边方法的政治优势</strong>：大多数市场中生产者比消费者人数少、组织更紧密、政治影响力更大，单边降低关税在国内政治上有困难；若外国同时承诺降低其关税（如对方降小麦关税），本国受损于贸易限制、有政治影响力的出口部门（种小麦的农民）就会支持协议——当单边方法无法赢得政治支持时，多边方法有时可以。"}],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「贸易协定和世界贸易组织」要点</strong>："},{"t":"即问即答要点：Autarka 国纺织业禁进口的游说可能提出五种观点——工作岗位论、国家安全论、幼稚产业论、不公平竞争论、讨价还价筹码论；可按上述各节的经济学回应逐一驳斥。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：Autarka 国纺织业禁进口的游说可能提出五种观点——工作岗位论、国家安全论、幼稚产业论、不公平竞争论、讨价还价筹码论；可按上述各节的经济学回应逐一驳斥。"}],"k":"b","i":1,"h":"9.3.5 作为讨价还价筹码的保护论"}],"k":"sec","i":0,"h":"9.3 各种限制贸易的观点"},{"t":"9.4 结论","c":[{"t":"经济学家和公众对自由贸易的看法往往不一致：2015年NBC 新闻和《华尔街日报》的调查中，只有29%的美国受访者认为自由的国际贸易有利、34%认为有害；而大多数经济学家支持自由贸易——认为它是有效配置生产的方法，并提高了两国的生活水平。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经济学家和公众对自由贸易的看法往往不一致</strong>：2015年NBC 新闻和《华尔街日报》的调查中，只有29%的美国受访者认为自由的国际贸易有利、34%认为有害；而大多数经济学家支持自由贸易——认为它是有效配置生产的方法，并提高了两国的生活水平。"},{"t":"美国是证明自由贸易好处的持续实验：历史上一直允许各州之间无限制贸易，整个国家从专业化中受益（佛罗里达州种橙子、阿拉斯加州产石油、加利福尼亚州酿造红酒）；如果美国人只能消费本州生产的物品与服务，就不会有今天的高生活水平——与美国类似，世界也能从各国之间的自由贸易中受益。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">美国是证明自由贸易好处的持续实验</strong>：历史上一直允许各州之间无限制贸易，整个国家从专业化中受益（佛罗里达州种橙子、阿拉斯加州产石油、加利福尼亚州酿造红酒）；如果美国人只能消费本州生产的物品与服务，就不会有今天的高生活水平——与美国类似，世界也能从各国之间的自由贸易中受益。"},{"t":"发明家故事的寓意：某\"发明家\"声称以小麦为唯一投入、不用劳动就能低成本生产纺织品，全国因此享受更高生活水平、工人转移到新行业；真相是他只是把小麦走私出境并进口纺织品——所谓神秘新技术实为国际贸易的好处。技术进步与国际贸易对经济的作用相同：过时行业中工人的向外转移是技术进步和经济增长不可避免的一部分；政府关闭\"工厂\"后生活水平退回从前。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">发明家故事的寓意</strong>：某&quot;发明家&quot;声称以小麦为唯一投入、不用劳动就能低成本生产纺织品，全国因此享受更高生活水平、工人转移到新行业；真相是他只是把小麦走私出境并进口纺织品——所谓神秘新技术实为国际贸易的好处。技术进步与国际贸易对经济的作用相同：过时行业中工人的向外转移是技术进步和经济增长不可避免的一部分；政府关闭&quot;工厂&quot;后生活水平退回从前。"}],"k":"sec","i":0,"h":"9.4 结论"}],"k":"chap","h":"<strong class=\"lead\">第9章 应用</strong>：国际贸易"}],"k":"part","h":"第3篇 市场和福利","col":"#e08a1e","pc":"p3"},{"t":"第4篇 公共部门经济学","c":[{"t":"第10章 外部性","c":[{"t":"本章内容提要","c":[{"t":"外部性是一个人的行为对旁观者福利的无补偿影响：负外部性（如污染）使市场均衡量大于社会最优量，正外部性（如教育、技术溢出）使市场均衡量小于社会最优量，两种情况下市场均衡都不是有效率的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">外部性是一个人的行为对旁观者福利的无补偿影响</strong>：负外部性（如污染）使市场均衡量大于社会最优量，正外部性（如教育、技术溢出）使市场均衡量小于社会最优量，两种情况下市场均衡都不是有效率的。"},{"t":"政府解决外部性的两类办法：命令与控制政策直接管制行为；以市场为基础的政策（矫正税与补贴、可交易的污染许可证）提供激励让私人自己解决问题，经济学家通常更偏爱后者，因为它以更低的社会成本减少污染。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">政府解决外部性的两类办法</strong>：命令与控制政策直接管制行为；以市场为基础的政策（矫正税与补贴、可交易的污染许可证）提供激励让私人自己解决问题，经济学家通常更偏爱后者，因为它以更低的社会成本减少污染。"},{"t":"私人也能解决外部性：道德规范与社会约束、慈善行为、把不同经营整合在一起（合并）、利益各方签订合约；科斯定理表明，只要私人各方能无成本地协商，就总能自行解决外部性问题并有效配置资源。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">私人也能解决外部性</strong>：道德规范与社会约束、慈善行为、把不同经营整合在一起（合并）、利益各方签订合约；科斯定理表明，只要私人各方能无成本地协商，就总能自行解决外部性问题并有效配置资源。"},{"t":"现实中交易成本、谈判破裂、利益方人数过多使私人解决方法常常失效，政府因此介入；但即使有政府干预，只要得到适当调整，市场力量往往是解决市场失灵的最好办法。","c":[],"k":"b","i":1,"h":"现实中交易成本、谈判破裂、利益方人数过多使私人解决方法常常失效，政府因此介入；但即使有政府干预，只要得到适当调整，市场力量往往是解决市场失灵的最好办法。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"10.1 外部性和市场无效率","c":[{"t":"10.1.1 福利经济学：回顾","c":[{"t":"以铝市场为例复习第7章结论：需求曲线反映买者的价值（私人价值），供给曲线反映卖者的成本；在没有外部性时，市场均衡数量使消费者剩余与生产者剩余之和最大化，是有效率的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">以铝市场为例复习第7章结论</strong>：需求曲线反映买者的价值（私人价值），供给曲线反映卖者的成本；在没有外部性时，市场均衡数量使消费者剩余与生产者剩余之和最大化，是有效率的。"}],"k":"b","i":1,"h":"<strong class=\"lead\">10.1.1 福利经济学</strong>：回顾"},{"t":"10.1.2 负外部性","c":[{"t":"外部性：一个人的行为对旁观者福利的无补偿影响（externality）；影响不利为负外部性，影响有利为正外部性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">外部性</strong>：一个人的行为对旁观者福利的无补偿影响（externality）；影响不利为负外部性，影响有利为正外部性。"},{"t":"铝厂排放污染使生产铝的社会成本大于生产者的私人成本；社会成本由私人成本加上受污染影响的旁观者的成本构成，社会成本曲线位于供给曲线之上，两线之差即外部成本。","c":[],"k":"b","i":2,"h":"铝厂排放污染使生产铝的社会成本大于生产者的私人成本；社会成本由私人成本加上受污染影响的旁观者的成本构成，社会成本曲线位于供给曲线之上，两线之差即外部成本。"},{"t":"仁慈的社会计划者选择需求曲线与社会成本曲线的交点决定社会最优量 Q最优；负外部性下 Q市场 大于 Q最优，因为市场均衡只反映私人成本，把产量降到均衡水平之下会增加社会总福利。","c":[],"k":"b","i":2,"h":"仁慈的社会计划者选择需求曲线与社会成本曲线的交点决定社会最优量 Q最优；负外部性下 Q市场 大于 Q最优，因为市场均衡只反映私人成本，把产量降到均衡水平之下会增加社会总福利。"},{"t":"外部性内在化：改变激励，以使人们考虑到自己行为的外部效应（internalizing the externality）；对生产者每吨征税、税额恰好等于外部成本，供给曲线就上移到与社会成本曲线重合，市场自行生产社会最优量——依据\"人们会对激励做出反应\"这一原理。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">外部性内在化</strong>：改变激励，以使人们考虑到自己行为的外部效应（internalizing the externality）；对生产者每吨征税、税额恰好等于外部成本，供给曲线就上移到与社会成本曲线重合，市场自行生产社会最优量——依据&quot;人们会对激励做出反应&quot;这一原理。"}],"k":"b","i":1,"h":"10.1.2 负外部性"},{"t":"10.1.3 正外部性","c":[{"t":"教育的利益大部分是私人的（高工资），但也产生正外部性：更理智的选民带来更好的政府、更低的犯罪率、促进技术进步的开发与扩散。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">教育的利益大部分是私人的</strong>（高工资），但也产生正外部性：更理智的选民带来更好的政府、更低的犯罪率、促进技术进步的开发与扩散。"},{"t":"正外部性下社会价值曲线位于需求曲线（私人价值）之上，最优量在与社会成本（供给）曲线的交点处，故 Q最优 大于 Q市场。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">正外部性下社会价值曲线位于需求曲线</strong>（私人价值）之上，最优量在与社会成本（供给）曲线的交点处，故 Q最优 大于 Q市场。"},{"t":"政府的适当反应与负外部性相反：通过补贴使外部性内在化（如公立学校和政府助学金大量补贴教育）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政府的适当反应与负外部性相反</strong>：通过补贴使外部性内在化（如公立学校和政府助学金大量补贴教育）。"},{"t":"总结：负外部性使市场产量大于社会合意数量，正外部性使市场产量小于社会合意数量；对策是对有负外部性的物品征税、对有正外部性的物品补贴。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总结</strong>：负外部性使市场产量大于社会合意数量，正外部性使市场产量小于社会合意数量；对策是对有负外部性的物品征税、对有正外部性的物品补贴。"},{"t":"案例研究要点（技术溢出、产业政策与专利保护）：技术溢出是一个企业的研究对其他企业的正外部性；补贴应等于溢出效应的价值，但溢出难以衡量，产业政策（政府促进技术进步行业的干预）可能最终补贴的是最有政治影响力的行业而非溢出最大的行业；专利保护通过赋予发明者一定时期的专有产权使外部性内在化，为研发提供更多激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究要点</strong>（技术溢出、产业政策与专利保护）：技术溢出是一个企业的研究对其他企业的正外部性；补贴应等于溢出效应的价值，但溢出难以衡量，产业政策（政府促进技术进步行业的干预）可能最终补贴的是最有政治影响力的行业而非溢出最大的行业；专利保护通过赋予发明者一定时期的专有产权使外部性内在化，为研发提供更多激励。"}],"k":"b","i":1,"h":"10.1.3 正外部性"}],"k":"sec","i":0,"h":"10.1 外部性和市场无效率"},{"t":"10.2 针对外部性的公共政策","c":[{"t":"政府的两种反应方式：命令与控制政策直接对行为进行管制；以市场为基础的政策提供激励，促使私人决策者自己解决问题。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">政府的两种反应方式</strong>：命令与控制政策直接对行为进行管制；以市场为基础的政策提供激励，促使私人决策者自己解决问题。"},{"t":"10.2.1 命令与控制政策：管制","c":[{"t":"政府可以规定或禁止某些行为，如把有毒化学物质倒入供水系统定为犯罪（外部成本远大于排污者利益时完全禁止）。","c":[],"k":"b","i":2,"h":"政府可以规定或禁止某些行为，如把有毒化学物质倒入供水系统定为犯罪（外部成本远大于排污者利益时完全禁止）。"},{"t":"但禁止所有污染活动不可能也不明智（各种运输工具都带来污染副产品）；社会要做的是权衡成本与利益，决定允许哪种污染、允许多少污染；美国环保署（EPA）负责制定并实施环境管制，形式包括规定最高排污水平、要求采用特定减排技术。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">但禁止所有污染活动不可能也不明智</strong>（各种运输工具都带来污染副产品）；社会要做的是权衡成本与利益，决定允许哪种污染、允许多少污染；美国环保署（EPA）负责制定并实施环境管制，形式包括规定最高排污水平、要求采用特定减排技术。"},{"t":"管制的困难：制定良好规则需要政府了解特定行业及可用技术的详细信息，这类信息往往难以获得。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管制的困难</strong>：制定良好规则需要政府了解特定行业及可用技术的详细信息，这类信息往往难以获得。"}],"k":"b","i":1,"h":"<strong class=\"lead\">10.2.1 命令与控制政策</strong>：管制"},{"t":"10.2.2 以市场为基础的政策1：矫正税与补贴","c":[{"t":"矫正税：旨在引导私人决策者考虑负外部性引起的社会成本的税收（corrective taxes），又称庇古税（Pigovian taxes），以最早主张采用它的经济学家阿瑟·庇古（Arthur Pigou，1877—1959）命名。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">矫正税</strong>：旨在引导私人决策者考虑负外部性引起的社会成本的税收（corrective taxes），又称庇古税（Pigovian taxes），以最早主张采用它的经济学家阿瑟·庇古（Arthur Pigou，1877—1959）命名。"},{"t":"理想标准：矫正税应等于负外部性活动的外部成本，矫正补贴应等于正外部性活动的外部利益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理想标准</strong>：矫正税应等于负外部性活动的外部成本，矫正补贴应等于正外部性活动的外部利益。"},{"t":"造纸厂与钢铁厂各排500吨的例子：管制要求两厂等量减到300吨，矫正税（每吨5万美元）则提供减排激励——两法同样能达到任何污染目标，但税收更有效率，因为等量减排不是成本最低的方法；减排成本低的造纸厂会大幅减排少交税，成本高的钢铁厂小幅减排多交税——矫正税规定了污染权的价格，把它分给减排成本最高的工厂，无论选何种污染水平都能以最低总成本达到。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">造纸厂与钢铁厂各排500吨的例子</strong>：管制要求两厂等量减到300吨，矫正税（每吨5万美元）则提供减排激励——两法同样能达到任何污染目标，但税收更有效率，因为等量减排不是成本最低的方法；减排成本低的造纸厂会大幅减排少交税，成本高的钢铁厂小幅减排多交税——矫正税规定了污染权的价格，把它分给减排成本最高的工厂，无论选何种污染水平都能以最低总成本达到。"},{"t":"矫正税还激励工厂开发更环保的技术（可少交税）；与扭曲激励、引起无谓损失的大多数税不同，矫正税既增加政府收入又提高经济效率，因为它使激励考虑到外部性、把资源配置向社会最优移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">矫正税还激励工厂开发更环保的技术</strong>（可少交税）；与扭曲激励、引起无谓损失的大多数税不同，矫正税既增加政府收入又提高经济效率，因为它使激励考虑到外部性、把资源配置向社会最优移动。"},{"t":"案例研究要点（为什么对汽油征收的税如此之重）：汽油税可视为针对开车三种负外部性（拥堵、车祸——被运动型多功能车撞的死亡可能性是被普通车撞的五倍、污染与全球变暖）的矫正税，因此不像大多数税那样引起无谓损失，反而使经济运行得更好；《经济文献杂志》2007年研究估算2005年最优汽油矫正税为每加仑2.28美元，按通胀调整后2015年约2.78美元，而2015年实际仅50美分。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究要点</strong>（为什么对汽油征收的税如此之重）：汽油税可视为针对开车三种负外部性（拥堵、车祸——被运动型多功能车撞的死亡可能性是被普通车撞的五倍、污染与全球变暖）的矫正税，因此不像大多数税那样引起无谓损失，反而使经济运行得更好；《经济文献杂志》2007年研究估算2005年最优汽油矫正税为每加仑2.28美元，按通胀调整后2015年约2.78美元，而2015年实际仅50美分。"}],"k":"b","i":1,"h":"<strong class=\"lead\">10.2.2 以市场为基础的政策1</strong>：矫正税与补贴"},{"t":"10.2.3 以市场为基础的政策2：可交易的污染许可证","c":[{"t":"延续造纸厂与钢铁厂例子：管制下若钢铁厂想从300吨增到400吨、付500万美元让造纸厂从300吨减到200吨（总量不变），允许交易是好政策——自愿交易使双方变好且无新增外部影响，提高了社会福利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">延续造纸厂与钢铁厂例子</strong>：管制下若钢铁厂想从300吨增到400吨、付500万美元让造纸厂从300吨减到200吨（总量不变），允许交易是好政策——自愿交易使双方变好且无新增外部影响，提高了社会福利。"},{"t":"允许交易就创造了新的稀缺资源\"污染许可证\"，最终形成受供求支配的市场；看不见的手保证许可证被分配给对它评价最高的企业，支付意愿取决于减排成本（减排成本越高、支付意愿越高）。","c":[],"k":"b","i":2,"h":"允许交易就创造了新的稀缺资源&quot;污染许可证&quot;，最终形成受供求支配的市场；看不见的手保证许可证被分配给对它评价最高的企业，支付意愿取决于减排成本（减排成本越高、支付意愿越高）。"},{"t":"初始配置无关紧要：只要存在交易污染权的自由市场，低成本减排者卖许可证、高成本减排者买许可证，最终配置都是有效率的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">初始配置无关紧要</strong>：只要存在交易污染权的自由市场，低成本减排者卖许可证、高成本减排者买许可证，最终配置都是有效率的。"},{"t":"与矫正税的等价性：两种政策下企业都要为污染付费（矫正税向政府交税；许可证向卖方支付，自留许可证的企业也承担放弃出售收入的机会成本）；矫正税下污染权供给完全有弹性——政府定价、需求曲线决定污染量；许可证下供给完全无弹性——政府定量、需求曲线决定污染价格；EPA 可通过定价或定量达到需求曲线上的任意一点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与矫正税的等价性</strong>：两种政策下企业都要为污染付费（矫正税向政府交税；许可证向卖方支付，自留许可证的企业也承担放弃出售收入的机会成本）；矫正税下污染权供给完全有弹性——政府定价、需求曲线决定污染量；许可证下供给完全无弹性——政府定量、需求曲线决定污染价格；EPA 可通过定价或定量达到需求曲线上的任意一点。"},{"t":"许可证何时更优：政府不知道污染的需求曲线、无法确定税率时，直接拍卖限量许可证，拍卖价格即揭示适当的矫正税规模；1990年《清洁空气法》修正案要求发电站大幅减排二氧化硫并允许交易许可证，被证明能以最小代价减少污染，现被普遍认为是低成本、高效率的环保方法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">许可证何时更优</strong>：政府不知道污染的需求曲线、无法确定税率时，直接拍卖限量许可证，拍卖价格即揭示适当的矫正税规模；1990年《清洁空气法》修正案要求发电站大幅减排二氧化硫并允许交易许可证，被证明能以最小代价减少污染，现被普遍认为是低成本、高效率的环保方法。"}],"k":"b","i":1,"h":"<strong class=\"lead\">10.2.3 以市场为基础的政策2</strong>：可交易的污染许可证"},{"t":"10.2.4 对关于污染的经济分析的批评","c":[{"t":"一些环保主义者认为清新空气和清洁的水是基本人权，不应从经济上考虑（\"我们不能给任何人付费就可以污染的选择权\"）；经济学家很少赞同：好的环境政策从承认\"人们面临权衡取舍\"开始，消除所有污染不可能，必须把环境价值与机会成本比较。","c":[],"k":"b","i":2,"h":"一些环保主义者认为清新空气和清洁的水是基本人权，不应从经济上考虑（&quot;我们不能给任何人付费就可以污染的选择权&quot;）；经济学家很少赞同：好的环境政策从承认&quot;人们面临权衡取舍&quot;开始，消除所有污染不可能，必须把环境价值与机会成本比较。"},{"t":"清洁环境可视为另一种物品：有正的收入弹性（富国比穷国更有能力维持更清洁的环境、环保更严格），也服从需求定理（环保价格越低、公众越想要）；矫正税与污染许可证降低了环境保护的成本，从而增加了公众对清洁环境的需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">清洁环境可视为另一种物品</strong>：有正的收入弹性（富国比穷国更有能力维持更清洁的环境、环保更严格），也服从需求定理（环保价格越低、公众越想要）；矫正税与污染许可证降低了环境保护的成本，从而增加了公众对清洁环境的需求。"}],"k":"b","i":1,"h":"10.2.4 对关于污染的经济分析的批评"}],"k":"sec","i":0,"h":"10.2 针对外部性的公共政策"},{"t":"10.3 外部性的私人解决方法","c":[{"t":"解决外部性并不总是需要政府，在一些情况下人们可以采取私人解决方法，使资源配置更接近社会最优状态。","c":[],"k":"b","i":1,"h":"解决外部性并不总是需要政府，在一些情况下人们可以采取私人解决方法，使资源配置更接近社会最优状态。"},{"t":"10.3.1 私人解决方法的类型","c":[{"t":"道德规范和社会约束：大多数人不乱扔垃圾并非因为法律严惩，而是\"己所不欲，勿施于人\"的金科玉律——道德规范告诉人们考虑自己行为对别人的影响，即把外部性内在化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">道德规范和社会约束</strong>：大多数人不乱扔垃圾并非因为法律严惩，而是&quot;己所不欲，勿施于人&quot;的金科玉律——道德规范告诉人们考虑自己行为对别人的影响，即把外部性内在化。"},{"t":"慈善行为：如西拉俱乐部（Sierra Club）靠私人捐款保护环境；学院和大学接受捐赠部分因为教育有正外部性；政府通过所得税扣除慈善捐赠来鼓励这种私人解决方法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">慈善行为</strong>：如西拉俱乐部（Sierra Club）靠私人捐款保护环境；学院和大学接受捐赠部分因为教育有正外部性；政府通过所得税扣除慈善捐赠来鼓励这种私人解决方法。"},{"t":"依靠利己心把不同经营整合在一起：相邻的苹果园主与养蜂人互给对方正外部性（蜜蜂采粉助果树结果、花粉用于酿蜜），各自决策时都不考虑外部性，导致树种得太少、蜂养得太少；一方购买另一方的资产（合并）后外部性就在同一个企业内内在化，可以选择最优数量——这也是企业多样化经营的一个原因。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">依靠利己心把不同经营整合在一起</strong>：相邻的苹果园主与养蜂人互给对方正外部性（蜜蜂采粉助果树结果、花粉用于酿蜜），各自决策时都不考虑外部性，导致树种得太少、蜂养得太少；一方购买另一方的资产（合并）后外部性就在同一个企业内内在化，可以选择最优数量——这也是企业多样化经营的一个原因。"},{"t":"利益各方签订合约：苹果园主与养蜂人可在合约中规定树和蜜蜂的数量及相互支付，解决外部性产生的无效率并使双方状况都变好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利益各方签订合约</strong>：苹果园主与养蜂人可在合约中规定树和蜜蜂的数量及相互支付，解决外部性产生的无效率并使双方状况都变好。"}],"k":"b","i":1,"h":"10.3.1 私人解决方法的类型"},{"t":"10.3.2 科斯定理","c":[{"t":"科斯定理：认为如果私人各方可以无成本地就资源配置进行协商，那么他们就可以自己解决外部性问题的观点（Coase theorem，以经济学家罗纳德·科斯命名）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">科斯定理</strong>：认为如果私人各方可以无成本地就资源配置进行协商，那么他们就可以自己解决外部性问题的观点（Coase theorem，以经济学家罗纳德·科斯命名）。"},{"t":"Dick 的狂吠的狗 Spot 干扰邻居 Jane：效率标准是比较 Dick 养狗的收益与 Jane 承受狂吠的成本，收益大于成本则养狗是有效率的。","c":[],"k":"b","i":2,"h":"Dick 的狂吠的狗 Spot 干扰邻居 Jane：效率标准是比较 Dick 养狗的收益与 Jane 承受狂吠的成本，收益大于成本则养狗是有效率的。"},{"t":"数值例：若 Dick 收益500美元、Jane 成本800美元，Jane 付600美元让 Dick 放弃养狗，双方变好且结果有效率；若 Dick 收益1000美元、Jane 成本800美元，Dick 拒绝任何低于1000美元的出价、Jane 不愿出高于800美元，Dick 继续养狗——这种结果同样有效率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">数值例</strong>：若 Dick 收益500美元、Jane 成本800美元，Jane 付600美元让 Dick 放弃养狗，双方变好且结果有效率；若 Dick 收益1000美元、Jane 成本800美元，Dick 拒绝任何低于1000美元的出价、Jane 不愿出高于800美元，Dick 继续养狗——这种结果同样有效率。"},{"t":"产权初始分配不影响效率：无论法律上 Dick 有权养狗还是 Jane 有权享受安宁，双方都能通过讨价还价（谁向谁付钱方向不同）达到有效率的结果，只有养狗收益超过 Jane 的成本时 Dick 才养狗；但权利分配决定经济福利的分配。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">产权初始分配不影响效率</strong>：无论法律上 Dick 有权养狗还是 Jane 有权享受安宁，双方都能通过讨价还价（谁向谁付钱方向不同）达到有效率的结果，只有养狗收益超过 Jane 的成本时 Dick 才养狗；但权利分配决定经济福利的分配。"}],"k":"b","i":1,"h":"10.3.2 科斯定理"},{"t":"10.3.3 为什么私人解决方法并不总是有效","c":[{"t":"科斯定理只在利益各方可以顺利达成并实施协议时才适用，现实中即使存在互利协议，协商也不总奏效。","c":[],"k":"b","i":2,"h":"科斯定理只在利益各方可以顺利达成并实施协议时才适用，现实中即使存在互利协议，协商也不总奏效。"},{"t":"交易成本：各方在达成协议与遵守协议过程中所发生的成本（transaction costs），如请翻译、起草和执行合约的律师费用；若解决问题的收益小于交易成本，各方就选择不解决。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">交易成本</strong>：各方在达成协议与遵守协议过程中所发生的成本（transaction costs），如请翻译、起草和执行合约的律师费用；若解决问题的收益小于交易成本，各方就选择不解决。"},{"t":"谈判容易破裂：即使存在互利的价格区间，各方竭力争取对自己更好的交易（Dick 想要750美元而 Jane 只愿付550美元），僵持之下无效率结果（继续养狗）仍然存在；战争和罢工的反复出现表明达不成协议可能代价高昂。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">谈判容易破裂</strong>：即使存在互利的价格区间，各方竭力争取对自己更好的交易（Dick 想要750美元而 Jane 只愿付550美元），僵持之下无效率结果（继续养狗）仍然存在；战争和罢工的反复出现表明达不成协议可能代价高昂。"},{"t":"利益各方人数众多时协调代价过高：受污染湖泊影响的众多渔民几乎不可能协调一致与工厂协商。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利益各方人数众多时协调代价过高</strong>：受污染湖泊影响的众多渔民几乎不可能协调一致与工厂协商。"},{"t":"当私人协商无效时，政府作为为集体行为而设立的机构可以发挥作用，代表（如）渔民的利益行事。","c":[],"k":"b","i":2,"h":"当私人协商无效时，政府作为为集体行为而设立的机构可以发挥作用，代表（如）渔民的利益行事。"},{"t":"新闻摘录要点（科斯定理在起作用——飞机座椅放倒之争）：旅客买了机票就拥有使用座椅斜倚功能的权利；只要产权明晰且交易成本不高，人们就会交易产权直到其转移到出价最高者手中；但现实中人们不愿与陌生邻座讨价还价（交易成本，甚至招致泼水），故几乎无人付钱换椅背调直。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新闻摘录要点</strong>（科斯定理在起作用——飞机座椅放倒之争）：旅客买了机票就拥有使用座椅斜倚功能的权利；只要产权明晰且交易成本不高，人们就会交易产权直到其转移到出价最高者手中；但现实中人们不愿与陌生邻座讨价还价（交易成本，甚至招致泼水），故几乎无人付钱换椅背调直。"}],"k":"b","i":1,"h":"10.3.3 为什么私人解决方法并不总是有效"}],"k":"sec","i":0,"h":"10.3 外部性的私人解决方法"},{"t":"10.4 结论","c":[{"t":"看不见的手强大但不是万能的：当买者卖者是仅有的利益方时市场均衡有效率；存在污染等外部效应时必须考虑第三方福利，市场可能无法有效率地配置资源。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">看不见的手强大但不是万能的</strong>：当买者卖者是仅有的利益方时市场均衡有效率；存在污染等外部效应时必须考虑第三方福利，市场可能无法有效率地配置资源。"},{"t":"某些情况下人们可以自己解决外部性问题（科斯定理），但利益各方太多会使谈判困难；私人方法失灵时政府介入，通过矫正税和污染许可证等要求决策者承担行为的全部成本，使外部性内在化。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">某些情况下人们可以自己解决外部性问题</strong>（科斯定理），但利益各方太多会使谈判困难；私人方法失灵时政府介入，通过矫正税和污染许可证等要求决策者承担行为的全部成本，使外部性内在化。"},{"t":"只要得到适当的调整，市场力量往往是解决市场失灵的最好办法。","c":[],"k":"b","i":1,"h":"只要得到适当的调整，市场力量往往是解决市场失灵的最好办法。"}],"k":"sec","i":0,"h":"10.4 结论"}],"k":"chap","h":"第10章 外部性"},{"t":"第11章 公共物品和公共资源","c":[{"t":"本章内容提要","c":[{"t":"物品按两个特征分类——排他性（能否阻止人们使用）与消费中的竞争性（一人使用是否减少他人使用），据此分为私人物品、公共物品、公共资源、俱乐部物品四类；市场运行最适用于既有排他性又有竞争性的私人物品。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">物品按两个特征分类——排他性</strong>（能否阻止人们使用）与消费中的竞争性（一人使用是否减少他人使用），据此分为私人物品、公共物品、公共资源、俱乐部物品四类；市场运行最适用于既有排他性又有竞争性的私人物品。"},{"t":"公共物品既无排他性又无竞争性：由于搭便车者问题，私人市场不能提供有效数量，政府可在确信总收益大于总成本时提供公共物品并以税收支付，用成本—收益分析决定供给量。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">公共物品既无排他性又无竞争性</strong>：由于搭便车者问题，私人市场不能提供有效数量，政府可在确信总收益大于总成本时提供公共物品并以税收支付，用成本—收益分析决定供给量。"},{"t":"公共资源有消费中的竞争性但无排他性：因负外部性（公地悲剧）往往被过度使用，政府用管制、收费或把公共资源变为私人物品来限制使用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">公共资源有消费中的竞争性但无排他性</strong>：因负外部性（公地悲剧）往往被过度使用，政府用管制、收费或把公共资源变为私人物品来限制使用。"},{"t":"本章与上一章的共同主题：市场失灵源于产权没有很好地确立——政府可以通过帮助界定产权、管制私人行为或直接提供物品来增进效率与经济福利。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章与上一章的共同主题</strong>：市场失灵源于产权没有很好地确立——政府可以通过帮助界定产权、管制私人行为或直接提供物品来增进效率与经济福利。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"11.1 不同类型的物品","c":[{"t":"排他性：一种物品具有的可以阻止一个人使用该物品的特性（excludability）；消费中的竞争性：一个人使用一种物品将减少其他人对该物品的使用的特性（rivalry in consumption）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">排他性</strong>：一种物品具有的可以阻止一个人使用该物品的特性（excludability）；消费中的竞争性：一个人使用一种物品将减少其他人对该物品的使用的特性（rivalry in consumption）。"},{"t":"四分类矩阵（排他性×竞争性）：","c":[{"t":"私人物品：既有排他性又有消费竞争性的物品（private goods），例：冰淇淋蛋卷、衣服、拥挤的收费道路；经济中大多数物品属此类，前面各章的供求与效率分析隐含假设物品为私人物品。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">私人物品</strong>：既有排他性又有消费竞争性的物品（private goods），例：冰淇淋蛋卷、衣服、拥挤的收费道路；经济中大多数物品属此类，前面各章的供求与效率分析隐含假设物品为私人物品。"},{"t":"公共物品：既无排他性又无消费竞争性的物品（public goods），例：小镇的龙卷风警报器、国防、不拥挤的不收费道路。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公共物品</strong>：既无排他性又无消费竞争性的物品（public goods），例：小镇的龙卷风警报器、国防、不拥挤的不收费道路。"},{"t":"公共资源：有消费竞争性但无排他性的物品（common resources），例：海洋中的鱼、环境、拥挤的不收费道路。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公共资源</strong>：有消费竞争性但无排他性的物品（common resources），例：海洋中的鱼、环境、拥挤的不收费道路。"},{"t":"俱乐部物品：有排他性但无消费竞争性的物品（club goods），例：消防（消防部门可以袖手旁观让房子烧掉，但多保护一所房子的额外成本微不足道）、有线电视、不拥挤的收费道路——它是自然垄断的一种类型（第15章再讨论）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">俱乐部物品</strong>：有排他性但无消费竞争性的物品（club goods），例：消防（消防部门可以袖手旁观让房子烧掉，但多保护一所房子的额外成本微不足道）、有线电视、不拥挤的收费道路——它是自然垄断的一种类型（第15章再讨论）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">四分类矩阵</strong>（排他性×竞争性）："},{"t":"类型间的界线有时模糊：排他性与竞争性往往是程度问题——海洋中的鱼因监督困难几乎无排他性，但足够多的海岸卫队可使其至少部分排他；渔民相对鱼群很少时竞争性也很小。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">类型间的界线有时模糊</strong>：排他性与竞争性往往是程度问题——海洋中的鱼因监督困难几乎无排他性，但足够多的海岸卫队可使其至少部分排他；渔民相对鱼群很少时竞争性也很小。"},{"t":"本章考察没有排他性的物品（公共物品与公共资源），它们都可免费得到，因而与外部性研究密切相关：提供公共物品（如警报器）给别人带来不花钱的好处是正外部性，使用公共资源（捕鱼）使别人可捕的鱼减少是负外部性；由于这些外部效应，私人决策无效率，政府干预可潜在地增进经济福利。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章考察没有排他性的物品</strong>（公共物品与公共资源），它们都可免费得到，因而与外部性研究密切相关：提供公共物品（如警报器）给别人带来不花钱的好处是正外部性，使用公共资源（捕鱼）使别人可捕的鱼减少是负外部性；由于这些外部效应，私人决策无效率，政府干预可潜在地增进经济福利。"}],"k":"sec","i":0,"h":"11.1 不同类型的物品"},{"t":"11.2 公共物品","c":[{"t":"以烟火表演说明公共物品问题：阻止某人看烟火不可能（无排他性），一人欣赏不减他人乐趣（无竞争性）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">以烟火表演说明公共物品问题</strong>：阻止某人看烟火不可能（无排他性），一人欣赏不减他人乐趣（无竞争性）。"},{"t":"11.2.1 搭便车者问题","c":[{"t":"小镇500个居民每人愿为烟火表演付10美元（总收益5000美元），成本1000美元，故举办是有效率的；但企业家 Ella 卖票会遇到麻烦——没有排他性，人们不买票也能看。","c":[],"k":"b","i":2,"h":"小镇500个居民每人愿为烟火表演付10美元（总收益5000美元），成本1000美元，故举办是有效率的；但企业家 Ella 卖票会遇到麻烦——没有排他性，人们不买票也能看。"},{"t":"搭便车者：得到一种物品的收益但避免为此付费的人（free rider）；搭便车激励使市场不能提供有效率的结果——Ella 做出不举办的决定，从私人看理性、从社会看无效率（正外部收益未被她计入）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">搭便车者</strong>：得到一种物品的收益但避免为此付费的人（free rider）；搭便车激励使市场不能提供有效率的结果——Ella 做出不举办的决定，从私人看理性、从社会看无效率（正外部收益未被她计入）。"},{"t":"解决方法显而易见：镇政府向每人征2美元税雇 Ella 放烟火，每人福利增加8美元（评价10美元减税收2美元）；一般结论——由于搭便车者问题，私人市场无法提供公共物品，但政府若确信总收益大于总成本，就可以提供该物品并用税收支付，使每个人状况变好（美国许多地方政府确实为7月4日烟火付费）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解决方法显而易见</strong>：镇政府向每人征2美元税雇 Ella 放烟火，每人福利增加8美元（评价10美元减税收2美元）；一般结论——由于搭便车者问题，私人市场无法提供公共物品，但政府若确信总收益大于总成本，就可以提供该物品并用税收支付，使每个人状况变好（美国许多地方政府确实为7月4日烟火付费）。"}],"k":"b","i":1,"h":"11.2.1 搭便车者问题"},{"t":"11.2.2 一些重要的公共物品","c":[{"t":"国防：典型例子——一旦有了国防就无法阻止任何人享受其收益，也不减少他人收益；也是最贵的公共物品之一（2014年美国联邦国防支出7480亿美元、人均2346美元以上），即使主张小政府的经济学家也同意国防应由政府提供。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">国防</strong>：典型例子——一旦有了国防就无法阻止任何人享受其收益，也不减少他人收益；也是最贵的公共物品之一（2014年美国联邦国防支出7480亿美元、人均2346美元以上），即使主张小政府的经济学家也同意国防应由政府提供。"},{"t":"基础研究：需区分特定技术知识（发明长效电池、更小芯片等，可申请专利，专利使知识具有排他性）与一般性知识（数学定理一旦证明就进入人人可免费使用的社会知识库，无排他性也无竞争性，是公共物品）；企业有搭便车激励，对基础研究投入过少，故政府通过国立卫生研究院（NIH）、国家科学基金会（NSF）等补贴基础研究；确定合适的支持水平很困难（收益难衡量、分配资金的议员缺乏科学专业知识），公共部门支持不当不必大惊小怪。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">基础研究</strong>：需区分特定技术知识（发明长效电池、更小芯片等，可申请专利，专利使知识具有排他性）与一般性知识（数学定理一旦证明就进入人人可免费使用的社会知识库，无排他性也无竞争性，是公共物品）；企业有搭便车激励，对基础研究投入过少，故政府通过国立卫生研究院（NIH）、国家科学基金会（NSF）等补贴基础研究；确定合适的支持水平很困难（收益难衡量、分配资金的议员缺乏科学专业知识），公共部门支持不当不必大惊小怪。"},{"t":"反贫困：福利制度（TANF，贫困家庭临时援助）、食品券计划（SNAP，补充营养援助计划）、各种住房计划，向富裕家庭征税筹资；支持者视反贫困为公共物品——享受无贫困的社会既无竞争性也无排他性，私人慈善面临搭便车问题，政府通过向富人征税提高穷人生活水平可使所有人（包括纳税人）状况变好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反贫困</strong>：福利制度（TANF，贫困家庭临时援助）、食品券计划（SNAP，补充营养援助计划）、各种住房计划，向富裕家庭征税筹资；支持者视反贫困为公共物品——享受无贫困的社会既无竞争性也无排他性，私人慈善面临搭便车问题，政府通过向富人征税提高穷人生活水平可使所有人（包括纳税人）状况变好。"},{"t":"案例研究要点（灯塔是公共物品吗）：物品可在公共物品与私人物品之间转换——小镇烟火表演是公共物品，迪士尼公园的烟火因收门票更像私人物品；19世纪英国一些私人灯塔不向船长收费而向附近港口所有者收费（不付费就关灯、船只避开该港口）；判断一种物品是否公共物品，必须确定谁是受益者以及能否把受益者排除在外——受益者众多且无法排除时出现搭便车者问题，主要受益者只有港口所有者时更像私人物品。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究要点</strong>（灯塔是公共物品吗）：物品可在公共物品与私人物品之间转换——小镇烟火表演是公共物品，迪士尼公园的烟火因收门票更像私人物品；19世纪英国一些私人灯塔不向船长收费而向附近港口所有者收费（不付费就关灯、船只避开该港口）；判断一种物品是否公共物品，必须确定谁是受益者以及能否把受益者排除在外——受益者众多且无法排除时出现搭便车者问题，主要受益者只有港口所有者时更像私人物品。"}],"k":"b","i":1,"h":"11.2.2 一些重要的公共物品"},{"t":"11.2.3 成本—收益分析的难题","c":[{"t":"成本—收益分析：比较提供一种公共物品的社会成本与社会收益的研究（cost-benefit analysis），由经济学家与工程师小组进行，用于决定是否修高速公路等公共项目。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成本—收益分析</strong>：比较提供一种公共物品的社会成本与社会收益的研究（cost-benefit analysis），由经济学家与工程师小组进行，用于决定是否修高速公路等公共项目。"},{"t":"难题：公共物品免费使用、没有判断其价值的价格信号；问卷调查不可靠——回答者没有如实回答的激励，使用者有夸大收益的激励，受损害者有夸大成本的激励；因此有效率地提供公共物品本质上比私人物品更困难（私人物品市场上买者用愿意支付的价格显示评价、卖者用愿意接受的价格显示成本），政府得出的结论充其量只是一种近似。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">难题</strong>：公共物品免费使用、没有判断其价值的价格信号；问卷调查不可靠——回答者没有如实回答的激励，使用者有夸大收益的激励，受损害者有夸大成本的激励；因此有效率地提供公共物品本质上比私人物品更困难（私人物品市场上买者用愿意支付的价格显示评价、卖者用愿意接受的价格显示成本），政府得出的结论充其量只是一种近似。"},{"t":"案例研究要点（一条生命值多少钱）：小镇花1万美元装红绿灯可使致命事故危险从1.6%降到1.1%；\"生命无价\"会导致每个路口都装红绿灯的荒谬结论，\"按未来收入计价\"会得出退休者残疾人生命无价值的荒诞结论；较好的方法是观察人们自愿冒的危险（比较不同死亡风险职业的工资），估得一个人生命价值约1000万美元；预期收益＝0.5%×1000万＝5万美元大于成本1万美元，应批准项目。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究要点</strong>（一条生命值多少钱）：小镇花1万美元装红绿灯可使致命事故危险从1.6%降到1.1%；&quot;生命无价&quot;会导致每个路口都装红绿灯的荒谬结论，&quot;按未来收入计价&quot;会得出退休者残疾人生命无价值的荒诞结论；较好的方法是观察人们自愿冒的危险（比较不同死亡风险职业的工资），估得一个人生命价值约1000万美元；预期收益＝0.5%×1000万＝5万美元大于成本1万美元，应批准项目。"}],"k":"b","i":1,"h":"11.2.3 成本—收益分析的难题"}],"k":"sec","i":0,"h":"11.2 公共物品"},{"t":"11.3 公共资源","c":[{"t":"公共资源与公共物品一样没有排他性（想用就可免费用），但有消费中的竞争性，因此带来的新问题是：一旦物品被提供，决策者需要关注它被使用了多少。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">公共资源与公共物品一样没有排他性</strong>（想用就可免费用），但有消费中的竞争性，因此带来的新问题是：一旦物品被提供，决策者需要关注它被使用了多少。"},{"t":"11.3.1 公地悲剧","c":[{"t":"公地悲剧：一个说明从整个社会的角度看，为什么公共资源的使用大于合意水平的寓言（Tragedy of the Commons）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公地悲剧</strong>：一个说明从整个社会的角度看，为什么公共资源的使用大于合意水平的寓言（Tragedy of the Commons）。"},{"t":"中世纪小镇在镇公地放羊：土地广阔时公地不具竞争性，免费放羊没问题；人口与羊群增加而土地固定，最终土地寸草不生，羊毛业消失、家庭失去生计。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">中世纪小镇在镇公地放羊</strong>：土地广阔时公地不具竞争性，免费放羊没问题；人口与羊群增加而土地固定，最终土地寸草不生，羊毛业消失、家庭失去生计。"},{"t":"原因在于社会激励与私人激励不同：避免草地毁坏需要牧羊人集体行动，但没有一个家庭有减少自家羊群的激励（每家羊群只是问题的一小部分）——公地悲剧的本质是负外部性：一家羊群吃草降低了其他家庭可得到的土地质量，而决定养多少羊时没人考虑这种外部性，导致羊过多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原因在于社会激励与私人激励不同</strong>：避免草地毁坏需要牧羊人集体行动，但没有一个家庭有减少自家羊群的激励（每家羊群只是问题的一小部分）——公地悲剧的本质是负外部性：一家羊群吃草降低了其他家庭可得到的土地质量，而决定养多少羊时没人考虑这种外部性，导致羊过多。"},{"t":"解决方法：小镇可管制每家羊群数量、对羊征税把外部性内在化、拍卖数量有限的牧羊许可证（即现代社会解决污染的方法）；更简单的是把土地分给各家庭用栅栏圈起来，使土地成为私人物品（17世纪英国圈地运动的实际结果）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解决方法</strong>：小镇可管制每家羊群数量、对羊征税把外部性内在化、拍卖数量有限的牧羊许可证（即现代社会解决污染的方法）；更简单的是把土地分给各家庭用栅栏圈起来，使土地成为私人物品（17世纪英国圈地运动的实际结果）。"},{"t":"一般结论：公共资源因负外部性往往被过度使用；政府可用管制或税收减少消耗，有时也可把公共资源变为私人物品。亚里士多德早已指出：\"大家公有的东西总是被关心得最少，因为所有人对自己东西的关心都大于对与其他人共同拥有的东西的关心。\"","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般结论</strong>：公共资源因负外部性往往被过度使用；政府可用管制或税收减少消耗，有时也可把公共资源变为私人物品。亚里士多德早已指出：&quot;大家公有的东西总是被关心得最少，因为所有人对自己东西的关心都大于对与其他人共同拥有的东西的关心。&quot;"}],"k":"b","i":1,"h":"11.3.1 公地悲剧"},{"t":"11.3.2 一些重要的公共资源","c":[{"t":"清洁的空气和水：市场没有充分保护环境，清新空气与洁净的水和开放草地一样是公共资源，过度污染与过度放牧一样——环境恶化是现代社会的\"公地悲剧\"（可用管制或矫正税解决）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">清洁的空气和水</strong>：市场没有充分保护环境，清新空气与洁净的水和开放草地一样是公共资源，过度污染与过度放牧一样——环境恶化是现代社会的&quot;公地悲剧&quot;（可用管制或矫正税解决）。"},{"t":"拥堵的道路：道路可以是公共物品也可以是公共资源——不拥堵时一人使用不影响他人（无竞争性，公共物品），拥堵时一人开车使别人开得更慢（负外部性，公共资源）；对策：收通行费（本质上是对拥堵外部性的矫正税，伦敦、斯德哥尔摩行之有效）、上下班高峰期收更高费激励错峰、以及作为互补品的汽油税；汽油税不完美，因为它也抑制在不拥堵道路上的开车（那里并无外部性）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">拥堵的道路</strong>：道路可以是公共物品也可以是公共资源——不拥堵时一人使用不影响他人（无竞争性，公共物品），拥堵时一人开车使别人开得更慢（负外部性，公共资源）；对策：收通行费（本质上是对拥堵外部性的矫正税，伦敦、斯德哥尔摩行之有效）、上下班高峰期收更高费激励错峰、以及作为互补品的汽油税；汽油税不完美，因为它也抑制在不拥堵道路上的开车（那里并无外部性）。"},{"t":"新闻摘录要点（收费公路案例/拥堵定价）：拥堵定价＝交通越拥堵收费越高直至拥堵消失；免费而拥堵的道路意味着用排队时间付费（如苏联排队）；收费使拥堵外部性内在化——部分车转向不拥堵时段路段、部分不再出行；可变收费（感应器实时调价）可保持45英里以上时速、提高道路吞吐量；华盛顿州167号公路曾出现5.75美元的最高收费，为司机节省27分钟。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新闻摘录要点</strong>（收费公路案例/拥堵定价）：拥堵定价＝交通越拥堵收费越高直至拥堵消失；免费而拥堵的道路意味着用排队时间付费（如苏联排队）；收费使拥堵外部性内在化——部分车转向不拥堵时段路段、部分不再出行；可变收费（感应器实时调价）可保持45英里以上时速、提高道路吞吐量；华盛顿州167号公路曾出现5.75美元的最高收费，为司机节省27分钟。"},{"t":"鱼、鲸和其他野生动物：任何人都可以捕捉，人们很少有为下一年维系物种的激励，过度捕捞可摧毁有商业价值的海洋生物；海洋是受管制最少的公共资源——解决难在需要不同价值观国家间的国际合作、海洋浩瀚使协议难以实施，捕鱼权常引起国际紧张；美国国内用捕鱼打猎许可证收费、规定季节期限、要求放回小鱼、限制捕杀数量等减少使用、维持种群。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">鱼、鲸和其他野生动物</strong>：任何人都可以捕捉，人们很少有为下一年维系物种的激励，过度捕捞可摧毁有商业价值的海洋生物；海洋是受管制最少的公共资源——解决难在需要不同价值观国家间的国际合作、海洋浩瀚使协议难以实施，捕鱼权常引起国际紧张；美国国内用捕鱼打猎许可证收费、规定季节期限、要求放回小鱼、限制捕杀数量等减少使用、维持种群。"},{"t":"案例研究要点（为什么奶牛没有绝种）：野牛（1900年前后仅剩约400头）与大象因商业价值遭滥杀，奶牛同样有商业价值却无绝种之忧——差别在于大象是公共资源（不属任何人，偷猎者无维护种群激励），奶牛是私人物品（牧场主从维持牛群中获益）；肯尼亚等国禁猎难实施且大象继续减少，博茨瓦纳等国允许捕杀自己所有的大象（使之成为私物品），土地所有者有了保护激励，大象数量开始增加——私有制与利润动机可化解公共资源悲剧。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究要点</strong>（为什么奶牛没有绝种）：野牛（1900年前后仅剩约400头）与大象因商业价值遭滥杀，奶牛同样有商业价值却无绝种之忧——差别在于大象是公共资源（不属任何人，偷猎者无维护种群激励），奶牛是私人物品（牧场主从维持牛群中获益）；肯尼亚等国禁猎难实施且大象继续减少，博茨瓦纳等国允许捕杀自己所有的大象（使之成为私物品），土地所有者有了保护激励，大象数量开始增加——私有制与利润动机可化解公共资源悲剧。"}],"k":"b","i":1,"h":"11.3.2 一些重要的公共资源"}],"k":"sec","i":0,"h":"11.3 公共资源"},{"t":"11.4 结论：产权的重要性","c":[{"t":"本章与上一章的共同主题：市场之所以不能充分提供某些\"物品\"（清洁空气、国防），是因为没有很好地确立产权——某些有价值的东西没有法律上认定的、有权控制它并从中获利的所有者：没人能因工厂排污而向它收费，也没人能因提供国防保卫而收费。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章与上一章的共同主题</strong>：市场之所以不能充分提供某些&quot;物品&quot;（清洁空气、国防），是因为没有很好地确立产权——某些有价值的东西没有法律上认定的、有权控制它并从中获利的所有者：没人能因工厂排污而向它收费，也没人能因提供国防保卫而收费。"},{"t":"政府的三种潜在解决方法：帮助界定产权从而释放市场力量（如出售污染许可证）；对私人行为进行管制（如限制捕猎季节）；直接提供市场不能提供的物品（如国防）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">政府的三种潜在解决方法</strong>：帮助界定产权从而释放市场力量（如出售污染许可证）；对私人行为进行管制（如限制捕猎季节）；直接提供市场不能提供的物品（如国防）。"},{"t":"如果政策能得到很好的计划和实施，就可以使资源配置更有效率，从而增进经济福利。","c":[],"k":"b","i":1,"h":"如果政策能得到很好的计划和实施，就可以使资源配置更有效率，从而增进经济福利。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">11.4 结论</strong>：产权的重要性"}],"k":"chap","h":"第11章 公共物品和公共资源"},{"t":"第12章 税制的设计","c":[{"t":"本章内容提要","c":[{"t":"美国政府用各种税收筹集收入：联邦政府最重要的税是个人所得税和用于社会保险的工薪税；州与地方政府最重要的税是销售税和财产税。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">美国政府用各种税收筹集收入</strong>：联邦政府最重要的税是个人所得税和用于社会保险的工薪税；州与地方政府最重要的税是销售税和财产税。"},{"t":"税制的效率是指它给纳税人带来的成本：除资源从纳税人向政府的转移外，税收还有两种成本——税收扭曲激励、扭曲资源配置带来的无谓损失，以及为遵从税法而承担的管理负担。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">税制的效率是指它给纳税人带来的成本</strong>：除资源从纳税人向政府的转移外，税收还有两种成本——税收扭曲激励、扭曲资源配置带来的无谓损失，以及为遵从税法而承担的管理负担。"},{"t":"税制的平等涉及税收负担是否公平地在个人之间分配：按受益原则，人们根据从政府服务中得到的收益纳税是公平的；按支付能力原则，人们按承受财务负担的能力纳税是公平的（其两个推论是纵向平等与横向平等）。","c":[],"k":"b","i":1,"h":"税制的平等涉及税收负担是否公平地在个人之间分配：按受益原则，人们根据从政府服务中得到的收益纳税是公平的；按支付能力原则，人们按承受财务负担的能力纳税是公平的（其两个推论是纵向平等与横向平等）。"},{"t":"评价税制平等性时须记住税收归宿研究的结论：税收负担的分配与税单的分配并不相同。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">评价税制平等性时须记住税收归宿研究的结论</strong>：税收负担的分配与税单的分配并不相同。"},{"t":"考虑税法变动时，决策者经常面临效率与平等之间的权衡取舍；大多数关于税收政策的争论是因为人们对这两个目标的侧重不同。","c":[],"k":"b","i":1,"h":"考虑税法变动时，决策者经常面临效率与平等之间的权衡取舍；大多数关于税收政策的争论是因为人们对这两个目标的侧重不同。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"12.1 美国政府的税收概况","c":[{"t":"政府规模：过去一个世纪中政府作用大大加强，1902年政府收入约占总收入的7%，近年约占30%；随经济中收入增长，政府税收收入增长得更快。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">政府规模</strong>：过去一个世纪中政府作用大大加强，1902年政府收入约占总收入的7%，近年约占30%；随经济中收入增长，政府税收收入增长得更快。"},{"t":"国际比较：与大多数发达国家相比，美国税收负担较轻；许多欧洲国家税收负担高得多，这些税收支持了更慷慨的社会保障网（对穷人和失业者更多收入支持）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">国际比较</strong>：与大多数发达国家相比，美国税收负担较轻；许多欧洲国家税收负担高得多，这些税收支持了更慷慨的社会保障网（对穷人和失业者更多收入支持）。"},{"t":"12.1.1 联邦政府筹集的税收","c":[{"t":"总量：联邦政府收取美国经济中约三分之二的税收；2014年总收入约33000亿美元（表列总计32650亿），平均每个美国人纳税10235美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总量</strong>：联邦政府收取美国经济中约三分之二的税收；2014年总收入约33000亿美元（表列总计32650亿），平均每个美国人纳税10235美元。"},{"t":"个人所得税：联邦政府最大的收入来源（2014年占43%）；应纳税收入=总收入−按抚养人口计算的扣除−可扣除支出（如住房抵押贷款利息、州与地方税收、慈善捐赠），再按累进税率表计算纳税义务；表中每种税率只适用于对应范围内的收入，而非全部收入（收入100万美元的人第一个9075美元也只缴10%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个人所得税</strong>：联邦政府最大的收入来源（2014年占43%）；应纳税收入=总收入−按抚养人口计算的扣除−可扣除支出（如住房抵押贷款利息、州与地方税收、慈善捐赠），再按累进税率表计算纳税义务；表中每种税率只适用于对应范围内的收入，而非全部收入（收入100万美元的人第一个9075美元也只缴10%）。"},{"t":"工薪税（社会保险税）：对企业和工人支付的工资征收，重要性几乎与个人所得税相同（占35%）；收入专门用于社会保障（维持老年人生活水平的收入支持计划）和医疗保障（老年人的政府保健计划）；2014年年收入117000美元以下部分税率15.3%、超过部分2.9%，高收入者额外缴0.9%；对许多中产家庭是最大的税收种类。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工薪税</strong>（社会保险税）：对企业和工人支付的工资征收，重要性几乎与个人所得税相同（占35%）；收入专门用于社会保障（维持老年人生活水平的收入支持计划）和医疗保障（老年人的政府保健计划）；2014年年收入117000美元以下部分税率15.3%、超过部分2.9%，高收入者额外缴0.9%；对许多中产家庭是最大的税收种类。"},{"t":"公司所得税：对公司利润（出售物品与服务的收入减去成本）征收（占13%）；公司利润实际要交两次税——企业赚利润时缴公司所得税，用利润向股东支付股息时再缴个人所得税；作为部分补偿，股息收入适用较低税率（2014年最高20%另加3.8%医疗保险税，而普通收入最高39.6%另加3.8%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公司所得税</strong>：对公司利润（出售物品与服务的收入减去成本）征收（占13%）；公司利润实际要交两次税——企业赚利润时缴公司所得税，用利润向股东支付股息时再缴个人所得税；作为部分补偿，股息收入适用较低税率（2014年最高20%另加3.8%医疗保险税，而普通收入最高39.6%另加3.8%）。"},{"t":"其他税收（占9%）：包括对汽油、香烟、酒精饮料等征收的特种物品销售税（excise tax），以及不动产税、关税等小税种。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">其他税收</strong>（占9%）：包括对汽油、香烟、酒精饮料等征收的特种物品销售税（excise tax），以及不动产税、关税等小税种。"}],"k":"b","i":1,"h":"12.1.1 联邦政府筹集的税收"},{"t":"12.1.2 州与地方政府筹集的税收","c":[{"t":"总量：州与地方政府筹集的税收约占全部税收收入的三分之一；2014年总收入22250亿美元，人均6975美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总量</strong>：州与地方政府筹集的税收约占全部税收收入的三分之一；2014年总收入22250亿美元，人均6975美元。"},{"t":"销售税（sales tax）：按消费者购买零售商品总支出的百分比征收，顾客付款时支付、由店主交给政府（有些州对食物和衣服等必需品免税）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">销售税</strong>（sales tax）：按消费者购买零售商品总支出的百分比征收，顾客付款时支付、由店主交给政府（有些州对食物和衣服等必需品免税）。"},{"t":"财产税（property tax）：按土地和建筑物估算价值的百分比征收，由财产所有者支付；销售税与财产税合计占州与地方全部收入的40%以上。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">财产税</strong>（property tax）：按土地和建筑物估算价值的百分比征收，由财产所有者支付；销售税与财产税合计占州与地方全部收入的40%以上。"},{"t":"州与地方政府还征收个人所得税（占17%）和公司所得税（占3%），各州差异大（有的州工资税率远低于利息股息税率，有的州根本不对收入征税）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">州与地方政府还征收个人所得税</strong>（占17%）和公司所得税（占3%），各州差异大（有的州工资税率远低于利息股息税率，有的州根本不对收入征税）。"},{"t":"联邦政府资金（占22%）：是高收入州向低收入州的再分配，多指定用于联邦想补贴的计划（如医疗援助Medicaid，州管理、联邦出大部分钱）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">联邦政府资金</strong>（占22%）：是高收入州向低收入州的再分配，多指定用于联邦想补贴的计划（如医疗援助Medicaid，州管理、联邦出大部分钱）。"},{"t":"其他收入（占14%）：捕鱼与打猎许可证收费、道路与桥梁收费、公共汽车和地铁收费等。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">其他收入</strong>（占14%）：捕鱼与打猎许可证收费、道路与桥梁收费、公共汽车和地铁收费等。"}],"k":"b","i":1,"h":"12.1.2 州与地方政府筹集的税收"}],"k":"sec","i":0,"h":"12.1 美国政府的税收概况"},{"t":"12.2 税收和效率","c":[{"t":"两个目标：设计税制时决策者有效率和平等两个目标；若一种税制能以对纳税人较低的成本筹集到与另一种税制等量的收入，它就更有效率。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">两个目标</strong>：设计税制时决策者有效率和
