无差异曲线做决策；但消费者选择理论并不旨在精确描述决策过程，它只是一个模型（模型不必完全符合现实）。"},{"t":"正确看待方式：把它当作消费者如何做决策的比喻——消费者知道选择受财力约束，并在约束既定时尽其所能达到最高满足程度；该理论用清晰的经济学分析方法描述这种隐含的心理过程。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">正确看待方式</strong>：把它当作消费者如何做决策的比喻——消费者知道选择受财力约束，并在约束既定时尽其所能达到最高满足程度；该理论用清晰的经济学分析方法描述这种隐含的心理过程。"},{"t":"布丁好不好吃了才知道，对理论的检验在于其运用：本章已将其用于需求曲线、劳动供给与储蓄三个实际问题；在高级经济学课程中它将为更多分析提供框架。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">布丁好不好吃了才知道，对理论的检验在于其运用</strong>：本章已将其用于需求曲线、劳动供给与储蓄三个实际问题；在高级经济学课程中它将为更多分析提供框架。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">21.5 结论</strong>：人们真的这样想吗"}],"k":"chap","h":"第21章 消费者选择理论"},{"t":"第22章 微观经济学前沿","c":[{"t":"本章内容提要","c":[{"t":"在许多经济交易中，信息是不对称的：当存在隐蔽性行为时，委托人面临代理人的道德风险问题；当存在隐蔽性特征时，买者面临卖者的逆向选择问题；私人市场有时用发信号和筛选来应对不对称信息。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">在许多经济交易中，信息是不对称的</strong>：当存在隐蔽性行为时，委托人面临代理人的道德风险问题；当存在隐蔽性特征时，买者面临卖者的逆向选择问题；私人市场有时用发信号和筛选来应对不对称信息。"},{"t":"虽然政府政策有时可以改善市场结果，但政府本身也是不完善的制度：康多塞悖论说明多数原则并不能产生可传递的社会偏好，阿罗不可能性定理说明没有一种投票制度是完美的；许多情况下民主制度将产生中值选民想要的结果，而无论其他选民的偏好是什么；决定政府政策的人也受到利己而不是国家利益的驱动。","c":[],"k":"b","i":1,"h":"虽然政府政策有时可以改善市场结果，但政府本身也是不完善的制度：康多塞悖论说明多数原则并不能产生可传递的社会偏好，阿罗不可能性定理说明没有一种投票制度是完美的；许多情况下民主制度将产生中值选民想要的结果，而无论其他选民的偏好是什么；决定政府政策的人也受到利己而不是国家利益的驱动。"},{"t":"心理学和经济学的研究表明，人的决策比传统经济理论所假设的要复杂：人们并不总是理性的，他们关心经济结果的公正性（即使对他们自己有不利影响），而且可能具有前后不一致性。","c":[],"k":"b","i":1,"h":"心理学和经济学的研究表明，人的决策比传统经济理论所假设的要复杂：人们并不总是理性的，他们关心经济结果的公正性（即使对他们自己有不利影响），而且可能具有前后不一致性。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"22.1 不对称信息","c":[{"t":"引论：正如\"我知道一些你不知道的事\"所揭示的，一个人经常对正在发生的事知道得比另一个人多；信息不对称普遍存在，研究它有助于解释从二手车市场到送礼物习俗等许多现实事情。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">引论</strong>：正如&quot;我知道一些你不知道的事&quot;所揭示的，一个人经常对正在发生的事知道得比另一个人多；信息不对称普遍存在，研究它有助于解释从二手车市场到送礼物习俗等许多现实事情。"},{"t":"术语：信息不对称（asymmetric information）——人们在获得与相互影响相关的知识上的差别；例：工人对自己投入工作的精力比雇主知道得多，二手车卖者对车况的了解比买者多。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：信息不对称（asymmetric information）——人们在获得与相互影响相关的知识上的差别；例：工人对自己投入工作的精力比雇主知道得多，二手车卖者对车况的了解比买者多。"},{"t":"术语：隐蔽性行为（hidden action）——一方难以被另一方观察到的行为（如工人干活的卖力程度），引出道德风险问题。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：隐蔽性行为（hidden action）——一方难以被另一方观察到的行为（如工人干活的卖力程度），引出道德风险问题。"},{"t":"术语：隐蔽性特征（hidden characteristic）——一方难以被另一方观察到的特征（如二手车的车况），引出逆向选择问题。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：隐蔽性特征（hidden characteristic）——一方难以被另一方观察到的特征（如二手车的车况），引出逆向选择问题。"},{"t":"共同结构：没有信息的一方（雇主、买车者）都想知道相关信息，有信息的一方（工人、卖车者）都有掩盖这些信息的激励。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">共同结构</strong>：没有信息的一方（雇主、买车者）都想知道相关信息，有信息的一方（工人、卖车者）都有掩盖这些信息的激励。"},{"t":"22.1.1 隐蔽性行为：委托人、代理人及道德风险","c":[{"t":"术语：道德风险（moral hazard）——一个没有受到完全监督的人从事不诚实或不合意行为的倾向。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：道德风险（moral hazard）——一个没有受到完全监督的人从事不诚实或不合意行为的倾向。"},{"t":"术语：代理人（agent）——为另一个人（称为委托人）完成某种行为的人。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：代理人（agent）——为另一个人（称为委托人）完成某种行为的人。"},{"t":"术语：委托人（principal）——让另一个人（称为代理人）完成某种行为的人。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：委托人（principal）——让另一个人（称为代理人）完成某种行为的人。"},{"t":"机制：代理人代表委托人完成工作时，若委托人不能完全监督代理人的行为，代理人就倾向于不会像委托人期望的那样努力；\"道德风险\"指代理人从事不适当或不道德行为的风险，委托人要设法激励代理人更负责地行事。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机制</strong>：代理人代表委托人完成工作时，若委托人不能完全监督代理人的行为，代理人就倾向于不会像委托人期望的那样努力；&quot;道德风险&quot;指代理人从事不适当或不道德行为的风险，委托人要设法激励代理人更负责地行事。"},{"t":"经典例子（雇佣关系）：雇主是委托人，工人是代理人；工人在没有受到充分监督时责任心下降；雇主的三种反应——（1）更好的监督：安装隐蔽录像机，抓住监督者不在时的不负责行为；（2）高工资：根据效率工资理论（第19章）支付高于劳动市场均衡水平的工资，赚到高工资的工人因怕被解雇后找不到另一份高工资工作而不敢怠工；（3）延期支付：延迟支付部分报酬（如年终奖金、在工人生命后期支付更多报酬），怠工被发现并解雇会遭受较大惩罚；因此工资随年龄增加不仅反映经验增长，也是对道德风险的一种反映；三种机制可组合使用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经典例子</strong>（雇佣关系）：雇主是委托人，工人是代理人；工人在没有受到充分监督时责任心下降；雇主的三种反应——（1）更好的监督：安装隐蔽录像机，抓住监督者不在时的不负责行为；（2）高工资：根据效率工资理论（第19章）支付高于劳动市场均衡水平的工资，赚到高工资的工人因怕被解雇后找不到另一份高工资工作而不敢怠工；（3）延期支付：延迟支付部分报酬（如年终奖金、在工人生命后期支付更多报酬），怠工被发现并解雇会遭受较大惩罚；因此工资随年龄增加不仅反映经验增长，也是对道德风险的一种反映；三种机制可组合使用。"},{"t":"工作场所之外的例子：投保了火灾保险的房东可能购买过少灭火器（费用自担而利益大头归保险公司）；家庭可能选择住在洪水风险较高的河边（自享美景而灾难补贴成本由政府承担）；许多管制的目的正是解决此类问题（保险公司要求房东买灭火器、政府禁止在高风险土地上安家），但保险公司对房东谨慎程度、政府对家庭选址风险都没有完全信息，道德风险问题仍然存在。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工作场所之外的例子</strong>：投保了火灾保险的房东可能购买过少灭火器（费用自担而利益大头归保险公司）；家庭可能选择住在洪水风险较高的河边（自享美景而灾难补贴成本由政府承担）；许多管制的目的正是解决此类问题（保险公司要求房东买灭火器、政府禁止在高风险土地上安家），但保险公司对房东谨慎程度、政府对家庭选址风险都没有完全信息，道德风险问题仍然存在。"},{"t":"参考资料「公司管理」要点：从经济角度看，公司这种组织形式最重要的特点是所有权与控制权的分离——股东拥有公司并分享利润（委托人），管理者受雇做出资源配置决策（代理人）；CEO 和其他管理者最了解商业机会并承担实现利润最大化的任务，但他们可能有自己的目标（安逸的生活、豪华办公室与私人飞机、统治大企业帝国），并不总与股东目标一致；董事会负责雇用解雇高管并设计工资福利（按业绩发奖金、给股票期权）以使两种利益一致，但董事本身也是股东的代理人，委托-代理问题只是被转变（变成如何确保董事会按股东最大利益行事）；2005年安然、泰科、世通等公司高管从事损害股东利益以自肥的活动被认定有罪、解雇并入狱，一些股东因董事会监督不力提起诉讼；犯罪活动虽少见但只是冰山一角——只要所有权与控制权分离，股东与管理者的利益冲突就不可避免。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参考资料「公司管理」要点</strong>：从经济角度看，公司这种组织形式最重要的特点是所有权与控制权的分离——股东拥有公司并分享利润（委托人），管理者受雇做出资源配置决策（代理人）；CEO 和其他管理者最了解商业机会并承担实现利润最大化的任务，但他们可能有自己的目标（安逸的生活、豪华办公室与私人飞机、统治大企业帝国），并不总与股东目标一致；董事会负责雇用解雇高管并设计工资福利（按业绩发奖金、给股票期权）以使两种利益一致，但董事本身也是股东的代理人，委托-代理问题只是被转变（变成如何确保董事会按股东最大利益行事）；2005年安然、泰科、世通等公司高管从事损害股东利益以自肥的活动被认定有罪、解雇并入狱，一些股东因董事会监督不力提起诉讼；犯罪活动虽少见但只是冰山一角——只要所有权与控制权分离，股东与管理者的利益冲突就不可避免。"}],"k":"b","i":1,"h":"<strong class=\"lead\">22.1.1 隐蔽性行为</strong>：委托人、代理人及道德风险"},{"t":"22.1.2 隐蔽性特征：逆向选择和次品问题","c":[{"t":"术语：逆向选择（adverse selection）——从无信息一方的角度看，无法观察到的特征组合变为不合意的倾向。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：逆向选择（adverse selection）——从无信息一方的角度看，无法观察到的特征组合变为不合意的倾向。"},{"t":"机制：在卖者对所出售物品的特征了解得比买者多的市场上，买者要承担得到低质量物品的风险——从无信息买者的角度看，其\"选择\"可能是逆向的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机制</strong>：在卖者对所出售物品的特征了解得比买者多的市场上，买者要承担得到低质量物品的风险——从无信息买者的角度看，其&quot;选择&quot;可能是逆向的。"},{"t":"例一（二手车市场的次品问题）：卖者知道自己车的缺陷而买者通常不知道；最破旧二手车的车主比拥有最好二手车的车主更可能出售，买者担心得到\"次品\"，许多人干脆不去二手车市场买车——解释了为什么只使用几周的二手车比同型号新车价格低几千美元（买者推测卖者急于出手是因为知道一些买者不知道的情况）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例一</strong>（二手车市场的次品问题）：卖者知道自己车的缺陷而买者通常不知道；最破旧二手车的车主比拥有最好二手车的车主更可能出售，买者担心得到&quot;次品&quot;，许多人干脆不去二手车市场买车——解释了为什么只使用几周的二手车比同型号新车价格低几千美元（买者推测卖者急于出手是因为知道一些买者不知道的情况）。"},{"t":"例二（劳动市场，另一种效率工资理论）：工人的能力有差别，且他们比雇用自己的企业更了解自己的能力；企业降低工资时，能力较强的工人会离去（他们知道自己能找到更好的工作），因此企业选择支付高于均衡水平的工资以吸引更好的工人组合。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例二</strong>（劳动市场，另一种效率工资理论）：工人的能力有差别，且他们比雇用自己的企业更了解自己的能力；企业降低工资时，能力较强的工人会离去（他们知道自己能找到更好的工作），因此企业选择支付高于均衡水平的工资以吸引更好的工人组合。"},{"t":"例三（保险市场）：有较多隐蔽性健康问题的人比其他人更可能购买医疗保险，医疗保险的价格反映的是病人的成本而不是普通人的成本，高价格可能阻止拥有正常健康水平的人投保。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例三</strong>（保险市场）：有较多隐蔽性健康问题的人比其他人更可能购买医疗保险，医疗保险的价格反映的是病人的成本而不是普通人的成本，高价格可能阻止拥有正常健康水平的人投保。"},{"t":"看不见的手失灵：好二手车的车主宁肯保留自己的车也不低价卖给持怀疑态度的买者；劳动市场工资高于供求平衡水平引起失业；低风险买者因保单未反映其真实特征而选择不买保险——支持政府提供医疗保险的人有时把逆向选择作为不相信私人市场能自行提供合适数量医疗保险的原因。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">看不见的手失灵</strong>：好二手车的车主宁肯保留自己的车也不低价卖给持怀疑态度的买者；劳动市场工资高于供求平衡水平引起失业；低风险买者因保单未反映其真实特征而选择不买保险——支持政府提供医疗保险的人有时把逆向选择作为不相信私人市场能自行提供合适数量医疗保险的原因。"}],"k":"b","i":1,"h":"<strong class=\"lead\">22.1.2 隐蔽性特征</strong>：逆向选择和次品问题"},{"t":"22.1.3 为传递私人信息发信号","c":[{"t":"术语：发信号（signaling）——有信息的一方向无信息的一方披露自己私人信息的行动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：发信号（signaling）——有信息的一方向无信息的一方披露自己私人信息的行动。"},{"t":"有效信号的两个条件：（1）其成本必须高昂——如果信号免费，任何人都可以使用，它就传递不了信息；（2）对有高质量产品的人来说，信号必须成本更低或更有利——否则人人都有同样的使用激励，信号就不能说明什么。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有效信号的两个条件</strong>：（1）其成本必须高昂——如果信号免费，任何人都可以使用，它就传递不了信息；（2）对有高质量产品的人来说，信号必须成本更低或更有利——否则人人都有同样的使用激励，信号就不能说明什么。"},{"t":"例一（广告，第16章）：企业花钱做广告向潜在顾客发出有高质量产品的信号——好产品的企业从广告中得到更大利益（尝试过一次的顾客更可能成为经常性顾客），故其为广告付费是理性的，顾客把广告当作质量信息也是理性的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例一</strong>（广告，第16章）：企业花钱做广告向潜在顾客发出有高质量产品的信号——好产品的企业从广告中得到更大利益（尝试过一次的顾客更可能成为经常性顾客），故其为广告付费是理性的，顾客把广告当作质量信息也是理性的。"},{"t":"例二（教育，第19章）：学生获得大学学历向潜在雇主发出能力强的信号而不是为了提高生产率——有能力的人比没有能力的人更容易从学校毕业，故其为教育付费是理性的，雇主把学历当能力信息也是理性的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例二</strong>（教育，第19章）：学生获得大学学历向潜在雇主发出能力强的信号而不是为了提高生产率——有能力的人比没有能力的人更容易从学校毕业，故其为教育付费是理性的，雇主把学历当能力信息也是理性的。"},{"t":"两个例子的共同点：有信息的一方（企业、学生）都用信号让无信息的一方（顾客、雇主）相信自己正在提供高质量的东西。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个例子的共同点</strong>：有信息的一方（企业、学生）都用信号让无信息的一方（顾客、雇主）相信自己正在提供高质量的东西。"},{"t":"其他例子：杂志广告有时强调\"正如在电视上看到的\"——传递企业愿支付昂贵信号（电视广告时间）的意愿；精英学校的毕业生总是很有信心地在简历上列出所毕业的学校。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">其他例子</strong>：杂志广告有时强调&quot;正如在电视上看到的&quot;——传递企业愿支付昂贵信号（电视广告时间）的意愿；精英学校的毕业生总是很有信心地在简历上列出所毕业的学校。"},{"t":"案例研究「作为信号的礼物」：送礼物是一种反映不对称信息和发信号的习俗——男人拥有女朋友想知道的私人信息（他真的爱她吗），为她挑选一件好礼物是他的爱的信号；该行动代价高昂（需要时间），且代价取决于私人信息（他多爱她）：真爱则选礼物不难（时刻想着她），不爱则很难找到适当礼物；送现金表明他甚至懒得去试一试；这与\"感情深浅最受质疑时人们最在乎这一习俗\"的观察一致——给男/女朋友送现金很糟糕，而大学生收到父母的支票通常并不感觉被得罪，因为父母的爱不容置疑。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「作为信号的礼物」</strong>：送礼物是一种反映不对称信息和发信号的习俗——男人拥有女朋友想知道的私人信息（他真的爱她吗），为她挑选一件好礼物是他的爱的信号；该行动代价高昂（需要时间），且代价取决于私人信息（他多爱她）：真爱则选礼物不难（时刻想着她），不爱则很难找到适当礼物；送现金表明他甚至懒得去试一试；这与&quot;感情深浅最受质疑时人们最在乎这一习俗&quot;的观察一致——给男/女朋友送现金很糟糕，而大学生收到父母的支票通常并不感觉被得罪，因为父母的爱不容置疑。"}],"k":"b","i":1,"h":"22.1.3 为传递私人信息发信号"},{"t":"22.1.4 引起信息披露的筛选","c":[{"t":"术语：筛选（screening）——无信息的一方所采取的引起有信息的一方披露信息的行动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：筛选（screening）——无信息的一方所采取的引起有信息的一方披露信息的行动。"},{"t":"例一（常识性筛选）：买二手车的人要求这辆车在出售之前经过汽车技师检验——拒绝这个要求的卖者披露了他的车是次品的私人信息，买者会出一个低价或去寻找另一辆车。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例一</strong>（常识性筛选）：买二手车的人要求这辆车在出售之前经过汽车技师检验——拒绝这个要求的卖者披露了他的车是次品的私人信息，买者会出一个低价或去寻找另一辆车。"},{"t":"例二（保险公司自选保单）：保险公司想向安全驾驶的司机收低保费、向爱冒险的司机收高保费，但司机不会承认自己爱冒险，历史记录又不是预期未来风险的完美指标；办法是提供能使司机自行分开的两种保单——保险费较高但补偿任何一次事故全部费用的保单，与保险费较低但免赔1000美元的保单；免赔条款对爱冒险的司机负担更大（更可能发生事故），故免赔额足够大时，低保费含免赔的保单吸引安全司机、高保费全赔的保单吸引爱冒险司机，两类司机通过选择不同保单披露了自己的私人信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例二</strong>（保险公司自选保单）：保险公司想向安全驾驶的司机收低保费、向爱冒险的司机收高保费，但司机不会承认自己爱冒险，历史记录又不是预期未来风险的完美指标；办法是提供能使司机自行分开的两种保单——保险费较高但补偿任何一次事故全部费用的保单，与保险费较低但免赔1000美元的保单；免赔条款对爱冒险的司机负担更大（更可能发生事故），故免赔额足够大时，低保费含免赔的保单吸引安全司机、高保费全赔的保单吸引爱冒险司机，两类司机通过选择不同保单披露了自己的私人信息。"}],"k":"b","i":1,"h":"22.1.4 引起信息披露的筛选"},{"t":"22.1.5 不对称信息与公共政策","c":[{"t":"背景框架：市场成功与市场失灵之间的紧张关系是微观经济学的中心——供求均衡有效率（第7章，看不见的手似乎无所不能），但这一结论被外部性（第10章）、公共物品（第11章）、不完全竞争（第15—17章）和贫困（第20章）的研究弱化；不对称信息研究给出警惕市场的新理由：当一些人知道的比另一些人多时，市场不能使资源得到最好利用（好二手车难卖、健康人难得到低成本医疗保险）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景框架</strong>：市场成功与市场失灵之间的紧张关系是微观经济学的中心——供求均衡有效率（第7章，看不见的手似乎无所不能），但这一结论被外部性（第10章）、公共物品（第11章）、不完全竞争（第15—17章）和贫困（第20章）的研究弱化；不对称信息研究给出警惕市场的新理由：当一些人知道的比另一些人多时，市场不能使资源得到最好利用（好二手车难卖、健康人难得到低成本医疗保险）。"},{"t":"三个使政策复杂化的事实：（1）私人市场有时可以用发信号和筛选的组合自己解决不对称信息问题；（2）政府并不比私人各方拥有更多信息——市场结果虽不是最优的，却可能是可以达到的最好结果，决策者会发现很难改善所普遍承认的市场的不完美结果；（3）政府本身也是一种不完善的制度（见22.2）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三个使政策复杂化的事实</strong>：（1）私人市场有时可以用发信号和筛选的组合自己解决不对称信息问题；（2）政府并不比私人各方拥有更多信息——市场结果虽不是最优的，却可能是可以达到的最好结果，决策者会发现很难改善所普遍承认的市场的不完美结果；（3）政府本身也是一种不完善的制度（见22.2）。"},{"t":"即问即答要点（人寿保险）：预计购买人寿保险的人的死亡率高于普通人——有隐蔽性健康问题（特征）的人更可能投保，是逆向选择的例子；投保后投保人可能更不爱惜身体、从事风险活动（行为），是道德风险的例子；人寿保险公司通过体检等筛选手段、按风险差别定价等方式处理这些问题。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>（人寿保险）：预计购买人寿保险的人的死亡率高于普通人——有隐蔽性健康问题（特征）的人更可能投保，是逆向选择的例子；投保后投保人可能更不爱惜身体、从事风险活动（行为），是道德风险的例子；人寿保险公司通过体检等筛选手段、按风险差别定价等方式处理这些问题。"}],"k":"b","i":1,"h":"22.1.5 不对称信息与公共政策"}],"k":"sec","i":0,"h":"22.1 不对称信息"},{"t":"22.2 政治经济学","c":[{"t":"引论：市场依靠自身并不总能实现合意的资源配置，但在引入积极干预的政府之前需要考虑一个事实——政府也是一种不完善的机构。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">引论</strong>：市场依靠自身并不总能实现合意的资源配置，但在引入积极干预的政府之前需要考虑一个事实——政府也是一种不完善的机构。"},{"t":"术语：政治经济学（political economy，有时也被称为公共选择）——用经济学的分析方法研究政府如何运作的学科。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：政治经济学（political economy，有时也被称为公共选择）——用经济学的分析方法研究政府如何运作的学科。"},{"t":"22.2.1 康多塞投票悖论","c":[{"t":"背景：多数政策问题的可能结果往往超过两个（如新公园可建在许多地方）；18世纪法国政治理论家马奎斯·康多塞指出，用民主原则（多数获胜）选最好结果时会遇到问题。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：多数政策问题的可能结果往往超过两个（如新公园可建在许多地方）；18世纪法国政治理论家马奎斯·康多塞指出，用民主原则（多数获胜）选最好结果时会遇到问题。"},{"t":"术语：康多塞悖论（Condorcet paradox）——民主的多数原则并不能产生可传递的社会偏好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：康多塞悖论（Condorcet paradox）——民主的多数原则并不能产生可传递的社会偏好。"},{"t":"表22-1的例子：三类型选民（类型1占35%、类型2占45%、类型3占20%），偏好分别为 A＞B＞C、B＞C＞A、C＞A＞B；两两多数投票下，B 击败 C（类型1+2），A 击败 B（类型1+3），而 C 又击败 A（类型2+3）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表22-1的例子</strong>：三类型选民（类型1占35%、类型2占45%、类型3占20%），偏好分别为 A＞B＞C、B＞C＞A、C＞A＞B；两两多数投票下，B 击败 C（类型1+2），A 击败 B（类型1+3），而 C 又击败 A（类型2+3）。"},{"t":"违背传递性：传递性指如果 A 优于 B 而 B 优于 C，就应期望 A 优于 C；两两投票在某些情况下可能产生有传递性的社会偏好，但不能期望总可以这样。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">违背传递性</strong>：传递性指如果 A 优于 B 而 B 优于 C，就应期望 A 优于 C；两两投票在某些情况下可能产生有传递性的社会偏好，但不能期望总可以这样。"},{"t":"含义（议程影响结果）：先在 A、B 中选再将赢家与 C 比较，最终选 C；先在 B、C 中选再与 A 比较，选 A；先在 A、C 中选再与 B 比较，选 B。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">含义</strong>（议程影响结果）：先在 A、B 中选再将赢家与 C 比较，最终选 C；先在 B、C 中选再与 A 比较，选 A；先在 A、C 中选再与 B 比较，选 B。"},{"t":"两个结论：狭义结论——当有两种以上的选择时，确定议程（决定投票顺序）会对民主选举结果有重大影响；广义结论——多数投票本身并没有告诉我们社会真正想要什么结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个结论</strong>：狭义结论——当有两种以上的选择时，确定议程（决定投票顺序）会对民主选举结果有重大影响；广义结论——多数投票本身并没有告诉我们社会真正想要什么结果。"}],"k":"b","i":1,"h":"22.2.1 康多塞投票悖论"},{"t":"22.2.2 阿罗不可能性定理","c":[{"t":"博达计算（Borda count）：对两两多数投票的一种替代——每个选民对可能的结果排序赋分（排在最后得1分、倒数第二得2分、以此类推），总分最高的获胜；表22-1偏好下结果 B 胜出；常用于为运动队排序的投票。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">博达计算</strong>（Borda count）：对两两多数投票的一种替代——每个选民对可能的结果排序赋分（排在最后得1分、倒数第二得2分、以此类推），总分最高的获胜；表22-1偏好下结果 B 胜出；常用于为运动队排序的投票。"},{"t":"术语：阿罗不可能性定理（Arrow's impossibility theorem）——一个数学结论，它表明在某些假设条件之下，没有一种方案能把个人偏好加总为一组有效的社会偏好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：阿罗不可能性定理（Arrow&#x27;s impossibility theorem）——一个数学结论，它表明在某些假设条件之下，没有一种方案能把个人偏好加总为一组有效的社会偏好。"},{"t":"来源：经济学家肯尼思·阿罗1951年《社会选择与个人价值》；完美投票制度应具备的特征——确定性（如果每个人都对 A 的偏好大于 B，A 就击败 B）、传递性（A 击败 B、B 击败 C，则 A 一定击败 C）、不相关选择的独立性（A 与 B 之间的排序不应取决于是否存在某个第三种结果 C）、没有独裁者（没有一个人总能获胜而无论其他人偏好如何）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">来源</strong>：经济学家肯尼思·阿罗1951年《社会选择与个人价值》；完美投票制度应具备的特征——确定性（如果每个人都对 A 的偏好大于 B，A 就击败 B）、传递性（A 击败 B、B 击败 C，则 A 一定击败 C）、不相关选择的独立性（A 与 B 之间的排序不应取决于是否存在某个第三种结果 C）、没有独裁者（没有一个人总能获胜而无论其他人偏好如何）。"},{"t":"定理内容：阿罗从数学上证明，没有一种投票制度能满足所有这些看似合意的特征。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定理内容</strong>：阿罗从数学上证明，没有一种投票制度能满足所有这些看似合意的特征。"},{"t":"两个理解性例证：多数原则不满足传递性（康多塞悖论）；博达计算不满足不相关选择的独立性——表22-1中用博达计算 B 胜出，但若 C 消失、仅对 A 和 B 用博达计算则 A 获胜，即 A、B 之间的排序因不相关的 C 是否存在而改变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个理解性例证</strong>：多数原则不满足传递性（康多塞悖论）；博达计算不满足不相关选择的独立性——表22-1中用博达计算 B 胜出，但若 C 消失、仅对 A 和 B 用博达计算则 A 获胜，即 A、B 之间的排序因不相关的 C 是否存在而改变。"},{"t":"含义：这个结果既深刻又使人不安，但并不是说应该放弃民主这种政府运作方式；它表明无论社会采用哪一种投票方案把成员偏好加总，作为社会选择机制总是存在某些方面的缺陷。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">含义</strong>：这个结果既深刻又使人不安，但并不是说应该放弃民主这种政府运作方式；它表明无论社会采用哪一种投票方案把成员偏好加总，作为社会选择机制总是存在某些方面的缺陷。"}],"k":"b","i":1,"h":"22.2.2 阿罗不可能性定理"},{"t":"22.2.3 中值选民说了算","c":[{"t":"术语：中值选民定理（median voter theorem）——一个数学结论，表明如果要选民沿着一条线选一个点，而且每个选民都想选离他最偏好的点最近的点，那么多数原则将选出中值选民最偏好的点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：中值选民定理（median voter theorem）——一个数学结论，表明如果要选民沿着一条线选一个点，而且每个选民都想选离他最偏好的点最近的点，那么多数原则将选出中值选民最偏好的点。"},{"t":"中值选民：正处在分布中间的选民。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">中值选民</strong>：正处在分布中间的选民。"},{"t":"例子（图22-1）：100个选民就公共物品预算（0—200亿美元）投票，每个选民都偏爱离自己最偏好值较近的结果；中值选民想要100亿美元，平均偏好的结果（相加除以人数）是90亿美元，多数结果（最多选民偏好的结果）是150亿美元——多数原则产生的是中值选民的100亿美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（图22-1）：100个选民就公共物品预算（0—200亿美元）投票，每个选民都偏爱离自己最偏好值较近的结果；中值选民想要100亿美元，平均偏好的结果（相加除以人数）是90亿美元，多数结果（最多选民偏好的结果）是150亿美元——多数原则产生的是中值选民的100亿美元。"},{"t":"机理：中值选民偏好的结果战胜两边任何一种主张——若有人建议80亿美元，每个偏好100亿或更多的选民就与中值选民一起投票；若有人建议120亿美元，每个偏好100亿或更少的选民与其一起投票；两种情况下中值选民这边都有一半以上的票数。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机理</strong>：中值选民偏好的结果战胜两边任何一种主张——若有人建议80亿美元，每个偏好100亿或更多的选民就与中值选民一起投票；若有人建议120亿美元，每个偏好100亿或更少的选民与其一起投票；两种情况下中值选民这边都有一半以上的票数。"},{"t":"与康多塞悖论的关系：当选民沿着一条线寻找一点、每个选民的目的都是自己最偏好的点时，康多塞悖论不会产生——中值选民最偏好的结果击败所有挑战者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与康多塞悖论的关系</strong>：当选民沿着一条线寻找一点、每个选民的目的都是自己最偏好的点时，康多塞悖论不会产生——中值选民最偏好的结果击败所有挑战者。"},{"t":"含义一（政党立场趋同）：两个政党都想最大化当选机会时，都要使自己的立场接近中值选民——若民主党主张150亿、共和党主张100亿美元，共和党将得到50%以上选票（20位要100亿+15位要50亿+25位要零预算的选民）；民主党想获胜也要向中值选民靠近——这解释了两党制下各党非常类似。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">含义一</strong>（政党立场趋同）：两个政党都想最大化当选机会时，都要使自己的立场接近中值选民——若民主党主张150亿、共和党主张100亿美元，共和党将得到50%以上选票（20位要100亿+15位要50亿+25位要零预算的选民）；民主党想获胜也要向中值选民靠近——这解释了两党制下各党非常类似。"},{"t":"含义二（少数人的观点不会得到过多重视）：若40%的人想把大量钱用在国家公园而60%不想花钱，中值选民的偏好是零，无论少数人的观点有多强烈；多数原则并不是考虑到每个人偏好的一种折中，而是只关注正处在分布中间的那个人——这就是民主的逻辑。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">含义二</strong>（少数人的观点不会得到过多重视）：若40%的人想把大量钱用在国家公园而60%不想花钱，中值选民的偏好是零，无论少数人的观点有多强烈；多数原则并不是考虑到每个人偏好的一种折中，而是只关注正处在分布中间的那个人——这就是民主的逻辑。"},{"t":"即问即答要点（学校预算投票）：20%的选民想要9:1的学生—教员比率、25%想要10:1、15%想要11:1、40%想要12:1时，按偏好排序第50位的中值选民落在想要11:1的组内，多数投票的结果是11:1。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>（学校预算投票）：20%的选民想要9:1的学生—教员比率、25%想要10:1、15%想要11:1、40%想要12:1时，按偏好排序第50位的中值选民落在想要11:1的组内，多数投票的结果是11:1。"}],"k":"b","i":1,"h":"22.2.3 中值选民说了算"},{"t":"22.2.4 政治家也是人","c":[{"t":"问题：研究消费者时假设效用最大化、研究企业时假设利润最大化，研究参与政治活动的个体时应该假设什么？","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题</strong>：研究消费者时假设效用最大化、研究企业时假设利润最大化，研究参与政治活动的个体时应该假设什么？"},{"t":"政治家也是有目标的：最好假设政治领导人总是追求整个社会的福利（效率与平等的最优结合）并不现实——利己是政治活动者的强大动机，正如它是消费者和企业所有者的动机一样。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政治家也是有目标的</strong>：最好假设政治领导人总是追求整个社会的福利（效率与平等的最优结合）并不现实——利己是政治活动者的强大动机，正如它是消费者和企业所有者的动机一样。"},{"t":"两类动机：一些政治家的动机是想再次当选，因此为了加强自己的选民基础可能愿意牺牲国家利益；另一些政治家的动机只是贪婪——在世界上许多穷国，政府官员的腐败普遍制约了经济发展。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两类动机</strong>：一些政治家的动机是想再次当选，因此为了加强自己的选民基础可能愿意牺牲国家利益；另一些政治家的动机只是贪婪——在世界上许多穷国，政府官员的腐败普遍制约了经济发展。"},{"t":"结论：经济政策并不是由仁慈的国王（甚至是仁慈的经济学家）制定的，而是由具有所有人类欲望的真实的人制定的——他们的动机有时是增进国家利益，有时是自己的政治和金钱野心；当经济政策并不像经济学教科书中那么理想时，我们不应该大惊小怪。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：经济政策并不是由仁慈的国王（甚至是仁慈的经济学家）制定的，而是由具有所有人类欲望的真实的人制定的——他们的动机有时是增进国家利益，有时是自己的政治和金钱野心；当经济政策并不像经济学教科书中那么理想时，我们不应该大惊小怪。"}],"k":"b","i":1,"h":"22.2.4 政治家也是人"}],"k":"sec","i":0,"h":"22.2 政治经济学"},{"t":"22.3 行为经济学","c":[{"t":"引论：经济学并不是研究人类行为的唯一学科，社会心理学也能解释人们生活中的选择；行为经济学是经济学家运用心理学基本观点的学科，提供一种比传统理论更微妙、更复杂因而可能更接近现实的人类行为观点。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">引论</strong>：经济学并不是研究人类行为的唯一学科，社会心理学也能解释人们生活中的选择；行为经济学是经济学家运用心理学基本观点的学科，提供一种比传统理论更微妙、更复杂因而可能更接近现实的人类行为观点。"},{"t":"术语：行为经济学（behavioral economics）——经济学中将心理学的观点考虑进来的分支学科。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">术语</strong>：行为经济学（behavioral economics）——经济学中将心理学的观点考虑进来的分支学科。"},{"t":"22.3.1 人们并不总是理性的","c":[{"t":"术语：理性人/理性经济人（homo economicus）——传统经济理论植根的假设\"物种\"：作为企业所有者总使利润最大化、作为消费者总使效用最大化，面对既定约束时理性评价所有成本和收益并总是选择尽可能好的行为过程。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：理性人/理性经济人（homo economicus）——传统经济理论植根的假设&quot;物种&quot;：作为企业所有者总使利润最大化、作为消费者总使效用最大化，面对既定约束时理性评价所有成本和收益并总是选择尽可能好的行为过程。"},{"t":"现实的人是智人（homo sapiens）：在许多方面类似理性的、精明计算的人，但复杂得多——健忘、冲动、困惑、有感情、目光短浅；这些理性方面的不完善正是心理学家的主要研究对象，经济学家直到最近才开始重视。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现实的人是智人</strong>（homo sapiens）：在许多方面类似理性的、精明计算的人，但复杂得多——健忘、冲动、困惑、有感情、目光短浅；这些理性方面的不完善正是心理学家的主要研究对象，经济学家直到最近才开始重视。"},{"t":"西蒙的满意者：第一位从事经济学和心理学边缘研究的社会学家赫伯特·西蒙提出，不应把人当作理性的最大化者，而应当作满意者（satisficer）——并不总是选择最好的行为过程，而是仅仅做出足够好的决策；其他经济学家也提出人仅仅是\"接近理性\"或表现出\"有限理性\"（bounded rationality）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">西蒙的满意者</strong>：第一位从事经济学和心理学边缘研究的社会学家赫伯特·西蒙提出，不应把人当作理性的最大化者，而应当作满意者（satisficer）——并不总是选择最好的行为过程，而是仅仅做出足够好的决策；其他经济学家也提出人仅仅是&quot;接近理性&quot;或表现出&quot;有限理性&quot;（bounded rationality）。"},{"t":"系统性错误三发现：（1）人们过分自信——要求给出90%置信区间的数字问题实验中，大多数人给出的范围极小，正确数字落入区间的概率远远小于90%；（2）人们过分重视从现实生活中观察到的细枝末节——《消费者报告》调查了1000位 X 车车主，而一位朋友说自己那辆 X 车不怎么样，理性上只是把样本从1000增加到1001，但因其故事发生在身边而被过度重视；（3）人们不愿改变自己的观念（确认偏误）——阅读同一份死刑能否制止犯罪的研究报告后，原本支持死刑的人与原本反对死刑的人都\"更加坚信\"自己的观点，用完全相反的方法解读同一个证据。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">系统性错误三发现</strong>：（1）人们过分自信——要求给出90%置信区间的数字问题实验中，大多数人给出的范围极小，正确数字落入区间的概率远远小于90%；（2）人们过分重视从现实生活中观察到的细枝末节——《消费者报告》调查了1000位 X 车车主，而一位朋友说自己那辆 X 车不怎么样，理性上只是把样本从1000增加到1001，但因其故事发生在身边而被过度重视；（3）人们不愿改变自己的观念（确认偏误）——阅读同一份死刑能否制止犯罪的研究报告后，原本支持死刑的人与原本反对死刑的人都&quot;更加坚信&quot;自己的观点，用完全相反的方法解读同一个证据。"},{"t":"401(k)默认参与的证据：一些企业填一个简单的表即可加入退休金储蓄计划，另一些企业自动加入（可填表退出），后者的参与人数多得多——如果工人是完全的理性最大化者，无论是否默认都应选择最优储蓄量；实际上工人行为表现出相当大的惯性，一旦放弃理性人模型，理解他们的行为就容易多了。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">401(k)默认参与的证据</strong>：一些企业填一个简单的表即可加入退休金储蓄计划，另一些企业自动加入（可填表退出），后者的参与人数多得多——如果工人是完全的理性最大化者，无论是否默认都应选择最优储蓄量；实际上工人行为表现出相当大的惯性，一旦放弃理性人模型，理解他们的行为就容易多了。"},{"t":"为什么经济学仍建立在理性假设上：（1）即使理性假设不完全真实，它还是足够接近真实来建立合理准确的行为模型——如研究竞争企业与垄断企业的差别时，理性利润最大化假设得出许多重要而有效的观点；加入复杂的心理偏差可能增加现实性，但可能把水搅浑；回想第2章，经济模型并不意味着复制现实，只是说明所研究问题的本质；（2）经济学家本身也不是理性的最大化者——与大多数人一样过分自信、不愿改变观念、在选择人类行为理论时表现出巨大惯性，并满足于\"足够好\"的理论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">为什么经济学仍建立在理性假设上</strong>：（1）即使理性假设不完全真实，它还是足够接近真实来建立合理准确的行为模型——如研究竞争企业与垄断企业的差别时，理性利润最大化假设得出许多重要而有效的观点；加入复杂的心理偏差可能增加现实性，但可能把水搅浑；回想第2章，经济模型并不意味着复制现实，只是说明所研究问题的本质；（2）经济学家本身也不是理性的最大化者——与大多数人一样过分自信、不愿改变观念、在选择人类行为理论时表现出巨大惯性，并满足于&quot;足够好&quot;的理论。"},{"t":"新闻摘录「对偏离理性的运用」（Thaler）要点：把考试满分从100改为137，题更难（答对约70%）而平均分从72变为96，学生们反而都很高兴——按理性标准96/137与72/100 等价，说明被传统理论视为不相关因素（supposedly irrelevant factors, SIF）的东西其实至关重要；行为经济学在很大程度上就是将不相关因素整合到标准经济学中；\"看不见的摆手\"（invisible hand wave）式的辩护站不住脚——市场不会自动把正常人变成经济人，选错职业、选错房贷、不储蓄时市场不会纠正错误，迎合消费者的偏见比纠正它更容易赚钱；401(k)等退休计划中\"自动加入（可选择退出）、自动逐年提高储蓄率、选定合适的默认投资项目（如目标日期基金）\"等不相关因素大大改善了储蓄结果——丹麦的研究显示储蓄增长只有约1%可归因于减税计划、其他约99%来自自动特点，而美国政府2015年为税收减免付出了620亿美元且利益多归于富裕纳税人；一次性退税支票与分摊到每月薪水中对经济人无差别，现实中大多数人会把月薪花光而把一次性支票存起来或还债，故以刺激支出为目的的减税应分摊发放。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新闻摘录「对偏离理性的运用」</strong>（Thaler）要点：把考试满分从100改为137，题更难（答对约70%）而平均分从72变为96，学生们反而都很高兴——按理性标准96/137与72/100 等价，说明被传统理论视为不相关因素（supposedly irrelevant factors, SIF）的东西其实至关重要；行为经济学在很大程度上就是将不相关因素整合到标准经济学中；&quot;看不见的摆手&quot;（invisible hand wave）式的辩护站不住脚——市场不会自动把正常人变成经济人，选错职业、选错房贷、不储蓄时市场不会纠正错误，迎合消费者的偏见比纠正它更容易赚钱；401(k)等退休计划中&quot;自动加入（可选择退出）、自动逐年提高储蓄率、选定合适的默认投资项目（如目标日期基金）&quot;等不相关因素大大改善了储蓄结果——丹麦的研究显示储蓄增长只有约1%可归因于减税计划、其他约99%来自自动特点，而美国政府2015年为税收减免付出了620亿美元且利益多归于富裕纳税人；一次性退税支票与分摊到每月薪水中对经济人无差别，现实中大多数人会把月薪花光而把一次性支票存起来或还债，故以刺激支出为目的的减税应分摊发放。"}],"k":"b","i":1,"h":"22.3.1 人们并不总是理性的"},{"t":"22.3.2 人们关注公正","c":[{"t":"最后通牒博弈（ultimatum game）的设计：两位互不相识的志愿者掷硬币分成玩家 A 和玩家 B；玩家 A 在两人之间分100美元奖金提出建议，玩家 B 决定接受（两人按建议得到钱）或拒绝（两人都空手离开），实验随即结束。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最后通牒博弈</strong>（ultimatum game）的设计：两位互不相识的志愿者掷硬币分成玩家 A 和玩家 B；玩家 A 在两人之间分100美元奖金提出建议，玩家 B 决定接受（两人按建议得到钱）或拒绝（两人都空手离开），实验随即结束。"},{"t":"传统理论的预期：人是理性的财富最大化者——玩家 A 应建议自己得99美元、B 得1美元，且 B 应该接受（得到1美元好于一无所有）；用博弈论（第17章）的语言说，99-1分配是纳什均衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传统理论的预期</strong>：人是理性的财富最大化者——玩家 A 应建议自己得99美元、B 得1美元，且 B 应该接受（得到1美元好于一无所有）；用博弈论（第17章）的语言说，99-1分配是纳什均衡。"},{"t":"实验结果与预期差别很大：玩家 B 通常拒绝只给1美元或类似少量钱的建议；由于预料到这一点，玩家 A 通常建议给 B 远多于1美元（30—40美元，也有人提出50-50），此时 B 通常接受。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实验结果与预期差别很大</strong>：玩家 B 通常拒绝只给1美元或类似少量钱的建议；由于预料到这一点，玩家 A 通常建议给 B 远多于1美元（30—40美元，也有人提出50-50），此时 B 通常接受。"},{"t":"解释：人们部分受天生的公正观念的驱使——99-1的分法在许多人看来如此不公正，以至于即使自己一无所获也要拒绝；70-30虽仍不公正，但没有不公正到使人放弃正常的利己心。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解释</strong>：人们部分受天生的公正观念的驱使——99-1的分法在许多人看来如此不公正，以至于即使自己一无所获也要拒绝；70-30虽仍不公正，但没有不公正到使人放弃正常的利己心。"},{"t":"对劳动市场的含义：在第18、19章劳动供求决定工资的分析之外，一些经济学家提出应把企业支付工资的可观察到的公正性包括在内——企业某一年获利特别丰厚时，工人（和玩家B一样）可能期望得到一份公正的奖金；企业（和玩家A一样）也可能由于担心工人用降低努力、罢工甚至恶意破坏来惩罚企业，而决定支付高于均衡水平的工资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对劳动市场的含义</strong>：在第18、19章劳动供求决定工资的分析之外，一些经济学家提出应把企业支付工资的可观察到的公正性包括在内——企业某一年获利特别丰厚时，工人（和玩家B一样）可能期望得到一份公正的奖金；企业（和玩家A一样）也可能由于担心工人用降低努力、罢工甚至恶意破坏来惩罚企业，而决定支付高于均衡水平的工资。"}],"k":"b","i":1,"h":"22.3.2 人们关注公正"},{"t":"22.3.3 人们是前后不一致的","c":[{"t":"术语：即时满足（instant gratification）/拖延——即时满足的欲望使人们放弃自己过去的计划、把事情推给未来的前后不一致行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">术语</strong>：即时满足（instant gratification）/拖延——即时满足的欲望使人们放弃自己过去的计划、把事情推给未来的前后不一致行为。"},{"t":"两问实验：面对枯燥工作（洗衣服、扫雪、填税表），问\"立即花50分钟还是明天花60分钟做完\"，许多人选明天（拖延）；问\"在90天内花50分钟还是91天内花60分钟\"，同一批人选90天；当第90天到来时允许改变主意，他实际面临第一个问题，于是又选择明天再做——从理性人理论看令人困惑：为什么仅仅时间的流逝就会影响选择？","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两问实验</strong>：面对枯燥工作（洗衣服、扫雪、填税表），问&quot;立即花50分钟还是明天花60分钟做完&quot;，许多人选明天（拖延）；问&quot;在90天内花50分钟还是91天内花60分钟&quot;，同一批人选90天；当第90天到来时允许改变主意，他实际面临第一个问题，于是又选择明天再做——从理性人理论看令人困惑：为什么仅仅时间的流逝就会影响选择？"},{"t":"日常例子：吸烟者答应戒烟，但在吸完最后一支烟的几小时里又要求再吸一支并违背诺言；想减肥的人答应不再吃甜点，但甜点端上来时又忘记诺言——即时满足的欲望使他们放弃了过去的计划。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">日常例子</strong>：吸烟者答应戒烟，但在吸完最后一支烟的几小时里又要求再吸一支并违背诺言；想减肥的人答应不再吃甜点，但甜点端上来时又忘记诺言——即时满足的欲望使他们放弃了过去的计划。"},{"t":"消费-储蓄决策：支出提供即时满足，储蓄则要求为遥远未来的报酬做出现时牺牲；根据一份调查，76%的美国人说他们的储蓄将不够退休后使用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">消费-储蓄决策</strong>：支出提供即时满足，储蓄则要求为遥远未来的报酬做出现时牺牲；根据一份调查，76%的美国人说他们的储蓄将不够退休后使用。"},{"t":"应对（忠于未来）：想戒烟的吸烟者可以把烟扔掉，想减肥的人可以锁住电冰箱；储蓄太少的人应该找到某种方法在花钱之前把钱锁起来——401(k) 等退休金账户正起这一作用（同意在看到钱之前就从工资支票中划出，退休前支取需交一定罚金），这也解释了这些账户如此受欢迎的原因之一：它们制止了人们即时满足的欲望。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应对</strong>（忠于未来）：想戒烟的吸烟者可以把烟扔掉，想减肥的人可以锁住电冰箱；储蓄太少的人应该找到某种方法在花钱之前把钱锁起来——401(k) 等退休金账户正起这一作用（同意在看到钱之前就从工资支票中划出，退休前支取需交一定罚金），这也解释了这些账户如此受欢迎的原因之一：它们制止了人们即时满足的欲望。"},{"t":"即问即答要点：人的决策不同于传统理性人的三个方面——人们并不总是理性的（过分自信、过分重视细枝末节、不愿改变观念等系统误差）、人们关注公正（最后通牒博弈）、人们前后不一致（即时满足与拖延）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：人的决策不同于传统理性人的三个方面——人们并不总是理性的（过分自信、过分重视细枝末节、不愿改变观念等系统误差）、人们关注公正（最后通牒博弈）、人们前后不一致（即时满足与拖延）。"}],"k":"b","i":1,"h":"22.3.3 人们是前后不一致的"}],"k":"sec","i":0,"h":"22.3 行为经济学"},{"t":"22.4 结论","c":[{"t":"本章只是简述思想而没有完全展开：一是因为这些主题会在高级课程中更详细学习，二是因为它们仍是不断更新的活跃研究领域。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章只是简述思想而没有完全展开</strong>：一是因为这些主题会在高级课程中更详细学习，二是因为它们仍是不断更新的活跃研究领域。"},{"t":"与经济学十大原理呼应：市场通常是组织经济活动的一种好方法、政府有时可以改善市场结果——不对称信息的研究应使你更谨慎地对待市场结果；政治经济学的研究应使你更谨慎地对待政府的解决方法；行为经济学的研究应使你更谨慎地对待依靠人的决策的任何一种制度，既包括市场也包括政府。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">与经济学十大原理呼应</strong>：市场通常是组织经济活动的一种好方法、政府有时可以改善市场结果——不对称信息的研究应使你更谨慎地对待市场结果；政治经济学的研究应使你更谨慎地对待政府的解决方法；行为经济学的研究应使你更谨慎地对待依靠人的决策的任何一种制度，既包括市场也包括政府。"},{"t":"统一观点：生活是杂乱的——信息是不完全的，政府是不完善的，人也是不完美的；如果经济学家要解释、甚至要改善周围的世界，就需要尽可能准确地理解这些不完善之处。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">统一观点</strong>：生活是杂乱的——信息是不完全的，政府是不完善的，人也是不完美的；如果经济学家要解释、甚至要改善周围的世界，就需要尽可能准确地理解这些不完善之处。"}],"k":"sec","i":0,"h":"22.4 结论"}],"k":"chap","h":"第22章 微观经济学前沿"}],"k":"part","h":"第7篇 深入研究的论题","col":"#0ea5a5","pc":"p7"}],"k":"root","h":"<strong class=\"lead\">微观经济学</strong>（曼昆"};

// ---------- 指针 ----------
(function(){ const PALETTE = null;
  function walk(n, parent){ n._p = parent; (n.c || []).forEach(ch => walk(ch, n)); }
  walk(DATA, null);
})();
function partColor(n){ let p = n; while (p){ if (p.k === "part") return p.col || "#666"; p = p._p; } return "#8a8a84"; }
function walkAll(n, fn){ fn(n); (n.c || []).forEach(ch => walkAll(ch, fn)); }
// 有"章"层（## 篇 + ### 章）的书默认展开到章；扁平结构（章即 ##）默认只展开根
const HAS_CHAP = (() => { let f = false; walkAll(DATA, n => { if (n.k === "chap") f = true; }); return f; })();
const TOPKINDS = HAS_CHAP ? ["root", "part"] : ["root"];

// ---------- 导图节点样式与测量 ----------
const ctx = document.createElement("canvas").getContext("2d");
const CFG = {
  root:{ fs:15.5, maxLines:2, maxW:200, bold:true  },
  part:{ fs:13.5, maxLines:2, maxW:185, bold:true  },
  chap:{ fs:12.5, maxLines:2, maxW:190, bold:true  },
  sec: { fs:12,   maxLines:2, maxW:200, bold:false },
  b:   { fs:11,   maxLines:2, maxW:210, bold:false },
};
// 分词：英文/数字串保持完整（可断在连字符后），其余逐字符；避免英文单词被硬切断
function tokenize(t){
  const out = []; const re = /[A-Za-z0-9][A-Za-z0-9'&+./·-]*(?:-[A-Za-z0-9][A-Za-z0-9'&+./·-]*)*-?|\s+|[\s\S]/g;
  let m; while ((m = re.exec(t))) out.push(m[0]);
  return out;
}
function wrapTokens(t, cf){
  const maxW = cf.maxW - 26;
  const W = s => ctx.measureText(s).width;
  const lines = []; let cur = "";
  const pushCur = () => { if (cur){ lines.push(cur.replace(/\s+$/, "")); cur = ""; } };
  for (const tk of tokenize(t)){
    if (/^\s+$/.test(tk)){ if (cur) cur += " "; continue; }
    if (cur && W(cur + tk) > maxW) pushCur();
    if (W(tk) > maxW){                       // 单 token 超宽（超长英文/URL）按字符硬断
      let s = tk;
      while (W(s) > maxW){
        let lo = 1, hi = s.length;
        while (lo < hi){ const mid = (lo + hi + 1) >> 1; if (W(s.slice(0, mid)) <= maxW) lo = mid; else hi = mid - 1; }
        lines.push(s.slice(0, lo)); s = s.slice(lo);
      }
      cur = s; continue;
    }
    cur += tk;
  }
  pushCur();
  if (lines.length <= cf.maxLines) return lines;
  const rest = lines.slice(cf.maxLines - 1).join(" ");
  let last = "";
  for (const tk of tokenize(rest)){
    if (/^\s+$/.test(tk)){ if (last) last += " "; continue; }
    if (W(last + tk + "…") > maxW) break;
    last += tk;
  }
  if (!last){ let s = rest; while (W(s + "…") > maxW && s.length > 1) s = s.slice(0, -1); last = s; }
  return lines.slice(0, cf.maxLines - 1).concat([last + "…"]);
}
walkAll(DATA, n => {
  const cf = CFG[n.k] || CFG.b;
  ctx.font = (cf.bold ? "600 " : "") + cf.fs + 'px -apple-system,"PingFang SC",sans-serif';
  n._lines = wrapTokens(n.t, cf);
  n._lw = Math.max.apply(null, n._lines.map(l => ctx.measureText(l).width));
  n._w = Math.min(cf.maxW, n._lw + 24);
  n._h = n._lines.length * (cf.fs * 1.32) + 10;
  n.open = TOPKINDS.indexOf(n.k) >= 0;
});

// 列 x 坐标（每层取该层最宽节点保证不重叠）
const colX = [0];
(function(){
  let x = 0;
  for (const k of ["root", "part", "chap", "sec"]){
    let mw = 120;
    walkAll(DATA, n => { if (n.k === k) mw = Math.max(mw, n._w); });
    x += mw + 48; colX.push(x);
  }
  for (let d = 4; d <= 9; d++){ colX.push(x); x += 120; }
})();
const colXOf = d => colX[Math.min(d, colX.length - 1)] + (d > 9 ? (d - 9) * 0 : 0);

// ---------- 布局 + 渲染 ----------
const svg = document.getElementById("svg"), vp = document.getElementById("vp");
let cursorY = 0, lastMaxX = 300, vis = [];
function layout(n, depth){
  n._d = depth; n._x = colXOf(depth);
  const kids = (n.c && n.open) ? n.c : [];
  if (!kids.length){ n._y = cursorY + n._h / 2 + 6; cursorY += n._h + 12; return n._y; }
  const ys = kids.map(k => layout(k, depth + 1));
  n._y = (ys[0] + ys[ys.length - 1]) / 2;
  return n._y;
}
function esc(s){ return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function renderMap(){
  cursorY = 0; vis = [];
  layout(DATA, 0);
  let links = "", nodes = "";
  (function link(n){
    const kids = (n.c && n.open) ? n.c : [];
    for (const k of kids){
      const x1 = n._x + n._w, y1 = n._y, x2 = k._x, y2 = k._y;
      const dx = Math.max(24, (x2 - x1) * 0.5);
      const col = partColor(k);
      const op = ((k.k === "part" || k.k === "chap") ? 0.75 : 0.32) * (_searchOn && !k._hit && !k._path ? 0.15 : 1);
      const sw = k.k === "part" ? 2.6 : (k.k === "chap" ? 1.8 : 1.3);
      links += '<path d="M' + x1 + ',' + y1.toFixed(1) + ' C' + (x1 + dx) + ',' + y1.toFixed(1) + ' ' +
               (x2 - dx) + ',' + y2.toFixed(1) + ' ' + x2 + ',' + y2.toFixed(1) +
               '" fill="none" stroke="' + col + '" stroke-opacity="' + op + '" stroke-width="' + sw + '"/>';
      link(k);
    }
  })(DATA);
  (function draw(n){
    vis.push(n);
    lastMaxX = Math.max(lastMaxX, n._x + n._w);
    const cf = CFG[n.k] || CFG.b, col = partColor(n);
    const dark = n.k === "root" || n.k === "part";
    const fill = dark ? (n.k === "root" ? "#2f3440" : col) : "#ffffff";
    const hit = !!n._hit;
    const dim = _searchOn && !hit && !n._path;
    const stroke = hit ? "#e25563" : (dark ? "none" : (n.k === "chap" ? col : (n.k === "sec" ? "#dcdcd5" : "#eceae4")));
    const sw = hit ? 2.2 : (dark ? 0 : (n.k === "chap" ? 1.7 : 1.4));
    const txt = dark ? "#fff" : (n.k === "chap" ? "#1f1f1f" : "#3d3d38");
    let tspans = "";
    n._lines.forEach((l, i) => {
      tspans += '<tspan x="' + (n._x + 12) + '" y="' + (n._y - n._h / 2 + cf.fs * 1.32 * (i + 0.82)).toFixed(1) + '">' + esc(l) + '</tspan>';
    });
    const dashAttr = hit ? ' stroke-dasharray="5 3"' : "";
    nodes += '<g class="pill" style="cursor:' + ((n.c && n.c.length) ? "pointer" : "default") + '"' + (dim ? ' opacity="0.18"' : "") + '>' +
      '<rect x="' + n._x + '" y="' + (n._y - n._h / 2).toFixed(1) + '" width="' + n._w.toFixed(1) +
      '" height="' + n._h.toFixed(1) + '" rx="7" fill="' + fill + '" stroke="' + stroke +
      '" stroke-width="' + sw + '"' + dashAttr + '/>' +
      '<text font-size="' + cf.fs + '" font-weight="' + (cf.bold ? 600 : 400) + '" fill="' + txt + '">' + tspans + '</text>' +
      '<title>' + esc(n.t) + '</title></g>';
    ((n.c && n.open) ? n.c : []).forEach(draw);
  })(DATA);
  vp.innerHTML = links + nodes;
  const gs = vp.querySelectorAll("g.pill");
  gs.forEach((g, i) => {
    g.addEventListener("click", e => {
      const n = vis[i];
      if (!n || !n.c || !n.c.length) return;
      e.stopPropagation();
      n.open = !n.open;
      renderMap();
      const bb = svg.getBoundingClientRect();
      tf.y = bb.height / 2 - n._y * tf.s;
      const sx = n._x * tf.s + tf.x;
      if (sx < 60) tf.x += 60 - sx;
      applyTf();
    });
  });
}

// ---------- 缩放平移 ----------
let tf = { x: 0, y: 0, s: 1 };
function applyTf(){ vp.setAttribute("transform", "translate(" + tf.x + "," + tf.y + ") scale(" + tf.s + ")"); }
function fitView(){
  const bb = svg.getBoundingClientRect();
  const h = Math.max(cursorY, 120), w = Math.max(lastMaxX + 60, 400);
  const s = Math.max(0.15, Math.min((bb.width - 70) / w, (bb.height - 70) / h, 0.85));
  tf = { s: s, x: (bb.width - w * s) / 2, y: (bb.height - h * s) / 2 };
  applyTf();
}
const viewMap = document.getElementById("viewMap");
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const bb = svg.getBoundingClientRect(), mx = e.clientX - bb.left, my = e.clientY - bb.top;
  tf.x = mx - (mx - tf.x) * k; tf.y = my - (my - tf.y) * k;
  tf.s = Math.min(3, Math.max(0.08, tf.s * k));
  applyTf();
}, { passive: false });
let drag = null;
svg.addEventListener("mousedown", e => { drag = { x: e.clientX, y: e.clientY, tx: tf.x, ty: tf.y }; viewMap.classList.add("dragging"); });
window.addEventListener("mousemove", e => { if (!drag) return; tf.x = drag.tx + e.clientX - drag.x; tf.y = drag.ty + e.clientY - drag.y; applyTf(); });
window.addEventListener("mouseup", () => { drag = null; viewMap.classList.remove("dragging"); });
svg.addEventListener("dblclick", e => { if (e.target === svg) fitView(); });  // 双击空白复位

// ---------- 大纲视图 ----------
const otree = document.getElementById("otree");
function buildOutline(n){
  if (n.c && n.c.length){
    const d = document.createElement("details");
    d.className = n.k === "part" ? ("part " + n.pc) : n.k;
    d.open = n.k === "root" || n.k === "part" || n.k === "chap";
    const s = document.createElement("summary"); s.innerHTML = n.h || ""; d.appendChild(s);
    const kids = document.createElement("div"); kids.className = "kids";
    n.c.forEach(c => kids.appendChild(buildOutline(c)));
    d.appendChild(kids);
    return d;
  }
  const dv = document.createElement("div"); dv.className = "leaf " + n.k; dv.innerHTML = n.h || "";
  return dv;
}
otree.appendChild(buildOutline(DATA));

// ---------- 视图切换 ----------
let view = "map";
function showView(v){
  view = v;
  document.getElementById("tabMap").classList.toggle("on", v === "map");
  document.getElementById("tabOutline").classList.toggle("on", v === "outline");
  viewMap.style.display = v === "map" ? "block" : "none";
  document.getElementById("viewOutline").style.display = v === "outline" ? "block" : "none";
  if (v === "map"){ renderMap(); applyTf(); }
}
document.getElementById("tabMap").onclick = () => showView("map");
document.getElementById("tabOutline").onclick = () => showView("outline");
document.getElementById("fit").onclick = () => { if (view === "map") fitView(); };

function setOpenAll(deep){
  walkAll(DATA, n => { if (n.c) n.open = deep ? true : TOPKINDS.indexOf(n.k) >= 0; });
  if (view === "map"){ renderMap(); fitView(); }
  else otree.querySelectorAll("details").forEach(d => d.open = d.classList.contains("root") || d.classList.contains("part") || d.classList.contains("chap"));
}
document.getElementById("expand").onclick = () => setOpenAll(true);
document.getElementById("collapse").onclick = () => setOpenAll(false);

// ---------- 搜索 ----------
const q = document.getElementById("q"), hitsEl = document.getElementById("hits");
let timer = null, _searchOn = false;
q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(doSearch, 150); });
q.addEventListener("keydown", e => { if (e.key === "Escape"){ q.value = ""; doSearch(); } });
function clearMarks(){ document.querySelectorAll("mark").forEach(m => m.replaceWith(document.createTextNode(m.textContent))); }
function setHits(t){ hitsEl.textContent = t; hitsEl.style.display = t ? "inline" : "none"; }
function doSearch(){
  const kw = q.value.trim().toLowerCase();
  clearMarks();
  walkAll(DATA, n => { n._hit = false; n._path = false; });
  _searchOn = kw !== "";
  if (!kw){
    setHits("");
    otree.querySelectorAll(".hide").forEach(el => el.classList.remove("hide"));
    otree.querySelectorAll("details").forEach(d => d.open = d.classList.contains("root") || d.classList.contains("part") || d.classList.contains("chap"));
    setOpenDefault(); renderMap(); fitView();
    return;
  }
  const matches = [];
  walkAll(DATA, n => { if (n.t.toLowerCase().indexOf(kw) >= 0){ n._hit = true; matches.push(n); } });
  matches.forEach(m => { let p = m._p; while (p){ p._path = true; p = p._p; } });
  if (view === "map"){
    matches.forEach(m => { let p = m._p; while (p){ p.open = true; p = p._p; } });
    renderMap();
    setHits(matches.length ? matches.length + " 处命中" : "无命中");
    if (matches.length){
      if (tf.s < 0.3) tf.s = 0.5;   // 防御：过小缩放下命中不可读
      const n = matches[0], bb = svg.getBoundingClientRect();
      tf.x = bb.width / 2 - (n._x + n._w / 2) * tf.s;
      tf.y = bb.height / 2 - n._y * tf.s;
      applyTf();
    }
  } else {
    const details = Array.from(otree.querySelectorAll("details"));
    const leaves = Array.from(otree.querySelectorAll(".leaf"));
    const els = details.map(d => ({ el: d, tx: d.querySelector("summary").textContent, isD: true }))
      .concat(leaves.map(l => ({ el: l, tx: l.textContent, isD: false })));
    const anc = new Set();
    for (const n of els) if (n.tx.toLowerCase().indexOf(kw) >= 0){
      let p = n.el.parentElement;
      while (p && p !== otree){ const dd = p.closest ? p.closest("details") : null; if (dd) anc.add(dd); p = p.parentElement; }
    }
    for (const n of els){
      const hit = n.tx.toLowerCase().indexOf(kw) >= 0;
      n.el.classList.toggle("hide", !(hit || anc.has(n.el)));
      if (n.isD && (hit || anc.has(n.el))) n.el.open = true;
    }
    let nHit = 0;
    for (const n of els) if (n.tx.toLowerCase().indexOf(kw) >= 0) nHit++;
    setHits(nHit + " 处命中");
    otree.querySelectorAll("summary, .leaf").forEach(el => {
      const t = el.childNodes[0];
      if (t && t.nodeType === 3){
        const idx = t.textContent.toLowerCase().indexOf(kw);
        if (idx >= 0){
          const range = document.createRange();
          range.setStart(t, idx); range.setEnd(t, idx + kw.length);
          try { const mk = document.createElement("mark"); range.surroundContents(mk); } catch (e) {}
        }
      }
    });
  }
}
function setOpenDefault(){ walkAll(DATA, n => { if (n.c) n.open = TOPKINDS.indexOf(n.k) >= 0; }); }

// ---------- 初始化 ----------
showView("map");
fitView();  // 同步执行：rAF 在标签页不可见时会被推迟，若拖到搜索之后会覆盖定位
</script>
</body>
</html>
