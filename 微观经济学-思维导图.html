:"b","i":1,"h":"<strong class=\"lead\">第4篇 公共部门经济学</strong>（第10—12章）：市场并不总是有效率的——外部性、公共物品和公共资源（市场失灵）；税制设计要在效率与平等之间取得平衡。"},{"t":"第5篇 企业行为与产业组织（第13—17章）：生产成本与企业理论阐明竞争市场供给背后的决策；有市场势力的企业（垄断、垄断竞争、寡头）会使市场结果无效率。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第5篇 企业行为与产业组织</strong>（第13—17章）：生产成本与企业理论阐明竞争市场供给背后的决策；有市场势力的企业（垄断、垄断竞争、寡头）会使市场结果无效率。"},{"t":"第6篇 劳动市场经济学（第18—20章）：生产要素市场、收入与歧视、收入不平等与贫困——大多数人在劳动市场上赚到自己的大部分收入。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第6篇 劳动市场经济学</strong>（第18—20章）：生产要素市场、收入与歧视、收入不平等与贫困——大多数人在劳动市场上赚到自己的大部分收入。"},{"t":"第7篇 深入研究的论题（第21—22章）：消费者选择理论（家庭决策）与微观经济学前沿（不对称信息、政治经济学、行为经济学）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第7篇 深入研究的论题</strong>（第21—22章）：消费者选择理论（家庭决策）与微观经济学前沿（不对称信息、政治经济学、行为经济学）。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">本书定位</strong>：微观分册的七篇结构"},{"t":"教学设计：为入门学习者准备的脚手架","c":[{"t":"案例研究：用真实事件印证原理，如\"亚当·斯密会爱上优步\"\"灯塔是公共物品吗\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">案例研究</strong>：用真实事件印证原理，如&quot;亚当·斯密会爱上优步&quot;&quot;灯塔是公共物品吗&quot;。"},{"t":"新闻摘录：借媒体报道连接理论与现实，如\"看不见的手可以给你停车位\"\"移民经济学\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">新闻摘录</strong>：借媒体报道连接理论与现实，如&quot;看不见的手可以给你停车位&quot;&quot;移民经济学&quot;。"},{"t":"参考资料：补充思想史与背景，如\"亚当·斯密与看不见的手\"\"亚当·斯密与大卫·李嘉图的思想遗产\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料</strong>：补充思想史与背景，如&quot;亚当·斯密与看不见的手&quot;&quot;亚当·斯密与大卫·李嘉图的思想遗产&quot;。"},{"t":"即问即答：小节讲毕随学随测，即时检验理解（每章多处出现）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答</strong>：小节讲毕随学随测，即时检验理解（每章多处出现）。"},{"t":"章末配套：快速单选、内容提要、关键概念、复习题、问题与应用，形成\"学—测—练\"闭环。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">章末配套</strong>：快速单选、内容提要、关键概念、复习题、问题与应用，形成&quot;学—测—练&quot;闭环。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">教学设计</strong>：为入门学习者准备的脚手架"}],"k":"part","h":"<strong class=\"lead\">全书总览</strong>（前言与导览）","col":"#3f4652","pc":"p0"},{"t":"第1篇 导言","c":[{"t":"第1章 经济学十大原理","c":[{"t":"本章内容提要","c":[{"t":"关于个人做出决策的基本结论：人们面临不同目标之间的权衡取舍；任何一种行为的成本可以用其所放弃的机会来衡量；理性人通过比较边际成本与边际收益做出决策；人们根据他们所面临的激励改变自己的行为。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">关于个人做出决策的基本结论</strong>：人们面临不同目标之间的权衡取舍；任何一种行为的成本可以用其所放弃的机会来衡量；理性人通过比较边际成本与边际收益做出决策；人们根据他们所面临的激励改变自己的行为。"},{"t":"关于人们之间相互影响的基本结论：贸易和相互依赖性可以是互利的；市场通常是协调人们之间经济活动的一种好方法；通过纠正市场失灵或者提高经济中的平等程度，政府可能改善市场结果。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">关于人们之间相互影响的基本结论</strong>：贸易和相互依赖性可以是互利的；市场通常是协调人们之间经济活动的一种好方法；通过纠正市场失灵或者提高经济中的平等程度，政府可能改善市场结果。"},{"t":"关于整体经济的基本结论：生产率是生活水平的最终根源；货币量的增长是通货膨胀的最终根源；社会面临通货膨胀与失业之间的短期权衡取舍。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">关于整体经济的基本结论</strong>：生产率是生活水平的最终根源；货币量的增长是通货膨胀的最终根源；社会面临通货膨胀与失业之间的短期权衡取舍。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"开篇：稀缺性与经济学的定义","c":[{"t":"词源：经济（economy）源于希腊语 oikonomos，意为\"管理一个家庭的人\"——家庭与经济一样，都要在各成员间分配稀缺资源（时间、甜点、汽车行驶里程）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">词源</strong>：经济（economy）源于希腊语 oikonomos，意为&quot;管理一个家庭的人&quot;——家庭与经济一样，都要在各成员间分配稀缺资源（时间、甜点、汽车行驶里程）。"},{"t":"稀缺性（scarcity）：社会拥有的资源是有限的，不能生产人们希望拥有的所有物品与服务。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">稀缺性</strong>（scarcity）：社会拥有的资源是有限的，不能生产人们希望拥有的所有物品与服务。"},{"t":"经济学（economics）：研究社会如何管理自己的稀缺资源——研究人们如何做出决策、如何相互影响，以及影响整个经济的力量与趋势。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经济学</strong>（economics）：研究社会如何管理自己的稀缺资源——研究人们如何做出决策、如何相互影响，以及影响整个经济的力量与趋势。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">开篇</strong>：稀缺性与经济学的定义"},{"t":"1.1 人们如何做出决策","c":[{"t":"总起：经济只不过是生活中相互交易的人们所组成的群体，经济行为反映个人行为，故从个人决策的四条原理开始。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总起</strong>：经济只不过是生活中相互交易的人们所组成的群体，经济行为反映个人行为，故从个人决策的四条原理开始。"},{"t":"原理一：人们面临权衡取舍","c":[{"t":"白话解释：\"天下没有免费的午餐\"——为了得到一件喜爱的东西，通常不得不放弃另一件喜爱的东西；认识权衡取舍是良好决策的前提。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">白话解释</strong>：&quot;天下没有免费的午餐&quot;——为了得到一件喜爱的东西，通常不得不放弃另一件喜爱的东西；认识权衡取舍是良好决策的前提。"},{"t":"例子（个人）：学生分配最宝贵的资源\"时间\"——每多学 1 小时经济学，就少 1 小时心理学，也少 1 小时睡觉、骑车、看电视或打工赚钱。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（个人）：学生分配最宝贵的资源&quot;时间&quot;——每多学 1 小时经济学，就少 1 小时心理学，也少 1 小时睡觉、骑车、看电视或打工赚钱。"},{"t":"例子（家庭）：父母把收入用于食物、衣物、度假或为退休与孩子教育储蓄——一种用途多花 1 美元，其他用途就少花 1 美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（家庭）：父母把收入用于食物、衣物、度假或为退休与孩子教育储蓄——一种用途多花 1 美元，其他用途就少花 1 美元。"},{"t":"例子（社会）：\"大炮与黄油\"（国防 vs 消费品）；清洁环境与高收入水平（污染管制提高企业成本，压低利润、工资或推高价格）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（社会）：&quot;大炮与黄油&quot;（国防 vs 消费品）；清洁环境与高收入水平（污染管制提高企业成本，压低利润、工资或推高价格）。"},{"t":"经典权衡——效率与平等：效率（efficiency）指经济蛋糕的大小，平等（equality）指如何分割蛋糕；再分配政策（福利、失业保险、个人所得税）减少对辛勤工作的奖励，把蛋糕切得更均等时蛋糕本身变小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经典权衡——效率与平等</strong>：效率（efficiency）指经济蛋糕的大小，平等（equality）指如何分割蛋糕；再分配政策（福利、失业保险、个人所得税）减少对辛勤工作的奖励，把蛋糕切得更均等时蛋糕本身变小。"}],"k":"b","i":1,"h":"<strong class=\"lead\">原理一</strong>：人们面临权衡取舍"},{"t":"原理二：某种东西的成本是为了得到它所放弃的东西","c":[{"t":"白话解释：真实成本是机会成本（opportunity cost）——为得到某种东西所必须放弃的东西；做决策应比较各方案的机会成本而非只是账面支出。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">白话解释</strong>：真实成本是机会成本（opportunity cost）——为得到某种东西所必须放弃的东西；做决策应比较各方案的机会成本而非只是账面支出。"},{"t":"例子（上大学）：学费加吃住的算法不对——不上学也要吃住，只有大学比别处贵出的部分才算成本；最大单项成本是被放弃的时间，即为上大学而放弃的收入。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（上大学）：学费加吃住的算法不对——不上学也要吃住，只有大学比别处贵出的部分才算成本；最大单项成本是被放弃的时间，即为上大学而放弃的收入。"},{"t":"例子（大学运动员）：退学转职业运动每年赚数百万美元——上大学的机会成本极高，故他们通常认为不值得为此放弃收益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（大学运动员）：退学转职业运动每年赚数百万美元——上大学的机会成本极高，故他们通常认为不值得为此放弃收益。"}],"k":"b","i":1,"h":"<strong class=\"lead\">原理二</strong>：某种东西的成本是为了得到它所放弃的东西"},{"t":"原理三：理性人考虑边际量","c":[{"t":"白话解释：理性人（rational people）系统而有目的地尽最大努力实现目标，通过比较边际收益（marginal benefit）与边际成本（marginal cost）做决策；边际变动（marginal change）指对现有行动计划的微小增量调整（\"边际\"即\"边缘\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">白话解释</strong>：理性人（rational people）系统而有目的地尽最大努力实现目标，通过比较边际收益（marginal benefit）与边际成本（marginal cost）做决策；边际变动（marginal change）指对现有行动计划的微小增量调整（&quot;边际&quot;即&quot;边缘&quot;）。"},{"t":"例子（打手机电话）：10 分钟通话收益约 7 美元；月费 40 美元固定费 + 每分钟 0.5 美元、每月 100 分钟。按平均成本（0.9 美元/分钟 → 9 美元）会错判\"别打\"；边际成本只有 5 美元，7 美元＞5 美元，应该打。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（打手机电话）：10 分钟通话收益约 7 美元；月费 40 美元固定费 + 每分钟 0.5 美元、每月 100 分钟。按平均成本（0.9 美元/分钟 → 9 美元）会错判&quot;别打&quot;；边际成本只有 5 美元，7 美元＞5 美元，应该打。"},{"t":"例子（航空公司）：200 座飞机飞一次成本 10 万美元，平均每座 500 美元；起飞前仍有 10 个空位时，等退票乘客愿付 300 美元也应卖——多载一人的边际成本只是一罐软饮料，价格高于边际成本即有利可图。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（航空公司）：200 座飞机飞一次成本 10 万美元，平均每座 500 美元；起飞前仍有 10 个空位时，等退票乘客愿付 300 美元也应卖——多载一人的边际成本只是一罐软饮料，价格高于边际成本即有利可图。"},{"t":"例子（水与钻石悖论）：支付意愿取决于增加一单位物品的边际收益，而边际收益取决于已拥有多少——水不可缺但太多，多一杯的边际收益微不足道；钻石非必需但稀少，多一颗的边际收益很大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（水与钻石悖论）：支付意愿取决于增加一单位物品的边际收益，而边际收益取决于已拥有多少——水不可缺但太多，多一杯的边际收益微不足道；钻石非必需但稀少，多一颗的边际收益很大。"},{"t":"结论：当且仅当一种行为的边际收益大于边际成本时，理性决策者才采取行动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：当且仅当一种行为的边际收益大于边际成本时，理性决策者才采取行动。"}],"k":"b","i":1,"h":"<strong class=\"lead\">原理三</strong>：理性人考虑边际量"},{"t":"原理四：人们会对激励做出反应","c":[{"t":"白话解释：激励（incentive）是引起一个人做出行动的某种东西（如对惩罚或奖励的预期）；成本或收益一变，行为随之改变——有经济学家称\"整个经济学可以概括为：人们会对激励做出反应，其余内容都是对此的解释\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">白话解释</strong>：激励（incentive）是引起一个人做出行动的某种东西（如对惩罚或奖励的预期）；成本或收益一变，行为随之改变——有经济学家称&quot;整个经济学可以概括为：人们会对激励做出反应，其余内容都是对此的解释&quot;。"},{"t":"例子（市场）：苹果价格上涨 → 人们少吃苹果、果园主多雇工人多摘苹果；高价给买者少消费、卖者多生产的激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（市场）：苹果价格上涨 → 人们少吃苹果、果园主多雇工人多摘苹果；高价给买者少消费、卖者多生产的激励。"},{"t":"例子（汽油税）：汽油税鼓励开小型节油车——欧洲汽油税比美国高，开小型车的人更多；还鼓励拼车、乘公交、住在离工作近的地方，税足够高人们就开电动车。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（汽油税）：汽油税鼓励开小型节油车——欧洲汽油税比美国高，开小型车的人更多；还鼓励拼车、乘公交、住在离工作近的地方，税足够高人们就开电动车。"},{"t":"例子（安全带法）：1965 年纳德《任何速度都不安全》引发国会立法强制安全带。直接影响：车祸存活概率提高；间接影响：车祸代价下降 → 谨慎开车的收益减少 → 开得更快更不谨慎 → 车祸次数增加、行人死亡上升。佩兹曼（Sam Peltzman，1975）：这些法律减少了每次车祸的死亡人数但增加了车祸次数，司机死亡变动很小、行人死亡增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（安全带法）：1965 年纳德《任何速度都不安全》引发国会立法强制安全带。直接影响：车祸存活概率提高；间接影响：车祸代价下降 → 谨慎开车的收益减少 → 开得更快更不谨慎 → 车祸次数增加、行人死亡上升。佩兹曼（Sam Peltzman，1975）：这些法律减少了每次车祸的死亡人数但增加了车祸次数，司机死亡变动很小、行人死亡增加。"},{"t":"启示：分析任何政策，既要看直接影响，也要看它通过激励产生的不太明显的间接影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">启示</strong>：分析任何政策，既要看直接影响，也要看它通过激励产生的不太明显的间接影响。"}],"k":"b","i":1,"h":"<strong class=\"lead\">原理四</strong>：人们会对激励做出反应"},{"t":"即问即答（1.1 之后）","c":[{"t":"描述一个你最近面临的重要的权衡取舍问题。","c":[],"k":"b","i":2,"h":"描述一个你最近面临的重要的权衡取舍问题。"},{"t":"举出一个既有货币性机会成本又有非货币性机会成本的行动的例子。","c":[],"k":"b","i":2,"h":"举出一个既有货币性机会成本又有非货币性机会成本的行动的例子。"},{"t":"描述一个你的父母为影响你的行为而向你提供激励的例子。","c":[],"k":"b","i":2,"h":"描述一个你的父母为影响你的行为而向你提供激励的例子。"}],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答</strong>（1.1 之后）"}],"k":"sec","i":0,"h":"1.1 人们如何做出决策"},{"t":"1.2 人们如何相互影响","c":[{"t":"总起：许多决策不仅影响自己，还会影响其他人，以下三条原理讨论人们如何相互影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总起</strong>：许多决策不仅影响自己，还会影响其他人，以下三条原理讨论人们如何相互影响。"},{"t":"原理五：贸易可以使每个人的状况都变得更好","c":[{"t":"白话解释：贸易不是体育比赛式的你赢我输；通过分工与交换，每个人都能以较低成本获得更多种类的物品与服务。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">白话解释</strong>：贸易不是体育比赛式的你赢我输；通过分工与交换，每个人都能以较低成本获得更多种类的物品与服务。"},{"t":"例子（家庭）：各家庭在求职、购物上相互竞争，但若与其他家庭隔绝，就得自己种粮、做衣、盖房；贸易使每个人专门从事自己最擅长的活动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（家庭）：各家庭在求职、购物上相互竞争，但若与其他家庭隔绝，就得自己种粮、做衣、盖房；贸易使每个人专门从事自己最擅长的活动。"},{"t":"例子（国家）：中美企业在服装、玩具、太阳能电池板、汽车轮胎等市场争夺同一批顾客，但两国贸易可使双方状况都更好——中国人和法国人、埃及人、巴西人一样，在世界经济中既是竞争对手又是伙伴。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（国家）：中美企业在服装、玩具、太阳能电池板、汽车轮胎等市场争夺同一批顾客，但两国贸易可使双方状况都更好——中国人和法国人、埃及人、巴西人一样，在世界经济中既是竞争对手又是伙伴。"}],"k":"b","i":1,"h":"<strong class=\"lead\">原理五</strong>：贸易可以使每个人的状况都变得更好"},{"t":"原理六：市场通常是组织经济活动的一种好方法","c":[{"t":"白话解释：市场经济（market economy）中，中央计划者的决策被千百万企业和家庭的决策取代，价格和利己引导分散决策，却被证明能促进总体经济福利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">白话解释</strong>：市场经济（market economy）中，中央计划者的决策被千百万企业和家庭的决策取代，价格和利己引导分散决策，却被证明能促进总体经济福利。"},{"t":"例子（历史）：20 世纪 80 年代末 90 年代初苏联解体、东欧剧变后，原中央计划经济国家转向市场经济——计划者缺乏消费者偏好与生产者成本的信息，而这些信息在市场经济中都反映在价格上。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（历史）：20 世纪 80 年代末 90 年代初苏联解体、东欧剧变后，原中央计划经济国家转向市场经济——计划者缺乏消费者偏好与生产者成本的信息，而这些信息在市场经济中都反映在价格上。"},{"t":"例子（看不见的手）：亚当·斯密 1776 年《国富论》——家庭和企业在市场上交易时仿佛被一只\"看不见的手\"指引，带来合意的市场结果；价格就是看不见的手用来指引经济活动的工具。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（看不见的手）：亚当·斯密 1776 年《国富论》——家庭和企业在市场上交易时仿佛被一只&quot;看不见的手&quot;指引，带来合意的市场结果；价格就是看不见的手用来指引经济活动的工具。"},{"t":"推论：当政府阻止价格根据供求自发调整时（税收扭曲价格、租金控制直接定价），就限制了看不见的手的协调能力——这也解释了中央计划经济的失败。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推论</strong>：当政府阻止价格根据供求自发调整时（税收扭曲价格、租金控制直接定价），就限制了看不见的手的协调能力——这也解释了中央计划经济的失败。"}],"k":"b","i":1,"h":"<strong class=\"lead\">原理六</strong>：市场通常是组织经济活动的一种好方法"},{"t":"参考资料：亚当·斯密与看不见的手","c":[{"t":"《国富论》1776 年出版，恰与美国《独立宣言》同年，两份文献共同表达\"让人们各行其是，胜过政府沉重之手的指导\"的流行思想。","c":[],"k":"b","i":2,"h":"《国富论》1776 年出版，恰与美国《独立宣言》同年，两份文献共同表达&quot;让人们各行其是，胜过政府沉重之手的指导&quot;的流行思想。"},{"t":"名言：我们每天的食物和饮料不是出自屠户、酿酒师或面包师的恩惠，而是出自他们利己的打算——他追求自己的利益，往往能比在真正出于本意时更有效地促进社会的利益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">名言</strong>：我们每天的食物和饮料不是出自屠户、酿酒师或面包师的恩惠，而是出自他们利己的打算——他追求自己的利益，往往能比在真正出于本意时更有效地促进社会的利益。"}],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料</strong>：亚当·斯密与看不见的手"},{"t":"案例研究：亚当·斯密会爱上优步","c":[{"t":"情境：许多城市以牌照数量与定价严格管制出租车市场；2009 年起优步（Uber）用手机应用连接乘客与司机，提供几乎相同的服务且不受同样管制，还允许需求旺盛时（暴雨、新年前夜）大幅提价。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情境</strong>：许多城市以牌照数量与定价严格管制出租车市场；2009 年起优步（Uber）用手机应用连接乘客与司机，提供几乎相同的服务且不受同样管制，还允许需求旺盛时（暴雨、新年前夜）大幅提价。"},{"t":"要点：涨价是激励——司机在消费者最需要时提供更多服务；价格把车配置给支付意愿最高的乘客，并减少寻找与等待出租车的成本；传统出租车司机抱怨新竞争并不奇怪，但生产者之间的激烈竞争使市场运行得更好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">要点</strong>：涨价是激励——司机在消费者最需要时提供更多服务；价格把车配置给支付意愿最高的乘客，并减少寻找与等待出租车的成本；传统出租车司机抱怨新竞争并不奇怪，但生产者之间的激烈竞争使市场运行得更好。"},{"t":"证据：2014 年针对几十位著名经济学家的调研——每一位都认为优步类叫车服务增加了消费者福利，85% 认为涨价也增加了消费者福利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证据</strong>：2014 年针对几十位著名经济学家的调研——每一位都认为优步类叫车服务增加了消费者福利，85% 认为涨价也增加了消费者福利。"}],"k":"b","i":1,"h":"<strong class=\"lead\">案例研究</strong>：亚当·斯密会爱上优步"},{"t":"原理七：政府有时可以改善市场结果","c":[{"t":"白话解释：看不见的手强大但并非无所不能；政府干预的两类原因是促进效率或促进平等——要么把经济蛋糕做大，要么改变蛋糕的分割方式。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">白话解释</strong>：看不见的手强大但并非无所不能；政府干预的两类原因是促进效率或促进平等——要么把经济蛋糕做大，要么改变蛋糕的分割方式。"},{"t":"原因一（产权）：市场经济需要实施产权（property rights）制度——农民预见谷物被偷就不种庄稼，餐馆不确保付费就不供餐，电影公司怕盗版就不拍电影；警察与法庭负责实施产权。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原因一</strong>（产权）：市场经济需要实施产权（property rights）制度——农民预见谷物被偷就不种庄稼，餐馆不确保付费就不供餐，电影公司怕盗版就不拍电影；警察与法庭负责实施产权。"},{"t":"原因二（市场失灵）：市场失灵（market failure）指市场本身不能有效配置资源。一是外部性（externality）——一个人的行为对旁观者的福利产生影响，经典例子是污染；二是市场权力（market power）——单个个人或公司（或小群体）不适当地影响市场价格的能力，如小镇只有一口井，井主可限制产量收取高价。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原因二</strong>（市场失灵）：市场失灵（market failure）指市场本身不能有效配置资源。一是外部性（externality）——一个人的行为对旁观者的福利产生影响，经典例子是污染；二是市场权力（market power）——单个个人或公司（或小群体）不适当地影响市场价格的能力，如小镇只有一口井，井主可限制产量收取高价。"},{"t":"平等角度：看不见的手不保证人人拥有充足的食物、体面的衣服和完善的医疗保健——最优秀的篮球运动员比最优秀的棋手赚得多，只因人们更愿为看篮球付费；所得税与福利制度旨在实现更平等的分配。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">平等角度</strong>：看不见的手不保证人人拥有充足的食物、体面的衣服和完善的医疗保健——最优秀的篮球运动员比最优秀的棋手赚得多，只因人们更愿为看篮球付费；所得税与福利制度旨在实现更平等的分配。"},{"t":"提醒：政府\"有时\"可以改善市场结果，不意味着总能——政策由不完善的政治程序制定，有时为政治上有权势者设计，有时由动机良好但信息不充分的领导人制定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">提醒</strong>：政府&quot;有时&quot;可以改善市场结果，不意味着总能——政策由不完善的政治程序制定，有时为政治上有权势者设计，有时由动机良好但信息不充分的领导人制定。"}],"k":"b","i":1,"h":"<strong class=\"lead\">原理七</strong>：政府有时可以改善市场结果"},{"t":"即问即答（1.2 之后）","c":[{"t":"为什么如果一个国家不把自己和其他国家隔离开来，其状况会更好？","c":[],"k":"b","i":2,"h":"为什么如果一个国家不把自己和其他国家隔离开来，其状况会更好？"},{"t":"为什么我们会有市场？根据经济学家的观点，政府应当在市场中扮演怎样的角色？","c":[],"k":"b","i":2,"h":"为什么我们会有市场？根据经济学家的观点，政府应当在市场中扮演怎样的角色？"}],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答</strong>（1.2 之后）"}],"k":"sec","i":0,"h":"1.2 人们如何相互影响"},{"t":"1.3 整体经济如何运行","c":[{"t":"总起：个人决策与相互影响共同组成\"经济\"，最后三条原理涉及整体经济的运行。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总起</strong>：个人决策与相互影响共同组成&quot;经济&quot;，最后三条原理涉及整体经济的运行。"},{"t":"原理八：一国的生活水平取决于它生产物品与服务的能力","c":[{"t":"白话解释：生产率（productivity）——每一单位劳动投入所生产的物品与服务数量——是生活水平的首要决定因素；一国生产率的增长率决定其平均收入的增长率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">白话解释</strong>：生产率（productivity）——每一单位劳动投入所生产的物品与服务数量——是生活水平的首要决定因素；一国生产率的增长率决定其平均收入的增长率。"},{"t":"例子（国别差距）：2014 年人均收入美国约 55000 美元、墨西哥约 17000 美元、中国约 13000 美元、尼日利亚约 6000 美元；高收入国家公民拥有更多电视、汽车、更好的营养、医疗与更长的预期寿命。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（国别差距）：2014 年人均收入美国约 55000 美元、墨西哥约 17000 美元、中国约 13000 美元、尼日利亚约 6000 美元；高收入国家公民拥有更多电视、汽车、更好的营养、医疗与更长的预期寿命。"},{"t":"例子（时间变化）：美国历史上收入年均增长约 2%（剔除生活费用变动），人均收入每 35 年翻一番，过去一个世纪增长约 8 倍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（时间变化）：美国历史上收入年均增长约 2%（剔除生活费用变动），人均收入每 35 年翻一番，过去一个世纪增长约 8 倍。"},{"t":"应用辨析：20 世纪美国工人生活水平提高的真正英雄是不断提高的生产率，而非工会或最低工资法；70—80 年代收入增长放缓的真正原因是美国生产率增长放缓，而非来自日本等国的竞争。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用辨析</strong>：20 世纪美国工人生活水平提高的真正英雄是不断提高的生产率，而非工会或最低工资法；70—80 年代收入增长放缓的真正原因是美国生产率增长放缓，而非来自日本等国的竞争。"},{"t":"政策含义：提高生活水平的关键是提高生产率——让工人受良好教育、拥有工具、获取最好的技术。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政策含义</strong>：提高生活水平的关键是提高生产率——让工人受良好教育、拥有工具、获取最好的技术。"}],"k":"b","i":1,"h":"<strong class=\"lead\">原理八</strong>：一国的生活水平取决于它生产物品与服务的能力"},{"t":"原理九：当政府发行了过多货币时，物价上升","c":[{"t":"白话解释：通货膨胀（inflation）指经济中物价总水平的上升；在大多数严重或持续的通货膨胀中，罪魁祸首是货币量的增长——政府发行大量货币，货币价值就下降。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">白话解释</strong>：通货膨胀（inflation）指经济中物价总水平的上升；在大多数严重或持续的通货膨胀中，罪魁祸首是货币量的增长——政府发行大量货币，货币价值就下降。"},{"t":"例子（德国恶性通胀）：1921 年 1 月一份日报 0.3 马克，1922 年 11 月同一份报纸 7000 万马克；物价平均每月上升 3 倍时，货币量每月也增加 3 倍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（德国恶性通胀）：1921 年 1 月一份日报 0.3 马克，1922 年 11 月同一份报纸 7000 万马克；物价平均每月上升 3 倍时，货币量每月也增加 3 倍。"},{"t":"例子（美国对照）：20 世纪 70 年代物价总水平翻了一番多，福特总统称通胀是\"公众的头号敌人\"；21 世纪前十年通胀平均每年 2.5%，物价翻一番需近 30 年——高通胀让社会付出成本，各国都把低通胀作为目标之一。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（美国对照）：20 世纪 70 年代物价总水平翻了一番多，福特总统称通胀是&quot;公众的头号敌人&quot;；21 世纪前十年通胀平均每年 2.5%，物价翻一番需近 30 年——高通胀让社会付出成本，各国都把低通胀作为目标之一。"}],"k":"b","i":1,"h":"<strong class=\"lead\">原理九</strong>：当政府发行了过多货币时，物价上升"},{"t":"原理十：社会面临通货膨胀与失业之间的短期权衡取舍","c":[{"t":"白话解释：短期链条——货币量增加 → 整体支出与物品服务需求增加 → 企业提高物价的同时雇用更多工人、生产更多 → 失业减少；由此形成整个经济范围内通胀与失业的短期权衡取舍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">白话解释</strong>：短期链条——货币量增加 → 整体支出与物品服务需求增加 → 企业提高物价的同时雇用更多工人、生产更多 → 失业减少；由此形成整个经济范围内通胀与失业的短期权衡取舍。"},{"t":"应用：这种权衡取舍在分析经济周期（business cycle）——用生产的物品与服务量或雇用人数衡量的、无规律且很大程度上无法预测的经济活动波动——中起关键作用；决策者可通过政府支出、税收与货币发行影响总需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用</strong>：这种权衡取舍在分析经济周期（business cycle）——用生产的物品与服务量或雇用人数衡量的、无规律且很大程度上无法预测的经济活动波动——中起关键作用；决策者可通过政府支出、税收与货币发行影响总需求。"},{"t":"例子（2008—2009 衰退）：住房市场不良拖欠引发金融体系问题扩散，收入下降、失业激增；奥巴马推出减税与增加支出的一揽子刺激计划，美联储增加货币供给，目标是减少失业——但有人担心这些政策随时间推移引起过高的通货膨胀。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>（2008—2009 衰退）：住房市场不良拖欠引发金融体系问题扩散，收入下降、失业激增；奥巴马推出减税与增加支出的一揽子刺激计划，美联储增加货币供给，目标是减少失业——但有人担心这些政策随时间推移引起过高的通货膨胀。"}],"k":"b","i":1,"h":"<strong class=\"lead\">原理十</strong>：社会面临通货膨胀与失业之间的短期权衡取舍"},{"t":"即问即答（1.3 之后）","c":[{"t":"列出并简要解释描述整体经济如何运行的三个原理。","c":[],"k":"b","i":2,"h":"列出并简要解释描述整体经济如何运行的三个原理。"}],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答</strong>（1.3 之后）"}],"k":"sec","i":0,"h":"1.3 整体经济如何运行"},{"t":"1.4 结论","c":[{"t":"经济学建立在几个可应用于许多不同情况的基本思想上；全书将反复回到十大原理（表 1-1）——记住这些基本原理，因为即使最复杂的经济分析也是用它们构建起来的。","c":[],"k":"b","i":1,"h":"经济学建立在几个可应用于许多不同情况的基本思想上；全书将反复回到十大原理（表 1-1）——记住这些基本原理，因为即使最复杂的经济分析也是用它们构建起来的。"}],"k":"sec","i":0,"h":"1.4 结论"}],"k":"chap","h":"第1章 经济学十大原理"},{"t":"第2章 像经济学家一样思考","c":[{"t":"本章内容提要","c":[{"t":"经济学家像科学家一样以客观态度研究经济：先提出理论，再收集数据，然后分析数据以证明或批驳理论；由于无法进行实验室实验，常借助历史事件提供的\"自然实验\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经济学家像科学家一样以客观态度研究经济</strong>：先提出理论，再收集数据，然后分析数据以证明或批驳理论；由于无法进行实验室实验，常借助历史事件提供的&quot;自然实验&quot;。"},{"t":"假设的作用是使复杂的世界简单化；科学思考的艺术就是决定做出什么假设（研究短期效应可假设价格固定，研究长期效应则假设价格完全可变）。","c":[],"k":"b","i":1,"h":"假设的作用是使复杂的世界简单化；科学思考的艺术就是决定做出什么假设（研究短期效应可假设价格固定，研究长期效应则假设价格完全可变）。"},{"t":"经济模型都建立在假设之上并进行了简化；两个最简单的经济模型是循环流量图和生产可能性边界。","c":[],"k":"b","i":1,"h":"经济模型都建立在假设之上并进行了简化；两个最简单的经济模型是循环流量图和生产可能性边界。"},{"t":"循环流量图把经济简化为家庭与企业两类决策者，在物品与服务市场和生产要素市场两类市场上相互交易；外环代表货币流向，内环代表投入与产出的流向。","c":[],"k":"b","i":1,"h":"循环流量图把经济简化为家庭与企业两类决策者，在物品与服务市场和生产要素市场两类市场上相互交易；外环代表货币流向，内环代表投入与产出的流向。"},{"t":"生产可能性边界表明在要素与技术既定时经济所能生产的产量组合：边界上的点有效率，边界内的点无效率，边界外的点无法实现；边界斜率衡量机会成本；技术进步使边界向外移动（经济增长）。","c":[],"k":"b","i":1,"h":"生产可能性边界表明在要素与技术既定时经济所能生产的产量组合：边界上的点有效率，边界内的点无效率，边界外的点无法实现；边界斜率衡量机会成本；技术进步使边界向外移动（经济增长）。"},{"t":"经济学分为两个分领域：微观经济学研究家庭和企业的决策与市场交易，宏观经济学研究通货膨胀、失业和经济增长等整体经济现象。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经济学分为两个分领域</strong>：微观经济学研究家庭和企业的决策与市场交易，宏观经济学研究通货膨胀、失业和经济增长等整体经济现象。"},{"t":"实证表述描述世界是什么，原则上可通过证据检验；规范表述描述世界应该是什么，评价既涉及事实也涉及价值观；经济学家做出规范表述时是站在政策顾问立场上。","c":[],"k":"b","i":1,"h":"实证表述描述世界是什么，原则上可通过证据检验；规范表述描述世界应该是什么，评价既涉及事实也涉及价值观；经济学家做出规范表述时是站在政策顾问立场上。"},{"t":"经济学家意见分歧有两个基本原因：科学判断不同与价值观不同；但经济学家之间的共识远超公众印象，其建议未被采纳也与政治过程的力量和约束有关。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经济学家意见分歧有两个基本原因</strong>：科学判断不同与价值观不同；但经济学家之间的共识远超公众印象，其建议未被采纳也与政治过程的力量和约束有关。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"2.1 作为科学家的经济学家","c":[{"t":"经济学家努力以科学家的客观性探讨主题，与物理学家研究物质、生物学家研究生命的方法基本相同：先提出理论，再收集数据，然后分析数据以证明或批驳理论；科学的本质是科学方法——冷静地建立并检验有关世界如何运行的各种理论。","c":[],"k":"b","i":1,"h":"经济学家努力以科学家的客观性探讨主题，与物理学家研究物质、生物学家研究生命的方法基本相同：先提出理论，再收集数据，然后分析数据以证明或批驳理论；科学的本质是科学方法——冷静地建立并检验有关世界如何运行的各种理论。"},{"t":"2.1.1 科学方法：观察、理论和进一步观察","c":[{"t":"理论与观察的相互作用同样发生在经济学中：受高通货膨胀的观察刺激而提出\"政府发行过多货币引起通胀\"的理论，再用各国价格与货币量数据检验——事实上货币量增长与通货膨胀密切相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理论与观察的相互作用同样发生在经济学中</strong>：受高通货膨胀的观察刺激而提出&quot;政府发行过多货币引起通胀&quot;的理论，再用各国价格与货币量数据检验——事实上货币量增长与通货膨胀密切相关。"},{"t":"经济学研究的特殊障碍：进行实验往往不可能（不能仅为获得数据就操控一国的货币政策），经济学家像天文学家、进化生物学家一样只能使用这个世界向他们提供的数据。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学研究的特殊障碍</strong>：进行实验往往不可能（不能仅为获得数据就操控一国的货币政策），经济学家像天文学家、进化生物学家一样只能使用这个世界向他们提供的数据。"},{"t":"替代办法是关注历史提供的自然实验：如中东战争中断原油运输使石油价格飞涨，为研究重要自然资源如何影响世界经济提供了机会。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">替代办法是关注历史提供的自然实验</strong>：如中东战争中断原油运输使石油价格飞涨，为研究重要自然资源如何影响世界经济提供了机会。"}],"k":"b","i":1,"h":"<strong class=\"lead\">2.1.1 科学方法</strong>：观察、理论和进一步观察"},{"t":"2.1.2 假设的作用","c":[{"t":"经济学家做出假设是为了使复杂的世界简单化、使解释世界变得更容易：如研究国际贸易时可假设世界只由两个国家组成、每个国家只生产两种产品。","c":[],"k":"b","i":2,"h":"经济学家做出假设是为了使复杂的世界简单化、使解释世界变得更容易：如研究国际贸易时可假设世界只由两个国家组成、每个国家只生产两种产品。"},{"t":"科学思考的艺术就是决定做出什么假设：物理学家对下落的大理石可假设真空无摩擦，对下落的沙滩球则不能忽略摩擦——不同问题用不同假设。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">科学思考的艺术就是决定做出什么假设</strong>：物理学家对下落的大理石可假设真空无摩擦，对下落的沙滩球则不能忽略摩擦——不同问题用不同假设。"},{"t":"经济学例：研究货币量变动的短期效应可假设价格完全固定（极端而人为的假设），研究长期效应则假设所有价格完全可变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学例</strong>：研究货币量变动的短期效应可假设价格完全固定（极端而人为的假设），研究长期效应则假设所有价格完全可变。"}],"k":"b","i":1,"h":"2.1.2 假设的作用"},{"t":"2.1.3 经济模型","c":[{"t":"经济学家用由图形和方程组成的模型了解世界（类比高中生物教师的塑料人体模型）：模型略去许多细节，以便使我们了解真正重要的东西。","c":[],"k":"b","i":2,"h":"经济学家用由图形和方程组成的模型了解世界（类比高中生物教师的塑料人体模型）：模型略去许多细节，以便使我们了解真正重要的东西。"},{"t":"所有模型——物理学的、生物学的和经济学的——都建立在假设之上，都为了加深对现实的理解而进行了简化。","c":[],"k":"b","i":2,"h":"所有模型——物理学的、生物学的和经济学的——都建立在假设之上，都为了加深对现实的理解而进行了简化。"}],"k":"b","i":1,"h":"2.1.3 经济模型"},{"t":"2.1.4 我们的第一个模型：循环流量图","c":[{"t":"循环流量图（circular-flow diagram）：一个说明货币如何通过市场在家庭与企业之间流动的直观经济模型。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">循环流量图</strong>（circular-flow diagram）：一个说明货币如何通过市场在家庭与企业之间流动的直观经济模型。"},{"t":"两类决策者：企业用劳动、土地和资本（建筑物和机器）等投入品生产物品与服务，这些投入品被称为生产要素（factors of production）；家庭拥有生产要素并消费企业生产的所有物品与服务。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两类决策者</strong>：企业用劳动、土地和资本（建筑物和机器）等投入品生产物品与服务，这些投入品被称为生产要素（factors of production）；家庭拥有生产要素并消费企业生产的所有物品与服务。"},{"t":"两类市场：在物品与服务市场上，家庭是买者而企业是卖者；在生产要素市场上，企业是买者而家庭是卖者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两类市场</strong>：在物品与服务市场上，家庭是买者而企业是卖者；在生产要素市场上，企业是买者而家庭是卖者。"},{"t":"内环代表投入与产出的流向，外环代表相应的货币流动：家庭把要素出售给企业，企业用要素生产物品与服务再售给家庭；家庭付钱购买，企业用销售收入支付工资等要素报酬，剩下的收入是企业所有者的利润，而企业所有者本身也是家庭的成员。","c":[],"k":"b","i":2,"h":"内环代表投入与产出的流向，外环代表相应的货币流动：家庭把要素出售给企业，企业用要素生产物品与服务再售给家庭；家庭付钱购买，企业用销售收入支付工资等要素报酬，剩下的收入是企业所有者的利润，而企业所有者本身也是家庭的成员。"},{"t":"跟踪1美元的旅行：这1美元从家庭钱包到星巴克收银机（成为企业收益），企业再用它付租金或工资，于是它又成为某个家庭的收入、回到某个人的钱包，循环又一次开始。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">跟踪1美元的旅行</strong>：这1美元从家庭钱包到星巴克收银机（成为企业收益），企业再用它付租金或工资，于是它又成为某个家庭的收入、回到某个人的钱包，循环又一次开始。"},{"t":"更现实的模型应包括政府与国际贸易（那1美元可能用于纳税或购买巴西农民的咖啡豆），但这些细节对理解经济的组织方式并非至关重要。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">更现实的模型应包括政府与国际贸易</strong>（那1美元可能用于纳税或购买巴西农民的咖啡豆），但这些细节对理解经济的组织方式并非至关重要。"}],"k":"b","i":1,"h":"<strong class=\"lead\">2.1.4 我们的第一个模型</strong>：循环流量图"},{"t":"2.1.5 我们的第二个模型：生产可能性边界","c":[{"t":"生产可能性边界（production possibilities frontier）：表示在可得到的生产要素与生产技术既定时，一个经济所能生产的产品数量的各种组合的图形。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">生产可能性边界</strong>（production possibilities frontier）：表示在可得到的生产要素与生产技术既定时，一个经济所能生产的产品数量的各种组合的图形。"},{"t":"例（只生产汽车与电脑的经济）：全部资源用于汽车行业可产1000辆汽车，全部用于电脑行业可产3000台电脑，二者为边界端点；经济可在边界上（如A点600辆汽车+2200台电脑、B点700辆+2000台）及边界以内任何一点生产；边界外的C点因生产要素不足而无法实现。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例</strong>（只生产汽车与电脑的经济）：全部资源用于汽车行业可产1000辆汽车，全部用于电脑行业可产3000台电脑，二者为边界端点；经济可在边界上（如A点600辆汽车+2200台电脑、B点700辆+2000台）及边界以内任何一点生产；边界外的C点因生产要素不足而无法实现。"},{"t":"效率：如果经济从它可以获得的稀缺资源中获得了它能得到的全部东西，这种结果就是有效率的；边界上的点代表有效率的生产水平（不减少一种物品的生产就无法生产更多另一种物品），边界内的D点（300辆+1000台，或因普遍失业）代表无效率，消除无效率来源可同时增加两种物品的产量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效率</strong>：如果经济从它可以获得的稀缺资源中获得了它能得到的全部东西，这种结果就是有效率的；边界上的点代表有效率的生产水平（不减少一种物品的生产就无法生产更多另一种物品），边界内的D点（300辆+1000台，或因普遍失业）代表无效率，消除无效率来源可同时增加两种物品的产量。"},{"t":"权衡取舍与机会成本：从A点移到B点，社会多生产100辆汽车的代价是少生产200台电脑，即在A点每辆汽车的机会成本是2台电脑；一种物品的机会成本等于生产可能性边界的斜率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">权衡取舍与机会成本</strong>：从A点移到B点，社会多生产100辆汽车的代价是少生产200台电脑，即在A点每辆汽车的机会成本是2台电脑；一种物品的机会成本等于生产可能性边界的斜率。"},{"t":"机会成本随产量组合变化，反映在边界形状上：边界凹向原点——经济生产大量汽车少量电脑时（E点）边界陡峭、汽车的机会成本最高；生产少量汽车大量电脑时（F点）边界平坦、机会成本较低，因为资源并非同样适用于两种生产（如把最好的电脑技工调去造汽车代价很大）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机会成本随产量组合变化，反映在边界形状上</strong>：边界凹向原点——经济生产大量汽车少量电脑时（E点）边界陡峭、汽车的机会成本最高；生产少量汽车大量电脑时（F点）边界平坦、机会成本较低，因为资源并非同样适用于两种生产（如把最好的电脑技工调去造汽车代价很大）。"},{"t":"边界的移动：电脑行业的技术进步使经济在任一既定汽车产量下都能生产更多电脑，生产可能性边界向外移动（汽车端点仍为1000辆不变）；社会从A点（600辆、2200台）移到新边界上的G点（650辆、2300台），两种物品产量都增加——这就是经济增长。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边界的移动</strong>：电脑行业的技术进步使经济在任一既定汽车产量下都能生产更多电脑，生产可能性边界向外移动（汽车端点仍为1000辆不变）；社会从A点（600辆、2200台）移到新边界上的G点（650辆、2300台），两种物品产量都增加——这就是经济增长。"},{"t":"生产可能性边界简化的经济强调了五个基本概念：稀缺性、效率、权衡取舍、机会成本和经济增长。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">生产可能性边界简化的经济强调了五个基本概念</strong>：稀缺性、效率、权衡取舍、机会成本和经济增长。"}],"k":"b","i":1,"h":"<strong class=\"lead\">2.1.5 我们的第二个模型</strong>：生产可能性边界"},{"t":"2.1.6 微观经济学与宏观经济学","c":[{"t":"微观经济学（microeconomics）：研究家庭和企业如何做出决策，以及它们如何在特定市场上相互交易的学科（如租金控制对纽约市住房的影响、外国竞争对美国汽车行业的影响、义务教育对工人收入的影响）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">微观经济学</strong>（microeconomics）：研究家庭和企业如何做出决策，以及它们如何在特定市场上相互交易的学科（如租金控制对纽约市住房的影响、外国竞争对美国汽车行业的影响、义务教育对工人收入的影响）。"},{"t":"宏观经济学（macroeconomics）：研究整体经济现象，包括通货膨胀、失业和经济增长的学科（如联邦政府借债的影响、失业率随时间的变动、提高一国生活水平的不同政策）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">宏观经济学</strong>（macroeconomics）：研究整体经济现象，包括通货膨胀、失业和经济增长的学科（如联邦政府借债的影响、失业率随时间的变动、提高一国生活水平的不同政策）。"},{"t":"两者紧密相关：整体经济的变动产生于千百万个人的决策，不考虑微观决策就无法理解宏观发展；但因强调的问题不同、各有一套模型，通常在不同课程中讲授。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两者紧密相关</strong>：整体经济的变动产生于千百万个人的决策，不考虑微观决策就无法理解宏观发展；但因强调的问题不同、各有一套模型，通常在不同课程中讲授。"}],"k":"b","i":1,"h":"2.1.6 微观经济学与宏观经济学"},{"t":"即问即答要点：经济学像科学在于运用科学方法（观察—理论—进一步观察）；只生产食物与衣服的社会，其PPF上有效率点在边界上、无效率点在边界内、不可能实现的点在边界外，旱灾使边界向内移动；微观与宏观的定义如上。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：经济学像科学在于运用科学方法（观察—理论—进一步观察）；只生产食物与衣服的社会，其PPF上有效率点在边界上、无效率点在边界内、不可能实现的点在边界外，旱灾使边界向内移动；微观与宏观的定义如上。"}],"k":"sec","i":0,"h":"2.1 作为科学家的经济学家"},{"t":"2.2 作为政策顾问的经济学家","c":[{"t":"角色区分：当经济学家试图去解释世界时，他们是科学家；当经济学家试图去帮助改善世界时，他们是政策顾问。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">角色区分</strong>：当经济学家试图去解释世界时，他们是科学家；当经济学家试图去帮助改善世界时，他们是政策顾问。"},{"t":"2.2.1 实证分析与规范分析","c":[{"t":"实证表述（positive statements）：试图描述世界是什么样子的观点，是描述性的（如Portia：\"最低工资法引起了失业\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实证表述</strong>（positive statements）：试图描述世界是什么样子的观点，是描述性的（如Portia：&quot;最低工资法引起了失业&quot;）。"},{"t":"规范表述（normative statements）：试图描述世界应该是什么样子的观点，是规定性的（如Noah：\"政府应该提高最低工资\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">规范表述</strong>（normative statements）：试图描述世界应该是什么样子的观点，是规定性的（如Noah：&quot;政府应该提高最低工资&quot;）。"},{"t":"关键区别在于如何判断正确性：实证表述原则上可通过检验证据来确认或否定（如分析最低工资变动与失业变动的数据）；对规范表述的评价既涉及事实也涉及价值观，仅靠数据不能判断，还涉及对伦理、宗教和政治哲学的看法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键区别在于如何判断正确性</strong>：实证表述原则上可通过检验证据来确认或否定（如分析最低工资变动与失业变动的数据）；对规范表述的评价既涉及事实也涉及价值观，仅靠数据不能判断，还涉及对伦理、宗教和政治哲学的看法。"},{"t":"两者相互关联：关于世界如何运行的实证观点会影响关于什么政策合意的规范观点，但规范结论不能仅根据实证分析，还要涉及价值判断。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两者相互关联</strong>：关于世界如何运行的实证观点会影响关于什么政策合意的规范观点，但规范结论不能仅根据实证分析，还要涉及价值判断。"}],"k":"b","i":1,"h":"2.2.1 实证分析与规范分析"},{"t":"2.2.2 华盛顿的经济学家们","c":[{"t":"杜鲁门想找\"独臂\"经济学家（免听\"一方面……另一方面\"），其根源是政策决策涉及权衡取舍：提高效率的政策可能损害平等，造福子孙后代的政策可能损害当前一代；认为所有政策都轻而易举或利弊分明的经济学家不值得信任。","c":[],"k":"b","i":2,"h":"杜鲁门想找&quot;独臂&quot;经济学家（免听&quot;一方面……另一方面&quot;），其根源是政策决策涉及权衡取舍：提高效率的政策可能损害平等，造福子孙后代的政策可能损害当前一代；认为所有政策都轻而易举或利弊分明的经济学家不值得信任。"},{"t":"自1946年以来，总统得到经济顾问委员会（三位委员和数十位经济学家）的指导，其职责是向总统提出建议并撰写每年的《总统经济报告》。","c":[],"k":"b","i":2,"h":"自1946年以来，总统得到经济顾问委员会（三位委员和数十位经济学家）的指导，其职责是向总统提出建议并撰写每年的《总统经济报告》。"},{"t":"其他渠道：管理与预算办公室（支出计划与监管政策）、财政部（税收政策）、劳工部（劳动市场政策）、司法部（反托拉斯法）；国会预算办公室向国会提供独立评价；美联储雇用数以百计经济学家分析美国和全世界的经济发展。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">其他渠道</strong>：管理与预算办公室（支出计划与监管政策）、财政部（税收政策）、劳工部（劳动市场政策）、司法部（反托拉斯法）；国会预算办公室向国会提供独立评价；美联储雇用数以百计经济学家分析美国和全世界的经济发展。"},{"t":"经济学家的影响超出顾问作用：凯恩斯指出，经济学家和政治哲学家的思想无论正确与否，实际上都比一般所想象的更有力量，\"那些自认为能够免受经济学家思想影响的实干家往往也只是某些已故经济学家的俘虏\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济学家的影响超出顾问作用</strong>：凯恩斯指出，经济学家和政治哲学家的思想无论正确与否，实际上都比一般所想象的更有力量，&quot;那些自认为能够免受经济学家思想影响的实干家往往也只是某些已故经济学家的俘虏&quot;。"}],"k":"b","i":1,"h":"2.2.2 华盛顿的经济学家们"},{"t":"2.2.3 为什么经济学家的建议并不总是被采纳","c":[{"t":"教科书讨论政策时仿佛由仁慈的国王选定正确政策即可实施；现实中年，总统在听取经济顾问意见后，还要听取公关、新闻、法律事务、政治等顾问的意见并权衡各方利弊。","c":[],"k":"b","i":2,"h":"教科书讨论政策时仿佛由仁慈的国王选定正确政策即可实施；现实中年，总统在听取经济顾问意见后，还要听取公关、新闻、法律事务、政治等顾问的意见并权衡各方利弊。"},{"t":"在代议制民主政体中，制定经济政策是一件麻烦的事情，总统（和其他政治家）往往有充分的理由不采用经济学家所建议的政策；经济学家的建议仅仅是这个复杂过程中的一种要素。","c":[],"k":"b","i":2,"h":"在代议制民主政体中，制定经济政策是一件麻烦的事情，总统（和其他政治家）往往有充分的理由不采用经济学家所建议的政策；经济学家的建议仅仅是这个复杂过程中的一种要素。"}],"k":"b","i":1,"h":"2.2.3 为什么经济学家的建议并不总是被采纳"},{"t":"即问即答要点：实证表述如\"最低工资法引起了失业\"，规范表述如\"政府应该提高最低工资\"；经常听取经济学家建议的三个部门如经济顾问委员会、财政部、国会预算办公室（另见管理与预算办公室、劳工部、司法部、美联储）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：实证表述如&quot;最低工资法引起了失业&quot;，规范表述如&quot;政府应该提高最低工资&quot;；经常听取经济学家建议的三个部门如经济顾问委员会、财政部、国会预算办公室（另见管理与预算办公室、劳工部、司法部、美联储）。"}],"k":"sec","i":0,"h":"2.2 作为政策顾问的经济学家"},{"t":"2.3 经济学家意见分歧的原因","c":[{"t":"经济学家给决策者相互矛盾的建议有两个基本原因：对世界如何运行的不同实证理论哪一种正确有不同的看法；价值观不同，对政策应该努力实现的目标有不同的规范观点。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经济学家给决策者相互矛盾的建议有两个基本原因</strong>：对世界如何运行的不同实证理论哪一种正确有不同的看法；价值观不同，对政策应该努力实现的目标有不同的规范观点。"},{"t":"2.3.1 科学判断的不同","c":[{"t":"经济学是一门年轻的科学，经济学家有时意见不一致，是因为他们对不同理论的正确性，或对衡量经济变量如何相关的重要参数的大小有不同的直觉。","c":[],"k":"b","i":2,"h":"经济学是一门年轻的科学，经济学家有时意见不一致，是因为他们对不同理论的正确性，或对衡量经济变量如何相关的重要参数的大小有不同的直觉。"},{"t":"例：政府应按收入还是按消费征税之争——支持把所得税改为消费税者认为这会鼓励储蓄、促进资本积累从而使生产率和生活水平更快增长；支持现行所得税者认为家庭储蓄不会对税法改变做出太大反应；两派规范观点不同，源于他们关于储蓄对税收激励反应程度的实证观点不同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例</strong>：政府应按收入还是按消费征税之争——支持把所得税改为消费税者认为这会鼓励储蓄、促进资本积累从而使生产率和生活水平更快增长；支持现行所得税者认为家庭储蓄不会对税法改变做出太大反应；两派规范观点不同，源于他们关于储蓄对税收激励反应程度的实证观点不同。"}],"k":"b","i":1,"h":"2.3.1 科学判断的不同"},{"t":"2.3.2 价值观的不同","c":[{"t":"例：为支付维修水井的费用，镇里向所有居民征税——收入15万美元的Peter被征1.5万美元（其收入的10%），收入3万美元的Paula被征6000美元（其收入的20%）；政策是否公平取决于收入高低的原因（继承遗产还是勤奋工作、身有残疾还是投身演艺），这是可能引起争论的难题。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例</strong>：为支付维修水井的费用，镇里向所有居民征税——收入15万美元的Peter被征1.5万美元（其收入的10%），收入3万美元的Paula被征6000美元（其收入的20%）；政策是否公平取决于收入高低的原因（继承遗产还是勤奋工作、身有残疾还是投身演艺），这是可能引起争论的难题。"},{"t":"不能只从科学的角度来判断政策：经济科学的不断完善并不能告诉我们Peter和Paula谁支付的税收太多；经济学家有时提出不一致的建议，正是因为他们有着不同的价值观。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不能只从科学的角度来判断政策</strong>：经济科学的不断完善并不能告诉我们Peter和Paula谁支付的税收太多；经济学家有时提出不一致的建议，正是因为他们有着不同的价值观。"}],"k":"b","i":1,"h":"2.3.2 价值观的不同"},{"t":"2.3.3 感觉与现实","c":[{"t":"不应夸大分歧：经济学家之间能够达成共识的程度远远超出人们有时认为的那样；书中表2-1列出20项经济政策主张，均获绝大多数经济学家赞同，但多数并未在公众中得到类似认同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不应夸大分歧</strong>：经济学家之间能够达成共识的程度远远超出人们有时认为的那样；书中表2-1列出20项经济政策主张，均获绝大多数经济学家赞同，但多数并未在公众中得到类似认同。"},{"t":"共识例证：93%赞同\"租金上限降低了可得到的住房的数量和质量\"；93%赞同\"关税和进口配额通常降低了总体经济福利\"；83%赞同\"通货膨胀主要是由货币供给的过分增长引起的\"；79%赞同\"最低工资增加了年轻人和不熟练工人的失业\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">共识例证</strong>：93%赞同&quot;租金上限降低了可得到的住房的数量和质量&quot;；93%赞同&quot;关税和进口配额通常降低了总体经济福利&quot;；83%赞同&quot;通货膨胀主要是由货币供给的过分增长引起的&quot;；79%赞同&quot;最低工资增加了年轻人和不熟练工人的失业&quot;。"},{"t":"专家一致反对而政策仍持续（许多市政府仍规定租金上限，总统和国会仍限制某些物品进口），可能因为政治过程是一种不可消除的障碍，也可能因为经济学家还无法使普通公众相信这些政策是不合意的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专家一致反对而政策仍持续</strong>（许多市政府仍规定租金上限，总统和国会仍限制某些物品进口），可能因为政治过程是一种不可消除的障碍，也可能因为经济学家还无法使普通公众相信这些政策是不合意的。"},{"t":"\"专家看法\"专栏（IGM经济学家小组调查）示例：\"限制转售演出与比赛门票的法律使这些活动的潜在观众的状况平均而言变坏了\"获80%同意——许多经济学家支持\"倒票者\"而非法律制定者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">&quot;专家看法&quot;专栏</strong>（IGM经济学家小组调查）示例：&quot;限制转售演出与比赛门票的法律使这些活动的潜在观众的状况平均而言变坏了&quot;获80%同意——许多经济学家支持&quot;倒票者&quot;而非法律制定者。"}],"k":"b","i":1,"h":"2.3.3 感觉与现实"},{"t":"即问即答要点：总统经济顾问们对一个政策问题存在分歧，不是因为科学判断的差别，就是因为价值观的差别。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">即问即答要点</strong>：总统经济顾问们对一个政策问题存在分歧，不是因为科学判断的差别，就是因为价值观的差别。"}],"k":"sec","i":0,"h":"2.3 经济学家意见分歧的原因"},{"t":"2.4 出发吧","c":[{"t":"前两章介绍了经济学的思想与方法，下一章开始更详细地学习经济行为和经济政策的原理。","c":[],"k":"b","i":1,"h":"前两章介绍了经济学的思想与方法，下一章开始更详细地学习经济行为和经济政策的原理。"},{"t":"凯恩斯的忠告：杰出的经济学家需要罕见的各种天赋的组合——在某种程度上，他应该是数学家、历史学家、政治家和哲学家；这无疑是高标准，但通过实践，你将会越来越习惯于像经济学家一样思考。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">凯恩斯的忠告</strong>：杰出的经济学家需要罕见的各种天赋的组合——在某种程度上，他应该是数学家、历史学家、政治家和哲学家；这无疑是高标准，但通过实践，你将会越来越习惯于像经济学家一样思考。"}],"k":"sec","i":0,"h":"2.4 出发吧"},{"t":"附录 绘图：简单的复习","c":[{"t":"图形的两个目的：建立理论时提供直观表述思想的方法；分析经济数据时提供发现和解释变动模式的有效方法。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">图形的两个目的</strong>：建立理论时提供直观表述思想的方法；分析经济数据时提供发现和解释变动模式的有效方法。"},{"t":"单变量的图形：饼形图（表示总收入中各种来源的份额）、柱形图（比较各国平均收入）、时间序列图（生产率随时间的变动）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">单变量的图形</strong>：饼形图（表示总收入中各种来源的份额）、柱形图（比较各国平均收入）、时间序列图（生产率随时间的变动）。"},{"t":"坐标系与散点图：有序数对由横坐标与纵坐标确定、相对原点定位；两个变量同方向变动为正相关关系（学习时间与成绩），反方向变动为负相关关系（聚会时间与成绩）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">坐标系与散点图</strong>：有序数对由横坐标与纵坐标确定、相对原点定位；两个变量同方向变动为正相关关系（学习时间与成绩），反方向变动为负相关关系（聚会时间与成绩）。"},{"t":"需求曲线例子（Emma购买小说）：保持收入不变，价格与需求量负相关，需求曲线向右下方倾斜；必须区分沿着曲线的变动（由坐标轴上的变量——价格——变动引起）与曲线的移动（由不在坐标轴上的变量如收入变动引起）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">需求曲线例子</strong>（Emma购买小说）：保持收入不变，价格与需求量负相关，需求曲线向右下方倾斜；必须区分沿着曲线的变动（由坐标轴上的变量——价格——变动引起）与曲线的移动（由不在坐标轴上的变量如收入变动引起）。"},{"t":"斜率＝Δy/Δx＝\"上升量\"除以\"向前量\"；Emma需求曲线的斜率为-1/4；水平线的斜率为零，垂直线的斜率无限。","c":[],"k":"b","i":1,"h":"斜率＝Δy/Δx＝&quot;上升量&quot;除以&quot;向前量&quot;；Emma需求曲线的斜率为-1/4；水平线的斜率为零，垂直线的斜率无限。"},{"t":"原因和结果的两个陷阱：忽略的变量（家庭拥有打火机数量与患癌概率正相关，实为吸烟这一被忽略的变量所致，打火机没有引起癌症）；反向因果关系（警察多的城市犯罪多，可能是犯罪引来警察而非警察引起犯罪；家用旅行车先于婴儿购买，但不引起人口增长）——从图形得出因果结论要谨慎。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">原因和结果的两个陷阱</strong>：忽略的变量（家庭拥有打火机数量与患癌概率正相关，实为吸烟这一被忽略的变量所致，打火机没有引起癌症）；反向因果关系（警察多的城市犯罪多，可能是犯罪引来警察而非警察引起犯罪；家用旅行车先于婴儿购买，但不引起人口增长）——从图形得出因果结论要谨慎。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">附录 绘图</strong>：简单的复习"}],"k":"chap","h":"第2章 像经济学家一样思考"},{"t":"第3章 相互依存性与贸易的好处","c":[{"t":"本章内容提要","c":[{"t":"人们每天都在享用许多素不相识的人提供的物品与服务；这种相互依存之所以可能，是因为人们相互交易，提供者从中得到了回报。","c":[],"k":"b","i":1,"h":"人们每天都在享用许多素不相识的人提供的物品与服务；这种相互依存之所以可能，是因为人们相互交易，提供者从中得到了回报。"},{"t":"\"贸易可以使每个人的状况都变得更好\"（经济学十大原理之一）：每个人专门从事自己具有比较优势的活动，经济总产量增加，各方都能消费更多。","c":[],"k":"b","i":1,"h":"&quot;贸易可以使每个人的状况都变得更好&quot;（经济学十大原理之一）：每个人专门从事自己具有比较优势的活动，经济总产量增加，各方都能消费更多。"},{"t":"绝对优势比较投入（谁用更少投入生产某物品）；比较优势比较机会成本（谁放弃得更少）；贸易的好处基于比较优势，而不是绝对优势。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">绝对优势比较投入</strong>（谁用更少投入生产某物品）；比较优势比较机会成本（谁放弃得更少）；贸易的好处基于比较优势，而不是绝对优势。"},{"t":"一个人可能在两种物品的生产上都有绝对优势，但不可能在两种物品上都有比较优势，因为一种物品的机会成本是另一种物品机会成本的倒数。","c":[],"k":"b","i":1,"h":"一个人可能在两种物品的生产上都有绝对优势，但不可能在两种物品上都有比较优势，因为一种物品的机会成本是另一种物品机会成本的倒数。"},{"t":"对双方都有利的贸易，价格必须落在两种机会成本之间。","c":[],"k":"b","i":1,"h":"对双方都有利的贸易，价格必须落在两种机会成本之间。"},{"t":"比较优势原理不仅适用于个人，也适用于国家；经济学家据此支持各国间的自由贸易，其思想源头是亚当·斯密与大卫·李嘉图。","c":[],"k":"b","i":1,"h":"比较优势原理不仅适用于个人，也适用于国家；经济学家据此支持各国间的自由贸易，其思想源头是亚当·斯密与大卫·李嘉图。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"3.1 一个现代经济寓言","c":[{"t":"以只有两种物品（牛肉与土豆）、两个人（牧牛人Ruby与种土豆的农民Frank）的简单经济，说明人们为什么选择相互依存以及这种选择如何改善生活。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">以只有两种物品</strong>（牛肉与土豆）、两个人（牧牛人Ruby与种土豆的农民Frank）的简单经济，说明人们为什么选择相互依存以及这种选择如何改善生活。"},{"t":"如果Ruby只能产牛肉、Frank只能产土豆，贸易的好处显而易见（都能吃上牛排配烤土豆）；如果两人都能生产对方物品只是成本较高，专门从事自己最擅长的活动并交易同样获益；但当Ruby在养牛和种土豆上都优于Frank时，Ruby 是否应自给自足？——这个问题的答案正是本章核心。","c":[],"k":"b","i":1,"h":"如果Ruby只能产牛肉、Frank只能产土豆，贸易的好处显而易见（都能吃上牛排配烤土豆）；如果两人都能生产对方物品只是成本较高，专门从事自己最擅长的活动并交易同样获益；但当Ruby在养牛和种土豆上都优于Frank时，Ruby 是否应自给自足？——这个问题的答案正是本章核心。"},{"t":"3.1.1 生产可能性","c":[{"t":"Frank生产1盎司土豆需15分钟、1盎司牛肉需60分钟；每天8小时可产32盎司土豆或8盎司牛肉；无贸易时生产并消费16盎司土豆与4盎司牛肉（A点）。","c":[],"k":"b","i":2,"h":"Frank生产1盎司土豆需15分钟、1盎司牛肉需60分钟；每天8小时可产32盎司土豆或8盎司牛肉；无贸易时生产并消费16盎司土豆与4盎司牛肉（A点）。"},{"t":"Ruby生产1盎司土豆需10分钟、1盎司牛肉需20分钟；8小时可产48盎司土豆或24盎司牛肉；无贸易时生产并消费24盎司土豆与12盎司牛肉（B点）。","c":[],"k":"b","i":2,"h":"Ruby生产1盎司土豆需10分钟、1盎司牛肉需20分钟；8小时可产48盎司土豆或24盎司牛肉；无贸易时生产并消费24盎司土豆与12盎司牛肉（B点）。"},{"t":"两人的技术使转换比率不变，因此生产可能性边界是直线（不同于第2章外凸的边界）；没有贸易时，生产可能性边界同时也是消费可能性边界。","c":[],"k":"b","i":2,"h":"两人的技术使转换比率不变，因此生产可能性边界是直线（不同于第2章外凸的边界）；没有贸易时，生产可能性边界同时也是消费可能性边界。"}],"k":"b","i":1,"h":"3.1.1 生产可能性"},{"t":"3.1.2 专业化与贸易","c":[{"t":"Ruby提议的交易：Frank停止生产牛肉、全部时间种土豆（产32盎司），用其中15盎司土豆换Ruby的5盎司牛肉——Frank每天消费17盎司土豆和5盎司牛肉（原来16与4，各多1盎司）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">Ruby提议的交易</strong>：Frank停止生产牛肉、全部时间种土豆（产32盎司），用其中15盎司土豆换Ruby的5盎司牛肉——Frank每天消费17盎司土豆和5盎司牛肉（原来16与4，各多1盎司）。"},{"t":"Ruby改为每天6小时养牛、2小时种土豆（产18盎司牛肉与12盎司土豆），给出5盎司牛肉、得到15盎司土豆后，消费13盎司牛肉和27盎司土豆（原来12与24，分别多1盎司与3盎司）。","c":[],"k":"b","i":2,"h":"Ruby改为每天6小时养牛、2小时种土豆（产18盎司牛肉与12盎司土豆），给出5盎司牛肉、得到15盎司土豆后，消费13盎司牛肉和27盎司土豆（原来12与24，分别多1盎司与3盎司）。"},{"t":"专业化使总产量增加：土豆从40盎司增至44盎司，牛肉从16盎司增至18盎司；由于专业化和贸易，两人不增加工作时间就消费了更多的牛肉和更多的土豆。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专业化使总产量增加</strong>：土豆从40盎司增至44盎司，牛肉从16盎司增至18盎司；由于专业化和贸易，两人不增加工作时间就消费了更多的牛肉和更多的土豆。"},{"t":"即问即答要点（鲁滨孙·克鲁索）：独自生活时，生产可能性边界限制了他对椰子和鱼的消费；若能与岛上当地人交易，消费不再受自己边界的限制。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>（鲁滨孙·克鲁索）：独自生活时，生产可能性边界限制了他对椰子和鱼的消费；若能与岛上当地人交易，消费不再受自己边界的限制。"}],"k":"b","i":1,"h":"3.1.2 专业化与贸易"}],"k":"sec","i":0,"h":"3.1 一个现代经济寓言"},{"t":"3.2 比较优势：专业化的动力","c":[{"t":"疑惑：如果Ruby在养牛和种土豆方面都更精通，Frank怎么能专门从事自己最擅长的工作？解开疑惑需要比较优势原理。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">疑惑</strong>：如果Ruby在养牛和种土豆方面都更精通，Frank怎么能专门从事自己最擅长的工作？解开疑惑需要比较优势原理。"},{"t":"3.2.1 绝对优势","c":[{"t":"绝对优势（absolute advantage）：一个生产者用比另一个生产者更少的投入生产某种物品的能力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">绝对优势</strong>（absolute advantage）：一个生产者用比另一个生产者更少的投入生产某种物品的能力。"},{"t":"例中时间是唯一投入：Ruby生产1盎司土豆（10分钟对15分钟）和1盎司牛肉（20分钟对60分钟）所需时间都少于Frank，因此Ruby在两种物品的生产上都有绝对优势。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例中时间是唯一投入</strong>：Ruby生产1盎司土豆（10分钟对15分钟）和1盎司牛肉（20分钟对60分钟）所需时间都少于Frank，因此Ruby在两种物品的生产上都有绝对优势。"}],"k":"b","i":1,"h":"3.2.1 绝对优势"},{"t":"3.2.2 机会成本和比较优势","c":[{"t":"机会成本（opportunity cost）：为了得到某种东西所必须放弃的东西；机会成本衡量每个生产者面临的两种物品之间的权衡取舍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机会成本</strong>（opportunity cost）：为了得到某种东西所必须放弃的东西；机会成本衡量每个生产者面临的两种物品之间的权衡取舍。"},{"t":"Ruby生产1盎司土豆的机会成本是1/2盎司牛肉（10分钟本可产1/2盎司牛肉）；Frank生产1盎司土豆的机会成本是1/4盎司牛肉（15分钟本可产1/4盎司牛肉）。","c":[],"k":"b","i":2,"h":"Ruby生产1盎司土豆的机会成本是1/2盎司牛肉（10分钟本可产1/2盎司牛肉）；Frank生产1盎司土豆的机会成本是1/4盎司牛肉（15分钟本可产1/4盎司牛肉）。"},{"t":"反过来，牛肉的机会成本是土豆机会成本的倒数：Ruby生产1盎司牛肉的机会成本是2盎司土豆，Frank是4盎司土豆。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反过来，牛肉的机会成本是土豆机会成本的倒数</strong>：Ruby生产1盎司牛肉的机会成本是2盎司土豆，Frank是4盎司土豆。"},{"t":"比较优势（comparative advantage）：一个生产者以低于另一个生产者的机会成本生产某种物品的能力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">比较优势</strong>（comparative advantage）：一个生产者以低于另一个生产者的机会成本生产某种物品的能力。"},{"t":"Frank种土豆的机会成本（1/4盎司牛肉）低于Ruby（1/2盎司牛肉），Frank在土豆上有比较优势；Ruby生产牛肉的机会成本（2盎司土豆）低于Frank（4盎司土豆），Ruby在牛肉上有比较优势。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">Frank种土豆的机会成本</strong>（1/4盎司牛肉）低于Ruby（1/2盎司牛肉），Frank在土豆上有比较优势；Ruby生产牛肉的机会成本（2盎司土豆）低于Frank（4盎司土豆），Ruby在牛肉上有比较优势。"},{"t":"一个人可能在两种物品上都有绝对优势（如Ruby），但不可能在两种物品上都有比较优势：因为一种物品的机会成本是另一种的倒数，除非两人机会成本完全相同，否则一人必在一种物品上、另一人必在另一种物品上具有比较优势。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一个人可能在两种物品上都有绝对优势</strong>（如Ruby），但不可能在两种物品上都有比较优势：因为一种物品的机会成本是另一种的倒数，除非两人机会成本完全相同，否则一人必在一种物品上、另一人必在另一种物品上具有比较优势。"}],"k":"b","i":1,"h":"3.2.2 机会成本和比较优势"},{"t":"3.2.3 比较优势与贸易","c":[{"t":"专业化和贸易的好处不是基于绝对优势，而是基于比较优势：当每个人都专门生产自己有比较优势的物品时，经济的总产量就增加了，经济蛋糕的变大可用于改善每个人的状况。","c":[],"k":"b","i":2,"h":"专业化和贸易的好处不是基于绝对优势，而是基于比较优势：当每个人都专门生产自己有比较优势的物品时，经济的总产量就增加了，经济蛋糕的变大可用于改善每个人的状况。"},{"t":"从价格角度看：各方以低于自己生产该物品的机会成本的价格得到该物品而从贸易中获益——Frank以3盎司土豆买到1盎司牛肉（低于自己的机会成本4盎司土豆）；Ruby以1/3盎司牛肉买到1盎司土豆（低于自己的机会成本1/2盎司牛肉）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">从价格角度看</strong>：各方以低于自己生产该物品的机会成本的价格得到该物品而从贸易中获益——Frank以3盎司土豆买到1盎司牛肉（低于自己的机会成本4盎司土豆）；Ruby以1/3盎司牛肉买到1盎司土豆（低于自己的机会成本1/2盎司牛肉）。"},{"t":"寓意：贸易可以使社会上的每个人都获益，因为它使人们可以专门从事他们具有比较优势的活动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">寓意</strong>：贸易可以使社会上的每个人都获益，因为它使人们可以专门从事他们具有比较优势的活动。"}],"k":"b","i":1,"h":"3.2.3 比较优势与贸易"},{"t":"3.2.4 贸易的价格","c":[{"t":"一般规律：对从贸易中获益的双方而言，他们进行贸易的价格在两种机会成本之间。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般规律</strong>：对从贸易中获益的双方而言，他们进行贸易的价格在两种机会成本之间。"},{"t":"例中双方同意按每盎司牛肉换3盎司土豆交易：这一价格介于Ruby的机会成本（每盎司牛肉2盎司土豆）与Frank的机会成本（每盎司牛肉4盎司土豆）之间；价格不必在2和4的正中间，但一定在2和4之间的某个地方。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例中双方同意按每盎司牛肉换3盎司土豆交易</strong>：这一价格介于Ruby的机会成本（每盎司牛肉2盎司土豆）与Frank的机会成本（每盎司牛肉4盎司土豆）之间；价格不必在2和4的正中间，但一定在2和4之间的某个地方。"},{"t":"原因：若牛肉价格低于2盎司土豆，双方都想买牛肉（价格低于各自机会成本）；若高于4盎司土豆，双方都想卖牛肉——而两人经济中不能人人同当买方或卖方。只有价格在2到4之间，Ruby才愿卖牛肉买土豆、Frank愿卖土豆买牛肉，每方都以低于自己机会成本的价格购买，双方状况都改善。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原因</strong>：若牛肉价格低于2盎司土豆，双方都想买牛肉（价格低于各自机会成本）；若高于4盎司土豆，双方都想卖牛肉——而两人经济中不能人人同当买方或卖方。只有价格在2到4之间，Ruby才愿卖牛肉买土豆、Frank愿卖土豆买牛肉，每方都以低于自己机会成本的价格购买，双方状况都改善。"},{"t":"即问即答要点（克鲁索与\"星期五\"）：克鲁索每小时摘10个椰子或捕1条鱼，捕1条鱼的机会成本是10个椰子；\"星期五\"每小时摘30个椰子或捕2条鱼，捕1条鱼的机会成本是15个椰子；\"星期五\"在捕鱼上有绝对优势，克鲁索在捕鱼上有比较优势。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>（克鲁索与&quot;星期五&quot;）：克鲁索每小时摘10个椰子或捕1条鱼，捕1条鱼的机会成本是10个椰子；&quot;星期五&quot;每小时摘30个椰子或捕2条鱼，捕1条鱼的机会成本是15个椰子；&quot;星期五&quot;在捕鱼上有绝对优势，克鲁索在捕鱼上有比较优势。"}],"k":"b","i":1,"h":"3.2.4 贸易的价格"},{"t":"参考资料：亚当·斯密与大卫·李嘉图的思想遗产","c":[{"t":"亚当·斯密在1776年《国富论》中提出：如果购买一件东西所付出的代价比在家里生产所付出的代价小，就永远不要在家里生产——裁缝向鞋匠购鞋、鞋匠雇裁缝制衣，把精力集中到比邻人有优势的方面。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">亚当·斯密在1776年《国富论》中提出</strong>：如果购买一件东西所付出的代价比在家里生产所付出的代价小，就永远不要在家里生产——裁缝向鞋匠购鞋、鞋匠雇裁缝制衣，把精力集中到比邻人有优势的方面。"},{"t":"大卫·李嘉图在1817年《政治经济学及赋税原理》中提出了现在熟知的比较优势原理（两种物品——葡萄酒与衣服、两个国家——英国与葡萄牙的例子），这是现代国际经济学的起点；他身为英国议员，反对限制粮食进口的《谷物法》。","c":[],"k":"b","i":2,"h":"大卫·李嘉图在1817年《政治经济学及赋税原理》中提出了现在熟知的比较优势原理（两种物品——葡萄酒与衣服、两个国家——英国与葡萄牙的例子），这是现代国际经济学的起点；他身为英国议员，反对限制粮食进口的《谷物法》。"},{"t":"经济学家在政策问题上通常存在分歧，但在支持自由贸易方面往往一致；自斯密和李嘉图时代以来，经济学家反对贸易限制的主要依据仍是比较优势原理。","c":[],"k":"b","i":2,"h":"经济学家在政策问题上通常存在分歧，但在支持自由贸易方面往往一致；自斯密和李嘉图时代以来，经济学家反对贸易限制的主要依据仍是比较优势原理。"}],"k":"b","i":1,"h":"<strong class=\"lead\">参考资料</strong>：亚当·斯密与大卫·李嘉图的思想遗产"}],"k":"sec","i":0,"h":"<strong class=\"lead\">3.2 比较优势</strong>：专业化的动力"},{"t":"3.3 比较优势的应用","c":[{"t":"比较优势原理解释了相互依存和贸易的好处，在相互依存普遍的现代世界有许多应用。","c":[],"k":"b","i":1,"h":"比较优势原理解释了相互依存和贸易的好处，在相互依存普遍的现代世界有许多应用。"},{"t":"3.3.1 塞雷娜·威廉姆斯应该自己修剪草坪吗","c":[{"t":"情境：威廉姆斯是有史以来最天才的网球运动员之一，可能比任何人都更快修剪完自家草坪（2小时剪完），但同样2小时她能拍一部电视商业广告片赚到3万美元；邻居孩子Forrest Gump用4小时剪完草坪，同样4小时在麦当劳工作赚50美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情境</strong>：威廉姆斯是有史以来最天才的网球运动员之一，可能比任何人都更快修剪完自家草坪（2小时剪完），但同样2小时她能拍一部电视商业广告片赚到3万美元；邻居孩子Forrest Gump用4小时剪完草坪，同样4小时在麦当劳工作赚50美元。"},{"t":"分析：威廉姆斯在修剪草坪上有绝对优势（投入时间更少），但她修剪草坪的机会成本是3万美元，Forrest的机会成本仅50美元，因此Forrest在修剪草坪上有比较优势。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">分析</strong>：威廉姆斯在修剪草坪上有绝对优势（投入时间更少），但她修剪草坪的机会成本是3万美元，Forrest的机会成本仅50美元，因此Forrest在修剪草坪上有比较优势。"},{"t":"结论：威廉姆斯不应自己剪草坪，而应去拍广告并雇Forrest剪草——只要她支付给Forrest的钱多于50美元而少于3万美元，双方的状况就都会变得更好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：威廉姆斯不应自己剪草坪，而应去拍广告并雇Forrest剪草——只要她支付给Forrest的钱多于50美元而少于3万美元，双方的状况就都会变得更好。"},{"t":"即问即答要点：技术高超的脑外科医生即使也是世界上打字最快的打字员，也不应自己打字而应雇秘书——秘书打字的机会成本低、有比较优势，医生的时间应用于外科手术。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即问即答要点</strong>：技术高超的脑外科医生即使也是世界上打字最快的打字员，也不应自己打字而应雇秘书——秘书打字的机会成本低、有比较优势，医生的时间应用于外科手术。"}],"k":"b","i":1,"h":"3.3.1 塞雷娜·威廉姆斯应该自己修剪草坪吗"},{"t":"新闻摘录「家庭经济学：你的家务分工分错了」（Emily Oster）","c":[{"t":"要点一：一方擅长所有家务并不意味着应该包揽一切；经济学原理表明让擅长的一方做所有家务并不是有效率的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">要点一</strong>：一方擅长所有家务并不意味着应该包揽一切；经济学原理表明让擅长的一方做所有家务并不是有效率的。"},{"t":"要点二：边际成本递增——人疲劳时事情越变越糟（凌晨2点已工作17小时的好员工，状态不如上午9点休息好的差员工），因此应让每个人最后一项工作的效率相等，分工而不是包揽。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">要点二</strong>：边际成本递增——人疲劳时事情越变越糟（凌晨2点已工作17小时的好员工，状态不如上午9点休息好的差员工），因此应让每个人最后一项工作的效率相等，分工而不是包揽。"},{"t":"要点三：谁做什么由比较优势原理决定——让每人从事自己具有比较优势（机会成本相对最低）的工作，即使另一方在每件事上都有绝对优势（如芬兰与瑞典的鹿皮帽与滑雪靴之喻）；此外\"干中学\"会使从事者的技能不断提高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">要点三</strong>：谁做什么由比较优势原理决定——让每人从事自己具有比较优势（机会成本相对最低）的工作，即使另一方在每件事上都有绝对优势（如芬兰与瑞典的鹿皮帽与滑雪靴之喻）；此外&quot;干中学&quot;会使从事者的技能不断提高。"}],"k":"b","i":1,"h":"<strong class=\"lead\">新闻摘录「家庭经济学</strong>：你的家务分工分错了」（Emily Oster）"},{"t":"3.3.2 美国应该与其他国家进行贸易吗","c":[{"t":"进口品（imports）：在国外生产而在国内销售的物品；出口品（exports）：在国内生产而在国外销售的物品。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">进口品</strong>（imports）：在国外生产而在国内销售的物品；出口品（exports）：在国内生产而在国外销售的物品。"},{"t":"例（两个国家——美国和日本，两种物品——食品和汽车）：两国工人每人每月都能生产1辆汽车；美国工人每月能生产2吨食品、日本工人1吨。日本生产1辆汽车的机会成本是1吨食品（美国是2吨），日本在汽车上有比较优势，应出口汽车；美国生产1吨食品的机会成本是0.5辆汽车（日本是1辆），美国在食品上有比较优势，应出口食品——通过专业化和贸易，两国都可以有更多的食品和更多的汽车。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例</strong>（两个国家——美国和日本，两种物品——食品和汽车）：两国工人每人每月都能生产1辆汽车；美国工人每月能生产2吨食品、日本工人1吨。日本生产1辆汽车的机会成本是1吨食品（美国是2吨），日本在汽车上有比较优势，应出口汽车；美国生产1吨食品的机会成本是0.5辆汽车（日本是1辆），美国在食品上有比较优势，应出口食品——通过专业化和贸易，两国都可以有更多的食品和更多的汽车。"},{"t":"现实更复杂：每个国家都有许多利益不同的居民，国际贸易使国家作为整体的状况变好，但也会使其中一些人的状况变坏（美国出口食品、进口汽车时，农民与汽车工人受影响不同）；但与政治家有时所说的相反，国际贸易并不像战争——并非一些国家赢、另一些输，贸易使所有国家都可以实现更大的繁荣。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现实更复杂</strong>：每个国家都有许多利益不同的居民，国际贸易使国家作为整体的状况变好，但也会使其中一些人的状况变坏（美国出口食品、进口汽车时，农民与汽车工人受影响不同）；但与政治家有时所说的相反，国际贸易并不像战争——并非一些国家赢、另一些输，贸易使所有国家都可以实现更大的繁荣。"},{"t":"\"专家看法\"（IGM经济学家调查）：经济学家广泛同意\"与中国开展贸易可以使大多数美国人的状况更好\"，同时96%同意\"使一些在服装和家具等竞争性产业中工作的美国人状况更坏\"——整体获益与局部受损并存。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">&quot;专家看法&quot;</strong>（IGM经济学家调查）：经济学家广泛同意&quot;与中国开展贸易可以使大多数美国人的状况更好&quot;，同时96%同意&quot;使一些在服装和家具等竞争性产业中工作的美国人状况更坏&quot;——整体获益与局部受损并存。"}],"k":"b","i":1,"h":"3.3.2 美国应该与其他国家进行贸易吗"}],"k":"sec","i":0,"h":"3.3 比较优势的应用"},{"t":"3.4 结论","c":[{"t":"比较优势原理表明，贸易可以使每个人的状况都变得更好——无论美国人购买中国袜子、缅因州居民喝佛罗里达橙汁，还是房东雇邻居小孩修剪草坪，同样的经济力量在起作用。","c":[],"k":"b","i":1,"h":"比较优势原理表明，贸易可以使每个人的状况都变得更好——无论美国人购买中国袜子、缅因州居民喝佛罗里达橙汁，还是房东雇邻居小孩修剪草坪，同样的经济力量在起作用。"},{"t":"两人世界中资源配置靠直接讨价还价；在千百万人的现实世界中，自由社会如何协调所有人的不同活动？答案在下一章——供给与需求的市场力量。","c":[],"k":"b","i":1,"h":"两人世界中资源配置靠直接讨价还价；在千百万人的现实世界中，自由社会如何协调所有人的不同活动？答案在下一章——供给与需求的市场力量。"}],"k":"sec","i":0,"h":"3.4 结论"}],"k":"chap","h":"第3章 相互依存性与贸易的好处"}],"k":"part","h":"第1篇 导言","col":"#4f6df5","pc":"p1"},{"t":"第2篇 市场如何运行","c":[{"t":"第4章 供给与需求的市场力量","c":[{"t":"本章内容提要","c":[{"t":"经济学家用供求模型分析竞争市场：竞争市场有许多买者与卖者，每个人对市场价格的影响都微乎其微。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经济学家用供求模型分析竞争市场</strong>：竞争市场有许多买者与卖者，每个人对市场价格的影响都微乎其微。"},{"t":"需求曲线向右下方倾斜：根据需求定理，其他条件不变时，价格上升需求量减少，价格下降需求量增加。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">需求曲线向右下方倾斜</strong>：根据需求定理，其他条件不变时，价格上升需求量减少，价格下降需求量增加。"},{"t":"除价格外，收入、相关物品价格、爱好、预期和买者数量的变动会使需求曲线移动。","c":[],"k":"b","i":1,"h":"除价格外，收入、相关物品价格、爱好、预期和买者数量的变动会使需求曲线移动。"},{"t":"供给曲线向右上方倾斜：根据供给定理，其他条件不变时，价格上升供给量增加，价格下降供给量减少。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">供给曲线向右上方倾斜</strong>：根据供给定理，其他条件不变时，价格上升供给量增加，价格下降供给量减少。"},{"t":"除价格外，投入品价格、技术、预期和卖者数量的变动会使供给曲线移动。","c":[],"k":"b","i":1,"h":"除价格外，投入品价格、技术、预期和卖者数量的变动会使供给曲线移动。"},{"t":"均衡出现在供给曲线与需求曲线的交点；市场价格高于均衡价格出现过剩，压低价格；低于均衡价格出现短缺，抬高价格（供求定理）。","c":[],"k":"b","i":1,"h":"均衡出现在供给曲线与需求曲线的交点；市场价格高于均衡价格出现过剩，压低价格；低于均衡价格出现短缺，抬高价格（供求定理）。"},{"t":"分析均衡变动用三步法：判断哪条曲线移动、判断移动方向、比较新旧均衡。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">分析均衡变动用三步法</strong>：判断哪条曲线移动、判断移动方向、比较新旧均衡。"},{"t":"在市场经济中，价格是引导经济决策、配置稀缺资源的信号。","c":[],"k":"b","i":1,"h":"在市场经济中，价格是引导经济决策、配置稀缺资源的信号。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"4.1 市场与竞争","c":[{"t":"4.1.1 什么是市场","c":[{"t":"市场（market）：由某种物品或服务的买者与卖者组成的一个群体。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">市场</strong>（market）：由某种物品或服务的买者与卖者组成的一个群体。"},{"t":"买者作为一个群体决定了一种产品的需求，卖者作为一个群体决定了一种产品的供给。","c":[],"k":"b","i":2,"h":"买者作为一个群体决定了一种产品的需求，卖者作为一个群体决定了一种产品的供给。"},{"t":"市场形式多样：可以组织健全（如买卖双方聚集交易、有拍卖者定价的农产品市场），也可以完全无组织（如小镇冰淇淋市场，买卖双方不见面聚集，但群体仍构成一个市场）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">市场形式多样</strong>：可以组织健全（如买卖双方聚集交易、有拍卖者定价的农产品市场），也可以完全无组织（如小镇冰淇淋市场，买卖双方不见面聚集，但群体仍构成一个市场）。"}],"k":"b","i":1,"h":"4.1.1 什么是市场"},{"t":"4.1.2 什么是竞争","c":[{"t":"竞争市场（competitive market）：有许多买者与卖者，以至于每个人对市场价格的影响都微乎其微的市场。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">竞争市场</strong>（competitive market）：有许多买者与卖者，以至于每个人对市场价格的影响都微乎其微的市场。"},{"t":"完全竞争的两个特征：（1）可供销售的物品是完全相同的；（2）买者和卖者人数众多，以至于没有任何一个买者或卖者可以影响市场价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">完全竞争的两个特征</strong>：（1）可供销售的物品是完全相同的；（2）买者和卖者人数众多，以至于没有任何一个买者或卖者可以影响市场价格。"},{"t":"完全竞争市场上的买者与卖者被称为价格接受者：他们必须接受市场决定的价格，买者可买到想买的全部、卖者可卖出想卖的全部。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">完全竞争市场上的买者与卖者被称为价格接受者</strong>：他们必须接受市场决定的价格，买者可买到想买的全部、卖者可卖出想卖的全部。"},{"t":"完全竞争假设在某些市场（如小麦市场）完全适用；一些市场只有一个卖者决定价格，这样的卖者被称为垄断者（如本地有线电视公司）；还有市场介于两种极端之间。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">完全竞争假设在某些市场</strong>（如小麦市场）完全适用；一些市场只有一个卖者决定价格，这样的卖者被称为垄断者（如本地有线电视公司）；还有市场介于两种极端之间。"},{"t":"完全竞争假设是有用的简化：完全竞争市场最容易分析，所得许多结论也适用于更复杂的市场。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">完全竞争假设是有用的简化</strong>：完全竞争市场最容易分析，所得许多结论也适用于更复杂的市场。"}],"k":"b","i":1,"h":"4.1.2 什么是竞争"}],"k":"sec","i":0,"h":"4.1 市场与竞争"},{"t":"4.2 需求","c":[{"t":"4.2.1 需求曲线：价格和需求量之间的关系","c":[{"t":"需求量（quantity demanded）：买者愿意并且能够购买的一种物品的数量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求量</strong>（quantity demanded）：买者愿意并且能够购买的一种物品的数量。"},{"t":"需求定理（law of demand）：认为在其他条件不变时，一种物品的价格上升，对该物品的需求量减少；价格下降，需求量增加的观点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求定理</strong>（law of demand）：认为在其他条件不变时，一种物品的价格上升，对该物品的需求量减少；价格下降，需求量增加的观点。"},{"t":"需求表（demand schedule）：表示在影响消费者想购买的数量的其他因素保持不变时，一种物品的价格与其需求量之间关系的表格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求表</strong>（demand schedule）：表示在影响消费者想购买的数量的其他因素保持不变时，一种物品的价格与其需求量之间关系的表格。"},{"t":"需求曲线（demand curve）：表示一种物品的价格与需求量之间关系的图形；因价格下降时需求量增加，需求曲线向右下方倾斜。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求曲线</strong>（demand curve）：表示一种物品的价格与需求量之间关系的图形；因价格下降时需求量增加，需求曲线向右下方倾斜。"}],"k":"b","i":1,"h":"<strong class=\"lead\">4.2.1 需求曲线</strong>：价格和需求量之间的关系"},{"t":"4.2.2 市场需求与个人需求","c":[{"t":"市场需求是所有个人对某种特定物品或服务的需求的总和。","c":[],"k":"b","i":2,"h":"市场需求是所有个人对某种特定物品或服务的需求的总和。"},{"t":"通过把个人需求曲线水平相加得到市场需求曲线：在每种价格水平下把各人的需求量相加（书中示例：价格为2美元时，Catherine 需求4个、Nicholas 需求3个，市场需求量为7个）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">通过把个人需求曲线水平相加得到市场需求曲线</strong>：在每种价格水平下把各人的需求量相加（书中示例：价格为2美元时，Catherine 需求4个、Nicholas 需求3个，市场需求量为7个）。"}],"k":"b","i":1,"h":"4.2.2 市场需求与个人需求"},{"t":"4.2.3 需求曲线的移动","c":[{"t":"使任何既定价格水平下需求量增加的变动使需求曲线向右移动（需求增加）；使需求量减少的变动使其向左移动（需求减少）。","c":[],"k":"b","i":2,"h":"使任何既定价格水平下需求量增加的变动使需求曲线向右移动（需求增加）；使需求量减少的变动使其向左移动（需求减少）。"},{"t":"收入：正常物品（normal good）是在其他条件相同时，收入增加引起需求量增加的物品；低档物品（inferior good）是收入增加引起需求量减少的物品（如坐公共汽车）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">收入</strong>：正常物品（normal good）是在其他条件相同时，收入增加引起需求量增加的物品；低档物品（inferior good）是收入增加引起需求量减少的物品（如坐公共汽车）。"},{"t":"相关物品的价格：替代品（substitutes）是一种物品的价格上升引起另一种物品需求量增加的两种物品（如热狗与汉堡包、毛衣与长袖衫、电影票和电影视频服务）；互补品（complements）是一种物品的价格上升引起另一种物品需求量减少的两种物品（如汽油和汽车、电脑和软件、花生酱和果酱）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">相关物品的价格</strong>：替代品（substitutes）是一种物品的价格上升引起另一种物品需求量增加的两种物品（如热狗与汉堡包、毛衣与长袖衫、电影票和电影视频服务）；互补品（complements）是一种物品的价格上升引起另一种物品需求量减少的两种物品（如汽油和汽车、电脑和软件、花生酱和果酱）。"},{"t":"爱好：爱好变动（如医学发现改变人们对某物品的偏好）会使需求曲线移动；经济学家通常不解释爱好本身，但考察爱好变动的影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">爱好</strong>：爱好变动（如医学发现改变人们对某物品的偏好）会使需求曲线移动；经济学家通常不解释爱好本身，但考察爱好变动的影响。"},{"t":"预期：对未来收入或价格的预期影响现在的需求（预期明天降价，今天就少买）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">预期</strong>：对未来收入或价格的预期影响现在的需求（预期明天降价，今天就少买）。"},{"t":"买者的数量：买者数量增加使每种价格水平下的市场需求量增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">买者的数量</strong>：买者数量增加使每种价格水平下的市场需求量增加。"},{"t":"曲线移动与沿曲线变动的区分：价格由纵轴表示，价格的变动表现为沿着需求曲线的变动；收入、相关物品价格、爱好、预期、买者数量都不在坐标轴上，其中任何一种变量变动都使需求曲线移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">曲线移动与沿曲线变动的区分</strong>：价格由纵轴表示，价格的变动表现为沿着需求曲线的变动；收入、相关物品价格、爱好、预期、买者数量都不在坐标轴上，其中任何一种变量变动都使需求曲线移动。"}],"k":"b","i":1,"h":"4.2.3 需求曲线的移动"},{"t":"案例研究要点：减少香烟需求量的两种方法","c":[{"t":"方法一：公益广告、烟盒上有害健康的强制警示、禁止电视香烟广告，旨在减少既定价格下的香烟需求量，使需求曲线向左移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">方法一</strong>：公益广告、烟盒上有害健康的强制警示、禁止电视香烟广告，旨在减少既定价格下的香烟需求量，使需求曲线向左移动。"},{"t":"方法二：对香烟制造商征税使烟草公司提价转嫁，较高价格促使吸烟者减少吸烟量，表现为沿着同一条需求曲线向价格更高、数量更少的点变动，需求曲线不移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">方法二</strong>：对香烟制造商征税使烟草公司提价转嫁，较高价格促使吸烟者减少吸烟量，表现为沿着同一条需求曲线向价格更高、数量更少的点变动，需求曲线不移动。"},{"t":"实证结果：香烟价格上升10%使需求量减少约4%；年轻人对价格特别敏感，价格上升10%使青少年吸烟量减少12%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实证结果</strong>：香烟价格上升10%使需求量减少约4%；年轻人对价格特别敏感，价格上升10%使青少年吸烟量减少12%。"},{"t":"香烟与大麻的关系：数据显示较低的香烟价格与更多地使用大麻相关，烟草和大麻更像是互补品而非替代品。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">香烟与大麻的关系</strong>：数据显示较低的香烟价格与更多地使用大麻相关，烟草和大麻更像是互补品而非替代品。"}],"k":"b","i":1,"h":"<strong class=\"lead\">案例研究要点</strong>：减少香烟需求量的两种方法"}],"k":"sec","i":0,"h":"4.2 需求"},{"t":"4.3 供给","c":[{"t":"4.3.1 供给曲线：价格与供给量之间的关系","c":[{"t":"供给量（quantity supplied）：卖者愿意并且能够出售的一种物品的数量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给量</strong>（quantity supplied）：卖者愿意并且能够出售的一种物品的数量。"},{"t":"供给定理（law of supply）：认为在其他条件不变时，一种物品价格上升，该物品供给量增加；价格下降，供给量减少的观点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给定理</strong>（law of supply）：认为在其他条件不变时，一种物品价格上升，该物品供给量增加；价格下降，供给量减少的观点。"},{"t":"供给表（supply schedule）：表示在影响生产者想出售数量的其他因素保持不变时，一种物品的价格和供给量之间关系的表格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给表</strong>（supply schedule）：表示在影响生产者想出售数量的其他因素保持不变时，一种物品的价格和供给量之间关系的表格。"},{"t":"供给曲线（supply curve）：表示一种物品的价格与供给量之间关系的图形；因价格越高供给量越多，供给曲线向右上方倾斜。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给曲线</strong>（supply curve）：表示一种物品的价格与供给量之间关系的图形；因价格越高供给量越多，供给曲线向右上方倾斜。"}],"k":"b","i":1,"h":"<strong class=\"lead\">4.3.1 供给曲线</strong>：价格与供给量之间的关系"},{"t":"4.3.2 市场供给与个人供给","c":[{"t":"市场供给是所有卖者供给的总和；通过把个人供给曲线水平相加得到市场供给曲线（书中示例：价格为2美元时，Ben 供给3个、Jerry 供给4个，市场供给量为7个）。","c":[],"k":"b","i":2,"h":"市场供给是所有卖者供给的总和；通过把个人供给曲线水平相加得到市场供给曲线（书中示例：价格为2美元时，Ben 供给3个、Jerry 供给4个，市场供给量为7个）。"}],"k":"b","i":1,"h":"4.3.2 市场供给与个人供给"},{"t":"4.3.3 供给曲线的移动","c":[{"t":"使任何既定价格水平下供给量都增加的变动使供给曲线向右移动（供给增加）；使供给量都减少的变动使其向左移动（供给减少）。","c":[],"k":"b","i":2,"h":"使任何既定价格水平下供给量都增加的变动使供给曲线向右移动（供给增加）；使供给量都减少的变动使其向左移动（供给减少）。"},{"t":"投入品价格：一种物品的供给量与生产这种物品所用的投入品的价格负相关（糖价下降使卖冰淇淋更有利可图，冰淇淋供给增加）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">投入品价格</strong>：一种物品的供给量与生产这种物品所用的投入品的价格负相关（糖价下降使卖冰淇淋更有利可图，冰淇淋供给增加）。"},{"t":"技术：技术进步通过降低企业的生产成本而增加供给量（机械化冰淇淋机的发明减少了必需劳动量）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">技术</strong>：技术进步通过降低企业的生产成本而增加供给量（机械化冰淇淋机的发明减少了必需劳动量）。"},{"t":"预期：预期未来价格上升，企业会把现在生产的一些产品储存起来，减少当前市场供给。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">预期</strong>：预期未来价格上升，企业会把现在生产的一些产品储存起来，减少当前市场供给。"},{"t":"卖者的数量：卖者退出经营使市场供给减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">卖者的数量</strong>：卖者退出经营使市场供给减少。"},{"t":"曲线移动与沿曲线变动的区分：价格由纵轴表示，价格的变动表现为沿着供给曲线的变动；投入品价格、技术、预期、卖者数量都不在坐标轴上，其中任何一种变量变动都使供给曲线移动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">曲线移动与沿曲线变动的区分</strong>：价格由纵轴表示，价格的变动表现为沿着供给曲线的变动；投入品价格、技术、预期、卖者数量都不在坐标轴上，其中任何一种变量变动都使供给曲线移动。"}],"k":"b","i":1,"h":"4.3.3 供给曲线的移动"}],"k":"sec","i":0,"h":"4.3 供给"},{"t":"4.4 供给与需求的结合","c":[{"t":"4.4.1 均衡","c":[{"t":"均衡（equilibrium）：市场价格达到使供给量与需求量相等的水平时的状态，即各种力量处于平衡的状态。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">均衡</strong>（equilibrium）：市场价格达到使供给量与需求量相等的水平时的状态，即各种力量处于平衡的状态。"},{"t":"均衡价格（equilibrium price）：使供给与需求平衡的价格，有时被称为市场出清价格；均衡数量（equilibrium quantity）：均衡价格下的供给量与需求量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">均衡价格</strong>（equilibrium price）：使供给与需求平衡的价格，有时被称为市场出清价格；均衡数量（equilibrium quantity）：均衡价格下的供给量与需求量。"},{"t":"均衡由供给曲线与需求曲线的交点决定（书中示例：冰淇淋蛋卷均衡价格为2美元，均衡数量为7个；在均衡价格下买者买到了想买的全部、卖者卖出了想卖的全部）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">均衡由供给曲线与需求曲线的交点决定</strong>（书中示例：冰淇淋蛋卷均衡价格为2美元，均衡数量为7个；在均衡价格下买者买到了想买的全部、卖者卖出了想卖的全部）。"},{"t":"过剩（surplus）：在现行价格下供给量大于需求量的状态，也称超额供给；市场价格高于均衡价格时出现，卖者降价销售，价格下降使需求量增加、供给量减少（沿曲线变动），价格持续下降直至均衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">过剩</strong>（surplus）：在现行价格下供给量大于需求量的状态，也称超额供给；市场价格高于均衡价格时出现，卖者降价销售，价格下降使需求量增加、供给量减少（沿曲线变动），价格持续下降直至均衡。"},{"t":"短缺（shortage）：在现行价格下需求量大于供给量的状态，也称超额需求；市场价格低于均衡价格时出现，买者排长队，卖者可以抬价，价格上升使需求量减少、供给量增加，推动市场走向均衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短缺</strong>（shortage）：在现行价格下需求量大于供给量的状态，也称超额需求；市场价格低于均衡价格时出现，买者排长队，卖者可以抬价，价格上升使需求量减少、供给量增加，推动市场走向均衡。"},{"t":"供求定理（law of supply and demand）：认为任何一种物品的价格都会自发调整，使该物品的供给与需求达到平衡的观点；在大多数自由市场中，过剩与短缺都只是暂时的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供求定理</strong>（law of supply and demand）：认为任何一种物品的价格都会自发调整，使该物品的供给与需求达到平衡的观点；在大多数自由市场中，过剩与短缺都只是暂时的。"}],"k":"b","i":1,"h":"4.4.1 均衡"},{"t":"4.4.2 分析均衡变动的三个步骤","c":[{"t":"三步法：第一，确定该事件是使供给曲线移动还是使需求曲线移动，或者（在某些情况下）使两条曲线都移动；第二，确定曲线是向右移动还是向左移动；第三，用供求图比较原来的均衡与新均衡，说明这种移动如何影响均衡价格和均衡数量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三步法</strong>：第一，确定该事件是使供给曲线移动还是使需求曲线移动，或者（在某些情况下）使两条曲线都移动；第二，确定曲线是向右移动还是向左移动；第三，用供求图比较原来的均衡与新均衡，说明这种移动如何影响均衡价格和均衡数量。"},{"t":"例一（需求移动）：夏季天气异常炎热，改变人们在既定价格下想买的数量，需求曲线右移、供给曲线不变；均衡价格从2美元上升到2.5美元，均衡数量从7个增加到10个——需求增加使均衡价格与均衡数量都上升。","c":[{"t":"曲线的移动与沿着曲线的变动：供给指供给曲线的位置，供给量指供给者希望出售的数量；本例中\"供给量\"增加但\"供给\"不变，供给量的增加表现为沿着供给曲线的变动。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">曲线的移动与沿着曲线的变动</strong>：供给指供给曲线的位置，供给量指供给者希望出售的数量；本例中&quot;供给量&quot;增加但&quot;供给&quot;不变，供给量的增加表现为沿着供给曲线的变动。"},{"t":"术语规则：供给曲线的移动称为\"供给变动\"，需求曲线的移动称为\"需求变动\"；沿着一条固定供给（需求）曲线的变动称为\"供给量（需求量）的变动\"。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">术语规则</strong>：供给曲线的移动称为&quot;供给变动&quot;，需求曲线的移动称为&quot;需求变动&quot;；沿着一条固定供给（需求）曲线的变动称为&quot;供给量（需求量）的变动&quot;。"}],"k":"b","i":2,"h":"<strong class=\"lead\">例一</strong>（需求移动）：夏季天气异常炎热，改变人们在既定价格下想买的数量，需求曲线右移、供给曲线不变；均衡价格从2美元上升到2.5美元，均衡数量从7个增加到10个——需求增加使均衡价格与均衡数量都上升。"},{"t":"例二（供给移动）：台风摧毁部分甘蔗田使糖价上升，作为投入品成本上升使供给曲线左移、需求曲线不变；均衡价格从2美元上升到2.5美元，均衡数量从7个减少到4个——供给减少使均衡价格上升、均衡数量减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例二</strong>（供给移动）：台风摧毁部分甘蔗田使糖价上升，作为投入品成本上升使供给曲线左移、需求曲线不变；均衡价格从2美元上升到2.5美元，均衡数量从7个减少到4个——供给减少使均衡价格上升、均衡数量减少。"},{"t":"例三（供给和需求都移动）：天气炎热（需求右移）与糖价上升（供给左移）发生在同一夏季：两种情况下均衡价格都上升；均衡数量不确定，取决于两条曲线移动幅度的相对大小——需求大幅度增加而供给减少很少时数量增加，供给大幅度减少而需求增加很少时数量减少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例三</strong>（供给和需求都移动）：天气炎热（需求右移）与糖价上升（供给左移）发生在同一夏季：两种情况下均衡价格都上升；均衡数量不确定，取决于两条曲线移动幅度的相对大小——需求大幅度增加而供给减少很少时数量增加，供给大幅度减少而需求增加很少时数量减少。"},{"t":"曲线移动组合的一般结论（表4-4 思路）：需求增加，价格上升、数量上升；需求减少，价格下降、数量下降；供给增加，价格下降、数量上升；供给减少，价格上升、数量下降；两条曲线同时移动时，按各自方向叠加判断，方向相反的一项结论不确定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">曲线移动组合的一般结论</strong>（表4-4 思路）：需求增加，价格上升、数量上升；需求减少，价格下降、数量下降；供给增加，价格下降、数量上升；供给减少，价格上升、数量下降；两条曲线同时移动时，按各自方向叠加判断，方向相反的一项结论不确定。"}],"k":"b","i":1,"h":"4.4.2 分析均衡变动的三个步骤"}],"k":"sec","i":0,"h":"4.4 供给与需求的结合"},{"t":"4.5 结论：价格如何配置资源","c":[{"t":"供求模型适用面广：到商店买东西就是对物品需求的贡献，找工作就是对劳动服务供给的贡献；供求工具会在以后各章反复使用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">供求模型适用面广</strong>：到商店买东西就是对物品需求的贡献，找工作就是对劳动服务供给的贡献；供求工具会在以后各章反复使用。"},{"t":"市场经济利用供给与需求的力量配置稀缺资源：价格不断调整直到需求量与供给量达到平衡（如数量有限的海滩土地，配置给任何一个愿意而且能够支付这种价格的人）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">市场经济利用供给与需求的力量配置稀缺资源</strong>：价格不断调整直到需求量与供给量达到平衡（如数量有限的海滩土地，配置给任何一个愿意而且能够支付这种价格的人）。"},{"t":"价格决定谁生产哪种物品以及生产多少：食物的价格和农民的工资（劳动的价格）不断调整，确保有足够的人选择从事农业。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">价格决定谁生产哪种物品以及生产多少</strong>：食物的价格和农民的工资（劳动的价格）不断调整，确保有足够的人选择从事农业。"},{"t":"价格是协调千万人分散决策的机制：如果有一只看不见的手引导市场经济，价格制度就是这只看不见的手用来指挥经济交响乐队的指挥棒。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">价格是协调千万人分散决策的机制</strong>：如果有一只看不见的手引导市场经济，价格制度就是这只看不见的手用来指挥经济交响乐队的指挥棒。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">4.5 结论</strong>：价格如何配置资源"}],"k":"chap","h":"第4章 供给与需求的市场力量"},{"t":"第5章 弹性及其应用","c":[{"t":"本章内容提要","c":[{"t":"弹性衡量买者与卖者对市场条件变化的反应程度：研究事件与政策的影响，不仅要讨论方向，还要讨论大小。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">弹性衡量买者与卖者对市场条件变化的反应程度</strong>：研究事件与政策的影响，不仅要讨论方向，还要讨论大小。"},{"t":"需求价格弹性用需求量变动百分比除以价格变动百分比计算；大于1为富有弹性，小于1为缺乏弹性，等于1为单位弹性。","c":[],"k":"b","i":1,"h":"需求价格弹性用需求量变动百分比除以价格变动百分比计算；大于1为富有弹性，小于1为缺乏弹性，等于1为单位弹性。"},{"t":"需求价格弹性的决定因素：相近替代品的可获得性、必需品还是奢侈品、市场定义的宽窄、时间范围的长短。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">需求价格弹性的决定因素</strong>：相近替代品的可获得性、必需品还是奢侈品、市场定义的宽窄、时间范围的长短。"},{"t":"总收益等于价格乘以销售量；需求缺乏弹性时价格与总收益同方向变动，富有弹性时反方向变动，单位弹性时总收益不变。","c":[],"k":"b","i":1,"h":"总收益等于价格乘以销售量；需求缺乏弹性时价格与总收益同方向变动，富有弹性时反方向变动，单位弹性时总收益不变。"},{"t":"线性需求曲线的斜率不变但弹性并不不变：价格高而数量少的各点富有弹性，价格低而数量多的各点缺乏弹性。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">线性需求曲线的斜率不变但弹性并不不变</strong>：价格高而数量少的各点富有弹性，价格低而数量多的各点缺乏弹性。"},{"t":"需求收入弹性区分正常物品（正）与低档物品（负）；需求的交叉价格弹性区分替代品（正）与互补品（负）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">需求收入弹性区分正常物品</strong>（正）与低档物品（负）；需求的交叉价格弹性区分替代品（正）与互补品（负）。"},{"t":"供给价格弹性取决于卖者改变产量供给的灵活性和时间长短；供给在长期中比在短期中更富有弹性。","c":[],"k":"b","i":1,"h":"供给价格弹性取决于卖者改变产量供给的灵活性和时间长短；供给在长期中比在短期中更富有弹性。"},{"t":"三个应用：农业技术进步减少农民总收益（需求缺乏弹性）；OPEC 只能在短期维持石油高价（长短期弹性不同）；禁毒短期可能增加与毒品相关的犯罪，禁毒教育则可同时减少吸毒与犯罪。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">三个应用</strong>：农业技术进步减少农民总收益（需求缺乏弹性）；OPEC 只能在短期维持石油高价（长短期弹性不同）；禁毒短期可能增加与毒品相关的犯罪，禁毒教育则可同时减少吸毒与犯罪。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"5.1 需求弹性","c":[{"t":"5.1.1 需求价格弹性及其决定因素","c":[{"t":"弹性（elasticity）：衡量需求量或供给量对其某种决定因素的变动的反应程度的指标。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">弹性</strong>（elasticity）：衡量需求量或供给量对其某种决定因素的变动的反应程度的指标。"},{"t":"需求价格弹性（price elasticity of demand）：衡量一种物品需求量对其价格变动反应程度的指标，用需求量变动百分比除以价格变动百分比来计算。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求价格弹性</strong>（price elasticity of demand）：衡量一种物品需求量对其价格变动反应程度的指标，用需求量变动百分比除以价格变动百分比来计算。"},{"t":"需求量对价格变动的反应很大，就说需求富有弹性；反应很小，就说需求缺乏弹性。","c":[],"k":"b","i":2,"h":"需求量对价格变动的反应很大，就说需求富有弹性；反应很小，就说需求缺乏弹性。"},{"t":"决定因素一（相近替代品的可获得性）：有相近替代品的物品的需求往往较富有弹性，因为消费者转向其他物品较容易（黄油有人造黄油可替代故弹性大；鸡蛋没有相近替代品故弹性小）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">决定因素一</strong>（相近替代品的可获得性）：有相近替代品的物品的需求往往较富有弹性，因为消费者转向其他物品较容易（黄油有人造黄油可替代故弹性大；鸡蛋没有相近替代品故弹性小）。"},{"t":"决定因素二（必需品与奢侈品）：必需品的需求往往缺乏弹性，奢侈品的需求往往富有弹性（看病是必需品、游艇是奢侈品）；一种物品是必需品还是奢侈品不取决于物品本身性质，而取决于购买者的偏好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">决定因素二</strong>（必需品与奢侈品）：必需品的需求往往缺乏弹性，奢侈品的需求往往富有弹性（看病是必需品、游艇是奢侈品）；一种物品是必需品还是奢侈品不取决于物品本身性质，而取决于购买者的偏好。"},{"t":"决定因素三（市场的定义）：狭窄定义的市场的需求弹性往往大于宽泛定义的市场，因为狭窄市场中的物品更容易找到相近替代品（食物缺乏弹性 < 冰淇淋较有弹性 < 香草冰淇淋非常富有弹性）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">决定因素三</strong>（市场的定义）：狭窄定义的市场的需求弹性往往大于宽泛定义的市场，因为狭窄市场中的物品更容易找到相近替代品（食物缺乏弹性 &lt; 冰淇淋较有弹性 &lt; 香草冰淇淋非常富有弹性）。"},{"t":"决定因素四（时间范围）：物品的需求往往在长期内更富有弹性（汽油价格上升后，最初几个月需求量只略减，几年内人们换省油车、乘公交、搬家近后需求量大幅减少）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">决定因素四</strong>（时间范围）：物品的需求往往在长期内更富有弹性（汽油价格上升后，最初几个月需求量只略减，几年内人们换省油车、乘公交、搬家近后需求量大幅减少）。"}],"k":"b","i":1,"h":"5.1.1 需求价格弹性及其决定因素"},{"t":"5.1.2 需求价格弹性的计算","c":[{"t":"公式：需求价格弹性 = 需求量变动百分比 ÷ 价格变动百分比。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公式</strong>：需求价格弹性 = 需求量变动百分比 ÷ 价格变动百分比。"},{"t":"书中示例：冰淇淋蛋卷价格上升10%，购买量减少20%，弹性为2，表明需求量变动的比例是价格变动比例的两倍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中示例</strong>：冰淇淋蛋卷价格上升10%，购买量减少20%，弹性为2，表明需求量变动的比例是价格变动比例的两倍。"},{"t":"符号惯例：由于需求量与价格负相关，两个变动百分比的符号总是相反，需求价格弹性有时被表示为负数；本书遵循一般做法去掉负号，把所有需求价格弹性表示为正数（绝对值），弹性越大意味着需求量对价格变动的反应越大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">符号惯例</strong>：由于需求量与价格负相关，两个变动百分比的符号总是相反，需求价格弹性有时被表示为负数；本书遵循一般做法去掉负号，把所有需求价格弹性表示为正数（绝对值），弹性越大意味着需求量对价格变动的反应越大。"}],"k":"b","i":1,"h":"5.1.2 需求价格弹性的计算"},{"t":"5.1.3 中点法：一个计算变动百分比和弹性的更好方法","c":[{"t":"问题：同一条需求曲线上从A点到B点的弹性似乎不同于从B点到A点的弹性，因为变动百分比根据不同的基础计算（书中示例：A点价4美元量120、B点价6美元量80，A到B算得弹性0.66，B到A算得约1.5）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题</strong>：同一条需求曲线上从A点到B点的弹性似乎不同于从B点到A点的弹性，因为变动百分比根据不同的基础计算（书中示例：A点价4美元量120、B点价6美元量80，A到B算得弹性0.66，B到A算得约1.5）。"},{"t":"中点法：用变动量除以原先水平与最后水平的中点值（平均值）来计算变动百分比，而不是除以原来的水平（4美元到6美元的中点值是5美元，故上升了 (6−4)/5×100% = 40%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">中点法</strong>：用变动量除以原先水平与最后水平的中点值（平均值）来计算变动百分比，而不是除以原来的水平（4美元到6美元的中点值是5美元，故上升了 (6−4)/5×100% = 40%）。"},{"t":"中点法公式：需求价格弹性 = [(Q2−Q1)/((Q1+Q2)/2)] ÷ [(P2−P1)/((P1+P2)/2)]，分子分母分别用中点法计算数量与价格的变动百分比。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">中点法公式</strong>：需求价格弹性 = [(Q2−Q1)/((Q1+Q2)/2)] ÷ [(P2−P1)/((P1+P2)/2)]，分子分母分别用中点法计算数量与价格的变动百分比。"},{"t":"中点法的好处：无论变动方向如何，给出的答案都相同（书中示例中A与B的中点为价格5美元、数量100，两个方向都算得价格变动40%、数量变动40%，弹性等于1）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">中点法的好处</strong>：无论变动方向如何，给出的答案都相同（书中示例中A与B的中点为价格5美元、数量100，两个方向都算得价格变动40%、数量变动40%，弹性等于1）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">5.1.3 中点法</strong>：一个计算变动百分比和弹性的更好方法"},{"t":"5.1.4 各种需求曲线","c":[{"t":"分类标准：弹性大于1（需求量变动比例大于价格变动比例）为富有弹性；小于1为缺乏弹性；正好等于1（需求量与价格同比例变动）为单位弹性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">分类标准</strong>：弹性大于1（需求量变动比例大于价格变动比例）为富有弹性；小于1为缺乏弹性；正好等于1（需求量与价格同比例变动）为单位弹性。"},{"t":"经验法则：通过给定一点的需求曲线越平坦，需求价格弹性越大；越陡峭，弹性越小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经验法则</strong>：通过给定一点的需求曲线越平坦，需求价格弹性越大；越陡峭，弹性越小。"},{"t":"五种区间：完全无弹性（弹性等于0，需求曲线为垂直线，无论价格如何变动需求量总相同）；缺乏弹性（小于1）；单位弹性（等于1）；富有弹性（大于1）；完全有弹性（弹性无穷大，需求曲线为水平线，价格的极小变动引起需求量的极大变动）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">五种区间</strong>：完全无弹性（弹性等于0，需求曲线为垂直线，无论价格如何变动需求量总相同）；缺乏弹性（小于1）；单位弹性（等于1）；富有弹性（大于1）；完全有弹性（弹性无穷大，需求曲线为水平线，价格的极小变动引起需求量的极大变动）。"},{"t":"记忆窍门：完全无弹性的垂直曲线（Inelastic）看起来像字母 I。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">记忆窍门</strong>：完全无弹性的垂直曲线（Inelastic）看起来像字母 I。"},{"t":"现实弹性估算（参考资料）：鸡蛋0.1、医疗0.2、香烟0.4、大米0.5、住房0.7、牛肉1.6、花生酱1.7、餐馆用餐2.3、山民私酿的威士忌酒4.4；对估算要有保留（统计技术依赖假设、同一需求曲线上各点弹性不同），不同研究的结果可能不同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现实弹性估算</strong>（参考资料）：鸡蛋0.1、医疗0.2、香烟0.4、大米0.5、住房0.7、牛肉1.6、花生酱1.7、餐馆用餐2.3、山民私酿的威士忌酒4.4；对估算要有保留（统计技术依赖假设、同一需求曲线上各点弹性不同），不同研究的结果可能不同。"}],"k":"b","i":1,"h":"5.1.4 各种需求曲线"},{"t":"5.1.5 总收益与需求价格弹性","c":[{"t":"总收益（total revenue）：一种物品的买者支付从而卖者得到的量，用该物品的价格乘以销售量来计算；图形上表现为需求曲线下方高为P、宽为Q的方框面积（书中示例：P=4美元、Q=100，总收益400美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总收益</strong>（total revenue）：一种物品的买者支付从而卖者得到的量，用该物品的价格乘以销售量来计算；图形上表现为需求曲线下方高为P、宽为Q的方框面积（书中示例：P=4美元、Q=100，总收益400美元）。"},{"t":"需求缺乏弹性时，价格上升引起总收益增加：Q减少的比例小于P上升的比例（书中示例：价格从4美元升至5美元，需求量从100降至90，总收益从400美元增至450美元，涨价的好处抵消销量减少的损失而有余）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求缺乏弹性时，价格上升引起总收益增加</strong>：Q减少的比例小于P上升的比例（书中示例：价格从4美元升至5美元，需求量从100降至90，总收益从400美元增至450美元，涨价的好处抵消销量减少的损失而有余）。"},{"t":"需求富有弹性时，价格上升引起总收益减少：Q减少的比例大于P上升的比例（书中示例：价格从4美元升至5美元，需求量从100减至70，总收益从400美元减至350美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求富有弹性时，价格上升引起总收益减少</strong>：Q减少的比例大于P上升的比例（书中示例：价格从4美元升至5美元，需求量从100减至70，总收益从400美元减至350美元）。"},{"t":"一般规律：需求缺乏弹性（弹性小于1）时，价格和总收益同方向变动；需求富有弹性（弹性大于1）时，价格和总收益反方向变动；需求为单位弹性（弹性等于1）时，价格变动总收益保持不变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般规律</strong>：需求缺乏弹性（弹性小于1）时，价格和总收益同方向变动；需求富有弹性（弹性大于1）时，价格和总收益反方向变动；需求为单位弹性（弹性等于1）时，价格变动总收益保持不变。"}],"k":"b","i":1,"h":"5.1.5 总收益与需求价格弹性"},{"t":"5.1.6 沿着一条线性需求曲线的弹性和总收益","c":[{"t":"线性需求曲线的斜率不变（价格每上升1美元需求量都减少2个单位），但弹性并不是不变：斜率是两个变量变动的比率，弹性是两个变量变动百分比的比率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">线性需求曲线的斜率不变</strong>（价格每上升1美元需求量都减少2个单位），但弹性并不是不变：斜率是两个变量变动的比率，弹性是两个变量变动百分比的比率。"},{"t":"弹性沿曲线变化：在价格低而数量高的各点上需求缺乏弹性（1美元的变动使价格百分比大、数量百分比小）；在价格高而数量低的各点上需求富有弹性（同样变动使价格百分比小、数量百分比大）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">弹性沿曲线变化</strong>：在价格低而数量高的各点上需求缺乏弹性（1美元的变动使价格百分比大、数量百分比小）；在价格高而数量低的各点上需求富有弹性（同样变动使价格百分比小、数量百分比大）。"},{"t":"总收益相应变化（书中表格）：价格低（需求缺乏弹性）时提价总收益增加（如1美元升至2美元）；价格高（需求富有弹性）时提价总收益减少（如5美元升至6美元）；价格在3美元与4美元之间为单位弹性，两个价格下总收益相同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总收益相应变化</strong>（书中表格）：价格低（需求缺乏弹性）时提价总收益增加（如1美元升至2美元）；价格高（需求富有弹性）时提价总收益减少（如5美元升至6美元）；价格在3美元与4美元之间为单位弹性，两个价格下总收益相同。"},{"t":"结论：一条需求曲线上各点的需求价格弹性不一定是相同的；固定的弹性是可能的，但并不总是这样。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：一条需求曲线上各点的需求价格弹性不一定是相同的；固定的弹性是可能的，但并不总是这样。"}],"k":"b","i":1,"h":"5.1.6 沿着一条线性需求曲线的弹性和总收益"},{"t":"5.1.7 其他需求弹性","c":[{"t":"需求收入弹性（income elasticity of demand）：衡量一种物品需求量对消费者收入变动反应程度的指标，用需求量变动百分比除以收入变动百分比来计算。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求收入弹性</strong>（income elasticity of demand）：衡量一种物品需求量对消费者收入变动反应程度的指标，用需求量变动百分比除以收入变动百分比来计算。"},{"t":"符号含义：正常物品收入提高需求量增加，收入弹性为正；低档物品（如乘公共汽车）收入提高需求量减少，收入弹性为负。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">符号含义</strong>：正常物品收入提高需求量增加，收入弹性为正；低档物品（如乘公共汽车）收入提高需求量减少，收入弹性为负。"},{"t":"弹性大小：食物和衣服这类必需品往往收入弹性较小；鱼子酱和钻石这类奢侈品往往收入弹性很大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">弹性大小</strong>：食物和衣服这类必需品往往收入弹性较小；鱼子酱和钻石这类奢侈品往往收入弹性很大。"},{"t":"需求的交叉价格弹性（cross-price elasticity of demand）：衡量一种物品需求量对另外一种物品价格变动的反应程度的指标，用物品1的需求量变动百分比除以物品2的价格变动百分比来计算。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">需求的交叉价格弹性</strong>（cross-price elasticity of demand）：衡量一种物品需求量对另外一种物品价格变动的反应程度的指标，用物品1的需求量变动百分比除以物品2的价格变动百分比来计算。"},{"t":"符号含义：替代品（如汉堡包与热狗）的交叉价格弹性为正数（热狗价格上升使汉堡包需求量增加）；互补品（如电脑和软件）的交叉价格弹性为负数（电脑价格上升使软件需求量减少）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">符号含义</strong>：替代品（如汉堡包与热狗）的交叉价格弹性为正数（热狗价格上升使汉堡包需求量增加）；互补品（如电脑和软件）的交叉价格弹性为负数（电脑价格上升使软件需求量减少）。"}],"k":"b","i":1,"h":"5.1.7 其他需求弹性"}],"k":"sec","i":0,"h":"5.1 需求弹性"},{"t":"5.2 供给弹性","c":[{"t":"5.2.1 供给价格弹性及其决定因素","c":[{"t":"供给价格弹性（price elasticity of supply）：衡量一种物品供给量对其价格变动反应程度的指标，用供给量变动百分比除以价格变动百分比来计算。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给价格弹性</strong>（price elasticity of supply）：衡量一种物品供给量对其价格变动反应程度的指标，用供给量变动百分比除以价格变动百分比来计算。"},{"t":"供给量对价格变动的反应很大就说供给富有弹性；反应很小就说供给缺乏弹性。","c":[],"k":"b","i":2,"h":"供给量对价格变动的反应很大就说供给富有弹性；反应很小就说供给缺乏弹性。"},{"t":"取决于卖者改变所生产物品量的灵活性：海滩土地的供给缺乏弹性（几乎不可能生产更多）；书、汽车和电视这类制成品的供给富有弹性（企业可让工厂更长时间运转）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">取决于卖者改变所生产物品量的灵活性</strong>：海滩土地的供给缺乏弹性（几乎不可能生产更多）；书、汽车和电视这类制成品的供给富有弹性（企业可让工厂更长时间运转）。"},{"t":"关键决定因素是所考虑的时间长短：短期中企业不能轻易改变工厂规模，供给量对价格不是很敏感；长期中企业可以开设新工厂或关闭旧工厂，新企业可进入、旧企业可退出，供给量可以对价格变动做出相当大的反应——供给的弹性在长期中通常大于短期。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键决定因素是所考虑的时间长短</strong>：短期中企业不能轻易改变工厂规模，供给量对价格不是很敏感；长期中企业可以开设新工厂或关闭旧工厂，新企业可进入、旧企业可退出，供给量可以对价格变动做出相当大的反应——供给的弹性在长期中通常大于短期。"}],"k":"b","i":1,"h":"5.2.1 供给价格弹性及其决定因素"},{"t":"5.2.2 供给价格弹性的计算","c":[{"t":"公式：供给价格弹性 = 供给量变动百分比 ÷ 价格变动百分比。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公式</strong>：供给价格弹性 = 供给量变动百分比 ÷ 价格变动百分比。"},{"t":"书中示例：牛奶价格从2.85美元升至3.15美元，用中点法价格变动百分比为 (3.15−2.85)/3.00×100% = 10%；产量从9000加仑增至11000加仑，供给量变动百分比为 (11000−9000)/10000×100% = 20%；供给价格弹性为2，供给量变动比例是价格变动比例的两倍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中示例</strong>：牛奶价格从2.85美元升至3.15美元，用中点法价格变动百分比为 (3.15−2.85)/3.00×100% = 10%；产量从9000加仑增至11000加仑，供给量变动百分比为 (11000−9000)/10000×100% = 20%；供给价格弹性为2，供给量变动比例是价格变动比例的两倍。"}],"k":"b","i":1,"h":"5.2.2 供给价格弹性的计算"},{"t":"5.2.3 各种供给曲线","c":[{"t":"五种区间：完全无弹性（弹性等于0，供给曲线为垂直线，无论价格如何变动供给量总相同）；缺乏弹性（小于1）；单位弹性（等于1）；富有弹性（大于1）；完全有弹性（弹性无穷大，供给曲线为水平线，价格极小的变动引起供给量极大的变动）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">五种区间</strong>：完全无弹性（弹性等于0，供给曲线为垂直线，无论价格如何变动供给量总相同）；缺乏弹性（小于1）；单位弹性（等于1）；富有弹性（大于1）；完全有弹性（弹性无穷大，供给曲线为水平线，价格极小的变动引起供给量极大的变动）。"},{"t":"供给弹性可沿供给曲线变动：企业拥有的工厂生产能力有限时，供给量水平很低时存在未被利用的生产能力，供给弹性很高（价格小幅上升即可利用闲置产能）；随供给量增加逐渐接近最大生产能力，再增产就要建立新工厂、价格必须大幅度上升，供给变得缺乏弹性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">供给弹性可沿供给曲线变动</strong>：企业拥有的工厂生产能力有限时，供给量水平很低时存在未被利用的生产能力，供给弹性很高（价格小幅上升即可利用闲置产能）；随供给量增加逐渐接近最大生产能力，再增产就要建立新工厂、价格必须大幅度上升，供给变得缺乏弹性。"},{"t":"书中示例：价格从3美元升至4美元（中点法上升29%），供给量从100增至200（增加67%），弹性大于1；价格从12美元升至15美元（上升22%），供给量从500增至525（增加5%），弹性小于1。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书中示例</strong>：价格从3美元升至4美元（中点法上升29%），供给量从100增至200（增加67%），弹性大于1；价格从12美元升至15美元（上升22%），供给量从500增至525（增加5%），弹性小于1。"}],"k":"b","i":1,"h":"5.2.3 各种供给曲线"}],"k":"sec","i":0,"h":"5.2 供给弹性"},{"t":"5.3 供给、需求和弹性的三个应用","c":[{"t":"5.3.1 农业的好消息可能对农民来说是坏消息吗","c":[{"t":"问题：堪萨斯州立大学培育出使每英亩产量增加20%的小麦新杂交品种，种小麦的农民状况会变好还是变坏。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题</strong>：堪萨斯州立大学培育出使每英亩产量增加20%的小麦新杂交品种，种小麦的农民状况会变好还是变坏。"},{"t":"用三步法分析：新杂交品种影响供给曲线（既定价格下农民愿意供给更多），供给曲线右移；需求曲线不变（消费者的购买愿望不受影响）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">用三步法分析</strong>：新杂交品种影响供给曲线（既定价格下农民愿意供给更多），供给曲线右移；需求曲线不变（消费者的购买愿望不受影响）。"},{"t":"结论：供给增加使小麦销售量从100蒲式耳增至110蒲式耳，价格从3美元降为2美元。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：供给增加使小麦销售量从100蒲式耳增至110蒲式耳，价格从3美元降为2美元。"},{"t":"总收益判断：小麦等基本食品的需求一般是缺乏弹性的（便宜且少有好的替代品），价格下降的比例大于销售量增加的比例，总收益从300美元（3×100）减至220美元（2×110）——农业技术进步对农民是坏消息，对能以低价买食物的消费者是好事。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总收益判断</strong>：小麦等基本食品的需求一般是缺乏弹性的（便宜且少有好的替代品），价格下降的比例大于销售量增加的比例，总收益从300美元（3×100）减至220美元（2×110）——农业技术进步对农民是坏消息，对能以低价买食物的消费者是好事。"},{"t":"个人理性与集体结果：每个农民都是市场上微不足道的一分子、把价格视为既定，个人采用新品种多产多卖会更好；但当所有农民都这样做时，供给增加、价格下降、农民整体状况变坏——这是竞争市场如何运行的核心。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个人理性与集体结果</strong>：每个农民都是市场上微不足道的一分子、把价格视为既定，个人采用新品种多产多卖会更好；但当所有农民都这样做时，供给增加、价格下降、农民整体状况变坏——这是竞争市场如何运行的核心。"},{"t":"历史佐证：农业技术进步使食物供给增加、农业收益减少，进而鼓励人们离开农业（1950年美国1000万人务农、占劳动力17%；如今不到300万、只占2%，农场产出却约为1950年的五倍）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">历史佐证</strong>：农业技术进步使食物供给增加、农业收益减少，进而鼓励人们离开农业（1950年美国1000万人务农、占劳动力17%；如今不到300万、只占2%，农场产出却约为1950年的五倍）。"},{"t":"政策含义：某些农业计划让农民不把全部土地种上作物，通过减少供给提高价格，因农产品需求缺乏弹性，农民整体总收益增加；但这对农民有利的不一定对整个社会也有利，减少供给的政策以损害消费者利益为代价。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政策含义</strong>：某些农业计划让农民不把全部土地种上作物，通过减少供给提高价格，因农产品需求缺乏弹性，农民整体总收益增加；但这对农民有利的不一定对整个社会也有利，减少供给的政策以损害消费者利益为代价。"}],"k":"b","i":1,"h":"5.3.1 农业的好消息可能对农民来说是坏消息吗"},{"t":"5.3.2 为什么OPEC不能保持石油的高价格","c":[{"t":"背景：OPEC在1973—1974年通过共同减产使石油价格（经通胀调整）上涨50%以上，1979—1981年几乎翻了一番；但1982—1985年油价以每年10%的速度稳步下降，1986年成员国合作破裂、油价猛跌45%，1990年回到1970年的水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：OPEC在1973—1974年通过共同减产使石油价格（经通胀调整）上涨50%以上，1979—1981年几乎翻了一番；但1982—1985年油价以每年10%的速度稳步下降，1986年成员国合作破裂、油价猛跌45%，1990年回到1970年的水平。"},{"t":"短期：石油的供给和需求都较为缺乏弹性（已知的石油贮藏量和开采能力不能迅速改变；购买习惯不会立即对价格变动做出反应），供求曲线都陡峭；供给曲线左移时价格从P1到P2的上升幅度很大，OPEC虽然销售量减少但收入增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短期</strong>：石油的供给和需求都较为缺乏弹性（已知的石油贮藏量和开采能力不能迅速改变；购买习惯不会立即对价格变动做出反应），供求曲线都陡峭；供给曲线左移时价格从P1到P2的上升幅度很大，OPEC虽然销售量减少但收入增加。"},{"t":"长期：OPEC以外的生产者对高价格的反应是加强勘探并建立新的开采能力，消费者用节油汽车代替耗油汽车，供求曲线都更富有弹性；同样幅度的供给减少只引起价格的小幅度上升。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长期</strong>：OPEC以外的生产者对高价格的反应是加强勘探并建立新的开采能力，消费者用节油汽车代替耗油汽车，供求曲线都更富有弹性；同样幅度的供给减少只引起价格的小幅度上升。"},{"t":"结论：OPEC共同减少供给在长期中无利可图——在短期中提高油价比在长期中更容易。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：OPEC共同减少供给在长期中无利可图——在短期中提高油价比在长期中更容易。"}],"k":"b","i":1,"h":"5.3.2 为什么OPEC不能保持石油的高价格"},{"t":"5.3.3 禁毒增加还是减少了与毒品相关的犯罪","c":[{"t":"问题：美国政府每年花费几十亿美元减少毒品流入，禁毒对与毒品相关的犯罪有何影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题</strong>：美国政府每年花费几十亿美元减少毒品流入，禁毒对与毒品相关的犯罪有何影响。"},{"t":"用三步法分析禁毒：禁毒直接影响毒品的卖者（增加出售成本）而不是买者，供给曲线从S1左移到S2、需求曲线不变；均衡价格从P1升到P2，均衡数量从Q1减到Q2——禁毒确实减少了毒品的使用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">用三步法分析禁毒</strong>：禁毒直接影响毒品的卖者（增加出售成本）而不是买者，供给曲线从S1左移到S2、需求曲线不变；均衡价格从P1升到P2，均衡数量从Q1减到Q2——禁毒确实减少了毒品的使用。"},{"t":"犯罪分析：毒品需求很可能是缺乏弹性的（价格上升能根除吸毒习惯的瘾君子很少）；需求缺乏弹性时价格上升使毒品市场的总收益增加，吸毒者为毒品支出的总货币量增加，已经以行窃维持吸毒习惯的瘾君子会变本加厉地犯罪——禁毒增加了与毒品相关的犯罪。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">犯罪分析</strong>：毒品需求很可能是缺乏弹性的（价格上升能根除吸毒习惯的瘾君子很少）；需求缺乏弹性时价格上升使毒品市场的总收益增加，吸毒者为毒品支出的总货币量增加，已经以行窃维持吸毒习惯的瘾君子会变本加厉地犯罪——禁毒增加了与毒品相关的犯罪。"},{"t":"替代方案：禁毒教育努力减少对毒品的需求，需求曲线从D1左移到D2；价格和数量都减少，吸毒者支付的总货币量（总收益）也减少——与禁毒相比，禁毒教育可以同时减少吸毒和与毒品相关的犯罪。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">替代方案</strong>：禁毒教育努力减少对毒品的需求，需求曲线从D1左移到D2；价格和数量都减少，吸毒者支付的总货币量（总收益）也减少——与禁毒相比，禁毒教育可以同时减少吸毒和与毒品相关的犯罪。"},{"t":"长短期视角：短期中高价格对已有瘾君子没有实质性影响，需求缺乏弹性；长期中高价格会限制年轻人尝试吸毒、随时间减少瘾君子数量，需求较富有弹性——禁毒在短期中增加与毒品相关的犯罪，在长期中会减少这种犯罪。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长短期视角</strong>：短期中高价格对已有瘾君子没有实质性影响，需求缺乏弹性；长期中高价格会限制年轻人尝试吸毒、随时间减少瘾君子数量，需求较富有弹性——禁毒在短期中增加与毒品相关的犯罪，在长期中会减少这种犯罪。"}],"k":"b","i":1,"h":"5.3.3 禁毒增加还是减少了与毒品相关的犯罪"}],"k":"sec","i":0,"h":"5.3 供给、需求和弹性的三个应用"},{"t":"5.4 结论","c":[{"t":"供给与需求工具加上弹性，使你能分析影响经济的许多最重要的事件和政策。","c":[],"k":"b","i":1,"h":"供给与需求工具加上弹性，使你能分析影响经济的许多最重要的事件和政策。"},{"t":"本章用这些通用工具回答了三个看似复杂的问题：小麦市场、石油市场和非法毒品市场都服从于供给与需求的力量。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章用这些通用工具回答了三个看似复杂的问题</strong>：小麦市场、石油市场和非法毒品市场都服从于供给与需求的力量。"}],"k":"sec","i":0,"h":"5.4 结论"}],"k":"chap","h":"第5章 弹性及其应用"},{"t":"第6章 供给、需求与政府政策","c":[{"t":"本章内容提要","c":[{"t":"价格上限（price ceiling）是出售一种物品的法定最高价格；当它低于均衡价格时是限制性的，需求量大于供给量，引起短缺。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">价格上限</strong>（price ceiling）是出售一种物品的法定最高价格；当它低于均衡价格时是限制性的，需求量大于供给量，引起短缺。"},{"t":"价格下限（price floor）是出售一种物品的法定最低价格；当它高于均衡价格时是限制性的，供给量大于需求量，引起过剩。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">价格下限</strong>（price floor）是出售一种物品的法定最低价格；当它高于均衡价格时是限制性的，供给量大于需求量，引起过剩。"},{"t":"价格控制下的配给机制（排队、卖者偏好歧视等）很少是合意的；价格控制往往损害它本想帮助的人，租金补贴、工资补贴等替代政策通常更好。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">价格控制下的配给机制</strong>（排队、卖者偏好歧视等）很少是合意的；价格控制往往损害它本想帮助的人，租金补贴、工资补贴等替代政策通常更好。"},{"t":"对一种物品征税使均衡数量减少，即缩小了市场的规模；税收是在买者支付的价格与卖者得到的价格之间打入的一个\"楔子\"。","c":[],"k":"b","i":1,"h":"对一种物品征税使均衡数量减少，即缩小了市场的规模；税收是在买者支付的价格与卖者得到的价格之间打入的一个&quot;楔子&quot;。"},{"t":"对买者征税与对卖者征税是等同的：买者与卖者分摊税收负担，唯一区别是谁把钱交给政府。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对买者征税与对卖者征税是等同的</strong>：买者与卖者分摊税收负担，唯一区别是谁把钱交给政府。"},{"t":"税收归宿（tax incidence）不取决于向谁征税，而取决于供给和需求的价格弹性：税收负担更多地落在缺乏弹性的市场一方。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">税收归宿</strong>（tax incidence）不取决于向谁征税，而取决于供给和需求的价格弹性：税收负担更多地落在缺乏弹性的市场一方。"}],"k":"sec","i":0,"h":"本章内容提要"},{"t":"6.1 价格控制","c":[{"t":"分析背景：在没有政府管制的竞争市场上，价格自发调整使供求平衡（书中示例：冰淇淋均衡价为每个蛋卷3美元）；买者总希望价格更低、卖者总希望价格更高，双方都游说政府直接控制价格，但控制政策本身也会引起不公平。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">分析背景</strong>：在没有政府管制的竞争市场上，价格自发调整使供求平衡（书中示例：冰淇淋均衡价为每个蛋卷3美元）；买者总希望价格更低、卖者总希望价格更高，双方都游说政府直接控制价格，但控制政策本身也会引起不公平。"},{"t":"6.1.1 价格上限如何影响市场结果","c":[{"t":"价格上限（price ceiling）：出售一种物品的法定最高价格。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">价格上限</strong>（price ceiling）：出售一种物品的法定最高价格。"},{"t":"非限制性上限：上限高于均衡价格（如上限4美元＞均衡3美元），市场力量自然使经济达到均衡，上限对价格和销售量没有影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">非限制性上限</strong>：上限高于均衡价格（如上限4美元＞均衡3美元），市场力量自然使经济达到均衡，上限对价格和销售量没有影响。"},{"t":"限制性上限：上限低于均衡价格（如上限2美元＜均衡3美元），市场价格被压在上限；此时需求量（125个）超过供给量（75个），出现50个的超额需求即短缺，一些想按现行价格购买的人买不到。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">限制性上限</strong>：上限低于均衡价格（如上限2美元＜均衡3美元），市场价格被压在上限；此时需求量（125个）超过供给量（75个），出现50个的超额需求即短缺，一些想按现行价格购买的人买不到。"},{"t":"短缺引发配给机制：排长队（愿意提前来排队的人得到，浪费买者时间，无效率）；按卖者个人偏好配给（只卖给朋友、亲戚或同族成员，既无效率又可能不公平）；即使动机是帮助买者，也不是所有买者都受益——有人排队买到低价品，有人根本买不到。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">短缺引发配给机制</strong>：排长队（愿意提前来排队的人得到，浪费买者时间，无效率）；按卖者个人偏好配给（只卖给朋友、亲戚或同族成员，既无效率又可能不公平）；即使动机是帮助买者，也不是所有买者都受益——有人排队买到低价品，有人根本买不到。"},{"t":"一般结论：当政府对竞争市场实行限制性价格上限时，市场产生物品短缺，卖者必须在大量潜在买者中配给稀缺物品，这种配给机制很少是合意的；自由市场用价格配给物品，任何想支付市场价格的人都能买到，既有效率又客观。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般结论</strong>：当政府对竞争市场实行限制性价格上限时，市场产生物品短缺，卖者必须在大量潜在买者中配给稀缺物品，这种配给机制很少是合意的；自由市场用价格配给物品，任何想支付市场价格的人都能买到，既有效率又客观。"},{"t":"案例研究「加油站前的长队」：1973年OPEC提高原油价格，汽油供给随之减少。供给曲线左移后，在无管制市场上均衡价格本会从P1升到P2并出清市场；但价格管制使价格不能上升到均衡水平，生产者只愿卖QS而消费者愿买QD，管制价格下出现严重短缺、排队数小时。可见短缺应归咎于价格管制而非仅是OPEC；管制取消后，汽油价格可自发调整使供求平衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「加油站前的长队」</strong>：1973年OPEC提高原油价格，汽油供给随之减少。供给曲线左移后，在无管制市场上均衡价格本会从P1升到P2并出清市场；但价格管制使价格不能上升到均衡水平，生产者只愿卖QS而消费者愿买QD，管制价格下出现严重短缺、排队数小时。可见短缺应归咎于价格管制而非仅是OPEC；管制取消后，汽油价格可自发调整使供求平衡。"},{"t":"案例研究「短期与长期中的租金控制」：租金控制是常见的价格上限，目的是使穷人租得起房，但经济学家批评它极无效率（有人称之为\"除了轰炸之外，毁灭一个城市的最好方法\"；对赞扬租金控制的说法，受访经济学家95%不同意）。","c":[{"t":"短期：公寓数量固定、人们调整住房安排需要时间，住房的供给与需求都相对缺乏弹性，租金控制只引起少量短缺，主要影响是降低了租金。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">短期</strong>：公寓数量固定、人们调整住房安排需要时间，住房的供给与需求都相对缺乏弹性，租金控制只引起少量短缺，主要影响是降低了租金。"},{"t":"长期：房东对低租金的反应是不建新公寓、不修缮现有公寓；低租金鼓励人们独立居住并迁居城市，供给与需求都较为富有弹性，结果是住房大量短缺。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">长期</strong>：房东对低租金的反应是不建新公寓、不修缮现有公寓；低租金鼓励人们独立居住并迁居城市，供给与需求都较为富有弹性，结果是住房大量短缺。"},{"t":"配给与激励：房东以排长队、偏好无孩子的房客、种族歧视、暗中贿赂大楼管理者等机制配给住房（贿赂使公寓总价格接近均衡价格）；短缺与排队使房东失去维持和改善房屋的激励（人们会对激励做出反应），房客房租少了但住房质量下降。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">配给与激励</strong>：房东以排长队、偏好无孩子的房客、种族歧视、暗中贿赂大楼管理者等机制配给住房（贿赂使公寓总价格接近均衡价格）；短缺与排队使房东失去维持和改善房屋的激励（人们会对激励做出反应），房客房租少了但住房质量下降。"},{"t":"决策者常追加管制（认定住房种族歧视非法、要求适居的最低条件）来应对后果，但实行困难且代价高昂；取消租金控制由市场竞争调节时，这类法律就没那么必要。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">决策者常追加管制</strong>（认定住房种族歧视非法、要求适居的最低条件）来应对后果，但实行困难且代价高昂；取消租金控制由市场竞争调节时，这类法律就没那么必要。"}],"k":"b","i":2,"h":"<strong class=\"lead\">案例研究「短期与长期中的租金控制」</strong>：租金控制是常见的价格上限，目的是使穷人租得起房，但经济学家批评它极无效率（有人称之为&quot;除了轰炸之外，毁灭一个城市的最好方法&quot;；对赞扬租金控制的说法，受访经济学家95%不同意）。"}],"k":"b","i":1,"h":"6.1.1 价格上限如何影响市场结果"},{"t":"6.1.2 价格下限如何影响市场结果","c":[{"t":"价格下限（price floor）：出售一种物品的法定最低价格；与价格上限一样，是政府为使价格保持在偏离均衡价格的水平上而制定的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">价格下限</strong>（price floor）：出售一种物品的法定最低价格；与价格上限一样，是政府为使价格保持在偏离均衡价格的水平上而制定的。"},{"t":"非限制性下限：下限低于均衡价格（如下限2美元＜均衡3美元），市场自发达到均衡，下限没有影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">非限制性下限</strong>：下限低于均衡价格（如下限2美元＜均衡3美元），市场自发达到均衡，下限没有影响。"},{"t":"限制性下限：下限高于均衡价格（如下限4美元＞均衡3美元），市场价格停在下限；此时供给量（120个）超过需求量（80个），出现40个的过剩，一些想按现行价格销售的人卖不出自己的物品。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">限制性下限</strong>：下限高于均衡价格（如下限4美元＞均衡3美元），市场价格停在下限；此时供给量（120个）超过需求量（80个），出现40个的过剩，一些想按现行价格销售的人卖不出自己的物品。"},{"t":"过剩同样带来不合意的配给：受买者个人偏好（也许是种族或家族之故）青睐的卖者更容易卖出产品；自由市场中价格起配给作用，卖者可以按均衡价格卖掉想卖的所有东西。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">过剩同样带来不合意的配给</strong>：受买者个人偏好（也许是种族或家族之故）青睐的卖者更容易卖出产品；自由市场中价格起配给作用，卖者可以按均衡价格卖掉想卖的所有东西。"},{"t":"案例研究「最低工资」：最低工资法规定任何一个雇主要支付的最低劳动价格（美国国会在1938年《公平劳动标准法案》中首次规定；2015年联邦最低工资为每小时7.25美元，法国最低工资比美国高30%以上）。","c":[{"t":"最低工资高于均衡工资时，劳动供给量大于需求量，出现失业：它增加了有工作工人的收入，但减少了找不到工作的工人的收入。","c":[],"k":"b","i":3,"h":"最低工资高于均衡工资时，劳动供给量大于需求量，出现失业：它增加了有工作工人的收入，但减少了找不到工作的工人的收入。"},{"t":"经济中包括许多由不同类型工人参与的劳动市场，影响取决于工人的技能与经验：技能高、经验丰富者的均衡工资远高于最低工资，不受影响（非限制性）；青少年均衡工资低（技能最低、经验最少，且愿接受低工资换取在职培训），所受限制最大。","c":[],"k":"b","i":3,"h":"经济中包括许多由不同类型工人参与的劳动市场，影响取决于工人的技能与经验：技能高、经验丰富者的均衡工资远高于最低工资，不受影响（非限制性）；青少年均衡工资低（技能最低、经验最少，且愿接受低工资换取在职培训），所受限制最大。"},{"t":"有代表性的研究发现：最低工资每上升10%，青少年就业减少1%–3%；由于法律并未影响工资已大大高于最低工资的青少年且实施不彻底，这一就业减少已属显著。最低工资还提高了青少年可赚到的工资，增加找工作人数，一些在学青少年退学就业，挤掉先前退学就业的青少年使其失业。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">有代表性的研究发现</strong>：最低工资每上升10%，青少年就业减少1%–3%；由于法律并未影响工资已大大高于最低工资的青少年且实施不彻底，这一就业减少已属显著。最低工资还提高了青少年可赚到的工资，增加找工作人数，一些在学青少年退学就业，挤掉先前退学就业的青少年使其失业。"},{"t":"争论：支持者认为它是增加贫困工人收入的方法（2015年两个领取最低工资的成年人每周各工作40小时，年收入合计也只有30160美元，超过四口之家官方贫困线24%，但不到美
