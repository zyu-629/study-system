求双赢的整合策略）；跨文化谈判的信任水平较低，与谈判者不太愿意披露或索要信息有关；美国和中国谈判者都存在群体内偏见，倾向选择同文化背景的谈判伙伴。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">跨文化结论</strong>：集体主义者视人处于社会关系之中，为维系和谐会迂回表达冲突、倾向通过第三方解决争端；个人主义者视人独立自主，希望直接公开面对分歧——美国管理者更可能在冲突中采取竞争策略，中国以折中和回避最受欢迎（但中国高科技企业的高层管理团队更偏好力求双赢的整合策略）；跨文化谈判的信任水平较低，与谈判者不太愿意披露或索要信息有关；美国和中国谈判者都存在群体内偏见，倾向选择同文化背景的谈判伙伴。"}],"k":"b","i":1,"h":"14.2.5 阶段5 结果"}],"k":"sec","i":0,"h":"14.2 冲突过程"},{"t":"14.3 谈判","c":[{"t":"谈判（negotiation）：双方或多方决定如何分配稀缺资源的过程；与洽谈（bargaining）两词可互换使用；组织中的谈判渗透到几乎每个成员的互动中（劳资谈判、上下级与同事、销售与客户、采购与供应商，乃至以小帮忙换人情），且每次谈判还影响双方关系及谈判者对自己的看法——维系社交关系并按道德行事有时与直接结果同等重要。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">谈判</strong>（negotiation）：双方或多方决定如何分配稀缺资源的过程；与洽谈（bargaining）两词可互换使用；组织中的谈判渗透到几乎每个成员的互动中（劳资谈判、上下级与同事、销售与客户、采购与供应商，乃至以小帮忙换人情），且每次谈判还影响双方关系及谈判者对自己的看法——维系社交关系并按道德行事有时与直接结果同等重要。"},{"t":"14.3.1 谈判策略","c":[{"t":"分配式谈判（distributive bargaining）：在零和条件下就一份固定大小的利益进行讨价还价——我所得的任何收益恰是你所付出的代价，反之亦然；最明显的特点是零和操作。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">分配式谈判</strong>（distributive bargaining）：在零和条件下就一份固定大小的利益进行讨价还价——我所得的任何收益恰是你所付出的代价，反之亦然；最明显的特点是零和操作。"},{"t":"固定大小的利益（fixed pie）：谈判双方用来分配的产品或服务在量上固定；利益大小固定（或被认为固定）时，双方往往采取分配式谈判。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">固定大小的利益</strong>（fixed pie）：谈判双方用来分配的产品或服务在量上固定；利益大小固定（或被认为固定）时，双方往往采取分配式谈判。"},{"t":"谈判区（图表14-6）：双方各有目标点（希望实现的结果）与抵制点（可接受的最差结果，远离愿望范围越过抵制点则宁可终止谈判）；目标点与抵制点之间为愿望范围；双方愿望范围存在重叠时就有一个解决区间，使双方愿望均能实现。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">谈判区</strong>（图表14-6）：双方各有目标点（希望实现的结果）与抵制点（可接受的最差结果，远离愿望范围越过抵制点则宁可终止谈判）；目标点与抵制点之间为愿望范围；双方愿望范围存在重叠时就有一个解决区间，使双方愿望均能实现。"},{"t":"证据结论：分配式谈判中最有效的行动之一是首先出价并给出激进价位——一是显示强势（强势者更可能先出价、先发言），二是利用锚定偏见（人们聚焦最先出现的信息、锚定后难以准确调整）设定基准；常见错误是要价过于谨慎、过于保守——多数人要价低于原本可以获得的标准。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证据结论</strong>：分配式谈判中最有效的行动之一是首先出价并给出激进价位——一是显示强势（强势者更可能先出价、先发言），二是利用锚定偏见（人们聚焦最先出现的信息、锚定后难以准确调整）设定基准；常见错误是要价过于谨慎、过于保守——多数人要价低于原本可以获得的标准。"},{"t":"整合式谈判（integrative bargaining）：基于存在一种或多种双赢解决方案这一假设的谈判，必须双方共同合作才能奏效（奢侈品店Jake与设计师多里·钟的例子体现了维护长期关系的整合式承诺）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">整合式谈判</strong>（integrative bargaining）：基于存在一种或多种双赢解决方案这一假设的谈判，必须双方共同合作才能奏效（奢侈品店Jake与设计师多里·钟的例子体现了维护长期关系的整合式承诺）。"},{"t":"两类谈判的对比（图表14-5）：目标——本方获得尽可能多的\"蛋糕\" vs 把\"蛋糕\"做大满足双方利益；动机——零和 vs 双赢；焦点——立场（\"我必须坚持这个立场\"） vs 利益（\"为什么这个问题对你如此重要\"）；利益——针锋相对 vs 存在共同利益；信息共享——低（共享会让对方占优） vs 高（共享可找到满足各自利益的方案）；关系持续时间——短期 vs 长期。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两类谈判的对比</strong>（图表14-5）：目标——本方获得尽可能多的&quot;蛋糕&quot; vs 把&quot;蛋糕&quot;做大满足双方利益；动机——零和 vs 双赢；焦点——立场（&quot;我必须坚持这个立场&quot;） vs 利益（&quot;为什么这个问题对你如此重要&quot;）；利益——针锋相对 vs 存在共同利益；信息共享——低（共享会让对方占优） vs 高（共享可找到满足各自利益的方案）；关系持续时间——短期 vs 长期。"},{"t":"两种策略可在同一次谈判事件中先后使用（图表14-7）：早期用整合式谈判——阐明需求、说明利益、避免过早折中、确保双方利益都得到满足；一旦阐明需求即转入分配式谈判——聚焦利益而非位置、设定目标做大\"蛋糕\"、放下谦让、尽可能使对方获利更少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两种策略可在同一次谈判事件中先后使用</strong>（图表14-7）：早期用整合式谈判——阐明需求、说明利益、避免过早折中、确保双方利益都得到满足；一旦阐明需求即转入分配式谈判——聚焦利益而非位置、设定目标做大&quot;蛋糕&quot;、放下谦让、尽可能使对方获利更少。"},{"t":"总结论：组织内部其他条件相同时整合式谈判更可取——它建立长期合作关系，使双方团结并都感到圆满实现目标；分配式谈判使一方成为失败者，当双方需长期合作时会加深分歧并滋生憎恨（本次\"输\"方若对结果持积极态度，更可能日后合作）；但整合式谈判的成功需要信息公开与坦诚、对另一方需求的敏感性、双方的信任以及保持灵活性的意愿，组织通常无法满足这些条件，故谈判常以零和方式进行；折中是双赢谈判的最大敌人——轻易让步减小了发挥创造力的压力（姐妹分橘子的经典例子：若一方轻易让出橘子，就不会发现一个要果汁、一个要橘皮的双赢方案）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总结论</strong>：组织内部其他条件相同时整合式谈判更可取——它建立长期合作关系，使双方团结并都感到圆满实现目标；分配式谈判使一方成为失败者，当双方需长期合作时会加深分歧并滋生憎恨（本次&quot;输&quot;方若对结果持积极态度，更可能日后合作）；但整合式谈判的成功需要信息公开与坦诚、对另一方需求的敏感性、双方的信任以及保持灵活性的意愿，组织通常无法满足这些条件，故谈判常以零和方式进行；折中是双赢谈判的最大敌人——轻易让步减小了发挥创造力的压力（姐妹分橘子的经典例子：若一方轻易让出橘子，就不会发现一个要果汁、一个要橘皮的双赢方案）。"}],"k":"b","i":1,"h":"14.3.1 谈判策略"},{"t":"传言还是科学——\"在集体主义文化中，团队比个人更擅长谈判\"：研究结论相反——在美国（个人主义）两次实验都是团队表现更好，在中国（集体主义）则是个人表现更好；原因在于集体主义文化尊重和谐的习惯在团队谈判中自我放大，团队通过自我牺牲规避冲突、追求人人满意而非最优结果，而单独谈判时至少能清楚代表自身利益；个人主义文化则相反，个体谈判过于关注自身利益，团队谈判反而能达成对双方有利的方案。","c":[],"k":"b","i":1,"h":"传言还是科学——&quot;在集体主义文化中，团队比个人更擅长谈判&quot;：研究结论相反——在美国（个人主义）两次实验都是团队表现更好，在中国（集体主义）则是个人表现更好；原因在于集体主义文化尊重和谐的习惯在团队谈判中自我放大，团队通过自我牺牲规避冲突、追求人人满意而非最优结果，而单独谈判时至少能清楚代表自身利益；个人主义文化则相反，个体谈判过于关注自身利益，团队谈判反而能达成对双方有利的方案。"}],"k":"sec","i":0,"h":"14.3 谈判"},{"t":"14.4 谈判过程","c":[{"t":"谈判过程五阶段（图表14-8）：准备与计划→确定基本规则→阐述与辩论→讨价还价与问题解决→结束与实施。","c":[{"t":"准备与计划：弄清冲突的实质、卷入者及其观点；把目标写下来、勾出可接受的结果范围（从\"最理想的结果\"到\"可接受的最低限度\"）；评估对方的目标、立场与无形隐含利益，以支持本方立场的材料反驳对方观点；考虑关系随谈判的改变——对招聘谈判过程感觉良好的新员工工作满意度更高、一年后跳槽可能性更小；制定战略并确定BATNA。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">准备与计划</strong>：弄清冲突的实质、卷入者及其观点；把目标写下来、勾出可接受的结果范围（从&quot;最理想的结果&quot;到&quot;可接受的最低限度&quot;）；评估对方的目标、立场与无形隐含利益，以支持本方立场的材料反驳对方观点；考虑关系随谈判的改变——对招聘谈判过程感觉良好的新员工工作满意度更高、一年后跳槽可能性更小；制定战略并确定BATNA。"},{"t":"确定基本规则：与对方共同确定谁进行谈判、在哪里谈、时间多长、限于哪些事项、僵局时是否采用特定程序；双方在此阶段交换最初提案或要求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">确定基本规则</strong>：与对方共同确定谁进行谈判、在哪里谈、时间多长、限于哪些事项、僵局时是否采用特定程序；双方在此阶段交换最初提案或要求。"},{"t":"阐述与辩论：双方对自己的提案进行解释、阐明、澄清、论证和辩论，并提供支持本方立场的材料；这是交换信息的机会，不必是对抗性的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">阐述与辩论</strong>：双方对自己的提案进行解释、阐明、澄清、论证和辩论，并提供支持本方立场的材料；这是交换信息的机会，不必是对抗性的。"},{"t":"讨价还价与问题解决：谈判的实质——为达成协议而相互讨论，双方毫无疑问都需要做出让步。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">讨价还价与问题解决</strong>：谈判的实质——为达成协议而相互讨论，双方毫无疑问都需要做出让步。"},{"t":"结束与实施：协议规范化，并为实施和监控制定必要程序；重要谈判以正式合同敲定细节，多数情况以握手告终。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结束与实施</strong>：协议规范化，并为实施和监控制定必要程序；重要谈判以正式合同敲定细节，多数情况以握手告终。"}],"k":"b","i":1,"h":"<strong class=\"lead\">谈判过程五阶段</strong>（图表14-8）：准备与计划→确定基本规则→阐述与辩论→讨价还价与问题解决→结束与实施。"},{"t":"最低接受方案（best alternative to a negotiated agreement, BATNA）：谈判破裂时本方最好的替代选择，决定了可接受的底线——只要报价高于它就比僵局好；几乎所有情况下，拥有更好替代方案的一方在谈判中占优，因此应在开始互动前完善自己的BATNA；存在一个有趣的例外——对谈判完全无选择者有时会\"孤注一掷\"；同时要仔细考虑对方愿意放弃什么，低估对方让步意愿会影响结果。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">最低接受方案</strong>（best alternative to a negotiated agreement, BATNA）：谈判破裂时本方最好的替代选择，决定了可接受的底线——只要报价高于它就比僵局好；几乎所有情况下，拥有更好替代方案的一方在谈判中占优，因此应在开始互动前完善自己的BATNA；存在一个有趣的例外——对谈判完全无选择者有时会&quot;孤注一掷&quot;；同时要仔细考虑对方愿意放弃什么，低估对方让步意愿会影响结果。"},{"t":"职业目标专栏：就发展性任务而非仅薪水进行谈判——薪资谈判是零和的（要么你拿到钱要么公司留下钱，双方利益直接对立），发展性任务的谈判是整合式的（技能提高的同时增加对公司的贡献，存在共赢）；向主管表达成长意愿并对其创造性的\"个性化交易\"持开放态度，可为未来几年薪资的持续增长奠定基础。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">职业目标专栏</strong>：就发展性任务而非仅薪水进行谈判——薪资谈判是零和的（要么你拿到钱要么公司留下钱，双方利益直接对立），发展性任务的谈判是整合式的（技能提高的同时增加对公司的贡献，存在共赢）；向主管表达成长意愿并对其创造性的&quot;个性化交易&quot;持开放态度，可为未来几年薪资的持续增长奠定基础。"}],"k":"sec","i":0,"h":"14.4 谈判过程"},{"t":"14.5 谈判效果中的个体差异","c":[{"t":"概述：人格、心境/情绪、文化、性别差异四种因素影响个体在谈判中的效果。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">概述</strong>：人格、心境/情绪、文化、性别差异四种因素影响个体在谈判中的效果。"},{"t":"人格与谈判：人格与谈判结果只有微弱相关——随和性与谈判结果的总体关联很弱，因为随和性有两面（乐于合作顺从有碍有利结果，温暖善解人意有帮助，移情有利于整合式谈判），两方面可能相互抵消；最好的谈判者是既争强好胜又善解人意的人；人格的影响还取决于谈判双方人格的相似性而非总体水平——双方随和性都低比一方不随和更有效；谈判类型很重要——随和者在整合式谈判中表现更积极、压力更小（皮质醇更低），高外倾者在分配式谈判中因分享过多信息而吃亏；自我效能感与谈判结果相关——自信者主张更有力、更不放弃立场；智力与谈判结果也只有一定关系；总体结论：即使随和、外向也不会处于明显劣势，人人都能通过学习成为更好的谈判者。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">人格与谈判</strong>：人格与谈判结果只有微弱相关——随和性与谈判结果的总体关联很弱，因为随和性有两面（乐于合作顺从有碍有利结果，温暖善解人意有帮助，移情有利于整合式谈判），两方面可能相互抵消；最好的谈判者是既争强好胜又善解人意的人；人格的影响还取决于谈判双方人格的相似性而非总体水平——双方随和性都低比一方不随和更有效；谈判类型很重要——随和者在整合式谈判中表现更积极、压力更小（皮质醇更低），高外倾者在分配式谈判中因分享过多信息而吃亏；自我效能感与谈判结果相关——自信者主张更有力、更不放弃立场；智力与谈判结果也只有一定关系；总体结论：即使随和、外向也不会处于明显劣势，人人都能通过学习成为更好的谈判者。"},{"t":"心境/情绪与谈判：表现愤怒可能使对方让步（认为愤怒方已无让步可能），但前提是本方权力不小于对方——权力较小时愤怒反而刺激对方强硬；必须真实愤怒（深层表演），\"假装\"愤怒（表层扮演）没有效果；有过发怒经历而非埋下复仇种子的谈判者会使对方让步更多；文化调节愤怒的效果——东亚参与者表现愤怒使对方让步更多；表达失望通常使对方做出更多让步，且不受相对权力影响（实验中平均多得12-14个筹码）；焦虑的谈判者更多使用欺骗手段、对结果期望更低、更容易接受对方条件并更快退出，得到较差结果；情绪表达的不可预测性也会使对方让步更多——不可预测性削弱对方的控制感。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">心境/情绪与谈判</strong>：表现愤怒可能使对方让步（认为愤怒方已无让步可能），但前提是本方权力不小于对方——权力较小时愤怒反而刺激对方强硬；必须真实愤怒（深层表演），&quot;假装&quot;愤怒（表层扮演）没有效果；有过发怒经历而非埋下复仇种子的谈判者会使对方让步更多；文化调节愤怒的效果——东亚参与者表现愤怒使对方让步更多；表达失望通常使对方做出更多让步，且不受相对权力影响（实验中平均多得12-14个筹码）；焦虑的谈判者更多使用欺骗手段、对结果期望更低、更容易接受对方条件并更快退出，得到较差结果；情绪表达的不可预测性也会使对方让步更多——不可预测性削弱对方的控制感。"},{"t":"道德抉择——道德的谈判更需要感同身受：善解人意、移情能力高的人在谈判中较少出现虚假承诺、操纵信息和情绪等不道德行为；指南——试着理解对方的立场及其对结果的情绪反应；注意自己的情绪（不道德策略会增加负罪感，内疚或许预示未来的后悔）；不要过分强调道德而损害自身利益，了解对方动机的同时保持警惕。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">道德抉择——道德的谈判更需要感同身受</strong>：善解人意、移情能力高的人在谈判中较少出现虚假承诺、操纵信息和情绪等不道德行为；指南——试着理解对方的立场及其对结果的情绪反应；注意自己的情绪（不道德策略会增加负罪感，内疚或许预示未来的后悔）；不要过分强调道德而损害自身利益，了解对方动机的同时保持警惕。"},{"t":"文化与谈判：来自同一文化的人谈判比跨文化谈判更有效；跨文化谈判中经验开放性尤其重要，应选择经验开放性高的谈判者并避免时间压力等阻碍相互了解的因素；策略偏好因文化而异——中国和卡塔尔的人比美国人更可能使用竞争性策略；面对对方的愤怒，中国谈判者会增加分配式（强硬）策略，美国谈判者则减少——东亚文化认为利用愤怒获利不合理，对手发怒时拒绝合作。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">文化与谈判</strong>：来自同一文化的人谈判比跨文化谈判更有效；跨文化谈判中经验开放性尤其重要，应选择经验开放性高的谈判者并避免时间压力等阻碍相互了解的因素；策略偏好因文化而异——中国和卡塔尔的人比美国人更可能使用竞争性策略；面对对方的愤怒，中国谈判者会增加分配式（强硬）策略，美国谈判者则减少——东亚文化认为利用愤怒获利不合理，对手发怒时拒绝合作。"},{"t":"性别差异与谈判：男性更重视地位、权力、认可与经济结果，女性更重视同情、利他与关系结果；女性往往不如男性自信、更愿意适应他人——更少发起谈判、发起时要求更少、更易接受对方条件、开出的条件更慷慨（卡内基梅隆MBA研究：接到首次出价后男性57%进行还价，女性仅4%，起薪差异高达4000美元）；但男性获得更好结果的倾向并不覆盖所有情形——代表他人谈判时男女结果更接近（人人更善于为他人辩护）、有经验的谈判者性别差异更小、议题界定清晰时结果更平等；缩小差异的办法：组织文化不无意强化\"男性好胜、女性合作\"的刻板印象，把谈判放在定义明确且与工作相关的条款上以减少模糊地带；女性可利用\"女性魅力\"在短期内获益，但从长远看只有消除性别刻板印象才真正维护其利益；女性对谈判预期的自信较低、对结果更不满意（即使表现与男性旗鼓相当），更少把模糊情况视为谈判机会，不够强硬部分源于担心受到强烈抨击。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">性别差异与谈判</strong>：男性更重视地位、权力、认可与经济结果，女性更重视同情、利他与关系结果；女性往往不如男性自信、更愿意适应他人——更少发起谈判、发起时要求更少、更易接受对方条件、开出的条件更慷慨（卡内基梅隆MBA研究：接到首次出价后男性57%进行还价，女性仅4%，起薪差异高达4000美元）；但男性获得更好结果的倾向并不覆盖所有情形——代表他人谈判时男女结果更接近（人人更善于为他人辩护）、有经验的谈判者性别差异更小、议题界定清晰时结果更平等；缩小差异的办法：组织文化不无意强化&quot;男性好胜、女性合作&quot;的刻板印象，把谈判放在定义明确且与工作相关的条款上以减少模糊地带；女性可利用&quot;女性魅力&quot;在短期内获益，但从长远看只有消除性别刻板印象才真正维护其利益；女性对谈判预期的自信较低、对结果更不满意（即使表现与男性旗鼓相当），更少把模糊情况视为谈判机会，不够强硬部分源于担心受到强烈抨击。"}],"k":"sec","i":0,"h":"14.5 谈判效果中的个体差异"},{"t":"14.6 社会背景下的谈判","c":[{"t":"概述：组织中的许多谈判不设限期、公开且反复进行（谈任务分工、谈出差机会、谈项目经费），必须考虑声誉和关系等社会因素。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">概述</strong>：组织中的许多谈判不设限期、公开且反复进行（谈任务分工、谈出差机会、谈项目经费），必须考虑声誉和关系等社会因素。"},{"t":"14.6.1 声誉","c":[{"t":"声誉（reputation）：别人考虑或谈论你的方式；拥有值得信赖的声誉使整合式谈判策略成为可能，对双方都有利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">声誉</strong>（reputation）：别人考虑或谈论你的方式；拥有值得信赖的声誉使整合式谈判策略成为可能，对双方都有利。"},{"t":"建立信任：最有效的方法是在反复互动中保持诚实，让对方安心提供更开放的报价；可信赖声誉的来源是能力与正直的结合——自信和认知能力强者被认为更有能力、对情况与资源的描述更准确、打破僵局的建议更受信任；以正直著称者被认为会信守承诺并准确提供信息，他人更愿接受其承诺；信誉可靠者朋友与盟友更多、社会资源更多，可能转化为谈判中隐藏的权力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">建立信任</strong>：最有效的方法是在反复互动中保持诚实，让对方安心提供更开放的报价；可信赖声誉的来源是能力与正直的结合——自信和认知能力强者被认为更有能力、对情况与资源的描述更准确、打破僵局的建议更受信任；以正直著称者被认为会信守承诺并准确提供信息，他人更愿接受其承诺；信誉可靠者朋友与盟友更多、社会资源更多，可能转化为谈判中隐藏的权力。"}],"k":"b","i":1,"h":"14.6.1 声誉"},{"t":"14.6.2 关系","c":[{"t":"反复谈判的意义：不仅重视对自己有利的东西，也考虑什么对对方和彼此关系最好；建立在信任基础上的反复谈判拓宽选择范围——今天的帮助或让步可换取未来的回报；促进整合性问题解决——人们随时间以更个人的方式看待谈判伙伴、分享感情联系；信任和依赖使整合式方法更加可行。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反复谈判的意义</strong>：不仅重视对自己有利的东西，也考虑什么对对方和彼此关系最好；建立在信任基础上的反复谈判拓宽选择范围——今天的帮助或让步可换取未来的回报；促进整合性问题解决——人们随时间以更个人的方式看待谈判伙伴、分享感情联系；信任和依赖使整合式方法更加可行。"},{"t":"结论：高效的谈判者考虑的不仅是一次互动的结果；长期来看，一贯表现出有能力、诚实和正直的谈判者通常得到更好的结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：高效的谈判者考虑的不仅是一次互动的结果；长期来看，一贯表现出有能力、诚实和正直的谈判者通常得到更好的结果。"}],"k":"b","i":1,"h":"14.6.2 关系"},{"t":"14.6.3 第三方谈判","c":[{"t":"适用情境：直接谈判陷入僵局、无法自行解决分歧时，寻求第三方帮助。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">适用情境</strong>：直接谈判陷入僵局、无法自行解决分歧时，寻求第三方帮助。"},{"t":"调停人（mediator）：使用推理、说服、提出其他方案等措施帮助双方达成解决方案的中立第三方，在劳资谈判和民事纠纷中广泛使用（EEOC报告调停解决比例达72.1%）；成功的关键在情境——双方必须愿意通过谈判解决冲突；冲突强度中等时调停最有效；调停人必须被双方认为是中立的、非强制的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">调停人</strong>（mediator）：使用推理、说服、提出其他方案等措施帮助双方达成解决方案的中立第三方，在劳资谈判和民事纠纷中广泛使用（EEOC报告调停解决比例达72.1%）；成功的关键在情境——双方必须愿意通过谈判解决冲突；冲突强度中等时调停最有效；调停人必须被双方认为是中立的、非强制的。"},{"t":"仲裁人（arbitrator）：运用自身权威来达成协议的第三方，分自愿（双方主动要求）与强制（法律或合同迫使）两种；相比调停，最大优点是总能达成一项解决方案；副作用取决于仲裁人的强硬程度——若一方感到彻底失败则不会满意，冲突可能再度发生。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">仲裁人</strong>（arbitrator）：运用自身权威来达成协议的第三方，分自愿（双方主动要求）与强制（法律或合同迫使）两种；相比调停，最大优点是总能达成一项解决方案；副作用取决于仲裁人的强硬程度——若一方感到彻底失败则不会满意，冲突可能再度发生。"},{"t":"和解人（conciliator）：受谈判双方信任、在双方之间提供非正式沟通渠道的第三方（电影《教父》中汤姆·黑根一角是著名例子）；与调停的有效性难以比较（二者多处重叠）；实践中和解人通常不只充当沟通渠道，还进行实情调查、解读信息并说服双方达成协议。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">和解人</strong>（conciliator）：受谈判双方信任、在双方之间提供非正式沟通渠道的第三方（电影《教父》中汤姆·黑根一角是著名例子）；与调停的有效性难以比较（二者多处重叠）；实践中和解人通常不只充当沟通渠道，还进行实情调查、解读信息并说服双方达成协议。"}],"k":"b","i":1,"h":"14.6.3 第三方谈判"}],"k":"sec","i":0,"h":"14.6 社会背景下的谈判"}],"k":"chap","h":"第14章 冲突与谈判"}],"k":"part","h":"第Ⅲ篇 群体","col":"#e08a1e","pc":"p3"},{"t":"第Ⅳ篇 组织系统","c":[{"t":"本书定位：《组织行为学》（Organizational Behavior，第18版），斯蒂芬•罗宾斯（Stephen P. Robbins）与蒂莫西•贾奇（Timothy A. Judge）著，孙健敏、朱曦济、李原译；被视为组织行为学教学用书的权威标准，自20世纪90年代引进我国以来深受管理学界与企业界好评。","c":[],"k":"sec","i":0,"h":"<strong class=\"lead\">本书定位</strong>：《组织行为学》（Organizational Behavior，第18版），斯蒂芬•罗宾斯（Stephen P. Robbins）与蒂莫西•贾奇（Timothy A. Judge）著，孙健敏、朱曦济、李原译；被视为组织行为学教学用书的权威标准，自20世纪90年代引进我国以来深受管理学界与企业界好评。"},{"t":"版本节奏：英文版两年一更新，中文版每四年更新一次（选偶数版），兼顾内容连贯性与读者经济负担。","c":[],"k":"sec","i":0,"h":"<strong class=\"lead\">版本节奏</strong>：英文版两年一更新，中文版每四年更新一次（选偶数版），兼顾内容连贯性与读者经济负担。"},{"t":"第18版主要变化（据前言与译者序）：","c":[{"t":"每章引入新的开篇案例，介绍当前商业趋势与前沿事件；章首与章末案例大部分更新，突出组织行为学与当前组织管理的关联。","c":[],"k":"b","i":1,"h":"每章引入新的开篇案例，介绍当前商业趋势与前沿事件；章首与章末案例大部分更新，突出组织行为学与当前组织管理的关联。"},{"t":"每章新增\"就业技能矩阵\"（Employ-ability Skills Matrix, ESM），为学生开发雇主看重的技能提供指南，帮助其从课程一开始就看到课程与职业目标的相关性。","c":[],"k":"b","i":1,"h":"每章新增&quot;就业技能矩阵&quot;（Employ-ability Skills Matrix, ESM），为学生开发雇主看重的技能提供指南，帮助其从课程一开始就看到课程与职业目标的相关性。"},{"t":"每章新增反映最新研究成果的内容，主题包括：外派人员调整、工作丰富化、越轨和反生产工作行为、不同的声音、虐待性监督、客户满意度、执行董事会组成、情绪劳动、氛围、正念、高绩效工作系统、失业/求职、人力资本资源、行为伦理、睡眠不足、义务论、恢复精力、第三方不公平模型、工作需求等。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">每章新增反映最新研究成果的内容，主题包括</strong>：外派人员调整、工作丰富化、越轨和反生产工作行为、不同的声音、虐待性监督、客户满意度、执行董事会组成、情绪劳动、氛围、正念、高绩效工作系统、失业/求职、人力资本资源、行为伦理、睡眠不足、义务论、恢复精力、第三方不公平模型、工作需求等。"},{"t":"具体章节的新增：第1章增加就业内容；第5章新增\"人格、求职和失业\"；第7章新增\"公正理论/组织公平\"与\"工作投入\"两节；第8章新增\"工作再设计\"与\"替代性工作安排方案\"两节；全书增加创建学习型组织、激发创新文化等内容。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">具体章节的新增</strong>：第1章增加就业内容；第5章新增&quot;人格、求职和失业&quot;；第7章新增&quot;公正理论/组织公平&quot;与&quot;工作投入&quot;两节；第8章新增&quot;工作再设计&quot;与&quot;替代性工作安排方案&quot;两节；全书增加创建学习型组织、激发创新文化等内容。"},{"t":"部分章节实质性修改或更新了章末材料；每章参考文献全部更新。","c":[],"k":"b","i":1,"h":"部分章节实质性修改或更新了章末材料；每章参考文献全部更新。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">第18版主要变化</strong>（据前言与译者序）："},{"t":"全书四篇十八章结构：","c":[{"t":"第I篇 简介（第1章）：什么是组织行为学——人际技能、管理与OB、系统研究、贡献学科、OB模型与就业技能。","c":[],"k": ture）：界定对工作任务进行正式划分、组合和协调的方式；结构决策决定关系形式、关系的正规性及许多工作成果，并随组织扩张或收缩、管理潮流的变化而变化。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">组织结构</strong>（organizational structure）：界定对工作任务进行正式划分、组合和协调的方式；结构决策决定关系形式、关系的正规性及许多工作成果，并随组织扩张或收缩、管理潮流的变化而变化。"},{"t":"七个关键要素（图表15-1，每个要素回答一个关键的结构问题）：工作专门化——把活动分解成相互独立的工作岗位时应细化到什么程度；部门化——对工作岗位进行组合的基础是什么；指挥链——员工个体和群体向谁汇报工作；管理幅度——一名管理者可以有效率、有成效地领导多少员工；集权与分权——决策权应该放在哪一级；正规化——规章制度应在多大程度上指导员工和管理者的行为；边界跨越——来自不同区域的人需要定期互动吗。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">七个关键要素</strong>（图表15-1，每个要素回答一个关键的结构问题）：工作专门化——把活动分解成相互独立的工作岗位时应细化到什么程度；部门化——对工作岗位进行组合的基础是什么；指挥链——员工个体和群体向谁汇报工作；管理幅度——一名管理者可以有效率、有成效地领导多少员工；集权与分权——决策权应该放在哪一级；正规化——规章制度应在多大程度上指导员工和管理者的行为；边界跨越——来自不同区域的人需要定期互动吗。"},{"t":"15.1.1 工作专门化","c":[{"t":"工作专门化（work specialization）：又称劳动分工，描述把组织中的工作活动分解成单独的工作岗位的程度，实质是把工作分解成若干步骤、每人只完成其中一步而非全部活动（福特流水线：分配具体、重复的任务，每10秒生产一辆汽车）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工作专门化</strong>（work specialization）：又称劳动分工，描述把组织中的工作活动分解成单独的工作岗位的程度，实质是把工作分解成若干步骤、每人只完成其中一步而非全部活动（福特流水线：分配具体、重复的任务，每10秒生产一辆汽车）。"},{"t":"经济性：最有效利用所有员工的技能、通过重复操作提高技能水平、减少任务转换时间、更容易且更低成本地找到并培训执行特定任务的工人；在高度精细复杂的操作中尤其有效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济性</strong>：最有效利用所有员工的技能、通过重复操作提高技能水平、减少任务转换时间、更容易且更低成本地找到并培训执行特定任务的工人；在高度精细复杂的操作中尤其有效。"},{"t":"不经济性：20世纪60年代起证据表明专门化物极必反——厌烦情绪、疲劳感、压力感、低生产率、低质量、高缺勤率、高离职率等人力不经济因素超过其经济优势；此时通过扩大而非缩小工作活动范围（让员工从事多种活动、完成完整任务、加入技能互补的团队）反而能提高产出与满意度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不经济性</strong>：20世纪60年代起证据表明专门化物极必反——厌烦情绪、疲劳感、压力感、低生产率、低质量、高缺勤率、高离职率等人力不经济因素超过其经济优势；此时通过扩大而非缩小工作活动范围（让员工从事多种活动、完成完整任务、加入技能互补的团队）反而能提高产出与满意度。"},{"t":"当代发展：专门化仍适用于快餐、医疗卫生等可分解为具体任务的行业；微专业化、线上兼职、众包（亚马逊土耳其机器人项目、TopCoder）以及计算机承担专门任务的自动化，使今天的专门化演变为按技术、专业知识和区域审慎分解复杂任务——核心原则不变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">当代发展</strong>：专门化仍适用于快餐、医疗卫生等可分解为具体任务的行业；微专业化、线上兼职、众包（亚马逊土耳其机器人项目、TopCoder）以及计算机承担专门任务的自动化，使今天的专门化演变为按技术、专业知识和区域审慎分解复杂任务——核心原则不变。"}],"k":"b","i":1,"h":"15.1.1 工作专门化"},{"t":"15.1.2 部门化","c":[{"t":"部门化（departmentalization）：对工作岗位进行组合的基础，用于协调相同或相似的工作任务。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">部门化</strong>（departmentalization）：对工作岗位进行组合的基础，用于协调相同或相似的工作任务。"},{"t":"五种常用组合基础：按职能——把同类专业人员集中在相似领域以提高效率（制造厂的工程、会计、制造、人力资源、供应链部门）；按产品或服务——宝洁将每项主要产品交由一位高管全球全权负责，增加高管对绩效的责任；按地域——客户地域分布广且各区域需求类似时采用（丰田改以地理区域为基础管理）；按流程——适用于服务和产品需分步骤的活动（车管所核查、制照、收费三个部门）；按顾客类型——微软曾按个人消费者、大型公司、软件开发商、小型企业划分（2013年重组回职能制以促进持续创新，但随强势领导人更替，结果长期未定）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">五种常用组合基础</strong>：按职能——把同类专业人员集中在相似领域以提高效率（制造厂的工程、会计、制造、人力资源、供应链部门）；按产品或服务——宝洁将每项主要产品交由一位高管全球全权负责，增加高管对绩效的责任；按地域——客户地域分布广且各区域需求类似时采用（丰田改以地理区域为基础管理）；按流程——适用于服务和产品需分步骤的活动（车管所核查、制照、收费三个部门）；按顾客类型——微软曾按个人消费者、大型公司、软件开发商、小型企业划分（2013年重组回职能制以促进持续创新，但随强势领导人更替，结果长期未定）。"},{"t":"结论：最初采用的部门化基础并非永远不变，组织会随战略目标调整而更换。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：最初采用的部门化基础并非永远不变，组织会随战略目标调整而更换。"}],"k":"b","i":1,"h":"15.1.2 部门化"},{"t":"15.1.3 指挥链","c":[{"t":"指挥链（chain of command）：一条从组织最高层贯穿到最基层、明确规定谁向谁汇报工作的不间断职权线。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">指挥链</strong>（chain of command）：一条从组织最高层贯穿到最基层、明确规定谁向谁汇报工作的不间断职权线。"},{"t":"职权（authority）：管理岗位所固有的发布命令并使下属遵从命令的权力；每位管理者为完成职责都被授予一定职权。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">职权</strong>（authority）：管理岗位所固有的发布命令并使下属遵从命令的权力；每位管理者为完成职责都被授予一定职权。"},{"t":"统一指挥（unity of command）：一名下属应该有且只有一位直接上司；违背该原则会使下属忙于应付多位上司相互冲突的要求（员工向多个管理者报告的结构中常见）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">统一指挥</strong>（unity of command）：一名下属应该有且只有一位直接上司；违背该原则会使下属忙于应付多位上司相互冲突的要求（员工向多个管理者报告的结构中常见）。"},{"t":"当代趋势：基层员工几秒钟内即可获得过去只有高层才能得到的信息、决策大量下放、自我管理型团队与跨职能团队流行、多位老板的结构出现，使职权和统一指挥的重要性大幅下降；但仍有不少组织靠强化指挥链使生产率最大化——59%的被调查管理者认可组织中存在\"决策线\"，而低层员工对决策层的依赖会阻碍他们对组织整体战略的认同；在涉及生死攸关、需要果断决策者的行业，指挥链仍有意义。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">当代趋势</strong>：基层员工几秒钟内即可获得过去只有高层才能得到的信息、决策大量下放、自我管理型团队与跨职能团队流行、多位老板的结构出现，使职权和统一指挥的重要性大幅下降；但仍有不少组织靠强化指挥链使生产率最大化——59%的被调查管理者认可组织中存在&quot;决策线&quot;，而低层员工对决策层的依赖会阻碍他们对组织整体战略的认同；在涉及生死攸关、需要果断决策者的行业，指挥链仍有意义。"}],"k":"b","i":1,"h":"15.1.3 指挥链"},{"t":"15.1.4 管理幅度","c":[{"t":"管理幅度（span of control）：一名管理者可以有效率领的直接下属数量，决定组织设置的层级与管理人数；其他条件相同时，幅度越宽、层级越少、每层员工越多，组织越有效率（4100名操作员工：幅度4需6层、约1365名管理者，幅度8只需4层、约585名管理者，按年薪6万美元计每年节省约4800万美元）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理幅度</strong>（span of control）：一名管理者可以有效率领的直接下属数量，决定组织设置的层级与管理人数；其他条件相同时，幅度越宽、层级越少、每层员工越多，组织越有效率（4100名操作员工：幅度4需6层、约1365名管理者，幅度8只需4层、约585名管理者，按年薪6万美元计每年节省约4800万美元）。"},{"t":"幅度上限：宽到一定程度时，管理者没有足够时间提供必要的领导和支持，效率下降、员工绩效受损。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">幅度上限</strong>：宽到一定程度时，管理者没有足够时间提供必要的领导和支持，效率下降、员工绩效受损。"},{"t":"窄幅度的三个缺点：管理层级增多、管理成本大幅增加；垂直沟通更复杂、决策变慢、高层管理者被隔离；监督过严妨碍下属自主性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">窄幅度的三个缺点</strong>：管理层级增多、管理成本大幅增加；垂直沟通更复杂、决策变慢、高层管理者被隔离；监督过严妨碍下属自主性。"},{"t":"趋势与条件：近年趋势是加宽管理幅度，与降低成本、削减管理费用、加快决策、增加灵活性、贴近顾客、给下属授权相一致；公司需显著增加员工培训投资——下属充分了解工作或可求助同事时，管理者才能驾驭宽幅度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">趋势与条件</strong>：近年趋势是加宽管理幅度，与降低成本、削减管理费用、加快决策、增加灵活性、贴近顾客、给下属授权相一致；公司需显著增加员工培训投资——下属充分了解工作或可求助同事时，管理者才能驾驭宽幅度。"}],"k":"b","i":1,"h":"15.1.4 管理幅度"},{"t":"15.1.5 集权与分权","c":[{"t":"集权（centralization）：组织的决策权集中于一点的程度——高层做所有决策，基层只负责执行；分权则把决策权下放给最接近实际行动的管理者或工作群体；该概念只包括正式职权（岗位固有的权力）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">集权</strong>（centralization）：组织的决策权集中于一点的程度——高层做所有决策，基层只负责执行；分权则把决策权下放给最接近实际行动的管理者或工作群体；该概念只包括正式职权（岗位固有的权力）。"},{"t":"对比与结论：分权组织行动更快、更多成员参与决策、与影响自己工作的决策者隔阂更少；集权组织能更好地避免委托错误（如做出糟糕的战略选择），分权组织能更好地避免遗漏错误（如错失重要机会）；下放决策权给基层管理者符合灵活应对变化的努力（宝洁授予小型团队新产品决策权、芬兰研发分散的企业更善于创新），但分权也是双刃剑——多团队系统中可能出现过度寻求风险或协调失败（美国空军研究）；设有海外机构的企业需在分权（符合当地盈利点、客户群与法律法规）与集权化监督之间取得平衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对比与结论</strong>：分权组织行动更快、更多成员参与决策、与影响自己工作的决策者隔阂更少；集权组织能更好地避免委托错误（如做出糟糕的战略选择），分权组织能更好地避免遗漏错误（如错失重要机会）；下放决策权给基层管理者符合灵活应对变化的努力（宝洁授予小型团队新产品决策权、芬兰研发分散的企业更善于创新），但分权也是双刃剑——多团队系统中可能出现过度寻求风险或协调失败（美国空军研究）；设有海外机构的企业需在分权（符合当地盈利点、客户群与法律法规）与集权化监督之间取得平衡。"}],"k":"b","i":1,"h":"15.1.5 集权与分权"},{"t":"15.1.6 正规化","c":[{"t":"正规化（formalization）：组织中工作实现标准化的程度；正规化越高，员工对工作内容、工作时间、工作手段的自主权越小，产出越稳定一致；高度正规化意味着明确的工作说明书、大量规章制度与详尽流程规定，消除了员工考虑其他方案的可能；正规化低则工作不那么程序化、员工处理权限大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">正规化</strong>（formalization）：组织中工作实现标准化的程度；正规化越高，员工对工作内容、工作时间、工作手段的自主权越小，产出越稳定一致；高度正规化意味着明确的工作说明书、大量规章制度与详尽流程规定，消除了员工考虑其他方案的可能；正规化低则工作不那么程序化、员工处理权限大。"},{"t":"差异与边界：正规化程度在组织内部和不同组织间都可差别很大（同一出版公司：销售代表权限大、用语不要求划一，办公室职员和编辑须准时到岗并遵守详尽规章）；对中国94家高科技公司的研究表明，分散的组织结构中正规化会损害团队灵活性——对本质上需要互动或要求灵活创新的任务不起作用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">差异与边界</strong>：正规化程度在组织内部和不同组织间都可差别很大（同一出版公司：销售代表权限大、用语不要求划一，办公室职员和编辑须准时到岗并遵守详尽规章）；对中国94家高科技公司的研究表明，分散的组织结构中正规化会损害团队灵活性——对本质上需要互动或要求灵活创新的任务不起作用。"}],"k":"b","i":1,"h":"15.1.6 正规化"},{"t":"15.1.7 边界跨越","c":[{"t":"边界跨越（boundary spanning）：个人与其正式所处的群组以外的人形成关系，用于克服过强分区意识、防止正式结构僵化；有助于增强组织和团队的创造力、决策能力、知识共享能力和绩效（人力资源主管与IT团队互动、研发实施生产的想法）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">边界跨越</strong>（boundary spanning）：个人与其正式所处的群组以外的人形成关系，用于克服过强分区意识、防止正式结构僵化；有助于增强组织和团队的创造力、决策能力、知识共享能力和绩效（人力资源主管与IT团队互动、研发实施生产的想法）。"},{"t":"组织间与组织内：边界跨越也发生在组织之间，外部边界跨越只有建立在内部边界跨越的基础上才最有效；跨组织的销售人员-买家关系与两组织关系更紧密，但高管与员工的关系更强时更可能带来合作、更好地解决冲突（中国225对制造商-分销商关系研究）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织间与组织内</strong>：边界跨越也发生在组织之间，外部边界跨越只有建立在内部边界跨越的基础上才最有效；跨组织的销售人员-买家关系与两组织关系更紧密，但高管与员工的关系更强时更可能带来合作、更好地解决冲突（中国225对制造商-分销商关系研究）。"},{"t":"促进机制：设置正式联络员角色或跨领域委员会；具有会计、市场营销等多职能经验的员工更可能从事边界跨越；岗位轮换计划为新员工了解组织各领域奠定基础；关注效率与创新等整体目标并共享身份概念。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">促进机制</strong>：设置正式联络员角色或跨领域委员会；具有会计、市场营销等多职能经验的员工更可能从事边界跨越；岗位轮换计划为新员工了解组织各领域奠定基础；关注效率与创新等整体目标并共享身份概念。"}],"k":"b","i":1,"h":"15.1.7 边界跨越"}],"k":"sec","i":0,"h":"15.1 什么是组织结构"},{"t":"15.2 常见的组织框架和结构","c":[{"t":"15.2.1 简单结构","c":[{"t":"简单结构（simple structure）：部门化程度低、管理幅度宽、权力集中在一个人手中、正规化程度低的扁平组织，通常仅2-3个垂直层级；多数公司起步时采用，许多短寿命的创新公司（如手机App开发商）维持小而紧凑的设计，大公司在危急时刻也会短期采用以集中资源应对挑战。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">简单结构</strong>（simple structure）：部门化程度低、管理幅度宽、权力集中在一个人手中、正规化程度低的扁平组织，通常仅2-3个垂直层级；多数公司起步时采用，许多短寿命的创新公司（如手机App开发商）维持小而紧凑的设计，大公司在危急时刻也会短期采用以集中资源应对挑战。"},{"t":"优势：反应敏捷、灵活可变、运营成本低、责任明确。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">优势</strong>：反应敏捷、灵活可变、运营成本低、责任明确。"},{"t":"缺陷：低正规化和高集权导致上层信息负荷过重、难以适应扩展——经营者独揽大权则决策日渐迟缓，常导致小企业毁灭；风险集中于一个人——管理者兼所有者生病一次即可使组织的信息与决策陷入停滞。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">缺陷</strong>：低正规化和高集权导致上层信息负荷过重、难以适应扩展——经营者独揽大权则决策日渐迟缓，常导致小企业毁灭；风险集中于一个人——管理者兼所有者生病一次即可使组织的信息与决策陷入停滞。"}],"k":"b","i":1,"h":"15.2.1 简单结构"},{"t":"15.2.2 官僚结构","c":[{"t":"官僚结构（bureaucracy）：以标准化为关键概念——通过工作专门化获得十分规范的操作任务、非常正规的规章制度、按组分配的任务、集权化、管理幅度窄、决策通过指挥链下达；银行、政府服务部门等依赖标准化工作程序进行协调和控制。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">官僚结构</strong>（bureaucracy）：以标准化为关键概念——通过工作专门化获得十分规范的操作任务、非常正规的规章制度、按组分配的任务、集权化、管理幅度窄、决策通过指挥链下达；银行、政府服务部门等依赖标准化工作程序进行协调和控制。"},{"t":"优势：高效实施标准化活动——同类专业人员配置在同一单元实现规模经济、最大限度减少人员与机器的重复配置、员工共享通用语言；广泛存在的规章制度代替管理者的决策自主权，对中低层管理者要求较低而节约成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">优势</strong>：高效实施标准化活动——同类专业人员配置在同一单元实现规模经济、最大限度减少人员与机器的重复配置、员工共享通用语言；广泛存在的规章制度代替管理者的决策自主权，对中低层管理者要求较低而节约成本。"},{"t":"缺陷：工作专门化导致部门冲突（生产、研发、营销、财会四位主管各自宣称\"公司靠我们才发生什么\"）——职能部门观点有时凌驾于组织整体目标之上；过分拘泥于规则遵从、与规则不完全相符时没有变通余地；只有员工处理熟悉问题且程序化规则已存在时才有效率；创新型员工往往难以适应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">缺陷</strong>：工作专门化导致部门冲突（生产、研发、营销、财会四位主管各自宣称&quot;公司靠我们才发生什么&quot;）——职能部门观点有时凌驾于组织整体目标之上；过分拘泥于规则遵从、与规则不完全相符时没有变通余地；只有员工处理熟悉问题且程序化规则已存在时才有效率；创新型员工往往难以适应。"},{"t":"职能结构（functional structure）：根据员工的专业、角色或任务将相似的员工分为一组（生产、营销、人力、会计部门），很多大型组织使用；优点是专业人士更容易成为专家、有明确的职业发展道路激励，适合专注于一种产品或服务的组织；缺点是层级限制交流方式——交流严格而正式，不同单元之间协调困难，单元内部与之间的内讧降低动机。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">职能结构</strong>（functional structure）：根据员工的专业、角色或任务将相似的员工分为一组（生产、营销、人力、会计部门），很多大型组织使用；优点是专业人士更容易成为专家、有明确的职业发展道路激励，适合专注于一种产品或服务的组织；缺点是层级限制交流方式——交流严格而正式，不同单元之间协调困难，单元内部与之间的内讧降低动机。"},{"t":"部门结构（divisional structure）：根据产品、服务、客户或区域市场将员工分组，高度部门化，具体形态包括产品/服务型（猫粮、狗粮、鸟食单元）、客户型（门诊护理、住院护理、药房单元）、地理型（欧洲、亚洲、南美单元）；优点是通过促进单元间协调实现目标、明确与产品相关所有活动的责任；缺点是功能和成本重复（西班牙和中国的营销团队做基本相同的工作但带来文化视角）；由职能结构转变为部门结构的组织往往表现更好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">部门结构</strong>（divisional structure）：根据产品、服务、客户或区域市场将员工分组，高度部门化，具体形态包括产品/服务型（猫粮、狗粮、鸟食单元）、客户型（门诊护理、住院护理、药房单元）、地理型（欧洲、亚洲、南美单元）；优点是通过促进单元间协调实现目标、明确与产品相关所有活动的责任；缺点是功能和成本重复（西班牙和中国的营销团队做基本相同的工作但带来文化视角）；由职能结构转变为部门结构的组织往往表现更好。"}],"k":"b","i":1,"h":"15.2.2 官僚结构"},{"t":"15.2.3 矩阵结构","c":[{"t":"矩阵结构（matrix structure）：结合职能结构和产品（项目）结构，普遍存在于广告公司、航空公司、研发实验室、建筑公司、医院、政府机关、大学、管理咨询公司及娱乐公司；使用该结构的公司有ABB、波音、宝马、IBM、宝洁。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">矩阵结构</strong>（matrix structure）：结合职能结构和产品（项目）结构，普遍存在于广告公司、航空公司、研发实验室、建筑公司、医院、政府机关、大学、管理咨询公司及娱乐公司；使用该结构的公司有ABB、波音、宝马、IBM、宝洁。"},{"t":"最明显特点：打破统一指挥原则——员工有两个上司（职能部门经理与产品/项目经理），指挥链是双重的（工商管理学员的会计教师同时受本科项目主管与会计系主任领导）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最明显特点</strong>：打破统一指挥原则——员工有两个上司（职能部门经理与产品/项目经理），指挥链是双重的（工商管理学员的会计教师同时受本科项目主管与会计系主任领导）。"},{"t":"优势：当组织具有比较复杂又相互依存的活动时有助于协调；不同类型专业人员通过直接频繁的接触更好地交流、获得更大灵活性、信息迅速到达需要者；双重职权链限制成员以组织整体目标为代价保护本部门利益、减少官僚现象；提供最好资源并确保高效利用，实现专业人员优化配置与规模经济。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">优势</strong>：当组织具有比较复杂又相互依存的活动时有助于协调；不同类型专业人员通过直接频繁的接触更好地交流、获得更大灵活性、信息迅速到达需要者；双重职权链限制成员以组织整体目标为代价保护本部门利益、减少官僚现象；提供最好资源并确保高效利用，实现专业人员优化配置与规模经济。"},{"t":"缺陷：带来混乱、增加争权夺利倾向、给员工带来压力；向多个上司汇报造成角色冲突，模糊不清的期待导致角色模糊；缺乏统一指挥使报告制度模糊性显著增加，常导致职能管理者与产品管理者之间的冲突和权力斗争；渴望安全感、希望减少模糊性的员工压力更大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">缺陷</strong>：带来混乱、增加争权夺利倾向、给员工带来压力；向多个上司汇报造成角色冲突，模糊不清的期待导致角色模糊；缺乏统一指挥使报告制度模糊性显著增加，常导致职能管理者与产品管理者之间的冲突和权力斗争；渴望安全感、希望减少模糊性的员工压力更大。"}],"k":"b","i":1,"h":"15.2.3 矩阵结构"}],"k":"sec","i":0,"h":"15.2 常见的组织框架和结构"},{"t":"15.3 组织设计的一些替代方案","c":[{"t":"背景：扁平化结构趋势下，许多组织开发减少层级、弱化组织边界的新型结构。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">背景</strong>：扁平化结构趋势下，许多组织开发减少层级、弱化组织边界的新型结构。"},{"t":"15.3.1 虚拟结构","c":[{"t":"虚拟结构（virtual organization）：又称网络结构或模块结构——通常核心成员数量很少、大部分业务职能被外包出去（\"如果能租赁，何必要拥有\"）；高度集权、部门化程度很低甚至没有；原型来自电影制片业（从纵向一体化大公司转向为每部电影临时集结个体与小公司）；管理层把主要时间用于协调和控制外部契约关系。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">虚拟结构</strong>（virtual organization）：又称网络结构或模块结构——通常核心成员数量很少、大部分业务职能被外包出去（&quot;如果能租赁，何必要拥有&quot;）；高度集权、部门化程度很低甚至没有；原型来自电影制片业（从纵向一体化大公司转向为每部电影临时集结个体与小公司）；管理层把主要时间用于协调和控制外部契约关系。"},{"t":"网络组织的形式：特许经营——中央节点（管理者、系统与专家）加负责销售和客户服务的特许经营单元，常见于服务行业（7-11、麦当劳、Jimmy John's、Dunkin' Donuts），但加盟商之间不易协作甚至直接竞争资源；星爆形式——母公司把一个职能剥离成新公司（网飞2012年拆分DVD业务为DVD.com）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">网络组织的形式</strong>：特许经营——中央节点（管理者、系统与专家）加负责销售和客户服务的特许经营单元，常见于服务行业（7-11、麦当劳、Jimmy John&#x27;s、Dunkin&#x27; Donuts），但加盟商之间不易协作甚至直接竞争资源；星爆形式——母公司把一个职能剥离成新公司（网飞2012年拆分DVD业务为DVD.com）。"},{"t":"优势：灵活——使有创意但缺乏资金的人能与大公司竞争；通过外包职能省去固定办公室和角色层级的一大笔费用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">优势</strong>：灵活——使有创意但缺乏资金的人能与大公司竞争；通过外包职能省去固定办公室和角色层级的一大笔费用。"},{"t":"缺陷：组织处于持续的变动和重组中，角色、目标和责任都不明确，为政治行为提供了舞台。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">缺陷</strong>：组织处于持续的变动和重组中，角色、目标和责任都不明确，为政治行为提供了舞台。"}],"k":"b","i":1,"h":"15.3.1 虚拟结构"},{"t":"15.3.2 团队结构","c":[{"t":"团队结构（team structure）：寻求消除指挥链、用经授权的团队取代部门；既打破公司与客户、供应商之间的外部障碍，也消除纵向和横向界限。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">团队结构</strong>（team structure）：寻求消除指挥链、用经授权的团队取代部门；既打破公司与客户、供应商之间的外部障碍，也消除纵向和横向界限。"},{"t":"具体手段：取消纵向界限使组织扁平化、尽量减少头衔和级别（跨层级工作团队、决策参与、360度绩效评估）；以跨职能团队取代职能部门、围绕工作流程组织活动（施乐的新产品开发）；打破地理障碍、把地理因素视为战术和后勤问题而非结构问题；成立包含员工、客户或供应商在内的团队（霍尼韦尔的工程师与供应商管理者合作）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">具体手段</strong>：取消纵向界限使组织扁平化、尽量减少头衔和级别（跨层级工作团队、决策参与、360度绩效评估）；以跨职能团队取代职能部门、围绕工作流程组织活动（施乐的新产品开发）；打破地理障碍、把地理因素视为战术和后勤问题而非结构问题；成立包含员工、客户或供应商在内的团队（霍尼韦尔的工程师与供应商管理者合作）。"},{"t":"目标：打破文化障碍并开放机会。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">目标</strong>：打破文化障碍并开放机会。"}],"k":"b","i":1,"h":"15.3.2 团队结构"},{"t":"15.3.3 圆形结构","c":[{"t":"圆形结构（circular structure）：如箭靶的同心环，中心是最高管理层，按职能往外分层辐射（高管→管理者→专家→员工）；层级制度仍然存在，最高管理层是组织核心，其愿景往外逐层扩散。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">圆形结构</strong>（circular structure）：如箭靶的同心环，中心是最高管理层，按职能往外分层辐射（高管→管理者→专家→员工）；层级制度仍然存在，最高管理层是组织核心，其愿景往外逐层扩散。"},{"t":"评价：对有创意的企业家具有直觉吸引力，一些小型创新公司已采用；对企业社会责任的愿景传播也有吸引力；但员工往往不清楚自己应该向谁报告、谁在负责项目。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">评价</strong>：对有创意的企业家具有直觉吸引力，一些小型创新公司已采用；对企业社会责任的愿景传播也有吸引力；但员工往往不清楚自己应该向谁报告、谁在负责项目。"}],"k":"b","i":1,"h":"15.3.3 圆形结构"},{"t":"管理者启示（并入自章末小结）：成长期小企业可先列出每项工作与职责、再基于公司未来需求以能力模型定义角色与激励，使结构有能力随业务一同成长和变化。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">管理者启示</strong>（并入自章末小结）：成长期小企业可先列出每项工作与职责、再基于公司未来需求以能力模型定义角色与激励，使结构有能力随业务一同成长和变化。"}],"k":"sec","i":0,"h":"15.3 组织设计的一些替代方案"},{"t":"15.4 更精干的组织：精简规模","c":[{"t":"精简规模（downsizing）：通过关闭分公司、裁员、出售不盈利的业务单元使组织变得更精干的系统性努力（区别于缩小办公面积——员工人均办公空间从2000年的约300平方英尺持续缩减）；动因包括为生存而收缩（摩托罗拉2012-2013连续裁员）、集中核心竞争力（美国运通多年裁员伴随向在线服务转型）、精简管理方式以减少官僚主义、加快决策（星巴克精简管理后等待时间缩短、质量一致性改善）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">精简规模</strong>（downsizing）：通过关闭分公司、裁员、出售不盈利的业务单元使组织变得更精干的系统性努力（区别于缩小办公面积——员工人均办公空间从2000年的约300平方英尺持续缩减）；动因包括为生存而收缩（摩托罗拉2012-2013连续裁员）、集中核心竞争力（美国运通多年裁员伴随向在线服务转型）、精简管理方式以减少官僚主义、加快决策（星巴克精简管理后等待时间缩短、质量一致性改善）。"},{"t":"对组织绩效的影响存在争议：多数证据表明精简规模对之后一年的股票收益有负面影响（可能取决于裁员目标与其他背景因素），但长期缩小员工队伍规模可能带来积极结果（俄罗斯高尔基汽车厂裁员约半数后首次盈利）；执行还受文化背景制约——安德森在AvtoVAZ的裁员政策招致反弹并被免职，俄罗斯视汽车业为民族自豪感行业、倾向保留岗位。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对组织绩效的影响存在争议</strong>：多数证据表明精简规模对之后一年的股票收益有负面影响（可能取决于裁员目标与其他背景因素），但长期缩小员工队伍规模可能带来积极结果（俄罗斯高尔基汽车厂裁员约半数后首次盈利）；执行还受文化背景制约——安德森在AvtoVAZ的裁员政策招致反弹并被免职，俄罗斯视汽车业为民族自豪感行业、倾向保留岗位。"},{"t":"对员工态度的影响：留下的员工担心未来再次裁员，对组织忠诚度下降、承受更大压力和紧张；可能导致心理退缩、更多主动离职与关键人力资本流失，最终公司\"贫血\"而非精干；与直觉矛盾的是，一些研究表明受害者甚至可能比幸存者过得更好（体验到更强的控制感和更少的压力）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对员工态度的影响</strong>：留下的员工担心未来再次裁员，对组织忠诚度下降、承受更大压力和紧张；可能导致心理退缩、更多主动离职与关键人力资本流失，最终公司&quot;贫血&quot;而非精干；与直觉矛盾的是，一些研究表明受害者甚至可能比幸存者过得更好（体验到更强的控制感和更少的压力）。"},{"t":"减轻消极影响的四项战略：投资——为聚焦核心竞争力而精简的公司若事后采取高投入的工作实践会更有效；沟通——事先与员工充分探讨可减轻担忧、使其感到公司考虑了他们的意见；参与——让员工以某种方式参与过程，可采用自愿提前退休计划或遣散计划避免裁员；援助——提供遣散费、延期医疗福利和再就业援助，表明公司真正关心并尊重员工的贡献。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">减轻消极影响的四项战略</strong>：投资——为聚焦核心竞争力而精简的公司若事后采取高投入的工作实践会更有效；沟通——事先与员工充分探讨可减轻担忧、使其感到公司考虑了他们的意见；参与——让员工以某种方式参与过程，可采用自愿提前退休计划或遣散计划避免裁员；援助——提供遣散费、延期医疗福利和再就业援助，表明公司真正关心并尊重员工的贡献。"},{"t":"结论：精干的公司能提高敏捷性、效率和生产率，但仅当谨慎行事并帮助员工顺利度过精简时期时成立。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">结论</strong>：精干的公司能提高敏捷性、效率和生产率，但仅当谨慎行事并帮助员工顺利度过精简时期时成立。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">15.4 更精干的组织</strong>：精简规模"},{"t":"15.5 为什么组织结构存在差异","c":[{"t":"机械模型（mechanistic model）：与官僚结构同义的极端模型——高度的工作专门化、严格的部门化、指挥链明晰、控制幅度窄、正规化程度高、决策集权化。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">机械模型</strong>（mechanistic model）：与官僚结构同义的极端模型——高度的工作专门化、严格的部门化、指挥链明晰、控制幅度窄、正规化程度高、决策集权化。"},{"t":"有机模型（organic model）：另一极端——结构扁平化、跨职能团队与跨层级工作团队、控制幅度宽、信息自由流动、决策分权化、正规化程度低、鼓励灵活的工作实践。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">有机模型</strong>（organic model）：另一极端——结构扁平化、跨职能团队与跨层级工作团队、控制幅度宽、信息自由流动、决策分权化、正规化程度低、鼓励灵活的工作实践。"},{"t":"15.5.1 组织战略：组织结构是实现组织目标的手段，战略重大调整时结构必须相应改变（组织文化得到结构支持时企业社会责任倡议更可能有明确应用路径）；三个战略维度各有匹配的结构。","c":[{"t":"创新战略（innovation strategy）：致力于实现有意义的、独特的创新（3M、苹果追求创新，玛莎百货不追求）；用有竞争力的薪酬福利吸引人才、鼓励冒险；需要有机结构的灵活性（结构松散、工作专门化程度低、正规化程度低、分权化），完善的沟通渠道、强化长期承诺的政策与清晰的授权通道便于实施迅速顺畅的变革。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">创新战略</strong>（innovation strategy）：致力于实现有意义的、独特的创新（3M、苹果追求创新，玛莎百货不追求）；用有竞争力的薪酬福利吸引人才、鼓励冒险；需要有机结构的灵活性（结构松散、工作专门化程度低、正规化程度低、分权化），完善的沟通渠道、强化长期承诺的政策与清晰的授权通道便于实施迅速顺畅的变革。"},{"t":"成本最小化战略（cost-minimization strategy）：严格成本控制、限制不必要的费用、以低价销售基本产品（沃尔玛）；要求机械结构的效率和稳定性（控制严密、广泛的工作专门化、正规化程度高、高度集权化），通常很少制定培养员工忠诚度的政策。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成本最小化战略</strong>（cost-minimization strategy）：严格成本控制、限制不必要的费用、以低价销售基本产品（沃尔玛）；要求机械结构的效率和稳定性（控制严密、广泛的工作专门化、正规化程度高、高度集权化），通常很少制定培养员工忠诚度的政策。"},{"t":"模仿战略（imitation strategy）：寻求风险最小化、利润最大化的机会，在创新者证明新产品或新市场价值后才大胆进入（惠普、卡特彼勒，模仿成功时尚集团的Moleskine）；是机械结构与有机结构的融合——松紧结合，用机械结构严密控制并降低当前活动成本，同时设立有机结构的工作部门开展新业务。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">模仿战略</strong>（imitation strategy）：寻求风险最小化、利润最大化的机会，在创新者证明新产品或新市场价值后才大胆进入（惠普、卡特彼勒，模仿成功时尚集团的Moleskine）；是机械结构与有机结构的融合——松紧结合，用机械结构严密控制并降低当前活动成本，同时设立有机结构的工作部门开展新业务。"}],"k":"b","i":1,"h":"<strong class=\"lead\">15.5.1 组织战略</strong>：组织结构是实现组织目标的手段，战略重大调整时结构必须相应改变（组织文化得到结构支持时企业社会责任倡议更可能有明确应用路径）；三个战略维度各有匹配的结构。"},{"t":"15.5.2 组织规模：大型组织（雇用人数一般达到或超过2000人）往往工作专门化和部门化程度更高、纵向层级和规章制度更多；规模的影响力随组织扩大而递减——2000人的组织再加500人影响不大，300人的组织再加500人则机械化程度大大增加。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">15.5.2 组织规模</strong>：大型组织（雇用人数一般达到或超过2000人）往往工作专门化和部门化程度更高、纵向层级和规章制度更多；规模的影响力随组织扩大而递减——2000人的组织再加500人影响不大，300人的组织再加500人则机械化程度大大增加。"},{"t":"15.5.3 技术（technology）：描述组织把投入转化为产出的方式；结构需要与本组织采用的技术相互适应（海尔对大规模生产采用流水线流程、辅以更灵活的创新结构）；组织结构和文化还体现在组织使用的数据结构、软件和硬件之中。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">15.5.3 技术</strong>（technology）：描述组织把投入转化为产出的方式；结构需要与本组织采用的技术相互适应（海尔对大规模生产采用流水线流程、辅以更灵活的创新结构）；组织结构和文化还体现在组织使用的数据结构、软件和硬件之中。"},{"t":"15.5.4 环境（environment）：组织外部可能对组织结构造成潜在影响的机构或力量（供应商、客户、竞争者、公众压力群体等）；三个关键维度——容量（环境支持组织成长和发展的程度，富饶环境提供资源缓冲）、易变性（环境的不稳定程度，大量不可预测的变化即动态环境）、复杂性（环境要素的异质性和集中程度，烟草行业简单同质，宽带行业复杂多元）；结论：环境的稀缺性、动态性和复杂性显著时应采用有机结构，丰富性、静态性和简单性显著时可考虑机械结构；不确定性最大的是稀缺+动态+复杂的环境（不可预测性高、犯错机会少、需持续监控的要素多）；百事、西南航空增设社交媒体部即应对动态环境之举。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">15.5.4 环境</strong>（environment）：组织外部可能对组织结构造成潜在影响的机构或力量（供应商、客户、竞争者、公众压力群体等）；三个关键维度——容量（环境支持组织成长和发展的程度，富饶环境提供资源缓冲）、易变性（环境的不稳定程度，大量不可预测的变化即动态环境）、复杂性（环境要素的异质性和集中程度，烟草行业简单同质，宽带行业复杂多元）；结论：环境的稀缺性、动态性和复杂性显著时应采用有机结构，丰富性、静态性和简单性显著时可考虑机械结构；不确定性最大的是稀缺+动态+复杂的环境（不可预测性高、犯错机会少、需持续监控的要素多）；百事、西南航空增设社交媒体部即应对动态环境之举。"},{"t":"15.5.5 习俗（institution）：作为恰当行为准则的文化因素，描述导致多个组织具有类似结构的力量；来源包括监管压力（与政府有合同关系的行业必须有明确汇报关系与严格信息控制）、惯性（一直这样做）、高权力距离文化中的严格权威关系被视为更具合法性、为使投资者觉得不错而复制成功公司的潮流（许多公司复制谷歌式有机结构却不适合自身运营环境）；习俗压力因被视为理所当然而难以看见，但并不意味着不强大。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">15.5.5 习俗</strong>（institution）：作为恰当行为准则的文化因素，描述导致多个组织具有类似结构的力量；来源包括监管压力（与政府有合同关系的行业必须有明确汇报关系与严格信息控制）、惯性（一直这样做）、高权力距离文化中的严格权威关系被视为更具合法性、为使投资者觉得不错而复制成功公司的潮流（许多公司复制谷歌式有机结构却不适合自身运营环境）；习俗压力因被视为理所当然而难以看见，但并不意味着不强大。"}],"k":"sec","i":0,"h":"15.5 为什么组织结构存在差异"},{"t":"15.6 组织设计与员工行为","c":[{"t":"总结论：无法一概而论——并非每个人都喜欢有机结构带来的自由和灵活；在高度正规化的机械组织中，正式规章制度与程序的公平程度（组织公平）是满意度的重要预测指标，在更具个人特色的有机组织中员工更看重人际公平；必须考虑个体差异。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总结论</strong>：无法一概而论——并非每个人都喜欢有机结构带来的自由和灵活；在高度正规化的机械组织中，正式规章制度与程序的公平程度（组织公平）是满意度的重要预测指标，在更具个人特色的有机组织中员工更看重人际公平；必须考虑个体差异。"},{"t":"人员-结构匹配结论：人们并不是随机挑选雇主的——个体被符合自己人格特点的组织吸引、被选中并留下来（偏好可预测性的求职者寻找机械结构组织，喜欢自主性的个体留在有机结构组织）；甄选过程若能促进个人特征与组织特征的匹配，结构对行为的影响会降低；企业应努力建立并维护独特的结构——熟练员工可能因过于突然的变革而离职。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">人员-结构匹配结论</strong>：人们并不是随机挑选雇主的——个体被符合自己人格特点的组织吸引、被选中并留下来（偏好可预测性的求职者寻找机械结构组织，喜欢自主性的个体留在有机结构组织）；甄选过程若能促进个人特征与组织特征的匹配，结构对行为的影响会降低；企业应努力建立并维护独特的结构——熟练员工可能因过于突然的变革而离职。"},{"t":"工作专门化：带来更高的员工生产率，但以降低工作满意度为代价；专门化并非生产率的不竭之源——劳动力受教育程度提高、渴望内在激励，专门化使生产率达到峰值后迅速下降，更好的方式可能是重新安排工作职能和责任；偏爱常规性、重复性的人是例外（高度专门化反而是其满意度来源）；消极后果最可能出现在对个人发展和多元化有强烈需求的个体所从事的专业工作中。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">工作专门化</strong>：带来更高的员工生产率，但以降低工作满意度为代价；专门化并非生产率的不竭之源——劳动力受教育程度提高、渴望内在激励，专门化使生产率达到峰值后迅速下降，更好的方式可能是重新安排工作职能和责任；偏爱常规性、重复性的人是例外（高度专门化反而是其满意度来源）；消极后果最可能出现在对个人发展和多元化有强烈需求的个体所从事的专业工作中。"},{"t":"管理幅度：没有证据支持管理幅度与员工绩效之间的关系；宽幅度提供宽松监管、给员工发挥主动性的机会这一说法直观有吸引力但未获足够研究支持；应结合员工的经验和能力、工作任务的结构化程度等因素（与权变理论一致）；有证据表明大跨度控制可能带来更多不安全行为和事故。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">管理幅度</strong>：没有证据支持管理幅度与员工绩效之间的关系；宽幅度提供宽松监管、给员工发挥主动性的机会这一说法直观有吸引力但未获足够研究支持；应结合员工的经验和能力、工作任务的结构化程度等因素（与权变理论一致）；有证据表明大跨度控制可能带来更多不安全行为和事故。"},{"t":"集权：集权程度较低与工作满意度存在相关证据，部分原因是分权组织自主性更大；但个体差异重要——有人看重自由，有人觉得自主环境极其模糊、令人沮丧。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">集权</strong>：集权程度较低与工作满意度存在相关证据，部分原因是分权组织自主性更大；但个体差异重要——有人看重自由，有人觉得自主环境极其模糊、令人沮丧。"},{"t":"民族文化：民族文化影响对结构的偏好——来自高权力距离国家（希腊、法国、拉丁美洲大部分国家）的员工比低权力距离国家的员工更容易接受机械结构；预测结构对绩效与满意度的影响须同时考虑个体差异与文化差异。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">民族文化</strong>：民族文化影响对结构的偏好——来自高权力距离国家（希腊、法国、拉丁美洲大部分国家）的员工比低权力距离国家的员工更容易接受机械结构；预测结构对绩效与满意度的影响须同时考虑个体差异与文化差异。"},{"t":"职业生涯影响：经历过组织精简规模、身处混合型组织结构中的员工认为自己的职业前景受到不利影响（日、英、美管理者研究）——无论结论是否正确，都表明结构影响员工、必须精心设计。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">职业生涯影响</strong>：经历过组织精简规模、身处混合型组织结构中的员工认为自己的职业前景受到不利影响（日、英、美管理者研究）——无论结论是否正确，都表明结构影响员工、必须精心设计。"},{"t":"远程办公专栏（在家办公一样好）：在家办公的员工每周多工作5-7小时、更快乐且为公司节约成本；但某个工作是否适合在家完成更多取决于工作结构（员工彼此间包括认知上的相互依赖）而非任务本身——独自在家会失去团队合作的优势（雅虎、百思买因此要求员工重返办公室）；能否成功取决于个人、工作本身与组织文化。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">远程办公专栏</strong>（在家办公一样好）：在家办公的员工每周多工作5-7小时、更快乐且为公司节约成本；但某个工作是否适合在家完成更多取决于工作结构（员工彼此间包括认知上的相互依赖）而非任务本身——独自在家会失去团队合作的优势（雅虎、百思买因此要求员工重返办公室）；能否成功取决于个人、工作本身与组织文化。"},{"t":"管理者启示（并入自章末小结）：专门化可提高业务效率，但过度专门化会导致不满并削弱动机；避免设计过度限制员工自主权的严苛层次结构；采用灵活组织设计前要在远程工作的优势和潜在陷阱之间找到平衡；只在必要时精简规模（它对员工有极大负面影响），以实现成本节约并把重点放在核心竞争力上；考虑环境的稀缺性、动态性和复杂性，在设计结构时在有机与机械元素之间找到平衡。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">管理者启示</strong>（并入自章末小结）：专门化可提高业务效率，但过度专门化会导致不满并削弱动机；避免设计过度限制员工自主权的严苛层次结构；采用灵活组织设计前要在远程工作的优势和潜在陷阱之间找到平衡；只在必要时精简规模（它对员工有极大负面影响），以实现成本节约并把重点放在核心竞争力上；考虑环境的稀缺性、动态性和复杂性，在设计结构时在有机与机械元素之间找到平衡。"}],"k":"sec","i":0,"h":"15.6 组织设计与员工行为"}],"k":"chap","h":"第15章 组织结构的基础"},{"t":"第16章 组织文化","c":[{"t":"学习目标","c":[{"t":"描述组织文化的共同特征。","c":[],"k":"b","i":1,"h":"描述组织文化的共同特征。"},{"t":"比较组织文化对员工和组织的积极影响与消极影响。","c":[],"k":"b","i":1,"h":"比较组织文化对员工和组织的积极影响与消极影响。"},{"t":"指出创建和维系组织文化的因素。","c":[],"k":"b","i":1,"h":"指出创建和维系组织文化的因素。"},{"t":"说明如何将组织文化传递给员工。","c":[],"k":"b","i":1,"h":"说明如何将组织文化传递给员工。"},{"t":"描述创建道德文化、积极文化和灵性文化的异同。","c":[],"k":"b","i":1,"h":"描述创建道德文化、积极文化和灵性文化的异同。"},{"t":"说明民族文化如何影响组织文化向另一个国家传播的方式。","c":[],"k":"b","i":1,"h":"说明民族文化如何影响组织文化向另一个国家传播的方式。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"16.1 什么是组织文化","c":[{"t":"定义：组织文化（organizational culture）指组织成员共享的一套能够将本组织与其他组织区分开来的意义体系，包括价值观、信念和假设，它们构成组织的特征。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">定义</strong>：组织文化（organizational culture）指组织成员共享的一套能够将本组织与其他组织区分开来的意义体系，包括价值观、信念和假设，它们构成组织的特征。"},{"t":"六个主要特征（每个都表现为从低到高的连续体）：","c":[{"t":"适应性：员工在多大程度上受到鼓励去创新、保持灵活、承担风险和进行实验。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">适应性</strong>：员工在多大程度上受到鼓励去创新、保持灵活、承担风险和进行实验。"},{"t":"细节导向：员工在多大程度上被期望做事缜密、仔细分析和注意细节。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">细节导向</strong>：员工在多大程度上被期望做事缜密、仔细分析和注意细节。"},{"t":"结果/成果导向：管理层在多大程度上重视结果和效果，而不是实现结果的技术与过程。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果/成果导向</strong>：管理层在多大程度上重视结果和效果，而不是实现结果的技术与过程。"},{"t":"员工/客户导向：管理决策在多大程度上考虑到对组织成员和外部客户的影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">员工/客户导向</strong>：管理决策在多大程度上考虑到对组织成员和外部客户的影响。"},{"t":"合作/团队导向：工作活动在多大程度上围绕团队而不是个体进行组织。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">合作/团队导向</strong>：工作活动在多大程度上围绕团队而不是个体进行组织。"},{"t":"正直：组织成员在多大程度上在工作中表现出正直与高道德标准。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">正直</strong>：组织成员在多大程度上在工作中表现出正直与高道德标准。"}],"k":"b","i":1,"h":"<strong class=\"lead\">六个主要特征</strong>（每个都表现为从低到高的连续体）："},{"t":"图表16-1 对比组织A与组织B：前者规章制度多、严格监督、工作围绕个体、资历决定晋升（\"只要不破不漏，就别动手去修\"）；后者鼓励冒险与变革、监督宽松、工作围绕团队、奖金基于目标实现程度——特征强度不同使两家公司风格迥异。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">图表16-1 对比组织A与组织B</strong>：前者规章制度多、严格监督、工作围绕个体、资历决定晋升（&quot;只要不破不漏，就别动手去修&quot;）；后者鼓励冒险与变革、监督宽松、工作围绕团队、奖金基于目标实现程度——特征强度不同使两家公司风格迥异。"},{"t":"四种文化类型（另一种常见框架，每种各有自己的假设、信念、价值观、工艺和有效性标准）：","c":[{"t":"宗族型文化：以人际关系为基础，员工强调依赖、协作、信任和支持；焦点在内部、重视灵活。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">宗族型文化</strong>：以人际关系为基础，员工强调依赖、协作、信任和支持；焦点在内部、重视灵活。"},{"t":"活力型文化：以变革为基础，员工强调成长、多元化、重视细节、刺激和自主性；焦点在外部、重视灵活。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">活力型文化</strong>：以变革为基础，员工强调成长、多元化、重视细节、刺激和自主性；焦点在外部、重视灵活。"},{"t":"市场型文化：以成就为基础，员工强调沟通、能力和竞争；焦点在外部、重视稳定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">市场型文化</strong>：以成就为基础，员工强调沟通、能力和竞争；焦点在外部、重视稳定。"},{"t":"层级型文化：以稳定为基础，员工强调沟通、正规化和例行公事；焦点在内部、重视稳定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">层级型文化</strong>：以稳定为基础，员工强调沟通、正规化和例行公事；焦点在内部、重视稳定。"},{"t":"综述结论：宗族型文化中的员工满意度和投入度更高；市场型与宗族型更具创新性；层级型的研究尚不足以得出结论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">综述结论</strong>：宗族型文化中的员工满意度和投入度更高；市场型与宗族型更具创新性；层级型的研究尚不足以得出结论。"}],"k":"b","i":1,"h":"<strong class=\"lead\">四种文化类型</strong>（另一种常见框架，每种各有自己的假设、信念、价值观、工艺和有效性标准）："},{"t":"文化是描述性概念：组织文化描述的是员工如何认识组织的特征（它鼓励团队工作吗？奖励创新吗？），而不是他们是否喜欢这些特征；工作满意度则是评价性概念（对要求、薪酬等的感受），可以是正面或负面的——两者有共同特征但不能混用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">文化是描述性概念</strong>：组织文化描述的是员工如何认识组织的特征（它鼓励团队工作吗？奖励创新吗？），而不是他们是否喜欢这些特征；工作满意度则是评价性概念（对要求、薪酬等的感受），可以是正面或负面的——两者有共同特征但不能混用。"},{"t":"组织拥有统一的文化吗：组织文化代表成员的共享认知，只有当不同背景、不同层级的成员用相似词语描述时，有关文化的陈述才有效。","c":[{"t":"主导文化（dominant culture）：体现组织中绝大多数成员所认可和共享的核心价值观（core values），使组织具有独特个性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">主导文化</strong>（dominant culture）：体现组织中绝大多数成员所认可和共享的核心价值观（core values），使组织具有独特个性。"},{"t":"亚文化（subculture）：通常在大型组织内部发展，产生于同一部门或同一地点成员面临的共同问题、情况或经历，既包含主导文化的核心价值观又附加部门特有价值观；有时亚文化强大到微妙地拒斥\"官方\"文化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">亚文化</strong>（subculture）：通常在大型组织内部发展，产生于同一部门或同一地点成员面临的共同问题、情况或经历，既包含主导文化的核心价值观又附加部门特有价值观；有时亚文化强大到微妙地拒斥&quot;官方&quot;文化。"},{"t":"若组织文化只是多种亚文化的组合，主导文化的影响力会大大减弱；共享意义正是文化引导和塑造行为的力量（如 Zappos 对客户服务与效率的重视解释了其员工行为）。","c":[],"k":"b","i":2,"h":"若组织文化只是多种亚文化的组合，主导文化的影响力会大大减弱；共享意义正是文化引导和塑造行为的力量（如 Zappos 对客户服务与效率的重视解释了其员工行为）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">组织拥有统一的文化吗</strong>：组织文化代表成员的共享认知，只有当不同背景、不同层级的成员用相似词语描述时，有关文化的陈述才有效。"},{"t":"强文化与弱文化：员工对组织使命和价值观看法一致为强文化，看法普遍不同为弱文化。","c":[{"t":"强文化（strong culture）中组织的核心价值观得到强烈而广泛的认同；接受者越多、信念越坚定，文化越强、对行为影响越大（如诺德斯特龙员工清楚公司期望并深受其塑造）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">强文化</strong>（strong culture）中组织的核心价值观得到强烈而广泛的认同；接受者越多、信念越坚定，文化越强、对行为影响越大（如诺德斯特龙员工清楚公司期望并深受其塑造）。"},{"t":"强文化带来凝聚力、忠诚、意义和组织承诺；研究表明文化共识和强度较高的组织在净收入、收入和经营现金流方面获益，使命感强、员工参与度高时文化强度与财务成果相关。","c":[],"k":"b","i":2,"h":"强文化带来凝聚力、忠诚、意义和组织承诺；研究表明文化共识和强度较高的组织在净收入、收入和经营现金流方面获益，使命感强、员工参与度高时文化强度与财务成果相关。"}],"k":"b","i":1,"h":"<strong class=\"lead\">强文化与弱文化</strong>：员工对组织使命和价值观看法一致为强文化，看法普遍不同为弱文化。"},{"t":"传言还是科学：「组织文化无法改变」并不正确——改变很难且耗时长，但可以做到，有时甚至关乎存亡：护理机构 Wellspring 的 11 家疗养院通过聚焦协作、教育、责任和赋权发起文化变革，违规操作减少、员工留存率提高、病人状况显著改善；电力巨头 Dynegy 濒临破产时 CEO 弗莱克森放弃高管办公室、培养\"文化冠军\"、禁止会议用手机，人员流动率从 2011 年的 8% 降至 2012 年的 5.8%，公司起死回生（2017 年年收入约 55 亿美元）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">传言还是科学</strong>：「组织文化无法改变」并不正确——改变很难且耗时长，但可以做到，有时甚至关乎存亡：护理机构 Wellspring 的 11 家疗养院通过聚焦协作、教育、责任和赋权发起文化变革，违规操作减少、员工留存率提高、病人状况显著改善；电力巨头 Dynegy 濒临破产时 CEO 弗莱克森放弃高管办公室、培养&quot;文化冠军&quot;、禁止会议用手机，人员流动率从 2011 年的 8% 降至 2012 年的 5.8%，公司起死回生（2017 年年收入约 55 亿美元）。"}],"k":"sec","i":0,"h":"16.1 什么是组织文化"},{"t":"16.2 组织文化的作用","c":[{"t":"文化的功能（五项，文化界定了\"游戏规则\"）：","c":[{"t":"界定边界：使不同组织相互区分。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">界定边界</strong>：使不同组织相互区分。"},{"t":"表达身份感：给成员一种组织身份。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表达身份感</strong>：给成员一种组织身份。"},{"t":"促进更高认同：促使成员认同和致力于比个体自身利益更高层次的事物。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">促进更高认同</strong>：促使成员认同和致力于比个体自身利益更高层次的事物。"},{"t":"增加社会系统稳定性：文化是社会黏合剂，通过提供言行举止的恰当标准把组织凝聚起来。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">增加社会系统稳定性</strong>：文化是社会黏合剂，通过提供言行举止的恰当标准把组织凝聚起来。"},{"t":"意识形态与控制机制：引导和塑造员工的态度和行为（最受关注的功能）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">意识形态与控制机制</strong>：引导和塑造员工的态度和行为（最受关注的功能）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">文化的功能</strong>（五项，文化界定了&quot;游戏规则&quot;）："},{"t":"与组织结构的互动：分权化趋势使文化空前重要，但也使创建强文化更难；以团队组织的员工可能认同团队价值观甚于组织价值观；强大的领导力可通过频繁交流共同目标培养强文化；研究表明文化与领导风格互补而非重合时取得更积极的组织成果——官僚型、层级型文化中的变革型领导者比交易型效率更高。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">与组织结构的互动</strong>：分权化趋势使文化空前重要，但也使创建强文化更难；以团队组织的员工可能认同团队价值观甚于组织价值观；强大的领导力可通过频繁交流共同目标培养强文化；研究表明文化与领导风格互补而非重合时取得更积极的组织成果——官僚型、层级型文化中的变革型领导者比交易型效率更高。"},{"t":"个体-组织匹配：谁获得工作机会、良好绩效评估和晋升都受\"匹配\"影响——求职者或员工的态度和行为是否与组织文化相容（迪士尼挑选能维持其形象的员工并非偶然）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">个体-组织匹配</strong>：谁获得工作机会、良好绩效评估和晋升都受&quot;匹配&quot;影响——求职者或员工的态度和行为是否与组织文化相容（迪士尼挑选能维持其形象的员工并非偶然）。"},{"t":"组织氛围（organizational climate）：组织成员对于其所在组织和工作环境的共同认知，受员工经历的政策、实践和程序引导；当成员对什么是重要事项感受大致相同时，总体态度的影响大于个体态度的简单加总。","c":[{"t":"元分析发现心理氛围与工作满意度、工作投入、组织承诺和动机显著相关；积极的整体氛围带来更高的顾客满意度和组织财务绩效。","c":[],"k":"b","i":2,"h":"元分析发现心理氛围与工作满意度、工作投入、组织承诺和动机显著相关；积极的整体氛围带来更高的顾客满意度和组织财务绩效。"},{"t":"支持与践行的区分：员工从规章、备忘录中\"听到\"领导支持什么，又与实际看到的进行对照——组织氛围是员工所感知到的奖励的函数；当支持与践行的价值观一致时组织承诺更高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">支持与践行的区分</strong>：员工从规章、备忘录中&quot;听到&quot;领导支持什么，又与实际看到的进行对照——组织氛围是员工所感知到的奖励的函数；当支持与践行的价值观一致时组织承诺更高。"},{"t":"氛围维度众多：创新、创造力、沟通、相互支持、参与度、安全、公正、多元化和客户服务等；安全氛围下员工满意度、承诺更高、更倾向安全行为，工伤数量减少；氛围之间相互作用（如赋权氛围与问责氛围并存时组织绩效更高）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">氛围维度众多</strong>：创新、创造力、沟通、相互支持、参与度、安全、公正、多元化和客户服务等；安全氛围下员工满意度、承诺更高、更倾向安全行为，工伤数量减少；氛围之间相互作用（如赋权氛围与问责氛围并存时组织绩效更高）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">组织氛围</strong>（organizational climate）：组织成员对于其所在组织和工作环境的共同认知，受员工经历的政策、实践和程序引导；当成员对什么是重要事项感受大致相同时，总体态度的影响大于个体态度的简单加总。"},{"t":"文化的道德维度：道德文化（ethical culture）随工作场所共有的是非观逐渐发展，反映组织真实的价值观并影响成员的道德决策；道德文化支持明确的道德标准，道德行为被领导塑造，员工能公开讨论道德问题。","c":[{"t":"道德氛围理论确定的九种氛围类型中，五种在组织中最普遍：","c":[{"t":"工具型：管理者假设员工和公司的行为受自我利益驱动；与员工满意度、组织承诺负相关，与离职意向、职场霸凌和偏差行为正相关。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">工具型</strong>：管理者假设员工和公司的行为受自我利益驱动；与员工满意度、组织承诺负相关，与离职意向、职场霸凌和偏差行为正相关。"},{"t":"关怀型：管理者期待决策对尽可能多的利益相关者（员工、客户、供应商）产生积极影响；带来更高的工作满意度。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">关怀型</strong>：管理者期待决策对尽可能多的利益相关者（员工、客户、供应商）产生积极影响；带来更高的工作满意度。"},{"t":"独立型：每个人根据自己的道德观念决定在工作场所中的行为。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">独立型</strong>：每个人根据自己的道德观念决定在工作场所中的行为。"},{"t":"法律法规型：将外部标准化的道德指南作为职业行为准则。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">法律法规型</strong>：将外部标准化的道德指南作为职业行为准则。"},{"t":"规则型：依靠内部标准化预期（如员工手册）规范行为；带来更高的工作满意度。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">规则型</strong>：依靠内部标准化预期（如员工手册）规范行为；带来更高的工作满意度。"}],"k":"b","i":2,"h":"道德氛围理论确定的九种氛围类型中，五种在组织中最普遍："},{"t":"行业差异：强调严格标准的行业（工程、会计、法律）多见规则型或法律法规型氛围；依靠竞争的行业（金融交易）常见工具型；以慈善为业的行业（环保）多有关怀型氛围；不能简单断定工具型不好、关怀型好，各有利弊。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行业差异</strong>：强调严格标准的行业（工程、会计、法律）多见规则型或法律法规型氛围；依靠竞争的行业（金融交易）常见工具型；以慈善为业的行业（环保）多有关怀型氛围；不能简单断定工具型不好、关怀型好，各有利弊。"},{"t":"道德氛围指数（2010 年提出）通过测量组织的道德敏感度、判断、动机和特征的集体水平，帮助了解道德环境的影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">道德氛围指数</strong>（2010 年提出）通过测量组织的道德敏感度、判断、动机和特征的集体水平，帮助了解道德环境的影响。"}],"k":"b","i":1,"h":"<strong class=\"lead\">文化的道德维度</strong>：道德文化（ethical culture）随工作场所共有的是非观逐渐发展，反映组织真实的价值观并影响成员的道德决策；道德文化支持明确的道德标准，道德行为被领导塑造，员工能公开讨论道德问题。"},{"t":"文化与可持续性：可持续性（sustainability）指在很长时间内保持实践，且支持实践的工具或结构不被实践过程破坏；可持续管理起源于环保运动，社会可持续性关注组织行为随时间对社会系统的影响及反方向影响。","c":[{"t":"例：澳大利亚农民致力于提高水利用效率以保障农场长期生存；3M 的污染预防计划以节约资源、创造低环境影响产品为基本原则。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例</strong>：澳大利亚农民致力于提高水利用效率以保障农场长期生存；3M 的污染预防计划以节约资源、创造低环境影响产品为基本原则。"},{"t":"可持续发展与财务绩效存在普遍正相关；创建可持续企业需要发展长期文化并将价值观付诸实践——征求群体反馈比发布阅读材料更能减少能源使用，讨论节能并把价值观构建进文化会引起行为改变。","c":[],"k":"b","i":2,"h":"可持续发展与财务绩效存在普遍正相关；创建可持续企业需要发展长期文化并将价值观付诸实践——征求群体反馈比发布阅读材料更能减少能源使用，讨论节能并把价值观构建进文化会引起行为改变。"}],"k":"b","i":1,"h":"<strong class=\"lead\">文化与可持续性</strong>：可持续性（sustainability）指在很长时间内保持实践，且支持实践的工具或结构不被实践过程破坏；可持续管理起源于环保运动，社会可持续性关注组织行为随时间对社会系统的影响及反方向影响。"},{"t":"文化与创新：最具创新精神的公司通常以开放的、非传统的文化为特点，强调协作、被愿景驱动、不断加快发展步伐。","c":[{"t":"创业公司（如被 Spotify 收购的 Echo Nest）小而灵活、不拘泥传统（专门设立音乐 App\"黑客\"日）；文化相似使 Spotify 收购后仍保持创新水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">创业公司</strong>（如被 Spotify 收购的 Echo Nest）小而灵活、不拘泥传统（专门设立音乐 App&quot;黑客&quot;日）；文化相似使 Spotify 收购后仍保持创新水平。"},{"t":"成熟公司同样能创新：Intuit 用培训班教员工打破常规、强调公开问责；Alexion 靠关怀型文化驱动罕见病药物研发（患者少、成本高、成功率低仍坚持）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成熟公司同样能创新</strong>：Intuit 用培训班教员工打破常规、强调公开问责；Alexion 靠关怀型文化驱动罕见病药物研发（患者少、成本高、成功率低仍坚持）。"},{"t":"研究表明重视自我引导的 CEO 可促进创新性文化，进而促进员工的创新行为。","c":[],"k":"b","i":2,"h":"研究表明重视自我引导的 CEO 可促进创新性文化，进而促进员工的创新行为。"}],"k":"b","i":1,"h":"<strong class=\"lead\">文化与创新</strong>：最具创新精神的公司通常以开放的、非传统的文化为特点，强调协作、被愿景驱动、不断加快发展步伐。"},{"t":"文化作为一种资产：ChildNet 从\"可怕\"的文化经转型成为佛州最出色的机构之一（更换行政人员、认可计划、跨部门圆桌会议）；Dish Network 商业上成功却因\"微管理\"文化被评为最差雇主——说明文化与行业匹配的重要性。","c":[{"t":"凭良好文化成功的公司远多于文化糟糕却成功的公司；没有哪个公司是因为糟糕的组织文化而取得成功的；研究表明文化影响组织绩效的部分原因在于客户满意度（对近 100 家汽车经销商 6 年的研究：积极文化通过提高客户满意度提高销售业绩）。","c":[],"k":"b","i":2,"h":"凭良好文化成功的公司远多于文化糟糕却成功的公司；没有哪个公司是因为糟糕的组织文化而取得成功的；研究表明文化影响组织绩效的部分原因在于客户满意度（对近 100 家汽车经销商 6 年的研究：积极文化通过提高客户满意度提高销售业绩）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">文化作为一种资产</strong>：ChildNet 从&quot;可怕&quot;的文化经转型成为佛州最出色的机构之一（更换行政人员、认可计划、跨部门圆桌会议）；Dish Network 商业上成功却因&quot;微管理&quot;文化被评为最差雇主——说明文化与行业匹配的重要性。"},{"t":"文化作为一种束缚（五个方面，尤其是强文化的阴暗面）：","c":[{"t":"制度化（institutionalization）：当组织的价值来源于自身而非其产出的商品或服务时，组织有了自己的生命；行为习惯变得理所当然，压制创新并把维持文化当作目标本身。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">制度化</strong>（institutionalization）：当组织的价值来源于自身而非其产出的商品或服务时，组织有了自己的生命；行为习惯变得理所当然，压制创新并把维持文化当作目标本身。"},{"t":"变革的障碍：共享价值观与提高组织有效性的要求不一致时，文化成为束缚；环境迅速变化的动态情境中最容易出现——稳定环境中的一致性是资产，动态环境中则束缚手脚。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">变革的障碍</strong>：共享价值观与提高组织有效性的要求不一致时，文化成为束缚；环境迅速变化的动态情境中最容易出现——稳定环境中的一致性是资产，动态环境中则束缚手脚。"},{"t":"多元化的障碍：强文化可能消除新员工带来的多元化优势，容忍并支持偏见或对差异麻木时还会损害多元化政策（社区人口构成是多元化规范的重要设定信号）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">多元化的障碍</strong>：强文化可能消除新员工带来的多元化优势，容忍并支持偏见或对差异麻木时还会损害多元化政策（社区人口构成是多元化规范的重要设定信号）。"},{"t":"毒性与功能失调：围绕消极、功能失调的管理系统同样产生自上而下的有害力量——银行分行研究显示协作型文化（主动、建设性、协作式冲突解决）提高凝聚力和满意度、降低倦怠；支配型文化（鼓励积极对抗竞争）降低凝聚力和客户服务绩效；回避型文化（被动避免冲突）缺乏创造性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">毒性与功能失调</strong>：围绕消极、功能失调的管理系统同样产生自上而下的有害力量——银行分行研究显示协作型文化（主动、建设性、协作式冲突解决）提高凝聚力和满意度、降低倦怠；支配型文化（鼓励积极对抗竞争）降低凝聚力和客户服务绩效；回避型文化（被动避免冲突）缺乏创造性。"},{"t":"兼并和收购的障碍：文化兼容性已成为并购最主要考虑事项——贝恩发现 70% 的合并不能为股东增加价值，合益发现欧洲超过 90% 的合并未实现财务目标；AOL 与时代华纳 1830 亿美元的并购两年内股价暴跌 90%，文化冲突被普遍认为是原因之一。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">兼并和收购的障碍</strong>：文化兼容性已成为并购最主要考虑事项——贝恩发现 70% 的合并不能为股东增加价值，合益发现欧洲超过 90% 的合并未实现财务目标；AOL 与时代华纳 1830 亿美元的并购两年内股价暴跌 90%，文化冲突被普遍认为是原因之一。"}],"k":"b","i":1,"h":"<strong class=\"lead\">文化作为一种束缚</strong>（五个方面，尤其是强文化的阴暗面）："},{"t":"本章小结要点（并入本节）：图表16-6 表明，员工根据组织对冒险的宽容程度、对团队的重视程度、对员工的支持程度等客观因素形成总体的主观认知（感知力），这种认知代表组织的文化或个性，进而影响工作绩效和工作满意度；组织文化越强有力，产生的影响就越大。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章小结要点</strong>（并入本节）：图表16-6 表明，员工根据组织对冒险的宽容程度、对团队的重视程度、对员工的支持程度等客观因素形成总体的主观认知（感知力），这种认知代表组织的文化或个性，进而影响工作绩效和工作满意度；组织文化越强有力，产生的影响就越大。"}],"k":"sec","i":0,"h":"16.2 组织文化的作用"},{"t":"16.3 组织文化的创建与维系","c":[{"t":"组织文化如何开始：组织惯例、传统和做事方式取决于过去的实践及其成功程度——文化的源头是组织的创始人；创始人勾画愿景，新建组织规模小，容易把愿景灌输给所有成员。","c":[{"t":"组织文化形成的三种途径：①创始人仅聘用和留住与自己想法和感受一致的人员；②把自己的思维方式和感受方式灌输给员工并使其社会化；③创始人的行为鼓励员工认同这些信念、价值观和假设，并内化为自己的想法和感受。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织文化形成的三种途径</strong>：①创始人仅聘用和留住与自己想法和感受一致的人员；②把自己的思维方式和感受方式灌输给员工并使其社会化；③创始人的行为鼓励员工认同这些信念、价值观和假设，并内化为自己的想法和感受。"},{"t":"组织成功后，创始人的人格特点根植于文化之中：郑周永之于现代（竞争激烈、纪律严明、高度权威），比尔·盖茨之于微软，坎普拉德之于宜家，凯莱赫之于西南航空，史密斯之于联邦快递，布兰森之于维珍集团。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织成功后，创始人的人格特点根植于文化之中</strong>：郑周永之于现代（竞争激烈、纪律严明、高度权威），比尔·盖茨之于微软，坎普拉德之于宜家，凯莱赫之于西南航空，史密斯之于联邦快递，布兰森之于维珍集团。"}],"k":"b","i":1,"h":"<strong class=\"lead\">组织文化如何开始</strong>：组织惯例、传统和做事方式取决于过去的实践及其成功程度——文化的源头是组织的创始人；创始人勾画愿景，新建组织规模小，容易把愿景灌输给所有成员。"},{"t":"保持组织文化的活力（三个举足轻重的因素）：","c":[{"t":"甄选：目标是识别并雇用有知识、技能和能力的人；当合格求职者不止一位时，决策者对求职者与组织匹配程度的判断决定谁被雇用，使受聘者价值观与组织一致；甄选也是双向选择——求职者发现价值观冲突会自动退出，从而筛选掉可能对核心价值观构成威胁的人（戈尔公司以团队面试确保剔除不能应对不确定性、灵活性和团队工作的求职者）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">甄选</strong>：目标是识别并雇用有知识、技能和能力的人；当合格求职者不止一位时，决策者对求职者与组织匹配程度的判断决定谁被雇用，使受聘者价值观与组织一致；甄选也是双向选择——求职者发现价值观冲突会自动退出，从而筛选掉可能对核心价值观构成威胁的人（戈尔公司以团队面试确保剔除不能应对不确定性、灵活性和团队工作的求职者）。"},{"t":"高层管理者：通过自己的言行举止建立规范并渗透到各个层级——是否鼓励冒险、给下属多大自由度、什么着装得体、什么行为得到奖励；Wegmans 连锁超市高层持守\"愉快忠诚有动力的员工带来优秀服务\"的信念，累计向 3.3 万名员工支付 1.05 亿美元教育奖学金，全职员工年离职率仅 5%（行业平均 27%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">高层管理者</strong>：通过自己的言行举止建立规范并渗透到各个层级——是否鼓励冒险、给下属多大自由度、什么着装得体、什么行为得到奖励；Wegmans 连锁超市高层持守&quot;愉快忠诚有动力的员工带来优秀服务&quot;的信念，累计向 3.3 万名员工支付 1.05 亿美元教育奖学金，全职员工年离职率仅 5%（行业平均 27%）。"},{"t":"社会化（socialization）：无论甄选多好，新员工都需要帮助才能适应组织文化；博思艾伦在新员工上班前即通过内部网和社交 App 开展社会化，清晰频道、脸书、谷歌等采用入职培训、老员工帮扶、社交活动等。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社会化</strong>（socialization）：无论甄选多好，新员工都需要帮助才能适应组织文化；博思艾伦在新员工上班前即通过内部网和社交 App 开展社会化，清晰频道、脸书、谷歌等采用入职培训、老员工帮扶、社交活动等。"}],"k":"b","i":1,"h":"<strong class=\"lead\">保持组织文化的活力</strong>（三个举足轻重的因素）："},{"t":"社会化过程的三阶段（图表16-2，影响新员工的生产率、组织承诺和去留决定）：","c":[{"t":"原有状态阶段（prearrival stage）：个体带来的价值观、态度和期望，包括对工作和组织的态度（商学院的主要目的之一就是使学生具有公司期待的态度与行为；入职前对文化的判断准确性和\"心理契约\"是适应新文化的重要因素）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原有状态阶段</strong>（prearrival stage）：个体带来的价值观、态度和期望，包括对工作和组织的态度（商学院的主要目的之一就是使学生具有公司期待的态度与行为；入职前对文化的判断准确性和&quot;心理契约&quot;是适应新文化的重要因素）。"},{"t":"碰撞阶段（encounter stage）：新员工面对期望与现实不符的情况——对工作、同事、上司及整个组织的期望落空；极端情况下可能彻底失望并辞职；实际工作预览和鼓励建立友谊能降低这种概率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">碰撞阶段</strong>（encounter stage）：新员工面对期望与现实不符的情况——对工作、同事、上司及整个组织的期望落空；极端情况下可能彻底失望并辞职；实际工作预览和鼓励建立友谊能降低这种概率。"},{"t":"调整阶段（metamorphosis stage）：为解决碰撞阶段发现的问题而发生变化；当新员工觉得如鱼得水、已内化组织和群体的规范时，社会化完成；成功的调整提高生产率和组织承诺、降低离职意向。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">调整阶段</strong>（metamorphosis stage）：为解决碰撞阶段发现的问题而发生变化；当新员工觉得如鱼得水、已内化组织和群体的规范时，社会化完成；成功的调整提高生产率和组织承诺、降低离职意向。"}],"k":"b","i":1,"h":"<strong class=\"lead\">社会化过程的三阶段</strong>（图表16-2，影响新员工的生产率、组织承诺和去留决定）："},{"t":"图表16-3 五组社会化方案（系统化 vs. 个性化的具体做法）：","c":[{"t":"正式的 vs. 非正式的：越把新员工与工作环境隔离、区别对待以表明其新角色，越正式（上岗培训）；非正式则直接开展工作、不特别强调社会化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">正式的 vs. 非正式的</strong>：越把新员工与工作环境隔离、区别对待以表明其新角色，越正式（上岗培训）；非正式则直接开展工作、不特别强调社会化。"},{"t":"个体的 vs. 集体的：单独完成社会化（专业办公室）vs. 聚集一起经历共同体验（新兵训练营）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个体的 vs. 集体的</strong>：单独完成社会化（专业办公室）vs. 聚集一起经历共同体验（新兵训练营）。"},{"t":"固定的 vs. 可变的：设定标准化的转变日程（循环培训、试用期，如事务所 8～10 年\"副职\"身份）vs. 不提前给出晋升时间表。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">固定的 vs. 可变的</strong>：设定标准化的转变日程（循环培训、试用期，如事务所 8～10 年&quot;副职&quot;身份）vs. 不提前给出晋升时间表。"},{"t":"成套的 vs. 随机的：用角色榜样培训和鼓励新员工（学徒制、导师制）vs. 角色榜样有意隐蔽、需要自己思考理解。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成套的 vs. 随机的</strong>：用角色榜样培训和鼓励新员工（学徒制、导师制）vs. 角色榜样有意隐蔽、需要自己思考理解。"},{"t":"自由的 vs. 强制的：假设并强化新员工原有特征资质 vs. 设法去掉某些特征（兄弟会\"誓言\"式的塑造）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自由的 vs. 强制的</strong>：假设并强化新员工原有特征资质 vs. 设法去掉某些特征（兄弟会&quot;誓言&quot;式的塑造）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">图表16-3 五组社会化方案</strong>（系统化 vs. 个性化的具体做法）："},{"t":"两类措施的不同结果：越是正规、集体、固定、成套、强制（系统化）的社会化，越会摒弃新员工的差异性、产生标准化可预测的行为（警察、消防等组织常见），并促进个体-组织匹配和高组织承诺；越是非正规、个性化、可变、随机、强调个性，越可能产生独特的角色认识（研发、广告、电影等创造性领域），促进更多角色创新。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">两类措施的不同结果</strong>：越是正规、集体、固定、成套、强制（系统化）的社会化，越会摒弃新员工的差异性、产生标准化可预测的行为（警察、消防等组织常见），并促进个体-组织匹配和高组织承诺；越是非正规、个性化、可变、随机、强调个性，越可能产生独特的角色认识（研发、广告、电影等创造性领域），促进更多角色创新。"},{"t":"社会化中的动态变化：研究记录了新员工的\"新鲜期\"和之后的\"疲乏期\"——最初适应后工作满意度通常会降低；入职几周后主管和同事的社会支持逐渐降低；角色冲突和角色过载随时间增加，角色问题增加最多的员工在组织承诺和满意度上下降最多。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">社会化中的动态变化</strong>：研究记录了新员工的&quot;新鲜期&quot;和之后的&quot;疲乏期&quot;——最初适应后工作满意度通常会降低；入职几周后主管和同事的社会支持逐渐降低；角色冲突和角色过载随时间增加，角色问题增加最多的员工在组织承诺和满意度上下降最多。"},{"t":"小结：组织文化是怎样形成的（图表16-4）：组织创建者的哲学影响甄选标准，甄选标准、社会化与高层管理者的行为共同塑造组织文化，员工再维持和延续这种文化。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">小结</strong>：组织文化是怎样形成的（图表16-4）：组织创建者的哲学影响甄选标准，甄选标准、社会化与高层管理者的行为共同塑造组织文化，员工再维持和延续这种文化。"},{"t":"对管理者的启示（并入本节）：组织文化短期相对稳定，有效变革需要高层参与并制定长期战略；雇用价值观与组织一致的员工（其组织承诺和工作满意度更高，\"不适应\"者离职率最高）；员工的绩效表现和社会化在很大程度上取决于他们是否知道什么该做、什么不该做，要好好培训员工。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（并入本节）：组织文化短期相对稳定，有效变革需要高层参与并制定长期战略；雇用价值观与组织一致的员工（其组织承诺和工作满意度更高，&quot;不适应&quot;者离职率最高）；员工的绩效表现和社会化在很大程度上取决于他们是否知道什么该做、什么不该做，要好好培训员工。"}],"k":"sec","i":0,"h":"16.3 组织文化的创建与维系"},{"t":"16.4 员工怎样学习组织文化","c":[{"t":"组织文化通过多种形式传递给员工，最常用的是故事、仪式、物质象征和语言四种。","c":[],"k":"b","i":1,"h":"组织文化通过多种形式传递给员工，最常用的是故事、仪式、物质象征和语言四种。"},{"t":"故事：许多组织中流传的故事起追根溯源、借古喻今的作用，并为当今实践提供解释和支持——内容通常涉及创始人如何打破规则、从乞丐到富翁的发迹史、员工裁减与重新安置、对错误的纠正和应急事件。","c":[{"t":"例：福特二世以\"福特公司的大楼上写的是我的名字\"警醒自满的管理者；耐克高管讲述创始人鲍尔曼往太太的华夫饼干模具里灌橡胶制鞋（创新精神）和普雷方丹使跑步成为职业运动（对帮助运动员的承诺）；员工也会创建自己的故事来说明社会化中如何适应或不适应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例</strong>：福特二世以&quot;福特公司的大楼上写的是我的名字&quot;警醒自满的管理者；耐克高管讲述创始人鲍尔曼往太太的华夫饼干模具里灌橡胶制鞋（创新精神）和普雷方丹使跑步成为职业运动（对帮助运动员的承诺）；员工也会创建自己的故事来说明社会化中如何适应或不适应。"}],"k":"b","i":1,"h":"<strong class=\"lead\">故事</strong>：许多组织中流传的故事起追根溯源、借古喻今的作用，并为当今实践提供解释和支持——内容通常涉及创始人如何打破规则、从乞丐到富翁的发迹史、员工裁减与重新安置、对错误的纠正和应急事件。"},{"t":"仪式（ritual）：表达并强化组织核心价值观的一组重复性活动，传递什么目标最重要、哪些人至关重要、哪些人无足轻重。","c":[{"t":"例：金普顿酒店以蒙眼铺床、吸尘器竞赛等非传统仪式支持客户导向文化；联合娱乐集团让员工每年经历几次通宵工作以支持激发创造力的文化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例</strong>：金普顿酒店以蒙眼铺床、吸尘器竞赛等非传统仪式支持客户导向文化；联合娱乐集团让员工每年经历几次通宵工作以支持激发创造力的文化。"}],"k":"b","i":1,"h":"<strong class=\"lead\">仪式</strong>（ritual）：表达并强化组织核心价值观的一组重复性活动，传递什么目标最重要、哪些人至关重要、哪些人无足轻重。"},{"t":"物质象征（material symbols，又称象征造物 artifact）：公司总部布局、高管用车、是否有专机、办公室大小、办公家具档次、额外津贴和衣着等；向员工传递谁是重要人物、期望的平等程度以及哪些行为类型（冒险、保守、独裁、参与等）恰当。","c":[{"t":"例：Dynegy 总部很少设独立办公室、以小隔间和公共空间为主，传递开放、平等、创新、灵活的价值观；Threadless 把房车开进仓库开会；特殊福利如谷歌的室外地掷球场、SAS 免费医疗诊所、Genentech 每工作 5 年 7 周带薪假期等也在传递文化价值观。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例</strong>：Dynegy 总部很少设独立办公室、以小隔间和公共空间为主，传递开放、平等、创新、灵活的价值观；Threadless 把房车开进仓库开会；特殊福利如谷歌的室外地掷球场、SAS 免费医疗诊所、Genentech 每工作 5 年 7 周带薪假期等也在传递文化价值观。"}],"k":"b","i":1,"h":"<strong class=\"lead\">物质象征</strong>（material symbols，又称象征造物 artifact）：公司总部布局、高管用车、是否有专机、办公室大小、办公家具档次、额外津贴和衣着等；向员工传递谁是重要人物、期望的平等程度以及哪些行为类型（冒险、保守、独裁、参与等）恰当。"},{"t":"语言：组织及各部门用语言帮助成员识别文化、表明接纳并维系文化——创造特定术语描绘设备、关键人员、供应商、顾客或产品；新员工起初对术语和行话困惑，掌握后成为把特定文化或亚文化成员联系在一起的特征。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">语言</strong>：组织及各部门用语言帮助成员识别文化、表明接纳并维系文化——创造特定术语描绘设备、关键人员、供应商、顾客或产品；新员工起初对术语和行话困惑，掌握后成为把特定文化或亚文化成员联系在一起的特征。"}],"k":"sec","i":0,"h":"16.4 员工怎样学习组织文化"},{"t":"16.5 影响组织文化（创建道德、积极与灵性的文化）","c":[{"t":"组织文化由创始人建立后很难改变，通常随时间有机地发展；本节把文化发展视为由员工完成的持续过程。","c":[],"k":"b","i":1,"h":"组织文化由创始人建立后很难改变，通常随时间有机地发展；本节把文化发展视为由员工完成的持续过程。"},{"t":"发展道德文化（管理者可坚持的五条原则）：","c":[{"t":"做一个清晰可见的角色榜样：员工把高层管理者的行为视为界定恰当行为的标杆；每个人都可以成为对道德氛围产生积极影响的榜样。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">做一个清晰可见的角色榜样</strong>：员工把高层管理者的行为视为界定恰当行为的标杆；每个人都可以成为对道德氛围产生积极影响的榜样。"},{"t":"传达道德期望：在道德规范中指出主要价值观和期望员工遵守的判断准则，使道德方面的模糊性降到最小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传达道德期望</strong>：在道德规范中指出主要价值观和期望员工遵守的判断准则，使道德方面的模糊性降到最小。"},{"t":"提供道德方面的培训：安排研讨会、工作坊等，强化行为标准、澄清组织允许的行为、讨论可能出现的道德困境。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">提供道德方面的培训</strong>：安排研讨会、工作坊等，强化行为标准、澄清组织允许的行为、讨论可能出现的道德困境。"},{"t":"公开奖励道德行为和惩戒不道德行为：评估下属决策是否符合道德规范（既包括手段也包括目标本身），行为道德者受奖励、不道德者受公开惩戒。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公开奖励道德行为和惩戒不道德行为</strong>：评估下属决策是否符合道德规范（既包括手段也包括目标本身），行为道德者受奖励、不道德者受公开惩戒。"},{"t":"提供保护机制：为员工提供针对道德困境进行讨论的正式机制，举报不道德行为时不必担心报复（道德顾问、舞弊行为调查员、道德纠察员等联络者角色）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">提供保护机制</strong>：为员工提供针对道德困境进行讨论的正式机制，举报不道德行为时不必担心报复（道德顾问、舞弊行为调查员、道德纠察员等联络者角色）。"},{"t":"必须从最高管理层开始：高层强调合乎道德的价值观时，中低层管理者更可能表现出道德型领导行为，进而传递给基层员工（更少偏差、更多合作与支持）；研究发现员工从领导者处感受到必须从事不道德行为的压力时会增加不道德意图，而道德领导可通过改善道德文化让员工更自在地说出问题；价值观与部门相似的员工更可能晋升，道德文化由此从基层向更高层级传递。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">必须从最高管理层开始</strong>：高层强调合乎道德的价值观时，中低层管理者更可能表现出道德型领导行为，进而传递给基层员工（更少偏差、更多合作与支持）；研究发现员工从领导者处感受到必须从事不道德行为的压力时会增加不道德意图，而道德领导可通过改善道德文化让员工更自在地说出问题；价值观与部门相似的员工更可能晋升，道德文化由此从基层向更高层级传递。"}],"k":"b","i":1,"h":"<strong class=\"lead\">发展道德文化</strong>（管理者可坚持的五条原则）："},{"t":"发展积极文化：积极的组织文化（positive organizational culture）强调利用员工优势、奖励多于惩罚，并鼓励个人活力和成长。","c":[{"t":"利用员工优势：不忽略问题，但向员工展示如何利用自身优势（德鲁克：大多数人并不知道自己的优势在哪里）；Auglaize Provico 公司 CEO 哈蒙德在裁员 1/4 的危机中依靠发现和利用员工天赋使公司转危为安。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">利用员工优势</strong>：不忽略问题，但向员工展示如何利用自身优势（德鲁克：大多数人并不知道自己的优势在哪里）；Auglaize Provico 公司 CEO 哈蒙德在裁员 1/4 的危机中依靠发现和利用员工天赋使公司转危为安。"},{"t":"奖励多于惩罚：积极文化的一部分是\"发现员工做得对的地方\"；表扬是细微而便宜的奖励，员工通常不会主动要求，管理者往往意识不到不表扬造成的损失（国际纸业波兰分厂经理坚持表扬员工，最终员工反过来表扬她）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">奖励多于惩罚</strong>：积极文化的一部分是&quot;发现员工做得对的地方&quot;；表扬是细微而便宜的奖励，员工通常不会主动要求，管理者往往意识不到不表扬造成的损失（国际纸业波兰分厂经理坚持表扬员工，最终员工反过来表扬她）。"},{"t":"鼓励活力和成长：积极文化能识别工作与事业的差异，支持员工在个人层面和职业层面变得更有效（Safelite AutoGlass 的\"人才优先\"发展计划；Masterfoods 经理把远程员工培养成卢森堡市场专家）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">鼓励活力和成长</strong>：积极文化能识别工作与事业的差异，支持员工在个人层面和职业层面变得更有效（Safelite AutoGlass 的&quot;人才优先&quot;发展计划；Masterfoods 经理把远程员工培养成卢森堡市场专家）。"},{"t":"积极组织文化的局限：理念新颖，其效用条件尚不明确；并非所有民族文化都重视它（英国保险公司 Admiral 的呼叫中心娱乐部与保险行业严肃价值观的冲突）；还要警惕积极文化何时变成强制性的、使不符合模板的人受到指责——组织需保持客观、紧紧围绕组织效力来追求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">积极组织文化的局限</strong>：理念新颖，其效用条件尚不明确；并非所有民族文化都重视它（英国保险公司 Admiral 的呼叫中心娱乐部与保险行业严肃价值观的冲突）；还要警惕积极文化何时变成强制性的、使不符合模板的人受到指责——组织需保持客观、紧紧围绕组织效力来追求。"}],"k":"b","i":1,"h":"<strong class=\"lead\">发展积极文化</strong>：积极的组织文化（positive organizational culture）强调利用员工优势、奖励多于惩罚，并鼓励个人活力和成长。"},{"t":"灵性文化：","c":[{"t":"职场灵性（workplace spirituality）：认为人们的内心生活会支持社会背景下有意义的工作，同时个体的内心生活也受到有意义工作的培养和支持；它不是有计划、有组织的宗教活动，不关于神学和上帝；提倡灵性的组织认为既有思想又有灵魂的人会在工作中寻找意义和目标、希望与他人建立联系并成为团体的一员。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">职场灵性</strong>（workplace spirituality）：认为人们的内心生活会支持社会背景下有意义的工作，同时个体的内心生活也受到有意义工作的培养和支持；它不是有计划、有组织的宗教活动，不关于神学和上帝；提倡灵性的组织认为既有思想又有灵魂的人会在工作中寻找意义和目标、希望与他人建立联系并成为团体的一员。"},{"t":"对灵性的兴趣日益增长的原因（图表16-5）：①缓解变化的生活节奏导致的压力和焦虑，归属与社交需求增加；②正规宗教对很多人不起作用，他们寻求精神支柱填补空虚感；③工作要求使工作场所占据生活主导位置，人们不断质疑工作的意义；④人们渴望把生活价值观与职业生活统一起来；⑤越来越多的人发现追求物质占有无法获得满足。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对灵性的兴趣日益增长的原因</strong>（图表16-5）：①缓解变化的生活节奏导致的压力和焦虑，归属与社交需求增加；②正规宗教对很多人不起作用，他们寻求精神支柱填补空虚感；③工作要求使工作场所占据生活主导位置，人们不断质疑工作的意义；④人们渴望把生活价值观与职业生活统一起来；⑤越来越多的人发现追求物质占有无法获得满足。"},{"t":"灵性组织的四个特点：①仁慈——重视对他人的善意以及员工和其他利益相关者的幸福；②强烈的目的感——围绕有意义的目的塑造文化，利润虽重要但不是首要价值观；③信任与尊重——以相互信任、诚实和开放为特点，每名员工都得到尊重；④思想开放——重视员工灵活思考的能力和创造力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">灵性组织的四个特点</strong>：①仁慈——重视对他人的善意以及员工和其他利益相关者的幸福；②强烈的目的感——围绕有意义的目的塑造文化，利润虽重要但不是首要价值观；③信任与尊重——以相互信任、诚实和开放为特点，每名员工都得到尊重；④思想开放——重视员工灵活思考的能力和创造力。"},{"t":"打造组织灵性：通过有助于工作-生活平衡的措施、领导者展示价值观态度和行为以激发员工的内在动机与价值实现感、鼓励员工思考工作的使命感、团体咨询和组织发展等实践方法；有的公司向员工提供企业牧师咨询服务，但存在争议。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">打造组织灵性</strong>：通过有助于工作-生活平衡的措施、领导者展示价值观态度和行为以激发员工的内在动机与价值实现感、鼓励员工思考工作的使命感、团体咨询和组织发展等实践方法；有的公司向员工提供企业牧师咨询服务，但存在争议。"},{"t":"对灵性的三点批评：①科学基础问题——定义过于宽泛、研究很少，灵性可能只是时髦词语；②合法性问题——世俗机构是否有权给员工强加精神价值观（若把灵性限定为帮助员工找到工作生活的意义，批评力度减弱）；③经济问题——灵性与利润能否兼容（现有证据表明可兼容：引入灵性技巧的公司提高生产率并显著降低离职率，提供灵性开发机会的组织绩效更优，灵性与创造力、满意度、工作投入及组织承诺正相关）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对灵性的三点批评</strong>：①科学基础问题——定义过于宽泛、研究很少，灵性可能只是时髦词语；②合法性问题——世俗机构是否有权给员工强加精神价值观（若把灵性限定为帮助员工找到工作生活的意义，批评力度减弱）；③经济问题——灵性与利润能否兼容（现有证据表明可兼容：引入灵性技巧的公司提高生产率并显著降低离职率，提供灵性开发机会的组织绩效更优，灵性与创造力、满意度、工作投入及组织承诺正相关）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">灵性文化</strong>："}],"k":"sec","i":0,"h":"<strong class=\"lead\">16.5 影响组织文化</strong>（创建道德、积极与灵性的文化）"},{"t":"16.6 全球化层面的意义","c":[{"t":"组织文化的力量强大，常常超越国界，但组织不应也不能忽略当地文化。","c":[],"k":"b","i":1,"h":"组织文化的力量强大，常常超越国界，但组织不应也不能忽略当地文化。"},{"t":"组织文化常常体现民族文化：马来西亚亚航强调开放友好（乘务员举办聚会、可参与管理、没有私人办公室），反映其相对集体主义的文化，与美国航空公司的文化非正式化程度不同；文化差异也不一定源于国家差异——全美航空（\"轻松开放\"）与美国航空（\"严谨保守\"）合并时的最大挑战之一就是文化融合。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">组织文化常常体现民族文化</strong>：马来西亚亚航强调开放友好（乘务员举办聚会、可参与管理、没有私人办公室），反映其相对集体主义的文化，与美国航空公司的文化非正式化程度不同；文化差异也不一定源于国家差异——全美航空（&quot;轻松开放&quot;）与美国航空（&quot;严谨保守&quot;）合并时的最大挑战之一就是文化融合。"},{"t":"保持文化敏感性：美国管理者常被视为傲慢自大；增强敏感性的方式包括压低说话声调、放慢讲话速度、更多倾听、避免谈论宗教和政治。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">保持文化敏感性</strong>：美国管理者常被视为傲慢自大；增强敏感性的方式包括压低说话声调、放慢讲话速度、更多倾听、避免谈论宗教和政治。"},{"t":"道德行为管理中的摩擦：美国管理者把自由市场力量视为道德义务，视贿赂、裙带关系和任人唯亲为极度不道德，并看重利益最大化；发展中国家的管理者更可能从整体社会环境看道德决策——家庭和朋友提供特殊照顾不仅合适，甚至可能是道德责任，并认为员工利益与股东利益同等重要。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">道德行为管理中的摩擦</strong>：美国管理者把自由市场力量视为道德义务，视贿赂、裙带关系和任人唯亲为极度不道德，并看重利益最大化；发展中国家的管理者更可能从整体社会环境看道德决策——家庭和朋友提供特殊照顾不仅合适，甚至可能是道德责任，并认为员工利益与股东利益同等重要。"},{"t":"建立跨国组织文化：瑞典、挪威、芬兰和丹麦银行合并成立北欧联合银行后，历史刻板印象导致按民族主义划分的联盟；该行通过讲故事、新闻稿、公司通信、高层各国代表平等及拥护共同价值观来加强共同身份认同——其成功归因于对民族差异的认真关注。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">建立跨国组织文化</strong>：瑞典、挪威、芬兰和丹麦银行合并成立北欧联合银行后，历史刻板印象导致按民族主义划分的联盟；该行通过讲故事、新闻稿、公司通信、高层各国代表平等及拥护共同价值观来加强共同身份认同——其成功归因于对民族差异的认真关注。"},{"t":"标准化 vs. 量身定制：海外经营时须决定文化各方面是否提供标准化规范（如统一的福利与工作-生活计划）；两者都可能出问题——Rothenberg 把酗酒援助计划引入俄罗斯分公司时遭遇\"援助\"一词的文化抵触（当地人更接受\"支持\"）；各国法律也会介入（巴西雇主可利用政府 HIV 计划、英国 NHS 资助戒烟计划、德国私人保险必须包含健康计划）；尚无最佳行动方针的共识，公司首先应对不同标准保持敏感。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">标准化 vs. 量身定制</strong>：海外经营时须决定文化各方面是否提供标准化规范（如统一的福利与工作-生活计划）；两者都可能出问题——Rothenberg 把酗酒援助计划引入俄罗斯分公司时遭遇&quot;援助&quot;一词的文化抵触（当地人更接受&quot;支持&quot;）；各国法律也会介入（巴西雇主可利用政府 HIV 计划、英国 NHS 资助戒烟计划、德国私人保险必须包含健康计划）；尚无最佳行动方针的共识，公司首先应对不同标准保持敏感。"},{"t":"对管理者的启示（并入本节）：轻易地把公司的组织文化直接\"带到\"其他国家或许行不通；在把新的计划或方案引入国外公司之前，首先要了解组织规范在文化上的关联性。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（并入本节）：轻易地把公司的组织文化直接&quot;带到&quot;其他国家或许行不通；在把新的计划或方案引入国外公司之前，首先要了解组织规范在文化上的关联性。"}],"k":"sec","i":0,"h":"16.6 全球化层面的意义"}],"k":"chap","h":"第16章 组织文化"},{"t":"第17章 人力资源政策与实践","c":[{"t":"学习目标","c":[{"t":"描述招聘方法的价值。","c":[],"k":"b","i":1,"h":"描述招聘方法的价值。"},{"t":"说明初步甄选方法。","c":[],"k":"b","i":1,"h":"说明初步甄选方法。"},{"t":"指出最有效的实质甄选方法。","c":[],"k":"b","i":1,"h":"指出最有效的实质甄选方法。"},{"t":"比较主要的员工培训类型。","c":[],"k":"b","i":1,"h":"比较主要的员工培训类型。"},{"t":"列举绩效评估的方法。","c":[],"k":"b","i":1,"h":"列举绩效评估的方法。"},{"t":"描述人力资源管理者在组织中的领导角色。","c":[],"k":"b","i":1,"h":"描述人力资源管理者在组织中的领导角色。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"17.1 招聘活动","c":[{"t":"招聘与甄选的关系：招聘是任何人力资源项目的首个阶段，甄选紧随其后——甄选制度选出来的人最多只能和招聘得到的申请者水平一样。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">招聘与甄选的关系</strong>：招聘是任何人力资源项目的首个阶段，甄选紧随其后——甄选制度选出来的人最多只能和招聘得到的申请者水平一样。"},{"t":"战略性招聘：招聘活动根据长期战略目标制定，已成为许多公司的基石。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">战略性招聘</strong>：招聘活动根据长期战略目标制定，已成为许多公司的基石。"},{"t":"招聘\"成功\"的定义：最好的招聘系统吸引对工作和组织有深入了解的应聘者——其技能与工作要求更契合，对工作更满意。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">招聘&quot;成功&quot;的定义</strong>：最好的招聘系统吸引对工作和组织有深入了解的应聘者——其技能与工作要求更契合，对工作更满意。"},{"t":"最有效的招聘技术：内部推荐、实习计划等——这些方法能为潜在申请者提供足够的信息，以充分评估自己可能承担的角色。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">最有效的招聘技术</strong>：内部推荐、实习计划等——这些方法能为潜在申请者提供足够的信息，以充分评估自己可能承担的角色。"},{"t":"对招聘人员的要求：越来越多的企业脱离外部招聘机构、依靠本公司高管和人力资源专家搜寻人才；最有效的招聘人员（无论来自内部还是外部）都对工作了若指掌、与潜在新员工沟通效率高、以体贴和尊重的态度对待新人；内部招聘人员采用公平公正的做法很重要，因为公平感与工作机会的接受有关。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对招聘人员的要求</strong>：越来越多的企业脱离外部招聘机构、依靠本公司高管和人力资源专家搜寻人才；最有效的招聘人员（无论来自内部还是外部）都对工作了若指掌、与潜在新员工沟通效率高、以体贴和尊重的态度对待新人；内部招聘人员采用公平公正的做法很重要，因为公平感与工作机会的接受有关。"},{"t":"在线招聘：招聘网站、社交媒体等在线工具使求职者人数呈指数级增长；社交网络促成许多联系；有的组织以游戏形式举办在线编程竞赛来寻找具备优秀技能的申请者，可招募到世界各地的求职者。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">在线招聘</strong>：招聘网站、社交媒体等在线工具使求职者人数呈指数级增长；社交网络促成许多联系；有的组织以游戏形式举办在线编程竞赛来寻找具备优秀技能的申请者，可招募到世界各地的求职者。"}],"k":"sec","i":0,"h":"17.1 招聘活动"},{"t":"17.2 甄选活动","c":[{"t":"甄选的意义：招到合适的人能增加组织的人力资本资源；人力资本资源（human capital resource）指某个组织通过其员工所获得的能力，包括专业技能、集体知识、能力以及通过劳动力可获得的其他资源。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">甄选的意义</strong>：招到合适的人能增加组织的人力资本资源；人力资本资源（human capital resource）指某个组织通过其员工所获得的能力，包括专业技能、集体知识、能力以及通过劳动力可获得的其他资源。"},{"t":"甄选的目标：通过将个体特征（能力、经验等）与工作岗位的要求进行匹配，确定谁是最佳应聘者；匹配不当会使员工的绩效和满意度受到消极影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">甄选的目标</strong>：通过将个体特征（能力、经验等）与工作岗位的要求进行匹配，确定谁是最佳应聘者；匹配不当会使员工的绩效和满意度受到消极影响。"},{"t":"甄选过程模型（图表17-1，三个阶段，每个阶段都可能淘汰求职者）：","c":[{"t":"初步甄选：通过初步的\"粗选\"判断求职者是否满足工作的基本要求（申请表、背景调查等）；不满足基本要求的求职者被淘汰。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">初步甄选</strong>：通过初步的&quot;粗选&quot;判断求职者是否满足工作的基本要求（申请表、背景调查等）；不满足基本要求的求职者被淘汰。"},{"t":"实质甄选：从满足基本要求的求职者中选出最有能力的人（笔试、绩效模拟测验、面试）；满足基本要求但能力不如他人的求职者被淘汰。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实质甄选</strong>：从满足基本要求的求职者中选出最有能力的人（笔试、绩效模拟测验、面试）；满足基本要求但能力不如他人的求职者被淘汰。"},{"t":"条件甄选：在向求职者提供工作之前做最后的核查（药检、体检）；能力最强但条件甄选失败的求职者被淘汰。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">条件甄选</strong>：在向求职者提供工作之前做最后的核查（药检、体检）；能力最强但条件甄选失败的求职者被淘汰。"},{"t":"实践中组织常为节约时间有选择地跳过一些阶段。","c":[],"k":"b","i":2,"h":"实践中组织常为节约时间有选择地跳过一些阶段。"}],"k":"b","i":1,"h":"<strong class=\"lead\">甄选过程模型</strong>（图表17-1，三个阶段，每个阶段都可能淘汰求职者）："},{"t":"初步甄选的工具：","c":[{"t":"申请表：单靠申请表包含的信息并不能有效预测绩效，但它是很好的初步筛选工具（如没相应资质却应聘注册护士的求职者不值得面试）；不可询问种族、性别和民族问题，婚姻状况、抚养人和家庭义务等问题也可能带来法律风险。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">申请表</strong>：单靠申请表包含的信息并不能有效预测绩效，但它是很好的初步筛选工具（如没相应资质却应聘注册护士的求职者不值得面试）；不可询问种族、性别和民族问题，婚姻状况、抚养人和家庭义务等问题也可能带来法律风险。"},{"t":"在线申请与简历：在线申请、电子邮件或视频简历（研究表明少数族裔求职者更青睐视频简历的个性化）；要求附照片并用人脸识别软件核查的做法专家并不建议（除非工作需在高度安全环境中进行）；人力资源部门常用软件预筛海量申请——软件意在筛除不合格者而非甄选优秀者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">在线申请与简历</strong>：在线申请、电子邮件或视频简历（研究表明少数族裔求职者更青睐视频简历的个性化）；要求附照片并用人脸识别软件核查的做法专家并不建议（除非工作需在高度安全环境中进行）；人力资源部门常用软件预筛海量申请——软件意在筛除不合格者而非甄选优秀者。"},{"t":"背景调查：80% 的雇主会在某个阶段进行，想知道求职者过去的表现及前雇主是否推荐；但存在悖论——将近 2/3 的雇主因担心被起诉而拒绝提供详细参考信息，而 30% 的招聘经理经常发现虚假或误导性信息；背景调查软件发送 10 分钟问卷也许能带来更客观的信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景调查</strong>：80% 的雇主会在某个阶段进行，想知道求职者过去的表现及前雇主是否推荐；但存在悖论——将近 2/3 的雇主因担心被起诉而拒绝提供详细参考信息，而 30% 的招聘经理经常发现虚假或误导性信息；背景调查软件发送 10 分钟问卷也许能带来更客观的信息。"},{"t":"推荐信：求职者只会选为自己说好话的人，推荐信上几乎全是正面信息，用处有限——阅读者要么忽略要么在字里行间找隐含信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">推荐信</strong>：求职者只会选为自己说好话的人，推荐信上几乎全是正面信息，用处有限——阅读者要么忽略要么在字里行间找隐含信息。"},{"t":"网络与社交网站搜索：雇主借此确定候选人是否有不良历史；独立评级机构对脸书资料的评估能较准确判断责任心、随和性和聪明才智，但招聘者打分对绩效和离职的预测并不超出传统人格测量，且对白人和女性应聘者存在偏见。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">网络与社交网站搜索</strong>：雇主借此确定候选人是否有不良历史；独立评级机构对脸书资料的评估能较准确判断责任心、随和性和聪明才智，但招聘者打分对绩效和离职的预测并不超出传统人格测量，且对白人和女性应聘者存在偏见。"},{"t":"信用记录检查：任务绩效、组织公民行为、责任心与信用记录正相关；但少数族裔信用分数相对较低、年龄和受教育程度与信用分数正相关——因歧视担忧和侵犯性，雇主须谨慎确定是否有必要。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信用记录检查</strong>：任务绩效、组织公民行为、责任心与信用记录正相关；但少数族裔信用分数相对较低、年龄和受教育程度与信用分数正相关——因歧视担忧和侵犯性，雇主须谨慎确定是否有必要。"},{"t":"犯罪记录调查：约 6500 万（1/4）美国成年人有犯罪记录；美国平等就业机会委员会规定组织不得仅以此拒绝雇用，此类调查结果通常不准确，求职者很少有解释机会；只有当工作与犯罪内容存在关联时使用才合法；有些企业专门雇用背景不合格的求职者、在文化中重视\"第二次机会\"，但这种招聘存在风险、须认真管理。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">犯罪记录调查</strong>：约 6500 万（1/4）美国成年人有犯罪记录；美国平等就业机会委员会规定组织不得仅以此拒绝雇用，此类调查结果通常不准确，求职者很少有解释机会；只有当工作与犯罪内容存在关联时使用才合法；有些企业专门雇用背景不合格的求职者、在文化中重视&quot;第二次机会&quot;，但这种招聘存在风险、须认真管理。"}],"k":"b","i":1,"h":"<strong class=\"lead\">初步甄选的工具</strong>："}],"k":"sec","i":0,"h":"17.2 甄选活动"},{"t":"17.3 实质甄选和条件甄选","c":[{"t":"实质甄选是甄选过程的核心，包括笔试、绩效模拟测验和面试；条件甄选测试通常针对通过实质甄选的求职者。","c":[],"k":"b","i":1,"h":"实质甄选是甄选过程的核心，包括笔试、绩效模拟测验和面试；条件甄选测试通常针对通过实质甄选的求职者。"},{"t":"笔试（三种典型测试）：","c":[{"t":"智力或认知能力测试：对预测技术性、半技术性和非技术性操作工作的绩效有效；对需要复杂认知能力的工作是好预测手段；很多专家认为智力测试是各种工作最好的单个甄选手段，在欧盟国家与美国一样有效；分别测试数学、口语和技术能力可能比仅靠整体认知得分更好地预测工作绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">智力或认知能力测试</strong>：对预测技术性、半技术性和非技术性操作工作的绩效有效；对需要复杂认知能力的工作是好预测手段；很多专家认为智力测试是各种工作最好的单个甄选手段，在欧盟国家与美国一样有效；分别测试数学、口语和技术能力可能比仅靠整体认知得分更好地预测工作绩效。"},{"t":"人格测试：成本低廉、简单易行、使用广泛；但存在作弊担忧（求职者容易声称自己勤劳可靠，或意识不到这些说法是假的）；测试中对造假行为做出警告也许可减少此类行为；他评的人格比自评更能预测工作绩效——雇主可在测试中加入可信赖度信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人格测试</strong>：成本低廉、简单易行、使用广泛；但存在作弊担忧（求职者容易声称自己勤劳可靠，或意识不到这些说法是假的）；测试中对造假行为做出警告也许可减少此类行为；他评的人格比自评更能预测工作绩效——雇主可在测试中加入可信赖度信息。"},{"t":"诚信测试：测量可靠性、细致性、责任感和诚实度等因素；对预测工作绩效以及偷窃、违纪和过多缺勤的潜在可能性有效；但许多现有测试方式无法同样准确预测，管理者须使道德测试要素与工作职责匹配。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">诚信测试</strong>：测量可靠性、细致性、责任感和诚实度等因素；对预测工作绩效以及偷窃、违纪和过多缺勤的潜在可能性有效；但许多现有测试方式无法同样准确预测，管理者须使道德测试要素与工作职责匹配。"}],"k":"b","i":1,"h":"<strong class=\"lead\">笔试</strong>（三种典型测试）："},{"t":"绩效模拟测验：比笔试更复杂、更难实施，但日益盛行——因其比笔试具有更高的表面效度（求职者认为测验是否准确）；预测性的模拟通常有四种来源：","c":[{"t":"工作抽样测验（work sample test）：在部分或全部模拟的工作环境中实地完成各种日常工作任务；每个要素都与某项工作要素匹配，比书面的潜能和人格测验更具体地测量知识、技能和能力；广泛应用于焊接工、机械师、木工、电工等熟练工人的招聘，并越来越多地用于各个层面。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工作抽样测验</strong>（work sample test）：在部分或全部模拟的工作环境中实地完成各种日常工作任务；每个要素都与某项工作要素匹配，比书面的潜能和人格测验更具体地测量知识、技能和能力；广泛应用于焊接工、机械师、木工、电工等熟练工人的招聘，并越来越多地用于各个层面。"},{"t":"评价中心（assessment center）：一套更精细的绩效模拟测验，特别用于评估求职者的管理潜能；由直线管理者、主管、心理学家等评估，求职者用一天甚至几天完成模拟真实问题的作业（如两小时内答复公文筐中的十份备忘录）；能很好地预测绩效，但有效性存在争论（打分可能受求职者是否猜到\"表现良好的特征\"、角色扮演者性格等因素干扰）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">评价中心</strong>（assessment center）：一套更精细的绩效模拟测验，特别用于评估求职者的管理潜能；由直线管理者、主管、心理学家等评估，求职者用一天甚至几天完成模拟真实问题的作业（如两小时内答复公文筐中的十份备忘录）；能很好地预测绩效，但有效性存在争论（打分可能受求职者是否猜到&quot;表现良好的特征&quot;、角色扮演者性格等因素干扰）。"},{"t":"情境判断测验（situational judgment test）：向求职者询问在各种工作情境中将如何表现，再与高绩效员工的答案比较；可降低工作模拟的成本，但求职者可通过训练提高分数；评价中心比情境判断测验更能预测工作绩效（差别不大）；对某些组织来说，低成本的情境判断测验也许是更好选择。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情境判断测验</strong>（situational judgment test）：向求职者询问在各种工作情境中将如何表现，再与高绩效员工的答案比较；可降低工作模拟的成本，但求职者可通过训练提高分数；评价中心比情境判断测验更能预测工作绩效（差别不大）；对某些组织来说，低成本的情境判断测验也许是更好选择。"},{"t":"工作预演（realistic job preview）：把工作抽样测验方法用于甄选测试之外（如实际工作绩效的评估）；还能降低员工流失率，因为雇主和员工事先都知道将要面对什么；但无薪的长时间\"预演\"可能被视为利用免费劳动，候选人中途退出会使 HR 失去合格人选——应在早期甄选中努力使候选人对组织产生参与感。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工作预演</strong>（realistic job preview）：把工作抽样测验方法用于甄选测试之外（如实际工作绩效的评估）；还能降低员工流失率，因为雇主和员工事先都知道将要面对什么；但无薪的长时间&quot;预演&quot;可能被视为利用免费劳动，候选人中途退出会使 HR 失去合格人选——应在早期甄选中努力使候选人对组织产生参与感。"}],"k":"b","i":1,"h":"<strong class=\"lead\">绩效模拟测验</strong>：比笔试更复杂、更难实施，但日益盛行——因其比笔试具有更高的表面效度（求职者认为测验是否准确）；预测性的模拟通常有四种来源："},{"t":"面试：对世界范围内的组织来说是最标准的甄选做法，对录用决策的影响相当大甚至超出正常范围。","c":[{"t":"面试的问题：印象管理技巧（如自我推销）对面试官的喜好有强烈影响，即使所展示的特质与工作无关；表现不佳（甚至只是面部有个瑕疵）可能导致被立即淘汰。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">面试的问题</strong>：印象管理技巧（如自我推销）对面试官的喜好有强烈影响，即使所展示的特质与工作无关；表现不佳（甚至只是面部有个瑕疵）可能导致被立即淘汰。"},{"t":"非结构化面试（unstructured interview）：简短、随意、由随机问题组成，不是有效的甄选工具；容易跑题，收集的信息通常存在偏差，只与未来工作绩效中度相关；面试官往往青睐观点与自己相似的求职者、过多注意消极信息，并受求职者面试先后顺序的影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">非结构化面试</strong>（unstructured interview）：简短、随意、由随机问题组成，不是有效的甄选工具；容易跑题，收集的信息通常存在偏差，只与未来工作绩效中度相关；面试官往往青睐观点与自己相似的求职者、过多注意消极信息，并受求职者面试先后顺序的影响。"},{"t":"结构化面试（structured interview）：专门设计用于收集工作相关信息的有计划面试；极大地限制主观性、提供更可靠的答复（Continuum CEO 韦斯特对所有候选人问同样的四个问题）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结构化面试</strong>（structured interview）：专门设计用于收集工作相关信息的有计划面试；极大地限制主观性、提供更可靠的答复（Continuum CEO 韦斯特对所有候选人问同样的四个问题）。"},{"t":"提高面试有效性的措施：使用标准化问题、同一种信息记录方法和同一套评估标准；培训面试官专注于与工作绩效相关的维度、将评估程序化并给予反馈；采用行为结构化面试——要求求职者具体描述如何解决先前工作中的具体问题（其假设是过去的行为是预测未来行为的最佳指标）；专家组面试（panel interview）——多名专家组成员共同面试，可使个体偏见的影响最小化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">提高面试有效性的措施</strong>：使用标准化问题、同一种信息记录方法和同一套评估标准；培训面试官专注于与工作绩效相关的维度、将评估程序化并给予反馈；采用行为结构化面试——要求求职者具体描述如何解决先前工作中的具体问题（其假设是过去的行为是预测未来行为的最佳指标）；专家组面试（panel interview）——多名专家组成员共同面试，可使个体偏见的影响最小化。"},{"t":"面试的双重功能：除评估与工作相关的技能外，面试还考察人格特点和个人价值观以寻找与组织文化匹配的求职者；一些公司还把面试当作招聘工具向求职者\"推销\"工作，但研究表明这类面试官在识别人格特征和甄选方面比只注重资质的面试官差得多。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">面试的双重功能</strong>：除评估与工作相关的技能外，面试还考察人格特点和个人价值观以寻找与组织文化匹配的求职者；一些公司还把面试当作招聘工具向求职者&quot;推销&quot;工作，但研究表明这类面试官在识别人格特征和甄选方面比只注重资质的面试官差得多。"}],"k":"b","i":1,"h":"<strong class=\"lead\">面试</strong>：对世界范围内的组织来说是最标准的甄选做法，对录用决策的影响相当大甚至超出正常范围。"},{"t":"条件甄选（两种常见检查）：","c":[{"t":"药检：很多求职者认为没有合理猜疑就药检不公平、侵犯隐私；雇主则认为使用和滥用毒品代价极大（经济与安全）；在美国，最高法院认定药检是\"侵犯程度最小\"的甄选程序，并不侵犯个人权利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">药检</strong>：很多求职者认为没有合理猜疑就药检不公平、侵犯隐私；雇主则认为使用和滥用毒品代价极大（经济与安全）；在美国，最高法院认定药检是&quot;侵犯程度最小&quot;的甄选程序，并不侵犯个人权利。"},{"t":"体检：根据《美国残疾人法案》，公司不能在录用之前要求体检；但可在提供有条件的录用通知之后进行，以判断求职者身体和精神上是否符合工作要求，并确定能否以及如何使工作环境适合残疾员工；对空中交通管制员、消防员等体力或心理素质要求高的工作，体检是预测工作能力的重要指标。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">体检</strong>：根据《美国残疾人法案》，公司不能在录用之前要求体检；但可在提供有条件的录用通知之后进行，以判断求职者身体和精神上是否符合工作要求，并确定能否以及如何使工作环境适合残疾员工；对空中交通管制员、消防员等体力或心理素质要求高的工作，体检是预测工作能力的重要指标。"}],"k":"b","i":1,"h":"<strong class=\"lead\">条件甄选</strong>（两种常见检查）："}],"k":"sec","i":0,"h":"17.3 实质甄选和条件甄选"},{"t":"17.4 培训与开发方案","c":[{"t":"培训的必要性：员工的技能会老化或过时，需要学习新技能——美国公司每年花费超过 700 亿美元、世界各地的组织每年花费 1300 亿美元用于培训。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">培训的必要性</strong>：员工的技能会老化或过时，需要学习新技能——美国公司每年花费超过 700 亿美元、世界各地的组织每年花费 1300 亿美元用于培训。"},{"t":"培训的类型（四种技能范畴＋两种专题培训）：","c":[{"t":"基础技能培训：40% 的雇主认为高中毕业生缺乏阅读理解、写作和数学基本技能，雇主要求的技能与劳动力现有技能出现差距（全球性问题）；史密斯和威森公司开展基本技能课程后 70% 的参加者达到所要求水平，沟通能力和自信心显著增强。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">基础技能培训</strong>：40% 的雇主认为高中毕业生缺乏阅读理解、写作和数学基本技能，雇主要求的技能与劳动力现有技能出现差距（全球性问题）；史密斯和威森公司开展基本技能课程后 70% 的参加者达到所要求水平，沟通能力和自信心显著增强。"},{"t":"技术技能培训：直接指向更新和提高技术技能；重要性上升源于新技术和新的组织结构设计（扁平化、工作团队、部门障碍消除使员工承担更多任务）；印度企业对熟练工人需求增长，塔塔、威普罗等为新员工提供 3 个月培训，并与工程学院建立伙伴关系。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">技术技能培训</strong>：直接指向更新和提高技术技能；重要性上升源于新技术和新的组织结构设计（扁平化、工作团队、部门障碍消除使员工承担更多任务）；印度企业对熟练工人需求增长，塔塔、威普罗等为新员工提供 3 个月培训，并与工程学院建立伙伴关系。"},{"t":"问题解决技能培训：包括提高逻辑推理能力、界定问题的能力、因果判断能力、找到和分析备选方案的能力以及挑选解决方案的能力；是推行自我管理型团队或质量管理计划的组织的基本工作。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题解决技能培训</strong>：包括提高逻辑推理能力、界定问题的能力、因果判断能力、找到和分析备选方案的能力以及挑选解决方案的能力；是推行自我管理型团队或质量管理计划的组织的基本工作。"},{"t":"人际技能培训：提高倾听、沟通和团队建设技能；有证据表明这种方式学到的技能难以应用到职场，但取决于技能类型——专为改善医院团队人际互动设计的培训改善了患者的治疗效果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人际技能培训</strong>：提高倾听、沟通和团队建设技能；有证据表明这种方式学到的技能难以应用到职场，但取决于技能类型——专为改善医院团队人际互动设计的培训改善了患者的治疗效果。"},{"t":"文明培训：针对不文明、恃强凌弱、滥用职权的行为（被忽视、因他人过错受指责、在他人面前名誉受损、被贬低蔑视等）；这些负面行为降低满意度和绩效、加深不公平感、加剧抑郁、导致心理退缩；干预训练可提升文明程度、尊重感、工作满意度和信任水平，减少不文明行为、冷嘲热讽和缺勤。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文明培训</strong>：针对不文明、恃强凌弱、滥用职权的行为（被忽视、因他人过错受指责、在他人面前名誉受损、被贬低蔑视等）；这些负面行为降低满意度和绩效、加深不公平感、加剧抑郁、导致心理退缩；干预训练可提升文明程度、尊重感、工作满意度和信任水平，减少不文明行为、冷嘲热讽和缺勤。"},{"t":"道德培训：常见于上岗培训、员工开发或道德准则的定期强化；存在争议——批评者认为价值观在人生早期通过实例和榜样习得、雇用时已定型，道德培训没有显著的长期影响；支持者认为价值观可以学习和改变，即使价值观不变，道德培训也能帮助员工认识和了解道德困境、重申组织期望；研究显示更了解组织道德规范并参加更多道德培训的员工满意度更高、认为组织社会责任感更强。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">道德培训</strong>：常见于上岗培训、员工开发或道德准则的定期强化；存在争议——批评者认为价值观在人生早期通过实例和榜样习得、雇用时已定型，道德培训没有显著的长期影响；支持者认为价值观可以学习和改变，即使价值观不变，道德培训也能帮助员工认识和了解道德困境、重申组织期望；研究显示更了解组织道德规范并参加更多道德培训的员工满意度更高、认为组织社会责任感更强。"}],"k":"b","i":1,"h":"<strong class=\"lead\">培训的类型</strong>（四种技能范畴＋两种专题培训）："},{"t":"培训的方法：","c":[{"t":"在职培训（on-the-job training）：包括工作轮换、学徒制、见习以及正式的导师方案；美国公司利用长期工作轮换培训将要担任更高职位的管理者；最主要缺陷是常常对工作场所造成干扰。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">在职培训</strong>（on-the-job training）：包括工作轮换、学徒制、见习以及正式的导师方案；美国公司利用长期工作轮换培训将要担任更高职位的管理者；最主要缺陷是常常对工作场所造成干扰。"},{"t":"脱产培训：1300 亿美元培训费用主要用于正规的脱产培训；最常见的是课堂讲座，还包括公共研讨、自学、网络课程、在线研讨、播客，以及运用角色扮演和案例分析的群体学习；越来越多大型机构建立企业大学，并以在线培训作为补充。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">脱产培训</strong>：1300 亿美元培训费用主要用于正规的脱产培训；最常见的是课堂讲座，还包括公共研讨、自学、网络课程、在线研讨、播客，以及运用角色扮演和案例分析的群体学习；越来越多大型机构建立企业大学，并以在线培训作为补充。"},{"t":"基于电脑的培训（computer-based training，电子化培训）：近年来发展最快；强调学员自主掌控学习内容和进度、可通过在线论坛交流、融合情景模拟和群体讨论；使员工活跃参与练习和答题的电子化培训比传统课堂教学更有效；定期督促学习者、采用有效学习策略、衡量学习目标进展可提高其有效性；新形式包括微课程、即时通信终端和手机学习游戏。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">基于电脑的培训</strong>（computer-based training，电子化培训）：近年来发展最快；强调学员自主掌控学习内容和进度、可通过在线论坛交流、融合情景模拟和群体讨论；使员工活跃参与练习和答题的电子化培训比传统课堂教学更有效；定期督促学习者、采用有效学习策略、衡量学习目标进展可提高其有效性；新形式包括微课程、即时通信终端和手机学习游戏。"},{"t":"非正式培训：许多工作场所的学习通过无组织、无计划、易适应情境与个人的非正式培训完成——大多是员工互相帮助、共享信息、共同解决工作问题；许多管理者现在支持过去被视为\"闲聊\"的做法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">非正式培训</strong>：许多工作场所的学习通过无组织、无计划、易适应情境与个人的非正式培训完成——大多是员工互相帮助、共享信息、共同解决工作问题；许多管理者现在支持过去被视为&quot;闲聊&quot;的做法。"}],"k":"b","i":1,"h":"<strong class=\"lead\">培训的方法</strong>："},{"t":"评估培训有效性：","c":[{"t":"有效性的四种结果：学员的满意度、学到的知识量、将所学应用于工作的程度、公司对培训的投资回报率；这些结果并不总是相关（课堂快乐不等于学到东西，学到不等于会用），因此应严格测量多个培训结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有效性的四种结果</strong>：学员的满意度、学到的知识量、将所学应用于工作的程度、公司对培训的投资回报率；这些结果并不总是相关（课堂快乐不等于学到东西，学到不等于会用），因此应严格测量多个培训结果。"},{"t":"个人因素：责任心强、认知能力高、自信心强、内控型的人在培训中学得更多；刻板印象威胁也可能影响培训绩效（少数族裔意识到本群体在此类任务中表现不佳的刻板印象时实际表现确实不佳）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个人因素</strong>：责任心强、认知能力高、自信心强、内控型的人在培训中学得更多；刻板印象威胁也可能影响培训绩效（少数族裔意识到本群体在此类任务中表现不佳的刻板印象时实际表现确实不佳）。"},{"t":"环境因素：员工需要看到培训将如何应用于自己的工作；培训之后主管和同事提供的支持显著影响所学是否转化为新行为——有效的培训方案不仅要传授技能，还要改变工作环境以支持受训成员。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">环境因素</strong>：员工需要看到培训将如何应用于自己的工作；培训之后主管和同事提供的支持显著影响所学是否转化为新行为——有效的培训方案不仅要传授技能，还要改变工作环境以支持受训成员。"},{"t":"总体证据：对在职培训的投资带来生产率提高，其价值远大于成本；跨文化培训在到达新国家之后进行时对提高绩效有效、之前进行则并非如此；韩国 260 多家公司的研究发现培训支出与企业创新正相关——对培训的投资总体上带来积极影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总体证据</strong>：对在职培训的投资带来生产率提高，其价值远大于成本；跨文化培训在到达新国家之后进行时对提高绩效有效、之前进行则并非如此；韩国 260 多家公司的研究发现培训支出与企业创新正相关——对培训的投资总体上带来积极影响。"}],"k":"b","i":1,"h":"<strong class=\"lead\">评估培训有效性</strong>："}],"k":"sec","i":0,"h":"17.4 培训与开发方案"},{"t":"17.5 绩效评估","c":[{"t":"绩效评估体系的选择及实施方式会显著影响员工行为（正如评分等级不同的大学课程引发不同的努力程度）。","c":[],"k":"b","i":1,"h":"绩效评估体系的选择及实施方式会显著影响员工行为（正如评分等级不同的大学课程引发不同的努力程度）。"},{"t":"什么是绩效（三种主要行为类型）：","c":[{"t":"任务绩效（task performance）：履行有助于生产某种产品或服务、或有助于管理活动的任务和职责的绩效，包括传统工作说明书中的大部分任务。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">任务绩效</strong>（task performance）：履行有助于生产某种产品或服务、或有助于管理活动的任务和职责的绩效，包括传统工作说明书中的大部分任务。"},{"t":"公民行为（citizenship）：有益于组织心理氛围的行为绩效，如自愿帮助他人、支持组织目标、尊敬同事、提出建设性意见、宣扬工作场所的积极事物。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公民行为</strong>（citizenship）：有益于组织心理氛围的行为绩效，如自愿帮助他人、支持组织目标、尊敬同事、提出建设性意见、宣扬工作场所的积极事物。"},{"t":"反生产行为（counterproductivity）：有害于组织的行为，包括偷窃、损坏公司财物、挑衅同事以及无故缺勤。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反生产行为</strong>（counterproductivity）：有害于组织的行为，包括偷窃、损坏公司财物、挑衅同事以及无故缺勤。"},{"t":"大多数管理者认为良好绩效意味着前两个维度表现出色并避免第三类行为。","c":[],"k":"b","i":2,"h":"大多数管理者认为良好绩效意味着前两个维度表现出色并避免第三类行为。"}],"k":"b","i":1,"h":"<strong class=\"lead\">什么是绩效</strong>（三种主要行为类型）："},{"t":"绩效评估的目的：帮助管理层制定常规人力资源决策（晋升、工作调动、解聘）；确定培训和开发需求；向员工提供关于组织如何看待其绩效的反
