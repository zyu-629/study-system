馈；作为组织分配奖励（包括绩效工资）的基础。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">绩效评估的目的</strong>：帮助管理层制定常规人力资源决策（晋升、工作调动、解聘）；确定培训和开发需求；向员工提供关于组织如何看待其绩效的反馈；作为组织分配奖励（包括绩效工资）的基础。"},{"t":"评估什么内容（三个最常用的标准）：","c":[{"t":"个体任务结果：当结果比手段重要时评估结果（工厂经理——产量、次品量、单位成本；销售人员——总销售额、销售额增长、新增客户数）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个体任务结果</strong>：当结果比手段重要时评估结果（工厂经理——产量、次品量、单位成本；销售人员——总销售额、销售额增长、新增客户数）。"},{"t":"行为：当难以把具体结果直接归结为员工活动时（咨询或支持性岗位、任务嵌套于群体任务），评估行为（月度报告的及时性、领导风格、业务联系电话数量、对他人的帮助程度）；帮助他人等公民行为常被纳入评估。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行为</strong>：当难以把具体结果直接归结为员工活动时（咨询或支持性岗位、任务嵌套于群体任务），评估行为（月度报告的及时性、领导风格、业务联系电话数量、对他人的帮助程度）；帮助他人等公民行为常被纳入评估。"},{"t":"特质：\"态度好\"\"自信\"\"可靠\"\"经验丰富\"等特质可能与积极的任务结果不相关，但组织仍然使用它们来评估员工。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">特质</strong>：&quot;态度好&quot;&quot;自信&quot;&quot;可靠&quot;&quot;经验丰富&quot;等特质可能与积极的任务结果不相关，但组织仍然使用它们来评估员工。"}],"k":"b","i":1,"h":"<strong class=\"lead\">评估什么内容</strong>（三个最常用的标准）："},{"t":"谁来评估：传统上由管理者评估；如今使用自我管理型团队、远程办公等组织让同事、下属参与评估，员工也参与自评。","c":[{"t":"自我评估通常夸大结果（自我服务偏见），与主管评估通常不一致——更适用于员工开发而不是员工评估。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自我评估通常夸大结果</strong>（自我服务偏见），与主管评估通常不一致——更适用于员工开发而不是员工评估。"},{"t":"建议在绝大多数情况下使用多种评估渠道：综合各评估者的评估可获得更可信、客观、准确的结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">建议在绝大多数情况下使用多种评估渠道</strong>：综合各评估者的评估可获得更可信、客观、准确的结果。"},{"t":"360 度评估（图表17-2）：绩效反馈来自员工日常工作中可能接触到的所有人——下属、顾客、上司、同事、团队成员、供应商等；评估者少则 3～4 人、多则 25 人，大多数组织为每位员工指定 5～10 名；吸引力在于参与感和更准确的评估，但问题不少——评估者未经培训难以给出建设性评价、允许员工自选评估者会夸大积极反馈、不了解者权重过高有风险、意见分歧难以处理；同事之间相互评价比上司或下属宽松得多；360 度评估可补充对员工一致性的理解，但不应取代对绩效的客观评价，还可能增加消极行为（被排斥员工自尊下降、偏差行为增多）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">360 度评估</strong>（图表17-2）：绩效反馈来自员工日常工作中可能接触到的所有人——下属、顾客、上司、同事、团队成员、供应商等；评估者少则 3～4 人、多则 25 人，大多数组织为每位员工指定 5～10 名；吸引力在于参与感和更准确的评估，但问题不少——评估者未经培训难以给出建设性评价、允许员工自选评估者会夸大积极反馈、不了解者权重过高有风险、意见分歧难以处理；同事之间相互评价比上司或下属宽松得多；360 度评估可补充对员工一致性的理解，但不应取代对绩效的客观评价，还可能增加消极行为（被排斥员工自尊下降、偏差行为增多）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">谁来评估</strong>：传统上由管理者评估；如今使用自我管理型团队、远程办公等组织让同事、下属参与评估，员工也参与自评。"},{"t":"绩效评估方法（五种）：","c":[{"t":"书面报告法：叙述员工优缺点、以往绩效、潜力和改进建议；不需复杂格式和大量培训，但结果一半取决于写作技巧，且因无标准化打分关键点而难以比较。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书面报告法</strong>：叙述员工优缺点、以往绩效、潜力和改进建议；不需复杂格式和大量培训，但结果一半取决于写作技巧，且因无标准化打分关键点而难以比较。"},{"t":"关键事件法（critical incident）：把评估者注意力集中在那些决定能否有效完成工作的关键行为上，只记录被评估者具体有效或无效的行为；一系列关键事件可提供丰富的良好行为与待改进行为的例子。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键事件法</strong>（critical incident）：把评估者注意力集中在那些决定能否有效完成工作的关键行为上，只记录被评估者具体有效或无效的行为；一系列关键事件可提供丰富的良好行为与待改进行为的例子。"},{"t":"图尺度评价法（graphic rating scale）：最古老又最常用；罗列绩效要素（工作任务的数量和质量、知识深度、合作性、出勤率、主动性等）再用量表（通常五级）逐项评分；提供的信息不及前两种深入，但耗时少、易操作、可定量分析和比较。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图尺度评价法</strong>（graphic rating scale）：最古老又最常用；罗列绩效要素（工作任务的数量和质量、知识深度、合作性、出勤率、主动性等）再用量表（通常五级）逐项评分；提供的信息不及前两种深入，但耗时少、易操作、可定量分析和比较。"},{"t":"行为锚定等级评价法（behaviorally anchored rating scale，BARS）：综合关键事件法与图尺度评价法；先用员工工作中真实的有效与无效行为事例形成绩效维度，再用等级评价表对这些关键事件评定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行为锚定等级评价法</strong>（behaviorally anchored rating scale，BARS）：综合关键事件法与图尺度评价法；先用员工工作中真实的有效与无效行为事例形成绩效维度，再用等级评价表对这些关键事件评定。"},{"t":"强制比较法（forced comparison）：与他人绩效比较的相对而非绝对测量——①分组排序法（group order ranking）：把员工置于特定类别（如最好的 1/5 组），20 名员工只能有 4 人进前 1/5、也必须有 4 人进最后 1/5；②个人排序法（individual ranking）：把员工从最好到最差排序，不允许并列，假定第 1 名与第 2 名的差异和第 21 名与第 22 名的差异一样大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">强制比较法</strong>（forced comparison）：与他人绩效比较的相对而非绝对测量——①分组排序法（group order ranking）：把员工置于特定类别（如最好的 1/5 组），20 名员工只能有 4 人进前 1/5、也必须有 4 人进最后 1/5；②个人排序法（individual ranking）：把员工从最好到最差排序，不允许并列，假定第 1 名与第 2 名的差异和第 21 名与第 22 名的差异一样大。"},{"t":"类比：大学 GPA 中位数逐年上升（分数贬值），一些学校（如普林斯顿）采用强制分布政策应对——每系最多只能给 35% 的学生打\"A\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">类比</strong>：大学 GPA 中位数逐年上升（分数贬值），一些学校（如普林斯顿）采用强制分布政策应对——每系最多只能给 35% 的学生打&quot;A&quot;。"}],"k":"b","i":1,"h":"<strong class=\"lead\">绩效评估方法</strong>（五种）："},{"t":"改进绩效评估：","c":[{"t":"常见的评估者偏差：夸大评估（正面宽松）或低估（负面宽松）、晕轮效应（某个特点过度影响对其他特点的评估）、相似性错误（偏向与自己相似的人）、把评估当政治机会故意扭曲（为维持与下属的积极关系或树立正面形象）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">常见的评估者偏差</strong>：夸大评估（正面宽松）或低估（负面宽松）、晕轮效应（某个特点过度影响对其他特点的评估）、相似性错误（偏向与自己相似的人）、把评估当政治机会故意扭曲（为维持与下属的积极关系或树立正面形象）。"},{"t":"四条建议：","c":[{"t":"使用多名评估者：评估者数量增加，获得更准确信息的可能性提高、员工也更接受反馈（如跳水、体操去掉最高最低分的逻辑）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">使用多名评估者</strong>：评估者数量增加，获得更准确信息的可能性提高、员工也更接受反馈（如跳水、体操去掉最高最低分的逻辑）。"},{"t":"有选择地评价：评估者应在自己具备相关知识的领域评估；评估者与评估对象的层级距离越近越好，距离越远观察机会越少、越不准确。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">有选择地评价</strong>：评估者应在自己具备相关知识的领域评估；评估者与评估对象的层级距离越近越好，距离越远观察机会越少、越不准确。"},{"t":"培训评估者：通过培训改变参照框架，使组织内每个人以同一种方式定义\"良好绩效\"；鼓励评估者用尽量多的细节描述员工行为，促使其记住与绩效相关的行为而非凭当时感觉。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">培训评估者</strong>：通过培训改变参照框架，使组织内每个人以同一种方式定义&quot;良好绩效&quot;；鼓励评估者用尽量多的细节描述员工行为，促使其记住与绩效相关的行为而非凭当时感觉。"},{"t":"为员工提供正当程序：三个特征——①组织向个体提供充分信息使其了解期望；②在听证会上提交违规或违纪行为的所有相关证据、所涉个体可辩护；③最终结果依赖证据、不受偏见影响；把评估结果公布到网上也能促进正当程序（员工更信任评价者、参与度提高）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">为员工提供正当程序</strong>：三个特征——①组织向个体提供充分信息使其了解期望；②在听证会上提交违规或违纪行为的所有相关证据、所涉个体可辩护；③最终结果依赖证据、不受偏见影响；把评估结果公布到网上也能促进正当程序（员工更信任评价者、参与度提高）。"}],"k":"b","i":2,"h":"<strong class=\"lead\">四条建议</strong>："}],"k":"b","i":1,"h":"<strong class=\"lead\">改进绩效评估</strong>："},{"t":"提供绩效反馈：","c":[{"t":"管理者不愿提供反馈的三个原因：①害怕直接面对员工并展示消极反馈；②许多员工面对缺点时自我防卫（指责评估结果或归咎他人）；③员工对自己的绩效评估往往过高——统计学上必有一半员工低于平均水平，却有 3/4 的员工认为自己高于平均水平。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理者不愿提供反馈的三个原因</strong>：①害怕直接面对员工并展示消极反馈；②许多员工面对缺点时自我防卫（指责评估结果或归咎他人）；③员工对自己的绩效评估往往过高——统计学上必有一半员工低于平均水平，却有 3/4 的员工认为自己高于平均水平。"},{"t":"解决方法：不是忽视反馈，而是培训管理者运用建设性的反馈会议——一次有效的反馈会议应使员工觉得评估公正、管理者真诚、氛围富有建设性，从而精神振奋并下决心改进；评估结果应尽可能具体（针对具体方面的反馈比整体评价更客观）；把反馈会议设计成咨询活动而非评判过程，从员工的自我评估着手效果最佳。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解决方法</strong>：不是忽视反馈，而是培训管理者运用建设性的反馈会议——一次有效的反馈会议应使员工觉得评估公正、管理者真诚、氛围富有建设性，从而精神振奋并下决心改进；评估结果应尽可能具体（针对具体方面的反馈比整体评价更客观）；把反馈会议设计成咨询活动而非评判过程，从员工的自我评估着手效果最佳。"}],"k":"b","i":1,"h":"<strong class=\"lead\">提供绩效反馈</strong>："},{"t":"绩效评估中的国际差异：个人主义文化（如美国）强调正式绩效评估体系——定期书面评估、管理者与员工分享结果并以此决定薪酬；集体主义文化（亚洲和许多拉美国家）强调非正式体系——不重视正式反馈、薪酬与评估联系不密切；差异正在缩小（韩国、新加坡、日本的绩效评估使用显著增长，但韩国员工大多质疑评估结果的效度）。银行业研究发现：高自我肯定、高不确定性规避且低群内集体主义的国家更频繁使用正式评估；高不确定性规避国家的评估更多用于沟通和发展目的；权力距离高且集体主义意识强的个人倾向于更宽松的评估。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">绩效评估中的国际差异</strong>：个人主义文化（如美国）强调正式绩效评估体系——定期书面评估、管理者与员工分享结果并以此决定薪酬；集体主义文化（亚洲和许多拉美国家）强调非正式体系——不重视正式反馈、薪酬与评估联系不密切；差异正在缩小（韩国、新加坡、日本的绩效评估使用显著增长，但韩国员工大多质疑评估结果的效度）。银行业研究发现：高自我肯定、高不确定性规避且低群内集体主义的国家更频繁使用正式评估；高不确定性规避国家的评估更多用于沟通和发展目的；权力距离高且集体主义意识强的个人倾向于更宽松的评估。"},{"t":"对管理者的启示（并入本节）：甄选要使人与岗位和组织精确匹配，使用最能直接评估工作所需技能的方法；通过培训提高员工技能，培训开发方案应包括道德部分；利用绩效评估准确衡量个人绩效并作为薪酬奖励分配的基础，尽可能确保公平（评估被认为不公正会导致努力程度降低、缺勤率上升、寻找其他机会）；为员工提供参与绩效评估的机会，促使其理解评估标准并参与工作改进。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（并入本节）：甄选要使人与岗位和组织精确匹配，使用最能直接评估工作所需技能的方法；通过培训提高员工技能，培训开发方案应包括道德部分；利用绩效评估准确衡量个人绩效并作为薪酬奖励分配的基础，尽可能确保公平（评估被认为不公正会导致努力程度降低、缺勤率上升、寻找其他机会）；为员工提供参与绩效评估的机会，促使其理解评估标准并参与工作改进。"}],"k":"sec","i":0,"h":"17.5 绩效评估"},{"t":"17.6 人力资源管理的领导角色","c":[{"t":"人力资源管理者在职场环境的方方面面发挥关键的领导角色：从设计和实施福利项目、开展工作态度调查，到起草和执行雇佣政策；在对抗性情形（工作-生活冲突、调解、裁员和解雇）中在前线发挥作用；只有人力资源部门能同时代表员工和公司的观点和需求。","c":[],"k":"b","i":1,"h":"人力资源管理者在职场环境的方方面面发挥关键的领导角色：从设计和实施福利项目、开展工作态度调查，到起草和执行雇佣政策；在对抗性情形（工作-生活冲突、调解、裁员和解雇）中在前线发挥作用；只有人力资源部门能同时代表员工和公司的观点和需求。"},{"t":"高绩效工作系统（high-performance work system，HPWS）：由组织实施的一组相互配合、相互加强的人力资源活动，以达到提高组织成果的目的——包括增强动机的做法（利润分享计划和奖励制度）和提高技能水平的做法（培训和开发计划）；研究表明在具有学习文化的组织中 HPWS 对绩效的提升作用尤为明显；向 HPWS 提供更多资源可带来更高组织绩效；当领导不以组织目标为导向时 HPWS 的影响可能更大。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">高绩效工作系统</strong>（high-performance work system，HPWS）：由组织实施的一组相互配合、相互加强的人力资源活动，以达到提高组织成果的目的——包括增强动机的做法（利润分享计划和奖励制度）和提高技能水平的做法（培训和开发计划）；研究表明在具有学习文化的组织中 HPWS 对绩效的提升作用尤为明显；向 HPWS 提供更多资源可带来更高组织绩效；当领导不以组织目标为导向时 HPWS 的影响可能更大。"},{"t":"人力资源活动的沟通：人力资源的领导始于告知员工活动信息并解释相关决策的含义——当公司成功传达整个人力资源活动系统如何开发及其服务功能时，员工会觉得可以控制和管理自己从工作中得到的东西，产生积极情绪，进而提高承诺度、留存率和参与度；员工在工作级别上对人力资源活动的感知是组织公民行为、承诺度和留任意向的重要预测因素；员工对活动目的的看法决定反应——认为活动旨在提高绩效并使员工受益的人承诺和绩效更高，认为目的是剥削员工的人不会有积极反应；感觉受激励的员工更可能从活动中获得积极结果；跨文化方面，荷兰、美国、法国、西班牙、葡萄牙和新加坡的求职者大多更喜欢面试和工作抽样测试、不喜欢个人接触和诚信测试——员工对公平实践的共识差异不大，沟通是证明人力资源目的公平性的桥梁。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">人力资源活动的沟通</strong>：人力资源的领导始于告知员工活动信息并解释相关决策的含义——当公司成功传达整个人力资源活动系统如何开发及其服务功能时，员工会觉得可以控制和管理自己从工作中得到的东西，产生积极情绪，进而提高承诺度、留存率和参与度；员工在工作级别上对人力资源活动的感知是组织公民行为、承诺度和留任意向的重要预测因素；员工对活动目的的看法决定反应——认为活动旨在提高绩效并使员工受益的人承诺和绩效更高，认为目的是剥削员工的人不会有积极反应；感觉受激励的员工更可能从活动中获得积极结果；跨文化方面，荷兰、美国、法国、西班牙、葡萄牙和新加坡的求职者大多更喜欢面试和工作抽样测试、不喜欢个人接触和诚信测试——员工对公平实践的共识差异不大，沟通是证明人力资源目的公平性的桥梁。"},{"t":"设计和实施福利项目：如今的雇主比以往更愿意提供选择广泛的福利待遇（健康、育儿、赡养老人、教育、工作环境等）；福利项目由人力资源部门在行政管理层指示下设计实施；理想情况下应与组织文化特点相符、反映组织价值观、经济上可行并能长期实施——既有利于员工心理健康又可提高组织绩效；同一福利对不同员工群体可能支持也可能缺乏包容性（如母乳喂养员工的相关安排，美国联邦法律仅要求\"合理的休息时间\"）；人力资源经理需分析不同福利措施的费用与积极结果，决定哪种能长期推行。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">设计和实施福利项目</strong>：如今的雇主比以往更愿意提供选择广泛的福利待遇（健康、育儿、赡养老人、教育、工作环境等）；福利项目由人力资源部门在行政管理层指示下设计实施；理想情况下应与组织文化特点相符、反映组织价值观、经济上可行并能长期实施——既有利于员工心理健康又可提高组织绩效；同一福利对不同员工群体可能支持也可能缺乏包容性（如母乳喂养员工的相关安排，美国联邦法律仅要求&quot;合理的休息时间&quot;）；人力资源经理需分析不同福利措施的费用与积极结果，决定哪种能长期推行。"},{"t":"起草并执行雇佣政策：员工需要知道组织对他们的期望；根据现有法律制定的高于最低法律要求的雇佣政策有利于形成积极的组织文化；政策提供的是行为指导方针而不仅是工作条件（如哺乳员工使用休息室的时间、地点、存放方式等细节需政策明确，以减少困惑和尴尬）；任何政策只有通过强制执行才能发挥作用——人力资源经理有责任确定违规后果并负责执行；无偿实习生是典型问题：美国劳工部规定无偿实习生必须得到职业教育、其工作不可为雇主盈利，违反者面临诉讼（《黑天鹅》摄制组实习生格拉特的诉讼引发 NBC环球、福克斯等组织的类似索赔）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">起草并执行雇佣政策</strong>：员工需要知道组织对他们的期望；根据现有法律制定的高于最低法律要求的雇佣政策有利于形成积极的组织文化；政策提供的是行为指导方针而不仅是工作条件（如哺乳员工使用休息室的时间、地点、存放方式等细节需政策明确，以减少困惑和尴尬）；任何政策只有通过强制执行才能发挥作用——人力资源经理有责任确定违规后果并负责执行；无偿实习生是典型问题：美国劳工部规定无偿实习生必须得到职业教育、其工作不可为雇主盈利，违反者面临诉讼（《黑天鹅》摄制组实习生格拉特的诉讼引发 NBC环球、福克斯等组织的类似索赔）。"},{"t":"管理工作-生活冲突：","c":[{"t":"传言还是科学：「24 小时待命的工作场所是有害的」——研究表明深夜使用智能手机工作者次日的工作参与度较低；工作狂下班后仍思考工作、主动超时，带来精力耗竭、压力和家庭问题（工作量过多、优先级冲突和时间压力会强化这一倾向）；长期保持绩效的关键是培养心理上从工作中超脱出来的能力，短而有规律的工作间歇可补充能量——\"拔掉插头可以充电\"，人力资源部门可通过展示研究结果、帮助确定有益的活动和边界来支持。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传言还是科学</strong>：「24 小时待命的工作场所是有害的」——研究表明深夜使用智能手机工作者次日的工作参与度较低；工作狂下班后仍思考工作、主动超时，带来精力耗竭、压力和家庭问题（工作量过多、优先级冲突和时间压力会强化这一倾向）；长期保持绩效的关键是培养心理上从工作中超脱出来的能力，短而有规律的工作间歇可补充能量——&quot;拔掉插头可以充电&quot;，人力资源部门可通过展示研究结果、帮助确定有益的活动和边界来支持。"},{"t":"背景：20 世纪 80 年代工作-生活冲突引起管理层注意，主要源于越来越多有年幼孩子的女性加入劳动力队伍；但冲突并不限于有孩子的女性员工——波士顿大学对近 1000 名有孩子的男性工作者的调查显示，与高薪和升职相比他们更重视工作保障、灵活性和\"家庭友好型\"日程。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：20 世纪 80 年代工作-生活冲突引起管理层注意，主要源于越来越多有年幼孩子的女性加入劳动力队伍；但冲突并不限于有孩子的女性员工——波士顿大学对近 1000 名有孩子的男性工作者的调查显示，与高薪和升职相比他们更重视工作保障、灵活性和&quot;家庭友好型&quot;日程。"},{"t":"减少冲突的五种战略（图表17-4）：","c":[{"t":"基于时间的战略：弹性工作制、工作分享、给新晋父母提供假期、远程办公、带薪假期（科尔尼\"灵活带来成功\"计划；艾伯维 98% 员工弹性工作；德勤提供 3～6 个月休假、其间拿 40% 工资）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">基于时间的战略</strong>：弹性工作制、工作分享、给新晋父母提供假期、远程办公、带薪假期（科尔尼&quot;灵活带来成功&quot;计划；艾伯维 98% 员工弹性工作；德勤提供 3～6 个月休假、其间拿 40% 工资）。"},{"t":"基于信息的战略：工作/生活支持、搬迁援助、老人护理资源、咨询服务（Blue Cross Blue Shield 为远程办公员工提供网络；贺曼贺卡每月举办女性职业管理会议；强生提倡周末不收发电子邮件）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">基于信息的战略</strong>：工作/生活支持、搬迁援助、老人护理资源、咨询服务（Blue Cross Blue Shield 为远程办公员工提供网络；贺曼贺卡每月举办女性职业管理会议；强生提倡周末不收发电子邮件）。"},{"t":"基于金钱的战略：保险补贴、灵活的福利、领养补助、儿童保育费用打折、直接经济援助、家庭伴侣福利、奖学金和学费补贴（埃森哲 5000 美元领养补助；花旗员工每年可在税前保健账户存 5000 美元；高露洁每年最多 10000 美元学费；保诚每年 100 小时被抚养人护理）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">基于金钱的战略</strong>：保险补贴、灵活的福利、领养补助、儿童保育费用打折、直接经济援助、家庭伴侣福利、奖学金和学费补贴（埃森哲 5000 美元领养补助；花旗员工每年可在税前保健账户存 5000 美元；高露洁每年最多 10000 美元学费；保诚每年 100 小时被抚养人护理）。"},{"t":"直接服务战略：工作场所中的托儿中心、健身中心、暑期托儿项目、其他便利服务、礼宾服务、免费或打折的公司产品（雅培托儿中心可服务 800 人；百时美施贵宝的托儿与夏令营；特纳广播提供看护、遛狗及陪伴老人；REI 的员工产品折扣）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">直接服务战略</strong>：工作场所中的托儿中心、健身中心、暑期托儿项目、其他便利服务、礼宾服务、免费或打折的公司产品（雅培托儿中心可服务 800 人；百时美施贵宝的托儿与夏令营；特纳广播提供看护、遛狗及陪伴老人；REI 的员工产品折扣）。"},{"t":"文化变革战略：创建工作-生活平衡文化、对管理者进行培训、将管理者收入与员工满意度挂钩、关注员工的实际绩效而非\"表面工作时间\"（美国运通建立员工社交网络直接解决问题；Robert W. Baird 的规则\"这里没有混蛋\"；戈尔公司\"我们不管理人，我们希望人们管理自己\"；培生培训管理者让员工灵活支配工作时间）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">文化变革战略</strong>：创建工作-生活平衡文化、对管理者进行培训、将管理者收入与员工满意度挂钩、关注员工的实际绩效而非&quot;表面工作时间&quot;（美国运通建立员工社交网络直接解决问题；Robert W. Baird 的规则&quot;这里没有混蛋&quot;；戈尔公司&quot;我们不管理人，我们希望人们管理自己&quot;；培生培训管理者让员工灵活支配工作时间）。"}],"k":"b","i":2,"h":"<strong class=\"lead\">减少冲突的五种战略</strong>（图表17-4）："},{"t":"关键结论：时间压力并不是导致工作-生活冲突的主要问题，决定性因素是工作对家庭生活的心理侵扰（反之亦然）；组织应花更多精力帮助员工清晰划分生活空间——使工作负荷合理化、减少出差旅行、在工作场所提供高品质幼儿园、增加计划。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键结论</strong>：时间压力并不是导致工作-生活冲突的主要问题，决定性因素是工作对家庭生活的心理侵扰（反之亦然）；组织应花更多精力帮助员工清晰划分生活空间——使工作负荷合理化、减少出差旅行、在工作场所提供高品质幼儿园、增加计划。"},{"t":"偏好差异：有人喜欢把工作与个人生活明确区分的措施（弹性工作制、工作分享、兼职），有人喜欢使两者相融合的措施（体育活动、家庭野餐）；大多数人喜欢支持工作与生活平衡的组织，应聘者（尤其是女性）更容易被在这方面有良好声誉的组织吸引。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">偏好差异</strong>：有人喜欢把工作与个人生活明确区分的措施（弹性工作制、工作分享、兼职），有人喜欢使两者相融合的措施（体育活动、家庭野餐）；大多数人喜欢支持工作与生活平衡的组织，应聘者（尤其是女性）更容易被在这方面有良好声誉的组织吸引。"}],"k":"b","i":1,"h":"<strong class=\"lead\">管理工作-生活冲突</strong>："},{"t":"调解、解雇和裁员：发生纠纷、绩效不达标、机构精简时人力资源部门常成为众矢之的——员工要相信人力专员能始终保密并持有平衡观点，管理者要相信其了解法律并能代表组织立场；人力专员应训练有素、掌握调解技巧、按公司政策找到积极解决方案；解雇流程须符合工会劳动合同和法律要求（如西班牙劳动法保护年长员工使其几乎不可能被解雇），这使解雇可能非常复杂。","c":[{"t":"离职面谈：人力资源部是离职员工的最后一站，应留下良好印象并从离职面谈中收集有用信息和建议；被裁员工若认为过程公平，会向他人推荐这家公司、愿意在需要时回来；裁员中幸存的员工也会考量机构精简过程的公平性（尤其在个人主义文化中）——公平的组织更有可能实现预期的财务收益。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">离职面谈</strong>：人力资源部是离职员工的最后一站，应留下良好印象并从离职面谈中收集有用信息和建议；被裁员工若认为过程公平，会向他人推荐这家公司、愿意在需要时回来；裁员中幸存的员工也会考量机构精简过程的公平性（尤其在个人主义文化中）——公平的组织更有可能实现预期的财务收益。"}],"k":"b","i":1,"h":"<strong class=\"lead\">调解、解雇和裁员</strong>：发生纠纷、绩效不达标、机构精简时人力资源部门常成为众矢之的——员工要相信人力专员能始终保密并持有平衡观点，管理者要相信其了解法律并能代表组织立场；人力专员应训练有素、掌握调解技巧、按公司政策找到积极解决方案；解雇流程须符合工会劳动合同和法律要求（如西班牙劳动法保护年长员工使其几乎不可能被解雇），这使解雇可能非常复杂。"},{"t":"本章小结（并入本节）：人力资源政策和实践对组织行为和工作成果有极大影响——人力资源部门在招聘（在线渠道吸引申请）、甄选三阶段（尤其初步甄选的大量申请开发与筛选）、培训与开发计划、绩效评估系统的政策与管理上发挥核心作用；其职责还包括定期沟通、设计管理福利计划、处理工作-生活冲突、调解解雇裁员，并把道德问题意识融入员工在组织中经历的各个阶段；知识渊博的人力资源专业人员是组织各层面（高层管理者、各级管理者与普通员工）的宝贵资源。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章小结</strong>（并入本节）：人力资源政策和实践对组织行为和工作成果有极大影响——人力资源部门在招聘（在线渠道吸引申请）、甄选三阶段（尤其初步甄选的大量申请开发与筛选）、培训与开发计划、绩效评估系统的政策与管理上发挥核心作用；其职责还包括定期沟通、设计管理福利计划、处理工作-生活冲突、调解解雇裁员，并把道德问题意识融入员工在组织中经历的各个阶段；知识渊博的人力资源专业人员是组织各层面（高层管理者、各级管理者与普通员工）的宝贵资源。"}],"k":"sec","i":0,"h":"17.6 人力资源管理的领导角色"}],"k":"chap","h":"第17章 人力资源政策与实践"},{"t":"第18章 组织变革与压力管理","c":[{"t":"学习目标","c":[{"t":"1．比较变革和有计划的变革的动力。","c":[],"k":"b","i":1,"h":"1．比较变革和有计划的变革的动力。"},{"t":"2．描述克服变革阻力的方法。","c":[],"k":"b","i":1,"h":"2．描述克服变革阻力的方法。"},{"t":"3．比较四种主要的管理组织变革的方法。","c":[],"k":"b","i":1,"h":"3．比较四种主要的管理组织变革的方法。"},{"t":"4．阐述三种创建变革文化的方式。","c":[],"k":"b","i":1,"h":"4．阐述三种创建变革文化的方式。"},{"t":"5．找出工作中潜在的环境、组织和个人压力来源，以及个体差异和文化差异的作用。","c":[],"k":"b","i":1,"h":"5．找出工作中潜在的环境、组织和个人压力来源，以及个体差异和文化差异的作用。"},{"t":"6．指出工作压力所导致的生理、心理和行为症状。","c":[],"k":"b","i":1,"h":"6．指出工作压力所导致的生理、心理和行为症状。"},{"t":"7．描述个人和组织的工作压力管理方法。","c":[],"k":"b","i":1,"h":"7．描述个人和组织的工作压力管理方法。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"18.1 变革","c":[{"t":"背景：如今没有哪家公司处在特别稳定的环境之中，即使占据支配地位的公司也必须变革甚至根本性变革（智能手机市场格局迅速更替：苹果、三星、OPPO/BBK 的份额此消彼长，诺基亚、黑莓等曾主导者迅速失去份额）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">背景</strong>：如今没有哪家公司处在特别稳定的环境之中，即使占据支配地位的公司也必须变革甚至根本性变革（智能手机市场格局迅速更替：苹果、三星、OPPO/BBK 的份额此消彼长，诺基亚、黑莓等曾主导者迅速失去份额）。"},{"t":"18.1.1 变革的动力","c":[{"t":"\"不变革则灭亡\"是当今全球范围内管理者的共同呼声；图表18-1概括了激发变革的六种力量。","c":[],"k":"b","i":2,"h":"&quot;不变革则灭亡&quot;是当今全球范围内管理者的共同呼声；图表18-1概括了激发变革的六种力量。"},{"t":"劳动力队伍的性质：文化更加多元化；人口老龄化；移民数量和外包业务的增长——组织必须为多种文化的工作环境、人口结构变化、移民与外包做出调整。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">劳动力队伍的性质</strong>：文化更加多元化；人口老龄化；移民数量和外包业务的增长——组织必须为多种文化的工作环境、人口结构变化、移民与外包做出调整。"},{"t":"技术：更快、更便宜、更便于携带的电脑和手持设备；社交网站的出现和发展；人类遗传密码的破译——技术不断改变工作和组织，\"办公室\"可能成为过时概念。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">技术</strong>：更快、更便宜、更便于携带的电脑和手持设备；社交网站的出现和发展；人类遗传密码的破译——技术不断改变工作和组织，&quot;办公室&quot;可能成为过时概念。"},{"t":"经济冲击：全球房市的起落；金融行业的崩溃；全球衰退（2007-2009年危机中数百万人失业，美林等知名公司消失或被收购）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">经济冲击</strong>：全球房市的起落；金融行业的崩溃；全球衰退（2007-2009年危机中数百万人失业，美林等知名公司消失或被收购）。"},{"t":"竞争：全球的竞争对手；收购与兼并——成功的组织要有灵活性，需要同样灵活、反应迅速的员工队伍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">竞争</strong>：全球的竞争对手；收购与兼并——成功的组织要有灵活性，需要同样灵活、反应迅速的员工队伍。"},{"t":"社会潮流：政府对商业的更多管制；环保意识的增强；对同性恋和变性员工更宽容；更多的接触和任务多样性；医疗成本日益上升——\"绿色\"实践正成为理所当然的方案。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社会潮流</strong>：政府对商业的更多管制；环保意识的增强；对同性恋和变性员工更宽容；更多的接触和任务多样性；医疗成本日益上升——&quot;绿色&quot;实践正成为理所当然的方案。"},{"t":"世界政治：社会对企业及其高管的负面态度；中国市场日益开放——所有工业化国家的商业（尤其银行和金融部门）处于新的监管之下。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">世界政治</strong>：社会对企业及其高管的负面态度；中国市场日益开放——所有工业化国家的商业（尤其银行和金融部门）处于新的监管之下。"}],"k":"b","i":1,"h":"18.1.1 变革的动力"},{"t":"18.1.2 有计划的变革","c":[{"t":"变革（change）：让事情变得不同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">变革</strong>（change）：让事情变得不同。"},{"t":"有计划的变革（planned change）：有意为之、以目标为导向的活动。对比：小型酒店在员工\"最后通牒\"下第二天实行弹性工作制，变革只是\"发生了\"；大型汽车制造商引入机器人系统前预先设计缓解员工焦虑的方案，才是有计划的变革。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有计划的变革</strong>（planned change）：有意为之、以目标为导向的活动。对比：小型酒店在员工&quot;最后通牒&quot;下第二天实行弹性工作制，变革只是&quot;发生了&quot;；大型汽车制造商引入机器人系统前预先设计缓解员工焦虑的方案，才是有计划的变革。"},{"t":"两个目标：第一，致力于提高组织适应外部环境变化的能力；第二，致力于改变员工的行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个目标</strong>：第一，致力于提高组织适应外部环境变化的能力；第二，致力于改变员工的行为。"},{"t":"变革推动者（change agent）：能够看到组织的未来（其他人却无法看到）并激励、创建和实施这种愿景的人；可以是管理者或非管理者，可以是组织内员工或组织外顾问。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">变革推动者</strong>（change agent）：能够看到组织的未来（其他人却无法看到）并激励、创建和实施这种愿景的人；可以是管理者或非管理者，可以是组织内员工或组织外顾问。"},{"t":"变革推动者会改造旧行业以满足新的能力和需求：拼车公司优步、众筹公司Kickstarter、老年护理服务Honor（线上市场匹配护工与老人需求）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">变革推动者会改造旧行业以满足新的能力和需求</strong>：拼车公司优步、众筹公司Kickstarter、老年护理服务Honor（线上市场匹配护工与老人需求）。"},{"t":"在历史悠久的组织中寻找变革推动者面临特有挑战：通用汽车先后在人力资源与生产领域任命变革推动者（玛丽·巴拉后来出任CEO），任命充满争议与政治性；很多变革推动者失败是因为组织成员抵制变革（引出18.2）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">在历史悠久的组织中寻找变革推动者面临特有挑战</strong>：通用汽车先后在人力资源与生产领域任命变革推动者（玛丽·巴拉后来出任CEO），任命充满争议与政治性；很多变革推动者失败是因为组织成员抵制变革（引出18.2）。"}],"k":"b","i":1,"h":"18.1.2 有计划的变革"}],"k":"sec","i":0,"h":"18.1 变革"},{"t":"18.2 变革的阻力","c":[{"t":"阻力的性质","c":[{"t":"人们常将变革视为威胁；即使提供数据表明需要变革，员工也会寻找数据证明一切顺利、无需变革；持消极态度的员工以不考虑变革、多请病假、离职来应对，大量消耗组织的关键能量。","c":[],"k":"b","i":2,"h":"人们常将变革视为威胁；即使提供数据表明需要变革，员工也会寻找数据证明一切顺利、无需变革；持消极态度的员工以不考虑变革、多请病假、离职来应对，大量消耗组织的关键能量。"},{"t":"阻力不仅来自底层：当领导者更看重即时绩效时，上级管理者会阻碍下属提出的变革；更看重掌控与探索的领导者更愿意听取和采纳下属的变革建议。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">阻力不仅来自底层</strong>：当领导者更看重即时绩效时，上级管理者会阻碍下属提出的变革；更看重掌控与探索的领导者更愿意听取和采纳下属的变革建议。"},{"t":"阻力可能是积极的：如果带来开诚布公的讨论和辩论，这种反应比反感和沉默更好，说明成员参与了变革过程；变革推动者可据此调整变革以符合成员偏好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">阻力可能是积极的</strong>：如果带来开诚布公的讨论和辩论，这种反应比反感和沉默更好，说明成员参与了变革过程；变革推动者可据此调整变革以符合成员偏好。"},{"t":"表现形式：公开的或隐含的、即时的或延后的。公开直接的阻力（抱怨、消极怠工、罢工威胁）最易处理；隐含的阻力（忠诚度丧失、工作积极性下降、错误率或缺勤率上升）微妙难识别；延后的抵制可能在几周、几个月甚至几年后才出现，模糊变革与员工反应之间的关联，或使单项小变革成为压垮骆驼的最后一根稻草。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表现形式</strong>：公开的或隐含的、即时的或延后的。公开直接的阻力（抱怨、消极怠工、罢工威胁）最易处理；隐含的阻力（忠诚度丧失、工作积极性下降、错误率或缺勤率上升）微妙难识别；延后的抵制可能在几周、几个月甚至几年后才出现，模糊变革与员工反应之间的关联，或使单项小变革成为压垮骆驼的最后一根稻草。"},{"t":"警示：并非所有变革都有益；快速、彻底的变革风险很大，追求速度往往导致糟糕决策，发起者可能无法充分认识变革的影响或真正成本。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">警示</strong>：并非所有变革都有益；快速、彻底的变革风险很大，追求速度往往导致糟糕决策，发起者可能无法充分认识变革的影响或真正成本。"}],"k":"b","i":1,"h":"阻力的性质"},{"t":"18.2.1 变革阻力的来源（图表18-2）","c":[{"t":"来自个体的阻力（源于知觉、个性和需要等基本人类特征）：","c":[{"t":"习惯：为应对生活的复杂性，人们依赖习惯或程序化反应，面临变革时成为阻力来源。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">习惯</strong>：为应对生活的复杂性，人们依赖习惯或程序化反应，面临变革时成为阻力来源。"},{"t":"安全感：安全需求较高的人抵制威胁其安全感的变革。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">安全感</strong>：安全需求较高的人抵制威胁其安全感的变革。"},{"t":"经济因素：担心从事新任务或流程时达不到先前水平，尤其当报酬与生产率密切相关时。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">经济因素</strong>：担心从事新任务或流程时达不到先前水平，尤其当报酬与生产率密切相关时。"},{"t":"对未知的恐惧：变革用未知的模糊性和不确定性代替已知。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">对未知的恐惧</strong>：变革用未知的模糊性和不确定性代替已知。"},{"t":"选择性的信息加工：为保持知觉的完整性，只听想听的，忽视挑战自己世界观的信息。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">选择性的信息加工</strong>：为保持知觉的完整性，只听想听的，忽视挑战自己世界观的信息。"}],"k":"b","i":2,"h":"<strong class=\"lead\">来自个体的阻力</strong>（源于知觉、个性和需要等基本人类特征）："},{"t":"来自组织的阻力（源于组织自身的结构）：","c":[{"t":"结构惰性：甄选程序、正式规章制度等内在机制产生稳定性，变革时产生维持原有稳定状态的反作用力。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">结构惰性</strong>：甄选程序、正式规章制度等内在机制产生稳定性，变革时产生维持原有稳定状态的反作用力。"},{"t":"有限的变革范围：组织由相互依赖的子系统组成，只变革一个子系统会被更大的系统抵消。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">有限的变革范围</strong>：组织由相互依赖的子系统组成，只变革一个子系统会被更大的系统抵消。"},{"t":"群体惰性：即使个体想改变行为，群体规范也充当约束力量。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">群体惰性</strong>：即使个体想改变行为，群体规范也充当约束力量。"},{"t":"对专业知识的威胁：组织模式的变革威胁特殊群体的专业知识。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">对专业知识的威胁</strong>：组织模式的变革威胁特殊群体的专业知识。"},{"t":"对已有权力关系的威胁：决策权的重新分配无一例外威胁已形成的权力关系。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">对已有权力关系的威胁</strong>：决策权的重新分配无一例外威胁已形成的权力关系。"}],"k":"b","i":2,"h":"<strong class=\"lead\">来自组织的阻力</strong>（源于组织自身的结构）："}],"k":"b","i":1,"h":"<strong class=\"lead\">18.2.1 变革阻力的来源</strong>（图表18-2）"},{"t":"18.2.2 克服变革阻力的八种策略","c":[{"t":"沟通：变革期间沟通比以往更重要；传达平衡各方利益相关者（股东、员工、社区、客户）利益的改革逻辑成效最大；正式的信息分享可减少员工焦虑，高质量的变革信息还能增加对组织的承诺。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">沟通</strong>：变革期间沟通比以往更重要；传达平衡各方利益相关者（股东、员工、社区、客户）利益的改革逻辑成效最大；正式的信息分享可减少员工焦虑，高质量的变革信息还能增加对组织的承诺。"},{"t":"参与：个体很难抵制自己参与制定的变革决策；能减少阻力、使员工获得认同并提高决策质量；潜在不足是可能产生糟糕的决策且很耗费时间。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参与</strong>：个体很难抵制自己参与制定的变革决策；能减少阻力、使员工获得认同并提高决策质量；潜在不足是可能产生糟糕的决策且很耗费时间。"},{"t":"提供支持和做出承诺：情感承诺低的管理者和员工会维持现状；激发员工并增强对组织的承诺，促其形成对变革的情感承诺；恐惧忧虑时提供咨询与心理辅导、新技术培训、短期带薪休假。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">提供支持和做出承诺</strong>：情感承诺低的管理者和员工会维持现状；激发员工并增强对组织的承诺，促其形成对变革的情感承诺；恐惧忧虑时提供咨询与心理辅导、新技术培训、短期带薪休假。"},{"t":"发展积极的关系：相信实施变革的管理者的人更愿意接受变革并认可其合法性；与主管保持积极关系、感受同事支持并相信环境可安全承担风险的员工对变革态度更积极；信任变革推动者的人更积极看待变革。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">发展积极的关系</strong>：相信实施变革的管理者的人更愿意接受变革并认可其合法性；与主管保持积极关系、感受同事支持并相信环境可安全承担风险的员工对变革态度更积极；信任变革推动者的人更积极看待变革。"},{"t":"公平地实施变革：当结果被视为消极时程序公平尤其重要；让员工了解变革的理由及进展，感到实施一视同仁且公平；接受变革者不只关注自身利益，也关注变革对同事、组织等各方的影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公平地实施变革</strong>：当结果被视为消极时程序公平尤其重要；让员工了解变革的理由及进展，感到实施一视同仁且公平；接受变革者不只关注自身利益，也关注变革对同事、组织等各方的影响。"},{"t":"操纵和收买：操纵指暗地里施加影响（歪曲事实使其更有吸引力、封锁不受欢迎的消息、制造谣言）；收买融合操纵与参与——让抵制群体的领导者在变革决策中承担重要角色或征求意见，以谋求支持；成本低、易获得反对派支持，但被识破后变革推动者会信誉扫地。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">操纵和收买</strong>：操纵指暗地里施加影响（歪曲事实使其更有吸引力、封锁不受欢迎的消息、制造谣言）；收买融合操纵与参与——让抵制群体的领导者在变革决策中承担重要角色或征求意见，以谋求支持；成本低、易获得反对派支持，但被识破后变革推动者会信誉扫地。"},{"t":"选择接受变革的人：接受和适应变革的能力与人格有关——情绪更稳定、核心自我评价高、愿意冒险、行为灵活的人更易接受变革；也可选择适应能力强的团队（学习动机强、认知能力高、具集体主义价值观；元分析显示认知能力高且有完成任务动机的团队适应力最强）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">选择接受变革的人</strong>：接受和适应变革的能力与人格有关——情绪更稳定、核心自我评价高、愿意冒险、行为灵活的人更易接受变革；也可选择适应能力强的团队（学习动机强、认知能力高、具集体主义价值观；元分析显示认知能力高且有完成任务动机的团队适应力最强）。"},{"t":"强制：直接对抵制者给予威胁或压力（威胁调动、不予提拔、消极绩效评估、不好的推荐信等）；对部分反对者施压时最有效；优缺点与操纵和收买相似。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">强制</strong>：直接对抵制者给予威胁或压力（威胁调动、不予提拔、消极绩效评估、不好的推荐信等）；对部分反对者施压时最有效；优缺点与操纵和收买相似。"}],"k":"b","i":1,"h":"18.2.2 克服变革阻力的八种策略"},{"t":"18.2.3 变革的政治性","c":[{"t":"变革威胁现状，必定包含政治活动；不提政治性，对变革阻力的讨论就不全面。","c":[],"k":"b","i":2,"h":"变革威胁现状，必定包含政治活动；不提政治性，对变革阻力的讨论就不全面。"},{"t":"变革的推动力更可能来自：组织外部的变革推动者、新加入组织的员工（对现状投资较少）、尚未处于关键权力结构中的管理者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">变革的推动力更可能来自</strong>：组织外部的变革推动者、新加入组织的员工（对现状投资较少）、尚未处于关键权力结构中的管理者。"},{"t":"长期掌权、投入很久而获高级职务的管理者常是变革的主要障碍（变革威胁其地位与职务）；但他们也可能希望通过实施变革证明自己并非徒有其表；被迫实施变革时往往逐步实行，因为激进变革被认为过于危险。","c":[],"k":"b","i":2,"h":"长期掌权、投入很久而获高级职务的管理者常是变革的主要障碍（变革威胁其地位与职务）；但他们也可能希望通过实施变革证明自己并非徒有其表；被迫实施变革时往往逐步实行，因为激进变革被认为过于危险。"},{"t":"结论：当董事会认识到需要迅速实施激进变革时，往往选择组织外部人士来领导变革。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：当董事会认识到需要迅速实施激进变革时，往往选择组织外部人士来领导变革。"}],"k":"b","i":1,"h":"18.2.3 变革的政治性"}],"k":"sec","i":0,"h":"18.2 变革的阻力"},{"t":"18.3 管理组织变革的方法（四种）","c":[{"t":"18.3.1 勒温的三步骤模型（库尔特·勒温，Kurt Lewin）","c":[{"t":"三步骤：解冻（unfreezing）现状 → 移动（movement）到新状态 → 重新冻结（refreezing）新变革以使之持久。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三步骤</strong>：解冻（unfreezing）现状 → 移动（movement）到新状态 → 重新冻结（refreezing）新变革以使之持久。"},{"t":"根据定义，现状是一种均衡状态；解冻即打破均衡、克服个体阻力和群体从众压力，三种方式：①增加推动力（driving force，引导行为脱离现状的力量）；②减少抑制力（restraining force，阻止脱离现有均衡的力量）；③将两种方法结合使用（过去一直成功的公司常遇抑制力，因人们质疑变革的必要性）。","c":[],"k":"b","i":2,"h":"根据定义，现状是一种均衡状态；解冻即打破均衡、克服个体阻力和群体从众压力，三种方式：①增加推动力（driving force，引导行为脱离现状的力量）；②减少抑制力（restraining force，阻止脱离现有均衡的力量）；③将两种方法结合使用（过去一直成功的公司常遇抑制力，因人们质疑变革的必要性）。"},{"t":"移动阶段：保持动力很重要；逐步实施变革不如立即行动并快速通过移动阶段效果好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">移动阶段</strong>：保持动力很重要；逐步实施变革不如立即行动并快速通过移动阶段效果好。"},{"t":"重新冻结：通过平衡推动力和抑制力使新状况更加稳定；缺少这一步，变革可能短命，员工会设法回到以前的均衡状态。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">重新冻结</strong>：通过平衡推动力和抑制力使新状况更加稳定；缺少这一步，变革可能短命，员工会设法回到以前的均衡状态。"}],"k":"b","i":1,"h":"<strong class=\"lead\">18.3.1 勒温的三步骤模型</strong>（库尔特·勒温，Kurt Lewin）"},{"t":"18.3.2 科特的八步骤计划模型（约翰·科特，John Kotter）","c":[{"t":"在勒温模型基础上创建的更详细的变革实施方法；针对管理者常犯错误：没有形成紧迫感、没有管理变革的联盟、没有变革愿景、未有效沟通愿景、未清除障碍、未提供可实现的短期目标、过早宣布胜利、未将变革融入组织文化。","c":[],"k":"b","i":2,"h":"在勒温模型基础上创建的更详细的变革实施方法；针对管理者常犯错误：没有形成紧迫感、没有管理变革的联盟、没有变革愿景、未有效沟通愿景、未清除障碍、未提供可实现的短期目标、过早宣布胜利、未将变革融入组织文化。"},{"t":"八步骤（前四步对应\"解冻\"，第五至七步体现\"移动\"，第八步对应\"重新冻结\"）：","c":[{"t":"1．通过提出组织需要迫切变革的有说服力的理由，建立一种紧迫感。","c":[],"k":"b","i":3,"h":"1．通过提出组织需要迫切变革的有说服力的理由，建立一种紧迫感。"},{"t":"2．与拥有足够权力的人形成联盟来领导这次变革。","c":[],"k":"b","i":3,"h":"2．与拥有足够权力的人形成联盟来领导这次变革。"},{"t":"3．创建一个新的愿景来指导变革，并制定相关战略来实现该愿景。","c":[],"k":"b","i":3,"h":"3．创建一个新的愿景来指导变革，并制定相关战略来实现该愿景。"},{"t":"4．在整个组织中宣传该愿景。","c":[],"k":"b","i":3,"h":"4．在整个组织中宣传该愿景。"},{"t":"5．清除变革的障碍，鼓励冒险和创造性的问题解决方式，向员工授权。","c":[],"k":"b","i":3,"h":"5．清除变革的障碍，鼓励冒险和创造性的问题解决方式，向员工授权。"},{"t":"6．规划、实现和奖励短期\"胜利\"，推动组织迈向新愿景。","c":[],"k":"b","i":3,"h":"6．规划、实现和奖励短期&quot;胜利&quot;，推动组织迈向新愿景。"},{"t":"7．巩固成果，重新评估变革，在新的计划中做出必要的调整。","c":[],"k":"b","i":3,"h":"7．巩固成果，重新评估变革，在新的计划中做出必要的调整。"},{"t":"8．通过证明新行为与组织成功之间的关系来强化变革。","c":[],"k":"b","i":3,"h":"8．通过证明新行为与组织成功之间的关系来强化变革。"}],"k":"b","i":2,"h":"<strong class=\"lead\">八步骤</strong>（前四步对应&quot;解冻&quot;，第五至七步体现&quot;移动&quot;，第八步对应&quot;重新冻结&quot;）："},{"t":"贡献：为管理者和变革推动者成功推行变革提供更具体的指导。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">贡献</strong>：为管理者和变革推动者成功推行变革提供更具体的指导。"}],"k":"b","i":1,"h":"<strong class=\"lead\">18.3.2 科特的八步骤计划模型</strong>（约翰·科特，John Kotter）"},{"t":"18.3.3 行动研究（action research）","c":[{"t":"定义：先系统地收集信息，再在信息分析的基础上选定变革行动的过程；为推行有计划的变革提供了科学的方法论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定义</strong>：先系统地收集信息，再在信息分析的基础上选定变革行动的过程；为推行有计划的变革提供了科学的方法论。"},{"t":"五阶段：诊断、分析、反馈、行动、评估——与科学研究方法十分类似。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">五阶段</strong>：诊断、分析、反馈、行动、评估——与科学研究方法十分类似。"},{"t":"变革推动者通常是外部顾问：提出问题、与员工面谈、翻阅记录、积极倾听；诊断后分析（主要问题、问题范围、可能行动），第三步反馈与员工共享信息并共同制定行动计划，行动阶段解决发现的问题，评估阶段以最初收集的原始资料为标杆检验有效性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">变革推动者通常是外部顾问</strong>：提出问题、与员工面谈、翻阅记录、积极倾听；诊断后分析（主要问题、问题范围、可能行动），第三步反馈与员工共享信息并共同制定行动计划，行动阶段解决发现的问题，评估阶段以最初收集的原始资料为标杆检验有效性。"},{"t":"好处一：侧重于问题——变革推动者客观查找问题，问题类型决定变革行为类型（避免先有中意方案再找问题匹配的错误做法）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">好处一</strong>：侧重于问题——变革推动者客观查找问题，问题类型决定变革行为类型（避免先有中意方案再找问题匹配的错误做法）。"},{"t":"好处二：减小阻力——员工充分参与（尤其反馈阶段），变革过程获得自发的动力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">好处二</strong>：减小阻力——员工充分参与（尤其反馈阶段），变革过程获得自发的动力。"}],"k":"b","i":1,"h":"<strong class=\"lead\">18.3.3 行动研究</strong>（action research）"},{"t":"18.3.4 组织发展（organizational development，OD）","c":[{"t":"定义：致力于提升组织效力和员工主观幸福感的各种变革方法的集合；重视员工和组织的成长、合作与参与过程以及探索精神；当代OD借鉴后现代哲学，强调人们看待和理解工作环境的主观方式；变革推动者发挥领导作用但非常重视协作。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定义</strong>：致力于提升组织效力和员工主观幸福感的各种变革方法的集合；重视员工和组织的成长、合作与参与过程以及探索精神；当代OD借鉴后现代哲学，强调人们看待和理解工作环境的主观方式；变革推动者发挥领导作用但非常重视协作。"},{"t":"敏感性训练（sensitivity training，又称实验室训练、交友小组、T小组）：通过非结构化的群体互动来改变行为的早期方法；参与者在自由开放的环境中讨论自己及与他人的互动，由专业人员稍加引导但不承担领导角色；过程导向（通过观察和参与学习）；现在的多元化培训、执行教练、团队建设皆由此发展而来；采用须谨慎，避免小组令人恐惧、混乱并破坏工作关系。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">敏感性训练</strong>（sensitivity training，又称实验室训练、交友小组、T小组）：通过非结构化的群体互动来改变行为的早期方法；参与者在自由开放的环境中讨论自己及与他人的互动，由专业人员稍加引导但不承担领导角色；过程导向（通过观察和参与学习）；现在的多元化培训、执行教练、团队建设皆由此发展而来；采用须谨慎，避免小组令人恐惧、混乱并破坏工作关系。"},{"t":"调查反馈（survey feedback）：评估组织成员态度、发现成员间认知差异并消除差异的工具；组织\"家庭\"（工作单元管理者及其直接下属）的参与最重要；问卷涵盖决策实践、沟通效果、部门合作及对组织、工作、同事、上司的满意度；数据归类后分发，鼓励对事不对人的讨论；局限：调查结果可能不可靠，管理者应关注当前事件与响应率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">调查反馈</strong>（survey feedback）：评估组织成员态度、发现成员间认知差异并消除差异的工具；组织&quot;家庭&quot;（工作单元管理者及其直接下属）的参与最重要；问卷涵盖决策实践、沟通效果、部门合作及对组织、工作、同事、上司的满意度；数据归类后分发，鼓励对事不对人的讨论；局限：调查结果可能不可靠，管理者应关注当前事件与响应率。"},{"t":"过程咨询（process consultation，PC）：让外部顾问帮助客户（常为管理者）通过\"共同破解正在发生的事件\"建立关系、共同选择下一步行动；与敏感性训练相似（都重视人际协调与参与）但更以任务为导向；顾问不解决具体问题而是作为指导者和教练，帮助管理者提升分析流程的能力（顾问离开后仍可运用）；因管理者亲自参与诊断和方案制定，更可能支持行动计划。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">过程咨询</strong>（process consultation，PC）：让外部顾问帮助客户（常为管理者）通过&quot;共同破解正在发生的事件&quot;建立关系、共同选择下一步行动；与敏感性训练相似（都重视人际协调与参与）但更以任务为导向；顾问不解决具体问题而是作为指导者和教练，帮助管理者提升分析流程的能力（顾问离开后仍可运用）；因管理者亲自参与诊断和方案制定，更可能支持行动计划。"},{"t":"团队建设（team building）：利用高度互动的群体活动增进团队成员间的信任和坦诚、改进协作、提高团队绩效；侧重群体内团队（组织\"家庭\"、委员会、项目团队、自我管理型团队等）；通常包括目标设置、人际关系开发、角色分析（明确成员角色与责任）、团队过程分析。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">团队建设</strong>（team building）：利用高度互动的群体活动增进团队成员间的信任和坦诚、改进协作、提高团队绩效；侧重群体内团队（组织&quot;家庭&quot;、委员会、项目团队、自我管理型团队等）；通常包括目标设置、人际关系开发、角色分析（明确成员角色与责任）、团队过程分析。"},{"t":"群际发展（intergroup development）：致力于改变不同群体对彼此的态度、观念和刻板印象；与多元化培训不同，聚焦组织内职位、部门或分工的差异而非人口特征差异；最常用解决问题法——各群体分别列出自我认识、对其他群体的认识、自认为其他群体如何看待自己，共享并讨论异同、认真阐述差异并寻找分歧根源（目标是否冲突、认知是否歪曲、刻板印象的成因、意图误解、概念定义差异等），找到根源后进入整合阶段制定改进方案，可组建亚群体深入诊断。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">群际发展</strong>（intergroup development）：致力于改变不同群体对彼此的态度、观念和刻板印象；与多元化培训不同，聚焦组织内职位、部门或分工的差异而非人口特征差异；最常用解决问题法——各群体分别列出自我认识、对其他群体的认识、自认为其他群体如何看待自己，共享并讨论异同、认真阐述差异并寻找分歧根源（目标是否冲突、认知是否歪曲、刻板印象的成因、意图误解、概念定义差异等），找到根源后进入整合阶段制定改进方案，可组建亚群体深入诊断。"},{"t":"肯定式探询（appreciative inquiry，AI）：大多数OD方法以问题为中心，AI则强调积极方面——发现组织的独特品质和优势，作为改进绩效的基础，关注成功而非问题；四步骤（通常在大型群体会议中用两三天完成，由受训变革推动者监控指导）：①发现——找出大家认为的\"组织优势\"，请员工讲述组织最有效的时期；②梦想——基于发现阶段的信息思考组织的未来；③设计——为未来找到共同愿景、就独特品质达成共识；④命运——确定如何实现梦想，制定行动计划与实施方案；GTE、Roadway快运、美国运通、美国海军等已证明其有效（美国运通借此振兴组织文化，改进了财务预测、IT投资和绩效管理工具）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">肯定式探询</strong>（appreciative inquiry，AI）：大多数OD方法以问题为中心，AI则强调积极方面——发现组织的独特品质和优势，作为改进绩效的基础，关注成功而非问题；四步骤（通常在大型群体会议中用两三天完成，由受训变革推动者监控指导）：①发现——找出大家认为的&quot;组织优势&quot;，请员工讲述组织最有效的时期；②梦想——基于发现阶段的信息思考组织的未来；③设计——为未来找到共同愿景、就独特品质达成共识；④命运——确定如何实现梦想，制定行动计划与实施方案；GTE、Roadway快运、美国运通、美国海军等已证明其有效（美国运通借此振兴组织文化，改进了财务预测、IT投资和绩效管理工具）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">18.3.4 组织发展</strong>（organizational development，OD）"}],"k":"sec","i":0,"h":"<strong class=\"lead\">18.3 管理组织变革的方法</strong>（四种）"},{"t":"18.4 创建一种支持变革的文化（三种方法：管理矛盾、激发创新文化、创建学习型组织）","c":[{"t":"18.4.1 管理矛盾","c":[{"t":"矛盾意味着平衡各种行动过程之间的张力；优先事项随时间变化，是不断寻找平衡点的动态平衡过程（如骑自行车必须保持向前动力否则摔倒）；从这一角度不存在独立的\"变革管理\"学科，因为所有管理都在处理持续的变革与适应。","c":[],"k":"b","i":2,"h":"矛盾意味着平衡各种行动过程之间的张力；优先事项随时间变化，是不断寻找平衡点的动态平衡过程（如骑自行车必须保持向前动力否则摔倒）；从这一角度不存在独立的&quot;变革管理&quot;学科，因为所有管理都在处理持续的变革与适应。"},{"t":"矛盾理论（paradox theory）：管理中的关键矛盾在于，一个组织并没有最终的最佳状态——随环境和成员变化，不同要素的重要性也在改变。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">矛盾理论</strong>（paradox theory）：管理中的关键矛盾在于，一个组织并没有最终的最佳状态——随环境和成员变化，不同要素的重要性也在改变。"},{"t":"四种关键矛盾：学习（建立在过去的基础上，同时又要拒绝这一基础）；组织（既要求设定方向和领导，又需要授权和灵活性）；执行（既需创建共同目标集中力量，又需承认内外部利益相关者的不同目标）；归属感（既需建立集体认同感，又有作为独立个体被承认和接受的愿望）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">四种关键矛盾</strong>：学习（建立在过去的基础上，同时又要拒绝这一基础）；组织（既要求设定方向和领导，又需要授权和灵活性）；执行（既需创建共同目标集中力量，又需承认内外部利益相关者的不同目标）；归属感（既需建立集体认同感，又有作为独立个体被承认和接受的愿望）。"},{"t":"结论：整体思考并意识到平衡矛盾因素重要性的管理者，可以更高效地在下属中建立适应性和创造性行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：整体思考并意识到平衡矛盾因素重要性的管理者，可以更高效地在下属中建立适应性和创造性行为。"}],"k":"b","i":1,"h":"18.4.1 管理矛盾"},{"t":"18.4.2 激发创新文化","c":[{"t":"创新（innovation）：一种用于发明或改进一项产品、工艺或服务的更具体的变革类型，目标是更好的解决方案；所有创新都是变革，但不是所有变革都带来新观念或显著改进（小到上网本，大到丰田燃料电池普锐斯）；戈尔公司例：扁平独特的网格式\"开放式分配结构\"，员工每天10%的时间用于创造性任务。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">创新</strong>（innovation）：一种用于发明或改进一项产品、工艺或服务的更具体的变革类型，目标是更好的解决方案；所有创新都是变革，但不是所有变革都带来新观念或显著改进（小到上网本，大到丰田燃料电池普锐斯）；戈尔公司例：扁平独特的网格式&quot;开放式分配结构&quot;，员工每天10%的时间用于创造性任务。"},{"t":"创新的来源——结构变量（四条结论）：①有机结构对创新有积极影响（纵向层级少、正规化和集权化程度低，促进灵活性、适应性和互动）；②对创新意愿的奖励对创新有积极影响（创造力得到奖励、员工自主工作并给自己绩效反馈时公司更具创新性）；③丰裕的资源孕育创新（充足且公平分配的资源使组织能购买创新成果、承担创新费用、承受创新失败）；④创新组织中部门间沟通十分密切（委员会、特别任务团队、跨职能团队等互动机制）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">创新的来源——结构变量</strong>（四条结论）：①有机结构对创新有积极影响（纵向层级少、正规化和集权化程度低，促进灵活性、适应性和互动）；②对创新意愿的奖励对创新有积极影响（创造力得到奖励、员工自主工作并给自己绩效反馈时公司更具创新性）；③丰裕的资源孕育创新（充足且公平分配的资源使组织能购买创新成果、承担创新费用、承受创新失败）；④创新组织中部门间沟通十分密切（委员会、特别任务团队、跨职能团队等互动机制）。"},{"t":"环境与创新——创新型文化的特征：鼓励尝试与实验；既奖励成功也奖励失败；赞赏犯错误（太多组织只因\"没有失败\"而非\"获得成功\"给予奖励，抑制冒险创新）；共享愿景与潜在目标、共同的使命感；更有凝聚力、相互支持。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">环境与创新——创新型文化的特征</strong>：鼓励尝试与实验；既奖励成功也奖励失败；赞赏犯错误（太多组织只因&quot;没有失败&quot;而非&quot;获得成功&quot;给予奖励，抑制冒险创新）；共享愿景与潜在目标、共同的使命感；更有凝聚力、相互支持。"},{"t":"人力资源实践：积极培训开发员工使其跟上时代；提供工作安全保障使员工不惧因犯错被解雇；鼓励员工成为变革的倡导者（强调员工承诺的工作制度可提高团队创造力，在凝聚力强的团队中更明显）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人力资源实践</strong>：积极培训开发员工使其跟上时代；提供工作安全保障使员工不惧因犯错被解雇；鼓励员工成为变革的倡导者（强调员工承诺的工作制度可提高团队创造力，在凝聚力强的团队中更明显）。"},{"t":"创意倡导者（idea champion）：新想法出现时积极热情地宣扬、提供支持、克服阻力、确保顺利推行；人格特征相似：非常自信、坚忍不拔、精力充沛、敢于冒险；具备变革型领导相似的特质（对创新有愿景并以使命感鼓舞他人）；善于获得认同和承诺；岗位通常提供较大决策自主权；让有创造性的人负责日常行政事务会削弱其对变革的热情。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">创意倡导者</strong>（idea champion）：新想法出现时积极热情地宣扬、提供支持、克服阻力、确保顺利推行；人格特征相似：非常自信、坚忍不拔、精力充沛、敢于冒险；具备变革型领导相似的特质（对创新有愿景并以使命感鼓舞他人）；善于获得认同和承诺；岗位通常提供较大决策自主权；让有创造性的人负责日常行政事务会削弱其对变革的热情。"},{"t":"创意倡导者的文化差异：集体主义文化倾向用跨职能团队实施创新；高权力距离文化中期望倡导者与位高权重者紧密合作以先获支持；高不确定性规避社会中倡导者应在组织规章制度许可范围内开展工作（俄罗斯的倡导者或可绕过程序成功，奥地利、丹麦、德国等高不确定性规避文化中严守预算和程序才更有效）；例：菲亚特克莱斯勒CEO马尔基翁内以扁平化组织推进产品线创新。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">创意倡导者的文化差异</strong>：集体主义文化倾向用跨职能团队实施创新；高权力距离文化中期望倡导者与位高权重者紧密合作以先获支持；高不确定性规避社会中倡导者应在组织规章制度许可范围内开展工作（俄罗斯的倡导者或可绕过程序成功，奥地利、丹麦、德国等高不确定性规避文化中严守预算和程序才更有效）；例：菲亚特克莱斯勒CEO马尔基翁内以扁平化组织推进产品线创新。"}],"k":"b","i":1,"h":"18.4.2 激发创新文化"},{"t":"18.4.3 创建学习型组织","c":[{"t":"学习型组织（learning organization）：一个能够持续适应和变革的组织（正如个体要学习，组织也要学习）；学习型组织问卷维度（DLOQ）被国际广泛采用，用于评估对学习型组织原则的承诺程度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">学习型组织</strong>（learning organization）：一个能够持续适应和变革的组织（正如个体要学习，组织也要学习）；学习型组织问卷维度（DLOQ）被国际广泛采用，用于评估对学习型组织原则的承诺程度。"},{"t":"五个基本特征（图表18-6）：①有一个大家都认同的共同愿景；②在解决问题或工作时，摒弃旧的思维方式和常规程序；③成员将所有组织流程、活动、职能以及与环境的互动视为相互关系系统的组成部分；④成员（跨越纵向和横向界限）开诚布公地沟通，不必担心受到批评或惩罚；⑤成员把个人利益和狭隘的部门利益放在次要位置，齐心协力实现组织的共同愿景。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">五个基本特征</strong>（图表18-6）：①有一个大家都认同的共同愿景；②在解决问题或工作时，摒弃旧的思维方式和常规程序；③成员将所有组织流程、活动、职能以及与环境的互动视为相互关系系统的组成部分；④成员（跨越纵向和横向界限）开诚布公地沟通，不必担心受到批评或惩罚；⑤成员把个人利益和狭隘的部门利益放在次要位置，齐心协力实现组织的共同愿景。"},{"t":"学习型组织旨在解决传统组织固有的三个基本问题：分割（工作专门化制造\"城墙\"和\"壁垒\"）、竞争（管理者、分部、团队间互争，削弱协作与知识分享）、应对（只注重解决问题而非创造创新，排挤创新和持续改进）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">学习型组织旨在解决传统组织固有的三个基本问题</strong>：分割（工作专门化制造&quot;城墙&quot;和&quot;壁垒&quot;）、竞争（管理者、分部、团队间互争，削弱协作与知识分享）、应对（只注重解决问题而非创造创新，排挤创新和持续改进）。"},{"t":"管理学习三举措：①确定一项战略——表明对变革、创新和持续改进的认同和承诺；②重新设计组织结构——使结构扁平化、取消或合并部门、更多运用跨职能团队以减少隔阂；③重塑组织文化——以行动证明鼓励冒险并允许失败（既奖励抓住机遇的人也奖励犯了错的人），鼓励良性冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理学习三举措</strong>：①确定一项战略——表明对变革、创新和持续改进的认同和承诺；②重新设计组织结构——使结构扁平化、取消或合并部门、更多运用跨职能团队以减少隔阂；③重塑组织文化——以行动证明鼓励冒险并允许失败（既奖励抓住机遇的人也奖励犯了错的人），鼓励良性冲突。"}],"k":"b","i":1,"h":"18.4.3 创建学习型组织"},{"t":"18.4.4 组织变革和压力","c":[{"t":"组织变革常给员工带来压力，因为员工将变革的某些方面看成威胁；这些员工更可能辞职（一定程度上是对压力的反应）。","c":[],"k":"b","i":2,"h":"组织变革常给员工带来压力，因为员工将变革的某些方面看成威胁；这些员工更可能辞职（一定程度上是对压力的反应）。"},{"t":"领导作用至关重要：变革型领导可影响员工情感，使员工更愿意投入变革且不把变革视为压力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">领导作用至关重要</strong>：变革型领导可影响员工情感，使员工更愿意投入变革且不把变革视为压力。"},{"t":"管理者可强化员工的积极变革导向：通过角色澄清和持续奖励提高自我效能；让员工从计划到实施全程参与变革，增强控制感和积极态度；增加沟通、提供社会支持以提升心理适应力、训练情绪调节。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理者可强化员工的积极变革导向</strong>：通过角色澄清和持续奖励提高自我效能；让员工从计划到实施全程参与变革，增强控制感和积极态度；增加沟通、提供社会支持以提升心理适应力、训练情绪调节。"},{"t":"在制定变革计划前具有积极变革导向的人，较少把变革视为不公平或具有威胁性。","c":[],"k":"b","i":2,"h":"在制定变革计划前具有积极变革导向的人，较少把变革视为不公平或具有威胁性。"}],"k":"b","i":1,"h":"18.4.4 组织变革和压力"},{"t":"章末小结（变革部分）并入本节：变革的必要性贯穿全书——现实世界动荡，组织及其成员必须经受住动态变革；作为管理者，你是组织中的变革推动者，你制定的决策和塑造的行为榜样将塑造组织中的变革文化；你的管理政策和活动决定组织能在多大程度上了解并适应不断变化的环境因素。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">章末小结</strong>（变革部分）并入本节：变革的必要性贯穿全书——现实世界动荡，组织及其成员必须经受住动态变革；作为管理者，你是组织中的变革推动者，你制定的决策和塑造的行为榜样将塑造组织中的变革文化；你的管理政策和活动决定组织能在多大程度上了解并适应不断变化的环境因素。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">18.4 创建一种支持变革的文化</strong>（三种方法：管理矛盾、激发创新文化、创建学习型组织）"},{"t":"18.5 工作压力","c":[{"t":"引入：对多数人而言工作是生活中的主要压力来源之一；APA调查显示压力最主要的来源依次为：经济担忧（64%）、工作（60%）、家庭责任（47%）、健康忧虑（46%）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">引入</strong>：对多数人而言工作是生活中的主要压力来源之一；APA调查显示压力最主要的来源依次为：经济担忧（64%）、工作（60%）、家庭责任（47%）、健康忧虑（46%）。"},{"t":"18.5.1 什么是压力","c":[{"t":"压力（stress）：一种动态条件——个体面临着自己重视和渴望的机遇、要求或资源，但对于自己能否获得或满足却无法确定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">压力</strong>（stress）：一种动态条件——个体面临着自己重视和渴望的机遇、要求或资源，但对于自己能否获得或满足却无法确定。"},{"t":"压力可积极可消极：面对压力时神经系统与内分泌系统释放激素帮助应对（心跳加速、呼吸急促、肌肉紧张），运动员或演员在\"紧急关头\"常有更佳表现；消极情况下压力有害——干扰身体运转、血压升高、心律不稳定、无法正常讲话和思考。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">压力可积极可消极</strong>：面对压力时神经系统与内分泌系统释放激素帮助应对（心跳加速、呼吸急促、肌肉紧张），运动员或演员在&quot;紧急关头&quot;常有更佳表现；消极情况下压力有害——干扰身体运转、血压升高、心律不稳定、无法正常讲话和思考。"},{"t":"挑战性压力源（challenge stressor）：工作负载、完成任务的紧迫性、时间紧迫性等因素造成的压力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">挑战性压力源</strong>（challenge stressor）：工作负载、完成任务的紧迫性、时间紧迫性等因素造成的压力。"},{"t":"阻断性压力源（hindrance stressor）：阻碍你达成目标的压力诱发因素（官僚作风、办公室政治、工作责任不清晰）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">阻断性压力源</strong>（hindrance stressor）：阻碍你达成目标的压力诱发因素（官僚作风、办公室政治、工作责任不清晰）。"},{"t":"两类压力源的比较：都导致紧张，但阻断性压力源带来的紧张程度更高；挑战性压力源带来更高的动机、投入和绩效水平；阻断性压力源对安全服从性、参与度、敬业度、工作满意度、组织承诺、绩效和退缩行为的负面影响更多；时间压力和学习要求属于挑战性压力源，可帮助员工学习和成长。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两类压力源的比较</strong>：都导致紧张，但阻断性压力源带来的紧张程度更高；挑战性压力源带来更高的动机、投入和绩效水平；阻断性压力源对安全服从性、参与度、敬业度、工作满意度、组织承诺、绩效和退缩行为的负面影响更多；时间压力和学习要求属于挑战性压力源，可帮助员工学习和成长。"},{"t":"要求和资源：要求（demand）是个体在工作场所面临的责任、压力、义务以及不确定性；资源（resource）是个体所控制的、可用来满足各种要求的因素。要求-资源模型：拥有资源对化解压力有重要作用，要求则增大压力；社会支持这类资源长期看可能比其他资源更重要（荷兰小学教师研究：校长表现出变革型领导行为时，教师参与度在挑战性压力源下得以维持、在阻断性要求下得到缓冲）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">要求和资源</strong>：要求（demand）是个体在工作场所面临的责任、压力、义务以及不确定性；资源（resource）是个体所控制的、可用来满足各种要求的因素。要求-资源模型：拥有资源对化解压力有重要作用，要求则增大压力；社会支持这类资源长期看可能比其他资源更重要（荷兰小学教师研究：校长表现出变革型领导行为时，教师参与度在挑战性压力源下得以维持、在阻断性要求下得到缓冲）。"},{"t":"异位平衡（allostasis）：不存在单一的理想稳定状态；个体通过改变自身行为和态度来寻求稳定性；异位平衡负载指在给定所利用资源的情况下压力源对我们的累积影响——负载不太大时可能愿意体验更多压力以提高调动资源的能力，负载太大或持续过长则出现心理或生理应激症状；对压力的偏好呈周期变化（有时想放松恢复，有时欢迎更多刺激和挑战）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">异位平衡</strong>（allostasis）：不存在单一的理想稳定状态；个体通过改变自身行为和态度来寻求稳定性；异位平衡负载指在给定所利用资源的情况下压力源对我们的累积影响——负载不太大时可能愿意体验更多压力以提高调动资源的能力，负载太大或持续过长则出现心理或生理应激症状；对压力的偏好呈周期变化（有时想放松恢复，有时欢迎更多刺激和挑战）。"}],"k":"b","i":1,"h":"18.5.1 什么是压力"},{"t":"18.5.2 工作中潜在的压力源（图表18-8压力模型：潜在压力源→个体差异与文化差异→感受到压力→生理/心理/行为症状）","c":[{"t":"环境因素（不确定性是人们难以适应组织变革的最主要原因，有三类）：","c":[{"t":"经济的不确定性：商业周期变化——经济紧缩时担忧工作稳定性。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">经济的不确定性</strong>：商业周期变化——经济紧缩时担忧工作稳定性。"},{"t":"政治的不确定性：政治体制越不稳定变化越无序，压力越强（美国、加拿大弱于海地、委内瑞拉；政治变革或威胁在所有国家都带来压力）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">政治的不确定性</strong>：政治体制越不稳定变化越无序，压力越强（美国、加拿大弱于海地、委内瑞拉；政治变革或威胁在所有国家都带来压力）。"},{"t":"技术的变革：创新使员工技能和经验迅速过时，跟上最新技术是额外挑战。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">技术的变革</strong>：创新使员工技能和经验迅速过时，跟上最新技术是额外挑战。"}],"k":"b","i":2,"h":"<strong class=\"lead\">环境因素</strong>（不确定性是人们难以适应组织变革的最主要原因，有三类）："},{"t":"组织因素（由管理层控制）：","c":[{"t":"任务要求：与工作岗位有关——工作设计（自主程度、任务多样性、自动化程度）、工作条件、工作环境；最相关的因素是需要完成的工作量，其次是最后期限的紧迫程度；拥挤、充满干扰的办公场所引发焦虑。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">任务要求</strong>：与工作岗位有关——工作设计（自主程度、任务多样性、自动化程度）、工作条件、工作环境；最相关的因素是需要完成的工作量，其次是最后期限的紧迫程度；拥挤、充满干扰的办公场所引发焦虑。"},{"t":"角色要求：扮演特定角色带来的压力——角色冲突（存在难以调和或满足的期望）、角色过载（被期望做的事情太多）、角色模糊（角色预期不明确，不知道该做什么）；角色面临较高情境限制（固定工作时间、苛刻职责）时更难主动化解压力。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">角色要求</strong>：扮演特定角色带来的压力——角色冲突（存在难以调和或满足的期望）、角色过载（被期望做的事情太多）、角色模糊（角色预期不明确，不知道该做什么）；角色面临较高情境限制（固定工作时间、苛刻职责）时更难主动化解压力。"},{"t":"人际要求：由其他员工带来的压力——同事和主管的消极行为（打架、霸凌、虐待性监督、不文明行为、种族歧视、性骚扰）与工作压力关系密切；不公平对待会引发皮质醇释放；社会排斥可能比人际冲突带来更多负面影响。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">人际要求</strong>：由其他员工带来的压力——同事和主管的消极行为（打架、霸凌、虐待性监督、不文明行为、种族歧视、性骚扰）与工作压力关系密切；不公平对待会引发皮质醇释放；社会排斥可能比人际冲突带来更多负面影响。"}],"k":"b","i":2,"h":"<strong class=\"lead\">组织因素</strong>（由管理层控制）："},{"t":"个人因素：家庭问题（家庭中的事哪怕是好事都可能带来压力；与工作-生活冲突相互恶化形成恶性循环）和个人经济问题（收入高低都可能不善理财；年收入低于5万美元者确实承受更多压力）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个人因素</strong>：家庭问题（家庭中的事哪怕是好事都可能带来压力；与工作-生活冲突相互恶化形成恶性循环）和个人经济问题（收入高低都可能不善理财；年收入低于5万美元者确实承受更多压力）。"},{"t":"职业目标专栏（哈基姆之问：如何降低团队整体压力）：让团队专注于共同目标以减少内部斗争；回顾团队已完成的进展使成员感觉更好；紧张到顶点时让大家暂时休息以获得新视角；不应靠降低标准减压，而应减少反生产组织行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">职业目标专栏</strong>（哈基姆之问：如何降低团队整体压力）：让团队专注于共同目标以减少内部斗争；回顾团队已完成的进展使成员感觉更好；紧张到顶点时让大家暂时休息以获得新视角；不应靠降低标准减压，而应减少反生产组织行为。"},{"t":"压力源具有累加性：压力可以积累和加强，每个持续的新压力源都会增加压力程度；单个相对不重要的压力源在压力水平已高时可能成为压垮骆驼的最后一根稻草；评估员工压力总量必须将所有压力源及其严重程度考虑在内，尤其注意不易量化的组织因素。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">压力源具有累加性</strong>：压力可以积累和加强，每个持续的新压力源都会增加压力程度；单个相对不重要的压力源在压力水平已高时可能成为压垮骆驼的最后一根稻草；评估员工压力总量必须将所有压力源及其严重程度考虑在内，尤其注意不易量化的组织因素。"}],"k":"b","i":1,"h":"<strong class=\"lead\">18.5.2 工作中潜在的压力源</strong>（图表18-8压力模型：潜在压力源→个体差异与文化差异→感受到压力→生理/心理/行为症状）"},{"t":"18.5.3 个体差异（潜在压力与实际压力之间的四个调节变量）","c":[{"t":"认知：员工的反应基于对现实的认知而非现实本身——裁员时有人担心失业，有人视为发展机会；认为巨大压力事件\"都会过去\"的人应对更好；产生压力的可能性取决于员工对客观条件的认知而非客观条件本身。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">认知</strong>：员工的反应基于对现实的认知而非现实本身——裁员时有人担心失业，有人视为发展机会；认为巨大压力事件&quot;都会过去&quot;的人应对更好；产生压力的可能性取决于员工对客观条件的认知而非客观条件本身。"},{"t":"工作经验：与工作压力负相关。解释一：选择性退缩——承受更大压力的人更可能主动辞职，留下的往往是抗压能力强的人；解释二：人们随时间发展出抗压机制，资深成员更适应、感觉压力较小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工作经验</strong>：与工作压力负相关。解释一：选择性退缩——承受更大压力的人更可能主动辞职，留下的往往是抗压能力强的人；解释二：人们随时间发展出抗压机制，资深成员更适应、感觉压力较小。"},{"t":"社会支持：个体与同事或上级主管的融洽关系能减轻压力的影响——压力文献中记录最充分的关系；起缓和剂作用，即便对高度紧张的工作也有效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社会支持</strong>：个体与同事或上级主管的融洽关系能减轻压力的影响——压力文献中记录最充分的关系；起缓和剂作用，即便对高度紧张的工作也有效。"},{"t":"人格特质：神经质（研究最广泛）的个体更容易感受心理压力、更易在工作环境中发现压力源、更倾向逃避式应对；工作狂（沉溺于工作、非工作时间也思考工作、通过创造额外职责满足冲动的人）看似完美员工，但努力工作与强迫性工作有差别——工作狂不一定更高产，反而带来劳累、更多的工作-生活冲突和心理倦怠。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人格特质</strong>：神经质（研究最广泛）的个体更容易感受心理压力、更易在工作环境中发现压力源、更倾向逃避式应对；工作狂（沉溺于工作、非工作时间也思考工作、通过创造额外职责满足冲动的人）看似完美员工，但努力工作与强迫性工作有差别——工作狂不一定更高产，反而带来劳累、更多的工作-生活冲突和心理倦怠。"}],"k":"b","i":1,"h":"<strong class=\"lead\">18.5.3 个体差异</strong>（潜在压力与实际压力之间的四个调节变量）"},{"t":"18.5.4 文化差异","c":[{"t":"导致压力的工作条件因文化而异：美国员工因缺乏对工作的控制感到压力，中国员工因工作评估和缺乏培训感到压力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">导致压力的工作条件因文化而异</strong>：美国员工因缺乏对工作的控制感到压力，中国员工因工作评估和缺乏培训感到压力。"},{"t":"人格对压力的影响不因文化而异：A型人格特征能以同样程度预测匈牙利、意大利、英国、以色列、美国员工的压力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人格对压力的影响不因文化而异</strong>：A型人格特征能以同样程度预测匈牙利、意大利、英国、以色列、美国员工的压力。"},{"t":"个人主义国家（美国、加拿大、英国）的个体因工作影响家庭生活而产生更大压力；集体主义文化（亚洲和拉美）中加班被视为有利于家庭的牺牲，个人主义文化中工作被视为需要家庭做出牺牲的个人成就方式。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个人主义国家</strong>（美国、加拿大、英国）的个体因工作影响家庭生活而产生更大压力；集体主义文化（亚洲和拉美）中加班被视为有利于家庭的牺牲，个人主义文化中工作被视为需要家庭做出牺牲的个人成就方式。"}],"k":"b","i":1,"h":"18.5.4 文化差异"}],"k":"sec","i":0,"h":"18.5 工作压力"},{"t":"18.6 工作压力的后果（图表18-8右侧三大类症状）","c":[{"t":"生理症状：新陈代谢紊乱、心率和呼吸频率加快、血压升高、头痛、易患心脏病；还包括背疼、眼睛疲劳、睡眠障碍、头晕、疲劳、食欲不振、肠胃问题；与上级消极互动导致血压升高且难以从工作中恢复；心理要求和过度承诺带来皮质醇水平显著提高。","c":[{"t":"\"传言还是科学：为了工作可以牺牲睡眠\"——错误。睡眠不足削弱学习技能和寻找解决方案的能力，是心脏病、肥胖、中风等疾病的诱因，引发事故（如印度航空812号航班空难）；美国多数行业约1/3的人每晚睡眠少于6小时（建议7~9小时）；安眠药只能增加11分钟睡眠且造成暂时性失忆，咖啡因摄入会逐渐失效；什么也代替不了充足安稳的睡眠。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">&quot;传言还是科学</strong>：为了工作可以牺牲睡眠&quot;——错误。睡眠不足削弱学习技能和寻找解决方案的能力，是心脏病、肥胖、中风等疾病的诱因，引发事故（如印度航空812号航班空难）；美国多数行业约1/3的人每晚睡眠少于6小时（建议7~9小时）；安眠药只能增加11分钟睡眠且造成暂时性失忆，咖啡因摄入会逐渐失效；什么也代替不了充足安稳的睡眠。"}],"k":"b","i":1,"h":"<strong class=\"lead\">生理症状</strong>：新陈代谢紊乱、心率和呼吸频率加快、血压升高、头痛、易患心脏病；还包括背疼、眼睛疲劳、睡眠障碍、头晕、疲劳、食欲不振、肠胃问题；与上级消极互动导致血压升高且难以从工作中恢复；心理要求和过度承诺带来皮质醇水平显著提高。"},{"t":"心理症状：对工作不满意是明显原因；还表现为紧张、焦虑、易怒、枯燥、拖拉；工作要求相互冲突或任务、权限、职责界定不清时，压力和不满意度增加；对工作节奏和速度越缺乏控制力，压力和不满意度越高（63国研究证实）；工作多样化、重要性、自主性、反馈、认同感低时压力增加、满意度降低；并非人人相同——外部控制点的员工获得更高工作自主性反而可能增加压力和倦怠。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">心理症状</strong>：对工作不满意是明显原因；还表现为紧张、焦虑、易怒、枯燥、拖拉；工作要求相互冲突或任务、权限、职责界定不清时，压力和不满意度增加；对工作节奏和速度越缺乏控制力，压力和不满意度越高（63国研究证实）；工作多样化、重要性、自主性、反馈、认同感低时压力增加、满意度降低；并非人人相同——外部控制点的员工获得更高工作自主性反而可能增加压力和倦怠。"},{"t":"行为症状：生产率降低；缺勤、安全事件、离职增加；饮食习惯改变；烟酒消费增多；言语速度加快；烦躁；睡眠障碍。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">行为症状</strong>：生产率降低；缺勤、安全事件、离职增加；饮食习惯改变；烟酒消费增多；言语速度加快；烦躁；睡眠障碍。"},{"t":"压力-绩效关系（倒U曲线模型）：逻辑基础是中低水平压力激活机体、增强反应能力，过高压力降低绩效；该模型流行且直观有吸引力，但没有得到太多实证支持——它可能忽略了压力源与对压力的感知之间的联系（有感到压力的理由但因积极调节因素而感觉良好），高情商者能减小压力对绩效的影响；元分析表明角色模糊、角色冲突、角色过载、工作不安全感、环境不确定性、情境限制与工作绩效稳定负相关；支持性环境中挑战性压力可提高绩效，阻断性压力在任何环境中都降低绩效。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">压力-绩效关系</strong>（倒U曲线模型）：逻辑基础是中低水平压力激活机体、增强反应能力，过高压力降低绩效；该模型流行且直观有吸引力，但没有得到太多实证支持——它可能忽略了压力源与对压力的感知之间的联系（有感到压力的理由但因积极调节因素而感觉良好），高情商者能减小压力对绩效的影响；元分析表明角色模糊、角色冲突、角色过载、工作不安全感、环境不确定性、情境限制与工作绩效稳定负相关；支持性环境中挑战性压力可提高绩效，阻断性压力在任何环境中都降低绩效。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">18.6 工作压力的后果</strong>（图表18-8右侧三大类症状）"},{"t":"18.7 管理压力","c":[{"t":"引入：中低水平压力可以是良性的并带来较高绩效，管理层与员工对\"可接受的压力\"可能意见不同（管理层视为\"肾上腺素推动力\"，员工视为\"过度压力\"）；压力会导致糟糕后果（对35家医院4000多名护理人员的研究：12小时无间断轮班期间洗手和安全合规性降低8.7%）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">引入</strong>：中低水平压力可以是良性的并带来较高绩效，管理层与员工对&quot;可接受的压力&quot;可能意见不同（管理层视为&quot;肾上腺素推动力&quot;，员工视为&quot;过度压力&quot;）；压力会导致糟糕后果（对35家医院4000多名护理人员的研究：12小时无间断轮班期间洗手和安全合规性降低8.7%）。"},{"t":"18.7.1 个人途径（四种已证实有效的策略）","c":[{"t":"时间管理技术：①保持记录待办事项清单的习惯；②根据优先级而非自己的能力来安排任务；③首先完成困难的任务；④利用精力集中的时间完成任务；可减少拖延、将精力集中于眼前目标；有条理者完成的任务量可达无条理者的两倍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">时间管理技术</strong>：①保持记录待办事项清单的习惯；②根据优先级而非自己的能力来安排任务；③首先完成困难的任务；④利用精力集中的时间完成任务；可减少拖延、将精力集中于眼前目标；有条理者完成的任务量可达无条理者的两倍。"},{"t":"体育锻炼：非竞技性体育活动（有氧健身、散步、慢跑、游泳、骑自行车）可减少压力带来的有害生理反应，使人更快从压力中恢复。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">体育锻炼</strong>：非竞技性体育活动（有氧健身、散步、慢跑、游泳、骑自行车）可减少压力带来的有害生理反应，使人更快从压力中恢复。"},{"t":"放松技术：自学冥想、正念、深呼吸等达到深度放松状态；每两天一次20分钟深度放松练习可缓解紧张、改善心跳和血压等生理状况；常规工作间隔的短暂休息（午饭间歇、公园散步）可促进心理调整、减轻压力并可能提升绩效；\"恢复中的思考者\"（放松时仍思考工作问题的人）反而能保持较高投入并大幅减小压力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">放松技术</strong>：自学冥想、正念、深呼吸等达到深度放松状态；每两天一次20分钟深度放松练习可缓解紧张、改善心跳和血压等生理状况；常规工作间隔的短暂休息（午饭间歇、公园散步）可促进心理调整、减轻压力并可能提升绩效；&quot;恢复中的思考者&quot;（放松时仍思考工作问题的人）反而能保持较高投入并大幅减小压力。"},{"t":"社会支持网络：与朋友、家人、同事交谈提供释放出口和更客观的看法；但与压力相似的朋友一起沉湎回忆可能陷入恶性循环——应积极主动、正面解决自身压力；家人朋友的支持有助于从紧张工作中恢复。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社会支持网络</strong>：与朋友、家人、同事交谈提供释放出口和更客观的看法；但与压力相似的朋友一起沉湎回忆可能陷入恶性循环——应积极主动、正面解决自身压力；家人朋友的支持有助于从紧张工作中恢复。"}],"k":"b","i":1,"h":"<strong class=\"lead\">18.7.1 个人途径</strong>（四种已证实有效的策略）"},{"t":"18.7.2 组织途径（许多压力源——尤其任务要求和角色要求——由管理层控制，七种策略）","c":[{"t":"改进员工甄选、安置和培训：工作经验较少者或外部控制点者更易产生压力，甄选和安置应把这些因素考虑在内（但不能只雇用此类人）；培训可增强自我效能、缓解工作紧张；临时工面临不确定性和角色模糊的压力风险，应训练对模糊性的容忍度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">改进员工甄选、安置和培训</strong>：工作经验较少者或外部控制点者更易产生压力，甄选和安置应把这些因素考虑在内（但不能只雇用此类人）；培训可增强自我效能、缓解工作紧张；临时工面临不确定性和角色模糊的压力风险，应训练对模糊性的容忍度。"},{"t":"目标设置：具体且富有挑战性的目标加及时反馈，既能激励员工又能减轻工作压力；认同目标、能从工作中找到积极目标的员工压力更少（将压力源视为挑战而非阻碍）；负面反馈后给出学习发展目标比绩效目标更能减少紧张感；目标设置对责任心强的员工减压效果更好，对情绪稳定性差者效果较差。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">目标设置</strong>：具体且富有挑战性的目标加及时反馈，既能激励员工又能减轻工作压力；认同目标、能从工作中找到积极目标的员工压力更少（将压力源视为挑战而非阻碍）；负面反馈后给出学习发展目标比绩效目标更能减少紧张感；目标设置对责任心强的员工减压效果更好，对情绪稳定性差者效果较差。"},{"t":"重新设计工作：提供更多职责、更有意义的工作、更大自主性和更多信息反馈，使员工更好掌控工作、减少对他人的依赖；对成长需求不高的员工，正确的设计或许应减轻职责、提高工作专门化程度；组织应慎重设置让员工24小时随叫随到的安排（远程工作可能影响恢复、增加压力）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">重新设计工作</strong>：提供更多职责、更有意义的工作、更大自主性和更多信息反馈，使员工更好掌控工作、减少对他人的依赖；对成长需求不高的员工，正确的设计或许应减轻职责、提高工作专门化程度；组织应慎重设置让员工24小时随叫随到的安排（远程工作可能影响恢复、增加压力）。"},{"t":"增加员工参与：角色压力很大程度上源于员工对目标、期望、评估方式的不确定；在直接关系绩效的决策中为员工提供发言权，可增强对工作的控制、减轻角色压力；员工参与度和授权实践的增加能减轻心理压力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">增加员工参与</strong>：角色压力很大程度上源于员工对目标、期望、评估方式的不确定；在直接关系绩效的决策中为员工提供发言权，可增强对工作的控制、减轻角色压力；员工参与度和授权实践的增加能减轻心理压力。"},{"t":"改进组织沟通：增强正式组织沟通有助于减少角色模糊和角色冲突、降低不确定性；因员工认知调节压力-反应关系，管理层可用有效沟通塑造员工对要求、机会、威胁的认知。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">改进组织沟通</strong>：增强正式组织沟通有助于减少角色模糊和角色冲突、降低不确定性；因员工认知调节压力-反应关系，管理层可用有效沟通塑造员工对要求、机会、威胁的认知。"},{"t":"让员工轮休：提供更长时间的无薪休假（Genentech、the Container Store、REI、普华永道、高盛、Adobe等），短至几周、长至几个月；休假增加工作资源和幸福感，员工对度假方式有更大自主权时效果更好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">让员工轮休</strong>：提供更长时间的无薪休假（Genentech、the Container Store、REI、普华永道、高盛、Adobe等），短至几周、长至几个月；休假增加工作资源和幸福感，员工对度假方式有更大自主权时效果更好。"},{"t":"制定身心健康计划（wellness program）：通过讲习班帮助员工戒烟戒酒、减肥、改善饮食、制定锻炼计划，关注整体身心状况；元分析表明组织帮助员工重塑压力环境、积极应对压力可显著减压；多数计划假设员工需对自己的身心健康负责，组织是帮助其达到目的的载体；实施组织确实获得回报——强生健康计划10年节省2.5亿美元医疗保健成本，有效计划显著降低离职率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">制定身心健康计划</strong>（wellness program）：通过讲习班帮助员工戒烟戒酒、减肥、改善饮食、制定锻炼计划，关注整体身心状况；元分析表明组织帮助员工重塑压力环境、积极应对压力可显著减压；多数计划假设员工需对自己的身心健康负责，组织是帮助其达到目的的载体；实施组织确实获得回报——强生健康计划10年节省2.5亿美元医疗保健成本，有效计划显著降低离职率。"}],"k":"b","i":1,"h":"<strong class=\"lead\">18.7.2 组织途径</strong>（许多压力源——尤其任务要求和角色要求——由管理层控制，七种策略）"},{"t":"专栏：组织变革期间管理者与员工承受的压力","c":[{"t":"裁员或其他组织变革带来的工作困扰是压力的第二大成因；应对机制分建设性（咨询顾问、健康专家、支持系统）与破坏性（酒精、八卦、反生产工作行为）两类；无法应对的员工会筋疲力尽、走向失业边缘。","c":[],"k":"b","i":2,"h":"裁员或其他组织变革带来的工作困扰是压力的第二大成因；应对机制分建设性（咨询顾问、健康专家、支持系统）与破坏性（酒精、八卦、反生产工作行为）两类；无法应对的员工会筋疲力尽、走向失业边缘。"},{"t":"好的雇主提供员工援助计划（EAP）、聘请专业咨询顾问或由人力资源部提供咨询；但等到问题出现再干预往往不够及时——组织变革等压力源会降低员工投入度；管理者应主动出击、在负面影响出现前提前应对。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">好的雇主提供员工援助计划</strong>（EAP）、聘请专业咨询顾问或由人力资源部提供咨询；但等到问题出现再干预往往不够及时——组织变革等压力源会降低员工投入度；管理者应主动出击、在负面影响出现前提前应对。"},{"t":"道德维度：管理者既要追求生产率最大化，又面临工作量过大增加员工压力的矛盾；短期低成本模式长远会带来流动率增加、生产率降低；专家建议按实际需要雇用员工以确保合理工作量；向员工传授减压技巧、增加绿色植物等小举措都有改善作用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">道德维度</strong>：管理者既要追求生产率最大化，又面临工作量过大增加员工压力的矛盾；短期低成本模式长远会带来流动率增加、生产率降低；专家建议按实际需要雇用员工以确保合理工作量；向员工传授减压技巧、增加绿色植物等小举措都有改善作用。"}],"k":"b","i":1,"h":"<strong class=\"lead\">专栏</strong>：组织变革期间管理者与员工承受的压力"},{"t":"章末小结（压力部分）并入本节——对管理者的启示：有些压力能带来积极影响，工作中的自主性和责任感带来的挑战会增加成就感和满足感；官僚主义、人际冲突等阻断性压力源完全是消极的，应该消除；通过精确匹配员工的工作量、提供应对压力的资源、积极回应员工的担忧来减轻有害压力；绩效下降、流动率上升、健康相关缺勤增加、敬业度下降表明员工压力极大，须对早期迹象保持警惕、积极主动应对。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">章末小结</strong>（压力部分）并入本节——对管理者的启示：有些压力能带来积极影响，工作中的自主性和责任感带来的挑战会增加成就感和满足感；官僚主义、人际冲突等阻断性压力源完全是消极的，应该消除；通过精确匹配员工的工作量、提供应对压力的资源、积极回应员工的担忧来减轻有害压力；绩效下降、流动率上升、健康相关缺勤增加、敬业度下降表明员工压力极大，须对早期迹象保持警惕、积极主动应对。"}],"k":"sec","i":0,"h":"18.7 管理压力"}],"k":"chap","h":"第18章 组织变革与压力管理"}],"k":"part", const TOPKINDS = HAS_CHAP ? ["root", "part"] : ["root"];

// ---------- 导图节点样式与测量 ----------
const ctx = document.createElement("canvas").getContext("2d");
const CFG = {
  root:{ fs:15.5, maxLines:2, maxW:200, bold:true  },
  part:{ fs:13.5, maxLines:2, maxW:185, bold:true  },
  chap:{ fs:12.5, maxLines:2, maxW:190, bold:true  },

  b:   { fs:11,   maxLines:2, maxW:210, bold:false },
};
// 分词：英文/数字串保持完整（可断在连字符后），其余逐字符；避免英文单词被硬切断
function tokenize(t){
  const out = []; const re = /[A-Za-z0-9][A-Za-z0-9'&+./·-]*(?:-[A-Za-z0-9][A-Za-z0-9'&+./·-]*)*-?|\s+|[\s\S]/g;
  let m; while ((m = re.exec(t))) out.push(m[0]);
  return out;
}
function wrapTokens(t, cf){
  const maxW = cf.maxW - 26;
  const W = s => ctx.measureText(s).width;
  const lines = []; let cur = "";
  const pushCur = () => { if (cur){ lines.push(cur.replace(/\s+$/, "")); cur = ""; } };
  for (const tk of tokenize(t)){
    if (/^\s+$/.test(tk)){ if (cur) cur += " "; continue; }
    if (cur && W(cur + tk) > maxW) pushCur();
    if (W(tk) > maxW){                       // 单 token 超宽（超长英文/URL）按字符硬断
      let s = tk;
      while (W(s) > maxW){
        let lo = 1, hi = s.length;
        while (lo < hi){ const mid = (lo + hi + 1) >> 1; if (W(s.slice(0, mid)) <= maxW) lo = mid; else hi = mid - 1; }
        lines.push(s.slice(0, lo)); s = s.slice(lo);
      }
      cur = s; continue;
    }
    cur += tk;
  }
  pushCur();
  if (lines.length <= cf.maxLines) return lines;
  const rest = lines.slice(cf.maxLines - 1).join(" ");
  let last = "";
  for (const tk of tokenize(rest)){
    if (/^\s+$/.test(tk)){ if (last) last += " "; continue; }
    if (W(last + tk + "…") > maxW) break;
    last += tk;
  }
  if (!last){ let s = rest; while (W(s + "…") > maxW && s.length > 1) s = s.slice(0, -1); last = s; }
  return lines.slice(0, cf.maxLines - 1).concat([last + "…"]);
}
walkAll(DATA, n => {
  const cf = CFG[n.k] || CFG.b;
  ctx.font = (cf.bold ? "600 " : "") + cf.fs + 'px -apple-system,"PingFang SC",sans-serif';
  n._lines = wrapTokens(n.t, cf);
  n._lw = Math.max.apply(null, n._lines.map(l => ctx.measureText(l).width));
  n._w = Math.min(cf.maxW, n._lw + 24);
  n._h = n._lines.length * (cf.fs * 1.32) + 10;
  n.open = TOPKINDS.indexOf(n.k) >= 0;
});

(function(){
  let x = 0;
  for (const k of ["root", "part", "chap", "sec"]){
    let mw = 120;
    walkAll(DATA, n => { if (n.k === k) mw = Math.max(mw, n._w); });
    x += mw + 48; colX.push(x);
  }
  for (let d = 4; d <= 9; d++){ colX.push(x); x += 120; }
})();
const colXOf = d => colX[Math.min(d, colX.length - 1)] + (d > 9 ? (d - 9) * 0 : 0);

// ---------- 布局 + 渲染 ----------
const svg = document.getElementById("svg"), vp = document.getElementById("vp");
let cursorY = 0, lastMaxX = 300, vis = [];
function layout(n, depth){
  n._d = depth; n._x = colXOf(depth);
  const kids = (n.c && n.open) ? n.c : [];
  if (!kids.length){ n._y = cursorY + n._h / 2 + 6; cursorY += n._h + 12; return n._y; }
  const ys = kids.map(k => layout(k, depth + 1));
  n._y = (ys[0] + ys[ys.length - 1]) / 2;
  return n._y;
}
function esc(s){ return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function renderMap(){
  cursorY = 0; vis = [];
  layout(DATA, 0);
  let links = "", nodes = "";
  (function link(n){
    const kids = (n.c && n.open) ? n.c : [];
    for (const k of kids){
      const x1 = n._x + n._w, y1 = n._y, x2 = k._x, y2 = k._y;
      const dx = Math.max(24, (x2 - x1) * 0.5);
      const col = partColor(k);
      const op = ((k.k === "part" || k.k === "chap") ? 0.75 : 0.32) * (_searchOn && !k._hit && !k._path ? 0.15 : 1);
      const sw = k.k === "part" ? 2.6 : (k.k === "chap" ? 1.8 : 1.3);
      links += '<path d="M' + x1 + ',' + y1.toFixed(1) + ' C' + (x1 + dx) + ',' + y1.toFixed(1) + ' ' +
               (x2 - dx) + ',' + y2.toFixed(1) + ' ' + x2 + ',' + y2.toFixed(1) +
               '" fill="none" stroke="' + col + '" stroke-opacity="' + op + '" stroke-width="' + sw + '"/>';
      link(k);
    }
  })(DATA);
  (function draw(n){
    vis.push(n);
    lastMaxX = Math.max(lastMaxX, n._x + n._w);
    const cf = CFG[n.k] || CFG.b, col = partColor(n);
    const dark = n.k === "root" || n.k === "part";
    const fill = dark ? (n.k === "root" ? "#2f3440" : col) : "#ffffff";
    const hit = !!n._hit;
    const dim = _searchOn && !hit && !n._path;
    const stroke = hit ? "#e25563" : (dark ? "none" : (n.k === "chap" ? col : (n.k === "sec" ? "#dcdcd5" : "#eceae4")));
    const sw = hit ? 2.2 : (dark ? 0 : (n.k === "chap" ? 1.7 : 1.4));
    const txt = dark ? "#fff" : (n.k === "chap" ? "#1f1f1f" : "#3d3d38");
    let tspans = "";
    n._lines.forEach((l, i) => {
      tspans += '<tspan x="' + (n._x + 12) + '" y="' + (n._y - n._h / 2 + cf.fs * 1.32 * (i + 0.82)).toFixed(1) + '">' + esc(l) + '</tspan>';
    });
    const dashAttr = hit ? ' stroke-dasharray="5 3"' : "";
    nodes += '<g class="pill" style="cursor:' + ((n.c && n.c.length) ? "pointer" : "default") + '"' + (dim ? ' opacity="0.18"' : "") + '>' +
      '<rect x="' + n._x + '" y="' + (n._y - n._h / 2).toFixed(1) + '" width="' + n._w.toFixed(1) +
      '" height="' + n._h.toFixed(1) + '" rx="7" fill="' + fill + '" stroke="' + stroke +
      '" stroke-width="' + sw + '"' + dashAttr + '/>' +
      '<text font-size="' + cf.fs + '" font-weight="' + (cf.bold ? 600 : 400) + '" fill="' + txt + '">' + tspans + '</text>' +
      '<title>' + esc(n.t) + '</title></g>';
    ((n.c && n.open) ? n.c : []).forEach(draw);
  })(DATA);
  vp.innerHTML = links + nodes;
  const gs = vp.querySelectorAll("g.pill");
  gs.forEach((g, i) => {
    g.addEventListener("click", e => {
      const n = vis[i];
      if (!n || !n.c || !n.c.length) return;
      e.stopPropagation();
      n.open = !n.open;
      renderMap();
      const bb = svg.getBoundingClientRect();
      tf.y = bb.height / 2 - n._y * tf.s;
      const sx = n._x * tf.s + tf.x;
      if (sx < 60) tf.x += 60 - sx;
      applyTf();
    });
  });
}

// ---------- 缩放平移 ----------
let tf = { x: 0, y: 0, s: 1 };
function applyTf(){ vp.setAttribute("transform", "translate(" + tf.x + "," + tf.y + ") scale(" + tf.s + ")"); }
function fitView(){
  const bb = svg.getBoundingClientRect();
  const h = Math.max(cursorY, 120), w = Math.max(lastMaxX + 60, 400);
  const s = Math.max(0.15, Math.min((bb.width - 70) / w, (bb.height - 70) / h, 0.85));
  tf = { s: s, x: (bb.width - w * s) / 2, y: (bb.height - h * s) / 2 };
  applyTf();
}
const viewMap = document.getElementById("viewMap");
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const bb = svg.getBoundingClientRect(), mx = e.clientX - bb.left, my = e.clientY - bb.top;
  tf.x = mx - (mx - tf.x) * k; tf.y = my - (my - tf.y) * k;
  tf.s = Math.min(3, Math.max(0.08, tf.s * k));
  applyTf();
}, { passive: false });
let drag = null;
svg.addEventListener("mousedown", e => { drag = { x: e.clientX, y: e.clientY, tx: tf.x, ty: tf.y }; viewMap.classList.add("dragging"); });
window.addEventListener("mousemove", e => { if (!drag) return; tf.x = drag.tx + e.clientX - drag.x; tf.y = drag.ty + e.clientY - drag.y; applyTf(); });
window.addEventListener("mouseup", () => { drag = null; viewMap.classList.remove("dragging"); });
svg.addEventListener("dblclick", e => { if (e.target === svg) fitView(); });  // 双击空白复位

// ---------- 大纲视图 ----------
const otree = document.getElementById("otree");
function buildOutline(n){
  if (n.c && n.c.length){
    const d = document.createElement("details");
    d.className = n.k === "part" ? ("part " + n.pc) : n.k;
    d.open = n.k === "root" || n.k === "part" || n.k === "chap";
    const s = document.createElement("summary"); s.innerHTML = n.h || ""; d.appendChild(s);
    const kids = document.createElement("div"); kids.className = "kids";
    n.c.forEach(c => kids.appendChild(buildOutline(c)));
    d.appendChild(kids);
    return d;
  }
  const dv = document.createElement("div"); dv.className = "leaf " + n.k; dv.innerHTML = n.h || "";
  return dv;
}
otree.appendChild(buildOutline(DATA));

// ---------- 视图切换 ----------
let view = "map";
function showView(v){
  view = v;
  document.getElementById("tabMap").classList.toggle("on", v === "map");
  document.getElementById("tabOutline").classList.toggle("on", v === "outline");
  viewMap.style.display = v === "map" ? "block" : "none";
  document.getElementById("viewOutline").style.display = v === "outline" ? "block" : "none";
  if (v === "map"){ renderMap(); applyTf(); }
}
document.getElementById("tabMap").onclick = () => showView("map");
document.getElementById("tabOutline").onclick = () => showView("outline");
document.getElementById("fit").onclick = () => { if (view === "map") fitView(); };

function setOpenAll(deep){
  walkAll(DATA, n => { if (n.c) n.open = deep ? true : TOPKINDS.indexOf(n.k) >= 0; });
  if (view === "map"){ renderMap(); fitView(); }
  else otree.querySelectorAll("details").forEach(d => d.open = d.classList.contains("root") || d.classList.contains("part") || d.classList.contains("chap"));
}
document.getElementById("expand").onclick = () => setOpenAll(true);
document.getElementById("collapse").onclick = () => setOpenAll(false);

// ---------- 搜索 ----------
const q = document.getElementById("q"), hitsEl = document.getElementById("hits");
let timer = null, _searchOn = false;
q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(doSearch, 150); });
q.addEventListener("keydown", e => { if (e.key === "Escape"){ q.value = ""; doSearch(); } });
function clearMarks(){ document.querySelectorAll("mark").forEach(m => m.replaceWith(document.createTextNode(m.textContent))); }
function setHits(t){ hitsEl.textContent = t; hitsEl.style.display = t ? "inline" : "none"; }
function doSearch(){
  const kw = q.value.trim().toLowerCase();
  clearMarks();
  walkAll(DATA, n => { n._hit = false; n._path = false; });
  _searchOn = kw !== "";
  if (!kw){
    setHits("");
    otree.querySelectorAll(".hide").forEach(el => el.classList.remove("hide"));
    otree.querySelectorAll("details").forEach(d => d.open = d.classList.contains("root") || d.classList.contains("part") || d.classList.contains("chap"));
    setOpenDefault(); renderMap(); fitView();
    return;
  }
  const matches = [];
  walkAll(DATA, n => { if (n.t.toLowerCase().indexOf(kw) >= 0){ n._hit = true; matches.push(n); } });
  matches.forEach(m => { let p = m._p; while (p){ p._path = true; p = p._p; } });
  if (view === "map"){
    matches.forEach(m => { let p = m._p; while (p){ p.open = true; p = p._p; } });
    renderMap();
    setHits(matches.length ? matches.length + " 处命中" : "无命中");
    if (matches.length){
      if (tf.s < 0.3) tf.s = 0.5;   // 防御：过小缩放下命中不可读
      const n = matches[0], bb = svg.getBoundingClientRect();
      tf.x = bb.width / 2 - (n._x + n._w / 2) * tf.s;
      tf.y = bb.height / 2 - n._y * tf.s;
      applyTf();
    }
  } else {
    const details = Array.from(otree.querySelectorAll("details"));
    const leaves = Array.from(otree.querySelectorAll(".leaf"));
    const els = details.map(d => ({ el: d, tx: d.querySelector("summary").textContent, isD: true }))
      .concat(leaves.map(l => ({ el: l, tx: l.textContent, isD: false })));
    const anc = new Set();
    for (const n of els) if (n.tx.toLowerCase().indexOf(kw) >= 0){
      let p = n.el.parentElement;
      while (p && p !== otree){ const dd = p.closest ? p.closest("details") : null; if (dd) anc.add(dd); p = p.parentElement; }
    }
    for (const n of els){
      const hit = n.tx.toLowerCase().indexOf(kw) >= 0;
      n.el.classList.toggle("hide", !(hit || anc.has(n.el)));
      if (n.isD && (hit || anc.has(n.el))) n.el.open = true;
    }
    let nHit = 0;
    for (const n of els) if (n.tx.toLowerCase().indexOf(kw) >= 0) nHit++;
    setHits(nHit + " 处命中");
    otree.querySelectorAll("summary, .leaf").forEach(el => {
      const t = el.childNodes[0];
      if (t && t.nodeType === 3){
        const idx = t.textContent.toLowerCase().indexOf(kw);
        if (idx >= 0){
          const range = document.createRange();
          range.setStart(t, idx); range.setEnd(t, idx + kw.length);
          try { const mk = document.createElement("mark"); range.surroundContents(mk); } catch (e) {}
        }
      }
    });
  }
}
function setOpenDefault(){ walkAll(DATA, n => { if (n.c) n.open = TOPKINDS.indexOf(n.k) >= 0; }); }

// ---------- 初始化 ----------
showView("map");
fitView();  // 同步执行：rAF 在标签页不可见时会被推迟，若拖到搜索之后会覆盖定位
</script>
</body>
</html>
