助于为团队化工作选择合适类型；有效团队需要充足资源、有效领导、信任氛围、反映团队贡献的评估与奖励体系，成员具备技术技能、合适特质和人际技能；有效团队规模较小、成员满足角色要求并希望成为团队一分子、认同共同目标和计划、相信团队能力、共享准确的心智模型、致力于具体目标；不要假设总是需要团队——当任务不能从相互依赖中受益时，个体可能是更好的选择。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（并入本章小结）：引入团队要求员工善于合作、共享信息、坦然面对差异并把个人利益升华为团队利益；了解问题解决团队、自我管理型团队、跨职能团队、虚拟团队和多团队系统的区别，有助于为团队化工作选择合适类型；有效团队需要充足资源、有效领导、信任氛围、反映团队贡献的评估与奖励体系，成员具备技术技能、合适特质和人际技能；有效团队规模较小、成员满足角色要求并希望成为团队一分子、认同共同目标和计划、相信团队能力、共享准确的心智模型、致力于具体目标；不要假设总是需要团队——当任务不能从相互依赖中受益时，个体可能是更好的选择。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">10.6 警惕</strong>：团队并非总是问题的答案"}],"k":"chap","h":"第10章 理解工作团队"},{"t":"第11章 沟通","c":[{"t":"学习目标","c":[{"t":"描述沟通的功能及沟通过程。","c":[],"k":"b","i":1,"h":"描述沟通的功能及沟通过程。"},{"t":"比较小群体网络和小道消息中的下行沟通、上行沟通和横向沟通。","c":[],"k":"b","i":1,"h":"比较小群体网络和小道消息中的下行沟通、上行沟通和横向沟通。"},{"t":"比较口头沟通、书面沟通和非言语沟通。","c":[],"k":"b","i":1,"h":"比较口头沟通、书面沟通和非言语沟通。"},{"t":"解释为什么渠道丰富度是选择沟通渠道的基础。","c":[],"k":"b","i":1,"h":"解释为什么渠道丰富度是选择沟通渠道的基础。"},{"t":"区分说服性信息的自动处理和控制处理。","c":[],"k":"b","i":1,"h":"区分说服性信息的自动处理和控制处理。"},{"t":"识别有效沟通的常见障碍。","c":[],"k":"b","i":1,"h":"识别有效沟通的常见障碍。"},{"t":"说明如何克服跨文化沟通中可能存在的障碍。","c":[],"k":"b","i":1,"h":"说明如何克服跨文化沟通中可能存在的障碍。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"11.1 沟通的功能","c":[{"t":"沟通的内涵：沟通（communication）包括传递意图和理解意图两方面；完美的沟通（发送者与接收者头脑中出现相同画面）在现实中并不存在。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">沟通的内涵</strong>：沟通（communication）包括传递意图和理解意图两方面；完美的沟通（发送者与接收者头脑中出现相同画面）在现实中并不存在。"},{"t":"五种主要功能：","c":[{"t":"控制：员工遵守工作说明书、公司政策法规等正式指导原则时，沟通在控制行为；非正式沟通也能控制行为（如群体对过于努力的成员冷嘲热讽）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">控制</strong>：员工遵守工作说明书、公司政策法规等正式指导原则时，沟通在控制行为；非正式沟通也能控制行为（如群体对过于努力的成员冷嘲热讽）。"},{"t":"反馈：明确告诉员工必须做什么、表现得如何、如何改进，激发员工动机（与目标设置理论和强化理论相呼应）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反馈</strong>：明确告诉员工必须做什么、表现得如何、如何改进，激发员工动机（与目标设置理论和强化理论相呼应）。"},{"t":"情绪表达：群体内沟通是员工表达失落感和满足感的机制，满足社会需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情绪表达</strong>：群体内沟通是员工表达失落感和满足感的机制，满足社会需求。"},{"t":"说服：既能使组织受益（如说服下属认同企业社会责任），也可能危害组织（如说服下属违法），好坏兼有。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">说服</strong>：既能使组织受益（如说服下属认同企业社会责任），也可能危害组织（如说服下属违法），好坏兼有。"},{"t":"信息交换：传递数据和资料，帮助形成和评估备选方案，为决策提供信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信息交换</strong>：传递数据和资料，帮助形成和评估备选方案，为决策提供信息。"}],"k":"b","i":1,"h":"<strong class=\"lead\">五种主要功能</strong>："},{"t":"结论：五种功能没有主次之分，群体需要维持控制、提供反馈、提供情绪表达方式、监控说服行为并鼓励信息交换。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">结论</strong>：五种功能没有主次之分，群体需要维持控制、提供反馈、提供情绪表达方式、监控说服行为并鼓励信息交换。"},{"t":"沟通过程（communication process）模型的8个关键部分（图表11-1）：发送者、编码、信息、渠道、解码、接收者、噪声、反馈。","c":[{"t":"信息：发送者编码后产生的物理产品——说出的话语、写下的内容、手势和表情。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信息</strong>：发送者编码后产生的物理产品——说出的话语、写下的内容、手势和表情。"},{"t":"渠道：正式渠道（formal channel）由组织建立，传递与工作活动有关的信息，传统上沿权力链延伸；非正式渠道（informal channel）自发形成，是个人选择的结果，传递个人或社交信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">渠道</strong>：正式渠道（formal channel）由组织建立，传递与工作活动有关的信息，传统上沿权力链延伸；非正式渠道（informal channel）自发形成，是个人选择的结果，传递个人或社交信息。"},{"t":"解码：接收者把收到的信号转化为可以理解的形式。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解码</strong>：接收者把收到的信号转化为可以理解的形式。"},{"t":"噪声（noise）：使信息失真的沟通障碍，如知觉问题、信息超载、语义问题或文化差异。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">噪声</strong>（noise）：使信息失真的沟通障碍，如知觉问题、信息超载、语义问题或文化差异。"},{"t":"反馈：对信息传递是否成功、是否符合原本意图进行核实的回路。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反馈</strong>：对信息传递是否成功、是否符合原本意图进行核实的回路。"}],"k":"b","i":1,"h":"<strong class=\"lead\">沟通过程</strong>（communication process）模型的8个关键部分（图表11-1）：发送者、编码、信息、渠道、解码、接收者、噪声、反馈。"},{"t":"本章小结要点（并入本节）：沟通与员工满意度存在联系——信息的不确定性越低，工作满意度越高；信息失真与模棱两可、言语与非言语信息不一致都会提高不确定性、降低满意度。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章小结要点</strong>（并入本节）：沟通与员工满意度存在联系——信息的不确定性越低，工作满意度越高；信息失真与模棱两可、言语与非言语信息不一致都会提高不确定性、降低满意度。"}],"k":"sec","i":0,"h":"11.1 沟通的功能"},{"t":"11.2 沟通的方向","c":[{"t":"下行沟通（downward communication）：从一个层级向更低层级进行的沟通，用于分配目标、提供工作指导、解释规章制度、指出注意问题、提供绩效反馈；管理者必须解释决策的原因（解释能增强员工对决策的认同和支持）；信息必须通过多种媒介反复传递才有效；警惕单向性问题——调查显示近2/3的员工表示上司很少或从未征求过建议，好的沟通者既解释决策原因又征求意见。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">下行沟通</strong>（downward communication）：从一个层级向更低层级进行的沟通，用于分配目标、提供工作指导、解释规章制度、指出注意问题、提供绩效反馈；管理者必须解释决策的原因（解释能增强员工对决策的认同和支持）；信息必须通过多种媒介反复传递才有效；警惕单向性问题——调查显示近2/3的员工表示上司很少或从未征求过建议，好的沟通者既解释决策原因又征求意见。"},{"t":"上行沟通（upward communication）：信息流向更高层级，员工用它提供反馈、汇报进度、报告问题，使管理者了解员工对工作、同事和组织的看法；下属诚实、真实的反馈很重要（缺乏负面反馈时管理者更可能做出牺牲下属利益的利己决定）；方法：用简洁的语言而非长篇大论、用切实可行的内容支持主题、准备一份议程、注意说话方式（传达不愉快的事情时要表现出能干的态度）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">上行沟通</strong>（upward communication）：信息流向更高层级，员工用它提供反馈、汇报进度、报告问题，使管理者了解员工对工作、同事和组织的看法；下属诚实、真实的反馈很重要（缺乏负面反馈时管理者更可能做出牺牲下属利益的利己决定）；方法：用简洁的语言而非长篇大论、用切实可行的内容支持主题、准备一份议程、注意说话方式（传达不愉快的事情时要表现出能干的态度）。"},{"t":"横向沟通（lateral communication）：同一工作群体成员之间、不同群体但同一层级的员工之间或等级相同人员之间的沟通；能节省时间、促进协调，在管理层知情和支持时有益；但在正式垂直渠道被破坏、成员绕过或避开直接领导擅自行事、上司发现下属瞒着自己决策行事时，会导致恶性冲突。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">横向沟通</strong>（lateral communication）：同一工作群体成员之间、不同群体但同一层级的员工之间或等级相同人员之间的沟通；能节省时间、促进协调，在管理层知情和支持时有益；但在正式垂直渠道被破坏、成员绕过或避开直接领导擅自行事、上司发现下属瞒着自己决策行事时，会导致恶性冲突。"},{"t":"正式的小群体网络（三种，图表11-2）：","c":[{"t":"链式（chain）：严格遵循正式的指挥链。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">链式</strong>（chain）：严格遵循正式的指挥链。"},{"t":"轮式（wheel）：依赖一个核心人物作为群体的所有沟通渠道，模拟具有强有力领导者的团队。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">轮式</strong>（wheel）：依赖一个核心人物作为群体的所有沟通渠道，模拟具有强有力领导者的团队。"},{"t":"全通道式（all-channel）：允许所有成员之间积极沟通，自我管理型工作团队通常采用；当代组织更倾向于采取这种网络。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">全通道式</strong>（all-channel）：允许所有成员之间积极沟通，自我管理型工作团队通常采用；当代组织更倾向于采取这种网络。"},{"t":"有效性取决于所强调的指标（图表11-3）：速度——链式中、轮式快、全通道式快；精确性——链式高、轮式高、全通道式中；领导者涌现——链式中、轮式高、全通道式无；成员满意度——链式中、轮式低、全通道式高。结论：没有一种网络在所有情况下都是最好的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有效性取决于所强调的指标</strong>（图表11-3）：速度——链式中、轮式快、全通道式快；精确性——链式高、轮式高、全通道式中；领导者涌现——链式中、轮式高、全通道式无；成员满意度——链式中、轮式低、全通道式高。结论：没有一种网络在所有情况下都是最好的。"}],"k":"b","i":1,"h":"<strong class=\"lead\">正式的小群体网络</strong>（三种，图表11-2）："},{"t":"小道消息（grapevine）：非正式沟通系统，传播的流言或八卦对员工和求职者是重要信息来源（对求职决策的影响甚至超过Glassdoor等网站的非正式评级）；服务于员工利益——闲聊增进信息共享者之间的友谊和亲密感（常以牺牲外部群体为代价）；使管理者了解组织士气、找出员工认为重要的事情、发现焦虑；爱闲聊的人往往是有影响力的人（裁员期间更可能保住工作），通过小道消息联系在一起的人往往更有创造力。","c":[{"t":"管理结论：小道消息无法受到制裁或控制，也不应被消除（某些八卦带来亲社会动机）；管理者应通过限制流言的范围和影响来弱化其消极后果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理结论</strong>：小道消息无法受到制裁或控制，也不应被消除（某些八卦带来亲社会动机）；管理者应通过限制流言的范围和影响来弱化其消极后果。"},{"t":"处理八卦和流言的方法（图表11-4）：分享你拥有哪些信息和没有哪些信息（正式沟通信息充分时谣言无处滋生）；解释、解释、再解释（阐明做了什么决定、为什么、未来计划）；不要对流言表态，同时尽力弄清事实并考虑每个方面；鼓励员工一起讨论对组织问题的关注、意见、建议、想法和感受，帮助其把想法转变成更客观的观点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">处理八卦和流言的方法</strong>（图表11-4）：分享你拥有哪些信息和没有哪些信息（正式沟通信息充分时谣言无处滋生）；解释、解释、再解释（阐明做了什么决定、为什么、未来计划）；不要对流言表态，同时尽力弄清事实并考虑每个方面；鼓励员工一起讨论对组织问题的关注、意见、建议、想法和感受，帮助其把想法转变成更客观的观点。"}],"k":"b","i":1,"h":"<strong class=\"lead\">小道消息</strong>（grapevine）：非正式沟通系统，传播的流言或八卦对员工和求职者是重要信息来源（对求职决策的影响甚至超过Glassdoor等网站的非正式评级）；服务于员工利益——闲聊增进信息共享者之间的友谊和亲密感（常以牺牲外部群体为代价）；使管理者了解组织士气、找出员工认为重要的事情、发现焦虑；爱闲聊的人往往是有影响力的人（裁员期间更可能保住工作），通过小道消息联系在一起的人往往更有创造力。"}],"k":"sec","i":0,"h":"11.2 沟通的方向"},{"t":"11.3 沟通模式","c":[{"t":"口头沟通：主要的信息传递方式，包括演说、正式的一对一讨论和群体讨论、非正式的小道消息；优点是快速传递、快速反馈和信息交换（连续的面对面沟通仍是最佳方式）；缺点是信息经过多人传递时失真可能性增大（\"传话\"游戏效应）；包含社会、文化和情感三方面内容；倾听方面要积极倾听——减少干扰、拉近距离、眼神交流、复述对方的话、鼓励谈话者继续。","c":[{"t":"会议：美国平均每天举办1100万次会议；提效做法（贝佐斯会前30分钟静读报告、推特和苹果只在周一开会、BuzzFeed每周2天禁会、限制会议时长）；绊脚石是过度使用术语和限定词；幽默破冰甚至可预测两年后的团队绩效；声音（voice）指在会议上发表有价值观点的能力，缺少声音会造成表达障碍（女性尤其不愿在会议上发表意见，说明某些群体动力阻碍平等参与）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">会议</strong>：美国平均每天举办1100万次会议；提效做法（贝佐斯会前30分钟静读报告、推特和苹果只在周一开会、BuzzFeed每周2天禁会、限制会议时长）；绊脚石是过度使用术语和限定词；幽默破冰甚至可预测两年后的团队绩效；声音（voice）指在会议上发表有价值观点的能力，缺少声音会造成表达障碍（女性尤其不愿在会议上发表意见，说明某些群体动力阻碍平等参与）。"},{"t":"视频会议和电话会议：视频会议让成员相互看到、听到并交谈；电话会议通常指电话交流；65%的远程会议通过语音通话完成，语音通话时间每年增长近10%；六条建议：制定更明确的议程和更严格的规则、与会者自我介绍并发言前先说名字、领导者40%时间说话60%时间倾听、会前分发讨论问题并记录回答、指定非领导者的主持人和秘书、会前了解与会者偏好并确保会用技术。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">视频会议和电话会议</strong>：视频会议让成员相互看到、听到并交谈；电话会议通常指电话交流；65%的远程会议通过语音通话完成，语音通话时间每年增长近10%；六条建议：制定更明确的议程和更严格的规则、与会者自我介绍并发言前先说名字、领导者40%时间说话60%时间倾听、会前分发讨论问题并记录回答、指定非领导者的主持人和秘书、会前了解与会者偏好并确保会用技术。"},{"t":"电话：快速有效、不像电子邮件模棱两可；缺点是信息易被忽视、缺少电子辅助难以达到效果；Switch、Talko、Twilio等新软件使电话更加多功能化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">电话</strong>：快速有效、不像电子邮件模棱两可；缺点是信息易被忽视、缺少电子辅助难以达到效果；Switch、Talko、Twilio等新软件使电话更加多功能化。"}],"k":"b","i":1,"h":"<strong class=\"lead\">口头沟通</strong>：主要的信息传递方式，包括演说、正式的一对一讨论和群体讨论、非正式的小道消息；优点是快速传递、快速反馈和信息交换（连续的面对面沟通仍是最佳方式）；缺点是信息经过多人传递时失真可能性增大（&quot;传话&quot;游戏效应）；包含社会、文化和情感三方面内容；倾听方面要积极倾听——减少干扰、拉近距离、眼神交流、复述对方的话、鼓励谈话者继续。"},{"t":"书面沟通：包括信件、PPT、电子邮件、即时通信、文本通信、社交网站、应用软件、博客等。","c":[{"t":"信件：最古老也最持久的书面沟通，增添个人色彩、创造持久记录以示正式；手写比打字更易记住内容。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信件</strong>：最古老也最持久的书面沟通，增添个人色彩、创造持久记录以示正式；手写比打字更易记住内容。"},{"t":"PPT：文字与视觉元素结合，吸引读者、解释复杂想法；反对意见是太没有人情味、没有吸引力、听者难以跟上。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">PPT</strong>：文字与视觉元素结合，吸引读者、解释复杂想法；反对意见是太没有人情味、没有吸引力、听者难以跟上。"},{"t":"电子邮件：全球超过31亿活跃账户，员工平均每天发送105封；优点是快速书写、编辑、发送和存储；代价是处理不必要邮件耗费大量时间、带来压力（研究显示只有当员工已经工作过载时邮件才带来压力）；七条建议：标题简短并与主题相关、表达问候并使用称呼（越正式越好）、句子段落和观点简洁并列出要点、不要太唐突、不要使用短信用语、检查拼写、24小时内回信。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">电子邮件</strong>：全球超过31亿活跃账户，员工平均每天发送105封；优点是快速书写、编辑、发送和存储；代价是处理不必要邮件耗费大量时间、带来压力（研究显示只有当员工已经工作过载时邮件才带来压力）；七条建议：标题简短并与主题相关、表达问候并使用称呼（越正式越好）、句子段落和观点简洁并列出要点、不要太唐突、不要使用短信用语、检查拼写、24小时内回信。"},{"t":"即时通信（IM）：可实时打字对话，但信息不被记录、日后无法参考，错过消息难以按时回复；商务交流中负面作用更明显。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">即时通信</strong>（IM）：可实时打字对话，但信息不被记录、日后无法参考，错过消息难以按时回复；商务交流中负面作用更明显。"},{"t":"文本通信（TM）：商务使用应与其他商务交流一样正式，私人短信的非正式表达和缩写在正式工作中通常不可取。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文本通信</strong>（TM）：商务使用应与其他商务交流一样正式，私人短信的非正式表达和缩写在正式工作中通常不可取。"},{"t":"社交网站：脸书（每月活跃用户超14.4亿，公开发帖/私信/聊天；全球前50位最富公司的CEO无一使用，且存在隐私担忧）；领英（在线商业网络，每月活跃用户1.87亿，简介相当于虚拟简历，最受顶级CEO欢迎）；推特（混合型社交网络，140字以内微博，每月活跃用户约2.36亿，CEO使用者少但粉丝量可观）；组织纷纷开发企业社交软件和内部社交网络。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社交网站</strong>：脸书（每月活跃用户超14.4亿，公开发帖/私信/聊天；全球前50位最富公司的CEO无一使用，且存在隐私担忧）；领英（在线商业网络，每月活跃用户1.87亿，简介相当于虚拟简历，最受顶级CEO欢迎）；推特（混合型社交网络，140字以内微博，每月活跃用户约2.36亿，CEO使用者少但粉丝量可观）；组织纷纷开发企业社交软件和内部社交网络。"},{"t":"应用软件：易于访问、适用于移动设备，在智能手机普及地区最受欢迎（WhatsApp，以及日本的Line、中国的微信、韩国的Kakao）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用软件</strong>：易于访问、适用于移动设备，在智能手机普及地区最受欢迎（WhatsApp，以及日本的Line、中国的微信、韩国的Kakao）。"},{"t":"博客：关于个人或公司的网站，被视为组织的商务必需品，可接收反馈；过时的博客对员工、客户和公众都不友好，必须不断更新。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">博客</strong>：关于个人或公司的网站，被视为组织的商务必需品，可接收反馈；过时的博客对员工、客户和公众都不友好，必须不断更新。"}],"k":"b","i":1,"h":"<strong class=\"lead\">书面沟通</strong>：包括信件、PPT、电子邮件、即时通信、文本通信、社交网站、应用软件、博客等。"},{"t":"非言语沟通（nonverbal communication）：包括肢体动作、说话的语调或用词的强调、面部表情、身体距离；通常伴随言语沟通出现，也可单独存在。","c":[{"t":"肢体语言表达地位、投入程度和情绪状态；人们从非言语暗示中获取的态度和情绪解读远多于语言，当非言语暗示与语言信息矛盾时，人们可能更相信非言语暗示。","c":[],"k":"b","i":2,"h":"肢体语言表达地位、投入程度和情绪状态；人们从非言语暗示中获取的态度和情绪解读远多于语言，当非言语暗示与语言信息矛盾时，人们可能更相信非言语暗示。"},{"t":"语调：重音位置改变句子的意思（图表11-6以\"为什么我今晚不能请你吃晚饭？\"为例，重音落点不同含义不同）；面部表情传递意义（咆哮的面孔与微笑不同），并展现自负、好胜、畏惧、害羞等特点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">语调</strong>：重音位置改变句子的意思（图表11-6以&quot;为什么我今晚不能请你吃晚饭？&quot;为例，重音落点不同含义不同）；面部表情传递意义（咆哮的面孔与微笑不同），并展现自负、好胜、畏惧、害羞等特点。"},{"t":"身体距离：恰当距离很大程度上取决于文化规范——同样的距离在欧洲一些国家是\"商务\"距离，在北美可能是\"亲密\"距离；过近可能意味着攻击性或\"性\"趣，过远可能意味着不感兴趣或不快。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">身体距离</strong>：恰当距离很大程度上取决于文化规范——同样的距离在欧洲一些国家是&quot;商务&quot;距离，在北美可能是&quot;亲密&quot;距离；过近可能意味着攻击性或&quot;性&quot;趣，过远可能意味着不感兴趣或不快。"}],"k":"b","i":1,"h":"<strong class=\"lead\">非言语沟通</strong>（nonverbal communication）：包括肢体动作、说话的语调或用词的强调、面部表情、身体距离；通常伴随言语沟通出现，也可单独存在。"},{"t":"对管理者的启示（并入本节）：所选择的沟通方式在一定程度上决定沟通的有效性；不论通过哪种方式传递信息，都要从接收者那里获得反馈以确保信息被准确理解。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（并入本节）：所选择的沟通方式在一定程度上决定沟通的有效性；不论通过哪种方式传递信息，都要从接收者那里获得反馈以确保信息被准确理解。"}],"k":"sec","i":0,"h":"11.3 沟通模式"},{"t":"11.4 沟通渠道的选择","c":[{"t":"渠道丰富度（channel richness）：各渠道传递信息的能力存在差异；丰富的渠道能同时处理多种线索、有利于快速反馈、非常个性化；贫乏的渠道三方面表现较差。面对面交谈得分最高（大量信息线索、言语和非言语的即时反馈、\"就在面前\"的私人接触），正式报告和通报等不带个人色彩的书面媒介得分最低（图表11-7从高到低依次为面对面交谈、电话交换、语音邮件、电子邮件、备忘录和信件、小组群件、电讯会议、现场演说、在线讨论、事先录制的演说、正式报告和通报）。丰富渠道的共同点是给了我们观察的机会；线索缺失时必须寻找其他线索推断发送者的情绪和态度。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">渠道丰富度</strong>（channel richness）：各渠道传递信息的能力存在差异；丰富的渠道能同时处理多种线索、有利于快速反馈、非常个性化；贫乏的渠道三方面表现较差。面对面交谈得分最高（大量信息线索、言语和非言语的即时反馈、&quot;就在面前&quot;的私人接触），正式报告和通报等不带个人色彩的书面媒介得分最低（图表11-7从高到低依次为面对面交谈、电话交换、语音邮件、电子邮件、备忘录和信件、小组群件、电讯会议、现场演说、在线讨论、事先录制的演说、正式报告和通报）。丰富渠道的共同点是给了我们观察的机会；线索缺失时必须寻找其他线索推断发送者的情绪和态度。"},{"t":"选择沟通方式：选择取决于信息是不是常规的——常规信息简单明确、模糊性最低，用丰富度低的渠道即可有效沟通；非常规信息复杂、易误解，须用丰富度高的渠道。","c":[{"t":"口头沟通适合的情形：需要测量接收者的接受能力（如与客户当面共同制定营销计划、观察反应）；还应考虑接收者偏好和工作环境节奏；说话声音比内容更重要（清晰、温和的声音有助于事业，声音问题可找声音教练改善）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">口头沟通适合的情形</strong>：需要测量接收者的接受能力（如与客户当面共同制定营销计划、观察反应）；还应考虑接收者偏好和工作环境节奏；说话声音比内容更重要（清晰、温和的声音有助于事业，声音问题可找声音教练改善）。"},{"t":"书面沟通适合的情形：复杂冗长的沟通最可靠，传递简短信息也高效（两句文字可代替十分钟电话）；在情绪表达方面有局限；适合需要明确、可核查、\"能够被记录下来\"的信息（深思熟虑、逻辑清晰；语法错误和缺乏正式性是不专业的表现）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">书面沟通适合的情形</strong>：复杂冗长的沟通最可靠，传递简短信息也高效（两句文字可代替十分钟电话）；在情绪表达方面有局限；适合需要明确、可核查、&quot;能够被记录下来&quot;的信息（深思熟虑、逻辑清晰；语法错误和缺乏正式性是不专业的表现）。"},{"t":"具体形式要点：信件主要用于建立关系网络或需要手写签名时（面试后手写感谢信永远不会是错误选择）；即时通信只回复与职业相关的内容且谈话不被记录；文本通信收益与挑战并存（调查显示84%的人认为正式会议上写短信或邮件不合适、75%认为阅读不合适），办公时间应严格限制并先与对方建立规则；较长的信息最好发电子邮件；企业层面的社交媒体回报（销售领域快速成交、企业内部社交网络年增长率300%）与风险（损害名誉、泄露机密、网络侦查耗时且代价高昂）并存，使用前应了解公司政策。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">具体形式要点</strong>：信件主要用于建立关系网络或需要手写签名时（面试后手写感谢信永远不会是错误选择）；即时通信只回复与职业相关的内容且谈话不被记录；文本通信收益与挑战并存（调查显示84%的人认为正式会议上写短信或邮件不合适、75%认为阅读不合适），办公时间应严格限制并先与对方建立规则；较长的信息最好发电子邮件；企业层面的社交媒体回报（销售领域快速成交、企业内部社交网络年增长率300%）与风险（损害名誉、泄露机密、网络侦查耗时且代价高昂）并存，使用前应了解公司政策。"}],"k":"b","i":1,"h":"<strong class=\"lead\">选择沟通方式</strong>：选择取决于信息是不是常规的——常规信息简单明确、模糊性最低，用丰富度低的渠道即可有效沟通；非常规信息复杂、易误解，须用丰富度高的渠道。"},{"t":"信息安全（information security）：客户、顾客和员工信息是机密和隐私；大多数公司主动监控员工的网络使用和电子邮件记录，甚至视频监控和通话监听；监控可能必要但看似侵犯隐私，让员工参与制定信息安全政策、在个人信息使用上给予部分控制权可减少担忧。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">信息安全</strong>（information security）：客户、顾客和员工信息是机密和隐私；大多数公司主动监控员工的网络使用和电子邮件记录，甚至视频监控和通话监听；监控可能必要但看似侵犯隐私，让员工参与制定信息安全政策、在个人信息使用上给予部分控制权可减少担忧。"},{"t":"对管理者的启示（并入本节）：确保所采用的沟通策略适合接收者以及所发送的信息类型；书面沟通产生的误解比口头沟通更多，尽量以面对面会议的方式与员工沟通。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（并入本节）：确保所采用的沟通策略适合接收者以及所发送的信息类型；书面沟通产生的误解比口头沟通更多，尽量以面对面会议的方式与员工沟通。"}],"k":"sec","i":0,"h":"11.4 沟通渠道的选择"},{"t":"11.5 说服性沟通","c":[{"t":"自动处理（automatic processing）：相对较浅层的处理证据和信息的方法，利用直觉，花费的时间和精力都少，对不太在意的事情合情合理；缺点是容易被小伎俩迷惑（悦耳的广告歌曲、迷人的照片）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">自动处理</strong>（automatic processing）：相对较浅层的处理证据和信息的方法，利用直觉，花费的时间和精力都少，对不太在意的事情合情合理；缺点是容易被小伎俩迷惑（悦耳的广告歌曲、迷人的照片）。"},{"t":"控制处理（controlled processing）：依赖事实、数据和逻辑，对证据和信息的考量更仔细，需要付出努力、投入精力；花时间了解之后不容易被骗。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">控制处理</strong>（controlled processing）：依赖事实、数据和逻辑，对证据和信息的考量更仔细，需要付出努力、投入精力；花时间了解之后不容易被骗。"},{"t":"影响处理方式的因素：","c":[{"t":"兴趣水平：最好的预测因素之一，反映决定对生活的影响；越感兴趣越可能仔细处理信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">兴趣水平</strong>：最好的预测因素之一，反映决定对生活的影响；越感兴趣越可能仔细处理信息。"},{"t":"先验知识：对某主题了解越多越可能使用控制处理、越难被说服；了解少的人更容易被肤浅理由改变想法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">先验知识</strong>：对某主题了解越多越可能使用控制处理、越难被说服；了解少的人更容易被肤浅理由改变想法。"},{"t":"人格：认知需求（need for cognition）高的个体更容易被证据和事实说服；认知需求低的人更可能使用自动处理，依靠直觉和情绪评价信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人格</strong>：认知需求（need for cognition）高的个体更容易被证据和事实说服；认知需求低的人更可能使用自动处理，依靠直觉和情绪评价信息。"},{"t":"信息的特点：通过较窄渠道传递的信息（接收者没机会就内容交流）更可能被自动处理；通过更丰富渠道传递的信息会受到更审慎的处理。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信息的特点</strong>：通过较窄渠道传递的信息（接收者没机会就内容交流）更可能被自动处理；通过更丰富渠道传递的信息会受到更审慎的处理。"}],"k":"b","i":1,"h":"<strong class=\"lead\">影响处理方式的因素</strong>："},{"t":"信息的选择：让说服性信息与接收者可能使用的处理方式相匹配——接收者不感兴趣、知之甚少、认知需求低且渠道窄时，使用情绪饱满的信息并把结果与积极正面形象联系；接收者感兴趣、认知需求高或渠道丰富时，采用理性的论点和证据效果更好。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">信息的选择</strong>：让说服性信息与接收者可能使用的处理方式相匹配——接收者不感兴趣、知之甚少、认知需求低且渠道窄时，使用情绪饱满的信息并把结果与积极正面形象联系；接收者感兴趣、认知需求高或渠道丰富时，采用理性的论点和证据效果更好。"}],"k":"sec","i":0,"h":"11.5 说服性沟通"},{"t":"11.6 有效沟通的障碍","c":[{"t":"过滤（filtering）：发送者有意操纵信息以改善接收者的看法（只报上级想听的）；组织的垂直层级越多，过滤的机会越多；害怕传递坏消息、希望取悦上司导致上行沟通失真。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">过滤</strong>（filtering）：发送者有意操纵信息以改善接收者的看法（只报上级想听的）；组织的垂直层级越多，过滤的机会越多；害怕传递坏消息、希望取悦上司导致上行沟通失真。"},{"t":"选择性知觉（selective perception）：接收者根据自己的需要、动机、经验、背景及其他个人特征有选择地观察或倾听，在解码中融入自己的兴趣和期望（如认为女性把家庭看得比事业重的面试官会在所有女性求职者身上发现这一点）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">选择性知觉</strong>（selective perception）：接收者根据自己的需要、动机、经验、背景及其他个人特征有选择地观察或倾听，在解码中融入自己的兴趣和期望（如认为女性把家庭看得比事业重的面试官会在所有女性求职者身上发现这一点）。"},{"t":"信息超载（information overload）：信息超过个体的信息加工能力；结果是筛选、忽略、跳过或忘记信息，或暂停更深入的处理，导致信息丢失、沟通效果受损；对策包括限制设备数量（如以移动设备替代台式电脑提高生产率）；全天候待命带来工作-生活冲突与倦怠风险，须在沟通需求与休息需求间平衡。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">信息超载</strong>（information overload）：信息超过个体的信息加工能力；结果是筛选、忽略、跳过或忘记信息，或暂停更深入的处理，导致信息丢失、沟通效果受损；对策包括限制设备数量（如以移动设备替代台式电脑提高生产率）；全天候待命带来工作-生活冲突与倦怠风险，须在沟通需求与休息需求间平衡。"},{"t":"情绪：同一信息在愤怒时与快乐时的解读截然不同；积极心境的人更易接受较浅层的沟通、更受精心设计的论点影响，消极心境的人更仔细检查信息；极端情绪体验（狂喜或悲痛）最有可能阻碍有效沟通。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪</strong>：同一信息在愤怒时与快乐时的解读截然不同；积极心境的人更易接受较浅层的沟通、更受精心设计的论点影响，消极心境的人更仔细检查信息；极端情绪体验（狂喜或悲痛）最有可能阻碍有效沟通。"},{"t":"语言：同样的词对不同的人意义不同，年龄和情境是两个最显著的因素（如公司行话、首字母缩略词、\"get the low-hanging fruit\"等短语令外行一头雾水）；语言的说服力还取决于听众最初对信息的认同程度——政治观点不同时具体语言更有说服力，相似时抽象语言更有说服力。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">语言</strong>：同样的词对不同的人意义不同，年龄和情境是两个最显著的因素（如公司行话、首字母缩略词、&quot;get the low-hanging fruit&quot;等短语令外行一头雾水）；语言的说服力还取决于听众最初对信息的认同程度——政治观点不同时具体语言更有说服力，相似时抽象语言更有说服力。"},{"t":"沉默：沉默本身也传递信息（不感兴趣或无能为力）；受到不公正对待、经常遭受负面情绪和过度反思、感觉权力地位低的员工更可能保持沉默；沉默也是信息过载或延迟的直接结果；超过85%的管理者声称至少在一个重大事项上保持沉默；后果是管理者缺乏发现问题的信息，歧视、骚扰、腐败等问题无法被高层采取行动。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">沉默</strong>：沉默本身也传递信息（不感兴趣或无能为力）；受到不公正对待、经常遭受负面情绪和过度反思、感觉权力地位低的员工更可能保持沉默；沉默也是信息过载或延迟的直接结果；超过85%的管理者声称至少在一个重大事项上保持沉默；后果是管理者缺乏发现问题的信息，歧视、骚扰、腐败等问题无法被高层采取行动。"},{"t":"沟通恐惧（communication apprehension）：约20%的大学生有某种程度的沟通恐惧或社交焦虑，口头或书面沟通时过分紧张和焦虑；他们回避需要口头沟通的情境（如授课），抑制工作所需的沟通，并告诉自己不需要太多沟通也能有效工作，使行为合理化。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">沟通恐惧</strong>（communication apprehension）：约20%的大学生有某种程度的沟通恐惧或社交焦虑，口头或书面沟通时过分紧张和焦虑；他们回避需要口头沟通的情境（如授课），抑制工作所需的沟通，并告诉自己不需要太多沟通也能有效工作，使行为合理化。"},{"t":"撒谎：谎言定义有争议（故意隐瞒信息算不算说谎），但撒谎现象普遍存在——普通人每天说一两个谎言；打电话时比面对面更容易撒谎，电子邮件里比手写时更心安理得；大多数人并不擅长识别谎言——没有哪种语言或非言语信号专属撒谎（回避目光也可能是紧张、害羞），撒谎者可能故意盯着你，很多谎言夹杂事实、只改变关键细节；频率高与识别难使撒谎成为有效沟通的一大障碍。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">撒谎</strong>：谎言定义有争议（故意隐瞒信息算不算说谎），但撒谎现象普遍存在——普通人每天说一两个谎言；打电话时比面对面更容易撒谎，电子邮件里比手写时更心安理得；大多数人并不擅长识别谎言——没有哪种语言或非言语信号专属撒谎（回避目光也可能是紧张、害羞），撒谎者可能故意盯着你，很多谎言夹杂事实、只改变关键细节；频率高与识别难使撒谎成为有效沟通的一大障碍。"}],"k":"sec","i":0,"h":"11.6 有效沟通的障碍"},{"t":"11.7 文化要素","c":[{"t":"背景：跨文化因素增加沟通问题产生的潜在可能性；仅有18%的公司制定了跨文化沟通的政策文件，仅31%的公司要求对信息进行量身改造。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">背景</strong>：跨文化因素增加沟通问题产生的潜在可能性；仅有18%的公司制定了跨文化沟通的政策文件，仅31%的公司要求对信息进行量身改造。"},{"t":"文化障碍（与语言障碍有关的四类）：","c":[{"t":"语义造成的障碍：有些词难以在两种文化中互译（如芬兰语的\"sisu\"接近勇气和坚持不懈；英语中的效率、自由市场、规则等词难以译成俄语）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">语义造成的障碍</strong>：有些词难以在两种文化中互译（如芬兰语的&quot;sisu&quot;接近勇气和坚持不懈；英语中的效率、自由市场、规则等词难以译成俄语）。"},{"t":"词语内在含义造成的障碍：相同词语在不同语言中意义不同（日语\"hai\"翻译为\"是\"，真正含义是\"是，我正在认真听\"而非\"是，我同意\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">词语内在含义造成的障碍</strong>：相同词语在不同语言中意义不同（日语&quot;hai&quot;翻译为&quot;是&quot;，真正含义是&quot;是，我正在认真听&quot;而非&quot;是，我同意&quot;）。"},{"t":"口气和语调差异造成的障碍：有的文化语言规范、有的不规范；语调随环境变化，在应使用正式风格的情境中使用非正式、个性化的语言令人尴尬且不合时宜。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">口气和语调差异造成的障碍</strong>：有的文化语言规范、有的不规范；语调随环境变化，在应使用正式风格的情境中使用非正式、个性化的语言令人尴尬且不合时宜。"},{"t":"冲突容忍度和冲突解决方式差异造成的障碍：个人主义者习惯直面冲突、公开分歧根源并公开道歉以恢复关系；集体主义者含蓄地承认冲突、尽量避免情感纠纷，更多把冲突归因于情境；不同文化对冒犯行为的界定也不同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">冲突容忍度和冲突解决方式差异造成的障碍</strong>：个人主义者习惯直面冲突、公开分歧根源并公开道歉以恢复关系；集体主义者含蓄地承认冲突、尽量避免情感纠纷，更多把冲突归因于情境；不同文化对冒犯行为的界定也不同。"}],"k":"b","i":1,"h":"<strong class=\"lead\">文化障碍</strong>（与语言障碍有关的四类）："},{"t":"文化情境：高情境文化（high-context culture，如中国、韩国、日本、越南）依赖非言语线索和微妙的情境线索，正式职位、社会地位和名誉声望在沟通中十分重要，\"一切尽在不言中\"，口头协议是很强的承诺，管理者更可能\"提供建议\"而不是下达命令；低情境文化（low-context culture，欧洲和北美）主要依赖意义传递中的词语，肢体语言和正式头衔的重要性居后，具有实际效力的契约是书面的、精确并具高度法律约束力，重视直截了当，管理者被期望清楚明白地传递意图。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">文化情境</strong>：高情境文化（high-context culture，如中国、韩国、日本、越南）依赖非言语线索和微妙的情境线索，正式职位、社会地位和名誉声望在沟通中十分重要，&quot;一切尽在不言中&quot;，口头协议是很强的承诺，管理者更可能&quot;提供建议&quot;而不是下达命令；低情境文化（low-context culture，欧洲和北美）主要依赖意义传递中的词语，肢体语言和正式头衔的重要性居后，具有实际效力的契约是书面的、精确并具高度法律约束力，重视直截了当，管理者被期望清楚明白地传递意图。"},{"t":"文化指南：跨文化交流应以敏感性和追求共同目标为基础；最理想的是形成一种临时的\"第三方文化\"——通过认可个人差异、整合成员的文化交流偏好建立起亚文化规范，为有效沟通奠定基础。减少误解的建议：了解自己（认识到自己的文化身份和偏见）；营造相互尊重、公平民主的氛围（第三方文化的基础）；强调描述而不是解读或评价（留足时间调整视角，不急于判断）；考虑对方的观点（发出信息前把自己置于接收者立场，冲突出现时以合作方式解决）；积极维护群体的身份（提醒成员有共同目标、相互尊重、适应个人沟通偏好）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">文化指南</strong>：跨文化交流应以敏感性和追求共同目标为基础；最理想的是形成一种临时的&quot;第三方文化&quot;——通过认可个人差异、整合成员的文化交流偏好建立起亚文化规范，为有效沟通奠定基础。减少误解的建议：了解自己（认识到自己的文化身份和偏见）；营造相互尊重、公平民主的氛围（第三方文化的基础）；强调描述而不是解读或评价（留足时间调整视角，不急于判断）；考虑对方的观点（发出信息前把自己置于接收者立场，冲突出现时以合作方式解决）；积极维护群体的身份（提醒成员有共同目标、相互尊重、适应个人沟通偏好）。"},{"t":"对管理者的启示（并入本节）：留意沟通中的障碍，比如性别和文化（性别沟通风格差异详见章末案例1）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（并入本节）：留意沟通中的障碍，比如性别和文化（性别沟通风格差异详见章末案例1）。"}],"k":"sec","i":0,"h":"11.7 文化要素"}],"k":"chap","h":"第11章 沟通"},{"t":"第12章 领导","c":[{"t":"学习目标","c":[{"t":"总结特质理论的研究结论","c":[],"k":"b","i":1,"h":"总结特质理论的研究结论"},{"t":"指出行为理论的核心原则和主要局限","c":[],"k":"b","i":1,"h":"指出行为理论的核心原则和主要局限"},{"t":"比较各种权变理论","c":[],"k":"b","i":1,"h":"比较各种权变理论"},{"t":"描述当代领导理论及其与早期基础理论的关系","c":[],"k":"b","i":1,"h":"描述当代领导理论及其与早期基础理论的关系"},{"t":"讨论领导者在创建道德型组织中的作用","c":[],"k":"b","i":1,"h":"讨论领导者在创建道德型组织中的作用"},{"t":"描述领导者如何通过建立信任和导师制对组织产生积极影响","c":[],"k":"b","i":1,"h":"描述领导者如何通过建立信任和导师制对组织产生积极影响"},{"t":"指出我们理解领导所面临的挑战","c":[],"k":"b","i":1,"h":"指出我们理解领导所面临的挑战"}],"k":"sec","i":0,"h":"学习目标"},{"t":"12.1 特质理论","c":[{"t":"领导（leadership）：影响一个群体实现愿景或目标的能力；领导者可以由外部正式任命产生，也可以从群体内部自发产生，非正式领导者的影响力常常与正式影响力同等重要甚至更重要","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">领导</strong>（leadership）：影响一个群体实现愿景或目标的能力；领导者可以由外部正式任命产生，也可以从群体内部自发产生，非正式领导者的影响力常常与正式影响力同等重要甚至更重要"},{"t":"组织需要强有力的领导和强有力的管理：领导者挑战常规、提出未来愿景并激励组织成员实现愿景；管理者制定具体计划、构建高效的组织结构并监管组织的日常运行","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">组织需要强有力的领导和强有力的管理</strong>：领导者挑战常规、提出未来愿景并激励组织成员实现愿景；管理者制定具体计划、构建高效的组织结构并监管组织的日常运行"},{"t":"领导特质理论（trait theories of leadership）：强调个人品质和特征，试图找出把领导者与非领导者区分开来的人格、社交、生理或智力方面的属性","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">领导特质理论</strong>（trait theories of leadership）：强调个人品质和特征，试图找出把领导者与非领导者区分开来的人格、社交、生理或智力方面的属性"},{"t":"大五人格与领导：外倾性是有效领导者最重要的特质，但外倾性与「领导力展现方式」的相关程度可能大于与「领导效果」的相关程度——在主见维度上得分过高的领导者不如得分适中者有效；外倾性领导者面对被动型员工比面对主动型员工更有效","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">大五人格与领导</strong>：外倾性是有效领导者最重要的特质，但外倾性与「领导力展现方式」的相关程度可能大于与「领导效果」的相关程度——在主见维度上得分过高的领导者不如得分适中者有效；外倾性领导者面对被动型员工比面对主动型员工更有效"},{"t":"随和性和情绪稳定性与领导力相关度不高；责任心和经验开放性与领导力（尤其是领导有效性）强相关——成就奋斗、尽职尽责等与能否成为领导者相关，为成就奋斗和可靠性与管理者的有效性相关","c":[],"k":"b","i":1,"h":"随和性和情绪稳定性与领导力相关度不高；责任心和经验开放性与领导力（尤其是领导有效性）强相关——成就奋斗、尽职尽责等与能否成为领导者相关，为成就奋斗和可靠性与管理者的有效性相关"},{"t":"黑暗三特质（马基雅维利主义、自恋、精神病态）与高情绪稳定性：处于中等水平最有利于领导，过高或过低的得分都与无效领导相关；这些方面得分高可能有助于「成为」领导者；建立自我意识和自我调节技能有助于控制其负面影响","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">黑暗三特质</strong>（马基雅维利主义、自恋、精神病态）与高情绪稳定性：处于中等水平最有利于领导，过高或过低的得分都与无效领导相关；这些方面得分高可能有助于「成为」领导者；建立自我意识和自我调节技能有助于控制其负面影响"},{"t":"情绪智力（emotional intelligence）：核心成分同理心使领导者能察觉他人需求、倾听下属所说的话（及弦外之音）、读懂他人反应；能有效展示和管理情绪的领导者更容易影响下属的感受；情绪智力高的人更可能成为领导者（即使控制认知能力和人格因素）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪智力</strong>（emotional intelligence）：核心成分同理心使领导者能察觉他人需求、倾听下属所说的话（及弦外之音）、读懂他人反应；能有效展示和管理情绪的领导者更容易影响下属的感受；情绪智力高的人更可能成为领导者（即使控制认知能力和人格因素）"},{"t":"两条结论：特质可以预测领导；相比区分有效与无效领导，特质能更好地预测领导者涌现（即哪些人被视作领导者）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">两条结论</strong>：特质可以预测领导；相比区分有效与无效领导，特质能更好地预测领导者涌现（即哪些人被视作领导者）"},{"t":"小结：表现出领导特质并被视作领导者，不意味着一定成为有效领导者；特质理论有助于预测领导，但不能完全解释领导——引出行为理论","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">小结</strong>：表现出领导特质并被视作领导者，不意味着一定成为有效领导者；特质理论有助于预测领导，但不能完全解释领导——引出行为理论"}],"k":"sec","i":0,"h":"12.1 特质理论"},{"t":"12.2 行为理论","c":[{"t":"领导行为理论（behavioral theories of leadership）：表明可以把人培养成领导者的理论；与特质研究为甄选领导者奠定基础相对，行为研究指向领导培养","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">领导行为理论</strong>（behavioral theories of leadership）：表明可以把人培养成领导者的理论；与特质研究为甄选领导者奠定基础相对，行为研究指向领导培养"},{"t":"俄亥俄州立大学研究：最全面且得到最多验证的领导行为理论；从收集的1000多个维度最终缩减为两个独立维度","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">俄亥俄州立大学研究</strong>：最全面且得到最多验证的领导行为理论；从收集的1000多个维度最终缩减为两个独立维度"},{"t":"结构维度（initiating structure）：领导者为了实现组织目标而对自己与下属的角色进行界定和建构的程度——为下属安排特定工作任务、设定具体绩效标准、强调最后期限（任务导向）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">结构维度</strong>（initiating structure）：领导者为了实现组织目标而对自己与下属的角色进行界定和建构的程度——为下属安排特定工作任务、设定具体绩效标准、强调最后期限（任务导向）"},{"t":"关怀维度（consideration）：领导者的工作关系以相互信任、尊重下属意见和重视下属情感为特征的程度——帮助下属解决个人问题、友善且平易近人、对所有下属一视同仁、欣赏和支持下属（人导向）；美国有66%的受访员工提到「欣赏」最能激励其工作","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">关怀维度</strong>（consideration）：领导者的工作关系以相互信任、尊重下属意见和重视下属情感为特征的程度——帮助下属解决个人问题、友善且平易近人、对所有下属一视同仁、欣赏和支持下属（人导向）；美国有66%的受访员工提到「欣赏」最能激励其工作"},{"t":"研究结果：高关怀与下属更高的工作满意度和积极性、更尊重领导者相关；高结构有类似但程度较小的影响；两维度与领导者绩效、团队绩效、领导有效性评分均存在中等相关关系","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">研究结果</strong>：高关怀与下属更高的工作满意度和积极性、更尊重领导者相关；高结构有类似但程度较小的影响；两维度与领导者绩效、团队绩效、领导有效性评分均存在中等相关关系"},{"t":"文化差异（GLOBE项目）：在不喜欢单方面决策的文化（如巴西），高关怀维度的领导者最成功；法国人对领导者的看法更官僚化、较少期待人情味，高结构（任务导向）、相对独裁的领导者表现更好；中国文化强调礼仪、关怀和无私且绩效导向高，两维度可能同等重要","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">文化差异</strong>（GLOBE项目）：在不喜欢单方面决策的文化（如巴西），高关怀维度的领导者最成功；法国人对领导者的看法更官僚化、较少期待人情味，高结构（任务导向）、相对独裁的领导者表现更好；中国文化强调礼仪、关怀和无私且绩效导向高，两维度可能同等重要"},{"t":"12.2.1 对特质理论和行为理论的小结：两者都有效，各自解释领导涌现和有效性的某一方面；三个困难——正确识别哪种特质或行为可以预测结果、探索哪些特质与行为的组合带来结果、确定特质与行为和结果的因果关系；特质和行为都不能保证成功，情境也很重要——引出权变理论","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">12.2.1 对特质理论和行为理论的小结</strong>：两者都有效，各自解释领导涌现和有效性的某一方面；三个困难——正确识别哪种特质或行为可以预测结果、探索哪些特质与行为的组合带来结果、确定特质与行为和结果的因果关系；特质和行为都不能保证成功，情境也很重要——引出权变理论"}],"k":"sec","i":0,"h":"12.2 行为理论"},{"t":"12.3 权变理论","c":[{"t":"基本逻辑：某一种风格在条件a下合适，y风格更适合条件b——有效的领导取决于领导风格与情境的匹配","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">基本逻辑</strong>：某一种风格在条件a下合适，y风格更适合条件b——有效的领导取决于领导风格与情境的匹配"},{"t":"12.3.1 费德勒模型","c":[{"t":"费德勒权变模型（Fiedler contingency model）：有效的群体绩效取决于两个因素的合理匹配——领导者的风格与领导者对情境的控制程度；假设个人领导风格固定不变","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">费德勒权变模型</strong>（Fiedler contingency model）：有效的群体绩效取决于两个因素的合理匹配——领导者的风格与领导者对情境的控制程度；假设个人领导风格固定不变"},{"t":"最难共事者问卷（least preferred co-worker questionnaire，LPC）：要求描述最不喜欢与之共事的同事；以相对正面的词汇描述（LPC得分高）为关系导向型，看法消极（LPC得分低）为任务导向型（更感兴趣的是生产率）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最难共事者问卷</strong>（least preferred co-worker questionnaire，LPC）：要求描述最不喜欢与之共事的同事；以相对正面的词汇描述（LPC得分高）为关系导向型，看法消极（LPC得分低）为任务导向型（更感兴趣的是生产率）"},{"t":"三种情境维度：领导-成员关系（下属对领导者的信任、信赖和尊重程度）；任务结构（工作任务的条理化、结构化程度）；职位权力（领导者对招聘、解雇、处罚、晋升、加薪等权力变量的影响程度）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三种情境维度</strong>：领导-成员关系（下属对领导者的信任、信赖和尊重程度）；任务结构（工作任务的条理化、结构化程度）；职位权力（领导者对招聘、解雇、处罚、晋升、加薪等权力变量的影响程度）"},{"t":"结论：任务结构化程度越高、职位权力越强，领导者控制力越强；在最有利与最不利的情境中任务导向型领导者效果更好，在中等有利情境中关系导向型领导者效果更好","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：任务结构化程度越高、职位权力越强，领导者控制力越强；在最有利与最不利的情境中任务导向型领导者效果更好，在中等有利情境中关系导向型领导者效果更好"},{"t":"评价：起初的结果支持该模型，但近年研究不多；提供思考角度，严格的实践应用仍存在问题","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">评价</strong>：起初的结果支持该模型，但近年研究不多；提供思考角度，严格的实践应用仍存在问题"}],"k":"b","i":1,"h":"12.3.1 费德勒模型"},{"t":"12.3.2 情境领导理论","c":[{"t":"情境领导理论（situational leadership theory，SLT）：将关注点放在下属身上，认为成功的领导通过选择与下属成熟度相一致的领导风格实现","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情境领导理论</strong>（situational leadership theory，SLT）：将关注点放在下属身上，认为成功的领导通过选择与下属成熟度相一致的领导风格实现"},{"t":"成熟度：下属完成某项具体工作的意愿和能力","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成熟度</strong>：下属完成某项具体工作的意愿和能力"},{"t":"四种情境的匹配：无能力且无意愿——提供明确具体的指示；无能力但有意愿——任务导向行为弥补能力欠缺，辅以关系导向行为使其接受意愿；有能力却无意愿——采用支持性的、参与性的领导风格；既有能力又有意愿——领导者不需要做太多事情","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">四种情境的匹配</strong>：无能力且无意愿——提供明确具体的指示；无能力但有意愿——任务导向行为弥补能力欠缺，辅以关系导向行为使其接受意愿；有能力却无意愿——采用支持性的、参与性的领导风格；既有能力又有意愿——领导者不需要做太多事情"},{"t":"评价：直觉上合理，承认下属的重要性；但检验结果令人失望，可能原因包括模型内在的模糊性与不一致性、检验所用研究方法的问题；流行但应慎重应用","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">评价</strong>：直觉上合理，承认下属的重要性；但检验结果令人失望，可能原因包括模型内在的模糊性与不一致性、检验所用研究方法的问题；流行但应慎重应用"}],"k":"b","i":1,"h":"12.3.2 情境领导理论"},{"t":"12.3.3 路径-目标理论","c":[{"t":"路径-目标理论（path-goal theory）：罗伯特·豪斯提出，吸收了关怀/结构维度研究与期望理论；领导者的工作是为下属提供信息、支持或其他必要的资源来帮助他们实现目标——指明通向目标的路径并扫清障碍","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">路径-目标理论</strong>（path-goal theory）：罗伯特·豪斯提出，吸收了关怀/结构维度研究与期望理论；领导者的工作是为下属提供信息、支持或其他必要的资源来帮助他们实现目标——指明通向目标的路径并扫清障碍"},{"t":"三条命题：任务不明确或压力过大时，命令型领导带来更高的员工满意度；下属从事结构化任务时，支持型领导带来更高的绩效和满意度；对认知能力强或经验丰富的下属，指示型领导可能被视为多余的","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三条命题</strong>：任务不明确或压力过大时，命令型领导带来更高的员工满意度；下属从事结构化任务时，支持型领导带来更高的绩效和满意度；对认知能力强或经验丰富的下属，指示型领导可能被视为多余的"},{"t":"评价：直觉上有吸引力，应用应当谨慎，但仍是检验领导重要作用的有用框架","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">评价</strong>：直觉上有吸引力，应用应当谨慎，但仍是检验领导重要作用的有用框架"}],"k":"b","i":1,"h":"12.3.3 路径-目标理论"},{"t":"12.3.4 领导者-参与模型","c":[{"t":"领导者-参与模型（leader-participation model）：将领导行为与下属的决策参与联系到一起；领导者必须调整行为以适应任务结构（例行的、非例行的或介于二者之间）；不涵盖所有领导行为，仅限于推荐哪些类型的决策最好让下属参与","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">领导者-参与模型</strong>（leader-participation model）：将领导行为与下属的决策参与联系到一起；领导者必须调整行为以适应任务结构（例行的、非例行的或介于二者之间）；不涵盖所有领导行为，仅限于推荐哪些类型的决策最好让下属参与"},{"t":"承接：领导是领导者与下属之间的一种共生关系；上述权变理论假设领导者对每个下属都采取同样风格，实际领导者会区别对待——引出LMX","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">承接</strong>：领导是领导者与下属之间的一种共生关系；上述权变理论假设领导者对每个下属都采取同样风格，实际领导者会区别对待——引出LMX"}],"k":"b","i":1,"h":"12.3.4 领导者-参与模型"}],"k":"sec","i":0,"h":"12.3 权变理论"},{"t":"12.4 当代领导理论","c":[{"t":"目标：发现领导者涌现以及影响和指导员工与组织的独特方式；建立在此前理论基础上，对领导的理解是一门不断发展的科学","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">目标</strong>：发现领导者涌现以及影响和指导员工与组织的独特方式；建立在此前理论基础上，对领导的理解是一门不断发展的科学"},{"t":"12.4.1 领导-成员交换理论","c":[{"t":"领导-成员交换理论（leader-member exchange theory，LMX）：由于时间压力，领导会与一小部分下属建立特殊关系——圈内人被信任、得到更多关照、更可能享有特权，其他下属成为圈外人","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">领导-成员交换理论</strong>（leader-member exchange theory，LMX）：由于时间压力，领导会与一小部分下属建立特殊关系——圈内人被信任、得到更多关照、更可能享有特权，其他下属成为圈外人"},{"t":"机制：在互动初期隐含地划分圈内/圈外，且关系相对稳固、不随时间推移而改变；领导通过奖励希望亲近者、对不想亲近者施以惩罚建立交换关系；领导和下属都必须投资才能保持关系完整","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机制</strong>：在互动初期隐含地划分圈内/圈外，且关系相对稳固、不随时间推移而改变；领导通过奖励希望亲近者、对不想亲近者施以惩罚建立交换关系；领导和下属都必须投资才能保持关系完整"},{"t":"圈内人倾向：人口统计学特征、态度和人格与领导相似，或相比圈外人能力更强；性别相同的领导与下属往往有更高的LMX水平","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">圈内人倾向</strong>：人口统计学特征、态度和人格与领导相似，或相比圈外人能力更强；性别相同的领导与下属往往有更高的LMX水平"},{"t":"实证支持：圈内下属获得更高的绩效评估、更乐于提供帮助和公民行为、更少越轨或反生产行为、对上司更满意；LMX通过增强信任、动机、授权和工作满意度影响工作结果（对领导者的信任影响最大）；LMX还与创意和创新行为相关","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实证支持</strong>：圈内下属获得更高的绩效评估、更乐于提供帮助和公民行为、更少越轨或反生产行为、对上司更满意；LMX通过增强信任、动机、授权和工作满意度影响工作结果（对领导者的信任影响最大）；LMX还与创意和创新行为相关"},{"t":"负面效应：当领导者明显差异化对待圈内/圈外时，所有员工的工作态度更消极、退缩行为更多；区别对待损害团队信任与程序正义，团队变得不协调、整体绩效受损","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">负面效应</strong>：当领导者明显差异化对待圈内/圈外时，所有员工的工作态度更消极、退缩行为更多；区别对待损害团队信任与程序正义，团队变得不协调、整体绩效受损"}],"k":"b","i":1,"h":"12.4.1 领导-成员交换理论"},{"t":"12.4.2 魅力型领导","c":[{"t":"魅力型领导理论（charismatic leadership theory）：下属观察到某些特定行为时，把它们归因于英雄主义的或超乎寻常的领导能力；韦伯最先提出「魅力」概念，豪斯第一个从组织行为学角度研究","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">魅力型领导理论</strong>（charismatic leadership theory）：下属观察到某些特定行为时，把它们归因于英雄主义的或超乎寻常的领导能力；韦伯最先提出「魅力」概念，豪斯第一个从组织行为学角度研究"},{"t":"魅力型领导者的关键特点：拥有愿景并清晰表述（理想化的目标，用易于理解的语言阐述其重要性）；敢于冒险、不惜高成本、为愿景自我牺牲；对下属需求敏感（了解他人能力，积极回应需求与情感）；打破常规的行为（被视为新奇的、不合规范的）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">魅力型领导者的关键特点</strong>：拥有愿景并清晰表述（理想化的目标，用易于理解的语言阐述其重要性）；敢于冒险、不惜高成本、为愿景自我牺牲；对下属需求敏感（了解他人能力，积极回应需求与情感）；打破常规的行为（被视为新奇的、不合规范的）"},{"t":"先天还是后天：两者都是——个体天生具备使自己更有魅力的人格特质（魅力型领导者多为情绪稳定而外向）；魅力也可通过培训发展（用激情作催化剂，富有魅力的语调、眼神交流、生动的面部表情和姿势；热情会传染）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">先天还是后天</strong>：两者都是——个体天生具备使自己更有魅力的人格特质（魅力型领导者多为情绪稳定而外向）；魅力也可通过培训发展（用激情作催化剂，富有魅力的语调、眼神交流、生动的面部表情和姿势；热情会传染）"},{"t":"如何影响下属：阐述有吸引力的愿景（vision——为达成目标的长期战略，将组织现状与更美好的未来联系起来）；用愿景陈述（vision statement——对组织愿景或使命的正式阐述）传递总体目标；言行传递新的价值观并以身作则；下属「捕捉」领导者传递的情绪从而产生情感认同；缺乏自尊、质疑自我价值的人更容易接受魅力型领导的方向","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">如何影响下属</strong>：阐述有吸引力的愿景（vision——为达成目标的长期战略，将组织现状与更美好的未来联系起来）；用愿景陈述（vision statement——对组织愿景或使命的正式阐述）传递总体目标；言行传递新的价值观并以身作则；下属「捕捉」领导者传递的情绪从而产生情感认同；缺乏自尊、质疑自我价值的人更容易接受魅力型领导的方向"},{"t":"情境条件：人们感受到危机或压力时更易接纳魅力型领导者（政治或宗教领域、战争时期、企业初创或生存危机）；睡眠剥夺会通过减少深层扮演削弱魅力型领导；对组织高层可能更重要，但也可在远程或小范围内有效","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情境条件</strong>：人们感受到危机或压力时更易接纳魅力型领导者（政治或宗教领域、战争时期、企业初创或生存危机）；睡眠剥夺会通过减少深层扮演削弱魅力型领导；对组织高层可能更重要，但也可在远程或小范围内有效"},{"t":"缺点：自恋者更容易表现出魅力型领导特质；有魅力但腐败的领导者把个人目标凌驾于组织目标之上（安然、泰科、世通、HealthSouth）；魅力既可用来做好事也可用来做坏事，成效取决于情境、愿景以及组织设置的核查和制衡","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">缺点</strong>：自恋者更容易表现出魅力型领导特质；有魅力但腐败的领导者把个人目标凌驾于组织目标之上（安然、泰科、世通、HealthSouth）；魅力既可用来做好事也可用来做坏事，成效取决于情境、愿景以及组织设置的核查和制衡"}],"k":"b","i":1,"h":"12.4.2 魅力型领导"},{"t":"12.4.3 交易型和变革型领导","c":[{"t":"交易型领导者（transactional leader）：通过澄清工作角色与任务要求来指导下属实现既定目标","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">交易型领导者</strong>（transactional leader）：通过澄清工作角色与任务要求来指导下属实现既定目标"},{"t":"变革型领导者（transformational leader）：鼓励下属将个人利益升华为组织利益；关注员工个体的利益和需求；帮助下属用创新视角看待老问题；激励、调动和鼓舞下属为群体目标付出更多努力；下属以更高水平的绩效、组织公民行为、创造力、满意度、心理健康与动机回应；当下属能与客户等受益者直接互动、看到工作的积极影响时最有效","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">变革型领导者</strong>（transformational leader）：鼓励下属将个人利益升华为组织利益；关注员工个体的利益和需求；帮助下属用创新视角看待老问题；激励、调动和鼓舞下属为群体目标付出更多努力；下属以更高水平的绩效、组织公民行为、创造力、满意度、心理健康与动机回应；当下属能与客户等受益者直接互动、看到工作的积极影响时最有效"},{"t":"交易型领导者的特点（图表12-4）：权变奖励——制定努力与奖励的交换规则、承诺对良好绩效给予奖励、认可成就；例外管理（主动的）——观察并纠正偏离规则和标准的行为；例外管理（被动的）——只有不符合标准时才干预；放任——放弃责任、避免制定决策","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">交易型领导者的特点</strong>（图表12-4）：权变奖励——制定努力与奖励的交换规则、承诺对良好绩效给予奖励、认可成就；例外管理（主动的）——观察并纠正偏离规则和标准的行为；例外管理（被动的）——只有不符合标准时才干预；放任——放弃责任、避免制定决策"},{"t":"变革型领导者的特点（图表12-4）：领导魅力——提供愿景和使命感、灌输荣誉感、赢得尊重和信任；感召力——传递高期望、激励众志成城；智力激发——激发智力和理性、培养解决问题的能力；个性化关怀——关爱员工、区别对待、提供指导和建议","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">变革型领导者的特点</strong>（图表12-4）：领导魅力——提供愿景和使命感、灌输荣誉感、赢得尊重和信任；感召力——传递高期望、激励众志成城；智力激发——激发智力和理性、培养解决问题的能力；个性化关怀——关爱员工、区别对待、提供指导和建议"},{"t":"全范围领导模型（full range of leadership model）：从无效到有效排列——放任（顺其自然，最被动因此效果最差）→例外管理（主动/被动，例外引发危机时才介入往往为时已晚）→权变奖励（有效但无法让员工超越职责）→变革型四要素（激励下属超出期望的表现，带来出色成果）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">全范围领导模型</strong>（full range of leadership model）：从无效到有效排列——放任（顺其自然，最被动因此效果最差）→例外管理（主动/被动，例外引发危机时才介入往往为时已晚）→权变奖励（有效但无法让员工超越职责）→变革型四要素（激励下属超出期望的表现，带来出色成果）"},{"t":"互补关系：变革型与交易型互为补充而非对立；最好的领导者两者兼具；变革型建立在交易型基础上；变革型对团队绩效和领导者满意度更重要，交易型（主要指权变奖励）对领导者有效性和下属工作满意度更重要","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">互补关系</strong>：变革型与交易型互为补充而非对立；最好的领导者两者兼具；变革型建立在交易型基础上；变革型对团队绩效和领导者满意度更重要，交易型（主要指权变奖励）对领导者有效性和下属工作满意度更重要"},{"t":"发挥作用的机制：满足下属的自主性、能力和关系需求（自我决定理论）；通过赋权提升绩效与组织公民行为（组织性强的组织中更明显）；通过提高信任和亲社会动机促进助人行为；通过增加内在动机改善工作场所安全","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">发挥作用的机制</strong>：满足下属的自主性、能力和关系需求（自我决定理论）；通过赋权提升绩效与组织公民行为（组织性强的组织中更明显）；通过提高信任和亲社会动机促进助人行为；通过增加内在动机改善工作场所安全"},{"t":"检验与边界：在多种职业与职级中获得支持；对小型私营企业的影响大于结构复杂的组织；认知要求高、工作量大、时间压力大时更能提高敬业度、减少情绪耗竭；团队高权力距离且集体主义时对群体效能更有效；员工经验开放性高、自我效能感高时更有效；智力存在最优点——「太聪明」的领导者可能因方案过于复杂、沟通复杂而显得缺乏变革性","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">检验与边界</strong>：在多种职业与职级中获得支持；对小型私营企业的影响大于结构复杂的组织；认知要求高、工作量大、时间压力大时更能提高敬业度、减少情绪耗竭；团队高权力距离且集体主义时对群体效能更有效；员工经验开放性高、自我效能感高时更有效；智力存在最优点——「太聪明」的领导者可能因方案过于复杂、沟通复杂而显得缺乏变革性"},{"t":"与魅力型领导对比：魅力型更注重沟通方式（是否充满激情与活力），变革型更注重沟通内容（是否是有说服力的愿景）；相似性大于差异性，研究者认为两个概念有时可互换","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与魅力型领导对比</strong>：魅力型更注重沟通方式（是否充满激情与活力），变革型更注重沟通内容（是否是有说服力的愿景）；相似性大于差异性，研究者认为两个概念有时可互换"},{"t":"局限：变革型领导与权变奖励高度相关，以至于这一区分可能显得多余；变革型并不总是胜过交易型（权变奖励有时不分伯仲）；总体结论——正确应用时变革型领导可取且有效","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">局限</strong>：变革型领导与权变奖励高度相关，以至于这一区分可能显得多余；变革型并不总是胜过交易型（权变奖励有时不分伯仲）；总体结论——正确应用时变革型领导可取且有效"}],"k":"b","i":1,"h":"12.4.3 交易型和变革型领导"},{"t":"小结：当代理论为理解领导有效性做出了主要贡献；领导者对组织和员工都很重要","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">小结</strong>：当代理论为理解领导有效性做出了主要贡献；领导者对组织和员工都很重要"}],"k":"sec","i":0,"h":"12.4 当代领导理论"},{"t":"12.5 责任型领导","c":[{"t":"定位：前面的理论没有明确阐述道德和信任的作用；本节讨论明确阐述领导者在创建道德组织过程中的作用的当代概念；变革型领导者可能同时是责任型领导者","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">定位</strong>：前面的理论没有明确阐述道德和信任的作用；本节讨论明确阐述领导者在创建道德组织过程中的作用的当代概念；变革型领导者可能同时是责任型领导者"},{"t":"12.5.1 真实型领导","c":[{"t":"真实型领导（authentic leader）：清楚地知道自己是谁、知道自己的信念，并能坦率、公开地按照自己的信念和价值观行事的领导者；注重领导者的道德方面","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">真实型领导</strong>（authentic leader）：清楚地知道自己是谁、知道自己的信念，并能坦率、公开地按照自己的信念和价值观行事的领导者；注重领导者的道德方面"},{"t":"表现：与下属分享信息、鼓励开诚布公的沟通、坚持自己的理想、谦虚（谦虚的领导者可作榜样，帮助下属了解成长过程）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表现</strong>：与下属分享信息、鼓励开诚布公的沟通、坚持自己的理想、谦虚（谦虚的领导者可作榜样，帮助下属了解成长过程）"},{"t":"效果：加强公司合作、提高团队生产率和公司绩效（高管层表现出真实型领导行为时尤甚）；践行所宣扬的东西使下属产生强烈的情感承诺和信任，绩效与组织公民行为改善；领导者与下属的共同真实性带来基本需求满足，进而改善绩效","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效果</strong>：加强公司合作、提高团队生产率和公司绩效（高管层表现出真实型领导行为时尤甚）；践行所宣扬的东西使下属产生强烈的情感承诺和信任，绩效与组织公民行为改善；领导者与下属的共同真实性带来基本需求满足，进而改善绩效"}],"k":"b","i":1,"h":"12.5.1 真实型领导"},{"t":"12.5.2 道德型领导","c":[{"t":"核心问题：评估领导效果要看领导者实现目标的手段以及目标的内容；道德型高层领导不仅影响直接下属，影响还沿指挥链向下传播（高层设定期望并要求下级按道德准则行事）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心问题</strong>：评估领导效果要看领导者实现目标的手段以及目标的内容；道德型高层领导不仅影响直接下属，影响还沿指挥链向下传播（高层设定期望并要求下级按道德准则行事）"},{"t":"效果：道德水平较高的领导者获得更积极的评价，下属满意度更高、压力水平和离职意愿更低；下属更有动力、绩效更高、更多组织公民行为、更少反生产行为；道德型领导改变员工对组织公民行为是否公平的看法（公平理论）；增强群体对道德问题的意识、提高群体就道德问题发声的程度、增强同理心；减少人际冲突；改善客户服务结果","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效果</strong>：道德水平较高的领导者获得更积极的评价，下属满意度更高、压力水平和离职意愿更低；下属更有动力、绩效更高、更多组织公民行为、更少反生产行为；道德型领导改变员工对组织公民行为是否公平的看法（公平理论）；增强群体对道德问题的意识、提高群体就道德问题发声的程度、增强同理心；减少人际冲突；改善客户服务结果"},{"t":"社会化的魅力型领导（socialized charismatic leadership）：在道德方面以身作则、以他人（而非自己）为中心的价值观的领导，把道德型领导与魅力型领导结合起来；通过言行使员工的价值观与自己的价值观一致","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社会化的魅力型领导</strong>（socialized charismatic leadership）：在道德方面以身作则、以他人（而非自己）为中心的价值观的领导，把道德型领导与魅力型领导结合起来；通过言行使员工的价值观与自己的价值观一致"},{"t":"管理者责任：高层管理者为组织确定道德基调——设立高水平道德标准并以身作则、鼓励和奖赏正直行为、避免滥用权力；对赴国外工作或管理多元文化团队者应开展包含文化价值观的道德型领导培训；下属的正念更强时道德型领导的影响更大","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理者责任</strong>：高层管理者为组织确定道德基调——设立高水平道德标准并以身作则、鼓励和奖赏正直行为、避免滥用权力；对赴国外工作或管理多元文化团队者应开展包含文化价值观的道德型领导培训；下属的正念更强时道德型领导的影响更大"},{"t":"传递道德信念：道德行为没有统一标准（文化、行业、组织各异），领导者必须愿意表达道德信仰并说服他人遵循；道德领袖的话语可以积极（丘吉尔）也可以消极（甘地），只要清晰、道德、具有包容性、目标明确且有说服力就同样有效","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传递道德信念</strong>：道德行为没有统一标准（文化、行业、组织各异），领导者必须愿意表达道德信仰并说服他人遵循；道德领袖的话语可以积极（丘吉尔）也可以消极（甘地），只要清晰、道德、具有包容性、目标明确且有说服力就同样有效"},{"t":"可能的坏处：道德型领导可能引发后续的辱虐管理；道德行为会耗尽资源——觉得自己过去「表现得好」，接下来可能允许自己「表现得不好」","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">可能的坏处</strong>：道德型领导可能引发后续的辱虐管理；道德行为会耗尽资源——觉得自己过去「表现得好」，接下来可能允许自己「表现得不好」"}],"k":"b","i":1,"h":"12.5.2 道德型领导"},{"t":"12.5.3 辱虐管理","c":[{"t":"辱虐管理（abusive supervision）：主管在言语或非言语行为中怀有敌意；据研究每年给美国组织造成约238亿美元损失；美国处于相对较低水平，菲律宾等地区得分最高","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">辱虐管理</strong>（abusive supervision）：主管在言语或非言语行为中怀有敌意；据研究每年给美国组织造成约238亿美元损失；美国处于相对较低水平，菲律宾等地区得分最高"},{"t":"相关因素：几乎所有公平维度（尤其人际公平）与之负相关——不公平是核心；消极情感与之强相关；随和性、责任心与之弱负相关；家庭暴力史与之有关","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">相关因素</strong>：几乎所有公平维度（尤其人际公平）与之负相关——不公平是核心；消极情感与之强相关；随和性、责任心与之弱负相关；家庭暴力史与之有关"},{"t":"后果：损害健康（抑郁、情绪低落、工作紧张）；降低组织承诺、工作满意度和组织支持感；增加工作-家庭冲突；负面绩效；受害者出现反生产行为和越轨行为（尤其报复主管），更少参与组织公民行为","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">后果</strong>：损害健康（抑郁、情绪低落、工作紧张）；降低组织承诺、工作满意度和组织支持感；增加工作-家庭冲突；负面绩效；受害者出现反生产行为和越轨行为（尤其报复主管），更少参与组织公民行为"},{"t":"恶性循环：员工受害→以反生产行为和越轨行为反击组织和主管→主管反过来继续虐待报复；员工受虐时常责怪组织，把主管视为整个组织的代表；有责任心、以回避问题应对的员工更能应对","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">恶性循环</strong>：员工受害→以反生产行为和越轨行为反击组织和主管→主管反过来继续虐待报复；员工受虐时常责怪组织，把主管视为整个组织的代表；有责任心、以回避问题应对的员工更能应对"}],"k":"b","i":1,"h":"12.5.3 辱虐管理"},{"t":"12.5.4 公仆型领导","c":[{"t":"公仆型领导（servant leadership）：超越自身利益、将注意力集中在帮助下属成长和发展上的领导方式；典型表现——倾听、移情、说服、有管家精神和责任感、积极开发下属潜力；与自恋这一特质负相关","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公仆型领导</strong>（servant leadership）：超越自身利益、将注意力集中在帮助下属成长和发展上的领导方式；典型表现——倾听、移情、说服、有管家精神和责任感、积极开发下属潜力；与自恋这一特质负相关"},{"t":"效果：创造服务型文化，改善业绩并通过增强员工对组织的认同感改善态度和绩效；对职责义务受到鼓励的下属，与组织公民行为关系更密切；提高团队潜能（员工认为团队技能和能力高于平均水平）带来优异绩效；高水平的公仆型领导带来更高水平的创造性绩效","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效果</strong>：创造服务型文化，改善业绩并通过增强员工对组织的认同感改善态度和绩效；对职责义务受到鼓励的下属，与组织公民行为关系更密切；提高团队潜能（员工认为团队技能和能力高于平均水平）带来优异绩效；高水平的公仆型领导带来更高水平的创造性绩效"},{"t":"文化差异：美国人把领导者描述为「站在团队前面对下属发号施令」，新加坡人描述为「站在团队后面收集意见并团结大家」——东亚文化中的领导者原型更符合公仆型领导，它在这些文化中可能更普遍、更有效","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化差异</strong>：美国人把领导者描述为「站在团队前面对下属发号施令」，新加坡人描述为「站在团队后面收集意见并团结大家」——东亚文化中的领导者原型更符合公仆型领导，它在这些文化中可能更普遍、更有效"}],"k":"b","i":1,"h":"12.5.4 公仆型领导"},{"t":"小结：关于道德和信任的研究为领导理论补上了不可缺少的一块拼图","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">小结</strong>：关于道德和信任的研究为领导理论补上了不可缺少的一块拼图"}],"k":"sec","i":0,"h":"12.5 责任型领导"},{"t":"12.6 积极领导","c":[{"t":"思路：在每个理论中都有实践好的、差的或平庸的领导的可能性；要有意识地发展积极领导环境","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">思路</strong>：在每个理论中都有实践好的、差的或平庸的领导的可能性；要有意识地发展积极领导环境"},{"t":"12.6.1 信任","c":[{"t":"信任（trust）：个体由于对事情走向抱有积极预期而使自己易受他人影响的一种心理状态；是与领导密切相关的主要属性，信任被破坏会给群体绩效带来严重后果","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信任</strong>（trust）：个体由于对事情走向抱有积极预期而使自己易受他人影响的一种心理状态；是与领导密切相关的主要属性，信任被破坏会给群体绩效带来严重后果"},{"t":"重要性：下属信任领导者时相信自己不会被剥夺权力和利益；变革型领导者能获得更高水平的信任，带来更强的团队信心和更高的团队绩效；当今雇佣关系更多建立在信任之上——员工基于信任的自愿贡献必不可少，只有被信任的领导者才能鼓励员工超越自我","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">重要性</strong>：下属信任领导者时相信自己不会被剥夺权力和利益；变革型领导者能获得更高水平的信任，带来更强的团队信心和更高的团队绩效；当今雇佣关系更多建立在信任之上——员工基于信任的自愿贡献必不可少，只有被信任的领导者才能鼓励员工超越自我"},{"t":"信任的结果：鼓励承担风险；有助于信息分享；存在信任的群体更加有效；有利于提高生产率（信任上级的员工获得更高的绩效评估）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信任的结果</strong>：鼓励承担风险；有助于信息分享；存在信任的群体更加有效；有利于提高生产率（信任上级的员工获得更高的绩效评估）"},{"t":"信任的三个关键特征：正直（诚实和真诚，保持言行一致；「诚实」在调查中是最重要的领导属性）；仁慈（信任的人会考虑你的利益，即使你的利益与他的不一致）；能力（技术和人际关系方面的知识和技能）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信任的三个关键特征</strong>：正直（诚实和真诚，保持言行一致；「诚实」在调查中是最重要的领导属性）；仁慈（信任的人会考虑你的利益，即使你的利益与他的不一致）；能力（技术和人际关系方面的知识和技能）"},{"t":"信任倾向：某个员工信任一个领导者的可能性；与随和性相关，缺乏自尊的人更不容易相信他人；仔细记录每个承诺的人信任倾向较低","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信任倾向</strong>：某个员工信任一个领导者的可能性；与随和性相关，缺乏自尊的人更不容易相信他人；仔细记录每个承诺的人信任倾向较低"},{"t":"信任与文化：集体主义语境中，仁慈且道德的家长式领导会增加信任；个人主义社会中家长式领导可能激怒员工，信任更多基于领导支持和一致性维度","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信任与文化</strong>：集体主义语境中，仁慈且道德的家长式领导会增加信任；个人主义社会中家长式领导可能激怒员工，信任更多基于领导支持和一致性维度"},{"t":"时间的角色：信任产生于一段时间的观察之后——展示正直、仁慈和能力（或在可以投机取巧时拒绝这样做）；展现胜任力、失败时道歉而非否认；把自上而下的命令变成组织中不间断的对话机制；定期以亲密、互动和包容的方式面对面交流","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">时间的角色</strong>：信任产生于一段时间的观察之后——展示正直、仁慈和能力（或在可以投机取巧时拒绝这样做）；展现胜任力、失败时道歉而非否认；把自上而下的命令变成组织中不间断的对话机制；定期以亲密、互动和包容的方式面对面交流"},{"t":"重获信任：破坏信任的代价——更低满意度、忠诚度，更高离职意愿，更少组织公民行为，更低任务绩效；因缺乏能力而破坏——道歉并承认本可以做得更好；因不够正直——道歉作用不大；沉默应对、拒绝承认或否认责任永远无效；观察到犯错者始终表现可信可重建信任；使用过欺骗手段的，即使道歉、承诺也难以完全恢复","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">重获信任</strong>：破坏信任的代价——更低满意度、忠诚度，更高离职意愿，更少组织公民行为，更低任务绩效；因缺乏能力而破坏——道歉并承认本可以做得更好；因不够正直——道歉作用不大；沉默应对、拒绝承认或否认责任永远无效；观察到犯错者始终表现可信可重建信任；使用过欺骗手段的，即使道歉、承诺也难以完全恢复"}],"k":"b","i":1,"h":"12.6.1 信任"},{"t":"12.6.2 导师制","c":[{"t":"导师（mentor）：为经验不足的员工（徒弟）提供支持和帮助的资深员工；成功的导师都是好老师——清晰陈述自己的想法、善于倾听、对徒弟的问题感同身受","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">导师</strong>（mentor）：为经验不足的员工（徒弟）提供支持和帮助的资深员工；成功的导师都是好老师——清晰陈述自己的想法、善于倾听、对徒弟的问题感同身受"},{"t":"两种职能：职业职能——通过游说让徒弟获得有挑战性且能被他人注意的任务、指导徒弟开发技能实现目标、引荐组织内有影响力的人物、保护徒弟声誉、支持晋升、充当向直接主管转达想法的传声筒；心理职能——提供咨询和建议帮助建立自信、分享个人经验、建立友谊和认可、做榜样","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两种职能</strong>：职业职能——通过游说让徒弟获得有挑战性且能被他人注意的任务、指导徒弟开发技能实现目标、引荐组织内有影响力的人物、保护徒弟声誉、支持晋升、充当向直接主管转达想法的传声筒；心理职能——提供咨询和建议帮助建立自信、分享个人经验、建立友谊和认可、做榜样"},{"t":"正式与非正式导师制：正式导师制根据对领导潜力的评估将徒弟候选人与领导者匹配；非正式导师制由领导者发现低层级员工的发展潜力后建立；目的都是向徒弟展示组织在正式结构和程序之外是如何运转的；并非所有员工都有同等机会","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">正式与非正式导师制</strong>：正式导师制根据对领导潜力的评估将徒弟候选人与领导者匹配；非正式导师制由领导者发现低层级员工的发展潜力后建立；目的都是向徒弟展示组织在正式结构和程序之外是如何运转的；并非所有员工都有同等机会"},{"t":"有效性：正式关系不如非正式关系有效（糟糕的规划、设计和沟通所致）；正确匹配工作风格、需求和技能时正式导师制最可能成功；导师的有效性取决于其可获得的资源与社会关系网（社会关系是预测事业成功的重要指标）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有效性</strong>：正式关系不如非正式关系有效（糟糕的规划、设计和沟通所致）；正确匹配工作风格、需求和技能时正式导师制最可能成功；导师的有效性取决于其可获得的资源与社会关系网（社会关系是预测事业成功的重要指标）"},{"t":"结论：导师制的收获主要是心理层面（增强信心）；它对事业成功的影响不及能力和人格","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：导师制的收获主要是心理层面（增强信心）；它对事业成功的影响不及能力和人格"}],"k":"b","i":1,"h":"12.6.2 导师制"}],"k":"sec","i":0,"h":"12.6 积极领导"},{"t":"12.7 对领导的理解所面临的挑战","c":[{"t":"出发点：组织的成败在很大程度上取决于领导之外的其他因素（特定时间处于正确还是错误的位置）；需考察对领导重要性的流行观念的质疑","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">出发点</strong>：组织的成败在很大程度上取决于领导之外的其他因素（特定时间处于正确还是错误的位置）；需考察对领导重要性的流行观念的质疑"},{"t":"12.7.1 领导作为一种归因结果","c":[{"t":"领导归因理论（attribution theory of leadership）：领导仅仅是人们对其他个体进行的一种归因——把高智商、开朗的性格、很强的语言表达能力、进取心、理解力强且勤奋归于领导者；组织层面不论对错，都倾向于让领导者对极坏或极好的绩效结果承担责任","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">领导归因理论</strong>（attribution theory of leadership）：领导仅仅是人们对其他个体进行的一种归因——把高智商、开朗的性格、很强的语言表达能力、进取心、理解力强且勤奋归于领导者；组织层面不论对错，都倾向于让领导者对极坏或极好的绩效结果承担责任"},{"t":"证据：对CEO超凡魅力的感知并没有促成客观的公司绩效，但公司绩效促成了对CEO魅力的感知；员工对领导者行为的看法显著预测领导者是否因失败受指责（无论其自我评价如何）；喜欢将领导「浪漫化」的人更容易相信领导者是变革型的","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证据</strong>：对CEO超凡魅力的感知并没有促成客观的公司绩效，但公司绩效促成了对CEO魅力的感知；员工对领导者行为的看法显著预测领导者是否因失败受指责（无论其自我评价如何）；喜欢将领导「浪漫化」的人更容易相信领导者是变革型的"},{"t":"刻板印象：受访者对未提供种族信息的领导者更多猜为白人；实验中白人领导者被认为比其他种族领导者更有效；刻板印象中男性比女性拥有更多领袖特征；激烈团队间竞争时团队偏好男性领导者，团队内部竞争、需改善人际关系时偏好女性领导者","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">刻板印象</strong>：受访者对未提供种族信息的领导者更多猜为白人；实验中白人领导者被认为比其他种族领导者更有效；刻板印象中男性比女性拥有更多领袖特征；激烈团队间竞争时团队偏好男性领导者，团队内部竞争、需改善人际关系时偏好女性领导者"},{"t":"启示：重要的是展示有效领导者的外在形象（睿智、有风度、擅长言谈、进取和勤奋），而不只是实际成就","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">启示</strong>：重要的是展示有效领导者的外在形象（睿智、有风度、擅长言谈、进取和勤奋），而不只是实际成就"}],"k":"b","i":1,"h":"12.7.1 领导作为一种归因结果"},{"t":"12.7.2 领导的替代因素和抵消因素","c":[{"t":"替代因素（substitute）：可以取代领导者支持或结构创建能力的因素——经验/培训、专业性、高度结构化的任务、自身提供反馈的工作、提供内在满足感的工作、具体明确的目标、严格的规章制度、高凝聚力的工作群体（Valve、Gore、GitHub等尝试「没有老板」的工作环境，以同事间问责制度替代管理层）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">替代因素</strong>（substitute）：可以取代领导者支持或结构创建能力的因素——经验/培训、专业性、高度结构化的任务、自身提供反馈的工作、提供内在满足感的工作、具体明确的目标、严格的规章制度、高凝聚力的工作群体（Valve、Gore、GitHub等尝试「没有老板」的工作环境，以同事间问责制度替代管理层）"},{"t":"抵消因素（neutralizer）：使领导者的行为无法对下属结果产生影响的因素（如对奖励无动于衷）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">抵消因素</strong>（neutralizer）：使领导者的行为无法对下属结果产生影响的因素（如对奖励无动于衷）"},{"t":"结论：替代因素重要并不意味着领导本身对绩效不重要；领导不过是组织行为总体模型中的一个自变量——态度、人格、能力、群体规范同样影响绩效和满意度","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：替代因素重要并不意味着领导本身对绩效不重要；领导不过是组织行为总体模型中的一个自变量——态度、人格、能力、群体规范同样影响绩效和满意度"}],"k":"b","i":1,"h":"12.7.2 领导的替代因素和抵消因素"},{"t":"12.7.3 选拔领导者","c":[{"t":"依据：岗位所需的知识、技能和能力；人格测试识别外倾性、责任心、经验开放性；高自我监控者更擅长阅读情境线索并调整行为；情绪智力高的候选人更有优势（尤其在需要变革型领导的情境）；丰富的经验不是好指标，针对具体情境的经验却很重要","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">依据</strong>：岗位所需的知识、技能和能力；人格测试识别外倾性、责任心、经验开放性；高自我监控者更擅长阅读情境线索并调整行为；情绪智力高的候选人更有优势（尤其在需要变革型领导的情境）；丰富的经验不是好指标，针对具体情境的经验却很重要"},{"t":"反例与教训：彭尼百货聘请无百货业经验的CEO导致股价一年下跌69%，后改聘具有零售业门店运营背景者；惠普十年更换四名CEO——组织在更换领导时往往没有花时间仔细考察","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反例与教训</strong>：彭尼百货聘请无百货业经验的CEO导致股价一年下跌69%，后改聘具有零售业门店运营背景者；惠普十年更换四名CEO——组织在更换领导时往往没有花时间仔细考察"}],"k":"b","i":1,"h":"12.7.3 选拔领导者"},{"t":"12.7.4 培养领导者","c":[{"t":"现状：组织在领导培训与开发上花费数十亿美元，形式从名校高级经理项目到户外拓展训练；高盛被称为「领导工厂」；商学院重新重视领导开发","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">现状</strong>：组织在领导培训与开发上花费数十亿美元，形式从名校高级经理项目到户外拓展训练；高盛被称为「领导工厂」；商学院重新重视领导开发"},{"t":"要点：高自我监控者在任何类型的领导培训上都可能更成功（行为改变的灵活性）；教授执行技能；提高信任建设、导师辅导等技能与情境分析技能（评估情境、调整情境贴近自己的风格、确认情境下最有效的领导行为；必和必拓、百思买、诺基亚、Adobe等雇用一对一教练）；模拟练习等行为培训能提高展现领导魅力的能力；关键组织事件后定期回顾反思（对责任心强、经验开放性高且情绪稳定者尤其有效）；变革型领导技能可以通过培训获得","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">要点</strong>：高自我监控者在任何类型的领导培训上都可能更成功（行为改变的灵活性）；教授执行技能；提高信任建设、导师辅导等技能与情境分析技能（评估情境、调整情境贴近自己的风格、确认情境下最有效的领导行为；必和必拓、百思买、诺基亚、Adobe等雇用一对一教练）；模拟练习等行为培训能提高展现领导魅力的能力；关键组织事件后定期回顾反思（对责任心强、经验开放性高且情绪稳定者尤其有效）；变革型领导技能可以通过培训获得"}],"k":"b","i":1,"h":"12.7.4 培养领导者"},{"t":"小结：大五人格与领导存在显著相关；行为理论把领导归为任务导向（结构维度）与员工导向（关怀维度）；权变理论有改进行为理论的潜力；当代理论贡献最大；关于道德和积极领导的研究带来令人兴奋的希望","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">小结</strong>：大五人格与领导存在显著相关；行为理论把领导归为任务导向（结构维度）与员工导向（关怀维度）；权变理论有改进行为理论的潜力；当代理论贡献最大；关于道德和积极领导的研究带来令人兴奋的希望"}],"k":"sec","i":0,"h":"12.7 对领导的理解所面临的挑战"}],"k":"chap","h":"第12章 领导"},{"t":"第13章 权力与政治","c":[{"t":"学习目标","c":[{"t":"比较领导和权力","c":[],"k":"b","i":1,"h":"比较领导和权力"},{"t":"解释正式权力的三种基础和个人权力的两种基础","c":[],"k":"b","i":1,"h":"解释正式权力的三种基础和个人权力的两种基础"},{"t":"解释权力关系中依赖性的作用","c":[],"k":"b","i":1,"h":"解释权力关系中依赖性的作用"},{"t":"指出权术或影响策略及其使用条件","c":[],"k":"b","i":1,"h":"指出权术或影响策略及其使用条件"},{"t":"指出权力滥用的影响因素和影响后果","c":[],"k":"b","i":1,"h":"指出权力滥用的影响因素和影响后果"},{"t":"描述政治在组织中的运作方式","c":[],"k":"b","i":1,"h":"描述政治在组织中的运作方式"},{"t":"指出政治行为的原因、后果和道德问题","c":[],"k":"b","i":1,"h":"指出政治行为的原因、后果和道德问题"}],"k":"sec","i":0,"h":"学习目标"},{"t":"13.1 权力和领导","c":[{"t":"权力（power）：A对B的行为产生影响、从而使B按照A的意愿行事的能力；它是一种能力或潜力，可以拥有而不必运用","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">权力</strong>（power）：A对B的行为产生影响、从而使B按照A的意愿行事的能力；它是一种能力或潜力，可以拥有而不必运用"},{"t":"依赖性（dependency）：权力的最重要方面在于它是依赖性的函数——B对A的依赖性越大，A的权力越大；依赖性取决于B感知到的备选方案数量以及A控制资源的重要性；只有当某人控制了你渴望获得的事物时，他才对你拥有权力","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">依赖性</strong>（dependency）：权力的最重要方面在于它是依赖性的函数——B对A的依赖性越大，A的权力越大；依赖性取决于B感知到的备选方案数量以及A控制资源的重要性；只有当某人控制了你渴望获得的事物时，他才对你拥有权力"},{"t":"权力与领导的三个差异：①权力不要求目标兼容性，只需要依赖性；领导则要求领导者与被领导者双方的目标存在某种程度的一致性。②影响方向不同：对领导的研究侧重对下属的影响（尽量忽略横向与自下而上的影响），权力研究则考虑所有方向。③对领导的研究强调领导风格，对权力的研究聚焦使他人服从而使用的权术；领导关注单个领导者的影响力，权力研究中群体和个体都可以使用权力","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">权力与领导的三个差异</strong>：①权力不要求目标兼容性，只需要依赖性；领导则要求领导者与被领导者双方的目标存在某种程度的一致性。②影响方向不同：对领导的研究侧重对下属的影响（尽量忽略横向与自下而上的影响），权力研究则考虑所有方向。③对领导的研究强调领导风格，对权力的研究聚焦使他人服从而使用的权术；领导关注单个领导者的影响力，权力研究中群体和个体都可以使用权力"}],"k":"sec","i":0,"h":"13.1 权力和领导"},{"t":"13.2 权力的基础","c":[{"t":"13.2.1 正式权力（以个体在组织中的职位为基础）","c":[{"t":"强制权力（coercive power）：依赖于人们对不服从命令会导致消极后果的惧怕——解雇、停职、降级、分派不喜欢的工作、令人尴尬的对待、控制关键信息；下属遭到上司欺辱时，强制权力是阻止他们反击的主要力量","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">强制权力</strong>（coercive power）：依赖于人们对不服从命令会导致消极后果的惧怕——解雇、停职、降级、分派不喜欢的工作、令人尴尬的对待、控制关键信息；下属遭到上司欺辱时，强制权力是阻止他们反击的主要力量"},{"t":"奖赏权力（reward power）：人们服从是因为它能带来好处——金钱方面（工资、加薪、奖金）与非金钱方面（认可、晋升、有趣的工作任务、友善的同事、有利的工作轮换或销售区域）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">奖赏权力</strong>（reward power）：人们服从是因为它能带来好处——金钱方面（工资、加薪、奖金）与非金钱方面（认可、晋升、有趣的工作任务、友善的同事、有利的工作轮换或销售区域）"},{"t":"法定权力（legitimate power）：组织成员根据自己在组织结构中的职位来控制和使用组织资源的正式职权；比强制权力和奖赏权力更宽泛，包括成员对某层级职位职权的接受和认可（校长、银行总裁、部队军官）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">法定权力</strong>（legitimate power）：组织成员根据自己在组织结构中的职位来控制和使用组织资源的正式职权；比强制权力和奖赏权力更宽泛，包括成员对某层级职位职权的接受和认可（校长、银行总裁、部队军官）"}],"k":"b","i":1,"h":"<strong class=\"lead\">13.2.1 正式权力</strong>（以个体在组织中的职位为基础）"},{"t":"13.2.2 个人权力（来自个体的独特特征；与正式权力不矛盾且可独立存在）","c":[{"t":"专家权力（expert power）：专长、特殊技能或知识产生的影响；工作日益专业化使人们越来越依赖专业人员（医生、计算机专家、税务会计师等）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专家权力</strong>（expert power）：专长、特殊技能或知识产生的影响；工作日益专业化使人们越来越依赖专业人员（医生、计算机专家、税务会计师等）"},{"t":"参照权力（referent power）：基础是人们认同某个拥有令人羡慕的资源或特质的人；源于他人的钦佩和效仿意愿（名人为产品代言；领袖魅力、受喜爱程度和情绪感染力）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参照权力</strong>（referent power）：基础是人们认同某个拥有令人羡慕的资源或特质的人；源于他人的钦佩和效仿意愿（名人为产品代言；领袖魅力、受喜爱程度和情绪感染力）"}],"k":"b","i":1,"h":"<strong class=\"lead\">13.2.2 个人权力</strong>（来自个体的独特特征；与正式权力不矛盾且可独立存在）"},{"t":"13.2.3 哪种权力基础最有效：个人权力最有效——专家权力和参照权力与员工满意度、组织承诺和绩效呈正相关；奖赏权力和法定权力与这些结果没什么关系；强制权力可能带来损害","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">13.2.3 哪种权力基础最有效</strong>：个人权力最有效——专家权力和参照权力与员工满意度、组织承诺和绩效呈正相关；奖赏权力和法定权力与这些结果没什么关系；强制权力可能带来损害"},{"t":"小结：专家权力和参照权力来自个人品质，强制、奖赏和法定权力来源于组织；将卓越的工作能力尤其是号召力作为权力基础，可以让群体成员有更好的工作业绩","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">小结</strong>：专家权力和参照权力来自个人品质，强制、奖赏和法定权力来源于组织；将卓越的工作能力尤其是号召力作为权力基础，可以让群体成员有更好的工作业绩"}],"k":"sec","i":0,"h":"13.2 权力的基础"},{"t":"13.3 依赖性：权力的关键","c":[{"t":"13.3.1 依赖性的一般假设：B对A的依赖性越大，A对B的权力越大——当你拥有他人需要的某种东西且你是唯一控制者时；若某种东西大量存在，拥有它并不会增加权力；扩展自己的选择余地可以减少别人对你的权力（多供应商策略、保持经济独立）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">13.3.1 依赖性的一般假设</strong>：B对A的依赖性越大，A对B的权力越大——当你拥有他人需要的某种东西且你是唯一控制者时；若某种东西大量存在，拥有它并不会增加权力；扩展自己的选择余地可以减少别人对你的权力（多供应商策略、保持经济独立）"},{"t":"13.3.2 什么造成了依赖性：如果你掌控的资源是重要的、稀缺的、不可替代的，他人对你的依赖性就会增加","c":[{"t":"重要性：没有人想得到你掌握的资源，就不会产生依赖；资源的重要性从生存所需到仅仅增加便利不等","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">重要性</strong>：没有人想得到你掌握的资源，就不会产生依赖；资源的重要性从生存所需到仅仅增加便利不等"},{"t":"稀缺性：劳动力供给少于市场需求的职业可在工资和福利方面提出更高要求（如紧缺的网络系统分析员），供给充足的职业则不能（兰博基尼凭垄断的维修技能使自己在岛上不可或缺）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">稀缺性</strong>：劳动力供给少于市场需求的职业可在工资和福利方面提出更高要求（如紧缺的网络系统分析员），供给充足的职业则不能（兰博基尼凭垄断的维修技能使自己在岛上不可或缺）"},{"t":"不可替代性：一种资源的有效替代物越少，控制它的人权力越大（论文多、知名度高的高校教师拥有更大控制权）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不可替代性</strong>：一种资源的有效替代物越少，控制它的人权力越大（论文多、知名度高的高校教师拥有更大控制权）"}],"k":"b","i":1,"h":"<strong class=\"lead\">13.3.2 什么造成了依赖性</strong>：如果你掌控的资源是重要的、稀缺的、不可替代的，他人对你的依赖性就会增加"},{"t":"13.3.3 社交网络分析：一种资源评估工具","c":[{"t":"概念：通过检查组织成员之间的交流模式确定信息流动方式；个人或群体是节点（node），节点之间的连接是边（tie）；节点之间经常通信或交换资源为强关联","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">概念</strong>：通过检查组织成员之间的交流模式确定信息流动方式；个人或群体是节点（node），节点之间的连接是边（tie）；节点之间经常通信或交换资源为强关联"},{"t":"代理（broker）：充当其他未连接节点之间资源流动通道的人；处于代理位置的人往往拥有更大权力，因为很多人对其有依赖、可利用来自不同群体的独特资源","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">代理</strong>（broker）：充当其他未连接节点之间资源流动通道的人；处于代理位置的人往往拥有更大权力，因为很多人对其有依赖、可利用来自不同群体的独特资源"},{"t":"社交网络图（sociogram）：描述社交网络中个人之间联系的图形，类似非正式的组织结构图——正式组织结构图显示权力「应该」如何流动，社交网络图显示资源「实际」如何在组织中流动","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社交网络图</strong>（sociogram）：描述社交网络中个人之间联系的图形，类似非正式的组织结构图——正式组织结构图显示权力「应该」如何流动，社交网络图显示资源「实际」如何在组织中流动"},{"t":"发现：与组织社交网络联系密切的员工不太可能参与腐败；变革推动者若是信息代理更容易取得成功（英国国家卫生服务的数据）；代价——被认为是咨询网络核心的人更可能辞职（做了大量没有回报的额外工作）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">发现</strong>：与组织社交网络联系密切的员工不太可能参与腐败；变革推动者若是信息代理更容易取得成功（英国国家卫生服务的数据）；代价——被认为是咨询网络核心的人更可能辞职（做了大量没有回报的额外工作）"},{"t":"实现：跟踪部门电子邮件通信或文档共享流程的大数据工具；分析人力资源信息系统中主管与下属的互动方式；领导者据此找出对多个群体施加最大影响力的最有权力的代理并处理好这些关键人物","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实现</strong>：跟踪部门电子邮件通信或文档共享流程的大数据工具；分析人力资源信息系统中主管与下属的互动方式；领导者据此找出对多个群体施加最大影响力的最有权力的代理并处理好这些关键人物"}],"k":"b","i":1,"h":"<strong class=\"lead\">13.3.3 社交网络分析</strong>：一种资源评估工具"}],"k":"sec","i":0,"h":"<strong class=\"lead\">13.3 依赖性</strong>：权力的关键"},{"t":"13.4 权术","c":[{"t":"权术（power tactics）：把权力基础转化为具体行动、影响他人的方式","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">权术</strong>（power tactics）：把权力基础转化为具体行动、影响他人的方式"},{"t":"九种权术：","c":[{"t":"合法性：依靠职权，或强调要求符合组织的规章制度","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">合法性</strong>：依靠职权，或强调要求符合组织的规章制度"},{"t":"理性说服：提出符合逻辑的观点和事实依据来证明请求的合理性","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理性说服</strong>：提出符合逻辑的观点和事实依据来证明请求的合理性"},{"t":"鼓舞式诉求：通过呼吁目标的价值观、需求、希望和渴望来引起情感认同","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">鼓舞式诉求</strong>：通过呼吁目标的价值观、需求、希望和渴望来引起情感认同"},{"t":"商议：让目标对象参与决定如何实施计划以增加其支持","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">商议</strong>：让目标对象参与决定如何实施计划以增加其支持"},{"t":"交换：给他人提供某些利益或好处来换取其对要求的遵循","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">交换</strong>：给他人提供某些利益或好处来换取其对要求的遵循"},{"t":"个人式诉求：利用友谊或忠诚来获得同意","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个人式诉求</strong>：利用友谊或忠诚来获得同意"},{"t":"逢迎：提出请求之前先吹捧、赞扬或友善","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">逢迎</strong>：提出请求之前先吹捧、赞扬或友善"},{"t":"施压：使用警告、威胁和反复要求等手段","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">施压</strong>：使用警告、威胁和反复要求等手段"},{"t":"联盟：通过寻求他人的帮助或支持来说服目标对象同意","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">联盟</strong>：通过寻求他人的帮助或支持来说服目标对象同意"}],"k":"b","i":1,"h":"<strong class=\"lead\">九种权术</strong>："},{"t":"13.4.1 使用权术","c":[{"t":"有效性排序：理性说服、鼓舞式诉求和商议往往最有效（尤其当听众对决策结果非常感兴趣）；施压经常有反作用、通常是九种权术中效果最差的；可以同时或相继使用多种兼容的权术增加成功可能（逢迎加合法性可减少消极反应，但仅当听众不在乎结果或政策只是例行公事时成立）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有效性排序</strong>：理性说服、鼓舞式诉求和商议往往最有效（尤其当听众对决策结果非常感兴趣）；施压经常有反作用、通常是九种权术中效果最差的；可以同时或相继使用多种兼容的权术增加成功可能（逢迎加合法性可减少消极反应，但仅当听众不在乎结果或政策只是例行公事时成立）"},{"t":"影响方向（图表13-2）：理性说服是在所有组织层面都有效的唯一权术；鼓舞式诉求作为上司影响下属的权术最有效；施压有效时通常只是上级对下级的影响；个人式诉求和联盟作为横向影响最有效","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">影响方向</strong>（图表13-2）：理性说服是在所有组织层面都有效的唯一权术；鼓舞式诉求作为上司影响下属的权术最有效；施压有效时通常只是上级对下级的影响；个人式诉求和联盟作为横向影响最有效"},{"t":"柔性与强硬：柔性权术（个人式诉求、鼓舞式诉求、理性说服、商议——依赖个人权力）更可能取得效果；强硬权术（交换、联盟、施压——强调正式权力、成本和风险更高）在柔性失效后使用；单一柔性权术比单一强硬权术更有效；两种柔性结合或柔性加理性说服优于任何单一权术或强硬权术的结合","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">柔性与强硬</strong>：柔性权术（个人式诉求、鼓舞式诉求、理性说服、商议——依赖个人权力）更可能取得效果；强硬权术（交换、联盟、施压——强调正式权力、成本和风险更高）在柔性失效后使用；单一柔性权术比单一强硬权术更有效；两种柔性结合或柔性加理性说服优于任何单一权术或强硬权术的结合"},{"t":"受众差异：最可能服从柔性权术的人深思熟虑、自我激励、高自尊、高控制欲；最可能服从强硬权术的人以行动为导向、外部激励、更重视与他人处理好关系","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">受众差异</strong>：最可能服从柔性权术的人深思熟虑、自我激励、高自尊、高控制欲；最可能服从强硬权术的人以行动为导向、外部激励、更重视与他人处理好关系"}],"k":"b","i":1,"h":"13.4.1 使用权术"},{"t":"13.4.2 权术的文化偏好：个人主义国家的人把权力视为实现个人目标的合理手段，集体主义国家的人视为帮助他人的合理手段；美国管理者偏好理性诉求（开门见山），中国管理者偏好联盟策略（用迂回方式解决争议）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">13.4.2 权术的文化偏好</strong>：个人主义国家的人把权力视为实现个人目标的合理手段，集体主义国家的人视为帮助他人的合理手段；美国管理者偏好理性诉求（开门见山），中国管理者偏好联盟策略（用迂回方式解决争议）"},{"t":"13.4.3 应用权术：把权术用对地方——使用权术的技能与文化条件","c":[{"t":"政治技能（political skill）：影响他人以实现自己目标的能力；熟练者能更有效使用权术，有更高水平的自我效能、工作满意度、生产率和事业成就，不太可能成为职场侵犯行为的受害者；当涉及重大利害关系（个体对重要组织绩效负责）时政治技能更有效；能在程序公平和分配公平程度较低的环境中运用；当组织以公平规则运行时，政治技能与绩效评估实际呈负相关","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政治技能</strong>（political skill）：影响他人以实现自己目标的能力；熟练者能更有效使用权术，有更高水平的自我效能、工作满意度、生产率和事业成就，不太可能成为职场侵犯行为的受害者；当涉及重大利害关系（个体对重要组织绩效负责）时政治技能更有效；能在程序公平和分配公平程度较低的环境中运用；当组织以公平规则运行时，政治技能与绩效评估实际呈负相关"},{"t":"组织文化的作用：与组织文化一致的组织成员更有影响力（外倾者在团队导向的组织中、责任心强者在重视独立技术任务的组织中）；组织会决定哪些权术是可以接受的","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织文化的作用</strong>：与组织文化一致的组织成员更有影响力（外倾者在团队导向的组织中、责任心强者在重视独立技术任务的组织中）；组织会决定哪些权术是可以接受的"}],"k":"b","i":1,"h":"<strong class=\"lead\">13.4.3 应用权术</strong>：把权术用对地方——使用权术的技能与文化条件"}],"k":"sec","i":0,"h":"13.4 权术"},{"t":"13.5 权力如何影响人们","c":[{"t":"权力的腐化效应：权力会使人们把自身利益凌驾于他人的需要和目标之上——关注自身利益、向内聚焦并释放欲望、把他人「物化」（视为实现自己目标的工具）、把人际关系看作次要的；权力大的人对威胁其能力的行为做出消极反应、抓住权力不放；被赋予权力的人在道德风险面前更可能做出自私决策（对冲基金经理拿别人的钱冒险）；更愿意诋毁他人；导致自负的决策","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">权力的腐化效应</strong>：权力会使人们把自身利益凌驾于他人的需要和目标之上——关注自身利益、向内聚焦并释放欲望、把他人「物化」（视为实现自己目标的工具）、把人际关系看作次要的；权力大的人对威胁其能力的行为做出消极反应、抓住权力不放；被赋予权力的人在道德风险面前更可能做出自私决策（对冲基金经理拿别人的钱冒险）；更愿意诋毁他人；导致自负的决策"},{"t":"案例：建筑师赖特早年师从沙利文时不吝赞美，成名后却夺走老师设计的功劳、待人难以接受——权力的腐败效应","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">案例</strong>：建筑师赖特早年师从沙利文时不吝赞美，成名后却夺走老师设计的功劳、待人难以接受——权力的腐败效应"},{"t":"13.5.1 权力的变数：①权力的毒性取决于持有者的人格——容易焦虑的人不会被权力腐蚀；②组织体系可以限制权力的腐蚀性——受到责问时自私行为就会停止；③向掌权者表达感激可以弱化权力的消极影响；④权力小的人获得权力后最容易滥用仅有的那点权力（低地位本身也是一种威胁）；权力也有积极影响——激发并增强实现目标的动机、增强帮助他人的动机；与其说权力导致腐败，不如说它「暴露」我们所重视的东西——道德认定感弱的人权力导致自私，道德认定感强的人权力反而提高道德意识和行动意愿","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">13.5.1 权力的变数</strong>：①权力的毒性取决于持有者的人格——容易焦虑的人不会被权力腐蚀；②组织体系可以限制权力的腐蚀性——受到责问时自私行为就会停止；③向掌权者表达感激可以弱化权力的消极影响；④权力小的人获得权力后最容易滥用仅有的那点权力（低地位本身也是一种威胁）；权力也有积极影响——激发并增强实现目标的动机、增强帮助他人的动机；与其说权力导致腐败，不如说它「暴露」我们所重视的东西——道德认定感弱的人权力导致自私，道德认定感强的人权力反而提高道德意识和行动意愿"},{"t":"13.5.2 性骚扰：工作场所的不平等权力","c":[{"t":"性骚扰（sexual harassment）：任何带有性色彩的、能够影响个体就业或产生不友善工作环境的不必要行为（平等就业机会委员会的界定）；大多数国家有保护政策，但政策是否得到执行是另一回事","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">性骚扰</strong>（sexual harassment）：任何带有性色彩的、能够影响个体就业或产生不友善工作环境的不必要行为（平等就业机会委员会的界定）；大多数国家有保护政策，但政策是否得到执行是另一回事"},{"t":"普遍性：在男性占主导地位的社会更普遍；权力是理解性骚扰的关键（无论骚扰来自上级、平级还是下级）；权力差异越大越可能发生——上司与下属的组合最能体现不对等的权力关系；缺乏有效的监测与控制、组织在政策和程序上缺乏公平时更可能发生","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">普遍性</strong>：在男性占主导地位的社会更普遍；权力是理解性骚扰的关键（无论骚扰来自上级、平级还是下级）；权力差异越大越可能发生——上司与下属的组合最能体现不对等的权力关系；缺乏有效的监测与控制、组织在政策和程序上缺乏公平时更可能发生"},{"t":"管理者防止性骚扰的措施：制定有效政策（界定哪些行为构成性骚扰、明确规定违规者将被解雇、建立申诉程序）；确保提出申诉的员工不会遭到报复；调查每一份申诉并让法律和人力资源部门参与；确保冒犯者受到纪律处分或被解雇；开展内部培训提高意识","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理者防止性骚扰的措施</strong>：制定有效政策（界定哪些行为构成性骚扰、明确规定违规者将被解雇、建立申诉程序）；确保提出申诉的员工不会遭到报复；调查每一份申诉并让法律和人力资源部门参与；确保冒犯者受到纪律处分或被解雇；开展内部培训提高意识"},{"t":"责任：管理者有责任保护员工远离敌意的工作环境；若调查者认定管理者本该知道这些情况，该管理者和公司都要承担责任","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">责任</strong>：管理者有责任保护员工远离敌意的工作环境；若调查者认定管理者本该知道这些情况，该管理者和公司都要承担责任"}],"k":"b","i":1,"h":"<strong class=\"lead\">13.5.2 性骚扰</strong>：工作场所的不平等权力"}],"k":"sec","i":0,"h":"13.5 权力如何影响人们"},{"t":"13.6 政治：权力的行使","c":[{"t":"引入：人们把权力付诸行动就是参与政治；政治不仅是不可避免的，也可能是必不可少的","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">引入</strong>：人们把权力付诸行动就是参与政治；政治不仅是不可避免的，也可能是必不可少的"},{"t":"13.6.1 组织政治的定义：政治行为（political behavior）指可以影响或试图影响组织内部的利益分配、但并不是组织成员的正式角色必须实施的那些活动；它要求人们设法运用权力基础（为影响目标、标准或决策程序付出的努力）；涵盖隐瞒决策者所需的关键信息、结盟、告密、散布谣言、向媒体泄露机密信息、利益交易、游说支持或反对某人等；政治往往是消极的，但并非总是如此","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">13.6.1 组织政治的定义</strong>：政治行为（political behavior）指可以影响或试图影响组织内部的利益分配、但并不是组织成员的正式角色必须实施的那些活动；它要求人们设法运用权力基础（为影响目标、标准或决策程序付出的努力）；涵盖隐瞒决策者所需的关键信息、结盟、告密、散布谣言、向媒体泄露机密信息、利益交易、游说支持或反对某人等；政治往往是消极的，但并非总是如此"},{"t":"13.6.2 政治行为的现实：对经验丰富的管理者的访谈显示，绝大多数人认为政治行为是组织生活的重要组成部分；多数管理者认为只要不直接伤害他人，运用政治行为符合道德；他们把政治描述为必要的，并表示从未接受过如何有效使用政治行为的培训","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">13.6.2 政治行为的现实</strong>：对经验丰富的管理者的访谈显示，绝大多数人认为政治行为是组织生活的重要组成部分；多数管理者认为只要不直接伤害他人，运用政治行为符合道德；他们把政治描述为必要的，并表示从未接受过如何有效使用政治行为的培训"},{"t":"政治行为必然存在的原因：组织包含不同价值观、目标和利益的个体和群体；资源有限无法满足所有人的利益；个体或群体获得的利益往往被认为来自他人的牺牲；用于分配有限资源的大多数「事实」可以做出各种解读（在打击率0.280与0.290的选手之间做选择时主观因素起作用——多数管理决策正处在这种模糊地带）；绝大多数决策在不确定性环境中做出、事实很少客观——由此产生政治活动（politicking）；只有当所有成员目标和利益一致、资源不稀缺、绩效结果非常明确客观时，组织才可能没有政治行为，而这不符合绝大多数组织的实际情况","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">政治行为必然存在的原因</strong>：组织包含不同价值观、目标和利益的个体和群体；资源有限无法满足所有人的利益；个体或群体获得的利益往往被认为来自他人的牺牲；用于分配有限资源的大多数「事实」可以做出各种解读（在打击率0.280与0.290的选手之间做选择时主观因素起作用——多数管理决策正处在这种模糊地带）；绝大多数决策在不确定性环境中做出、事实很少客观——由此产生政治活动（politicking）；只有当所有成员目标和利益一致、资源不稀缺、绩效结果非常明确客观时，组织才可能没有政治行为，而这不符合绝大多数组织的实际情况"}],"k":"sec","i":0,"h":"<strong class=\"lead\">13.6 政治</strong>：权力的行使"},{"t":"13.7 政治行为的前因和后果","c":[{"t":"13.7.1 引发政治行为的因素","c":[{"t":"个人因素：高自我监控（对社交线索更敏感、更擅长政治行为）、内控型（相信自己能掌控环境、更积极主动）、高马基雅维利主义与高权力需求（操纵欲和权力欲）；个体对组织的投资越多（离开损失越大），采取不当政治行为的可能性越小；感知到的其他工作机会越多（就业市场有利、稀缺技能、高声望、外部关系），采取政治行为的可能性越大；对使用不当手段获得成功有较高期望的是两类人——经验丰富、政治技能娴熟且拥有权力的人，以及错误判断自己成功可能性的天真者；政治技能高的人更理解人际互动、因政治行为获得间接奖励","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个人因素</strong>：高自我监控（对社交线索更敏感、更擅长政治行为）、内控型（相信自己能掌控环境、更积极主动）、高马基雅维利主义与高权力需求（操纵欲和权力欲）；个体对组织的投资越多（离开损失越大），采取不当政治行为的可能性越小；感知到的其他工作机会越多（就业市场有利、稀缺技能、高声望、外部关系），采取政治行为的可能性越大；对使用不当手段获得成功有较高期望的是两类人——经验丰富、政治技能娴熟且拥有权力的人，以及错误判断自己成功可能性的天真者；政治技能高的人更理解人际互动、因政治行为获得间接奖励"},{"t":"组织因素：资源不断减少、现有资源分配模式发生变化、存在晋升机会时更可能出现政治行为；滋生政治行为的组织文化特征——缺乏信任、角色模糊（角色越模糊越容易采取政治行为而不被察觉）、绩效评估体系不明确、零和（赢-输）报酬分配体系、民主决策、高绩效压力、自私自利的高层管理者","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织因素</strong>：资源不断减少、现有资源分配模式发生变化、存在晋升机会时更可能出现政治行为；滋生政治行为的组织文化特征——缺乏信任、角色模糊（角色越模糊越容易采取政治行为而不被察觉）、绩效评估体系不明确、零和（赢-输）报酬分配体系、民主决策、高绩效压力、自私自利的高层管理者"},{"t":"零和方法（zero-sum approach）：把报酬当作一块大小固定的「蛋糕」，某个成员或群体的任何所得就是另一成员或群体的损失（如把15000美元的加薪额度分给5名员工）；这种做法激励人们使自己显得劳苦功高、使他人显得无关紧要","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">零和方法</strong>（zero-sum approach）：把报酬当作一块大小固定的「蛋糕」，某个成员或群体的任何所得就是另一成员或群体的损失（如把15000美元的加薪额度分给5名员工）；这种做法激励人们使自己显得劳苦功高、使他人显得无关紧要"},{"t":"跨组织视角：政治在组织间关系中也发挥作用——两个内部政治化程度高的组织互动会降低合作项目的绩效；内部政治较少的公司之间即使有政治纠纷也不会降低合作绩效","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">跨组织视角</strong>：政治在组织间关系中也发挥作用——两个内部政治化程度高的组织互动会降低合作项目的绩效；内部政治较少的公司之间即使有政治纠纷也不会降低合作绩效"}],"k":"b","i":1,"h":"13.7.1 引发政治行为的因素"},{"t":"13.7.2 人们如何应对组织政治","c":[{"t":"总体后果：组织政治感知与工作满意度呈负相关；员工绩效下降（认为政治化的环境不公正、失去动力）；面对的政治活动太多时员工离职；焦虑和压力增加、帮助同事变少（尼日利亚的研究表明发展中国家结论一致）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总体后果</strong>：组织政治感知与工作满意度呈负相关；员工绩效下降（认为政治化的环境不公正、失去动力）；面对的政治活动太多时员工离职；焦虑和压力增加、帮助同事变少（尼日利亚的研究表明发展中国家结论一致）"},{"t":"调节条件：充分理解组织政治的运作方式与原因（谁负责决策及其为何被任命）的人把政治活动视为机会、绩效提高；领悟能力较差的人把组织政治视为威胁、绩效不利；工作中的政治行为还会调节道德型领导的影响（男性员工在政治与道德型领导水平都高时表现更多公民行为；女性最可能在有道德、无政治的环境中参与公民行为）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">调节条件</strong>：充分理解组织政治的运作方式与原因（谁负责决策及其为何被任命）的人把政治活动视为机会、绩效提高；领悟能力较差的人把组织政治视为威胁、绩效不利；工作中的政治行为还会调节道德型领导的影响（男性员工在政治与道德型领导水平都高时表现更多公民行为；女性最可能在有道德、无政治的环境中参与公民行为）"},{"t":"防卫行为（defensive behavior）：为避免行动、指责或变化而采取的保护性应对行为","c":[{"t":"避免行动：过度遵从（严格解读职责规定）、推诿责任、装聋作哑、耽搁时间（拖延任务显得脱不开身）、搪塞（公开支持、私下不做）","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">避免行动</strong>：过度遵从（严格解读职责规定）、推诿责任、装聋作哑、耽搁时间（拖延任务显得脱不开身）、搪塞（公开支持、私下不做）"},{"t":"避免指责：缓冲（记录工作活动的方方面面以树立能力强形象，也称「不留后患」）、明哲保身（只承担成功可能性大的项目、冲突中保持中立）、辩护（寻找解释减轻责任并道歉）、替罪羊（把不利结果归咎于无法指责的外部因素）、虚报信息（歪曲、润色、有选择性地汇报）","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">避免指责</strong>：缓冲（记录工作活动的方方面面以树立能力强形象，也称「不留后患」）、明哲保身（只承担成功可能性大的项目、冲突中保持中立）、辩护（寻找解释减轻责任并道歉）、替罪羊（把不利结果归咎于无法指责的外部因素）、虚报信息（歪曲、润色、有选择性地汇报）"},{"t":"避免变化：阻止（设法阻止有威胁性的变化）、自我保护（变革中通过控制信息或其他资源保护个人利益）","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">避免变化</strong>：阻止（设法阻止有威胁性的变化）、自我保护（变革中通过控制信息或其他资源保护个人利益）"},{"t":"评价：短期内防卫行为保护自身利益，但长此以往员工会失去同事、上司、员工和客户的支持与信任","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">评价</strong>：短期内防卫行为保护自身利益，但长此以往员工会失去同事、上司、员工和客户的支持与信任"}],"k":"b","i":2,"h":"<strong class=\"lead\">防卫行为</strong>（defensive behavior）：为避免行动、指责或变化而采取的保护性应对行为"}],"k":"b","i":1,"h":"13.7.2 人们如何应对组织政治"},{"t":"13.7.3 印象管理","c":[{"t":"印象管理（impression management，IM）：个体试图控制他人对自己形成印象的过程；高自我监控者更会运用，低自我监控者展现与人格一致的真实形象","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">印象管理</strong>（impression management，IM）：个体试图控制他人对自己形成印象的过程；高自我监控者更会运用，低自我监控者展现与人格一致的真实形象"},{"t":"印象管理技巧（图表13-6）：从众（赞同他人观点以获得认可）；讨好（为某人做好事以获得同意或认可）；借口（对困境事件做解释以减轻严重性，防卫性）；道歉（主动承担责任并请求谅解，防卫性）；自我推销（突出自己最突出的品质、忽略不足，强调自我）；强化（强调自己做的事情的价值超出常人想象，强调自我）；吹捧（赞扬别人优点使自己显得有洞察力和讨人喜欢，进取性）；示范（做额外的事展示专注和勤奋，进取性）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">印象管理技巧</strong>（图表13-6）：从众（赞同他人观点以获得认可）；讨好（为某人做好事以获得同意或认可）；借口（对困境事件做解释以减轻严重性，防卫性）；道歉（主动承担责任并请求谅解，防卫性）；自我推销（突出自己最突出的品质、忽略不足，强调自我）；强化（强调自己做的事情的价值超出常人想象，强调自我）；吹捧（赞扬别人优点使自己显得有洞察力和讨人喜欢，进取性）；示范（做额外的事展示专注和勤奋，进取性）"},{"t":"面试与印象管理：绝大多数求职者在面试中使用印象管理技巧且确实产生效果；面试官不易察觉欺骗性的印象管理；高度结构化的面试（问题事先写好、聚焦求职者资质）中效果弱很多；有效性还取决于求职者能否正确识别面试官想要的特质或技能","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">面试与印象管理</strong>：绝大多数求职者在面试中使用印象管理技巧且确实产生效果；面试官不易察觉欺骗性的印象管理；高度结构化的面试（问题事先写好、聚焦求职者资质）中效果弱很多；有效性还取决于求职者能否正确识别面试官想要的特质或技能"},{"t":"绩效评估与印象管理：逢迎与绩效评估呈正相关（上司喜欢被友好相待）；自我推销似乎有反作用——上司清楚员工的实际表现；拥有高超政治技能的人能把印象管理转化为更高的绩效评估，欠缺者适得其反；对董事会成员的研究——逢迎现任董事的个体更可能进入董事会；虚报信息代价高（「狼来了」效应）；不要让人觉得自己不真诚；谦逊（慷慨归功于他人并低估自己的贡献）可能留下更积极的印象","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">绩效评估与印象管理</strong>：逢迎与绩效评估呈正相关（上司喜欢被友好相待）；自我推销似乎有反作用——上司清楚员工的实际表现；拥有高超政治技能的人能把印象管理转化为更高的绩效评估，欠缺者适得其反；对董事会成员的研究——逢迎现任董事的个体更可能进入董事会；虚报信息代价高（「狼来了」效应）；不要让人觉得自己不真诚；谦逊（慷慨归功于他人并低估自己的贡献）可能留下更积极的印象"}],"k":"b","i":1,"h":"13.7.3 印象管理"},{"t":"13.7.4 政治行为的道德问题","c":[{"t":"三个思考问题：采取政治行为带来的效用是否值得冒险（如毫无用处的谎言）；该行为的效用如何抵消它对他人的伤害（把他人功劳据为己有比恭维主管外貌伤害更大）；该行为是否符合公正和公平原则（夸大亲信绩效、贬低不喜欢者的绩效再据此加薪是不公正的）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三个思考问题</strong>：采取政治行为带来的效用是否值得冒险（如毫无用处的谎言）；该行为的效用如何抵消它对他人的伤害（把他人功劳据为己有比恭维主管外貌伤害更大）；该行为是否符合公正和公平原则（夸大亲信绩效、贬低不喜欢者的绩效再据此加薪是不公正的）"},{"t":"警示：掌权者通常善于从组织利益的角度解释自己追逐私利的行为、把不公正说成公正无私；拥有权力、巧舌如簧的人最容易犯道德错误（犯错却平安无事）；无权力者更容易遵循道德原则——他们没有施展政治技能的空间","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">警示</strong>：掌权者通常善于从组织利益的角度解释自己追逐私利的行为、把不公正说成公正无私；拥有权力、巧舌如簧的人最容易犯道德错误（犯错却平安无事）；无权力者更容易遵循道德原则——他们没有施展政治技能的空间"}],"k":"b","i":1,"h":"13.7.4 政治行为的道德问题"},{"t":"13.7.5 绘制你的政治生涯版图","c":[{"t":"方法：把权力和政治放到自己的职业生涯中思考——你的志向是什么？谁有权力帮助你实现？你和这些人是什么关系？绘制勾勒自己与决定职业生涯者之间关系的政治版图（圆圈底色由浅至深代表关系紧密、关系松散、完全没有关系）","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">方法</strong>：把权力和政治放到自己的职业生涯中思考——你的志向是什么？谁有权力帮助你实现？你和这些人是什么关系？绘制勾勒自己与决定职业生涯者之间关系的政治版图（圆圈底色由浅至深代表关系紧密、关系松散、完全没有关系）"},{"t":"应用：对关系松散或没有关系的关键人物制定拉近关系的计划；采用间接方式施加影响（通过关键人物的关联者，如与其朋友结盟、在其博客上互动）；版图无法提供全部信息——关键人物的权力通常不一样大，大型社交网络中版图更难建立；尽量保持基本特性，只涵盖对职业真正有影响的人","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用</strong>：对关系松散或没有关系的关键人物制定拉近关系的计划；采用间接方式施加影响（通过关键人物的关联者，如与其朋友结盟、在其博客上互动）；版图无法提供全部信息——关键人物的权力通常不一样大，大型社交网络中版图更难建立；尽量保持基本特性，只涵盖对职业真正有影响的人"},{"t":"态度：权力和政治是组织生活的一部分，不去使用它们就意味着无效——与其假装不重要，不如有清晰明确的政治版图","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">态度</strong>：权力和政治是组织生活的一部分，不去使用它们就意味着无效——与其假装不重要，不如有清晰明确的政治版图"}],"k":"b","i":1,"h":"13.7.5 绘制你的政治生涯版图"},{"t":"小结：没有人甘于在工作和组织中处于无权状态；人们对不同的权力基础做出不同反应；有效的管理者会接受组织的政治性——政治敏锐性高的人能意识到深层次的政治行为并管理自己的形象，政治技能高超者获得更高的绩效评估、更多加薪和晋升，并有更高的工作满意度、更好地化解工作压力","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">小结</strong>：没有人甘于在工作和组织中处于无权状态；人们对不同的权力基础做出不同反应；有效的管理者会接受组织的政治性——政治敏锐性高的人能意识到深层次的政治行为并管理自己的形象，政治技能高超者获得更高的绩效评估、更多加薪和晋升，并有更高的工作满意度、更好地化解工作压力"}],"k":"sec","i":0,"h":"13.7 政治行为的前因和后果"}],"k":"chap","h":"第13章 权力与政治"},{"t":"第14章 冲突与谈判","c":[{"t":"学习目标","c":[{"t":"描述冲突的三种类型和三个范围。","c":[],"k":"b","i":1,"h":"描述冲突的三种类型和三个范围。"},{"t":"阐述冲突过程。","c":[],"k":"b","i":1,"h":"阐述冲突过程。"},{"t":"比较分配式谈判和整合式谈判的差异。","c":[],"k":"b","i":1,"h":"比较分配式谈判和整合式谈判的差异。"},{"t":"应用谈判的五个步骤。","c":[],"k":"b","i":1,"h":"应用谈判的五个步骤。"},{"t":"指出个体差异如何影响谈判。","c":[],"k":"b","i":1,"h":"指出个体差异如何影响谈判。"},{"t":"评价第三方谈判的角色和功能。","c":[],"k":"b","i":1,"h":"评价第三方谈判的角色和功能。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"14.1 冲突的定义","c":[{"t":"冲突（conflict）：一方感觉对方对自己关心的事情已经或将要产生不利影响时发生的一个过程，描述了活动从互动变成不一致的转折点；冲突首先是一种知觉——人们没有意识到冲突，一般就认为没有冲突；对立或不一致以及某种形式的互动是冲突过程开始的必要条件。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">冲突</strong>（conflict）：一方感觉对方对自己关心的事情已经或将要产生不利影响时发生的一个过程，描述了活动从互动变成不一致的转折点；冲突首先是一种知觉——人们没有意识到冲突，一般就认为没有冲突；对立或不一致以及某种形式的互动是冲突过程开始的必要条件。"},{"t":"冲突水平与部门绩效（图表14-1）：冲突低或无→迟钝、冷漠、对变化反应慢、缺乏新思想，属恶性结果，绩效低；冲突适度→生命力强、不断革新、自我批评，属良性结果，绩效最佳；冲突过高→分裂、混乱、不合作，属恶性结果，绩效低。结论：冲突并非必然降低绩效，最优水平的冲突能防止迟钝、缓解紧张、激发创造力、促进变革萌芽，同时不干扰群体内的协作；任何一种极端（过高或过低）都会削弱绩效。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">冲突水平与部门绩效</strong>（图表14-1）：冲突低或无→迟钝、冷漠、对变化反应慢、缺乏新思想，属恶性结果，绩效低；冲突适度→生命力强、不断革新、自我批评，属良性结果，绩效最佳；冲突过高→分裂、混乱、不合作，属恶性结果，绩效低。结论：冲突并非必然降低绩效，最优水平的冲突能防止迟钝、缓解紧张、激发创造力、促进变革萌芽，同时不干扰群体内的协作；任何一种极端（过高或过低）都会削弱绩效。"},{"t":"良性冲突（functional conflict）：能够支持群体目标和提高群体绩效的建设性冲突，如工作小组围绕提高生产效率的方法展开公开辩论。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">良性冲突</strong>（functional conflict）：能够支持群体目标和提高群体绩效的建设性冲突，如工作小组围绕提高生产效率的方法展开公开辩论。"},{"t":"恶性冲突（dysfunctional conflict）：妨碍群体绩效的破坏性冲突，如团队中为争夺控制权而分散手头任务的个人斗争。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">恶性冲突</strong>（dysfunctional conflict）：妨碍群体绩效的破坏性冲突，如团队中为争夺控制权而分散手头任务的个人斗争。"},{"t":"14.1.1 冲突的类型","c":[{"t":"任务冲突（task conflict）：与工作的内容和目标有关的冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">任务冲突</strong>（task conflict）：与工作的内容和目标有关的冲突。"},{"t":"关系冲突（relationship conflict）：侧重于人际关系的冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关系冲突</strong>（relationship conflict）：侧重于人际关系的冲突。"},{"t":"程序冲突（process conflict）：与完成工作的方式有关的冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">程序冲突</strong>（process conflict）：与完成工作的方式有关的冲突。"},{"t":"关系冲突的结论：绝大多数关系冲突至少在工作中是恶性的——敌意、矛盾与摩擦会加剧彼此的性格差异、削弱相互理解，妨碍任务完成，最易使个体心理耗竭，对需要依赖同事了解工作信息的新员工尤其有害；由于冲突围绕人格产生而人格几乎无法改变，批评\"为人\"而非\"行为方式\"会令人愤怒。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关系冲突的结论</strong>：绝大多数关系冲突至少在工作中是恶性的——敌意、矛盾与摩擦会加剧彼此的性格差异、削弱相互理解，妨碍任务完成，最易使个体心理耗竭，对需要依赖同事了解工作信息的新员工尤其有害；由于冲突围绕人格产生而人格几乎无法改变，批评&quot;为人&quot;而非&quot;行为方式&quot;会令人愤怒。"},{"t":"任务冲突与绩效的关系取决于三个条件：发生在高层还是低层——高层管理团队的任务冲突与绩效正相关，组织低层则负相关（高层不因冲突感到角色受威胁）；是否与其他冲突同时发生——与关系冲突同时发生时偏消极，单独发生时偏积极；强度是否适中——过低则人们没有真正投入，过高则暗斗恶化为关系冲突，适中的任务冲突最理想（中国研究：发展初期适度任务冲突提高群体创造力，高水平冲突使团队绩效降低）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">任务冲突与绩效的关系取决于三个条件</strong>：发生在高层还是低层——高层管理团队的任务冲突与绩效正相关，组织低层则负相关（高层不因冲突感到角色受威胁）；是否与其他冲突同时发生——与关系冲突同时发生时偏消极，单独发生时偏积极；强度是否适中——过低则人们没有真正投入，过高则暗斗恶化为关系冲突，适中的任务冲突最理想（中国研究：发展初期适度任务冲突提高群体创造力，高水平冲突使团队绩效降低）。"},{"t":"人格的调节作用：团队成员平均经验开放性和情绪稳定性较高时，更可能通过任务冲突提高绩效——正确看待任务冲突、利用想法差异解决问题而非任其恶化为关系冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人格的调节作用</strong>：团队成员平均经验开放性和情绪稳定性较高时，更可能通过任务冲突提高绩效——正确看待任务冲突、利用想法差异解决问题而非任其恶化为关系冲突。"},{"t":"程序冲突的结论：与授权及角色有关——与授权有关的冲突表现为规避和推脱，与角色相关的冲突使人感到被边缘化；它往往高度个人化并很快发展成关系冲突，还可能浪费本可用于做事的时间（为角色和责任争论不休、不了了之）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">程序冲突的结论</strong>：与授权及角色有关——与授权有关的冲突表现为规避和推脱，与角色相关的冲突使人感到被边缘化；它往往高度个人化并很快发展成关系冲突，还可能浪费本可用于做事的时间（为角色和责任争论不休、不了了之）。"}],"k":"b","i":1,"h":"14.1.1 冲突的类型"},{"t":"14.1.2 冲突的范围","c":[{"t":"二元冲突（dyadic conflict）：两个人之间的冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">二元冲突</strong>（dyadic conflict）：两个人之间的冲突。"},{"t":"群内冲突（intragroup conflict）：发生在群体或团队内部的冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">群内冲突</strong>（intragroup conflict）：发生在群体或团队内部的冲突。"},{"t":"群际冲突（intergroup conflict）：群体或团队之间的冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">群际冲突</strong>（intergroup conflict）：群体或团队之间的冲突。"},{"t":"群内冲突的条件：任务冲突要对绩效产生积极影响，团队需有支持性氛围（犯了错误不受惩罚、成员相互扶持）；成员对成就有很高需求时任务冲突有益（韩国工作小组研究）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">群内冲突的条件</strong>：任务冲突要对绩效产生积极影响，团队需有支持性氛围（犯了错误不受惩罚、成员相互扶持）；成员对成就有很高需求时任务冲突有益（韩国工作小组研究）。"},{"t":"群际冲突的管理：群体之间存在竞争且只有一个能\"获胜\"时，群际冲突几乎不可避免，必须加以管理；高水平的群际冲突使个人更固守本群体规范并承受压力；群体中相对不那么重要、但仍对群体负责的成员更善于处理群际冲突——身处群体核心位置并不利于解决群际冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">群际冲突的管理</strong>：群体之间存在竞争且只有一个能&quot;获胜&quot;时，群际冲突几乎不可避免，必须加以管理；高水平的群际冲突使个人更固守本群体规范并承受压力；群体中相对不那么重要、但仍对群体负责的成员更善于处理群际冲突——身处群体核心位置并不利于解决群际冲突。"},{"t":"结论：判断冲突有利与否，既要看冲突的类型，也要看冲突发生在哪个范围；不同冲突之间还存在互动或缓冲关系（如两人不睦叠加高任务冲突可能使任务停摆）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：判断冲突有利与否，既要看冲突的类型，也要看冲突发生在哪个范围；不同冲突之间还存在互动或缓冲关系（如两人不睦叠加高任务冲突可能使任务停摆）。"}],"k":"b","i":1,"h":"14.1.2 冲突的范围"}],"k":"sec","i":0,"h":"14.1 冲突的定义"},{"t":"14.2 冲突过程","c":[{"t":"冲突过程（conflict process）：把冲突从产生到结束划分为五个阶段的模型（图表14-2）——潜在的对立或失调→认知和人格化→行为意向→行为→结果。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">冲突过程</strong>（conflict process）：把冲突从产生到结束划分为五个阶段的模型（图表14-2）——潜在的对立或失调→认知和人格化→行为意向→行为→结果。"},{"t":"14.2.1 阶段1 潜在的对立或失调","c":[{"t":"定位：导致冲突的前提条件；它们并不直接导致冲突，但其中某一项是产生冲突的必要条件，分为沟通、结构、个体因素三大类。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定位</strong>：导致冲突的前提条件；它们并不直接导致冲突，但其中某一项是产生冲突的必要条件，分为沟通、结构、个体因素三大类。"},{"t":"沟通：误解、语义理解困难、沟通渠道中的\"噪声\"、行话与信息交流不充分共同构成沟通障碍；沟通过少或过多都会提高冲突可能性——在特定范围内沟通增加有积极效果，超过该范围即过度沟通。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">沟通</strong>：误解、语义理解困难、沟通渠道中的&quot;噪声&quot;、行话与信息交流不充分共同构成沟通障碍；沟通过少或过多都会提高冲突可能性——在特定范围内沟通增加有积极效果，超过该范围即过度沟通。"},{"t":"结构：包括群体规模、员工任务专业化程度、管辖范围清晰度、员工与目标的匹配性、领导风格、薪酬体系以及群体间依赖程度等变量；群体越大、任务越专业化越可能出现冲突；任职时间与冲突负相关——成员年轻、离职率高的群体冲突可能性大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结构</strong>：包括群体规模、员工任务专业化程度、管辖范围清晰度、员工与目标的匹配性、领导风格、薪酬体系以及群体间依赖程度等变量；群体越大、任务越专业化越可能出现冲突；任职时间与冲突负相关——成员年轻、离职率高的群体冲突可能性大。"},{"t":"个体因素：人格（不合群、神经质或低自我监控得分高者更频繁、更容易与他人冲突且不善于应对）、情绪（即使不针对他人也会引起冲突，如路怒带入会议）、价值观与偏好差异（成就期望不一致→更多任务冲突，人际亲密期望不一致→更多关系冲突，权力渴望不同→更多地位冲突）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个体因素</strong>：人格（不合群、神经质或低自我监控得分高者更频繁、更容易与他人冲突且不善于应对）、情绪（即使不针对他人也会引起冲突，如路怒带入会议）、价值观与偏好差异（成就期望不一致→更多任务冲突，人际亲密期望不一致→更多关系冲突，权力渴望不同→更多地位冲突）。"}],"k":"b","i":1,"h":"14.2.1 阶段1 潜在的对立或失调"},{"t":"14.2.2 阶段2 认知和人格化","c":[{"t":"感知的冲突（perceived conflict）：一方或多方意识到已经存在冲突的前提条件，冲突由此成为事实。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">感知的冲突</strong>（perceived conflict）：一方或多方意识到已经存在冲突的前提条件，冲突由此成为事实。"},{"t":"感觉的冲突（felt conflict）：个体投入情感、体验到焦虑、紧张、挫败或敌意时的冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">感觉的冲突</strong>（felt conflict）：个体投入情感、体验到焦虑、紧张、挫败或敌意时的冲突。"},{"t":"关键结论：冲突事项往往在此阶段被界定，而对冲突的界定勾勒出各种潜在解决方案——把加薪分歧界定为零和情境（一方多得另一方必少得）则不愿妥协；界定为潜在双赢情境（总量可能增加）则可能接受妥协方案。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键结论</strong>：冲突事项往往在此阶段被界定，而对冲突的界定勾勒出各种潜在解决方案——把加薪分歧界定为零和情境（一方多得另一方必少得）则不愿妥协；界定为潜在双赢情境（总量可能增加）则可能接受妥协方案。"},{"t":"情绪显著影响认知：消极情绪导致问题处理过于简单、失去信任、从消极方面解读对方行为；积极情绪促使发现要素间的潜在关系、以更开阔的视野看待情境、开发更创新的解决方案。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情绪显著影响认知</strong>：消极情绪导致问题处理过于简单、失去信任、从消极方面解读对方行为；积极情绪促使发现要素间的潜在关系、以更开阔的视野看待情境、开发更创新的解决方案。"}],"k":"b","i":1,"h":"14.2.2 阶段2 认知和人格化"},{"t":"14.2.3 阶段3 行为意向","c":[{"t":"行为意向（intention）：介于人们的认知情感与公开行动之间、以某种特定方式行动的决策；很多冲突不断升级是因为一方错误推断另一方的行为意向，且行为意向与行为之间通常存在间隔。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行为意向</strong>（intention）：介于人们的认知情感与公开行动之间、以某种特定方式行动的决策；很多冲突不断升级是因为一方错误推断另一方的行为意向，且行为意向与行为之间通常存在间隔。"},{"t":"两个维度：主见性（一方愿意满足自己愿望的程度）与合作性（一方愿意满足对方愿望的程度），两者组合出五种行为意向。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个维度</strong>：主见性（一方愿意满足自己愿望的程度）与合作性（一方愿意满足对方愿望的程度），两者组合出五种行为意向。"},{"t":"竞争（competing）：有主见但不合作——寻求自我利益的满足而不考虑冲突对另一方的影响，资源稀缺时更倾向竞争。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">竞争</strong>（competing）：有主见但不合作——寻求自我利益的满足而不考虑冲突对另一方的影响，资源稀缺时更倾向竞争。"},{"t":"协作（collaborating）：有主见且合作——双方均希望充分满足双方利益，通过厘清差异与分歧（而非迁就不同观点）寻求双赢方案。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">协作</strong>（collaborating）：有主见且合作——双方均希望充分满足双方利益，通过厘清差异与分歧（而非迁就不同观点）寻求双赢方案。"},{"t":"回避（avoiding）：没主见且不合作——意识到冲突存在但希望退出或抑制，如竭力忽略冲突、远离与自己有分歧的人。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">回避</strong>（avoiding）：没主见且不合作——意识到冲突存在但希望退出或抑制，如竭力忽略冲突、远离与自己有分歧的人。"},{"t":"迁就（accommodating）：没主见但合作——为维持相互关系愿意把对方利益放在自己利益之上、自我牺牲，如支持自己持保留意见的观点。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">迁就</strong>（accommodating）：没主见但合作——为维持相互关系愿意把对方利益放在自己利益之上、自我牺牲，如支持自己持保留意见的观点。"},{"t":"折中（compromising）：主见性与合作性均处中等——没有明显的赢家或输家，双方合理化冲突目标并接受彼此都无法完全满意的方案，明显特点是都打算放弃一些东西。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">折中</strong>（compromising）：主见性与合作性均处中等——没有明显的赢家或输家，双方合理化冲突目标并接受彼此都无法完全满意的方案，明显特点是都打算放弃一些东西。"},{"t":"何时选用的管理者启示：迁就适用于发现自己有错、需显得通情达理、对方需要被倾听、事项对别人比对自己更重要、想满足别人并维持合作、想为以后建立社会信任、他人胜过你而为使损失最小化等情形；折中适用于目标重要但不值得采用独断方式、对手实力旗鼓相当且目标迥异、需权宜性暂时解决复杂事项时；权威式管理适用于紧急状况、需采取不受欢迎的重大措施（削减开支、推行规章、处罚）、事项对组织利益极重要时——条件允许时应说明理由以维持参与度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">何时选用的管理者启示</strong>：迁就适用于发现自己有错、需显得通情达理、对方需要被倾听、事项对别人比对自己更重要、想满足别人并维持合作、想为以后建立社会信任、他人胜过你而为使损失最小化等情形；折中适用于目标重要但不值得采用独断方式、对手实力旗鼓相当且目标迥异、需权宜性暂时解决复杂事项时；权威式管理适用于紧急状况、需采取不受欢迎的重大措施（削减开支、推行规章、处罚）、事项对组织利益极重要时——条件允许时应说明理由以维持参与度。"}],"k":"b","i":1,"h":"14.2.3 阶段3 行为意向"},{"t":"14.2.4 阶段4 行为","c":[{"t":"定位：冲突变得显而易见的阶段，包括冲突双方的声明、行动和应对，是为实现行为意向而做的公开努力；因判断失误或缺乏经验，公开行为有时会偏离最初意向；这是一个动态的互动过程。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定位</strong>：冲突变得显而易见的阶段，包括冲突双方的声明、行动和应对，是为实现行为意向而做的公开努力；因判断失误或缺乏经验，公开行为有时会偏离最初意向；这是一个动态的互动过程。"},{"t":"冲突强度连续体（图表14-3）：无冲突→轻度的意见分歧或误解→公开的质问或怀疑→武断的言语攻击→威胁和最后通牒→挑衅的身体攻击→公然试图毁灭对方；连续体顶端的冲突（罢工、骚乱、战争）几乎都是恶性的，良性冲突位于较低位置。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">冲突强度连续体</strong>（图表14-3）：无冲突→轻度的意见分歧或误解→公开的质问或怀疑→武断的言语攻击→威胁和最后通牒→挑衅的身体攻击→公然试图毁灭对方；连续体顶端的冲突（罢工、骚乱、战争）几乎都是恶性的，良性冲突位于较低位置。"},{"t":"研究结论：开放和协作策略与优秀的团队绩效相关，回避和竞争策略与明显较差的绩效相关（影响几乎与关系冲突一样大）；协作对创新任务特别有效，但团队细分为小组时可能导致不信任；被赋予权力的人使用协作策略反而更困难——问题的产生不仅与冲突的存在及类型有关，更与应对和管理冲突的方式有关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">研究结论</strong>：开放和协作策略与优秀的团队绩效相关，回避和竞争策略与明显较差的绩效相关（影响几乎与关系冲突一样大）；协作对创新任务特别有效，但团队细分为小组时可能导致不信任；被赋予权力的人使用协作策略反而更困难——问题的产生不仅与冲突的存在及类型有关，更与应对和管理冲突的方式有关。"},{"t":"冲突管理（conflict management）：帮助管理者把冲突控制在良性水平——降低恶性冲突，或在冲突低于良性标准时适度升级——的解决与激化策略（图表14-4）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">冲突管理</strong>（conflict management）：帮助管理者把冲突控制在良性水平——降低恶性冲突，或在冲突低于良性标准时适度升级——的解决与激化策略（图表14-4）。"},{"t":"解决冲突的策略（9条）：解决问题——面对面坦率真诚的讨论以确定并解决问题；提出一个更高目标——不经双方协作努力不可能达到的共同目标；扩大资源——扩大资金、晋升机会、办公空间等稀缺资源供应；回避——逃避或抑制冲突；缓和——弱化分歧、强调共同利益；折中——双方各自放弃一些有价值的东西；权威命令——管理层运用正式职权解决冲突并传达要求；改变个人特征——通过人际关系培训等行为改变技术改变引发冲突的态度和行为；改变结构特征——通过工作再设计、工作调动、设立协调性职位改变正式结构与互动模式。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">解决冲突的策略</strong>（9条）：解决问题——面对面坦率真诚的讨论以确定并解决问题；提出一个更高目标——不经双方协作努力不可能达到的共同目标；扩大资源——扩大资金、晋升机会、办公空间等稀缺资源供应；回避——逃避或抑制冲突；缓和——弱化分歧、强调共同利益；折中——双方各自放弃一些有价值的东西；权威命令——管理层运用正式职权解决冲突并传达要求；改变个人特征——通过人际关系培训等行为改变技术改变引发冲突的态度和行为；改变结构特征——通过工作再设计、工作调动、设立协调性职位改变正式结构与互动模式。"},{"t":"激化冲突的策略（4条）：沟通——利用模棱两可或威胁性的信息提高冲突水平；引进外人——补充背景、价值观、态度或管理风格与现有成员不同的人员；重组组织——调整工作群体、改变规章制度、提高相互依赖性以打破现状；任命吹毛求疵者——安排有意与多数人观点相悖的批评者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">激化冲突的策略</strong>（4条）：沟通——利用模棱两可或威胁性的信息提高冲突水平；引进外人——补充背景、价值观、态度或管理风格与现有成员不同的人员；重组组织——调整工作群体、改变规章制度、提高相互依赖性以打破现状；任命吹毛求疵者——安排有意与多数人观点相悖的批评者。"}],"k":"b","i":1,"h":"14.2.4 阶段4 行为"},{"t":"14.2.5 阶段5 结果","c":[{"t":"良性结果：提高决策质量、激发创新与创造力、激发群体成员的兴趣与好奇心、提供使问题公开化并缓和紧张的渠道、营造有利于自我评估和变革的环境；温和的冲突还使人更活跃、更有活力、更投入——这些例子强调的是任务冲突或程序冲突，而非关系冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">良性结果</strong>：提高决策质量、激发创新与创造力、激发群体成员的兴趣与好奇心、提供使问题公开化并缓和紧张的渠道、营造有利于自我评估和变革的环境；温和的冲突还使人更活跃、更有活力、更投入——这些例子强调的是任务冲突或程序冲突，而非关系冲突。"},{"t":"恶性结果：失控的对立滋生不满、共同纽带断裂、最终使群体灭亡；具体表现有沟通受阻、凝聚力降低、明争暗斗置于群体目标之上；所有形式的冲突（甚至包括良性冲突）似乎都会降低满意度与相互信任；公开冲突使信息分享显著减少；极端情况下群体停止运转并威胁生存。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">恶性结果</strong>：失控的对立滋生不满、共同纽带断裂、最终使群体灭亡；具体表现有沟通受阻、凝聚力降低、明争暗斗置于群体目标之上；所有形式的冲突（甚至包括良性冲突）似乎都会降低满意度与相互信任；公开冲突使信息分享显著减少；极端情况下群体停止运转并威胁生存。"},{"t":"管理良性冲突的实用指南（4条）：识别是否存在真正的分歧——很多\"冲突\"只是同一件事的不同措辞（如\"分销问题\"与\"供应链管理问题\"），化解差异、鼓励开放坦率的沟通、关注共同利益；让对立的群体选出解决方案中对各自最重要的部分并聚焦满足首要需求——任何一方都无法完全如愿，但都能实现最关键的部分；开诚布公讨论分歧并事先做好管理准备——始终回避不直接解决，冲突会产生最大破坏力；强调双方的共同利益——以合作方式解决冲突并强烈认同整体目标的群体比以竞争方式解决者更高效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理良性冲突的实用指南</strong>（4条）：识别是否存在真正的分歧——很多&quot;冲突&quot;只是同一件事的不同措辞（如&quot;分销问题&quot;与&quot;供应链管理问题&quot;），化解差异、鼓励开放坦率的沟通、关注共同利益；让对立的群体选出解决方案中对各自最重要的部分并聚焦满足首要需求——任何一方都无法完全如愿，但都能实现最关键的部分；开诚布公讨论分歧并事先做好管理准备——始终回避不直接解决，冲突会产生最大破坏力；强调双方的共同利益——以合作方式解决冲突并强烈认同整体目标的群体比以竞争方式解决者更高效。"},{"t":"跨文化结论：集体主义者视人处于社会关系之中，为维系和谐会迂回表达冲突、倾向通过第三方解决争端；个人主义者视人独立自主，希望直接公开面对分歧——美国管理者更可能在冲突中采取竞争策略，中国以折中和回避最受欢迎（但中国高科技企业的高层管理团队更偏好力
