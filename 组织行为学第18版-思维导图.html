"},{"t":"菲尼亚斯·盖奇案例：铁路工人因铁棍穿颅事故完全失去体验情绪的能力，也随之失去理性能力——情绪与情感并非理性堡垒的入侵者，而是纠缠在理性的网络中。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">菲尼亚斯·盖奇案例</strong>：铁路工人因铁棍穿颅事故完全失去体验情绪的能力，也随之失去理性能力——情绪与情感并非理性堡垒的入侵者，而是纠缠在理性的网络中。"},{"t":"情绪会使我们更道德吗？道德判断在很大程度上是基于感受而不是认知产生的。","c":[],"k":"b","i":2,"h":"情绪会使我们更道德吗？道德判断在很大程度上是基于感受而不是认知产生的。"},{"t":"群体效应：共同的道德情绪有时让我们把纯粹的情绪反应当作合乎道德的；我们倾向于比对待群体内成员更严厉地判断（和惩罚）群体外成员、美化群体内成员并对其不当行为更宽容，导致道德上的双重标准。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">群体效应</strong>：共同的道德情绪有时让我们把纯粹的情绪反应当作合乎道德的；我们倾向于比对待群体内成员更严厉地判断（和惩罚）群体外成员、美化群体内成员并对其不当行为更宽容，导致道德上的双重标准。"}],"k":"b","i":1,"h":"4.1.5 情绪的作用"},{"t":"补充（传言还是科学「笑一笑，工作更顺利」）：老板效应（boss effect）——谁来微笑由更有权势的一方决定，下属通常对老板微笑而老板未必回应；自我感觉有权力的人常不回应别人的微笑，感觉没权力的人对任何人的微笑都会回应；表情并不能完全代表真实的心理感受，展示积极情绪还可借助声音变化、鼓励性手势与措辞。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">补充</strong>（传言还是科学「笑一笑，工作更顺利」）：老板效应（boss effect）——谁来微笑由更有权势的一方决定，下属通常对老板微笑而老板未必回应；自我感觉有权力的人常不回应别人的微笑，感觉没权力的人对任何人的微笑都会回应；表情并不能完全代表真实的心理感受，展示积极情绪还可借助声音变化、鼓励性手势与措辞。"}],"k":"sec","i":0,"h":"4.1 什么是情绪和心境"},{"t":"4.2 情绪和心境的来源","c":[{"t":"4.2.1 人格：人们的心境和情绪往往具有某些人格特质成分；情感强度（affect intensity）指情绪体验的强度，情感强度高的人对积极情绪和消极情绪的体验都更深（悲伤时真的很悲伤，高兴时真的很高兴）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.2.1 人格</strong>：人们的心境和情绪往往具有某些人格特质成分；情感强度（affect intensity）指情绪体验的强度，情感强度高的人对积极情绪和消极情绪的体验都更深（悲伤时真的很悲伤，高兴时真的很高兴）。"},{"t":"4.2.2 每日时间：积极情感的峰值通常在上午出现（10～12点），保持到傍晚（19点左右），醒后12小时开始下降至午夜；消极情感波动较小、总体一天之中不断增长，早上最低、深夜最高；通过控制光照可以改变昼夜节律，夜班者也可获得相似的情绪周期。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.2.2 每日时间</strong>：积极情感的峰值通常在上午出现（10～12点），保持到傍晚（19点左右），醒后12小时开始下降至午夜；消极情感波动较小、总体一天之中不断增长，早上最低、深夜最高；通过控制光照可以改变昼夜节律，夜班者也可获得相似的情绪周期。"},{"t":"4.2.3 每周时间：美国成年人的积极情感在周五、周六、周日较高，周一最低；德国、中国类似；例外是日本人周一的积极情感比周五或周六还高；周日消极情感较高可能是因为即将到来的工作日让人略感不安。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.2.3 每周时间</strong>：美国成年人的积极情感在周五、周六、周日较高，周一最低；德国、中国类似；例外是日本人周一的积极情感比周五或周六还高；周日消极情感较高可能是因为即将到来的工作日让人略感不安。"},{"t":"4.2.4 天气：大量证据表明天气对心境的影响甚微；虚假相关（illusory correlation）指把并无真实联系的两件事联系到一起，可解释人们认为天气影响心境；研究显示员工在坏天气的日子可能效率更高，是因为干扰减少而非心境改善。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.2.4 天气</strong>：大量证据表明天气对心境的影响甚微；虚假相关（illusory correlation）指把并无真实联系的两件事联系到一起，可解释人们认为天气影响心境；研究显示员工在坏天气的日子可能效率更高，是因为干扰减少而非心境改善。"},{"t":"4.2.5 压力：恶意邮件、最后期限、销售损失、被老板训斥等压力事件给心境带来消极影响；经常出现的低水平压力事件会随时间推移导致紧张程度逐渐增强；压力通常破坏心境，人们在情绪透支和高压情形下会想要退出、回避。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.2.5 压力</strong>：恶意邮件、最后期限、销售损失、被老板训斥等压力事件给心境带来消极影响；经常出现的低水平压力事件会随时间推移导致紧张程度逐渐增强；压力通常破坏心境，人们在情绪透支和高压情形下会想要退出、回避。"},{"t":"4.2.6 社交活动：社交活动可以增加积极的心境，对消极心境几乎没有影响；身体活动（溜冰、远足）、非正式活动（聚会）、美食相关活动（聚餐）比正式活动（会议）或久坐活动（一起看电视）更易带来积极心境。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.2.6 社交活动</strong>：社交活动可以增加积极的心境，对消极心境几乎没有影响；身体活动（溜冰、远足）、非正式活动（聚会）、美食相关活动（聚餐）比正式活动（会议）或久坐活动（一起看电视）更易带来积极心境。"},{"t":"4.2.7 睡眠：美国每晚睡眠少于6小时的劳动者达4100万人；睡眠质量影响心境和决策、加重疲劳，增加疾病、伤痛、抑郁风险；睡眠少使人易怒、易冒风险、损害工作满意度、降低道德判断能力；增加规律睡眠可增强创造力、提高业绩（平均睡眠时间每增加1小时，工资增加16%）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.2.7 睡眠</strong>：美国每晚睡眠少于6小时的劳动者达4100万人；睡眠质量影响心境和决策、加重疲劳，增加疾病、伤痛、抑郁风险；睡眠少使人易怒、易冒风险、损害工作满意度、降低道德判断能力；增加规律睡眠可增强创造力、提高业绩（平均睡眠时间每增加1小时，工资增加16%）。"},{"t":"4.2.8 锻炼：锻炼会强化积极心境（\"出汗疗法\"有效），总体效果不太明显，但对郁郁寡欢的人效果最好。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.2.8 锻炼</strong>：锻炼会强化积极心境（&quot;出汗疗法&quot;有效），总体效果不太明显，但对郁郁寡欢的人效果最好。"},{"t":"4.2.9 年龄：老年人倾向于更多地专注于积极刺激、更少关注消极刺激（近100项研究证实），并通过增加注意力和记忆力中的积极成分进行自我调节。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.2.9 年龄</strong>：老年人倾向于更多地专注于积极刺激、更少关注消极刺激（近100项研究证实），并通过增加注意力和记忆力中的积极成分进行自我调节。"},{"t":"4.2.10 性别：女性比男性更强烈地体验情绪、更持久地保持情绪并更频繁地表达情绪（愤怒除外）；37国研究显示男性表现更多愤怒等\"有力\"情绪，女性表达更多悲伤、恐惧等\"无力\"情绪；性别差异可能因测量方式不同而不确定；刻板印象：同样的悲伤表情，女性被解读为拥有情绪化人格，男性被解读为经历了糟糕的一天；木然表情的男性更易被解读为愤怒，女性更易被解读为快乐。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.2.10 性别</strong>：女性比男性更强烈地体验情绪、更持久地保持情绪并更频繁地表达情绪（愤怒除外）；37国研究显示男性表现更多愤怒等&quot;有力&quot;情绪，女性表达更多悲伤、恐惧等&quot;无力&quot;情绪；性别差异可能因测量方式不同而不确定；刻板印象：同样的悲伤表情，女性被解读为拥有情绪化人格，男性被解读为经历了糟糕的一天；木然表情的男性更易被解读为愤怒，女性更易被解读为快乐。"}],"k":"sec","i":0,"h":"4.2 情绪和心境的来源"},{"t":"4.3 情绪劳动","c":[{"t":"情绪劳动（emotional labor）：员工在工作过程中与人交往时表现出符合组织要求的情绪，是出色工作绩效的一个关键成分（期待空乘人员热情愉快、丧葬顾问悲伤、医生情绪中性）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪劳动</strong>（emotional labor）：员工在工作过程中与人交往时表现出符合组织要求的情绪，是出色工作绩效的一个关键成分（期待空乘人员热情愉快、丧葬顾问悲伤、医生情绪中性）。"},{"t":"内感情绪（felt emotion）：个体的实际情绪。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">内感情绪</strong>（felt emotion）：个体的实际情绪。"},{"t":"外显情绪（displayed emotion）：组织要求员工表现出来的、被视为符合特定工作的情绪；它们不是与生俱来的，而是后天习得的产物，可能与内感情绪吻合也可能不一致。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">外显情绪</strong>（displayed emotion）：组织要求员工表现出来的、被视为符合特定工作的情绪；它们不是与生俱来的，而是后天习得的产物，可能与内感情绪吻合也可能不一致。"},{"t":"表达规则：有的工作场合有明确的表达规则，通常适用于重要互动（尤其员工与客户之间）；表达规则程度非常高或非常低的员工销售表现都不如有中等表达规则及高度自由裁量权的员工。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">表达规则</strong>：有的工作场合有明确的表达规则，通常适用于重要互动（尤其员工与客户之间）；表达规则程度非常高或非常低的员工销售表现都不如有中等表达规则及高度自由裁量权的员工。"},{"t":"表层扮演（surface acting）：按照表达规则隐藏自己的感受和情绪表达（处理外显情绪），如在不想笑的时候对顾客微笑。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">表层扮演</strong>（surface acting）：按照表达规则隐藏自己的感受和情绪表达（处理外显情绪），如在不想笑的时候对顾客微笑。"},{"t":"深层扮演（deep acting）：按照表达规则调整内在的真实情感（处理内感情绪）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">深层扮演</strong>（deep acting）：按照表达规则调整内在的真实情感（处理内感情绪）。"},{"t":"后果：表层扮演与压力增加、工作满意度降低有关，日常表层扮演还可能导致在家情绪低落、工作与家庭冲突、旷工以及失眠；深层扮演与工作满意度（尤其工作具有挑战性时）、工作绩效、更好的客户待遇和小费正相关。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">后果</strong>：表层扮演与压力增加、工作满意度降低有关，日常表层扮演还可能导致在家情绪低落、工作与家庭冲突、旷工以及失眠；深层扮演与工作满意度（尤其工作具有挑战性时）、工作绩效、更好的客户待遇和小费正相关。"},{"t":"情绪失调（emotional dissonance）：需要表现出来的情绪与真实情绪不一致；长期情绪失调可能导致工作倦怠、工作绩效变差和工作满意度降低，最终导致情绪衰竭（emotional exhaustion）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪失调</strong>（emotional dissonance）：需要表现出来的情绪与真实情绪不一致；长期情绪失调可能导致工作倦怠、工作绩效变差和工作满意度降低，最终导致情绪衰竭（emotional exhaustion）。"},{"t":"缓解因素（德国和澳大利亚研究）：自我控制能力强的员工、每天晚上睡眠好的员工以及与顾客或客户关系密切的员工，可在一定程度上缓解情绪失调的负面影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">缓解因素</strong>（德国和澳大利亚研究）：自我控制能力强的员工、每天晚上睡眠好的员工以及与顾客或客户关系密切的员工，可在一定程度上缓解情绪失调的负面影响。"}],"k":"sec","i":0,"h":"4.3 情绪劳动"},{"t":"4.4 情感事件理论","c":[{"t":"情感事件理论（affective events theory, AET）：员工会对工作中发生的事情产生情绪反应，这些反应又影响他们的工作绩效和满意度。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情感事件理论</strong>（affective events theory, AET）：员工会对工作中发生的事情产生情绪反应，这些反应又影响他们的工作绩效和满意度。"},{"t":"机理：个人性格的消极或积极程度影响其经历工作事件时的情绪反应，情绪反应进而与工作场所的态度和行为相关（如发现公司裁员会引发担心和恐惧，把时间花在担心而非工作上，工作满意度下降）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">机理</strong>：个人性格的消极或积极程度影响其经历工作事件时的情绪反应，情绪反应进而与工作场所的态度和行为相关（如发现公司裁员会引发担心和恐惧，把时间花在担心而非工作上，工作满意度下降）。"},{"t":"两个要点：第一，情绪帮助我们了解工作场所中的事件是如何影响员工的绩效和满意度的；第二，即使看起来微不足道，员工和管理人员也不能忽视情绪以及引起情绪的事件，因为它们会聚少成多。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">两个要点</strong>：第一，情绪帮助我们了解工作场所中的事件是如何影响员工的绩效和满意度的；第二，即使看起来微不足道，员工和管理人员也不能忽视情绪以及引起情绪的事件，因为它们会聚少成多。"}],"k":"sec","i":0,"h":"4.4 情感事件理论"},{"t":"4.5 情绪智力","c":[{"t":"情绪智力（emotional intelligence, EI）：一个人感知自我和他人的情绪、理解这些情绪的意义、相应地调节自己的情绪的能力。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪智力</strong>（emotional intelligence, EI）：一个人感知自我和他人的情绪、理解这些情绪的意义、相应地调节自己的情绪的能力。"},{"t":"传递模型（图表4-5）：感知自我和他人的情绪→了解情绪的意义→调节情绪；该过程分别与责任心、认知能力、情绪稳定性相关。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">传递模型</strong>（图表4-5）：感知自我和他人的情绪→了解情绪的意义→调节情绪；该过程分别与责任心、认知能力、情绪稳定性相关。"},{"t":"效果：了解自己情绪并善于读取情绪线索的人更有效率；情绪智力与团队合作有效性、偏差行为和公民行为有关；情绪智力高的韩国管理者销售业绩更好（更有凝聚力、能提高以销售为导向的行为）；对11位美国总统的评估发现，区分成功总统（罗斯福、肯尼迪、里根）与不成功总统（约翰逊、卡特、尼克松）的关键品质是情绪智力。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">效果</strong>：了解自己情绪并善于读取情绪线索的人更有效率；情绪智力与团队合作有效性、偏差行为和公民行为有关；情绪智力高的韩国管理者销售业绩更好（更有凝聚力、能提高以销售为导向的行为）；对11位美国总统的评估发现，区分成功总统（罗斯福、肯尼迪、里根）与不成功总统（约翰逊、卡特、尼克松）的关键品质是情绪智力。"},{"t":"局限与争议：EI测试项目与其他人格、智力和自我感知测试常惊人地相似；多通过自我报告清单衡量、不够客观，与工作效率只有中度相关；测量需按文化调整（不同文化情绪表达与情绪信号解读不同）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">局限与争议</strong>：EI测试项目与其他人格、智力和自我感知测试常惊人地相似；多通过自我报告清单衡量、不够客观，与工作效率只有中度相关；测量需按文化调整（不同文化情绪表达与情绪信号解读不同）。"},{"t":"道德抉择（管理者是否应该使用情绪智力测验）：没有哪种测验适用于所有人；应聘者可能不愿参加；分数对绩效的预测不适用于所有工种（对需要大量社会互动的职业如销售有效）；究竟测了什么还不清楚；对反生产行为影响的研究不足——应避免仅凭EI测验做招聘决策，但也不必完全否定（美国空军研究表明高EI应聘者成功率高2.6倍）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">道德抉择</strong>（管理者是否应该使用情绪智力测验）：没有哪种测验适用于所有人；应聘者可能不愿参加；分数对绩效的预测不适用于所有工种（对需要大量社会互动的职业如销售有效）；究竟测了什么还不清楚；对反生产行为影响的研究不足——应避免仅凭EI测验做招聘决策，但也不必完全否定（美国空军研究表明高EI应聘者成功率高2.6倍）。"}],"k":"sec","i":0,"h":"4.5 情绪智力"},{"t":"4.6 情绪调节","c":[{"t":"情绪调节：识别并调整自己所感受到的情绪；情绪管理能力是预测某些工作绩效和组织公民行为的强有力指标。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪调节</strong>：识别并调整自己所感受到的情绪；情绪管理能力是预测某些工作绩效和组织公民行为的强有力指标。"},{"t":"4.6.1 情绪调节的影响和结果","c":[{"t":"神经质的人调节情绪面临更多困难；自尊水平低的人较少改善自己的不良情绪。","c":[],"k":"b","i":2,"h":"神经质的人调节情绪面临更多困难；自尊水平低的人较少改善自己的不良情绪。"},{"t":"工作团队的多元化会增加调节情绪的可能性：小组内有年长成员时年轻员工更可能调节情绪；种族多元化程度低时少数族裔员工参与情绪调节以\"适应\"多数族裔，多元程度高时多数员工进行情绪调节以融入群体。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工作团队的多元化会增加调节情绪的可能性</strong>：小组内有年长成员时年轻员工更可能调节情绪；种族多元化程度低时少数族裔员工参与情绪调节以&quot;适应&quot;多数族裔，多元程度高时多数员工进行情绪调节以融入群体。"},{"t":"弊端：改变情绪意味着付出努力、可能让人筋疲力尽；试图改变某种情绪反而可能使其更强烈（说服自己不害怕的同时也在强调它）；回避消极情绪不如主动寻求积极情绪体验（与朋友交流比回避不愉快的交谈更有效）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">弊端</strong>：改变情绪意味着付出努力、可能让人筋疲力尽；试图改变某种情绪反而可能使其更强烈（说服自己不害怕的同时也在强调它）；回避消极情绪不如主动寻求积极情绪体验（与朋友交流比回避不愉快的交谈更有效）。"}],"k":"b","i":1,"h":"4.6.1 情绪调节的影响和结果"},{"t":"4.6.2 情绪调节技术","c":[{"t":"情绪抑制：抑制对情况最初的情绪反应；有助于危机期间的短期思考（士兵抑制射击后的情绪困扰、基金经理抑制对股价下跌的反应），但日常使用会影响心智能力、情绪能力、身体健康和人际关系；日常更好的做法是承认反应并在事件发生后进行重新评估。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情绪抑制</strong>：抑制对情况最初的情绪反应；有助于危机期间的短期思考（士兵抑制射击后的情绪困扰、基金经理抑制对股价下跌的反应），但日常使用会影响心智能力、情绪能力、身体健康和人际关系；日常更好的做法是承认反应并在事件发生后进行重新评估。"},{"t":"认知再评估：重构我们对情绪状况的看法，是有效的调节方法；在个体无法控制压力来源时最有帮助（以色列研究：重新评估后参与者更倾向和解，5个月后依然如此）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">认知再评估</strong>：重构我们对情绪状况的看法，是有效的调节方法；在个体无法控制压力来源时最有帮助（以色列研究：重新评估后参与者更倾向和解，5个月后依然如此）。"},{"t":"社交分享（发泄）：公开的情绪表达有助于调节情绪、减少愤怒反应，但效果取决于倾听者的反应——只有倾听者表达支持或认同时发泄者才感觉好些；向被视为冒犯者的人宣泄几乎不能改善情况，反而加剧消极情绪。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社交分享</strong>（发泄）：公开的情绪表达有助于调节情绪、减少愤怒反应，但效果取决于倾听者的反应——只有倾听者表达支持或认同时发泄者才感觉好些；向被视为冒犯者的人宣泄几乎不能改善情况，反而加剧消极情绪。"},{"t":"正念（mindfulness）：接受并意识到当下的时刻、事件和体验；源自佛教冥想传统（梵语sati，意为\"心灵的专注\"）；可减少工作场所的情绪衰竭、提高工作满意度，改善绩效、工作与生活的平衡和睡眠质量，降低离职意向、减少报复行为和反生产行为；但研究尚新，概念化与最佳实践尚未统一。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">正念</strong>（mindfulness）：接受并意识到当下的时刻、事件和体验；源自佛教冥想传统（梵语sati，意为&quot;心灵的专注&quot;）；可减少工作场所的情绪衰竭、提高工作满意度，改善绩效、工作与生活的平衡和睡眠质量，降低离职意向、减少报复行为和反生产行为；但研究尚新，概念化与最佳实践尚未统一。"},{"t":"策略差异：面对粗鲁无礼的主管时，使用抑制技术的员工比使用认知再评估的员工承受更多情绪衰竭和工作退缩。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">策略差异</strong>：面对粗鲁无礼的主管时，使用抑制技术的员工比使用认知再评估的员工承受更多情绪衰竭和工作退缩。"},{"t":"最佳路径：招聘心态积极的员工，并训练领导者管理他们的心境、工作态度和绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最佳路径</strong>：招聘心态积极的员工，并训练领导者管理他们的心境、工作态度和绩效。"}],"k":"b","i":1,"h":"4.6.2 情绪调节技术"},{"t":"4.6.3 情绪调节伦理","c":[{"t":"两个极端论点：控制自己的情绪是不道德的（因为需要行动）vs 所有的情绪都应该被控制（以便冷静思考）；各论点在道德上都有利有弊，需要考虑情绪调节的原因和后果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两个极端论点</strong>：控制自己的情绪是不道德的（因为需要行动）vs 所有的情绪都应该被控制（以便冷静思考）；各论点在道德上都有利有弊，需要考虑情绪调节的原因和后果。"},{"t":"\"假装直到成真\"：像心情很好时那样去表现，可能让心情真的变好（星巴克研究中被要求表现快乐的参与者事后报告心情变好）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">&quot;假装直到成真&quot;</strong>：像心情很好时那样去表现，可能让心情真的变好（星巴克研究中被要求表现快乐的参与者事后报告心情变好）。"}],"k":"b","i":1,"h":"4.6.3 情绪调节伦理"}],"k":"sec","i":0,"h":"4.6 情绪调节"},{"t":"4.7 情绪和心境在组织行为中的应用","c":[{"t":"4.7.1 人员选拔：对需要高度社会互动的工作，雇主应把情绪智力考虑在内（美国空军研究：高EI应聘者的成功率高出2.6倍）。补充（道德困境「情绪数据挖掘」）：微表情识别技术尚未成熟用于工作场所，最重要的伦理问题是隐私，使用时应认识其局限性。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.7.1 人员选拔</strong>：对需要高度社会互动的工作，雇主应把情绪智力考虑在内（美国空军研究：高EI应聘者的成功率高出2.6倍）。补充（道德困境「情绪数据挖掘」）：微表情识别技术尚未成熟用于工作场所，最重要的伦理问题是隐私，使用时应认识其局限性。"},{"t":"4.7.2 决策：积极的情绪和心境有助于做出更好决策、提高解决问题的能力；对消极情绪的作用尚存分歧（悲伤者决策可能不变、愤怒者可能做出更强硬的选择；消极心境下选择可能更有独创性、可能承担更高风险）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.7.2 决策</strong>：积极的情绪和心境有助于做出更好决策、提高解决问题的能力；对消极情绪的作用尚存分歧（悲伤者决策可能不变、愤怒者可能做出更强硬的选择；消极心境下选择可能更有独创性、可能承担更高风险）。"},{"t":"4.7.3 创造力：主流观点认为心境好的人更有创造力（想法更多、被认为更新颖、更灵活变通思想开放）；另一派认为积极心境使人放松而不批判，而活化情感（active feeling，如愤怒、害怕、欣喜）带来更多创造力，钝化心境（deactivating mood，如悲伤、失望、平静）带来较少创造力；疲劳也可能有利于创造。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.7.3 创造力</strong>：主流观点认为心境好的人更有创造力（想法更多、被认为更新颖、更灵活变通思想开放）；另一派认为积极心境使人放松而不批判，而活化情感（active feeling，如愤怒、害怕、欣喜）带来更多创造力，钝化心境（deactivating mood，如悲伤、失望、平静）带来较少创造力；疲劳也可能有利于创造。"},{"t":"4.7.4 动机：拥有积极心境的人更相信自己有能力完成任务、付出更多努力（猜字谜实验）；保险销售员中心境好者更助人、自我感觉更好、绩效更高；积极反馈形成\"积极心境→创造力→积极反馈\"的良性循环；管理者可通过鼓励良好心境提高员工的动机和绩效。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.7.4 动机</strong>：拥有积极心境的人更相信自己有能力完成任务、付出更多努力（猜字谜实验）；保险销售员中心境好者更助人、自我感觉更好、绩效更高；积极反馈形成&quot;积极心境→创造力→积极反馈&quot;的良性循环；管理者可通过鼓励良好心境提高员工的动机和绩效。"},{"t":"4.7.5 领导：专注于鼓舞人心目标的领导者使员工更乐观、乐于合作、热情；变革型领导通过分享彼此的情绪激发追随者积极情绪、获得更好的任务绩效；领导者表现出悲伤会提高追随者的分析能力；通过唤起情绪并与诱人的愿景目标结合，可帮助管理者与员工接受变革。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.7.5 领导</strong>：专注于鼓舞人心目标的领导者使员工更乐观、乐于合作、热情；变革型领导通过分享彼此的情绪激发追随者积极情绪、获得更好的任务绩效；领导者表现出悲伤会提高追随者的分析能力；通过唤起情绪并与诱人的愿景目标结合，可帮助管理者与员工接受变革。"},{"t":"4.7.6 谈判：假装愤怒的谈判者可能更有优势（对手得出其已无退让余地的结论），但信息较少或力量较弱者表现愤怒结果更糟；受消极情绪影响的谈判者对谈判产生消极看法、不愿在将来分享信息或寻求合作；最好的谈判者可能是持有中性情绪的人（脑部情绪中心受损者面对消极结果不会矫枉过正）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.7.6 谈判</strong>：假装愤怒的谈判者可能更有优势（对手得出其已无退让余地的结论），但信息较少或力量较弱者表现愤怒结果更糟；受消极情绪影响的谈判者对谈判产生消极看法、不愿在将来分享信息或寻求合作；最好的谈判者可能是持有中性情绪的人（脑部情绪中心受损者面对消极结果不会矫枉过正）。"},{"t":"4.7.7 客户服务：员工的情绪状态影响客户服务，进而影响业务水平和顾客满意度；情绪传染（emotional contagion）指从他人那里\"捕捉\"情绪；碰上积极员工的客户购物时间更长；员工受客户不公正对待时难以表现积极情绪；高质量服务常使员工处于情绪失调状态，管理者可通过培养积极心境阻断负面情绪的传染。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.7.7 客户服务</strong>：员工的情绪状态影响客户服务，进而影响业务水平和顾客满意度；情绪传染（emotional contagion）指从他人那里&quot;捕捉&quot;情绪；碰上积极员工的客户购物时间更长；员工受客户不公正对待时难以表现积极情绪；高质量服务常使员工处于情绪失调状态，管理者可通过培养积极心境阻断负面情绪的传染。"},{"t":"4.7.8 工作-生活满意度：工作与家庭的心境相互影响；当天工作顺利，晚上在家的心境更好，反之亦然；工作情绪通常到第二天就会消失；夫妻中一方在工作中的消极心境会波及配偶。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.7.8 工作-生活满意度</strong>：工作与家庭的心境相互影响；当天工作顺利，晚上在家的心境更好，反之亦然；工作情绪通常到第二天就会消失；夫妻中一方在工作中的消极心境会波及配偶。"},{"t":"4.7.9 工作场所偏差行为：反生产工作行为可追溯到消极情绪；嫉妒（别人得到了自己渴望而未得的东西）导致怀有恶意的偏差行为；愤怒者将糟糕心境归咎他人、视他人行为敌对，可能直接导致言语或身体攻击；巴基斯坦研究表明愤怒引起更激进的不良行为而悲伤不会，愤怒和悲伤都无法预测退缩行为；攻击开始后消极行为会恶化升级，管理者需与员工保持联系、衡量情绪及情绪强度。补充（观点碰撞「有时候发脾气对大家都好」）：正方认为投身组织的员工表达愤怒有益、压抑愤怒降低满意度并造成内部伤害；反方认为愤怒有毒、与不当行为相关，组织可通过愤怒管理项目（如MTS Systems）减少其影响。补充（职业目标「如何安抚愤怒的老板」）：成为无礼行为承受者时66%的人绩效下降、25%会把沮丧发泄到顾客身上；建议保持同理心、做错就道歉、不顶嘴，必要时冷静面对或求助人力资源部。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.7.9 工作场所偏差行为</strong>：反生产工作行为可追溯到消极情绪；嫉妒（别人得到了自己渴望而未得的东西）导致怀有恶意的偏差行为；愤怒者将糟糕心境归咎他人、视他人行为敌对，可能直接导致言语或身体攻击；巴基斯坦研究表明愤怒引起更激进的不良行为而悲伤不会，愤怒和悲伤都无法预测退缩行为；攻击开始后消极行为会恶化升级，管理者需与员工保持联系、衡量情绪及情绪强度。补充（观点碰撞「有时候发脾气对大家都好」）：正方认为投身组织的员工表达愤怒有益、压抑愤怒降低满意度并造成内部伤害；反方认为愤怒有毒、与不当行为相关，组织可通过愤怒管理项目（如MTS Systems）减少其影响。补充（职业目标「如何安抚愤怒的老板」）：成为无礼行为承受者时66%的人绩效下降、25%会把沮丧发泄到顾客身上；建议保持同理心、做错就道歉、不顶嘴，必要时冷静面对或求助人力资源部。"},{"t":"4.7.10 工作中的安全与伤害：消极情感与不断增加的工伤相联系；糟糕心境通过焦虑（无法有效处理危险）、悲观（对安全防护措施持悲观态度、惊慌失措）、分心（粗心大意）等方式导致伤害；应选拔心境积极的团队成员（有魅力的领导者通过传染效应传递积极情绪）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">4.7.10 工作中的安全与伤害</strong>：消极情感与不断增加的工伤相联系；糟糕心境通过焦虑（无法有效处理危险）、悲观（对安全防护措施持悲观态度、惊慌失措）、分心（粗心大意）等方式导致伤害；应选拔心境积极的团队成员（有魅力的领导者通过传染效应传递积极情绪）。"},{"t":"对管理者的启示（本章小结）：认识到情绪是工作场所中的一部分，良好的管理并不意味着创造一个没有情绪的环境；尽可能塑造真实且积极的情绪和心境，以提升员工的有效决策、创造力和动机；提供积极的反馈以调动积极性，雇用更容易有积极心境的人也有帮助；在服务业鼓励员工表达积极情绪，促进员工与客户间的交流和协商；理解情绪和心境的作用可以提高解释和预测同事及他人行为的能力。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（本章小结）：认识到情绪是工作场所中的一部分，良好的管理并不意味着创造一个没有情绪的环境；尽可能塑造真实且积极的情绪和心境，以提升员工的有效决策、创造力和动机；提供积极的反馈以调动积极性，雇用更容易有积极心境的人也有帮助；在服务业鼓励员工表达积极情绪，促进员工与客户间的交流和协商；理解情绪和心境的作用可以提高解释和预测同事及他人行为的能力。"}],"k":"sec","i":0,"h":"4.7 情绪和心境在组织行为中的应用"}],"k":"chap","h":"第4章 情绪与心境"},{"t":"第5章 人格与价值观","c":[{"t":"学习目标","c":[{"t":"描述人格、人格的测量方法以及人格的决定因素。","c":[],"k":"b","i":1,"h":"描述人格、人格的测量方法以及人格的决定因素。"},{"t":"描述迈尔斯-布里格斯类型指标（MBTI）人格框架和大五人格模型的优势和劣势。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">描述迈尔斯-布里格斯类型指标</strong>（MBTI）人格框架和大五人格模型的优势和劣势。"},{"t":"讨论核心自我评价（CSE）、自我监控和主动性人格的概念如何促进对人格的理解。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">讨论核心自我评价</strong>（CSE）、自我监控和主动性人格的概念如何促进对人格的理解。"},{"t":"描述人格是如何影响求职和失业的。","c":[],"k":"b","i":1,"h":"描述人格是如何影响求职和失业的。"},{"t":"描述具体情境如何影响人格对行为的预测能力。","c":[],"k":"b","i":1,"h":"描述具体情境如何影响人格对行为的预测能力。"},{"t":"比较终极价值观和工具价值观。","c":[],"k":"b","i":1,"h":"比较终极价值观和工具价值观。"},{"t":"描述人-工作匹配和人-组织匹配之间的差异。","c":[],"k":"b","i":1,"h":"描述人-工作匹配和人-组织匹配之间的差异。"},{"t":"比较霍夫斯泰德的五大价值观维度和 GLOBE 框架。","c":[],"k":"b","i":1,"h":"比较霍夫斯泰德的五大价值观维度和 GLOBE 框架。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"5.1 人格","c":[{"t":"5.1.1 什么是人格","c":[{"t":"人格（personality）：个体对他人的反应方式和交往方式的总和，常通过个体表现出来的能够测量的特质进行描述。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人格</strong>（personality）：个体对他人的反应方式和交往方式的总和，常通过个体表现出来的能够测量的特质进行描述。"},{"t":"测量人格：","c":[{"t":"自我报告法：个体就一系列因素进行自我评估；当分数将被用于雇佣决定时，人们对自己责任心和情绪稳定性的评价会提高约0.5个标准差（伪装），且心情不好时分数可能不准确。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">自我报告法</strong>：个体就一系列因素进行自我评估；当分数将被用于雇佣决定时，人们对自己责任心和情绪稳定性的评价会提高约0.5个标准差（伪装），且心情不好时分数可能不准确。"},{"t":"观察者评定测量法：由一位同事或另一名观察者独立评定；与自我报告结果高度相关，但在预测工作成功方面比单独使用自我报告法更好；两者结合可以更好地预测绩效，重要的雇佣决策应两种方法都用。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">观察者评定测量法</strong>：由一位同事或另一名观察者独立评定；与自我报告结果高度相关，但在预测工作成功方面比单独使用自我报告法更好；两者结合可以更好地预测绩效，重要的雇佣决策应两种方法都用。"},{"t":"应用广泛：美国排名前十的私人企业中有8家、57%的大型企业在使用人格测试（施乐、麦当劳、劳氏等）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">应用广泛</strong>：美国排名前十的私人企业中有8家、57%的大型企业在使用人格测试（施乐、麦当劳、劳氏等）。"},{"t":"文化影响评价方式：个人主义国家的人倾向于自我夸大（不损害职业生涯），中国、韩国等集体主义国家的人倾向于自我贬低（自我夸大在崇尚谦逊的集体主义国家会损害职业生涯）；无论哪种社会，低估自己都会造成损害。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">文化影响评价方式</strong>：个人主义国家的人倾向于自我夸大（不损害职业生涯），中国、韩国等集体主义国家的人倾向于自我贬低（自我夸大在崇尚谦逊的集体主义国家会损害职业生涯）；无论哪种社会，低估自己都会造成损害。"},{"t":"补充（职业目标「如何通过人格测试」）：有些公司设\"谎言量表\"标记极端有利的回答；并非每种工作都需要所有特质高分（随和性对销售、教练等竞争性工作的绩效预测力弱）；诚实是最好的策略——组织和本人都在寻求匹配。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">补充</strong>（职业目标「如何通过人格测试」）：有些公司设&quot;谎言量表&quot;标记极端有利的回答；并非每种工作都需要所有特质高分（随和性对销售、教练等竞争性工作的绩效预测力弱）；诚实是最好的策略——组织和本人都在寻求匹配。"}],"k":"b","i":2,"h":"<strong class=\"lead\">测量人格</strong>："},{"t":"人格的决定因素：人格是遗传和环境因素综合作用的产物，目前的研究倾向于遗传因素更重要；遗传（heredity）指在胚胎阶段已经决定的因素（身材、相貌、性别、秉性、肌肉组成和反射、精力水平、生物规律）；对134项研究的总结表明约40%的人格归因于遗传、60%归因于环境。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人格的决定因素</strong>：人格是遗传和环境因素综合作用的产物，目前的研究倾向于遗传因素更重要；遗传（heredity）指在胚胎阶段已经决定的因素（身材、相貌、性别、秉性、肌肉组成和反射、精力水平、生物规律）；对134项研究的总结表明约40%的人格归因于遗传、60%归因于环境。"},{"t":"人格并非永不改变：可靠性（dependability）的测量分数随年龄上升（年轻人组建家庭、经营事业）；人格在青春期更易改变，在成年人中更加稳定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人格并非永不改变</strong>：可靠性（dependability）的测量分数随年龄上升（年轻人组建家庭、经营事业）；人格在青春期更易改变，在成年人中更加稳定。"},{"t":"人格特质（personality trait）：某人频繁展现、且随时间推移和环境改变能够持久的特征；一贯性越明显、在不同情形下出现越频繁，该特质在描述个体时越重要。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人格特质</strong>（personality trait）：某人频繁展现、且随时间推移和环境改变能够持久的特征；一贯性越明显、在不同情形下出现越频繁，该特质在描述个体时越重要。"}],"k":"b","i":1,"h":"5.1.1 什么是人格"}],"k":"sec","i":0,"h":"5.1 人格"},{"t":"5.2 人格框架","c":[{"t":"主要框架：迈尔斯-布里格斯类型指标（MBTI）和大五人格模型是使用最广泛、最著名的人格框架；\"黑暗三特质\"等框架只解释人格的某些方面、并不全面。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">主要框架</strong>：迈尔斯-布里格斯类型指标（MBTI）和大五人格模型是使用最广泛、最著名的人格框架；&quot;黑暗三特质&quot;等框架只解释人格的某些方面、并不全面。"},{"t":"5.2.1 迈尔斯-布里格斯类型指标（MBTI）","c":[{"t":"迈尔斯-布里格斯类型指标（Myers-Briggs Type Indicator, MBTI）：使用最广泛的人格框架之一，含100道问题，了解个体在情境中通常的感觉和活动，把个体区分为四组八型。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">迈尔斯-布里格斯类型指标</strong>（Myers-Briggs Type Indicator, MBTI）：使用最广泛的人格框架之一，含100道问题，了解个体在情境中通常的感觉和活动，把个体区分为四组八型。"},{"t":"四个维度：","c":[{"t":"外向型（extraverted, E）/内向型（introverted, I）：外向型性格开朗、善于社交、充满自信；内向型安静、害羞。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">外向型</strong>（extraverted, E）/内向型（introverted, I）：外向型性格开朗、善于社交、充满自信；内向型安静、害羞。"},{"t":"感觉型（sensing, S）/直觉型（intuitive, N）：感觉型注重实际、偏爱程序化和秩序化、注重细节；直觉型依赖无意识处理过程、关注事情的\"整体图景\"。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">感觉型</strong>（sensing, S）/直觉型（intuitive, N）：感觉型注重实际、偏爱程序化和秩序化、注重细节；直觉型依赖无意识处理过程、关注事情的&quot;整体图景&quot;。"},{"t":"思维型（thinking, T）/情感型（feeling, F）：思维型运用理智和逻辑处理问题；情感型依赖个人的价值观和情绪。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">思维型</strong>（thinking, T）/情感型（feeling, F）：思维型运用理智和逻辑处理问题；情感型依赖个人的价值观和情绪。"},{"t":"判断型（judging, J）/感知型（perceiving, P）：判断型喜欢控制、偏爱充满秩序的结构化世界；感知型灵活变通、顺其自然。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">判断型</strong>（judging, J）/感知型（perceiving, P）：判断型喜欢控制、偏爱充满秩序的结构化世界；感知型灵活变通、顺其自然。"}],"k":"b","i":2,"h":"<strong class=\"lead\">四个维度</strong>："},{"t":"每组选择一型可组合出16种人格类型；典型类型：INTJ（幻想者：有创造性思想、内驱力强，怀疑、批判、独立、决断，常有些顽固）；ENFJ（天生的教育者和领导者：注重关系、动机、直觉和道德，和善的理想主义者）；ESTJ（组织者：现实、理性、果断、实事求是，商业和技术类工作的最佳人选）；ENTP（革新者：喜欢革新、特立独行、多才多艺，对独自创业感兴趣，足智多谋但疏于常规工作）；最常见的是ISFJ（有教养、有责任心）和ISTJ（注重职责和逻辑）；最不常见的是INFJ（富有洞察力、有保护欲）和ENTJ（冷静专注、行事果断）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">每组选择一型可组合出16种人格类型；典型类型</strong>：INTJ（幻想者：有创造性思想、内驱力强，怀疑、批判、独立、决断，常有些顽固）；ENFJ（天生的教育者和领导者：注重关系、动机、直觉和道德，和善的理想主义者）；ESTJ（组织者：现实、理性、果断、实事求是，商业和技术类工作的最佳人选）；ENTP（革新者：喜欢革新、特立独行、多才多艺，对独自创业感兴趣，足智多谋但疏于常规工作）；最常见的是ISFJ（有教养、有责任心）和ISTJ（注重职责和逻辑）；最不常见的是INFJ（富有洞察力、有保护欲）和ENTJ（冷静专注、行事果断）。"},{"t":"应用与争议：每年有250多万人测试，《财富》100强企业中89家在使用；但MBTI的测量有效性存在争议——按非此即彼的方式强制分类；人们多次测试往往得到不同结果；结果难以确切解释（需经训练的人解释，增加出错概率）；结果往往与工作绩效无关（艾瑞里讽刺：看星象图同样有效、花时间更少）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用与争议</strong>：每年有250多万人测试，《财富》100强企业中89家在使用；但MBTI的测量有效性存在争议——按非此即彼的方式强制分类；人们多次测试往往得到不同结果；结果难以确切解释（需经训练的人解释，增加出错概率）；结果往往与工作绩效无关（艾瑞里讽刺：看星象图同样有效、花时间更少）。"},{"t":"定位：MBTI能够提高自我意识、提供职业指导，可用于培训和开发；招聘选人时更应考虑使用大五人格模型。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定位</strong>：MBTI能够提高自我意识、提供职业指导，可用于培训和开发；招聘选人时更应考虑使用大五人格模型。"}],"k":"b","i":1,"h":"<strong class=\"lead\">5.2.1 迈尔斯-布里格斯类型指标</strong>（MBTI）"},{"t":"5.2.2 大五人格模型","c":[{"t":"大五模型（Big Five Model）：提出五个基本维度，它们是其他所有维度的基础，包含人格特质中最重要的变量；大量研究支持，特质随时间有变化但总体相对稳定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">大五模型</strong>（Big Five Model）：提出五个基本维度，它们是其他所有维度的基础，包含人格特质中最重要的变量；大量研究支持，特质随时间有变化但总体相对稳定。"},{"t":"五个维度：","c":[{"t":"责任心（conscientiousness）：对个人一致性和可靠性的测量；高者负责、有条不紊、值得信赖、持之以恒；低者容易精力分散、缺乏规划性、不可信赖。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">责任心</strong>（conscientiousness）：对个人一致性和可靠性的测量；高者负责、有条不紊、值得信赖、持之以恒；低者容易精力分散、缺乏规划性、不可信赖。"},{"t":"情绪稳定性（emotional stability）：刻画个体承受压力的能力；高者平和、自信、有安全感、更积极乐观、消极情绪体验少、更快乐；反义维度是神经质（neuroticism），高神经质者容易紧张、焦虑、失望、缺乏安全感。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">情绪稳定性</strong>（emotional stability）：刻画个体承受压力的能力；高者平和、自信、有安全感、更积极乐观、消极情绪体验少、更快乐；反义维度是神经质（neuroticism），高神经质者容易紧张、焦虑、失望、缺乏安全感。"},{"t":"外倾性（extraversion）：描述个体在社交世界建立关系的方式；外倾者喜欢群居、善于社交、自信果断，体验更多积极情绪且表达自由；内倾者封闭内向、胆小害羞、安静少语。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">外倾性</strong>（extraversion）：描述个体在社交世界建立关系的方式；外倾者喜欢群居、善于社交、自信果断，体验更多积极情绪且表达自由；内倾者封闭内向、胆小害羞、安静少语。"},{"t":"经验开放性（openness to experience）：针对个体对新奇事物的兴趣和热衷程度；高者富有创造性、凡事好奇、对艺术敏感；低者保守，只对熟悉的事物感到舒适和满足。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">经验开放性</strong>（openness to experience）：针对个体对新奇事物的兴趣和热衷程度；高者富有创造性、凡事好奇、对艺术敏感；低者保守，只对熟悉的事物感到舒适和满足。"},{"t":"随和性（agreeableness）：描述个体服从别人的倾向性；高者合作、热情、信赖他人（人们选择团队成员时的首选）；低者冷淡、敌对。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">随和性</strong>（agreeableness）：描述个体服从别人的倾向性；高者合作、热情、信赖他人（人们选择团队成员时的首选）；低者冷淡、敌对。"}],"k":"b","i":2,"h":"<strong class=\"lead\">五个维度</strong>："},{"t":"大五特质如何预测工作行为：","c":[{"t":"责任心：责任心相关的特质对许多工作的成功都重要，是工作绩效的最佳预测因素；责任心强者工作知识水平高（与GPA正相关）、面对虐待性监督也能保持绩效（印度研究）、更多组织公民行为、更少反生产工作行为和离职念头、能适应变化的任务需求、不安全行为少且事故率低；对收购型公司313名CEO候选人的研究发现，坚持不懈、注重细节、设置高标准（责任心的外在表现）对商业成功比其他因素更重要（图表5-1）；但责任心过强可能过于深思熟虑或追求完美，降低幸福感以及任务绩效、安全绩效和组织公民行为，可能过度专注工作而不帮助他人，通常缺乏创造性（尤其在艺术上）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">责任心</strong>：责任心相关的特质对许多工作的成功都重要，是工作绩效的最佳预测因素；责任心强者工作知识水平高（与GPA正相关）、面对虐待性监督也能保持绩效（印度研究）、更多组织公民行为、更少反生产工作行为和离职念头、能适应变化的任务需求、不安全行为少且事故率低；对收购型公司313名CEO候选人的研究发现，坚持不懈、注重细节、设置高标准（责任心的外在表现）对商业成功比其他因素更重要（图表5-1）；但责任心过强可能过于深思熟虑或追求完美，降低幸福感以及任务绩效、安全绩效和组织公民行为，可能过度专注工作而不帮助他人，通常缺乏创造性（尤其在艺术上）。"},{"t":"情绪稳定性：与生活满意度和工作满意度的相关度最高，能降低工作倦怠和离职意向；高者能适应意想不到的或不断变化的需求；神经质者可能经历倦怠、更多工作与家庭冲突、更多反生产工作行为、更少组织公民行为、难以被激励。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">情绪稳定性</strong>：与生活满意度和工作满意度的相关度最高，能降低工作倦怠和离职意向；高者能适应意想不到的或不断变化的需求；神经质者可能经历倦怠、更多工作与家庭冲突、更多反生产工作行为、更少组织公民行为、难以被激励。"},{"t":"外倾性：在需要人际互动的工作中表现更好；更具社交主导性、更能\"驾驭\"人；外倾性能够相对准确地预测谁将在团队中表现出领导力；工作满意度较高而倦怠较低；负面是可能自吹自擂、自私自利或过于霸道，对不需频繁人际互动的工作不利。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">外倾性</strong>：在需要人际互动的工作中表现更好；更具社交主导性、更能&quot;驾驭&quot;人；外倾性能够相对准确地预测谁将在团队中表现出领导力；工作满意度较高而倦怠较低；负面是可能自吹自擂、自私自利或过于霸道，对不需频繁人际互动的工作不利。"},{"t":"开放性：最具创造能力和创新能力；更可能成为有效的管理者，面对模棱两可的状况得心应手；更好面对组织变革、适应能力更强；开放性高者长期不容易出现业绩下滑，工作与家庭冲突较少。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">开放性</strong>：最具创造能力和创新能力；更可能成为有效的管理者，面对模棱两可的状况得心应手；更好面对组织变革、适应能力更强；开放性高者长期不容易出现业绩下滑，工作与家庭冲突较少。"},{"t":"随和性：更受喜爱，在人际导向的工作（如顾客服务）中表现出色；工作与家庭冲突较少、不易离职；通过组织公民行为贡献组织绩效；随和性低与责任心低者更可能做出反生产工作行为；但随和者事业上往往不特别成功（认为自己不适合市场、不愿包装形象）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">随和性</strong>：更受喜爱，在人际导向的工作（如顾客服务）中表现出色；工作与家庭冲突较少、不易离职；通过组织公民行为贡献组织绩效；随和性低与责任心低者更可能做出反生产工作行为；但随和者事业上往往不特别成功（认为自己不适合市场、不愿包装形象）。"}],"k":"b","i":2,"h":"<strong class=\"lead\">大五特质如何预测工作行为</strong>："},{"t":"大五影响组织行为标准的模型（图表5-2）：情绪稳定性（更少消极思想）→更高的工作及生活满意度、更低的压力水平；外倾性（更强社会主导性、人际技能、更多情绪表达）→更强的领导力、更高的组织绩效与满意度；开放性（更多学习、创造性、灵活性）→更好的培训成效、更强的领导力；随和性（更顺从守规则、更受欢迎）→更高的组织绩效、更低水平的偏差行为；责任心（更多努力坚持、有纪律、组织规划性）→更高的组织绩效、更强的领导力、更长寿。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">大五影响组织行为标准的模型</strong>（图表5-2）：情绪稳定性（更少消极思想）→更高的工作及生活满意度、更低的压力水平；外倾性（更强社会主导性、人际技能、更多情绪表达）→更强的领导力、更高的组织绩效与满意度；开放性（更多学习、创造性、灵活性）→更好的培训成效、更强的领导力；随和性（更顺从守规则、更受欢迎）→更高的组织绩效、更低水平的偏差行为；责任心（更多努力坚持、有纪律、组织规划性）→更高的组织绩效、更强的领导力、更长寿。"},{"t":"跨文化证据：几乎在所有跨文化研究中都发现了大五人格因素（中国、以色列、德国、日本、西班牙、尼日利亚、挪威、巴基斯坦和美国）；对玻利维亚文盲的研究提示该框架可能不太适用于偏远地区小型团体。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">跨文化证据</strong>：几乎在所有跨文化研究中都发现了大五人格因素（中国、以色列、德国、日本、西班牙、尼日利亚、挪威、巴基斯坦和美国）；对玻利维亚文盲的研究提示该框架可能不太适用于偏远地区小型团体。"}],"k":"b","i":1,"h":"5.2.2 大五人格模型"},{"t":"5.2.3 黑暗三特质","c":[{"t":"黑暗三特质（Dark Triad）：马基雅维利主义、自恋、精神病态三种不受欢迎的特质，每个人或多或少都有，且不总是同时发生；当人处于压力之下又不能缓解不恰当反应时表现较强，持续高水平可能导致个人事业及生活脱轨。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">黑暗三特质</strong>（Dark Triad）：马基雅维利主义、自恋、精神病态三种不受欢迎的特质，每个人或多或少都有，且不总是同时发生；当人处于压力之下又不能缓解不恰当反应时表现较强，持续高水平可能导致个人事业及生活脱轨。"},{"t":"马基雅维利主义（machiavellianism）：讲求实效、保持情感距离、为了目标不择手段（\"只要行得通就可以用\"）；高者更愿操纵别人、赢得更多利益、更难被说服且更多说服别人，更可能表现得激进并做出适得其反的行为；与总体工作绩效并不呈正相关；短期获得工作中的收益，但长期因不招人喜欢而失去利益；高马基雅维利主义求职者对承担高水平企业社会责任的组织不产生积极看法；其领导行为难以影响员工对工作的投入（追随者\"看清了\"这些行为不过是表层扮演）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">马基雅维利主义</strong>（machiavellianism）：讲求实效、保持情感距离、为了目标不择手段（&quot;只要行得通就可以用&quot;）；高者更愿操纵别人、赢得更多利益、更难被说服且更多说服别人，更可能表现得激进并做出适得其反的行为；与总体工作绩效并不呈正相关；短期获得工作中的收益，但长期因不招人喜欢而失去利益；高马基雅维利主义求职者对承担高水平企业社会责任的组织不产生积极看法；其领导行为难以影响员工对工作的投入（追随者&quot;看清了&quot;这些行为不过是表层扮演）。"},{"t":"自恋（narcissism）：认为自己极其重要、希望获得更多的称羡、自大；经常幻想获得巨大成功、有利用环境和他人的倾向、有权力意识、缺乏同情心；可能是敏感脆弱的人、更容易愤怒；与工作效率或组织公民行为没有什么联系；在个人主义文化中是反生产工作行为增加的最大预测因子之一（在不鼓励自我推销的集体主义文化中不成立）；通常认为自己的能力超出职位；收到绩效反馈时忽略与积极自我认知冲突的信息；提供奖励时会更努力；可能更有魅力、更可能被选为领导；中等水平自恋与领导有效性正相关；适应能力更强、复杂情况下商业决策更好；自恋CEO收购行为更多、溢价更严重；调查显示商学学生的自恋水平高于心理学专业学生。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自恋</strong>（narcissism）：认为自己极其重要、希望获得更多的称羡、自大；经常幻想获得巨大成功、有利用环境和他人的倾向、有权力意识、缺乏同情心；可能是敏感脆弱的人、更容易愤怒；与工作效率或组织公民行为没有什么联系；在个人主义文化中是反生产工作行为增加的最大预测因子之一（在不鼓励自我推销的集体主义文化中不成立）；通常认为自己的能力超出职位；收到绩效反馈时忽略与积极自我认知冲突的信息；提供奖励时会更努力；可能更有魅力、更可能被选为领导；中等水平自恋与领导有效性正相关；适应能力更强、复杂情况下商业决策更好；自恋CEO收购行为更多、溢价更严重；调查显示商学学生的自恋水平高于心理学专业学生。"},{"t":"精神病态（psychopathy）：在组织行为学语境中并非临床精神疾病，指缺乏对他人的关心、且在自己的行为对他人造成伤害时不会感到愧疚和懊悔；衡量维度包括是否遵守社会规范、冲动性、是否愿意利用欺骗达到目的、漠视（对他人缺乏移情关怀）；与工作绩效、反生产行为的关系文献结论不一致；与强硬策略（威胁、操纵）的使用和职场霸凌有关；狡猾可短期谋权，但长远无法依靠这些权力获得健康的结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">精神病态</strong>（psychopathy）：在组织行为学语境中并非临床精神疾病，指缺乏对他人的关心、且在自己的行为对他人造成伤害时不会感到愧疚和懊悔；衡量维度包括是否遵守社会规范、冲动性、是否愿意利用欺骗达到目的、漠视（对他人缺乏移情关怀）；与工作绩效、反生产行为的关系文献结论不一致；与强硬策略（威胁、操纵）的使用和职场霸凌有关；狡猾可短期谋权，但长远无法依靠这些权力获得健康的结果。"},{"t":"其他特质（建立在大五模型基础上的五个异常复合特质）：反社会型（对他人漠不关心、冷酷无情，利用外倾性吸引别人，易有暴力反生产工作行为和危险决策）；边缘型（自尊水平低而不确定性高，工作中互动不可预测，效率低下、满意度较低，低自尊可能临床导致抑郁症）；分裂型（古怪而无组织，易受工作压力影响，但可有创造力）；强迫型（完美主义者、可能固执，但注重细节、职业道德感强、可能被成就激励）；逃避型（感觉自己不能胜任工作、讨厌批评，只能在几乎不需要互动的环境中工作）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">其他特质</strong>（建立在大五模型基础上的五个异常复合特质）：反社会型（对他人漠不关心、冷酷无情，利用外倾性吸引别人，易有暴力反生产工作行为和危险决策）；边缘型（自尊水平低而不确定性高，工作中互动不可预测，效率低下、满意度较低，低自尊可能临床导致抑郁症）；分裂型（古怪而无组织，易受工作压力影响，但可有创造力）；强迫型（完美主义者、可能固执，但注重细节、职业道德感强、可能被成就激励）；逃避型（感觉自己不能胜任工作、讨厌批评，只能在几乎不需要互动的环境中工作）。"}],"k":"b","i":1,"h":"5.2.3 黑暗三特质"},{"t":"本章小结（并入）：人格不能解释所有行为，但为行为奠定了基础；大五人格模型是该领域的一大进步，黑暗三特质和其他特质同样重要；没有哪种人格特质组合在任何情境下都是完美无缺的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章小结</strong>（并入）：人格不能解释所有行为，但为行为奠定了基础；大五人格模型是该领域的一大进步，黑暗三特质和其他特质同样重要；没有哪种人格特质组合在任何情境下都是完美无缺的。"}],"k":"sec","i":0,"h":"5.2 人格框架"},{"t":"5.3 与组织行为相关的其他人格属性","c":[{"t":"5.3.1 核心自我评价","c":[{"t":"核心自我评价（core self-evaluation, CSE）：个人对自己的能力、胜任力以及作为人的价值的判断基准。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心自我评价</strong>（core self-evaluation, CSE）：个人对自己的能力、胜任力以及作为人的价值的判断基准。"},{"t":"积极（消极）CSE：拥有积极CSE的人喜欢自己、认为自己高效、能够控制周围的环境；拥有消极CSE的人则讨厌自己、质疑自己的能力、认为自己无法控制周围的环境。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">积极</strong>（消极）CSE：拥有积极CSE的人喜欢自己、认为自己高效、能够控制周围的环境；拥有消极CSE的人则讨厌自己、质疑自己的能力、认为自己无法控制周围的环境。"},{"t":"结果：积极CSE者在工作中看到更多机遇、获得更复杂的工作；目标更远大坚定、更坚持不懈；提供更好的顾客服务、更受同事欢迎、职业生涯发展更快；认为工作有意义且对他人有帮助时表现得尤其出色；在具有较高企业社会责任的组织中发展得好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：积极CSE者在工作中看到更多机遇、获得更复杂的工作；目标更远大坚定、更坚持不懈；提供更好的顾客服务、更受同事欢迎、职业生涯发展更快；认为工作有意义且对他人有帮助时表现得尤其出色；在具有较高企业社会责任的组织中发展得好。"}],"k":"b","i":1,"h":"5.3.1 核心自我评价"},{"t":"5.3.2 自我监控","c":[{"t":"自我监控（self-monitoring）：个体根据外部情境因素调整自己行为的能力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自我监控</strong>（self-monitoring）：个体根据外部情境因素调整自己行为的能力。"},{"t":"高低对比：高自我监控者适应性强、对环境线索十分敏感、能根据不同情境采取不同行为（公开的角色与私下的自己差别可以非常大）；低自我监控者（如佐伊\"我生活得很真实，从不会为了取悦他人而改变自己\"）不能伪装自己，倾向于在各种情境下表现出真实性情和态度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">高低对比</strong>：高自我监控者适应性强、对环境线索十分敏感、能根据不同情境采取不同行为（公开的角色与私下的自己差别可以非常大）；低自我监控者（如佐伊&quot;我生活得很真实，从不会为了取悦他人而改变自己&quot;）不能伪装自己，倾向于在各种情境下表现出真实性情和态度。"},{"t":"结果：高自我监控者更密切关注别人的行动、适应能力更强；对组织的承诺较少，但获得的绩效评估更高、更有可能成为领导者；高自我监控的管理者更懂灵活应变、获得更多晋升机会、更可能占据组织核心位置。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：高自我监控者更密切关注别人的行动、适应能力更强；对组织的承诺较少，但获得的绩效评估更高、更有可能成为领导者；高自我监控的管理者更懂灵活应变、获得更多晋升机会、更可能占据组织核心位置。"}],"k":"b","i":1,"h":"5.3.2 自我监控"},{"t":"5.3.3 主动性人格","c":[{"t":"主动性人格（proactive personality）：识别机会、主动采取行动并且坚持不懈直到出现有意义的变化的人格（区别于被动反应者）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">主动性人格</strong>（proactive personality）：识别机会、主动采取行动并且坚持不懈直到出现有意义的变化的人格（区别于被动反应者）。"},{"t":"结果：绩效水平更高、不需要太多监督；更容易对工作满意、投身组织、做出更多社交行为；事业上更成功；团队成员主动性人格的平均得分越高，团队创新水平越高（33家中国企业95个研发团队）；主动型的人更易与他人交换信息、建立信任。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果</strong>：绩效水平更高、不需要太多监督；更容易对工作满意、投身组织、做出更多社交行为；事业上更成功；团队成员主动性人格的平均得分越高，团队创新水平越高（33家中国企业95个研发团队）；主动型的人更易与他人交换信息、建立信任。"},{"t":"情境影响：如果团队领导不是主动型的，团队的主动性可能处于休眠状态甚至被压制；佛兰德地区231名失业员工的研究发现主动型的人更早放弃找工作（主动性本身可能包括遭遇失败时选择后退）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情境影响</strong>：如果团队领导不是主动型的，团队的主动性可能处于休眠状态甚至被压制；佛兰德地区231名失业员工的研究发现主动型的人更早放弃找工作（主动性本身可能包括遭遇失败时选择后退）。"}],"k":"b","i":1,"h":"5.3.3 主动性人格"},{"t":"补充（传言还是科学「见面几秒后可以准确判断一个人的性格」）：这句话似乎是真的——几秒钟的\"零接触\"判断基本准确（平均7.4秒自我介绍后的外倾性评价与自我评价高度一致；看照片也能判断特质）；外倾性最易被察觉；神经质最难准确判断，但情境激活紧张反应时可能更准确；\"直觉判断\"大致可靠、面试通常有效，但应保持开放心态、暂缓判断。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">补充</strong>（传言还是科学「见面几秒后可以准确判断一个人的性格」）：这句话似乎是真的——几秒钟的&quot;零接触&quot;判断基本准确（平均7.4秒自我介绍后的外倾性评价与自我评价高度一致；看照片也能判断特质）；外倾性最易被察觉；神经质最难准确判断，但情境激活紧张反应时可能更准确；&quot;直觉判断&quot;大致可靠、面试通常有效，但应保持开放心态、暂缓判断。"}],"k":"sec","i":0,"h":"5.3 与组织行为相关的其他人格属性"},{"t":"5.4 人格、求职和失业","c":[{"t":"求职行为的预测因素：责任心和外倾性可以预测失业者的社交强度、总体求职强度、面试回访以及工作机会（控制人口统计特征及失业时间后仍成立）；责任心和外倾性是求职行为最强的两项预测因素，自尊水平和自我效能感（核心自我评价的一部分）也十分重要。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">求职行为的预测因素</strong>：责任心和外倾性可以预测失业者的社交强度、总体求职强度、面试回访以及工作机会（控制人口统计特征及失业时间后仍成立）；责任心和外倾性是求职行为最强的两项预测因素，自尊水平和自我效能感（核心自我评价的一部分）也十分重要。"},{"t":"责任心的作用：4000名英国青少年的研究中，责任心较差者失业的可能性是责任心较强者的两倍；芬兰研究表明时间条理性（确保时间被有条理、有目的地利用）对失业者有效处理失业问题十分重要，责任心对时间条理性的影响力甚至超过家庭需求等环境因素。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">责任心的作用</strong>：4000名英国青少年的研究中，责任心较差者失业的可能性是责任心较强者的两倍；芬兰研究表明时间条理性（确保时间被有条理、有目的地利用）对失业者有效处理失业问题十分重要，责任心对时间条理性的影响力甚至超过家庭需求等环境因素。"},{"t":"积极情感的作用：积极情感帮助失业大学生获得面试与工作机会（对求职过程看法更清晰开放、对动机更多自我监控、减少拖延）；消极情感和敌意产生相反效果（芬兰15年追踪：失业人员因敌对情绪变得更有敌意、失业时间也更长）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">积极情感的作用</strong>：积极情感帮助失业大学生获得面试与工作机会（对求职过程看法更清晰开放、对动机更多自我监控、减少拖延）；消极情感和敌意产生相反效果（芬兰15年追踪：失业人员因敌对情绪变得更有敌意、失业时间也更长）。"},{"t":"人格能否改变：\"趋近\"特质（外倾性、责任心、积极情感）有积极作用，\"回避\"特质（消极情感、敌意、低自尊、低自我效能感）有负面影响；德国对近7000名失业成年人的抽样调查发现随和性、责任心及开放性出现显著变化的模式（失业后人格可能发生变化）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">人格能否改变</strong>：&quot;趋近&quot;特质（外倾性、责任心、积极情感）有积极作用，&quot;回避&quot;特质（消极情感、敌意、低自尊、低自我效能感）有负面影响；德国对近7000名失业成年人的抽样调查发现随和性、责任心及开放性出现显著变化的模式（失业后人格可能发生变化）。"}],"k":"sec","i":0,"h":"5.4 人格、求职和失业"},{"t":"5.5 人格与情境","c":[{"t":"前提：某些人格特质（如大五）在许多情境中有效（如责任心利于多数工作的绩效、外倾性与领导力相关），但特定特质对组织行为的影响可能取决于具体情境。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">前提</strong>：某些人格特质（如大五）在许多情境中有效（如责任心利于多数工作的绩效、外倾性与领导力相关），但特定特质对组织行为的影响可能取决于具体情境。"},{"t":"5.5.1 情境强度理论","c":[{"t":"情境强度理论（situation strength theory）：人格转化为行为的方式取决于情境的强度；情境强度指规范、提示或标准在多大程度上支配我们采取适当的行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情境强度理论</strong>（situation strength theory）：人格转化为行为的方式取决于情境的强度；情境强度指规范、提示或标准在多大程度上支配我们采取适当的行为。"},{"t":"强弱对比：较强的情境向我们展示什么是正确的行为，并阻止我们做出错误的行为；较弱的情境下\"怎样都行\"，可以更自由地表达自我；人格特质在较弱的情境中比在较强的情境中更能预测行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">强弱对比</strong>：较强的情境向我们展示什么是正确的行为，并阻止我们做出错误的行为；较弱的情境下&quot;怎样都行&quot;，可以更自由地表达自我；人格特质在较弱的情境中比在较强的情境中更能预测行为。"},{"t":"情境强度的四个方面：","c":[{"t":"明确性：工作任务和责任的提示可用且清楚的程度（门卫的任务比保姆的任务更明确）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">明确性</strong>：工作任务和责任的提示可用且清楚的程度（门卫的任务比保姆的任务更明确）。"},{"t":"一致性：关于工作任务和责任的提示互相兼容的程度（急诊护士的工作比经理的更有一致性）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">一致性</strong>：关于工作任务和责任的提示互相兼容的程度（急诊护士的工作比经理的更有一致性）。"},{"t":"约束性：个体的决策和行动自由受外力限制的程度（银行审单员的工作比护林员的更有约束性）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">约束性</strong>：个体的决策和行动自由受外力限制的程度（银行审单员的工作比护林员的更有约束性）。"},{"t":"严重性：决策或行为对组织及其成员、客户、供应商等产生重大影响的程度（外科医生的工作后果比外语教师更严重）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">严重性</strong>：决策或行为对组织及其成员、客户、供应商等产生重大影响的程度（外科医生的工作后果比外语教师更严重）。"}],"k":"b","i":2,"h":"<strong class=\"lead\">情境强度的四个方面</strong>："},{"t":"组织不必始终创造强情境：对规则的感知会影响人们对情境强度的反应（同一份详细操作说明，自主导向者视为能力被怀疑，守规者欣赏）；规则和严格控制可能令人乏味、失去动力；强情境可能压抑创造性、主动性和自主性；管理者需要找到恰当的平衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织不必始终创造强情境</strong>：对规则的感知会影响人们对情境强度的反应（同一份详细操作说明，自主导向者视为能力被怀疑，守规者欣赏）；规则和严格控制可能令人乏味、失去动力；强情境可能压抑创造性、主动性和自主性；管理者需要找到恰当的平衡。"}],"k":"b","i":1,"h":"5.5.1 情境强度理论"},{"t":"5.5.2 特质激活理论","c":[{"t":"特质激活理论（trait activation theory, TAT）：预测某些情境、事件或干预更能\"激活\"某种特质，可用于预测哪些工作适合哪些人（以佣金为基础的薪资方案激活外倾性差异；鼓励创造力的工作激活开放性差异）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">特质激活理论</strong>（trait activation theory, TAT）：预测某些情境、事件或干预更能&quot;激活&quot;某种特质，可用于预测哪些工作适合哪些人（以佣金为基础的薪资方案激活外倾性差异；鼓励创造力的工作激活开放性差异）。"},{"t":"应用示例（图表5-3）：航空管制员（激活责任心，神经质低者更好）、牧师（外倾性）、狱警（责任心）、编辑（随和性）、广告策划人（开放性）等；得分低的工作中相应特质无法预测行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用示例</strong>（图表5-3）：航空管制员（激活责任心，神经质低者更好）、牧师（外倾性）、狱警（责任心）、编辑（随和性）、广告策划人（开放性）等；得分低的工作中相应特质无法预测行为。"},{"t":"其他应用：上网学习受电子监控时，特别害怕失败的人学到的东西大大减少（环境特征激活特质）；互相支持的环境中人人都表现出亲社会行为，严酷的环境中只有亲社会倾向者才如此。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">其他应用</strong>：上网学习受电子监控时，特别害怕失败的人学到的东西大大减少（环境特征激活特质）；互相支持的环境中人人都表现出亲社会行为，严酷的环境中只有亲社会倾向者才如此。"},{"t":"结论：人格和情境相互影响、相互作用；在正确的情境下，人格对行为的预测能力更强。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：人格和情境相互影响、相互作用；在正确的情境下，人格对行为的预测能力更强。"}],"k":"b","i":1,"h":"5.5.2 特质激活理论"}],"k":"sec","i":0,"h":"5.5 人格与情境"},{"t":"5.6 价值观","c":[{"t":"价值观（value）：人们最基本的信念——从个人或社会的角度来看，某种具体行为模式或存在的最终状态比与之相反的行为模式或存在状态更可取；包含判断成分（正确与错误、好与坏、可取与不可取）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">价值观</strong>（value）：人们最基本的信念——从个人或社会的角度来看，某种具体行为模式或存在的最终状态比与之相反的行为模式或存在状态更可取；包含判断成分（正确与错误、好与坏、可取与不可取）。"},{"t":"两种属性：内容属性（某种行为模式或存在状态是重要的）和强度属性（它有多重要）；根据强度对价值观排序就得到价值系统（value system）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">两种属性</strong>：内容属性（某种行为模式或存在状态是重要的）和强度属性（它有多重要）；根据强度对价值观排序就得到价值系统（value system）。"},{"t":"特点：价值观相对稳定和持久；大部分在早年生活中从父母、老师、朋友处获得；对价值观的质疑常常强化而不是改变已有价值观；人格和价值观存在联系（开放的人政治上更倾向自由主义，责任心强的人更重视安全和道德行为）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">特点</strong>：价值观相对稳定和持久；大部分在早年生活中从父母、老师、朋友处获得；对价值观的质疑常常强化而不是改变已有价值观；人格和价值观存在联系（开放的人政治上更倾向自由主义，责任心强的人更重视安全和道德行为）。"},{"t":"5.6.1 价值观的重要性及分类：价值观是了解态度和动机的基础，也影响知觉；无论理清还是偏离判断，都影响工作中的态度和行为；有时增强决策能力，有时淡化客观性和理性（如认为按绩效分配合理的人遇到按资历分配的组织会失望、不满）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">5.6.1 价值观的重要性及分类</strong>：价值观是了解态度和动机的基础，也影响知觉；无论理清还是偏离判断，都影响工作中的态度和行为；有时增强决策能力，有时淡化客观性和理性（如认为按绩效分配合理的人遇到按资历分配的组织会失望、不满）。"},{"t":"5.6.2 终极价值观与工具价值观（罗克奇 Rokeach 的分类）：","c":[{"t":"终极价值观（terminal value）：个体愿意用一生去实现的目标（如经济繁荣富强、自由、健康和幸福、世界和平、人生的意义）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">终极价值观</strong>（terminal value）：个体愿意用一生去实现的目标（如经济繁荣富强、自由、健康和幸福、世界和平、人生的意义）。"},{"t":"工具价值观（instrumental value）：个体更偏好的行为模式或实现终极价值观的手段（如自主权和自力更生、自律、善良、目标取向）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工具价值观</strong>（instrumental value）：个体更偏好的行为模式或实现终极价值观的手段（如自主权和自力更生、自律、善良、目标取向）。"},{"t":"每个人都既重视目的（终极价值观）也重视手段（工具价值观），二者之间的平衡及其实现方式都很重要。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">每个人都既重视目的</strong>（终极价值观）也重视手段（工具价值观），二者之间的平衡及其实现方式都很重要。"}],"k":"b","i":1,"h":"<strong class=\"lead\">5.6.2 终极价值观与工具价值观</strong>（罗克奇 Rokeach 的分类）："},{"t":"5.6.3 代际价值观（图表5-4）：","c":[{"t":"婴儿潮一代（1965—1985年进入劳动力市场）：成功、成就、雄心、藐视权威、对职业忠诚。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">婴儿潮一代</strong>（1965—1985年进入劳动力市场）：成功、成就、雄心、藐视权威、对职业忠诚。"},{"t":"X世代（1985—2000年）：工作与生活的平衡、团队取向、不喜欢规则、对关系忠诚。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">X世代</strong>（1985—2000年）：工作与生活的平衡、团队取向、不喜欢规则、对关系忠诚。"},{"t":"千禧一代（2000年至今）：自信、经济上成功、自我依赖但热衷于团队工作、忠于自我、忠于人际关系。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">千禧一代</strong>（2000年至今）：自信、经济上成功、自我依赖但热衷于团队工作、忠于自我、忠于人际关系。"},{"t":"提醒：分类只是总体趋势而不是某个人的价值观；这些分类缺少可靠的研究支持，很多概括要么夸张要么完全错误；真实差异是从婴儿潮一代到千禧一代对休闲的重视程度加强、以工作为中心的倾向减弱，未发现千禧一代更重视利他价值观。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">提醒</strong>：分类只是总体趋势而不是某个人的价值观；这些分类缺少可靠的研究支持，很多概括要么夸张要么完全错误；真实差异是从婴儿潮一代到千禧一代对休闲的重视程度加强、以工作为中心的倾向减弱，未发现千禧一代更重视利他价值观。"}],"k":"b","i":1,"h":"<strong class=\"lead\">5.6.3 代际价值观</strong>（图表5-4）："},{"t":"补充（道德抉择「你的人格中存在作弊的倾向吗」）：与作弊倾向关联的特质包括高度自恋、缺乏良知、亲和度低、争强好胜；环境因素包括作弊难度低、压力过大、缺乏明确标准或标准未得到强化；意识到自己的易感性有助于避开道德盲点。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">补充</strong>（道德抉择「你的人格中存在作弊的倾向吗」）：与作弊倾向关联的特质包括高度自恋、缺乏良知、亲和度低、争强好胜；环境因素包括作弊难度低、压力过大、缺乏明确标准或标准未得到强化；意识到自己的易感性有助于避开道德盲点。"}],"k":"sec","i":0,"h":"5.6 价值观"},{"t":"5.7 人格、价值观与工作场所","c":[{"t":"关注点：30年前组织关注人格是为了个体与具体工作的匹配；如今范围扩大到人格、价值观与组织的匹配，但管理者首先关注的匹配类型依然是人与工作的匹配。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">关注点</strong>：30年前组织关注人格是为了个体与具体工作的匹配；如今范围扩大到人格、价值观与组织的匹配，但管理者首先关注的匹配类型依然是人与工作的匹配。"},{"t":"5.7.1 人与工作的匹配","c":[{"t":"霍兰德的人格-工作匹配理论（personality-job fit theory）：解释工作要求与人格特点之间的匹配性；职业偏好量表含160个项目；员工对工作的满意度和离职意向取决于个体的人格特点与职业环境的匹配程度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">霍兰德的人格-工作匹配理论</strong>（personality-job fit theory）：解释工作要求与人格特点之间的匹配性；职业偏好量表含160个项目；员工对工作的满意度和离职意向取决于个体的人格特点与职业环境的匹配程度。"},{"t":"六种人格类型（图表5-5）：","c":[{"t":"现实型：偏好需要技能、力量、协调性的体力活动；人格特点为害羞、真诚、持久、稳定、顺从、实际；职业范例如机械师、钻井操作工、装配线工人、农场主。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">现实型</strong>：偏好需要技能、力量、协调性的体力活动；人格特点为害羞、真诚、持久、稳定、顺从、实际；职业范例如机械师、钻井操作工、装配线工人、农场主。"},{"t":"研究型：偏好需要思考、组织和理解的活动；人格特点为善于分析、有创造性、好奇、独立；职业范例如生物学家、经济学家、数学家、新闻记者。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">研究型</strong>：偏好需要思考、组织和理解的活动；人格特点为善于分析、有创造性、好奇、独立；职业范例如生物学家、经济学家、数学家、新闻记者。"},{"t":"社会型：偏好能够帮助和提升他人的活动；人格特点为社会化、友好、合作、理解；职业范例如社会工作者、教师、议员、临床心理学家。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">社会型</strong>：偏好能够帮助和提升他人的活动；人格特点为社会化、友好、合作、理解；职业范例如社会工作者、教师、议员、临床心理学家。"},{"t":"传统型：偏好规范、有序、清楚明确的活动；人格特点为顺从、高效、实际、缺乏想象力、缺乏灵活性；职业范例如会计、业务经理、银行出纳员、档案管理员。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">传统型</strong>：偏好规范、有序、清楚明确的活动；人格特点为顺从、高效、实际、缺乏想象力、缺乏灵活性；职业范例如会计、业务经理、银行出纳员、档案管理员。"},{"t":"企业型：偏好能够影响他人和获得权力的言语活动；人格特点为自信、进取、精力充沛、盛气凌人；职业范例如律师、房地产经纪人、公共关系专家、小企业主。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">企业型</strong>：偏好能够影响他人和获得权力的言语活动；人格特点为自信、进取、精力充沛、盛气凌人；职业范例如律师、房地产经纪人、公共关系专家、小企业主。"},{"t":"艺术型：偏好需要创造性表达的、模糊的、无规则可循的活动；人格特点为富有想象力、无序杂乱、理想化、情绪化、不实际；职业范例如画家、音乐家、作家、室内装潢设计师。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">艺术型</strong>：偏好需要创造性表达的、模糊的、无规则可循的活动；人格特点为富有想象力、无序杂乱、理想化、情绪化、不实际；职业范例如画家、音乐家、作家、室内装潢设计师。"}],"k":"b","i":2,"h":"<strong class=\"lead\">六种人格类型</strong>（图表5-5）："},{"t":"文化影响：个人主义国家员工希望得到管理层的倾听和尊重、按个人需求定制工作以提高匹配和满意度；集体主义国家中匹配对工作满意度的影响较小，管理者不应违反文化规范为个人设计工作，而应寻找能在安排好的工作中成长的人。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化影响</strong>：个人主义国家员工希望得到管理层的倾听和尊重、按个人需求定制工作以提高匹配和满意度；集体主义国家中匹配对工作满意度的影响较小，管理者不应违反文化规范为个人设计工作，而应寻找能在安排好的工作中成长的人。"}],"k":"b","i":1,"h":"5.7.1 人与工作的匹配"},{"t":"5.7.2 人与组织的匹配","c":[{"t":"人-组织匹配（person-organization fit）：个体会受到与他们价值观相匹配的组织的吸引和遴选；人格特点与组织不匹配时，他们会离开工作岗位。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人-组织匹配</strong>（person-organization fit）：个体会受到与他们价值观相匹配的组织的吸引和遴选；人格特点与组织不匹配时，他们会离开工作岗位。"},{"t":"匹配预测：外倾者在积极进取和团队导向的文化中表现更好；随和性高的人在支持性氛围中表现更好；开放性高的个体在强调革新而非规范的组织中表现更好；匹配带来更高的员工满意度和更低的离职率；个人价值观与组织文化的匹配可预测工作满意度、组织忠诚度和任务绩效，并降低组织流动率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">匹配预测</strong>：外倾者在积极进取和团队导向的文化中表现更好；随和性高的人在支持性氛围中表现更好；开放性高的个体在强调革新而非规范的组织中表现更好；匹配带来更高的员工满意度和更低的离职率；个人价值观与组织文化的匹配可预测工作满意度、组织忠诚度和任务绩效，并降低组织流动率。"},{"t":"组织网络形象：求职者把查看公司网站作为申请工作前流程的一部分，网站的可用性与政策内容（如工作-生活平衡）影响感知的人-组织匹配和申请者数量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织网络形象</strong>：求职者把查看公司网站作为申请工作前流程的一部分，网站的可用性与政策内容（如工作-生活平衡）影响感知的人-组织匹配和申请者数量。"},{"t":"补充（道德困境「从人格到价值观再到招聘中的政治意识形态」）：人格测试在招聘中日益普遍（近2/3的人力资源专业人士采用），但把测试对象变成政治意识形态引发伦理争议；研究显示简历与当地政治意识形态匹配时几乎不会被拒，不匹配时被拒可能性远大于无政治倾向者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">补充</strong>（道德困境「从人格到价值观再到招聘中的政治意识形态」）：人格测试在招聘中日益普遍（近2/3的人力资源专业人士采用），但把测试对象变成政治意识形态引发伦理争议；研究显示简历与当地政治意识形态匹配时几乎不会被拒，不匹配时被拒可能性远大于无政治倾向者。"}],"k":"b","i":1,"h":"5.7.2 人与组织的匹配"},{"t":"5.7.3 其他维度的匹配","c":[{"t":"人与团队的匹配（团队互动动态影响工作成果）和人与主管的匹配（不匹配导致较低的工作满意度和绩效）；所有维度的匹配统称人与环境的匹配。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人与团队的匹配</strong>（团队互动动态影响工作成果）和人与主管的匹配（不匹配导致较低的工作满意度和绩效）；所有维度的匹配统称人与环境的匹配。"},{"t":"文化差异：对东亚、欧洲、北美人与环境匹配的元分析表明，人-组织与人-工作匹配在北美对积极工作态度和绩效的影响最大，在欧洲较小，在东亚最不重要。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化差异</strong>：对东亚、欧洲、北美人与环境匹配的元分析表明，人-组织与人-工作匹配在北美对积极工作态度和绩效的影响最大，在欧洲较小，在东亚最不重要。"}],"k":"b","i":1,"h":"5.7.3 其他维度的匹配"}],"k":"sec","i":0,"h":"5.7 人格、价值观与工作场所"},{"t":"5.8 文化价值观","c":[{"t":"前提：人格在很大程度上由基因决定，价值观通过学习得来、世代相传、因文化而异。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">前提</strong>：人格在很大程度上由基因决定，价值观通过学习得来、世代相传、因文化而异。"},{"t":"5.8.1 霍夫斯泰德的框架","c":[{"t":"背景：吉尔特·霍夫斯泰德20世纪70年代末针对40个国家11.6万名IBM员工调查与工作有关的价值观，发现管理者和员工在民族文化的五个维度上存在差异。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：吉尔特·霍夫斯泰德20世纪70年代末针对40个国家11.6万名IBM员工调查与工作有关的价值观，发现管理者和员工在民族文化的五个维度上存在差异。"},{"t":"权力距离（power distance）：一个国家的人对机构和组织内权力分配不平等这一事实的接纳和认可程度；高权力距离意味着权力和财富极度不平等且文化容忍度高、存在等级制度并阻碍下层向上流动；低权力距离意味着强调平等和机会。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">权力距离</strong>（power distance）：一个国家的人对机构和组织内权力分配不平等这一事实的接纳和认可程度；高权力距离意味着权力和财富极度不平等且文化容忍度高、存在等级制度并阻碍下层向上流动；低权力距离意味着强调平等和机会。"},{"t":"个人主义（individualism）与集体主义（collectivism）：个人主义指人们喜欢以个人而不是群体成员为单位进行活动、认为个人权利高于一切；集体主义指人们生活在具有严谨架构的社会中，期望得到同一群体中其他人的照顾与保护。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个人主义</strong>（individualism）与集体主义（collectivism）：个人主义指人们喜欢以个人而不是群体成员为单位进行活动、认为个人权利高于一切；集体主义指人们生活在具有严谨架构的社会中，期望得到同一群体中其他人的照顾与保护。"},{"t":"男性化（masculinity）与女性化（femininity）：民族文化重视传统男性角色（成就、权力、控制）的程度；男性化得分高意味着对男性和女性的角色有不同界定、男性占据社会主导地位；女性化得分高意味着对男性和女性的角色持大致相同的看法、认为两性平等。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">男性化</strong>（masculinity）与女性化（femininity）：民族文化重视传统男性角色（成就、权力、控制）的程度；男性化得分高意味着对男性和女性的角色有不同界定、男性占据社会主导地位；女性化得分高意味着对男性和女性的角色持大致相同的看法、认为两性平等。"},{"t":"不确定性规避（uncertainty avoidance）：一个国家的人喜欢结构化而不是非结构化情境的程度；得分高的国家对不确定性和模糊性的焦虑感更强、重视法律法规和控制；得分低的国家包容各种意见、不太以规则为导向、更容易采取冒险行动并接受变革。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不确定性规避</strong>（uncertainty avoidance）：一个国家的人喜欢结构化而不是非结构化情境的程度；得分高的国家对不确定性和模糊性的焦虑感更强、重视法律法规和控制；得分低的国家包容各种意见、不太以规则为导向、更容易采取冒险行动并接受变革。"},{"t":"长期取向（long-term orientation）与短期取向（short-term orientation）：测量社会对传统价值观的接纳；长期取向的人总是想到未来、看重节俭、持久与传统；短期取向的人看重当下、更容易接受变革、不把承诺视作变革的阻碍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">长期取向</strong>（long-term orientation）与短期取向（short-term orientation）：测量社会对传统价值观的接纳；长期取向的人总是想到未来、看重节俭、持久与传统；短期取向的人看重当下、更容易接受变革、不把承诺视作变革的阻碍。"},{"t":"各国/地区得分示例：马来西亚权力距离最高；美国是个人主义程度最高的国家（澳大利亚和英国紧随其后）；危地马拉集体主义程度最高；日本男性化排名最靠前、瑞典女性化最靠前；希腊不确定性规避得分最高、新加坡最低；中国长期取向得分最高、巴基斯坦短期取向得分最高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">各国/地区得分示例</strong>：马来西亚权力距离最高；美国是个人主义程度最高的国家（澳大利亚和英国紧随其后）；危地马拉集体主义程度最高；日本男性化排名最靠前、瑞典女性化最靠前；希腊不确定性规避得分最高、新加坡最低；中国长期取向得分最高、巴基斯坦短期取向得分最高。"},{"t":"应用提醒：综合598份调查、20多万受访者的研究发现五个文化维度在预测相关结果方面有效，但用个体得分进行预测的效果远好于给一个国家所有人赋予同样文化价值观的整体分析；不应假设一个国家的人有同样的价值观。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用提醒</strong>：综合598份调查、20多万受访者的研究发现五个文化维度在预测相关结果方面有效，但用个体得分进行预测的效果远好于给一个国家所有人赋予同样文化价值观的整体分析；不应假设一个国家的人有同样的价值观。"}],"k":"b","i":1,"h":"5.8.1 霍夫斯泰德的框架"},{"t":"5.8.2 GLOBE 框架","c":[{"t":"GLOBE（\"全球领导与组织行为有效性\"，1993年起）：持续进行有关领导与民族文化的跨文化调查，数据来自62个国家的825个组织，确认了民族文化的九个维度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">GLOBE</strong>（&quot;全球领导与组织行为有效性&quot;，1993年起）：持续进行有关领导与民族文化的跨文化调查，数据来自62个国家的825个组织，确认了民族文化的九个维度。"},{"t":"与霍夫斯泰德相似的维度：权力距离、个人主义/集体主义、不确定性规避、性别差异（类似男性化对女性化）、未来取向（类似长期取向对短期取向）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与霍夫斯泰德相似的维度</strong>：权力距离、个人主义/集体主义、不确定性规避、性别差异（类似男性化对女性化）、未来取向（类似长期取向对短期取向）。"},{"t":"新增维度：人本取向（一个社会对公正、利他、慷慨、关怀、对他人友善的个体给予鼓励和奖赏的程度）、绩效取向（一个社会对群体成员的绩效提高或绩效优异给予鼓励和奖赏的程度）等。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新增维度</strong>：人本取向（一个社会对公正、利他、慷慨、关怀、对他人友善的个体给予鼓励和奖赏的程度）、绩效取向（一个社会对群体成员的绩效提高或绩效优异给予鼓励和奖赏的程度）等。"}],"k":"b","i":1,"h":"5.8.2 GLOBE 框架"},{"t":"5.8.3 两个框架的比较：很难说哪个更好，各有支持者；本书更强调霍夫斯泰德的维度（经受住了时间的考验，GLOBE也证实了其中的一些维度）；针对组织承诺的元分析表明两框架在个人主义/集体主义维度上类似（个人主义文化国家的组织承诺水平往往较低）；两种框架有很多共同之处且都有价值。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">5.8.3 两个框架的比较</strong>：很难说哪个更好，各有支持者；本书更强调霍夫斯泰德的维度（经受住了时间的考验，GLOBE也证实了其中的一些维度）；针对组织承诺的元分析表明两框架在个人主义/集体主义维度上类似（个人主义文化国家的组织承诺水平往往较低）；两种框架有很多共同之处且都有价值。"},{"t":"本章小结与对管理者的启示：招聘时是否选择有责任心及其他大五特质的求职者，取决于组织最重视的标准（核心自我评价和自恋在某些情境下也有关联）；MBTI虽有缺点，但可用于员工培训和开发，帮助员工相互了解、开放交流并可能减少冲突；评估工作、工作团体和组织，确定哪种人格最合适；评估人格特质时要考虑情境因素，情境强度越低越能准确评估员工的人格特征；对员工的不同文化考虑越多，越能确定其工作行为并创造积极的、表现良好的组织氛围。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章小结与对管理者的启示</strong>：招聘时是否选择有责任心及其他大五特质的求职者，取决于组织最重视的标准（核心自我评价和自恋在某些情境下也有关联）；MBTI虽有缺点，但可用于员工培训和开发，帮助员工相互了解、开放交流并可能减少冲突；评估工作、工作团体和组织，确定哪种人格最合适；评估人格特质时要考虑情境因素，情境强度越低越能准确评估员工的人格特征；对员工的不同文化考虑越多，越能确定其工作行为并创造积极的、表现良好的组织氛围。"}],"k":"sec","i":0,"h":"5.8 文化价值观"}],"k":"chap","h":"第5章 人格与价值观"},{"t":"第6章 知觉与个体决策","c":[{"t":"学习目标","c":[{"t":"解释影响知觉的因素。","c":[],"k":"b","i":1,"h":"解释影响知觉的因素。"},{"t":"描述归因理论。","c":[],"k":"b","i":1,"h":"描述归因理论。"},{"t":"解释知觉和决策之间的联系。","c":[],"k":"b","i":1,"h":"解释知觉和决策之间的联系。"},{"t":"比较理性决策模型与有限理性模型、直觉模型的不同。","c":[],"k":"b","i":1,"h":"比较理性决策模型与有限理性模型、直觉模型的不同。"},{"t":"解释个体差异和组织限制是如何影响决策的。","c":[],"k":"b","i":1,"h":"解释个体差异和组织限制是如何影响决策的。"},{"t":"比较道德决策中的三种标准。","c":[],"k":"b","i":1,"h":"比较道德决策中的三种标准。"},{"t":"描述创造力三阶段模型。","c":[],"k":"b","i":1,"h":"描述创造力三阶段模型。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"6.1 什么是知觉","c":[{"t":"知觉（perception）：个体为了给自己所处的环境赋予意义而组织和解释其感知印象的过程；人所感知的东西可能与客观现实差距很大。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">知觉</strong>（perception）：个体为了给自己所处的环境赋予意义而组织和解释其感知印象的过程；人所感知的东西可能与客观现实差距很大。"},{"t":"核心结论：人们的行为以对现实的感知为基础，而不是以现实本身为基础；我们的知觉才是行为所依据的\"现实\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">核心结论</strong>：人们的行为以对现实的感知为基础，而不是以现实本身为基础；我们的知觉才是行为所依据的&quot;现实&quot;。"},{"t":"影响知觉的因素可归纳为知觉者、知觉对象（目标）、知觉情境三个方面（图表6-1）：","c":[{"t":"知觉者：态度、动机、兴趣、经验、期望等个人特征左右解释——我们听到的常是我们想听到的、看到的是我们想看到的；研究表明主管会把早开工的员工判为更尽责，而自身是\"夜猫子\"的主管则少有这种偏差。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">知觉者</strong>：态度、动机、兴趣、经验、期望等个人特征左右解释——我们听到的常是我们想听到的、看到的是我们想看到的；研究表明主管会把早开工的员工判为更尽责，而自身是&quot;夜猫子&quot;的主管则少有这种偏差。"},{"t":"知觉目标：目标物特征（运动、新奇、声音、背景、大小、邻近、类似）及目标与背景的关系影响知觉；我们倾向于把联系密切和相似的事物组合看待，由此产生的群体假设可能有害。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">知觉目标</strong>：目标物特征（运动、新奇、声音、背景、大小、邻近、类似）及目标与背景的关系影响知觉；我们倾向于把联系密切和相似的事物组合看待，由此产生的群体假设可能有害。"},{"t":"知觉情境：时间、工作环境、社会环境（地点、光线、温度等）都会改变知觉——同一盛装者在周六晚会与周一上午课堂上引起的注意完全不同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">知觉情境</strong>：时间、工作环境、社会环境（地点、光线、温度等）都会改变知觉——同一盛装者在周六晚会与周一上午课堂上引起的注意完全不同。"}],"k":"b","i":1,"h":"影响知觉的因素可归纳为知觉者、知觉对象（目标）、知觉情境三个方面（图表6-1）："},{"t":"启示：人们通常意识不到影响自己知觉的因素；增强意识、采取客观手段可以减少知觉扭曲（如意识到种族偏见的人更善于控制偏见）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">启示</strong>：人们通常意识不到影响自己知觉的因素；增强意识、采取客观手段可以减少知觉扭曲（如意识到种族偏见的人更善于控制偏见）。"}],"k":"sec","i":0,"h":"6.1 什么是知觉"},{"t":"6.2 人际知觉：对他人做出判断","c":[{"t":"人际知觉（人们对彼此形成的知觉）是与组织行为关系最密切的知觉概念之一；我们对他人最强烈的印象源于对其道德的感知，而初始信息常常粗略且无据。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">人际知觉</strong>（人们对彼此形成的知觉）是与组织行为关系最密切的知觉概念之一；我们对他人最强烈的印象源于对其道德的感知，而初始信息常常粗略且无据。"},{"t":"归因理论（attribution theory）：试图解释我们对个体的不同判断取决于把特定行为归因于何种原因的理论。","c":[{"t":"内因导致的行为：个体认为在自己控制范围内的行为（如员工因聚会到凌晨睡过头而迟到）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">内因导致的行为</strong>：个体认为在自己控制范围内的行为（如员工因聚会到凌晨睡过头而迟到）。"},{"t":"外因导致的行为：个体因情境因素被迫采取的行为（如因交通堵塞而迟到）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">外因导致的行为</strong>：个体因情境因素被迫采取的行为（如因交通堵塞而迟到）。"},{"t":"判断内因还是外因取决于三个因素（图表6-2）：","c":[{"t":"区别性（distinctiveness）：个体在不同情境下是否表现出不同行为；区别性高→外部归因，区别性低→内部归因。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">区别性</strong>（distinctiveness）：个体在不同情境下是否表现出不同行为；区别性高→外部归因，区别性低→内部归因。"},{"t":"一致性（consensus）：每个人面对相似情境是否都有相同反应；一致性高→外部归因，一致性低→内部归因。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">一致性</strong>（consensus）：每个人面对相似情境是否都有相同反应；一致性高→外部归因，一致性低→内部归因。"},{"t":"一贯性（consistency）：不论时间变化此人是否都表现出相同行为；一贯性高→内部归因，一贯性低→外部归因。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">一贯性</strong>（consistency）：不论时间变化此人是否都表现出相同行为；一贯性高→内部归因，一贯性低→外部归因。"}],"k":"b","i":2,"h":"<strong class=\"lead\">判断内因还是外因取决于三个因素</strong>（图表6-2）："},{"t":"组合示例：员工凯特琳完成当前工作的水平与其他类似工作相同（低区别性）、其他员工水平总与她不同（低一致性）、绩效长期稳定（高一贯性）→ 判断她要为主要责任负责（内部归因）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组合示例</strong>：员工凯特琳完成当前工作的水平与其他类似工作相同（低区别性）、其他员工水平总与她不同（低一致性）、绩效长期稳定（高一贯性）→ 判断她要为主要责任负责（内部归因）。"},{"t":"归因失真的两种常见错误：","c":[{"t":"基本归因错误（fundamental attribution error）：评价他人行为时低估外部因素、高估内部或个人因素——如把销售不佳归咎于下属懒惰而非竞争对手产品创新。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">基本归因错误</strong>（fundamental attribution error）：评价他人行为时低估外部因素、高估内部或个人因素——如把销售不佳归咎于下属懒惰而非竞争对手产品创新。"},{"t":"自我服务偏见（self-serving bias）：把成功归因于内部因素（能力、努力），把失败归因于外部因素（运气、同事）；乐于接受积极反馈、抗拒消极反馈。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">自我服务偏见</strong>（self-serving bias）：把成功归因于内部因素（能力、努力），把失败归因于外部因素（运气、同事）；乐于接受积极反馈、抗拒消极反馈。"}],"k":"b","i":2,"h":"<strong class=\"lead\">归因失真的两种常见错误</strong>："},{"t":"文化差异：亚洲管理者出错时更倾向指责机构或整个组织，西方管理者更多归责于个人（群体归因倾向解释了亚洲人更易产生群体刻板印象）；自我服务偏见在东亚文化中较不常见但依然存在；中国管理者判断责任使用的区别性、一致性、一贯性线索与西方相同，只是需要更多证据才归责于个人。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化差异</strong>：亚洲管理者出错时更倾向指责机构或整个组织，西方管理者更多归责于个人（群体归因倾向解释了亚洲人更易产生群体刻板印象）；自我服务偏见在东亚文化中较不常见但依然存在；中国管理者判断责任使用的区别性、一致性、一贯性线索与西方相同，只是需要更多证据才归责于个人。"}],"k":"b","i":1,"h":"<strong class=\"lead\">归因理论</strong>（attribution theory）：试图解释我们对个体的不同判断取决于把特定行为归因于何种原因的理论。"},{"t":"判断他人时常走的捷径（能快速提供有价值的预测，但会造成严重曲解）：","c":[{"t":"选择性知觉（selective perception）：依据自身兴趣、背景、经验和态度有选择地关注信息；只看到自己想看到的东西，可能从模棱两可的情境中得出没有根据的结论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">选择性知觉</strong>（selective perception）：依据自身兴趣、背景、经验和态度有选择地关注信息；只看到自己想看到的东西，可能从模棱两可的情境中得出没有根据的结论。"},{"t":"晕轮效应（halo effect）：以个体某一特征（如智力、社交能力、外貌）为基础形成对一个人的正面整体印象。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">晕轮效应</strong>（halo effect）：以个体某一特征（如智力、社交能力、外貌）为基础形成对一个人的正面整体印象。"},{"t":"号角效应（horn effect）：从某一特征得出对一个人的负面整体印象；管理者应谨慎，不要基于小线索轻易做出推断。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">号角效应</strong>（horn effect）：从某一特征得出对一个人的负面整体印象；管理者应谨慎，不要基于小线索轻易做出推断。"},{"t":"对比效应（contrast effect）：对一个人的评价受最近接触的其他人影响（\"不要跟在孩子和动物后面演出\"）；中国酒店业研究显示新变革型领导的效果取决于前任是否也是变革型领导。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对比效应</strong>（contrast effect）：对一个人的评价受最近接触的其他人影响（&quot;不要跟在孩子和动物后面演出&quot;）；中国酒店业研究显示新变革型领导的效果取决于前任是否也是变革型领导。"},{"t":"刻板印象（stereotyping）：基于对某人所在群体的知觉而去判断某人；概括准确时能迅速决策，不准确或过度概括时会造成伤害——如谋杀案审判中\"黑人典型性\"使死刑判决概率加倍、学生给白人更高的领导潜力评分。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">刻板印象</strong>（stereotyping）：基于对某人所在群体的知觉而去判断某人；概括准确时能迅速决策，不准确或过度概括时会造成伤害——如谋杀案审判中&quot;黑人典型性&quot;使死刑判决概率加倍、学生给白人更高的领导潜力评分。"}],"k":"b","i":1,"h":"<strong class=\"lead\">判断他人时常走的捷径</strong>（能快速提供有价值的预测，但会造成严重曲解）："},{"t":"传言还是科学：刻板印象都是负面的吗？——错误；正面刻板印象同样普遍，且并非总带来积极影响：会使受影响者\"紧张失常\"（如被灌输\"男性数学更好\"后男生成绩下降）、抹杀个性、反而强化族群差异与负面刻板印象。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">传言还是科学</strong>：刻板印象都是负面的吗？——错误；正面刻板印象同样普遍，且并非总带来积极影响：会使受影响者&quot;紧张失常&quot;（如被灌输&quot;男性数学更好&quot;后男生成绩下降）、抹杀个性、反而强化族群差异与负面刻板印象。"},{"t":"捷径在组织中的具体应用：","c":[{"t":"招聘面试：面试官常做出不正确的知觉判断——0.1秒即形成印象，面试开始四五分钟后决策几乎不再变化，早期信息权重远大于晚期信息；个人直觉预测工作绩效不可靠，应从多个独立评估者处收集信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">招聘面试</strong>：面试官常做出不正确的知觉判断——0.1秒即形成印象，面试开始四五分钟后决策几乎不再变化，早期信息权重远大于晚期信息；个人直觉预测工作绩效不可靠，应从多个独立评估者处收集信息。"},{"t":"绩效期望：自我实现预言（self-fulfilling prophecy，又称皮格马利翁效应 Pygmalion effect）指他人的期望决定了个体的行为——管理者期望高，下属更可能表现出色；期望低则员工趋向于低水平表现。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">绩效期望</strong>：自我实现预言（self-fulfilling prophecy，又称皮格马利翁效应 Pygmalion effect）指他人的期望决定了个体的行为——管理者期望高，下属更可能表现出色；期望低则员工趋向于低水平表现。"},{"t":"绩效评估：员工绩效评估（关系晋升、加薪、续聘）在很大程度上依赖知觉过程；主观评价易受选择性知觉、对比效应、晕轮效应等影响，评估结果有时反映的是评估者而非员工的表现。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">绩效评估</strong>：员工绩效评估（关系晋升、加薪、续聘）在很大程度上依赖知觉过程；主观评价易受选择性知觉、对比效应、晕轮效应等影响，评估结果有时反映的是评估者而非员工的表现。"}],"k":"b","i":1,"h":"<strong class=\"lead\">捷径在组织中的具体应用</strong>："},{"t":"本章小结要点：知觉几乎是瞬间产生而未经深思熟虑，理解知觉过程是提高组织决策有效性的第一步。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章小结要点</strong>：知觉几乎是瞬间产生而未经深思熟虑，理解知觉过程是提高组织决策有效性的第一步。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">6.2 人际知觉</strong>：对他人做出判断"},{"t":"6.3 知觉与个体决策之间的联系","c":[{"t":"决策（decision）：在两个或多个备选方案中进行选择；决策是对问题（problem）的回应——当前状态与期望状态之间存在差距。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">决策</strong>（decision）：在两个或多个备选方案中进行选择；决策是对问题（problem）的回应——当前状态与期望状态之间存在差距。"},{"t":"\"存在问题\"与\"需要决策\"的认定本身就是知觉问题：同样2%的销售额下降，一名管理者视为需立即行动的严重问题，另一名管理者视为可接受状态。","c":[],"k":"b","i":1,"h":"&quot;存在问题&quot;与&quot;需要决策&quot;的认定本身就是知觉问题：同样2%的销售额下降，一名管理者视为需立即行动的严重问题，另一名管理者视为可接受状态。"},{"t":"决策各环节都受知觉影响：哪些资料与决策相关需靠知觉过滤与解释；备选方案的开发与优劣评估受决策者知觉影响；对情境的知觉甚至影响我们能否拒绝他人（拒绝的不适感之强，可能使人答应做不道德的事）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">决策各环节都受知觉影响</strong>：哪些资料与决策相关需靠知觉过滤与解释；备选方案的开发与优劣评估受决策者知觉影响；对情境的知觉甚至影响我们能否拒绝他人（拒绝的不适感之强，可能使人答应做不道德的事）。"}],"k":"sec","i":0,"h":"6.3 知觉与个体决策之间的联系"},{"t":"6.4 在组织中进行决策","c":[{"t":"理性决策模型（rational decision-making model）：假设最优决策者是理性的——在具体限定条件下做出稳定的、价值最大化的选择，遵循六个步骤（图表6-3）：","c":[{"t":"界定问题所在。","c":[],"k":"b","i":2,"h":"界定问题所在。"},{"t":"确定决策标准。","c":[],"k":"b","i":2,"h":"确定决策标准。"},{"t":"为标准分配权重。","c":[],"k":"b","i":2,"h":"为标准分配权重。"},{"t":"开发备选方案。","c":[],"k":"b","i":2,"h":"开发备选方案。"},{"t":"评估备选方案。","c":[],"k":"b","i":2,"h":"评估备选方案。"},{"t":"选择最佳方案。","c":[],"k":"b","i":2,"h":"选择最佳方案。"},{"t":"局限：现实决策很少遵循该模型——人们常满足于可接受或合理的方案而非最优方案，把选择局限于问题症状和当前可选方案，且意识不到自己做出的是次优决策。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">局限</strong>：现实决策很少遵循该模型——人们常满足于可接受或合理的方案而非最优方案，把选择局限于问题症状和当前可选方案，且意识不到自己做出的是次优决策。"}],"k":"b","i":1,"h":"<strong class=\"lead\">理性决策模型</strong>（rational decision-making model）：假设最优决策者是理性的——在具体限定条件下做出稳定的、价值最大化的选择，遵循六个步骤（图表6-3）："},{"t":"有限理性模型：","c":[{"t":"有限理性（bounded rationality）：信息加工能力的有限性使我们无法吸收最优决策所需的全部信息，只能在建构的简化模型范围内活动——从问题中抽取重要特点而非全部复杂性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有限理性</strong>（bounded rationality）：信息加工能力的有限性使我们无法吸收最优决策所需的全部信息，只能在建构的简化模型范围内活动——从问题中抽取重要特点而非全部复杂性。"},{"t":"决策过程：确定问题后寻求标准和备选方案，以熟悉的方式考察，直到找到第一个\"足够好\"（达到可接受水平）的方案即停止；最终决策是\"符合要求的选择\"而非最恰当的选择。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">决策过程</strong>：确定问题后寻求标准和备选方案，以熟悉的方式考察，直到找到第一个&quot;足够好&quot;（达到可接受水平）的方案即停止；最终决策是&quot;符合要求的选择&quot;而非最恰当的选择。"},{"t":"评价：满意化并不总是糟糕的——简单程序节省时间、精力和金钱，有时比理性模型更合理；但在道德决策中会带来可预见的系统错误，可通过多角度确认缓解（提出多个问题、利用多种来源、考虑信息来源、留出更多决策时间）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">评价</strong>：满意化并不总是糟糕的——简单程序节省时间、精力和金钱，有时比理性模型更合理；但在道德决策中会带来可预见的系统错误，可通过多角度确认缓解（提出多个问题、利用多种来源、考虑信息来源、留出更多决策时间）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">有限理性模型</strong>："},{"t":"直觉模型：","c":[{"t":"直觉决策（intuitive decision making）：从经验中提取精华的无意识过程；依赖信息片段间的整体联系，速度快，受情感控制。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">直觉决策</strong>（intuitive decision making）：从经验中提取精华的无意识过程；依赖信息片段间的整体联系，速度快，受情感控制。"},{"t":"结论：直觉不一定错误，与理性分析相辅相成；基于专业知识的直觉更有效更准确，但专家忠告是\"用直觉做假设非常有用，但它无法作为证据\"——须用客观数据和理性分析检验。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：直觉不一定错误，与理性分析相辅相成；基于专业知识的直觉更有效更准确，但专家忠告是&quot;用直觉做假设非常有用，但它无法作为证据&quot;——须用客观数据和理性分析检验。"}],"k":"b","i":1,"h":"<strong class=\"lead\">直觉模型</strong>："},{"t":"常见的偏见和错误（决策者依赖经验、冲动和\"经验规则\"等捷径，会歪曲理性）：","c":[{"t":"过度自信偏见：对自己的能力和判断过于自信且通常不自知——自认90%准确时实际常只有50%；智力和人际能力最弱的人最可能高估自己；企业家的乐观与项目绩效负相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">过度自信偏见</strong>：对自己的能力和判断过于自信且通常不自知——自认90%准确时实际常只有50%；智力和人际能力最弱的人最可能高估自己；企业家的乐观与项目绩效负相关。"},{"t":"锚定偏见（anchoring bias）：把信息固定在初始阶段，此后难以全面判断；谈判中锚设定得越精确、调整幅度越小（报55650美元比55000美元把对方锚定在更窄区间）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">锚定偏见</strong>（anchoring bias）：把信息固定在初始阶段，此后难以全面判断；谈判中锚设定得越精确、调整幅度越小（报55650美元比55000美元把对方锚定在更窄区间）。"},{"t":"验证偏见（confirmation bias）：选择性知觉在信息收集上的体现——寻找并接受证实自己选择的信息，忽视或怀疑相冲突的信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">验证偏见</strong>（confirmation bias）：选择性知觉在信息收集上的体现——寻找并接受证实自己选择的信息，忽视或怀疑相冲突的信息。"},{"t":"易获性偏见（availability bias）：以容易获得、生动、最近发生的信息为基础判断——高估空难等小概率事件；也解释年度评估更看重员工最近业绩。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">易获性偏见</strong>（availability bias）：以容易获得、生动、最近发生的信息为基础判断——高估空难等小概率事件；也解释年度评估更看重员工最近业绩。"},{"t":"承诺升级（escalation of commitment）：尽管有明显证据表明决策错误仍固守该决策；最可能发生在个体认为自己要对结果负责时，决策权共享会加重升级；应经常评估已花成本与未来预期付出是否值得。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">承诺升级</strong>（escalation of commitment）：尽管有明显证据表明决策错误仍固守该决策；最可能发生在个体认为自己要对结果负责时，决策权共享会加重升级；应经常评估已花成本与未来预期付出是否值得。"},{"t":"随机错误（randomness error）：认为自己能预测随机事件的结果，试图给随机事件赋予意义，甚至形成迷信，使重要决策产生偏差。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">随机错误</strong>（randomness error）：认为自己能预测随机事件的结果，试图给随机事件赋予意义，甚至形成迷信，使重要决策产生偏差。"},{"t":"风险厌恶（risk aversion）：偏好确定性而厌恶风险——50%概率得200美元不如稳拿50美元；决策框架影响风险态度：积极框架下更厌恶风险，消极框架下更冒险；有被解雇风险的CEO尤其厌恶风险。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">风险厌恶</strong>（risk aversion）：偏好确定性而厌恶风险——50%概率得200美元不如稳拿50美元；决策框架影响风险态度：积极框架下更厌恶风险，消极框架下更冒险；有被解雇风险的CEO尤其厌恶风险。"},{"t":"后视偏见（hindsight bias）：结果已知时错误地认为自己原本能够做出准确预测；\"事后显而易见的在发生前基本都不明显\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">后视偏见</strong>（hindsight bias）：结果已知时错误地认为自己原本能够做出准确预测；&quot;事后显而易见的在发生前基本都不明显&quot;。"}],"k":"b","i":1,"h":"<strong class=\"lead\">常见的偏见和错误</strong>（决策者依赖经验、冲动和&quot;经验规则&quot;等捷径，会歪曲理性）："},{"t":"减少偏见和错误的建议（图表6-4）：","c":[{"t":"专注于目标：没有目标就无法理性思考，也无法判断哪些信息相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专注于目标</strong>：没有目标就无法理性思考，也无法判断哪些信息相关。"},{"t":"寻找与你的看法相矛盾的信息：避免过度自信和偏见最有效的方法之一。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">寻找与你的看法相矛盾的信息</strong>：避免过度自信和偏见最有效的方法之一。"},{"t":"不要试图给随机事件赋予意义：承认有些事情超出控制，不要从巧合中创造意义。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不要试图给随机事件赋予意义</strong>：承认有些事情超出控制，不要从巧合中创造意义。"},{"t":"增加你的选项：备选方案越多越多样，找到最佳方案的机会越大。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">增加你的选项</strong>：备选方案越多越多样，找到最佳方案的机会越大。"}],"k":"b","i":1,"h":"<strong class=\"lead\">减少偏见和错误的建议</strong>（图表6-4）："}],"k":"sec","i":0,"h":"6.4 在组织中进行决策"},{"t":"6.5 影响决策的因素：个体差异和组织限制","c":[{"t":"个体差异：","c":[{"t":"人格：追求成就的责任心强的人讨厌失败，更易承诺升级、更易受后视偏见影响（需为行为辩护）；忠于职守者顾全组织利益，较少升级承诺；高自尊者用自我服务偏见维护自尊，浮夸人格者（自恋的一面）更甚。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人格</strong>：追求成就的责任心强的人讨厌失败，更易承诺升级、更易受后视偏见影响（需为行为辩护）；忠于职守者顾全组织利益，较少升级承诺；高自尊者用自我服务偏见维护自尊，浮夸人格者（自恋的一面）更甚。"},{"t":"性别：无压力时男性和女性决策质量几乎相同；有压力时男性更自我中心、决策更冒险，女性更有同情心、决策能力提升；女性沉思更多、决策前反复分析、更易后悔和抑郁，该差异随年龄增长而减小（65岁后最小）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">性别</strong>：无压力时男性和女性决策质量几乎相同；有压力时男性更自我中心、决策更冒险，女性更有同情心、决策能力提升；女性沉思更多、决策前反复分析、更易后悔和抑郁，该差异随年龄增长而减小（65岁后最小）。"},{"t":"智力：聪明人同样会陷入锚定、过度自信和承诺升级，但一旦受到决策错误警告，能更快学会避免。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">智力</strong>：聪明人同样会陷入锚定、过度自信和承诺升级，但一旦受到决策错误警告，能更快学会避免。"},{"t":"文化差异：文化背景影响问题的选择、分析深度、对逻辑理性的重视程度以及个体还是集体制定决策；表现为时间取向（埃及管理者比美国管理者慢而谨慎）、对理性的价值观（北美重视理性，伊朗不必刻意显得理性）、对解决问题与接受现状的取向（美国重解决问题，泰国、印尼重接受现状）、群体取向（日本CEO决策前收集大量信息以达成一致）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化差异</strong>：文化背景影响问题的选择、分析深度、对逻辑理性的重视程度以及个体还是集体制定决策；表现为时间取向（埃及管理者比美国管理者慢而谨慎）、对理性的价值观（北美重视理性，伊朗不必刻意显得理性）、对解决问题与接受现状的取向（美国重解决问题，泰国、印尼重接受现状）、群体取向（日本CEO决策前收集大量信息以达成一致）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">个体差异</strong>："},{"t":"组织限制（使决策者背离理性模型）：","c":[{"t":"绩效评估体系：管理者受评估标准强烈影响，会花大量精力避免评估指标变坏。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">绩效评估体系</strong>：管理者受评估标准强烈影响，会花大量精力避免评估指标变坏。"},{"t":"奖励体系：奖励什么就得到什么——组织奖励风险厌恶，管理者就更保守；通用汽车曾长期奖励低调回避争论的管理者，结果管理者擅长对问题避重就轻。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">奖励体系</strong>：奖励什么就得到什么——组织奖励风险厌恶，管理者就更保守；通用汽车曾长期奖励低调回避争论的管理者，结果管理者擅长对问题避重就轻。"},{"t":"正式规则：规章制度和操作程序保证行为标准化，同时限制了决策者的选择权。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">正式规则</strong>：规章制度和操作程序保证行为标准化，同时限制了决策者的选择权。"},{"t":"系统强加的时间限制：最后期限带来的时间压力使决策者难以收集到所需的全部信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">系统强加的时间限制</strong>：最后期限带来的时间压力使决策者难以收集到所需的全部信息。"},{"t":"传统惯例：过去的决策是当前决策的前提条件（如去年预算决定今年预算），今天的决策是多年选择累积的结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">传统惯例</strong>：过去的决策是当前决策的前提条件（如去年预算决定今年预算），今天的决策是多年选择累积的结果。"}],"k":"b","i":1,"h":"<strong class=\"lead\">组织限制</strong>（使决策者背离理性模型）："}],"k":"sec","i":0,"h":"<strong class=\"lead\">6.5 影响决策的因素</strong>：个体差异和组织限制"},{"t":"6.6 决策中的道德问题","c":[{"t":"三种道德决策标准：","c":[{"t":"功利主义标准（utilitarianism）：决策完全以结果或结局为基础，目标是对所有人产生最佳效益；与企业效率、生产率、高利润目标一致，是企业决策的主流；但它并不总像听起来那样客观——天桥道德困境中选择率随文化与答题语言（母语/非母语）变化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">功利主义标准</strong>（utilitarianism）：决策完全以结果或结局为基础，目标是对所有人产生最佳效益；与企业效率、生产率、高利润目标一致，是企业决策的主流；但它并不总像听起来那样客观——天桥道德困境中选择率随文化与答题语言（母语/非母语）变化。"},{"t":"权利标准：决策须尊重和保护个体的基本自由和权利（如隐私权、自由演讲权，参照《人权法案》类文件）；该标准保护了告密者（whistle-blower），但用于权衡复杂组织决策时不如功利主义明确。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">权利标准</strong>：决策须尊重和保护个体的基本自由和权利（如隐私权、自由演讲权，参照《人权法案》类文件）；该标准保护了告密者（whistle-blower），但用于权衡复杂组织决策时不如功利主义明确。"},{"t":"遵守规则/公正标准：要求个体公正无偏地执行规则、平等分配企业的效益和损失；站在义务论（deonance）角度——无论组织规则是否存在，\"应当的力量\"都存在（如不偷窃是因其本身错误）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">遵守规则/公正标准</strong>：要求个体公正无偏地执行规则、平等分配企业的效益和损失；站在义务论（deonance）角度——无论组织规则是否存在，&quot;应当的力量&quot;都存在（如不偷窃是因其本身错误）。"},{"t":"对比与结论：决策者乐于以功利主义论证争议决策（涨价、裁员、转移海外），但好的决策不应仅靠一种标准判断；随社会对人权和社会公正关注增强，管理者需发展非功利主义标准，企业社会责任（CSR）使公众压力转化为商业意义，推动道德规范进入实践。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对比与结论</strong>：决策者乐于以功利主义论证争议决策（涨价、裁员、转移海外），但好的决策不应仅靠一种标准判断；随社会对人权和社会公正关注增强，管理者需发展非功利主义标准，企业社会责任（CSR）使公众压力转化为商业意义，推动道德规范进入实践。"}],"k":"b","i":1,"h":"<strong class=\"lead\">三种道德决策标准</strong>："},{"t":"行为道德（behavioral ethics）：研究人们面临道德困境时实际如何行动的领域——我们并不总遵循组织宣扬的道德标准，有时还违背自己的标准，道德行为随情境差异很大；存在\"道德盲点\"：高估自己的道德水平。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">行为道德</strong>（behavioral ethics）：研究人们面临道德困境时实际如何行动的领域——我们并不总遵循组织宣扬的道德标准，有时还违背自己的标准，道德行为随情境差异很大；存在&quot;道德盲点&quot;：高估自己的道德水平。"},{"t":"提高组织道德决策水平的做法：意识到照明、财富与地位的外在展示、清洁程度等环境信号会影响道德行为；鼓励关于道德问题的讨论；营造开放交流、不处罚直言者的氛围；注意文化差异（贿赂在某些文化中常见，无视差异可能在不知情中鼓励不道德行为）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">提高组织道德决策水平的做法</strong>：意识到照明、财富与地位的外在展示、清洁程度等环境信号会影响道德行为；鼓励关于道德问题的讨论；营造开放交流、不处罚直言者的氛围；注意文化差异（贿赂在某些文化中常见，无视差异可能在不知情中鼓励不道德行为）。"},{"t":"撒谎：","c":[{"t":"撒谎是最常见的日常不道德行为之一，且难以察觉：200多项研究显示人们正确识别说谎者的比例仅47%，低于随机猜测；\"撒谎时仰视右看\"、肢体语言、面部表情等技术均缺乏证据支持（说谎者的肢体语言会背叛自己\"不过是一种文化虚构\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">撒谎是最常见的日常不道德行为之一，且难以察觉</strong>：200多项研究显示人们正确识别说谎者的比例仅47%，低于随机猜测；&quot;撒谎时仰视右看&quot;、肢体语言、面部表情等技术均缺乏证据支持（说谎者的肢体语言会背叛自己&quot;不过是一种文化虚构&quot;）。"},{"t":"目前最有希望的测谎方向：阅读个人特有的线索组合（如母亲对孩子），说谎者经验越差越易识别；无论是否察觉，谎言对决策都是致命的——事实被歪曲时管理者无法做出好决策。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">目前最有希望的测谎方向</strong>：阅读个人特有的线索组合（如母亲对孩子），说谎者经验越差越易识别；无论是否察觉，谎言对决策都是致命的——事实被歪曲时管理者无法做出好决策。"},{"t":"减少撒谎的三个建议：不再自我欺骗（承认自己低估撒谎频率，警惕\"道德伪善\"）；信任但要求证明（消除可撒谎而不被发现的情况）；奖励诚实（意识到利益冲突会蒙蔽我们）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">减少撒谎的三个建议</strong>：不再自我欺骗（承认自己低估撒谎频率，警惕&quot;道德伪善&quot;）；信任但要求证明（消除可撒谎而不被发现的情况）；奖励诚实（意识到利益冲突会蒙蔽我们）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">撒谎</strong>："}],"k":"sec","i":0,"h":"6.6 决策中的道德问题"},{"t":"6.7 创造力、创造性决策和组织中的创新","c":[{"t":"创造力（creativity）：产生新颖有用的想法的能力；使决策者更全面地评定和理解问题，包括看到他人没有看到的问题。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">创造力</strong>（creativity）：产生新颖有用的想法的能力；使决策者更全面地评定和理解问题，包括看到他人没有看到的问题。"},{"t":"组织中的创造力三阶段模型（three-stage model of creativity，图表6-5）：创造力潜能与创造力环境是创造性行为的起因，创造性行为是核心，创造性结果（创新）是效果。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">组织中的创造力三阶段模型</strong>（three-stage model of creativity，图表6-5）：创造力潜能与创造力环境是创造性行为的起因，创造性行为是核心，创造性结果（创新）是效果。"},{"t":"创造性行为的四个步骤（每一步引起下一步）：","c":[{"t":"问题形成（problem formulation）：发现目前尚无解决方案的问题或机会（如发现美国环保署认定的\"安全\"油漆仍释放有害物质，转而研发大豆基安全油漆）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">问题形成</strong>（problem formulation）：发现目前尚无解决方案的问题或机会（如发现美国环保署认定的&quot;安全&quot;油漆仍释放有害物质，转而研发大豆基安全油漆）。"},{"t":"信息收集（information gathering）：寻求知识、可能的解决方案逐渐成形；意味着跳出惯常模式与舒适地带（如与相关领域之外的人讨论问题）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信息收集</strong>（information gathering）：寻求知识、可能的解决方案逐渐成形；意味着跳出惯常模式与舒适地带（如与相关领域之外的人讨论问题）。"},{"t":"创意产生（idea generation）：利用相关信息和知识制定可行的解决方案；独处（散步、涂鸦）与协作（如NASA工程师三天白板共创\"好奇号\"构想）都能产生创意。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">创意产生</strong>（idea generation）：利用相关信息和知识制定可行的解决方案；独处（散步、涂鸦）与协作（如NASA工程师三天白板共创&quot;好奇号&quot;构想）都能产生创意。"},{"t":"创意评估（idea evaluation）：从潜在可行方案中挑选最好的一个；评估者最好不是提出创意的人，以消除明显偏见。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">创意评估</strong>（idea evaluation）：从潜在可行方案中挑选最好的一个；评估者最好不是提出创意的人，以消除明显偏见。"}],"k":"b","i":1,"h":"<strong class=\"lead\">创造性行为的四个步骤</strong>（每一步引起下一步）："},{"t":"创造性行为的起因之一——创造力潜能（四个方面）：","c":[{"t":"智力与创造力：聪明人更善于解决复杂问题、拥有更强大的工作记忆；认知需求（学习欲望）强与创造力相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">智力与创造力</strong>：聪明人更善于解决复杂问题、拥有更强大的工作记忆；认知需求（学习欲望）强与创造力相关。"},{"t":"人格与创造力：大五人格中的经验开放性与创造力相关；创造力强的人还有主动性人格、自信、愿意冒险、对不确定性有承受力、坚持不懈等特质；希望、自我效能与积极情感也相关；核心自我评价高者在消极情境下更能保持创造力；\"疯狂天才\"理论的支持证据有限，其逆命题（有创造力者更易患精神疾病）不成立。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人格与创造力</strong>：大五人格中的经验开放性与创造力相关；创造力强的人还有主动性人格、自信、愿意冒险、对不确定性有承受力、坚持不懈等特质；希望、自我效能与积极情感也相关；核心自我评价高者在消极情境下更能保持创造力；&quot;疯狂天才&quot;理论的支持证据有限，其逆命题（有创造力者更易患精神疾病）不成立。"},{"t":"专业知识与创造力：所有创造性工作的基础，是创造力潜能最重要的预测指标；强大的社交网络让人接触更多样化想法并获取他人专业知识。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专业知识与创造力</strong>：所有创造性工作的基础，是创造力潜能最重要的预测指标；强大的社交网络让人接触更多样化想法并获取他人专业知识。"},{"t":"道德与创造力：创造力与道德无关甚至负相关——欺诈者可能比行事道德者更有创造力，因为不诚实与创造力都源于打破规则的欲望。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">道德与创造力</strong>：创造力与道德无关甚至负相关——欺诈者可能比行事道德者更有创造力，因为不诚实与创造力都源于打破规则的欲望。"}],"k":"b","i":1,"h":"<strong class=\"lead\">创造性行为的起因之一——创造力潜能</strong>（四个方面）："},{"t":"创造性行为的起因之二——创造力环境：","c":[{"t":"动机：首要因素；内在动机（因有趣、刺激、满足且具挑战而做某事）与创造性结果中等程度相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">动机</strong>：首要因素；内在动机（因有趣、刺激、满足且具挑战而做某事）与创造性结果中等程度相关。"},{"t":"认可与奖励：在积极支持创新的氛围里，团队创造力才能转化为创新成果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">认可与奖励</strong>：在积极支持创新的氛围里，团队创造力才能转化为创新成果。"},{"t":"自由与授权：促进思想自由交流、给出公平且具建设性的评判、不过分强调规则；结构授权与心理授权都与员工创造力相关；鼓励不惜代价获得成就的竞争环境会阻碍创造力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自由与授权</strong>：促进思想自由交流、给出公平且具建设性的评判、不过分强调规则；结构授权与心理授权都与员工创造力相关；鼓励不惜代价获得成就的竞争环境会阻碍创造力。"},{"t":"资源与工作特征：丰富的资源也能激发创造力；复杂的、自主的、对创新有明确角色期望的工作有利于创新行为；资源有限时管理者可鼓励员工为新颖想法寻找资源。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">资源与工作特征</strong>：丰富的资源也能激发创造力；复杂的、自主的、对创新有明确角色期望的工作有利于创新行为；资源有限时管理者可鼓励员工为新颖想法寻找资源。"},{"t":"管理者与领导：管理者是知识转移的重要桥梁；经常惩罚、少支持的领导使团队创造力低，鼓励性语气、透明领导与鼓励个人发展使团队创造力高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理者与领导</strong>：管理者是知识转移的重要桥梁；经常惩罚、少支持的领导使团队创造力低，鼓励性语气、透明领导与鼓励个人发展使团队创造力高。"},{"t":"文化：霍夫斯泰德维度中个人主义得分高的国家更有创造力（美国、意大利、比利时），但同一文化内部个体差异显著——不能以国别给人贴标签。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化</strong>：霍夫斯泰德维度中个人主义得分高的国家更有创造力（美国、意大利、比利时），但同一文化内部个体差异显著——不能以国别给人贴标签。"},{"t":"团队构成：当成员被明确要求换位思考、领导擅长鼓舞人心时，多元化团队更有创造力；团队新人是创造性想法的丰富来源，但往往早期无法做出贡献。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">团队构成</strong>：当成员被明确要求换位思考、领导擅长鼓舞人心时，多元化团队更有创造力；团队新人是创造性想法的丰富来源，但往往早期无法做出贡献。"}],"k":"b","i":1,"h":"<strong class=\"lead\">创造性行为的起因之二——创造力环境</strong>："},{"t":"创造性结果（创新）：对利益相关者来说新颖而有用的想法或解决方案——没有用，新颖本身不构成创造性；多数人对创意带有偏见（创意产生不确定性）；创意不会自行实现，将想法转化为创新成果是一个社会过程，需要运用权力与政治、领导、动机等其他概念。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">创造性结果</strong>（创新）：对利益相关者来说新颖而有用的想法或解决方案——没有用，新颖本身不构成创造性；多数人对创意带有偏见（创意产生不确定性）；创意不会自行实现，将想法转化为创新成果是一个社会过程，需要运用权力与政治、领导、动机等其他概念。"},{"t":"对管理者的启示（并入本节）：行为遵循认知——影响行为先评估人们如何看待工作；认识感性偏见与决策错误；按本国文化与组织标准调整决策方式；将理性分析与直觉结合；积极提高创造力并消除阻碍创造力的因素。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（并入本节）：行为遵循认知——影响行为先评估人们如何看待工作；认识感性偏见与决策错误；按本国文化与组织标准调整决策方式；将理性分析与直觉结合；积极提高创造力并消除阻碍创造力的因素。"}],"k":"sec","i":0,"h":"6.7 创造力、创造性决策和组织中的创新"}],"k":"chap","h":"第6章 知觉与个体决策"},{"t":"第7章 动机概念","c":[{"t":"学习目标","c":[{"t":"描述动机的三要素。","c":[],"k":"b","i":1,"h":"描述动机的三要素。"},{"t":"比较早期的动机理论。","c":[],"k":"b","i":1,"h":"比较早期的动机理论。"},{"t":"对比自我决定理论和目标设置理论的内容。","c":[],"k":"b","i":1,"h":"对比自我决定理论和目标设置理论的内容。"},{"t":"理解自我效能理论、强化理论和期望理论之间的差异。","c":[],"k":"b","i":1,"h":"理解自我效能理论、强化理论和期望理论之间的差异。"},{"t":"描述组织公平的各种形式，包括分配公平、程序公平、信息公平和互动公平。","c":[],"k":"b","i":1,"h":"描述组织公平的各种形式，包括分配公平、程序公平、信息公平和互动公平。"},{"t":"阐释员工的工作投入对管理者的意义。","c":[],"k":"b","i":1,"h":"阐释员工的工作投入对管理者的意义。"},{"t":"描述当代的动机理论是如何相互补充的。","c":[],"k":"b","i":1,"h":"描述当代的动机理论是如何相互补充的。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"7.1 动机的定义","c":[{"t":"动机（motivation）：一种过程，体现个体为实现目标而付出的努力的强度、方向和持续性；本章关注指向组织目标的努力。","c":[{"t":"强度：个体付出的努力程度——多数人谈动机时首先想到的要素。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">强度</strong>：个体付出的努力程度——多数人谈动机时首先想到的要素。"},{"t":"方向：努力必须指向组织目标并与组织目标一致；高强度不必然带来好绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">方向</strong>：努力必须指向组织目标并与组织目标一致；高强度不必然带来好绩效。"},{"t":"持续性：努力能维持多长时间；受激励的个体可长时间从事任务直至实现目标。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">持续性</strong>：努力能维持多长时间；受激励的个体可长时间从事任务直至实现目标。"}],"k":"b","i":1,"h":"<strong class=\"lead\">动机</strong>（motivation）：一种过程，体现个体为实现目标而付出的努力的强度、方向和持续性；本章关注指向组织目标的努力。"},{"t":"动机水平因人而异，对同一个体也因时而异（同一人看课本20分钟难坚持，看小说可一整天）。","c":[],"k":"b","i":1,"h":"动机水平因人而异，对同一个体也因时而异（同一人看课本20分钟难坚持，看小说可一整天）。"}],"k":"sec","i":0,"h":"7.1 动机的定义"},{"t":"7.2 早期的动机理论","c":[{"t":"20世纪50年代诞生了三个最广为人知的动机理论；虽有缺陷，但它们是动机理论的基础，其术语至今仍被管理实践者使用。","c":[],"k":"b","i":1,"h":"20世纪50年代诞生了三个最广为人知的动机理论；虽有缺陷，但它们是动机理论的基础，其术语至今仍被管理实践者使用。"},{"t":"需求层次理论（hierarchy of needs，马斯洛）：","c":[{"t":"五种层次需求（由低到高，图表7-1）：","c":[{"t":"生理需求：食物、水、睡眠、性和其他身体需求。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">生理需求</strong>：食物、水、睡眠、性和其他身体需求。"},{"t":"安全保障需求：保护自己免受生理和情绪伤害的需求。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">安全保障需求</strong>：保护自己免受生理和情绪伤害的需求。"},{"t":"社会归属需求：爱、归属、接纳和友谊。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">社会归属需求</strong>：爱、归属、接纳和友谊。"},{"t":"尊重需求：内部尊重因素（自尊、自主、成就感）与外部尊重因素（地位、认可、关注）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">尊重需求</strong>：内部尊重因素（自尊、自主、成就感）与外部尊重因素（地位、认可、关注）。"},{"t":"自我实现需求：使个体成为他所能成为的人的内驱力，包括成长、开发自我潜能和自我实现。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">自我实现需求</strong>：使个体成为他所能成为的人的内驱力，包括成长、开发自我潜能和自我实现。"}],"k":"b","i":2,"h":"<strong class=\"lead\">五种层次需求</strong>（由低到高，图表7-1）："},{"t":"核心逻辑：一种需求基本满足后，更高一级的需求就成为主导需求；要激励一个人，须了解其当前所处层次并重点满足该层或更高层的需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心逻辑</strong>：一种需求基本满足后，更高一级的需求就成为主导需求；要激励一个人，须了解其当前所处层次并重点满足该层或更高层的需求。"},{"t":"补充：金字塔是它最有名的表现形式，但马斯洛本人仅以层次形式描述；另有学者提出\"内在价值\"为第六层次，尚未得到广泛认可。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">补充</strong>：金字塔是它最有名的表现形式，但马斯洛本人仅以层次形式描述；另有学者提出&quot;内在价值&quot;为第六层次，尚未得到广泛认可。"},{"t":"评价：直观、易理解，在管理实践者中广为流传；但大部分研究未验证其有效性，自20世纪60年代已较少被研究——直觉上合理的旧理论不会轻易消失，使用时须意识到其争议。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">评价</strong>：直观、易理解，在管理实践者中广为流传；但大部分研究未验证其有效性，自20世纪60年代已较少被研究——直觉上合理的旧理论不会轻易消失，使用时须意识到其争议。"}],"k":"b","i":1,"h":"<strong class=\"lead\">需求层次理论</strong>（hierarchy of needs，马斯洛）："},{"t":"双因素理论（two-factor theory，赫茨伯格；又称激励-保健理论，该术语现已少用）：","c":[{"t":"研究方法：让人们详细描述工作中感到特别好或特别差的情境，满意者归功于内部因素，不满意者抱怨外部因素。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">研究方法</strong>：让人们详细描述工作中感到特别好或特别差的情境，满意者归功于内部因素，不满意者抱怨外部因素。"},{"t":"核心观点：满意的对立面不是不满意——\"满意\"的对立面是\"没有满意\"，\"不满意\"的对立面是\"没有不满意\"（图表7-3）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心观点</strong>：满意的对立面不是不满意——&quot;满意&quot;的对立面是&quot;没有满意&quot;，&quot;不满意&quot;的对立面是&quot;没有不满意&quot;（图表7-3）。"},{"t":"激励因素（与工作本身及内在回报有关）：晋升、认可、责任、成就、个人成长机会等——具备时带来满意和激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">激励因素</strong>（与工作本身及内在回报有关）：晋升、认可、责任、成就、个人成长机会等——具备时带来满意和激励。"},{"t":"保健因素（hygiene factor，与工作环境有关）：行政管理、薪酬水平、公司政策、工作环境、与他人的关系、工作稳定性——充分时只能消除不满意、安抚员工，却不能激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">保健因素</strong>（hygiene factor，与工作环境有关）：行政管理、薪酬水平、公司政策、工作环境、与他人的关系、工作稳定性——充分时只能消除不满意、安抚员工，却不能激励。"},{"t":"管理含义：消除不满意因素只创造中性环境；要激励员工必须重视与工作本身或其直接结果有关的因素。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理含义</strong>：消除不满意因素只创造中性环境；要激励员工必须重视与工作本身或其直接结果有关的因素。"},{"t":"评价：未获研究有力支持（批评集中于初始方法论与回忆偏差），但影响巨大，被日本、印度等国研究采用，几乎所有管理者都熟悉其建议。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">评价</strong>：未获研究有力支持（批评集中于初始方法论与回忆偏差），但影响巨大，被日本、印度等国研究采用，几乎所有管理者都熟悉其建议。"}],"k":"b","i":1,"h":"<strong class=\"lead\">双因素理论</strong>（two-factor theory，赫茨伯格；又称激励-保健理论，该术语现已少用）："},{"t":"麦克利兰的需求理论（McClelland's theory of needs）：","c":[{"t":"三种需要：","c":[{"t":"成就需求（need for achievement, nAch）：追求卓越、根据设置好的标准实现目标的需求。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">成就需求</strong>（need for achievement, nAch）：追求卓越、根据设置好的标准实现目标的需求。"},{"t":"权力需求（need for power, nPow）：使他人以某种方式行事而不以其他方式行事的需求。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">权力需求</strong>（need for power, nPow）：使他人以某种方式行事而不以其他方式行事的需求。"},{"t":"归属需求（need for affiliation, nAff）：建立友好、亲密的人际关系的愿望。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">归属需求</strong>（need for affiliation, nAff）：建立友好、亲密的人际关系的愿望。"}],"k":"b","i":2,"h":"<strong class=\"lead\">三种需要</strong>："},{"t":"高成就需求者的特点：当感觉任务成功概率约为0.5（50%）时表现得最好——不喜欢偶然性过高的赌博（得不到满足感），也不喜欢成功概率过高的任务（无挑战性）；更积极的情绪、对手头任务更感兴趣；在高风险工作条件（工作演练、当面销售）下表现更好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">高成就需求者的特点</strong>：当感觉任务成功概率约为0.5（50%）时表现得最好——不喜欢偶然性过高的赌博（得不到满足感），也不喜欢成功概率过高的任务（无挑战性）；更积极的情绪、对手头任务更感兴趣；在高风险工作条件（工作演练、当面销售）下表现更好。"},{"t":"与管理成功的关系：最好的管理者往往权力需求很高而归属需求很低；高归属需求者组成的群体表现更好、交流最开放、冲突最少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与管理成功的关系</strong>：最好的管理者往往权力需求很高而归属需求很低；高归属需求者组成的群体表现更好、交流最开放、冲突最少。"},{"t":"评价：得到跨文化研究支持（考虑权力距离等文化维度）；但三种需求难以测量、难以独立检测，实践中管理者多凭长期观察给员工\"贴标签\"，使用方式通常不客观。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">评价</strong>：得到跨文化研究支持（考虑权力距离等文化维度）；但三种需求难以测量、难以独立检测，实践中管理者多凭长期观察给员工&quot;贴标签&quot;，使用方式通常不客观。"}],"k":"b","i":1,"h":"<strong class=\"lead\">麦克利兰的需求理论</strong>（McClelland&#x27;s theory of needs）："}],"k":"sec","i":0,"h":"7.2 早期的动机理论"},{"t":"7.3 当代动机理论","c":[{"t":"当代动机理论的共同特点：每个理论都有大量有效证据支持，代表目前对员工动机的最新解读。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">当代动机理论的共同特点</strong>：每个理论都有大量有效证据支持，代表目前对员工动机的最新解读。"},{"t":"自我决定理论（self-determination theory）：","c":[{"t":"核心：人们享受对自己行动的控制感；当以前乐在其中的任务变成义务而非自主选择时，动机会遭到破坏（志愿者转为领薪雇员后觉得工作不再有趣的例子）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心</strong>：人们享受对自己行动的控制感；当以前乐在其中的任务变成义务而非自主选择时，动机会遭到破坏（志愿者转为领薪雇员后觉得工作不再有趣的例子）。"},{"t":"认知评价理论（cognitive evaluation theory）：假设外部奖励会降低人们对工作的内在兴趣——有偿使工作更像\"不得不做\"而非\"想做\"；如程序员因热爱解题而写代码，若按每天代码行数奖励，会产生被强迫感、内在动机被削弱。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">认知评价理论</strong>（cognitive evaluation theory）：假设外部奖励会降低人们对工作的内在兴趣——有偿使工作更像&quot;不得不做&quot;而非&quot;想做&quot;；如程序员因热爱解题而写代码，若按每天代码行数奖励，会产生被强迫感、内在动机被削弱。"},{"t":"三种需求：自主性需求（对态度和情感结果最重要）、能力需求（预测绩效的最重要需求）、与他人建立积极关系的需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三种需求</strong>：自主性需求（对态度和情感结果最重要）、能力需求（预测绩效的最重要需求）、与他人建立积极关系的需求。"},{"t":"对奖励的建议：谨慎使用外部奖励；出于内在动机追求目标比外部奖励更能维持动机；最近元分析证实内在动机提高工作质量、激励措施提高工作数量；激励与绩效直接挂钩（如金钱奖励）时内在动机的预测力变弱。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对奖励的建议</strong>：谨慎使用外部奖励；出于内在动机追求目标比外部奖励更能维持动机；最近元分析证实内在动机提高工作质量、激励措施提高工作数量；激励与绩效直接挂钩（如金钱奖励）时内在动机的预测力变弱。"},{"t":"自我一致性（self-concordance）：人们追求目标的理由与其兴趣及核心价值观的一致程度；出于内在原因追求目标者对工作更满意、与组织匹配感更好、表现更好，且该结论跨文化成立（即使未达成目标也快乐，因为过程本身充满乐趣）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自我一致性</strong>（self-concordance）：人们追求目标的理由与其兴趣及核心价值观的一致程度；出于内在原因追求目标者对工作更满意、与组织匹配感更好、表现更好，且该结论跨文化成立（即使未达成目标也快乐，因为过程本身充满乐趣）。"},{"t":"管理启示：除外部奖励外提供内部奖励——让工作充满乐趣、给予认可、在组织和员工目标间建立联系、支持成长发展；员工觉得能控制自己的工作时更受激励、对雇主更忠诚。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理启示</strong>：除外部奖励外提供内部奖励——让工作充满乐趣、给予认可、在组织和员工目标间建立联系、支持成长发展；员工觉得能控制自己的工作时更受激励、对雇主更忠诚。"}],"k":"b","i":1,"h":"<strong class=\"lead\">自我决定理论</strong>（self-determination theory）："},{"t":"目标设置理论（goal-setting theory，洛克）：","c":[{"t":"核心主张：为实现某个目标而工作的意愿是工作动机的一个主要来源；目标的具体性、挑战性和反馈对绩效有巨大影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心主张</strong>：为实现某个目标而工作的意愿是工作动机的一个主要来源；目标的具体性、挑战性和反馈对绩效有巨大影响。"},{"t":"三条有力证据支持的结论：明确具体的目标比\"尽力而为\"提高绩效（具体化本身是内在推动力）；困难目标一旦被接受比容易目标带来更高绩效；有反馈比无反馈绩效更高（自发的反馈——自我监控进程——比外部反馈更具激励作用）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三条有力证据支持的结论</strong>：明确具体的目标比&quot;尽力而为&quot;提高绩效（具体化本身是内在推动力）；困难目标一旦被接受比容易目标带来更高绩效；有反馈比无反馈绩效更高（自发的反馈——自我监控进程——比外部反馈更具激励作用）。"},{"t":"员工参与设置目标：证据不一致（有的研究参与更好，有的上司指定更好）；未参与时须让个体了解目标的意义和重要性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">员工参与设置目标</strong>：证据不一致（有的研究参与更好，有的上司指定更好）；未参与时须让个体了解目标的意义和重要性。"},{"t":"影响目标—绩效关系的三个个人因素：","c":[{"t":"目标承诺：个体既不降低也不放弃目标，相信自己能达成且有达成愿望；当努力可获回报、目标有吸引力、个体积极参与设置时承诺最强。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">目标承诺</strong>：个体既不降低也不放弃目标，相信自己能达成且有达成愿望；当努力可获回报、目标有吸引力、个体积极参与设置时承诺最强。"},{"t":"任务特点：任务简单而非复杂、独立而非相互依赖时，目标对绩效影响更大；相互依赖的任务宜设群体目标并授权。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">任务特点</strong>：任务简单而非复杂、独立而非相互依赖时，目标对绩效影响更大；相互依赖的任务宜设群体目标并授权。"},{"t":"民族文化：高权力距离的集体主义文化中，可实现的目标比困难目标更有激励作用；上级制定目标在高权力距离文化中带来更高承诺。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">民族文化</strong>：高权力距离的集体主义文化中，可实现的目标比困难目标更有激励作用；上级制定目标在高权力距离文化中带来更高承诺。"}],"k":"b","i":2,"h":"<strong class=\"lead\">影响目标—绩效关系的三个个人因素</strong>："},{"t":"目标的阴暗面：学习重要知识时与成绩有关的目标可能损害适应性和创造性；对可量化重复性任务设数量目标有效，对复杂思考工作未必；个体有时难以割舍无法实现的目标。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">目标的阴暗面</strong>：学习重要知识时与成绩有关的目标可能损害适应性和创造性；对可量化重复性任务设数量目标有效，对复杂思考工作未必；个体有时难以割舍无法实现的目标。"},{"t":"两种追求定向：促进定向（promotion focus）努力取得进步和成就、接近达成目标的情境，与高水平任务绩效、公民行为、创新相关；预防定向（prevention focus）履行职责义务、避免远离目标的情境，与稳定绩效相关，其满意度受低成就感影响更大，宜设可实现目标、消除干扰并提供结构。理想状态是同时具备两种定向。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">两种追求定向</strong>：促进定向（promotion focus）努力取得进步和成就、接近达成目标的情境，与高水平任务绩效、公民行为、创新相关；预防定向（prevention focus）履行职责义务、避免远离目标的情境，与稳定绩效相关，其满意度受低成就感影响更大，宜设可实现目标、消除干扰并提供结构。理想状态是同时具备两种定向。"},{"t":"应用——目标管理（management by objectives, MBO）：强调员工参与设置明确、可检验且可测量的目标；组织总体目标逐级转化为事业部、部门、个人目标（图表7-4），兼具自上而下与自下而上的影响；失败常因不切实际的期望、缺乏高层认同、无法按目标完成情况分配报酬。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用——目标管理</strong>（management by objectives, MBO）：强调员工参与设置明确、可检验且可测量的目标；组织总体目标逐级转化为事业部、部门、个人目标（图表7-4），兼具自上而下与自下而上的影响；失败常因不切实际的期望、缺乏高层认同、无法按目标完成情况分配报酬。"},{"t":"目标设置与道德：目标与金钱绑定时容易在道德上妥协；追求目标时若考虑过程则更可能合乎道德；目标临近时时间压力加大，会诱使人为实现目标采取不道德行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">目标设置与道德</strong>：目标与金钱绑定时容易在道德上妥协；追求目标时若考虑过程则更可能合乎道德；目标临近时时间压力加大，会诱使人为实现目标采取不道德行为。"}],"k":"b","i":1,"h":"<strong class=\"lead\">目标设置理论</strong>（goal-setting theory，洛克）："}],"k":"sec","i":0,"h":"7.3 当代动机理论"},{"t":"7.4 其他当代动机理论","c":[{"t":"自我效能理论（self-efficacy theory，班杜拉）：","c":[{"t":"自我效能：个体对自己能够完成某项任务的一种信念；水平越高越有信心——困难情境中低自我效能者降低甚至放弃努力，高自我效能者加倍努力迎接挑战，并可能形成正向循环（投入→绩效→自我效能再提高）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">自我效能</strong>：个体对自己能够完成某项任务的一种信念；水平越高越有信心——困难情境中低自我效能者降低甚至放弃努力，高自我效能者加倍努力迎接挑战，并可能形成正向循环（投入→绩效→自我效能再提高）。"},{"t":"与目标设置互补：管理者设置困难目标→传递信心→自我效能提高→个体为自己设更高目标→获得更高绩效（图表7-5）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与目标设置互补</strong>：管理者设置困难目标→传递信心→自我效能提高→个体为自己设更高目标→获得更高绩效（图表7-5）。"},{"t":"提高自我效能的四方面来源（班杜拉）：","c":[{"t":"熟练掌握：获得与工作或任务相关的成功经验——最重要的资源。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">熟练掌握</strong>：获得与工作或任务相关的成功经验——最重要的资源。"},{"t":"替代榜样：看到别人完成任务会更自信；观察对象与自己越相似越有效（看与自己情况相似的人戒烟成功，比看泰格·伍兹推杆更有说服力）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">替代榜样</strong>：看到别人完成任务会更自信；观察对象与自己越相似越有效（看与自己情况相似的人戒烟成功，比看泰格·伍兹推杆更有说服力）。"},{"t":"口头说服：他人说服你具备成功的必要技能；对管理者而言最好的口头说服是利用皮格马利翁效应（Pygmalion effect）——一种自我实现预言，相信某事会成真它就会实现（老师对\"高智商\"学生投入更多，学生自我效能与成绩随之提高）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">口头说服</strong>：他人说服你具备成功的必要技能；对管理者而言最好的口头说服是利用皮格马利翁效应（Pygmalion effect）——一种自我实现预言，相信某事会成真它就会实现（老师对&quot;高智商&quot;学生投入更多，学生自我效能与成绩随之提高）。"},{"t":"唤醒：使个体处于兴奋状态、感觉胜任；但对需要踏实细致的任务（如编辑手稿）可能破坏绩效。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">唤醒</strong>：使个体处于兴奋状态、感觉胜任；但对需要踏实细致的任务（如编辑手稿）可能破坏绩效。"}],"k":"b","i":2,"h":"<strong class=\"lead\">提高自我效能的四方面来源</strong>（班杜拉）："},{"t":"补充：智力与人格（高智商、高责任心、高情绪稳定性）也提高自我效能，有研究者因此视其为自信聪明者的\"副产品\"；
