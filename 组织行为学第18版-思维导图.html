s=\"lead\">证据</strong>：一项针对20多个行业2100多名首席财务官（CFO）的调查显示，缺乏人际技能是员工未能晋升的首要原因。"},{"t":"将OB原则融入工作场所的重要组织成果（逐条）：","c":[{"t":"财务业绩：被视为\"最佳工作场所\"的公司（Adobe、领英、Fast Enterprises、World Wide Technology、贝恩、谷歌、波士顿咨询集团、脸书等）创造了卓越的财务业绩。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">财务业绩</strong>：被视为&quot;最佳工作场所&quot;的公司（Adobe、领英、Fast Enterprises、World Wide Technology、贝恩、谷歌、波士顿咨询集团、脸书等）创造了卓越的财务业绩。"},{"t":"人才保留：人际技能开发有助于吸引和留住高绩效员工——优秀员工总是供不应求，更换成本也很高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人才保留</strong>：人际技能开发有助于吸引和留住高绩效员工——优秀员工总是供不应求，更换成本也很高。"},{"t":"关系与满意度：工作关系质量与工作满意度、压力、离职之间关联很强；大规模调查显示与同事及上级的社会关系与总体工作满意度高度相关，积极的社会关系伴随更小压力与更低离职意愿，还有助于员工发展、提高工作与生活满意度、增加工作中的积极情绪与意义感。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关系与满意度</strong>：工作关系质量与工作满意度、压力、离职之间关联很强；大规模调查显示与同事及上级的社会关系与总体工作满意度高度相关，积极的社会关系伴随更小压力与更低离职意愿，还有助于员工发展、提高工作与生活满意度、增加工作中的积极情绪与意义感。"},{"t":"社会责任：增加组织中的OB要素能培养社会责任意识，许多大学将社会创业教育纳入课程以培养未来领导者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社会责任</strong>：增加组织中的OB要素能培养社会责任意识，许多大学将社会创业教育纳入课程以培养未来领导者。"}],"k":"b","i":1,"h":"<strong class=\"lead\">将OB原则融入工作场所的重要组织成果</strong>（逐条）："},{"t":"结论：在竞争日益激烈、要求日趋提高的工作环境中，管理者单凭技术与技能不可能成功，还须具备良好的人际技能；本书目的正是帮助管理者及潜在管理者提高人际技能、获得理解人类行为所需的知识。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">结论</strong>：在竞争日益激烈、要求日趋提高的工作环境中，管理者单凭技术与技能不可能成功，还须具备良好的人际技能；本书目的正是帮助管理者及潜在管理者提高人际技能、获得理解人类行为所需的知识。"}],"k":"sec","i":0,"h":"1.1 人际技能的重要性"},{"t":"1.2 管理和组织行为学","c":[{"t":"两个基本概念：","c":[{"t":"管理者（manager）：最显著特点是通过他人来完成工作；通过做决策、分配资源、指导他人活动来实现工作目标；在非营利组织中常称行政管理者（administrator）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理者</strong>（manager）：最显著特点是通过他人来完成工作；通过做决策、分配资源、指导他人活动来实现工作目标；在非营利组织中常称行政管理者（administrator）。"},{"t":"组织（organization）：人们有目的地组合起来的一种社会单元，由两个或两个以上个体组成，在相对连续的基础上运作，以实现一个或一系列共同目标（工厂、学校、医院、军队、零售店、政府机构等均是组织）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织</strong>（organization）：人们有目的地组合起来的一种社会单元，由两个或两个以上个体组成，在相对连续的基础上运作，以实现一个或一系列共同目标（工厂、学校、医院、军队、零售店、政府机构等均是组织）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">两个基本概念</strong>："},{"t":"现实挑战：超过58%的管理者表示未接受过任何管理训练，25%承认上任时没做好领导准备；平均每个管理者有7个直接管理对象（过去正常为5个）而直接监督时间更少；盖洛普调查发现82%的情况下组织在管理职位上选错了候选人——对人和如何管理人了解越多，越可能成为合格的管理者。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">现实挑战</strong>：超过58%的管理者表示未接受过任何管理训练，25%承认上任时没做好领导准备；平均每个管理者有7个直接管理对象（过去正常为5个）而直接监督时间更少；盖洛普调查发现82%的情况下组织在管理职位上选错了候选人——对人和如何管理人了解越多，越可能成为合格的管理者。"},{"t":"管理的四种职能（逐条）：","c":[{"t":"计划（planning）：确定组织目标；制定达成目标的总体战略；将计划划分层级以整合协调各项活动。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">计划</strong>（planning）：确定组织目标；制定达成目标的总体战略；将计划划分层级以整合协调各项活动。"},{"t":"组织（organizing）：设计工作单元结构——决定完成什么任务、谁来承担、如何分类、谁向谁报告以及在什么地方决策。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织</strong>（organizing）：设计工作单元结构——决定完成什么任务、谁来承担、如何分类、谁向谁报告以及在什么地方决策。"},{"t":"领导（leading）：指导和协调组织中的人员——激励下属、指导活动、选择最有效的沟通渠道、解决成员冲突。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">领导</strong>（leading）：指导和协调组织中的人员——激励下属、指导活动、选择最有效的沟通渠道、解决成员冲突。"},{"t":"控制（controlling）：监控组织绩效，将实际绩效与预期目标比较，出现重大偏离时使组织回到正确轨道。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">控制</strong>（controlling）：监控组织绩效，将实际绩效与预期目标比较，出现重大偏离时使组织回到正确轨道。"}],"k":"b","i":1,"h":"<strong class=\"lead\">管理的四种职能</strong>（逐条）："},{"t":"1.2.1 管理者的角色（明茨伯格 Henry Mintzberg：10种角色，三大类；后续研究显示这些角色至今变化很小）：","c":[{"t":"人际角色：","c":[{"t":"头面人物：象征性首脑，完成法律或社交的例行工作（校长颁发毕业证书、厂长接待参观）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">头面人物</strong>：象征性首脑，完成法律或社交的例行工作（校长颁发毕业证书、厂长接待参观）。"},{"t":"领导者：负责激励和指导下属（员工的招聘、培训、激励和处分）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">领导者</strong>：负责激励和指导下属（员工的招聘、培训、激励和处分）。"},{"t":"联络人：建立并维护与外部保持联系的社交网络，以获得各种支持和信息（分内部联络人与外部联络人）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">联络人</strong>：建立并维护与外部保持联系的社交网络，以获得各种支持和信息（分内部联络人与外部联络人）。"}],"k":"b","i":2,"h":"<strong class=\"lead\">人际角色</strong>："},{"t":"信息传递者角色：","c":[{"t":"监控者：获取各类信息，作为组织内外部信息的神经中枢。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">监控者</strong>：获取各类信息，作为组织内外部信息的神经中枢。"},{"t":"传播者：把从外部或下属处获得的信息传递给组织中的其他成员。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">传播者</strong>：把从外部或下属处获得的信息传递给组织中的其他成员。"},{"t":"发言人：向外界发布组织的计划、政策、行动和结果，以行业专家身份出现。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">发言人</strong>：向外界发布组织的计划、政策、行动和结果，以行业专家身份出现。"}],"k":"b","i":2,"h":"<strong class=\"lead\">信息传递者角色</strong>："},{"t":"决策角色：","c":[{"t":"创业者：从组织和环境中寻找机会，推行能带来变革的方案。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">创业者</strong>：从组织和环境中寻找机会，推行能带来变革的方案。"},{"t":"混乱处理者：组织面临意外的重大混乱时采取正确行动。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">混乱处理者</strong>：组织面临意外的重大混乱时采取正确行动。"},{"t":"资源分配者：做出或批准组织中的重大决策（分配人力、物力、财力资源）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">资源分配者</strong>：做出或批准组织中的重大决策（分配人力、物力、财力资源）。"},{"t":"谈判者：在重要谈判中代表组织，为自己的部门争取利益。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">谈判者</strong>：在重要谈判中代表组织，为自己的部门争取利益。"}],"k":"b","i":2,"h":"<strong class=\"lead\">决策角色</strong>："}],"k":"b","i":1,"h":"<strong class=\"lead\">1.2.1 管理者的角色</strong>（明茨伯格 Henry Mintzberg：10种角色，三大类；后续研究显示这些角色至今变化很小）："},{"t":"1.2.2 管理者的技能（区分有效与无效管理者的三类技能）：","c":[{"t":"技术技能（technical skill）：应用专业知识或技术的能力；可通过正规教育获得，也可在工作中培养；所有工作都需要一定的专业知识。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">技术技能</strong>（technical skill）：应用专业知识或技术的能力；可通过正规教育获得，也可在工作中培养；所有工作都需要一定的专业知识。"},{"t":"人际技能（human skill）：无论独自一人还是在群体中，理解他人、与他人沟通、激励他人、支持他人的能力；管理者需要通过他人完成工作，必须具备良好的人际技能。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人际技能</strong>（human skill）：无论独自一人还是在群体中，理解他人、与他人沟通、激励他人、支持他人的能力；管理者需要通过他人完成工作，必须具备良好的人际技能。"},{"t":"概念技能（conceptual skill）：分析和判断复杂情况的心智能力——识别问题、找出并评估备选方案、选定最佳方案、制定并执行行动计划；将新观念与现有程序整合并对工作创新也属此类。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">概念技能</strong>（conceptual skill）：分析和判断复杂情况的心智能力——识别问题、找出并评估备选方案、选定最佳方案、制定并执行行动计划；将新观念与现有程序整合并对工作创新也属此类。"}],"k":"b","i":1,"h":"<strong class=\"lead\">1.2.2 管理者的技能</strong>（区分有效与无效管理者的三类技能）："},{"t":"1.2.3 有效的管理活动与成功的管理活动（卢桑斯 Fred Luthans 对450名管理者的研究）：","c":[{"t":"四类管理活动及平均时间分配：传统管理（决策、计划、控制）32%；沟通（交换日常信息、处理文案工作）29%；人力资源管理（激励、处罚、冲突管理、人员配置、培训）20%；社交（社会活动、政治活动、与外部交往）19%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">四类管理活动及平均时间分配</strong>：传统管理（决策、计划、控制）32%；沟通（交换日常信息、处理文案工作）29%；人力资源管理（激励、处罚、冲突管理、人员配置、培训）20%；社交（社会活动、政治活动、与外部交往）19%。"},{"t":"成功的管理者（以晋升速度衡量）：社交用时最多，人力资源管理用时最少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成功的管理者</strong>（以晋升速度衡量）：社交用时最多，人力资源管理用时最少。"},{"t":"有效的管理者（以工作绩效的数量和质量及下属的满意和承诺程度衡量）：沟通用时占比最大，社交占比最小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">有效的管理者</strong>（以工作绩效的数量和质量及下属的满意和承诺程度衡量）：沟通用时占比最大，社交占比最小。"},{"t":"结论与启示：这一发现挑战了\"晋升以工作绩效为基础\"的假设，表明社交和政治技能对组织内部升迁起重要作用；在澳大利亚、以色列、意大利、日本、美国等国的后续研究证实了社交活动与管理成功的关联。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论与启示</strong>：这一发现挑战了&quot;晋升以工作绩效为基础&quot;的假设，表明社交和政治技能对组织内部升迁起重要作用；在澳大利亚、以色列、意大利、日本、美国等国的后续研究证实了社交活动与管理成功的关联。"}],"k":"b","i":1,"h":"1.2.3 有效的管理活动与成功的管理活动（卢桑斯 Fred Luthans 对450名管理者的研究）："},{"t":"OB 的定义（本章核心）：","c":[{"t":"组织行为学（organizational behavior, OB）：一个研究领域，它探讨个体、群体以及结构对组织内部行为的影响，目的是应用这些知识改善组织绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织行为学</strong>（organizational behavior, OB）：一个研究领域，它探讨个体、群体以及结构对组织内部行为的影响，目的是应用这些知识改善组织绩效。"},{"t":"定义拆解：OB是由共同知识体系构成的独立专业领域；研究决定组织中行为的三类因素——个体、群体、结构；把研究所得知识加以运用，使组织运作更为有效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定义拆解</strong>：OB是由共同知识体系构成的独立专业领域；研究决定组织中行为的三类因素——个体、群体、结构；把研究所得知识加以运用，使组织运作更为有效。"},{"t":"关注焦点：人们在组织中做什么以及这些行为如何影响组织绩效；因关注雇佣情境，强调与工作、岗位、缺勤、离职、生产率、工作绩效和管理有关的行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关注焦点</strong>：人们在组织中做什么以及这些行为如何影响组织绩效；因关注雇佣情境，强调与工作、岗位、缺勤、离职、生产率、工作绩效和管理有关的行为。"},{"t":"核心课题共识（8项）：动机；领导行为和权力；人际沟通；群体结构与过程；态度形成与知觉；变革过程；冲突和谈判；工作设计。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心课题共识</strong>（8项）：动机；领导行为和权力；人际沟通；群体结构与过程；态度形成与知觉；变革过程；冲突和谈判；工作设计。"}],"k":"b","i":1,"h":"<strong class=\"lead\">OB 的定义</strong>（本章核心）："}],"k":"sec","i":0,"h":"1.2 管理和组织行为学"},{"t":"1.3 用系统研究完善直觉","c":[{"t":"基本理念：行为不是随机发生的，可以找到所有人行为中的共性，再加以修正以反映个体差异；行为总体上可预测，系统性研究是做出精确预测的方法；肤浅的\"解读他人\"常导致错误预测。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">基本理念</strong>：行为不是随机发生的，可以找到所有人行为中的共性，再加以修正以反映个体差异；行为总体上可预测，系统性研究是做出精确预测的方法；肤浅的&quot;解读他人&quot;常导致错误预测。"},{"t":"系统研究（systematic study）：通过考察事物之间的关系，试图解释其中的原因和结果，把结论建立在科学论证基础上；在控制的条件下收集数据，并以严谨方式测量和解释。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">系统研究</strong>（systematic study）：通过考察事物之间的关系，试图解释其中的原因和结果，把结论建立在科学论证基础上；在控制的条件下收集数据，并以严谨方式测量和解释。"},{"t":"循证管理（evidence-based management, EBM）：对系统研究的补充，以最佳可用的科学证据为基础做出管理决策（类比医生依据最新证据制定治疗方案）；现实中相当多的管理决策匆忙做出，很少系统利用现成证据。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">循证管理</strong>（evidence-based management, EBM）：对系统研究的补充，以最佳可用的科学证据为基础做出管理决策（类比医生依据最新证据制定治疗方案）；现实中相当多的管理决策匆忙做出，很少系统利用现成证据。"},{"t":"直觉（intuition）：\"本能\"；非系统方式形成的观念未必错误（杰克•韦尔奇：\"秘诀就是知道什么时候可以依赖你的直觉\"），但仅靠直觉等于在信息不完整的条件下决策，且人们倾向于高估自己所知的准确性；许多管理者的\"常识\"观点已被实证研究明确否定；商业媒体易被潮流主导，成功故事背后未必存在规律。结论：系统研究与EBM用来完善（而非取代）直觉。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">直觉</strong>（intuition）：&quot;本能&quot;；非系统方式形成的观念未必错误（杰克•韦尔奇：&quot;秘诀就是知道什么时候可以依赖你的直觉&quot;），但仅靠直觉等于在信息不完整的条件下决策，且人们倾向于高估自己所知的准确性；许多管理者的&quot;常识&quot;观点已被实证研究明确否定；商业媒体易被潮流主导，成功故事背后未必存在规律。结论：系统研究与EBM用来完善（而非取代）直觉。"},{"t":"专栏（传言还是科学）：走动式管理（management by walking around, MBWA）——惠普20世纪70年代首创，随1982年《追求卓越》为人熟知；多年研究表明MBWA并未普遍产生有效的管理实践。局限三条：可用小时数（管理者还要承担计划、组织、协调、控制，时间稀缺）；注意力（过多会议和走动挤占战略性思考时间）；实际应用（\"了解员工\"的主观判断不一定带来正确决策，需要客观数据）。补充：一项为期3年的研究表明，改进的走动式管理在安全监督场景可能显著提高安全性。结论：以建立信任和关系为重点的现代管理实践效果更好；但管理者应该真正了解员工，不能用四处走动代替真正的管理。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">专栏</strong>（传言还是科学）：走动式管理（management by walking around, MBWA）——惠普20世纪70年代首创，随1982年《追求卓越》为人熟知；多年研究表明MBWA并未普遍产生有效的管理实践。局限三条：可用小时数（管理者还要承担计划、组织、协调、控制，时间稀缺）；注意力（过多会议和走动挤占战略性思考时间）；实际应用（&quot;了解员工&quot;的主观判断不一定带来正确决策，需要客观数据）。补充：一项为期3年的研究表明，改进的走动式管理在安全监督场景可能显著提高安全性。结论：以建立信任和关系为重点的现代管理实践效果更好；但管理者应该真正了解员工，不能用四处走动代替真正的管理。"},{"t":"1.3.1 大数据","c":[{"t":"背景：商业大数据的应用基础起源于在线零售商的营销部门——亚马逊等追踪用户的浏览、购买、评价与页面展示等数据，识别既有持续性又有预测性的统计量，开发算法预测客户需求并指导采购决策。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：商业大数据的应用基础起源于在线零售商的营销部门——亚马逊等追踪用户的浏览、购买、评价与页面展示等数据，识别既有持续性又有预测性的统计量，开发算法预测客户需求并指导采购决策。"},{"t":"当前应用：数据分析的目的始终是预测事件（从图书购买到装备故障）、检测风险（火灾、贷款违约）、防止灾难（飞机失事、商品积压）；科技公司（谷歌、脸书）、订阅服务（网飞、优步）、保险公司、博物馆、在线零售商均依赖大数据；还有机构收集但不直接使用而出售数据（如克罗格将5500万会员卡客户的电子信息卖给供应商；推特每天向数据公司出售5亿条推文）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">当前应用</strong>：数据分析的目的始终是预测事件（从图书购买到装备故障）、检测风险（火灾、贷款违约）、防止灾难（飞机失事、商品积压）；科技公司（谷歌、脸书）、订阅服务（网飞、优步）、保险公司、博物馆、在线零售商均依赖大数据；还有机构收集但不直接使用而出售数据（如克罗格将5500万会员卡客户的电子信息卖给供应商；推特每天向数据公司出售5亿条推文）。"},{"t":"新趋势：用大数据理解、帮助和管理人员属相对较新的应用；一项针对中、德、印、英、美1万名员工的研究显示，员工预计下一次工作方式的转变将更多依赖技术进步；组织开始关注\"快速数据\"（可用于实时指导业务决策的可操作数据流）；大数据可帮助确定哪些员工活动与目标相关、纠正管理假设，并将更多用于有效决策（第6章）与人力资源管理（第17章）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">新趋势</strong>：用大数据理解、帮助和管理人员属相对较新的应用；一项针对中、德、印、英、美1万名员工的研究显示，员工预计下一次工作方式的转变将更多依赖技术进步；组织开始关注&quot;快速数据&quot;（可用于实时指导业务决策的可操作数据流）；大数据可帮助确定哪些员工活动与目标相关、纠正管理假设，并将更多用于有效决策（第6章）与人力资源管理（第17章）。"},{"t":"局限性：隐私问题突出（监测仪器采集海量个人数据，\"入侵是一个非常危险的斜坡\"）；电子监控短期内至少能改善任务绩效和公民行为，但可能得罪组织想影响的员工与顾客；人类行为反复无常、需要基于无数变量预测，大数据在预测事件、检测风险和防止灾难方面总有局限——管理不仅仅是数据的总和。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">局限性</strong>：隐私问题突出（监测仪器采集海量个人数据，&quot;入侵是一个非常危险的斜坡&quot;）；电子监控短期内至少能改善任务绩效和公民行为，但可能得罪组织想影响的员工与顾客；人类行为反复无常、需要基于无数变量预测，大数据在预测事件、检测风险和防止灾难方面总有局限——管理不仅仅是数据的总和。"},{"t":"结论与建议：不要完全放弃直觉，要尽可能多地利用证据来确认直觉和经验判断；社会物理学（social physics，亚历克斯•彭特兰提出）等更精细的数据收集与分析形式有助于减少天然偏见——这正是组织行为学的作用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论与建议</strong>：不要完全放弃直觉，要尽可能多地利用证据来确认直觉和经验判断；社会物理学（social physics，亚历克斯•彭特兰提出）等更精细的数据收集与分析形式有助于减少天然偏见——这正是组织行为学的作用。"}],"k":"b","i":1,"h":"1.3.1 大数据"}],"k":"sec","i":0,"h":"1.3 用系统研究完善直觉"},{"t":"1.4 对组织行为学有贡献的学科","c":[{"t":"总述：OB是一门应用性的行为科学，建立在众多行为学科分支之上；心理学主要贡献于个体和微观分析水平，其他学科帮助理解群体过程、组织等宏观概念。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总述</strong>：OB是一门应用性的行为科学，建立在众多行为学科分支之上；心理学主要贡献于个体和微观分析水平，其他学科帮助理解群体过程、组织等宏观概念。"},{"t":"心理学（psychology）：对人和动物的行为进行测量、解释（有时改变）的科学；学习理论家、人格理论家、咨询心理学家，尤其是工业和组织心理学家是主要贡献者；研究从早期关注疲劳、厌倦等工作条件因素，扩展到学习、知觉、人格、情绪、培训、领导有效性、需要和激励、工作满意度、决策过程、绩效评估、态度测量、员工甄选、工作设计和工作压力等。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">心理学</strong>（psychology）：对人和动物的行为进行测量、解释（有时改变）的科学；学习理论家、人格理论家、咨询心理学家，尤其是工业和组织心理学家是主要贡献者；研究从早期关注疲劳、厌倦等工作条件因素，扩展到学习、知觉、人格、情绪、培训、领导有效性、需要和激励、工作满意度、决策过程、绩效评估、态度测量、员工甄选、工作设计和工作压力等。"},{"t":"社会心理学（social psychology）：心理学和社会学相结合的产物，关注人与人之间的相互影响；主要贡献领域：变革（如何实施变革、如何减少变革阻力）、态度的测量/理解和改变、沟通模式确认、信任建立，以及对群体行为、权力和冲突的研究。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">社会心理学</strong>（social psychology）：心理学和社会学相结合的产物，关注人与人之间的相互影响；主要贡献领域：变革（如何实施变革、如何减少变革阻力）、态度的测量/理解和改变、沟通模式确认、信任建立，以及对群体行为、权力和冲突的研究。"},{"t":"社会学（sociology）：研究与社会环境或文化相联系的人（区别于关注个体的心理学）；最大贡献是组织中群体行为的研究，特别是正式和复杂的组织；还为组织文化、正式组织的理论与结构、组织技术、沟通、权力和冲突等提供有价值的信息。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">社会学</strong>（sociology）：研究与社会环境或文化相联系的人（区别于关注个体的心理学）；最大贡献是组织中群体行为的研究，特别是正式和复杂的组织；还为组织文化、正式组织的理论与结构、组织技术、沟通、权力和冲突等提供有价值的信息。"},{"t":"人类学（anthropology）：通过研究社会以了解人类及其活动；对文化和环境的研究帮助理解不同国家、不同组织中的人在基本价值观、态度和行为上的差异；我们对组织文化、组织氛围和民族文化差异的认识大多来自人类学家的研究或人类学方法。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">人类学</strong>（anthropology）：通过研究社会以了解人类及其活动；对文化和环境的研究帮助理解不同国家、不同组织中的人在基本价值观、态度和行为上的差异；我们对组织文化、组织氛围和民族文化差异的认识大多来自人类学家的研究或人类学方法。"}],"k":"sec","i":0,"h":"1.4 对组织行为学有贡献的学科"},{"t":"1.5 组织行为学中没有绝对的真理","c":[{"t":"对比自然科学：化学、天文学、物理学等存在稳定一致、适用范围广的定律（可计算地心引力、把宇航员送上太空）；人类是复杂的，几乎没有简单而普适的原理能解释组织行为——同样情境下两个人的表现常常大不相同，同一个人在不同情境下行为也会变化（并非人人追求金钱；人在宗教仪式和聚会中的行为相去甚远）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对比自然科学</strong>：化学、天文学、物理学等存在稳定一致、适用范围广的定律（可计算地心引力、把宇航员送上太空）；人类是复杂的，几乎没有简单而普适的原理能解释组织行为——同样情境下两个人的表现常常大不相同，同一个人在不同情境下行为也会变化（并非人人追求金钱；人在宗教仪式和聚会中的行为相去甚远）。"},{"t":"权变思想：OB的概念或理论必须反映情境或权变条件——\"x导致y，但只能在z所限定的条件下\"，其中z即权变变量（contingency variable）；OB通过把一般性概念和理论加以调整，再应用到特定情境、个人和群体中而发展起来。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">权变思想</strong>：OB的概念或理论必须反映情境或权变条件——&quot;x导致y，但只能在z所限定的条件下&quot;，其中z即权变变量（contingency variable）；OB通过把一般性概念和理论加以调整，再应用到特定情境、个人和群体中而发展起来。"},{"t":"示例：避免断言\"每个人都喜欢复杂且具有挑战性的工作\"——有人喜欢常规简单的工作胜过复杂多变的工作，工作的吸引力因人而异；通常既能发现一般性规律（金钱确实有能力影响我们大多数人），也能发现影响的偶然性（有些人更易受金钱激励，有些情境下金钱比其他因素更有力）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">示例</strong>：避免断言&quot;每个人都喜欢复杂且具有挑战性的工作&quot;——有人喜欢常规简单的工作胜过复杂多变的工作，工作的吸引力因人而异；通常既能发现一般性规律（金钱确实有能力影响我们大多数人），也能发现影响的偶然性（有些人更易受金钱激励，有些情境下金钱比其他因素更有力）。"}],"k":"sec","i":0,"h":"1.5 组织行为学中没有绝对的真理"},{"t":"1.6 挑战与机遇","c":[{"t":"总起：理解OB对管理者从未像现在这样重要——\"典型的员工\"年龄越来越大、劳动力越来越多元化、全球竞争要求员工更灵活；就业选择日益多样（就业状况、类型、地点、条件、薪酬等维度，如全职/兼职、固定/弹性时间、虚拟办公、独立合同工等，个人可与组织协商组合）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总起</strong>：理解OB对管理者从未像现在这样重要——&quot;典型的员工&quot;年龄越来越大、劳动力越来越多元化、全球竞争要求员工更灵活；就业选择日益多样（就业状况、类型、地点、条件、薪酬等维度，如全职/兼职、固定/弹性时间、虚拟办公、独立合同工等，个人可与组织协商组合）。"},{"t":"经济压力：2008年经济大衰退带来全球性裁员、减薪与失业；繁荣时期\"如何奖励和留住员工\"更重要，艰难时期\"如何处理压力、做出决策和积极应对\"更重要；管理好坏是盈利与亏损、企业生存与倒闭的差别。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">经济压力</strong>：2008年经济大衰退带来全球性裁员、减薪与失业；繁荣时期&quot;如何奖励和留住员工&quot;更重要，艰难时期&quot;如何处理压力、做出决策和积极应对&quot;更重要；管理好坏是盈利与亏损、企业生存与倒闭的差别。"},{"t":"持续全球化：组织不再受国界制约（三星产品销往他国、汉堡王归英国公司所有、麦当劳在118个以上国家和地区销售、苹果海外雇员为美国境内两倍、各大汽车厂商跨国生产）；管理者面临的四个具体问题：日益增多的海外任务（需了解当地文化与员工队伍、证明文化敏感性）、与不同文化背景的人共事（识别文化与背景如何塑造他人、调整管理风格）、关注低劳动力成本国家的就业趋势（平衡组织利益与社区责任的棘手工作）、适应不同的文化和监管规范（了解当地法律法规以避免违规风险）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">持续全球化</strong>：组织不再受国界制约（三星产品销往他国、汉堡王归英国公司所有、麦当劳在118个以上国家和地区销售、苹果海外雇员为美国境内两倍、各大汽车厂商跨国生产）；管理者面临的四个具体问题：日益增多的海外任务（需了解当地文化与员工队伍、证明文化敏感性）、与不同文化背景的人共事（识别文化与背景如何塑造他人、调整管理风格）、关注低劳动力成本国家的就业趋势（平衡组织利益与社区责任的棘手工作）、适应不同的文化和监管规范（了解当地法律法规以避免违规风险）。"},{"t":"劳动力人口特征：劳动力总是与经济、寿命与出生率、社会经济条件相适应（长期失业者离开劳动力市场、身兼数职、按需工作、职业培训、创业等）；自1990年以来全球人均寿命延长6年，发达国家出生率下降，共同导致劳动力高龄化——OB有助于解释这对态度、组织文化、领导力、结构和沟通意味着什么；女性劳动力比例持续上升，如何改善其工作条件是重要议题。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">劳动力人口特征</strong>：劳动力总是与经济、寿命与出生率、社会经济条件相适应（长期失业者离开劳动力市场、身兼数职、按需工作、职业培训、创业等）；自1990年以来全球人均寿命延长6年，发达国家出生率下降，共同导致劳动力高龄化——OB有助于解释这对态度、组织文化、领导力、结构和沟通意味着什么；女性劳动力比例持续上升，如何改善其工作条件是重要议题。"},{"t":"劳动力多元化：员工在性别、年龄、种族、民族、性取向等方面日益多元，是全球关注的问题；管理者须回答：如何平衡组织内差异以获得竞争优势？一视同仁还是识别个体与文化差异？各国法律规定是什么？多元化有意义吗？（详见第2章）","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">劳动力多元化</strong>：员工在性别、年龄、种族、民族、性取向等方面日益多元，是全球关注的问题；管理者须回答：如何平衡组织内差异以获得竞争优势？一视同仁还是识别个体与文化差异？各国法律规定是什么？多元化有意义吗？（详见第2章）"},{"t":"顾客服务：服务类员工（技术支持、销售、护士、顾问、理财规划师等）的共同点是与客户大量互动；OB可阐释员工的态度和行为如何影响客户满意度，帮助管理者建立回应顾客需要的文化——员工与客户建立融洽关系、让客户放松、展示真诚兴趣、对顾客个人情况保持敏感。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">顾客服务</strong>：服务类员工（技术支持、销售、护士、顾问、理财规划师等）的共同点是与客户大量互动；OB可阐释员工的态度和行为如何影响客户满意度，帮助管理者建立回应顾客需要的文化——员工与客户建立融洽关系、让客户放松、展示真诚兴趣、对顾客个人情况保持敏感。"},{"t":"人际交往技能：OB提供新概念与理论帮助解释和预测工作中个人行为，并提供可运用的技能——设计激发积极性的工作、提高管理技能、建设高效团队。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">人际交往技能</strong>：OB提供新概念与理论帮助解释和预测工作中个人行为，并提供可运用的技能——设计激发积极性的工作、提高管理技能、建设高效团队。"},{"t":"网络化组织：人们相隔千里也能沟通协作，可远程办公、成为独立合同工（软件工程师、平面设计师、系统分析师等）；通过\"在线\"方式激励和领导、做群体决策需要不同技术，管理者需开发新的管理技能。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">网络化组织</strong>：人们相隔千里也能沟通协作，可远程办公、成为独立合同工（软件工程师、平面设计师、系统分析师等）；通过&quot;在线&quot;方式激励和领导、做群体决策需要不同技术，管理者需开发新的管理技能。"},{"t":"社交媒体：社交媒体普遍存在，组织面临员工使用社交媒体的管理难题（因推文被解雇的案例；招聘中能否浏览应聘者社交媒体；工作中访问社交媒体的规定）；社交媒体也会影响员工幸福感（频繁使用者报告生活满意度下降）——对OB既是挑战也是机会（另见第3、4、11章）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">社交媒体</strong>：社交媒体普遍存在，组织面临员工使用社交媒体的管理难题（因推文被解雇的案例；招聘中能否浏览应聘者社交媒体；工作中访问社交媒体的规定）；社交媒体也会影响员工幸福感（频繁使用者报告生活满意度下降）——对OB既是挑战也是机会（另见第3、4、11章）。"},{"t":"员工工作幸福感：工作场所已延伸到任何有电脑或智能手机之处；挑战包括虚拟员工的归属感缺失（\"在网络空间里孤军奋战\"）、超时工作（1/4的员工表现出倦怠迹象，2/3感受到高压和疲劳，\"随叫随到\"）；56%的员工认为工作与生活的平衡决定事业成功，比金钱、认可和自主权更重要；无法帮助员工实现平衡的组织越来越难吸引并留住有能力和积极性的人。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">员工工作幸福感</strong>：工作场所已延伸到任何有电脑或智能手机之处；挑战包括虚拟员工的归属感缺失（&quot;在网络空间里孤军奋战&quot;）、超时工作（1/4的员工表现出倦怠迹象，2/3感受到高压和疲劳，&quot;随叫随到&quot;）；56%的员工认为工作与生活的平衡决定事业成功，比金钱、认可和自主权更重要；无法帮助员工实现平衡的组织越来越难吸引并留住有能力和积极性的人。"},{"t":"积极的工作环境：积极组织学术研究（positive organizational scholarship，也称积极组织行为）研究组织如何发展人力优势、培养活力和适应力、释放潜力；其认为太多OB研究聚焦于问题，转向研究组织和员工好的一面；关键主题包括参与、希望、乐观和对紧张的适应力；\"反射性最佳自我\"（reflected best-self）概念主张关注并开发员工长处而非只盯着不足；组织开始聘用文化官塑造公司个性（组织文化见第16章）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">积极的工作环境</strong>：积极组织学术研究（positive organizational scholarship，也称积极组织行为）研究组织如何发展人力优势、培养活力和适应力、释放潜力；其认为太多OB研究聚焦于问题，转向研究组织和员工好的一面；关键主题包括参与、希望、乐观和对紧张的适应力；&quot;反射性最佳自我&quot;（reflected best-self）概念主张关注并开发员工长处而非只盯着不足；组织开始聘用文化官塑造公司个性（组织文化见第16章）。"},{"t":"道德行为：削减开支、提高生产率、激烈竞争使不少员工走捷径、违反规则；组织成员日益面临道德困境（ethical dilemma）和道德抉择（ethical choice）——是否揭发违规、是否遵从不认可的命令、晋升中能否耍政治手腕；正确与错误的界限日益模糊，不同文化对道德问题视角不同；管理者需创造符合道德标准的氛围：倡导道德使命、鼓励诚信行为、提供强有力的道德领导、持续开展道德培训。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">道德行为</strong>：削减开支、提高生产率、激烈竞争使不少员工走捷径、违反规则；组织成员日益面临道德困境（ethical dilemma）和道德抉择（ethical choice）——是否揭发违规、是否遵从不认可的命令、晋升中能否耍政治手腕；正确与错误的界限日益模糊，不同文化对道德问题视角不同；管理者需创造符合道德标准的氛围：倡导道德使命、鼓励诚信行为、提供强有力的道德领导、持续开展道德培训。"},{"t":"专栏（道德抉择）：\"我一直想要的假期\"——许多人积攒大量假期不用（\"缺假综合征\"），长期高压导致疲惫、成就感降低、旷工增多；六条应对建议：正视感受、在累垮前提早发现趋势、说出压力来源、投入高强度的体育活动、短暂休息、真正休假（远离工作事务）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">专栏</strong>（道德抉择）：&quot;我一直想要的假期&quot;——许多人积攒大量假期不用（&quot;缺假综合征&quot;），长期高压导致疲惫、成就感降低、旷工增多；六条应对建议：正视感受、在累垮前提早发现趋势、说出压力来源、投入高强度的体育活动、短暂休息、真正休假（远离工作事务）。"}],"k":"sec","i":0,"h":"1.6 挑战与机遇"},{"t":"1.7 变得有吸引力：开发组织行为学模型","c":[{"t":"模型（model）：对现实的一种抽象概括，是对真实世界中某些现象的简化表征。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">模型</strong>（model）：对现实的一种抽象概括，是对真实世界中某些现象的简化表征。"},{"t":"OB基本模型框架（图表1-5）：三种变量类型——输入、过程、输出；三个层次的分析水平——个体、群体、组织；输入导致过程，过程导致输出；输出也可能影响未来的输入（突出OB方案对组织未来的广泛影响）；本书按个体（第2—8章）、群体（第9—14章）、组织系统（第15—18章）三个层次展开。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">OB基本模型框架</strong>（图表1-5）：三种变量类型——输入、过程、输出；三个层次的分析水平——个体、群体、组织；输入导致过程，过程导致输出；输出也可能影响未来的输入（突出OB方案对组织未来的广泛影响）；本书按个体（第2—8章）、群体（第9—14章）、组织系统（第15—18章）三个层次展开。"},{"t":"输入（input）：能够引起过程的变量，决定接下来组织中会发生什么；很多在雇佣关系存在前就已确立（个体多元化特征、人格与价值观由基因遗传和成长环境共同塑造；群体结构、群体角色、团队责任在群体形成前后确立；组织结构与文化经多年发展和变革形成）。","c":[{"t":"个体水平：多元化；人格与价值观。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个体水平</strong>：多元化；人格与价值观。"},{"t":"群体水平：群体结构；群体角色；团队责任。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">群体水平</strong>：群体结构；群体角色；团队责任。"},{"t":"组织水平：结构；文化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织水平</strong>：结构；文化。"}],"k":"b","i":1,"h":"<strong class=\"lead\">输入</strong>（input）：能够引起过程的变量，决定接下来组织中会发生什么；很多在雇佣关系存在前就已确立（个体多元化特征、人格与价值观由基因遗传和成长环境共同塑造；群体结构、群体角色、团队责任在群体形成前后确立；组织结构与文化经多年发展和变革形成）。"},{"t":"过程（process）：如果输入是OB中的名词，过程就是动词——个体、群体和组织参与的活动，由输入引起，最终带来输出。","c":[{"t":"个体水平：情绪和心境；动机；知觉；决策。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个体水平</strong>：情绪和心境；动机；知觉；决策。"},{"t":"群体水平：沟通；领导；权力与政治；冲突与谈判。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">群体水平</strong>：沟通；领导；权力与政治；冲突与谈判。"},{"t":"组织水平：人力资源管理；变革实践。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织水平</strong>：人力资源管理；变革实践。"}],"k":"b","i":1,"h":"<strong class=\"lead\">过程</strong>（process）：如果输入是OB中的名词，过程就是动词——个体、群体和组织参与的活动，由输入引起，最终带来输出。"},{"t":"输出（outcome）：想要解释或预测的关键变量，受其他变量影响。","c":[{"t":"个体水平：","c":[{"t":"态度与压力：态度是对人、事、物的积极或消极评价；压力（stress）是对环境中压力源做出反应的心理体验；态度往往影响行为，行为与组织效能直接相关——满意的员工生产率更高，只有当员工受到公平对待、对工作更满意时，才更愿意表现出公民行为。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">态度与压力</strong>：态度是对人、事、物的积极或消极评价；压力（stress）是对环境中压力源做出反应的心理体验；态度往往影响行为，行为与组织效能直接相关——满意的员工生产率更高，只有当员工受到公平对待、对工作更满意时，才更愿意表现出公民行为。"},{"t":"任务绩效（task performance）：个体完成核心工作任务的效果和效率；因岗位而异（工人按产量与质量、教师按学生所受的教育、顾问按报告的及时性与质量衡量），与工作核心任务和正式职位说明直接相关；是提高组织有效性最重要的一种人力输出。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">任务绩效</strong>（task performance）：个体完成核心工作任务的效果和效率；因岗位而异（工人按产量与质量、教师按学生所受的教育、顾问按报告的及时性与质量衡量），与工作核心任务和正式职位说明直接相关；是提高组织有效性最重要的一种人力输出。"},{"t":"组织公民行为（organizational citizenship behavior, OCB）：员工自觉从事、不包含在正式工作要求中、但会给工作场所心理和社会环境带来有利影响的行为——帮助团队其他成员、主动多做工作、避开不必要的冲突、恪尽职守、从容应对工作中的小麻烦；拥有这类员工的组织业绩更出色。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">组织公民行为</strong>（organizational citizenship behavior, OCB）：员工自觉从事、不包含在正式工作要求中、但会给工作场所心理和社会环境带来有利影响的行为——帮助团队其他成员、主动多做工作、避开不必要的冲突、恪尽职守、从容应对工作中的小麻烦；拥有这类员工的组织业绩更出色。"},{"t":"退缩行为（withdrawal behavior）：员工采取的一系列脱离组织的行为，形式从迟到、不参加会议到缺勤、离职；缺勤与离职都造成严重损失（计划外缺勤给美国雇主平均造成工资8.7%的直接损失；瑞典任何时候平均有10%的员工因病缺勤）；美国2014年人员流失率约40%（月均约3%），其中约一半是员工自愿辞职、约35%是裁员和解雇、其余是辞退等其他原因；适度人员流失不全是坏事（可带来更高技能和动机的人、更多新想法，提高组织灵活性）——关键是评估哪些员工离职及其原因；退缩行为的成因包括消极的工作态度、情绪、心境以及与同事和主管的消极互动。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">退缩行为</strong>（withdrawal behavior）：员工采取的一系列脱离组织的行为，形式从迟到、不参加会议到缺勤、离职；缺勤与离职都造成严重损失（计划外缺勤给美国雇主平均造成工资8.7%的直接损失；瑞典任何时候平均有10%的员工因病缺勤）；美国2014年人员流失率约40%（月均约3%），其中约一半是员工自愿辞职、约35%是裁员和解雇、其余是辞退等其他原因；适度人员流失不全是坏事（可带来更高技能和动机的人、更多新想法，提高组织灵活性）——关键是评估哪些员工离职及其原因；退缩行为的成因包括消极的工作态度、情绪、心境以及与同事和主管的消极互动。"}],"k":"b","i":2,"h":"<strong class=\"lead\">个体水平</strong>："},{"t":"群体水平：","c":[{"t":"群体凝聚力（group cohesion）：群体成员间的相互支持和认可，即群体的团结程度；大量证据表明有凝聚力的群体更高效（实验室与实际工作团队中均如此）；企业通过破冰会议、野餐、派对、户外冒险等社交活动增强凝聚力，也可在组建团队之初挑选合适的人。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">群体凝聚力</strong>（group cohesion）：群体成员间的相互支持和认可，即群体的团结程度；大量证据表明有凝聚力的群体更高效（实验室与实际工作团队中均如此）；企业通过破冰会议、野餐、派对、户外冒险等社交活动增强凝聚力，也可在组建团队之初挑选合适的人。"},{"t":"群体功效（group functioning）：一个群体工作的数量和质量；不等于个体任务绩效的简单相加（如同球队不是运动员个人表现的加总）；有效群体因组织而异——专注核心任务完成目标、合作提供优秀客户服务、或具备创造力与灵活适应环境的能力。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">群体功效</strong>（group functioning）：一个群体工作的数量和质量；不等于个体任务绩效的简单相加（如同球队不是运动员个人表现的加总）；有效群体因组织而异——专注核心任务完成目标、合作提供优秀客户服务、或具备创造力与灵活适应环境的能力。"}],"k":"b","i":2,"h":"<strong class=\"lead\">群体水平</strong>："},{"t":"组织水平：","c":[{"t":"生产率（productivity）：组织以最低成本的投入将输入转化成输出实现目标；要求既有效果（effectiveness，达成目标）又有效率（efficiency，低成本实现）；常见衡量方式包括投资回报率、每一美元的销售利润、每小时劳动产出；服务组织评估有效性必须考虑客户需求——从员工的态度与行为到客户的态度和盈利能力存在明确的因果链条（酒店研究：消极的员工态度降低客户满意度并最终损害盈利能力）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">生产率</strong>（productivity）：组织以最低成本的投入将输入转化成输出实现目标；要求既有效果（effectiveness，达成目标）又有效率（efficiency，低成本实现）；常见衡量方式包括投资回报率、每一美元的销售利润、每小时劳动产出；服务组织评估有效性必须考虑客户需求——从员工的态度与行为到客户的态度和盈利能力存在明确的因果链条（酒店研究：消极的员工态度降低客户满意度并最终损害盈利能力）。"},{"t":"生存（organizational survival）：组织能够长期存在并发展下去的证据；不仅取决于生产率，还取决于对环境的适应能力——准确预知市场、在正确的时间以正确的方式抓住机会、管理变革以适应新业务状况。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">生存</strong>（organizational survival）：组织能够长期存在并发展下去的证据；不仅取决于生产率，还取决于对环境的适应能力——准确预知市场、在正确的时间以正确的方式抓住机会、管理变革以适应新业务状况。"}],"k":"b","i":2,"h":"<strong class=\"lead\">组织水平</strong>："}],"k":"b","i":1,"h":"<strong class=\"lead\">输出</strong>（outcome）：想要解释或预测的关键变量，受其他变量影响。"},{"t":"本书结构（图表1-6）：按个体、群体、组织三种水平将输入、过程、输出重组对应各章——个体：多元化（第2章）、人格与价值观（第5章）、态度（第3章）与压力（第18章）、情绪与心境（第4章）、知觉与个体决策（第6章）、动机（第7—8章）、任务绩效与公民行为、退缩行为（贯穿全书）；群体：群体结构、角色、团队责任与凝聚力、群体功效（第9—10章）、沟通（第11章）、领导（第12章）、权力与政治（第13章）、冲突与谈判（第14章）；组织：结构（第15章）、文化（第16章）、人力资源管理（第17章）、变革实践（第18章）、生产率与生存（贯穿全书）；每一种水平建立在前面水平基础上，按顺序分析一遍即可了解组织中的人如何运作。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本书结构</strong>（图表1-6）：按个体、群体、组织三种水平将输入、过程、输出重组对应各章——个体：多元化（第2章）、人格与价值观（第5章）、态度（第3章）与压力（第18章）、情绪与心境（第4章）、知觉与个体决策（第6章）、动机（第7—8章）、任务绩效与公民行为、退缩行为（贯穿全书）；群体：群体结构、角色、团队责任与凝聚力、群体功效（第9—10章）、沟通（第11章）、领导（第12章）、权力与政治（第13章）、冲突与谈判（第14章）；组织：结构（第15章）、文化（第16章）、人力资源管理（第17章）、变革实践（第18章）、生产率与生存（贯穿全书）；每一种水平建立在前面水平基础上，按顺序分析一遍即可了解组织中的人如何运作。"},{"t":"本章小结并入：管理者要有效工作必须提高人际技能；OB探讨个体、群体和结构对组织内部行为的影响，并运用这些知识使组织运作更有效。对管理者的启示（逐条）：不要过分依赖归纳——要了解这个人、弄清事情的背景；利用指标而不是直觉来解释因果关系；加强人际交往能力以提高领导潜能；通过培训和了解OB当前趋势（如大数据和快速数据）提高技术技能与概念技能；OB告诉你如何赋予员工权力、设计并实施变革计划、提高客户服务水平、帮助员工解决工作与生活的冲突，从而提高工作质量和生产率。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章小结并入</strong>：管理者要有效工作必须提高人际技能；OB探讨个体、群体和结构对组织内部行为的影响，并运用这些知识使组织运作更有效。对管理者的启示（逐条）：不要过分依赖归纳——要了解这个人、弄清事情的背景；利用指标而不是直觉来解释因果关系；加强人际交往能力以提高领导潜能；通过培训和了解OB当前趋势（如大数据和快速数据）提高技术技能与概念技能；OB告诉你如何赋予员工权力、设计并实施变革计划、提高客户服务水平、帮助员工解决工作与生活的冲突，从而提高工作质量和生产率。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">1.7 变得有吸引力</strong>：开发组织行为学模型"},{"t":"1.8 就业技能","c":[{"t":"为什么重要：与OB相关的挑战几乎发生在企业每一个职能部门；回顾研究表明OB是解决许多问题的关键——管理诚信/社会责任、资源管理、企业间竞争、客户与员工忠诚度、减少不确定性、遵守政府法规、管理风险、找到合适的员工；OB不仅与商科相关，对所有专业学生都重要（微生物、护理、计算机专业学生的求职与职场协作均受益），也能帮助你在课堂与同学、教授的互动中取得成功。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">为什么重要</strong>：与OB相关的挑战几乎发生在企业每一个职能部门；回顾研究表明OB是解决许多问题的关键——管理诚信/社会责任、资源管理、企业间竞争、客户与员工忠诚度、减少不确定性、遵守政府法规、管理风险、找到合适的员工；OB不仅与商科相关，对所有专业学生都重要（微生物、护理、计算机专业学生的求职与职场协作均受益），也能帮助你在课堂与同学、教授的互动中取得成功。"},{"t":"核心观点：\"人决定地方\"（本杰明•施耐德）——人的行为、差异、态度、情感、情绪、个性、价值观、意图、思想和动机与工作场所的生活密不可分；这些过程不可避免地涉及领导、政治、冲突和谈判；新入职员工和在职专业人员都会因扎实的OB基础技能而受益，包括沟通、合作、批判性思维、解决问题、社会责任、知识应用与分析。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">核心观点</strong>：&quot;人决定地方&quot;（本杰明•施耐德）——人的行为、差异、态度、情感、情绪、个性、价值观、意图、思想和动机与工作场所的生活密不可分；这些过程不可避免地涉及领导、政治、冲突和谈判；新入职员工和在职专业人员都会因扎实的OB基础技能而受益，包括沟通、合作、批判性思维、解决问题、社会责任、知识应用与分析。"},{"t":"1.8.1 适用于各种专业的就业技能（五种，逐条）：","c":[{"t":"批判性思维（critical thinking）：一种有目的和目标导向的思维，用来确定和解决问题，并就特定情况做出决定或形成判断；涉及认知、元认知和性格因素，在特定情况下有不同应用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">批判性思维</strong>（critical thinking）：一种有目的和目标导向的思维，用来确定和解决问题，并就特定情况做出决定或形成判断；涉及认知、元认知和性格因素，在特定情况下有不同应用。"},{"t":"沟通（communication）：为多种目的（告知、指导、激励、说服、分享想法）有效使用口头、书面或非语言交流技能；包括有效倾听、利用技术进行沟通、评价沟通的有效性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">沟通</strong>（communication）：为多种目的（告知、指导、激励、说服、分享想法）有效使用口头、书面或非语言交流技能；包括有效倾听、利用技术进行沟通、评价沟通的有效性。"},{"t":"合作（collaboration）：个体积极共同完成一项任务，通过对话和谈判构建群体的意义和知识，最终形成反映共同、相互依赖行动的产品。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">合作</strong>（collaboration）：个体积极共同完成一项任务，通过对话和谈判构建群体的意义和知识，最终形成反映共同、相互依赖行动的产品。"},{"t":"知识应用与分析（knowledge application and analysis）：学习一个概念后在其他环境中恰当应用该知识，以达到更高理解水平的能力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">知识应用与分析</strong>（knowledge application and analysis）：学习一个概念后在其他环境中恰当应用该知识，以达到更高理解水平的能力。"},{"t":"社会责任（social responsibility）：与商业伦理和企业社会责任有关的技能——商业伦理是影响个人和组织在社会中行为方式的一套指导原则；企业社会责任要求组织理解、识别并消除不道德的经济、环境和社会行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社会责任</strong>（social responsibility）：与商业伦理和企业社会责任有关的技能——商业伦理是影响个人和组织在社会中行为方式的一套指导原则；企业社会责任要求组织理解、识别并消除不道德的经济、环境和社会行为。"}],"k":"b","i":1,"h":"<strong class=\"lead\">1.8.1 适用于各种专业的就业技能</strong>（五种，逐条）："},{"t":"就业技能矩阵（employ-ability skills matrix, ESM）：本书每章开头的框架，把五种就业技能与各章栏目（传言还是科学、职业目标、道德抉择、观点碰撞、体验练习、道德困境、案例分析）联系起来；建议阅读各章前先复习ESM，以了解该章将学到的技能；这五项技能是在OB及其他专业相关事业中取得成功的关键。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">就业技能矩阵</strong>（employ-ability skills matrix, ESM）：本书每章开头的框架，把五种就业技能与各章栏目（传言还是科学、职业目标、道德抉择、观点碰撞、体验练习、道德困境、案例分析）联系起来；建议阅读各章前先复习ESM，以了解该章将学到的技能；这五项技能是在OB及其他专业相关事业中取得成功的关键。"}],"k":"sec","i":0,"h":"1.8 就业技能"}],"k":"chap","h":"第1章 什么是组织行为学"}],"k":"part","h":"第Ⅰ篇 简介","col":"#4f6df5","pc":"p1"},{"t":"第Ⅱ篇 个体","c":[{"t":"本书定位：《组织行为学》（Organizational Behavior，第18版），斯蒂芬•罗宾斯（Stephen P. Robbins）与蒂莫西•贾奇（Timothy A. Judge）著，孙健敏、朱曦济、李原译；被视为组织行为学教学用书的权威标准，自20世纪90年代引进我国以来深受管理学界与企业界好评。","c":[],"k":"sec","i":0,"h":"<strong class=\"lead\">本书定位</strong>：《组织行为学》（Organizational Behavior，第18版），斯蒂芬•罗宾斯（Stephen P. Robbins）与蒂莫西•贾奇（Timothy A. Judge）著，孙健敏、朱曦济、李原译；被视为组织行为学教学用书的权威标准，自20世纪90年代引进我国以来深受管理学界与企业界好评。"},{"t":"版本节奏：英文版两年一更新，中文版每四年更新一次（选偶数版），兼顾内容连贯性与读者经济负担。","c":[],"k":"sec","i":0,"h":"<strong class=\"lead\">版本节奏</strong>：英文版两年一更新，中文版每四年更新一次（选偶数版），兼顾内容连贯性与读者经济负担。"},{"t":"第18版主要变化（据前言与译者序）：","c":[{"t":"每章引入新的开篇案例，介绍当前商业趋势与前沿事件；章首与章末案例大部分更新，突出组织行为学与当前组织管理的关联。","c":[],"k":"b","i":1,"h":"每章引入新的开篇案例，介绍当前商业趋势与前沿事件；章首与章末案例大部分更新，突出组织行为学与当前组织管理的关联。"},{"t":"每章新增\"就业技能矩阵\"（Employ-ability Skills Matrix, ESM），为学生开发雇主看重的技能提供指南，帮助其从课程一开始就看到课程与职业目标的相关性。","c":[],"k":"b","i":1,"h":"每章新增&quot;就业技能矩阵&quot;（Employ-ability Skills Matrix, ESM），为学生开发雇主看重的技能提供指南，帮助其从课程一开始就看到课程与职业目标的相关性。"},{"t":"每章新增反映最新研究成果的内容，主题包括：外派人员调整、工作丰富化、越轨和反生产工作行为、不同的声音、虐待性监督、客户满意度、执行董事会组成、情绪劳动、氛围、正念、高绩效工作系统、失业/求职、人力资本资源、行为伦理、睡眠不足、义务论、恢复精力、第三方不公平模型、工作需求等。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">每章新增反映最新研究成果的内容，主题包括</strong>：外派人员调整、工作丰富化、越轨和反生产工作行为、不同的声音、虐待性监督、客户满意度、执行董事会组成、情绪劳动、氛围、正念、高绩效工作系统、失业/求职、人力资本资源、行为伦理、睡眠不足、义务论、恢复精力、第三方不公平模型、工作需求等。"},{"t":"具体章节的新增：第1章增加就业内容；第5章新增\"人格、求职和失业\"；第7章新增\"公正理论/组织公平\"与\"工作投入\"两节；第8章新增\"工作再设计\"与\"替代性工作安排方案\"两节；全书增加创建学习型组织、激发创新文化等内容。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">具体章节的新增</strong>：第1章增加就业内容；第5章新增&quot;人格、求职和失业&quot;；第7章新增&quot;公正理论/组织公平&quot;与&quot;工作投入&quot;两节；第8章新增&quot;工作再设计&quot;与&quot;替代性工作安排方案&quot;两节；全书增加创建学习型组织、激发创新文化等内容。"},{"t":"部分章节实质性修改或更新了章末材料；每章参考文献全部更新。","c":[],"k":"b","i":1,"h":"部分章节实质性修改或更新了章末材料；每章参考文献全部更新。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">第18版主要变化</strong>（据前言与译者序）："},{"t":"全书四篇十八章结构：","c":[{"t":"第I篇 简介（第1章）：什么是组织行为学——人际技能、管理与OB、系统研究、贡献学科、OB模型与就业技能。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第I篇 简介</strong>（第1章）：什么是组织行为学——人际技能、管理与OB、系统研究、贡献学科、OB模型与就业技能。"},{"t":"第II篇 个体（第2—8章）：组织中的多元化；态度与工作满意度；情绪与心境；人格与价值观；知觉与个体决策；动机概念；动机：从概念到应用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第II篇 个体</strong>（第2—8章）：组织中的多元化；态度与工作满意度；情绪与心境；人格与价值观；知觉与个体决策；动机概念；动机：从概念到应用。"},{"t":"第III篇 群体（第9—14章）：群体行为的基础；理解工作团队；沟通；领导；权力与政治；冲突与谈判。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第III篇 群体</strong>（第9—14章）：群体行为的基础；理解工作团队；沟通；领导；权力与政治；冲突与谈判。"},{"t":"第IV篇 组织系统（第15—18章）：组织结构的基础；组织文化；人力资源政策与实践；组织变革与压力管理。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第IV篇 组织系统</strong>（第15—18章）：组织结构的基础；组织文化；人力资源政策与实践；组织变革与压力管理。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">全书四篇十八章结构</strong>："},{"t":"编写特色：","c":[{"t":"写作风格娓娓道来、深入浅出；引用最新发表的学术研究成果，兼顾可读性、趣味性与科学性、严谨性。","c":[],"k":"b","i":1,"h":"写作风格娓娓道来、深入浅出；引用最新发表的学术研究成果，兼顾可读性、趣味性与科学性、严谨性。"},{"t":"章内设有多种固定栏目（传言还是科学、职业目标、道德抉择、观点碰撞、体验练习、道德困境、案例分析等），与就业技能矩阵配合使用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">章内设有多种固定栏目</strong>（传言还是科学、职业目标、道德抉择、观点碰撞、体验练习、道德困境、案例分析等），与就业技能矩阵配合使用。"},{"t":"配套教学资源：教师手册、试题库、考试编制软件、PPT等（经Pearson官网获取）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">配套教学资源</strong>：教师手册、试题库、考试编制软件、PPT等（经Pearson官网获取）。"},{"t":"适用对象：高校本科生、研究生、MBA学员及相关专业学位人员，也可作为企业管理人员在职学习和培训用书。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">适用对象</strong>：高校本科生、研究生、MBA学员及相关专业学位人员，也可作为企业管理人员在职学习和培训用书。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">编写特色</strong>："},{"t":"第2章 组织中的多元化","c":[{"t":"学习目标","c":[{"t":"1．描述工作场所多元化的两种主要形式。","c":[],"k":"b","i":1,"h":"1．描述工作场所多元化的两种主要形式。"},{"t":"2．说明工作场所中的歧视如何降低组织有效性。","c":[],"k":"b","i":1,"h":"2．说明工作场所中的歧视如何降低组织有效性。"},{"t":"3．描述关键的传记特征与组织行为之间的关系。","c":[],"k":"b","i":1,"h":"3．描述关键的传记特征与组织行为之间的关系。"},{"t":"4．解释其他差异特征是如何影响组织行为的。","c":[],"k":"b","i":1,"h":"4．解释其他差异特征是如何影响组织行为的。"},{"t":"5．论证智力能力与体质能力与组织行为之间的关系。","c":[],"k":"b","i":1,"h":"5．论证智力能力与体质能力与组织行为之间的关系。"},{"t":"6．描述组织如何有效管理多元化。","c":[],"k":"b","i":1,"h":"6．描述组织如何有效管理多元化。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"2.1 多元化","c":[{"t":"2.1.1 人口统计学特征","c":[{"t":"劳动力构成变化：占优势的白人男性劳动力已被性别平衡、多种族的劳动力替代；美国女性劳动力占比从1950年的29.6%升至2016年的46.8%；白人与其他民族、种族群体的薪酬差异明显缩小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">劳动力构成变化</strong>：占优势的白人男性劳动力已被性别平衡、多种族的劳动力替代；美国女性劳动力占比从1950年的29.6%升至2016年的46.8%；白人与其他民族、种族群体的薪酬差异明显缩小。"},{"t":"族群结构变化：预计拉丁裔占劳动力比例从2014年的13%升至2044年的25.1%，非裔从12%升至12.7%，亚裔从5%升至7.9%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">族群结构变化</strong>：预计拉丁裔占劳动力比例从2014年的13%升至2044年的25.1%，非裔从12%升至12.7%，亚裔从5%升至7.9%。"},{"t":"年龄结构变化：55岁及以上员工占比持续上升（美国从2010年的19.5%升至2020年的25.2%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">年龄结构变化</strong>：55岁及以上员工占比持续上升（美国从2010年的19.5%升至2020年的25.2%）。"},{"t":"结论：这些变化要求组织把多元化管理作为政策和实践的核心。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：这些变化要求组织把多元化管理作为政策和实践的核心。"}],"k":"b","i":1,"h":"2.1.1 人口统计学特征"},{"t":"2.1.2 多元化的层次","c":[{"t":"表层多元化（surface-level diversity）：年龄、民族、性别、种族、宗教、残疾状况等可观察的人口统计特征差异，只是\"冰山一角\"，容易让人对特定人口背景的人产生刻板印象和假设。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表层多元化</strong>（surface-level diversity）：年龄、民族、性别、种族、宗教、残疾状况等可观察的人口统计特征差异，只是&quot;冰山一角&quot;，容易让人对特定人口背景的人产生刻板印象和假设。"},{"t":"深层多元化（deep-level diversity）：人格、价值观、想法与感受层面的差异；当人们发现彼此有更多深层相似特征时，就不那么关注人口统计因素上的差异。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">深层多元化</strong>（deep-level diversity）：人格、价值观、想法与感受层面的差异；当人们发现彼此有更多深层相似特征时，就不那么关注人口统计因素上的差异。"},{"t":"对比（书中路易斯与丽萨的例子）：表层差异（教育背景、种族、宗教、性别）最先被注意到；随着理解加深，深层相似性（重视家庭、相同的思考方式、喜欢合作）可以盖过表层差异性，研究表明他们很适合一起工作。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对比</strong>（书中路易斯与丽萨的例子）：表层差异（教育背景、种族、宗教、性别）最先被注意到；随着理解加深，深层相似性（重视家庭、相同的思考方式、喜欢合作）可以盖过表层差异性，研究表明他们很适合一起工作。"},{"t":"意义：多元化是个体差异影响奖赏偏好、沟通风格、对领导的反应、谈判风格等许多方面的重要概念；但多元化增加也可能意味着歧视行为增加。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">意义</strong>：多元化是个体差异影响奖赏偏好、沟通风格、对领导的反应、谈判风格等许多方面的重要概念；但多元化增加也可能意味着歧视行为增加。"}],"k":"b","i":1,"h":"2.1.2 多元化的层次"},{"t":"道德抉择：失业退伍军人的平权运动——沃尔玛承诺雇用所有申请工作的美国退伍军人，\"老兵就业使命\"联盟扩大至百万人目标；平权运动能给处于不平等地位的劳动者提供机会，但要冒招进不合格者的风险，并可能把具备能力却不属于目标群体的人拒之门外，管理者须在道德推进与劳动力水平之间找平衡。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">道德抉择</strong>：失业退伍军人的平权运动——沃尔玛承诺雇用所有申请工作的美国退伍军人，&quot;老兵就业使命&quot;联盟扩大至百万人目标；平权运动能给处于不平等地位的劳动者提供机会，但要冒招进不合格者的风险，并可能把具备能力却不属于目标群体的人拒之门外，管理者须在道德推进与劳动力水平之间找平衡。"}],"k":"sec","i":0,"h":"2.1 多元化"},{"t":"2.2 歧视","c":[{"t":"歧视（discrimination）：有辨别和区分之义，指注意到事物之间的差异，本身未必是坏事（如注意到某员工更适合某岗位是招聘决策所必需的）；但通常指行为被刻板印象所影响的不公正区分。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">歧视</strong>（discrimination）：有辨别和区分之义，指注意到事物之间的差异，本身未必是坏事（如注意到某员工更适合某岗位是招聘决策所必需的）；但通常指行为被刻板印象所影响的不公正区分。"},{"t":"刻板印象（stereotyping）：根据我们对某人所属群体的认知来判断某人；刻板印象是\"歧视引擎\"的燃料，既影响实施者，也影响受歧视者对自己的看法。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">刻板印象</strong>（stereotyping）：根据我们对某人所属群体的认知来判断某人；刻板印象是&quot;歧视引擎&quot;的燃料，既影响实施者，也影响受歧视者对自己的看法。"},{"t":"2.2.1 刻板印象威胁","c":[{"t":"刻板印象威胁（stereotype threat）：我们内心对于我们所属群体的消极刻板印象的赞同程度；当被所属群体的负面内涵所定义时，就会害怕被评价。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">刻板印象威胁</strong>（stereotype threat）：我们内心对于我们所属群体的消极刻板印象的赞同程度；当被所属群体的负面内涵所定义时，就会害怕被评价。"},{"t":"三种典型反应：无意识地夸大该刻板印象；自我设限而不去努力（把可能的失败归咎于压力或运气等其他原因）；过度补偿以避免刻板印象被证实。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三种典型反应</strong>：无意识地夸大该刻板印象；自我设限而不去努力（把可能的失败归咎于压力或运气等其他原因）；过度补偿以避免刻板印象被证实。"},{"t":"后果：耗尽用于工作的记忆力（\"脑力流失\"），使人在就业测试、绩效评估、培训、谈判及日常互动中表现不佳，并产生不合群、工作态度不好、拒绝寻求反馈等负面结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">后果</strong>：耗尽用于工作的记忆力（&quot;脑力流失&quot;），使人在就业测试、绩效评估、培训、谈判及日常互动中表现不佳，并产生不合群、工作态度不好、拒绝寻求反馈等负面结果。"},{"t":"组织减少刻板印象威胁的举措：提高对刻板印象可能持续存在的认识（尤其在制定政策和实践时）；通过客观评估减少差别待遇和优惠待遇；对抗对少数群体的\"微冒犯\"，采取体现所有员工价值的透明做法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织减少刻板印象威胁的举措</strong>：提高对刻板印象可能持续存在的认识（尤其在制定政策和实践时）；通过客观评估减少差别待遇和优惠待遇；对抗对少数群体的&quot;微冒犯&quot;，采取体现所有员工价值的透明做法。"}],"k":"b","i":1,"h":"2.2.1 刻板印象威胁"},{"t":"2.2.2 工作场合中的歧视","c":[{"t":"不公正歧视的实质：假设群体中每个人都是相同的，不去关注群体中每个个体的特征。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">不公正歧视的实质</strong>：假设群体中每个人都是相同的，不去关注群体中每个个体的特征。"},{"t":"图表2-1 歧视的形式（六种，逐条）：","c":[{"t":"歧视性的政策或做法：组织拒绝提供平等的工作机会或给予不公平的业绩奖励；例：老员工成为裁员目标，因其薪水较高且享有丰厚福利。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">歧视性的政策或做法</strong>：组织拒绝提供平等的工作机会或给予不公平的业绩奖励；例：老员工成为裁员目标，因其薪水较高且享有丰厚福利。"},{"t":"性骚扰：性侵犯及其他口头或身体上带性意味的行为，造成不友好或冒犯性的工作环境；例：公司花钱让销售员去脱衣舞俱乐部庆祝升职。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">性骚扰</strong>：性侵犯及其他口头或身体上带性意味的行为，造成不友好或冒犯性的工作环境；例：公司花钱让销售员去脱衣舞俱乐部庆祝升职。"},{"t":"恐吓：针对特定员工群体的成员进行公开威胁或欺辱；例：非裔美国员工的工作场所被悬挂套索。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">恐吓</strong>：针对特定员工群体的成员进行公开威胁或欺辱；例：非裔美国员工的工作场所被悬挂套索。"},{"t":"嘲弄和侮辱：玩笑或负面刻板印象，有时玩笑开得过头；例：阿拉伯裔美国员工被问是否携带炸弹。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">嘲弄和侮辱</strong>：玩笑或负面刻板印象，有时玩笑开得过头；例：阿拉伯裔美国员工被问是否携带炸弹。"},{"t":"排斥：在工作机会、社交活动、讨论或非正式指导上排斥某些人，有时是无意识行为；例：金融业女性总被安排无关紧要的工作。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">排斥</strong>：在工作机会、社交活动、讨论或非正式指导上排斥某些人，有时是无意识行为；例：金融业女性总被安排无关紧要的工作。"},{"t":"言行粗鲁：对人缺乏尊重，包括挑衅、打断谈话、忽视观点；例：女律师的意见被男律师打断或轻视。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">言行粗鲁</strong>：对人缺乏尊重，包括挑衅、打断谈话、忽视观点；例：女律师的意见被男律师打断或轻视。"}],"k":"b","i":2,"h":"<strong class=\"lead\">图表2-1 歧视的形式</strong>（六种，逐条）："},{"t":"结论：公开歧视大多已消失，但可能导致更隐蔽的歧视（如粗鲁或排斥）增加；实际歧视会导致生产率降低、组织公民行为减少、冲突增多、离职率上升、冒险行为增加；排斥与言行粗鲁尤其难根除，因为行为者往往没有意识到。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：公开歧视大多已消失，但可能导致更隐蔽的歧视（如粗鲁或排斥）增加；实际歧视会导致生产率降低、组织公民行为减少、冲突增多、离职率上升、冒险行为增加；排斥与言行粗鲁尤其难根除，因为行为者往往没有意识到。"}],"k":"b","i":1,"h":"2.2.2 工作场合中的歧视"}],"k":"sec","i":0,"h":"2.2 歧视"},{"t":"2.3 传记特征","c":[{"t":"传记特征（biographical characteristic）：年龄、性别、种族、残疾等用于区别员工的最明显方式，大多可直接从人事档案中获取。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">传记特征</strong>（biographical characteristic）：年龄、性别、种族、残疾等用于区别员工的最明显方式，大多可直接从人事档案中获取。"},{"t":"总原则：许多传记特征差异对实际工作结果并不重要；拥有共同特征的群体内部的差异，常常大于传记特征不同的群体之间的差异。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">总原则</strong>：许多传记特征差异对实际工作结果并不重要；拥有共同特征的群体内部的差异，常常大于传记特征不同的群体之间的差异。"},{"t":"传言还是科学：光头男人事业强——研究显示剃光头的男性被认为更具支配能力和领导潜力，说明我们仍在以肤浅的特征评价人。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">传言还是科学</strong>：光头男人事业强——研究显示剃光头的男性被认为更具支配能力和领导潜力，说明我们仍在以肤浅的特征评价人。"},{"t":"2.3.1 年龄","c":[{"t":"背景：发达国家劳动力老龄化，55岁及以上占比增加；美国立法禁止强制退休并禁止年龄歧视；很多劳动者计划延迟退休。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：发达国家劳动力老龄化，55岁及以上占比增加；美国立法禁止强制退休并禁止年龄歧视；很多劳动者计划延迟退休。"},{"t":"与工作结果的关系（逐条）：","c":[{"t":"离职：年龄越大越不愿离职——可选择的就业机会更少（技能更专业化），且任职时间长、薪水与福利使其与雇主捆绑。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">离职</strong>：年龄越大越不愿离职——可选择的就业机会更少（技能更专业化），且任职时间长、薪水与福利使其与雇主捆绑。"},{"t":"缺勤：年长员工缺勤率比年轻员工低，心理与身体健康问题也更少。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">缺勤</strong>：年长员工缺勤率比年轻员工低，心理与身体健康问题也更少。"},{"t":"工作表现：大多数研究表明年龄与工作表现几乎没有任何关系；部分研究显示年长者更善于避免严重错误；依靠智慧的实验型创作者在四五十岁及六十多岁做出最伟大的作品。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">工作表现</strong>：大多数研究表明年龄与工作表现几乎没有任何关系；部分研究显示年长者更善于避免严重错误；依靠智慧的实验型创作者在四五十岁及六十多岁做出最伟大的作品。"},{"t":"工作满意度：多数研究显示年长员工对工作更满意、与同事关系更好、对组织的承诺度更高；也有研究发现满意度在中年以前上升、中年后下降，分职业看：专业技能组随年龄持续增加，非专业技能组中年下降后回升。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">工作满意度</strong>：多数研究显示年长员工对工作更满意、与同事关系更好、对组织的承诺度更高；也有研究发现满意度在中年以前上升、中年后下降，分职业看：专业技能组随年龄持续增加，非专业技能组中年下降后回升。"}],"k":"b","i":2,"h":"<strong class=\"lead\">与工作结果的关系</strong>（逐条）："},{"t":"结论：年龄的表层特征是毫无根据的歧视依据，劳动力的年龄多元化对组织有利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：年龄的表层特征是毫无根据的歧视依据，劳动力的年龄多元化对组织有利。"}],"k":"b","i":1,"h":"2.3.1 年龄"},{"t":"2.3.2 性别","c":[{"t":"绩效与能力：男性与女性在工作方面几乎不存在会影响绩效的差异（数学与语言能力的微小差异不足为凭）；元分析显示女性绩效略优于男性；95项领导力研究的元分析显示两性是被认为效率相当的领导者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">绩效与能力</strong>：男性与女性在工作方面几乎不存在会影响绩效的差异（数学与语言能力的微小差异不足为凭）；元分析显示女性绩效略优于男性；95项领导力研究的元分析显示两性是被认为效率相当的领导者。"},{"t":"偏见依然存在：男性主导职业招聘中男性更易被优先考虑；女性较少被安排到有助于晋升的挑战性职位；男性更可能被选为领导角色（尤其处理组织危机时）；\"母亲偏见\"使职场妈妈有了孩子后更难获得新职务；果敢有冲劲的女性更不受人喜欢、更不容易被聘用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">偏见依然存在</strong>：男性主导职业招聘中男性更易被优先考虑；女性较少被安排到有助于晋升的挑战性职位；男性更可能被选为领导角色（尤其处理组织危机时）；&quot;母亲偏见&quot;使职场妈妈有了孩子后更难获得新职务；果敢有冲劲的女性更不受人喜欢、更不容易被聘用。"},{"t":"差距的量级：97项近40万人的研究表明，两性在晋升、奖金和薪酬上的差异是其在表现评价上差异的14倍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">差距的量级</strong>：97项近40万人的研究表明，两性在晋升、奖金和薪酬上的差异是其在表现评价上差异的14倍。"},{"t":"进展：许多国家立法禁止性别歧视；比利时、法国、挪威、西班牙等正通过法律提高女性在董事会中的比例。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">进展</strong>：许多国家立法禁止性别歧视；比利时、法国、挪威、西班牙等正通过法律提高女性在董事会中的比例。"}],"k":"b","i":1,"h":"2.3.2 性别"},{"t":"2.3.3 种族和族群","c":[{"t":"种族（race）：人们用于识别和认同自己的遗传因素；族群（ethnicity）：另一套文化特征，经常与种族部分重叠；种族常与生物学联系、族群与文化联系，但人们会同时依这两种分类进行自我认同。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">种族</strong>（race）：人们用于识别和认同自己的遗传因素；族群（ethnicity）：另一套文化特征，经常与种族部分重叠；种族常与生物学联系、族群与文化联系，但人们会同时依这两种分类进行自我认同。"},{"t":"研究结论：员工可能帮助同种族的同事（采用高度结构化决策方法时差异不明显）；少数族裔受到的歧视更多——非裔美国人在面试评分、绩效评价、薪酬和晋升上表现更差，且在控制实验（如无犯罪记录的非裔申请者得到的机会少于有犯罪记录的白人申请者）中也受歧视。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">研究结论</strong>：员工可能帮助同种族的同事（采用高度结构化决策方法时差异不明显）；少数族裔受到的歧视更多——非裔美国人在面试评分、绩效评价、薪酬和晋升上表现更差，且在控制实验（如无犯罪记录的非裔申请者得到的机会少于有犯罪记录的白人申请者）中也受歧视。"},{"t":"组织意义：感受到积极且多元化的氛围（positive diversity climate）的少数族裔员工离职可能性大大降低；该氛围会带来销售额、投入和回报的增长。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织意义</strong>：感受到积极且多元化的氛围（positive diversity climate）的少数族裔员工离职可能性大大降低；该氛围会带来销售额、投入和回报的增长。"},{"t":"改善路径：理解彼此的观点；设立专注于共同目标的多元化工作小组，有助于形成积极的多元化氛围。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">改善路径</strong>：理解彼此的观点；设立专注于共同目标的多元化工作小组，有助于形成积极的多元化氛围。"}],"k":"b","i":1,"h":"2.3.3 种族和族群"},{"t":"2.3.4 残疾","c":[{"t":"法律：澳大利亚、美国、英国、日本等国有专门法律保护残疾人；1990年《美国残疾人法案》（Americans with Disabilities Act, ADA）要求雇主对工作场所做出合理布置（合理安置），使生理或精神残疾者可顺利出入工作场所。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">法律</strong>：澳大利亚、美国、英国、日本等国有专门法律保护残疾人；1990年《美国残疾人法案》（Americans with Disabilities Act, ADA）要求雇主对工作场所做出合理布置（合理安置），使生理或精神残疾者可顺利出入工作场所。"},{"t":"界定：美国平等就业机会委员会（Equal Employment Opportunity Commission, EEOC）将残疾人定义为具有生理或精神缺陷且一种或多种主要日常活动受限的人；被认定的残疾包括四肢不健全、癫痫、唐氏综合征、失聪、精神分裂症、酗酒、糖尿病、抑郁症与慢性背痛等，各类状况与雇佣的关系难以总体概括。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">界定</strong>：美国平等就业机会委员会（Equal Employment Opportunity Commission, EEOC）将残疾人定义为具有生理或精神缺陷且一种或多种主要日常活动受限的人；被认定的残疾包括四肢不健全、癫痫、唐氏综合征、失聪、精神分裂症、酗酒、糖尿病、抑郁症与慢性背痛等，各类状况与雇佣的关系难以总体概括。"},{"t":"研究结论的两面：人们认为残疾候选人拥有更可靠等更优秀的个人品质；但残疾员工往往遭遇较低的绩效期望且不太可能被雇用（精神残疾者更明显，抑郁和焦虑患者缺勤率更高）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">研究结论的两面</strong>：人们认为残疾候选人拥有更可靠等更优秀的个人品质；但残疾员工往往遭遇较低的绩效期望且不太可能被雇用（精神残疾者更明显，抑郁和焦虑患者缺勤率更高）。"},{"t":"政策效果：欧洲的激励雇主政策未能提高残疾员工劳动参与率，德国、法国、波兰的直接配额制度甚至适得其反；对残疾人才能的认可以及科技和工作场所的进步扩大了就业范围；管理者应协调工作真正需求与个人技能的匹配，并在需要时提供便利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">政策效果</strong>：欧洲的激励雇主政策未能提高残疾员工劳动参与率，德国、法国、波兰的直接配额制度甚至适得其反；对残疾人才能的认可以及科技和工作场所的进步扩大了就业范围；管理者应协调工作真正需求与个人技能的匹配，并在需要时提供便利。"}],"k":"b","i":1,"h":"2.3.4 残疾"},{"t":"2.3.5 隐性残疾","c":[{"t":"隐性残疾（不可见残疾）：不易被观察到的残疾，员工有权隐瞒，除非自己决定透露；一般分为感官残疾（如听力受损）、自身免疫性疾病（如类风湿性关节炎）、慢性疾病或疼痛（如腕管综合征）、睡眠障碍（如失眠）和心理问题（如创伤后应激障碍）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">隐性残疾</strong>（不可见残疾）：不易被观察到的残疾，员工有权隐瞒，除非自己决定透露；一般分为感官残疾（如听力受损）、自身免疫性疾病（如类风湿性关节炎）、慢性疾病或疼痛（如腕管综合征）、睡眠障碍（如失眠）和心理问题（如创伤后应激障碍）。"},{"t":"法律与困境：2008年《美国残疾人法案修正案》（Americans with Disabilities Act Amendments Act, ADAAA）要求组织为有多种缺陷的员工提供便利，但员工必须披露才能获得职场便利和就业保护；许多员工因害怕侮辱、排斥和被低估表现而不愿透露。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">法律与困境</strong>：2008年《美国残疾人法案修正案》（Americans with Disabilities Act Amendments Act, ADAAA）要求组织为有多种缺陷的员工提供便利，但员工必须披露才能获得职场便利和就业保护；许多员工因害怕侮辱、排斥和被低估表现而不愿透露。"},{"t":"注意：隐性残疾并非真的不可见（如未公开的孤独症患者仍有语言交流困难等行为特征），容易被归咎于其他原因（如把中风的长期影响误认为酗酒）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">注意</strong>：隐性残疾并非真的不可见（如未公开的孤独症患者仍有语言交流困难等行为特征），容易被归咎于其他原因（如把中风的长期影响误认为酗酒）。"},{"t":"结论：公开隐性残疾对当事人、他人和组织都有帮助——提高工作满意度和幸福感、获得理解、使组织做出适应，达到最佳表现。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：公开隐性残疾对当事人、他人和组织都有帮助——提高工作满意度和幸福感、获得理解、使组织做出适应，达到最佳表现。"}],"k":"b","i":1,"h":"2.3.5 隐性残疾"}],"k":"sec","i":0,"h":"2.3 传记特征"},{"t":"2.4 其他区别特征","c":[{"t":"2.4.1 任职时间","c":[{"t":"任职时间（tenure）：资历和任职时间，指一个人在某个工作、组织或领域中所花费的时间。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">任职时间</strong>（tenure）：资历和任职时间，指一个人在某个工作、组织或领域中所花费的时间。"},{"t":"组织任职时间（员工在组织里待了多久）与工作表现正相关，是员工表现的良好预测指标；但关系非线性——对新手或经验不足的员工影响更大（如第二年四分卫相对新手的优势，大于第十年相对第九年的优势）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织任职时间</strong>（员工在组织里待了多久）与工作表现正相关，是员工表现的良好预测指标；但关系非线性——对新手或经验不足的员工影响更大（如第二年四分卫相对新手的优势，大于第十年相对第九年的优势）。"},{"t":"工作任职时间（从事同一份工作多久）对工作结果只有微弱且缺乏一致性的影响；体现为员工可能失去对进一步职业发展的期望。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工作任职时间</strong>（从事同一份工作多久）对工作结果只有微弱且缺乏一致性的影响；体现为员工可能失去对进一步职业发展的期望。"}],"k":"b","i":1,"h":"2.4.1 任职时间"},{"t":"2.4.2 宗教","c":[{"t":"法律：包括澳大利亚、英国和美国在内的许多国家禁止因宗教而歧视员工。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">法律</strong>：包括澳大利亚、英国和美国在内的许多国家禁止因宗教而歧视员工。"},{"t":"背景：伊斯兰教是世界主要宗教之一；美国穆斯林约300万并预计增长；工作场合存在宗教歧视（如穿伊斯兰特征服饰的求职者面试时间更短、评价更负面）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：伊斯兰教是世界主要宗教之一；美国穆斯林约300万并预计增长；工作场合存在宗教歧视（如穿伊斯兰特征服饰的求职者面试时间更短、评价更负面）。"},{"t":"与雇佣的关联：当信仰禁止或鼓励某种行为时（如平安夜提前下班、周日或周六不工作），信仰可能成为雇佣问题；宗教歧视申诉增多且问题复杂（如 Samantha Elauf 因戴头巾未被 Abercrombie 雇用的诉讼，最高法院对雇主是否应推断并保护并不确定）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与雇佣的关联</strong>：当信仰禁止或鼓励某种行为时（如平安夜提前下班、周日或周六不工作），信仰可能成为雇佣问题；宗教歧视申诉增多且问题复杂（如 Samantha Elauf 因戴头巾未被 Abercrombie 雇用的诉讼，最高法院对雇主是否应推断并保护并不确定）。"}],"k":"b","i":1,"h":"2.4.2 宗教"},{"t":"2.4.3 性取向和性别认同","c":[{"t":"概念：LGBTQ（lesbian, gay, bisexual, transgender, and questioning，女同性恋、男同性恋、双性恋、变性者及疑性恋）；研究者还提出 QUILTBAG 以涵盖酷儿/疑性恋、未决定者、间性恋等更多群体。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">概念</strong>：LGBTQ（lesbian, gay, bisexual, transgender, and questioning，女同性恋、男同性恋、双性恋、变性者及疑性恋）；研究者还提出 QUILTBAG 以涵盖酷儿/疑性恋、未决定者、间性恋等更多群体。"},{"t":"歧视证据：虚构简历实验中，提到大学时参加过同性恋组织的简历收到回复比未提及的少60%；许多 LGBTQ 员工因感受到歧视而隐瞒身份（如英国石油前 CEO 约翰·布朗）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">歧视证据</strong>：虚构简历实验中，提到大学时参加过同性恋组织的简历收到回复比未提及的少60%；许多 LGBTQ 员工因感受到歧视而隐瞒身份（如英国石油前 CEO 约翰·布朗）。"},{"t":"法律与政策：美国29个州和160多个城市禁止性取向歧视，但联邦法律未禁止；EEOC 依据1964年《民权法案》（Civil Rights Act）将针对女同性恋、男同性恋、双性恋的刻板印象认定为性别歧视；超过90%的《财富》500强有性取向保护政策；有性别认同政策的公司从2001年的8家增至超过250家；IBM 从极度保守转向让性少数员工\"受欢迎且受重视\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">法律与政策</strong>：美国29个州和160多个城市禁止性取向歧视，但联邦法律未禁止；EEOC 依据1964年《民权法案》（Civil Rights Act）将针对女同性恋、男同性恋、双性恋的刻板印象认定为性别歧视；超过90%的《财富》500强有性取向保护政策；有性别认同政策的公司从2001年的8家增至超过250家；IBM 从极度保守转向让性少数员工&quot;受欢迎且受重视&quot;。"},{"t":"职业目标（我应该在工作中出柜吗）：需考虑包容的公司文化、个人的道德立场、在最高管理层的未来、衡量选择后果以及国际和国内法律环境。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">职业目标</strong>（我应该在工作中出柜吗）：需考虑包容的公司文化、个人的道德立场、在最高管理层的未来、衡量选择后果以及国际和国内法律环境。"}],"k":"b","i":1,"h":"2.4.3 性取向和性别认同"},{"t":"2.4.4 文化认同","c":[{"t":"文化认同（cultural identity）：人与家族文化之间的纽带，无论在哪里生活都会伴其一生；人们可以选择文化认同及其规范的遵守程度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化认同</strong>（cultural identity）：人与家族文化之间的纽带，无论在哪里生活都会伴其一生；人们可以选择文化认同及其规范的遵守程度。"},{"t":"组织含义：全球化使组织更需理解并尊重员工（群体与个体）的文化认同（如在拉丁美洲业务的暑假传统）；组织不仅要迎合多数群体诉求，还要创造方法适应不同个体的习惯和习俗。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织含义</strong>：全球化使组织更需理解并尊重员工（群体与个体）的文化认同（如在拉丁美洲业务的暑假传统）；组织不仅要迎合多数群体诉求，还要创造方法适应不同个体的习惯和习俗。"},{"t":"管理措施：提高工作场所的灵活性，以同时满足组织目标和个人需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理措施</strong>：提高工作场所的灵活性，以同时满足组织目标和个人需求。"}],"k":"b","i":1,"h":"2.4.4 文化认同"}],"k":"sec","i":0,"h":"2.4 其他区别特征"},{"t":"2.5 能力","c":[{"t":"能力（ability）：个体成功完成工作中各项任务的可能性；总体能力分智力能力和体质能力两大类；管理的挑战是理解差异，并帮助特定员工更好地从事工作。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">能力</strong>（ability）：个体成功完成工作中各项任务的可能性；总体能力分智力能力和体质能力两大类；管理的挑战是理解差异，并帮助特定员工更好地从事工作。"},{"t":"2.5.1 智力能力","c":[{"t":"智力能力（intellectual ability）：从事思考、推理和解决问题等智力活动所需的能力；聪明的人一般收入更高、教育水平更高，更容易成为群体领导者。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">智力能力</strong>（intellectual ability）：从事思考、推理和解决问题等智力活动所需的能力；聪明的人一般收入更高、教育水平更高，更容易成为群体领导者。"},{"t":"图表2-2 智力能力的7个维度（逐条）：","c":[{"t":"算术：快速准确的运算能力；例：会计计算一系列物品的营业税。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">算术</strong>：快速准确的运算能力；例：会计计算一系列物品的营业税。"},{"t":"语言理解：理解读到和听到的内容、理解词汇之间关系的能力；例：工厂管理者推行企业聘用政策。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">语言理解</strong>：理解读到和听到的内容、理解词汇之间关系的能力；例：工厂管理者推行企业聘用政策。"},{"t":"知觉速度：迅速准确地辨认视觉上异同的能力；例：火灾调查员鉴别纵火责任的证据和线索。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">知觉速度</strong>：迅速准确地辨认视觉上异同的能力；例：火灾调查员鉴别纵火责任的证据和线索。"},{"t":"归纳推理：确定一个问题的逻辑后果以及解决这一问题的能力；例：市场调查员预测某产品未来市场需求量。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">归纳推理</strong>：确定一个问题的逻辑后果以及解决这一问题的能力；例：市场调查员预测某产品未来市场需求量。"},{"t":"演绎推理：运用逻辑来评估某种观点的价值的能力；例：主管在员工提供的两个建议中做出抉择。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">演绎推理</strong>：运用逻辑来评估某种观点的价值的能力；例：主管在员工提供的两个建议中做出抉择。"},{"t":"空间视知觉：当物体空间位置变化时能想象出物体形状的能力；例：室内装饰师重新装饰办公室。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">空间视知觉</strong>：当物体空间位置变化时能想象出物体形状的能力；例：室内装饰师重新装饰办公室。"},{"t":"记忆力：保持和回忆过去经历的能力；例：销售人员回忆顾客的姓名。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">记忆力</strong>：保持和回忆过去经历的能力；例：销售人员回忆顾客的姓名。"}],"k":"b","i":2,"h":"<strong class=\"lead\">图表2-2 智力能力的7个维度</strong>（逐条）："},{"t":"一般心理能力（general mental ability, GMA）：智力能力各维度呈正相关（相关性足够高），研究者据此识别出的一般智力因素；智力能力的结构与测量在不同文化间共通。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">一般心理能力</strong>（general mental ability, GMA）：智力能力各维度呈正相关（相关性足够高），研究者据此识别出的一般智力因素；智力能力的结构与测量在不同文化间共通。"},{"t":"与绩效的关系：认知能力与任务绩效之间存在相关性；在任务高度常规、复杂程度低的工作中，高智商的作用有限。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与绩效的关系</strong>：认知能力与任务绩效之间存在相关性；在任务高度常规、复杂程度低的工作中，高智商的作用有限。"},{"t":"温德利认知能力测验（Wonderlic Cognitive Ability Test）：招聘中广泛应用的智力测验，12分钟完成，每套50题，既测速度又测能力，平均分约21（满分50），价格低廉（5~10美元/人），多作为招聘的信息来源渠道而非替代面试等其他工具。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">温德利认知能力测验</strong>（Wonderlic Cognitive Ability Test）：招聘中广泛应用的智力测验，12分钟完成，每套50题，既测速度又测能力，平均分约21（满分50），价格低廉（5~10美元/人），多作为招聘的信息来源渠道而非替代面试等其他工具。"},{"t":"注意：智力并不能让人快乐或提高工作满意度；认知能力更强者可能因嫉妒和社会比较受到同龄人的伤害、欺凌和虐待。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">注意</strong>：智力并不能让人快乐或提高工作满意度；认知能力更强者可能因嫉妒和社会比较受到同龄人的伤害、欺凌和虐待。"}],"k":"b","i":1,"h":"2.5.1 智力能力"},{"t":"2.5.2 体质能力","c":[{"t":"体质能力（physical ability）：对上百种不同工作要求的调查确定了体力活动的9种基本能力；当工作对9种能力的要求与员工能力水平匹配时，会提高工作绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">体质能力</strong>（physical ability）：对上百种不同工作要求的调查确定了体力活动的9种基本能力；当工作对9种能力的要求与员工能力水平匹配时，会提高工作绩效。"},{"t":"图表2-3 9种基本的体质能力（逐条）：","c":[{"t":"力量因素：动态力量（不断重复或持续运用肌肉力量的能力）、躯干力量（运用躯干肌肉尤其是腹部肌肉达到一定肌肉强度的能力）、静态力量（产生力量阻止外部物体的能力）、爆发力（在一项或一系列爆发活动中产生最大能量的能力）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">力量因素</strong>：动态力量（不断重复或持续运用肌肉力量的能力）、躯干力量（运用躯干肌肉尤其是腹部肌肉达到一定肌肉强度的能力）、静态力量（产生力量阻止外部物体的能力）、爆发力（在一项或一系列爆发活动中产生最大能量的能力）。"},{"t":"灵活性因素：广度灵活性（尽可能远地移动躯干和背部肌肉的能力）、动态灵活性（进行快速、重复的关节活动的能力）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">灵活性因素</strong>：广度灵活性（尽可能远地移动躯干和背部肌肉的能力）、动态灵活性（进行快速、重复的关节活动的能力）。"},{"t":"其他因素：躯体协调性（躯体不同部位同时活动时相互协调的能力）、平衡性（受到外力推拉时保持身体平衡的能力）、耐力（需要延长出力时间时持续保持最高出力水平的能力）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">其他因素</strong>：躯体协调性（躯体不同部位同时活动时相互协调的能力）、平衡性（受到外力推拉时保持身体平衡的能力）、耐力（需要延长出力时间时持续保持最高出力水平的能力）。"}],"k":"b","i":2,"h":"<strong class=\"lead\">图表2-3 9种基本的体质能力</strong>（逐条）："},{"t":"例证：SAP 在德国、印度和爱尔兰的试点项目发现自闭症员工在软件调试等强调精准的任务上成绩出色——将各种类型的人纳入团队且不因个人特征自动排除任何人，团队才有最佳生产率。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例证</strong>：SAP 在德国、印度和爱尔兰的试点项目发现自闭症员工在软件调试等强调精准的任务上成绩出色——将各种类型的人纳入团队且不因个人特征自动排除任何人，团队才有最佳生产率。"}],"k":"b","i":1,"h":"2.5.2 体质能力"}],"k":"sec","i":0,"h":"2.5 能力"},{"t":"2.6 多元化管理策略","c":[{"t":"多元化管理（diversity management）：使每个人对他人的差异和需求都更有意识、更敏感；多元化涉及每个人，当被视为与每个人都息息相关的事时，多元化管理更可能成功。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">多元化管理</strong>（diversity management）：使每个人对他人的差异和需求都更有意识、更敏感；多元化涉及每个人，当被视为与每个人都息息相关的事时，多元化管理更可能成功。"},{"t":"2.6.1 吸引、选择、开发和留住多元化员工","c":[{"t":"定向招聘：把招聘信息定位于劳动力中未被充分代表的群体；与拥有大量少数族裔的院校和机构合作（如微软鼓励女性从事技术研究）；与女工程师协会（Society of Women Engineers）、全国少数族裔供应商发展委员会（National Minority Supplier Development Council）等建立合作。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定向招聘</strong>：把招聘信息定位于劳动力中未被充分代表的群体；与拥有大量少数族裔的院校和机构合作（如微软鼓励女性从事技术研究）；与女工程师协会（Society of Women Engineers）、全国少数族裔供应商发展委员会（National Minority Supplier Development Council）等建立合作。"},{"t":"广告信号：女性和少数族裔对强调多元化承诺的雇主更有兴趣；不强调女性和少数族裔领导地位的多元化广告会传递消极信息——组织须切实让管理队伍多样化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">广告信号</strong>：女性和少数族裔对强调多元化承诺的雇主更有兴趣；不强调女性和少数族裔领导地位的多元化广告会传递消极信息——组织须切实让管理队伍多样化。"},{"t":"实践案例：Etsy 举办工程师培训班资助有志的女性并雇用其中优秀者；麦肯锡、贝恩、波士顿咨询和高盛积极招收因照顾家庭暂离职场的女性，提供阶段性工作计划等福利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">实践案例</strong>：Etsy 举办工程师培训班资助有志的女性并雇用其中优秀者；麦肯锡、贝恩、波士顿咨询和高盛积极招收因照顾家庭暂离职场的女性，提供阶段性工作计划等福利。"}],"k":"b","i":1,"h":"2.6.1 吸引、选择、开发和留住多元化员工"},{"t":"2.6.2 群体中的多元化","c":[{"t":"对比结论：多元化团队与同质化团队哪个更有效，取决于团队关注的焦点；人口统计学特征的多元化（性别、族群、种族）总体上既无助于也无损于团队绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对比结论</strong>：多元化团队与同质化团队哪个更有效，取决于团队关注的焦点；人口统计学特征的多元化（性别、族群、种族）总体上既无助于也无损于团队绩效。"},{"t":"多元化是优势的情形：拥有不同技术专长和教育背景的团队比同质团队更有效率；既有领导者也有追随者的团队优于全员强势或全员被动追随的团队；人格特质的多元化可能损害也可能促进团队绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">多元化是优势的情形</strong>：拥有不同技术专长和教育背景的团队比同质团队更有效率；既有领导者也有追随者的团队优于全员强势或全员被动追随的团队；人格特质的多元化可能损害也可能促进团队绩效。"},{"t":"多元化并非好事的情形：在智力、勤勉、工作兴趣这些变量上没有组织会刻意追求\"多元化\"（高智商、勤勉且对工作感兴趣的团队成员更有效率）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">多元化并非好事的情形</strong>：在智力、勤勉、工作兴趣这些变量上没有组织会刻意追求&quot;多元化&quot;（高智商、勤勉且对工作感兴趣的团队成员更有效率）。"},{"t":"关键机制：无论团队构成如何，利用差异实现更好绩效的最重要因素是强调成员之间的相似性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">关键机制</strong>：无论团队构成如何，利用差异实现更好绩效的最重要因素是强调成员之间的相似性。"}],"k":"b","i":1,"h":"2.6.2 群体中的多元化"},{"t":"2.6.3 外派员工的调整","c":[{"t":"背景：多数跨国组织希望增加短期与长期国际任务；适应新的文化、人际交往和工作规范对外派员工及东道国居民都十分重要；适应问题处理不当会导致员工不满、表现不佳、偏见和误解。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">背景</strong>：多数跨国组织希望增加短期与长期国际任务；适应新的文化、人际交往和工作规范对外派员工及东道国居民都十分重要；适应问题处理不当会导致员工不满、表现不佳、偏见和误解。"},{"t":"影响适应的因素：赋权感以及与其他文化互动的动力（与适应容易程度、满意度提高、提前离开意愿减少相关）；特定文化背景的工作经历、自尊和自我效能感更高者适应更快也更快得到提升；语言能力、人际关系技能、组织支持以及家庭的支持。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">影响适应的因素</strong>：赋权感以及与其他文化互动的动力（与适应容易程度、满意度提高、提前离开意愿减少相关）；特定文化背景的工作经历、自尊和自我效能感更高者适应更快也更快得到提升；语言能力、人际关系技能、组织支持以及家庭的支持。"},{"t":"管理建议：选择能够迅速适应的员工执行国际任务，并确保他们得到所需的支持。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理建议</strong>：选择能够迅速适应的员工执行国际任务，并确保他们得到所需的支持。"}],"k":"b","i":1,"h":"2.6.3 外派员工的调整"},{"t":"2.6.4 有效的多元化项目","c":[{"t":"三个组成部分（逐条）：第一部分帮助管理者了解平等就业机会的法律框架，倡导平等对待所有人；第二部分教导管理者多元化的劳动力如何更好地服务于多元化的顾客和客户市场；第三部分推进帮助劳动者提升技术和能力的个人发展活动，强调观点差异可以成为提高绩效的有效方式。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三个组成部分</strong>（逐条）：第一部分帮助管理者了解平等就业机会的法律框架，倡导平等对待所有人；第二部分教导管理者多元化的劳动力如何更好地服务于多元化的顾客和客户市场；第三部分推进帮助劳动者提升技术和能力的个人发展活动，强调观点差异可以成为提高绩效的有效方式。"},{"t":"平权行动项目（affirmative action program, AAP）：旨在增强少数群体的代表性、保证每个人都有公平机会展现技术和能力；人们普遍赞成其目标，但实施需避免负面影响（如把不合格者招进来）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">平权行动项目</strong>（affirmative action program, AAP）：旨在增强少数群体的代表性、保证每个人都有公平机会展现技术和能力；人们普遍赞成其目标，但实施需避免负面影响（如把不合格者招进来）。"},{"t":"管理措施：时常观察劳动力构成，判断目标群体是否被充分利用；找出高级管理层中某一群体比例不足背后的晋升障碍；改善招聘活动、制定更透明的遴选系统、提供培训机会；清楚宣传政策；交流应聚焦员工的能力和工作绩效，过分强调某些群体更需要帮助可能适得其反。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理措施</strong>：时常观察劳动力构成，判断目标群体是否被充分利用；找出高级管理层中某一群体比例不足背后的晋升障碍；改善招聘活动、制定更透明的遴选系统、提供培训机会；清楚宣传政策；交流应聚焦员工的能力和工作绩效，过分强调某些群体更需要帮助可能适得其反。"},{"t":"国际视角：全球适用的多元化管理策略是可能的，但必须与各国当地文化和法律框架相符（如芬兰跨国公司 TRANSCO 在每个国家制定本地化政策）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">国际视角</strong>：全球适用的多元化管理策略是可能的，但必须与各国当地文化和法律框架相符（如芬兰跨国公司 TRANSCO 在每个国家制定本地化政策）。"}],"k":"b","i":1,"h":"2.6.4 有效的多元化项目"},{"t":"本章小结（并入）：本章关注传记特征、能力和多元化项目三个变量；多元化管理必须是持续性的并贯穿组织的各个层面，改善组织多元化氛围的政策是有效的。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章小结</strong>（并入）：本章关注传记特征、能力和多元化项目三个变量；多元化管理必须是持续性的并贯穿组织的各个层面，改善组织多元化氛围的政策是有效的。"},{"t":"对管理者的启示（并入）：充分了解组织的反歧视政策并与所有员工分享；评估和反思自己对刻板印象的看法以提高客观性；决定是否雇用时只考量个体能力而非传记特征，并鼓励个人透露隐性残疾；充分评估残疾人入职后需要的安置并按能力安排适宜工作；理解并尊重每个员工独特的传记特征，公平而个性化的方式能帮助组织获得最佳绩效。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（并入）：充分了解组织的反歧视政策并与所有员工分享；评估和反思自己对刻板印象的看法以提高客观性；决定是否雇用时只考量个体能力而非传记特征，并鼓励个人透露隐性残疾；充分评估残疾人入职后需要的安置并按能力安排适宜工作；理解并尊重每个员工独特的传记特征，公平而个性化的方式能帮助组织获得最佳绩效。"},{"t":"观点碰撞与道德困境：正反双方就\"平权法案是否已经失效\"展开辩论（正方认为其降低标准、引发不满并导致两极分化；反方认为平等尚未实现、平权法案提供的是机会）；道德困境讨论\"象征性雇佣\"（少数群体因与他人不同而被雇用来证明组织不歧视）与\"道德许可效应\"（本意为道德行事反而更可能做出有偏见或不道德的行为）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">观点碰撞与道德困境</strong>：正反双方就&quot;平权法案是否已经失效&quot;展开辩论（正方认为其降低标准、引发不满并导致两极分化；反方认为平等尚未实现、平权法案提供的是机会）；道德困境讨论&quot;象征性雇佣&quot;（少数群体因与他人不同而被雇用来证明组织不歧视）与&quot;道德许可效应&quot;（本意为道德行事反而更可能做出有偏见或不道德的行为）。"}],"k":"sec","i":0,"h":"2.6 多元化管理策略"}],"k":"chap","h":"第2章 组织中的多元化"},{"t":"第3章 态度与工作满意度","c":[{"t":"学习目标","c":[{"t":"1．区分态度的三种成分。","c":[],"k":"b","i":1,"h":"1．区分态度的三种成分。"},{"t":"2．总结态度与行为之间的关系。","c":[],"k":"b","i":1,"h":"2．总结态度与行为之间的关系。"},{"t":"3．对主要的工作态度进行比较。","c":[],"k":"b","i":1,"h":"3．对主要的工作态度进行比较。"},{"t":"4．界定工作满意度。","c":[],"k":"b","i":1,"h":"4．界定工作满意度。"},{"t":"5．总结影响工作满意度的主要原因。","c":[],"k":"b","i":1,"h":"5．总结影响工作满意度的主要原因。"},{"t":"6．指出工作满意度带来的三个后果。","c":[],"k":"b","i":1,"h":"6．指出工作满意度带来的三个后果。"},{"t":"7．指出员工在不满意时的四种反应方式。","c":[],"k":"b","i":1,"h":"7．指出员工在不满意时的四种反应方式。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"3.1 态度","c":[{"t":"态度（attitude）：个体针对物体、人物和事件的评价性陈述，可以是正面的也可以是负面的，反映一个人对某一对象的内心感受（如\"我喜欢我的工作\"）；态度背后原因往往复杂。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">态度</strong>（attitude）：个体针对物体、人物和事件的评价性陈述，可以是正面的也可以是负面的，反映一个人对某一对象的内心感受（如&quot;我喜欢我的工作&quot;）；态度背后原因往往复杂。"},{"t":"态度的三种成分（逐条）：","c":[{"t":"认知成分（cognitive component）：对事物的一种描述或看法（\"我的薪水很低\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">认知成分</strong>（cognitive component）：对事物的一种描述或看法（&quot;我的薪水很低&quot;）。"},{"t":"情感成分（affective component）：态度中的情绪或感受，是态度更关键的成分（\"我对我的工资如此之少感到气愤\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情感成分</strong>（affective component）：态度中的情绪或感受，是态度更关键的成分（&quot;我对我的工资如此之少感到气愤&quot;）。"},{"t":"行为成分（behavioral component）：个体以某种方式对某人或某事采取行动的意向（\"我要去找一份薪水更高的工作\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">行为成分</strong>（behavioral component）：个体以某种方式对某人或某事采取行动的意向（&quot;我要去找一份薪水更高的工作&quot;）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">态度的三种成分</strong>（逐条）："},{"t":"三成分的关系（图表3-1）：认知为情感奠定基础，情感能导致行为结果，三者密切相关；例：员工未获期望晋升——认知是\"主管提拔了能力不如我的同事，这不公平\"，情感是\"我讨厌我的主管\"，行为是\"表达不满并采取行动（要换工作、向人抱怨）\"。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">三成分的关系</strong>（图表3-1）：认知为情感奠定基础，情感能导致行为结果，三者密切相关；例：员工未获期望晋升——认知是&quot;主管提拔了能力不如我的同事，这不公平&quot;，情感是&quot;我讨厌我的主管&quot;，行为是&quot;表达不满并采取行动（要换工作、向人抱怨）&quot;。"},{"t":"意义：态度影响工作行为（如组织承诺影响员工留下还是离职），因此要了解承诺如何形成、如何改变。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">意义</strong>：态度影响工作行为（如组织承诺影响员工留下还是离职），因此要了解承诺如何形成、如何改变。"}],"k":"sec","i":0,"h":"3.1 态度"},{"t":"3.2 态度和行为","c":[{"t":"早期假设：态度是引发行为的原因（态度决定行为）；利昂·费斯廷格（Leon Festinger）提出行为决定态度；另有研究认为态度可以预测未来的行为。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">早期假设</strong>：态度是引发行为的原因（态度决定行为）；利昂·费斯廷格（Leon Festinger）提出行为决定态度；另有研究认为态度可以预测未来的行为。"},{"t":"认知失调（cognitive dissonance）：个体察觉到的自身行为和态度之间的不一致；任何形式的不协调都令人不安。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">认知失调</strong>（cognitive dissonance）：个体察觉到的自身行为和态度之间的不一致；任何形式的不协调都令人不安。"},{"t":"减少失调的两种方式：改变态度或行为使失调最小化，或使自相矛盾合理化；例：员工完成挑战性很大的工作后与同事聊一聊经历，社交性分享可帮助其调整对行为预期的态度。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">减少失调的两种方式</strong>：改变态度或行为使失调最小化，或使自相矛盾合理化；例：员工完成挑战性很大的工作后与同事聊一聊经历，社交性分享可帮助其调整对行为预期的态度。"},{"t":"减少失调意愿的三个影响因素：引发失调的因素的重要性、个体对这些因素的控制程度、不协调所带来的回报（高失调伴随高回报时不安会得到缓解）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">减少失调意愿的三个影响因素</strong>：引发失调的因素的重要性、个体对这些因素的控制程度、不协调所带来的回报（高失调伴随高回报时不安会得到缓解）。"},{"t":"态度与行为关系的五个最有力的调节变量（逐条）：","c":[{"t":"态度的重要性：基本价值观、自我利益的反映，或反映对自己看重的个体或群体的认同；重要的态度与行为高度相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">态度的重要性</strong>：基本价值观、自我利益的反映，或反映对自己看重的个体或群体的认同；重要的态度与行为高度相关。"},{"t":"态度与行为的一致性（对应性）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">态度与行为的一致性</strong>（对应性）。"},{"t":"态度的可提取性：越容易被记住（频繁表达）的态度越可能影响行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">态度的可提取性</strong>：越容易被记住（频繁表达）的态度越可能影响行为。"},{"t":"社会压力的存在：社会压力强大时，态度与行为之间更可能出现差异（大多数组织具有这些特点）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社会压力的存在</strong>：社会压力强大时，态度与行为之间更可能出现差异（大多数组织具有这些特点）。"},{"t":"个体对这种态度是否有直接经验：有直接经验时态度与行为的关系更显著。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个体对这种态度是否有直接经验</strong>：有直接经验时态度与行为的关系更显著。"}],"k":"b","i":1,"h":"<strong class=\"lead\">态度与行为关系的五个最有力的调节变量</strong>（逐条）："}],"k":"sec","i":0,"h":"3.2 态度和行为"},{"t":"3.3 工作态度","c":[{"t":"研究最集中的三种态度：工作满意度、工作卷入和组织承诺；其他重要态度包括组织支持感和员工敬业度。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">研究最集中的三种态度</strong>：工作满意度、工作卷入和组织承诺；其他重要态度包括组织支持感和员工敬业度。"},{"t":"3.3.1 工作满意度和工作卷入","c":[{"t":"工作满意度（job satisfaction）：对工作特点进行评估后而产生的对工作的积极态度；满意度高表示对工作持积极态度，低则持消极态度。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工作满意度</strong>（job satisfaction）：对工作特点进行评估后而产生的对工作的积极态度；满意度高表示对工作持积极态度，低则持消极态度。"},{"t":"工作卷入（job involvement）：测量一个人从心理上对其工作的认同程度，以及认为其工作绩效水平对自我价值的重要程度；工作卷入度高的员工对所做的工作有强烈认同感并在意自己的工作。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工作卷入</strong>（job involvement）：测量一个人从心理上对其工作的认同程度，以及认为其工作绩效水平对自我价值的重要程度；工作卷入度高的员工对所做的工作有强烈认同感并在意自己的工作。"},{"t":"心理授权（psychological empowerment）：员工关于自己能对工作环境产生影响（影响力 impact）、工作能力（competence）、工作意义（meaningfulness）及工作自主性（自我决定 self-determination）的信念；对工作态度和工作压力有很大影响，对工作表现有中等影响；把四种信念放在一起考虑时影响更大，其中\"工作意义\"的影响尤为持续。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">心理授权</strong>（psychological empowerment）：员工关于自己能对工作环境产生影响（影响力 impact）、工作能力（competence）、工作意义（meaningfulness）及工作自主性（自我决定 self-determination）的信念；对工作态度和工作压力有很大影响，对工作表现有中等影响；把四种信念放在一起考虑时影响更大，其中&quot;工作意义&quot;的影响尤为持续。"}],"k":"b","i":1,"h":"3.3.1 工作满意度和工作卷入"},{"t":"3.3.2 组织承诺","c":[{"t":"组织承诺（organizational commitment）：员工认同其组织及目标，并希望继续作为该组织成员；对组织的情感依恋以及对其价值观的认同是衡量组织承诺的\"黄金标准\"。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织承诺</strong>（organizational commitment）：员工认同其组织及目标，并希望继续作为该组织成员；对组织的情感依恋以及对其价值观的认同是衡量组织承诺的&quot;黄金标准&quot;。"},{"t":"含义：对组织做出承诺的员工即便不满也不太可能怠慢工作，因为出于依赖感和忠诚感认为自己应该努力工作，即使对当前工作不满意仍会留在组织。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">含义</strong>：对组织做出承诺的员工即便不满也不太可能怠慢工作，因为出于依赖感和忠诚感认为自己应该努力工作，即使对当前工作不满意仍会留在组织。"}],"k":"b","i":1,"h":"3.3.2 组织承诺"},{"t":"3.3.3 组织支持感","c":[{"t":"组织支持感（perceived organizational support, POS）：员工对组织在多大程度上重视他们的贡献、关心他们的福祉的看法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织支持感</strong>（perceived organizational support, POS）：员工对组织在多大程度上重视他们的贡献、关心他们的福祉的看法。"},{"t":"形成条件：员工认为报酬公平、能够参与决策、主管能提供支持时，会认为组织具有支持性（如 Salesforce.com 员工患病后 CEO 与员工共同承担治疗费用）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">形成条件</strong>：员工认为报酬公平、能够参与决策、主管能提供支持时，会认为组织具有支持性（如 Salesforce.com 员工患病后 CEO 与员工共同承担治疗费用）。"},{"t":"文化边界——权力距离（power distance）：人们对机构和组织中权力分配不平等情况的接受程度；在权力距离较低的国家，员工更可能把工作看作一种交换而不是道德义务，组织支持感十分重要；在高权力距离国家，组织支持感并不完全建立在公平、支持和鼓励的基础上。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化边界——权力距离</strong>（power distance）：人们对机构和组织中权力分配不平等情况的接受程度；在权力距离较低的国家，员工更可能把工作看作一种交换而不是道德义务，组织支持感十分重要；在高权力距离国家，组织支持感并不完全建立在公平、支持和鼓励的基础上。"}],"k":"b","i":1,"h":"3.3.3 组织支持感"},{"t":"3.3.4 员工敬业度","c":[{"t":"员工敬业度（employee engagement）：员工对工作的卷入度、满意度及工作的热情；评估时可问员工是否有资源和机会学习新技能、是否认为工作重要且有意义、对与同事或上级的互动是否满意。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">员工敬业度</strong>（employee engagement）：员工对工作的卷入度、满意度及工作的热情；评估时可问员工是否有资源和机会学习新技能、是否认为工作重要且有意义、对与同事或上级的互动是否满意。"},{"t":"结果证据：敬业度与员工表现和组织表现中度相关；员工敬业度高的经营单元客户满意度、生产效率和利润更高，离职率和事故发生率更低（如摩森康胜不敬业员工的事故是敬业员工的五倍；卡特彼勒提高敬业度后员工抱怨减少80%、非常满意的顾客增加34%）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结果证据</strong>：敬业度与员工表现和组织表现中度相关；员工敬业度高的经营单元客户满意度、生产效率和利润更高，离职率和事故发生率更低（如摩森康胜不敬业员工的事故是敬业员工的五倍；卡特彼勒提高敬业度后员工抱怨减少80%、非常满意的顾客增加34%）。"},{"t":"概念争议：敬业度难以从相关结构中分离，曾被指代心理状态、个性特征和行为等不同现象，测量问题与满意度、承诺度、卷入度相似，被称为\"任何人都可以随意使用的一个流行术语\"；总体上它能对重要结果产生影响，但与其他工作态度的差别仍待研究。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">概念争议</strong>：敬业度难以从相关结构中分离，曾被指代心理状态、个性特征和行为等不同现象，测量问题与满意度、承诺度、卷入度相似，被称为&quot;任何人都可以随意使用的一个流行术语&quot;；总体上它能对重要结果产生影响，但与其他工作态度的差别仍待研究。"}],"k":"b","i":1,"h":"3.3.4 员工敬业度"},{"t":"3.3.5 这些工作态度有区别吗？","c":[{"t":"结论：这些态度之间高度相关但确有差异，重叠的原因包括员工的人格；一般而言，知道一个人的工作满意度水平，差不多也就知道其对组织的看法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：这些态度之间高度相关但确有差异，重叠的原因包括员工的人格；一般而言，知道一个人的工作满意度水平，差不多也就知道其对组织的看法。"}],"k":"b","i":1,"h":"3.3.5 这些工作态度有区别吗？"}],"k":"sec","i":0,"h":"3.3 工作态度"},{"t":"3.4 工作满意度","c":[{"t":"定义：针对工作特点进行评估而产生的对工作的积极感觉；工作不仅包括可见的活动，还包括与同事上司互动、遵守规章、适应权力结构和绩效标准等，满意度是对大量不同工作要素综合概括后的结果。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">定义</strong>：针对工作特点进行评估而产生的对工作的积极感觉；工作不仅包括可见的活动，还包括与同事上司互动、遵守规章、适应权力结构和绩效标准等，满意度是对大量不同工作要素综合概括后的结果。"},{"t":"3.4.1 测量工作满意度","c":[{"t":"单一整体评估法（single global rating）：只要求回答一个问题（如\"把所有要素考虑在内，你对自己的工作满意吗？\"），在1~5等级中选择；耗时短。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">单一整体评估法</strong>（single global rating）：只要求回答一个问题（如&quot;把所有要素考虑在内，你对自己的工作满意吗？&quot;），在1~5等级中选择；耗时短。"},{"t":"工作要素综合评价法（summation of job facets）：先确定工作类型、所需技能、监督控制、当前收入、晋升机会和同事关系等关键要素，在标准化量表上评估后累加得到总分；能帮助管理者找到问题根源、更快更准确地解决问题。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工作要素综合评价法</strong>（summation of job facets）：先确定工作类型、所需技能、监督控制、当前收入、晋升机会和同事关系等关键要素，在标准化量表上评估后累加得到总分；能帮助管理者找到问题根源、更快更准确地解决问题。"},{"t":"对比结论：研究结果并非\"越综合越精确\"——两种方法的有效性等同，都是有效的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对比结论</strong>：研究结果并非&quot;越综合越精确&quot;——两种方法的有效性等同，都是有效的。"}],"k":"b","i":1,"h":"3.4.1 测量工作满意度"},{"t":"3.4.2 员工对工作有多满意？","c":[{"t":"时间趋势：工作满意度可在相当一致的水平上保持（1972—2006年美国平均满意度一直很高）；经济形势影响满意度——2007年末经济危机后于2010年降至最低（42.6%的美国工人满意），2014年反弹至约47.7%，仍远低于1987年的61.1%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">时间趋势</strong>：工作满意度可在相当一致的水平上保持（1972—2006年美国平均满意度一直很高）；经济形势影响满意度——2007年末经济危机后于2010年降至最低（42.6%的美国工人满意），2014年反弹至约47.7%，仍远低于1987年的61.1%。"},{"t":"分要素差异：人们对总体状况、工作本身、主管和同事的满意度较高，对薪酬和晋升机会的满意度较低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">分要素差异</strong>：人们对总体状况、工作本身、主管和同事的满意度较高，对薪酬和晋升机会的满意度较低。"},{"t":"文化差异：工作满意度存在文化差异（15国调查中墨西哥和瑞士最高、韩国最低；可能与文化中的自我批评程度、自治水平和企业层级结构有关，但难以厘清全部因素）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化差异</strong>：工作满意度存在文化差异（15国调查中墨西哥和瑞士最高、韩国最低；可能与文化中的自我批评程度、自治水平和企业层级结构有关，但难以厘清全部因素）。"}],"k":"b","i":1,"h":"3.4.2 员工对工作有多满意？"}],"k":"sec","i":0,"h":"3.4 工作满意度"},{"t":"3.5 哪些因素会带来工作满意度","c":[{"t":"3.5.1 工作条件","c":[{"t":"核心结论：一份能够提供培训、具有多样性、允许独立完成且拥有控制权的有趣工作能使大多数员工感到满意。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心结论</strong>：一份能够提供培训、具有多样性、允许独立完成且拥有控制权的有趣工作能使大多数员工感到满意。"},{"t":"相关因素：相互依赖、反馈、社会支持、工作场所之外与同事的互动都与满意度高度相关；管理者对员工满意度有重要影响（个人主义文化中领导者与员工的交流质量与满意度关系更密切；集体主义文化中领导者的情绪智力与满意度关系更密切）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">相关因素</strong>：相互依赖、反馈、社会支持、工作场所之外与同事的互动都与满意度高度相关；管理者对员工满意度有重要影响（个人主义文化中领导者与员工的交流质量与满意度关系更密切；集体主义文化中领导者的情绪智力与满意度关系更密切）。"},{"t":"重要性排序：工作条件（工作本身的内在性质、社交互动、监督管理）都是影响因素且相对价值因人而异，但工作的内在性质最重要。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">重要性排序</strong>：工作条件（工作本身的内在性质、社交互动、监督管理）都是影响因素且相对价值因人而异，但工作的内在性质最重要。"}],"k":"b","i":1,"h":"3.5.1 工作条件"},{"t":"3.5.2 人格","c":[{"t":"核心自我评价（core self-evaluation, CSE）：相信自己的内在价值和基本能力的人，比消极核心自我评价者对自己工作的满意度更高；在重视集体主义的文化里，核心自我评价高的人工作满意度可能特别高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心自我评价</strong>（core self-evaluation, CSE）：相信自己的内在价值和基本能力的人，比消极核心自我评价者对自己工作的满意度更高；在重视集体主义的文化里，核心自我评价高的人工作满意度可能特别高。"}],"k":"b","i":1,"h":"3.5.2 人格"},{"t":"3.5.3 薪酬","c":[{"t":"结论：薪酬与工作满意度和整体幸福感相关，但一旦个人薪酬达到平均水平，薪酬带来的影响就会变小；金钱有激励作用，但能激励人的因素未必让人幸福。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：薪酬与工作满意度和整体幸福感相关，但一旦个人薪酬达到平均水平，薪酬带来的影响就会变小；金钱有激励作用，但能激励人的因素未必让人幸福。"}],"k":"b","i":1,"h":"3.5.3 薪酬"},{"t":"3.5.4 企业社会责任","c":[{"t":"企业社会责任（corporate social responsibility, CSR）：企业为了使社会或环境受益而采取的超出法律要求的自我调节行为（如环境可持续性倡议、非营利性工作、慈善捐赠）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">企业社会责任</strong>（corporate social responsibility, CSR）：企业为了使社会或环境受益而采取的超出法律要求的自我调节行为（如环境可持续性倡议、非营利性工作、慈善捐赠）。"},{"t":"正面证据：个人价值观与所在组织CSR更匹配的员工满意度更高；86%的被调查组织表示CSR项目提升了员工幸福感；对千禧一代尤其显著（追求\"人类、地球和收入\"的三重底线）；将工作视为更远大目标一部分的人满意度更高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">正面证据</strong>：个人价值观与所在组织CSR更匹配的员工满意度更高；86%的被调查组织表示CSR项目提升了员工幸福感；对千禧一代尤其显著（追求&quot;人类、地球和收入&quot;的三重底线）；将工作视为更远大目标一部分的人满意度更高。"},{"t":"三种失效情形（逐条）：非自愿参加志愿者活动会降低总体工作满意度；以规定的、做作的方式施加\"变得高尚\"的压力会使员工筋疲力尽，尤其当项目为组织带来直接利益（如正面新闻报道）时——员工希望CSR真诚且真实；CSR措施与员工实际工作脱节时无法提高满意度（如毕马威宣传片引发员工\"为什么我还坐在这里\"的质疑）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三种失效情形</strong>（逐条）：非自愿参加志愿者活动会降低总体工作满意度；以规定的、做作的方式施加&quot;变得高尚&quot;的压力会使员工筋疲力尽，尤其当项目为组织带来直接利益（如正面新闻报道）时——员工希望CSR真诚且真实；CSR措施与员工实际工作脱节时无法提高满意度（如毕马威宣传片引发员工&quot;为什么我还坐在这里&quot;的质疑）。"},{"t":"总结论：CSR是问责制与服务的必要而积极的趋势，管理得当才能提高员工满意度（措施必须可持续）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总结论</strong>：CSR是问责制与服务的必要而积极的趋势，管理得当才能提高员工满意度（措施必须可持续）。"}],"k":"b","i":1,"h":"3.5.4 企业社会责任"}],"k":"sec","i":0,"h":"3.5 哪些因素会带来工作满意度"},{"t":"3.6 工作满意度的结果","c":[{"t":"说明：学习目标提到三个后果，本章实际展开四项——工作绩效、组织公民行为、客户满意度、生活满意度。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">说明</strong>：学习目标提到三个后果，本章实际展开四项——工作绩效、组织公民行为、客户满意度、生活满意度。"},{"t":"3.6.1 工作绩效：曾被认为是管理学谣言，但针对300项研究的元分析表明工作满意度与工作绩效具有很强的相关性；满意度较高的人表现更好，员工满意度高的组织更高效。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">3.6.1 工作绩效</strong>：曾被认为是管理学谣言，但针对300项研究的元分析表明工作满意度与工作绩效具有很强的相关性；满意度较高的人表现更好，员工满意度高的组织更高效。"},{"t":"3.6.2 组织公民行为：工作满意度与组织公民行为（organizational citizenship behavior, OCB，包括积极谈论组织、帮助他人、完成超出一般期望的工作）有中等程度的相关；机制包括信任（管理者以信任回报员工的OCB）、同事支持、人格（外向和责任心者更满意因而更多OCB）、同伴的积极反馈。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">3.6.2 组织公民行为</strong>：工作满意度与组织公民行为（organizational citizenship behavior, OCB，包括积极谈论组织、帮助他人、完成超出一般期望的工作）有中等程度的相关；机制包括信任（管理者以信任回报员工的OCB）、同事支持、人格（外向和责任心者更满意因而更多OCB）、同伴的积极反馈。"},{"t":"3.6.3 客户满意度：对定期与客户打交道的员工，答案基本是肯定的——满意度高的员工和管理者能提高客户的满意度和忠诚度，且员工满意度与客户满意度相互关联（客户满意度对员工满意度的内在影响可能更强）；例：Zappos 培训后给2000美元请最不满意的员工离开，赋权员工服务客户，超过2400万客户中75%是回头客。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">3.6.3 客户满意度</strong>：对定期与客户打交道的员工，答案基本是肯定的——满意度高的员工和管理者能提高客户的满意度和忠诚度，且员工满意度与客户满意度相互关联（客户满意度对员工满意度的内在影响可能更强）；例：Zappos 培训后给2000美元请最不满意的员工离开，赋权员工服务客户，超过2400万客户中75%是回头客。"},{"t":"3.6.4 生活满意度：工作满意度与生活满意度正相关；失业时生活满意度会下降且不仅是收入损失；对大多数人而言工作是生活的重要组成部分，总体幸福感很大程度取决于工作幸福感。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">3.6.4 生活满意度</strong>：工作满意度与生活满意度正相关；失业时生活满意度会下降且不仅是收入损失；对大多数人而言工作是生活的重要组成部分，总体幸福感很大程度取决于工作幸福感。"},{"t":"职业目标（我应该如何让我的工作变得更好）：讨厌工作但不便离职时，可以列出讨厌与喜欢的所有具体事项并追问原因、找可信的朋友帮助处理委屈、判断是否存在骚扰等不可容忍的根本问题、决定是否与管理者沟通，把\"我讨厌我的工作\"转变为改善处境的主动行动。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">职业目标</strong>（我应该如何让我的工作变得更好）：讨厌工作但不便离职时，可以列出讨厌与喜欢的所有具体事项并追问原因、找可信的朋友帮助处理委屈、判断是否存在骚扰等不可容忍的根本问题、决定是否与管理者沟通，把&quot;我讨厌我的工作&quot;转变为改善处境的主动行动。"}],"k":"sec","i":0,"h":"3.6 工作满意度的结果"},{"t":"3.7 工作不满的影响","c":[{"t":"退出—建言—忠诚—怠工（exit-voice-loyalty-neglect）框架（图表3-6）：按建设性/破坏性与积极性/消极性两个维度区分员工的四种反应（逐条）：","c":[{"t":"退出（exit）：直接离开组织，包括寻找新工作岗位或辞职——积极性、破坏性象限；影响以个体离职、集体离职及组织总体损失衡量。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">退出</strong>（exit）：直接离开组织，包括寻找新工作岗位或辞职——积极性、破坏性象限；影响以个体离职、集体离职及组织总体损失衡量。"},{"t":"建言（voice）：付出建设性的努力来改善工作条件，包括提出改进建议、与上司讨论问题以及开展工会活动——积极性、建设性象限。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">建言</strong>（voice）：付出建设性的努力来改善工作条件，包括提出改进建议、与上司讨论问题以及开展工会活动——积极性、建设性象限。"},{"t":"忠诚（loyalty）：被动但乐观地等待环境有所改善，包括面对外部批评时站出来为组织说话、相信组织及管理层会做\"正确的事\"——消极性、建设性象限。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">忠诚</strong>（loyalty）：被动但乐观地等待环境有所改善，包括面对外部批评时站出来为组织说话、相信组织及管理层会做&quot;正确的事&quot;——消极性、建设性象限。"},{"t":"怠工（neglect）：被动地放任事态变得越来越糟，包括长期缺勤或迟到、降低努力程度和失误率上升——消极性、破坏性象限。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">怠工</strong>（neglect）：被动地放任事态变得越来越糟，包括长期缺勤或迟到、降低努力程度和失误率上升——消极性、破坏性象限。"}],"k":"b","i":1,"h":"<strong class=\"lead\">退出—建言—忠诚—怠工</strong>（exit-voice-loyalty-neglect）框架（图表3-6）：按建设性/破坏性与积极性/消极性两个维度区分员工的四种反应（逐条）："},{"t":"框架价值：退出和怠工与生产率、缺勤率和流动率相关；建言和忠诚补充了建设性反应，帮助个体容忍不愉快情境或改善工作条件（如工会成员通过申诉程序和劳资谈判表达不满）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">框架价值</strong>：退出和怠工与生产率、缺勤率和流动率相关；建言和忠诚补充了建设性反应，帮助个体容忍不愉快情境或改善工作条件（如工会成员通过申诉程序和劳资谈判表达不满）。"},{"t":"3.7.1 反生产工作行为","c":[{"t":"反生产工作行为（counterproductive work behavior, CWB）：滥用办公用品、偷盗、过度社会化、闲聊、旷工和迟到等损害组织行为的症候群，也称工作场所异常行为或员工退缩。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反生产工作行为</strong>（counterproductive work behavior, CWB）：滥用办公用品、偷盗、过度社会化、闲聊、旷工和迟到等损害组织行为的症候群，也称工作场所异常行为或员工退缩。"},{"t":"成因与特点：伴随消极的、有时长期存在的态度出现；工作不满是重要原因（不满→沮丧→更易出现CWB），对男性的关系可能更强（进取心更强、对冲动控制更弱）；直接工作环境的规范会推动CWB（高缺勤率团队中的个人更可能缺勤）；也可能是对管理者滥用监督权的回应，形成恶性循环。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成因与特点</strong>：伴随消极的、有时长期存在的态度出现；工作不满是重要原因（不满→沮丧→更易出现CWB），对男性的关系可能更强（进取心更强、对冲动控制更弱）；直接工作环境的规范会推动CWB（高缺勤率团队中的个人更可能缺勤）；也可能是对管理者滥用监督权的回应，形成恶性循环。"},{"t":"管理含义：不满员工会以不同方式进行\"报复\"，仅控制某种行为（如实施缺勤控制政策）不会消除真正根源，雇主应当消除问题根源；CWB有时是对不公平感的情绪反应，是员工试图恢复公平交换感的\"扯平\"；可调查员工态度、衡量CWB（员工自我汇报与同事或主管汇报同样有效）、建立强大团队、整合团队监管、提供正式团队政策和基于团队的激励措施。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理含义</strong>：不满员工会以不同方式进行&quot;报复&quot;，仅控制某种行为（如实施缺勤控制政策）不会消除真正根源，雇主应当消除问题根源；CWB有时是对不公平感的情绪反应，是员工试图恢复公平交换感的&quot;扯平&quot;；可调查员工态度、衡量CWB（员工自我汇报与同事或主管汇报同样有效）、建立强大团队、整合团队监管、提供正式团队政策和基于团队的激励措施。"},{"t":"缺勤：满意度和缺勤之间存在稳定的负相关，但为中低程度；有大量工作机会可供选择时，不满意员工缺勤率较高，别无选择时与满意员工一样低；慷慨的病假福利实际上鼓励所有员工休病假。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">缺勤</strong>：满意度和缺勤之间存在稳定的负相关，但为中低程度；有大量工作机会可供选择时，不满意员工缺勤率较高，别无选择时与满意员工一样低；慷慨的病假福利实际上鼓励所有员工休病假。"},{"t":"离职：工作满意度与离职的相关性比与缺勤更高；存在\"传染效应\"（总体满意度低的工作场所会带动离职）；关系受其他工作机会影响——员工更可能因\"拉力\"（其他工作的诱惑）而非\"推力\"（当前工作的不足）离开；人力资本高（高学历、能力强）者不满更易转化为离职；员工嵌入度（job embeddedness，员工与工作和社区的联系）可减小离职可能性，尤其在集体主义文化中。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">离职</strong>：工作满意度与离职的相关性比与缺勤更高；存在&quot;传染效应&quot;（总体满意度低的工作场所会带动离职）；关系受其他工作机会影响——员工更可能因&quot;拉力&quot;（其他工作的诱惑）而非&quot;推力&quot;（当前工作的不足）离开；人力资本高（高学历、能力强）者不满更易转化为离职；员工嵌入度（job embeddedness，员工与工作和社区的联系）可减小离职可能性，尤其在集体主义文化中。"}],"k":"b","i":1,"h":"3.7.1 反生产工作行为"},{"t":"3.7.2 管理者通常\"没有真正注意员工满意度问题\"","c":[{"t":"证据：管理者高估员工满意度——86%的高级管理人员认为组织对员工不错，只有55%的员工认同；55%的管理者认为组织斗志良好，认同的员工仅38%。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证据</strong>：管理者高估员工满意度——86%的高级管理人员认为组织对员工不错，只有55%的员工认同；55%的管理者认为组织斗志良好，认同的员工仅38%。"},{"t":"后果：斗志旺盛（超过70%员工整体满意）的公司股价上升19.4%，斗志中等或低落组仅上升10%；理解差距会影响盈亏。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">后果</strong>：斗志旺盛（超过70%员工整体满意）的公司股价上升19.4%，斗志中等或低落组仅上升10%；理解差距会影响盈亏。"},{"t":"对策：定期统计调查可缩小管理者认知与员工真实感受的差距（如休斯敦肯德基餐厅经理每三个月调查一次并据结果改善，员工感到\"有发言权、有人倾听\"）；统计调查不是万金油，但改善工作态度需要想尽一切合理的办法。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对策</strong>：定期统计调查可缩小管理者认知与员工真实感受的差距（如休斯敦肯德基餐厅经理每三个月调查一次并据结果改善，员工感到&quot;有发言权、有人倾听&quot;）；统计调查不是万金油，但改善工作态度需要想尽一切合理的办法。"}],"k":"b","i":1,"h":"3.7.2 管理者通常&quot;没有真正注意员工满意度问题&quot;"},{"t":"本章小结与对管理者的启示（并入）：管理者应关心员工态度，因为态度会影响员工行为并可预示潜在问题；在主要工作态度中，工作满意度是预测行为的最佳单一因子；应将满意度看作绩效、离职、缺勤和退缩行为的决定因素，定期衡量员工的工作态度；为提高满意度，应把员工的工作兴趣与工作内容相匹配，使工作既有挑战性又有趣；仅靠高薪无法营造出令人满意的工作环境。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章小结与对管理者的启示</strong>（并入）：管理者应关心员工态度，因为态度会影响员工行为并可预示潜在问题；在主要工作态度中，工作满意度是预测行为的最佳单一因子；应将满意度看作绩效、离职、缺勤和退缩行为的决定因素，定期衡量员工的工作态度；为提高满意度，应把员工的工作兴趣与工作内容相匹配，使工作既有挑战性又有趣；仅靠高薪无法营造出令人满意的工作环境。"},{"t":"观点碰撞与道德困境：正反双方辩论\"雇主与员工之间的忠诚是否已经过时\"（正方认为短合同、外包与自动化使双向忠诚脆弱；反方认为忠诚以组织信任、组织承诺等更精细的标准延续）；道德困境讨论 Glassdoor、Memo 等匿名\"树洞网站\"上员工评价雇主的道德问题（坦诚反馈的价值与言论自由权、组织安全与管理调查伦理的冲突）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">观点碰撞与道德困境</strong>：正反双方辩论&quot;雇主与员工之间的忠诚是否已经过时&quot;（正方认为短合同、外包与自动化使双向忠诚脆弱；反方认为忠诚以组织信任、组织承诺等更精细的标准延续）；道德困境讨论 Glassdoor、Memo 等匿名&quot;树洞网站&quot;上员工评价雇主的道德问题（坦诚反馈的价值与言论自由权、组织安全与管理调查伦理的冲突）。"}],"k":"sec","i":0,"h":"3.7 工作不满的影响"}],"k":"chap","h":"第3章 态度与工作满意度"},{"t":"第4章 情绪与心境","c":[{"t":"学习目标","c":[{"t":"区分情绪和心境。","c":[],"k":"b","i":1,"h":"区分情绪和心境。"},{"t":"识别情绪与心境的来源。","c":[],"k":"b","i":1,"h":"识别情绪与心境的来源。"},{"t":"描述情绪劳动对员工的影响。","c":[],"k":"b","i":1,"h":"描述情绪劳动对员工的影响。"},{"t":"描述情感事件理论。","c":[],"k":"b","i":1,"h":"描述情感事件理论。"},{"t":"描述情绪智力。","c":[],"k":"b","i":1,"h":"描述情绪智力。"},{"t":"了解情绪调节策略。","c":[],"k":"b","i":1,"h":"了解情绪调节策略。"},{"t":"将关于情绪和心境的概念应用到组织行为的具体问题中。","c":[],"k":"b","i":1,"h":"将关于情绪和心境的概念应用到组织行为的具体问题中。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"4.1 什么是情绪和心境","c":[{"t":"三个密切相关的概念：情感、情绪、心境。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">三个密切相关的概念</strong>：情感、情绪、心境。"},{"t":"情感（affect）：所有感觉的统称，包含情绪和心境两个成分。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情感</strong>（affect）：所有感觉的统称，包含情绪和心境两个成分。"},{"t":"情绪（emotion）：一种强烈的、离散的、短暂的情感体验。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">情绪</strong>（emotion）：一种强烈的、离散的、短暂的情感体验。"},{"t":"心境（mood）：比情绪更持久、更弱、且通常不因某个具体事件的刺激而产生的情感。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">心境</strong>（mood）：比情绪更持久、更弱、且通常不因某个具体事件的刺激而产生的情感。"},{"t":"情感、情绪和心境的对比（图表4-1）：","c":[{"t":"情绪：由具体事件引起；持续时间短（几秒钟或几分钟）；以具体性和多样化为特点（如愤怒、害怕、悲伤、高兴、厌恶、惊奇）；通常伴随明显的面部表情；本质上是行动导向的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情绪</strong>：由具体事件引起；持续时间短（几秒钟或几分钟）；以具体性和多样化为特点（如愤怒、害怕、悲伤、高兴、厌恶、惊奇）；通常伴随明显的面部表情；本质上是行动导向的。"},{"t":"心境：原因通常宽泛且不清晰；持续时间比情绪长（几小时或几天）；更具一般性（包括积极情感和消极情感两个主要维度，由多种具体情绪组成）；通常没有明显的表情显露；本质上具有认知性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">心境</strong>：原因通常宽泛且不清晰；持续时间比情绪长（几小时或几天）；更具一般性（包括积极情感和消极情感两个主要维度，由多种具体情绪组成）；通常没有明显的表情显露；本质上具有认知性。"}],"k":"b","i":1,"h":"<strong class=\"lead\">情感、情绪和心境的对比</strong>（图表4-1）："},{"t":"实践中三者的差异并不总是十分明显：一些研究领域中情绪方面的信息更多，另一些领域中心境方面的信息更多。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">实践中三者的差异并不总是十分明显</strong>：一些研究领域中情绪方面的信息更多，另一些领域中心境方面的信息更多。"},{"t":"本章小结（并入）：情绪和心境本质都是情感，但心境比情绪更宽泛、情境线索更少。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章小结</strong>（并入）：情绪和心境本质都是情感，但心境比情绪更宽泛、情境线索更少。"},{"t":"4.1.1 基本的情绪","c":[{"t":"情绪多达几十种：愤怒、轻蔑、热情、羡慕、害怕、挫败、失望、困窘、厌恶、快乐、憎恨、希望、嫉妒、欢快、热爱、骄傲、惊奇、悲伤等。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情绪多达几十种</strong>：愤怒、轻蔑、热情、羡慕、害怕、挫败、失望、困窘、厌恶、快乐、憎恨、希望、嫉妒、欢快、热爱、骄傲、惊奇、悲伤等。"},{"t":"通过面部表情识别基本情绪的困难：有的情绪太复杂不易表现；跨文化识别的准确性随文化接触减少而变差；某些文化规范限制情绪表达（集体主义文化克制情绪、更注重眼神；个人主义文化表达情绪、更注重口型）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">通过面部表情识别基本情绪的困难</strong>：有的情绪太复杂不易表现；跨文化识别的准确性随文化接触减少而变差；某些文化规范限制情绪表达（集体主义文化克制情绪、更注重眼神；个人主义文化表达情绪、更注重口型）。"},{"t":"许多研究者认同六种普遍情绪：愤怒、害怕、悲伤、快乐、厌恶、惊讶；快乐常被当作惊讶，但基本不会混淆快乐和厌恶。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">许多研究者认同六种普遍情绪</strong>：愤怒、害怕、悲伤、快乐、厌恶、惊讶；快乐常被当作惊讶，但基本不会混淆快乐和厌恶。"}],"k":"b","i":1,"h":"4.1.1 基本的情绪"},{"t":"4.1.2 道德情绪","c":[{"t":"道德情绪（moral emotion）：由于我们对唤起情绪的情况的即时判断而具有道德意义的情绪。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">道德情绪</strong>（moral emotion）：由于我们对唤起情绪的情况的即时判断而具有道德意义的情绪。"},{"t":"例子：对他人痛苦的同情、对自己不道德行为的内疚、对他人受到不公正对待的愤怒、对不道德行为者的蔑视。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">例子</strong>：对他人痛苦的同情、对自己不道德行为的内疚、对他人受到不公正对待的愤怒、对不道德行为者的蔑视。"},{"t":"道德厌恶：对违反道德规范行为的不屑，与其他形式的厌恶相互独立（不小心踩了牛粪是生理厌恶，不做道德判断；听到歧视性言论则是冒犯是非观念的道德厌恶）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">道德厌恶</strong>：对违反道德规范行为的不屑，与其他形式的厌恶相互独立（不小心踩了牛粪是生理厌恶，不做道德判断；听到歧视性言论则是冒犯是非观念的道德厌恶）。"},{"t":"结论：道德情绪在儿童学习道德规范和标准的过程中发展起来，更依赖情景和规范语境，道德因文化而异，道德情绪也是如此；行为符合道德的人在一定程度上是根据情绪和感觉来做出决策的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：道德情绪在儿童学习道德规范和标准的过程中发展起来，更依赖情景和规范语境，道德因文化而异，道德情绪也是如此；行为符合道德的人在一定程度上是根据情绪和感觉来做出决策的。"}],"k":"b","i":1,"h":"4.1.2 道德情绪"},{"t":"4.1.3 基本的心境：积极情感和消极情感","c":[{"t":"积极情绪（如快乐、感激）表达快乐的评价或情感；消极情绪（如愤怒、内疚）表达相反的内容；情绪不会是中性的，中性的感觉不是情绪。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">积极情绪</strong>（如快乐、感激）表达快乐的评价或情感；消极情绪（如愤怒、内疚）表达相反的内容；情绪不会是中性的，中性的感觉不是情绪。"},{"t":"积极情感（positive affect）：心境的一个维度，由积极的情绪组成，程度高的一端包括兴奋、得意、快乐等高度积极情感。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">积极情感</strong>（positive affect）：心境的一个维度，由积极的情绪组成，程度高的一端包括兴奋、得意、快乐等高度积极情感。"},{"t":"消极情感（negative affect）：心境的另一个维度，程度高的一端由紧张、压力、沮丧等高度消极情感组成。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">消极情感</strong>（negative affect）：心境的另一个维度，程度高的一端由紧张、压力、沮丧等高度消极情感组成。"},{"t":"心境的结构（图表4-2）：以积极情感和消极情感两个维度（各有高低）定位各种感受；兴奋是高度积极情感的纯粹指标，厌倦是低度积极情感的纯粹指标，紧张是高度消极情感的纯粹指标，放松是低度消极情感的纯粹指标；满意和悲伤居于中间；惊讶等情绪既不明显积极也不明显消极，无法匹配。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">心境的结构</strong>（图表4-2）：以积极情感和消极情感两个维度（各有高低）定位各种感受；兴奋是高度积极情感的纯粹指标，厌倦是低度积极情感的纯粹指标，紧张是高度消极情感的纯粹指标，放松是低度消极情感的纯粹指标；满意和悲伤居于中间；惊讶等情绪既不明显积极也不明显消极，无法匹配。"},{"t":"个体差异：在一周里体验到相当多两种情感的人是情绪化的（情感强烈）的人；几乎不体验两种情感的是非情绪化的（沉着冷静）的人；也有人更多体验其中一种。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个体差异</strong>：在一周里体验到相当多两种情感的人是情绪化的（情感强烈）的人；几乎不体验两种情感的是非情绪化的（沉着冷静）的人；也有人更多体验其中一种。"}],"k":"b","i":1,"h":"<strong class=\"lead\">4.1.3 基本的心境</strong>：积极情感和消极情感"},{"t":"4.1.4 体验心境和情绪","c":[{"t":"正向偏移（positivity offset）：当处于零输入（没有特别的事情发生）时，多数人的心境是中度积极的；对多数人来说积极心境比消极心境更常见。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">正向偏移</strong>（positivity offset）：当处于零输入（没有特别的事情发生）时，多数人的心境是中度积极的；对多数人来说积极心境比消极心境更常见。"},{"t":"佐证：英国呼叫中心客服代表虽环境压力大，仍自称在58%的时间里处于积极心境；消极情绪会导致消极心境（产生强烈消极情绪的事件数量约为积极情绪事件的五倍）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">佐证</strong>：英国呼叫中心客服代表虽环境压力大，仍自称在58%的时间里处于积极心境；消极情绪会导致消极心境（产生强烈消极情绪的事件数量约为积极情绪事件的五倍）。"},{"t":"文化差异：各地的人都将消极情绪（仇恨、恐惧、愤怒）看作危险且具破坏性的，都渴望积极情绪（快乐、爱、幸福），但个人情绪体验会被文化塑造（日本、俄罗斯较接受消极情绪；墨西哥、巴西强调积极情绪和表达；与美国人相比，中国人认为消极情绪可能更有用且更具建设性）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化差异</strong>：各地的人都将消极情绪（仇恨、恐惧、愤怒）看作危险且具破坏性的，都渴望积极情绪（快乐、爱、幸福），但个人情绪体验会被文化塑造（日本、俄罗斯较接受消极情绪；墨西哥、巴西强调积极情绪和表达；与美国人相比，中国人认为消极情绪可能更有用且更具建设性）。"},{"t":"消极情感也有好处：德国研究表明重视消极情感使人更容易接受并适应现状，减少对身心健康和决策的负面影响；消极情感还可能使管理者更加公正审慎地思考。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">消极情感也有好处</strong>：德国研究表明重视消极情感使人更容易接受并适应现状，减少对身心健康和决策的负面影响；消极情感还可能使管理者更加公正审慎地思考。"}],"k":"b","i":1,"h":"4.1.4 体验心境和情绪"},{"t":"4.1.5 情绪的作用","c":[{"t":"快乐的员工更容易有积极的工作态度，表现出更少的退缩和反生产工作行为，承担更多任务和公民责任，甚至比不快乐的对手更成功。","c":[],"k":"b","i":2,"h":"快乐的员工更容易有积极的工作态度，表现出更少的退缩和反生产工作行为，承担更多任务和公民责任，甚至比不快乐的对手更成功。"},{"t":"情绪会使我们失去理性吗？不会：情绪反映我们对周围世界的认知并指导行为，使思考更理性；处于消极心境中的人可能比心境愉快的人更能分辨真实信息和不准确的信息。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">情绪会使我们失去理性吗？不会</strong>：情绪反映我们对周围世界的认知并指导行为，使思考更理性；处于消极心境中的人可能比心境愉快的人更能分辨真实信息和不准确的信息。
