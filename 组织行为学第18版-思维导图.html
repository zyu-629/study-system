培训通过提高熟练度提升自我效能，互动式、带反馈的培训效果更好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">补充</strong>：智力与人格（高智商、高责任心、高情绪稳定性）也提高自我效能，有研究者因此视其为自信聪明者的&quot;副产品&quot;；培训通过提高熟练度提升自我效能，互动式、带反馈的培训效果更好。"}],"k":"b","i":1,"h":"<strong class=\"lead\">自我效能理论</strong>（self-efficacy theory，班杜拉）："},{"t":"强化理论（reinforcement theory）：","c":[{"t":"定位：行为主义观点——行为由环境导致、强化塑造行为；不考虑内部认知状态，只关注行为的后果；严格说不是动机理论，但提供了分析行为控制的有力工具，故纳入动机讨论。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定位</strong>：行为主义观点——行为由环境导致、强化塑造行为；不考虑内部认知状态，只关注行为的后果；严格说不是动机理论，但提供了分析行为控制的有力工具，故纳入动机讨论。"},{"t":"操作性条件反射：人们学会行事以获得想要的、避免不想要的；斯金纳（B.F.Skinner）证明积极强化紧跟行为时最有效，行为不被奖励或受惩罚则不再重复；该理论是其更宽泛的行为主义（behaviorism）概念的一部分（刺激-反应的联结中，清醒认识无关紧要）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">操作性条件反射</strong>：人们学会行事以获得想要的、避免不想要的；斯金纳（B.F.Skinner）证明积极强化紧跟行为时最有效，行为不被奖励或受惩罚则不再重复；该理论是其更宽泛的行为主义（behaviorism）概念的一部分（刺激-反应的联结中，清醒认识无关紧要）。"},{"t":"社会学习理论（social-learning theory）：个体既可通过直接经验也可通过观察学习；榜样是核心，四个过程决定榜样的影响：","c":[{"t":"注意过程：注意到榜样的关键特征（有吸引力、反复出现、对我们重要或与我们相似）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">注意过程</strong>：注意到榜样的关键特征（有吸引力、反复出现、对我们重要或与我们相似）。"},{"t":"保持过程：榜样不再轻易出现后仍能记得其行为。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">保持过程</strong>：榜样不再轻易出现后仍能记得其行为。"},{"t":"动力复制过程：把\"看的过程\"转化为\"做的过程\"。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">动力复制过程</strong>：把&quot;看的过程&quot;转化为&quot;做的过程&quot;。"},{"t":"强化过程：积极的诱因或奖励激励个体重复榜样行为。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">强化过程</strong>：积极的诱因或奖励激励个体重复榜样行为。"}],"k":"b","i":2,"h":"<strong class=\"lead\">社会学习理论</strong>（social-learning theory）：个体既可通过直接经验也可通过观察学习；榜样是核心，四个过程决定榜样的影响："}],"k":"b","i":1,"h":"<strong class=\"lead\">强化理论</strong>（reinforcement theory）："},{"t":"期望理论（expectancy theory，弗鲁姆）：","c":[{"t":"核心：我们想以某种特定方式行事的意愿强度，取决于我们对某种特定结果及其吸引力的期望程度；当员工相信努力会带来良好绩效评估、良好评估会带来组织奖励、奖励能满足个人目标时，才有动力努力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">核心</strong>：我们想以某种特定方式行事的意愿强度，取决于我们对某种特定结果及其吸引力的期望程度；当员工相信努力会带来良好绩效评估、良好评估会带来组织奖励、奖励能满足个人目标时，才有动力努力。"},{"t":"三种关系（图表7-6）：","c":[{"t":"期望值：努力—绩效关系——个体认为某种努力程度实现某种绩效水平的可能性。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">期望值</strong>：努力—绩效关系——个体认为某种努力程度实现某种绩效水平的可能性。"},{"t":"工具性：绩效—奖励关系——个体相信某种绩效水平获得理想结果的程度。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">工具性</strong>：绩效—奖励关系——个体相信某种绩效水平获得理想结果的程度。"},{"t":"价值性：奖励—个人目标关系——组织奖励满足个人目标或需求的程度及其吸引力。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">价值性</strong>：奖励—个人目标关系——组织奖励满足个人目标或需求的程度及其吸引力。"}],"k":"b","i":2,"h":"<strong class=\"lead\">三种关系</strong>（图表7-6）："},{"t":"三个诊断问题：最大努力能否体现在绩效评估中（技能不足、评估体系侧重忠诚度等非绩效因素、上司不喜欢都会使之断裂）；良好评估能否带来奖励（按资历、合作性、\"讨好\"上司分配则关系微弱）；奖励是否有吸引力（管理者奖励资源有限、误以为所有员工想要同样的东西）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三个诊断问题</strong>：最大努力能否体现在绩效评估中（技能不足、评估体系侧重忠诚度等非绩效因素、上司不喜欢都会使之断裂）；良好评估能否带来奖励（按资历、合作性、&quot;讨好&quot;上司分配则关系微弱）；奖励是否有吸引力（管理者奖励资源有限、误以为所有员工想要同样的东西）。"},{"t":"应用例证：股票分析师极少给出卖出评级——准确预测的利益与激怒公司的风险（公开指责、职业排斥、信息隔离）权衡后，买入评级的预期结果更优。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用例证</strong>：股票分析师极少给出卖出评级——准确预测的利益与激怒公司的风险（公开指责、职业排斥、信息隔离）权衡后，买入评级的预期结果更优。"}],"k":"b","i":1,"h":"<strong class=\"lead\">期望理论</strong>（expectancy theory，弗鲁姆）："}],"k":"sec","i":0,"h":"7.4 其他当代动机理论"},{"t":"7.5 公正理论/组织公平","c":[{"t":"公正理论（equity theory）：员工将工作中的产出（薪酬、晋升、认可、办公室等）与投入（努力、经验、教育等）的比率，与职位相似的同事等进行比较；比率一致则感到公正（图表7-7）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">公正理论</strong>（equity theory）：员工将工作中的产出（薪酬、晋升、认可、办公室等）与投入（努力、经验、教育等）的比率，与职位相似的同事等进行比较；比率一致则感到公正（图表7-7）。"},{"t":"感到不公正时员工的六种行为：","c":[{"t":"改变自己的投入（报酬过低则降低努力程度，过高则增加投入）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">改变自己的投入</strong>（报酬过低则降低努力程度，过高则增加投入）。"},{"t":"改变自己的产出（如计件工资者增加产量但降低质量）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">改变自己的产出</strong>（如计件工资者增加产量但降低质量）。"},{"t":"歪曲自我认知（\"我发现自己其实比其他人都努力\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">歪曲自我认知</strong>（&quot;我发现自己其实比其他人都努力&quot;）。"},{"t":"歪曲对他人的认知（\"迈克的工作并不像我想的那么令人满意\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">歪曲对他人的认知</strong>（&quot;迈克的工作并不像我想的那么令人满意&quot;）。"},{"t":"选择其他参照对象（\"我不如表弟挣钱多，但比父亲同龄时挣得多\"）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">选择其他参照对象</strong>（&quot;我不如表弟挣钱多，但比父亲同龄时挣得多&quot;）。"},{"t":"离开该领域（如辞职）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">离开该领域</strong>（如辞职）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">感到不公正时员工的六种行为</strong>："},{"t":"局限：报酬过高带来的不公正感对行为影响不显著（个体会自我合理化，\"这是我应得的\"）；并非所有人同样敏感——\"仁慈型\"员工偏爱自己的产出投入比低于参照对象，对他们的预测可能不准确。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">局限</strong>：报酬过高带来的不公正感对行为影响不显著（个体会自我合理化，&quot;这是我应得的&quot;）；并非所有人同样敏感——&quot;仁慈型&quot;员工偏爱自己的产出投入比低于参照对象，对他们的预测可能不准确。"},{"t":"组织公平（organizational justice）：员工看待当权者和决策者对待自己方式的总称，四种形式（图表7-8）：","c":[{"t":"分配公平（distributive justice）：对结果（薪酬、认可等）公平性的感知——\"我得到了应得的加薪\"；NHL研究显示按贡献区分薪酬比平均分配更能吸引和留住好球员。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">分配公平</strong>（distributive justice）：对结果（薪酬、认可等）公平性的感知——&quot;我得到了应得的加薪&quot;；NHL研究显示按贡献区分薪酬比平均分配更能吸引和留住好球员。"},{"t":"程序公平（procedural justice）：对结果判定过程公平性的感知——员工在决策中有发言权、决策一致、无偏见、使用准确信息、考虑对群体的影响、合乎道德、对纠错开放时会增强；结果有利时程序不那么重要，结果不利时程序公平帮助员工接受结果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">程序公平</strong>（procedural justice）：对结果判定过程公平性的感知——员工在决策中有发言权、决策一致、无偏见、使用准确信息、考虑对群体的影响、合乎道德、对纠错开放时会增强；结果有利时程序不那么重要，结果不利时程序公平帮助员工接受结果。"},{"t":"信息公平（informational justice）：管理者是否向员工解释关键决策、使其知悉组织重要事件；信息越详细、越坦诚越公平；解释坏消息时\"事后找借口\"比\"辩解\"更有利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信息公平</strong>（informational justice）：管理者是否向员工解释关键决策、使其知悉组织重要事件；信息越详细、越坦诚越公平；解释坏消息时&quot;事后找借口&quot;比&quot;辩解&quot;更有利。"},{"t":"人际公平（interpersonal justice）：员工是否受到尊严与尊敬——独特之处在于它发生在管理者与员工每天的交流互动中，随时可用也可能随时错失（罗格斯大学篮球队教练虐待球员被解雇为反面例）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">人际公平</strong>（interpersonal justice）：员工是否受到尊严与尊敬——独特之处在于它发生在管理者与员工每天的交流互动中，随时可用也可能随时错失（罗格斯大学篮球队教练虐待球员被解雇为反面例）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">组织公平</strong>（organizational justice）：员工看待当权者和决策者对待自己方式的总称，四种形式（图表7-8）："},{"t":"公平带来的结果：各形式公平都提高任务绩效、增加公民行为（帮助同事）、减少推卸责任等反生产工作行为；分配公平与程序公平和任务绩效联系更密切，信息公平与人际公平和公民行为联系更密切；公平对待加强组织承诺、增进对上司的信任、减少不确定性与被剥削担忧、引发积极情绪，甚至与睡眠和健康状况相关。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">公平带来的结果</strong>：各形式公平都提高任务绩效、增加公民行为（帮助同事）、减少推卸责任等反生产工作行为；分配公平与程序公平和任务绩效联系更密切，信息公平与人际公平和公民行为联系更密切；公平对待加强组织承诺、增进对上司的信任、减少不确定性与被剥削担忧、引发积极情绪，甚至与睡眠和健康状况相关。"},{"t":"他人对不公平的反应：第三方（旁观者）也会因不公平而改变行为（如不再光顾无预警大规模裁员且不提供帮助的连锁餐厅）；反应受三因素影响——自身特质特点、侵害者与受害者的特质特点（含归责）、事件的具体细节。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">他人对不公平的反应</strong>：第三方（旁观者）也会因不公平而改变行为（如不再光顾无预警大规模裁员且不提供帮助的连锁餐厅）；反应受三因素影响——自身特质特点、侵害者与受害者的特质特点（含归责）、事件的具体细节。"},{"t":"促进公平：有的管理者按对公平规则的遵守程度\"计算\"公平性，有的受自身情绪激励（积极情感高、消极情感低时更公平）；规则多、自由裁量权少时计算型管理者更公平，情绪型管理者在自由裁量权大时更公平。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">促进公平</strong>：有的管理者按对公平规则的遵守程度&quot;计算&quot;公平性，有的受自身情绪激励（积极情感高、消极情感低时更公平）；规则多、自由裁量权少时计算型管理者更公平，情绪型管理者在自由裁量权大时更公平。"},{"t":"文化与公平：全球员工普遍倾向以绩效和技能而非资历分配薪酬；公平感在个人主义、女性化、不确定性规避、低权力距离文化中最重要——个人主义国家（澳、美）适合竞争性薪酬，不确定性规避国家（法）需要固定薪酬与参与，女性化国家（瑞典）重视关系与工作—生活平衡，低权力距离国家（奥地利）把公正处理上下级关系视为首要。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">文化与公平</strong>：全球员工普遍倾向以绩效和技能而非资历分配薪酬；公平感在个人主义、女性化、不确定性规避、低权力距离文化中最重要——个人主义国家（澳、美）适合竞争性薪酬，不确定性规避国家（法）需要固定薪酬与参与，女性化国家（瑞典）重视关系与工作—生活平衡，低权力距离国家（奥地利）把公正处理上下级关系视为首要。"}],"k":"sec","i":0,"h":"7.5 公正理论/组织公平"},{"t":"7.6 工作投入","c":[{"t":"工作投入（job engagement）：员工为了工作绩效而投入的体力、认知和情绪方面的能量；高度投入者沉浸工作、忘记时间、更有效地服务对象。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">工作投入</strong>（job engagement）：员工为了工作绩效而投入的体力、认知和情绪方面的能量；高度投入者沉浸工作、忘记时间、更有效地服务对象。"},{"t":"前因：员工认为工作有意义的程度（由工作特征与可获得的有效资源决定）、个人价值观与组织价值观的匹配度、能激发使命感的领导行为。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">前因</strong>：员工认为工作有意义的程度（由工作特征与可获得的有效资源决定）、个人价值观与组织价值观的匹配度、能激发使命感的领导行为。"},{"t":"结果：较高水平的工作投入与任务绩效及公民行为相关。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">结果</strong>：较高水平的工作投入与任务绩效及公民行为相关。"},{"t":"批评：有观点认为该概念与工作满意度、压力等工作态度重复，是多余的；也有\"阴暗面\"——与工作—家庭冲突正相关，过高投入可能使家庭责任成为干扰，导致知觉损失甚至耗竭。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">批评</strong>：有观点认为该概念与工作满意度、压力等工作态度重复，是多余的；也有&quot;阴暗面&quot;——与工作—家庭冲突正相关，过高投入可能使家庭责任成为干扰，导致知觉损失甚至耗竭。"}],"k":"sec","i":0,"h":"7.6 工作投入"},{"t":"7.7 当代动机理论的整合","c":[{"t":"整合模型（图表7-9）以期望理论框架为基础串联各理论：","c":[{"t":"机会既可以促进也可以妨碍个人努力；个人目标引导努力（目标一努力链来自目标设置理论）。","c":[],"k":"b","i":2,"h":"机会既可以促进也可以妨碍个人努力；个人目标引导努力（目标一努力链来自目标设置理论）。"},{"t":"努力能否转化为绩效取决于努力程度、能力水平以及被视为公平客观的绩效评估体系。","c":[],"k":"b","i":2,"h":"努力能否转化为绩效取决于努力程度、能力水平以及被视为公平客观的绩效评估体系。"},{"t":"若员工认为奖励基于绩效而非资历等因素，绩效—奖励关系更强；认知评价理论提示基于绩效的奖励可能降低内部动机水平。","c":[],"k":"b","i":2,"h":"若员工认为奖励基于绩效而非资历等因素，绩效—奖励关系更强；认知评价理论提示基于绩效的奖励可能降低内部动机水平。"},{"t":"奖励若能满足与个人目标一致的主导需求，动机水平最高（奖励—个人目标关系）。","c":[],"k":"b","i":2,"h":"奖励若能满足与个人目标一致的主导需求，动机水平最高（奖励—个人目标关系）。"},{"t":"高成就需求者是例外：他们不依赖组织评估与奖励，努力与个人目标直接相连——只要工作提供个人职责、信息反馈和中等程度的风险，就有完成工作的内在驱动力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">高成就需求者是例外</strong>：他们不依赖组织评估与奖励，努力与个人目标直接相连——只要工作提供个人职责、信息反馈和中等程度的风险，就有完成工作的内在驱动力。"},{"t":"强化理论通过组织奖励对个人绩效的强化体现；公平比较/组织公平通过比较他人所得、感知被对待的方式（对薪酬不满时对程序公平和人际公平更敏感）进入模型。","c":[],"k":"b","i":2,"h":"强化理论通过组织奖励对个人绩效的强化体现；公平比较/组织公平通过比较他人所得、感知被对待的方式（对薪酬不满时对程序公平和人际公平更敏感）进入模型。"}],"k":"b","i":1,"h":"<strong class=\"lead\">整合模型</strong>（图表7-9）以期望理论框架为基础串联各理论："},{"t":"本章小结要点：早期理论关注需求及满足需求的结果，当代理论集中于内在与外在动机、目标设定、自我效能、强化及期望；公正理论/组织公平是激励员工的重要补充；动机是理解工作投入等贡献的关键。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">本章小结要点</strong>：早期理论关注需求及满足需求的结果，当代理论集中于内在与外在动机、目标设定、自我效能、强化及期望；公正理论/组织公平是激励员工的重要补充；动机是理解工作投入等贡献的关键。"},{"t":"对管理者的启示（并入本节）：确保外部奖励非强制性并提供能力与归属信息；设置明确而有难度的目标并给予高质量发展性反馈；使员工与组织目标保持一致；为期望看到的员工行为建立模型；用期望理论解释生产率、缺勤率、离职率；在资源决策中考虑分配方式、受影响群体、公平性与尊重。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（并入本节）：确保外部奖励非强制性并提供能力与归属信息；设置明确而有难度的目标并给予高质量发展性反馈；使员工与组织目标保持一致；为期望看到的员工行为建立模型；用期望理论解释生产率、缺勤率、离职率；在资源决策中考虑分配方式、受影响群体、公平性与尊重。"}],"k":"sec","i":0,"h":"7.7 当代动机理论的整合"}],"k":"chap","h":"第7章 动机概念"},{"t":"第8章 动机：从概念到应用","c":[{"t":"学习目标","c":[{"t":"描述工作特征模型是如何通过改变工作环境来激励员工的。","c":[],"k":"b","i":1,"h":"描述工作特征模型是如何通过改变工作环境来激励员工的。"},{"t":"比较工作再设计的主要方法。","c":[],"k":"b","i":1,"h":"比较工作再设计的主要方法。"},{"t":"解释替代性工作安排方案是如何激励员工的。","c":[],"k":"b","i":1,"h":"解释替代性工作安排方案是如何激励员工的。"},{"t":"描述员工参与方案是如何激励员工的。","c":[],"k":"b","i":1,"h":"描述员工参与方案是如何激励员工的。"},{"t":"阐释各种不同的浮动工资方案是如何增强员工动机的。","c":[],"k":"b","i":1,"h":"阐释各种不同的浮动工资方案是如何增强员工动机的。"},{"t":"说明灵活福利如何将福利转化为动机。","c":[],"k":"b","i":1,"h":"说明灵活福利如何将福利转化为动机。"},{"t":"阐释内部奖励的激励作用。","c":[],"k":"b","i":1,"h":"阐释内部奖励的激励作用。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"8.1 通过工作设计进行激励：工作特征模型","c":[{"t":"工作设计（job design）：认为工作要素的组合方式会影响员工努力程度的观点，是识别改变工作要素机会的出发点。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">工作设计</strong>（job design）：认为工作要素的组合方式会影响员工努力程度的观点，是识别改变工作要素机会的出发点。"},{"t":"工作特征模型（job characteristics model, JCM）：用五个核心工作维度描述工作，并据此预测工作对动机、绩效与满意度影响的框架。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">工作特征模型</strong>（job characteristics model, JCM）：用五个核心工作维度描述工作，并据此预测工作对动机、绩效与满意度影响的框架。"},{"t":"五个核心工作维度","c":[{"t":"技能多样性（skill variety）：一份工作要求使用专门的技能和才干来完成不同活动的程度；如汽车修理店店主要干电子维修、装配、体力活与接待顾客，多样性高；工人整天喷漆则多样性低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">技能多样性</strong>（skill variety）：一份工作要求使用专门的技能和才干来完成不同活动的程度；如汽车修理店店主要干电子维修、装配、体力活与接待顾客，多样性高；工人整天喷漆则多样性低。"},{"t":"任务完整性（task identity）：一份工作要求完成一项完整的、可辨识的任务的程度；如家具生产商从设计、选料到制成成品是高完整性，只做桌腿是低完整性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">任务完整性</strong>（task identity）：一份工作要求完成一项完整的、可辨识的任务的程度；如家具生产商从设计、选料到制成成品是高完整性，只做桌腿是低完整性。"},{"t":"任务重要性（task significance）：一份工作对他人的生活或工作的实际影响程度；如重症监护室护理人员高，医院擦地板的清洁工低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">任务重要性</strong>（task significance）：一份工作对他人的生活或工作的实际影响程度；如重症监护室护理人员高，医院擦地板的清洁工低。"},{"t":"工作自主性（autonomy）：一份工作在安排工作内容、确定工作程序方面给任职者的自由度、独立性及自主权；如自主制定销售方案的销售经理高，照标准手册面对客户的代表低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">工作自主性</strong>（autonomy）：一份工作在安排工作内容、确定工作程序方面给任职者的自由度、独立性及自主权；如自主制定销售方案的销售经理高，照标准手册面对客户的代表低。"},{"t":"反馈（feedback）：员工在完成任务过程中直接、明确地获得自己工作绩效信息的程度；如测试检查产品的工人高，流水线安装工低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">反馈</strong>（feedback）：员工在完成任务过程中直接、明确地获得自己工作绩效信息的程度；如测试检查产品的工人高，流水线安装工低。"}],"k":"b","i":1,"h":"五个核心工作维度"},{"t":"三种关键心理状态与内在奖励机制","c":[{"t":"技能多样性＋任务完整性＋任务重要性组合产生「体验到工作的意义」。","c":[],"k":"b","i":2,"h":"技能多样性＋任务完整性＋任务重要性组合产生「体验到工作的意义」。"},{"t":"工作自主性使员工「体验到对工作结果的责任」。","c":[],"k":"b","i":2,"h":"工作自主性使员工「体验到对工作结果的责任」。"},{"t":"反馈使员工「了解工作活动的实际结果」。","c":[],"k":"b","i":2,"h":"反馈使员工「了解工作活动的实际结果」。"},{"t":"结论：当员工认识到自己很好地从事了所重视的工作时，会获得内部奖励；三种心理状态越多，动机、绩效、满意度越高，缺勤和离职可能性越小。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：当员工认识到自己很好地从事了所重视的工作时，会获得内部奖励；三种心理状态越多，动机、绩效、满意度越高，缺勤和离职可能性越小。"}],"k":"b","i":1,"h":"三种关键心理状态与内在奖励机制"},{"t":"激励潜能分数（motivating potential score, MPS）：把核心维度合并成的预测性指标","c":[{"t":"公式：MPS ＝（技能多样性＋任务完整性＋任务重要性）÷3 × 工作自主性 × 反馈。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">公式</strong>：MPS ＝（技能多样性＋任务完整性＋任务重要性）÷3 × 工作自主性 × 反馈。"},{"t":"高MPS工作的特征：决定工作意义的三要素中至少一项得分高，且工作自主性与反馈都得分高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">高MPS工作的特征</strong>：决定工作意义的三要素中至少一项得分高，且工作自主性与反馈都得分高。"},{"t":"预测：MPS高则动机、绩效、满意度受积极影响，缺勤率与离职率下降；由于是乘法结构，任何一项趋近于零，MPS即趋近于零。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">预测</strong>：MPS高则动机、绩效、满意度受积极影响，缺勤率与离职率下降；由于是乘法结构，任何一项趋近于零，MPS即趋近于零。"}],"k":"b","i":1,"h":"<strong class=\"lead\">激励潜能分数</strong>（motivating potential score, MPS）：把核心维度合并成的预测性指标"},{"t":"调节与边界条件","c":[{"t":"员工成长需求强度：高成长需求者更可能体验到关键心理状态，并对工作丰富化做出更积极的回应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">员工成长需求强度</strong>：高成长需求者更可能体验到关键心理状态，并对工作丰富化做出更积极的回应。"},{"t":"以他人为导向（关注他人福利）的员工，内在工作特征与满意度的联系较弱。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">以他人为导向</strong>（关注他人福利）的员工，内在工作特征与满意度的联系较弱。"},{"t":"对工作的心理归属感会增强动机，对工作小组的共同归属感尤其如此。","c":[],"k":"b","i":2,"h":"对工作的心理归属感会增强动机，对工作小组的共同归属感尤其如此。"},{"t":"虚拟（网络）工作环境下，员工对意义、责任与结果的了解可能受损，管理者可通过发展个人关系、强化任务重要性、自主性和反馈的感受来弥补。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">虚拟</strong>（网络）工作环境下，员工对意义、责任与结果的了解可能受损，管理者可通过发展个人关系、强化任务重要性、自主性和反馈的感受来弥补。"},{"t":"领导的影响：道德型领导可通过提高员工对工作任务重要性的感知来提升努力与绩效；支持型领导能改善研发人员的工作特征。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">领导的影响</strong>：道德型领导可通过提高员工对工作任务重要性的感知来提升努力与绩效；支持型领导能改善研发人员的工作特征。"}],"k":"b","i":1,"h":"调节与边界条件"},{"t":"对管理者的启示（章末小结并入）：承认个体差异，花时间了解对每个员工什么是重要的，把工作设计与个人需求相结合；利用目标和反馈——设置明确目标并在实现过程中提供反馈。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（章末小结并入）：承认个体差异，花时间了解对每个员工什么是重要的，把工作设计与个人需求相结合；利用目标和反馈——设置明确目标并在实现过程中提供反馈。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">8.1 通过工作设计进行激励</strong>：工作特征模型"},{"t":"8.2 工作再设计","c":[{"t":"引例要点（弗兰克）：装配线重复性工作缺乏多样性、自主性与激励，导致辞职转向有挑战性的印刷厂工作；工作再设计的实际意义在于降低离职率、提高工作满意度。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">引例要点</strong>（弗兰克）：装配线重复性工作缺乏多样性、自主性与激励，导致辞职转向有挑战性的印刷厂工作；工作再设计的实际意义在于降低离职率、提高工作满意度。"},{"t":"工作轮换（job rotation）：定期从一项工作转移到同一组织级别、技能要求相近的另一项工作，也称交叉培训。","c":[{"t":"优点：帮助员工学习新技能、保持积极性、消除职业发展停滞；建立灵活的交叉培训队伍、促进竞争、发现潜在人才；提高工作满意度与组织承诺；多国制造业证据显示可带来更高组织绩效；减少无聊、提高动机、帮助员工理解自己对组织的贡献；可能提高安全性并减少重复性损伤（尚有争论）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">优点</strong>：帮助员工学习新技能、保持积极性、消除职业发展停滞；建立灵活的交叉培训队伍、促进竞争、发现潜在人才；提高工作满意度与组织承诺；多国制造业证据显示可带来更高组织绩效；减少无聊、提高动机、帮助员工理解自己对组织的贡献；可能提高安全性并减少重复性损伤（尚有争论）。"},{"t":"缺点：每轮换一次就需要一轮培训，培训费用增加；新岗位总体生产率短期下降；群体成员要不断适应新成员，干扰群体；主管需花更多时间解答问题并督促新轮换的员工。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">缺点</strong>：每轮换一次就需要一轮培训，培训费用增加；新岗位总体生产率短期下降；群体成员要不断适应新成员，干扰群体；主管需花更多时间解答问题并督促新轮换的员工。"},{"t":"章首案例并入（工作轮换）：英特尔用内部数据库「开发机会工具（DOT）」让员工搜索数百份可接受的临时任务，创造数千个临时职务，增强跨部门透明度与联系；福利专家轮岗经历初始困难后获提拔；兰德斯塔德「职场2025」调查显示多数员工认为「技能和成果」比固定角色更重要，未来「雇员」一词或被「贡献者」取代。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">章首案例并入</strong>（工作轮换）：英特尔用内部数据库「开发机会工具（DOT）」让员工搜索数百份可接受的临时任务，创造数千个临时职务，增强跨部门透明度与联系；福利专家轮岗经历初始困难后获提拔；兰德斯塔德「职场2025」调查显示多数员工认为「技能和成果」比固定角色更重要，未来「雇员」一词或被「贡献者」取代。"}],"k":"b","i":1,"h":"<strong class=\"lead\">工作轮换</strong>（job rotation）：定期从一项工作转移到同一组织级别、技能要求相近的另一项工作，也称交叉培训。"},{"t":"工作丰富化（job enrichment）：把更高层次的责任添加到工作中，以增强员工的使命感、方向感、意义感和内在动机。","c":[{"t":"与扩展工作的区别：不是增加更多任务和要求，而是增加新层次的责任和意义。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与扩展工作的区别</strong>：不是增加更多任务和要求，而是增加新层次的责任和意义。"},{"t":"理论渊源：源于赫茨伯格的理论（保健因素与激励因素），通过提供激励因素增强工作动机；员工也可以自我丰富化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理论渊源</strong>：源于赫茨伯格的理论（保健因素与激励因素），通过提供激励因素增强工作动机；员工也可以自我丰富化。"},{"t":"效果：早期研究综述显示工作丰富化可有效降低离职率，其有效性约为「现实预览」方法的两倍；涉及两万多名英国员工的调查表明它与财务业绩、劳动生产率、缺勤率和产出质量相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效果</strong>：早期研究综述显示工作丰富化可有效降低离职率，其有效性约为「现实预览」方法的两倍；涉及两万多名英国员工的调查表明它与财务业绩、劳动生产率、缺勤率和产出质量相关。"}],"k":"b","i":1,"h":"<strong class=\"lead\">工作丰富化</strong>（job enrichment）：把更高层次的责任添加到工作中，以增强员工的使命感、方向感、意义感和内在动机。"},{"t":"关系性工作设计（relational job design）：把设计焦点从员工本人转移到生活受其工作表现影响的人（顾客、客户、患者等）身上，通过亲社会联系激励员工。","c":[{"t":"方法一：讲故事——如医疗设备公司美敦力邀请患者分享产品如何改善甚至拯救生命，在年会上与员工分享。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">方法一</strong>：讲故事——如医疗设备公司美敦力邀请患者分享产品如何改善甚至拯救生命，在年会上与员工分享。"},{"t":"方法二：与受益者直接接触——大学筹款人与获得奖学金的学生短暂接触后，坚持时间延长42%、筹款额超过两倍。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">方法二</strong>：与受益者直接接触——大学筹款人与获得奖学金的学生短暂接触后，坚持时间延长42%、筹款额超过两倍。"},{"t":"方法三：仪式化信号——儿童完成化疗、成功战胜癌症后敲响康复之钟，钟声在医院各处播放，员工仅听到钟声即可获得激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">方法三</strong>：仪式化信号——儿童完成化疗、成功战胜癌症后敲响康复之钟，钟声在医院各处播放，员工仅听到钟声即可获得激励。"},{"t":"与任务重要性的区别：很多重要工作的员工从未见过受影响者；与受益者的联系和亲社会行为之间有明确关系（如理解职业使游泳者受益的救生员更可能获得赏识）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与任务重要性的区别</strong>：很多重要工作的员工从未见过受影响者；与受益者的联系和亲社会行为之间有明确关系（如理解职业使游泳者受益的救生员更可能获得赏识）。"},{"t":"与企业社会责任（corporate social responsibility, CSR）的关系：受企业资助的志愿者计划能强化工作意义与任务重要性维度；但CSR工作发生在工作之外、内容也不同于本职工作，与关系性工作设计并非一回事；后者为CSR实施提供了新可能。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与企业社会责任</strong>（corporate social responsibility, CSR）的关系：受企业资助的志愿者计划能强化工作意义与任务重要性维度；但CSR工作发生在工作之外、内容也不同于本职工作，与关系性工作设计并非一回事；后者为CSR实施提供了新可能。"}],"k":"b","i":1,"h":"<strong class=\"lead\">关系性工作设计</strong>（relational job design）：把设计焦点从员工本人转移到生活受其工作表现影响的人（顾客、客户、患者等）身上，通过亲社会联系激励员工。"}],"k":"sec","i":0,"h":"8.2 工作再设计"},{"t":"8.3 替代性工作安排方案","c":[{"t":"概述：通过弹性时间制、工作分担、远程办公等改变工作设计，对双职工家庭、单亲家庭及需照护病人的员工尤为重要。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">概述</strong>：通过弹性时间制、工作分担、远程办公等改变工作设计，对双职工家庭、单亲家庭及需照护病人的员工尤为重要。"},{"t":"弹性时间制（flextime）：「灵活的、弹性的工作时间」的简称；每周工作小时数固定，但员工可在一定条件下改变工作时间。","c":[{"t":"结构：每天的工作时间包括一个公共核心时间段（通常约6小时，员工必须到岗），核心时段两端是弹性时间段；部分方案还允许积累额外工时兑换休息日。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结构</strong>：每天的工作时间包括一个公共核心时间段（通常约6小时，员工必须到岗），核心时段两端是弹性时间段；部分方案还允许积累额外工时兑换休息日。"},{"t":"普及与效果：多数美国组织（54%–56%）提供某种形式的弹性时间；对40多个研究的综述表明它与正面工作成果总体相关但影响不大——对降低缺勤率影响最大，其次是对生产率和工作安排的满意度；员工可按个人需求调整时间、减少迟到缺勤，并把工作安排在效率较高的时段，有助于工作-家庭平衡。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">普及与效果</strong>：多数美国组织（54%–56%）提供某种形式的弹性时间；对40多个研究的综述表明它与正面工作成果总体相关但影响不大——对降低缺勤率影响最大，其次是对生产率和工作安排的满意度；员工可按个人需求调整时间、减少迟到缺勤，并把工作安排在效率较高的时段，有助于工作-家庭平衡。"},{"t":"局限：并不适合所有工作或所有员工；对已有高度自主权的管理者效果较弱；强烈希望区分工作与家庭的人不太愿意利用；采用弹性时间的人往往受到指责（若领导层带头使用可缓解）；滥用弹性时间会妨碍日常目标完成（如员工未在工作时间内完成目标，边界就失去作用）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">局限</strong>：并不适合所有工作或所有员工；对已有高度自主权的管理者效果较弱；强烈希望区分工作与家庭的人不太愿意利用；采用弹性时间的人往往受到指责（若领导层带头使用可缓解）；滥用弹性时间会妨碍日常目标完成（如员工未在工作时间内完成目标，边界就失去作用）。"},{"t":"专栏「职业目标：如何争取弹性时间制」要点：先分清是公司政策还是主管政策；区分弹性时间制与远程办公；部分时间远程比完全远程更易被接受；争取策略包括查看组织政策、制定在家工作计划、收集效率证据、概述理由、回应管理层对滥用与公平的担忧、评估与主管的关系——要说明方案对雇主的好处而非只对自己有利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专栏「职业目标</strong>：如何争取弹性时间制」要点：先分清是公司政策还是主管政策；区分弹性时间制与远程办公；部分时间远程比完全远程更易被接受；争取策略包括查看组织政策、制定在家工作计划、收集效率证据、概述理由、回应管理层对滥用与公平的担忧、评估与主管的关系——要说明方案对雇主的好处而非只对自己有利。"}],"k":"b","i":1,"h":"<strong class=\"lead\">弹性时间制</strong>（flextime）：「灵活的、弹性的工作时间」的简称；每周工作小时数固定，但员工可在一定条件下改变工作时间。"},{"t":"工作分担（job sharing）：让两个或多个员工共同分担一项传统的全职工作，如上下午分班或隔日交替。","c":[{"t":"优点：使组织在特定岗位上吸引更多人才，为难以全职工作的熟练者（退休人员、育儿的年轻父母）提供机会；员工积极性与满意度提高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">优点</strong>：使组织在特定岗位上吸引更多人才，为难以全职工作的熟练者（退休人员、育儿的年轻父母）提供机会；员工积极性与满意度提高。"},{"t":"局限：难以找到合适搭档；人们对分担者「不完全忠于工作和雇主」的负面看法；培训、协调与管理的成本高，薪资与福利成本未必更低；美国提供工作分担的组织比例不高（2014年约18%，较2008年下降）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">局限</strong>：难以找到合适搭档；人们对分担者「不完全忠于工作和雇主」的负面看法；培训、协调与管理的成本高，薪资与福利成本未必更低；美国提供工作分担的组织比例不高（2014年约18%，较2008年下降）。"}],"k":"b","i":1,"h":"<strong class=\"lead\">工作分担</strong>（job sharing）：让两个或多个员工共同分担一项传统的全职工作，如上下午分班或隔日交替。"},{"t":"远程办公（telecommuting）：让员工每周至少两天在家或办公室以外的地点，通过与办公室联网的虚拟设备处理公务（出差途中在车上办公不算）。","c":[{"t":"适合类型：作家、律师、分析员以及主要依靠电话和电脑的工作（电话推销、客服、预订、产品支持等）；受教育水平越高越倾向在家工作。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">适合类型</strong>：作家、律师、分析员以及主要依靠电话和电脑的工作（电话推销、客服、预订、产品支持等）；受教育水平越高越倾向在家工作。"},{"t":"优点：与目标评价绩效、上级评价绩效及工作满意度正相关；降低角色压力与离职意向；每周远程工作2.5天以上的员工更能减少工作与家庭冲突；社会层面可减少办公室能耗、温室气体排放与道路维修需求。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">优点</strong>：与目标评价绩效、上级评价绩效及工作满意度正相关；降低角色压力与离职意向；每周远程工作2.5天以上的员工更能减少工作与家庭冲突；社会层面可减少办公室能耗、温室气体排放与道路维修需求。"},{"t":"缺点：可能导致社交惰化（social loafing）——尤其在员工有家庭重担而队友没有时；增加隔离感、降低工作满意度与同事关系质量；被强制远程办公者反而遇到更多工作-家庭冲突（工时往往超过合同水平）；「看不到，就记不住」效应——不在场者可能在加薪晋升中受不利影响；更具创造性的工作可能最适合远程，而单调重复任务反而降低远程员工的绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">缺点</strong>：可能导致社交惰化（social loafing）——尤其在员工有家庭重担而队友没有时；增加隔离感、降低工作满意度与同事关系质量；被强制远程办公者反而遇到更多工作-家庭冲突（工时往往超过合同水平）；「看不到，就记不住」效应——不在场者可能在加薪晋升中受不利影响；更具创造性的工作可能最适合远程，而单调重复任务反而降低远程员工的绩效。"},{"t":"组织态度分歧：雅虎、百思买曾取消远程办公；雅虎CEO梅耶尔认为独处效率更高但在一起工作更具协作性和创新性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织态度分歧</strong>：雅虎、百思买曾取消远程办公；雅虎CEO梅耶尔认为独处效率更高但在一起工作更具协作性和创新性。"},{"t":"专栏「观点碰撞：面对面交流很重要」要点：正方强调面对面互动孕育创新、建立信任、避免「不在老板眼前晃就被遗忘」；反方指出在场不等于高效，远程办公是吸引和留住人才的福利，有研究显示在家办公效率更高（如中国电话客服在家效率高出13%），办公室里滔滔不绝的同事反而是最大干扰之一。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专栏「观点碰撞</strong>：面对面交流很重要」要点：正方强调面对面互动孕育创新、建立信任、避免「不在老板眼前晃就被遗忘」；反方指出在场不等于高效，远程办公是吸引和留住人才的福利，有研究显示在家办公效率更高（如中国电话客服在家效率高出13%），办公室里滔滔不绝的同事反而是最大干扰之一。"}],"k":"b","i":1,"h":"<strong class=\"lead\">远程办公</strong>（telecommuting）：让员工每周至少两天在家或办公室以外的地点，通过与办公室联网的虚拟设备处理公务（出差途中在车上办公不算）。"}],"k":"sec","i":0,"h":"8.3 替代性工作安排方案"},{"t":"8.4 员工参与","c":[{"t":"员工参与（employee involvement and participation, EIP）：利用员工对工作的投入来增强他们对组织成功的承诺的过程。","c":[{"t":"机制：让员工参与能增加其工作生活自主权与控制程度的决策，会使其更有积极性，对组织的承诺与生产率更高、对工作更满意；团队层面的掌控感也能提高整个团队的士气与绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">机制</strong>：让员工参与能增加其工作生活自主权与控制程度的决策，会使其更有积极性，对组织的承诺与生产率更高、对工作更满意；团队层面的掌控感也能提高整个团队的士气与绩效。"}],"k":"b","i":1,"h":"<strong class=\"lead\">员工参与</strong>（employee involvement and participation, EIP）：利用员工对工作的投入来增强他们对组织成功的承诺的过程。"},{"t":"文化调节：EIP必须根据地区和国家规范调整才能成功；印度高权力距离文化下，试图赋权的管理者得到员工较低评价；中国转型期内部有差异——高度认同传统文化价值观的员工参与决策获益不明显，不那么传统的员工参与管理后满意度和绩效更高；一项中国城市研究显示，EIP中的协商和表达比参与决策带来更高的工作满意度。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">文化调节</strong>：EIP必须根据地区和国家规范调整才能成功；印度高权力距离文化下，试图赋权的管理者得到员工较低评价；中国转型期内部有差异——高度认同传统文化价值观的员工参与决策获益不明显，不那么传统的员工参与管理后满意度和绩效更高；一项中国城市研究显示，EIP中的协商和表达比参与决策带来更高的工作满意度。"},{"t":"参与管理（participative management）：下属在很大程度上与直属上司共享决策权。","c":[{"t":"形式：可以是情况介绍或调查等正式形式，也可以是日常协商等非正式形式。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">形式</strong>：可以是情况介绍或调查等正式形式，也可以是日常协商等非正式形式。"},{"t":"效果：常被视为治疗士气低落与低生产率的万能药，但实际上效果不一致——质量圈等参与管理技术对工作绩效有中等水平的影响；可减少工作不安全对满意度和离职意愿的负面影响；实施组织可能获得更高股票收益、更低离职率与更高生产率，但效果通常不太明显。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效果</strong>：常被视为治疗士气低落与低生产率的万能药，但实际上效果不一致——质量圈等参与管理技术对工作绩效有中等水平的影响；可减少工作不安全对满意度和离职意愿的负面影响；实施组织可能获得更高股票收益、更低离职率与更高生产率，但效果通常不太明显。"},{"t":"成功条件：追随者必须信任领导者并对管理方式改变做好准备；领导者应避免强制方法、强调共同决策可能带来的结果、定期考察进展。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成功条件</strong>：追随者必须信任领导者并对管理方式改变做好准备；领导者应避免强制方法、强调共同决策可能带来的结果、定期考察进展。"}],"k":"b","i":1,"h":"<strong class=\"lead\">参与管理</strong>（participative management）：下属在很大程度上与直属上司共享决策权。"},{"t":"代表参与（representative participation）：让一小部分员工成为决策参与者，从而在组织内部重新分配权力，使员工与管理层及股东的利益更为均衡；多数西欧国家要求公司实行。","c":[{"t":"形式一：职工监事委员会——被任命或推选出的员工群体，管理层制定与员工有关的决策时必须与其协商。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">形式一</strong>：职工监事委员会——被任命或推选出的员工群体，管理层制定与员工有关的决策时必须与其协商。"},{"t":"形式二：董事会代表——进入董事会并代表公司员工利益的员工代表。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">形式二</strong>：董事会代表——进入董事会并代表公司员工利益的员工代表。"},{"t":"评价：对员工的影响好坏参半；员工需感受到利益得到较好代表才能增强动机；作为一种激励手段，正被更直接的参与方式取代。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">评价</strong>：对员工的影响好坏参半；员工需感受到利益得到较好代表才能增强动机；作为一种激励手段，正被更直接的参与方式取代。"}],"k":"b","i":1,"h":"<strong class=\"lead\">代表参与</strong>（representative participation）：让一小部分员工成为决策参与者，从而在组织内部重新分配权力，使员工与管理层及股东的利益更为均衡；多数西欧国家要求公司实行。"},{"t":"结论（章末小结并入）：EIP具有明显提高员工内在动机的潜力——让员工做出并执行决策、看到决策发挥作用，能增强程序公平感；但任何参与方案都必须经过仔细设计。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">结论</strong>（章末小结并入）：EIP具有明显提高员工内在动机的潜力——让员工做出并执行决策、看到决策发挥作用，能增强程序公平感；但任何参与方案都必须经过仔细设计。"}],"k":"sec","i":0,"h":"8.4 员工参与"},{"t":"8.5 利用报酬激励员工","c":[{"t":"薪酬的重要性：工资虽不是工作满意的唯一因素，但确有激励作用且常被低估；美国心理协会调查显示约60%的受访者认为薪酬和福利是其留在现有雇主那里的原因。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">薪酬的重要性</strong>：工资虽不是工作满意的唯一因素，但确有激励作用且常被低估；美国心理协会调查显示约60%的受访者认为薪酬和福利是其留在现有雇主那里的原因。"},{"t":"支付什么：建立薪资结构","c":[{"t":"内部公平：工作对本组织的价值，通常通过工作评估来确定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">内部公平</strong>：工作对本组织的价值，通常通过工作评估来确定。"},{"t":"外部公平：与同行业其他公司相比薪酬的外部竞争力，通常通过薪酬调查确定。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">外部公平</strong>：与同行业其他公司相比薪酬的外部竞争力，通常通过薪酬调查确定。"},{"t":"薪酬战略：有的组织愿支付高于市场的薪酬成为领导者，有的因成本考虑低于市场水平——这是权衡利弊后的战略决策（薪资常是运营成本中最高的一项，过高会使产品或服务价格失去竞争力）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">薪酬战略</strong>：有的组织愿支付高于市场的薪酬成为领导者，有的因成本考虑低于市场水平——这是权衡利弊后的战略决策（薪资常是运营成本中最高的一项，过高会使产品或服务价格失去竞争力）。"},{"t":"证据与案例：126个大型企业的研究显示，员工认为自己获得有竞争力的工资时士气更高、更有成效、顾客满意度也更高；开市客坚持高工资策略获得更高生产率与更低离职率，增长快于沃尔玛，沃尔玛随后决定提高员工薪资。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">证据与案例</strong>：126个大型企业的研究显示，员工认为自己获得有竞争力的工资时士气更高、更有成效、顾客满意度也更高；开市客坚持高工资策略获得更高生产率与更低离职率，增长快于沃尔玛，沃尔玛随后决定提高员工薪资。"},{"t":"专栏「传言还是科学：金钱买不到快乐」要点：伊斯特林认为基本财务需求满足后（研究常引约7.5万美元）更多钱不增加快乐，但新研究认为「钱越多越好」；关键在于如何使用钱——把钱给出去（捐赠）比花在自己身上更快乐、把钱花在体验上比花在产品上更快乐、善于利用「购买时间」获得的时间也让人更快乐。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专栏「传言还是科学</strong>：金钱买不到快乐」要点：伊斯特林认为基本财务需求满足后（研究常引约7.5万美元）更多钱不增加快乐，但新研究认为「钱越多越好」；关键在于如何使用钱——把钱给出去（捐赠）比花在自己身上更快乐、把钱花在体验上比花在产品上更快乐、善于利用「购买时间」获得的时间也让人更快乐。"}],"k":"b","i":1,"h":"<strong class=\"lead\">支付什么</strong>：建立薪资结构"},{"t":"如何支付：浮动工资方案（variable-pay program，也称绩效薪酬）：以员工个人绩效及组织绩效为基础确定部分薪酬；可以是全部或部分工资、按年或达成条件时支付、可选或必须接受；全球约84%的公司提供某种形式的浮动工资，70%的组织设置组织、部门、团队和个人级别的奖励组合。","c":[{"t":"薪资保密问题：薪资保密对工作绩效有不利影响，对高绩效员工的负面影响更大；保密使员工认为薪资水平是主观决定的，进而失去动力；公布薪酬的一般类别、让员工相信浮动工资与绩效有客观联系，可恢复激励效应。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">薪资保密问题</strong>：薪资保密对工作绩效有不利影响，对高绩效员工的负面影响更大；保密使员工认为薪资水平是主观决定的，进而失去动力；公布薪酬的一般类别、让员工相信浮动工资与绩效有客观联系，可恢复激励效应。"},{"t":"计件工资方案（piece-rate pay plan）：按工人完成的每一个生产单位支付固定报酬；纯粹计件无基本工资。","c":[{"t":"优点：可带来更高生产率与更高薪资，对管理者和终身制员工（高绩效者）最有激励作用；可个人或团队计件；中国一所主要大学提高教授论文计件工资使科研生产力提高50%。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">优点</strong>：可带来更高生产率与更高薪资，对管理者和终身制员工（高绩效者）最有激励作用；可个人或团队计件；中国一所主要大学提高教授论文计件工资使科研生产力提高50%。"},{"t":"局限与风险：风险厌恶者和高绩效者更偏好个人计件（担心他人懈怠），表现较差者更偏好团队计件；当工作进度由客户要求等不可控外部因素决定时，计件不起激励作用；须警惕员工以降低质量换取产出速度；许多工作（如抢救室医护）无法也不应计件。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">局限与风险</strong>：风险厌恶者和高绩效者更偏好个人计件（担心他人懈怠），表现较差者更偏好团队计件；当工作进度由客户要求等不可控外部因素决定时，计件不起激励作用；须警惕员工以降低质量换取产出速度；许多工作（如抢救室医护）无法也不应计件。"}],"k":"b","i":2,"h":"<strong class=\"lead\">计件工资方案</strong>（piece-rate pay plan）：按工人完成的每一个生产单位支付固定报酬；纯粹计件无基本工资。"},{"t":"绩效工资方案（merit-based pay plan）：根据员工个人绩效（建立在绩效评估基础上）支付薪酬；高绩效者可获得更多加薪或晋升。","c":[{"t":"应用：绝大多数大型组织采用；正渗透公共部门（如新泽西州教师绩效工资、纽约市公立医院按成本、满意度与质量付薪）。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">应用</strong>：绝大多数大型组织采用；正渗透公共部门（如新泽西州教师绩效工资、纽约市公立医院按成本、满意度与质量付薪）。"},{"t":"局限：有效性受制于绩效评估的主观性，可能带来歧视问题；加薪空间受经济状况约束，与个人绩效无关（如加薪总额很小时绩效奖励被稀释）；工会通常抵制，教师群体占主导的仍是按资历加薪。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">局限</strong>：有效性受制于绩效评估的主观性，可能带来歧视问题；加薪空间受经济状况约束，与个人绩效无关（如加薪总额很小时绩效奖励被稀释）；工会通常抵制，教师群体占主导的仍是按资历加薪。"}],"k":"b","i":2,"h":"<strong class=\"lead\">绩效工资方案</strong>（merit-based pay plan）：根据员工个人绩效（建立在绩效评估基础上）支付薪酬；高绩效者可获得更多加薪或晋升。"},{"t":"奖金（bonus）：年度奖金曾是高管专属，现已例行提供给各级员工。","c":[{"t":"优点：奖励最近业绩而非历史业绩，激励效果应优于绩效工资（绩效工资会沉淀为基本工资，涨幅一般小于奖金）；经济不景气时公司可通过削减奖金降低薪酬成本；印度的研究显示较高比例的潜在奖金可提高生产率；把奖励分成多个类别（哪怕类别本身无意义）以及短期现金、餐券、认可等都能增强动机。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">优点</strong>：奖励最近业绩而非历史业绩，激励效果应优于绩效工资（绩效工资会沉淀为基本工资，涨幅一般小于奖金）；经济不景气时公司可通过削减奖金降低薪酬成本；印度的研究显示较高比例的潜在奖金可提高生产率；把奖励分成多个类别（哪怕类别本身无意义）以及短期现金、餐券、认可等都能增强动机。"},{"t":"弊端：使薪酬更易被削减；当员工把奖金视为理所应当的预期年收入时（洛尔施：人们「不再把奖金当作奖金」），激励作用受损。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">弊端</strong>：使薪酬更易被削减；当员工把奖金视为理所应当的预期年收入时（洛尔施：人们「不再把奖金当作奖金」），激励作用受损。"}],"k":"b","i":2,"h":"<strong class=\"lead\">奖金</strong>（bonus）：年度奖金曾是高管专属，现已例行提供给各级员工。"},{"t":"利润分享方案（profit-sharing plan）：根据围绕公司盈利能力的特定准则分配薪酬，可直接付现金或股票期权（高管常以后者为主）。","c":[{"t":"证据：有利润分享方案的组织盈利水平更高、员工承诺更高（小型组织中尤为如此）、员工有更强烈的主人翁意识；与其他绩效薪酬方案结合使用效果更好。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">证据</strong>：有利润分享方案的组织盈利水平更高、员工承诺更高（小型组织中尤为如此）、员工有更强烈的主人翁意识；与其他绩效薪酬方案结合使用效果更好。"},{"t":"边界：非营利组织与公共部门等没有利润的组织不适用。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">边界</strong>：非营利组织与公共部门等没有利润的组织不适用。"}],"k":"b","i":2,"h":"<strong class=\"lead\">利润分享方案</strong>（profit-sharing plan）：根据围绕公司盈利能力的特定准则分配薪酬，可直接付现金或股票期权（高管常以后者为主）。"},{"t":"员工持股计划（employee stock ownership plan, ESOP）：公司制定的员工福利措施，允许员工以低于市场的价格购买本公司股票。","c":[{"t":"效果与前提：能提高员工满意度和创新性，但仅在员工心理上产生主人翁感时才具有提高工作满意度的潜力；并不能降低缺勤率或带来更大动机；员工需定期了解公司经营状况并有机会施加积极影响。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">效果与前提</strong>：能提高员工满意度和创新性，但仅在员工心理上产生主人翁感时才具有提高工作满意度的潜力；并不能降低缺勤率或带来更大动机；员工需定期了解公司经营状况并有机会施加积极影响。"},{"t":"治理作用：对高管实施员工持股可减少不道德行为（CEO持股时更少操纵利润表）；也可作为建设社区财富的工具。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">治理作用</strong>：对高管实施员工持股可减少不道德行为（CEO持股时更少操纵利润表）；也可作为建设社区财富的工具。"}],"k":"b","i":2,"h":"<strong class=\"lead\">员工持股计划</strong>（employee stock ownership plan, ESOP）：公司制定的员工福利措施，允许员工以低于市场的价格购买本公司股票。"},{"t":"对浮动工资的总体评价：总体上能提高动机和生产率，但并非每个员工同等地受激励；管理者应根据单个或全要素综合的激励效果评估计划，并监控员工的「绩效—奖励期望」关系；浮动工资把部分固定劳动力成本转化为可变成本，经济萧条时可更快降低劳动力成本；效果随时间可能减弱（对CEO绩效薪酬的研究显示其与股东回报的关系缓慢减弱）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">对浮动工资的总体评价</strong>：总体上能提高动机和生产率，但并非每个员工同等地受激励；管理者应根据单个或全要素综合的激励效果评估计划，并监控员工的「绩效—奖励期望」关系；浮动工资把部分固定劳动力成本转化为可变成本，经济萧条时可更快降低劳动力成本；效果随时间可能减弱（对CEO绩效薪酬的研究显示其与股东回报的关系缓慢减弱）。"},{"t":"专栏「道德抉择：血汗工厂与工人安全」要点：西方公司把生产外包给低工资、缺乏监管的发展中国家供应商；孟加拉国接连发生塔兹林制衣厂火灾、拉纳大厦倒塌、东海毛衣公司火灾等重大事故；部分零售商签署具法律约束力的全球贸易劳工联盟提案（定期检查建筑与防火安全并公开结果），但许多公司未签署；提出的伦理问题是——在合法但不安全的条件下外包生产，企业应负何种责任。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专栏「道德抉择</strong>：血汗工厂与工人安全」要点：西方公司把生产外包给低工资、缺乏监管的发展中国家供应商；孟加拉国接连发生塔兹林制衣厂火灾、拉纳大厦倒塌、东海毛衣公司火灾等重大事故；部分零售商签署具法律约束力的全球贸易劳工联盟提案（定期检查建筑与防火安全并公开结果），但许多公司未签署；提出的伦理问题是——在合法但不安全的条件下外包生产，企业应负何种责任。"}],"k":"b","i":1,"h":"<strong class=\"lead\">如何支付</strong>：浮动工资方案（variable-pay program，也称绩效薪酬）：以员工个人绩效及组织绩效为基础确定部分薪酬；可以是全部或部分工资、按年或达成条件时支付、可选或必须接受；全球约84%的公司提供某种形式的浮动工资，70%的组织设置组织、部门、团队和个人级别的奖励组合。"}],"k":"sec","i":0,"h":"8.5 利用报酬激励员工"},{"t":"8.6 利用福利激励员工","c":[{"t":"问题起点：标准化福利方案难以同时满足需求不同的员工（托德需要医疗保险与人寿保险，艾利森更在意假期与长期储蓄方案），花旗集团等以灵活福利回应这种差异。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">问题起点</strong>：标准化福利方案难以同时满足需求不同的员工（托德需要医疗保险与人寿保险，艾利森更在意假期与长期储蓄方案），花旗集团等以灵活福利回应这种差异。"},{"t":"灵活福利（flexible benefit）：让员工自己选择报酬组合，以满足其当前需求或状况，从而提供个性化的报酬。","c":[{"t":"理论逻辑：与期望理论一致——组织的报酬要和每个员工的目标紧密联系起来。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">理论逻辑</strong>：与期望理论一致——组织的报酬要和每个员工的目标紧密联系起来。"},{"t":"定制维度：可反映员工在年龄、婚姻状况、配偶福利状况、孩子数量和年龄等方面的差异。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">定制维度</strong>：可反映员工在年龄、婚姻状况、配偶福利状况、孩子数量和年龄等方面的差异。"},{"t":"效果：一些组织报告员工留存率、工作满意度和生产效率提高；但中国的研究表明，在动机方面灵活福利可能不能取代高薪的作用；随着计划普及成为「标准配置」，其激发的个人动机可能降低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效果</strong>：一些组织报告员工留存率、工作满意度和生产效率提高；但中国的研究表明，在动机方面灵活福利可能不能取代高薪的作用；随着计划普及成为「标准配置」，其激发的个人动机可能降低。"},{"t":"弊端：管理成本可能更高；确定不同条款带来的激励影响更具挑战性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">弊端</strong>：管理成本可能更高；确定不同条款带来的激励影响更具挑战性。"},{"t":"全球采用情况：几乎所有美国大公司都提供；加拿大211个组织的调查中60%提供（2005年为41%）；英国几乎全覆盖（从补充医疗保险、假期交易到儿童保健抵用券）；中国与其他亚洲国家采用较少。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">全球采用情况</strong>：几乎所有美国大公司都提供；加拿大211个组织的调查中60%提供（2005年为41%）；英国几乎全覆盖（从补充医疗保险、假期交易到儿童保健抵用券）；中国与其他亚洲国家采用较少。"}],"k":"b","i":1,"h":"<strong class=\"lead\">灵活福利</strong>（flexible benefit）：让员工自己选择报酬组合，以满足其当前需求或状况，从而提供个性化的报酬。"}],"k":"sec","i":0,"h":"8.6 利用福利激励员工"},{"t":"8.7 利用内部奖励激励员工","c":[{"t":"员工认可方案（employee recognition program）：通过正式表彰员工贡献来鼓励特定行为的计划。","c":[{"t":"谱系：从自发的、私人的感谢，到被广泛宣传、明确规定了认可程序的正式方案。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">谱系</strong>：从自发的、私人的感谢，到被广泛宣传、明确规定了认可程序的正式方案。"},{"t":"优势：廉价——表扬是免费的，在预算收紧时更有吸引力；研究表明财务激励短期更具激励作用，但长期看非财务激励效果更好；与自尊、自我效能感和工作满意度相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">优势</strong>：廉价——表扬是免费的，在预算收紧时更有吸引力；研究表明财务激励短期更具激励作用，但长期看非财务激励效果更好；与自尊、自我效能感和工作满意度相关。"},{"t":"应用：埃弗雷特诊所向表现出色的员工发放奖励卡片、集卡换奖励；赛门铁克等跨国公司引入 Globoforce 支持的「掌声表彰计划」，参与度不到一年提升14%；在不同国家的分支机构中使用集中化的认可方案可确保全球员工都被认可。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">应用</strong>：埃弗雷特诊所向表现出色的员工发放奖励卡片、集卡换奖励；赛门铁克等跨国公司引入 Globoforce 支持的「掌声表彰计划」，参与度不到一年提升14%；在不同国家的分支机构中使用集中化的认可方案可确保全球员工都被认可。"},{"t":"批评与条件：可能被管理层以政治手腕操纵——绩效标准不明确的工作尤其如此，管理者可能认可自己偏爱的员工；方案被滥用会破坏其价值、造成士气低落；正式使用时必须确保公平，做不到就要通过不断认可员工的努力来激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">批评与条件</strong>：可能被管理层以政治手腕操纵——绩效标准不明确的工作尤其如此，管理者可能认可自己偏爱的员工；方案被滥用会破坏其价值、造成士气低落；正式使用时必须确保公平，做不到就要通过不断认可员工的努力来激励。"}],"k":"b","i":1,"h":"<strong class=\"lead\">员工认可方案</strong>（employee recognition program）：通过正式表彰员工贡献来鼓励特定行为的计划。"},{"t":"对管理者的启示（章末小结并入）：将绩效与奖励联系起来——奖励应视绩效而定，且员工必须理解二者间的关系；确保体制的公平性——员工应看到个人努力与成果能体现在薪酬和其他奖励上；总括本章：薪酬、福利和内部奖励都必须经过仔细而彻底的设计，才能增强员工对积极组织成果的动机。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（章末小结并入）：将绩效与奖励联系起来——奖励应视绩效而定，且员工必须理解二者间的关系；确保体制的公平性——员工应看到个人努力与成果能体现在薪酬和其他奖励上；总括本章：薪酬、福利和内部奖励都必须经过仔细而彻底的设计，才能增强员工对积极组织成果的动机。"}],"k":"sec","i":0,"h":"8.7 利用内部奖励激励员工"}],"k":"chap","h":"<strong class=\"lead\">第8章 动机</strong>：从概念到应用"}],"k":"part","h":"第Ⅱ篇 个体","col":"#0e9f8a","pc":"p2"},{"t":"第Ⅲ篇 群体","c":[{"t":"本书定位：《组织行为学》（Organizational Behavior，第18版），斯蒂芬•罗宾斯（Stephen P. Robbins）与蒂莫西•贾奇（Timothy A. Judge）著，孙健敏、朱曦济、李原译；被视为组织行为学教学用书的权威标准，自20世纪90年代引进我国以来深受管理学界与企业界好评。","c":[],"k":"sec","i":0,"h":"<strong class=\"lead\">本书定位</strong>：《组织行为学》（Organizational Behavior，第18版），斯蒂芬•罗宾斯（Stephen P. Robbins）与蒂莫西•贾奇（Timothy A. Judge）著，孙健敏、朱曦济、李原译；被视为组织行为学教学用书的权威标准，自20世纪90年代引进我国以来深受管理学界与企业界好评。"},{"t":"版本节奏：英文版两年一更新，中文版每四年更新一次（选偶数版），兼顾内容连贯性与读者经济负担。","c":[],"k":"sec","i":0,"h":"<strong class=\"lead\">版本节奏</strong>：英文版两年一更新，中文版每四年更新一次（选偶数版），兼顾内容连贯性与读者经济负担。"},{"t":"第18版主要变化（据前言与译者序）：","c":[{"t":"每章引入新的开篇案例，介绍当前商业趋势与前沿事件；章首与章末案例大部分更新，突出组织行为学与当前组织管理的关联。","c":[],"k":"b","i":1,"h":"每章引入新的开篇案例，介绍当前商业趋势与前沿事件；章首与章末案例大部分更新，突出组织行为学与当前组织管理的关联。"},{"t":"每章新增\"就业技能矩阵\"（Employ-ability Skills Matrix, ESM），为学生开发雇主看重的技能提供指南，帮助其从课程一开始就看到课程与职业目标的相关性。","c":[],"k":"b","i":1,"h":"每章新增&quot;就业技能矩阵&quot;（Employ-ability Skills Matrix, ESM），为学生开发雇主看重的技能提供指南，帮助其从课程一开始就看到课程与职业目标的相关性。"},{"t":"每章新增反映最新研究成果的内容，主题包括：外派人员调整、工作丰富化、越轨和反生产工作行为、不同的声音、虐待性监督、客户满意度、执行董事会组成、情绪劳动、氛围、正念、高绩效工作系统、失业/求职、人力资本资源、行为伦理、睡眠不足、义务论、恢复精力、第三方不公平模型、工作需求等。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">每章新增反映最新研究成果的内容，主题包括</strong>：外派人员调整、工作丰富化、越轨和反生产工作行为、不同的声音、虐待性监督、客户满意度、执行董事会组成、情绪劳动、氛围、正念、高绩效工作系统、失业/求职、人力资本资源、行为伦理、睡眠不足、义务论、恢复精力、第三方不公平模型、工作需求等。"},{"t":"具体章节的新增：第1章增加就业内容；第5章新增\"人格、求职和失业\"；第7章新增\"公正理论/组织公平\"与\"工作投入\"两节；第8章新增\"工作再设计\"与\"替代性工作安排方案\"两节；全书增加创建学习型组织、激发创新文化等内容。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">具体章节的新增</strong>：第1章增加就业内容；第5章新增&quot;人格、求职和失业&quot;；第7章新增&quot;公正理论/组织公平&quot;与&quot;工作投入&quot;两节；第8章新增&quot;工作再设计&quot;与&quot;替代性工作安排方案&quot;两节；全书增加创建学习型组织、激发创新文化等内容。"},{"t":"部分章节实质性修改或更新了章末材料；每章参考文献全部更新。","c":[],"k":"b","i":1,"h":"部分章节实质性修改或更新了章末材料；每章参考文献全部更新。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">第18版主要变化</strong>（据前言与译者序）："},{"t":"全书四篇十八章结构：","c":[{"t":"第I篇 简介（第1章）：什么是组织行为学——人际技能、管理与OB、系统研究、贡献学科、OB模型与就业技能。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第I篇 简介</strong>（第1章）：什么是组织行为学——人际技能、管理与OB、系统研究、贡献学科、OB模型与就业技能。"},{"t":"第II篇 个体（第2—8章）：组织中的多元化；态度与工作满意度；情绪与心境；人格与价值观；知觉与个体决策；动机概念；动机：从概念到应用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第II篇 个体</strong>（第2—8章）：组织中的多元化；态度与工作满意度；情绪与心境；人格与价值观；知觉与个体决策；动机概念；动机：从概念到应用。"},{"t":"第III篇 群体（第9—14章）：群体行为的基础；理解工作团队；沟通；领导；权力与政治；冲突与谈判。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第III篇 群体</strong>（第9—14章）：群体行为的基础；理解工作团队；沟通；领导；权力与政治；冲突与谈判。"},{"t":"第IV篇 组织系统（第15—18章）：组织结构的基础；组织文化；人力资源政策与实践；组织变革与压力管理。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">第IV篇 组织系统</strong>（第15—18章）：组织结构的基础；组织文化；人力资源政策与实践；组织变革与压力管理。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">全书四篇十八章结构</strong>："},{"t":"编写特色：","c":[{"t":"写作风格娓娓道来、深入浅出；引用最新发表的学术研究成果，兼顾可读性、趣味性与科学性、严谨性。","c":[],"k":"b","i":1,"h":"写作风格娓娓道来、深入浅出；引用最新发表的学术研究成果，兼顾可读性、趣味性与科学性、严谨性。"},{"t":"章内设有多种固定栏目（传言还是科学、职业目标、道德抉择、观点碰撞、体验练习、道德困境、案例分析等），与就业技能矩阵配合使用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">章内设有多种固定栏目</strong>（传言还是科学、职业目标、道德抉择、观点碰撞、体验练习、道德困境、案例分析等），与就业技能矩阵配合使用。"},{"t":"配套教学资源：教师手册、试题库、考试编制软件、PPT等（经Pearson官网获取）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">配套教学资源</strong>：教师手册、试题库、考试编制软件、PPT等（经Pearson官网获取）。"},{"t":"适用对象：高校本科生、研究生、MBA学员及相关专业学位人员，也可作为企业管理人员在职学习和培训用书。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">适用对象</strong>：高校本科生、研究生、MBA学员及相关专业学位人员，也可作为企业管理人员在职学习和培训用书。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">编写特色</strong>："},{"t":"第9章 群体行为的基础","c":[{"t":"学习目标","c":[{"t":"区分不同类型的群体。","c":[],"k":"b","i":1,"h":"区分不同类型的群体。"},{"t":"描述群体发展的间断-平衡模型。","c":[],"k":"b","i":1,"h":"描述群体发展的间断-平衡模型。"},{"t":"说明角色要求是如何随着不同情境而变化的。","c":[],"k":"b","i":1,"h":"说明角色要求是如何随着不同情境而变化的。"},{"t":"描述群体规范如何影响个体的行为。","c":[],"k":"b","i":1,"h":"描述群体规范如何影响个体的行为。"},{"t":"说明地位和规模差异如何影响群体绩效。","c":[],"k":"b","i":1,"h":"说明地位和规模差异如何影响群体绩效。"},{"t":"描述群体凝聚力和多样性对群体有效性的影响。","c":[],"k":"b","i":1,"h":"描述群体凝聚力和多样性对群体有效性的影响。"},{"t":"比较群体决策的优劣。","c":[],"k":"b","i":1,"h":"比较群体决策的优劣。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"9.1 群体的定义和分类","c":[{"t":"群体（group）：为实现特定目标而组合到一起并形成互动和相互依赖关系的两个或更多个体。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">群体</strong>（group）：为实现特定目标而组合到一起并形成互动和相互依赖关系的两个或更多个体。"},{"t":"正式群体（formal group）：由组织结构界定的、根据工作岗位来确定工作任务的群体；成员行为由组织目标规定，如航班乘务组。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">正式群体</strong>（formal group）：由组织结构界定的、根据工作岗位来确定工作任务的群体；成员行为由组织目标规定，如航班乘务组。"},{"t":"非正式群体（informal group）：既没有正式结构、也不是由组织指定的群体；满足员工的社交需求，如不同部门员工定期共进午餐；其互动虽非正式，却能显著影响成员行为和绩效。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">非正式群体</strong>（informal group）：既没有正式结构、也不是由组织指定的群体；满足员工的社交需求，如不同部门员工定期共进午餐；其互动虽非正式，却能显著影响成员行为和绩效。"},{"t":"社会认定理论（social identity theory）：认为人们对自己所属群体的成功或失败产生情绪，因为其自尊与群体表现紧密相连。","c":[{"t":"共享（尤其是痛苦）经历会增强我们与他人的联系和信任。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">共享</strong>（尤其是痛苦）经历会增强我们与他人的联系和信任。"},{"t":"群体成功带来自尊提升与荣耀，群体失败带来失望甚至否认归属；群体被贬低时，成员可能支持越轨行为以恢复群体地位；还可能出现「幸灾乐祸」（对手失利时感到快乐）。","c":[],"k":"b","i":2,"h":"群体成功带来自尊提升与荣耀，群体失败带来失望甚至否认归属；群体被贬低时，成员可能支持越轨行为以恢复群体地位；还可能出现「幸灾乐祸」（对手失利时感到快乐）。"},{"t":"人在一生中形成多种认定，不同情境下某种认定的重要性不同，认定之间也可能冲突（如商业领袖认定与父母认定）。","c":[],"k":"b","i":2,"h":"人在一生中形成多种认定，不同情境下某种认定的重要性不同，认定之间也可能冲突（如商业领袖认定与父母认定）。"},{"t":"组织内通过两种方式形成多重社会认定：关系认同（因角色与他人联系）与集体认同（与团队集合特征联系）；通常对工作团队的认同强于对组织的认同，但二者都对态度与行为有积极作用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">组织内通过两种方式形成多重社会认定</strong>：关系认同（因角色与他人联系）与集体认同（与团队集合特征联系）；通常对工作团队的认同强于对组织的认同，但二者都对态度与行为有积极作用。"},{"t":"对组织认同度低会降低满意度并减少组织公民行为。","c":[],"k":"b","i":2,"h":"对组织认同度低会降低满意度并减少组织公民行为。"}],"k":"b","i":1,"h":"<strong class=\"lead\">社会认定理论</strong>（social identity theory）：认为人们对自己所属群体的成功或失败产生情绪，因为其自尊与群体表现紧密相连。"},{"t":"内群体偏爱（ingroup favoritism）：认为群体内的人要优于群体外的人，而群体外的人都一样；低经验开放性和低随和性的人更容易受其影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">内群体偏爱</strong>（ingroup favoritism）：认为群体内的人要优于群体外的人，而群体外的人都一样；低经验开放性和低随和性的人更容易受其影响。"},{"t":"外群体（outgroup）：内群体以外的其他人，通常是内群体成员所知的一个确定群体；内外群体之间往往存在敌意，宗教是内外群体情感最有力的来源之一（外群体拥有更多资源时会引发更强的歧视与攻击性）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">外群体</strong>（outgroup）：内群体以外的其他人，通常是内群体成员所知的一个确定群体；内外群体之间往往存在敌意，宗教是内外群体情感最有力的来源之一（外群体拥有更多资源时会引发更强的歧视与攻击性）。"},{"t":"社会认定威胁（social identity threat）：类似刻板印象威胁——个人认为由于与被贬低的群体有关联而会受到负面评价，因此可能失去信心和绩效（如高压数学测试中低社会经济地位受试者只有被特意鼓励时才表现出与高地位者同样的自信）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">社会认定威胁</strong>（social identity threat）：类似刻板印象威胁——个人认为由于与被贬低的群体有关联而会受到负面评价，因此可能失去信心和绩效（如高压数学测试中低社会经济地位受试者只有被特意鼓励时才表现出与高地位者同样的自信）。"}],"k":"sec","i":0,"h":"9.1 群体的定义和分类"},{"t":"9.2 群体发展的阶段：间断-平衡模型","c":[{"t":"间断-平衡模型（punctuated-equilibrium model）：描述有明确截止日期的临时群体活动模式的模型——群体长期依惯性运行，穿插短暂的重大变革。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">间断-平衡模型</strong>（punctuated-equilibrium model）：描述有明确截止日期的临时群体活动模式的模型——群体长期依惯性运行，穿插短暂的重大变革。"},{"t":"六个阶段特征（逐条）","c":[{"t":"第一次会议决定群体的发展方向，形成指导完成任务的行为模式与假设框架（有时几秒内就确定）。","c":[],"k":"b","i":2,"h":"第一次会议决定群体的发展方向，形成指导完成任务的行为模式与假设框架（有时几秒内就确定）。"},{"t":"第一阶段群体活动依惯性进行，进展缓慢，即便出现挑战最初模式的新见解也不易改变。","c":[],"k":"b","i":2,"h":"第一阶段群体活动依惯性进行，进展缓慢，即便出现挑战最初模式的新见解也不易改变。"},{"t":"第一阶段结束时发生一次巨大转变，转变恰好出现在群体生命周期的中间点（无论任务历时1小时还是6个月）。","c":[],"k":"b","i":2,"h":"第一阶段结束时发生一次巨大转变，转变恰好出现在群体生命周期的中间点（无论任务历时1小时还是6个月）。"},{"t":"转变激起群体内的重大变革：抛弃旧有模式、采纳新的视角和观点，为第二阶段确定新方向。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">转变激起群体内的重大变革</strong>：抛弃旧有模式、采纳新的视角和观点，为第二阶段确定新方向。"},{"t":"第二阶段是新的平衡（惯性）阶段，群体开始实施转变期间形成的新计划。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">第二阶段是新的平衡</strong>（惯性）阶段，群体开始实施转变期间形成的新计划。"},{"t":"最后一次会议的特点是为完成任务而显著加快活动。","c":[],"k":"b","i":2,"h":"最后一次会议的特点是为完成任务而显著加快活动。"}],"k":"b","i":1,"h":"<strong class=\"lead\">六个阶段特征</strong>（逐条）"},{"t":"转变的动因：成员意识到完成任务的时间有限与最后期限带来的紧迫感，仿佛中间点敲响了「迅速行动」的警钟。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">转变的动因</strong>：成员意识到完成任务的时间有限与最后期限带来的紧迫感，仿佛中间点敲响了「迅速行动」的警钟。"},{"t":"适用边界：只适用于在有限时间内完成特定任务的临时群体，不适用于所有群体。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">适用边界</strong>：只适用于在有限时间内完成特定任务的临时群体，不适用于所有群体。"},{"t":"书中提及的另一类阶段模型：群体发展要经过形成阶段、解决冲突的震荡阶段、成员就角色达成一致并做出决定的「规范」阶段、成员开始协同工作的「执行」阶段；这些阶段可在间断-平衡模型的第一阶段内发生，第二次执行与对抗则可发生在第二阶段。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">书中提及的另一类阶段模型</strong>：群体发展要经过形成阶段、解决冲突的震荡阶段、成员就角色达成一致并做出决定的「规范」阶段、成员开始协同工作的「执行」阶段；这些阶段可在间断-平衡模型的第一阶段内发生，第二次执行与对抗则可发生在第二阶段。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">9.2 群体发展的阶段</strong>：间断-平衡模型"},{"t":"9.3 群体属性1：角色","c":[{"t":"角色（role）：人们对在某个社会单元中占据特定位置的个体所期望的一套行为模式；每个人都要扮演多种角色（如员工、管理者、丈夫、父亲），理解一个人行为的关键在于弄清他所扮演的角色。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">角色</strong>（role）：人们对在某个社会单元中占据特定位置的个体所期望的一套行为模式；每个人都要扮演多种角色（如员工、管理者、丈夫、父亲），理解一个人行为的关键在于弄清他所扮演的角色。"},{"t":"角色知觉（role perception）：个体对于自己在特定情境中应该如何表现的认识和了解；来自朋友、书籍、电影电视等刺激（如看《纸牌屋》形成对政治家的印象），学徒制的目的就是让初学者观察「专家」的行为。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">角色知觉</strong>（role perception）：个体对于自己在特定情境中应该如何表现的认识和了解；来自朋友、书籍、电影电视等刺激（如看《纸牌屋》形成对政治家的印象），学徒制的目的就是让初学者观察「专家」的行为。"},{"t":"角色期望（role expectation）：别人认为你在某个特定情境中应该如何行事（如联邦法官被视为地位尊贵、举止得体，橄榄球队教练被视为富有侵略性、灵活应变、善于激励）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">角色期望</strong>（role expectation）：别人认为你在某个特定情境中应该如何行事（如联邦法官被视为地位尊贵、举止得体，橄榄球队教练被视为富有侵略性、灵活应变、善于激励）。"},{"t":"心理契约（psychological contract）：存在于雇主和员工之间的不成文协议，确定双方的期望——员工期望被公平对待、获得可接受的工作条件、合理的工作量与绩效反馈；雇主期望员工态度良好、听从指挥、对组织忠诚。","c":[{"t":"违背后果：对员工绩效和满意度产生消极影响；与离职意愿强正相关，并与较低生产率、较高盗窃率及更严重的工作退缩行为相关。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">违背后果</strong>：对员工绩效和满意度产生消极影响；与离职意愿强正相关，并与较低生产率、较高盗窃率及更严重的工作退缩行为相关。"},{"t":"文化差异：法国（个人主义、权力不对称）视契约为偏袒权力方的自利产物；加拿大（个人主义、权力对称）关注平衡互惠；挪威（集体主义、权力对称）视契约为基于信任的社会关系。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化差异</strong>：法国（个人主义、权力不对称）视契约为偏袒权力方的自利产物；加拿大（个人主义、权力对称）关注平衡互惠；挪威（集体主义、权力对称）视契约为基于信任的社会关系。"}],"k":"b","i":1,"h":"<strong class=\"lead\">心理契约</strong>（psychological contract）：存在于雇主和员工之间的不成文协议，确定双方的期望——员工期望被公平对待、获得可接受的工作条件、合理的工作量与绩效反馈；雇主期望员工态度良好、听从指挥、对组织忠诚。"},{"t":"角色冲突（role conflict）：遵守某种角色要求会使另一种角色要求难以实现；极端情况下多种角色期望相互矛盾（如既是下属的评价者又是其辅导者）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">角色冲突</strong>（role conflict）：遵守某种角色要求会使另一种角色要求难以实现；极端情况下多种角色期望相互矛盾（如既是下属的评价者又是其辅导者）。"},{"t":"角色间冲突（interrole conflict）：身处不同群体的期望处于对立状态，典型如工作-家庭冲突（比尔被要求调往外地而家人希望他留在凤凰城）；研究表明工作-家庭冲突是大多数员工的主要压力来源之一；并购与跨国经营也会造成双重身份冲突。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">角色间冲突</strong>（interrole conflict）：身处不同群体的期望处于对立状态，典型如工作-家庭冲突（比尔被要求调往外地而家人希望他留在凤凰城）；研究表明工作-家庭冲突是大多数员工的主要压力来源之一；并购与跨国经营也会造成双重身份冲突。"},{"t":"角色扮演与同化：斯坦福监狱实验（津巴多）——情绪稳定的大学生随机分派为「看守」与「犯人」后迅速进入角色，看守实施虐待、犯人消极服从，因出现病态反应6天后终止实验；结论是人格正常、未经训练的人会表现出与其所扮角色一致的极端行为。BBC真人秀的复刻结果不同——看守行为谨慎、很少攻击，说明情境强度较低、人们意识到自己被观看时，角色滥用会受到限制。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">角色扮演与同化</strong>：斯坦福监狱实验（津巴多）——情绪稳定的大学生随机分派为「看守」与「犯人」后迅速进入角色，看守实施虐待、犯人消极服从，因出现病态反应6天后终止实验；结论是人格正常、未经训练的人会表现出与其所扮角色一致的极端行为。BBC真人秀的复刻结果不同——看守行为谨慎、很少攻击，说明情境强度较低、人们意识到自己被观看时，角色滥用会受到限制。"},{"t":"对管理者的启示（章末小结并入）：角色冲突与工作压力和工作不满意相关；努力确保员工准确地认识自己的工作角色，以提高满意度。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（章末小结并入）：角色冲突与工作压力和工作不满意相关；努力确保员工准确地认识自己的工作角色，以提高满意度。"},{"t":"专栏「道德困境：是否可以违反心理契约」要点：心理契约是非正式协议，违反似乎无成本，但一方未达另一方预期仍会产生负面后果（管理者不提供公平条件→员工推卸责任；员工不努力→管理者拒绝给予特权）；双方都可能认为自己没有违约而对方违约。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">专栏「道德困境</strong>：是否可以违反心理契约」要点：心理契约是非正式协议，违反似乎无成本，但一方未达另一方预期仍会产生负面后果（管理者不提供公平条件→员工推卸责任；员工不努力→管理者拒绝给予特权）；双方都可能认为自己没有违约而对方违约。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">9.3 群体属性1</strong>：角色"},{"t":"9.4 群体属性2：规范","c":[{"t":"规范（norm）：群体成员共同接受的行为标准，让成员知道在特定情境下应该做什么、不应该做什么；一旦被成员认可接受，就能在最低限度的外部控制下影响行为；领导者仅分享观点是不够的（即使被采纳，效果可能只持续3天）；所有群体都有自己的规范。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">规范</strong>（norm）：群体成员共同接受的行为标准，让成员知道在特定情境下应该做什么、不应该做什么；一旦被成员认可接受，就能在最低限度的外部控制下影响行为；领导者仅分享观点是不够的（即使被采纳，效果可能只持续3天）；所有群体都有自己的规范。"},{"t":"规范与情绪：在频繁沟通的任务组中，个体情绪与群体情绪相互影响，而规范决定了个人与群体的情绪体验——人们越来越倾向于以同样方式解释共同的情绪，进而影响群体态度和结果。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">规范与情绪</strong>：在频繁沟通的任务组中，个体情绪与群体情绪相互影响，而规范决定了个人与群体的情绪体验——人们越来越倾向于以同样方式解释共同的情绪，进而影响群体态度和结果。"},{"t":"规范与从众（conformity）：群体对其成员施加压力，使其改变态度和行为以符合群体标准。","c":[{"t":"阿希实验（所罗门·阿希的线段判断实验）：在明显正确的答案面前，75%的被试至少给出一个从众（明知错误但与他人一致）的答案，平均37%的判断从众；但从众的另一面是63%的独立回答，95%的被试至少给出一次正确回答——从众压力真实存在，却不是行为的完美预测指标，且人们并不喜欢这种压力（几乎无人认为从众比独立更可取）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">阿希实验</strong>（所罗门·阿希的线段判断实验）：在明显正确的答案面前，75%的被试至少给出一个从众（明知错误但与他人一致）的答案，平均37%的判断从众；但从众的另一面是63%的独立回答，95%的被试至少给出一次正确回答——从众压力真实存在，却不是行为的完美预测指标，且人们并不喜欢这种压力（几乎无人认为从众比独立更可取）。"},{"t":"参照群体（reference group）：个体了解其中的人、把自己视为（或渴望成为）该群体的一员、且觉得其他成员对自己具有重要意义；个体遵从的是参照群体，而非所有群体都施加同等从众压力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">参照群体</strong>（reference group）：个体了解其中的人、把自己视为（或渴望成为）该群体的一员、且觉得其他成员对自己具有重要意义；个体遵从的是参照群体，而非所有群体都施加同等从众压力。"}],"k":"b","i":1,"h":"<strong class=\"lead\">规范与从众</strong>（conformity）：群体对其成员施加压力，使其改变态度和行为以符合群体标准。"},{"t":"规范与行为：霍桑实验（1924–1932，西方电气公司霍桑工厂）","c":[{"t":"照明实验：无论增加还是降低照明度，实验组与控制组产出都提高，说明是群体动态而非物理环境影响行为。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">照明实验</strong>：无论增加还是降低照明度，实验组与控制组产出都提高，说明是群体动态而非物理环境影响行为。"},{"t":"装配观察室实验：被挑选的女工产出稳步提高、缺勤率仅为正常部门的约1/3，源于其「精英群体」的特殊地位与被关注的感受。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">装配观察室实验</strong>：被挑选的女工产出稳步提高、缺勤率仅为正常部门的约1/3，源于其「精英群体」的特殊地位与被关注的感受。"},{"t":"接线观察室实验：员工不会使个人产出最大化，产出受群体规范控制——群体形成了「公平产出水平」（既不太高也不太低），规范包括「不要争先进、不要磨洋工、不要告发同伴」，并通过骂人、嘲笑奚落、殴打等手段强化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">接线观察室实验</strong>：员工不会使个人产出最大化，产出受群体规范控制——群体形成了「公平产出水平」（既不太高也不太低），规范包括「不要争先进、不要磨洋工、不要告发同伴」，并通过骂人、嘲笑奚落、殴打等手段强化。"}],"k":"b","i":1,"h":"<strong class=\"lead\">规范与行为</strong>：霍桑实验（1924–1932，西方电气公司霍桑工厂）"},{"t":"正面规范与群体结果：强大的积极规范能产生积极结果，但需其他因素配合——例如性别多样化群体中强大的政治正确性规范可提高创造力（明确期望减少不确定性、摆脱刻板印象）；有积极合作规范时，群体外向性对助人行为的预测更强；个体特征与对群体的社会认定程度也影响规范的接受度（对群体越满意，越严格遵循规范）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">正面规范与群体结果</strong>：强大的积极规范能产生积极结果，但需其他因素配合——例如性别多样化群体中强大的政治正确性规范可提高创造力（明确期望减少不确定性、摆脱刻板印象）；有积极合作规范时，群体外向性对助人行为的预测更强；个体特征与对群体的社会认定程度也影响规范的接受度（对群体越满意，越严格遵循规范）。"},{"t":"负面规范与群体结果：工作场所偏差行为（deviant workplace behavior），也称反生产工作行为（counterproductive work behavior, CWB）——违反重要组织规则、威胁组织或其他成员利益的自发行为。","c":[{"t":"四类（图表9-3）：生产方面（提前离开、故意拖延工作时间、浪费资源）；财产方面（破坏公物、虚报工作时间、偷窃组织财物）；政治活动（偏袒自己人、散布谣言、指责同事）；个人攻击（性骚扰、骂人、偷窃同事物品）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">四类</strong>（图表9-3）：生产方面（提前离开、故意拖延工作时间、浪费资源）；财产方面（破坏公物、虚报工作时间、偷窃组织财物）；政治活动（偏袒自己人、散布谣言、指责同事）；个人攻击（性骚扰、骂人、偷窃同事物品）。"},{"t":"成因与后果：群体自身的负面属性（如精神病态与攻击性高）会助长偏差行为；职场不文明行为使近半数受害者想过换工作、12%因此辞职，并带来心理压力与身体疾病；睡眠缺乏会削弱情绪调节能力进而诱发偏差行为；当偏差行为受群体规范支持时更可能泛滥（与经常缺勤者交往密切者自身也更容易缺勤）；严重不当行为会在群体中引发连锁反应——消极行为→群体负面情绪→破坏团队协作→降低群体绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成因与后果</strong>：群体自身的负面属性（如精神病态与攻击性高）会助长偏差行为；职场不文明行为使近半数受害者想过换工作、12%因此辞职，并带来心理压力与身体疾病；睡眠缺乏会削弱情绪调节能力进而诱发偏差行为；当偏差行为受群体规范支持时更可能泛滥（与经常缺勤者交往密切者自身也更容易缺勤）；严重不当行为会在群体中引发连锁反应——消极行为→群体负面情绪→破坏团队协作→降低群体绩效。"}],"k":"b","i":1,"h":"<strong class=\"lead\">负面规范与群体结果</strong>：工作场所偏差行为（deviant workplace behavior），也称反生产工作行为（counterproductive work behavior, CWB）——违反重要组织规则、威胁组织或其他成员利益的自发行为。"},{"t":"规范与文化：集体主义与个人主义文化的规范不同；情境也能改变取向——在强调集体主义或个人主义规范的角色扮演练习之后，个体主义规范者在可自选任务时、集体主义规范者被「内群体」分配任务时都更有动力。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">规范与文化</strong>：集体主义与个人主义文化的规范不同；情境也能改变取向——在强调集体主义或个人主义规范的角色扮演练习之后，个体主义规范者在可自选任务时、集体主义规范者被「内群体」分配任务时都更有动力。"},{"t":"专栏「传言还是科学：八卦和排斥对群体有害」要点：不一定成立——亲社会的八卦可暴露剥削行为、促成积极变化；被排斥者为重返群体会表现更多合作；当八卦与排斥同时存在、八卦限于与工作有关的真实讨论、个体仍有机会重返群体且群体规范积极时，二者能共同促进合作。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">专栏「传言还是科学</strong>：八卦和排斥对群体有害」要点：不一定成立——亲社会的八卦可暴露剥削行为、促成积极变化；被排斥者为重返群体会表现更多合作；当八卦与排斥同时存在、八卦限于与工作有关的真实讨论、个体仍有机会重返群体且群体规范积极时，二者能共同促进合作。"},{"t":"专栏「道德抉择：同辈压力可以作为一种影响策略」要点：同辈压力可以是积极的（促使成员达标、倡导良好行为），也可能被滥用为迫使他人从事不良行为的手段；调查发现仅6%的领导者认为自己能成功影响员工；应通过接纳与奖励良好行为（而非抗拒与排斥）来使成员行为与团队利益一致。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">专栏「道德抉择</strong>：同辈压力可以作为一种影响策略」要点：同辈压力可以是积极的（促使成员达标、倡导良好行为），也可能被滥用为迫使他人从事不良行为的手段；调查发现仅6%的领导者认为自己能成功影响员工；应通过接纳与奖励良好行为（而非抗拒与排斥）来使成员行为与团队利益一致。"},{"t":"对管理者的启示（章末小结并入）：认识到群体对个人行为的巨大影响；为确保减少工作场所偏差行为，要确保群体规范不支持反社会行为。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（章末小结并入）：认识到群体对个人行为的巨大影响；为确保减少工作场所偏差行为，要确保群体规范不支持反社会行为。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">9.4 群体属性2</strong>：规范"},{"t":"9.5 群体属性3：地位；群体属性4：规模和动态","c":[{"t":"地位（status）：他人对群体或群体成员的位置或层级进行的一种社会界定；当个体感到自我看法与他人看法存在差异时，地位成为重要的激励因素并产生明显的行为后果。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">地位</strong>（status）：他人对群体或群体成员的位置或层级进行的一种社会界定；当个体感到自我看法与他人看法存在差异时，地位成为重要的激励因素并产生明显的行为后果。"},{"t":"地位特征理论（status characteristics theory）：地位有三个来源","c":[{"t":"驾驭他人的权力——能控制群体结果与资源的人地位更高。","c":[],"k":"b","i":2,"h":"驾驭他人的权力——能控制群体结果与资源的人地位更高。"},{"t":"对群体目标做出贡献的能力——对群体成功有重要贡献的人地位更高。","c":[],"k":"b","i":2,"h":"对群体目标做出贡献的能力——对群体成功有重要贡献的人地位更高。"},{"t":"个人特征——拥有群体所看重特征（相貌出众、聪明、有钱、个性友善等）的人地位更高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">个人特征——拥有群体所看重特征</strong>（相貌出众、聪明、有钱、个性友善等）的人地位更高。"}],"k":"b","i":1,"h":"<strong class=\"lead\">地位特征理论</strong>（status characteristics theory）：地位有三个来源"},{"t":"地位与规范：地位高且对群体认同（社会认定）低的成员更可能偏离规范；地位高者更能抵制从众压力（如医生拒绝接受级别较低的保险公司员工的行政决定）；把地位高的成员引入群体对绩效的提升作用有限，因为他们可能带来反生产的规范。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">地位与规范</strong>：地位高且对群体认同（社会认定）低的成员更可能偏离规范；地位高者更能抵制从众压力（如医生拒绝接受级别较低的保险公司员工的行政决定）；把地位高的成员引入群体对绩效的提升作用有限，因为他们可能带来反生产的规范。"},{"t":"地位与群体互动：追求地位者更果断（发言多、批评多、要求多、常打断别人）；地位低者参与讨论少，未充分利用有专业技术与见解的低地位成员会降低群体整体绩效；在中等地位个体中添加少量高地位个体有利，但高地位者过多会损害绩效；人们通常更愿意与和自己地位相当或更高的人交流，而不是与地位低者交流（章末小结并入）。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">地位与群体互动</strong>：追求地位者更果断（发言多、批评多、要求多、常打断别人）；地位低者参与讨论少，未充分利用有专业技术与见解的低地位成员会降低群体整体绩效；在中等地位个体中添加少量高地位个体有利，但高地位者过多会损害绩效；人们通常更愿意与和自己地位相当或更高的人交流，而不是与地位低者交流（章末小结并入）。"},{"t":"地位的不平等：成员认为地位层级不平等会引起群体内失衡并试图纠正；巨大的地位差异与较低的个人绩效、较差的健康状况以及低地位成员更强的离职意愿相关；不同群体有不同的地位标准（管理者看收入或公司发展速度、政府官员看预算规模、蓝领看资历），跨群体流动或跨文化团队中地位标准差异可能引发冲突。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">地位的不平等</strong>：成员认为地位层级不平等会引起群体内失衡并试图纠正；巨大的地位差异与较低的个人绩效、较差的健康状况以及低地位成员更强的离职意愿相关；不同群体有不同的地位标准（管理者看收入或公司发展速度、政府官员看预算规模、蓝领看资历），跨群体流动或跨文化团队中地位标准差异可能引发冲突。"},{"t":"地位和污名化：受到污名化的人会把污点「传染」给相关者（污名连带效应）——与被污名化者的关联即使短暂或纯属巧合，也会招致消极评价；低地位群体会利用内群体偏爱竞争更高地位，高地位群体感受到「歧视」后会增加对外群体的偏见，周而复始使群体更加两极分化。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">地位和污名化</strong>：受到污名化的人会把污点「传染」给相关者（污名连带效应）——与被污名化者的关联即使短暂或纯属巧合，也会招致消极评价；低地位群体会利用内群体偏爱竞争更高地位，高地位群体感受到「歧视」后会增加对外群体的偏见，周而复始使群体更加两极分化。"},{"t":"群体规模","c":[{"t":"12人或以上的大群体擅长获取多种多样的投入，若目标是寻求事实或获取想法，大群体更有效。","c":[],"k":"b","i":2,"h":"12人或以上的大群体擅长获取多种多样的投入，若目标是寻求事实或获取想法，大群体更有效。"},{"t":"约7人的小群体做某些事情（如执行任务）更有成效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">约7人的小群体做某些事情</strong>（如执行任务）更有成效。"},{"t":"规模对群体绩效的影响取决于任务类型；群体规模越大，成员满意度可能越低（章末小结并入）。","c":[],"k":"b","i":2,"h":"规模对群体绩效的影响取决于任务类型；群体规模越大，成员满意度可能越低（章末小结并入）。"}],"k":"b","i":1,"h":"群体规模"},{"t":"社会惰化（social loafing）：个体在群体中工作时不如单独工作时那么努力的倾向；它直接质疑了「群体整体生产率至少等于成员个体生产率之和」的假设。","c":[{"t":"原因一：成员认为其他人没有尽到应尽的职责——觉得别人懒惰或无能时，便降低自己的努力以求公平；真正的社会惰化者以一种剥削方式从团队获利。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原因一</strong>：成员认为其他人没有尽到应尽的职责——觉得别人懒惰或无能时，便降低自己的努力以求公平；真正的社会惰化者以一种剥削方式从团队获利。"},{"t":"原因二：责任分散——群体活动的结果无法归因到具体成员，个人投入与群体产出的关系模糊，个体便可能成为「搭便车者」。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原因二</strong>：责任分散——群体活动的结果无法归因到具体成员，个人投入与群体产出的关系模糊，个体便可能成为「搭便车者」。"},{"t":"文化与个体差异：社会惰化在西方国家（个人主义文化）更普遍，东方集体主义文化中明显较低；职业道德感越强越不容易惰化；群体责任心与随和性越高，越可能保持高水平绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化与个体差异</strong>：社会惰化在西方国家（个人主义文化）更普遍，东方集体主义文化中明显较低；职业道德感越强越不容易惰化；群体责任心与随和性越高，越可能保持高水平绩效。"},{"t":"防止方法：设立群体目标使群体共同努力；增加群体间竞争；开展同事评估；挑选愿意在群体中工作、积极性高的成员；群体奖励在一定程度上按每个成员的独特贡献制定；此外，公开发布群体成员的个人绩效评级也可抵消社会惰化。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">防止方法</strong>：设立群体目标使群体共同努力；增加群体间竞争；开展同事评估；挑选愿意在群体中工作、积极性高的成员；群体奖励在一定程度上按每个成员的独特贡献制定；此外，公开发布群体成员的个人绩效评级也可抵消社会惰化。"}],"k":"b","i":1,"h":"<strong class=\"lead\">社会惰化</strong>（social loafing）：个体在群体中工作时不如单独工作时那么努力的倾向；它直接质疑了「群体整体生产率至少等于成员个体生产率之和」的假设。"},{"t":"对管理者的启示（章末小结并入）：注意群体中的地位层级——地位低的人较少参与讨论，地位高的人可能压制他们；组建团队时为发现事实用较大规模团队、为执行任务用较小规模团队，并在大团队中设置衡量个人绩效的标准。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>（章末小结并入）：注意群体中的地位层级——地位低的人较少参与讨论，地位高的人可能压制他们；组建团队时为发现事实用较大规模团队、为执行任务用较小规模团队，并在大团队中设置衡量个人绩效的标准。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">9.5 群体属性3</strong>：地位；群体属性4：规模和动态"},{"t":"9.6 群体属性5：凝聚力；群体属性6：多样性","c":[{"t":"凝聚力（cohesiveness）：成员之间相互吸引以及愿意留在该群体中的程度；高凝聚力可能源于长期合作、小规模、促进互动的群体目标或外部威胁。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">凝聚力</strong>（cohesiveness）：成员之间相互吸引以及愿意留在该群体中的程度；高凝聚力可能源于长期合作、小规模、促进互动的群体目标或外部威胁。"},{"t":"凝聚力与生产率的关系取决于群体中与绩效有关的规范（图表9-4四象限）","c":[{"t":"高凝聚力＋高绩效规范 → 高生产率。","c":[],"k":"b","i":2,"h":"高凝聚力＋高绩效规范 → 高生产率。"},{"t":"高凝聚力＋低绩效规范 → 低生产率（生产率下降）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">高凝聚力＋低绩效规范 → 低生产率</strong>（生产率下降）。"},{"t":"低凝聚力＋高绩效规范 → 中等生产率（较高，但不如双高组合）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">低凝聚力＋高绩效规范 → 中等生产率</strong>（较高，但不如双高组合）。"},{"t":"低凝聚力＋低绩效规范 → 中低生产率。","c":[],"k":"b","i":2,"h":"低凝聚力＋低绩效规范 → 中低生产率。"}],"k":"b","i":1,"h":"凝聚力与生产率的关系取决于群体中与绩效有关的规范（图表9-4四象限）"},{"t":"增强凝聚力的七条建议：缩小群体规模；鼓励对群体目标的认同；增加群体成员在一起的时间；提高群体的地位，让人们觉得成为成员并不容易；鼓励与其他群体的竞争；奖励群体而不是成员个体；使群体拥有单独的物理空间。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">增强凝聚力的七条建议</strong>：缩小群体规模；鼓励对群体目标的认同；增加群体成员在一起的时间；提高群体的地位，让人们觉得成为成员并不容易；鼓励与其他群体的竞争；奖励群体而不是成员个体；使群体拥有单独的物理空间。"},{"t":"多样性（diversity）：群体成员在多大程度上相似或彼此不同；总体而言既会造成损失，也能带来好处。","c":[{"t":"损失：多样性会增加群体内冲突（尤其早期），降低士气、增加退出；野外生存训练中多元文化群体与同源文化群体表现相当，但满意度和凝聚力较低、冲突更多；资历差异大时群体绩效下降（若人力资源管理上做出团队导向的有效安排，资历多样性则与低绩效无关）；价值观或意见差异导致更多冲突，但领导把注意力集中到任务并鼓励团队学习可减少冲突、增加对团队问题的讨论；强调包容性可减少性别多样性带来的冲突与不满。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">损失</strong>：多样性会增加群体内冲突（尤其早期），降低士气、增加退出；野外生存训练中多元文化群体与同源文化群体表现相当，但满意度和凝聚力较低、冲突更多；资历差异大时群体绩效下降（若人力资源管理上做出团队导向的有效安排，资历多样性则与低绩效无关）；价值观或意见差异导致更多冲突，但领导把注意力集中到任务并鼓励团队学习可减少冲突、增加对团队问题的讨论；强调包容性可减少性别多样性带来的冲突与不满。"},{"t":"好处：多样性显著的陪审团慎重考虑时间更长、分享信息更多、事实错误更少；经受住差异考验的群体随时间推移更开放、更有创造力、表现更好；性别多样性可以改善中国工作组的团队绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">好处</strong>：多样性显著的陪审团慎重考虑时间更长、分享信息更多、事实错误更少；经受住差异考验的群体随时间推移更开放、更有创造力、表现更好；性别多样性可以改善中国工作组的团队绩效。"},{"t":"表层多样性（surface-level diversity）：直接观察到的特点（国籍、种族、性别等）——会向团队暗示内部意见可能不一致，促使成员下意识地更开放。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">表层多样性</strong>（surface-level diversity）：直接观察到的特点（国籍、种族、性别等）——会向团队暗示内部意见可能不一致，促使成员下意识地更开放。"},{"t":"深层多样性（deep-level diversity）：态度、价值观和观点的多样性——影响了解较少；韩国的研究显示把权力需求高低不同的人放在一起可减少非生产性竞争，成就需求相似的人一起工作则可能提高任务绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">深层多样性</strong>（deep-level diversity）：态度、价值观和观点的多样性——影响了解较少；韩国的研究显示把权力需求高低不同的人放在一起可减少非生产性竞争，成就需求相似的人一起工作则可能提高任务绩效。"},{"t":"断裂带（faultline）：群体由于可见差异（性别、种族、年龄、工作经验、受教育程度）而分裂成两个或更多小团体——如三男三女团队中，三男同属营销背景、三女同属金融背景就易按性别与职能分裂，背景互相交错的团队则不易出现。","c":[{"t":"负面影响：小团体相互竞争浪费本应完成核心任务的时间，损害团队绩效；学习速度慢、决策更具风险、创造力更低、感受到的冲突更严重、小团体间缺乏信任；小团体内部满意度高但团队整体满意度低。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">负面影响</strong>：小团体相互竞争浪费本应完成核心任务的时间，损害团队绩效；学习速度慢、决策更具风险、创造力更低、感受到的冲突更严重、小团体间缺乏信任；小团体内部满意度高但团队整体满意度低。"},{"t":"可能的积极面：在强调结果的组织文化中，基于技能、知识、专业的断裂带可以是有益的；若团队成员角色交叉且有共同目标，基于性别和专业的断裂带问题会被抵消；沿任务相关特征形成的断裂带可能通过促进分工提高绩效。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">可能的积极面</strong>：在强调结果的组织文化中，基于技能、知识、专业的断裂带可以是有益的；若团队成员角色交叉且有共同目标，基于性别和专业的断裂带问题会被抵消；沿任务相关特征形成的断裂带可能通过促进分工提高绩效。"}],"k":"b","i":2,"h":"<strong class=\"lead\">断裂带</strong>（faultline）：群体由于可见差异（性别、种族、年龄、工作经验、受教育程度）而分裂成两个或更多小团体——如三男三女团队中，三男同属营销背景、三女同属金融背景就易按性别与职能分裂，背景互相交错的团队则不易出现。"},{"t":"总体结论：多样性是一把双刃剑——短期内融入多样化群体困难，但运用得当可成为提高组织绩效的战略；不应忽视有害的同质化影响。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">总体结论</strong>：多样性是一把双刃剑——短期内融入多样化群体困难，但运用得当可成为提高组织绩效的战略；不应忽视有害的同质化影响。"},{"t":"专栏「观点碰撞：多样化的工作团队更聪明、更创新」要点：正方引证董事会存在女性带来更高净收入增长与股本回报率、多样化陪审团决定更准确、性别多样的团队更多创新产品；反方指出多样性与士气幸福感降低、决策放缓、冲突增加相关，成员价值观差异明显时优势可能丧失。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专栏「观点碰撞</strong>：多样化的工作团队更聪明、更创新」要点：正方引证董事会存在女性带来更高净收入增长与股本回报率、多样化陪审团决定更准确、性别多样的团队更多创新产品；反方指出多样性与士气幸福感降低、决策放缓、冲突增加相关，成员价值观差异明显时优势可能丧失。"},{"t":"专栏「职业目标：我可以伪造数据而不承担责任吗」要点：财务主管迫于群体压力忽略负面信息，作为领导角色者很可能要为后果承担个人责任；建议不要挑战整个群体，而是与个别成员单独会面建立信任、改变群体氛围，再呼吁群体增强道德意识。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">专栏「职业目标</strong>：我可以伪造数据而不承担责任吗」要点：财务主管迫于群体压力忽略负面信息，作为领导角色者很可能要为后果承担个人责任；建议不要挑战整个群体，而是与个别成员单独会面建立信任、改变群体氛围，再呼吁群体增强道德意识。"}],"k":"b","i":1,"h":"<strong class=\"lead\">多样性</strong>（diversity）：群体成员在多大程度上相似或彼此不同；总体而言既会造成损失，也能带来好处。"}],"k":"sec","i":0,"h":"<strong class=\"lead\">9.6 群体属性5</strong>：凝聚力；群体属性6：多样性"},{"t":"9.7 群体决策","c":[{"t":"群体决策的优点：提供更全面、更完整的信息和知识（综合多个个体的资源）；提高观点的多样性，为考虑多种方法和方案提供机会；提高决策的被接受程度——参与决策的成员更可能热情支持并鼓励他人接受。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">群体决策的优点</strong>：提供更全面、更完整的信息和知识（综合多个个体的资源）；提高观点的多样性，为考虑多种方法和方案提供机会；提高决策的被接受程度——参与决策的成员更可能热情支持并鼓励他人接受。"},{"t":"群体决策的缺点：耗费时间（获得解决方案需要更多时间）；存在从众压力，不同意见可能受到明显压制；讨论可能被一个人或少数几个人控制，若其能力中等或偏下会削弱群体总体绩效；责任不明确（分散），效果可能因此打折扣。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">群体决策的缺点</strong>：耗费时间（获得解决方案需要更多时间）；存在从众压力，不同意见可能受到明显压制；讨论可能被一个人或少数几个人控制，若其能力中等或偏下会削弱群体总体绩效；责任不明确（分散），效果可能因此打折扣。"},{"t":"效果与效率的权衡","c":[{"t":"准确性：群体中判断最准确的成员的决策通常比群体决策更准，而群体决策通常比群体中普通成员的决策更准。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">准确性</strong>：群体中判断最准确的成员的决策通常比群体决策更准，而群体决策通常比群体中普通成员的决策更准。"},{"t":"速度：个体决策更胜一筹。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">速度</strong>：个体决策更胜一筹。"},{"t":"创造力：群体决策往往比个体决策更有效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">创造力</strong>：群体决策往往比个体决策更有效。"},{"t":"接受度：以「解决方案的可接受程度」为标准时，群体决策是首选。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">接受度</strong>：以「解决方案的可接受程度」为标准时，群体决策是首选。"},{"t":"效率：个体决策几乎总是胜过群体决策（例外：决策需要了解多方面信息时，单个决策者要花大量时间查阅与咨询）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效率</strong>：个体决策几乎总是胜过群体决策（例外：决策需要了解多方面信息时，单个决策者要花大量时间查阅与咨询）。"},{"t":"冲突类型：有关任务的群体冲突可能提高群体绩效，关系冲突则可能降低群体绩效（韩国研究）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">冲突类型</strong>：有关任务的群体冲突可能提高群体绩效，关系冲突则可能降低群体绩效（韩国研究）。"}],"k":"b","i":1,"h":"效果与效率的权衡"},{"t":"群体思维（groupthink）：与群体规范有关的从众压力使群体难以批判性地评估那些不同寻常的、由少数人提出的或不受欢迎的观点，会严重影响群体绩效；注重绩效甚于学习的群体更容易成为受害者。","c":[{"t":"最容易出现的三个条件：明确的群体认同感；成员愿意维护群体的正面形象；成员觉得群体的正面形象受到严重威胁；此外，对自身行动方针过度自信的群体更会压制异议、鼓励从众。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">最容易出现的三个条件</strong>：明确的群体认同感；成员愿意维护群体的正面形象；成员觉得群体的正面形象受到严重威胁；此外，对自身行动方针过度自信的群体更会压制异议、鼓励从众。"},{"t":"弱化群体思维的措施：监控群体规模（超过10人时个体可能感到更少的个人责任）；鼓励领导者扮演公正无私的角色，积极听取所有成员意见、避免在讨论初期只表达自己；任命一名「吹毛求疵者」，对大部分成员的立场公开质疑；利用练习刺激讨论——如推迟谈论决策的效果、要求成员首先关注备选方案隐含的危险或负面影响，以减少对不同观点的抑制。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">弱化群体思维的措施</strong>：监控群体规模（超过10人时个体可能感到更少的个人责任）；鼓励领导者扮演公正无私的角色，积极听取所有成员意见、避免在讨论初期只表达自己；任命一名「吹毛求疵者」，对大部分成员的立场公开质疑；利用练习刺激讨论——如推迟谈论决策的效果、要求成员首先关注备选方案隐含的危险或负面影响，以减少对不同观点的抑制。"}],"k":"b","i":1,"h":"<strong class=\"lead\">群体思维</strong>（groupthink）：与群体规范有关的从众压力使群体难以批判性地评估那些不同寻常的、由少数人提出的或不受欢迎的观点，会严重影响群体绩效；注重绩效甚于学习的群体更容易成为受害者。"},{"t":"群体偏移或群体极化（groupshift）：群体成员在讨论备选方案和制定决策时，往往放大自己最初的立场——保守的更保守，激进（冒险）的更冒险，更多时候出现冒险偏移；可看作群体思维的一种特殊形式，决策反映讨论中形成的主要决策规范。","c":[{"t":"原因解释：成员越来越熟悉、相处融洽后更愿以极端方式表达最初立场；群体决策分散了责任，任何人都不必独自承担后果；有些人采取极端立场是为了展示自己与外群体不同、证明自己真正投入。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">原因解释</strong>：成员越来越熟悉、相处融洽后更愿以极端方式表达最初立场；群体决策分散了责任，任何人都不必独自承担后果；有些人采取极端立场是为了展示自己与外群体不同、证明自己真正投入。"},{"t":"结论：群体决策容易放大成员最初立场、更倾向于冒险；偏移方向（更保守或更冒险）取决于成员讨论前的倾向性。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：群体决策容易放大成员最初立场、更倾向于冒险；偏移方向（更保守或更冒险）取决于成员讨论前的倾向性。"}],"k":"b","i":1,"h":"<strong class=\"lead\">群体偏移或群体极化</strong>（groupshift）：群体成员在讨论备选方案和制定决策时，往往放大自己最初的立场——保守的更保守，激进（冒险）的更冒险，更多时候出现冒险偏移；可看作群体思维的一种特殊形式，决策反映讨论中形成的主要决策规范。"},{"t":"群体决策技术","c":[{"t":"互动群体（interacting group）：成员面对面交流、依赖言语和非言语沟通，是最常见的群体决策形式；有利于实现成员对决策方案的认同，但为达成一致会对成员施加从众压力。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">互动群体</strong>（interacting group）：成员面对面交流、依赖言语和非言语沟通，是最常见的群体决策形式；有利于实现成员对决策方案的认同，但为达成一致会对成员施加从众压力。"},{"t":"头脑风暴（brainstorming）：旨在克服互动群体中抑制创造力的从众压力——6～12人围坐，领导讲明问题后限时自由发言，任何人都不得对方案提出批评，所有想法都被记录以便随后讨论分析。","c":[{"t":"局限：头脑风暴产生许多创意但效率不高——研究一致表明单独思考的个体比头脑风暴群体产生更多创意，原因之一是生产阻滞（production blocking）：成员思考时他人说话会阻碍思考、妨碍创意分享。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">局限</strong>：头脑风暴产生许多创意但效率不高——研究一致表明单独思考的个体比头脑风暴群体产生更多创意，原因之一是生产阻滞（production blocking）：成员思考时他人说话会阻碍思考、妨碍创意分享。"}],"k":"b","i":2,"h":"<strong class=\"lead\">头脑风暴</strong>（brainstorming）：旨在克服互动群体中抑制创造力的从众压力——6～12人围坐，领导讲明问题后限时自由发言，任何人都不得对方案提出批评，所有想法都被记录以便随后讨论分析。"},{"t":"名义小组技术（nominal group technique）：在决策过程中限定群体成员的讨论或人际沟通，成员先单独决策；步骤为：（1）讨论前每个成员单独写下自己对解决问题的想法；（2）沉默阶段后每个成员依次向群体提交一个想法，在所有想法被提交和记录之前不允许讨论；（3）群体讨论每种想法、进行阐述和评估；（4）每个成员不出声地独自对所有想法排序，总体排名最高的想法成为最终决定。","c":[{"t":"优点：让成员正式参加会议，又不像互动群体那样限制个人的独立思维；研究总体表明名义小组群体优于头脑风暴群体。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">优点</strong>：让成员正式参加会议，又不像互动群体那样限制个人的独立思维；研究总体表明名义小组群体优于头脑风暴群体。"}],"k":"b","i":2,"h":"<strong class=\"lead\">名义小组技术</strong>（nominal group technique）：在决策过程中限定群体成员的讨论或人际沟通，成员先单独决策；步骤为：（1）讨论前每个成员单独写下自己对解决问题的想法；（2）沉默阶段后每个成员依次向群体提交一个想法，在所有想法被提交和记录之前不允许讨论；（3）群体讨论每种想法、进行阐述和评估；（4）每个成员不出声地独自对所有想法排序，总体排名最高的想法成为最终决定。"},{"t":"图表9-5（群体效果评估，可辨部分）：观点数量——互动群体低、头脑风暴中、名义小组高；社会压力——互动群体高、头脑风暴低、名义小组中；资金成本——三者均低。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">图表9-5</strong>（群体效果评估，可辨部分）：观点数量——互动群体低、头脑风暴中、名义小组高；社会压力——互动群体高、头脑风暴低、名义小组中；资金成本——三者均低。"},{"t":"结论：三种技术各有利弊，选择取决于强调的标准与成本效益权衡——互动群体有利于决策认同，头脑风暴可以激发群体凝聚力，名义小组技术是获取大量想法的有效手段。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">结论</strong>：三种技术各有利弊，选择取决于强调的标准与成本效益权衡——互动群体有利于决策认同，头脑风暴可以激发群体凝聚力，名义小组技术是获取大量想法的有效手段。"},{"t":"承上启下（章末小结并入）：角色冲突与压力和不满意相关、规范控制行为、地位不平等带来挫败感、规模与满意度、凝聚力与多样性的影响均好坏取决于条件——理解这六种属性是下一章理解团队与创建有效工作团队的基础。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">承上启下</strong>（章末小结并入）：角色冲突与压力和不满意相关、规范控制行为、地位不平等带来挫败感、规模与满意度、凝聚力与多样性的影响均好坏取决于条件——理解这六种属性是下一章理解团队与创建有效工作团队的基础。"}],"k":"b","i":1,"h":"群体决策技术"}],"k":"sec","i":0,"h":"9.7 群体决策"}],"k":"chap","h":"第9章 群体行为的基础"},{"t":"第10章 理解工作团队","c":[{"t":"学习目标","c":[{"t":"分析工作团队在组织中受到持续欢迎的原因。","c":[],"k":"b","i":1,"h":"分析工作团队在组织中受到持续欢迎的原因。"},{"t":"比较群体与团队。","c":[],"k":"b","i":1,"h":"比较群体与团队。"},{"t":"比较五种类型的团队。","c":[],"k":"b","i":1,"h":"比较五种类型的团队。"},{"t":"阐释有效团队的特点。","c":[],"k":"b","i":1,"h":"阐释有效团队的特点。"},{"t":"说明组织如何培养具有团队精神的员工。","c":[],"k":"b","i":1,"h":"说明组织如何培养具有团队精神的员工。"},{"t":"判断何时应该使用个体而不是团队。","c":[],"k":"b","i":1,"h":"判断何时应该使用个体而不是团队。"}],"k":"sec","i":0,"h":"学习目标"},{"t":"10.1 为什么团队如此普及","c":[{"t":"团队受欢迎的根本原因是人们相信它们有效：《福布斯》出版商卡尔加德认为，由乐于奉献并相互支持的成员组成的团队，绩效往往胜过杰出的个人。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">团队受欢迎的根本原因是人们相信它们有效</strong>：《福布斯》出版商卡尔加德认为，由乐于奉献并相互支持的成员组成的团队，绩效往往胜过杰出的个人。"},{"t":"团队的优势：有时能实现个人永远无法完成的壮举；比传统部门结构更灵活、更能对变化做出反应；能够快速地组合、配置、重新聚焦和解散；是管理层增强民主气氛、提高员工参与度的有效手段。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">团队的优势</strong>：有时能实现个人永远无法完成的壮举；比传统部门结构更灵活、更能对变化做出反应；能够快速地组合、配置、重新聚焦和解散；是管理层增强民主气氛、提高员工参与度的有效手段。"},{"t":"研究表明，对团队的参与塑造了我们作为个体的思维方式，甚至为个人决策引入了合作思维。","c":[],"k":"b","i":1,"h":"研究表明，对团队的参与塑造了我们作为个体的思维方式，甚至为个人决策引入了合作思维。"},{"t":"对比与结论：采用团队模式并不意味着团队总是有效——决策者也会受潮流和从众心理影响；菲尼克斯大学的组织行为民意调查显示，95%的受访者认为团队起到重要作用，但只有25%喜欢团队合作，且近七成员工曾是功能失调团队的一员，说明人们也许并不真的喜欢团队。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对比与结论</strong>：采用团队模式并不意味着团队总是有效——决策者也会受潮流和从众心理影响；菲尼克斯大学的组织行为民意调查显示，95%的受访者认为团队起到重要作用，但只有25%喜欢团队合作，且近七成员工曾是功能失调团队的一员，说明人们也许并不真的喜欢团队。"}],"k":"sec","i":0,"h":"10.1 为什么团队如此普及"},{"t":"10.2 群体与团队的差异","c":[{"t":"工作群体（work group）：成员互动主要是为共享信息和制定决策，以帮助每个成员更好地完成自己的职责；绩效主要是成员个人贡献之和，不存在积极的协同作用。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">工作群体</strong>（work group）：成员互动主要是为共享信息和制定决策，以帮助每个成员更好地完成自己的职责；绩效主要是成员个人贡献之和，不存在积极的协同作用。"},{"t":"工作团队（work team）：通过成员的共同努力产生积极的协同作用，团队绩效远远大于个体绩效之和。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">工作团队</strong>（work team）：通过成员的共同努力产生积极的协同作用，团队绩效远远大于个体绩效之和。"},{"t":"两者的共同点：都对成员行为有期待和要求、在集体标准化方面做出努力、奉行积极的组织动力学、有一定的决策权，都需要提出想法、整合资源、协调后勤。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">两者的共同点</strong>：都对成员行为有期待和要求、在集体标准化方面做出努力、奉行积极的组织动力学、有一定的决策权，都需要提出想法、整合资源、协调后勤。"},{"t":"图表10-1比较（四个维度）：","c":[{"t":"目标：工作群体是共享信息；工作团队是集体绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">目标</strong>：工作群体是共享信息；工作团队是集体绩效。"},{"t":"协同效应：工作群体是中性的（有时是消极的）；工作团队是积极的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">协同效应</strong>：工作群体是中性的（有时是消极的）；工作团队是积极的。"},{"t":"责任：工作群体是个体责任；工作团队是个体责任与共同责任。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">责任</strong>：工作群体是个体责任；工作团队是个体责任与共同责任。"},{"t":"技能：工作群体是随机的和不同的；工作团队是相互补充的。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">技能</strong>：工作群体是随机的和不同的；工作团队是相互补充的。"}],"k":"b","i":1,"h":"<strong class=\"lead\">图表10-1比较</strong>（四个维度）："},{"t":"两者关系：可以把工作团队想象成工作群体的一个子集，成员间的互动（共生）赋予团队存在的意义。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">两者关系</strong>：可以把工作团队想象成工作群体的一个子集，成员间的互动（共生）赋予团队存在的意义。"},{"t":"对管理者的启示：围绕团队组织工作是希望通过积极协同作用提高组织绩效，使组织在不增加员工人数的前提下提高产出；但组建团队不是变戏法，仅仅把群体改叫团队并不能自动提高绩效，必须使团队具备有效团队的特征。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">对管理者的启示</strong>：围绕团队组织工作是希望通过积极协同作用提高组织绩效，使组织在不增加员工人数的前提下提高产出；但组建团队不是变戏法，仅仅把群体改叫团队并不能自动提高绩效，必须使团队具备有效团队的特征。"}],"k":"sec","i":0,"h":"10.2 群体与团队的差异"},{"t":"10.3 团队的类型","c":[{"t":"问题解决团队（problem-solving team）：成员定期开会（一般每周或每天一次）讨论质量标准和产品问题，最初常见于制造工厂的质量控制小组，现已扩展到医疗等领域；只提供改进建议，很少有权力单方面实施，建议与实施过程结合时才能实现重大改进。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">问题解决团队</strong>（problem-solving team）：成员定期开会（一般每周或每天一次）讨论质量标准和产品问题，最初常见于制造工厂的质量控制小组，现已扩展到医疗等领域；只提供改进建议，很少有权力单方面实施，建议与实施过程结合时才能实现重大改进。"},{"t":"自我管理型团队（self-managed work team）：通常由10～15人组成，从事息息相关或相辅相成的工作，承担许多以前由主管承担的职责——计划和安排工作日程、分配任务、制定一线决策、处理问题、与供应商和顾客打交道；完全的自我管理型团队甚至可自主挑选队员并相互进行绩效评估；团队建立后主管职位的重要性下降甚至被取消。","c":[{"t":"效果研究结论不一：有效性部分取决于对团队促进行为的奖励程度（报酬取决于共同努力时，个人与团队绩效都会提高）；存在冲突时团队无效，但当成员心理上感到安全时，冲突反而有益；成员满意度较高，但缺勤率和离职率有时更高；大型研究发现没有证据表明自我管理型团队一定优于决策权较少的传统团队。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">效果研究结论不一</strong>：有效性部分取决于对团队促进行为的奖励程度（报酬取决于共同努力时，个人与团队绩效都会提高）；存在冲突时团队无效，但当成员心理上感到安全时，冲突反而有益；成员满意度较高，但缺勤率和离职率有时更高；大型研究发现没有证据表明自我管理型团队一定优于决策权较少的传统团队。"}],"k":"b","i":1,"h":"<strong class=\"lead\">自我管理型团队</strong>（self-managed work team）：通常由10～15人组成，从事息息相关或相辅相成的工作，承担许多以前由主管承担的职责——计划和安排工作日程、分配任务、制定一线决策、处理问题、与供应商和顾客打交道；完全的自我管理型团队甚至可自主挑选队员并相互进行绩效评估；团队建立后主管职位的重要性下降甚至被取消。"},{"t":"跨职能团队（cross-functional team）：由组织层级相近但来自不同工作领域的员工组成，为完成某项任务而一起工作（如星巴克为速溶咖啡品牌Via组建的专门团队、各大汽车制造商协调复杂项目、思科自下而上发现新业务机会）；能交流信息、激发新办法、完成复杂项目。","c":[{"t":"三个管理难题：成员级别相近造成权力转移与领导模糊性，转移权力前需建立信任氛围；发展初期因要应对复杂性和多样性而耗费大量时间；背景、经历和观点不同的成员需要时间才能建立信任、真正合作。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">三个管理难题</strong>：成员级别相近造成权力转移与领导模糊性，转移权力前需建立信任氛围；发展初期因要应对复杂性和多样性而耗费大量时间；背景、经历和观点不同的成员需要时间才能建立信任、真正合作。"}],"k":"b","i":1,"h":"<strong class=\"lead\">跨职能团队</strong>（cross-functional team）：由组织层级相近但来自不同工作领域的员工组成，为完成某项任务而一起工作（如星巴克为速溶咖啡品牌Via组建的专门团队、各大汽车制造商协调复杂项目、思科自下而上发现新业务机会）；能交流信息、激发新办法、完成复杂项目。"},{"t":"虚拟团队（virtual team）：利用电脑技术（宽带网、公司社交媒体、可视电话会议、电子邮件等）把分散在不同地方的成员联系起来以实现共同目标；现在几乎所有团队都会进行一些远程工作；研究表明共享领导可显著提高虚拟团队绩效。","c":[{"t":"管理者需确保三点：成员之间建立信任；密切监控团队的工作进展；在整个组织内宣传该团队的努力和成果。还应仔细挑选成员（虚拟工作需要不同能力）。结论：虚拟团队不能轻松替代面对面团队，必须确认它是实现所需结果的最佳选择，并在协作过程中发挥监督作用。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">管理者需确保三点</strong>：成员之间建立信任；密切监控团队的工作进展；在整个组织内宣传该团队的努力和成果。还应仔细挑选成员（虚拟工作需要不同能力）。结论：虚拟团队不能轻松替代面对面团队，必须确认它是实现所需结果的最佳选择，并在协作过程中发挥监督作用。"}],"k":"b","i":1,"h":"<strong class=\"lead\">虚拟团队</strong>（virtual team）：利用电脑技术（宽带网、公司社交媒体、可视电话会议、电子邮件等）把分散在不同地方的成员联系起来以实现共同目标；现在几乎所有团队都会进行一些远程工作；研究表明共享领导可显著提高虚拟团队绩效。"},{"t":"多团队系统（multiteam system）：集合两个或以上独立团队共同完成更高级别目标的\"团队组成的团队\"，在任务复杂、团队规模超过协调临界点时出现（如重大车祸中紧急医疗服务团队、急诊室团队、康复团队相互依存、共同拯救生命）。","c":[{"t":"与独立团队的差异：存在\"跨边界者\"协调子团队成员时绩效更好（限制沟通可减少协调要求）；领导者必须促进团队间协调并领导每个团队；分散计划可能带来更高绩效，也可能带来更多协调问题。适用情形：团队规模大到无法发挥作用，或需要高度协调具有不同职能的团队。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">与独立团队的差异</strong>：存在&quot;跨边界者&quot;协调子团队成员时绩效更好（限制沟通可减少协调要求）；领导者必须促进团队间协调并领导每个团队；分散计划可能带来更高绩效，也可能带来更多协调问题。适用情形：团队规模大到无法发挥作用，或需要高度协调具有不同职能的团队。"}],"k":"b","i":1,"h":"<strong class=\"lead\">多团队系统</strong>（multiteam system）：集合两个或以上独立团队共同完成更高级别目标的&quot;团队组成的团队&quot;，在任务复杂、团队规模超过协调临界点时出现（如重大车祸中紧急医疗服务团队、急诊室团队、康复团队相互依存、共同拯救生命）。"}],"k":"sec","i":0,"h":"10.3 团队的类型"},{"t":"10.4 打造有效的团队（团队有效性模型）","c":[{"t":"模型来源：团队有时自然形成（如自由职业者组成的\"蜂巢\"团队——不同互补专业者向客户展示凝聚力强的工作单元）；研究者把影响团队有效性的特征清单简化为图表10-3的模型，以第9章的群体概念为基础。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">模型来源</strong>：团队有时自然形成（如自由职业者组成的&quot;蜂巢&quot;团队——不同互补专业者向客户展示凝聚力强的工作单元）；研究者把影响团队有效性的特征清单简化为图表10-3的模型，以第9章的群体概念为基础。"},{"t":"运用模型前的三个要点：不同团队在形式和结构上存在差异，模型只能作为指南、不能僵化地预测所有团队；模型的前提是团队工作比个体工作更可取；团队有效性通常包括客观测量的团队生产率、管理者评估的团队绩效、团队成员的总体满意度三个方面。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">运用模型前的三个要点</strong>：不同团队在形式和结构上存在差异，模型只能作为指南、不能僵化地预测所有团队；模型的前提是团队工作比个体工作更可取；团队有效性通常包括客观测量的团队生产率、管理者评估的团队绩效、团队成员的总体满意度三个方面。"},{"t":"模型三大成分：外界条件、团队构成、团队过程。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">模型三大成分</strong>：外界条件、团队构成、团队过程。"},{"t":"10.4.1 外界条件","c":[{"t":"充足的资源：团队依靠本团队之外的资源维持，资源缺乏直接削弱实现目标的能力；组织支持包括及时的信息、合适的设备、足够的人员、必要的鼓励以及行政协助。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">充足的资源</strong>：团队依靠本团队之外的资源维持，资源缺乏直接削弱实现目标的能力；组织支持包括及时的信息、合适的设备、足够的人员、必要的鼓励以及行政协助。"},{"t":"领导和结构：团队须就谁做什么达成一致并确保成员分担工作，使任务与个体技能匹配；可由管理层做，也可由成员自己做；自我管理型团队中管理者的工作变成在团队之外进行管理；领导者的人格、敬业度和领导风格都影响团队有效性；多团队系统中领导者要授权并扮演\"协调人\"角色。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">领导和结构</strong>：团队须就谁做什么达成一致并确保成员分担工作，使任务与个体技能匹配；可由管理层做，也可由成员自己做；自我管理型团队中管理者的工作变成在团队之外进行管理；领导者的人格、敬业度和领导风格都影响团队有效性；多团队系统中领导者要授权并扮演&quot;协调人&quot;角色。"},{"t":"信任的氛围：信任是领导的基础，使团队接受并致力于实现领导者的目标和决定；成员相互信任促进合作、减少监督，使成员敢于承担风险和坦白弱点；不仅总体信任水平重要，成员之间的信任分布也重要——不对称、不平衡的信任会大打折扣，并常形成破坏团队的联盟；信任是易受环境影响的知觉且并非绝对可取（高信任团队中主张想法个人所有权的成员会被评为贡献较小者）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">信任的氛围</strong>：信任是领导的基础，使团队接受并致力于实现领导者的目标和决定；成员相互信任促进合作、减少监督，使成员敢于承担风险和坦白弱点；不仅总体信任水平重要，成员之间的信任分布也重要——不对称、不平衡的信任会大打折扣，并常形成破坏团队的联盟；信任是易受环境影响的知觉且并非绝对可取（高信任团队中主张想法个人所有权的成员会被评为贡献较小者）。"},{"t":"绩效评估与奖励体系：基于个体的评估和激励可能与高绩效团队冲突；应修正传统的个人导向体系以反映团队绩效，采用混合型体系——既认可个别成员的突出贡献，也奖励整个群体的积极成果，如基于群体的绩效评估、利润分享、收益分享、小组激励。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">绩效评估与奖励体系</strong>：基于个体的评估和激励可能与高绩效团队冲突；应修正传统的个人导向体系以反映团队绩效，采用混合型体系——既认可个别成员的突出贡献，也奖励整个群体的积极成果，如基于群体的绩效评估、利润分享、收益分享、小组激励。"}],"k":"b","i":1,"h":"10.4.1 外界条件"},{"t":"10.4.2 团队构成","c":[{"t":"成员的能力：团队绩效在一定程度上取决于成员的知识、技能和能力；任务需要大量思考时高能力团队表现更好（尤其当工作量被平均分配时，绩效不取决于最薄弱环节），更能适应变化情境并运用现有知识解决新问题；团队领导者的能力也重要——聪明的领导者能帮助挣扎的成员，不太聪明的领导者会削弱高能力团队的效果。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成员的能力</strong>：团队绩效在一定程度上取决于成员的知识、技能和能力；任务需要大量思考时高能力团队表现更好（尤其当工作量被平均分配时，绩效不取决于最薄弱环节），更能适应变化情境并运用现有知识解决新问题；团队领导者的能力也重要——聪明的领导者能帮助挣扎的成员，不太聪明的领导者会削弱高能力团队的效果。"},{"t":"成员的人格：大五人格中责任心对团队尤其重要——责任心强的成员善于支持他人、善于察觉何时需要支持，组织、成就导向和耐力等行为倾向与团队绩效相关；意外发现：把责任心强的人组成团队、责任心不强的人组成团队（各10个团队），整个组织绩效高于强弱混合的团队，因为水平不一致时责任心强者难以发挥最佳绩效；经验开放性平均分更高的团队表现更好（建设性任务冲突强化该作用），情绪稳定性高的团队也能利用任务冲突提高绩效；随和性看最低水平——个别成员随和性很差或得分分散都会拉低绩效；外倾性的影响尚不清楚（平均分更高的团队助人行为更多，在合作氛围好的团队中更明显）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成员的人格</strong>：大五人格中责任心对团队尤其重要——责任心强的成员善于支持他人、善于察觉何时需要支持，组织、成就导向和耐力等行为倾向与团队绩效相关；意外发现：把责任心强的人组成团队、责任心不强的人组成团队（各10个团队），整个组织绩效高于强弱混合的团队，因为水平不一致时责任心强者难以发挥最佳绩效；经验开放性平均分更高的团队表现更好（建设性任务冲突强化该作用），情绪稳定性高的团队也能利用任务冲突提高绩效；随和性看最低水平——个别成员随和性很差或得分分散都会拉低绩效；外倾性的影响尚不清楚（平均分更高的团队助人行为更多，在合作氛围好的团队中更明显）。"},{"t":"角色的分配：对778支职业棒球队21年的研究证实正确分配角色的重要性——核心角色（投手和捕手）处理更多团队工作流程，经验和能力尤其重要；结论是让最有能力、最有经验且最有责任心的员工扮演最核心的角色。成功团队按成员技能和特长安排九种关键角色（图表10-4，一人可兼多角）：","c":[{"t":"建议者（adviser）：鼓励寻找更多的信息，深入分析决策方案。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">建议者</strong>（adviser）：鼓励寻找更多的信息，深入分析决策方案。"},{"t":"联络者（linker）：协调并整合各成员的工作。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">联络者</strong>（linker）：协调并整合各成员的工作。"},{"t":"创造者（creator）：发起创意的想法。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">创造者</strong>（creator）：发起创意的想法。"},{"t":"推动者（promoter）：在创意产生后拥护和支持。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">推动者</strong>（promoter）：在创意产生后拥护和支持。"},{"t":"评估者（assessor）：对各种方案进行见解深刻的剖析。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">评估者</strong>（assessor）：对各种方案进行见解深刻的剖析。"},{"t":"组织者（organizer）：提供结构。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">组织者</strong>（organizer）：提供结构。"},{"t":"生产者（producer）：坚持按期限完成任务。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">生产者</strong>（producer）：坚持按期限完成任务。"},{"t":"控制者（controller）：考察细节并实施规则。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">控制者</strong>（controller）：考察细节并实施规则。"},{"t":"维护者（maintainer）：在外部战场上作战，拥护和维护团队。","c":[],"k":"b","i":3,"h":"<strong class=\"lead\">维护者</strong>（maintainer）：在外部战场上作战，拥护和维护团队。"}],"k":"b","i":2,"h":"<strong class=\"lead\">角色的分配</strong>：对778支职业棒球队21年的研究证实正确分配角色的重要性——核心角色（投手和捕手）处理更多团队工作流程，经验和能力尤其重要；结论是让最有能力、最有经验且最有责任心的员工扮演最核心的角色。成功团队按成员技能和特长安排九种关键角色（图表10-4，一人可兼多角）："},{"t":"成员多样性：年龄、性别、种族、受教育水平、组织工龄等人口统计学特征构成组织人口统计学（organizational demography）的研究主题；一种逻辑认为经历不同的人离职率更高（沟通更难、冲突更多）；元分析表明人口统计学多样性与团队绩效总体没有实质性关系，有元分析显示种族和性别多样性有负面影响；在白人或男性主导的职业中负面影响更大，在人口特征均衡的职业中不是问题；职能、受教育水平和专业知识的多样性与绩效正相关但影响小、取决于情境；信任度低时多样性也可能产生负面影响；恰当的领导方式能提高多元化团队绩效（如对中国68个团队的研究：变革型且鼓舞人心的领导下，多样性团队更有创造力）。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成员多样性</strong>：年龄、性别、种族、受教育水平、组织工龄等人口统计学特征构成组织人口统计学（organizational demography）的研究主题；一种逻辑认为经历不同的人离职率更高（沟通更难、冲突更多）；元分析表明人口统计学多样性与团队绩效总体没有实质性关系，有元分析显示种族和性别多样性有负面影响；在白人或男性主导的职业中负面影响更大，在人口特征均衡的职业中不是问题；职能、受教育水平和专业知识的多样性与绩效正相关但影响小、取决于情境；信任度低时多样性也可能产生负面影响；恰当的领导方式能提高多元化团队绩效（如对中国68个团队的研究：变革型且鼓舞人心的领导下，多样性团队更有创造力）。"},{"t":"文化差异：文化多样性会干扰团队过程，至少短期内如此；文化地位差异也影响绩效（文化地位高的成员更多的团队中每个成员的绩效都能提高）；一般而言，需要收集各种观点完成任务时文化多样性是资产，但文化根本不同的团队在学习合作、解决问题时面临更多困难——好消息是困难会随时间消散。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">文化差异</strong>：文化多样性会干扰团队过程，至少短期内如此；文化地位差异也影响绩效（文化地位高的成员更多的团队中每个成员的绩效都能提高）；一般而言，需要收集各种观点完成任务时文化多样性是资产，但文化根本不同的团队在学习合作、解决问题时面临更多困难——好消息是困难会随时间消散。"},{"t":"团队规模：提高群体有效性的关键在于维持较小规模；最有效的团队拥有5～9个成员；贝佐斯的\"两个比萨饼\"规则（超过两个比萨饼就太大了）；心理学家米勒声称\"神奇的数字是7，加上或减去2\"；团队扩大时人与人潜在联系成倍增长、沟通复杂化；人数过多时凝聚力和相互信任下降、社会惰化增加、交流时间减少、协调困难；应使用能完成任务的最少人数，人数过多的单元应拆分成几个小团队。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">团队规模</strong>：提高群体有效性的关键在于维持较小规模；最有效的团队拥有5～9个成员；贝佐斯的&quot;两个比萨饼&quot;规则（超过两个比萨饼就太大了）；心理学家米勒声称&quot;神奇的数字是7，加上或减去2&quot;；团队扩大时人与人潜在联系成倍增长、沟通复杂化；人数过多时凝聚力和相互信任下降、社会惰化增加、交流时间减少、协调困难；应使用能完成任务的最少人数，人数过多的单元应拆分成几个小团队。"},{"t":"成员的偏好：并非每个员工都是团队选手；更喜欢独自工作的员工若被要求加入团队，会直接威胁团队士气和成员满意度；选人时除能力、人格和技能外还应考虑个人偏好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">成员的偏好</strong>：并非每个员工都是团队选手；更喜欢独自工作的员工若被要求加入团队，会直接威胁团队士气和成员满意度；选人时除能力、人格和技能外还应考虑个人偏好。"}],"k":"b","i":1,"h":"10.4.2 团队构成"},{"t":"10.4.3 团队过程","c":[{"t":"为什么过程重要：团队的输出应该大于输入的总和；图表10-5群体过程的效果：潜在的群体效果－过程损失＋过程收获＝实际的群体效果；对规模较大、成员依存度高的团队，过程变量尤为重要。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">为什么过程重要</strong>：团队的输出应该大于输入的总和；图表10-5群体过程的效果：潜在的群体效果－过程损失＋过程收获＝实际的群体效果；对规模较大、成员依存度高的团队，过程变量尤为重要。"},{"t":"共同的计划和目标：有效团队先分析使命、设置目标、制定战略；成功团队花大量时间讨论、塑造和完善在团队层面和个体层面都得到认可的目标，共同目标像GPS一样指引方向；还应明确目标是学习和掌握任务还是执行任务；有效团队还表现出反身性（reflexivity）——必要时反思和调整计划，这对过去绩效不佳的团队尤为重要。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">共同的计划和目标</strong>：有效团队先分析使命、设置目标、制定战略；成功团队花大量时间讨论、塑造和完善在团队层面和个体层面都得到认可的目标，共同目标像GPS一样指引方向；还应明确目标是学习和掌握任务还是执行任务；有效团队还表现出反身性（reflexivity）——必要时反思和调整计划，这对过去绩效不佳的团队尤为重要。"},{"t":"具体目标：把共同目标分解成具体的、可测量的、切实可行的绩效目标；具体目标促进明确的沟通、帮助团队保持专注；目标还应具挑战性——困难但可实现且给出特定指标的目标会提高相应绩效。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">具体目标</strong>：把共同目标分解成具体的、可测量的、切实可行的绩效目标；具体目标促进明确的沟通、帮助团队保持专注；目标还应具挑战性——困难但可实现且给出特定指标的目标会提高相应绩效。"},{"t":"团队效能（team efficacy）：团队相信自己能够成功的特征；过去成功会强化信念并激励成员更努力；管理层提高团队效能的两个方案：帮助团队取得较小的成功以树立信心（小赢策略）、通过培训提高成员的技术技能和人际技能。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">团队效能</strong>（team efficacy）：团队相信自己能够成功的特征；过去成功会强化信念并激励成员更努力；管理层提高团队效能的两个方案：帮助团队取得较小的成功以树立信心（小赢策略）、通过培训提高成员的技术技能和人际技能。"},{"t":"团队认同（team identity）：与群体建立情感联系的人更愿意投资于群体关系；通过认识个人的特定技能和能力并营造尊重和包容的氛围，可建立正向的团队认同；只有团队认同而无组织认同的人可能固守自己的团队、不愿与其他团队合作；虚拟团队的团队认同可能较低，导致努力程度较低，应特别注意建设。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">团队认同</strong>（team identity）：与群体建立情感联系的人更愿意投资于群体关系；通过认识个人的特定技能和能力并营造尊重和包容的氛围，可建立正向的团队认同；只有团队认同而无组织认同的人可能固守自己的团队、不愿与其他团队合作；虚拟团队的团队认同可能较低，导致努力程度较低，应特别注意建设。"},{"t":"团队凝聚力（team cohesion）：成员在情感上彼此依恋并因依恋而更贴近团队；是团队绩效的强有力预测指标；消极关系是凝聚力降低的驱动因素，可通过高水平的相互依赖和高质量的人际互动来减弱；拥有女性领导者、共享领导以及领导者公平时的团队凝聚力更高。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">团队凝聚力</strong>（team cohesion）：成员在情感上彼此依恋并因依恋而更贴近团队；是团队绩效的强有力预测指标；消极关系是凝聚力降低的驱动因素，可通过高水平的相互依赖和高质量的人际互动来减弱；拥有女性领导者、共享领导以及领导者公平时的团队凝聚力更高。"},{"t":"心智模型（mental model）：成员对团队内部环境的关键因素持有同样的心理描述（目标和使命关乎做什么，心智模型关乎怎么做）；心智模型错误（巨大压力下尤其容易发生）会严重影响绩效；元分析显示心智模型相同的团队互动更频繁、更有动力、客观绩效更高；行动团队（从事高强度、相互依存且不可预测任务的专家团队）通过\"发声\"维护共享心智模型——如麻醉团队先以语音监控彼此表现并跟进协助指导，再\"与房间对话\"后进行团队对话，关键是沟通的顺序。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">心智模型</strong>（mental model）：成员对团队内部环境的关键因素持有同样的心理描述（目标和使命关乎做什么，心智模型关乎怎么做）；心智模型错误（巨大压力下尤其容易发生）会严重影响绩效；元分析显示心智模型相同的团队互动更频繁、更有动力、客观绩效更高；行动团队（从事高强度、相互依存且不可预测任务的专家团队）通过&quot;发声&quot;维护共享心智模型——如麻醉团队先以语音监控彼此表现并跟进协助指导，再&quot;与房间对话&quot;后进行团队对话，关键是沟通的顺序。"},{"t":"冲突水平：关系冲突（因人际关系失调、关系紧张或敌视而产生的冲突）几乎总是功能失调和破坏性的；任务冲突（对任务内容的意见不一致）能激发讨论、促进批判性评估，对从事非常规活动的团队可带来更佳决策；当成员经验开放性高且情绪稳定时任务冲突有益；任务冲突水平适度（不高不低）时最利于团队创造力；有效团队通过直截了当地讨论具体问题解决冲突，无效团队则使冲突侧重人格和表述方式。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">冲突水平</strong>：关系冲突（因人际关系失调、关系紧张或敌视而产生的冲突）几乎总是功能失调和破坏性的；任务冲突（对任务内容的意见不一致）能激发讨论、促进批判性评估，对从事非常规活动的团队可带来更佳决策；当成员经验开放性高且情绪稳定时任务冲突有益；任务冲突水平适度（不高不低）时最利于团队创造力；有效团队通过直截了当地讨论具体问题解决冲突，无效团队则使冲突侧重人格和表述方式。"},{"t":"社会惰化（social loafing）：无法准确衡量每个成员的具体贡献时，个体会搭群体努力的便车；有效团队让成员在团队和个体两个层面对目的、目标和行动方式承担责任，从而削弱社会惰化倾向；有效团队中成员很清楚哪些是个人责任、哪些是共同责任。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">社会惰化</strong>（social loafing）：无法准确衡量每个成员的具体贡献时，个体会搭群体努力的便车；有效团队让成员在团队和个体两个层面对目的、目标和行动方式承担责任，从而削弱社会惰化倾向；有效团队中成员很清楚哪些是个人责任、哪些是共同责任。"}],"k":"b","i":1,"h":"10.4.3 团队过程"}],"k":"sec","i":0,"h":"<strong class=\"lead\">10.4 打造有效的团队</strong>（团队有效性模型）"},{"t":"10.5 使个体转变成团队选手","c":[{"t":"问题背景：许多人并非生来就是团队选手，许多组织一向重视培养个人成就感；团队与集体主义国家匹配得更好，个人主义国家的组织需要专门方案。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">问题背景</strong>：许多人并非生来就是团队选手，许多组织一向重视培养个人成就感；团队与集体主义国家匹配得更好，个人主义国家的组织需要专门方案。"},{"t":"甄选：雇用团队型选手——除技术技能外，确保候选人具备扮演团队角色的人际技能；抑制\"只招最优秀人才\"的冲动，因为顶尖人才未必是团队选手（如NBA球员安东尼投篮次数多而挤占队友机会的例子）；喜欢解决难题的人更适合在多样化团队中工作。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">甄选</strong>：雇用团队型选手——除技术技能外，确保候选人具备扮演团队角色的人际技能；抑制&quot;只招最优秀人才&quot;的冲动，因为顶尖人才未必是团队选手（如NBA球员安东尼投篮次数多而挤占队友机会的例子）；喜欢解决难题的人更适合在多样化团队中工作。"},{"t":"培训：通过练习让员工体验团队工作的满意感，提高解决问题、沟通、谈判、处理冲突和指导他人等技能；如欧莱雅通过团队建设让销售团队从\"各自为战的纸上团队\"变成有真正群体动力的团队；对112个医疗团队培训项目的研究证明良好的团队培训对绩效有积极的有形影响。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">培训</strong>：通过练习让员工体验团队工作的满意感，提高解决问题、沟通、谈判、处理冲突和指导他人等技能；如欧莱雅通过团队建设让销售团队从&quot;各自为战的纸上团队&quot;变成有真正群体动力的团队；对112个医疗团队培训项目的研究证明良好的团队培训对绩效有积极的有形影响。"},{"t":"奖励：奖励机制应鼓励合作而非增加竞争，如贺曼贺卡在个人奖励基础上增加基于团队目标的年度奖金、全食超市把个人绩效奖励体系转变为团队绩效奖励体系；晋升、加薪和认可应给予善于合作的个体（培训新人、分享信息、帮助解决冲突、学习新技能）；并非忽视个人贡献，而是综合个人贡献与对团队的无私贡献；还要重视内在奖励——同事般的友爱、自我发展与帮助伙伴成长的机会。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">奖励</strong>：奖励机制应鼓励合作而非增加竞争，如贺曼贺卡在个人奖励基础上增加基于团队目标的年度奖金、全食超市把个人绩效奖励体系转变为团队绩效奖励体系；晋升、加薪和认可应给予善于合作的个体（培训新人、分享信息、帮助解决冲突、学习新技能）；并非忽视个人贡献，而是综合个人贡献与对团队的无私贡献；还要重视内在奖励——同事般的友爱、自我发展与帮助伙伴成长的机会。"}],"k":"sec","i":0,"h":"10.5 使个体转变成团队选手"},{"t":"10.6 警惕：团队并非总是问题的答案","c":[{"t":"成本考量：团队工作比个体独自工作需要更多时间和资源——更多沟通需求、更多冲突管理、更多会议；采用团队带来的效益必须超过成本，但情况并不总是这样。","c":[],"k":"b","i":1,"h":"<strong class=\"lead\">成本考量</strong>：团队工作比个体独自工作需要更多时间和资源——更多沟通需求、更多冲突管理、更多会议；采用团队带来的效益必须超过成本，但情况并不总是这样。"},{"t":"三种测试（判断是否以团队方式工作）：","c":[{"t":"测试一：由多名员工从事该任务效果是否更好？指标是任务的复杂性和对不同观点的需求；简单任务不需要多元化输入，留给个体更好。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">测试一</strong>：由多名员工从事该任务效果是否更好？指标是任务的复杂性和对不同观点的需求；简单任务不需要多元化输入，留给个体更好。"},{"t":"测试二：该任务能否创造超越个体目标简单加总的共同目标或一套目标？如汽车经销商服务部门由客服人员、机械师、零部件专家和销售代表组成的团队可更好地承担集体职责。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">测试二</strong>：该任务能否创造超越个体目标简单加总的共同目标或一套目标？如汽车经销商服务部门由客服人员、机械师、零部件专家和销售代表组成的团队可更好地承担集体职责。"},{"t":"测试三：群体成员是否相互依赖？若整体成功取决于每个成员的成功、每个成员的成功又取决于其他成员的成功，则必须采用团队方式；足球队是真正的团队，而游泳队（接力赛除外）只是个体绩效简单加总的群体。","c":[],"k":"b","i":2,"h":"<strong class=\"lead\">测试三</strong>：群体成员是否相互依赖？若整体成功取决于每个成员的成功、每个成员的成功又取决于其他成员的成功，则必须采用团队方式；足球队是真正的团队，而游泳队（接力赛除外）只是个体绩效简单加总的群体。"}],"k":"b","i":1,"h":"<strong class=\"lead\">三种测试</strong>（判断是否以团队方式工作）："},{"t":"对管理者的启示（并入本章小结）：引入团队要求员工善于合作、共享信息、坦然面对差异并把个人利益升华为团队利益；了解问题解决团队、自我管理型团队、跨职能团队、虚拟团队和多团队系统的区别，有
